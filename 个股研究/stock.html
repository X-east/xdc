<!DOCTYPE html>
<html class="mp-app" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个股研究</title>
<link rel="stylesheet" href="rt/style.css">
<style>
/* 个股页专用样式。凡是「地图页也有」的排版（.dhead/.kv/.chart/.grp-t/.mini/底图容器…）
   一律走上面那份 rt/style.css —— 与地图页共用同一份，本文件只写页面级这几条：
   把地图页的整屏外壳复位成可滚动文档流（地图页是 html,body overflow:hidden + body 做 flex 列）；
   顶部「公司研究 / 本公司<资产>」切换条（两块互斥显示，同一个文件里分屏，不是两个页面）；
   「本公司<资产>」块：国内/全球切换 + 只含本公司的小图 + 简介块清单 + 独立成屏的资产档案。
      <资产> 随图层取词：硬资产层是「矿区」、电力层是「电站」，由模板变量 %(unit)s 代入。 */
html,body{height:auto;overflow:auto}
body{display:block;padding:0 0 56px}
.mp-wrap{max-width:1180px;margin:0 auto;padding:14px 14px 0}
.mp-head{border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.mp-indesc{color:var(--tx3);font-size:12px;line-height:1.8;margin:0 2px 12px}
/* 切换条吸顶：公司研究那一块很长，滚到中段也能一键换块。
   margin 负值 + 同值 padding 让底色铺满整行（.mp-wrap 有 14px 内边距，不这样会露出两侧缝）。
   ⚠ top 必须是 `--mp-nav-h` 而不是 0：全站页面条 261116 起改成 fixed 常驻顶端
   （z-index:55），吸顶在 0 的话这一条会被条整个盖住 —— 只在滚动后才看得出来，
   静态截图里完全正常。 */
.mp-tabs{position:sticky;top:var(--mp-nav-h,0);z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  margin:0 -14px 10px;padding:8px 14px;background:var(--bg)}
.mp-tabs .mtab{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
  border-radius:10px;padding:7px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
.mp-tabs .mtab:hover{border-color:var(--accent)}
.mp-tabs .mtab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* 跨页找公司：候选从 rt/data/comp_index.json 现取，不另存一份名单 */
.mp-find{position:relative;flex:1 1 180px;max-width:250px;margin-left:auto}
.mp-find input{width:100%%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);
  border-radius:9px;padding:7px 10px;font:inherit;font-size:12.5px;min-height:34px;outline:none}
.mp-find input:focus{border-color:var(--accent)}
.mp-find input::placeholder{color:var(--tx3)}
.mp-find-l{position:absolute;top:calc(100%% + 4px);right:0;width:250px;max-height:300px;overflow-y:auto;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;z-index:20}
.mp-find-l[hidden]{display:none}
.mp-find-l a{display:block;padding:8px 11px;color:var(--tx2);text-decoration:none;font-size:12.5px;
  border-bottom:1px solid var(--line)}
.mp-find-l a:last-child{border-bottom:0}
.mp-find-l a:hover,.mp-find-l a.on{background:var(--surfI);color:var(--accent)}
.mp-find-l .empty{padding:10px 11px;color:var(--tx3);font-size:12px}
@media(max-width:600px){.mp-find{flex:1 1 100%%;max-width:none;margin-left:0}}
.mp-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.mp-card-t{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:15px;font-weight:600;margin-bottom:10px}
.mp-card-t .mp-sub{font-size:11.5px;font-weight:400;color:var(--tx3)}
.mp-cta{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;min-height:34px;
  background:var(--accent);color:var(--on-accent);border-radius:9px;padding:7px 14px;
  font-size:12.5px;font-weight:600;text-decoration:none}
.mp-cta:hover{filter:brightness(1.08)}
.mp-seg{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.mp-seg .aseg{background:var(--bg0);border:1px solid var(--line);color:var(--tx2);border-radius:8px;
  padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;min-height:32px}
.mp-seg .aseg.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mp-seg .aseg b{font-variant-numeric:tabular-nums}
.mp-seg .aseg-static{font-size:12px;color:var(--tx2)}
.mpmap{position:relative;height:clamp(240px,38vh,400px);border:1px solid var(--line);border-radius:11px;
  overflow:hidden;background:var(--bg0);margin-top:10px}
.mpmap #map{position:absolute;inset:0}
.mp-hint{color:var(--tx3);font-size:11.5px;line-height:1.8;margin-top:10px}
.mp-hint b{color:var(--tx2)}
.arow{background:var(--bg0);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin:5px 0;
  cursor:pointer;transition:.13s}
.arow:hover{border-color:var(--accent)}
.arow.on{border-color:var(--accent);background:var(--surfI)}
.arow-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.arow-h b{font-size:13px}
.arow-m{font-size:11px;color:var(--tx2);background:var(--surfK);border-radius:5px;padding:1px 6px}
.arow-o{font-size:10.5px;color:var(--tx3)}
/* 列表项副行（260930 新增）：矿种细分 · 所在省/国家 · 状态，一行读完。
   原先这里是 6 行 dt/dd 的完整字段表 → 列表被撑成一叠「详细页」，扫不动。 */
.arow-s{font-size:11.5px;color:var(--tx3);margin-top:3px;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 「展开」按钮推到同行最右（.arow-o 不再抢 margin-left:auto） */
.arow .aexp{margin-left:auto}
/* 「展开」= 单独一屏的完整矿区档案。用 fixed 全屏覆盖，不做页内展开：
   页内展开会把个股页撑得很长，内嵌图表还要为此重排整页。 */
.mp-fs{position:fixed;inset:0;z-index:120;background:var(--bg);color:var(--tx);
  overflow-y:auto;overscroll-behavior:contain}
.mp-fs[hidden]{display:none}
.mp-fs .fs-wrap{max-width:1180px;margin:0 auto;padding:0 14px 40px}
.mp-fs .fs-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;gap:10px;
  padding:10px 0 0;background:var(--bg)}
.mp-fs .dhead{flex:1 1 auto;min-width:0;padding:0 0 10px;background:none;border-bottom:1px solid var(--line)}
.mp-fs .dhead h2{padding-right:0;font-size:16px}
.mp-fs .dbody{flex:none;overflow:visible;padding:12px 0 0}
.fs-close{flex:0 0 auto;background:var(--bg0);border:1px solid var(--line);color:var(--tx2);border-radius:7px;
  padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer;min-height:30px}
.aexp{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--tx2);border-radius:7px;
  padding:3px 9px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;min-height:26px}
.aexp:hover{border-color:var(--accent);color:var(--accent)}
.mp-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--tx2);font-size:14px;z-index:50}
/* 「我的研究补充」卡片：自由文字，源是 个股研究/data/<代码>.json（一页一份）。
   ★ 这块是**静态 HTML**，不是 JS 渲染的 —— 就地编辑内核（app/edit_kit.py）要能直接
     选中这些节点、把改动写回数据层；JS 生成的内容不可编辑（Clobber 的 source-DOM
     pairing：不在源里的内容不许改），见 261015-06。 */
.mp-note{border-color:var(--accent);}
.mp-note-i{display:flex;gap:10px;align-items:flex-start;padding:9px 0;}
.mp-note-i + .mp-note-i{border-top:1px dashed var(--line);}
.mp-note-l{flex:0 0 62px;font-size:12.5px;font-weight:600;color:var(--tx2);padding-top:2px;}
.mp-note-b{flex:1;min-width:0;font-size:13px;line-height:1.85;color:var(--tx);
  white-space:pre-wrap;word-break:break-word;min-height:22px;}
.mp-note-b:empty:before{content:attr(data-ph);color:var(--tx3);}
/* 编辑工具条是 fixed 顶栏（高约 46px），吸顶的切换条要让位，否则被压住 */
html.mp-editing .mp-tabs{top:46px;}
</style>
<style id="mp-base-css">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
</style><style id="mp-theme-css">
/* 字号倍率：默认 1.0（标准），由右上角设置的「字体大小」改写 documentElement 上的同名变量 */
:root{--mp-fs:1.0;
  /* C（em/rem 字号）：根字号带倍率，rem/em 链随档位等比缩放（px 仍由 scale_fonts 改写）。
     默认 16px*1=16px（标准），与 FS_DEFAULT 同步。改默认倍率只改 FS_DEFAULT 一处。 */
  font-size:calc(16px*var(--mp-fs,1));
  /* 派生令牌：统一源页写死的深色表面，切主题时随 html[data-theme] 一起变（深色默认值=源页原值，视觉不变） */
  --header-bg:rgba(11,17,25,.92);
  --line-soft:rgba(34,48,74,.5);
  --ov06:rgba(255,255,255,.06);--ov03:rgba(255,255,255,.03);--ov02:rgba(255,255,255,.02);
  --bg-grad:radial-gradient(1200px 600px at 50% -10%,#16223a,#0b1119);
  /* 投资者页输入框等表面底色（派生令牌：深色=源页原值，切主题随 html[data-theme] 变） */
  --inv-input:#0f1826;
  /* 卡片 / 浮层表面色（注入的组件用它：右上角设置面板 .mp-cfg、设置按钮 .mp-cfgb、
     底部模块栏 .mp-bb）。light/sepia 段一直有 --card，深色段原先没有 —— 而两张地图页的
     源 style.css 自己也不定义它，于是地图页上 var(--card) 解不出值、整条 background
     声明失效：深色主题下设置面板成了全透明（浅色主题正常，所以只在深色暴露）。
     这里补深色档，值与 INV_DARK['--card'] 一致；普通页源页自带同值，视觉不变。 */
  --card:#16213a;
  /* 深色三级文字提亮（260922-10）：源页原值 #64748b 在深色卡片上只有 3.16~3.84，
     9~11px 的说明/表头/占位符都读不清。提亮到 #7e93af 后各深色底 4.57~6.4，达 AA；
     仍明显暗于 --tx2(#9fb0c5)，层次不变。这是本块**唯一**不满足「深色默认值=源页原值」
     的令牌，与 light/sepia 段压暗 --tx3 同源（同令牌、同缺陷）。
     地图页经 MAP_THEME_CSS 一并继承（地图 var(--tx3) 全是文字色，无填充用法）。
     同源：--pending 源页深色原值 #a1872a 只有 3.96（超级鹿鼎公页「待补」标）。 */
  --tx3:#7e93af;--pending:#ae922d;
  /* 12 个资源/电源大类色的**深色档**（260922-10）：底栏计数与图例文字走 var(--kk,字面量)，
     light/sepia 档在 MAP_CHROME_CSS 里；深色档原先没有 → 落回 app.js 字面量，
     其中 hydro #2563eb 在深色面板上只有 2.67。取值沿用 cate 原值，三个不达标的同色相提亮：
     hydro→#3896ff、thermal→#ff5c5c、oilgas→#ff5781。画布色不在此列（走 MAP_PALETTE）。 */
  --precious:#f59e0b;--nonfer:#38bdf8;--ferrous:#94a3b8;--newene:#10b981;
  --coal:#a78bfa;--oilgas:#ff5781;--enchem:#fb923c;--chem:#22d3ee;
  --hydro:#3896ff;--nuclear:#f59e0b;--thermal:#ff5c5c;--pumped:#a78bfa;
  --ac-weak:rgba(167,139,250,.12);--ac-mid:rgba(167,139,250,.22);
  --ac-strong:rgba(167,139,250,.35);--ac-line:rgba(167,139,250,.5);
  /* 设置面板「护眼黄」三个字的文字色（260926 用户要求）：按主题取色 ——
     深色面板上给亮黄；浅底/暖底上给压暗的金黄（明黄在 #ffffff 上只有 2.2 左右，读不清）。
     与 THEME_TOKENS 第 4 项对应，加主题时一并补。 */
  --lbl-sepia:#f5c542;
  /* 字体栈单一真相源（F2）：全站 UI 字体由 --mp-font 一处定义；构建期 decouple_fonts
     把源页写死的系统字体栈改成本令牌（带原栈作离线兜底），改字体只动这一行。 */
  --mp-font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
html[data-theme="light"]{--bg:#f5f6f8;--bg2:#ffffff;--card:#ffffff;--line:#dfe4ec;
  --panel:#eef1f6;--panel2:#e6ebf2;--line2:#c6cfdc;
  --tx:#1b2431;--tx2:#596a7f;--tx3:#5f6b7a;--accent:#1a64d1;
  /* 源页用了、但主题层原先没覆盖的令牌（260922-10 深度体检的根因）：
     --card2 未覆盖 → 源页保持深色 #121c2e 而 --tx 已翻深，黑底黑字（实测反差 1.09）；
     --up/--down 未覆盖 → 569 个页面的涨跌色沿用深色主题值（#e24b4a/#3fb950），
       在浅底上只有 3.93 / 2.56。补两个深一档的同类色即可，改这一处全站生效。
     --tx3 由 #8b97a7 加暗到 #5f6b7a：原值在浅底上仅 2.97，全站三级文字都读不清。
       地图画布的轴文字不受影响——那条链路走 MAP_PALETTE['tx3']（画布恒深色，保持原值）。
     --tx2 由 #5a6b80 微调到 #596a7f、--accent 由 #1d6fe8 加暗到 #1a64d1：
       两者在最暗的表面（--panel3 #e3e9f1）上原为 4.47 / 3.83，差一点点到不了 4.5。
       加暗到刚好在最暗表面上达标，取值由 tools/audit_theme_tokens.py 的同款算式求得。
     下列 8 个令牌源页只写了深色原值（--gold #f59e0b 等），浅底上实测 1.79~4.41。
       这里按「同色相压暗到最暗表面刚好 4.5」补齐；--pending 只被超级鹿鼎公页用到
       （源值 #a1872a 在浅底仅 2.1），一并按同法补齐。--blue / --ink 不补：
       源值 #1f5fa8 / #182230 在浅底上本就有 5.0+（审计新增的「浅底反差」列会标无害）。 */
  --card2:#e6ebf1;--up:#b3261e;--down:#0f7b3f;
  --gold:#915d06;--green:#1b7842;--red:#be382b;--amber:#a94e08;
  --muted:#5b6a7e;--sub:#626976;--cyan:#127281;--pending:#7c611a;--warn:#985404;
  --stock:#0e9f78;--inv:#6d4fd8;--quan:#b07000;--newb:#c2185b;--topic:#0e7490;
  --lbl-sepia:#b8860b;
  --header-bg:rgba(245,246,248,.92);--line-soft:rgba(223,228,236,.7);
  --ov06:rgba(0,0,0,.045);--ov03:rgba(0,0,0,.025);--ov02:rgba(0,0,0,.018);
  --bg-grad:radial-gradient(1200px 600px at 50% -10%,#ffffff,#f5f6f8);
  --inv-input:#e6ebf1;
  --ac-weak:rgba(26,100,209,.1);--ac-mid:rgba(26,100,209,.18);
  --ac-strong:rgba(26,100,209,.28);--ac-line:rgba(26,100,209,.45);
  /* ── 地图表面令牌（260922-12 从 MAP_CHROME_CSS 上移到全局层）──
     为什么必须上移：这批令牌原先只随 MAP_THEME_CSS 进两张地图页，而「个股研究/」页
       直接复用地图的 style.css（rt/style.css），用的正是 .dhead/.kv/.chart/.grp-t 与
       --bg0/--surfK 这些表面令牌。个股页不在 THEME_SKIP 里 → 只拿到 THEME_CSS →
       浅色/暖色主题下这些令牌落回 style.css :root 的深色值，浅底上出现一团深块
       （.arow 一行行黑底、.arow-m 白字读不清）。tools/audit_theme_tokens.py 的
       「仅地图层覆盖、但非地图页也在用」一节写的就是这类缺口，修法同此。
     深色主题无选择器命中（不带 data-theme），沿用 style.css :root 原值，渲染逐值不变。 */
  --on-accent:#ffffff;
  --bg0:#eef1f6;
  --bg1:#e6ebf1;
  --panel3:#e3e9f1;
  --gradTop:#e9eef4;
  --gradBot:#e4eaf2;
  --surfA:#eef1f6;
  --surfB:#e9eef4;
  --surfC:#e9eef4;
  --navLine:#dfe4ec;
  --surfD:#e9eef4;

  --surfI:#e6ebf1;
  --surfJ:#e6ebf1;
  --surfK:#e6ebf1;
  --surfL:#e9eef4;
  --bdC:#c6cfdc;

  --link:#1a64d1;

  --acC:#1a64d1;
  /* --warn 只在本块上方一处定义，此处不重复（原先地图段曾各写一份）。 */
  --pos:#10b981;
  --neg:#ef4444;

}
html[data-theme="sepia"]{--bg:#f3e9d2;--bg2:#fbf4e2;--card:#fdf7e8;--line:#e1d3b2;
  --panel:#f3ead4;--panel2:#efe6d2;--line2:#d8c9a8;
  --tx:#3a3021;--tx2:#5c6573;--tx3:#6b5c3d;--accent:#8a4b12;
  /* 同浅色主题：补未覆盖令牌 + 加暗三级文字（#9c8e72 在暖底上仅 2.64）。

   取值依据（260922 实测各页 chrome 的最高层）：
   - 页面自带 chrome 最高 200（地图页抽屉/图例）、投资者页吸顶目录 45 —— 1000 稳在其上；
   - 页面条（nav_kit）是正常流内元素、不给 z-index，按构造不会与之冲突；
   - 再往上就是 echarts 内部 tooltip 的 9999999（库自己管理，别去抢）。
   此前是 95/96，被 inject_portal_nav 注入的 #wb-nav（z-index:99990）完全压死，
   表现为「京东方A与TCL科技-可视化网页版」上按钮点不中（260922 体检 P0①）；

/* ── 设置面板 / 设置按钮 / 底部模块栏（注入层，260930 需求#7 起**跟随字号档位**）──

   scale_fonts() **之后**注入 —— 构建期改写够不着，就一直不参与缩放
   （build_content.py 里那句「面板自己的 px 不该被缩放」是本次之前的口径，已作废）。

/* 个股人工补充读取内核 —— **唯一源**，浏览器（classic script）与 Node 测试共用同一份文件。
 *
 * 为什么是 classic script 而不是 ES module：页面由 build_company_pages.py 内联进
 * stock.html，App 侧走 WebViewAssetLoader，`.mjs` 在 Android 的 MimeTypeMap 里查不到，
 * 会被当 application/octet-stream 拒载（探针 kit 的注释里记过同一个坑）。
 * 写成 IIFE + module.exports 双出口，浏览器拿 `window.MP_SUPP`，Node 用 require，
 * 一份代码两条路，不需要构建期做 ESM→classic 的文本转换。
 *
 * 分工（261109 合同 §3）：
 *   · 传输层只回答「文件在 / 不在 / 读失败」，不在 → {status:'absent'}，读失败必须 throw；
 *   · 本内核判五种状态：loading / ready / empty / unknown / error（乱序与取消另算 superseded）；
 *   · 草稿层只产出 v1 改动包，不碰 localStorage、不写盘。
 * 源文件是 `个股研究/data/<代码>.json`（每公司一份）；构建期合并的 comp_supp.json 已退役。

  function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  /* ── 传输层：直接读源文件 ────────────────────────────────────────────────
   * base 相对页面（`个股研究/stock.html` → `data/<code>.json`），电脑与 App 同一条相对路径。
   * 404 = 这家公司还没写过补充（预期语义，不是错误）—— 静态服务器对不存在的文件只会给 404，
   * 所以这里不需要任何「有哪些公司有补充」的索引：目录本身就是真相。

        state = {status: 'unknown', code: typeof code === 'string' ? code : ''};

   * 「字段不存在」与「字段是空串」在 base 里必须能分开：不存在的字段不进 base，

    FIELDS: FIELDS,
    createFetchTransport: createFetchTransport,
    createReader: createReader,
    createDraft: createDraft
  };

/* 跨页找公司：候选来自 rt/data/comp_index.json（与地图页同一份公司索引）。

(function(){
  var q=document.getElementById('coFind'), box=document.getElementById('coFindList');
  if(!q) return;

    Object.keys(idx||{}).forEach(function(code){
      var row=idx[code];

      rows.push({code:code, name:row.n||code,
        href:'stock.html?code='+encodeURIComponent(code)+'&layer='+encodeURIComponent(row.layer)});
    });
    rows.sort(function(a,b){return a.name.localeCompare(b.name,'zh');});
    ready=true;
    if(document.activeElement===q) render();
  }).catch(function(){
    failed=true;
    if(document.activeElement===q) render();
  });
  var cur=0, hits=[];
  function close(){box.hidden=true;}
  function mark(){
    [].forEach.call(box.querySelectorAll('a'),function(a,i){a.className=i===cur?'on':'';});
  }

    hits=v?rows.filter(function(r){

    if(!v){close();return;}

      for(var k in e.lines){
        var i=+k; if(i<0||i>=ls.length)continue;
        var pm=(ls[i]||'').match(/^(\s*(?:#{1,6}\s+|\d+\.\s+|[-*]\s+))/);
        ls[i]=(pm?pm[1]:'')+e.lines[k]; touched=true;
      }
      if(!touched)return;
      nv=ls.join('\n');
    }
    if(String(orig)===String(nv))return;             /* 改回去了 → 不记 */
    /* 源里本来没有这个字段、用户也没写 → 不记。
       （个股/量化的补充源首次编辑时文件还是空的，三个字段 orig 全是 undefined；
        少了这一条，点一次「保存」就把三个未触碰的空字段全记成 ''，
        导出白白带上它们、回写还给文件添上 note:"" 这种空壳。） */
    if(orig===undefined&&(nv===''||nv==null))return;
    /* ★ 扁平键（'days.0.bili.text' → 新值），**不要** setPath 建成嵌套树：
       导出时按 Object.keys 遍历并逐条转 JSON Pointer，存嵌套的话只会得到顶层
       键 'days'，patch 退化成 `/days` 整份覆盖 —— 那正好是这套设计要避免的
       （整份覆盖会吞掉导出期间别人对同一文件的改动）。 */
    d[p]=nv; n++;
  });
  saveDiff(d); paint(true);
  return n;
}

function exportDoc(){
  /* collect() 返回的是**改动条数**，改动对象要用 diffs() 从 localStorage 取。
     261109 修：原先把返回值当对象用，Object.keys(数字) 恒为 []，
     于是「导出改动」永远提示「没有改动可导出」—— 改了却导不出来。 */
  collect();
  var d=diffs();
  var paths=Object.keys(d).filter(function(p){return p!=='name';});
  if(!paths.length){say('没有改动可导出');return;}
  var base={},patch=[];
  paths.forEach(function(p){
    base[ptr(p)]=getPath(CFG.original,p);
    patch.push({op:'replace',path:ptr(p),value:d[p]});
  });
  var doc={v:1,module:CFG.module||'',name:CFG.name||'',base:base,patch:patch};
  var blob=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(CFG.src||'edit.json');
  a.click();
  say('已导出 '+paths.length+' 处改动。文件只在这台设备；传到电脑跑 apply_export.py '
      +'并重新出包后，改动才会进仓库和 App。',6500);
}

/* 网页端专用：改动直接写回仓库（需要 serve.py 的 /api/apply）。
   手机 App 内（https://money.local/）没有这个接口，按钮不显示，仍走「导出改动」。 */
function pushToRepo(){
  if(pushToRepo.busy)return;
  collect();
  var d=diffs();
  var paths=Object.keys(d).filter(function(p){return p!=='name';});
  if(!paths.length){ say('没有改动'); return; }
  var base={}, patch=[];
  paths.forEach(function(p){
    base[ptr(p)]=getPath(CFG.original,p);
    patch.push({op:'replace',path:ptr(p),value:d[p]});
  });
  var doc={v:1,module:CFG.module||'',name:CFG.name||'',base:base,patch:patch};
  pushToRepo.busy=true;
  paint(on());
  say('正在存到仓库…', 60000);
  fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},
                      body:JSON.stringify(doc)})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j && j.ok){
        var remaining=diffs();
        paths.forEach(function(p){if(JSON.stringify(remaining[p])===JSON.stringify(d[p]))delete remaining[p];});
        saveDiff(remaining); say(j.msg, 5000); location.reload();
      }
      else { say('写入失败：'+((j&&j.msg)||'未知错误'), 6000); }
    })
    .catch(function(){ say('连接中断，结果未确认；本机改动已保留，可重试', 6000); })
    .finally(function(){pushToRepo.busy=false;paint(on());});
}

/* 工具条 */
var LOCAL_WRITE = ['127.0.0.1','localhost','[::1]'].indexOf(location.hostname) >= 0;
bar=document.createElement('div');bar.className='mp-edit-bar';bar.id='mpEditBar';
bar.innerHTML=
  '<button class="pri" id="mpEditOn">编辑模式</button>'+
  '<button id="mpEditSave">保存本机</button>'+
  '<button id="mpEditExport">导出改动</button>'+
  (LOCAL_WRITE ? '<button class="pri" id="mpEditPush">存到仓库</button>' : '')+
  '<button id="mpEditClear">清空本机改动</button>'+
  '<span class="mp-edit-n" id="mpEditN"></span>';
document.body.appendChild(bar);
tip=document.createElement('div');tip.className='mp-edit-tip';document.body.appendChild(tip);
/* 常驻入口：点一下直接开编辑模式，不必先去「⋯」设置里找开关。
   title 把断掉的闭环一次说清，免得用户以为改完就存进仓库了。 */
var fab=document.createElement('button');
fab.type='button';fab.className='mp-edit-fab';fab.id='mpEditFab';
fab.title='在这页写点东西。改动只存这台设备；点工具条「导出改动」把文件传到电脑，'
         +'跑 apply_export.py 并重新出包后，才会进仓库和 App。';
fab.onclick=function(){setOn(true);};
document.body.appendChild(fab);

document.getElementById('mpEditOn').onclick=function(){setOn(!on());};
document.getElementById('mpEditSave').onclick=function(){
  var n=collect();say(n?('已保存 '+n+' 处改动到本机'):'没有改动');};
document.getElementById('mpEditExport').onclick=exportDoc;
var pushBtn=document.getElementById('mpEditPush');
if(pushBtn) pushBtn.onclick=pushToRepo;
document.getElementById('mpEditClear').onclick=function(){
  var d=diffs(),n=Object.keys(d).length;
  if(!n){say('本机没有改动');return;}
  saveDiff({});paint(on());
  /* 还原成源快照的值（不回写文件，只是撤销本机改动） */
  els().forEach(function(el){var p=resolve(el);
    if(p){var v=getPath(CFG.original,p);
      if(v!=null)el.innerText=String(v);}});
  say('已清空本机 '+n+' 处改动');
};

/* 事件委托：内容块改完即尝试记录（不自动存盘，按「保存本机」落 localStorage） */
document.addEventListener('input',function(e){
  if(!on())return;
  var el=e.target.closest?e.target.closest('[data-edit]'):null;
  if(el){var c=document.getElementById('mpEditN');
    if(c){var d=diffs();c.textContent=Object.keys(d).length?Object.keys(d).length+' 处未导出':'';}}
});

paint(on());
/* 「⋯」设置里的开关走这里：设置脚本在 <head> 先跑完，用事件跨过加载顺序 */
window.addEventListener('mp-edit-set',function(e){
  var want=!!(e.detail&&e.detail.on);
  try{localStorage.setItem(LSKEY,want?'on':'off');}catch(err){}
  paint(want);
  say(want?'编辑模式已开：点正文虚线框处即可改':'编辑模式已关');
});
window.addEventListener('mp-edit-open',function(){setOn(true);});
})();</script></body>
