<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投资者 — 雪球研究站</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-brand">📊 雪球研究站</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="investors.html" class="active">投资者</a>
                <a href="stocks.html">股票</a>
                <a href="portfolios.html">组合</a>
                <a href="quant.html">量化研究</a>
            </div>
            <button class="nav-toggle" aria-label="菜单">☰</button>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>👤 投资者</h1>
            <p class="subtitle">追踪的雪球投资大V，查看他们的最新观点和动态</p>
        </header>

        <div class="toolbar">
            <input type="text" id="investor-search" class="search-input" placeholder="搜索投资者名称...">
            <select id="investor-sort" class="sort-select">
                <option value="name">按名称排序</option>
                <option value="posts">按帖子数排序</option>
                <option value="likes">按点赞数排序</option>
                <option value="updated">按更新时间排序</option>
            </select>
        </div>

        <div id="investor-grid" class="investor-grid">
            <div class="loading">加载中...</div>
        </div>

        <div id="investor-detail" class="investor-detail" style="display:none;">
            <button class="back-btn" onclick="backToList()">← 返回列表</button>
            <div id="investor-detail-content"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <p>雪球研究站 · 数据来自雪球网 · 仅供研究参考</p>
        </div>
    </footer>

    <script src="js/core.js"></script>
    <script src="js/investors.js"></script>
</body>
</html>
