<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>狸哥很懒 · 投资者研究</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#16223a,#0b1119);
    color:var(--tx);min-height:100vh;padding:26px 20px 70px;line-height:1.7;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  h1{font-size:29px;letter-spacing:1px;}
  .sub{color:var(--tx2);font-size:14px;margin-top:8px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 10px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .kpi b{display:block;font-size:25px;color:var(--accent);}
  .kpi span{font-size:12px;color:var(--tx3);}
  section{margin-top:36px;}
  h2{font-size:19px;margin-bottom:6px;padding-left:11px;border-left:3px solid var(--accent);}
  .hint{color:var(--tx3);font-size:12px;margin-bottom:14px;padding-left:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;}
  /* 工具栏 */
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 4px;
    padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);}
  .btn{background:transparent;border:1px solid var(--line);color:var(--tx2);
    padding:6px 14px;border-radius:9px;cursor:pointer;font-size:13px;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.on{border-color:var(--accent);color:var(--accent);background:rgba(167,139,250,.1);}
  .btn.pri{border-color:rgba(167,139,250,.5);color:var(--accent);background:rgba(167,139,250,.08);}
  .bar .tip{font-size:12px;color:var(--tx3);margin-left:auto;}
  .editable{outline:1px dashed var(--accent);border-radius:4px;padding:1px 3px;}
  .saved{color:var(--down);font-size:12px;}
  /* 图表 */
  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{background:transparent;border:1px solid var(--line);color:var(--tx2);
    padding:6px 15px;border-radius:9px;cursor:pointer;font-size:13px;}
  .tab.on{border-color:var(--accent);color:var(--accent);}
  .chart{width:100%;height:340px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;}
  th:first-child,td:first-child,td.l{text-align:left;}
  th{color:var(--tx3);font-weight:500;font-size:12px;}
  .up{color:var(--up);} .down{color:var(--down);} .na{color:var(--tx3);}
  .yr-h .rk{font-size:11px;color:var(--tx3);font-weight:400;}
  .evo{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .stage .yr{font-size:12px;color:var(--accent);}
  .stage h3{font-size:16px;margin:4px 0 8px;}
  .stage p{font-size:13px;color:var(--tx2);}
  .stage.warn{border-left:3px solid var(--up);}
  .quote{border-left:2px solid var(--accent);padding:2px 0 2px 14px;color:var(--tx2);font-size:13px;margin:10px 0;}
  .prin{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .prin div{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.22);
    border-radius:11px;padding:13px 16px;font-size:13px;}
  .prin b{display:block;color:var(--accent);font-size:13px;margin-bottom:3px;}
  .tl{position:relative;padding-left:26px;}
  .tl:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line);}
  .yr{position:relative;margin-bottom:16px;}
  .yr:before{content:'';position:absolute;left:-23px;top:7px;width:9px;height:9px;
    border-radius:50%;background:var(--accent);}
  .yr.warn:before{background:var(--up);}
  .yr-h{display:flex;align-items:baseline;gap:12px;cursor:pointer;flex-wrap:wrap;}
  .yr-h .y{font-size:16px;font-weight:600;min-width:46px;}
  .yr-h .r{min-width:74px;font-size:14px;}
  .yr-h .h{color:var(--tx3);font-size:12px;flex:1;}
  .yr-b{display:none;margin-top:8px;font-size:13px;color:var(--tx2);
    background:var(--ov03,rgba(255,255,255,.03));border:1px solid var(--line);border-radius:11px;padding:13px 16px;}
  .yr.open .yr-b{display:block;}
  /* 调仓动作：左列动作标签，右列标的 + 逻辑 */
  .mvs{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);}
  .mv{display:grid;grid-template-columns:46px 1fr;gap:11px;margin-bottom:9px;line-height:1.7;}
  .mv:last-child{margin-bottom:0;}
  .mv-a{font-size:10.5px;text-align:center;border-radius:5px;padding:2px 0;height:17px;
    border:1px solid;white-space:nowrap;}
  .a-buy{color:#a78bfa;border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.1);}
  .a-swap{color:#4a9eff;border-color:rgba(74,158,255,.45);background:rgba(74,158,255,.1);}
  .a-cut{color:#3fb950;border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.1);}
  .a-hold{color:#94a3b8;border-color:rgba(148,163,184,.45);background:rgba(148,163,184,.1);}
  .a-misc{color:#64748b;border-color:rgba(100,116,139,.45);background:rgba(100,116,139,.1);}
  .mv-w{color:var(--tx);font-size:12.5px;}
  .mv-y{color:var(--tx3);font-size:11.5px;margin-top:2px;}
  .tnote{font-size:11.5px;color:var(--tx3);margin-top:10px;}
  /* 展开/折叠按钮：滚到「每年持仓与调仓」时固定在右下角，离开该节自动隐藏 */
  #btnExpandAll{position:fixed;right:28px;bottom:28px;z-index:60;
    background:rgba(22,33,58,.96);border:1px solid rgba(167,139,250,.55);color:var(--accent);
    border-radius:22px;padding:9px 18px;font-size:12.5px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.42);
    opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s;}
  #btnExpandAll.show{opacity:1;visibility:visible;transform:none;}
  #btnExpandAll:hover{background:rgba(167,139,250,.18);}
  @media(max-width:760px){#btnExpandAll{right:14px;bottom:14px;padding:8px 14px;font-size:12px;}}
  /* 评价卡 */
  .say{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px;}
  .say-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
  .say-h b{font-size:15px;color:var(--accent);}
  .say-h i{font-style:normal;font-size:12px;color:var(--tx3);}
  .say p{font-size:13px;color:var(--tx2);}
  .say.mine{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.06);}
  .links{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
  .links a{font-size:13px;border:1px solid var(--line);border-radius:10px;padding:9px 14px;
    display:block;transition:.18s;color:var(--tx2);}
  .links a:hover{border-color:var(--accent);color:var(--accent);text-decoration:none;}
  .links a i{display:block;font-style:normal;font-size:11px;color:var(--tx3);margin-top:2px;}
  /* 编辑模式：整张卡片是 <a>，直接点会跳转；把锚点设为不可命中，只放行里面的可编辑文字，
     这样「条目标题 / 备注」才能落光标修改，且不会误触打开原帖。 */
  body.editmode .links a{pointer-events:none;}
  body.editmode .links a [data-edit]{pointer-events:auto;}
  .foot{color:var(--tx3);font-size:12px;margin-top:34px;line-height:1.8;}
  @media(max-width:860px){.kpis,.evo,.prin,.links{grid-template-columns:1fr;}}
:root{--bg:#0b1119; --card:#16213a; --line:#22304a; --tx:#e8eef7; --tx2:#9fb0c5; --tx3:#64748b; --accent:#a78bfa; --up:#ff6b6b; --down:#3fb950;}

  /* ── 详情页导航增强：上一位/下一位 + 页内目录吸顶（由 build.py 注入；勿手改生成页） ── */
  .inv-pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0;}
  .inv-pager-bot{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line);}
  .inv-pg{display:inline-flex;align-items:center;gap:7px;max-width:46%;
    border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);
    font-size:12.5px;color:var(--tx2);transition:.16s;}
  .inv-pg:hover{border-color:var(--accent);color:var(--accent);text-decoration:none;}
  .inv-pg b{font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inv-pg:hover b{color:var(--accent);}
  .inv-pg em{font-style:normal;font-size:11.5px;color:var(--tx3);white-space:nowrap;}
  .inv-pg .inv-ar{color:var(--accent);}
  .inv-pg.off{opacity:.42;pointer-events:none;}
  .inv-mid{margin:0 auto;font-size:11.5px;color:var(--tx3);white-space:nowrap;}
  .inv-toc{position:sticky;top:0;z-index:45;display:flex;gap:3px;overflow-x:auto;
    margin:14px 0 0;padding:7px 9px;border:1px solid var(--line);border-radius:12px;
    /* ★ 261119：吸顶栏随主题走 —— 原来写死深色，浅色/护眼下是醒目黑条。 */
    background:var(--header-bg,rgba(11,17,25,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .inv-toc::-webkit-scrollbar{display:none;}
  .inv-toc a{flex:0 0 auto;font-size:12.5px;color:var(--tx2);padding:4px 11px;border-radius:8px;
    white-space:nowrap;transition:.15s;}
  .inv-toc a:hover{color:var(--accent);background:rgba(167,139,250,.1);text-decoration:none;}
  .inv-toc a.on{color:var(--accent);background:rgba(167,139,250,.18);font-weight:600;}
  section[id]{scroll-margin-top:62px;}
  @media(max-width:760px){
    .inv-pg{max-width:58%;}
    .inv-mid{display:none;}
    .inv-toc a{font-size:12px;padding:4px 9px;}
  }
  /* ── 开头那排 KPI 卡片：窄屏不许塌成一列 ──
     源页面在 max-width:860px 把 .kpis 压成 1fr，六张卡片竖着排能吃掉整屏；
     而这几条（仓位 / 帖子数 / 粉丝数 / 精力权重…）正是「这人是谁」的核心信息，
     值得留在首屏。这里覆盖成横向 2 / 3 / 4 列（≤560 两列、≤860 三列、再宽沿用页面四列），
     并收紧内边距与字号，让整块高度稳定不超过半屏。
     回归验证：tools/kpi_density_check.mjs（393 / 768 / 1280 三视口量列数与占屏比）。

     ⚠ 本常量里绝不能出现样式表的结束标签字样（含注释里）：HTML 解析样式元素时
     不认 CSS 注释，见到它就立刻结束样式表。曾因此在注释里写了那五个字符，
     导致其后所有 @media 规则被当成正文文本、整页列数覆盖静默失效。 */
  @media(max-width:860px){
    .kpis{grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 10px;}
    .kpi{padding:11px 12px;}
    .kpi b{font-size:19px;line-height:1.25;}
    .kpi span{font-size:11px;line-height:1.4;}
  }
  /* 更窄的手机（多为 360/320）继续收：卡片按行等高，行高由该行最长的标签决定，
     所以压内边距、字号、间隙就能整体变矮，不需要裁掉标签文字（父括号里的出处是有效信息）。 */
  @media(max-width:560px){
    .kpis{grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 8px;}
    .kpi{padding:9px 10px;border-radius:10px;}
    .kpi b{font-size:17px;line-height:1.2;}
    .kpi span{font-size:10.5px;line-height:1.35;}
  }
  /* ── 260917-11 P0：把已有的「死数据」补上页 + 给空板块加空态 ──
     背景：体检发现 risk.view/avoid/note 有 241 页已填却从不渲染；分类学/粉丝/组合
     三类旁证也是「算完就搁着」。这些一律走注入，源页面与 566 份 data 都不动。 */
  .inv-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;}
  .inv-tag{font-size:11.5px;line-height:1.5;padding:2px 9px;border-radius:20px;
    border:1px solid var(--line);color:var(--tx2);background:var(--ov03,rgba(255,255,255,.03));
    white-space:nowrap;}
  .inv-tag.k{color:var(--accent);border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.1);}
  .inv-tag.t{color:#e0a94a;border-color:rgba(224,169,74,.45);background:rgba(224,169,74,.1);}
  .inv-tag i{font-style:normal;color:var(--tx3);}
  /* 空态：虚线框 + 灰字，明显区别于有内容的卡片，一眼看出「这里本来就缺」 */
  .inv-na{font-size:12.5px;color:var(--tx3);line-height:1.85;padding:12px 15px;
    border:1px dashed var(--line);border-radius:11px;margin:0 0 14px;
    background:var(--ov02,rgba(255,255,255,.02));}
  .inv-na b{color:var(--tx2);font-weight:500;}
  /* 时间轴为空时收起那条竖线，免得留一截孤零零的线 */
  .tl.inv-hide{padding-left:0;}
  .tl.inv-hide:before{display:none;}
  .inv-x{margin-top:14px;}
  .inv-x .rv{margin-bottom:13px;}
  .inv-x .rv:last-child{margin-bottom:0;}
  .inv-x .rv>b{display:block;font-size:12.5px;color:var(--accent);margin-bottom:4px;}
  .inv-x .rv>p{font-size:13px;color:var(--tx2);}
  .inv-x .rn{font-size:12px;color:var(--tx3);margin-top:11px;padding-top:11px;
    border-top:1px dashed var(--line);}
  .inv-x .say-h{margin-bottom:4px;}
  .inv-x .note{font-size:11.5px;color:var(--tx3);line-height:1.7;margin-bottom:10px;}
  .inv-x .sy{color:var(--tx3);font-size:11px;}
  @media(max-width:560px){
    .inv-tag{font-size:11px;padding:2px 8px;}
    .inv-x{padding:14px 15px;}
  }
/* mp-nav:start */
/* ── 全站页面条（mp-nav）：← 门户 + 面包屑 + 同级入口 ────────────────
   唯一实现。配色只用主题令牌并给兜底链，因此三套主题、地图深色画布、
   以及自带浅色令牌的手写研报页（中远海控 / 京东方系列）都成立。
   兜底链为什么是「令牌 A → 令牌 B → currentColor」：全站标准令牌是
   --tx/--tx2（投资者页、直播页、量化页、地图页），但那几张手写研报页
   用的是 --ink/--sub，且不定义 --tx/--tx2 —— 只写暗色兜底会让面包屑
   当前页与同级入口在它的白底上糊成一片（260922 实测，见处理报告）。
   字号用 rem 锚定根字号、不继承所在页 body 字号（原写 .92em，条高会跟着
   各页 body 的 font-size 变：我的页 body 14px → 条 33px，其余页 16px → 38px，
   同一条界面出现两种厚度，261116 截图对比抓到）。乘 --mp-fs 保留 App 字号
   档位联动（无该变量时回落 1，离线单开就是定尺）。右侧留白由 App 注入层的
   html.mp-app 开关，离线单开不留白。 */
/* ★ 条高作为**变量**公布，并且**条自己也读它** —— 这是唯一真相源。
   页面要用「条下沿」定位时（地图页的 #map / #ui 从条下面开始，否则绝对定位的容器
   会把条盖住）读同一个 `--mp-nav-h`。
   ⚠ 为什么不让 height 用 em 自算、变量再抄一份结果：那样两处会**静默漂移**
   （改了 em 忘改变量 → 地图让位错位，且没有任何报错）。现在 height 就是变量，
   数值与条的实际高度在物理上不可能不一致。字号仍单独写，只管文字大小。
   ⚠ 唯一的例外是 --mp-fs 极小时 min-height:28px 触底，此时实际高度取 28px ——
   真实使用档位（0.8~1.5）都远高于它，不会碰到。 */
:root{--mp-nav-h:calc(2.392rem*var(--mp-fs,1));}
/* 固定头的标准配套：页内锚点跳转要避开条，否则目标行落在条底下看不见。
   261116 加 —— 条在流里时没这个问题（条会跟着滚走），改成 fixed 之后必须有。 */
html{scroll-padding-top:var(--mp-nav-h,0);}
.mp-nav{position:fixed;top:0;left:0;right:0;
  /* ★★ 为什么要 fixed：条在文档流里时，**任何页面自己的 body padding 都会推它**
     （我的页被缩进 16px + 下压 20px、量化页 top:36 left:20），于是"全站统一"变成
     "逐页手工对齐"，新加页面照样踩，而且只有肉眼比截图才看得出来（261116）。
     fixed 之后条相对视口定位，页面 padding 再怎么改都动不了它，宽度也不受 body 左右留白影响。
     ⚠ z-index 取 55：高过地图浮层（45）、页面自己的吸顶控件（6/20/40），
       低于底部模块栏（60）、就地编辑栏（70）与 App 的「⋯」（1000/1001）——
       260922 那次 `z-index:99990` 把设置按钮压死的教训，就是别把自己放到 App 界面层之上。 */
  z-index:55;
  display:flex;align-items:center;gap:.55em;flex-wrap:nowrap;
  flex:0 0 auto;                     /* 地图页 body 是 flex 列，别被压扁 */
  /* 单行定高（≈38px，全站同一厚度）：**高度必须与所在页 body 字号无关**，
     否则「我的」（body 14px）是 33px、其余页（16px）是 38px，同一条界面两种
     厚度（261116 实测）。font-size 用 rem 锚根字号、不继承 body；height 直接读
     `--mp-nav-h`（见上方说明：让条高与"别人以为的条高"在物理上不可能不一致）。
     此前用 flex-wrap:wrap + 同级入口自动换行，390px 下 6 张手写研报页被撑到
     66~88px（同级入口多达 9 个），是其它页的 2~2.6 倍；且同级入口那个
     横向滚动容器会把所在行撑高近一倍。改为「永不换行 + 同级入口自己横向滑」。 */
  height:var(--mp-nav-h);min-height:28px;box-sizing:border-box;overflow:hidden;
  padding:.3em 1em;
  background:var(--card,#141b26);
  border-bottom:1px solid var(--line,#243352);
  font-size:calc(.92rem*var(--mp-fs,1));line-height:1.5;
  color:var(--tx2,var(--sub,var(--tx,currentColor)));}
/* 让位块：条脱离文档流之后，内容必须由它推下去，否则整页被压住一个条高。
   用**空块**而不是 `body{padding-top}`：body 的 padding 是各页自己的排版财产
   （左右留白也写在同一条简写里），覆盖它等于替人家改版式；空块只吃纵向、
   不碰任何既有样式，而且各页原有 padding 照样生效 —— 内容的绝对位置与改造前完全一致。 */

  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];

  if (Array.isArray(o) && /^\d+$/.test(last)) o[+last] = val; else o[last] = val;

function render() {

  // 连续年份轴：min~max 之间每个年份都占一个类目位，缺失年份用 null 占位，
  // 让中间空缺显式留空（否则 echarts 把有数据的年份当等间距类目，看似逐年连续）。
  // 净值折线 connectNulls 默认 false，空缺处自动断开，不会误连成连续曲线。
  let years = yrs.map(d => d.y);

  yrs.forEach(d => { byY[d.y] = d; });

    : (n ? `阅读模式 · 有 ${n} 处本地修改（点「写回文件」可写进源数据）`
         : '阅读模式（点「编辑」可直接改本页任何文字）');

function save() {
  const diffs = {};
  let changed = 0;
  document.querySelectorAll('[data-edit]').forEach(el => {
    const p = el.dataset.edit;
    if (!p || p === 'name') return;   // name 只读：改了会与文件名 / PAGES 名单不一致
    // 本次没碰过、且没有待导出的旧改动 → 不记 diff（既保住旧改动，也不把占位文案写回数据）
    if (LOCAL[p] === undefined && SNAP[p] === el.innerText.trim()) return;
    let v = el.innerText.trim();
    if (/\.(r|nav)$/.test(p)) { const pv = parseFloat(String(v).replace(/[%,]/g, '')); v = (v === '' || v === '未公开') ? null : (isNaN(pv) ? getPath(ORIGINAL, p) : pv); }
    setPath(DATA, p, v);
    // 只记录与源文件不同的字段：源文件后续更新时，未改动的字段仍显示新内容
    if (String(getPath(ORIGINAL, p)) !== String(v)) { diffs[p] = v; changed++; }
  });
  if (diffs['mine.user'] !== undefined) {          // 改过「我的评价」才更新日期
    const today = new Date().toISOString().slice(0, 10);
    setPath(DATA, 'mine.userUpdated', today);
    diffs['mine.userUpdated'] = today;
  }
  LOCAL = diffs;
  try { localStorage.setItem(LSKEY, JSON.stringify(LOCAL)); } catch (e) {}
  setEdit(false); render();
  const m = $('msg');
  m.textContent = `已保存 ${changed} 处改动（本机生效）→ 点「写回文件」写进数据/狸哥很懒.json 才永久保留`;
  setTimeout(() => m.textContent = '', 7000);
}
/* 点分路径 → JSON Pointer（RFC 6901）：'perf.note' → '/perf/note'，
   'perf.years.0.moves.1.act' → '/perf/years/0/moves/1/act'。
   键里的 ~ 与 / 要转义（RFC 6901：~0/~1）—— 数据实测无此类键，但转换必须正确。 */
function toPointer(dotPath) {
  return '/' + dotPath.split('.')
    .map(t => t.replace(/~/g, '~0').replace(/\//g, '~1')).join('/');
}
function exportJson() {
  const paths = Object.keys(LOCAL).filter(p => p !== 'name');   // name 是标识符，不导出
  if (!paths.length) {
    const m = $('msg');
    m.textContent = '没有改动可导出（先点「编辑」改内容，「保存」后再导出）';
    setTimeout(() => m.textContent = '', 5000);
    return;
  }
  /* ★ 导出「字段级改动包」而不是整份 DATA：整份覆盖是 Last-Write-Wins，
     会静默吃掉导出期间别人对同一文件的改动（RFC 6902/7386 的做法，见 patchkit.py 头注）。
     base 带每个被改路径的**改动前**值，apply_export.py 靠它做 base/我/远端三方合并；
     路径在 ORIGINAL 里不存在时 base 就没有该项（getPath 得 undefined，JSON 会丢掉），
     那边退化成「无 base」模式：远端有不同值时报冲突，不静默覆盖。 */
  const base = {}, patch = [];
  for (const p of paths) {
    const ptr = toPointer(p);
    base[ptr] = getPath(ORIGINAL, p);
    patch.push({ op: 'replace', path: ptr, value: LOCAL[p] });
  }
  const doc = { v: 1, name: DATA.name, base, patch };
  const blob = new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = SRC_NAME;
  a.click();
  const m = $('msg');
  m.textContent = `已导出 ${paths.length} 处改动（JSON Patch 格式）；`
    + '在该目录外跑 python 投资者研究/apply_export.py 即可永久生效';
  setTimeout(() => m.textContent = '', 5000);
}
function reset() {
  if (!confirm('清除本地修改，恢复为页面原始数据？')) return;
  localStorage.removeItem(LSKEY);
  location.reload();
}

/* ---------- 写回源文件（File System Access API） ----------
   本地文件句柄存 IndexedDB，一次授权后无需重复选择文件。 */
const IDB_NAME = 'inv-edit';
const IDB_STORE = 'handles';
let fileHandle = null;

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const db = await idbOpen();
  return new Promise(res => {
    const q = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(k);
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => res(null);
  });
}
async function idbSet(k, v) {
  try {
    const db = await idbOpen();
    db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(v, k);
  } catch (e) { /* 句柄不可克隆时忽略，退化为每次选择文件 */ }
}

function canFSA() { return typeof window.showSaveFilePicker === 'function'; }

async function ensureHandle() {
  if (fileHandle) return fileHandle;
  fileHandle = await window.showSaveFilePicker({
    suggestedName: SRC_NAME,
    types: [{ description: 'JSON 数据文件', accept: { 'application/json': ['.json'] } }],
  });
  await idbSet(SRC_NAME, fileHandle);
  updateWriteBtn();
  return fileHandle;
}

function updateWriteBtn() {
  const b = $('btnWrite');
  if (!b) return;
  if (!canFSA()) { b.textContent = '写回文件（浏览器不支持）'; b.disabled = true; return; }
  b.textContent = fileHandle ? '写回文件 ✓' : '写回文件';
}

async function writeBack() {
  const m = $('msg');
  if (!canFSA()) { m.textContent = '当前浏览器不支持直接写文件，请改用「导出 JSON」+ apply_export.py'; return; }
  let h;
  try { h = await ensureHandle(); }
  catch (e) { m.textContent = '已取消：未选择文件'; return; }
  const opt = { mode: 'readwrite' };
  let perm = await h.queryPermission(opt).catch(() => 'prompt');
  if (perm !== 'granted') { try { perm = await h.requestPermission(opt); } catch (e) { perm = 'denied'; } }
  if (perm !== 'granted') { m.textContent = '未获得写入权限：请在弹窗中点「允许」，或改用「导出 JSON」'; return; }
  try {
    /* ★ 先读盘比对，再决定能不能整份写回：
        磁盘 == DATA      → 已包含这些改动，无事可做（幂等）；
        磁盘 == ORIGINAL  → 没别人动过，整份写回安全（远端==base，LWW 等价于合并）；
        其它              → 这期间文件被其它途径改过，整份覆盖就是 Last-Write-Wins，
                            会静默吃掉对方的改动 → 拒写，引导走「导出 JSON」+
                            apply_export.py（那边是字段级三方合并）。 */
    const f = await h.getFile();
    const txt = await f.text();
    let disk = null;
    try { disk = JSON.parse(txt); } catch (e) { disk = null; }
    if (disk && JSON.stringify(disk) === JSON.stringify(DATA)) {
      m.textContent = '磁盘上的文件已包含这些改动，无需重复写入';
      setTimeout(() => m.textContent = '', 5000);
      return;
    }
    if (!disk || JSON.stringify(disk) !== JSON.stringify(ORIGINAL)) {
      m.textContent = '磁盘上的文件已与页面加载时不一致（被其它途径改过），整份写回会覆盖那些改动；'
        + '请改用「导出 JSON」+ apply_export.py（字段级三方合并）';
      return;
    }
    const w = await h.createWritable();
    // 沿用原文件换行风格：data/ 里 552/570 份是 CRLF，写 LF 会制造整文件 diff
    await w.write(JSON.stringify(DATA, null, 2) + (txt.indexOf('\r\n') >= 0 ? '\r\n' : '\n'));
    await w.close();
  } catch (e) { m.textContent = '写入失败：' + e.message; return; }
  updateWriteBtn();
  m.textContent = `已写入 ${h.name} —— 源数据已更新（换浏览器/换电脑都不丢）；`
    + '本地副本保留到下次「重建页面.bat」后自动消失';
  setTimeout(() => m.textContent = '', 8000);
}

function yrAllOpen(){

   所以没条的老页行为与从前完全一致，不会出现"设置没了"。
   ⚠ 位置必须在这个 iframe 判断**之后**：内层页要把按钮藏起来，先藏再搬等于在条里
     塞一个空槽（外观上是条末尾莫名多 26px 空白）。
   ⚠ `.in-nav` 是显式标（样式见 theme_palette 的 `.mp-cfgb.in-nav`），而"在条里就不 fixed"
     另由 `.mp-nav .mp-cfgb` 兜住：两套判据任一成立都不会浮回右上角。 */
var navSet=document.getElementById('mpNavSet');
if(navSet){navSet.appendChild(btn);btn.classList.add('in-nav');}
/* 取值语义（读值 / 落盘 / 生效 / 比较）全部来自注入层的唯一实现 window.__mpCfg
   （见本文件的 CFG_CORE_JS）：本脚本只管「界面」——按注册表画按钮、标出当前档、
   把点击转成 __mpCfg.store + apply。面板里不再自己判空、自己 setItem、自己设 data-theme，
   那些正是它当初与启动脚本、跨文档桥分成三份之后各自跑偏的地方。
   设置注册表（config.SETTINGS）：本脚本不认识任何具体键名，只按 kind 分派。
   新增一个可保存的设置项 = 注册表加一条 + cfg_ui 里生成按钮，这里与页面都不用改。 */
var C=window.__mpCfg,S=C.S;
function val(k){return C.val(k)}
function store(k,v){C.store(k,v)}
function apply(k,v){C.apply(k,v)}
function snapshot(){return C.snapshot()}
function mark(k){var n=box.querySelectorAll('[data-g="'+k+'"] button'),i;
for(i=0;i<n.length;i++)n[i].className=(C.eqv(n[i].getAttribute('data-v'),val(k)))?'on':'';}
function broadcast(){try{var f=document.querySelectorAll('iframe'),i,w;
 for(i=0;i<f.length;i++){w=f[i].contentWindow;if(!w)continue;
  try{w.postMessage({mp:'cfg',cfg:snapshot()},'*');}catch(e){}}}catch(e){}}
function sync(){var k;for(k in S)mark(k);}
function set(k,v){store(k,v);apply(k,v);mark(k);broadcast();}
/* 保存设置：把当前生效值按注册表逐项落盘（等于默认值的项顺手删键，避免把默认值固化）。
   有原生 Toast 就弹个准信，没有则就地改按钮文字。
   桥能力一律查 back_kit 的 window.__mpCaps（A3），**不再数 apiVersion**。 */
function saveAll(){var k;for(k in S)store(k,val(k));
try{if(window.__mpCaps&&__mpCaps.toast&&window.MoneyNative){MoneyNative.toast('设置已保存');return;}}catch(e){}
var b=box.querySelector('.mp-row[data-g="nat"] button[data-v="save"]');
if(b){var t=b.textContent;b.textContent='已保存';setTimeout(function(){b.textContent=t;},1200);}}
/* 长按「⋯」→ 原生维护菜单（导入更新包 / 重置为内置资料）：破坏性操作不进日常面板 */
function maintenance(){try{if(window.__mpCaps&&__mpCaps.openMaintenance&&window.MoneyNative)
 MoneyNative.openMaintenance();}catch(e){}}
function close(){box.classList.remove('on');btn.classList.remove('on');}
box.addEventListener('click',function(e){
var b=e.target&&e.target.closest?e.target.closest('button'):null;if(!b)return;
var g=b.parentNode.getAttribute('data-g'),v=b.getAttribute('data-v');
if(g==='nat'){var N=window.MoneyNative,CP=window.__mpCaps;if(!N)return;
if(v==='save'){saveAll();return;}                 /* 保存后不关面板，便于看反馈 */
if(v==='reload'&&(!CP||CP.reload)){try{N.reload();}catch(e){}}
close();return;}
if(S[g])set(g,v);});
var lp=null,lpDone=false;
btn.addEventListener('touchstart',function(){lpDone=false;clearTimeout(lp);
lp=setTimeout(function(){lpDone=true;maintenance();},600);});
btn.addEventListener('touchend',function(){clearTimeout(lp);});
btn.addEventListener('touchmove',function(){clearTimeout(lp);});
btn.addEventListener('click',function(e){e.stopPropagation();
if(lpDone){lpDone=false;return;}                  /* 长按已呼出维护菜单，别再顺手开关面板 */
var on=box.classList.toggle('on');btn.classList.toggle('on',on);});
document.addEventListener('click',function(e){
if(!box.classList.contains('on'))return;
if(box.contains(e.target)||btn.contains(e.target))return;close();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
/* 登记到全站返回栈（app/back_kit.py）：返回键 / Esc 都要能先退掉设置面板。
   顺序 170 —— 它浮在右上、点空白即收，比地图那些整屏浮层轻。 */
(function(){var f=window.__mpBackReg;
 if(f){f('mpCfg',170,function(){return box.classList.contains('on');},close);return;}
 (window.__mpBackQ=window.__mpBackQ||[]).push(['mpCfg',170,
   function(){return box.classList.contains('on');},close]);})();
var nat=box.querySelector('.mp-nat');
if(nat){var N2=window.MoneyNative,CP=window.__mpCaps;
 /* 这组按钮只需要 reload / toast 两个能力：按清单显示，别靠 available() 布尔盲猜；
    老壳没有清单（capabilities 未暴露）时退回 available()，与从前行为一致。 */
 var ok=!!(CP&&(CP.reload||CP.toast));
 if(!ok){try{ok=!!(N2&&N2.available&&N2.available());}catch(e){ok=false;}}
 window.__mpApi=0;try{window.__mpApi=(N2&&N2.apiVersion)?N2.apiVersion():0;}catch(e){}
 if(!ok)nat.style.display='none';}
sync();})();</script>
