<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老木匠直播文字稿 · 直播专区</title>
<style>
  :root{
    --bg:#0b1119; --bg2:#121b29; --card:#16213a; --line:#22304a;
    --tx:#e8eef7; --tx2:#9fb0c5; --tx3:#64748b; --accent:#4a9eff;
    --ai:#a78bfa; --raw:#2dd4a7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background-color:var(--bg);background-image:var(--bg-grad,radial-gradient(1200px 600px at 50% -10%,#16223a,#0b1119));
    color:var(--tx);min-height:100vh;padding:0 0 40px;line-height:1.6;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 16px;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .hd{padding:2px 0 12px;border-bottom:1px solid var(--line);}
  /* 需求#4：与门户区块标题 .sec-h .sec-t 同档（15px/600） */
  .hd h1{font-size:15px;font-weight:600;letter-spacing:.3px;}
  .hd p{font-size:12.5px;color:var(--tx3);margin-top:5px;line-height:1.7;}

  /* ⚠ top 用 `--mp-nav-h` 而不是 0：全站页面条 261116 起 fixed 常驻顶端（z-index:55），
     吸顶在 0 会被条盖住 —— 滚动后才看得出来，静态截图完全正常。 */
  .stick{position:sticky;top:var(--mp-nav-h,0);z-index:40;background:var(--header-bg,rgba(11,17,25,.92));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px;padding:9px 16px 8px;}
  .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  /* 场次下拉：组件来自注入层（app/ui_kit.py 的 .mdd 家族），这里只给容器布局与字号。
     .ctl select 那几条是「组件未生效」时的兜底（无 JS / 组件缺失），保留不删。 */
  .ctl .mdd{flex:1 1 210px;min-width:0;font-size:13px;}
  .ctl select{flex:1 1 210px;min-width:0;font-family:inherit;font-size:13px;padding:7px 9px;
    border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
  .seg button{font-family:inherit;font-size:12.5px;padding:7px 13px;border:0;cursor:pointer;
    background:transparent;color:var(--tx2);white-space:nowrap;}
  .seg button+button{border-left:1px solid var(--line);}
  .seg button.on{background:var(--accent);color:#fff;font-weight:600;}
  .seg button.on[data-v="ai"]{background:var(--ai);}
  .seg button:disabled{opacity:.35;cursor:not-allowed;}

  /* 本场模块导航（需求：标题栏跟着内容滚动 / 点击展开 / 展开后跳转）。
     原是一条横向滚动的胶囊带：一节 20 字，22 节内容宽 4905px 而可视只有 373px，
     手机上只能看到前 2 节、要横滑才找得到 —— 改成「一行当前章节 + 点击展开完整目录」。
     收起态那一行随滚动实时换成当前所在章节，即「跟着内容滚动」。 */
  .toc{position:relative;padding-top:8px;}
  .toc-btn{display:flex;align-items:center;gap:8px;width:100%;font-family:inherit;
    font-size:12.5px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--ov06,rgba(255,255,255,.06));color:var(--tx2);cursor:pointer;text-align:left;}
  .toc-btn:hover{border-color:var(--accent);color:var(--tx);}
  .toc-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);}
  .toc-btn .toc-cur{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:var(--tx);}
  .toc-btn[aria-expanded="true"] .toc-cur{color:var(--accent);}
  .toc-btn .toc-n{flex:none;font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;}
  .toc-btn .toc-ar{flex:none;font-size:9px;color:var(--tx3);transition:transform .16s;}
  .toc-btn[aria-expanded="true"] .toc-ar{transform:rotate(180deg);color:var(--accent);}
  /* 展开面板：绝对定位挂在 .stick 内，随吸顶栏一起停在顶部；限高内部滚动，不压住正文太久 */
  .toc-panel{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;
    max-height:min(52vh,380px);overflow-y:auto;overscroll-behavior:contain;padding:4px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 18px 46px rgba(0,0,0,.45);}
  .toc-panel[hidden]{display:none;}
  .toc-panel button{display:block;width:100%;text-align:left;font-family:inherit;
    font-size:12.5px;line-height:1.5;padding:8px 10px;border:0;border-radius:7px;
    background:transparent;color:var(--tx2);cursor:pointer;}
  .toc-panel button:hover{background:var(--ov06,rgba(255,255,255,.06));color:var(--tx);}
  .toc-panel button.on{background:var(--accent);color:#fff;font-weight:600;}

  .sum{margin:18px 0 4px;border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:10px;background:var(--card);padding:14px 16px;}
  .sum-h{font-size:12px;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;}
  .sum-p{font-size:13.5px;line-height:1.85;color:var(--tx);}
  .sum-p b{color:var(--accent);font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chips span{font-size:12px;color:var(--tx2);background:var(--ov06,rgba(255,255,255,.06));
    border:1px solid var(--line);padding:2px 9px;border-radius:20px;}
  .facts{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;padding-top:10px;
    border-top:1px dashed var(--line);font-size:12px;color:var(--tx3);}
  .facts b{color:var(--tx2);font-weight:600;}
  .sum-links{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;font-size:12.5px;}
  /* 命中区下限用 px：不该随字号档位一起缩（原高 16px） */
  .sum-links a{display:flex;align-items:center;min-height:26px;}

  .doc{margin-top:22px;}
  .doc h2{font-size:15.5px;font-weight:600;color:var(--tx);margin:26px 0 10px;padding-left:10px;
    border-left:3px solid var(--line);scroll-margin-top:96px;}
  .doc h2:first-child{margin-top:8px;}
  .doc p{font-size:14.5px;line-height:1.95;color:var(--tx);margin:11px 0;text-align:justify;}
  .doc ol,.doc ul{margin:11px 0 11px 22px;font-size:14.5px;line-height:1.95;}
  .doc li{margin:5px 0;}
  .empty{color:var(--tx3);font-size:13px;padding:30px 0;text-align:center;}

  .top{position:fixed;right:14px;bottom:22px;width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:var(--bg2);color:var(--tx2);font-size:15px;
    cursor:pointer;display:none;z-index:50;line-height:1;}
/* mp-uikit:start */
/* ── 自研下拉（mdd）：全站统一的原生 <select> 替代品 ──────────────────
   类名：.mdd 容器 / .mdd-btn 按钮 / .mdd-panel 面板 / .mdd-opt 选项 /
   .mdd-grp 分组标题（<optgroup> 转换）/ .mdd-native 被隐藏的原生控件。
   字号用 em，随上下文与根字号等比缩放（根字号由主题层的字号档位驱动）。 */
.mdd{position:relative;min-width:0;}
.mdd-btn{display:block;width:100%;min-width:0;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;color:var(--tx);font-family:inherit;
  font-size:1em;line-height:1.35;padding:.7em .8em;cursor:pointer;outline:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),
    linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 51%,calc(100% - 10px) 51%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:2em;}
.mdd-btn:focus,.mdd-btn[aria-expanded="true"]{border-color:var(--accent);}
/* 面板默认比按钮宽（min-width:100% + 内容自适应到 360px 上限）：
   三筛选并排时按钮只有 1/3 栏宽，不放宽则选项文字被截断（需求#5）。
   左右贴边由 JS 在展开时按视口钳一次（见 open()），窄屏也不至于溢出到屏幕外。 */
.mdd-panel{position:absolute;left:0;right:auto;top:calc(100% + 6px);z-index:60;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.4);
  min-width:100%;width:max-content;max-width:min(90vw,360px);
  max-height:min(62vh,420px);overflow:auto;overscroll-behavior:contain;padding:4px;}
.mdd-panel[hidden]{display:none;}
.mdd-grp{padding:.5em .7em .25em;font-size:.85em;color:var(--tx3);letter-spacing:.5px;}
.mdd-opt{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;
  color:var(--tx);font-family:inherit;font-size:1em;padding:.64em .8em;cursor:pointer;
  white-space:normal;overflow-wrap:anywhere;line-height:1.35;}
.mdd-opt:hover,.mdd-opt:active{background:rgba(167,139,250,.16);color:var(--accent);}
.mdd-opt[aria-selected="true"]{background:rgba(167,139,250,.22);color:var(--accent);font-weight:600;}
.mdd-opt-in{padding-left:1.6em;}
.mdd-native{position:absolute!important;width:1px!important;height:1px!important;
  margin:0!important;padding:0!important;border:0!important;opacity:0;pointer-events:none;}
html.mp-hide-bar-live [data-mp-hide="bar-live"]{display:none!important}
/* mp-uikit:end *//* mp-nav:start */
/* ── 全站页面条（mp-nav）：← 门户 + 面包屑 + 同级入口 ────────────────
   唯一实现。配色只用主题令牌并给兜底链，因此三套主题、地图深色画布、
   以及自带浅色令牌的手写研报页（中远海控 / 京东方系列）都成立。
   兜底链为什么是「令牌 A → 令牌 B → currentColor」：全站标准令牌是
   --tx/--tx2（投资者页、直播页、量化页、地图页），但那几张手写研报页
   用的是 --ink/--sub，且不定义 --tx/--tx2 —— 只写暗色兜底会让面包屑
   当前页与同级入口在它的白底上糊成一片（260922 实测，见处理报告）。
   字号用 rem 锚定根字号、不继承所在页 body 字号（原写 .92em，条高会跟着
   各页 body 的 font-size 变：我的页 body 14px → 条 33px，其余页 16px → 38px，
   同一条界面出现两种厚度，261116 截图对比抓到）。乘 --mp-fs 保留 App 字号
   档位联动（无该变量时回落 1，离线单开就是定尺）。右侧留白由 App 注入层的
   html.mp-app 开关，离线单开不留白。 */
/* ★ 条高作为**变量**公布，并且**条自己也读它** —— 这是唯一真相源。
   页面要用「条下沿」定位时（地图页的 #map / #ui 从条下面开始，否则绝对定位的容器
   会把条盖住）读同一个 `--mp-nav-h`。
   ⚠ 为什么不让 height 用 em 自算、变量再抄一份结果：那样两处会**静默漂移**
   （改了 em 忘改变量 → 地图让位错位，且没有任何报错）。现在 height 就是变量，
   数值与条的实际高度在物理上不可能不一致。字号仍单独写，只管文字大小。
   ⚠ 唯一的例外是 --mp-fs 极小时 min-height:28px 触底，此时实际高度取 28px ——
   真实使用档位（0.8~1.5）都远高于它，不会碰到。 */
:root{--mp-nav-h:calc(2.392rem*var(--mp-fs,1));}
/* 固定头的标准配套：页内锚点跳转要避开条，否则目标行落在条底下看不见。
   261116 加 —— 条在流里时没这个问题（条会跟着滚走），改成 fixed 之后必须有。 */
html{scroll-padding-top:var(--mp-nav-h,0);}
.mp-nav{position:fixed;top:0;left:0;right:0;
  /* ★★ 为什么要 fixed：条在文档流里时，**任何页面自己的 body padding 都会推它**
     （我的页被缩进 16px + 下压 20px、量化页 top:36 left:20），于是"全站统一"变成
     "逐页手工对齐"，新加页面照样踩，而且只有肉眼比截图才看得出来（261116）。
     fixed 之后条相对视口定位，页面 padding 再怎么改都动不了它，宽度也不受 body 左右留白影响。
     ⚠ z-index 取 55：高过地图浮层（45）、页面自己的吸顶控件（6/20/40），
       低于底部模块栏（60）、就地编辑栏（70）与 App 的「⋯」（1000/1001）——
       260922 那次 `z-index:99990` 把设置按钮压死的教训，就是别把自己放到 App 界面层之上。 */
  z-index:55;
  display:flex;align-items:center;gap:.55em;flex-wrap:nowrap;
  flex:0 0 auto;                     /* 地图页 body 是 flex 列，别被压扁 */
  /* 单行定高（≈38px，全站同一厚度）：**高度必须与所在页 body 字号无关**，
     否则「我的」（body 14px）是 33px、其余页（16px）是 38px，同一条界面两种
     厚度（261116 实测）。font-size 用 rem 锚根字号、不继承 body；height 直接读
     `--mp-nav-h`（见上方说明：让条高与"别人以为的条高"在物理上不可能不一致）。
     此前用 flex-wrap:wrap + 同级入口自动换行，390px 下 6 张手写研报页被撑到
     66~88px（同级入口多达 9 个），是其它页的 2~2.6 倍；且同级入口那个
     横向滚动容器会把所在行撑高近一倍。改为「永不换行 + 同级入口自己横向滑」。 */
  height:var(--mp-nav-h);min-height:28px;box-sizing:border-box;overflow:hidden;
  padding:.3em 1em;
  background:var(--card,#141b26);
  border-bottom:1px solid var(--line,#243352);
  font-size:calc(.92rem*var(--mp-fs,1));line-height:1.5;
  color:var(--tx2,var(--sub,var(--tx,currentColor)));}
/* 让位块：条脱离文档流之后，内容必须由它推下去，否则整页被压住一个条高。
   用**空块**而不是 `body{padding-top}`：body 的 padding 是各页自己的排版财产
   （左右留白也写在同一条简写里），覆盖它等于替人家改版式；空块只吃纵向、
   不碰任何既有样式，而且各页原有 padding 照样生效 —— 内容的绝对位置与改造前完全一致。 */
.mp-nav-gap{height:var(--mp-nav-h);flex:0 0 auto;pointer-events:none;}
/* min-height 用 px 是有意的：命中区下限不该随「字号档位」一起缩小，
   否则选「小」档时本条的链接会掉到 22px（260922 体检 P2⑥ 实测）。 */
.mp-nav a{color:var(--accent,var(--blue,currentColor));text-decoration:none;white-space:nowrap;
  display:inline-flex;align-items:center;min-height:26px;padding:0 .15em;border-radius:6px;}
.mp-nav a:hover{text-decoration:underline;}
.mp-nav a.mp-nav-home{font-weight:600;flex:0 0 auto;}
.mp-nav .mp-nav-sep{color:var(--line,currentColor);opacity:.9;flex:0 0 auto;}
/* 面包屑：可收缩 + 自身横向滚动（与同级入口同一套做法）。
   原先写 `flex:0 0 auto`（不收缩、也不滚动）——本意是「末段是当前页自己，截掉就没信息」，
   但条本身 `overflow:hidden`，于是窄屏 + 长标题 + 特大/超大字号时整段被**静默裁掉**，
   且没有任何办法看到（260922-10 实测：可转债页 390px 视口下 crumb 宽 493px，右侧超出 235px）。
   改成与 .mp-nav-sib 一致：能缩、缩不下就自己横滑，既不撑高条、也不丢内容。 */
.mp-nav .mp-nav-crumb{display:flex;align-items:center;gap:.4em;white-space:nowrap;
  flex:0 1 auto;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;}
.mp-nav .mp-nav-crumb::-webkit-scrollbar{display:none;}
.mp-nav .mp-nav-crumb i{font-style:normal;color:var(--line,currentColor);opacity:.9;}
.mp-nav .mp-nav-crumb b{font-weight:500;color:var(--tx,var(--ink,currentColor));}
/* 同级入口可能多达 9 个：可收缩 + 自身横向滚动，永不带高整条 */
.mp-nav .mp-nav-sib{margin-left:auto;display:flex;align-items:center;gap:.7em;white-space:nowrap;
  flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;}
.mp-nav .mp-nav-sib::-webkit-scrollbar{display:none;}
.mp-nav .mp-nav-sib a{color:var(--tx2,var(--sub,var(--tx,currentColor)));}
.mp-nav .mp-nav-sib a:hover{color:var(--accent,var(--blue,currentColor));}
/* App 内右上角有固定的「⋯」设置按钮（32×32 + 8px 边距）：给整条让出右侧空间，
   否则宽屏下同级入口会钻到按钮底下（260922 体检 P0① 的同类问题，这里按构造避开）。 */
html.mp-app .mp-nav{padding-right:52px;}
/* mp-nav:end */</style>
<script id="mp-uikit-js">
/* ── 自研下拉控制器（mdd）：渐进增强，原生 <select> 仍是真值源 ────────
   head 期同步套用已保存的开关类（避免首屏闪一下再隐藏）；
   DOMContentLoaded 后把每个 <select> 包成 .mdd（跳过 multiple/size>1，
      可用 data-mdd="off" 单独退出）；
   事件全部委托在 document 上，动态插入的控件无需重新绑定。 */
(function(){
var R=document.documentElement,S={"theme":{"kind":"theme","default":"light"},"fs":{"kind":"fs","default":"1.0"},"edit":{"kind":"edit","default":"off"},"bar-live":{"kind":"toggle","default":"on"}};
for(var k in S){
  if(!S[k]||S[k].kind!=='toggle')continue;
  var v='';try{v=localStorage.getItem('mp:'+k)||'';}catch(e){}
  if((v||S[k].default)==='off')R.classList.add('mp-hide-'+k);
}
if(window.__mpUikit)return;
window.__mpUikit=1;
function one(s,r){return (r||document).querySelector(s);}
function all(s,r){return [].slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function trim(s){return String(s==null?'':s).replace(/^\s+|\s+$/g,'');}

/* 把原生控件当前选项的文案写到按钮上（程序化改 .value 也能同步，见 hook） */
function sync(sel){
  var box=sel&&sel.__mdd;if(!box)return;
  var btn=one('.mdd-btn',box);if(!btn)return;
  var o=sel.options[sel.selectedIndex];
  btn.textContent=o?trim(o.textContent):trim(sel.getAttribute('aria-label')||'');
}
/* 每次展开时按原生控件的当前选项重建面板 → 页面动态改选项也永远同步 */
function fill(sel){
  var box=sel.__mdd,panel=one('.mdd-panel',box),h='';
  function opt(o,ind){
    var s=(o.value===sel.value)?' aria-selected="true"':'';
    return '<button type="button" class="mdd-opt'+(ind?' mdd-opt-in':'')+'" data-v="'
      +esc(o.value)+'"'+s+'>'+esc(trim(o.textContent))+'</button>';
  }
  all('option,optgroup',sel).forEach(function(n){
    if(n.tagName==='OPTGROUP'){
      h+='<div class="mdd-grp">'+esc(n.getAttribute('label')||'')+'</div>';
      all('option',n).forEach(function(o){h+=opt(o,true);});
    }else if(n.parentNode===sel){h+=opt(n,false);}
  });

私募。你知道吗？\n\n我其实还特别想让他去上海，去那些私募找个地方先熟悉一下、了解一下私募的运作，去找个私募去干个一两年，你不要工资，我给他开工资，主要是学习。\n\n不是，你没议论我，我是说你跟那些说话非常难听的人在那唱（和）本身就没有什么意义。我知道你没议论我，你要议论我的话我就给你拉黑了。我要告诉你的是，你没有必要去跟他们去掰扯这事儿，你知道不？ 有啥意义？你有那时间去考虑考虑怎么赚钱，怎么能在今天、在四季度的这个市况下怎么能占点便宜，怎么在他们一天亏得愁眉苦脸的时候你能占点便宜。你没看现在又开始要救市了吗？又开座谈会了吗？你就说明白，这现在有的人已经亏得不像样了，你以为呢？\n\n## 四、赚下跌的钱：公募漂移回归与AI虹吸\n\n这周还有一件大事儿，就是那个公募基金的那个漂移问题。这个事儿如果出台定死了哪天他就会有一个最后期限，那么把那些漂移的问题解决，一旦定死、加大严查力度，那么就会出现一个问题：你飘出去的就得飘回来。 你飘出去的就得往回飘，往回飘这个过程就便宜可占，你明白不？\n\n这两天李录给你讲的东西，你们不是给这么多人给我推荐李录？你们谁看了？我告诉你我都没看全文。但是李录他说的话，主要的一个有不少人摘要，我一看我就知道他在想什么。他说的就是科技股AI 人工智能是人类一次伟大的技术革命，它会吸引大量的资金，那么由于这些大量的资金都去投资到这个 AI 人工智能方面，那一定会有一些其他的股票显露出了他在历史上少有的投资价值。 明白不明白？他说的是这件事儿。\n\n这跟 A 股是一样的没有 AI 人工智能、没有国家队的这些减持，你今年上半年这种历史上少有的投资价值能出现吗？ 你在骂国家队减持的时候、骂这个含客量的时候，你想一想，这种情况你怎么能占便宜？你应该想的是这件事儿，不是去跟着骂这些东西、骂合不合理，那是跟你有啥关系啊？\n\n正是由于 AI 人工智能把所有的活跃资金都吸引走了那他才会给其他的优质的股票提供了一个最好的买入机会。那是千载难逢的，科技革命是千载难逢的，他们显露出来的非科技革命领域里面的优秀股票的投资机会也是千载难逢的。 这道理很难理解吗？不难理解吧？\n\n对呀，四千点你买两千点的股票，那不很简单吗？这道理多简单啊。那些股票优秀的都不知道优秀到啥程度了，全世界只有他一个供应商，他是最牛逼的一个企业。结果这估值现在到美国连个小公司都算不上。你以为这种机会会总有吗资金不是傻子。等 AI 人工智能炒到没法炒的程度的时候，它自然就会寻找其他的可投资的优秀标的。\n\nAI 人工智能这些东西我不懂我不知道该投哪个，我也不了解这些热点，所以我不懂我不碰。但是我懂的东西我知道有些东西是由于被他们资金虹吸了，那我这个东西就是千载难逢的投资机会。那我就搁那旁边等着就完了，我买完我就等着，我就等这帮回来就完了。 他能把人工智能炒到天上去啊？\n\n别提个股，也别暗示个股，你说那都不对。什么绿皮白皮的那不对啊。你自己的想法不用在这里面打。你们要老这么说这些个股，在这里面我就更不敢说话了，我是更不敢说了。\n\n我有的时候也可以提到个股那是是以讲逻辑的模式给你们举例子说，给你讲一讲说我得举个例子说在这股票上发生的事情，我给你讲。 就像我昨天给你们讲的说波动的魅力是啥？那你当年高点卖出的时候，你现在再买回来，和原来买出来股票的数不一样，它不光是说你那个钱数的问题。昨天有人看到那个帖子没有？我给大家讲波动的魅力，后来我就删了，因为它涉及到个股。我就拿个客户举个例子，你这大家就搁那开始那什么、这都开始研究了。所以没看到就对了，就删了吧。\n\n核电的范围太窄了，你电力的都可以，但是核电呢就是……我都讲过八百遍核电了，都不想讲。昨天我看了一下我那个收益的状况，我赚钱第三多的、第四多的好像就是核电，今年。但现在我已经不持有。\n\n没啥波动，波动大了，没啥波动。你要知道你所谓的波动你们关注的都是向上的波动。我所关注的波动，我早就给你们讲过了，下跌也能赚钱，知道吧？股票下跌也能赚钱。 你总是盯着这股票必须得上涨，我告诉你下跌赚钱还赚得更快。下跌就是给你提供机会关键的问题你得不能随着他一起跌下来，这是关键。而且到底下的时候你得再买进去，你得敢买，就是跌到底的时候你得敢买，涨到底的时候你得敢卖。 然后你既不敢买也不敢卖，你就死守着，你告诉（自己）我就是长期价值投资，那我就没招了。\n\n下跌赚钱那就等着呗，你等着他到时候出现这种大幅下跌的时候，出现那种流动性有紧张的时候，你所有的股票都下跌的时候，你到时候买进去等着就行了呗。哪年没有这机会呀二零二四年四月份、二零二五年五月份，哪年没有这机会？那跌的时候到时候都跌得你都谁都不想买股票了。今年的六月份也一样啊。\n\n就是我减仓、我卖融资，那时候我减仓的时候那时候股票跌得也都很低，但是我那时候减仓是因为我怕它继续下跌我他妈就被平仓了。那其实我减仓的点就是最低点，那个也无所谓。\n\n现在说那我不能指导你投资，你不能这么问我话，你这问我话这不是我——我要跟你说我说现在是好时机，那你就去买了，亏了你怨我；我说现在不是好时机你再等两天，错过了你还怨我。你挣钱的时候你肯定不感谢我，你亏钱肯定想起我来。\n\n## 五、格栅理论：自我降维与\"赚差价靠选择\"\n\n大家看昨天那个专家座谈会，找一些专家去。你要记住，开这种专家座谈会，不是说让专家真说啥，就是借着专家的嘴说点事儿，你知道吧？ 你可千万别以为什么，我们一开座谈会就要征求专家意见了。征求专家意见那早就征求了，不用开座谈会。没开座谈会那时候就已经开始征求专家意见了。等到开专家座谈会的时候，那是为了让专家来演，你知道吗？ 你们都明白不明白这个道理？\n\n就不能再说多，又给我抬走了，这都是敏感词嘛。是让专家来演，用专家的这个座谈会的名义来把这个事儿要说的事儿给你说了，你知道吗？ 不是说专家没起作用，专家起作用了，但是不是在这次座谈会上起的作用，你得懂这个道理。专家现在提的东西都已经是定完的了。\n\n那你看一看那个专家座谈会最后\"与会专家普遍认为\"后边那一大段话，你把每一个字都给我背下来。你看那个专家认为那一大段话，你看提没提到科技股？你别说含客量了，连科技股都没提，你知道不？还提没提我们这个资本市场要为新质生产力服务？还提不提要提高我们上市的含客量？还提不提？\n\n所以那个十一期间我就告诉大家，我说你们去看一看那十篇文章，我说它是一种纠偏。还有人跟我讲说那第一篇就是新质生产力。那你没注意没提到那什么吗？什么芯片、AI、人工智能、什么国产替代的事都没提吗？\n\n我给你讲，实质上这个东西还很重要，那当然科技当然是、新质生产力当然非常重要，你这前两天那个国务院还才发的。新质生产力重要是一回事让全部的资本市场为新质生产力这种风险投资去买单是另外一回事。 大家懂不懂这道理？\n\n我以前就给大家讲了我说你这么干的话，你就相当于让全民进行风险投资，我给大家说过没有？有没有人记得过这话？ 新质生产力当然是应该发展的，这还用说吗？这都连说都不用说。国家当然需要大力发展新质生产力，卡脖子的工程继续需要解决，国产替代的问题继续需要解决，这都不用想，这当然是国家的大政方针，这是一个问题。但是这个问题需要二级市场上的散户投资者为这个事把二级散户的投资者作为一级市场的风险投资者吗？\n\n你如果散户现在都成为一级市场的类似于风险投资者，那我告诉你，如果一旦这个东西下来的时候、所有的散户都亏钱的时候，我告诉你所面临的熊市会更长。 那你现在你这种模式你怎么解决？说为了让人民群众提高财产性收入，这个基本方针你怎么解决？你都让他去追逐那些科技股热闹的概念，那些公司连赚钱都不赚钱，有的很多都是亏损的，你要那些所有的人都去买那东西的话，我问你你财产性收入怎么增加？\n\n这种东西出来的时候一定有人有意见，就这个博弈的结果，你以为呢？ 你搁那一直提，好，你把这个科技都干上去了，所以现在这个市场科技把所有的这个资金都虹吸了。大型国央企历史上的这个估值就是最低的。那我问你，你现在到底是在让国家买单还是让老百姓买单？ 你有没有算过你这一次发动的这个科技牛市所导致的国央企的这个资产缩水？你考虑没？这是代价不？\n\n你一方面让国央企去搞市值管理，你一方面天天提其他的股票都不行、必须得提高含客量。你提高含客量这种东西的问题在哪？是作为一个监管层是不该提的。 你作为监管层，不能对你下边的股票分三六九等，你知道的。监管层唯一需要做的是制度你要搞的是谁弄虚作假我就收拾谁，谁操纵股票就收拾谁。你不能说把我这个市场里头先分出来这个是重点要扶持的、那个给我打压，那不行，你知道吧？你这不是监管层该干的事儿，明白吗？\n\n没啥这东西，反正你就得有问题解决问题呗，那咋整。没事儿大家别担心，没事儿。不说这个问题了，那就是……我告我的意思是告诉大家，我从来没有情绪，这问题啊我告诉你，我和你们想的不一样。需要这个这个是需要的，但是到一定程度你就不能把它发展到极端，明白不？你发展到极端的时候别人就有意见了，你损害了别人的利益呀。\n\n你现在按照现在的股票市场，那些随便搞个科技股的那些连钱一分钱都没挣过的那些人的现在的财富值，可以收购很多大型央企。我问你，这是我们要追求的目标吗？大家想一想。你这个股市是干啥的做价值发现的。那你现在发现了好，一个生产芯片的公司一天都没盈利过，他的现在的市值可以收购大型的央企。那我问你，这是不是我们需要的？ 那你这个股市的价值发现就这么发现呢？你就发现了说大型国企两个他妈的，不赚钱的那个民企的芯片股、那个没挣过钱的都不如，你是不是发现成这个功能了？这是市场的正确评价不？\n\n美国就是——美国是啥呀？美国哪个制造业的公司能跟中国的央企 PK 呀？你告诉我。 这哪个的制造业？你说那美国，美国造个船，那中船要和美国那船舶比的话，他全美国的造船厂他都比不了中船，他都比不了中船的一部分。他跟什么比呀？美国跟啥比呀？美国的传统产业还跟我们比啥？在哪个地方能比得了？你告诉我。 就他们美国那点什么有色公司，一年才生产多少东西？那他铝业公司还搁那上市呢，他的铝业公司都不够咱们一个小铝厂的那产量。\n\n我不合作啊，不用给我发这个东西，我不合作，我跟谁都不合作。我也不明白咋合作，你们说那合作办法我也不懂，我就是我这个人就是个硬讲。你流量包啥的老告诉我什么流量包就作废多少流量包，我这流量包从来也没用，也不知道怎么用，不明白，你问我就给我问糊涂了，什么合作啥的。我的特点就是硬壳就是硬唠啊，就是唠嗑，就是硬汉，你知道不？就是硬唠，没有技巧，靠的就是能唠嗑。\n\n所以说你看大家，你别光看热闹，完了一说就情绪上来了。你别老有情绪，你老有情绪干啥？你现在想一想，你就是昨天的那个座谈会，你现在想一想，有些东西是不是就有机会就快来了？你应该想的是这件事儿，别老整的没用的，又这个那个的。\n\n我看昨天前那这几天有那个一大堆的自媒体，下边那个评价上，哎呦都是那种什么\"你要做耐心资本结果咋咋咋你先卖了什么\"，我他扯这犊子你。卖的时候不是机会吗？ 现在人都卖完了你再买都买不着了，你再抢他开始攒了。卖便宜的时候你没买，你竟天天骂街来。\n\n我就等着我等到我那个东西回到他原来卖之前的那个价格，我就给他，我就全卖给他们我就不要了，我就挣这个下跌的钱，明白没？ 因为为什么说你怎么挣下跌的钱呢？我就挣这个下跌的钱，因为这个下跌我知道他是在干啥、是谁让他下跌的。当这个下跌的因素没了它自然慢慢地就恢复到原来的价格了。等到恢复到原来的价格，一定有一大堆人给你讲故事，你知道吗？那时候给你讲故事的人都老多了。\n\n我今天引了这么多我以前的那个帖子，昨天到今天我引了好多那个帖子，我那都是二零二二年写的。现在一大堆人天天给我讲什么美国不能加息又什么美联储的这个什么美国的这个通货膨胀解决债务问题，我说你这词儿都是我四年前都讲过了。 现在你给我讲那个我都懒得讲，但是我一说，我要不讲的话，人说那你也没有逻辑。我跟你讲啥逻辑我操？你说这玩意儿对我来说都是我的事。我现在怀疑有其他地方的主播都是跟我学的。\n\n我有好多帖子我跟你讲我都删掉了，找不着了。这你得问他那个谁那个部长，不是，不长的。你说的都对，他应该有很多。因为有一段时间我把所有涉及到、只要涉及到个股的帖子我就全删了。所以那里头有一些内容他实际上不是讲个股的，只是带了一嘴，我也都删了。 有些写得好的帖子，我现在搜一搜我自己的我也找不着了，不知道哪去了。\n\n不等啊，说不等星辰大海等啥？星辰大海。我不用等星辰大海，等星辰大海的人是等星辰大海的人，我是用不着，我就赚下跌的钱。 不老肉这下跌怎么赚钱？那下跌就能赚钱。你非理性的下跌那李录现在给你讲的就是如何赚下跌的钱，你知道吗？人家给你讲的已经非常非常明确了。\n\nAI 人工智能是一次历史上的伟大的变革，他需要大量的资金投入，而在这个投入的过程中他一定会虹吸其他领域的资金那么这样就使得有一些非常优秀的公司出现了非常好的买入机会，这就叫做赚下跌的钱。 这都不叫误杀，他是没办法。那有人就是发现了更好的机会，就去做更好的机会了。但是你不了解那更好的机会在哪儿你只知道说我这个机会是非常确定的，但是他们现在把这个确定的机会抛弃了，那现在我就买入这些我特别了解的、非常确定的机会，然后我就等着就完了。\n\n我跟你讲，甚至他最终他不来都无所谓，我到现在这红利就足够，明白不明白这道理？哎呀我讲这个东西都很难懂吗？我那天说你——叔你看看李录，我看一眼李录我就知道他跟我讲的一样，他跟我说这是一样的东西。\n\n你放心，他一定会回。我只是说给你说一个最悲观的，说即便他不回来，就它永远也不涨上去了、它下跌下来永远也不回去了，我告诉你在这个位置我吃股息也足够。但是我告诉你你放心，他一定会回去的。这就像当年格雷厄姆被美国那个参议院叫去给那个作证的时候说你说价值投资在低点买入的时候最终它一定会回归，那你告诉我如果他一直不回归你怎么办？ 这是当年美国参议院要求格雷厄姆去国会作证的时候，一个参议员问的一个问题。格雷厄姆说我不知道他会不会回归但是根据我的经验最终他都回归了，这就是我们这个行业的迷人的和特殊的地方。 大意如此啊，原话你们自己去找。\n\n格雷厄姆说的就是我不知道，我也不知道他会不会一定回归，但是根据我的经验最终都回归了。但是你说他究竟为啥，我也不知道，这就是我们这个行业奇妙的地方。 换句话说就是：低点的时候一定没有人买，等到高点的时候……那他一定能不能回到高点？他一定能回到高点，只要他被低估了，他一定会恢复估值的。那能不能永远不恢复？能，但是历史上没有出现过，历史上最后估值都恢复了。\n\n关于这个问题我曾经两三年前我专门写过雪球的帖子。我跟你讲，格雷厄姆在这个地方实际上没有说全话，当时我专门写过一个帖子分析这句话。格雷厄姆并没有好意思说接下来的话这是我分析的：格雷厄姆心里是知道的，为什么一定会回归？ 因为总的来说在他那个年代跟我们现在差不多，总的来说机构投资者是靠赚差价来赚钱的。当一个行业炒到高点的时候他已经不可能再产生差价了，那么他就会寻找其他的差价来做。 明白不？他不会说我炒到珠穆朗玛峰了，我再在珠穆朗玛峰上架梯子、再砌墙再往上走，不可能，我告诉你，因为成本越来越高。\n\n所以怎么办呢好，最好的办法是从他们山峰下来，找个坑重新玩，明白不？所以我告诉你，坑（机会）就是这么来的。 所以为什么他一定会均值回归呢？因为他必须得，那些聪明资金必须得重新找个标的玩儿，你要不然你怎么能出现差价呢？来，听懂的给我扣波一来。你炒得越高最后维持高价的成本就越高。你要知道你那里头有多少人跟你搭车赚钱的，你不是应该找到一个普遍都亏钱的一个标的重新开始玩吗？每一个跟着你搭车把钱赚走的人，就是你做局的人的成本，要不然他那个钱从谁手里出的呀？\n\n来，送点人气票来，点点赞，粉丝灯牌儿，电池。天天给你们讲这点破事。\n\n你们要是我的老粉丝的话就知道，我当年和雪月霜在争论这事儿的时候——就像现在我和雪月霜现在没什么争论了——那现在有些那个小博主，最近一两年进来的，搁那写那个分析公司的基本面，每次都给自己打气儿说，其实市场的涨跌跟公司的基本面没有任何关系。公司总的来说还是应该由他所获得的利润的能力来决定的价值。这话说的一点都没错这话说的一点都没错。这就是我专门以前写过一个文章，你这么做股票的话，这个叫做自我降维，你知道吗？\n\n他原本是一个由资金情绪宏观微观、这个周期所处的位置等等若干因素所组成的，最终影响人的决策、然后靠博弈获得的价格，你却非要把所有的东西都简化掉，只剩下一个公司的基本面。我告诉你你这叫做自我降维。 你叫自我降维。你这不是投资股票的做法，你这是干实业的做法。 你假如说你现在是一个工厂的厂长，你开个公司，公司是你自己的，你这么想是没有问题的，因为你是经营公司的，当然你只能靠公司的收益来赚钱。\n\n哪个经营公司的老板会把今天的股票卖出去、明天再买回来？有几个人会这么做？那是经营公司，那不成炒自己家股票了吗？那当然他得注重基本面。但是你不是啊你今天玩老张家，明天玩老李家，你哪个公司基本面跟你有啥关系？哪个公司他不能有差价就玩哪个。你找的股票永远是啥？不是基本面最好的，而是价格和价值错配的，你一定要知道这一点。 不是那个公司最好，那个公司最好如果价格已经充分反应了，他对你来说就是没有意义的。他对公司的老板是有意义的，对你没有意义。\n\n你的优势——对于你和做实业的人我问你，你一个公司的老板你能比他还了解这公司的基本面不？ 大家想一想，就我现在是这公司老板，我现在是个上市公司、我是公司老板董事长总经理，你能比我还了解这公司的基本面吗？你不能吧。那你的优势就不在于了解公司的基本面知道吗？因为有的是人比你了解。你比他总会计师更了解吗？你比他董事会里的人更了解吗？这都不是你的优势。\n\n你的优势是啥你的优势是选择，你可以用脚投票。你忘了你炒股票你是可以用脚投票的，你却把自己脚砍了，我只能用手投票。 我告诉你有的人只能用手投票，就像公司董事会高管只能用手投票，因为他减持都不行，他都有限制，你知道吗？他买卖公司股票他是有限制的。你也有限制吗？这就叫自我降维，明白不？\n\n我做这些年股票，任何一个公司的董事会我都不会去参加——不是董事会，就是股东大会我都不会去参加，任何一个公司。这什么给公司建言献策、还什么投票，我们要一起投票反对他这件事儿。我跟你讲我如果需要投票反对某一公司某一件事的时候，那我就干脆我这一个最简单的办法，就把这公司卖了，你知道不？ 还有人给公司建言献策，你这公司应该这么经营、那应该那么经营，你们真的把自己都当经营公司的了。\n\n你一定要记住你的优势你的优势是选择，明白不？做股票的优势是选择，而不是经营公司，经营公司比你能耐的人多了。 而且选择也不是选择经营的最好的公司，你作为炒股票的人，你选择的是价格和价值的错配，我再说一遍，是价格和价值的错配。一个烂公司可能是一个好标的如果它烂的程度、那个股票跌的程度比它烂的程度更严重的话，那么买入一个烂公司也是一个好投资。 如果一个好公司它的价格过高，就像以前的高端白酒，那高端白酒不是好公司吗？但是他价格太高了。你选择的不是这种东西，不是哪个公司更好，是选择哪个公司被标错了价格。\n\n我发现我把这些基本的概念跟有些人说明白都很难。那小博主更给你犟：那不应该看公司的最基本面吗？哎呦我的妈。公司的基本面不过就是股票的一个外在包装的一个组成部分而已。\n\n我告诉你，长期看基本面生存下来的人，多多少少都有运气成分。 我就告诉你，玩不迟疑、有一只股一动不动、说我就是看基本面我就坚信这公司，我告诉你最终他赚大钱都是因为运气。这种人我跟你说，那这层出不穷，时代造成的。二一年之前所有晒白龙马的人，哪个不是看基本面？你告诉我哪个不是看基本面？那当时在茅台投资了名人多了去了。二一年之前投房地产的人一大批人，说我买过我就没动过。大家还记得万科里面的刘元生吗？现在还记得不记得这个人？听没听过？哪个不是研究的基本面？哪个一说基本面不是头头是道？\n\n刘元生你们都不知道，那你就太年轻了。万科最早成立的时候有一个香港的富商给万科投过一笔钱，其实很少，只有几百万港币，后来这个人由于他一直持股一直没卖，后来他的这个在万科里面的股份后来涨到了好几十亿。所以很多人就拿这个事儿当宣传，所以你看，最好的投资模式赚大钱的就是只有一只股票一直不动。 茅台里头一堆人这样的，片仔癀里头一堆这样的人。大家都知道的我就不提，咱不提个人啊。\n\n那我问你，那些人的分析能力比今天持有矿茅的这些人的分析能力差吗？你给我讲一讲。 现在我跟矿茅的人说，我说我告诉你这种投资模式是因为运气，然后他说那不对，我说你看啊，茅台是不是因为运气？二一年之后那你分析所有东西都对了，为啥二一年之后它就跌了呢？五粮液为啥跌了呢？他说那不是，茅台是茅台，五粮液是五粮液，但是矿茅不一样。大家听没听过这样的说法？\n\n我现在并不看空有色金属，我跟你说这话你们千万别误解啊，我不看空有色金属。我只是告诉你，你不要把自己骗了，你要是把自己骗了你就相当于自己在降维。 你就相当于我那些东西我都不看，我就现在我就看我这一个，那你是因为运气，你知道吗？\n\n当有五个因素决定一个物体的状态的时候，比如说它是一个五元函数，对吧？这个五元函数它有五个自变量，然后他才能决定这物体的状态。好了，那你其中有三个因素你根本不看的话，你只看其中的两个因素，那这两个因素决定的这个物体的状态是不是处在概率化的？你用这两个因素如果判断这个物体的状态，我告诉你你最好即使是对了，是因为你的运气好，明白不明白这个道理？ 这个不难理解吧？\n\n其实这其实是爱因斯坦反对量子力学的一个最基础的逻辑。当年爱因斯坦说世界的存在不应该是概率化的，它应该是决定性的。你之所以现在发现这些粒子他处在一种概率化的分布，是因为你没有掌握所有决定它的状态的因素。 这话可能听起来你得有一定的数学基础能听懂我现在说的话。所以爱因斯坦终其一生他是不同意\"上帝不掷骰子\"这个，他是不同意。\n\n而现在的物理学，已经彻底抛弃了当年的那个纯粹决定论，就是说现在已经认为分布的这个规律性就是世界的本来面目。 它不存在着所有的因素都决定完了以后最后你还能完全决定他一个状态，是做不到的。这是由世界的本源来决定的，而不是说我们没有掌握某一个函数、没有掌握某一个自变量。\n\n这个东西用在这就是我跟你们说的格栅理论。就是说你要学过广义相对论这一段、爱因斯坦这个关于相对论这一段问题的这个思考，你要理解这个降维的问题就很容易，你知道吗？这就是芒格说的格栅理论就用其他的学科去理解这个问题的时候，那个学科里面有一个现成的东西让你理解这个东西非常快。 所以他为什么让你去看不同的学科的书呢？你这个学科里你反复挣扎的事儿你也整不明白但是那个学科里面早有一个定论给你解决这个问题。\n\n所以说你了解不同的学科，你对同样一个问题的理解就会比别人不一样，这就是我为什么经常会给大家说我给你举个例子你马上你就明白。 这跟我个人的知识的这个结构比较复杂也有很大的关系。想夸我的现在就夸吧，说我长得最帅。是不是这样？我给你们讲那个、给你们举例子，我随便举个例子，你们觉得特别特别贴切。我随便给你举个例子，你马上你就明白。因为我看的书也比较杂，就像我今天跟你讲这个事儿似的。\n\n你都已经自我降维了，你取得的成果难道没有运气因素吗？当年的长春高新的老太太忘了密码，从五万块钱变成五百万，那时候人拿都拿这个故事当成\"你看你一直持有一只股票就可以赚大钱\"。现在长春高新多少钱了？\n\n我说这些东西都不涉及到看空看多个股的问题，我只是给你举个例子。 我给你讲，我看多任何一只股票的时候，我也不会像他们那样，我准备星辰大海了。以后在那个会员直播里我会给大家讲那个约翰·涅夫说的一句重要的话，就是我会讲那个约翰·涅夫那个成功投资，约翰·涅夫里面有一句重要的话，他投资的几个原则，有一句非常重要的，就是我们买入股票是为了卖出。你们会不会有的人现在听完这句话天都要塌了？最近这些年人少了，你要二一年之前说我买入股票就为了卖出，那你就是个亏货。真正的买入股票赚大钱的人就是买入就不动。\n\n巴菲特也是啥呀？你告诉我巴菲特也是啥？巴菲特买入是为了持有啊。我相信巴菲特说过买入是为了持有，但是他不是真正的自己要买入为了持有，而是他告诉你买入是为了持有，这是真的。以后专门给大家讲一期你和巴菲特的区别，专门给你讲一期，我原来写过帖子。 我那帖子我那天拿出来我看一眼，\"你和巴菲特之间的区别\"。我现在还能记住几句。\n\n你和巴菲特的第一个区别是巴菲特的父亲是参议员，美国的参议员；你的父亲是个普通人。巴菲特很小的时候就已经认识格雷厄姆了，你做不到。 格雷厄姆当年是美国最牛逼的投资人，他就可以上他的办公室去玩了，你做不到。巴菲特娶的媳妇是内布拉斯加州的选美冠军，相当于一个省的选美冠军，你觉得你行不？ 巴菲特的第一笔私募基金来自于他的姑妈和他的邻居然后他就以此作为职业投资的生涯的开始。我问你，你的姑妈和你的邻居能给你凑够足够的钱开一支私募不？你有没有那么有钱的姑妈？\n\n动不动拿巴菲特比。你看你和巴菲特的区别还真不是一个有钱的姑妈，主要是有一个有没有一个省选美冠军的老婆的区别。别吹了，就你们搁这，我这听课的人没有一个人能娶得起省选美冠军的老婆。你们哪个人的媳妇儿是曾经当过省的选美冠军？哎呀啥都要跟巴菲特比。\n\n巴菲特的老婆后来出轨了，这段时间吧这个就是一个非常那个花边新闻的东西，人家不爱提，咱也不能老提这事儿。后来巴菲特的老婆出轨了以后就给他找了一个人，他原来的老婆叫苏菲，苏菲后来给他找了一个人叫阿斯特利德，实际上是一个餐馆的厨师。看来这个人一直陪着巴菲特，但是呢巴菲特没有离婚，他把很大的部分资产都放在他那个媳妇儿的名下了，因他们之间有三个孩子嘛。后来也就老了，但是呢巴菲特一直不是和他的那个媳妇儿生活在一起，而是和阿斯特利德生活在一块。后来苏菲死了以后巴菲特和阿斯特利德才结婚，可能现在那个阿斯特利德也去世了。\n\n尊重巴菲特，不代表你就要理解他所有的那种个人上的那个什么，我理解不了有些人说一个人值得被我们尊重，那他所有的地方我们都得、都不能评论。 就像说矿茅那位创始人他就是娶了个小媳妇儿，他有啥不能评论的？我就不相信他的媳妇儿二十八岁的时候嫁给六十五岁的他是因为他长得帅，我一点也不信。你们信吗？你们相信他的老婆二十八岁嫁给六十五岁的时候是因为他长得帅吗？反正我是不信。\n\n当年我们拿这事取笑的时候，被他们那边的人一顿的批评啊，给我弄的妈字态淫贵。我都没好意思再给他讲另外一件事儿。大家知道不知道格雷厄姆他这个有个儿子自杀了？大家知道吗？ 不知道啊。我给你们讲一讲格雷厄姆啊。那咱矿茅那位都不能讲，格雷厄姆更不能讲了。格雷厄姆是全世界价值投资的鼻祖，是人们心中的圣人。 我告诉你，格雷厄姆他的儿子自杀了以后，他去看他的儿子，然后他把他儿子那个未婚妻领回来，他俩生活在一块儿。再这个格雷厄姆……\n\n没有啥，这都是人都很正常，我都觉得这都这说明是格雷厄姆生精力旺盛，那在他的语境下可能这种事儿不算啥。那你在中国的话这不属于猪狗不如了吗？格雷厄姆还有一个更恶心的事我不能在这里面给你讲，你们去看看他的传记，专门有人写。\n\n我所有的事儿都是告诉大家一件事儿就包括我跟你们讲格雷厄姆、矿茅那位这些事儿，都是一样。你说我尊重不尊重他？我尊重。他是很厉害的人，把一个那个小厂干成全世界最有名的矿业公司，我非常尊重他。但是咋的？我尊重他，他身上就没毛病喽？ 他就成龙了他就？我的意思就是说你不管谁，你都别自己骗自己，你知道吗？谁都不是神，我告诉你。\n\n你尊重的投资人，怎么还他连师德现在你都尊重他呀？你了解他吗你？对呀，就像宗庆后似的一辈子都当道德楷模来着，你去世了你才发现人家那私生子的一堆。 都扯淡，我都觉得我做的是对的。咋的？那你们那何鸿燊你们怎么都说好呢？那何鸿燊他妈比那谁媳妇一堆，你都说好。有这个和超英、有这个那个的，那家一提起来都是那种豪门大院的那种羡慕。咱们的轮到那个宗庆后，宗庆后就不行了？那宗庆后不比他差呀，比他还有钱呢，咋就不行呢？\n\n一说香港那些大亨就是大房子怎么怎么地、二房子怎么怎么地，你们一想起来都如数家珍一样的，完了你也没指责他们道德有问题，怎么轮到大陆这些人就变成有问题了？你取消一夫一妻机制才多少年呢？到一百年了吗现在？哪个媳妇儿都没生气你跟着道德不道德，你说老几呀？什么叫道德呀？人哪个媳妇儿不是自愿找的？哪个是强取的？ 跟你有啥道德？道德那是你定的呗，你定的道德标准呗。人家那四个老婆相处的其乐融融，给你气够呛。\n\n法律上现在肯定不允许，只能是一夫一妻制，干（但）现实当中这种事儿也不是很罕见，尤其那种大富之家这种事儿也不是很罕见。我这妈扯到纳妾上了我要跟你们说的是别把一个人神话，你知道吗？谁也别神话谁，也别把一个公司神话，知道吗？\n\n## 六、管理层\"齐天大圣\"离开，就是重新审视估值的时候\n\n当年矿茅那位创始人从矿茅辞职的时候我问过一个问题：你们原来都看好矿茅的时候，说是因为他，对吧？他把一个公司从一个县级的小公司带到一个全世界的大矿业公司。那我问你，他在矿茅辞职，对矿茅到底有没有影响？\n\n这个时候我告诉你看好矿茅的时候、也看好他的人，他认为他从矿茅辞职对矿茅没有影响。那我告诉你你如果说他没有影响，我不反对啊——我不持有矿茅，我不反对，我只是说从逻辑上来跟你说这件事。你既然说他辞职没有影响的话，那我告诉你，那矿茅、他之于矿茅的作用就没有那么大。你如果说它的作用大，它就一定有影响。如果他没有影响，就相当于他没有作用。那你得选一个呀，你不能自己想要哪个就拿哪个。\n\n有很多公司董事长对这公司一点影响也没有，你就像茅台最典型，那董事长一个一个都进去了，跟人家公司有啥关系啊？你再比如那些央企，那董事长天天隔几天就换了、隔几天就换了，哪个公司受影响都不受影响，董事长换与不换跟这公司都没啥关系。\n\n但是我告诉你就像矿茅这种，是由于一个人、一个我经常说的像齐天大圣一样的人来做管理人，当他辞职的时候，对这个公司的基本面就是有影响的。他怎么可能没有影响呢？ 那你不考察他那个管理层吗？巴菲特都买股票的价值投资必须关注管理层。那怎么的一个管理层的核心人物换了、现在是管理层都不变？你给我讲一讲他为啥呀？\n\n当年王石离开万科的时候，我说万科肯定会有变化，他们都说不能变。我告诉你就像王石这种对万科的重要性不言而喻，当他离开万科的时候，万科就会一定发生变化，他怎么可能不变呢？ 乔布斯离开苹果，苹果会不会变化？我告诉你会。但是呢他的幸运在于说库克这人也还可以，但是可以他也没有乔布斯这种能力了，他只能作为一个守成的人物存在，他再也不像乔布斯这种开创的人物了。苹果这些年多少年有什么划时代的产品？你告诉我。\n\n所以你这个东西吧，我不是说那个我最终的评价说好坏，那你不见得。那他离开了，咋的，那矿茅就不干了？那说不定还干得更好呢，这东西都不一定。但是我说的是咱说的是逻辑你知道吗？你不能说他在的时候，你说因为他特别优秀所以公司也特别优秀；就是他走了那天，说那也没有啥影响。那你不就相当于先设定好他就是优秀、别的都没有用？你不就相当于先射箭后画靶吗？你这叫啥分析呀？ 你先设定了结果，矿茅永远最好，然后其他东西都没有用。我不是看空矿茅啊，你可别这个，这个别给我惹到死。我这个拿这个事儿举例你知道不？别给我到处惹事去啊。我也不持有矿茅我现在也不看空有色金属，而且我现在都持有有色金属了，哦，不存在看空有色金属的问题。矿茅现在是仍然是国内最优秀的这有色基础公司，所以我不存在看空它的问题，我是给你们讲的道理。\n\n来了我就拉黑他，他都来我倒不怕，现在他也没有矿茅的人关注我了，都被我拉黑了。我这讲的是逻辑你知道吗？不是涉及到个股判断。而且你现在这个位置，有色金属它并不贵。\n\n那你像王石离开万科以后，万科并不是马上就变化的，那万科经过若干年以后他就是变化了。你当然你可以算那是大势造成的。那我问你，如果王石还在的话，万科会不会是房地产市场、房地产行业里面的一枝独秀？能不能成？我告诉你是有这种可能的因为他从开始他就是一枝独秀。但是今天他已经泯然众人了。什么叫泯然众人？就是这个行业不行他也跟着不行了，就这么个道理，就这么简单。但是如果王石还在的话，他就有可能不是泯然众人。\n\n这就叫影响，知道吗？这就叫影响。他在的时候在最市场、在这个铜价最低迷的时候能够大胆地去收购这些矿业、矿场，而且用大量的贷款，这是人家的眼光。而且人家管理的时候做到了开采的成本最低，这是人的能力。那我问你，他走了以后这些能力谁来保持？\n\n所以我告诉你任何一个公司如果是这种齐天大圣似的管理人，当他离开这个公司的时候，他都是你重新审视他投资价值的时候，明白不？ 我当年投过一个公司，现在早就没有了，叫中集集团，这个公司就是有一个人对他影响非常大，这个人叫麦伯良。当时我就定，如果麦伯良辞职我立马就清空。但好像麦伯良现在还在，那个快八十岁了我感觉应该是。\n\n你们再去看一看那个振华重工，振华重工当年有一个人物非常牛的，振华重工他是一点一点从一个小厂带起来变成全世界占有率、市占率最高的那个港机公司，叫什么名我现在有点想不起来了。他辞职以后在公司现在就这些年都非常低迷。你要是再说的话那我就给你再说个远的，红塔集团大家知道吗？管彤贤？对你，你说对了管彤贤。 管彤贤这个人当年在这个振华重工的地位就相当于王石在万科的地位，他后来走了以后，虽然这个公司仍然是全世界市占率最高的港机公司，但是他再也没有显现出来当年的那种优秀。他就是个泯然众人了你明白不？他是一个公司，变成一个普通公司了，这行业好的时候他也跟着好、不好的时候他也跟着不好，他再也不会出现这个公司在不好的时候也比别人好，出现不了了。这就跟那个个人有关。\n\n他就是归于平凡。你说的没错，它就是归于平凡。问题在于他归于不归于平凡对于这个公司来说都无所谓问题在于你股票市场是按照它不平凡给估的值，明白吗？ 你为什么给矿茅的估值高是不是因为在某一种程度上是考虑到了他的能力？有没有这个人的能力在里面、这个估值、你的矿业公司的估值水平高，有没有他的能力在里面？有没有这个因素？ 苹果的高估值当年有没有乔布斯的因素？苹果当年都快黄了个屁的了，把乔布斯、乔布斯有一段时间是走了、离开苹果了，苹果都快经营不下去了，把乔布斯请回来才把苹果救活的。马斯克也一样，马斯克有一天不在了，像什么特斯拉、什么 Space X，这都不值得投资，明白不？\n\n你看今天黄仁勋如日中天，这个英伟达。你现在想一想当年的英特尔，英特尔那个后来去世那个、那个总裁叫啥名呢，写过一本著名的书叫做《只有偏执狂才能生存》，叫啥了？那个人后来是前列腺癌没的，我有点想不起来了，就是英特尔的最如日中天的时候他写过一本书叫《只有偏执狂才能生存》。你看他死了以后英特尔就是泯然众人，你知道吗？所以不能说这些人对公司没有影响，这些人尤其有影响。但是有很多公司它是没有影响的。\n\n尤其你要关注那些有一个齐天大圣似的管理人这些公司这些人对这个公司的辉煌产生过重大影响。如果他一旦发生变化的时候，那就一定有影响。 刘永好也一样，还有当年的尹明善，我这给你们讲起来就多了，国内的就更明显了。你现在更应该关注的是福耀你看现在那个曹德旺从福耀退了以后，你看你慢慢你跟你再观察，看是啥样。 我再给你举个例子，当年的那个鲁冠球那个企业叫万向集团，你看鲁冠球不是万向集团的、这个鲁冠球已经去世了，现在是他儿子了，叫鲁伟鼎，你看他上来以后你这个万向集团就变成泯然众人。我就告诉你，你就包括台阳，有人举的刘鸿好？现在的希望和刘永好那时候的希望是一样的吗？\n\n所以说一定不要小瞧这种创始人我跟你讲有没有第二代还更厉害的？那太有了。第三代比第二代还厉害有没有？那太有了，有的是。我告诉你，如果五代人一代人比一代人厉害，你知道会发生什么结果吗？ 你猜。贵族。我告诉你会打下全中国你看清朝你就知道了。努尔哈赤不过只有十三副盔甲起兵的一个小，你也可以说他是个小混混而已，只有十三个人经过五代就把中国给统一了，就是因为一代比一代人厉害。 那不容易的，非常非常不容易。\n\n大部分人叫两世而斩你知道吗？就是中国人讲叫富不过三代，你知道不？你这个财富能守住三代就已经非常非常牛了。你为啥呢？就是你下一代那个传承的时候你没有人了，你知道吗？你就是人不行。所以我今天给你们讲的是人对企业的作用，你不能说这个消息对你不利，你就开始否定说他没作用这件事了。 那你就、你有很多人都分析，他是先画靶后射箭，先给自己定了那个结论然后再找原因。\n\n我啥我也不看空啊，你们别给我到处惹事儿去啊。听完了就完事儿，完了别整完那个文字版到处嘚瑟去啊，非让人家上人家那个什么、你那几个论比较热闹的论坛，非要插入到人家那里头，别给我惹事啊，谁给我惹事我给他拉黑。我现在已经决定不通马蜂窝了昨天不说了吗我已经决定不通马蜂窝了。我我只是在这个论坛里面给你讲一讲，我也不去给人家说那事儿。另外我确实今天讲的这些事儿也不是因为看空，我不看空。我自己就有有色，我现在还看不出啥有色。\n\n对呀，他不是报不报为师的名字，他妈直接把我名先打前边，完了骂我的人都以为是我让拒的。你们这帮人一天天都是给我上眼药。\n\n## 七、别看我组合、别问代码：我讲的是道理\n\n我现在是有（持仓），但是那你买啥呢你们得自己定，你必须得自己选择。你买出卖出我明天可能就卖了，那玩意没准，你就别信我的。你别明天开盘我买、明天我可能就卖了，我现在都是做短，你知道吗？\n\n都别买？我不、我也不能说你别买，我也不能说你买。你买与不买跟我都没关系你知道吗？我不买他涨了你也怨我呀，我再买你跌了你也怨我，我可不扯他了。 别乱猜啊，你们猜的都不对。你也别看我那个组合，我那组合也不是实盘，那都不代表实际收益。 买还是不买那你得问你自己，那玩意儿他得问我呢？\n\n谁只要说一句话\"我听你买了什么什么\"我马上给你拉黑啊。你说这话就相当于骂我一样，比骂我还严重。你听我的做了什么什么样的操作，无论是买了还是卖了，还是增仓了还是减仓了，一律拉黑。 你没听我的买就别提我名字了，你跟我有啥关系？你自己愿意买啥买啥。我讲的都是道理不指导投资，不指导任何人投资。你要愿意听我就给你讲讲逻辑，你自己去分析。\n\n你想搁我这要什么代码？有什么现在是应该增仓还是减仓，你早跟我扯这个。你也别问我持有的信心的问题，我一看他们回答这问题我都头皮发麻。\n\n现在的直播人数不多了，一般都到七百人、一千人都到不了。以后再直播都是在晚上了那早上也有可能，到时候我再通知吧大家。如果我觉得今天没啥可交易的，我也可能给大家早晨播一会儿也可能，你就再通知吧。 我一会儿我就下播了，现在两个小时了。\n\n大家把评书给我打在公屏上。我再次重申一遍啊我讲的所有的个股都不是用来指导投资，只是用来举例，来给你们讲逻辑的，来讲这些看法背后的这些规律，都不是用来指导投资的。我讲的所有的股票都不是我持有的，我近期也不准备买，我讲的所有的股票都是这样的。 所以你们别望文生义，别合计我一提哪只股票了你就就要买、就卖，那都不对。我既不看空也不看多，我就是拿他举例。\n\n最后给我点一波赞，送送粉丝灯牌和电池什么的我就下播了。如果大家想听的话就把人气搞得旺一点，今天这人气都掉到第三十了，我都没心情讲。对，把评书都给我打在公屏上。没事自己回去背一背我这个后边说的这段话啊不能用来指导投资，不能用来指导投资，千万千万千万要注意。\n\n投资是一个非常个人化的东西，我能做的东西你们做不了，我能挺住的波动你们挺不了。 我就是希望大家经过这一轮牛熊之后还能留在市场里头，这就是我最大的愿望，至于你挣多少钱赔多少钱，那都无所谓。而且我个人认为，如果你们是最近三五年才入市的这一轮牛市结束的时候你大概率是亏损的。你别看你今天天天来听我课，你听我课到时候你也会不信我。只要不亏光就可以了，如果你因此还能剩点钱的话，那我就更恭喜你了。\n\n必须要活下来你一定要活下来。你多看你就是赢了，你经验涨了你就是赢了，你这点钱多少都不重要。你现在如果就把钱都挣了、你得意洋洋的，就像昨天那小伙似的，你得意洋洋的，这就是为你未来倾家荡产埋下了一个种子。你错误地以为你那些东西总结的都是对的，殊不知现在就是个牛市，不需要总结经验，谁都会赚钱。\n\n就这样吧，再见了，我要关播了。明天早上你就不播了因为今天晚上还有一个那个会员直播，明天早上再播的话是嗓子受不了了。然后后天的话早晨是不是能播我再再通知大家。 好再见啊，关播了关播了。","toc":["一、开场：舰长太多、专场管得松","二、改到晚上播：我要盯盘了","三、座谈会通稿：用专家的嘴说事儿","四、赚下跌的钱：公募漂移回归与AI虹吸","五、格栅理论：自我降维与\"赚差价靠选择\"","六、管理层\"齐天大圣\"离开，就是重新审视估值的时候","七、别看我组合、别问代码：我讲的是道理"],"url":"https://www.bilibili.com/opus/1257919809912307715","bv":"","minutes":0,"chars":20084},"topics":[]},{"date":"2026-10-10","bili":{"title":"老木匠 2026年10月10日直播文字稿（神秘队护盘逻辑、美股种地与A股狩猎、港股双轨定价、收益率复","text":"## 一、开场：东北供暖与昨天的操作\n\n早上好大家，今天约了个维护热水器的，刚整完。咋维护？坏了呗，那不好用了，我哪知道咋回事。东北开暖气吗？那分地方，黑龙江现在已经是供暖的了。辽宁的供暖期是十一月一号，黑龙江早就供暖了，黑龙江是最冷的地方，九月份就供暖了，有的地方九月十五号就开始供暖，最北的地方。\n\n昨天这个美股市场涨得不错，最主要的是我看美债的收益率现在有点缓和。所以美债收益率一缓和，黄金、铜这些都跟着上涨，导致贵金属这些板块也都在涨。所以我觉得昨天美股涨得很健康，很好。但问题在于他是不是能持续，这是一个问题。所以这个东西就是大家走一步看一步，没有一成不变的观点。\n\n炒股票嘛，不是谈恋爱，不是讲究从一而终的。你是在没有变化是不变的这一点，剩下所有的东西都会变。\n\n昨天我直播到一半的时候我就去操作了，因为我着急。有的朋友还以为昨天我被抬走了，只播了四十分钟。好像是因为开盘了以后我认为有个操作机会，我去买了不少东西。对呀操作了，我不是给你们讲了吗，我把我所有的资产都已经重新挪到两融账户里头了。挪到两融账户里面那就可以随时交易了，那以前没在两融账户里面，我是满仓的我也不能交易，那都是我的底仓。\n\n装满了吗？还不至于，现在还没到那个时候。现在可以做一些短插，做一些小的导短，而且不要太多，大的机会还没有来。但是我为啥不愿意说这个事儿呢？因为大部分我的粉丝也好、其他的听众也好，总是跟我总是不在一个层面上思考问题。我要一说规避风险，他就是说空仓；我要一说现在有机会可以尝试一下，他们就是满仓。这玩意儿我就没法整了，他老是在两头之间来回来回走极端。\n\n现在的市场还没有到大机会的时候，它只是适合倒转。大家知道什么叫导短吗？热菜还没有上。现在还不算是上热菜的时候，我现在还没有看出那个被动卖出的迹象，而且这种东西现在明显的看，管理层对这个东西非常警惕。你像昨天那个行情，如果再发展下去，就有一点点要触发被动性卖盘了，但是很快这种大量的宽基 ETF 的申购就把这个东西给拉回来了。\n\n## 二、神秘队往小盘 ETF 投钱，为什么涨的是大股票\n\n我要给你们讲一个特别有意思的事儿。昨天宽基 ETF 主要集中在小微和创业板上，大家知道不知道？比如说中证一千 ETF、两千 ETF，或者是创业板的 ETF。大家回去自己看一看，我没去仔细研究，我只是扫了一眼他们总结的。\n\n但问题在于，你看所有的这些宽基 ETF 都是小 V，但实际上最近涨得好的并不是这些小 V，大家没有发现这个问题吗？那你告诉我这个问题是怎么发生的？为什么神秘队去花大量的钱往这些中小的 ETF 里面投钱，结果最后受益的、涨得比较稳定的反而是那些大股票？大家想一想这是为啥。\n\n所以你就要知道，神秘队往里面投钱的时候，他要防止的是被动性的卖盘。就是说它实际上防止的是流动性枯竭、流动性危机，它并不在乎你这个东西是涨还是跌，我只要拖住你正常交易就可以了。\n\n它防止的是你这个东西一直下跌以后，由于里面前期所导致的很多融资盘，一旦触发平仓线，导致被动性卖出的循环发生，这个结果就是非常可怕的。所以你看它投钱的时候是往创业板 ETF、中证一千 ETF 里面投钱。但是你会发现这些东西投进去，它只是说由原来跌百分之五最后变成跌百分之一，它并没有上涨。\n\n想一想为啥。他往里面投钱并不是说他要把它的价格拉起来，这个大家一定要明白，有很多人不懂这个道理。它防止的是流动性危机，他只要搁底下拖着你，你卖我买，就类似一个做市商一样，防止买盘枯竭它就可以了。你明天再下跌的时候再卖，又看到没有人买的时候，我再挂低一价位我再去买。\n\n那好了，我问你，那么是谁在迫不及待地往外走呢？利用神秘队在底下托市的这个机会，谁在往外出走？你认为是聪明的资金还是散户？散户这个时候想的都是神秘队来救市了，我们继续冲啊，都是想的这事。其实有的人是利用这个，跟吹雪的道理是一样的，你知道吗？利用这种神秘资金来防止踩踏，发生这种买盘再往外出货。你们得明白这个道理，这是逻辑，你知道吗？要不然他就更卖不出去了。\n\n所以他们出来的货去到哪儿呢？那你想一想，为什么有些东西它一直在涨？就是说他们出去的货赶紧去买别的，他们认为下一步的行情。\n\n再跌几天我跟你讲，在上边套牢的小散就更不想走了。那些在上游持有这些高标股票的散户，现在对于市场来说已经没有任何意义了，它已经叫作沉默账户了。再跌几天他就彻底不看了，连看都不看了。他已经被挂在山顶上了，还看啥呀？他现在想的是等着有人去解放他。那你告诉我谁去解放他呀？谁去把他拉起来？他现在那个价格一千二，你告诉我拉到一千二的时候把他手里的东西买过来，那你到一千四的时候你准备卖给谁呢？\n\n你分析分析这个逻辑，大家想一想这个逻辑你就明白了。我好不容易在一千二把你套住了，我再到一千二把你买过来，那我得拉到一千五一千六才能赚钱，那你告诉我一千五一千六我准备卖给谁呢？你不要想那个事儿了，起码这一轮它是已经结束的了。接下来就是如果下坡下得太快，就有人来踩一脚刹车，防止下得太快导致车毁人亡，明白这个道理不？然后点一脚刹车，慢点儿，看看明天情况。\n\n你像这次昨天晚上美股科技又涨了，昨天其实美股科技还没怎么涨，就是美股涨了、纳斯达克涨了。看对 A 股的科技股是不是有正向影响，如果有正向影响，好，能稳住交易，好，现在神秘队继续看着。突然买盘又没了，那行我再进去再买点儿。\n\n股市最后的价格是个博弈的结果，各方都是从自己的角度出发来考虑问题。在里面的人是在考虑我在这个价格上能不能出去，那有的人还在傻乎地在考虑，不冲啊？这可来就是了，以后机会又来了。那你冲吧。你把他们都忘了吧，他们都是死人了，你就不用再想那个事儿了，一轮一轮地过去，他就是死人了。\n\n好容易把你埋起来呢，还给你挖出来啊？你在想啥呢？把你再挖出来以后再埋谁呀？你告诉我，这事本身就漏了。你想埋谁吧？你们这一波人肯定不会说在这个一千二卖给我，再一千五再买回去，肯定不会干这种事了。那你这个榜样，现在这种榜样的力量已经被市场广为传送了，那你告诉我一千五还谁去买呢？\n\n你不像第一次的时候，第一次的时候大家谁都不知道它到多大多高的价格，所以你要知道这个价格的锚定效应它是非常厉害的。你第一次的时候我给你讲的故事是能到五千，你知道吗？所以你敢在一千二的时候买，结果现在你看到一千五就拉不上去了，然后回到了八百，然后回到了七百。你现在还想着一千二有人再买，那你还能拉到五千了吗？你都已经到一千五的时候你就已经拉不上去了，你还能拉到五千吗？\n\n不是说绝对不能，你如果现在有一个特殊的基本面变化，就是有一个特殊的事儿，说这个东西又已经开始大发展了，这个明年的收益还能提高二十倍，那可以，那可以。那你告诉我还会不会有这样的故事？听懂的扣个一来，给我点点赞。不知道博弈的这个局面，你都在这瞎讲。你说是不是？这个格局是非常简单的，这不难分，这都一点都不难区分的东西。\n\n那你现在暂时看不到。我告诉你，即便是有下一波，也得是踩着这一波人的尸体往上走，知道吧？也得让这一波的人最后割肉出局。为什么市场老是不友好的？因为它是由博弈造成的，因为它给你营造的东西就是这样的。它一定是在让你不该买的时候买、不该卖的时候卖、该持有的时候卖出、该卖出的时候持有，你一定是这样的，你知道吗？\n\n他们在卖出的时候，他一定会给你营造一个持股的信心，你必须得坚定持有，这个东西必须能让你挺一百年。你靠的是差价来赚钱，你这个时候你没有差价，你未来你都看不到差价，那你告诉我你拉起来你准备干啥呢？你现在不趁着这个故事热闹的时候你把它卖出去，那我问你这故事凉的时候你还卖给谁呢？\n\n## 三、美股是种地模式，A股是狩猎模式\n\nA 股为什么不能像美股那种缓慢上涨呢？又有人问这种啥问题。美股没有傻狍子，所以说它只能缓慢上涨。谁也不敢把这个东西拉高过高，因为啥？你拉高根本就没有人跟你拉高，人家就全卖给你，你知道吗？你现在实际上拉美股我马上就全卖给你，所以美股它永远是紧随基本面在不断地上升，基本面上涨一点它就上涨一点。\n\n美股的整个盈利模式是种地模式，它必须得依赖着上市公司的基本面上升、回报上升，它的股价才能上升。而 A 股是狩猎模式，它根本不需要去等到这个公司真正的基本面回报，它需要的是博弈，需要的是把这些东西卖给傻狍子，这个事儿就完事儿了。我是狩猎模式，我根本不需要种地，我看着傻狍子打一枪，拎回家吃了就完事儿，你知道吗？\n\n怎么总有人问这个啥问题呢？美股和 A 股是完全不同的两个市场。当然现在也有人说我在 A 股也种地，那可以不可以？但是你那不对，不是效率最高的模式。\n\n我问你们个问题，假如说你看四大行，大家想都是讲四大行，四大行也有港股。你如果把港股比喻成美股的话，好，我告诉你，四大行的价格就应该是它在港股的价格，那随着他的业绩增长他就会增长，如果是现在我们货币宽松了，那么四大行也就会增长，就这么个事儿，这个事儿是这么个道理。\n\n美股散户不是傻狍子吗？美股有几个散户？美股的成交量散户不到百分之三十五，A 股的散户的成交量原来是百分之八十五，现在是百分之七十，再降一点点了。那么你必须要了解这个不同的市场格局它所带来的不同的交易模式，你必须要理解这个机构的交易他在做什么。\n\n我告诉你，A 股的机构和美股的机构做的事是完全不同的。你在美股假如说你买英伟达，我随便举个例子，你在美股买英伟达，你准备把英伟达炒高，你卖给谁呢？所有的人都是机构，你告诉我你准备卖给谁？现在的英伟达的市盈率也不高，如果英伟达在中国的话，现在早就干到五百倍市盈率了，你知道吗？市值早都干到二十万亿美元了，你知道不知道？你看看 A 股的这个科技股的市盈率和美股的科技股的市盈率它是一样的吗？\n\n美股的所有的判断的错误都是基于对基本面的判断失误，你明白不明白道理？就是说美股假如说我一个机构，那机构它也亏钱，那当然亏钱，那不谁都赚钱？那这市场就不存在。它亏钱是基于它对基本面的判断错误。A 股的市场它根本不判断基本面，他判断的是市场的热点。如果他亏钱，是因为市场的热点判断错误了，他的根本不是基本面判断错误了。\n\n不是说这个公司原来你看一个月挣多少钱，现在一个月挣的不如原来了。你看美股经常出现这情况，季报一出来库通家跌百分之二十，季报一出来好的时候股通家涨百分之三十，这种情况经常发生。我告诉你在 A 股这种情况非常非常少，我们经常是这个月亏损了，马上明天就涨了。\n\n为什么它一次跌百分之二十、一次涨百分之三十？因为它的定价效率非常高。什么叫定价效率非常高？因为它都是内行。你只要这个季报一公布，我一看你这个季报里面所说的这个事儿，包括未来的这个产量预期等等这些东西，我一研究，大家就马上就知道这个价格应该是什么价格，马上就调整。这就叫定价效率高。\n\nA 股不是。A 股你现在出一个季报，你告诉我，你问问老百姓，你说这季报是利好还是利空？他根本分不清。然后他根据什么来判断利好还是利空呢？他根据股价的涨跌来判断。这季报一出来股价上涨的话，他就认为是利好；股价下跌的话，他就认为是利空。那么这个机构也明白这一点，所以机构就做一件事儿：明明一个季报出来他知道是利空的时候，他就往上拉升。为什么呢？因为一拉升傻狍子就来了，他们就会觉得是利好，你知道吗？\n\n我说的这些大家能不能听懂？听懂给我点个赞，粉色灯牌，听懂的扣个一，我今天讲这个都是干货啊。我动不动拿美股来当 A 股，你这别扯了，美股有几个散户？美股的散户很小。即便是有散户的交易量，那也是被他们统计出来的，因为机构不怎么交易。美股散户的总资金所占比要比他交易量占比还要低得多得多，因为散户他交易频繁。\n\n为什么美股的散户少呢？是因为美股是一个发展成熟的市场，它的散户已经被消灭得差不多了。那这就跟人类社会发展是一样的。你刚开始人类进入人类社会的时候，刚开始都是狩猎和采集，谁愿意种地呀？那他妈送邻水全是傻狍子，你让我去种地呀？打猎是最高的效率，你知道吗？\n\n最后人为什么要种地呢？我告诉你，因为是傻狍子打没了，他就必须得种地了，没招了，你知道吗？谁愿意种地啊，那打猎多有意思啊，还有猎杀的快感，打完猎回来就喝大酒。狩猎民族活得都非常快乐，农业民族活得都非常憋屈。\n\n当然了，你现在其实还在一个狩猎的情况下。所以有人说我去美股，你看人家那地方都是什么叫啥？现在叫正规市场。人家正规市场不需要技术，你去美股那死得更快。你买美股的 ETF，那不相当于买的是基金嘛，你买美股的 ETF 你还有啥可说的？你自己选个股你试试，你在美股。\n\n## 四、港股的双轨定价：基本面随中国，货币随美国\n\n港股市场受啥影响？港股市场受美元的影响，它跟我们的这个货币周期不一样。我今天给你们讲一讲吧，彻底给你们讲一讲港股市场，让你们好明白。你看我给你讲，别人他都不懂，他就瞎说。有人愿意听给我扣个一来，我给你们讲，今天彻底给你们讲讲港股市场。我给你们讲一次，然后你们以后细节你马上就啥都明白了，你就马上就理解所有的港股今天的现象是怎么来的，我告诉你。\n\n你看那些直播间搁那乌拉乌拉乌拉说了半天，他根本没说到点子上。为什么港股今天会出现这样的一个现象？为什么恒生科技又创新低了？好，大家开始注意听我现在开始给你们讲港股啊。我都不讲细节，我大概讲一两句话我就给你说明白了，然后你啥都懂了。\n\n一个股票市场它的整体盈利能力反映的是这个国家的经济发展热度，大家这个听懂了吗？当一个股票市场反映的是这个国家整体的经济发展热度，当它的股价不断创新高的时候，说明它的经济热度比较高。反过来也是一样的，当它的股市不断创新低的时候，一般来说可能预示着它的经济热度比较冷。\n\n那么在股市不断创新高、经济过热的情况下，必然会伴随着通货膨胀的发生，就像现在的美国。所以当通货膨胀、经济过热发生的时候，为了扭转这一点，他就会采取紧缩的货币政策。所以你会发现，当一个国家采取紧缩的货币政策的时候，它的市场还在上涨，资本市场还在上涨，为什么呢？因为它的经济依然是很热的。\n\n虽然它的货币已经紧缩了，但它的市场由于有惯性，它的基本经济由于有惯性，它依然还是很热的，还是在上涨的，因为它的盈利水平还在增加。当你的货币紧缩的时候，它不是立竿见影地反应在实体经济里面，它会慢慢慢慢地反应，但是你这个时候货币已经紧缩了。\n\n好，反过来。当你的经济过冷的时候，你要扭转这一点，你就要实施宽松的货币政策，就像我们现在国家经济冷、通缩。宽松的货币政策往往对应着经济的基本面不好，要不你为啥要宽松呢？你经济基本面很好、经济都已经过热了，你还宽松货币，那你不疯了吗？所以你宽松货币的时候，一定代表着基本面、经济的基本面不好。但是你经济基本面不好的时候货币很宽松，所以你支撑了市场不至于下跌得过快，明白不明白？\n\n好，现在我告诉你，港股是一个什么样的市场？港股的市场是经济基本面跟随中国，货币基本面跟随美国。经济基本面过冷，而货币现在处于紧缩状态，明白没明白这个道理？在这种情况下，你告诉我他怎么估值怎么能提起来呢？他一方面港币现在是紧缩的，另外一方面经济基本面是随大陆的，你告诉我他怎么能够把股市涨起来呢？\n\n我是不是说一句话你们就懂了？来，要说懂的给我说\"叔你长得最帅\"。我敢保证我这句话你们在别地方都没听过，他们说半天他都没说到根子上，我告诉你。所以你为什么现在不能买港股呢？就是这个原因。你的港币是紧缩的，基本面是低迷的，你告诉我港股怎么涨？这个货干不干？一般我都不愿意跟你们讲这事儿，讲这事就有学院派的人老跟我来抬杠，给我讲一大堆模型，有这个那个的，说你说的不对，你这个民科的说法。我不管是不是民科，我就是这么看的。\n\n有的时候懒得去跟他们犟这些事儿。好了，我给你们已经讲到这儿了，那我告诉你，那你马上你就能想明白，你告诉我什么时候投资港股是最好的？在目前这种港币和美元是联系汇率的情况下，什么情况下投资港股最好？是不是我们加息、美国降息的时候是最好的？那你回顾一下历史上的港股的大牛市是什么情况。懂了没这回？\n\n你看疫情期间，美国无限量宽松的时候，我们继续能维持生产的时候，你看港股涨到多少？你看那时候恒生科技涨到多少？你看那时候美团多少钱？那个腾讯多少钱？这有啥难理解的？这对我来说就像透明一样。有的人就是哇啦哇啦搁那讲半天讲不明白，我都替他着急。\n\n你港股上最近这些年，尤其香港回归以后，你港股上上市的公司基本面都在咱们中国国内。你疫情期间只有中国国内能继续生产，你其他人连工人都没有了，你能生产吗？你生产不了。美国那个时候只能那么花钱，人人发钱，你只能靠这个办法来苟延残喘。那你告诉我发出来的钱去哪儿啊？你投美国公司，美国公司都快停产了，你怎么投美国公司？那时候不是港币是最好的投资渠道吗？\n\n当年我有个同学投资港股的时候，他都不懂这道理，我给他讲过八百遍他就不信。我说我告诉你，有一天你会发现港股它下跌会非常厉害。他要给我讲什么腾讯怎么怎么的一辈子难遇，用什么美团什么多怎么怎么地。我说你这根本没明白这道理在哪。\n\n今天懂了吧？我估计今天都懂了。你们听我这一句话你们就都懂了，这相当于诀窍，我告诉你了你马上你就明白。但是我一般不想告诉你们。\n\n所以你知道投资港股最好的时候，就是等我们这边经济过热了，老美开始经济过冷、开始刺激的时候，降息了，我们这边开始升息了，那时候是投资港股最好的时候。当然你的前提条件是港币不换锚，你别港币过两天换锚，变成锚定人民币了，那你那一切逻辑都改了。你记住我这句话吗？前提别忘了。\n\n这老头儿咋懂这么多？看书看得多，思考得多。最主要是我谁都不信，知道吧？我什么东西我都得自己想明白。你讲的天机不可泄露？我今天讲得太多了，有点讲嗨了，不应该跟你们说这些事，有点后悔了。翻篇了，这事翻篇了，讲别的，扯别的了。没事儿跟你们开玩笑呢，这都是公开的信息，只是说很多人他不明白这道理。\n\n所以为啥我不投资港股呢？就是因为他没到时机，他大的时机他没到，你知道吗？我就不投资港股。但是头几年我一直都不投资港股，那这次我投资港股，我未来会投资港股，但是我认为他时机没到。现在也很便宜，那便宜是肯定便宜，它还会更便宜的。\n\n我是来赚差价的，其实你要是现在想收红利，现在港股也有很多值得投资的，你就想吃红利的话，那同样的股票有很多比大陆便宜的，但是你就别指望说买入以后它就能涨。这东西就是取决于你未来你要投资一个……我没说吗，那天我给那个会员直播的时候说，你进入股市之前首先需要考虑的，你究竟要做一个什么样的投资者，你得自己先想明白这件事儿。\n\n你不能今天东一榔头西一棒子，你来回换，我告诉你，那你的理想你来回换。我今天想它妈一被套住了就变价值投资了，就准备持股收息了；一涨了我就变成趋势投资者了，马上获利了结。你他妈来回变，那你能干啥呀？吃息，这港股适合吃息佬，吃息这种东西也不要过于拘泥，你吃息也是分吃多还是吃少。如果你认为它一直还会下跌的话，那你为啥要买？为啥不等一等呢？\n\n这个时间不会很长，美国他加息了也加不了多长时间。你就在那等着一次危机，一次危机来了以后我跟你讲，最值得投资的就是港股。你真正要是由美国引发的流动性危机，最值得投的就是港股。因为 A 股的流动性危机所引发的这种弹性，它和港股比它小得多，因为你进出中国的这个外汇它不随便。所以说你不可能说因为美股现在出现流动性危机，你不可能说卖 A 股去买美股，你基本上很难做到这件事儿，它有额度限制的。\n\n所以说你不可能在这期间被抛售，另外 A 股到时候会有神秘队来护盘。你最有意思的就是港股，所以港股会跌得非常吓人，你知道吗？越吓人才越有机会了嘛。行了，不说这事儿了，再说这事都说多了。\n\n## 五、风格转换与\"别听我的\"\n\n风格转换不存在完成与不完成的问题。我昨天就有人老问我这句话，那风格转换完成没？这是一个你不断观察的过程。那你比如说，昨天我告诉你们，现在看 A 股目前就是在风格转化，那你可以明显地看到现在科技在下跌，那些老登股在上涨，那你这些你看不到吗？\n\n那我问你，这个风格转化会不会一直持续？它如果一直持续的话，那老登股就有机会，而且你那些原来被称为老登股的这些股票、所谓的价值投资标的，它其实的估值都非常低。那你别问我是不是适合买，这事我能不能给你出主意，你也别说听了我的买啥了、听了我的卖啥。这都不能，这话对于我来说都非常敏感，你知道吗？这个话跟骂我差不多。\n\n我给你们讲的时候就经常给你们讲这事，你别听我的，我只讲道理，我不知道投资，你任何决定最后买卖你也别告诉我说我是听你的买的、我听你买的听你的卖的。我给你讲，你只要说这话就给你拉黑。我不想贪功，我也不想最后担责，你知道吗？你自己愿意买你就买，你听了我的话买了你买了你就买了，你别跟别人说我是听了你的买的。我可不是其他的那个直播，那个什么主播一整还给你们解答个问题说叔这买这个行不行，那你可别问我，我可不知道行不行。\n\n把评书再给我打一遍，把评书打一遍。我跟你讲，我说的所有的东西都不能用来指导投资，都是……我都评说，我不是专家，你也别信我的。别一涨你就信我的了，你信我的那我就给你拉黑，你可千万别信。咱就聊天，我讲的就是评书，我就是单田芳的那个评书。\n\n人气第一，就是因为刚才我给你们讲的港股的事儿大家都有点兴奋了，所以公屏上打字打得多，所以人气就高了。但那玩意儿不能老讲，你再老讲的话你就把一些专家都给我引来了，那专家到时候就跟我抬杠，叫啥叫金融大聪明的，金融大聪明的可厉害。我最怕这些人。\n\n原来我最早在雪球上写文章的时候，专门有一个号称是金融学博士的，天天跟我这抬杠、叫板，反正你说都对、你说的都对，最后给拉黑拉倒了。那时候我是刚来雪球，没几个粉丝。又什么菲利普斯曲线，有这个那个线，这给我讲半天。我可太怕这人了。我当年在大学的时候，周围同事里全是这种人，一上课，那学生的眉头能拧出水来，学生完全听不懂他在讲什么，他自己觉得可明白。\n\n所以我给大家讲的就是咱说句正经话，就是说讲课这种东西，课堂的作用就在于你把框架的东西给他讲明白，剩下他自己就会找细节去。你不是在课堂上去给他讲细节，知道吗？那你作为大学课堂，那这不但不是小学生课堂，是讲一个小鸭子加两个小鸭子等于三个小鸭子？你这不，这不是这个事儿，你知道吧。没听明白也很正常，那无所谓。\n\n## 六、今年收益率复盘：我犯的两个错误\n\n讲讲最近，今天发那个收益率的情况，我看大家收益率都挺好的，我觉得我挺欣慰的。我看大家的收益率都挺好，这十几、二十几，这收益率都非常优秀。我今年本来也是能做到二十的收益率的，我今年可以给大家总结总结为什么这么低。我犯了一个错误，可以说是这两个错误，其实是一个错误，但衍生了两个错误。\n\n第一个错误是说，我在一月份、二月份的时候清仓有色金属以后，那个时候我就不再融资了就可以了。那我今年最起码要超过百分之二十的收益率，因为我那个时候已经百分之十五了。结果呢，我卖完了那些东西的时候，我认为有一些东西可以防御，我就买了不少防御的品种。然后这些防御的品种一直没有涨，为什么呢？因为今年上半年所有的资金都被这个科技股给虹吸了，大家这个都知道的。\n\n就是六月三十号之前，所有的资金都被科技股给虹吸了。尤其是最后最恶心的一件事就是那个基金的漂移。你看这最近这两天就是说现在那个证监会准备整治这个基金漂移这个问题了。所以说由于基金漂移，公募基金就把所有的东西都卖了，都去买那些什么光模块了、什么芯片啦，就是都集中在一个非常小的范围里面。这样就导致我买的那些东西价格一直在下跌，所以就导致我上半年本来是盈利的，结果我还变成亏损了。\n\n但是到六月三十号的时候，我已经明显感受到这个科技的风险了。我记得大概在四五月份的时候开始给大家提示那个科技的风险，然后那个时候我就决定，不行，这个科技如果一旦下来的时候，那么它就会导致整个市场快速的下跌，弄不好的话会导致泥沙俱下。所以因为我现在当时是满仓满融的，那我经不起这种波动，所以我就觉得不行，所以在六月三十号的时候我就清掉了所有的融资，把我所有的资金都移到了普通户里面，杜绝自己继续融资。\n\n到七月份的时候，大家都看到了，我预测的没有问题，七月份的时候科技股确实出现了非常严重的下跌，非常幅度很大的下跌。所以你比如说今年上半年买科技股赚了很多钱的人，到下半年实际七月份、八月份以后，他们基本上就不亏就不错了，有很多人就出现这个局面。但是我预计这个事儿没发生，我预计我那个东西也会跟着跌，我那东西没跌，那还涨了。所以这就衍生了我的第二个错误，就是你清融资清早了。\n\n所以就导致了我今年总体来说这个收益率不高，主要的原因就在这儿。但是那没办法。假如说我告诉大家重来一次的话，我还是会这么做，为什么呢？我跟你们不一样，因为我是职业投资，我不能担风险，知道吗？我跟你们不一样，我不是说买一点点，我还有其他工作，我买个一二百万的股票，那我也会冒险。所以我不是像你们那种投资模式，这个大家你要理解，就是模式不同。\n\n我给大家讲过那种专业投资和业余投资的区别，所以说专业投资跟业余投资是永远不一样的。所以你要重来一次还是这个局面，那你还怎么办？还得那样。虽然我规避风险的时候，后来这个风险没有发生，甚至说我卖出那些东西其实我都卖到了最低点。就是我卖的那些防御品种都卖在了最低点，我要拿到现在的话，那我这挣百分之二十没有问题的。但是没办法，重来一次我还得这么做，我得防止由科技股下跌所导致的泥沙俱下，因为一定要防止被动卖出。因为到时候你一旦这个融资过了平仓线以后，导致被动卖出的时候，那你会亏损得非常之多。\n\n所以没办法，那你选择了这个，那你就得这样。所以整个的三季度，我一直都是在这个普通账户里面，我基本没有做任何操作，一直到四季度，现在我开始把所有的账户又都挪到了这个融资账户里面，这样我就可以进行操作了。那大概情况就是这样，所以我能取得百分之八的成绩，我觉得今年是不错的，对于我个人来说。\n\n今年我认为百分之七十的亏损应该差不多，其实今年亏损率应该到百分之七十。也就是说，今天你不亏不赚，能跑赢百分之七十的人，起码跑赢百分之六十的人，我认为。但我看大家有很多都取得了非常不错的成绩，因为你们是一直拿着那些东西。你只要一月份、二月份的时候把那个有色金属一清，然后你随便买一只股票你就一直拿着，反正你们也不融资。\n\n基本上现在都是，因为那个时候就已经百分之十五的收益了，你要是一直拿着，你要是不像我这么分散投资的话，一直拿着有色金属，那你二月份的时候收益率已经很高了。我那个时候百分之十五的收益率是因为我的持仓要保持一定的分散度。所以你那个时候你只要说把那个有色金属一卖，那你今年下半年随便你买个啥，你得挺到现在就可以了。你甚至卖完了以后那个时候空仓，到后来你今天把那个有色金属再买回来，你也是百分之三十的收益。所以我这个都很正常，三四十的收益。\n\n但是你上半年假如说你就取得了百分之一百的收益，那说明你买的是科技股，那你下半年你就极难保证说……除非你说我到下半年的时候那我就卖了，那你就是凤毛麟角了。大部分的人上半年取得百分之六十甚至百分之一百的收益，到下半年基本都亏损了，因为那些当红科技股很多都是腰斩了。大家能明白，你要挣百分之百的话，你只要一个百分之五十的亏损你就回本了。情况呢就是这么个情况。\n\n我跟你讲，大家天天听我的直播也好视频也好，就是写文章也好，大家都能看到，我不管他妈是亏损的时候还是啥时候，我在这总是能保持情绪稳定。不像你们一天老有那情绪，老抱怨这个抱怨那个的。我啥也不抱怨，我亏了我也认。我有很长一段时间是亏损的，那大家觉得你现在才赚百分之八，你说那你不是很长一段时间是亏损的吗？啊亏损就是因为买早了。当年有些金属卖出的时候直接不融资就完了，就保持满仓都无所谓。\n\n你看那些人一旦到了亏损的时候，哎呀骂这个骂那个的，那你都不行，你这个你就做不了职业投资，你做不了投资。你这种模式你就做不了投资，你这种心理状态就做不了。啊就得你一人赚钱呢？地球都得看你转？你是太阳啊？说那些臭氧层子有啥用啊。\n\n后面再融资吗？我现在都已经开始融资了。但是现在这局面我就是什么都不能跟你们说，你知道吗？我只要透出来一个字儿，你马上你就去学，现在风险很大，你也别学，你别学我。我是我，你是你，我能做的事儿你不一定能做。\n\n## 七、亏了要找自己的原因\n\n亏了之后当然得找原因，但是你得在自己身上找原因。你别最后找到原因说是由于没有 T+0、是由于没有限制量化、是由于一股独大、是由于大股东违规减持，你找到这原因那你就扯犊子了，那你妈不是在自己身上找原因。哎你中午男主最后踢球踢输了，最后我们想一想原因是由于裁判不公，那你就扯犊子，你知道吗？那他妈相当于没总结原因，你相当于给自己找了个借口。\n\n你这老是大环境不好，咋的，你到哪儿都大环境不好？你是破坏大环境的人啊？\n\n你送点人气票吧，现在人气都掉到第二十四了，我说你们还能整点正经的不？愁死我了一天跟你们。我一天天天还得嘚嘚这事，像要小钱似的。我直播一回人气掉到第二十四，这也不是我的水平应该有的。我就在他妈的小公园直……白坏人气也不能掉到二十四。我只要一去公园，大家都围拢过来，什么脑血栓的、什么九十岁的老头老太太，他都得过来坐我旁边听我白话，你知道吗？咱啥时候人气掉过二十四啊？我不去的时候，有一些小公园的主播敢说话，等我一去了，他在旁边坐着，他不说话了，就是你来了我就不说了。\n\n我昨天又翻到刘继鹏的那个什么直播，给我乐的，哎呀还在强调那个什么一股独大、什么违规减持。我说一到这时候，一到市场不好的时候，刘继鹏那个直播间里人就特别多。天天念叨这点事儿。我告诉你们，如果你们要愿意看的话，李大霄你们常去看一看，千万千万别看刘继鹏，知道吧？千万千万别去看刘继鹏，你看完刘继鹏你就觉得你的亏损都不是你的原因。你要知道，李大霄从来不扯这个，你的亏损就是你自己的原因，我早就告诉你买好股做好人。\n\n所有主播天天围绕着制度哪个地方不合理的，你都不用看，你是运动员，千万不要看这个事儿，你不是制度专家。不是说人家说的就没用，人家说的有用，在人家那一个圈层里头，那研究怎么制度是合理的，不对吗？对。但是你作为运动员，现在你把制度规则背下来，就现在生效的，然后你在你的脑袋里不要判断对这些现行的制度不要做任何的价值判断。\n\n这就相当于你当律师一样，你把现在的法律都背下来，不要对现行的法律是否合理做任何的价值判断，你来成为一个真正的合格的律师。对现行的法律是否合理做价值判断，不属于律师的工作范畴，属于法学家的范畴。你不要搞错自己的社会角色，大家懂不懂这个道理？你在一个既定的条件下生存的人，你就不要老试图去改变这个条件。\n\n我当年招助理的时候，他们只要跟我说人家美国法律是怎么规定的，让他给我滚犊子。你是在美国打官司啊？你不是在中国打官司吗？你老扯什么美国怎么规定的，这地方规定不合理——他妈合理不合理跟你有啥关系？你合理不合理不也是你得靠这个规则来是不得吗？一打不过人家就说规则有问题，一打不过人就说规则有问题。你打不过你就说打不过，他妈规则有啥问题？人家不也是在这规则下面？\n\n总不能承认自己猜对，有的人要承认自己菜的话，那个非常痛苦。你进入市场第一件事就是要对自己诚实，说白了就是要承认自己菜，这是你进步的开始，也是你生存的开始。太多人不愿意承认这一点。所以我经常有的人我告诉他，我说你不用关注我，我说那些问题你也挺不了，你挺不住几天你就完了。你挺不住几天就是说，你关注我，只要说我讲了两星期你还没骂我，那你已经进步了。\n\n你挺不住，因为我给你展示了一个真实的世界，你是受不了的。你从小是在童话世界里面长大的，大家都得哄着你，你是你父母的小宝宝，你在班主任心目中你是一个学习最好的小乖乖，你根本不知道这个真实的世界是啥样的。没有人可以惯着你，所有人都想把你的钱变成我的钱。所以你只要能听我的话能听下去一段，你就知道你就会成熟，我就告诉你。\n\n我菜我认。你看这个小朋友说的\"我菜我认\"，我给你讲件事儿啊，有意思，我就说你从你这话说起来。有很多人说\"我菜我认\"，但是——\"那量化他就不讲究啊，这就不公平啊\"。有没有人这么说话？总得找个借口。有没有人这么说话？大家都见过很多这样的人吧？\"我菜我认，但是那不对呀，他不讲究啊，咋咋咋，你大股东确实违规减持了咋咋咋\"。\n\n我甚至有人我告诉他，我说你不用盯着这事，你都不用说这件事，你说这件事本身就没意义。那\"咋的，他做得不对还不行说吗？\"那我就不再跟他说第二句话了。因为你浪费了自己的精力，你说的那些不公平、不正确，那对我来说那还用说吗？但是你去你能改变得了吗？那你准备把这些事儿都改变了你再去投资呗？你是不是准备把这个一股独大的问题解决完了、违规减持的问题也解决完了、把这个公募基金漂移的问题都解决完了、量化安服务器的问题都解决完了，你才能融资、你才能进行股票投资呗？\n\n讲那个彼得·林奇的书里面，明天晚上我就会给大家讲那个，投资里面最重要的一件事儿，就是你要在信息不完善的情况下做出投资决策。我告诉你，这只是彼得·林奇说的，我告诉你还告诉你另外一句话：投资决策还有另外一件事，就是在市场规则不完全公平的情况下你要参与其中。你需要做的不是要改变不公平，而是认识到不公平的点。\n\n我告诉你不公平的东西可以导致你受损，也可以让你占便宜。你需要做的是怎么能占便宜，不是愤愤不平，你知道不？去年、今年年初开始，那些国家对证金公司减持有多少人天天搁那埋怨：\"那你不说你是长期资本吗？怎么开始减持了呢？你也不公平啊。\"天天骂。我当时就在给大家讲这个道理，你要学会占这个便宜，而不是去骂这件事儿。有多少人听进去了？\n\n这世界就没有什么绝对公平的事儿，你永远都有不公平的东西出现。你应该想的是，国家队原来说不是要做耐心资本吗，怎么突然要减持清空了呢？有的人是盯着这事：\"操他妈他骗我，原来他说耐心资本一辈子不卖，现在他突然卖了他不讲究。\"那我要考虑的就是，趁我通过这事我能赚点啥便宜呢？\n\n哎，他减持的时候他就一定会不计成本地卖。那他不计成本地卖，那你有很多公司它是很值钱的，他不计成本地卖，不正好给你了一个以更低价格买入的机会吗？等他都卖完了，谁会按这个价格卖给你呀？这道理多简单。是不是道理很简单？你现在回过头来，现在已经回过头来了，你现在看是不是道理很简单？\n\n一只常年交易在八块钱左右的股票，由于国家队不计成本的减持愣给打到了五块钱。那你不用等到五块钱，你就六块钱买行不？你六块钱买完，那国家队他那个股票是无限的，他不早晚有一天卖没吗？那卖没了以后它就会涨起来，你就不用等，你就等着就行。这道理就这么简单。然后等他再回到八块钱的时候，你就把这一卖就完了，你说这便宜就占完了。投资就这么简单，根本不需要你又研究这又研究那的。我研究啥？你研究那玩意儿都扯。\n\n这种便宜我跟你讲，不是每年都有，但是出现的时候你一定不能让他占便宜的机会溜走。我反正这机会都告诉大家了，对不对？我年初的时候就给你们讲了，又给你们举例子，红豆绿豆、又举例子羽绒服压毛的。这例子正讲反讲。现在因为不能说个股，我要说个股直接跟你说个股就完事了，那不道理很简单吗？今年你就靠大红了……啥意？不能说个股啊，谁也不能说个股，谁合则个股那个房管的给我踢出去啊。\n\n对呀邻居出国，哎原来我跟你讲他说的不是邻居出国，最初说的是邻居家小孩有病，后来我觉得这个不好，有点不善良，你知道吧？邻居家卖房子给孩子治病，人家便宜房子便宜卖了你一看这房价降了你也卖。买房的故事那就后来非常微观了。我跟你讲，我都给你讲买房的故事我都非常冒险，你知道吗？你这举例这玩意儿它也是一样，你这你过于贴近了就冒险了，你知道吗？\n\n## 八、语言是需要训练的\n\n你们就天天听我的直播，我就告诉你，你的语言表达能力都会提升一个档次，这点我非常自信。普通的老百姓，你如果一辈子不是靠语言表达来生存的话，大体上瞎说话都属于瞎说。你既没有章法，也不知道怎么深入浅出来表达自己的意思。就是你几乎大部分普通老百姓几乎控制不了自己的嘴，你的语言实际上就是你的情绪表达，你就是想什么说什么，我告诉你大部分普通老百姓都是这么做的。\n\n老百姓说气话的时候是他真生气了，老百姓说那个兴高采烈的话的时候是他真高兴抑制不住。你真正的说话的人，你得掌握到：你说气话的时候不一定真生气，你兴高采烈说兴高采烈的话他不一定真兴高采烈。你得能做你自己的嘴的主人，你得想说啥就能说啥，而不是想起来啥就说啥。\n\n你看所有人都能够使唤自己的手，如臂使指，就是你这个就像手使唤自己的手指头似的非常灵活，想做啥就能做啥。但是我发现很多人在使唤自己的嘴的时候做不到，净他妈瞎说，你知道吗？语言是需要训练的，它是一门学问。你别看人人都会说话，你真正能靠说话来生存，那是一件非常专业的事儿。这就像人人都会做菜的不一定能成为专业厨师，道理是一样的。\n\n我就天天给你们举这些例子，我信手拈来，我认为你们在别的地方就很少见，就一个复杂的问题我很快就会让你懂，这就需要训练，知道吗？不也不完全是天赋。你不能说他一点天赋没有，他是有的，但是你专业的说话训练他是需要训练的。\n\n但是大部分人为什么在说话这个问题上他训练不出来呢？就是没有人认为说话是一个需要训练的东西。那没有人认为，说那么我也会说话你也会说话，你打得就比我说的好？哎但是比你说的好？你看同样一堆人在一块聊天，有一个人说两句话就会成为中心。我又没……我老跟你们讲那个道理，我说有的人你一说话别人都想上厕所。\n\n你在单位的那个酒局，单位下班喝酒的时候你没遇着过？你那个某一个老同事说\"这件事我是这么看的，我也准备说两句\"，你马上你就有尿意，马上就想放下酒杯上厕所，不想听。我告诉你哪个单位都有这样的人，你一听他说话你就觉得累。有的人人一说话，一开口两句话就把你抓住，你知道吗？这东西是需要训练的，没有啥这个不是天数。\n\n就是首先你得承认说话是一个需要训练的东西，你得先承认这一点。你别说\"哎呀谁都会说话\"，那可不是。我在哪儿都一样，我在火车上坐火车我跟你讲，我要开始白话起来的时候，前后座的人都来听。原来的老式火车，现在的火车人不许说话，也没人白话了。\n\n废话，什么东西我跟你讲它都需要佐料，说话也需要有废话来组成。你如果什么东西都需要干的话，那也不对。所以你上课也好讲座也好，他都是有废话的。关键不在于废话与否，关键在于你要应对自如，说废话的时候说废话，说有用的话的时候说有用的话。你既不能把废话当成那么主要的东西一直整，你也不能说这一节课一句废话没有。\n\n我们以前上大学的时候我同事教中文、教大学语文，啥也教不出来，动不动就跟学生说我给你们唱首歌吧。我说你这他妈啥大学教授啊，这个就是讲一节课全是废话。\n\n关于说话，我好像以前都给大家讲过一点点，怎么说话，怎么用短句，与这个口头表达和这个书面表达的区别，我以前都给大家写过帖子，甚至讲座的时候好像都给大家讲过。哎呀，什么东西都是需要练的。我没说嘛，你不要用你自己的业余爱好挑战别人吃饭的家伙。\n\n你看那些包括赵本山那些徒弟、小品演员，那些人在说话上收放自如，你知道吗？你包括那些著名的节目主持人，甚至包括我们很多政治人物，都是一样，说话都是收放自如的。你就包括特朗普，那感觉他傻头傻脑的，说了一句话，他都是驾驭语言的能力都是非常强的。\n\n《国王的演讲》那里头那个人，就是伊丽莎白二世的父亲。他的哥哥就是温莎公爵，就是那个不爱江山爱美人的那个人嘛。人就是这么……要是没有他那个，伊丽莎白二世如果没有他那个——他那个伯父就是温莎公爵，没有他那个温莎公爵娶了个美国的寡妇，那无论如何轮不到他当国王啊。\n\n## 九、四季度要盯住美债收益率\n\n接下来四季度大家需要一直关注的事儿就是美债收益率，美债收益率你们一定要关注啊。现在美债收益率有一些回暖，所以说市场就会有一些这个信号。你看昨天那个有色的股票都涨得不错，它就跟美债收益率的回暖有很大的关系。\n\n那美债收益率受啥影响呢？受美联储加息的影响。所以你现在十月份不加息现在已经被充分定价以后，十月份的这个议息会议应该是在十月十八号，十月份的议息会议结束马上就开始，人们就开始关注十二月份的议息会议。那到时候美债收益率会不会重新开始上升？那你需要观察。如果美债收益率重新开始上升、继续开始上涨的话，那你这些今天这些回暖的东西它可能又反过来，这个东西大家就需要关注，你知道吗？持续地关注。\n\n彼得·林奇把投资股票比喻为玩德州扑克，就是那个梭哈游戏。就比喻成那个你每出来，因为你有两张牌是扣着的，剩下的牌是明着的，那你每发一张新牌你都要重新判断，每发一张新牌你都要重新判断。所以我在市场上我最反对的说\"你不说什么什么什么吗\"，我说的东西都永远在变化，根据不同的情况叫永远在变化。\n\n彼得·林奇就说，你要是玩股票的话，它相当于玩一局五十张扑克牌的梭哈游戏。你说它不是你普通的那个梭哈五张、那七张牌，你要是玩股票的话它相当于从五十张开。那你每一次出完你都要重新判断。在玩股票还玩海枯石烂呢？\n\n股票里面投资股票你要做一个渣男，你知道吗？你就随时准备跑路，一看不行了你立马跑。我最怕的是散户研究基本面，一到他妈下跌就开始研究基本面，把他们原来研究的基本面再重新背一遍，我操这最要命。\n\n你看我很少给大家说一个公司的基本面。因为经常有门骂我的时候就说你那没有数据，哎没有数据没有逻辑什么什么的。这个一方面是由于现在不能说个股了，所以说我也不能写这些东西；另外一方面是我认为这都是基础逻辑。那你选股的时候你应该这事都已经解决完的问题了，你要不然你根据啥选的你告诉我？你买完了以后持股的时候天天选、天天说这玩意儿，那有啥意义呀？\n\n每天说这些事儿只对一件事儿有意义，对于你决策是应该卖出呢还是应该继续持有有意义，否则它没有任何意义。你不能说我现在就决定持有了，我再把基本面说一遍，那你就搞错了因果关系。你怎么老是不明白这道理呢？\n\n我一直持有的东西，今天持有一年了，你看我跟你们说过一次它的基本面变化吗？那你的意思就是说我根本不关心他的基本面呗？就是那你的意思我买这些股票就是属于就像一个快枪手，是把眼睛蒙上进屋就一顿乱射呗？那是因为我已经把基本面都研究完了，我觉得就应该持有，我无论它上涨下跌都决定持有。我绝对不会等它下跌的时候再把基本面背一遍来安慰自己，没有任何意义。我不需要安慰自己，我老自信了我安慰啥自己？我希望它下跌，明天再跌点我就再买点。\n\n我希望所有人都看空它，这就是我要买的一只股票，就是这样的。那有的人你就受不了了，你买入了以后那别人就不能恶意看空。就恶意看空我也……这个事吧对我来说也是有个影响。我跟你讲，从这件事儿现在我也在反思这件事儿，就是说未来是不是有必要提示大家去说一些我们根本不持有的股票。\n\n我后来想一想也是，人家买的这些股票不想听别人看空。那我当时主要是为了我自己的这些粉丝，既然大家信我，我就告诉你那些东西有风险，虽然我没买，我建议你，就是说\"我告诉你那东西有风险，你就别轻易去，反正你要是买的话呢，你也知道你愿意承担这个风险\"。我主要是为了自己的粉丝。当然你这个东西你一旦说出来它就有人，尤其现在我的粉丝多了，他就觉得你伤害到我利益了。所以说确确实实我也在反思这件事儿，以后这样的事儿应该少说了。\n\n以前呢也是给大家考虑得太多了。现在反正我该说的、该做的都给大家讲过了、做过了，大家也都能自己明辨是非了，所以以后就不说这些东西了，咱就扯点外国溜，自己的持仓更不能说了。现在你在公共平台上能说的东西已经很少了，已经很少了。以后只能在这个小范围里面去提一提，是要有风险就在这个小范围里面提一提。要不然的话没整，你涉及到别人利益，人家来骂你，骂完你吧，是我可以给他拉黑，但是呢总的来说你也心里不舒服。\n\n说行业我就说的就是行业。我年初不是说有色吗？那不是把那什么那些一众英雄汉全惹来了吗？我刚开始说的就是行业，说行业咋的？我科技从来都说这是行业，我都没涉及到个股。还说行业，说行业咋的？做行业人家跟你干，你知道吗？我说行业的时候，人家那些听的人自动带入自己的股票，你知道吗？我说有色的时候我说的都是有色金属，我从来没涉及到个股，那人沾样跟你干。给我干疯了我才跟他们干个股了。\n\n哎现在还在骂我呢，他们那些人说……他妈那些在不骂我他不会说话。我早就他妈不看空有色了，他不照样骂我吗？一样。现在更不用骂我了，现在我持有有色了，那你就别骂我了，我早就不看空有色了。你跟他们说这事没有意义，不说就最后就不说最好。我就给大家讲道理，大家就是评书，你最后就看你自己的悟性了，你要强你就强，我们也不能手把手教你。\n\n那我要不披露我自己的持仓？你不能再说了，再说一会儿给我抬走了操。那他不不是嘴笨了，是他妈不能说，你知道吧？你说高兴了一会儿他妈吐噜出来了我这……那天说嗨了就被人抬走了。我告诉你，一次抬六十秒，你们这回放就没了。他那个平台的规则就是你只要这一次当中有违规，他给你抬出去六十秒，你这个回放就完了，就不能发了，就是这里面不能有违规。\n\n组合那是模拟的，那跟实盘不一样。组合我还不更新组合。现在连雪球自己都认识到这个组合的风险了，其实我觉得雪球可能未来组合都办不下去了，未来用不了多长时间组合都得停掉。你看现在那个组合上边都有一句话，就是不是那个代表实际收益的那个。因为组合这种东西它就特别容易被利用。\n\n那组合这东西太容易被利用了，一起开一百个号玩不同的组合，然后哪个成功了哪个拿来忽悠。你以为说雪球的那个组合说那个不能删掉、你停掉了你也有历史记录，那那么简单吗？我开一百个号，一个号一个组合，然后哪个组合做得好，最后就拿哪个来忽悠你。这东西我都跟你说，这都是老外他妈玩烂的东西了。\n\n啥都别轻易信，知道吗？自己就是自己做自己的世主。事出反常必有妖，你就是有很多东西他做不到就是做不到。你这一个人说我做五年组合做他妈一百倍，那你就别信，那事儿那都是扯淡。那就是组合能做到一百倍，实际上他也做不到一百倍，那是钱，你把钱带进去情况那不一样了。\n\n那跟这玩电子游戏一样，你可以一百条命你啥都能过去。你要是真打仗，你能过去吗？你告诉我。你有一百条命可以不断重来的话、可以那个档案存储的话，你啥都能过去。你真打仗的时候你能过去吗？一枪你死了。等下辈子们。模拟的东西和现实的东西它永远不一样，我跟大家说过多少次，不用看那玩意儿，没有用那东西。组合可以冒险，你真正拿钱能冒险吗？那当然不一样，那完全不一样的东西。那就跟打电子游戏和真打仗的区别，那都能一样吗？你玩 CS 和真打仗的那种感觉能一样？\n\n真正的投资没有推倒重来的说法，你组合可以推倒重来，不行再起个号。雪球的组合还有一点好处，就是说他想到了这一点，所以雪球的组合停掉的组合实际上它是删不出去的、是不能删除的，他这一点他想的挺美。那你都没想到，那你还可以注册无数个号，我看你想不想做这件事儿。对呀，一米高的独木桥和一百米高的独木桥它是不一样，虽然桥都是那么宽。\n\n现在这六百多人了，再播十分钟我就下播了，给大家播两个小时吧。主要主要是给大家弥补一下昨天的，昨天嘛播了四十分钟，一看有个交易我就赶紧去交易了。这两天还做了不少 T 呢，还赚了不少钱呢，真的，做题赚了不少钱。\n\n那机会稍纵即逝，那当然了，那你出去那你马上你就得做，做完了以后你就没机会了。哦昨天买完它就涨了，后来然后我就踢主角了。我早就不看空有色了，那我啥时候都说不看空有色了？那我那我是啥时候开始持仓呢？我不能告诉你。几个点就提，我两个点我都赚不少钱，我都说他一个点就可以提。有几个点？我踢出一个点够五百个点长，我给你们白话一个月还不如我踢一下子。\n\n踢飞了？什么叫踢飞了？踢飞了就没赚着，最后没赚着那么多钱呗。你赚钱了就完事了，你还有什么踢飞不踢飞？你就得卖到最后一个点、历史最高价，对不？只要有一个人比你卖得高一分钱你就受不了。\n\n## 十、做T的本质\n\n所谓的 T，实际上就是指当日买卖。因为 A 股实行 T+0 制度，所以说……你不能当日买卖，那怎么能做到当日买卖？你得有底层，就是你自己的长期持仓。当出现波动性机会的时候，你就可以进行做题操作，明白这道理吧？\n\n你可以说它是为了增厚利润，也可以说它是为了降低成本，道理都是一样的。你如果单独拿这一笔做单独记账的话，实际上都是个单独收益。你自己的持仓长期持有的它也一样会有波动，那你为什么不利用这种波动呢？这就是做题的来源。但是你一做题得分地方，你有的地方不适合做题。\n\n一般踢多少仓位？那不好说，我有的时候可以全仓踢。那你看你的机会，你觉得机会的概率有多高，这东西取决于你对未来的把握。如果你确信是百分之百，啊我就可以全仓提；如果我今天能确定他有个百分之一到两个点的差价，那我全仓踢一下那就挣百分之一到二，道理就这么简单。你隔日提都可以，你如果说我确信我这个票是在底下它一定会往上走的话，那你就在底下的时候，你就他每天再跌的时候你再买，那你涨上去一点我今天就把今天买了就卖了，你明白吗？这笔我就单独核算。\n\n那有的人 T 经常犯的一个错误，就是你低位买进去，他一涨上来你就觉得他还能涨，你就变成持仓了。然后你一卖出他继续打，哎呀这假踢飞了。那你可不可以想说，那我压根儿就相当于自己没买行不？\n\n为啥开始操作了能赚钱呢？是不是要……为啥开始操作了？那玩意儿有啥为啥啊？能赚钱我就操作，我认为赚钱概率大的时候就操作，概率小的时候就不操作。六月份的三季度我就一笔交易都没做，怎么了？经常有人问我，你主打什么风格？老师你主打什么风格？我就主打赚钱的风格。\n\n原来也没人让你不让你操作呀，你怎么考的？你下个月就操作，你还分哪个月？咋的你那下个月咋的算好了，你到庙里抽签了下个月适合操作啊？不会做题就不做呗，这个东西你得需要若干年的经验。你等到你说我可以做的时候，你自然就学会了。\n\n啊我以为你开始操作的时候会通知我。啥时候告诉你我操作的时候会通知大家？我啥时候说的？我还操作的时候会通知大家？我为啥要通知大家？我还通知你？你这整得挺有意思了。\n\n做题的本质就是拉低你的买入成本。那玩意儿没有啥本质，你说的可以说是成本也行、增厚收益也行、单不合算也行，反正这笔钱是你的了。和你没做这笔 T 相比，这笔钱就是你赚的收益。这玩意儿没啥本质不本质的，就是你把别人的钱要整来一部分。至于说你这笔钱是记到成本里还是记到收益里，那是你自己心理上记账的问题。本质就是你又弄来一部分钱，你知道吗？\n\n我节前做过一笔操作，是给大家看了买卖的那个单子都给大家看的。我前两天看到有一个人问我，说在那个当年他不是弄了一笔一手空单嘛，但现在咋样了？还搁那嘲笑我呢。关心我的人真多我发现，还搁那嘲笑我的空单呢，有意思吧。\n\n你他妈连手续费都挣不出来的话，你还做啥 T 呀？咋叫浪费手续费呀？那手续费不是你的成本吗？你得做一笔 T，你不得把它计入成本吗？你做一笔 T 连他妈手续费都没挣出来，你不是相当于亏损了吗？那你还做啥 T？他频繁做题浪费手续费，那这都胡扯，这都伪命题，逻辑混乱到啥程度的人能说着啊？\n\n你每做一笔 T，你交易的佣金、手续费、印花税你不都得剔出去吗？那是你的成本，你这都不剔你就开始计算他妈挣钱还是赔钱呢？包括说频繁交易什么贡献手续费，那都胡扯。那你每一笔交易不都得把手续费掏出去吗？有很多那种似是而非的说法，就是你仔细想你就知道了。你有很多的似是而非的说法，他都不知道这个东西是咋回事、细节是咋样，完了他听别人说他就那什么了。\n\n这些东西从宏观的角度和微观的角度来说它是不一样的。如果这个市场所有人都频繁做题，最终所有人都不会赚钱，为啥呢？因为你最后所有的贡献在摩擦成本里面了。假如说现在这个市场每天所有的人都把自己的仓位踢一遍的话，那你得交多少印花税？那你这个你得交多少过户费？你得交多少手续费、交多少佣金？那这市场的钱几天就被干没了。但问题在于，你不是所有人都是天天这么做。\n\n如果所有人都把自己的仓位踢一遍的话，那不就相当于每天的换手率是百分之百吗？一个市场能做到每天换手率是百分之百吗？哎呀都是他妈扯犊子。我跟你讲，说话吧都不挖掘底层逻辑。那不，那不是券商开心死了？那他妈的财政部开心死了，你一天得交多少印花税啊？那你不是现在成交量不得到七十万亿了吗？你现在现在的市值多少？你市值多少成交量就是多少，那个换手率那不胡扯吗？\n\n来，把评书给我打在公屏上，我准备下播了。嗯对，有些瘦的？你不按全流通的算吗？你全的也不能，那就这就是一说，你还这么认真。那哪有那么多买盘呢？你市场里有那么多资金吗？你现在全流通的市值是七十万亿，那你市场里面有七十万亿把这些钱全买过去吗？所以那是不可能的那就是一说而已，别太认真。\n\n来，把评书给我打在公屏上。我说的所有的个股都不能用来指导投资，大家一定要注意。我今天没说个股，行业也不能用来指导投资，大市也不能用来指导投资。我不是专家。我就是一切的东西都是老百姓的民科的做法，总的来说就是一个讲评书。谁给我拿那掰手就给谁抬走，我就给谁拉黑。\n\n今天那人气保持得不好，这现在的人气又掉二十了，我也懒得跟你们去掰扯这事。但我认为今天讲的干货比较多，所以说大家就没有回复，就没有回复也无所谓。我还寻思拿这事当开玩笑，这也就是就像你们说的那个，这是讲东西的佐料，是属于废话的组成部分。\n\n好了我下播了，谢谢大家陪伴啊。以后那个早晨八点再给大家开播的时间就会少了，因为以后我可能会在这市场上投资的投入的精力会大一些，因为我以后会有交易的。前一阶段三季度之所以能在白天经常给大家播，是因为我那个时候一直都没有交易。所以以后如果再播的话，尽量放在非交易时段，好不好？就这样吧。\n\n也不一定老装车、装车卸车、导短嘛，咱叫导短你不明白。坐题就是导短，就是从村东头拉到村西头啊。好再见，谢谢大家，我关播了。","toc":["一、开场：东北供暖与昨天的操作","二、神秘队往小盘 ETF 投钱，为什么涨的是大股票","三、美股是种地模式，A股是狩猎模式","四、港股的双轨定价：基本面随中国，货币随美国","五、风格转换与\"别听我的\"","六、今年收益率复盘：我犯的两个错误","七、亏了要找自己的原因","八、语言是需要训练的","九、四季度要盯住美债收益率","十、做T的本质"],"url":"https://www.bilibili.com/opus/1257440946803441685","bv":"","minutes":0,"chars":21893},"ai":{"title":"老木匠·2026年10月10日：市场博弈、港股逻辑与投资心态","text":"## 一、当前市场：美债收益率缓和与资金流向\n\n1. 美债收益率缓和，带动贵金属和有色上涨\n\n他开场总结了昨天的行情：美股涨得不错，最重要的是美债收益率有所缓和。逻辑链条很直接——美债收益率一缓和，黄金、铜这些跟着上涨，带动贵金属和有色金属板块整体走强。他认为这个行情很健康，但能不能持续是个问题，需要走一步看一步。\n\n炒股票不是谈恋爱，不讲究从一而终。只有没有变化是不变的，剩下所有的东西都会变。\n\n2. 四季度持续关注的核心变量：美债收益率\n\n他明确点出四季度大家必须盯住的就是美债收益率。当前10月份不加息已被充分定价，等10月议席会议一结束，市场立刻就会开始博弈12月份会不会加息。如果美债收益率重新开始上升，今天这些回暖的东西就可能反转。这个变量需要持续跟踪，没有一劳永逸的判断。\n\n## 二、神秘队救市的真实逻辑：防流动性危机，不是拉价格\n\n1. 神秘队的钱往小微ETF里投，涨的却是大股票\n\n他提出一个值得观察的现象：昨天宽基ETF的申购主要集中在中证1000 ETF、2000 ETF、创业板ETF这些小微品种，但最近涨得比较稳定的反倒是大股票。为什么神秘队花大量的钱往小微ETF里砸，受益的却是另一批资产？\n\n2. 神秘队的目的是防止被动卖出，而不是把价格拉上去\n\n他给出了答案——神秘队防范的是流动性危机，是买盘枯竭后的踩踏，而不是要把价格推上去。\n\n他只要搁底下拖着你——你卖我买，就类似做市商，防止买盘枯竭就可以了。投进去的钱只是让原来跌5%的变成跌1%，并没有上涨。\n\n理解这一点非常关键：在神秘队稳住底部的窗口期，那些真正聪明的资金（持有高位套牢筹码的机构）就可以利用这个机会出货，把货卖给以为\"神秘队来救市了\"的散户。出去的资金再去买他们认为有机会的品种——这就是为什么小微ETF没涨，大股票却在涨。\n\n3. 高位套牢的散户已经是\"沉默账户\"\n\n他直言：那些在高位买了套牢的散户，对市场来说已经没有任何意义了，叫\"沉默账户\"——再跌几天，他们连看都不看了。\n\n好容易把你埋起来的，还给你挖出来，挖出来以后再埋谁？你们这一波人在1200卖给我，到1500再买回去——这种事是不会干的。那1500还谁去买呢？\n\n他的结论是：这一轮高位套牢的故事基本已经结束。接下来就是如果下坡下得太快，就有人来踩一脚刹车，防止车毁人亡——慢慢下来，不至于踩踏。\n\n## 三、A股与美股：两种截然不同的市场生态\n\n1. 美股是种地模式，A股是狩猎模式\n\n有人问为什么A股不能像美股那样缓慢上涨。他给出了根本性的解释：\n\n美股没有傻狍子，所以只能缓慢上涨——你把价格拉高了，人家就全卖给你。美股的盈利模式是种地模式，必须依赖上市公司基本面上升，股价才能上升。而A股是狩猎模式，根本不需要等公司真正的基本面回报，只需要博弈，把东西卖给傻狍子就完事了。\n\n他进一步解释，美股的散户成交量不到35%，而A股散户成交量原来是85%，现在降到70%。这个市场结构的差异，决定了两种完全不同的交易逻辑。A股机构的工作是捕捉热点、利用散户信息不对称；美股机构的工作是研判基本面，判断错了就亏钱。\n\n2. A股的定价机制：股价涨跌本身就是信号\n\n他指出A股一个独特的现象：普通散户根本分不清一份季报是利好还是利空，他们的判断依据是股价——一出季报股价涨就认为是利好，股价跌就认为是利空。\n\n而机构深知这一点，所以会反向操作：明明是利空季报，他们就先往上拉升——一拉升，散户涌进来，机构就可以在拉升中出货。这就是A股定价效率低、但机构却能从中获利的根本机制。\n\n3. 用港股类比：四大行的合理价格应该是港股价格\n\n他用四大行举了个例子：四大行同时在港股上市，如果把港股比作美股模式的定价，那么四大行的合理价格就应该是它在港股的价格——随基本面增长、随货币宽松而上涨，稳定而缓慢。A股的溢价部分，本质上就是\"狩猎模式\"所带来的博弈溢价。\n\n## 四、港股为什么涨不起来：一句话说清楚\n\n1. 港股的核心矛盾：经济跟随中国，货币跟随美国\n\n这是他这场直播最核心的一段干货。他用一句话概括了港股的处境：\n\n港股的市场是经济基本面跟随中国，货币基本面跟随美国。经济基本面过冷，而货币现在处于紧缩状态。\n\n他解释了背后的逻辑：股市反映的是经济热度。经济过热时会通胀，为压通胀就要货币紧缩；经济过冷时要刺激，就要货币宽松——两者是配套的。但港股偏偏是错位的：经济用的是大陆的（过冷），货币用的是美国的（紧缩），两头都不占，自然涨不起来。\n\n2. 什么时候是投资港股的最好时机\n\n从这个逻辑倒推，答案就清晰了：投资港股最好的时机，是中国这边经济过热开始升息，同时美国那边经济过冷开始降息——两边都顺风，港股才能既有好的基本面，又有宽松的货币。\n\n他用疫情期间举例：那时候美国无限量宽松，而中国是唯一能维持正常生产的经济体，港股上市公司（腾讯、美团等）的基本面全部来自中国大陆，供需两旺，港股自然大涨。这就是上面逻辑的完美验证。\n\n3. 目前不投港股的原因，以及什么时候会投\n\n他明确说自己目前不投港股，因为时机没到。港股现在确实便宜，但还会更便宜。未来真正值得大举布局港股的时机，是由美国引发流动性危机的那一刻——\n\n真正由美国引发的流动性危机，最值得投资的就是港股。因为A股有神秘队护盘、有外汇管制，外资不能随便抛售A股；但港股没有这些保护，会跌得非常吓人。越吓人，就越有机会。\n\n## 五、投资者的正确心态：在既定规则下找便宜\n\n1. 亏了钱，要在自己身上找原因\n\n他对那些把亏损归咎于\"T+1制度不公平\"\"量化不公平\"\"大股东违规减持\"的人直接批评：\n\n你不是制度专家，你是运动员。你要做的是把现行规则背下来，然后在规则内生存。就像律师要把现行法律背下来，不对法律是否合理做价值判断——那是法学家的工作范畴。你搞错了自己的社会角色。\n\n他认为，进入市场第一件事是对自己诚实，承认自己菜，这是进步的开始，也是生存的开始。老是把失败归咎于外部条件，那就是相当于没有总结原因。\n\n2. 不公平本身也可以是机会\n\n他进一步指出，不公平的规则不只是让你受损，有时候也可以让你占便宜。关键是你要认识到不公平的点，然后利用它，而不是愤愤不平。\n\n他举了国家队减持的例子：原来说是长期资本、耐心资本，突然开始减持清仓，很多人骂。但他当时给大家讲的是另一个角度——\n\n国家队不计成本的卖，一只常年交易在8块钱的股票被打到5块钱。那不正好给你了一个以更低价格买入的机会吗？等他都卖完了，谁还会按这个价格卖给你？\n\n## 六、做T（倒短）的本质与正确方式\n\n1. 什么是做T\n\n他解释了做T的基本逻辑：A股实行T+1制度，当日买入的股票不能当日卖出。但如果你有长期底仓，就可以用底仓做当日买卖——低位加仓，涨上去卖出加仓部分，底仓维持不动。这就是做T，也叫\"倒短\"。\n\n做T的本质就是拉低你的买入成本，或者说增厚收益——这两种说法是一回事。你比没做T的情况多赚了这笔钱，就是这么简单。\n\n2. 做T的前提：要有确信的机会\n\n他强调做T不是随时都能做，要在你确信机会概率比较高的时候才做。确信有1%到2%的差价，就可以全仓做T，赚完就了结；确信不够的时候，宁可不做。他自己三季度一笔T都没做，到四季度才重新开始操作，就是因为三季度看不到高概率的机会。\n\n3. 做T常见的错误\n\n他提到做T最常见的一个错误：低位买进去做T，结果一涨上来觉得还能涨，舍不得卖，把原本的短差单变成了持仓增仓——等后来跌下去，T就踢飞了。他说解决办法很简单：当初买进去就按T来记账，涨上来就是目标价，卖了就完事，不要贪。\n\n4. 关于组合、模拟盘的警告\n\n他顺带提醒：雪球上的模拟组合和实盘是完全不同的两件事，千万不要被那些\"组合收益100倍\"的数字迷惑。\n\n模拟盘就像打电子游戏有100条命，可以不断重来；真正投资是打真仗，一枪就死。开100个号玩100个不同的组合，哪个成功就拿哪个出来忽悠你——这是老套路了。\n\n## 七、投资决策的底层哲学\n\n1. 像打德州扑克一样每次重新判断\n\n他引用了彼得·林奇的比喻：投资股票相当于玩一局50张牌的梭哈游戏，每发出一张新牌，你都要重新判断整体局势。所以他最反对的就是那种\"我说什么什么来着\"的固执——市场在变，你的判断就必须跟着变。\n\n投资股票要做一个渣男，随时准备跑路。一看不行了，立马跑。\n\n2. 基本面研究是前提，不是安慰剂\n\n他批评了一种普遍现象：股票跌了以后，很多人把原来研究的基本面重新背一遍来安慰自己。他认为这没有任何意义——基本面研究是买入前就该做完的事，买入后的作用只有一个：决定现在应该继续持有还是卖出。\n\n我已经把基本面研究完了，觉得就应该持有。我无论它上涨还是下跌，都不需要再把基本面背一遍安慰自己。我甚至希望它再跌一点，这样我就可以再买点。\n\n3. 在信息不完善、规则不完全公平的情况下做出决策\n\n他最后总结了投资的两个核心前提：一是彼得·林奇说的\"要在信息不完善的情况下做出投资决策\"；二是他自己补充的——要在市场规则不完全公平的情况下参与其中。你需要做的不是改变不公平，而是认识到不公平的点，然后想办法从中占便宜，而不是愤愤不平。","toc":["一、当前市场：美债收益率缓和与资金流向","二、神秘队救市的真实逻辑：防流动性危机，不是拉价格","三、A股与美股：两种截然不同的市场生态","四、港股为什么涨不起来：一句话说清楚","五、投资者的正确心态：在既定规则下找便宜","六、做T（倒短）的本质与正确方式","七、投资决策的底层哲学"],"url":"https://xueqiu.com/2573414707/411805882","chars":3769},"topics":["市场博弈、港股逻辑与投资心态"]},{"date":"2026-10-09","bili":{"title":"老木匠 2026年10月9日直播文字稿（美债美股翘翘板、周期底部看现金流、股东人数与筹码博弈、电解铝","text":"## 一、开盘前：美股与美债的翘翘板\n\n昨天美股纳斯达克跌了一点，但昨天有一个好的迹象，就是美国的美债收益率我看有点降下去的意思。 如果美债的收益率能持续降下去的话，那还算是有点起色。\n\n如果美债的收益率一直这么升高的话，那么所有的企业都受不了。\n\n现在也有人说，国债的收益率已经跌出了足够的空间、足够的吸引力，会有一部分股市的资金回流到债市。不知道这个过程是否能够是真的、是否能够持续，这就得一边观察一边看。我们没有第一手的资料，判断不了。 但是有这么个说法——就是美债现在的收益率足够有吸引力了。\n\n十年期美债都五点多，三十年期美债前几天最高摸到五点七。那是不是有一些风险偏好比较低的资金会从股市里面退出来？所以未来会不会出现美债和美股出现翘翘板效应，就是美债涨、然后美股会调整？这个东西只能一边走一边观察，看不出来。\n\n昨天我看美股也是科技股跌得比较多，但是消费股这些都还是涨的。 所以我感觉他这个美股现在也有一个结构分化的问题。\n\n毕竟这些年他消费股被压制得很厉害了，美股的消费股也是被压制得非常厉害。 你就想前一阶段的那个耐克那个风波，大家都知道，你看耐克那个跌多少——耐克从高点下来就跌去百分之八十了，你现在要回到高点得涨五倍。\n\n你说耐克那公司基本面有啥问题？我觉得没啥问题，都很好。 这东西就是市场它就是有投资偏好、资金有投资偏好的问题，你不在热点上，它就是买的人就会少。\n\n（关于耐克的传言）那都是传言，那东西都不是最主要的。主要的还是一个投资的偏好变化，另外一个就是经营这些年可能也确确实实有些小问题。至于什么抵制这抵制那，那都不是主要原因。 你要说抵制他就成了个坏蛋的话，那他原来他也不算什么好人。\n\n## 二、昨天的下跌：就因为涨得太高、太贵\n\n就像昨天的市场一样，昨天 A 股的市场下跌了之后，一定有一大堆人给你找原因，找这原因又那原因，FCC——反正隔一段时间老有这些奇怪的字母出来，FCC 是啥我也不知道，反正大家都在说。\n\n但是我认为他没有别的原因，就是因为涨得太高，而且他太贵了、估值太贵了、不值那些钱。\n\n涨高了以后，在筹码上获利盘就很多，就有兑现的需求；另外一个，他的估值这么高，也难以支撑他现在的价格。所以我觉得这没有啥道理可言，剩下其他东西都是诱因。\n\n有的时候甚至他是为了用一个你看似合理的理由，去掩盖他们真实的原因——真实的原因就是他们也认为高了。他们也要认为高了的话，他出货的时候他不能告诉你说\"我认为那玩意儿不值\"，那你能买吗？所以他得告诉你另外一个理由，最好是一个真假难辨的理由。\n\n我讲过多次了，这就是那个\"谣言出货法\"。\n\n（昨天大家有没有因为创业板下跌受损失？有损失的扣一，没损失的扣二）我看来你们这些都是老粉丝，扣二的居多，就是大家都没有损失，说明你们都没买科技股。 昨天科技股其实损失是挺多的。\n\n昨天我觉得，就是稍微能够除了那些题材股依然是那种有涨停的题材股之外，从大类上来说，中字头昨天好像长得比较好，起码是没跌。 另外包括那四大行啥的，好像也都是没跌。\n\n有色其实昨天跌的不是普遍现象，大部分铝都是涨的呀。 所以跌也很正常，跌就是因为他太热了，热了他就是估值高，所以说跌就很正常。\n\n有色的铜矿股跌了吗？那你那别的股没咋跌，行业都没咋跌。那今天应该受点考验吧，要说跌的话今天应该跌。\n\n猪肉买多了、拖了、后悔？那你猪肉现在还在（跌），我觉得猪肉还缺最后一击，你猪肉还不是买入的好时机。\n\n## 三、周期股底部：看现金流，不看盈亏\n\n光伏这种东西你就不能考虑它涨跌，知道吗？就不能考虑这件事儿。它是一个周期的底部，你就必须要有足够的耐心。 这个时候就叫埋伏，你不能指望说我买进去明天它就涨——那你就不叫逆向投资，那你做的就不是这事儿，就不对，那你还是做趋势投资的。\n\n我不是以前给大家讲过趋势投资和这种价值投资区别在哪儿？你现在投资周期股的底部买，当然这东西你得区分好标的：就是你买的这个东西必须得能挺过这一次周期的低迷期。 大部分他挺不过去。\n\n那你怎么能够分析出来一只标的能在这个行业的低迷时期挺过去？怎么来分析这件事儿呢？\n\n那么你主要应该看的就是他的现金流。 这个时候亏损和盈利并不重要，你主要看他账上储备的现金是多少，然后按照现在的亏损速度，你大概能计算出来他能挺多少年。\n\n所以周期到底部的时候，真正使公司倒下的并不是他的资产负债状况，而是他的现金流量状况。\n\n这个你就得需要去看、会看那个财务报表。你得分析他的资产的流动性是咋样的。有的公司资产负债率虽然不是很高，但是基本上已经全部都是固定资产了、全部都是存货了，账上已经没有多少现金了——这种他就是抗风险能力就已经很低了。\n\n所以在周期底部的时候，你分析一个公司它的业绩反倒并不是很重要。所以这个公司今年亏二十亿、那个公司明年亏三十亿，你非要分出来他俩好坏，其实意义不大。 你这个时候你要找的是啥？你要找的就是那种能挺住的。 那怎么能挺住呢？就是现金得足够，现金够就是就能挺住。\n\n你看那养猪的也是一样，你看谁账上现金多、然后有息负债少——尤其是短期有息负债，就是短期的、到期的这个银行贷款它少。这个涉及到一个比例的问题：就是你的现金和现金等价物是否能覆盖短期的有息负债、能覆盖多少年，这个东西你需要自己去算一算。\n\n其实你只要找到那些龙头——龙一、龙二、龙三的这种，一般来说，它经过充分的调整、到周期底部之后，你买进去基本都是只输时间不输钱。\n\n当然了，有的时候龙头也会出问题，所以说你必须要仔细分析他的资产负债表，必须（确认）说这一轮周期过去以后他能胜出。所以他到底部的时候就都有这么个特点：到底部的时候股价极低、股东人数极多、然后关注力特别差。 基本上这种情况你就可以买入。\n\n但是你买入以后，你就说\"我买入以后它明天就得涨\"——它明天还跌呢，还得买。 你谁也不能判断出来一个公司就是一个尖尖的底部的那个小尖尖，说我买完明天它必须涨，那谁也判断不了。那你得找神仙，你得听观音菩萨的课你知道吗？那我们就是做不了那个事儿。\n\n那底部它一般来说会持续很长一段时间，你这玩这个你就得有足够的耐心，那不是谁都能玩的。\n\n底部股东人数当然多了，因为主力上一次都已经把这个东西都卖了，所有人都已经出去了。下一步就是人家再进来，再进来的过程股价就会慢慢地抬升了，因为有人收集筹码。你就看他慢慢股票（有波动），即使是不抬升它也会有波动。\n\n你其实在底部的时候——我给你们讲这个，你要技巧高的话，在底部可以做很多波段你知道吗？ 不是那种日内波段，就是说当底部股东人数已经足够多、有主力投资基金进来希望收集筹码的时候，那么它一定会出现股票的波动。 因为收集筹码只要一快，股价就会上涨，那么他就会停下来，然后股价再回去——所以底部就会有那种非常小幅度、不是很大的那种波浪，但是你在那个波浪下边是足够你玩的。\n\n如果你不想玩，我也不在乎这波浪，那我就等着就是了。最后等他收集完了以后，他一定会拉升的。 所以等到他收集完的时候，你就会看到这个股价慢慢地抬升，然后你再看这股东人数就开始逐渐变化了、就开始逐渐减少了。\n\n## 四、股东人数多不是问题，关键是股价位置\n\n股东人数多并不是个问题，关键你要看股东人数多的时候股价所在的位置。\n\n如果股价所在的位置是低位的话，股东人数多并不是问题；但是如果他是过去几年已经涨了好多倍、涨了十倍，现在股东人数突然变多了，那就是个问题。 那你想，你拿脚后跟都能想明白——那不就是有主力机构在出货吗？那在高位的时候他把货都倒给你散户，我问你，你散户你用什么来维持这个价格啊？\n\n因为这个时候散户也大部分都是获利盘、搁底下上来的，散户也都是获利盘，那么你们这些散户如何来维持这个股价的高位呢？ 你对于主力资金来说，人家可以做类似于做市商的这种东西：你有人卖我就买，所以你股价跌不下去，我可以进行股价维护。你散户你怎么股价维护啊？ 一个人跑，第二个人就想跑，大家都想跑，最后就踩踏。\n\n所以说你要知道，不是说股东人数多就不好，股东人数多取决于你这个股价所处的相对位置。 你股价在高位的时候，股东人数多当然不好，那还用讨论吗？\n\n有不少人现在还经常跟我讨论这事儿：那股东人数多，人家你看人家还是上涨的。那你不知道人家当时的那个股价所处的位置，你那是啥位置、人家那是啥位置？ 你是只知其一不知其二。\n\n所有的这些东西都是相互作用的，没有一个因素说可以决定（一切），说我就看这一个指标行不行——不行，我就告诉你。\n\n那有的股票随着上涨，股东人数越来越少，那它未来可能还有上涨空间，因为那个时候所有的股票都集中在少数人手里头了。\n\n你包括放量这种东西都是一样，放量你区分应该是高位放量还是低位放量。 你在底下突然一个放量的大阳线，这就是好事儿；你在顶部突然一个大阳线、上边有上影线的，那就是坏事。\n\n## 五、筹码博弈：分红不能当题材炒\n\n因为有很多人——我们这个雪球论坛里尤其有——很多人不承认有这个筹码博弈，筹码博弈对这个股价对他们来说是没有影响的。因为他要一给你讲课的话，就是你那从哪博弈？那都没有用，公司主要的还是看公司取得多少利润。\n\n取得多少利润？我告诉你，那公司如果没有人博弈的话，他也可能不涨。\n\n你都说自己就是看基本面、我就想挣那个分红钱，你可别扯了。 那四大行从二零一六年开始老长时间不涨了，分红都很高，大家一样嘛，你挺不住的，你别吹。\n\n后来开始倡导高红利了，出现\"红利\"这个概念的时候，大家才开始想起来买红利股。 恰恰是那个东西只要一上涨，它就不是高红利了，它就变成\"高红利概念\"了。\n\n你银行同样的分红率，你是两块钱的时候分红率是百分之六（假如说），那你整涨到四块钱，分红率都已经变百分之三了。你分红这个东西它本身就不该涨价。\n\n你把分红这种东西作为一个题材来炒的话，那本身它就是一个逻辑悖论——它长高了它就没有分红、没分红就没有吸引力了。\n\n所以别听那些似是而非的那些事儿。\"我公司主要的是看公司的基本面发展\"——你能预见几天基本面啊？ 都觉得自己真事似的，你问他那公司老板，他能预计五年以后这企业咋样不？ 搁那吭哧吭哧一顿分析，分析啥呢？你那都（是）别人（写好的）你看的，再者说来，即使你看到这些东西，就是公司本身他都定不了。\n\n## 六、风险意识是会钝化的\n\n你看现在今年已经过去很大一部分时间了，现在四季度了、三季度已经结束了。你看今年现在这个市场环境，大家就知道险恶了吧。 到现在为止，现在所有的那个指数都是绿盘了。我看现在创业板、科创已经也剩不了多少了（空间了）。\n\n昨天创业板可是跌了不少，昨天科创板可能跌了百分之五吧都有，我没注意最后看。有百分之五的话，那其实现在它也剩不了多少空间了。今天开盘以后，应该科技股应该还是跌的——为啥呢？因为昨天晚上的这个美股科技股跌得很多。美国股市昨天虽然纳斯达克跌得并不多，但是他的科技股其实没少跌，只是因为有一些消费类的股票出现了上涨，所以说把指数背回来一些。\n\n所以你看现在这个情况就都很危险。你看年初的时候，大家都是那种对这种风险感受不到，就是慢慢都已经风险的意识都钝化了。\n\n因为人都是这样：当你这个投资是特别顺风顺水的时候，那你一定对这个风险就开始逐渐淡漠了、风险意识就开始淡漠了。 大家觉得那个时候应该是买什么都赚钱。\n\n那个时候不是有人说\"买易中天，就是只要回调买入肯定会创新高\"——大家还记得这说法吗？就是那个上涨的时候，\"只要它回调你买入，肯定能创新高\"。你看你现在再买入，你看它创新高不？ 它天天刷新（低点）。\n\n所以你当年你总结那一套经验，你现在才知道它根本没用，你知道吗？\n\n有不少人当年一进来，小白一进来，觉得自己好像发现了投资圣杯似的，觉得自己那个规律每次赚钱、每次都赚钱——哎，最后一次就让你把所有的赚的钱都输回去。\n\n这个市场就是这么玩的，就是给你训练出一种肌肉记忆，让你误以为你那东西就是永远正确的，然后一次给你拿走。 你以为呢？你原来吃的都是饵。\n\n永远不要忘了江湖的险恶。 我告诉你，资本市场你看着赚钱，那赚钱都是谁的钱呢？你别看人家赚钱赚得挺高兴，你等你一进去你就是赔钱的。\n\n今天创业板我估计差不多就应该跌破三千了吧，一会儿就开盘了就能看着。\n\n谁提供养分？你看看呗，你反正你自己的目标就是你别让自己成为提供养分的那个人。 反正你这钱亏了就是被人挣走了，它肯定没有消失，这是百分之百的。 而且极有可能他其中就包括我。\n\n## 七、\"不卖就不亏\"是个错觉\n\n不卖就不亏？不卖不卖他也亏。 \"不卖不亏\"只是个错觉。\n\n你分什么样的股票可以不卖：不卖的股票是因为你认为它越跌越有价值，你可以拿甚至可以增持；有些股票越跌越不能拿，知道吗？你作为趋势投资，只要趋势一改、开始下跌，你就必须要卖出。 那个时候你在想\"我就不卖，就是不算亏\"——那你纯粹是自己骗自己。\n\n（有人问）你们亏的钱里头被人赚走了，赚你们钱的人就可能包括我，知道吗？就是你亏的钱肯定没有消失、是被人赚走了，那么赚钱这一部分人里头可能就包括我——我要跟你说的就是这件事。\n\n大家都不亏钱的话，那我赚谁的钱呢？我不赚钱我吃啥喝啥？ 我不吃不喝我臭美啥？当然这逻辑链条比较长，你可能不直接亏给我，但是你亏的那个人，最后他把钱又亏给我了，那也有可能。\n\n## 八、电解铝：四季度的旺季逻辑\n\n创业板现在开在三零二幺，还行，但我看我估计够呛，先看一看吧。今天（看着）还可以呀，今天老登股都在涨。\n\n伦铜期货起来了，也没算起来，昨天晚上跌不少。但昨天的电解铝很强，大家没发现吗？\n\n其实每年四季度都有一个电解铝的小高潮，这是有两个原因造成的。就是说不是看这种长周期，就是短周期、每年四季度——我记得我十一之前做空铜的时候给大家讲过，其实每年的四季度是有色金属的旺季。\n\n一个是他的需求会增加；另外一个，对于铝来说，它有一个特殊的地方，就是云南进入枯水期之后，它极有可能影响产量。\n\n大家知道不知道这个？就是云南一旦出现这种（情况）——你像厄尔尼诺现象，可能就会导致它出现枯水期。那枯水期的时候，今年的枯水期可能比往年偏枯、就更枯，那更枯的话它影响发电量，发电量一不够的时候，由于云南这个电解铝产能特别多，所以说云南就会考虑——你要保生活用电呢，那你就会考虑让一些电解铝厂停产。\n\n那这个事儿呢，就是说每年的情况都在变化。最近这几年都已经没有这事儿了，那二零二二年的时候都拉闸限电，都因为停产了好多产能，所以那年把那个铝价搞得特别高。\n\n今年这不好说，这个东西就得跟踪。但是就是有（人）经常是在四季度赌这个铝。\n\n那你为什么觉得说，铝、原本是电解铝价格在这个十一期间它是跌价的、为什么一开盘的时候电解铝的价格反倒上涨了呢？就是那个铝的相关股票反倒上涨了呢？我怀疑是不是有人就赌四季度的这个云南的枯水期减产。\n\n具体我不太知道，我是给你们提供线索，你们自己去研究，啊，这事儿不代表我给你们推荐铝这事儿。我不会告诉你们买任何股票，这包括行业我都不会给你们推荐，你们自己必须得明白。我只是给你讲这个来龙去脉，说为什么每年到四季度的时候都会有这么一小波，它也不是很长，一般到十一、十二月份可能就完事儿了。\n\n这不是超前，这有啥超前呢？你每年它都是这样的，它是有规律的，那有啥超前的？ 那东西对于我来说它就是透明的。\n\n但是有的时候你比如说有几年，它是前三个季度已经涨得太多了，到第四季度反倒是那个利好兑现了以后、反倒是那个时候有人出货，反正把它价格砸下来，这都是有可能的。\n\n所以你最终决定这个市场它价格变动的直接原因是博弈。 如果你不把这个博弈这个东西带到里面来，你只是考虑它的基本面，那你把这个市场看太简单了。\n\n创业板我看创业板马上就会破三千——嗯，拉起来了。就是有人不想让创业板破（三千）呀。\n\n我要下播了，我得去今天看盘去了。","toc":["一、开盘前：美股与美债的翘翘板","二、昨天的下跌：就因为涨得太高、太贵","三、周期股底部：看现金流，不看盈亏","四、股东人数多不是问题，关键是股价位置","五、筹码博弈：分红不能当题材炒","六、风险意识是会钝化的","七、\"不卖就不亏\"是个错觉","八、电解铝：四季度的旺季逻辑"],"url":"https://www.bilibili.com/opus/1257060580265558038","bv":"","minutes":0,"chars":6462},"ai":{"title":"老木匠·2026年10月9日：市场结构、周期底部与投资逻辑","text":"## 一、宏观市场观察：美债、美股与A股\n\n1. 美债收益率是当前最重要的宏观变量\n\n他开场指出：昨天美股纳斯达克虽然有所下跌，但美债收益率出现了下降的迹象——这是值得关注的积极信号。核心逻辑是：如果美债收益率持续升高，所有企业都承受不了，经济和股市就都会受到压制；反过来，收益率若能持续下行，市场才谈得上有起色。\n\n他提到，当前有观点认为国债收益率已经跌出了足够的吸引力——10年期美债5%以上，30年期前几天最高摸到5.7%，会吸引部分风险偏好较低的资金从股市回流债市，形成跷跷板效应：美债涨，美股调整。但他强调，这只能边走边看，没有第一手资料很难判断。\n\n2. 美股结构性分化：科技股和消费股走势相反\n\n他观察到，昨天美股出现了明显的结构性分化：科技股跌得比较多，但消费股却是上涨的。他认为，这些年美股消费股被压制非常厉害，比如耐克从高点已经跌去80%，要回到高点需要涨五倍——但耐克的基本面本身并没有大问题。\n\n他的判断是：这种现象本质上是资金投资偏好的问题——不在热点上的资产，买的人就少，不代表公司基本面出了问题。这是市场定价机制决定的，而非公司价值本身的变化。\n\n3. 昨天A股下跌的真实原因：涨太高了，估值撑不住\n\n昨天A股下跌后，市场上流传各种原因（包括FCC之类的字母缩写）。他对此直接否定：\n\n我认为没有别的原因，就是因为涨得太高，而且太贵了，估值太贵了，不值那些钱。涨高了以后，筹码上获利盘就很多，有兑现的需求。其他东西都是诱因。\n\n他进一步指出，有时候看似合理的理由，其实是为了掩盖真实原因——\"谣言出口法\"：主力认为价格高了要出货，但不能直接告诉散户说认为不值，于是需要一个看似有道理、最好是一眼假的理由来配合出货。\n\n## 二、周期底部的判断与买入逻辑\n\n1. 在底部，看现金流比看盈亏更重要\n\n他用光伏举例：周期股处于底部时，今年亏20亿还是30亿其实意义不大，这时候分析公司最核心的是看现金流——账上有多少现金储备，以现在的亏损速度，能撑多少年。\n\n周期到底部的时候，真正使公司倒下的并不是资产负债状况，而是现金流量状况。\n\n他提醒：有些公司资产负债率不高，但账上全是固定资产和存货，几乎没有现金，抗风险能力就很低。要找的是那种现金足够、短期有息负债少的公司——关键指标是\"现金及现金等价物能覆盖短期有息负债多少年\"，需要自己去财报里算。\n\n2. 底部的三个典型特征\n\n他总结了周期股到底部时的三个典型特征：\n\n① 股价极低；\n\n② 股东人数极多（说明主力已经全部出货，筹码分散在散户手里）；\n\n③ 市场关注度极差，论坛里冷冷清清，没什么人讨论。\n\n具备这三点，通常可以考虑买入，但买入后不要期望立刻上涨。底部往往会持续很长一段时间，需要足够的耐心。\n\n3. 底部筹码收集的运行规律\n\n他解释了底部筹码收集的运作机制：当主力或基金进来希望收集筹码时，一买股价就会上涨，上涨后停下来，股价回落，再买——底部会出现幅度不大但反复的小波浪。技巧高的可以利用这些波浪做波段；不想做波段的就等着，等主力收集完毕后，股东人数开始逐渐减少，股价慢慢抬升，那是真正的上涨信号。\n\n## 三、股东人数：一个经常被误读的指标\n\n1. 股东人数多本身不是问题，问题在于股价所处位置\n\n这是他专门花时间澄清的一个概念。很多人认为\"股东人数多\"就是坏事，其实不然：\n\n股东人数多不好，但取决于你这个股价所处的相对位置。股价在低位、股东人数多，不是问题；股价在高位、股东人数突然变多，那就是大问题——主力在高位把货倒给散户了。\n\n2. 高位出货时散户为何无法维持股价\n\n他解释了高位散户接筹后为何必然崩盘：主力可以做类似做市商的事，有人卖就买，维护股价；而散户一旦有人想跑，其他人也都想跑，只会踩踏。这就是高位股东人数多必然意味着风险的底层原因。\n\n3. 放量同理：高位放量和低位放量含义完全相反\n\n他顺带讲了\"放量\"的正确解读：低位突然出现放量大阳线，是好事，代表有资金进场；顶部出现带上影线的大阳线放量，是坏事，代表主力在拉高出货。所有技术指标都是如此——不能孤立看单个指标，必须结合股价所处位置来综合判断。\n\n## 四、高红利陷阱：银行股与分红逻辑的悖论\n\n他以四大银行为例，拆解了高红利逻辑的内在悖论：四大行从2016年开始长期不涨，分红很高，但大家一样骂。后来兴起\"红利概念\"，大家才开始争相买入。但问题来了——\n\n同样的分红金额，股价两块钱时分红率是6%；股价涨到四块钱，分红率就变成3%了。分红这个东西本身就不该涨价。你把分红作为一个题材来炒的话，本身就是个逻辑悖论——涨高了就没有分红吸引力了。\n\n他的结论是：不要轻信那些似是而非的投资逻辑，要能看穿它背后的悖论结构。单纯以\"高分红\"作为持有理由，如果股价已经大幅上涨，这个理由本身就已经自我消解了。\n\n## 五、有色金属：四季度电解铝的季节性逻辑\n\n1. 有色金属四季度旺季的两个原因\n\n他指出，每年四季度有色金属都会有一个季节性小高潮，原因有两个：一是需求端四季度本身会增加；二是对铝来说，有一个特殊因素——云南进入枯水期后，可能影响水电发电量，从而倒逼电解铝厂停产限产。\n\n2. 云南枯水期减产的历史逻辑\n\n云南的电解铝产能极大，一旦进入枯水期，发电量不够，政府就会优先保障生活用电，让部分电解铝厂停产。2022年就因为拉闸限电停了很多产能，那年铝价被推得特别高。他说今年的枯水期可能比往年更严重，有人在四季度赌这个逻辑，这也是节后电解铝相关股票上涨的原因之一。\n\n3. 重要提醒：基本面之外还要考虑博弈\n\n最终决定市场价格变动的直接原因是博弈。如果你只考虑基本面，不把博弈带进来，那你把市场看得太简单了。\n\n他特别强调：即便每年四季度都有这个规律，也不代表今年一定能涨——如果前三季度已经涨太多，四季度反倒可能是\"利好兑现后的出货\"。规律是背景，博弈是变量。\n\n## 六、年度市场回顾：风险意识的钝化与重建\n\n1. 现在所有指数都是绿盘，科技股首当其冲\n\n他做了年度盘点：现在已经四季度了，年初到现在所有指数都是绿盘（亏损）。创业板、科创板已经所剩无几，昨天科创板跌了大约5%。在他看来，今天开盘科技股应该还是跌——因为昨晚美股科技股跌了很多。\n\n2. 顺风顺水时风险意识会钝化\n\n他说，年初的时候大家对风险感受不到，是因为投资一直顺风顺水，风险意识被钝化了——\"买什么都赚钱\"的感觉滋生了过度自信。他举了个例子：那时候有种说法是\"易中天只要回调买入，一定创新高\"，现在再看，它是天天创新低。\n\n3. 市场会训练出肌肉记忆，然后一次清零\n\n市场就是这么玩的：给你训练出一种肌肉记忆，让你以为那套经验永远是正确的，然后一次给你拿走。你以前吃的，都是预支的。\n\n他的警告是：永远不要忘了江湖的险恶。资本市场看着赚钱，那些钱都是别人亏掉的；你进场，你就可能是提供养分的那个人。你亏了的钱，没有消失，是被别人赚走了。\n\n## 七、逆向投资与趋势投资：两种截然不同的操作体系\n\n1. 周期底部埋伏，不等于买入后立刻会涨\n\n他以光伏为例：光伏现在是周期底部，逆向投资的做法是越跌越买。但你不能指望买了明天就涨——那就不叫逆向投资，那叫趋势投资。逆向投资的核心是你认为它越跌越有价值，可以拿住甚至增持，需要足够的耐心。\n\n2. 趋势投资：趋势一改变就必须卖出\n\n相反，做趋势投资的人，只要趋势一改开始下跌，就必须卖出。那时候再抱着\"不卖就不算亏\"的心态，就是自己骗自己。\n\n3. 选龙头：只输时间，不输钱\n\n做周期底部的逆向布局，一般应该找行业龙一、龙二、龙三。龙头经过充分调整后，买进去基本都是只输时间不输钱。当然，龙头也有可能出问题，所以还是必须仔细分析资产负债表，确认它能撑过这一轮周期低迷期。","toc":["一、宏观市场观察：美债、美股与A股","二、周期底部的判断与买入逻辑","三、股东人数：一个经常被误读的指标","四、高红利陷阱：银行股与分红逻辑的悖论","五、有色金属：四季度电解铝的季节性逻辑","六、年度市场回顾：风险意识的钝化与重建","七、逆向投资与趋势投资：两种截然不同的操作体系"],"url":"https://xueqiu.com/2573414707/411805842","chars":3183},"topics":["市场结构、周期底部与投资逻辑"]},{"date":"2026-10-07","bili":{"title":"老木匠 2026年10月7日直播文字稿（评书闲聊、独立思考之难、人民币商品化、港股持股收息、芒格格栅","text":"## 一、开场闲聊：赶路人、发声部位与吃播\n\n今天人可能不多，我感觉有不少人开始往回赶路了。有没有人现在出去旅游往回赶的？今天路上人应该很多。\n\n早上好大家，这都快中午了。听评书不是更困吗？有人不是说听我评书催眠吗？\n\n我看看今天的市场，我这刚起来就没看。今天睡的时间特别长，就吃了块奶酪，差点错过。错过能咋的呀，也就是聊天，错过也无所谓，没有什么主题。\n\n坚持吃播。\n\n说我声音有磁性，其实我个人的声音发音部位一直不好，有点偏上。我没经过这个训练，所以发音部位偏上。我儿子小时候我就让他去学了一段时间表演、练发声。那个培训班里后来出了一个很有名的明星，但我儿子不是那块料，就是学学发声训练，所以他发音就很好，胸腔共鸣很好——这个得需要专业训练才行。\n\n## 二、昨天美股：标普也创新高，我为此写了个帖子\n\n大家都看了昨天晚上的美股吧。我睡前的时候只有纳斯达克创新高，后来标普也创了新高。这事特别有意思，所以白天我写了个帖子。\n\n我明明先说了纳斯达克创新高，还是有一部分人跑过来对我一顿教训，说你下回应该怎么说如何如何，我都给他们屏蔽了。屏蔽不代表对人家的否定，各人有各人看法，这很正常。但你老要来教我怎么说话，这个我容忍不了。\n\n有些人都说了好几个月了。我来雪球又不是跟别人学说话的。 我自己想起来啥就说啥，你愿意听就听，不同意就表达自己的看法，这都无所谓。但你试图嘲笑我、攻击我，最后还要教我怎么说，那咱就互相不来往，不就完了吗？\n\n连大黄我都可以屏蔽，这算啥呀。大黄的论坛底下后来都成了批斗我的现场，那我一样给他屏蔽。你们谈论你们的，跟我没关系，但你老拿我说事，那就不行。\n\n## 三、什么叫风险：这是给你们的一个观察窗口\n\n我今天早上起来写这个帖子，是要告诉大家什么叫风险。我的老粉丝其实不用写，大家都知道我说的风险是什么意思。\n\n最近这段时间的市场，给大家提供了一个非常好的观察窗口。你以后就要知道，坚持独立思考会有多难，不是你想的那样。\n\n当年二零一五年，大家会问：那么多人怎么那么傻还往里冲？你现在看看纳斯达克这么高，你说它有风险，都有人接受不了。你都不用说它未来会下跌，你就说它可能有风险、你要小心点，他都受不了。 所以这是给你们一个非常宝贵的窗口期来观察。\n\n我告诉你，成为一个成功的投资者非常容易：你只要能拗过自己，拗过自己那个天性，你就一定能成功。\n\n## 四、想起李大霄：这么多年其实是管用的\n\n我写这帖子的时候，其实想起了一个人，就是李大霄。\n\n李大霄每一次说底的时候，当然它都不是底，会继续下跌。但我告诉你，李大霄每一次说底的时候你买入，然后一直拿着；他提示风险的时候，也不是最高点，他第一次提示风险你就把它卖掉。 然后你就按他说的买那些好股，我告诉你你绝对会赚钱，不会亏钱的，这么多年下来都是一样的。\n\n但为什么李大霄今天有这么多人攻击他？你就知道这个市场是这样的。输家永远不能被教育，你就放心吧。有人说那你这么说不把他们都教会了？放心，教不会的，永远也教不会。\n\n## 五、彼得·林奇的故事：这次跟上次不一样\n\n前天晚上我讲彼得·林奇的时候讲过。有人说上次买的是硬盘公司，这次买的是光伏新能源——不对，那是彼得·林奇讲的九十年代的故事，那个时候这些公司还都是高科技公司。\n\n他妻子就问他说：你上次说买那个磁盘公司的时候，就说他一定能一直涨，你今天买的这个光伏电池公司，你又说他一直能涨？上回你就这么说的。他说这回不一样，这个光伏电池和以前的东西不一样，以前都是过时的东西，上次我受骗了，这次我坚决不会受骗。\n\n这种话术在 A 股里你就特别熟悉。 你上次买茅台就是这么说的。那茅台是茅台，我这个公司是我这个公司，跟那没有关系。所以你永远也逃不出这个窠臼。\n\n## 六、和大黄之间没有矛盾\n\n不要劝我调和和大黄之间的关系，我和大黄之间没有矛盾，你不用费这个心。\n\n我屏蔽他，是因为他容忍他下面的论坛里面对我的批斗，这样我看着非常不舒服。我不叫拉黑，叫屏蔽，我看不着了，眼不见心不烦，还不行吗？\n\n他们都说我去攻击别人，我告诉你，没有一次是我主动攻击别人，都是别人先来攻击我。我不关注别人，我怎么攻击别人？\n\n我不反对你们关注大黄兄。大黄兄的选股很有一套，他现在依然是我最尊重的投资人。 我说他不好相处，结果被他认为是冷嘲热讽。其实在我的语境里，不好相处是一个能人的共性，我认识的成功人士都不好相处。这被他们理解成我在诋毁他，那也无所谓，理解错了就理解错了，我这人不在乎谁误解我。\n\n但我跟你讲，我看他的评论区，现在有脊背发凉的感觉。大黄兄有一点没注意到：这些人今天团结在他周围，他一个个股地去指导别人，未来这就是问题。上涨的时候都可以，等下跌的时候，那就是风险。我个人坚决不会那么做——只要有一个粉丝像大黄的粉丝那样说「我按照大黄老师的指导买了什么」，我马上就拉黑他。\n\n我昨天看有人写「大黄老师给了我信心」，我看着都替大黄捏一把汗，我真害怕。你们很多人关注大黄，大黄本人是没有任何问题的。不好相处也是真的，他是个能人，能人就一定不好相处，我没见过一个成功人是好相处的。\n\n你们可能会说我自己。我告诉你，我也不是个好相处的人，我认为我也是个能人，那就更不好相处了。所以你看我这个帖子下面回复很少，这就是不好相处的表现。\n\n分析公司非常厉害的大黄兄，是我非常佩服的一个人，在分析基本面方面非常牛。但他现在开始直接去指导每个人具体的投资标的，我觉得这个风险非常大。在这点上，他就涉及到我自己的职业了——你不能拿你的业余水平去挑战我吃饭的家伙。\n\n## 七、我现在只看美债收益率\n\n我告诉你，我现在关注美股，根本就不看纳斯达克创不创新高，那对我来说根本不重要。我现在天天看的就是美债的收益率。\n\n我可以明确告诉大家，现在美债的收益率没有任何起色，它依然处在一个下跌的区间通道中。如果它未来不出现快速的修复，早晚是个问题。\n\n我现在只关注五年期、十年期、三十年期美债收益率，我看的就是美债期货。\n\n## 八、散户扛过周期？你先活过十年再说\n\n有人讲，散户就是要扛过周期，享受它的成长。你告诉我有几个散户能扛过周期？ 跌了百分之二十就开始骂娘了。\n\n我前几天非常惊讶地发现一件事：雪球里有很多意见领袖，发言特别多，我后来才发现他们都是二零年、二一年疫情以后才入市的。天天给别人分享经验，写文章写得特别长，发言频次特别高，又分析基本面又分析宏观经济——他们都是二零年或二一年才入市的。\n\n在牛市的时候你不要总结经验。 我告诉你，这一轮 A 股的牛市起于二零一八年。上一次熊市到二零一八年就结束了，二零一八到二零二四年都是在筑底。\n\n你都没看过什么叫真正的熊市。 二零零九年那种下跌、二零一五年那种下跌，你都没见过，你现在就开始总结经验了？\n\n最后一次快速的下跌其实就是二零一八年。剩下这些都不算什么大幅下跌。你觉得二零二四年二月那次，一次是雪球跳入，一次是贸易战，你觉得那叫很大的下跌——那根本不叫，那只是抖动，不叫趋势性下跌。\n\n所以任何一个投资人，你想总结经验，你先在市场上活过十年再说。 你没有活过十年、没有经过一两轮牛熊，你就别想这件事，你想多了。中国古话叫「夏虫不可语冰」，你现在就是夏天的虫子，还没见过冬天，你搁那儿总结啥呢？\n\n## 九、拿不住的例子：1987、2000、1929\n\n我说现在看太多人说「我能挺过周期，那不又涨回来了吗」。说这话的人，我就问：你见过下跌吗？\n\n一九八七年十月十九日，道琼斯指数一天跌百分之二十二，最后都涨回来了。我问你，当年跌百分之二十二那一天，如果你持股，你能拿住吗？ 你现在设身处地回去想一想。\n\n你要说能拿住，好。那两千年科网泡沫危机、互联网泡沫崩塌的时候，你说这次我准备拿住——百分之八十的最后都退市了，你拿住吧。\n\n你都是回看。 一天跌百分之二十二的时候你都是回看，你以为「我就拿住，就回来了」，那是因为你穿越到未来了，你后来看到他回来了。你敢保证他回来吗？ 一九八七年那一天，你敢保证他回来吗？\n\n一九二九年刚开始下跌的时候，大家认为马上就会回来，结果呢？持续到一九三三年，最后很多股都破产了。\n\n你都是穿越回过去了以后才看明白的。 你要回三国，你比曹操都厉害。\n\n## 十、什么人才有资格总结经验\n\n最近这一轮，假如你想总结经验，我告诉你：什么样的人可以总结经验？起码要经过二零一四、二零一五年这一波牛市的人。 我还不要求你必须经过二零零七年——你至少得经过二零一五年这一波，它怎么从二零一四年发展、怎么到最后高潮、怎么崩盘，你得经过这一次。然后到二零一六年熔断，你现在能活下来，那我觉得你可以总结经验。\n\n否则的话，你现在都是二零二零年以后入市，你都没见过熊市，你总结啥经验呢？ 你现在的经验就是：在任何低点只要跌下来买了都可以回去，因为股指在不断创新高——二零一八年实际上就到底了。\n\n你只有经过过这种东西，别人给你说一百遍都没有用。 你没有经过过，你就永远也不害怕。所谓初生牛犊不怕虎，你没见过虎，你不知道它的厉害，你觉得那玩意儿就比猫大点呗。\n\n## 十一、美国机构没一个人说美股没风险\n\n现在 A 股普遍有一种说法：投资纳斯达克任何时候投都是赚钱的，买入只要不动就可以了。\n\n我看所有美国的机构投资者、专业投资者、著名投资人写的书，没有一个说美国股市没有风险的。 我现在只在中国的自媒体里面、在 A 股散户里面，听到说纳斯达克没有风险。剩下我没有在任何一个语境下看到说美股已经没有风险了。\n\n有风险和未来是不是涨，这是两个完全不同的事。 有风险，是要平衡你自己是否参与这样一个游戏，你要解决的是这件事。它有风险的时候，赔率也高，但胜率就低了，给你带来本金永久性损失的概率会增加——这种概率你是不是愿意参加，这是你自己的决策。\n\n而不是说一有风险，它明天就应该往下走。这俩是两件完全不同的事。 总有人分不清：我一说它有风险，他就说「你看人家也没跌呀」。这跟跌涨没有关系，你跌涨那不又变成预测明天的走势了吗？这是不同的游戏。\n\n## 十二、我来市场是为了不亏\n\n我追求的是什么？风险小、胜率高、本金永久性损失很小，然后带来一定收益——我要追求这种，那我就不会参与现在的市场。\n\n但你说我就要参与一个胜率特别低、但赔率特别高的游戏，那风险越大你不是越应该买吗？你不富贵险中求吗？这是两个完全不同的事。\n\n我说的都是从我自己角度出发：风险大的事我不参与。 而且我还没说我参与不参与，我只是告诉你现在风险大了。什么叫风险大了？风险大了就是说你既有可能获得巨大收益，也可能获得本金永久性损失。\n\n至于你参与不参与，那是你自己的事。你来市场究竟是为了不亏还是为了赚钱？我告诉过你们很多次，我的出发点是不亏。\n\n所以他永远都不知道我的投资体系，就用他自己的模式去评价别人的话。我说「提示风险」，他说你就是认为马上到顶了；我说「我等待他崩的时候再买入」，他就说你认为他明天就会崩——这都是他们的理解。 我也不能一一去纠正，纠正不过来。\n\n## 十三、日本股市新高：跟货币发行有关\n\n日股也新高了，这不很正常吗？什么股新高都很正常，因为他们的货币发得太多了，跟别的东西都没啥关系。\n\n你知道现在日本股市和一九九零年比涨了多少吗？九零年的高点到现在只涨了一倍多一点。上一次他们的新高是三万八千多，经过了三十年才回去。 这还没经过通货膨胀率的调整。你要经过通胀调整，日本股市现在和九零年的高点比，还差得远呢。\n\n## 十四、中央银行的增持黄金数据出来了\n\n中国的央行又增持了二十三吨黄金。我没看到具体的消息，我是看别人说的。\n\n我问大家一个问题：你说中国央行现在有动力把黄金拉高没有？ 然后你再想另一个问题：俄罗斯也这么增持，中国也这么增持，那为什么黄金最近还没涨呢？\n\n这就叫第二层次的思维。 你光看到他增持，你都不知道他增持要干啥。有时候你看央行增持了你也去买，你买是为了差价，央行增持，央行啥都不在乎，央行会在乎持有成本吗？\n\n## 十五、买黄金是为了卖美元\n\n买黄金是为了卖美元，你就记住这句话就行了。\n\n所有的国家，包括俄罗斯、中国、欧洲的一些国家，现在都是因为在卖美元。他增持黄金的主要原因，是要减少美元在储备当中的比例。但实际上能起的作用很小，这只是一个边际变化。\n\n央行买黄金是用的美元，你买黄金得用人民币，你明白这道理吧。然后大家都说我们买黄金是为了人民币国际化——那我问你，假如人民币真正国际化了、开始给国际大宗商品定价的时候，人民币对美元的汇率会不会升值？\n\n一旦人民币真的买了很多黄金、实现了人民币国际化以后，人民币对美元会不会升值？要是自由兑换，现在就变一比三。我告诉你，现在美元和人民币自由兑换的话，一比三可能有点夸张，高盛给的结论是一比五点七。\n\n我们现在不放开自由兑换的主要原因不是别的，是因为它升值太快。 当然我们永远也不会放开自由兑换，这你就放心吧。自由兑换是双刃剑，除非有一天我们已经是国际货币了，那才会放开。\n\n日本的问题就在于，在自己没有实现货币国际化、没有成为主要结算货币的时候，就开始自由兑换，你就会成为别人攻击的目标，而且你根本没有招架之功。\n\n## 十六、如果放开自由兑换：人民币商品化\n\n假如现在放开人民币和美元的自由兑换，你马上就可以知道一件事，你知道是什么吗？常听我的、看我帖子的你就知道。\n\n马上就会出现一个局面，就是人民币的商品化。 国外会把人民币当作一种储藏手段储藏起来，而投机套利资金会在中国国内贷款人民币，到美国去投资美国国债就可以了——这个套利就来了。 所以大量人民币外流，就会导致国内的通缩。\n\n国内越通缩，购买力越强，人民币就越升值。 明白吧？\n\n如果出现那种局面，我告诉你，那房子现在还得跌一半。然后你一定会觉得这个局面一定伴随着人民币贬值——我告诉你，一定伴随着人民币升值，然后马上就进入通缩状态，你的钱会越来越值钱。\n\n最后会导致你的利息降到零，你还通缩，你甚至加上负利息它都通缩。为啥呢？因为你的货币被商品化了，你进入到一个恶性循环里：你越通缩，你越降低利息；你越降低利息，越有人套利，越有人给你的货币商品化。\n\n到那时候，国内房子还得再跌一半，那一半都不止。你就觉得钱老值钱了，那时候持有现金是最牛的。 你啥消费呀，谁去消费呀，明天就卖得更便宜了。你把钱放在银行里，即使是负利率，你都相当于每年赚钱——通货膨胀率变成负的百分之五，你拿一年钱没有利息，就相当于挣百分之五，明白这道理吧？\n\n那时候谁还会投资？进入通缩循环非常可怕。 你欠债的企业很快就会被压垮，因为你的债务负担会越来越重。\n\n## 十七、我们怎么破解：有限制的兑换\n\n我们如何破解？我们就不实行自由兑换。\n\n我们实行的永远就是有限制的兑换：在资本项目下不自由，在经常项目下是自由的。 所以你想拿我的人民币当商品化，你做不到。我每一笔钱你申请，如果你去，你必须到国外买东西、去进口，可以；你说拿我的钱上国外投资套利去，不行。\n\n然后再告诉你，我天天看汇率，一旦快速升值的时候，我就让它慢下来。 即便这样，现在也每天在升值。你看这几天的美元指数涨到一百零二，所有的货币对美元都贬值，只有人民币对美元还是升值的。\n\n你们去看人民币离岸汇率的走势和美元指数的走势，你就知道现在人民币对其他货币、对日元升值得多快。\n\n## 十八、别再提个股了\n\n你不要再提个股了好不好，什么药明最值钱，你别买个什么股票就什么股票最值钱。\n\n我特别不理解这些人，你买了什么股票就天天吹这只股票，这有啥意思啊？你买这只股票，不应该是越多人不看好越好吗？ 为啥你买了某只股票就天天提呢？我买的股票从来不提，尤其从今天以后干脆不提了。\n\n我买的股票提过吗？大家给我作证，提过没？你们都不知道我买的啥，你们自己也都是瞎猜。你们觉得自己能猜对那你就猜，反正我不去纠正那事。我否定也是一种提醒，你猜我没肯定也没否定，那就跟我没关系。\n\n太多人了，他只要买哪个股票，哪个股票就天下第一好。我告诉你，啥股票都是一样的，都是有风险的，包括我自己买的，我天天盯着。我不提是不提，但我天天所有消息都看——这是你应该干的活。\n\n你不是要告诉别人这东西最好如何如何，你不说我这东西不好就不对。那跟你有什么关系？你能把所有人的嘴都堵住吗？你能把所有想卖的人都堵住吗？那有的还进去骂「他妈的不应该卖」，谁在卖天天咒骂这些卖的人——这胡扯嘛，你干这干啥来了？\n\n买了不知道好赖，那你应该去学，你不应该天天跟别人这么犟，你那东西对你赚钱没有任何帮助。\n\n## 十九、雪球已经变成当年的微博了\n\n现在雪球也变成这种了，有点像当年的微博。我后来离开微博，就是因为微博成粪坑了，所有人来了都是来发泄情绪的。\n\n当年我从微博到雪球，是因为雪球当时是个小众平台，大家都很理性——因为其他人不来呀。那时候市场还是永远的大 A、永远的三千点，还都没人像今天这样热血沸腾。那时候没几个人关注资本市场，所以雪球里人很少。不像现在，人一多变成大众平台，就完了，成粪坑了。\n\n说实在的，现在唯一支撑我在雪球继续写下去的主要原因，就是我有这么多粉丝，而且都是经过我筛选过的，所以我有点不舍得。要不然以现在的雪球生态，我干脆就不写了。\n\n我觉得反倒微博现在变好了，因为微博的人很少了，被抖音什么的挤兑的。现在微博里头能正常探讨的人比较多。你看微博投资讨论的底色，和雪球、小红书完全不一样。大家可以关注关注微博，我这两天没事看看微博，觉得比以前强多了——就是页面设计太凌乱，我不爱看。\n\n我在雪球有二十多万粉丝，这些粉丝关键还都是被我筛选过的。故意捅马蜂窝，捅一次掉二三百粉，现在还有这么多人，我觉得这都是非常宝贵的。\n\n我的雪球一个最典型的特点是：我写完之后能发言的人很少很少。 我从来不认为发言的人少是坏事，反倒是好事。大部分人没有话说的时候就不说，大家都是探讨的观点，我一说你一听，你愿意听就听，不愿意听就不听，这是最理性的探讨。\n\n我写的这些，肯定有人不同意，但不同意的人不说。甚至有很多一直是我的粉丝，人家看看你写的东西，我不同意——不同意就不同意，实在不同意了就发表我自己的看法，一般情况下就啥也不说拉倒，再不同意就取关。这都是理性的探讨。\n\n那些取关我的人，我认为他们都是理性的探讨者，他只是不同意我的观点。 你取关，啥也不说直接取关，这很正常，这也是一种探讨。在股市上怎么可能所有人的观点都一致呢？\n\n## 二十、交易的本质就是互道傻逼\n\n我今天在雪球写了：交易的本质就是一个互道傻逼的过程。 要不然为什么同一个价格会有人买、有人卖呢？\n\n今天这个价格，同样一个价格就有人买有人卖，那买卖双方对这同一个价格的观点就是截然不同的。每天都是这样，每天都是截然不同，要不然他就不会有交易。\n\n你怎么可能在资本市场里面大家的观点都一致呢？ 那不可能。不一致很正常。你为什么老劝别人的观点和你一致呢？你表达自己的观点就可以了。\n\n一不一致，你就开始冷嘲热讽、人身攻击，甚至说「你应该这么说」——那跟你有啥关系？我不想那么说。\n\n你只要不进行人身攻击，你甚至提不同的观点，我都认为很正常。 人身攻击、骂人的，这都属于低智商的表现，这都是输家。我经过的牛熊转换太多了，一轮熊市下来就全没声了。 一轮熊市下来，今天这很多意见领袖全没声。\n\n现在有很多人那种发言，类似于精神病似的，有点像躁狂。那都是因为挣了一点点钱，情绪上压不住这些钱，导致你的兴奋没法自己控制。很多人拿点小钱翻个几倍，就觉得妈自己天选之子了，跑到这儿来指点江山。有很多年轻人压不住自己的情绪。\n\n不是说你悲观的时候要压抑情绪，你乐观的时候也要控制情绪。 很多人就是乐观的时候你都压不住，从那个纸面上就能看出来他那种躁狂劲儿。\n\n我这些年，我的工作全靠一张嘴，靠交流、靠说话，无论是当老师还是当律师，都是一样靠说话。所以我对别人的说话就特别敏感，别人说的话带着情绪，对我来说就特别敏感。你看现在这种在雪球上的发言，就是书面的，我都能感受到这个人的精神状态是啥样。\n\n前一阶段有个人天天在我论坛里，不说我的不会说话，就像躁狂抑郁似的——不提我他都不会说话，就天天以我为话题才行。这种东西都是精神病的表现。\n\n## 二十一、十一的固定套路\n\n明天就开盘了。你看今天港股开始跌了。\n\n十一的这个固定套路就是：在 A 股没有开盘之前，所有的市场都是一片欣欣向荣、都是上涨的；等到 A 股一开盘，一切都变了。 头几天都是开涨停开盘，结果到 A 股快开盘的时候，一下子就尘归尘、土归土。\n\n我今年这是唯一一次十一没有关注自己的持仓，因为我现在把仓位减了，没有融资了。 以前我几乎都是买融资的，所以每到十一、春节的时候，心里都不怎么安定，天天盯着外盘。这一次我都不怎么看了，港股我都不怎么看。\n\n大家有时候想一想，这种是宿命呢，还是有什么必然规律？我一直不明白这其中有什么必然联系——没有什么联系，这有啥联系？\n\n我观察多少年都是这样。最要命的就是二零一八年那年，那可真是要命，十一期间跌的。一八年我想不起来了，是有点意思。你说它有啥必然规律？没啥必然规律，每年都那样，也可能是人在心理作祟。\n\n港股也正经跌不少，我关注的东西都在跌。昨天不对呀，昨天纳斯达克都创新高了，怎么港股今天还跌呢？这是因为大 A 要开盘了的原因吗？\n\n## 二十二、港股现在只有一个合理模式：持股收息\n\n港股现在只有一个最合理的投资模式，就是持股收息。\n\n找到那些高分红的。买港股便宜，就是股息率更高。 如果我个人的话，买这个我觉得比较合理。然后你还得买国内的上市公司，你不能买纯港股的上市公司。\n\n你为了股息，就不用考虑波动。关键问题是你的股息能不能维持，这是关键。 你为了股息，你还要考虑波动吗？你相当于买房子为了租金，你还考虑今天房子卖多少钱、明天卖多少钱吗？关键要考量的是它能否维持这个股息率。 能维持的话，你这个投资就是一个好投资，就不用管它价格的波动。\n\n其实持股收息是原本的投资本质。 你投资资本市场，最初的本质就是为了持股收息。但由于资本市场的高流动性，带来了股价的频繁变动，就给赚差价带来了便利和可能性，所以你才会有赚差价这种投资模式。\n\n所以理论上说，所有的赚差价都叫投机，都不叫投资。 但我不这么极端地看。我认为捡便宜、有足够的安全边际，也是一种投资——你用五毛钱买一块钱的东西，等到
