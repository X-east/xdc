恢复一块钱的时候卖出，这也是投资，不是说必须得持股收息才叫投资。\n\n极端的投资和投机的分法是这样的：你买股是为了持股息，那就是投资；你买股是为了赚差价，本身就是投机。 但我的个人看法是，赚差价有两种：一种是趋势的，那我认它是投机；还有一种是逆向的、捡便宜的，那我认为它虽然是赚差价，也是投资。\n\n## 二十三、港币就是人民币的稳定币\n\n港股现在的问题在于，港股的利息也很高，港币的利息也高，因为它追随着美股、追随着美国的利息，因为港币和美元是联系汇率。 所以美元升息的时候，港币也会升息。\n\n所以有人说放开——我跟你讲，放开港币和人民币之间的兑换，那套利空间就老大了，现在是不可能放开的。\n\n所以你们可以把港币理解成人民币的稳定币。 未来港币只要一脱毛、和美元脱钩，只要和人民币联系，它就变成人民币的影子货币了。\n\n我们中国有一个优势条件是现成的，就是我们花两种货币，我们有个港币，有个人民币。港币天然就是自由兑换的，只要港币未来脱毛就可以了。这个大家自己仔细去思考思考就明白了。\n\n我以前刚出稳定币的时候，就给大家讲过：港币天然就是人民币的稳定币。 只是现在还没有脱毛，改革没到那一步。等以后港币的香港人民币市场都成熟了，黄金市场都成熟了，离岸的这些市场都建立好了，港币自然就成为人民币的稳定币，成为人民币的影子货币了。\n\n成为人民币的影子货币以后，你实际上就是用人民币来标价，你用港币来标价就是用人民币来标价，因为港币脱去美元的锚，把锚换到人民币身上就完了。\n\n所以我跟你讲，我们未来改革的路径实际上很清晰：我们不需要人民币的自由兑换，只港币是天然自由兑换的。\n\n现在港币是和美元挂钩，所以以港币计价的无论是商品也好、资本市场也好，本质上都是以美元计价的。 你换锚，本质上就变成以人民币计价了。就是港股的人民币计价方式。 你现在只要说买卖港股用人民币来计价，港股马上就发展起来。现在港股是用港币来计价的。\n\n## 二十四、什么情况下才能放开自由兑换\n\n现在美国最希望的，就是在目前这种状态下——人民币作为结算货币的结算比例还很低的情况下，实现自由兑换，那对中国来说，中国就成了一个美国薅羊毛的肥羊。\n\n到一种什么情况下我们可以实行自由兑换呢？就是我们作为结算货币的结算比例已经很高了，比如说我们超过百分之三十，全世界的贸易都由人民币来自由结算，很多国家的外汇储备里都有大量人民币的时候，我们才可以放开。否则放开只是个灾难。\n\n你现在人民币的结算比例是非常非常低的。所以大家现在持有人民币，并不是拿它当货币，而是当商品。\n\n什么情况下是货币、什么情况是商品？你用来结算它就是货币，你用来储存它就是商品。\n\n那不用你放开那么弄，你马上就可以想：那你还投啥资啊？国内的人直接把存款存到美国去不就完了吗？换成美元回存到美国，你们现在美国存款那利息多高啊，买美国国债不就完了吗？\n\n你现在要放开的话，你说美国得多高兴，多少人想买美国国债。我们现在这边都资产荒了，获得百分之五的收益率都非常难，那美国现在国债的收益率是百分之五点几，那钱不全去美国了吗？\n\n日本当年不就干了一次，给美国干一次这贡献了。 现在国内还有人在考虑说我们应该学习日本，就是自由兑换——那你不是给人当血包吗？你钱印出来不就是给美国用的吗？\n\n## 二十五、钱出去和老百姓理解的不是一回事\n\n一放开，所谓的都溜出去了——也不是老百姓理解的那个都溜出去了，说我那就出国了，不是那样的。\n\n是因为投资有利可图。 你所谓的钱出去，和老百姓理解的钱出去是完全不一样的。你现在觉得老百姓的钱都出去，因为都想润出去——那都是小事，那得润多少？关键问题在于机构投资，你们那点钱才多少钱。\n\n再说不是所有人都会跑到美国的。你现在就放开了，随便去美国，你告诉我中国能有一亿人去美国不？你们想一想这问题。\n\n一个人在哪生活，不光是你那些东西，人是什么？马克思说人是社会关系的总和。你所有社会关系的集中点，这就是你作为一个人的生活。 你去了国外，你和所有的社会关系都切断了——那我问你，对于一个人的生活来说，你就是不完整的。\n\n有很多人把子女送到国外，我跟你讲，就是子女相当于没有了一样。 我见过太多我的朋友，当年把孩子送到国外，现在后悔的有的是。\n\n配外汇、配美元，你要是钱多，配置不同比例的外汇，包括美元、日元都配置一些，没有问题，这跟配置黄金不是一样的吗？ 但是你作为普通老百姓，你配置美元干啥呀？你不去美国，你配那些美元干啥，它不赚钱。长期来看，今年年初配置美元的那些人，现在不都亏了吗？你吃完利息还不够贬值的呢。\n\n哪儿的生活都一样。美国也有生活好的地方，也有生活不如意的地方。大家都不要在这事上情绪化，这都是个人的选择。\n\n你觉得外国好，那你就出国；你觉得中国生活猪狗不如，那就全家移民，这不就完了吗？这很简单，没人拦着你。每个人的选择跟你没有关系，投资也是一样，移民也是一样。 我就不知道为什么有人移民了，你就得听着、你得生气。\n\n谁移民都正常，每个人都有自己的选择。 这个社会就是由不同的人选择来决定的，不可能所有人都是一个想法。所以你最主要的是：你不能试图让所有人按照你的模式去思考，你只能阐述你自己。\n\n也不存在买单不买单。人家就选择了那种生活，什么叫为选择买单呢？你不选择也一样买单——你在中国生活，一天不花钱？不人吃马喂啊？你到美国也是一样花钱，也是人吃马喂。这叫什么买单呢？\n\n所以这种东西我劝大家的就是不要有情绪，每个人正常的选择都不一样。 我上大学的时候同学现在有一半在美国，生活都非常好。那你说他们生活都非常好在美国，那我是不是我也得必须出国呀？那我不能出国呀，我也不会英语。\n\n## 二十六、温水煮青蛙和快乐是自己的选择\n\n有人说国内是温水煮青蛙。哪个地方煮青蛙你告诉我？你在哪生活你是青蛙呀？哪个地方要煮你啊？\n\n老百姓在哪儿都有乐呵。 但你如果盯着的永远是负面的，我告诉你你在哪儿都是盯着负面的。你进一个房间里头，有人就盯着墙角看，说这墙角有灰，摸那个箱子盖，说箱子盖有灰；有的人一进来一看，哎这屋挺好啊。所以这是两个人不同的选择，是由人造成的。 有的人天生长下来就能快乐地生活，有人永远也不会快乐地生活，他在哪儿他都觉得不服。\n\n你以为美国人没有反对派吗？你们现在去的都是说美国这么好——那我问你，美国的反对派是怎么想的呢？批评美国社会最多的人就是美国自己。 那你告诉我，那些人怎么天天说美国不好呢？哪儿都有，都有不会幸福生活的人。\n\n买社保？当然买社保了。买社保是一种责任你知道吗？ 你除了自己受益之外，它本身就是一种责任。你老了有病的时候，国家不能看着吧，最终是不是得给你救济？你实在不行了救济你，那你这种模式本身就不对——你年轻时候吃喝玩乐，到老了把自己甩给社会，要让社会来负担你吗？\n\n你每个人都这么想，所有事都能解决吗？你每个人想的都是天天怎么占社会的便宜，所有事都解决不了。这跟物业公司道理是一样的。\n\n## 二十七、外行领导内行是极端合理的\n\n我换一壶茶，茶喝时间长了就乏了。这个是瘦梅那个白茶，它就是叶子大。\n\n是否快乐生活，是自己的一个选择。 你看有些知识分子天天忧国忧民，我前两天看一个徐小年（音）几年头几年的那个采访，说那什么相机咱们永远做不了那个。天天忧国忧民那是一种习惯。\n\n知识分子阶层还有一个毛病，老愿意为民请愿。 中国古代讲话叫「百无一用是书生」，你看为什么这些世人阶层都是学富五车的，为什么最终这个士人阶层很少有当皇上的？就是因为它需要两种不同的能力。\n\n如果什么都听他们的，这个社会就没法运转。 你们如果以后到政府机关，你会体现得更明显——你会觉得那些当政的地方领导啥都不是。但你要是明天换上一个啥都懂的，你这个地方干得更差。\n\n我跟你讲，年轻人都认为外行领导内行这事本身不合理，对不对？我现在才知道，外行领导内行是极端合理。 不管什么事，只要让内行去做，这个事永远也做不成——内行只有在外行的领导下才能把事做成。\n\n这就叫科学主义戕害人。你科学主义实际上对人的束缚很大的。你看有很多特别懂工程、懂科学的人，都成不了企业家。\n\n## 二十八、聊嗨了：平台违规这事\n\n完了完了，又给我抬出来了，你这整那玩意整的又违规了。违规就完了，违规就没有回放了。\n\n我知道说啥违规了。还不是说股票——说股票它只是提醒，不会因为股票就违规，是因为说别的了。别说了，下回不能说这些了。对那些字儿都不能提，别搁底下打了，你们再打又给我抬出去了。你们还想唠嗑不？还想好好愉快地唠嗑不？\n\n今天有点聊嗨了，忘了。吓死，你一违规就完了，违规就没有回放了。\n\n像我这么正能量——我就跟你讲，这 AI 是纯傻狍子你知道吗？ 你说我这能量多正呢，我都快成小粉红了，还给我抬出来了。是呗，聊嗨了，聊忘了。人不能得意忘形，得意忘形就挨打呀。\n\n你光聊资本市场，它只是警告你，还不至于马上就抬出去。它最害怕的是那些敏感的东西，现在关键是平台害怕，然后它又分不清你这个人的观点是啥，反正你只要涉及到敏感词，一律抬上去完事。要不然我为啥说有些话不敢说了？\n\n我现在就这么一个和大家交流的信息渠道了，你说再给我抬出去就没了。 现在头条上干脆啥都不敢说，那头条更严，涉及到资本市场马上抬走。\n\n我现在在会员专属直播里面已经彻底变成评书了，这回不能抬我了吧？你说我讲书，你还能说我违规？我突然想到这个方式，哎这个挺好，评书不能违规呀。 对呀，评书嘛。\n\n在 B 站上聊聊股票市场的大势也没事儿，你只要别提判断未来、别提个股，基本都没有问题。\n\n今天录屏——你不用看录屏，它没有什么内容，你干啥不行啊这玩意儿？ 这闲唠嗑，你们老要看啥录屏？\n\n## 二十九、知识产权维权：不对称的博弈\n\n谁在鱼上还有（搬运的），赶紧去投诉。你告诉他涉及到侵犯知识产权，你投诉他，他这个平台就会认真处理。 这个东西得靠大家来维护。\n\n以前这种玩意儿也改变不了你。知识产权这种事在自媒体平台上就是解决不了的一件事，你就只有他只要露头、你发现了就投诉，露头发现了就投诉，几回他就老实了。\n\n这社会就是这样，没有别的办法。这个东西在自媒体上解决太难，维权成本太高了。 它就是不对等：违法的成本低，维权的成本高，就容易造成这种现象。它也是一个不对称的博弈。\n\n## 三十、思维框架：查理·芒格的格栅理论\n\n我再给大家播半个小时就下播了，今天也没啥可聊的了。\n\n聊思维框架、看什么书——什么书都好看。\n\n你看查理·芒格写过一本书，就是思维的格栅理论。他说的就是：你要多学科、多角度来考虑一个问题，你会得到不一样的结论。 就是说你如果学过多学科，然后放在一块儿来考虑这个问题，你就不容易有盲点。这是他那个理论的出发点。\n\n我认为他说得非常有道理。 因为我个人从学的专业上、从受教育的经历上来说，本身就是学得比较杂。以前这种东西是个劣势，一直到我投资以后，反倒觉得这是个优势。\n\n因为你学得杂，你就不可能学得太精。你要想投资的话——你看查理·芒格，人家比我总结得好多了，他那个格栅理论有人专门介绍，说得非常系统、非常好。\n\n为什么会出现这种局面？芒格本人和我比较相似，他原来也是学理工科的，后来在哈佛法学院毕业从事律师，然后什么都干，我自己也做过生意。他又看书比较杂，所以就形成了他特有的一种思维习惯。我在这点上跟他有点相似，受教育也差不多：本科学理工科，后来研究生改文科，后来又从事法律工作。\n\n所以你学的东西多，考虑同一个问题的时候，你可以借鉴的知识点、知识结构就多，所以你思考一个问题的时候就不容易有盲点。\n\n## 三十一、一招制敌：李小龙的截拳道\n\n大家可能都看过我和别人抬杠，你也叫怼人。我都是一招制敌，我一下就给他捅到心窝子上。 这跟我学得比较杂就有关系。\n\n我从来不跟他们绕来绕去，我以前专门给大家讲过，这相当于李小龙的截拳道——什么这招那招的，一招制敌完事。那就因为你学得多，你就知道了。\n\n包括我经常举例子，人家说你这个例子举得最恰当，那都是跟你的知识广度有关系。 你啥都学一点，你就知道大部分逻辑都差不多，基本上一刀就杵到胃管子。\n\n我想让他一句话就不出声了。 但有的人他还会出声，有一些人他胡搅蛮缠，他自己本身没逻辑，说那玩意他自己觉得特别有理，别人听的人都觉得没理。\n\n有的时候包括你们和别人、在单位吵架也好、争论也好，你们多多少少都会容易掉进别人给你渲染的那个逻辑里面，掉到他营造的逻辑氛围里，然后你总是在防守、总是在自证。他指责你，你就说「你指责得不对」「我不是这样的」——你总是这样，这种吵架你永远占不了上风。\n\n你要想（赢），他营造这个氛围，你得跳出来，你得让你主导这场争论、讨论，甚至这一场演讲也好，你得跳出他的圈子，你得来主导，让他防守，你来进攻。 你一招就可以让他毙命。\n\n你需要考虑的是啥？你需要考虑他的关注点，他给你营造这个氛围，他究竟是要干啥？他的根本目的在哪儿？你直接对着他的目的去就行，你不用去反击他这些。\n\n就像跟别人打架似的，他拳头打过来，你根本不用在乎——他打你是为了赢，为了打死你，你是为了打死他，那你打拳他有啥用啊？ 他打你的时候你就捅他心窝子。\n\n所以前两天别人说纳斯达克又创新高了，我就一句话：那你买没有？你不用告诉我，你买没买？ 你看，你就学会抢答了，我还没说啥话都被你先说了。\n\n你要针对的是他的基本目的，不是针对这些外围。你时间长了争论都是这样，你得知道这个争论的点在哪。 你不能越来越远——有的人两个人争论问题就是越争论越远，离原来的核心争论点会越来越远。\n\n这种情况一般在两口子吵架的时候经常发生。两口子吵架的时候，最初的问题争来争去，大家就把最初的问题忘了，最后争论的是「你爱不爱我」这个问题，明白不？\n\n## 三十二、四十岁以后的人生建议\n\n有人问四十岁以上的人生有啥忠告、人生建议。\n\n保护好自己的身体，善待自己的家人，快快乐乐过每一天。\n\n人过四十岁以后，随时某一天都有可能是大结局。 我跟你说这话的时候，你们觉得可能老凄凉了。\n\n二十五岁你还没嘚瑟完，你得嘚瑟完，二十五岁你得鲜衣怒马、享受人生。中国讲究四十不惑，那是非常有道理的。 到四十岁的时候你还为这些细枝末节的事天天孜孜以求，那你就是不对，你不了解自己，你对人生的感悟不够。\n\n到四十岁以后，第一个最需要在乎的就是你自己的身体。 所以你四十岁以后就要学会逐渐锻炼身体。可去可不去的酒局就不要去了，不是必要的溜须拍马就不要再拍了，规律地锻炼，规律地作息。\n\n然后善待自己的家人，和自己的家人能够在一块儿，快快乐乐过好每一天。\n\n## 三十三、三十而立：该完成的事都要完成\n\n二十五岁和四十岁的人生是完全不同的。\n\n三十岁的时候，你应该把你能完成的事都完成了。 什么叫三十而立？三十之前你应该结婚，最好是生子，应该有一个稳定的工作，或者你已经确定了人生的规划。这是你三十需要做的事。\n\n三十一了还没对象——那实在不行，现在讲相亲市场上讲的，实在不行找个 A8 的就嫁了吧。 A8 就是资产超过一千万的人，八位数嘛，就 A8。\n\n## 三十四、抗阻运动是不可替代的\n\n我四十岁以前每天都去健身房，不只是四十岁，我坚持到了五十岁。后来五十岁的时候身体上出现了一个小毛病，做了个小手术之后，人家告诉我不能撸铁了。但我这些年老不去健身房以后，就发现血糖有点变高了，所以现在我也恢复一点力量训练，但不去健身房了，就自己在家简单练一练，大重量也不做了。\n\n有氧运动得有，但是力量训练、抗阻运动是不可替代的。 你说一天走三万步，你没有力量训练也不行。\n\n打乒乓球？我不会。羽毛球、乒乓球这对我来说都很难。打过高尔夫球，也是打得不来劲，后来也不打了，打了六七年也没啥长进。\n\n现在平常就散散步，也不慢跑，我跑步也不行，膝盖也不行。以前登山，现在登山也不敢登了。现在就是做一点点抗阻运动，主要是散散步。\n\n散步也比以前少了。多的时候一天有两万步，现在一天走几千步就行了。然后主要做一些——隔一天做一次抗阻，看情况，也做得很少，一天只练一部分：今天练胸，明天练肩，后天练背；今天练二头，明天练三头，要不就练腿、腰腹，反正轮着练。你现在这个年龄练多了不行，恢复不过来，而且一疼的话睡觉都不舒服。\n\n自重训练也行，现在我一般用一点哑铃，我自己在家里也有那种专门的哑铃凳，然后练一练，还有弹力带什么的，就简单器械。不像健身房那种啥都有，杠铃现在基本就不能练了。\n\n抗阻运动是不可替代的，一定得练。 不是说一天走步、慢跑就行——你还是要有肌肉训练，肌肉训练对血糖、对肌肉流失帮助都很大，这个东西是替代不了的。\n\n我五十岁之前几乎一周去三到四次健身房，那个时候除了健身房还登山，登山那时候也去得比较多。后来登山的人也都慢慢散了，登山也伤膝盖，对胯骨、髋关节也不友好，对腰也不友好。 登山那东西有瘾，但它对很多地方损害也很大，所以现在登山也不敢去了。有时候想一想，和那些老同学说约着登山的，约一回也不敢去。\n\n王德顺呢，其实就是练，那没有啥基因不基因的，你就是坚持就行。 你看王德顺就知道了，练和不练，对于尤其年龄大的人差别很明显，你要是年轻反倒看不出来。\n\n这个东西不在于胖瘦，说练必须练出八块腹肌，那不用。人要是超过一定年龄，比如说超过六十岁以后，你练习的主要目的不在于美观，也不在于啥，在于保持你的功能。\n\n大家能不能听明白？你到六十岁以后锻炼身体，主要是要维持功能。 你千万不要做那种极限运动，有的六十岁老人天天嘚嘚嗖嗖的又练这种又练那种，那种关节、那种极限强度，完是压腿使劲使劲压，那没有啥意义。\n\n你练的是保持自己的功能，比如说走路、行动、上厕所这些东西，你保证在八十岁的时候不用别人帮助就能完成，这就是你锻炼的目的。\n\n你年轻时候练不一样。我二十五岁练是为了练那个倒三角、练八块腹肌，那是那个时候的目的。你现在练八块腹肌你给谁看呢？ 我现在腹肌都是五花三层的，一块对一块儿的。\n\n你到年龄大了以后，基础代谢降得非常低。如果你要保持特别低的体脂率，那你饮食控制得非常非常严格，你完全没有必要。 饮食控制过于严格，就一定会有营养流失。年纪大了需要保持一定的脂肪量，体脂率过低的话，抵抗力什么的都会下降。\n\n所以一定年龄大了、过了五十岁，你就一定要防止肌肉流失。 有很多人到老了的关节不好，这都是由于肌肉没有力量造成的。有的人不明白，一个劲补钙，以为关节不行就是因为缺钙——不是，是因为你那个肌肉没劲了。 关节很多地方是靠肌肉来维持的，并不是靠骨头硬磨。\n\n比方说膝关节不好，实际上是需要做等长运动，你得把膝关节周边那个肌肉练起来。你膝盖不行的话应该练股四头肌，而且一般膝盖不行得用等长运动来练。你靠墙做一个直角蹲就行。\n\n我的目标就是在八十岁的时候自己能上厕所、自己能吃饭，这就行了。争取呗，如果我八十岁的时候还能活到八十岁，还能自己上厕所的话，我可以给你们露脸直播，到时候我甚至可以给你们开个线下的课，就当旅游了。\n\n## 三十五、人生总的来说都是平平淡淡的\n\n四十岁以后你就明白了，到六十岁你就更明白了。\n\n你看有的人一生轰轰烈烈，结果四十岁就去世了；有的人一生平淡无奇，人活到一百岁。 你说究竟谁更成功？这东西都不好说。\n\n当年乔布斯去世的时候，就有一个投资家说过这事：有的人轰轰烈烈，五十多岁就去世了；但有的人六十岁才开始投资。这东西人和人就是活法不一样。 对呀，你多活二十年，你就看到二十年以后的社会发展了。\n\n人生总的来说都是平平淡淡的。 我跟你讲，你今天耳熟能详的这些人，所谓这些大富翁，一百年以后没有几个人记得。 就今天你一说那都如日中天的人，没有一个人能记得。\n\n你翻看历史你就知道。我问你，皇上你记住几个？中国历史上皇帝的名你记住几个？你还别说别人了。清朝的大富翁你知道几个？\n\n老百姓所谓的轰轰烈烈，都是自己给自己假想的。 在我们这个历史上，你无论多富裕的企业家也好、大地主也好，过三代以后基本就都归于平淡，没人记得你。 你现在去扬州看看那些盐商留下的那些豪宅，包括山西平遥那些大院儿，你记得那些人的生平吗？ 你看一看他们才过了多少年。都是给自己假想出来的。\n\n我劝大家的意思就是，我们不要那么虚幻。 你既然认识到这个问题了，就不要再给自己增加负担。那东西原本就是个虚幻，你就乐乐呵呵过你的一生。 你出生那天就是百姓，那你就按照百姓的一生来过就完了。你别老一天「我原本是个百姓，我非得按照那什么大家的要求来自我要求」。\n\n对呗，你喜欢怎么过就怎么乐呵。有的人就是——人生就短短这一百年，你一天出来就战斗脸，天天跟这个争对、跟那个争错，一天尽是事儿，到处寻仇。\n\n年轻时候不容易看懂这些事，等看了事实如果再不看懂，那你是一生的感悟没有。 你四十岁以前说你感悟到这些东西了，那你是有点扯。所以四十岁以前也不应该感悟到这些东西，你四十岁以前就应该鲜衣怒马，你就应该挥洒人生。不同的时候你就有不同的追求。\n\n## 三十六、聊主题又被抬手了\n\n行吧，我就这样了，今天就下播了。大家有没有什么主题就聊聊——又抬手了（不能聊了）。\n\n大家把「评书」给我打公屏上。\n\n我所有涉及到的股票都不能用来指导投资，大家一定别太认真。 所有的投资市场的问题都不能用来指导投资，你们千万千万别认真。尤其不能说「我听你的买了啥」——我告诉你们，立马拉黑你。\n\n你说这话对于我来说就如五雷轰顶一般。 我说的东西，你认为有用你就听，认为没用你就别听。最终你投资什么，你还是要自己决策，千万别听我的，无论是买入还是卖出，都是一样，你不能听别人的，你必须要自己做主。\n\n这是你作为投资人第一课需要上的。 你永远都不需要说「我这个东西是听谁谁谁买的」，或者「听谁谁谁我坚持持有的」，或者「听谁谁谁我准备卖出的」——这都不行。如果你有这种想法的话，我劝你最好马上就离开这个市场，你最终一定会亏损。\n\n好了，再见，明天就开盘了。 非常高兴，谢谢大家的陪伴，要不然我这一上午都不知道该干啥。谢谢谢谢谢谢。","toc":["一、开场闲聊：赶路人、发声部位与吃播","二、昨天美股：标普也创新高，我为此写了个帖子","三、什么叫风险：这是给你们的一个观察窗口","四、想起李大霄：这么多年其实是管用的","五、彼得·林奇的故事：这次跟上次不一样","六、和大黄之间没有矛盾","七、我现在只看美债收益率","八、散户扛过周期？你先活过十年再说","九、拿不住的例子：1987、2000、1929","十、什么人才有资格总结经验","十一、美国机构没一个人说美股没风险","十二、我来市场是为了不亏","十三、日本股市新高：跟货币发行有关","十四、中央银行的增持黄金数据出来了","十五、买黄金是为了卖美元","十六、如果放开自由兑换：人民币商品化","十七、我们怎么破解：有限制的兑换","十八、别再提个股了","十九、雪球已经变成当年的微博了","二十、交易的本质就是互道傻逼","二十一、十一的固定套路","二十二、港股现在只有一个合理模式：持股收息","二十三、港币就是人民币的稳定币","二十四、什么情况下才能放开自由兑换","二十五、钱出去和老百姓理解的不是一回事","二十六、温水煮青蛙和快乐是自己的选择","二十七、外行领导内行是极端合理的","二十八、聊嗨了：平台违规这事","二十九、知识产权维权：不对称的博弈","三十、思维框架：查理·芒格的格栅理论","三十一、一招制敌：李小龙的截拳道","三十二、四十岁以后的人生建议","三十三、三十而立：该完成的事都要完成","三十四、抗阻运动是不可替代的","三十五、人生总的来说都是平平淡淡的","三十六、聊主题又被抬手了"],"url":"https://www.bilibili.com/opus/1256433278766809092","bv":"","minutes":0,"chars":18090},"ai":{"title":"老木匠·2026年10月7日：风险本质、美债信号与港股逻辑","text":"## 一、风险与涨跌是两件完全不同的事\n\n1. 说\"有风险\"不是在预测明天会跌\n\n他在这场直播里花了相当多的时间反复澄清一个被频繁误解的逻辑：他说某个资产有风险，不是在预测它明天会下跌，甚至它有可能继续上涨——但这不代表\"风险判断是错的\"。\n\n你有风险是要平衡你自己是否参与这样一个游戏，你要解决的是这件事。他有风险的时候，那么他赔率也高，但是他这个胜率就低了。你可能给你带来本金永久性损失的概率会增加，那么这种概率你是不是愿意参加？这是你自己的一种决策，而不是说一有风险他明天就应该往下走。\n\n2. 风险大，不等于不能参与——取决于你的目标\n\n他进一步区分了两种完全不同的投资目标：第一种是追求胜率高、本金永久性损失概率小的机会，风险大的资产他就不参与；第二种是专门在风险最大的地方下注博高赔率。这是两个不同的游戏，没有对错，只是你得先想清楚自己在玩哪个游戏。\n\n你来市场究竟是为了不亏还是为了赚钱？我的出发点是不亏。\n\n3. 独立思考有多难——当前市场是个很好的观察窗口\n\n他说当前市场给大家提供了一个非常宝贵的窗口期，来观察人在情绪高涨时有多难接受不同意见：你不是说它会跌，你只是说它可能有风险，就有人接受不了。\n\n你以后你就要知道你坚持独立思考会有多难。你不是你想象的那样说，那当年2015年都涨那么多了，怎么那么傻还往里冲、还不卖？你现在说纳斯达克有风险，都有人接受不了。所以这就是给你们一个非常宝贵的窗口期来观察。\n\n## 二、美债收益率：他现在只盯这一个指标\n\n1. 天天看的不是股指创不创新高，是美债收益率\n\n他明确告诉大家自己当前最核心的观察指标：五年期、十年期、三十年期美债收益率，以及美债期货走势。他的判断是：\n\n我可以明确告诉大家，现在美债的收益率没有任何起色，它依然是处在一个下跌的区间通道中。现在如果它未来不出现快速的修复，它早晚是个问题。\n\n2. 美债期货持续下行意味着什么\n\n30年期美债期货已经跌到103，还在持续下行。美债期货跌意味着债券价格跌、收益率升。这对所有风险资产都构成压力——资金从股票、商品、新兴市场流向高息的无风险美债，是一个慢慢显现的过程。\n\n## 三、李大霄的启示：反向指标也能赚钱\n\n1. 如果把李大霄当反向指标，你会一直赚钱\n\n他提到了李大霄的案例，带着某种幽默但认真的意味：李大霄每次说底的时候都不是底，还会继续跌；但你如果在他说底的时候买入，一直拿到他第一次提示风险的时候卖出，然后再等他说底的时候再买——这样操作，多年下来你不会亏钱。他的结论是：市场里有价值的信息，包括那些\"说错了\"的信息，关键在于你怎么用它。\n\n## 四、港股：现阶段最合理的投资模式是持股收息\n\n1. 港股的问题在于利率跟着美元走\n\n他解释了港股长期表现不佳的结构性原因：港币和美元是联系汇率，港币利率跟随美元利率，所以美国加息的时候港股的资金成本也跟着高。这使得港股资产的吸引力在高利率环境下持续受压。\n\n2. 现阶段港股最合理的玩法：找高分红的国内上市公司\n\n他给出了一个明确的逻辑：在港股寻找那些同时在A股上市、股息率高且能维持的公司。买港股便宜，股息率比A股更高。持股收息，不在乎短期价格波动，关键是判断分红能不能持续。他说这其实才是投资的本源：\n\n持股收息是原本的投资本质，就是说你本身你投资资本市场的最初的本质就是为了持股收息。你博差价，所有的博差价都叫投机，都不叫投资。\n\n## 五、没有经历过真正熊市的人，不要总结经验\n\n1. 2020年后入市的人，从未见过真正的熊市\n\n他观察到很多发言频繁的\"意见领袖\"，细看都是2020年或2021年才入市的。这些人没有经历过2015年的崩盘，没有经历过2016年的熔断，没有经历过2018年的趋势性下跌。他们经历的最大波动，在他眼里不叫下跌，叫\"抖动\"。\n\n你现在的经验就是在任何地点，只要跌下来买了就都可以回去。因为股指在不断创新高。你没经过过，你就永远也不害怕，所谓的初生牛犊不怕虎——你没见过虎，你根本不知道他的厉害。\n\n2. 想总结经验，至少得经历过一轮完整牛熊\n\n他给出了一个最低门槛：至少经历过2014年至2015年那一轮牛市的全程——从启动到高潮到崩盘，再经历2016年熔断，然后活下来。他用\"夏虫不可语冰\"来形容那些没有经历过冬天就开始总结经验的人。\n\n3. 1987年道琼斯一天跌22%——你真的能拿住吗？\n\n1987年10月19日，道琼斯指数一天跌22%，最终涨回来了；但在那一天，你敢保证他一定会回来吗？1929年刚开始跌的时候，所有人也以为马上会回来，结果一直持续到1933年。\n\n你都是穿越回过去了以后，你一看你都能耐透了。你要回三国，你比曹操都厉害。\n\n## 六、交易的本质：互道傻瓜的博弈游戏\n\n1. 同一个价格，买的人和卖的人观点截然相反\n\n他说这件事很多人不敢直视，但这就是市场的本质：同一个价格，同一时刻，有人买有人卖，买卖双方对这个价格的判断是截然相反的。\n\n交易的本质就是一个互道傻瓜的过程。要不然为什么同一个价格会有人买，会有人卖呢？买卖双方对这同一个价格的观点就是截然不同的，这是每天都在发生的事。\n\n2. 任何人都不要试图让所有人的观点和自己一致\n\n市场里观点不一致是常态，也是必然——如果大家观点都一致了，就没有交易了。所以争论对错没有意义，你只要表达自己的观点，然后根据自己的判断做决策，就够了。","toc":["一、风险与涨跌是两件完全不同的事","二、美债收益率：他现在只盯这一个指标","三、李大霄的启示：反向指标也能赚钱","四、港股：现阶段最合理的投资模式是持股收息","五、没有经历过真正熊市的人，不要总结经验","六、交易的本质：互道傻瓜的博弈游戏"],"url":"https://xueqiu.com/2573414707/411591554","chars":2219},"topics":["风险本质、美债信号与港股逻辑"]},{"date":"2026-10-05","bili":{"title":"老木匠 2026年10月5日直播文字稿（评书闲聊、官媒文章、AI基建、耐克启示、股东人数、教子）","text":"## 一、今天没什么事：随便聊聊，就当评书听\n\n我今天没什么事干，也不算\"偷袭\"，就是想聊了就聊一会儿，不想聊就不聊。\n\n先把丑话说前头：我这不是什么知识直播，也不太认真。 我也没有投顾执照，说的话你听个一过就行，别拿去指导投资。 我上回就说过，以后这种公开直播会越来越少，在雪球上发帖也会越来越少。\n\n所以谈到个股的时候，大家也别追问。现在个股是不能谈的，我提到哪只股票，都只是拿它举例讲道理，既不看空也不看好，更不是我持有的。 这一点后面我还会再强调。\n\n## 二、官媒的十篇文章，要认真看\n\n今天上午有十篇比较重要的文章。前三篇讲的都是新质生产力，北斗这些也在里头。 后面几篇，讲的都是民生、国内市场、内需这类话题。\n\n我一贯主张：大家一定要学会看官媒的重要文章。 别听那些自媒体人念叨\"这没用那没用\"——那东西再没用，难道小道消息就有用了？ 还有一点，看完记不住很正常。 你不需要把它背下来，但你得形成一个大概印象。\n\n看的时候就要边看边想：它未来往哪个方向走？这个方向有没有投资机会？ 尤其现在这种大转向的时候，你有个大概印象，就比别人强。\n\n不用非得去抠那些细节。这种大关口刚出现时你可能感觉不到，慢慢慢慢你就会发现这种变化。\n\n你看这回十一的旅游数据就明白了：现在出行的人已经很多，各地景点都满，出行数据也很高。 它是在不断给你渗透这个信息的。\n\n## 三、我们这个体制：集中力量办大事\n\n你要知道，在我们这个体制下，想做成一件什么事，手段是全方位的，这跟美国完全不可同日而语。 在美国，想干成一件事，不同机构之间实际上是在互相博弈的，各有各的利益。\n\n我们当然也有分工，某种程度也有点牵制，但总体上是在一个机构的领导下，是互相配合的。\n\n不过话说回来，机构只要有分工，就会有部门利益。 怎么让各个部门统一协调、朝一个方向使劲，这是个很大的话题。 这事儿其实不容易，不像大家想的那样，谁发句话大家就都往一个方向做了。\n\n老百姓说得对，有人的地方就有江湖，有江湖就有利益冲突、就有恩怨，哪儿都一样。不同地方之间还有地方利益。\n\n所以你要让所有人都朝一个方向努力，这是非常不容易的，是一门学问，也是一种能力——这是一种执政能力。 不是把你放到那个位置上，你就能做到，这得分人。\n\n## 四、印度、美国修铁路难，是体制问题\n\n大家多去了解一下我们的国情。跟那些发达国家比，我们有一个非常明显的特色，这个东西在这儿不方便展开说，但它确实有很大的优越性。 我一说这个，有些偏激的人就嗤之以鼻，觉得我在胡扯。其实不是。\n\n大家静下心来想想：过去四十年，我们是不是全球发展最快的经济体？ 这个谁能否认？\n\n你说我们的体制一无是处，这也不对那也不对——那这四十年的高速增长是怎么来的？ 有不足，大家可以提，任何制度都不可能完美。 但你提归提，千万别妄自菲薄。\n\n你想想印度。印度总理莫迪为了平衡各地利益，得费多大劲？ 他想做的事，能像我们这样顺利推进吗？不同的邦有不同的利益，说话都不一样，互相还听不懂。\n\n我小时候，一提印度，人家比我们发达多了。我大学毕业那会儿还去新马泰旅游，那都得往回带东西，那时新马泰比我们发达得不是一个档次。\n\n结果几十年过来，现在谁上新马泰还往回带东西？ 那种旅游线路，除了老头老太太，基本都没了。\n\n印度我判断，五十年一百年也不行。 你想把一个像印度那么大的组织结构扭转过来，让它朝一个方向努力，这事儿太难了。\n\n因为历史上公认，印度不是一个国家，是一个被硬扭到一块的国家。 它是英国殖民造成的：大家一起当殖民地，英国撤退时就拼出了这么一个国家。 不同邦有不同利益、不同实力，都不一样。\n\n所以你看，在印度修条铁路多困难，过一个邦界都费劲。印度铁路到现在都是全世界的笑柄。\n\n在这么工业化的情况下，修铁路这么简单的事，在印度怎么就是修不了？ 它不是技术问题，是体制问题。\n\n不光印度，美国修高铁也一样费劲，各州利益不同，征地修一段高铁得过五个州，非常非常麻烦。\n\n一八三几年美国铁路热潮的时候还相对好办，因为那时还没形成成熟的土地利益集团，地也不值钱。你现在在美国再修一条试试？ 光把沿线地征下来就是个大工程。\n\n我们修高铁就没有地方利益的阻碍吗？哪个地方设站、线路从哪儿走，全都在博弈、在争夺，你以为呢。\n\n## 五、过去四十年全球最快，别妄自菲薄\n\n回到刚才那句话：过去四十年我们就是全球发展最快的经济体。 这个谁也否认不了。 你要是说我们体制哪哪都不对，那这个高增长是怎么做到的？\n\n所以我的态度是：不足可以提，但别妄自菲薄。 你说它一无是处，那是不对的，这些东西都是有其道理的。\n\n## 六、AI 基建，跟我们当年修铁公基没区别\n\n近期美国有个说法，说要和中国搞 AI 人工智能的安全监管问题，结果特朗普不同意。 特朗普为什么不同意？因为他需要 AI 基建来撑 GDP。\n\n你要知道，现在美国 GDP 很大一部分，是 AI 人工智能的基建撑起来的。 大量的社会资源、资金、人力，都集中到了 AI 基建这个行业。 而这些基建建完之后，它并不直接产生效益，这一点大家一定要清楚。\n\n美国现在建 AI 数据中心，跟我们当年修铁公基没有任何区别。 都属于基本建设。 基本建设的好处是：建出来的东西对将来有用。 但它现下并不直接产生财富。\n\n问题在于，建设的过程会造成 GDP 的增加。 因为建东西这个过程，是要计入 GDP 的。\n\n但它本身并不带来财富。 就像早年我们搞铁公基，西部修了很多高速公路，根本没有人走，可为什么还要修？ 为了当期的 GDP。\n\n经济一低迷，国家就投资，让大家转起来去建那些暂时用不上、将来可能用得上的东西。 所以我们修了很多高铁、很多公路，利用率并不高。\n\n西部、内蒙那些高速公路经常没人走，但也要修，为什么？当期的 GDP 好看。 经济一低迷、GDP 一下降，就搞铁公基，这就叫刺激投资。 美国现在干的 AI 建设，跟我们搞铁公基是一样的，只是表现形式不同。\n\n按凯恩斯那套理论，你干什么都一样，挖个大坑再填上也是一回事，反正都增长 GDP。\n\n现在这些数据中心建完，其实也不带来现实财富。 有人在训练大模型、把它租出去，但训练出来的大模型并没有市场，或者说那点市场根本不足以弥补基建的投入。\n\n所以整个投资效率现在是非常低的。 但这无所谓——我们修铁路公路是为未来，美国修 AI 数据中心也是为未来，道理一个样。\n\n## 七、为未来借钱：竞争性融资推高美债收益率\n\n特朗普不同意搞安全监管、就是因为他希望大干快上。 他心里那点小九九是：现在所有数据中心、未来一百年要用的数据中心，最好都在我当总统这几年建完，那我 GDP 最好看。\n\n那钱哪儿来？只能借。 因为 AI 数据中心这套东西，经济上没有闭环，跟当年修没人走的高速公路一样，怎么回收贷款？ 办法是先借，以后再说，向未来借债。 你不是为未来建设吗？那就向未来借钱。\n\n所以它就需要大量的融资。 我们搞基建的时候，也需要大量融资——房地产时代，房地产配合的就是大量的铁公基，一定形成巨大的债务存量。 我们表现在地方债务上，老百姓也得借钱买房，大家都是用债务把这些东西撑起来。\n\n美国现在也一样，没有闭环，还得建，那就得借钱。 这一借钱，就跟美国政府形成了一种竞争性的融资。 政府的钱就这么多，数据中心也在借、政府也在借，那就看谁出的价高。\n\n所以资金成本就会越来越上升，国债收益率就往上走。 这就是竞争性融资造成的。 基建发展一定会伴随大量融资，也一定伴随资金使用率的上升。 大家回忆一下，我们房地产时代利率也很高——二零二一年我们的利率也很高，因为借钱的人太多。\n\n## 八、泡沫三要素：高科技、基本建设、融资\n\n那天我听一个美国的对冲基金经理讲，他说历史上的泡沫都跟三件事有关：第一跟高科技有关，第二跟基本建设有关，第三就是融资。\n\n历史上那些大泡沫都是这样：要么有个新奇的故事——一次生产力的革命性变革、一次跨时代的发展，无论是当年的铁路、运河、电子管、晶体管，还是互联网、包括今天的 AI，都会催生泡沫。\n\n因为没有泡沫，就不足以支撑它的融资。 科技刚开始发展一定是烧钱的，得有人烧钱，那怎么让人心甘情愿地烧？就得形成一场泡沫，让那些风险偏好高的人愿意投钱。\n\n他们赌的是高赔率：胜率虽然低，但赔率很高，一旦胜出就赚得盆满钵满。 这有点像买彩票，福利彩票不就这道理吗，你中大奖一下就改变生活，而这钱是拿去做福利事业的。\n\n第二个容易形成泡沫的是基本建设。因为它只有投入、没有回收，你不断往里投，那就得给大家讲一个未来的故事，才能吸引资金。\n\n第三个就简单了——支撑这两者的就是融资。所以泡沫一定伴随着融资成本的上升。 我们房地产泡沫时也伴随融资成本上升；现在美国 AI 泡沫也一样。\n\n这些事你慢慢就都能理解了。泡沫是泡沫，但不是说明天就破，这个谁也不知道。至于你个人愿不愿意参与，那是你自己的选择。 泡沫可以继续吹，不是我们一说泡沫它就明天破了。\n\n## 九、硬件卖铲子：第一波受益是确定的\n\n现在美国的 AI 数据中心建设，跟我们的房地产建设没有啥区别，就是硬件系统在赚钱。\n\n我讲个道理：基本建设的时候，什么东西最赚钱？挖掘机最赚钱，生产水泥钢筋的最赚钱。\n\n因为这些东西，就相当于现在基本建设里的英伟达。 它是卖芯片的，它不管你数据中心未来能不能租出钱、大模型训练完能不能卖出去。\n\n你建的时候，就得买我的 GPU、买我的存储器，芯片、光模块都一样，它们首先受益。\n\n所以 AI 的第一波收益，一定是这些硬件公司，而且是确定性收益。 就跟房地产开发时一样——我不管你项目赚不赚钱，你买挖掘机、买水泥钢筋，得先给我钱吧。\n\n至于你的房子建完卖不卖得出去，跟我没关系。 这跟当年美国淘金热一样，卖铲子、卖牛仔裤的最赚钱。\n\n## 十、中美在缓和：华为和高通达成协议\n\n刚看到消息，华为和高通达成协议了，还涉及 5G，以及高通收购华为在美国的那些专利。 这跟我一直跟大家说的一致：中美贸易关系是在缓和中的，现在是在边际上缓和。\n\n有人问中概股，这个我不了解。但像恒生科技里的那些公司，很多现在是可以直接投资的，就是结构很复杂，得区分。\n\n## 十一、延长交易时间，意义不大\n\n延长交易时间这个事，我觉得影响不大，没啥意义。 交易时间长了，也还是那么个交易法，能交易的就那么多人。 现在的交易时间根本已经不是瓶颈了——你看 A 股，每天十点半左右交易高峰就过去了，剩下的交易量都很小。\n\n延长不延长，意义不大。 对券商赚佣金来说，算是好事，交易量肯定会增加一些，但那不是主要的。\n\n原来说交易时间是瓶颈，是因为技术手段不行，单位时间能撮合的交易量有限。 现在都靠计算机撮合，你有多少量，一秒钟就撮合完了。\n\n## 十二、新规之后，个股是禁区\n\n因为出台了新规，管的是在公共平台推介金融产品，现在搞得风声鹤唳，大家都不怎么说话了，有些号也做了相应处理。 所以现在尽量不要谈，尤其个股不能谈。 大家千万不要再谈个股了。\n\n我从年初就预计到会有今天。 现在自媒体乱象太多，不管理也不行，是真有人用这东西骗老百姓。 所以这个管理，我是同意的。\n\n年初那批产业链的人多嚣张，就给你推个股。小白根本没有分辨能力，分不清人家是在给你讲市场，还是在给你下杀猪盘。\n\n但严管也有个问题：你要严管，就必须把目标放大、范围画宽，那一定会误伤——有些人本来不是推介金融产品，也会被管到。这道理很简单。 那批人基本没有冤枉的。 我前两天还看见他们在那儿商量怎么规避这事呢。\n\n## 十三、金融大聪明：懂术语，不懂人性\n\n有个博主叫\"金融大厨\"（也有人叫他金融大聪明），中金公司出来的，康奈尔毕业的，讲他自己那套经历，告诫大家要远离金融大聪明。我觉得他说得挺好。 我们现在的问题在于，公募基金、金融机构里到处充斥着这些金融大聪明。\n\n他们根本不知道世间的险恶，不知道行情的风险，就是学了点书本，就觉得自己什么都懂。要懂模型、要懂盈利模式、要懂各种术语，贝塔、阿尔法、各种字母整了一堆。 结果他唯一不了解的，是人性的丑恶和社会的复杂度。\n\n## 十四、零星问答：金油比、有色、房子\n\n有人问金油比，其实就是把黄金当货币来看，用黄金来计价的油价。 还有金铜比，都是一回事。 但这是个本质的说法——现实里哪有人用黄金去结算、去买油？没有。\n\n有人满仓有色，害怕。你说有色害怕啥？有色又没跌，今天港股有色不都是涨的吗？ 不用一惊一乍。\n\n有人问房子能不能买了。作为投资，我觉得现在还是不行；作为消费，那你随意，愿意买就买。 快速下降的那个时期，我觉得应该已经过去了。\n\n## 十五、三季报：重点看股东人数\n\n进入十月份，三季报陆续都出来了，大家可以去看看。 我建议你们特别关注一下股东人数，尤其高位的股票，你必须看看它的股东人数是不是还在增加。\n\n我对三季报的业绩不怎么在乎，因为三季报是未经审计的季报，没啥实际意义，而且是最能调利润的。 真正有意义的只有半年报和年报，其中半年报意义也不太大。\n\n你要看，就把股东人数这几个季度放一块看，再结合股价的变动：如果它一边上涨，股东人数还大幅增加，你就一定要警惕。\n\n相反，一只股票价格在下跌，但股东人数却大幅下降，那你就可以关注，去研究为什么会这样。\n\n## 十六、股价最终是买卖双方的合意\n\n研究股票，它不光看基本面，还有别的东西。 股价最终起作用的，是每一个人买卖的决策，是买卖双方达成的交易合意。 基本面也好、宏观面也好、资金面、政策面也好，最终都得通过这种博弈来发挥作用。\n\n基本面好，它也不一定涨。 你看银行，好多年不涨，基本面不好吗？五倍市盈率、百分之六的分红率。 可它该不涨就是不涨。\n\n## 十七、股东人数与筹码：攀岩的支点\n\n主力投资者的量那么大，涨起来好几倍的时候，为什么不出？ 难道要在更低的时候出？\n\n股价涨高了，基本面都变好了，全是好消息，那你问主力这么大的量，不在这个时候出，在啥时候出？\n\n我为什么让你看股东人数——股东人数下降的时候，往往股票还非常低，说明主力已经在吃货了。\n\n这本质上是个筹码游戏。 什么东西长高了，主力一出去，这东西再涨就非常非常难。 我给大家打个比方，你玩过攀岩吗？ 攀岩是不是得不断寻找支点，越攀越高？\n\n你买的每个股票，就相当于攀岩的一个支点。 你应该在这些支点当中不断选择、越爬越高，你为啥要在某一个支点上靠死呢？\n\n## 十八、手机厂的兴衰：别认为谁永远在\n\n跟大家聊聊历史，也挺有意思的，尤其股票市场那些历史，有好多特别有意思的事。 你们可能不知道波导手机。当年波导如日中天，还有一句广告词\"手机中的战斗机\"。谁能想到它这么快就完了？\n\n还有诺基亚、爱立信，当年如日中天的时候，谁能想到他们很快就都完了？ 还有 HTC（宏达），我认为它是最早的智能手机雏形，国内最早，我还用过它的手机。\n\n所以这个产业变化非常非常快。 那个时候，谁知道有华为手机？谁知道有苹果？ 都没有人知道。\n\n那我现在问你：你既然当年都不知道有苹果，凭什么认为苹果就会永远存在？ 苹果不被别人替代的理由是什么？\n\n它既然能替代别人，为什么别人就不能替代它呢？ 所以大家要保留必要的怀疑，不要过于自信。\n\n## 十九、耐克：涨三十三倍，又跌去八成\n\n这两天有个新闻比较热，就是耐克。 耐克在二零二一年是股价高峰，从二零二零到二零二一年大概涨了三十三倍。\n\n你想，如果是你在二零零零年买入耐克，一直拿到二零二一年，涨了三十三倍。 你是不是会觉得：你看我这都涨三十三倍了，而且这东西只会越来越好。\n\n如果你抱着这个看法一直持有，那我告诉你：二零二一年到现在，它跌去了百分之八十。\n\n也就是说，你从两千年拿到二零二六年，只涨了六倍。 二十六年只涨六倍，这是个非常平庸的收益了。 而前面那二十一年涨三十三倍，是极其优秀的手艺。\n\n所以你必须知道：在二零二一年之前，你什么时候买耐克都是对的。 但之后就不一样了。 白酒里也一样，五粮液，你从二零一六到二零二一看看涨了多少，拿到今天再看呢？\n\n## 二十、预测越远，错误率越高\n\n事后分析耐克下跌的原因，什么抵制新疆棉等等，你都能总结出一堆，但那都无所谓。\n\n主要原因是：你谁也预测不了那么远。 当你预测过远的时候，错误率就会增加，这是由概率决定的：预测近，正确率就高；预测远，正确率就低。\n\n预测这件事，有一个概率最佳的时间段。 比方说，预测未来一年，是很好预测的；预测未来二十年，是预测不了的；预测明天，你干脆预测不了。\n\n预测未来三五年，可能概率最高。 你非说你能预测二十年，那跟算命一样。 而预测明天，那根本不用预测，明天的事都是随机的。\n\n## 二十一、可口可乐、茅台、万科：别以为你的不一样\n\n你看，可口可乐现在还在创新高。 巴菲特买可口可乐的时候，分析来分析去，但他所有的模型里，都没想到中国改革开放对可口可乐的影响——它后来利润那么好，跟中国改革开放有很大关系。\n\n而现在，整个美国的消费股都很低迷。 价格高了，它就有风险。 你看万科今天这个状态，不用说十年前、三年前，谁能想到万科会到今天这个价格？\n\n我当年说\"四块钱的时候，我可以考虑冒冒险\"，多少人嘲笑我，说\"这又疯一个\"。\n\n我的原话是\"四块钱可以考虑冒冒险\"，我没说四块钱就一定买。 老粉应该都能记住这句话。\n\n现在三块多了，我也没看见谁砸锅卖铁去说哈。 但我要提醒你：万科都有前车之鉴了，你那个股票也不是不可能这样。\n\n今天你说\"万科是万科，茅台的茅台，我这个股票不可能像它们那样\"，这种话你就得警惕。\n\n## 二十二、白酒：不看空，但不做多\n\n白酒我现在并不看空——当然那个龙头，我觉得性价比不高，其他我都不看。 黄酒，我在最早的时候就讲过，一直挺看好，但也一直没找到合适的价格，太贵了，而且炒作比较多。\n\n不看空的唯一原因，就是它便宜了，其实啥都没好转。 现在还有很多白酒的信仰者会去接盘，但还没到时候。\n\n现在买它，你要等一个机会。 我告诉大家：如果发生流动性风险、所有东西都开始下跌的时候，你就有一次切换到它身上的机会。\n\n现在这个流动性下，它其实已经跌不动了，你要等的就是最后把最后一波意志不坚定的人挤出来。 但记住：不看空，不等于做多。 你说它现在有多大弹性，那还不至于。\n\n## 二十三、等一次流动性风险\n\n我现在总的思路，就是等一次流动性风险。 所以我把所有账户又都调到了融资户——虽然我现在并没有多少融资，但我随时准备好。 就像\"时刻准备着\"那话，做什么事你不得先有个预防？\n\n六月三十号的时候，我把所有东西都清仓了，钱都拿到普通户里，就是防止自己忍不住乱融资。 等待一次流动性风险。所有的风险都是机会。\n\n你要是在二零零八年的时候还有钱买股票，这些年随便买啥不都赚钱吗？ 那还跟你选啥股有啥关系？尤其美股，当年后来涨十倍、二十倍遍地都是。\n\n## 二十四、流动性风险是什么\n\n什么叫流动性风险？就是全都在跌。 历史上都发生过：去年四月份、前年二月份，贸易战一次、雪球敲入一次，那不都是流动性风险吗？ 啥东西都跌，跟你持有的是啥没有关系。\n\n那个时候，你就买已经跌到最低点的——当然基本面得是好的，得是你长期关注的东西，到时候搏一把反弹就行了。\n\n你一年挣个百分之十就可以了，何必在这儿折腾来折腾去？ 一天担惊受怕，拿着也害怕，你何必呢。\n\n## 二十五、心态要平和，别一惊一乍\n\n在这个市场里，第一要心态平和。 你做股票不能老一惊一乍——一好就手舞足蹈，一不好就如坐针毡，那不行。你得知道它是个乐趣，不能把它变成负担。\n\n我看有些人做股票，那负担太重了。 人家一说他股票不好，他马上就像条件反射似的群起攻之，这心态就不行。\n\n任何一个股票的涨跌，跟别人说好说坏没有任何关系。 你得把心态放平，把所有的股票都当成一种筹码。\n\n对我来说，做股票是一种博弈的乐趣，就跟下象棋一样——我想办法跟这个市场憋着劲儿，怎么布局、怎么赢它。\n\n这市场就是个特别奇妙的东西。 你时间玩长了，对你来说都是明牌了，到时候就是有人愿意把钱送到你手里。\n\n明明五块钱的时候没人买，八块钱的时候就有人抢——到时候全是好消息。我就觉得特别奇怪，这些人怎么能傻到这种程度？可他就是傻到这程度，愿意把钱送给你。\n\n## 二十六、市场先生是个精神病\n\n格雷厄姆讲的那个\"市场先生\"，你就把他当成一个精神病。 他心情不好的时候，希望你把他所有东西都买走；价格涨上来了，他又希望你把手里的东西都卖给他。 格雷厄姆把他比喻成一个双向情感障碍的患者，狂躁抑郁型的精神病。\n\n所以你不要受市场先生情绪的影响，你要关心的是市场先生的钱包。 今天这个市场状态，我都看过最少三到四次了，它还会再来一次的。\n\n## 二十七、市场没有新鲜事\n\n一边骂着白酒，一边冲进光里——你说这哪有新鲜事？ 买光的人，他就觉得自己比当年买白酒那帮人聪明，其实一模一样。\n\n每一个时代，人的聪明和愚蠢的比例都是一样的。 老人总倾向于说\"这代年轻人不如从前\"，其实年轻人永远都一样，老人也永远都一样。 不同时代，智力的分布曲线是没有任何变化的。\n\n## 二十八、每一代人的聪明和愚蠢，比例都一样\n\n现在年轻人懂装电脑、懂 AI 人工智能，其实你倒退一百年回去，跟懂种地、懂怎么沤大粪的人没有啥区别。\n\n不同的时代有不同的技能。 你今天懂怎么修电脑、装电脑，跟二十年前懂怎么修电视，跟三十年前懂怎么修手扶拖拉机，道理是一样的。\n\n所以现在的小孩觉得自己会修个电脑就了不得了，其实都无所谓——在你这一代人里头，你该处在什么位置，还是处在什么位置。\n\n## 二十九、孩子\"打游戏行\"，是因为游戏不高考\n\n以前有个人讲过一件事：说我们家孩子，上学不行，干啥都行，打游戏行、打篮球行。\n\n人家说：你孩子打游戏行、打篮球行，是因为游戏和篮球不是高考的项目。 如果明天把篮球和游戏改成高考项目，你家孩子依然不行。 我觉得这话特别有道理。 那是因为那些聪明的孩子，没打游戏，都在学习。 他要是打游戏，你们根本不行。\n\n你的孩子之所以\"行\"，是因为他在逃避竞争——他找到了一些没有竞争的领域，躲在游戏里获得自我实现感，因为这个领域里没有真正的能人来玩。\n\n每个孩子在成长中都需要自我实现。 他上课时被人 PK 得体无完肤，所以他躲在游戏里。这需要让孩子认识到，他这个心理本质是在躲避竞争。\n\n## 三十、教育孩子：十八岁前多陪伴\n\n说到孩子，我给你们提个醒。 孩子十八岁之前，你一定要抓紧和他在一起的时光。 十五六岁之前最美好，等他一上大学，就算离开家了，以后再回来就是客人。\n\n一旦他十八岁上了大学，你必须马上让他独立，不能还让他早请示晚汇报，像中学生那样，那你就把孩子坑了。 男孩女孩都一样，都得独立。\n\n所以越小越应该领着孩子出去玩。 五六岁、上小学，就该领着他到处去见人。真等他年龄大了，他都不想跟你玩了，你哪还有机会？\n\n## 三十一、旅游的意义：多场景、言传身教\n\n我建议有孩子的，还是要多看一看人文景观——去看看有文化内涵的地方，比如陕西、山西、北京。 旅游的主要目的，不在于去看什么东西（当然看也很重要），而在于这个过程。\n\n你在家这个场景太单一了，学校加家，孩子没机会学会你父母的行为模式。 而教育孩子，总的来说是要让他学会你认为正确的行为模式。 那你怎么让他学会？你得在不同的场景里不断展现出来。\n\n你出去旅游，见不同的人、不同的场景——包括乘坐公共交通工具时怎么遵守秩序，怎么和乘务员、空姐打交道、怎么尊重人家，这些对孩子都会有影响。 你在家，哪有机会给他展现这些？\n\n所谓读万卷书不如行万里路，行万里路不如阅人无数，你见的人多了，就知道这个社会是怎么回事了。\n\n## 三十二、孩子怎么对你，看你怎么对父母\n\n说到教育孩子，我这个年龄，观察过很多家庭的子女对父母的态度。 咱不说那种历史上的愚孝，就说对年老父母的关心程度、照顾程度。 有很多家庭的孩子，对年老的父母非常冷漠，不管不顾。\n\n我告诉你：所有这样的子女，在他自己父母身上都能找到影子。 你的孩子怎么对你，其实是由你怎么对你自己父母造成的。\n\n你去看那些年老父母被孩子不管不顾的，特别可怜。但你仔细观察这个老人对他上一代的态度，在他身上是能找到影子的。\n\n你自己对父母就不管不顾，你指望孩子长大以后照顾你？这不可能。 孩子从小就是学来的，言传身教。\n\n所以我为什么说，让大家领着孩子多出去旅游——不同场景里你怎么对待别人，孩子都会学。\n\n你看有的人，出来就对空姐、乘务员不尊重，颐指气使，你孩子有样学样，最后他也变成那样。你不尊重别人，你的孩子也不尊重别人，最终他也会不尊重你。\n\n## 三十三、祖父母带大的孩子，问题多\n\n为什么说财富和贫穷会\"遗传\"？它其实不是遗传，是教育的作用，跟基因没啥关系。\n\n家教是最重要的，比学校教育重要。 学校只能教给你知识和技能，人品道德这些方面只能靠家庭教育。\n\n所以有的孩子一出生就甩给自己的父母，让祖父母养大——除非你祖父母本身认识特别清楚，否则祖父母对孩子都会溺爱。 祖父母带大的孩子，身上是有非常明显特征的。\n\n所以孩子必须自己带。 实在忙不过来，让父母搭把手可以，但你不能把自己教育孩子的责任，推给自己的父母。\n\n隔辈人特别迁就、特别溺爱，这是人的天性造成的。 父母会逼孩子\"你必须学习\"，祖父母就比较宽容：\"你不学拉倒吧，就这地儿吧。\" 你今天在教育子女上，每一次省的那点力气，未来都会加倍偿还回来。\n\n## 三十四、结语：两小时评书，听个一过\n\n聊了两个小时，我准备下播了。 今天也没什么具体内容，就是跟大家聊聊天，想到哪儿说到哪儿。\n\n以后我这种公开直播的聊天，也就是这样——想到有些知识就讲一讲，大家也别太认真。 我说的东西都是评书，你们把\"评书\"给我打在屏幕上。\n\n我不是什么知识博主，也不是专业人士，我没有投顾执照。 你们听我的东西就一听一过，别用来指导投资。\n\n我说及的所有股票，都不是我持有的，只是拿来举例，我既不看空也不看好。 没有啥非听不可的内容。谢谢大家陪伴我这两个小时。\n\n过两天开盘了，市场上可能还有一些东西可以说一说。 今天不开盘，也没啥可说的。 好了，我要关播了。再见，谢谢大家。","toc":["一、今天没什么事：随便聊聊，就当评书听","二、官媒的十篇文章，要认真看","三、我们这个体制：集中力量办大事","四、印度、美国修铁路难，是体制问题","五、过去四十年全球最快，别妄自菲薄","六、AI 基建，跟我们当年修铁公基没区别","七、为未来借钱：竞争性融资推高美债收益率","八、泡沫三要素：高科技、基本建设、融资","九、硬件卖铲子：第一波受益是确定的","十、中美在缓和：华为和高通达成协议","十一、延长交易时间，意义不大","十二、新规之后，个股是禁区","十三、金融大聪明：懂术语，不懂人性","十四、零星问答：金油比、有色、房子","十五、三季报：重点看股东人数","十六、股价最终是买卖双方的合意","十七、股东人数与筹码：攀岩的支点","十八、手机厂的兴衰：别认为谁永远在","十九、耐克：涨三十三倍，又跌去八成","二十、预测越远，错误率越高","二十一、可口可乐、茅台、万科：别以为你的不一样","二十二、白酒：不看空，但不做多","二十三、等一次流动性风险","二十四、流动性风险是什么","二十五、心态要平和，别一惊一乍","二十六、市场先生是个精神病","二十七、市场没有新鲜事","二十八、每一代人的聪明和愚蠢，比例都一样","二十九、孩子\"打游戏行\"，是因为游戏不高考","三十、教育孩子：十八岁前多陪伴","三十一、旅游的意义：多场景、言传身教","三十二、孩子怎么对你，看你怎么对父母","三十三、祖父母带大的孩子，问题多","三十四、结语：两小时评书，听个一过"],"url":"https://www.bilibili.com/opus/1255707201678344199","bv":"","minutes":0,"chars":10723},"ai":{"title":"老木匠·2026年10月5日：AI泡沫逻辑、筹码博弈与市场生存法则","text":"@买股票的老木匠 根据2026年10月5日直播整理 · 按点分段讲解 · 保留原话语气和比喻\n\n## 一、美国AI基建：和中国当年的\"铁公基\"是一回事\n\n1. AI数据中心建设不直接产生财富，但拉动当期GDP\n\n他把美国现在大规模建设AI数据中心，和中国当年大搞铁路公路基础设施建设做了一个直接类比：两者都属于基本建设，在建的过程中拉动GDP，建完了不一定直接产生等量的现实财富。西部那些没人走的高速公路，和现在出租率存疑的数据中心，道理是一样的。\n\n凯恩斯的理论来说，你就不管干什么都是一样。你就挖个大坑再填上，他也是一回事，他也是增长GDP。\n\n2. 英伟达就是AI时代卖铲子的\n\n他用淘金热的比喻点出了AI浪潮里最确定的受益方：数据中心不管最终能不能赚回投资，建的时候都得买GPU、存储器、光模块——这些硬件公司的收益是确定的，就像当年盖房子必须先买水泥钢筋，挖掘机厂商不管开发商最后赚不赚钱，卖机器的钱必须先到手。\n\n3. 泡沫的三个共同要素：高科技、基建、融资\n\n他转述了一个美国对冲基金经理的判断：历史上所有大型泡沫都跟这三件事有关。第一，有一个新奇的故事——铁路、运河、互联网、AI，都是这个模式；第二，基建本身不闭环，只能靠讲未来的故事吸引资金；第三，支撑前两者的必然是大规模融资，资金成本随之被抬高。他的判断是：\n\n泡沫是泡沫，但是泡沫是不是明天就破，这个谁都不知道。你个人是否愿意参与这个泡沫，那是你自己的选择问题。\n\n4. 竞争性融资推高利率，美国现在的逻辑和中国当年一模一样\n\n他解释了美债收益率持续上行的根本原因：数据中心在融资，美国政府也在融资，两者抢同一个资金池，结果是资金成本被持续抬高。这和中国房地产时代完全一样——那时候大家疯狂借钱盖房子，利率也很高。\n\n## 二、三季报怎么看：股东人数比业绩数字更重要\n\n1. 三季报业绩数字参考价值有限\n\n他说三季报是未经审计的季报，是最容易被调节利润的报告，看业绩数字意义不大。真正有参考价值的财报只有两个：年报，以及半年报（但半年报也有限）。\n\n2. 重点看股东人数的变化趋势\n\n他给出了一个具体的观察方法：把几个季度的股东人数放在一起，结合股价走势来看。股价上涨同时股东人数大幅增加，要警惕——说明筹码在向散户扩散，主力在出货；股价下跌但股东人数大幅减少，值得关注——说明有人在低位悄悄吸筹。\n\n如果他一边上涨，一边涨的过程中，股东人数大幅增加，你就一定要警惕这件事儿。\n\n3. 基本面好不等于股价涨\n\n他用银行股举例：多年来五六倍市盈率，分红率6%，基本面无可挑剔，但就是很长时间没有大涨。股价最终取决于买卖双方在某个时间节点上的博弈合意，基本面、宏观、政策都只是背景条件，必须通过人的实际交易行为才能起作用。\n\n## 三、市场的本质：博傻游戏，所有人都想把你的钱弄走\n\n1. 任何股票上涨都需要一个基本条件\n\n他说这是很多人不敢直视的事实：任何股票要涨，都需要有人在更高的价格接盘。他把这叫做博傻游戏，每个人都在赌自己不是最后一棒。他说自己的操作习惯是把股票卖给聪明人的前一手，然后这些聪明人再去找接盘的人。\n\n你连这个你都不敢看的话，那你无法在这个市场中生存。市场里面所有的人都想把你的钱弄到他手里头，包括你们之间也是对手盘。\n\n2. 市场先生是个双向精神障碍患者\n\n他引用格雷厄姆的经典比喻：市场先生就是一个狂躁抑郁型精神病——抑郁的时候股市低迷，他希望你把他的东西全买走；狂躁的时候他希望把你的东西以高价全买走。他说这件事他已经看过至少三四次了，下次还会再来。\n\n你要关心的是市场先生的钱包，不是他的情绪。\n\n3. 把每只股票都当成筹码，像攀岩一样不断换支点\n\n他用攀岩做比喻：攀岩时不断寻找新的支点，每换一个支点就爬得更高。买股票也一样，应该在不同的筹码之间不断选择最优的，而不是抱着一只股票死守。\n\n## 四、等待流动性风险：那才是真正的买入机会\n\n1. 白酒不看空，但也没有弹性——在等最后一次挤出机会\n\n有人问白酒，他说现在不看空，原因是跌得已经比较充分，信仰者会去接盘，继续大跌的空间有限。但不看空不等于现在就做多，他认为白酒目前缺乏向上弹性。他在等的是一次流动性风险——所有东西集中下跌的时候，把白酒里最后想卖的人挤出来，那才是切换的时机。\n\n2. 一年抓住一两次机会就够了\n\n他描述了自己的等待策略：6月30号把所有融资清掉，账户调整到融资户备用状态，就是等流动性风险出现。历史上这种机会每年都会有——贸易战、雪球敲入，都是流动性风险。那个时候什么东西都跌，不分好坏，在自己长期关注的、基本面好的东西里搏一把反弹，挣个10%就行了。\n\n你何必搁这折腾来折腾去？一天担惊受怕的，何必呢？一年你抓住一个这样的机会，挣个10%，你就会有超额收益。\n\n3. 所有的风险都是机会\n\n他说2008年的人只要有钱买股票，随便买什么后来都涨了十倍二十倍，跟选股没有任何关系。关键是你得熬到那个时候，你得有钱，你得活着。这才是\"永远不亏损\"作为第一目标的真正意义。\n\n## 五、耐克的故事：预测三到五年是最优区间，预测二十年是算命\n\n1. 耐克从2000年涨到2021年涨了约33倍，然后跌去约80%\n\n他用耐克举例说明预测周期的问题：如果你2000年买入耐克，拿到2021年最高点是约33倍，但如果一直拿到今天，其实只有约6倍。中间那个顶部是不可能精确预测的。这个案例要给大家的启示是：对一家公司的判断，看得越远，错误率越高。\n\n2. 最优预测区间是未来三到五年\n\n他说预测这件事有一个概率最佳的时间段：预测明天，基本无法预测，太随机；预测二十年，等于算命；预测未来三到五年，是正确率最高的区间。\n\n你预测未来三五年你可能是概率最高的。但你说我能预测20年，那你跟算命一样。而预测明天，那就干脆不用预测了，根本预测不了。\n\n3. 任何行业的格局变化都比你想象得快\n\n他从诺基亚、波导、HTC讲到苹果、华为，核心结论是：当年如日中天的公司，没有人能预料到它会那么快没落。苹果既然能替代诺基亚，就没有理由说别人不能替代苹果。对任何公司都应该保持\"必要的怀疑\"。\n\n## 六、关于金融内容监管：管是对的，但难免误伤\n\n1. 当前金融内容管理趋严，个股讨论要谨慎\n\n他在直播中提到，新规出台后金融产品推介被严格管控，很多账号受到影响，他自己也会减少公开直播和雪球发帖的频率。他的判断是：管理本身是对的，因为市场上确实有大量用\"讲市场\"包装起来的诱导行为；但监管边界画宽了，不以荐股为目的的人也可能被误伤，这是任何监管都难以避免的代价。\n\n你在管的过程中，你必须得把那个目标放大一点，你就得把范围画宽一点，那你画宽一点就一定会有原本不是为了推荐金融产品的，但是也会一直被管，这道理很简单。","toc":["一、美国AI基建：和中国当年的\"铁公基\"是一回事","二、三季报怎么看：股东人数比业绩数字更重要","三、市场的本质：博傻游戏，所有人都想把你的钱弄走","四、等待流动性风险：那才是真正的买入机会","五、耐克的故事：预测三到五年是最优区间，预测二十年是算命","六、关于金融内容监管：管是对的，但难免误伤"],"url":"https://xueqiu.com/2573414707/411591514","chars":2783},"topics":["评书闲聊","官媒文章","AI基建","耐克启示","股东人数","教子"]},{"date":"2026-09-29","bili":{"title":"老木匠 2026年9月29日直播文字稿（美债威力、黄金持有成本、离岸人民币、地方财政、红楼梦）","text":"## 一、先说一句：跌的时候别急着研究基本面\n\n前两天科技反弹，有人跑来跟我说科技股又大涨了。先嘱咐一件事：整理我直播文字的朋友互相说一声，别把转成文字的东西发到矿茅的论坛里去，别去挑衅、别替我树敌。\n\n我这马蜂窝已经捅完了，再捅没有意义。矿茅这帮人现在一看见\"老木匠\"三个字就过敏，你非扯这个干啥。\n\n你们整理文字的时候，凡是我涉及矿茅的内容都删掉，不然它会自动插到那个论坛里去。今天一天都在替我树敌，有的话根本不是我说的。\n\n人家股票跌着难受，你还上人家地盘上嘚瑟。大侄儿都从乡长变成三胖子了，就别当头再给一棒子。\n\n人都有恻隐之心，连跌两天谁都不好受，嘴上说\"我不在乎\"那都是扯淡，那是真金白银。一千万跌百分之十，一百万就没了，谁能高兴？\n\n过两天你再看，全是专家。哪个股票一跌，那个领域的专家就如雨后春笋般冒出来，各种基本面给你研究得透透的。越跌，研究基本面的人越多，这是规律。\n\n涨的时候没人研究基本面，都忙着晒收益晒图；一跌全跑来研究基本面，不然就骂大盘不长眼。\n\n当年做酱油的时候，千禾味业开始跌，里面几个大V天天讲酿酱油、零添加、酿造工艺是怎么回事，我心想你们水平都不如一个卖酱油的。\n\n股票一跌就研究基本面给自己壮胆，是最差的投资模式。 有能耐你能挺住，跌的时候就挺着就完了。\n\n研究基本面不是等下跌了才研究，是你买入之前就该研究。跌的时候其实应该高兴——但高兴别告诉别人，偷偷高兴。\n\n我买股票的时候就盼着它跌，跌了我非常高兴，可我从不告诉别人。告诉了别人干啥？我还怕别人把它买走呢。\n\n我难道愿意让大家都跟我一起买，形成竞争性买盘？有便宜的地方，你非要告诉全世界\"这儿有便宜大家都来占\"，你疯了。\n\n## 二、说个正事：十一月份我就停播\n\n三令五申让你们别推会员、别送会员，结果愣是把我这会员干到五百零二个。\n\n我把话说清楚：十一月份我就停播，你们爱咋咋地。现在充的，我能给你播一个月，播完我就不播了，到时候别埋怨我，别说我忽悠你们。\n\n丑话都说在前头，B站那边我也发通知了。你们一阵猛充，我还不好意思不播，那是要把我累死。\n\n## 三、美债收益率的威力，这回看到了吧\n\n说说昨天的市场，美国市场大家都看到了吧。这回看到美债收益率上升的威力了吧？ 没人再说什么\"利空出尽是利好\"了吧，那些人都闭嘴了吧。\n\n我昨天在帖子里就说过：你要是天天听我直播，昨天那行情你还感到恐惧，那我这些都白讲了。这不都是以前预告过的吗，就是正常行情，有啥呀。\n\n还有人给科技股下跌到处找原因——这不是应该跌、不正常跌吗？估值高了自然就下跌。\n\n而且现在都还只是预测，我们这边玩的还是预期。我们这的科技股跟美国的不一样，我们这科技股是炒的，市盈率特别高，所以现在只是估值回撤。\n\n美股那边的科技股是真有业绩的，人家工资也不高，真正反映到业绩变化还需要时间。\n\n所以别急着下场捡，不要轻举妄动，还早，再看一看。干啥事都火急火燎的干什么，你错过这次机会，下次还有机会，着啥急。\n\n一年能挣百分之十已经很不错了，找着机会一把挣百分之十就够。你们老给自己定\"今年翻倍\"的目标，结果每年下来都是亏损。\n\n也别问我仓位减不减，这就过界了。挣多少钱取决于你自己的贪心：你觉得挣这么多就够了，那就挣这么多；你想多挣就多挣，问我干啥。你老问我，完了明天跌下来又埋怨我。\n\n## 四、防风险永远是第一位，盈利是随机现象\n\n股票市场里永远第一位的事是不亏损。 永远记住：防风险、不亏损，这是你永远要记住的事。\n\n做到这一点，你的盈利几乎就是个随机现象。什么叫随机现象？就是你不用努力，等着就行，它随机波动，轮也能轮到你。\n\n只要你活得足够长，好运总能轮到你。等轮到你的时候记住，那不是你的水平，是运气，到时候要记得清仓走人。\n\n你只要挺住。挺到一定时候，遍地是黄金，随便捡。到那时候拿大刀一顿砍，砍谁都死了。\n\n我给你们讲过食腐动物吧，就是\"买股票的老秃鹰\"那个。为什么食腐动物是食物链里最高效的？因为它没有天敌、没有危险，吃东西都得等猎物死透，不死都不行。\n\n狮子看着帅，一个锁喉进去，被斑马踢一腿马上就玩完。食腐动物看着恶心，却是最高效的猎食者。你见谁吃秃鹫？肉不好吃，没人吃它。\n\n当个秃鹫挺好的，你就等着，等他们都死透了再上。现在进去容易受伤。\n\n你看现在论坛里一个个都在立志、都在讲基本面，都说要用工资去补偿，这都不安全。\n\n还有人给你讲未来能卖多少钱、能挖多少东西、光模块进步多少、出口多少——这些东西现在都不能碰。\n\n股市永远是这么一个轮回，现在就有这样的机会，只是你瞧不上。\n\n## 五、有些事我能做你们做不了：别学我做空\n\n有些事我能做，你们做不了，所以别学我。就像昨天那个空单，我特别怕你们去学。\n\n我发完其实非常后悔，但那单昨天已经平了，你们就别再跟了，下次我也不会告诉你们。那东西风险太大，这两天你做不了。\n\n别看人家挣钱你也想赚，那都不是，最好是永远别碰。\n\n但你要是做成熟投资者，不碰期货最终是不可能的。做股票做了十年十五年，你不开股指期货是不可能的。为什么？熊市里你不靠股指期货做空怎么赚钱？\n\n我们的资本市场是单边的，牛市里做多才能赚钱，熊市里都在跌，你怎么赚钱？但那需要很多年经验，千万别轻易尝试。\n\n你们能把多头市场做明白就不错了，空头市场不是那么轻易能做的。\n\n## 六、美债收益率创新高，本质是实际利率在涨\n\n现在美债收益率不断增高，威力就显示出来了。昨晚美债收益率又创了新高。收益率创新高，代表的其实是实际利率——即便美联储现在不加息都不行了，实际利率就这么高。\n\n美联储去加息，不过就是承认现在实际利率高而已。\n\n利率是什么？巴菲特说，利率相当于重力。高利率相当于高重力，对所有东西都有向下的牵引作用，只不过不是立竿见影，慢慢都会显示出来。\n\n包括现在这些囤黄金的个人投资者：利率不断升高，你囤黄金就不合算了。黄金没有孳息，你存着也没钱给你。\n\n那你为什么不把黄金卖了、把钱买成美债？美债收益率现在多高，对美国国内投资者来说还没有任何风险，因为他的本位币就是美元。\n\n所以要注意，买美债这件事，外国投资者和美国国内投资者考虑的问题完全不一样，因为涉及记账本位币。\n\n外国投资者会考虑美国的通胀问题；美国投资者用什么都有通胀、根本不用考虑太多，那就是个权衡问题。\n\n一旦大家都认为买美债这种无风险利率更合算，黄金价格自然就不涨了——持有成本太高，甚至不上涨就会下跌。\n\n跟房子一个道理。二一年之前房子不好买，要排队，因为房子在涨价、没人卖。等房子不涨了，持有成本就显示出来了：钱死在房子里，原本是可以生息的。\n\n中国房子租售比那么低，那点租金根本抵不过财务成本，持有房产本身就是亏损的事，价格维持不住，很快会下跌，到夏天你发现到处都是房子、根本卖不出去。\n\n黄金也一样，涨的时候大家都抢，等它开始跌，你卖都卖不出去。\n\n## 七、没有任何一个国家会无缘无故把黄金拉到高位\n\n别动不动就说外国央行在买黄金。我给你们一个结论：没有任何一个国家，在没有政治谋求的情况下，会试图把黄金拉到高位——除非他有其他目的。\n\n比如我们和美国打贸易战的时候，就倾向于把黄金拉高，因为拉高会加剧美国通胀，对他是个压力。\n\n否则我们没有任何必要把黄金拉高，为什么？因为黄金价格高，意味着人民币对黄金也贬值了。\n\n德银说铜要涨百分之五十，有可能，这东西说涨百分之百也不是没可能。\n\n但现在每个国家都是纸币制度，没有一个国家实行金本位，都不能容忍黄金价格过高，因为过高的价格意味着纸币信用出问题。\n\n如果黄金过高、老百姓都去持有黄金而不持有本位币，你怎么办？\n\n## 八、所有判断都有时间限制\n\n有人说，你得给出时间，不然等于没说。我告诉你，这么说的人大体都认为\"现在跌不要紧\"。所有东西都是在一定时间内的判断。\n\n你越是强调时间，反倒认为自己是没有时间限制的。我说的东西都有时间限制，可总有人非要我说出时间来——所有非要我说出时间的人，自己才是最不倾向于承认时间问题的。\n\n老粉丝我都告诉过八百次了：沃什救不了美国，最终货币一定得宽松。 但你拿着这些东西，现在能不能挺到黎明？\n\n你问我时间，说明你认为自己能挺过这次危机。你自己想一想，你能挺过去吗？现在这些人都信誓旦旦，不过是给自己打气。\n\n危机没有真来，真来的时候你看有几个人能挺过去。这么多人天天问我\"到底上没上热菜\"，我告诉你没有，现在还没有。弄得跟真事似的，好像自己能挺过危机似的。\n\n## 九、美债还在跌，A股避险要买核心资产\n\n我的习惯是不看美债收益率，我看五年、十年、三十年期的美国国债期货。现在三十年美债期货主力已经到了103，一直在跌。它再跌，就意味着收益率在涨。所以你以为这事很快就结束了，那是你小瞧它了。\n\n大家常说\"那是美国的事，A股不受影响\"。全世界经济是一体的，我认为A股最终不受影响，这点想法跟我一样，但总有人忽略时间问题。\n\n其实现在A股已经显示出某种避险功能了，只是避险的标的不再是你原来看好那些——你要买核心资产，我讲多少遍了。\n\n外资真到A股避险，他们会买科技股吗？不一定都是\"亲儿子\"，很多核心资产在港股也有。我不给具体标的，你们自己去找，大方向就是这样。\n\n其实恒生指数已经非常抗跌了，昨天恒生还上涨，以前美股一跌恒生首当其冲。\n\n顺带说个插曲：那天公开直播为什么没有回放？因为有违规，被抬走了以后就没有回放。你只要这次直播里有一次违规，这次回放就没了。\n\n那天其实只抬了六十秒，六十秒也不行，回放照样取消。我也不知道讲了啥被抬走，人家也没告诉我是为啥。\n\n那就加点小心吧，没别的办法，这是头一次违规。会员直播平台不提供回放。\n\n## 十、美元指数涨、人民币还在升值：结汇与离岸人民币\n\n这两天还有件事值得关注：美元指数这么涨，已经到101.22了。 美元指数这么涨，美元兑人民币实际上还是升值的；虽然我们中间价调贬了不少，但你看离岸。\n\n先把概念讲清楚。中国实行强制结汇制度：你进入中国的美元，无论是贸易顺差来的还是投资净流入，都要把美元卖给中国人民银行，这个过程叫结汇。\n\n央行买入外汇，就要印发相应的人民币，相当于发行人民币。所以我们过去很多年，央行结汇实际上是基础货币发行的主要渠道，这就叫外汇占款。\n\n反过来，你正常结汇出国、进口要花外汇、对外投资申请了额度，就可以把外汇汇出去，这就需要央行把美元卖给你。要知道买入价和卖出价不一样。\n\n央行每天公布三个牌价：买入价、卖出价、中间价。中间价就是国内外汇的一个\"锚\"，大家按它大概算今天人民币兑美元是什么换算关系。\n\n那离岸人民币是怎么来的？就是海外存在的人民币，它有一个和美元自由交换的市场。现在离岸人民币市场好像伦敦一个、香港一个，新加坡有没有我记不清了。\n\n离岸人民币就是外国人手里的人民币，不在我们国内，对外国人来说这些人民币就相当于外汇。\n\n反过来跟我们在国内买卖美元一个道理——人家要进口中国商品、用人民币结算，就去买人民币，这就形成一个自由交换的市场。所以离岸人民币是市场形成的，不受我们限制。\n\n有人问能管吗？能管。怎么干预离岸市场？不能用行政方式，因为它是市场化的。 最直接的是海外央企、国有银行下场干预，海外银行分行也参加外汇市场。\n\n比如人民币升值、我想让它贬一点，就去买入美元，等于抛售人民币。还有很多办法，比如让外资银行扩大对海外的人民币贷款。\n\n人民币升值的原因是人民币稀缺、海外人民币少，那我就让需要人民币的人低息贷款，我借钱便宜，你就不用拿美元买了。本质就是干预供需，跟普通商品一样，卖是一个办法，提供也是一个办法。\n\n企业信誉好、需要进口人民币，我就直接提供、借给你不就完了。贬值的时候反向操作。中国的好处是有很多国企，可以通过非国家的方式解决这些问题。\n\n我说的也不一定对，你们回去自己再看看教材，我也没备课，这里头弯弯绕还多着呢。\n\n还包括发人民币债券。发债还债，对海外人民币存量都有调节。我们为什么要到海外去发人民币债券？就是为了调节海外人民币的数量：贬值太厉害就回收一点，升值太厉害就多放一点，来回调节，跟央行的公开市场操作差不多。\n\n就像隔夜逆回购控制流通中的货币——央行投放货币有两种方式，一种是直接买入国债（货币出去、资产买进来），一种是借给你（啥也不买、过两天还）。\n\n刚学金融的人总拗不过来\"借了不还得还吗\"，其实还了可以再借。借和给本质没有区别：你可以把借理解为没有偿还期限的给，把给理解为没有偿还期限的借。没有偿还期限的借，其实就是给。\n\n所以有个有意思的现象：美元指数在涨，但人民币还在升值。 美元指数是对六种货币的一揽子加权（日元、挪威克朗、瑞典克朗、欧元等），美元指数上涨一般意味着美元对一揽子货币升值。\n\n现在人民币兑美元还在升值，那人民币对其他货币升值就更快了，这是累加关系。\n\n你会发现人民币对日元这些年升值非常快，比对美元还快，因为日元对美元在贬值。\n\n为什么很多人愿意去日本旅游？就因为它便宜，人民币对日元升值太多，日本很多东西都便宜了，以前去不起现在去得起了。\n\n## 十一、盘面上是有序撤退，盯着融资盘\n\n看一眼盘面：科技今天开得还可以，有色不太好，白马也还可以。现在还不能着急，还没到一塌糊涂的时候，现在还是有序撤退。\n\n起码我还没看到融资盘被动卖出的迹象。我准备好了：一旦融资盘慌不择路，我就进去搏一把反弹。但现在还没看到。\n\n而且这只能搏反弹，不能进去拿住又开始玩那套，挣个百分之五到十基本就可以了。\n\n长远的东西现在太不好判断，因为国际金融、政治经济形势变化太快。比如十一月美国中期选举，选完之后共和党还能不能赢？\n\n如果共和党在中期选举里失去决定权，接下来美国的大戏可能是弹劾总统，那问题更没法控制。\n\n融资盘现在没有明显下降，所以还是个危险。随着下跌跌到一定程度、融资盘开始爆仓，那时候你非常容易看出来，回顾以前雪球那种跳空你都能看出来。\n\n慌不择路在盘面上能感受到——人慌慌张张往外跑是什么样，到时候交易就是那样，不分什么标的、什么基本面，没人看。\n\n我没法给你形容，跟搞对象差不多：你到那年龄自己就知道了，没到年龄怎么讲也不明白。到时候买哪个板块，那是你自己选的，我给你说错了你埋怨我。\n\n虽然这样，我依然不建议现在空仓，我个人从来都是满仓，坚决不空仓。 那我怎么抄底搏反弹？我有我的办法，你就管不着了。\n\n你们那点套话小技巧没用——我这一辈子净凭说话生存了，激将法、夸我、骂我，对我来说都屁用没有。我想告诉你的自然会告诉你。\n\n我现在基本不做什么交易，也不怎么看盘，所以我直播才这么闲，天天和大盘双向奔赴：它往下走，我往上走。\n\n有些知识你在别的地方学不着，但我也怕你们跟我学坏了。啥知识都有用，书到用时方恨少——你跟人喝酒吹牛的时候，这些东西就都有用，你就能成为聊天的中心。\n\n## 十二、从《红楼梦》看市场：位置越高越看大方向\n\n我最喜欢《红楼梦》里哪个女角色？我喜欢贾母。 红楼你要多看几遍，对世间百态会了解得多一些。\n\n大观园里不同的人考虑的问题完全不同，这可以直接用在股票市场上。\n\n贾母考虑的是把贾府传承下去，别的根本不管，天天想着怎么给孩子婚配、把家族传下去。王熙凤考虑的是秩序，把这些人管好，让每个人按自己的角色去演。\n\n下面的丫鬟都在想怎么弄点钱，婆子想的是下班赶紧偷点懒、上厨房偷点饭喝点酒。\n\n有人问晴雯和袭人：晴雯是贾母指给宝玉的姨娘，不是袭人，所以晴雯不着急，袭人才先下手。\n\n晴雯和林黛玉其实是一个人，袭人和薛宝钗是一个人，这东西你看过几遍红楼自己就能悟出来，不用听别人讲。\n\n股票市场也一样：位置越高的人越看大方向，越到下面的人越争一时一地。 你慢慢就懂我为什么给你们讲\"五年规划\"了。\n\n大方向看不准，天天研究那些细节根本没有意义；必须先把大方向看准，研究细节才有意义。\n\n这些年研究白酒的人，付出的努力绝对不比研究有色金属的人少，恨不得天天守在茅台酒厂数瓶子。\n\n但大势来的时候，什么王石、皮带哥都一样，无法力挽狂澜，该进去也得进去。这就是大势，你不能拗着大势。\n\n所以美国投资领域有句话叫\"不要做美联储的对手盘\"。\n\n## 十三、不要做美联储的对手盘，要对自己诚实\n\n美国股票市场从来都有个说法：不要做美联储的对手盘。 美联储要干的事，你不要站在他对立面——他准备加息，你就不能赌\"你不敢加息\"、去买降息受益的。\n\n但到了我们A股，现在所有人都认为美联储那东西没用、跟我们没关系。什么叫没关系，最终都会有关系。\n\n网上还流传一句更有意思的话：你这些都是\"贵族骨头软了\"。为啥这么说？因为他只能理解最简单的。中国央行都不敢说\"美联储加息对我们没有任何影响\"，你敢说？\n\n我前两天说两句提醒风险的话，被一顿骂。结果这两天跌下来，有人想起来我提示过风险吧？不会的，他们现在依然在骂我，认为你就算说对了那也不对。\n\n我提醒他们的时候，如果起码卖出一部分就会少损失一部分，结果都在骂我。现在自己承担损失了，又天天打气，论坛里全是打气的。\n\n你明明看错了、明明用最恶毒的话把我骂完了，发现自己错了怎么办？起码把帖子删了吧？不会的，他们依然留着。\n\n这就是人性，道理并不复杂：让一个人承认自己错，是非常非常难的。\n\n这就是我反复讲的：你在股市上想生存，第一件事就是对自己诚实。 这些人能对自己诚实吗？错了就编另外一个理由，继续维持\"我是对的\"。\n\n最初说\"美联储不敢加息\"，这理由没实现就说\"加息不能持续\"，十月份加息概率上来了又说\"加息对什么也没影响\"，现在加息明显有影响了，又说\"不可能持续、持续下去就黄了\"。\n\n反正总有理由，你每一次都错了。你都输过多少回了？一月份输过一回，六月份又输过一回，你还信心满满跟我这掰扯。\n\n我现在都没有看空这些东西，我只说这些东西对价格有影响。他们不理解：为什么我不看空有色的股票，却做空铜期货——这事讲起来更复杂。\n\n你就是对自己不诚实，还互相打气。我看你打气能打到哪去，会不会因为你们打气就有人来救你们。\n\n顺便说个数：回撤百分之三十，要涨百分之五十才能回到高点；损失百分之五十，要翻倍才能回到高点。一定要注意，这两者是不对称的。\n\n## 十四、为什么你们眼里只有金和铜\n\n铜的\"热菜\"大概啥时候上？我现在不做期货，那天就是跟人打赌做了个。我现在有的是机会做多头市场，为什么要做期货？\n\n我做期货是在多头市场没机会的情况下，而且我的期货只做空不做多。之所以开期货，是因为期货能双向交易，能在没有多头可做的时候继续交易。\n\n期货做空比做多容易吗？都一样。交易方向和难易程度一模一样，啥时候都有人做多、有人做空。\n\n金、铜啥时候能减？我不告诉你，我没考虑过这件事，我不知道。我就百思不得其解：好像市场上只有金和铜能投资似的，别的都不能投吗？\n\n有的人投资就\"可一只投\"，后宫佳丽三千人，你为啥非要可一个人宠？这本身就是不对的。想套我话，套不了。\n\n我有一只股票昨天涨停、今天又涨了不少，我到现在都不知道因为啥。今天还是浮盈，我所有的股票都是红的。\n\n咱不能提个股，在我直播间里不能提个股，再提我就把你禁言踢出去。\n\n## 十五、\"六张网\"就是基建换个说法，本质是以工代赈\n\n有人问\"六张网\"，那不就是基建吗？就是基建换个说法，跟\"铁公基\"有啥区别，一回事。\n\n所谓六张网，就是人为制造需求，跟以前的基建一样。以前建的是铁公基——铁路、公路、基础设施；现在叫六张网，是因为铁公基实在建不下了、没有缺路的地方了，就整通讯网、物流网这些，本质一回事。\n\n总的来说就是发债建设，过程中需要买原材料、刺激原材料需求，需要雇人，相当于以工代赈，要不然就直接给你发钱，还能见见地下管网、提高城市品质。\n\n其实什么都不建也无所谓；找个空地挖沟再填上、再挖沟再填上，道理一样，就是为了刺激生产。这不就是凯恩斯主义吗。\n\n你看那些地下管网，修啊建啊，修整完了可能更不好：下一步你能想见的就是交通又不便利了、到处堵路，马路又变成拉链了。\n\n今天豁开弄个管子下去，明天刚填上马路整完了，明天又拉开整个什么网下去。我家小区门口天天换路边石、铺马路，铺完过两天那个光纤没下去再豁开，过两天又想起水管没下去再豁开再下。刺激生产嘛，就是这样，很正常。\n\n这么折腾来折腾去，效率虽低，还是剩下一部分财富；换成老美，直接发钱，发钱啥也没有。\n\n最终受益的就是工程机械、钢铁水泥、各种原材料、光纤电缆。但实际上它没有基础建设用得多，因为这东西毕竟不是无中生有。\n\n## 十六、地方财政的困局：没有配套资金，地方国企要当心\n\n六张网这种东西喊了这么半天为什么没效果？因为现在地方没有配套资金。\n\n以前做铁公基做得好，是因为以前有房地产、地方财政很有钱。现在地方财政没钱了，中央那点钱挪到地方也不够——地方财政收入没有可腾挪的，教师工资都快发不出来了，得先把钱发给公务员。\n\n所以配套资金不够，谁都没有办法，没有钱你有什么办法？那就进一步发债呗，没有别的办法，就是转移支付，中央多给钱呗，现在大家玩的不都是这一个吗。\n\n这个过程你就得经历，没有别的办法。未来只有一个办法：地方公务员系列要裁员。 因为现在地方财政供养人口太多，养活不起。\n\n原来是有房地产、有非税收入，现在非税收入这块没有了，地方财政难以为继。中央财政很有钱，地方财政非常难以为继。\n\n所以以前我就讲过——这话得两年前说的了——从现在开始你们买股票要非常注意地方国企。\n\n地方国企有一个特有风险：地方政府都那么困难了，地方国企的钱也是地方政府在控制的。\n\n有人说卖股权？那能随便卖吗，得经过批准，属于国有资产处置，还得招标，账上的钱先花着呗。\n\n有的人看地方国企账上钱那么多、怎么不分红——分啥红啊，你想啥呢，啥也不懂，就搁那瞎想。\n\n你想想：为什么很多地方国企账上钱那么多、既不分红，最要命的还有更多贷款？为啥？这个我不能明说，你们自己想。\n\n我只能告诉你们：别听那些大V的，那些大V都没参加过社会活动，就是念了几天大学，脑子想破头想这些事，根本没参与过，不知道这个社会实际是怎么运转的。\n\n所谓国企，都叫地方国企，除非是央企。现在哪个地方财政都不富裕，连深圳这种税收收入这么高的地方也一样不富裕。房地产这块非税收入减少造成的财政窟窿，很多年调整不过来。\n\n原来是按\"桌子上准备的菜\"来配人的——地产厉害、卖地收入很高，每年都有这个收入，就按这么高的收入配置人员。\n\n比如一年二百万配置的人马，现在突然只剩五十万，你让谁下桌？公共财政有个特点就是永远扩张，不可能有哪个领导说\"以后地产有一天不行了，咱们把现在卖地的钱存一部分\"，没有哪个财政这么干。挣一百万就按一百万配人，现在只剩五十万，不够怎么办？\n\n## 十七、地方财政怎么开源节流：四缓则圆，别当代价\n\n不够有两个办法。以前我就告诉过你们：从现在开始开车得注意点——这次你明白为啥让你们注意了吧，开车停车都得注意，这种罚款会更严，这就是开源。\n\n另一个办法是节流：不能招新人了，得等着退休，你让谁回家？这需要时间。比如经过十年，公务员队伍逐渐缩减、财政供养人口减少，慢慢实现财政平衡。现在财政普遍不平衡。\n\n有些东西缩减不了，中小学教师能缩减吗？你得等这些人退休回家、不再新招。但你现在还涉及安排就业，不新招都做不到，还得扩招呢。\n\n教师也一样，学生数量越来越少，自然减员，支出也会减少，但都得等，不是马上能解决的。\n\n原来还有地方隐性债务，靠城投平台贷款；现在这块被堵死了，中央三令五申不让增加地方隐性债务，谁敢增加就违纪、要问责。\n\n那地方财政这么困难，它下面的企业账上有的是钱，借点行不行？你觉得不分红、分了好，可你都分了还上哪儿借钱去？没有归还期限的借钱就是给钱，啥时候还啥时候再说呗。\n\n需要时间，啥东西都需要时间。\"四缓则圆\"，中国古代文化最有道理，什么东西都别着急，缓就有办法。只要一缓就有办法，最终都能解决。\n\n但关键问题不在这儿：看清这些问题，不在于你去解决——你也解决不了，这事不归你管。关键是你自己别老当那个\"代价\"。","toc":["一、先说一句：跌的时候别急着研究基本面","二、说个正事：十一月份我就停播","三、美债收益率的威力，这回看到了吧","四、防风险永远是第一位，盈利是随机现象","五、有些事我能做你们做不了：别学我做空","六、美债收益率创新高，本质是实际利率在涨","七、没有任何一个国家会无缘无故把黄金拉到高位","八、所有判断都有时间限制","九、美债还在跌，A股避险要买核心资产","十、美元指数涨、人民币还在升值：结汇与离岸人民币","十一、盘面上是有序撤退，盯着融资盘","十二、从《红楼梦》看市场：位置越高越看大方向","十三、不要做美联储的对手盘，要对自己诚实","十四、为什么你们眼里只有金和铜","十五、\"六张网\"就是基建换个说法，本质是以工代赈","十六、地方财政的困局：没有配套资金，地方国企要当心","十七、地方财政怎么开源节流：四缓则圆，别当代价"],"url":"https://www.bilibili.com/opus/1253341275981086721","bv":"","minutes":0,"chars":9811},"ai":{"title":"老木匠·2026年9月29日：美债利率、黄金持有成本与股市生存法则","text":"## 一、美债收益率：这才是真实的市场利率，威力正在显现\n\n1. 利率是重力，高利率对所有资产都有向下牵引\n\n他引用巴菲特的比喻：利率就相当于重力，高利率就是高重力，对所有资产都有向下牵引的作用，只不过不是立竿见影的，是慢慢显示出来的。他说之前一直在预警这件事，昨天美债收益率再创新高，威力终于让所有人都看到了——\n\n这不都是以前都已经预计过的吗？这不就是正常的行情吗？这有啥？你天天听我直播，如果昨天那个行情你还感觉到恐惧的话，那我这都是白讲。\n\n2. 美联储降息和市场真实利率是两回事\n\n他强调一个很多人混淆的概念：美联储降的是隔夜拆借利率，美国十年期国债收益率才是真实的市场融资成本。即便美联储不加息，实际利率已经这么高了，效果是一样的——你现在美联储去加息，不过就是承认现在实际利率高而已。30年期美债期货已经跌到103，还在持续下行，这个事情不会那么快结束。\n\n3. 美联储的话不能不当回事\n\n他批评了市场上流行的一种论调——认为美联储加息对A股没影响。他的反驳很直接：\n\n中国央行都不敢说美联储加息没用，你敢说？潘功胜都不敢说美联储加息对我们没有任何影响，他都不敢说这话，你敢说？\n\nA股最终不受影响，他认为这个方向是对的，但时间问题被很多人选择性忽视了。\n\n## 二、黄金：持有成本上升，上涨动力越来越弱\n\n1. 高利率让持有黄金变得不合算\n\n他用房子做类比帮助理解：21年之前房子涨价，大家去排队买，没人卖；等房子不涨了，持有成本就显现出来了——财务成本、机会成本都在，但房子不产生孳息，撑不住就只能卖。黄金现在面临同样的逻辑：美债无风险收益率接近5.5%，持有黄金这种没有孳息的资产，机会成本越来越高。\n\n你现在为啥不把这个黄金卖了，然后把钱买成美债？你美债现在收益率都多高了，而且没有任何风险。\n\n2. 央行买黄金不是为了拉高价格\n\n他给出一个结论性判断：没有任何一个国家在没有政治谋求的情况下，会试图把黄金拉上高位。央行购金是政治考量，不是看多，更不会主动去拉高。而且各国央行买的黄金进了库，不再流通，理论上会减少市场供给，有推高价格的可能——但在全球加息背景下，持有成本太高，这个逻辑很难驱动价格。\n\n3. 历史先例：黄金曾用30年才回到前高\n\n他提到一个历史数据提醒大家不要对黄金过于乐观：1980年前后黄金涨到800美元每盎司，之后经历了漫长的低迷，一直到2010年才重新回到那个价位，整整30年。\n\n## 三、A股当前形势：还没上热菜，不要轻举妄动\n\n1. 现在还是估值回撤阶段，不是危机\n\n他对当前A股的判断是：科技股的下跌是估值太高之后的正常回撤，不是业绩驱动的杀跌。美股科技股业绩真实，估值并不高；A股科技股是靠预期炒起来的市盈率，所以现在只是估值在回归，还没有真正的危机。\n\n2. 融资盘还没有出现慌不择路的迹象\n\n他一直在等的信号是融资盘被动卖出——那才是真正的\"热菜\"。他说现在融资盘没有明显下降，还没有看到那种慌不择路的迹象。等到真正出现大幅放量、不分标的乱卖的情况，那才是进场的时机。他的策略是：\n\n一旦有融资盘慌不择路的迹象，我就会准备好进去。那个时候也只是博一把反弹，挣个5%到10%基本上就可以了。\n\n3. 节假日三天的盘没有参考意义\n\n他提醒大家：这三天机构交易员很多都已经放假回家，市场成交清淡，不用太当回事，节后才是真正的信号。\n\n## 四、对自己诚实：这是在市场上生存的第一条件\n\n1. 错了就是错了，不要一直换理由\n\n他观察到一个现象：最开始说\"美联储不敢加息\"，这个理由没实现，就换成\"加息不可能持续\"；持续了又说\"加息对我们没影响\"；有影响了又说\"不可能一直这样\"。每次都错，每次都有新理由。他说：\n\n对自己要诚实，一定对自己诚实。这个事儿是个大事儿，是个非常大的事。你这一关要不过，你永远在市场上都没戏。\n\n2. 跌了研究基本面，是最差的投资模式\n\n他注意到一个规律：股票涨的时候大家都晒收益，跌了以后突然冒出一堆基本面专家，各种研究、各种壮胆。他说研究基本面应该是在买入之前，不是跌了之后给自己打气。股票下跌的时候你应该高兴——买入的东西更便宜了，但你高兴要偷偷高兴，不要到处嚷嚷。\n\n3. 损失的不对称性\n\n他提醒了一个数学上的重要不对称：亏损30%需要涨50%才能回到原点，亏损50%需要翻倍才能回到原点。这就是为什么\"永远不亏损\"是第一目标，而不是\"争取挣多少\"。\n\n## 五、地方财政与地方国企：一个被低估的风险\n\n1. 地方财政窟窿是系统性问题，不是短期问题\n\n他解释了地方财政困难的根源：过去地方政府按照卖地高收入配置了大量人员，现在房地产非税收入急剧下降，人员却是刚性的，精简不了。开源（罚款更严）和节流（等退休自然减员）都需要时间，这个调整周期是以十年计的，不是短期能解决的。\n\n2. 地方国企账上有钱不等于可以分红\n\n他提示了一个很多散户没意识到的风险：地方财政困难，地方国企账上的钱实际上在地方政府的管控之下。账面现金多、却既不分红还有大量贷款，这背后有它特定的逻辑。他没有把话说透，但意思很明确——买地方国企要额外小心这个风险，这个提示他说早在两年前就给大家讲过了。\n\n3. \"六张网\"本质就是换了个名字的基建\n\n有人问六张网的投资机会，他直接点穿：六张网不过是以前铁公路基建换了个说法，因为铁路公路已经建得差不多了，于是改成通讯网、物流网、地下管网。逻辑和以前完全一样——国家发债制造需求，受益的是工程机械、钢铁、水泥、光纤电缆等原材料。但他认为效果有限，因为地方财政拿不出配套资金，中央那点钱根本不够用。\n\n## 六、投资的最终逻辑：你不认真对待投资，投资就不认真对待你\n\n1. 第一目标永远是不亏损\n\n这场直播他反复说的核心是：股票市场里面永远永远的第一是不亏损，防风险不亏损，这是你永远要记住的事。只要能做到这一点，盈利就接近于一个随机现象——你挺得够长，轮也能轮到你。但那个时候你要记得，不是因为你的水平，是因为你的运气，所以记得要清仓走人。\n\n2. 等待是一种能力，现在不是出手的时候\n\n他用\"食腐动物\"的比喻解释等待的价值：秃鹫没有天敌、没有危险，因为它只等猎物死透了才动手。狮子看起来勇猛，但被猎物踢一脚就完了。现在论坛里全是研究基本面的、给自己打气的，那就说明\"肉还没死透\"，这时候进去是最危险的。\n\n你只要活得足够长的时间，轮也能好运轮到你。然后等轮到你的时候，你记着那不是因为你的水平，是因为你的运气，到时候你得记得清仓走人。\n\n3. 大方向比细节重要一百倍\n\n他用大观园里各色人物的比喻收尾：贾母想的是家族传承，王熙凤想的是秩序，丫鬟婆子想的是怎么偷懒占便宜。股票市场一样，越在上层的人看大方向，越在下边的人争一时一地。你把大方向看准，研究细节才有意义；大方向没看准，天天研究基本面也没有用——这些年研究白酒的人付出的努力不比研究有色金属的少，结果呢？","toc":["一、美债收益率：这才是真实的市场利率，威力正在显现","二、黄金：持有成本上升，上涨动力越来越弱","三、A股当前形势：还没上热菜，不要轻举妄动","四、对自己诚实：这是在市场上生存的第一条件","五、地方财政与地方国企：一个被低估的风险","六、投资的最终逻辑：你不认真对待投资，投资就不认真对待你"],"url":"https://xueqiu.com/2573414707/411383502","chars":2834},"topics":["美债威力","黄金持有成本","离岸人民币","地方财政","红楼梦"]},{"date":"2026-09-26","bili":{"title":"老木匠 2026年9月26日直播文字稿（会员直播停播、规则只约束守法者、科技股不可测、美债抽水、管制","text":"## 一、开场：会员专属直播，十一月份停播\n\n先说个事儿：大家以后不要再充舰长了，已经充的也别再续费了——我的舰长专属直播到十一月份就停播。\n\n因为大家充的是一个月的费用，所以我从现在起再播一个月，到十一月份就停。我再把这话说到头上了：以后你们再充，就跟我没关系了，我也不会再搞会员直播了。\n\n有人质疑我是靠这个赚钱的。本来我玩这个就是想玩，结果因为有人充大航海，我觉得既然大家充了，那我就做个专属直播回馈一下——没想到做起来人越来越多，现在都快到五百个舰长了。 这对我来说压力就比较大：大家充了钱，我就得给大家备课、准备，而这恰恰是我不喜欢做的事。 所以以后就还恢复这种聊天模式。\n\n还有一个原因：做股票这东西并不\"博大精深\"，就那几招，你学会了就完事了，再讲就是重复。关键问题在于你自己练习。 我讲这点经验，讲完就差不多了——你要是我的老粉丝，我讲这些你都听完了。剩下的就是听我唠唠嗑，唠嗑里穿插一些知识。\n\n最主要的，我也不差这点钱。 五百个舰长对别人来说是不少钱，对我来说无所谓，我不想让人整得好像我为了这点小钱似的。你们充钱是心意，那我不管了，反正我这话说到头上了。\n\n还有就是，现在五百个舰长，如果我一直加下去，充的人会更多，我的压力会更大。 倒也不是谁绑架我，所有充舰长的会员也都跟我说\"叔你愿意讲点啥就讲点啥\"——但我自己这一关过不去。\n\n## 二、真正的原因：有人在咸鱼上卖我的会员直播录音\n\n刚才说的那些还不是主要原因。最主要的原因是：昨天有人告诉我，有人在咸鱼上卖我的会员直播录音。\n\n这件事让我非常非常恶心。\n\n我解释一下：会员直播 B 站是不给留回放的——因为会员直播本身就是为保护会员，平台不给留回放，所以我自己也回放不了。我要能回放，我早就给大家公开了。 所以有人以为\"我不给回放是为了让大家充会员\"，不是的，是平台根本不让留。\n\n但是有的人在听的过程中，用外挂程序或者外加设备自己录音，录完又挂到闲鱼上去卖——这就让我做这件事失去了意义。\n\n那与其这样，我不如全都公开直播，断了他们这条念想。\n\n## 三、规则都是给守法者定的\n\n这世界就是这样的：很多规则都是给守法者定的，而且从执法角度来说，执法者更容易执法那个成本低的。\n\n你们别觉得\"越有名的东西越容易出问题\"就说明它偷工减料、造假——不是的，是因为这些东西执法成本最低。\n\n越有名的食品，越容易出食品事故；越有名的酒店，越容易爆出卫生问题。 为什么？因为你家门口那个小吃部出了卫生事故也没人管，谁去执法？——出名的，执法最容易。\n\n明星肖像权。 大品牌用了明星肖像，人家马上就起诉你；可地摊上卖的袜子、小吃部的招牌上挂明星画像的多的是，你挨个起诉吧——人家巴不得你起诉他，起诉他还能给他带来客流。\n\n家用电器。 越出名的越有质量问题的新闻，不是它们都偷工减料，是它们执法最容易。\n\n你要是不学法律、没在这个职业里做过，你就不知道这里头多少弯弯绕。经济也是一样的。\n\n为什么企业做大了就难？因为企业做大了，所面临的成本和小企业面临的成本是不一样的。\n\n劳动法的成本：小店雇个打扫卫生的老太太，交什么五险一金？但你看看麦当劳找个打扫卫生的老太太，你不交，劳动监察部门就来找你。\n\n环保和垃圾处理：大饭店排油烟、厨余垃圾都有规定，都要付成本；那小店管你那事儿？随便往下一倒能咋的？\n\n不同的规模，承受的成本就是不一样的。对人来说也是这样——你越是讲究的人、越是道德高尚的人，法律都是给你定的。\n\n## 四、不讲个股：我怕的不是你埋怨我，是我自己过不去\n\n有人问为什么我不讲个股。这辈子最难过的就是自己这一关。\n\n不是我不敢讲，是我不能讲。\n\n如果我给你们讲了，以你们现在对我的信任，肯定就有人会去买；买完一旦出现抖动、你承受不了这种损失的时候——我怕的不是你埋怨我，你埋怨我就给你拉黑。\n\n关键是我受不了自己内心的内疚。 所以我现在不说个股。这是天生的，道德洁癖是天生的，跟我受教育的环境有关，跟我天生的性格也有关。\n\n我也想跟别人那样瞎忽悠呗，把钱先赚了——我看有的主播那说的驴唇不对马嘴，还搁那卖课，也不少赚钱。 我有时候想，这都什么人听这些呀。\n\n这不是谦虚，是真的看不懂。 虽然我也是理工科出身，但毕竟这么多年不干这个了。\n\n我要能讲个股，我这粉丝很快就超过两千人了——但我讲完我就成什么了？我就成\"税收来源\"了。\n\n那为什么我可以讲板块？ 因为我讲板块的时候，不会把它作为一个推荐直接给你。而且那种处在低位、非常安全的、只输时间不输钱的标的，我还可以说一说。有些标的炒得高高在上、获利盘都已经出局了、就剩下这些散户在里头互相岔和、你给我打气我给你打气——那种东西我听着后背发凉、双脚发麻、直冒冷汗。\n\n## 五、\"互相唱歌互相打气\"：雪球上的定海神针\n\n前几天雪球上，有位大 V 和粉丝之间就在\"唱歌\"：\n\n粉丝问：叔，现在这个股票行不行、买安全不安全、有没有价值？ 大 V 非常斩钉截铁地说：有，肯定有价值。 底下粉丝就说：你真是我们的定海神针呐。\n\n我一听，我后背发凉。 人家没害怕，我他妈自己害怕了。\n\n诸位，这就是真叫\"无知者无畏\"——你真不知道这市场的风险。\n\n我现在越来越不敢对复杂问题发表看法了。 就说美联储加息这件事：现在任什么人都能对美联储加不加息、加息有什么影响发表自己的看法。\n\n你连货币、连利率传导机制都没搞明白，就在那儿哇啦哇啦互相讲——而且最主要的是互相唱歌、互相打气：\"我看美联储不敢加息，他肯定不敢加。\"\"对，我也认为不敢加。\"\"所以你看，大家都认为他不敢加，肯定不敢加，他不可能加，加完美国不就黄了吗？\"\n\n——加完美国黄了吗？\n\n## 六、科技股不可预测：十年前没人知道会有大模型\n\n投资科技股，你都是按照今天的模式在想象未来。\n\n我给你们举例子：十年前投资科技股的人——2016 年的时候，所谓的科技股还是腾讯、阿里、恒生科技、海康威视这些。 那时候没有任何一个人知道未来会有人工智能、会有大模型这件事。\n\n才过了十年，你今天投的都是啥？大模型、AI、人工智能、芯片、光模块。\n\n那我问你：十年之后，这些东西还在不在？\n\n今天投这些东西的人都认为十年之后它们还在——可十年前投腾讯的人，预料到今天这种情况了吗？\n\n所以这不是\"AI 不能发展\"，是科技的发展方向谁也说不清。 如果投科技股的人永远能把握未来的科技方向，那就不该有新的科技公司诞生了——谷歌在科技领域都占了那么大的先机，怎么最后还冒出了 OpenAI？腾讯在自媒体里都那么牛了，怎么最后还冒出了字节？\n\n这就是我不倾向于投这些东西的主要原因：难以把握。\n\n尤其根据我个人的理解水平，我已经落后了——你给我买个家用电器，连说明书我都搞不明白，你让我去搞什么光模块、什么 HBM、什么堆叠、多少层、进光场、CPO 又各种奇怪的字母？这不是硬拿鸭子上架吗？\n\n我也不用不着，我就找一个我熟悉的，一买完事等着就行。 它总有些时候会低估，低估的时候我买进来；市场一转型它不低估了，我都不需要它高估，到合理估值我就给它卖了。\n\n我就赚这一点点差价，我就够了。 我犯不着跟他们赌那事儿——我也赌不明白。\n\n## 七、真正成功的是\"小而确定的收益\"\n\n我告诉你，真正在市场上成功的就是：获得小而确定的收益。\n\n大家一定把这句话记在心里，然后把这个模式重复下来，你就是一个成功的投资者。\n\n为什么\"小\"能确定，\"大\"就确定不了？ 未来三个月非常容易看，未来一年也非常容易看，未来两年也容易看；但你说看未来十五年，我认为这纯粹就是胡扯——那就是押宝。\n\n任何一个人\"长持一只股票赚了多少倍\"，无论他拿的是什么，他都是幸存者偏差。\n\n你别拿这个跟巴菲特比，因为巴菲特自己是经营公司的，你跟他不一样。 而且即使是巴菲特，他也不会一直长持一家公司，他也是根据公司的情况不断调整。\n\n押中茅台的人、押中五粮液的人多了，押中长春高新、把密码忘了的老太太，一百倍——这种人多了去了。 你不能因为他在最高点那个时候被拿出来作为个例宣传，你就认为他的投资模式最好、他的分析最厉害，那不对。\n\n做职业投资人，第一条是永远不败，第二条才是小而确定的收益。 其实第一是永远不败——你上来追求的第一件事，就是永远也不亏损。 当然你做不到永远不亏损，但这是你的目标。\n\n如果你一进来就想\"我要靠这一把拿出这个，然后我就是星辰大海\"——那你就得加小心了，因为你过去那一大堆成功指标都是幸存者偏差。\n\n善战者无赫赫之功。 真正在股市上厉害的赢家，都是默默无名的。 你要是\"我这一笔钱全是靠茅台挣的\"，那说明你多多少少还有赌的性质在里面。\n\n名将历史上你说他打了哪个最著名的战役？你想不起来。但他最终每一场仗都打胜。\n\n股票市场上也一样——你回忆过去，你说我究竟靠着啥赚钱你都忘了、想不起来，这才是最成功的投资者。\n\n## 八、黄金已经成了一种宗教\n\n一个时代有一个时代热闹的股票。当年消费、医疗热闹的时候，所有的舆论、所有的意见领袖都围绕着那些股票转，一说那些股票底下全是回复——最终就把所有人的财富造成了很大的损失。历史上就是这样一次又一次重复。\n\n今天就是：一说科技股，全是打杂这一片看好。\n\n有色今天也一样——你现在还看好黄金，它已经成一种宗教了。 你现在说黄金可能会下跌，一大堆人骂你，信不信？我现在都很少看到有人看空黄金的了。\n\n前两天我翻了很多我关注的黄金主播，就想看他们的意见。很明显他们有人是看空的——从美联储加息以后，有的人明显是看空黄金的，但他就是不敢说。\n\n害怕呀，因为他们是做自媒体的，这玩意儿真掉粉。\n\n什么东西不能谈？中药在公共场合是不能谈的，中国有几样东西是不能谈的，其中就包括中药。我现在觉得黄金也快不能谈了。\n\n但这里的道理很简单：一旦你发现什么东西已经不能谈了、所有人的意见都跟你一样了、你只要提反对意见马上就有一大堆人来攻击你——那这个东西就已经宗教化、成信仰了。\n\n所有东西一旦宗教化、成信仰，它就一定已经有些危险了。 我不敢说它马上就会掉头向下，但它一旦变成信仰，这件事就非常非常危险。\n\n因为大家要知道，查理·芒格说投资最重要的事是什么？芒格说就一件事儿：理性。\n\n理性和宗教是相对的。 你永远都要理性、要理性思考——你现在都已经开始变成一种宗教信仰了，你还哪来的理性？\n\n你们看不同宗教信仰互相冲突的时候，那种发自内心的仇恨会让你非常惊讶：无非就是信不同的人呗，你说真主是真神，我说耶和华是真神，那能咋的呀？——不行，就像互相掘主坟一样。 欧洲中世纪天主教占统治地位的时候，异教徒都是火刑，你信别的就不行，烧死你。\n\n## 九、关于紫金矿业\"十块钱\"那句话：阅读理解不过关\n\n我有时候看他们对一句话的理解程度，我都不知道从哪下手。\n\n我说过那个紫金矿业\"十块钱\"的事：我当时说，你别看现在紫金矿业涨到哪儿我不知道，但未来它一定还会回到十块钱。\n\n我是举例说的——最早 2007 年的时候云南铜业涨到过九十八，后来跌到过八九块钱；三一重工涨到过五十，后来跌到十三。 我说你别看洛阳钼业（当时紫金矿业大概在十七八），我说你别看紫金矿业现在在涨、涨到多少我不知道，但未来它还会回到十块钱。\n\n于是有人认为我看空紫金矿业，说紫金矿业马上就会回到十块钱。\n\n你稍微学过中学语文、懂上下文，你就知道我那个时候持有洛阳钼业，我怎么会看空有色金属呢？ 我是在跟你讲那句话最后的结果——我说你挣差价可以，不要给自己编故事骗自己。 周期股就是周期股，它能上涨，最终还是会下跌的。\n\n然后有人说我 2024 年就看空有色金属、看空紫金矿业到十块钱。\n\n这阅读理解有问题——你不是股票不行，你是语文不行。 一般人说也就算了，现在一大堆大 V 也拿这事说事。 你要是故意的、你想蹭我一下热点，那我能理解——你不骂我两句，你都不能显示你在紫金矿业里面有影响。\n\n但你要真是这么认为的，那我就觉得你这问题大了。\n\n他们不是骂我，那是时髦行为，就像街上流行红裙子一样。 你那时候不骂我，你能算那什么的吗？ 这玩意儿就是个标志：就像你不说两句昆德拉、不说说\"生命不能承受之轻\"，你算爱好文学吗？你投资的人连巴菲特都不知道，你算投资的人吗？\n\n我不想红。我要想红，我再糊弄他们两下，他们更破防了。 现在别人在我帖子下面提这事儿，我都给他删了——别没事给我找事了，这事儿拉倒，过去就拉倒了。\n\n## 十、美债收益率上涨 5.2%：这是最可怕的事\n\n说点正经事。大家看这两天，美国国债收益率上涨得非常可怕——我告诉你们，千万别拿这事儿当小事。现在美国的股市、黄金市场，最重要最重要的就是它的债市。\n\n国债收益率对美国利率的牵引是非常大的。\n\n美联储降的是什么？它降的是隔夜拆借利率——它给那个东西定了个范围，但它不是市场上实际的借贷利率。实际借贷利率要比这个更受美国国债收益率的影响。\n\n因为美国很多贷款、存款的利率是市场化的：你比如说发债，债券的收益率实际上都是跟着美国国债收益率在跑的。再加上信用溢价——比如英伟达这种公司要在债券市场融资，它发债就要根据同期美国国债来定。\n\n美国国债实际上叫做\"利率债\"，就是它不会违约。 而其他人和美国政府相比就有信用问题，你还上的概率可能是百分之九十九、八十、七十，你就得因这个加一块利差——这就叫信用利差。\n\n所以为什么叫\"无风险收益率\"？就是我们把美国国债假设为风险是零，你其他的有风险，你就得在上面附加一个风险溢价。\n\n美国国债收益率一高，其他都得跟着高——要不然同等利率，人家买美国国债不好吗？你买你那玩意儿还有风险。\n\n看十年期国债收益率，昨天晚上已经涨到五点二几，最高的时候摸到过五点二七，我感觉好像五点三。 原来说十年期美债收益率到百分之五就是灾难，现在已经五点多了，已经开始有人炒说未来到年底就会到六。\n\n五点几的无风险收益率，那对所有的投资市场都会形成资金的抽离效应。\n\n你想想：假如现在银行存款百分之十的利息，你还买什么股票？直接把股票卖了都存银行就完了呗。 这道理不复杂。\n\n所以美债收益率这么持续上升是非常可怕的一件事，它会虹吸所有的市场。\n\n你今天在国内投资股票，这不是被逼的吗？原来你可以投资房产、每年稳定增值，现在房产你不敢买了，存银行现在百分之一的利息，那你不买股票买啥呀？这就是现在 A 股有利的地方。但对于美股正好反过来——你现在国债收益率都快百分之五点五了，三十年期的五点四七、二十年期的五点三、十年期的五点三，你存十年五点三的利息，你还买啥股票？\n\n尤其是你现在股票还处在高位，也不是低估的时候；黄金、有色金属这些也都处在高位——那你会不会卖一部分出来去买别的？\n\n## 十一、为什么债券反应最快：它不需要传导\n\n有人说\"那你看也没跌，人家继续涨呢\"——它传导需要时间，不像立竿见影。\n\n我讲美国加息对这些东西的影响时已经讲过了：国债反应最快，因为国债是受心理传导的，它不需要时间。 你那边只要一加息，它这边马上就传导。\n\n然后它会形成一个正向循环：你还得加息，你还加息它还高，然后它就会虹吸其他里面的投资——其他里面的钱都出来投资国债了，那就造成其他资产、商品降价。\n\n慢慢慢慢地，股市降下来，投资活动就慢了；投资活动一慢，需求就少了；需求少了，商品价格就降下来，从而达到降通胀的目的。这个过程是需要传导的。\n\n首先传导到的就是债券和股票的心理层面估值。\n\n我以前专门讲过：加息对股票市场的影响是两个——第一是心理层面的估值，加息以后马上有一个估值的影响、心理的影响。但实际上，加息对股票市场的影响才刚刚开始。\n\n因为最终它会体现在上市公司的业绩上： 有的公司会由于加息导致财务成本增加，你公布季报的时候季报可能就不理想；另外一个，加息以后经济活动就放缓了，需求也受影响——那时候公布完季报，它的利润降下来、股价降下来，资本市场才开始降。这是需要一个实质过程的。\n\n只有债券市场不需要传导——你那边一降，这边立竿见影，马上重新计价。\n\n## 十二、金属的持有成本：加息后你还敢囤吗\n\n你现在金属的持有成本越来越高。\n\n比如现在美国囤的铜：你买个铜不花钱吗？利息增加了以后，你这些钱是有机会成本的。 你的钱买完铜不就成死钱了吗？要么是你自己的钱变死钱，要么你这钱是跟银行贷款贷来的——那你不得给人利息吗？这个利息现在就是你的持有成本。\n\n随着加息开始，你的持有成本就越来越高了——那你还有动力吗？你是不是赶紧甩卖呀？你现在不甩，再给你加两次你甩不甩？\n\n另外一个：前几年高盛出过一份研报，专门对铜的库存做了一个估算，那要比我们现在所能看到的铜的库存高得多。 这就是我上次直播讲过的：你看到的美国的显性库存，和它的实际库存比，是不是有很大很大的差异？\n\n因为囤铜的不仅仅是期货市场——它不仅在期货市场仓库里囤，还在工厂里囤，还有很多实物贸易商自己囤货，是不显性的，你看不出来。\n\n大家自己去找一找九月二十三号高盛发的那份报告，专门说有色金属铜的期货存货问题。他们估计美国库存大概得在一百六十万到一百八十万吨。\n\n所以世界上实际在生产领域里面并不缺铜——现在的铜紧张，是由美国的库存虹吸造成的。\n\n九月二十八号美国加不加关税的最后期限就要有定论了，那极有可能再拖。这个东西就不好预判了，再拖我觉得也就拉倒了，不能再囤了，因为随着加息你囤货成本会越来越高。\n\n现在整个期货市场也好、现货市场也好，都在赌这一下。 九月二十八号之后如果加了关税，那也就是这事儿就算完事了——加了关税就是空头、多头出货的时候。一上涨、多头一出货，这波行情就完事了。\n\n## 十三、石油讲不了：决定因素太多\n\n石油讲不了，没啥可讲的——石油的决定因素太多了，和政治影响关系太大，你讲啥都没用。\n\n明年霍尔木兹海峡一开，明天油价就降百分之二十。 你把所有的油井都研究完了、所有的事都研究完了，都没有用。\n\n美国去抓马杜罗这事儿，你能预计到吗？美国和伊朗开炮的事儿，你能预计到吗？伊拉克民间组织把沙特的那条输油管道炸了，这事儿你能预计到吗？\n\n## 十四、我们的牛市是不是要结束了？恰恰相反\n\n我们的牛市是不是要结束了？恰恰相反，我认为我们的牛市才刚刚开始。\n\n但这期间可能会随着外盘的波动产生一次波动，所以你要做好\"坐稳扶好\"的准备。但你要说牛市是不是结束了——没有，我们的长牛会大有可为。\n\n你真正撞击的时候不分啥，啥都会撞击——你像红利它也一样会撞击。那跟那都没有啥关系。\n\n真正来撞击的时候是流动性风险。 流动性风险的时候，人家是为了卖这个东西去补别的东西——尤其像美国有很多实际上是保证金交易，它涉及到一个补充保证金的问题，那就跟你的东西就没有关系了，那时候就逮啥卖啥。\n\n流动性危机的时候，是股、汇、商品全都砸，就是有啥卖啥。\n\n那这里面涉不涉及科技类？涉不了。那你所有估值高的，你就得加小心。\n\n科技类看空不看空我不知道，我不懂——但我认为它有风险，尤其是它和国际上关联很大。\n\n你这一次如果产生波动，很明显不是由于我们国内的内生因素造成的，而是由国外的流动性危机造成的。 那国外的流动性危机首先影响的是国外的资本市场，然后它会传导到国内，有两个路径：\n\n一个路径是对标——你有很多国内上市公司是和国际上相联系的，或者他们从事一类行业、是上下游，那国外这些东西跌的时候他也会跟着跌。 第二个就是资金虹吸——它一旦开始下跌，很多资金需要回流它那个市场。你现在国内也有不少是受外资影响的，尤其是港股；港股下跌的时候也会带着 A 股下跌。\n\n这个东西传导起来比较复杂，中间还有一个变量是\"国家队\"，这都不好说。\n\n## 十五、人民币中间价调贬：外资流出压力的信号\n\n你看这两天人民币中间价开始调贬了，这就说明我们的国际资本也有流出压力——这两天中间价一调到六点七二。\n\n大家想一想：调贬是有利于流出还是不利于流出？\n\n从中国的角度上来说，假如有外国人到中国来投资，我现在把这个中间价调贬——你是有利于流出还是不利于流出这部分资本？\n\n因为你进来的时候，已经把全部的美元都换成人民币了；现在人民币调贬，你再换回去，你不就换的美元少了吗？你换的美元少了，你自然就不愿意换了。 而且最主要是：你这部分钱如果拿到国外再赚一个利差回来，由于现在人民币是调贬的，你再回来的时候如果又变成升值，你不就亏了吗？\n\n这就涉及到\"记账本位币\"的问题。 人家国家记账的本位币是人家的货币——你不是说\"我认为以后就投资人民币\"，人家不在中国生活，你为啥让人家投资人民币？我拿一大沓人民币有啥用啊？最终我一定得换成美元来算我的投资收益。\n\n中国也一样：你在国外开矿，你最终必须换成人民币收益，那才是你的真实收益。 你如果挣的都是美元、美元又贬值了，那你有啥意义？\n\n所以它有汇兑损益——有汇兑收益，也有汇兑损失。\n\n## 十六、不结汇带来的另一个问题：我们降息不能随心所欲\n\n现在国家也不强制结汇了，所以不结汇这个现象也带来另外一个问题：\n\n你在国外普遍紧缩的时候，它其实也压制了我们边际放松的空间。\n\n虽然我们现在是在放松的，但由于外边现在开始紧缩了、开始加息了，那我们再降息就不是那么随心所欲的。\n\n如果现在国外也是降息，那我们现在早就降息了。 但现在的问题在于：国外现在是加息了、进入加息周期了，那你还降息的话，你的外汇流出压力不就是更大了吗？那不就有套利空间了吗？\n\n如果现在我们像当年的日本那样、外汇可以自由进出，我们现在马上就会被套利——就会有人借人民币、换成美元、卖了以后投资美国的高收益债券。\n\n那现在我们做不了这件事，因为我们外汇是管制的，在资本项下。这就是我们的优势。 否则的话，我们现在就是美国的血包——人家的收益率那么高，大量的人民币资本会流向美国。当年日本就是被人这么吸干的。\n\n你说你印多少钱都没有用，你印多少钱都会被拿到美国去。\n\n## 十七、所有的管制都会带来黑市\n\n所有的垄断都会带来黑市，我早就告诉过你们了。所有的管制都会带来黑市——这是最典型的特点。\n\n我搞这种大航海会员直播，不是所有人都能看，那就一定会有黑市。这就是由管制造成的。\n\n这就是我以前给大家讲过的：说美联储又降息又缩表，我说那就纯扯淡——你降息、缩表，那就一定有美元的黑市。你做不到啊：你还减少美元供给、你还降低美元的利息，你肯定做不到；你同时做不到的这些事，一定会有黑市交易。\n\n有管制就有黑市。\n\n有人劝我去举报。举报啥呀，别扯那个。 我这个直播间四五百人，你上哪去找谁干的？中间再给你找几手，你以为人家能用自己的 IP 去发呀？\n\n我大不了不播了就完事儿了。以后全公开直播，他也别售卖了——那市场就没了嘛。\n\n我要想做这件事很简单，我就不做了，全部进入市场、明码标价：我要收费就收费，不收费就不收费，全部公开完事儿。\n\n你这整的，管制一下——他不让留回放，那肯定就不行。 你要说让留回放也无所谓，比如直播完以后晚两天发回放，那也行啊，但他这平台设计的规则就不行，就是考虑得不好。\n\n你要说这个道理，那小孩学校里管手机也是一回事——到时候他就租手机，你也没招，人家专门有干这个的。这都是基本经济规律。\n\n所以你别想着说\"我们原来那个凭票供应的年代，管得老严了\"——我告诉你，管得再严的时候也有黑市。要不然怎么会有\"投机倒把\"这个罪？你要没有这黑市，哪来的投机倒把？\n\n美元黑市怎么来的？那还要用想啊，马上就能想明白：有人能拿到——你降息了，有人能拿到便宜钱；但同时缩表，不是所有人都能拿到便宜钱，那拿到便宜钱的人就会标价高一点，在黑市上去卖、赚差价。\n\n## 十八、房地产贷款的双轨：管制怎么造成竞争不公平\n\n原来八十年代我们刚改开的时候，你看那些双轨制你就明白了：卖钢材，国家体系里面的钢材是便宜调拨的，但是市场上的钢材贵——那一定有人把调拨的钢材拿到市场上去卖。 这不很复杂吗？这很简单。\n\n房地产开发时代也一样。当时给房地产开发是控制的，但给产业的贷款利息并没有提高。\n\n能明白这道理吧？就是说：你用来开发房地产的利息是高的，比如说百分之七；但你发展产业、发展工业、发展制造业，你的利息低，百分之二、百分之三。\n\n那我问你：银行贷款出去以后，它究竟是用在了制造业上，还是用在了房地产开发上？你能知道吗？\n\n而且不仅仅如此，我告诉你——再说你们就给你们开天眼了（你们容易到住下主播）：\n\n央企有很多，它的房地产开发和实业都集中在集团里，而集团自己是有财务公司的。什么叫财务公司？就是把集团下边各个子公司的钱全部放在财务公司里共同经营——财务公司在某种程度上相当于自己的银行。\n\n那我问你：你的钱都在财务公司里面随便调拨，你说你能知道这钱我借来了是去造船了、还是去开发了？你能知道吗？\n\n我只能说：造船没造船，中国船舶没有房地产开发公司。\n\n所以后来中央为什么三番五次地提到\"聚焦主业、聚焦主业\"？ 因为你当时中国远洋下边就有房地产开发公司——中国远洋贷款买船，这钱最后先去开发、先转一把，那玩意儿都是暴利。\n\n那为啥后来中央要求各个央企聚焦主业、必须剥离房地产开发公司？ 哪个央企没有房地产开发公司？（中远洋没有啊，中行有没有？）那玩意儿赚钱快的时候就赚钱呗。\n\n以后不开发房地产了，以后\"炒钱\"——炒钱就更来得更快了：我连开发都不开发了，我搁产业资本借完了，我直接借给房地产开发公司。\n\n这就是要在金融系统里面空转，这也是国家三令五申反复在反的。\n\n所以你们有的时候看新闻，有的东西你们不懂\"这干这干啥、说啥呢\"——你不懂，是因为你不懂这个结构是怎么回事。\n\n这就是\"黑事儿\"。 在某种程度上它就是黑事儿，你可以说它叫做\"违规资金\"：原本人家给你的这个贷款，不是用来干这个的，但你拿去做别的了。\n\n那东西是国家限制的——比如房地产开发商有一段时间是限制的，那你拿不到钱，那咋办呢？那他还得开发呀，因为开发确实暴利、他赚钱，贷款利息再高他也赚钱。\n\n所以那就一定会产生黑市——资金的黑市。\n\n## 十九、管制下的竞争不公平：为什么万科没人救\n\n但这也就造成了另外一个问题：后来为什么所有房地产开发企业在竞争上并不公平，知道吗？\n\n你专业的房地产开发公司，你贷款的这个利息就高；而属于那种大集团下边的一个房地产开发公司，他贷款的利息就比你低。 所以后来就有很多原来不是专业的房地产开发公司，反倒发展得越来越好。\n\n（有人提保利——）保利还不一样，人家从成立的时候就是专业的，早就是专业的上市公司，人家专门做地产。 有些原来都不是，都不是单独的上市公司，他就是央企下边的一个子公司——你还不能拿保利说事。但保利肯定是有优势的，你比别人就有优势呗。\n\n你现在想一想：为什么万科就没有人救？大家明白不明白，你万科后来为什么那么困难？\n\n万科那个深圳地铁算个屁呀？他有啥钱呢——一个地方的公共事业单位。\n\n万科原来的大股东是谁，你们知道不知道？为什么万科后来不行了跟经营有啥关系？什么大股东换了？（那宝能都是后来的——华润都撤出了，宝能才想起来要收购一把。）\n\n那你们知道不知道，为啥华润要从万科撤出、为什么后来要专门成立自己的华润地产、从万科撤出来？ 所以你们去了解一段历史，你就都知道这东西都不是偶然的，和你们想的都不一样。\n\n万科最大的问题就是\"内部人控制\"——这个问题太难太难解决了。所以万科走到今天很正常。\n\n这个东西就是这样：企业——尤其是有国企背景的——一旦有一个非常强势的管理层，形成所谓的\"内部人控制\"，这件事实际上是不好的、是非常危险的。\n\n但在 2015、2016 年之前的那个语境下，这种情况是有人支持的。但到 2015、2016 年之后，这个情况就急转直下了——你原来行之有效的那套东西就没用了。\n\n所以你今天走到今天并不奇怪，它是有预期的。 只是你分析它分析不透，还搁那天天研究\"我一天开发多少平方米、我挣多少钱、一年分红是多少\"——那你真是不了解这个企业运转的规律。\n\n（有人说\"华润系的股票现在都这么惨\"——）那跟华润系有啥关系？地产不行，那不现在都不行吗？ 你净知道几个华润系的股票，来你告诉我一声？你现在不行那就是地产不行，跟他们\"华润系\"什么系有啥关系？那地产它整体都不行。\n\n## 二十、中国不是日本：财政主权与资本管制\n\n所以拿我们比较日本都是扯淡，中国不是日本。\n\n中国和日本的差别可大了去了：\n\n第一，我们的财政主权是自己的、是完全主权——我加不加息、我降不降息、汇率多少，这事完全我自己能定。 第二，我进出都是管制的——你不能随便进、也不能随便出。\n\n你当年日本行吗？日本敢说我管制进出吗？ 所以日本最后就变成了：你不管印多少钱，都是美国的血包。\n\n为什么我们不成立主权投资基金去国外买股票？ 你们想一想，为什么我们不像挪威那样成立主权财富基金、到国外去投资买国外股票？\n\n因为我们不这么做——我们是在一级市场上玩。\n\n你那央企都是干啥的？在国外买了多少矿了都？ 财富基金不得去买股票吗？我们都不是买股票，我们直接就国外经营实业。 中铁在刚果金修铁路换的矿，那不是国家的吗？\n\n国情不同。 他们不投资主权基金他能干啥？他那点钱在外边经营实业也不够，所以那点钱只能去国外分散地买点别人的证券——那就相当于在二级市场上投资。我们都是自己在一级市场投资，我们相当于自己在经营，我们买的都是企业。\n\n（有人问\"上市的合适还是不上市的合适？\"作为经营来说——）别拿我们去和别人比。\n\n## 二十一、股价不行不等于公司不行\n\n你们说的\"医药不行\"，就是股价不行——人家医药都过得非常好。\n\n医药、啤酒，没有哪个过得不好的。 你只是说现在你的资金都被虹吸到科技股上去了，你不要用股价不行来说人家过得不行，人家过得很好。\n\n这个时候你得把人家看成巴菲特——你现在又想到巴菲特了吧？巴菲特的股票也有很多下跌的时候。\n\n人跌的时候，你说人巴菲特过得不好？不是，人家不在乎这个。 人家那个现金流好得不得了，那钱挣得都没地方装了，就你自己觉得不行。\n\n不是你认为股价不行就是不行，你认为股价好这就是好。\n\n## 二十二、去年 1.2 万亿贸易顺差，钱去哪儿了\n\n我们的外汇储备都不只是这点儿。你外汇储备去年和前年是一边多的，都是三万一。 但是去年的贸易顺差是一点二万亿美元——那你告诉我，那一点二万亿美元去哪儿了？\n\n你要是这些顺差都应该回来的话，那该四万多亿了。 这我还没上前年、大前年呢。那都好多年国家的外汇储备都不增加呢，那钱都去哪儿了？\n\n所以你对中国的理解，不能按照西方国家那些经济学给你定的框框来理解。\n\n大量的钱都在国企手里头，他根本没有结汇，他压根就没进来。 比如说有很多贸易顺差，他赚了钱实际上这个钱还在国外——要么就投资，要么就买东西了，要么干脆就存在国外那个央企子公司的账上吃美国的收益。\n\n只是它不以国家层面来显示，所以它不计入外汇储备里面，它相当于普通的企业存款。 中国的央企是一个特殊的存在——严格意义上来说它属于国企，但实际上在法律管理上它属于企业。\n\n而对于我们来说，在央企手里还是在财政部手里，咱实际上就是左兜揣右兜——因为它们的大股东就是财政部。\n\n所以你说我们有多少国债那倒不重要，我们投资国债的渠道可老多了——不像你说的就是央行公布那些。我们的国债可老多了，我不减持、我让别人减持，你也受不了。\n\n这种东西谁会给你老百姓说？ 我搁这说了你相信，因为我也是老百姓。但\"人家天天搁新闻联播里说的时候，你根本不信\"——\"官方说的你就不信，说你妈就想剥削我\"。\n\n你老是从自己那种生活境遇出发来考虑国家的事儿。\n\n你看不懂那很正常，慢慢就都懂了。 人家给你说\"进出口大幅增长、形式大好\"的时候，你就觉得是假数据、在吹牛——你一天看新闻联播都能把你气死，你情绪太大了，你都没仔细坐下来看，所以根本看不到里面的信息。\n\n人家有人家的优势，各国都有优势。但我们的优势是独一无二的、不可替代。\n\n## 二十三、收尾：我们的崛起是阻挡不了的\n\n看来我们的崛起是阻挡不了的。\n\n你说对了，肯定阻挡不了——这东西都是历史规律，各领风骚几百年。\n\n今天讲的都是评书，都是胡编乱造的，不能用来指导投资，别当真。 我也不是专家，不是经济专家、股票专家，也不是投顾，你不能按我的说法来投资；我所说的所有股票都不是推荐。\n\n另外这几天起我会恢复聊天模式，会员专属直播十一月份停播，大家不用再充舰长了。\n\n谢谢大家的陪伴，我要下播了。","toc":["一、开场：会员专属直播，十一月份停播","二、真正的原因：有人在咸鱼上卖我的会员直播录音","三、规则都是给守法者定的","四、不讲个股：我怕的不是你埋怨我，是我自己过不去","五、\"互相唱歌互相打气\"：雪球上的定海神针","六、科技股不可预测：十年前没人知道会有大模型","七、真正成功的是\"小而确定的收益\"","八、黄金已经成了一种宗教","九、关于紫金矿业\"十块钱\"那句话：阅读理解不过关","十、美债收益率上涨 5.2%：这是最可怕的事","十一、为什么债券反应最快：它不需要传导","十二、金属的持有成本：加息后你还敢囤吗","十三、石油讲不了：决定因素太多","十四、我们的牛市是不是要结束了？恰恰相反","十五、人民币中间价调贬：外资流出压力的信号","十六、不结汇带来的另一个问题：我们降息不能随心所欲","十七、所有的管制都会带来黑市","十八、房地产贷款的双轨：管制怎么造成竞争不公平","十九、管制下的竞争不公平：为什么万科没人救","二十、中国不是日本：财政主权与资本管制","二十一、股价不行不等于公司不行","二十二、去年 1.2 万亿贸易顺差，钱去哪儿了","二十三、收尾：我们的崛起是阻挡不了的"],"url":"https://www.bilibili.com/opus/1252317312839581698","bv":"","minutes":0,"chars":13223},"ai":{"title":"老木匠·2026年9月26日：美债收益率、铜关税与A股牛市展望","text":"## 一、美国十年期国债收益率逼近5.3%：这是所有资产市场的最大威胁\n\n1. 国债收益率才是真实的市场利率，不是美联储降的那个\n\n他花了相当多的时间讲这一点，因为很多人把美联储的降息和市场实际利率混为一谈。他的解释是：美联储降的是隔夜拆借利率，而美国国债收益率才是市场化的真实融资成本。企业发债、消费者贷款，定价都跟着十年期国债收益率走，加上信用溢价。当天十年期美债收益率已经涨到5.2%以上，他说：\n\n原来说到十年期美债收益率到5%就是灾难，现在已经五点多了，现在已经开始有人说未来到年底就会到6。\n\n2. 收益率这么高，会虹吸所有其他资产\n\n他打了一个A股的类比来帮助理解：如果国内银行存款利息是10%，你还会买股票吗？美国现在就是这个情况——国债无风险收益率已经接近5.5%，美国投资者为什么还要持有高估值的股票、黄金、有色金属？这种虹吸效应会传导，但需要时间。债券市场反应最快，股票和商品市场反应慢，最终会体现在上市公司的季报业绩上。\n\n3. 为什么现在各国还在抛售美债？\n\n国债收益率上升意味着债券价格在跌，那为什么还有人卖？他解释了卖家的结构：现在主要是主权资金在卖，不是为了赚钱，而是因为需要美元——一是进口石油消耗外汇，二是需要在汇率市场干预本币贬值。日本、印度都是这种情况。他们一抛售，价格跌，收益率升，反而给美国国内投资者创造了高息买入机会，进一步虹吸其他资产的资金。\n\n4. 持有铜的成本也在上升\n\n他还点出了一个容易被忽视的影响：美国屯的那90万吨铜，持有成本随着加息在持续上升——自有资金是机会成本，贷款买的是真实利息。随着加息持续，这些铜的持有动力越来越弱。高盛在9月23号发了一份报告，估算美国的实际铜库存在160到180万吨之间，远超康max显性库存，世界实际上并不缺铜。\n\n## 二、铜关税：9月28号最终期限，之后逻辑就结束了\n\n1. 28号是最后期限，但可能再次延期\n\n9月28号是美国铜关税决策的最后截止日。他的判断是：加或不加，对铜价都是利空，这个逻辑和之前几场直播一致。唯一的变数是川普再次延期，但他认为即便延期也越来越难持续，因为加息后囤铜的财务成本已经很高。\n\n2. 现在所有人都在赌这一下\n\n他描述了市场当下的状态：整个期货市场和现货市场都在等9月28号的结论。如果加了关税，多头出货，这波铜的行情就结束。整个市场都在这个时间节点上下注。\n\n## 三、A股牛市：才刚刚开始，但要做好被外盘撞击的准备\n\n1. 他认为A股长牛才刚开始\n\n有人问牛市是不是要结束了，他的回答是恰恰相反：\n\n我认为我们的牛市才刚刚开始。但是这期间可能会随着外盘的波动产生一次波动，所以你要做好防撞击准备。\n\n2. 外盘流动性危机如果来了，会传导到A股\n\n他解释了传导路径有两条：第一是对标——A股有很多公司和国际市场相关联，国外跌了，国内对应板块会跟跌；第二是资金虹吸——外盘危机时有大量资金需要回流，港股会率先受影响，进而带动A股。他说这其中还有个不确定变量，就是国家队。\n\n3. 流动性危机时\"逮什么卖什么\"，红利股也不例外\n\n他特别提醒：真正的流动性危机来的时候，不区分板块，什么股票都会被卖——高估值的、有色的、红利的，全部一起杀。原因是保证金交易需要补充保证金，逮什么卖什么，跟你的东西是不是低估没有关系。\n\n4. 人民币中间价调贬：说明有外资流出压力\n\n他在直播中注意到人民币中间价这两天在调贬，已到6.72，他的解读是国际资本有流出压力。他还解释了调贬的作用：进来时换成人民币的外资，如果人民币贬值再换回去，美元就少了，流出动力就会减弱。这是管理资本流动的一种方式。\n\n## 四、中国为什么不怕被\"日本化\"：外汇管制是最大护城河\n\n1. 日本被套利吸干的逻辑\n\n他用日本的案例解释了一国在美国高息环境下的脆弱性：日本资本可以自由进出，当美国利率高时，借日元换成美元投资美国高息债券，套利空间打开，资本大量外流，国内印再多钱都被人拿走了。\n\n2. 中国的两个核心优势\n\n他说中国有两点和日本根本不同：第一，财政主权完整，汇率、货币政策完全自主；第二，资本项下外汇是管制的，不能随便进出。这意味着即便美国收益率再高，套利搬运的通道是堵死的，国内的货币政策有自己的空间。\n\n你当年日本敢说随便，敢说我管制进出吗？所以你日本最后就变成了你不管印多少钱，都是美国的雪崩。\n\n3. 中国外汇储备被低估：大量顺差留在央企手里\n\n他透露了一个很多人不知道的结构：去年贸易顺差1.2万亿美元，但外汇储备并没有增加。这些钱去哪了？大量留在央企的海外子公司账上，没有结汇回国，所以没有计入官方外汇储备。但这笔钱本质上还是国家的，央企和财政部是左兜揣右兜。所以中国实际掌握的外汇资源远比公布数字大。\n\n## 五、投资科技股的核心风险：你无法预测十年后的技术方向\n\n1. 十年前没有人预料到今天\n\n他用一个简单的回顾说明了这个问题：2016年投资所谓科技股，投的是腾讯、阿里、海康威视；今天投的是大模型、AI芯片、光模块。没有一个人在十年前预料到会是这个局面。那十年后，今天投的这些东西还在不在？没有人知道。\n\n如果科技股的人永远能把握未来的科技方向，那就不会有新的科技公司诞生。谷歌都已经那么强了，怎么还冒出了OpenAI？\n\n2. 他不投科技股，是因为看不懂，不是看空\n\n他特别说明这不是谦虚：光模块、HBM、CPO这些东西他真的搞不明白，不是不想研究，是理解水平跟不上了。他的策略是找自己熟悉的、能理解逻辑的东西，在低估时买入，合理估值时卖出，赚这一点差价就够了。\n\n## 六、投资的本质：小而确定的收益，永远不败\n\n1. \"小而确定\"比\"一把翻倍\"更重要\n\n他在这场直播里说了一句他认为最重要的话：\n\n真正在市场上成功的就是获得小而确定的收益。大家一定要把这句话记在心里，然后你把这个模式重复下来，你就是一个成功的投资者。\n\n他说所有通过长持一只股票挣了多少倍的人，无论拿的是什么，都是幸存者偏差，不能拿来当方法论学习。\n\n2. 第一目标：永远不亏损\n\n他说职业投资人追求的第一件事不是赚多少，而是永远不亏损——这当然做不到，但这是你的目标。一进来就想着星辰大海、一把翻倍，基本就已经输了。\n\n3. 真正的赢家都籍籍无名\n\n他引用了\"善战者无赫赫之功\"这个道理：历史上真正厉害的将军，你想不起他打了哪场最著名的战役，但每场仗都赢。股票市场一样，你能随口说出\"我全靠茅台赚的钱\"，那你多少还带着赌性。成功的投资者，连自己都想不起来是靠什么具体操作赚的，只是一直在赚。\n\n4. 一件事不能谈：当所有人意见一致，信仰就形成了，危险就来了\n\n他在直播里提到，现在黄金已经快变成\"不能谈\"的话题了——说黄金要跌，一大堆人骂你。他把这个信号定义为宗教化。他引用了芒格的话：\n\n查理芒格说投资最重要的事儿就是一件事儿，理性。理性和宗教就是相对的。你现在都已经开始变成一种宗教信仰了，你还哪来的理性？\n\n他说不只是黄金，任何东西，一旦开始有人说\"这个不能质疑\"，这个东西就已经进入了危险区域。","toc":["一、美国十年期国债收益率逼近5.3%：这是所有资产市场的最大威胁","二、铜关税：9月28号最终期限，之后逻辑就结束了","三、A股牛市：才刚刚开始，但要做好被外盘撞击的准备","四、中国为什么不怕被\"日本化\"：外汇管制是最大护城河","五、投资科技股的核心风险：你无法预测十年后的技术方向","六、投资的本质：小而确定的收益，永远不败"],"url":"https://xueqiu.com/2573414707/410694560","chars":2900},"topics":["美债收益率、铜关税与A股牛市展望"]},{"date":"2026-09-23","bili":{"title":"老木匠 2026年9月23日直播文字稿（路径依赖、黄金祛魅、风险与回撤、上热菜、铜关税）","text":"## 一、开场：这两天雪球上的事，值得你认真想一想\n\n早上好。我刚从公园回来，跟几个朋友聊完天。\n\n这两天雪球论坛挺热闹，我猜有的朋友看下来是能得到一些严肃思考的。要是你什么都没得到，那我这两天做的事就白做了。\n\n我先说清楚：我自己的判断从来都不是无的放矢，我都是有根据的，只不过以前我不愿意说而已。不是像他们说的那样，我因为有好恶之心就给人下判断——我有我的根据。所以我跟你们讲完，你们对一些东西的认识就会提升一点点。\n\n但要记住：在我这儿别评价具体的人，更别用那种恶毒的语言去说别人。 我们讲的是个道理，不涉及对具体人的评价。\n\n## 二、\"人品\"这件事，本身就挺讽刺\n\n他们最有意思的地方在于：每天在背后讲别人，还总把\"人品\"当成主要话题。 \"你看那谁谁人品老差了\"——我说，我们今天来讨论一个人品的问题、我们都要做一个人品好的人……你看他老木匠那个人品老差了。这么讨论问题，你不觉得讽刺吗？\n\n我劝大家在生活里千万要避开这个误区：己所不欲，勿施于人。 你自己都不想干的事，不要强加到别人身上。我人品再不好，我也从来不在背后议论别人。\n\n我这是头一次——因为他们老说我\"阴阳\"，说\"你不会阴阳\"。好，那我今天就给你来一把\"阳的\"，我直接说。平常我才没兴趣讲这些，评价一个人对你来说也赚不着钱，有啥意义？\n\n而且这事儿本身就很冤。我是从评价\"有色金属\"开始的，不是评价紫金矿业。 是因为紫金矿业的人看不得我评价有色金属，才跑来挑战我的。我万万没想到，我评价个有色金属，还能惹了一帮\"英雄好汉\"——你评价个股也就算了，那我评价个黄金也不行、评价个铜也不行，这算什么？\n\n这说明什么？说明他们的股东里头，不理性的人太多了。 这真的是非常可怕的一件事。\n\n我跟你们讲，现在围在这周围的，很多都是宵小之徒。你别看今天他们把公司捧上天，明天只要这家公司有点损失，这帮人就能把它骂死。 这些人不是\"猫\"，当他有一天觉得自己受损了，他会把所有责任都推到你身上，而且会对你露出爪子，毫不客气。 紫金矿业跌到二十四的时候，就已经出现过这种情况了。\n\n还有人有的回复，我分析半天都不知道他到底在说什么。\n\n我前一会儿在雪球上转发了一个帖子，是别人艾特我的，你们下播以后可以去看一看：他对我进行了批判，说我说了什么什么、然后他批评了什么什么——我敢说，我写的原帖他连一个字都没看过。这就是自媒体带来的问题：都是以讹传讹。\n\n这种事太多了，都是\"用人朝前，不用人朝后\"。你在社会上走动时间长了，就都习以为常了，这都不算事。\n\n你要知道，股票市场上大部分人终其一生也成不了赢家——因为 90% 的人最后都会输。 所以在这个市场里发言的人，最终多半都是输家，这种认知水平，是很正常的。\n\n## 三、黄金：央行买黄金是政治考量，不是要涨\n\n昨天有人担心：是不是要卖黄金了？我说不至于。\n\n黄金对央行资产负债表的影响其实非常小。 我们每月增持二十吨黄金，一吨黄金现在才两亿美元左右，二十吨也就是四十亿美元——对中国央行的资产负债表规模来说，九牛一毛都到不了。所以买债是有可能的，卖黄金不至于；但会不会减缓购买进度，这就不好说了。\n\n有人说我们现在才两千吨黄金太少了。那多少叫多？其实是被\"锚定\"了——你是拿美国的黄金储备在比较，美国现在八千多吨。\n\n但你得明白一件事：美国的黄金储备是上个世纪的产物，是金本位时代的产物。 布雷顿森林体系的时候，美元要和黄金挂钩，它必须有足够的黄金储备。而我们人民币又不需要实行金本位，我整那么多黄金干啥？又不能生息。\n\n而且中国央行持续买黄金，也不像大家想的那样是觉得黄金要涨、美元信用要下降——这些都关系不大。最主要的，是政治考量：我们就是想把美元推高，尤其在中美关系不好的时候；关系好的时候，就可以让它降下来。\n\n## 四、黄金为什么没法估值：没有锚，也没有供求\n\n我以前跟大家讲过很多次：黄金是最复杂的东西。\n\n第一，它没有\"锚\"。 黄金没有锚定物，你没办法对它进行估值。现在三千、四千、四千三、四千四，是不是合理价格？是。现在一万，是不是合理价格？也是。回到一千呢？也是。这就是黄金的特点。\n\n第二，它没有供求关系。 所有黄金都是用来囤积的，它没有工业上的消耗。巴菲特为什么从来不买黄金？他说过一句很妙的话：开采金矿的过程，就是把黄金从一个坑里挖出来，再挖另一个坑把它埋进去。\n\n所以黄金、白银隔一段时间就会出现一次狂热。上世纪出现过白银狂热，巴菲特也炒过白银；美国的亨特兄弟囤白银，最后把自己囤到破产倒闭。黄金白银对人的这种吸引，好像写在基因里、写在骨子里——人们天然就觉得它有囤积的价值。所以每隔一段时间就出现一波狂热，不奇怪，都有社会心理因素在里面。\n\n黄金是纸币的总锚定物，涨到五万一克有可能，涨到一百万一克也有可能。但这本质上是一种崇拜——拜物教。 当然没人会说自己是崇拜者，都会给自己找各种各样的理由。\n\n## 五、\"乱世买黄金\"是句害人的口号\n\n\"乱世买黄金\"——我现在告诉你：乱世你如果有黄金，你根本活不过乱世。\n\n一个普通老百姓，乱世里如果有黄金，那黄金对你就是个危险。\"乱世买黄金\"是对国家说的、对大家族说的、对大资本财团说的——他们有流通渠道，你没有。你一个老百姓乱世买黄金，只会死得更快。\n\n有些东西都是似是而非、朗朗上口的口号，都是给你听的。\n\n普通老百姓唯一的想法，就是祈祷不要出现乱世，然后不要为任何乱世做准备。 这话我再强调一遍：你为乱世做的任何准备，都是毫无意义的。中国古人说\"宁做太平狗，不做乱世人\"，你看看太平年里的故事就知道了——当秩序失去、整个社会失去的时候，最倒霉的就是老百姓。\n\n其实也不只是老百姓，是群体性的：每一个个体都变差了，生存环境都变差了。你看着那些王公将相动不动就被灭族，老百姓起码还没被灭九族，你只是自己活得不太舒服而已。\n\n所以一切的一切，为太平做准备就行了。黄金作为贬值的风险对冲是可以的，但不要产生崇拜。\n\n干什么都不要产生崇拜。炒股最忌讳的，就是信仰。\n\n## 六、路径依赖：我那位赚了七倍的同学\n\n我有一个大学同班同学，2016、2017 年的时候专门投资白马股——茅台、腾讯、五粮液、恒瑞医药这些，后来还有美团。到 2021 年，他赚了很多钱。大家都知道，2021 年就是白马股的高点。\n\n我当时经常跟他说：你对这个社会运转的黑暗面理解不足、不充分。 为什么这么说？因为他是大学毕业就去当大学老师，当完老师就开始炒股，没有像我这种当过律师的、丰富的社会阅历。我对社会阴暗面的接触很多——包括上市公司最后怎么欺诈的、怎么骗股东的，我都知道。\n\n我跟他说，你这种投资模式不行。但那时候人家一直在赚钱，我一说这事，他就跟我讲 ROE、讲巴菲特和芒格。\n\n我说我跟你讲，这些东西都是房地产的影子股——高端白酒就是房地产的影子股，房地产不行了，高端白酒就完了。他说不对，老百姓还得喝白酒。我说你太不知道白酒的运转规律了：白酒压根就不是用来喝的，它是行贿的一般等价物，是行贿领域的货币。 它之所以好，就是因为它\"货币化\"了。\n\n结果后来大家都知道了，2021 年之后这些东西跌了很多。腾讯那时候都涨到七百多了，他没卖。后来又买了不少美团、五粮液，跌得更惨。终于有一天忍不住了，把这些股票都卖了——也不算亏钱，还是赚了很多，只是回撤了很多。\n\n然后他做了一个什么选择？他把这些钱拿去在上海买了个房子。 而且是带杠杆的，只交了首付。所以我估计，他这些年在房子上的收益，可能还不如那些白马股压根就不卖。\n\n这就是不能产生信仰的原因。 当你对某一样东西产生信仰、形成路径依赖的时候，对你来说就危险了——你会对自己的方法确信不疑，觉得它就是唯一对的，因为\"我历史上就是这么挣的钱\"。\n\n我那个同学当年最多赚了七倍——五年时间，从 2016 到 2021。那是很大一笔钱。但后来股票回调了一大半，估计只剩五倍；再用首付去买房，现在那点盈利也剩不了多少了。\n\n## 七、万科的\"老柏树也有春天\"：卖万科买茅台，错过一整轮\n\n还有一位，当年在万科论坛里的投资人名人，好像叫\"老柏树也有春天\"。微博时代我就是他的粉丝，他们也是喜欢投资白马股。\n\n后来 2024 年，他在万科上遭受了一笔很大的损失。这倒不要紧——但他卖完万科之后，全仓买入了茅台。 这些年茅台是什么表现，大家也知道，他等于整轮牛市都错过了。\n\n而这一切，都是路径依赖。\n\n他实际上是靠买白马股赚的钱，所以他就认为白马股是投资的不二法门，好像找到了投资的\"圣杯\"。一旦产生这种想法，你就一定要小心——危险可能离你很近了。\n\n天天走这条路，越走越熟、越走越觉得没有风险的时候，风险可能就临近了。\n\n## 八、什么叫风险：风险就是\"预计不了\"\n\n大家知道我经常说\"紫金矿业有风险\"。他们就理解成\"紫金矿业明天要暴跌\"。这是两个完全不同的事。\n\n风险，就是我预计不了未来——这就叫有风险。 尤其在它高位的时候，所谓风险就只是它下跌的风险，因为我们预计不了。\n\n所以你别跟我说\"你看人家紫金矿业又涨了\"，那跟我没关系，不代表我判断得不对；反过来它跌下来了，也不代表我判断得就对。风险就是一个不确定性很大的东西。\n\n风险更大的特点是什么？是不可预测。 你不可能说\"你说有风险，那你告诉我到底啥时候跌\"——如果你知道啥时候跌，这个股票就没有风险了。\n\n大家能不能理解这句话？风险最终实现的那件事、那个风险事件，你是不可预测的。所以大家一定要明白：我说的风险不是预测。 我说这个东西有风险，不代表它明天就跌，甚至它明天可能还涨，甚至它永远都不跌——这不代表我说错了。比如我说有 80% 下跌的概率，那它要是走了那 20% 往上呢？你说我\"说风险\"就说错了吗？\n\n## 九、为什么涨高了就一定有风险：获利盘要变现\n\n总的来说，一个股票当涨幅过大的时候，它一定有风险。 为什么？因为里面的获利盘太多。\n\n而你要知道，潜在的获利并不是真实的获利。这就是瑞·达利欧说的那句话：你不能花你自己的财富，你只能花你自己手里的钱。\n\n以货币计价的财富，那不是你真实的财富数额——它是由边际交易决定的。 一只股票多少钱，你按这个价格算出来的市值、净资产，并不完全真实，它既有可能比这多，也有可能比这低。\n\n所以当账面上的资产不断膨胀的时候，我告诉你：你必须要有一部分进行变现。 这就回到达利欧那句话——你花不了自己的财富，但你可以花钱。所以到一定时候，你必须把财富变成一部分\"钱\"。\n\n这就是为什么股票涨高了就一定有风险：因为一定有一部分人会变现。\n\n最浅显的例子：大家都知道今天在炒中际旭创，那你知道它的大股东是什么时候减持的吗？你自己去看看历史——它从二十涨到二百的时候，大股东就已经开始考虑变现了；现在涨到一千多了。\n\n那你再想：假如现在大股东公告\"我要清仓式减持\"，你认为他能按现在这个价格卖出去吗？\n\n我告诉你，就算他不要了、全卖，也不一定能保证在原来的减持价位卖掉。 你之所以有\"我持有的股票随时都能卖\"这种错觉，是因为你的钱太少——你在整个市场里可以被假设为一个物理学上的\"质点\"：你没有任何体积，你对世界的体积没有任何影响。你这点东西买进卖出，对市场价格不构成任何影响。\n\n但你千万不要用自己这点钱的操作模式，去推演那些大钱的操作模式。\n\n所以，股票涨高了就一定有下跌的风险，因为一定会有人趁着高位赶紧变现。而这正是你变现的机会——否则你准备啥时候变现呢？你要是想着全部变现，它都会被打回原形。\n\n## 十、散户是个\"质点\"：河马进出池塘，蚂蚁冲浪\n\n市场是非常复杂的，你要理解量价关系。\n\n虽然你是一瞬间的事，但你的盈利和损失却受到大股东行为的影响。巴菲特在选接班人的时候，其中有一个很重要的条件叫\"理解机构的投资模式\"。我告诉你：作为一个个人散户，虽然你不按机构的模式去投资，但你一定要了解机构的投资模式——因为他在进出的时候，会给你造成损失，甚至也可以给你造成盈利。\n\n这就是我以前经常讲的：当河马进出池塘的时候，它引起的波浪，蚂蚁就可以冲浪玩了。\n\n我的投资模式哪也不是学来的，是我自己总结的。你不按机构的方式做，你也不用学机构、别动不动就要学巴菲特——但巴菲特的进出会影响你，这点你是要考虑的。你敢说过去比亚迪的上涨，一点没受巴菲特持仓的影响吗？\n\n## 十一、关于\"空铜\"那一手：我只是个观察仓\n\n今天嗓子有点哑，大家将就着听。这两天说话太有激情，一喊就哑了。\n\n有人问：你不是前几天空铜期货吗，现在不说了？还删帖了？\n\n我先说清楚：没删贴，而且我把那手空单挂出来了。 但你说\"删贴\"这句话我就很敏感——那你一定是从紫金矿业那边过来的。\n\n我也告诉你实话：我那一手空单，就是亏的。 你们可以把这个消息传到紫金矿业的论坛里，让大家都高兴高兴。\n\n但千万别模仿我。 我不愿意挂这些，原因就是你千万不要模仿我——我不建议你们这种业余选手去做期货，那个东西需要的知识水平更高。如果你是紫金矿业那边过来的，那你可以高兴了：我这单挂着呢，亏着呢。\n\n这一手空单对我来说只是个\"观察仓\"。我不加这一手，我对这个东西就很难关注。我以前讲过：我要干什么，得先买一手、先买一点，然后才能仔细研究、去观察——先持有，再研究。这是我个人的习惯，你们别去学。对我来说这一手就是为了亏损用的。\n\n顺便说，我即使空了铜期货，我依然不看空有色金属这个行业——这在你们看来很难理解，你也不用去理解，这是一个复杂交易。而且我现在还没准备大规模建仓，该出手的时候我会出手。\n\n另外，紫金矿业那件事、包括跟大黄老师那件事，就到此为止，以后不再提了。 大家也别去他的论坛底下替我争口袋。大黄老师研究有色金属各家公司的基本面非常有一套，如果你们还要投资有色金属，我建议你还是要关注他。 我的做法比较粗、偏于\"模糊的正确\"——我是散户的职业投资人，不是机构的职业投资人，我必须寻找最大的安全边际。我知道我的枪不准，所以必须把距离凑近、摸到身边再开一枪，而且得等大象出来。\n\n## 十二、铜：9 月 28 日定生死\n\n说正经的行情。\n\n你们知道美国加铜关税的最后决策期限是哪天吗？九月二十八号，就是下周一。\n\n你们想一想：一旦下周一特朗普说不加征关税了，铜会是什么局面？马上暴跌。 那如果他说加征关税呢？加征的期限是 2027 年 1 月。\n\n所以你再看新奥尔良那个美国仓库——现在已经非常紧张了。美国铜的库存，隐性的加上显性的，已经非常非常多了。\n\n而且这里有个关键：美国的问题是我们只能看到 COMEX 库存，实际的隐性库存还有很多，你看不见。 为什么？因为贸易商把铜拉到美国，并没有在 COMEX 期货市场注册成仓单——就像托克这种大的金属交易商，把东西拉过去不一定注册仓单，而是装在自己的仓库里。\n\n所以你现在看到的美国库存，只是 COMEX 的仓单库存，大概七十多万吨。实际的库存，要比显示出来的大得多。 究竟大多少？谁也不知道。\n\n但只要这个消息一旦确定，\"囤铜\"这件事就结束了——这就是\"买预期、卖现实\"。 即便关税从 2027 年 1 月 1 日才开始加，他也不可能再往美国运铜了，因为你再运，可能赶在 2027 年 1 月之前进不了美国海关——拿船运是需要时间的，你船期怎么安排？\n\n## 十三、你看到的库存只是冰山一角：工厂里的原料也是囤货\n\n大家把思路打开：赌美国加关税的，绝不只是仓单那点量。\n\n比如你现在是美国一家生产电缆的工厂，既然大家都知道要加关税、原料要贵了，你会不会多囤点原料？ 你会不会多准备点铜？这些原料就是隐性库存，你看不着，它是待在各个工厂里的。\n\n所以今天所有的\"货这么缺\"，实际上是个假象——都是被拉走囤起来的：有的囤在期货市场上，有的囤在贸易商仓库里，还有的存在这些工厂里面。\n\n不管怎么说，这事儿一旦尘埃落定，囤积需求就没了：不加，就不用再囤了；加，也不用再囤了，你运不到了、时间过了。\n\n那为什么现在中国的铜现货这么紧张、去库这么严重？因为有很多船本来已经从智利出来、准备拉到中国的铜，被美国人出高价，半路折回去了。 所以现在进到中国的铜矿石非常少，铜的加工费（TC）都到负二百了。\n\n而且现在中国的冶炼厂亏损很厉害——加工一吨铜还要倒找人家两百美元，再加上副产品硫酸也开始跌价。所以会出现什么局面？冶炼就不合算了，那就干脆停产。 停产意味着生产的铜变少了。\n\n但问题是：他生产的铜变少了，世界的铜变少了吗？ 你看看现在世界缺铜吗？美国的显性库存都这么高。\n\n## 十四、洛阳钼业那些年：我为什么在五块五卖掉\n\n现在有人说我\"卖飞\"洛阳钼业，还把我当年那个帖子翻出来了。他们只给你讲一半。\n\n我今天讲一讲。那是 2024 年年初的事——大家还记得\"雪球敲入\"吗？2024 年 2 月前后。\n\n雪球敲入你可以理解成一个很复杂的产品，简单说：当股票不断下跌，有人必须被动卖出，就有点像两融的平仓。 那时候最惨的是当时集中在小微盘里的雪球产品，一敲入，小微盘就大幅杀跌，中证 1000、中证 2000 指数跌得非常大。原因是当时买小微盘的人要用股指期货对冲，但两千没有股指期货，只有一千有——你在两千上买股票、却用一千的股指期货对冲，最后出现不匹配，就导致这些股票被动卖出、带动整个大盘快速下跌。那个时间大概是 2024 年 2 月 7 日跌到底。\n\n我卖最后一笔洛阳钼业，就是 2024 年 2 月的五、六、七号这几天，从六块多卖到五块五。\n\n我为什么要卖？因为洛阳钼业在这场风波里没怎么跌。 我卖它，是为了换跌得更多的——当时跌得更多、我非常看好的，是锡业股份，跌到十一块、十多块钱。所以我决定把全部洛阳钼业卖掉，换成锡业股份。我在有色内部进行腾挪。\n\n事实证明这是一笔非常成功的操作。你们自己去看锡业股份后来的涨幅就知道了——我也不多说，一说又变成推股了。\n\n后来锡业股份涨起来的时候，我经过一番扭转操作又卖掉了它，把洛阳钼业买回来——因为反弹的过程中锡业股份弹得比洛阳钼业快。这就是操作。再后来到 2025 年，洛阳钼业先涨得很快，我到十二块就把洛阳钼业全卖了，那笔钱买的是中国铝业，因为中国铝业当时还没涨。\n\n这期间我还买过云南铜业、山东黄金。山东黄金是因为 2025 年 4 月贸易战的时候，我融资爆仓了，最后没办法只能把山东黄金平仓卖掉——卖完以后它就涨。\n\n一直到今年 1、2 月，我从三亚回来，觉得不行了，一刀全部剁掉，我当时也跟大家说了\"我已经清仓\"。到今天我也没再买回来。前一阶段中国铝业快跌破八块钱的时候我想买，后来想一想算了——确定性还是不足。\n\n这就是我投资有色金属的整个过程。\n\n## 十五、我五年前的大逻辑，和下一个五年\n\n有人问：你怎么老是在有色金属里转？\n\n如果你是我的老粉丝，你一定知道：五六年前、2020 年的时候，我专门写过帖子说，未来一段时间我投资的重点就是\"通胀题材\"。 我就是认为美国解决不了今天的国债问题，它必须开动印钞机，所以一切的一切都是以通胀为基础的。\n\n而美国开动印钞机的时候，我认为中国的货币一定要紧跟美元——汇率要紧盯美元，也就是说美元宽松的时候我们也要跟着宽松，而且我们还要保护出口。所以我认为，未来无论美国还是中国，都会出现通胀。这就是我投资有色金属的基础逻辑。\n\n而这个基础逻辑，到 2026 年，随着沃什被提名为美联储主席，我开始逐渐转向；从中国这边看，现在也应该转向了——因为中国提出了一个新的理念，叫\"投资于人\"。\n\n明天晚上会员直播，我会专门讲一讲\"投资于人\"对整个未来五年投资的影响。未来五年我的投资基础逻辑，就是\"投资于人\"。\n\n你只要站对大方向，其实投资并不难；但如果你站错了大方向，再努力也不行。\n\n## 十六、上凉菜与上热菜：我在等那个强平的时刻\n\n大家总问我\"是不是要上热菜了\"。我说：\n\n上热菜的意思，不是上涨，而是大幅下跌——上热菜就是指\"杀融资\"，一旦出现强平，那就是上热菜。\n\n现在只是杀估值，就是估值过高，开始逐渐把估值回归。这个叫上凉菜。 估值逐渐回归合理，这叫凉菜。\n\n等估值杀到一定程度，有人开始挺不住了——就像当年雪球敲入那样，或者像 2015 年那样——就会出现融资盘爆仓。融资盘一旦集中爆仓，那个时候就是热菜：你会看到它急剧下跌、成交量放大。\n\n那个时候就是机会了。热菜上完，就是机会——你就差不多可以起来跳舞了。我现在就等着上热菜呢，它也不上。我闲得都没事干，跑期货市场做了一手空单，要不也太寂寞了。\n\n等上热菜那天开始，我就会把普通账户里所有的股票全部移到融资账户里去。 情况就是这么个情况。你让我预测太多的事，我不知道——我只应对，不预计。\n\n## 十七、\"吹醒行情\"：抱团股趁\"喜事\"出货\n\n今天科技股在\"吹醒\"。\n\n什么叫吹醒？东北农村有个习俗：你家办喜事，外面就有一帮吹喇叭的来给你吹。其实在旧社会，这就是要饭的——你家办喜事、老人做寿、生孩子办满月、办婚礼，仪式一开始，外面一大堆喇叭就吹上了，这就是来要钱的。一般来说，你给点小钱就把他打发了、他就走了；你要是不给钱，他就烂吹，吹得不成调，给你搅和——实际上就是讹诈。 但因为办喜事当天图个吉利，大家就给点小钱打发了。这个过程就叫\"吹醒\"。\n\n我说\"吹醒\"，是因为当年抱团股就是这样。 2021 年之后白马抱团，他们出货出不去——抱得太紧，已经没有买盘了，买卖都是他们自己，怎么出？所以他就趁着有\"喜事\"的时候出：比如开两会了，这个时候国家要维稳，股票市场平稳也得维持，这是\"增加人民幸福感\"——他这个时候卖，就有掩护。\n\n所以你一有喜事，他就来卖；他赌你必须得接，你不接，他就给你砸得不好看。这就叫吹醒行情。现在科技股干的就是这件事——他们也出不去。 那为什么现在\"吹醒\"呢？你自己就明白了。\n\n你没看昨天晚上美股大涨的时候，纳斯达克涨那么多天，早晨一片欢呼雀跃，都认为科技股肯定大涨——那你就明白了吧。\n\n## 十八、机会永远一样多，但理性的人永远缺\n\n股票市场最大的特点就是：永远都有机会，永远都不缺机会。 但我要告诉你，股票市场上永远缺的，是理性的投资者。\n\n不管你什么时候进场，机会都是一样多的。有人一进市场就想：\"我要是 2008 年跌到最底的时候进来就好了。\"我告诉你，那个时候进来的人，亏损率和今天是一样的，也不比今天更聪明、也不比今天更傻，都符合统计规律。\n\n那时候云南铜业才九块钱、中远海控才三块钱。可那时候买入的人，最后也拿不到现在。能拿到的人从来都是少数。\n\n你等十年以后——2036 年——新进来的人也会说：\"我当年怎么没在 2026 年入市呢？那时候遍地都是机会。\"人性没有什么变化，社会历史就是不断的轮回。\n\n所以进市场永远都不晚，机会都一样多。但有一样东西是永远都少的：散户的平均认知水平永远都没有进步。\n\n你别以为你现在有抖音了、有 AI 了、分析财务报表比以前方便了，就\"谁都唬不了我了\"——不是这样的，你亏损的概率还是一样的，因为大家在使用工具上都是均等的。\n\n最终能决定你的，是你自己和你自己的心理在博弈。 知识、信息、分析能力，这些最终都不重要——你最终是在和自己的贪婪和恐惧博弈。\n\n在股票市场里有一句古谚：在一个由盲人组成的王国里，你哪怕只有一只眼睛，你就能当国王。 你有一点点优势，就会在市场里体现出来。就是说这一只眼睛可能还是近视、还有点散光、还有点白内障，但你也比盲人强——你虽然什么都看不清，只要你有光感，你就比盲人强。\n\n## 十九、做股票的最高境界，是自己和自己斗争\n\n所以你不能走极端：一边说\"你既然预测不了明天涨多少，那还有啥用\"；另一边又要求\"你必须告诉我明天紫金矿业涨几块钱\"。\n\n你能分清原因和分不清原因，在关键时刻的看法是完全不一样的——这会影响你持有的信心、影响你对未来的判断。你有一点优势，它就有用。\n\n做股票做到最高端的时候，是自己和自己斗争：\n\n低点的时候一定非常吓人，你自己也很恐惧。你如何克服恐惧、下得去手买？买完了以后能不能拿住？这是你在和自己斗争。\n\n涨到高位的时候，一定所有人都告诉你不能卖、告诉你这公司还能大涨。你想卖的时候，你自己想到这个动作都瑟瑟发抖。\n\n就像今年年初，我要卖中国铝业的时候，那么多人这么信我，我一说这句，他都不卖。为什么？他们会说\"木匠叔以前都是对的，但这次有可能错\"。其实问题根本不在于判断，而在于你斗不过自己的心理。\n\n涨起来的时候，周围全是好消息，一定会激发你的热情，你现在就是斗不过你自己。你要说\"我现在就卖\"，你一定会觉得有非常强烈的不安全感。我告诉你，这种不安全感我自己都有。\n\n当我\"一刀剁下去\"的时候，我是非常强烈的这种不安全感。为了防止自己反悔，我就是一单挂出去——根本不给自己留后路。\n\n我现在都清晰地记得：我最后挂了一单，六十五万股，股价十二块九，一把卖没。 卖完我心里非常忐忑。这很正常，所有人都得经过这种训练，你没有别的办法。\n\n你也别以为这么卖很容易，非常不容易。卖完不舒服怎么办？我卖完就把这只股票从自选股里删掉——它再涨上去了我也不关注。卖错了就卖错了呗。\n\n## 二十、回撤就是亏损：你的钱和你赚的钱，没有区别\n\n最后一件事，很重要。\n\n记住：再低的时候敢买，再高的时候敢卖。差价赚到手，就是你自己的钱。\n\n没有什么\"挣的钱\"和\"我的钱\"的区别——没有哪张钱上写着\"这是我从家里拿来的\"、\"这是我挣的\"。钱只要进到你兜里，就都是你的钱。\n\n回撤就叫亏损。 在我心目中就没有\"回撤\"这个概念——只要大势没卖，那就是亏了。\n\n为什么你在回撤的时候不敏感？为什么你买进去一亏了就想跑，而高位下来的时候你都不想跑？因为高位下来的时候你心里想的是\"这是我赚的钱，反正少赚点无所谓\"，明天再少赚点还无所谓……一直亏到本金了，开始亏钱了，\"哎呀不行了，这是我的钱了，这亏了\"，咔嚓一刀割肉。大部分散户都是这么做的。\n\n你要是从上面下来就该这么想：中国铝业涨到十五以后，那钱就都是我的了，账上的钱都是我的；到十四，就相当于我亏损了；所以亏到十三的时候我就不能再留了，咔嚓一刀剁掉——这就叫止损。\n\n不然你就会想\"反正我是七块钱买的，现在十五没卖、跌到十四那就少赚点呗，我再等等，万一再回到十五呢\"——你们有没有人是这么想的？我想很多人都是这么想的。 所以最后你能把那个东西拿到亏损。\n\n你赚钱的时候怎么不这样？那不就是供了个貔貅嘛——只吃不拉。 你又吃又拉，你能赚着钱吗？\n\n你刚开始从高位下来的时候，都不认为那是自己的钱，所以你就丧失了警惕。什么时候变成自己的钱了？你买入成本那天，它就已经变成自己的钱了。 然后从成本再跌 20% 你开始闹心，跌 30% 实在受不了，一刀割完——然后股市就开始反弹了。 所有人都是这么玩的。\n\n## 二十一、我为什么拉黑你：我给你看的是真实世界\n\n顺便解释一件事：我为什么拉黑那么多人。\n\n我拉黑你，不是因为我不同意你的观点、也不是因为我看不上你——是因为你根本没法和我交流，我拉黑你对你也好、对我也好。 你的观点对我来说没有意义，就像三体人给地球人发的那个信息一样：你是虫子。 你还觉得自己的观点多有用似的，还想上我这儿来证明——我告诉你，在我心目中你就是虫子。\n\n所以我拉黑没有任何情绪，我看到那些抱怨\"我说了一句什么话他就把我拉黑了\"的，我心里都没有波澜。我所说的很多东西都是需要基础知识的。 他们说\"我早就取关他了\"\"他就是一天到晚宏观宏观来回讲\"——这些东西对我来说都不重要，因为我说的东西他看不懂，这很正常。\n\n经过我这么洗来洗去，能留下来成为我坚定粉丝的，一定都是自信的、一定是理解我说的话的。我说的话，本来就不是给所有人听的。\n\n还有一点：为什么很多人一进来就要拉黑我？因为他一定会。 因为我给他展现了一个真实的世界——这个世界是他不熟悉的，一定会引起他的恐惧感。他原来以为的那些价值取向、对这个世界的美好想法，在我这两天就给打破了：这个世界根本不是像你想象的那么运转的。 这跟他从小幼儿园老师、小学老师教给他的世界完全不同。所以我赌他在我这儿坚持不了三天，他就得把我拉黑。\n\n所以我增粉的速度最快，掉粉的速度也最快，这取决于我说什么：我写一篇长文章上了热门，那天就增粉；我对一些现实的东西进行无情的揭露时，也很快就掉粉。\n\n当然我也说了，你们能长期听我直播、能理解我写的东西，在受教育水平上，相对来说一定是高的——我不敢说每个人都高，但平均一定高。因为你否则一定不爱听我说的。我完全可以说话让老头老太太爱听，对我来说这非常简单——但我不会那么做，因为我不想坑大家。\n\n反过来，学历不高也完全不要紧：你只要好学、愿意思考、不经常带着情绪、能控制住自己的情绪，你什么学历都可以。我不是唯学历论，我是拿这个作为一个统计学上的比较——统计学上有意义，具体到个体就没有意义，就像抽烟平均寿命短，可也有人抽烟活到一百岁。\n\n最后说一句：\"文凭算个屁，不如市场赚钱\"——这话说得对，但也不全对。文凭是没什么用，但文化还是有用的。 你别把这话推广成\"文化算个屁\"——那就错了。文凭不重要，你是什么学校毕业的关系不大，你甚至小学都没毕业都无所谓，但你一定要肯学习、要有文化。\n\n## 二十二、收尾：明天晚上会员直播，讲\"投资于人\"\n\n做职业投资，其实是最好的职业，尤其对不愿意参加社交活动的人、对懒人来说，这是最好的选择。但你注意：虽然你只是靠决策、什么也不用干，可你必须保持足够的警惕——睡觉得睁着一只眼睛。这个市场太危险了，危机丛生。\n\n你以为的一切，都有可能是别人让你以为的。 别傻实在，听故事啥事都得先过自己脑袋先想一遍。总之一句话：少跟我扯犊子。\n\n所有东西都要具体问题具体分析——复杂的问题，没有简单的答案。\n\n今天我讲得挺好。明天白天不播了，大家不用等——明天晚上有会员直播，我不能播太多，嗓子受不了。而且我讲的一切都是评书，都是胡编乱造的，不能用来指导投资，别当真。我也不是专家，不是经济专家、股票专家，也不是投顾，你不能按我的说法来投资；我所说的所有股票都不是推荐。\n\n谢谢大家的陪伴，我要下播了。","toc":["一、开场：这两天雪球上的事，值得你认真想一想","二、\"人品\"这件事，本身就挺讽刺","三、黄金：央行买黄金是政治考量，不是要涨","四、黄金为什么没法估值：没有锚，也没有供求","五、\"乱世买黄金\"是句害人的口号","六、路径依赖：我那位赚了七倍的同学","七、万科的\"老柏树也有春天\"：卖万科买茅台，错过一整轮","八、什么叫风险：风险就是\"预计不了\"","九、为什么涨高了就一定有风险：获利盘要变现","十、散户是个\"质点\"：河马进出池塘，蚂蚁冲浪","十一、关于\"空铜\"那一手：我只是个观察仓","十二、铜：9 月 28 日定生死","十三、你看到的库存只是冰山一角：工厂里的原料也是囤货","十四、洛阳钼业那些年：我为什么在五块五卖掉","十五、我五年前的大逻辑，和下一个五年","十六、上凉菜与上热菜：我在等那个强平的时刻","十七、\"吹醒行情\"：抱团股趁\"喜事\"出货","十八、机会永远一样多，但理性的人永远缺","十九、做股票的最高境界，是自己和自己斗争","二十、回撤就是亏损：你的钱和你赚的钱，没有区别","二十一、我为什么拉黑你：我给你看的是真实世界","二十二、收尾：明天晚上会员直播，讲\"投资于人\""],"url":"https://www.bilibili.com/opus/1251112016199811081","bv":"","minutes":0,"chars":12285},"ai":{"title":"老木匠·2026年9月23日：铜关税落地、黄金逻辑与市场心理博弈","text":"## 一、今日盘面：芯片逻辑不要搞反，所有资产都在赌中美缓和\n\n1. 美股芯片涨，A股芯片不一定涨——逻辑是竞争关系\n\n他开盘后第一件事就纠正了一个常见误判：美股芯片涨是因为中美边际放开管制，这恰恰意味着国产替代需求下降，A股相关产业链反而承压。两者是竞争关系而非联动关系：\n\n你不要认为国外的这个芯片股涨了，我们的芯片股就会涨。你没看前一阶段国外和国内的芯片股两个是劈叉的，国外涨得多的时候，恰恰是我们跌的多。\n\n2. 所有资产都在赌同一件事：中美关系边际改善\n\n他把当天所有市场的涨跌归到同一条逻辑线上——无论是美股科技、美债、还是A股板块的分化，背后都是市场在提前押注中美关系改善的预期。他还指出，预期本身就能推动价格，不需要真实成交来支撑：\n\n如果有一天相关机构对外宣布准备大幅增持某类资产，你猜市场会不会马上就涨？这就是预期的作用。其实最终你可能压根儿不需要买，它起它就涨了。\n\n3. 长期国债上涨：市场在赌外部力量出手\n\n他对美债上涨的解读是：市场在预期掌握大量美元资产的主体可能边际增持美债。他认为这个主体对美债市场具有相当的影响力，这一点被很多人低估了。\n\n## 二、铜关税：月底落地，两种结果都是压力\n\n1. 关键时间节点就在月底\n\n他的逻辑和之前几场一致：加或不加，对铜价都是压力——加了，囤铜的人获利了结；不加，继续往美国运的逻辑消失。如果川普再次延期，大规模囤铜也越来越难持续，因为加息后财务持有成本在上升。\n\n2. 美国铜库存远比显性数字大\n\n他提醒大家不要只看交易所的仓单库存。实际上还有大量隐性库存藏在贸易商仓库和下游工厂里——工厂得知关税预期后提前备料，这些是看不见的。他的判断是：\n\n所以你今天所有的铜这么缺，它实际上是个假象，它是都是拉着囤积起来的。\n\n3. 为什么中国铜现货这么紧、加工费跌到负值\n\n大量原本运往中国的铜被美国高价截走，造成中国铜矿石来源减少，冶炼加工费跌至历史低位甚至出现倒贴现象，部分冶炼厂开始考虑减产。但他强调：中国冶炼减产不等于全球铜减少，当前的紧张是分布性问题，不是总量问题。\n\n## 三、黄金：没有锚、没有供求关系，本质是一种拜物教\n\n1. 黄金没有估值依据，任何价格都\"合理\"\n\n他说黄金是他认为最难分析的资产，原因是两个——第一没有锚定物，第二没有真实的工业供求关系，所有黄金几乎都是用来储存的。正因如此，没有办法对它进行定价：\n\n黄金说现在是4000、4300，这是不是一个合理价格？这是一个合理价格。现在是一万是不是合理价格也是。现在回到1000是不是？也是。它就是没有锚，你没办法对它进行估值。\n\n2. 巴菲特说开采金矿是荒谬的\n\n他转述巴菲特的说法：挖金矿的本质是把黄金从一个坑里挖出来，再挖一个坑把它埋上。这就是为什么巴菲特从不碰黄金——它不产生任何孳息，只是在不同的坑之间搬运。\n\n3. 黄金狂热是写在人基因里的拜物教\n\n他把人们对黄金的迷恋定性为一种集体心理现象，历史上周期性出现。上世纪亨特兄弟囤白银最终破产就是同样的故事。他说：任何资产一旦开始让人产生宗教感，就要开始警惕。\n\n4. 央行增持黄金是战略考量，不是看涨信号\n\n他纠正了一个市场误解：央行持续增持黄金，主要是出于资产多元化和降低对单一货币依赖的战略考虑，并不代表在看涨黄金价格本身。这两件事的逻辑不同。\n\n5. \"乱世买黄金\"不是说给普通个人的\n\n他对这个流行说法做了拆解：这个逻辑适用于有流通渠道和保管能力的大型机构或家族。普通个人在极端情况下持有实物黄金，反而可能带来麻烦。\n\n乱世你如果有黄金的话，你根本活不过乱世。有些东西都是似是而非、朗朗上口的口号，都是给你听的。\n\n## 四、路径依赖：找到了\"投资圣杯\"，是最需要警惕的时候\n\n1. 一个真实案例：靠白马股取得不错回报，最终却在低点离场\n\n他说起一个大学同班同学，早年通过持有茅台、腾讯、美团等白马股积累了不错的回报。他一直提醒对方：高端白酒是房地产的影子股，行贿领域里的\"硬通货\"，一旦房地产转向，这些股票的逻辑就会受到冲击。对方不以为然，最终在市场大幅调整后低位清仓，把资金拿去在上海买了房子。\n\n2. 路径依赖：越成功的方法，越容易成为负担\n\n他还提到雪球上的知名投资人\"老柏树也有春天\"——靠白马股成名，遭遇一次较大回撤后全仓换成某白马股，结果又错过了这一波其他行业的结构性机会。这就是路径依赖：靠这条路赚过钱，就以为它是唯一正确的路。\n\n3. 一旦形成信仰，危险就已经潜伏其中\n\n你在做股票的时候一定不能产生信仰。当你对某一种东西产生信仰，形成一定的路径依赖的时候，这对你来说危险就潜藏其中了。就是你天天走这条路，你走的越来越熟，越来越觉得没有风险的时候，风险可能就临近了。\n\n## 五、风险的正确理解：不是预测，是不确定性\n\n1. 说\"有风险\"不等于说\"明天会跌\"\n\n他澄清了一个被频繁误解的逻辑：指出某个资产有风险，不是在预测它下一个交易日会下跌，甚至它有可能继续上涨——但这不代表\"说错了\"。风险的本质是结果的不确定性，以及一旦风险事件发生时损失的可能规模。\n\n2. 涨幅过大本身就是一种结构性风险\n\n他引用了瑞·达利欧的判断来解释：账面市值不等于可变现的财富。当一类资产的持有者都积累了大量浮盈时，获利了结的潜在压力就已经存在，只是触发时机不确定。涨幅越大，潜在压力越大。\n\n你之所以有一个幻象说我持有的这些股票随时都可以卖，是因为你的钱太少——你在整个市场上是一个点，你这点东西卖出去或者买进来，对这个市场的价格是不构成任何影响的。但是你千万不要用你自己的这一点钱的操作模式去推算那些大钱的操作模式。\n\n## 六、股票市场永远都有机会，但散户认知水平永远不会自动进步\n\n1. 什么时候进场，机会都是均等的\n\n他直接打破了\"早进场机会更多\"的直觉：每个时期进场的投资者面对的机会数量是相近的，只是形态不同。他打了一个预言式的判断：\n\n你不信你再过十年回顾的时候，新进来的人就说我为什么当年没在2026年入市场呢？你看那时候遍地是机会。人性没有什么变化，历史就是不断的轮回。\n\n2. 工具更先进，但认知偏差没有消失\n\n他说现在分析工具更多、信息获取更快，但大家在使用工具上是均等的，信息优势很难持续。最终能决定结果的，是如何管理自己在极端情绪下的决策，这一点几十年来没有根本改变。\n\n3. 做投资做到最高阶，是和自己的心理状态博弈\n\n他说真正的难点不在于找到好的投资标的，而在于市场最悲观的时候敢于介入，大家都认同的时候有勇气离场。他分享了自己某次大规模出清一只持仓的细节：65万股一单挂出，挂完立刻从关注列表里删掉，不给自己反悔的机会。\n\n我卖完心里非常忐忑，你知道吗？我这都是很正常的，你必须得训练，那你没有别的办法。\n\n## 七、心理误区：高位回落为什么不愿意离场？\n\n1. 散户的典型心理路径\n\n他总结了一个最常见的亏损循环：高位回落时舍不得离场，因为心里觉得\"这是浮盈，少赚点无所谓\"；一路跌到本金附近才开始慌乱，情绪化割肉——然后市场反弹了。这个循环在各种市场里反复上演。\n\n回撤就叫亏损，知道吧？我心目中没有回撤的概念，只要当时没卖，那就是亏了。\n\n2. 他现在在等市场出现真正的流动性压力\n\n他把当前市场状态描述为估值修复阶段——部分高估值资产在慢慢回归合理区间。他在等的信号是：杠杆资金出现被动平仓压力，出现不分标的、大幅放量的集中出清，那才是真正有吸引力的介入时机。他的态度是：\n\n我只应对，不预计。\n\n## 八、有色金属投资逻辑回顾与新方向\n\n1. 多年前就形成的基础判断：通胀是大概率方向\n\n他说自己早在2020年就公开写过文章，明确判断：特定国家的债务问题没有快速化解的路径，货币宽松是大概率方向，通胀是结果。基于这个逻辑，他长期配置有色金属板块。\n\n2. 一笔被误解的换仓操作\n\n他还原了一笔曾被外界质疑的操作：当时在某个市场调整节点卖出洛阳钼业，不是因为看空，而是因为那只股票在当时的调整中跌幅相对较小，而锡业股份跌得更多，性价比更好，所以是换仓操作。外界只看到了\"卖出\"那一半。\n\n3. 逻辑在转变：通胀主线接近尾声，下一个五年看新方向\n\n他说随着宏观环境变化，他的基础逻辑也在演变。通胀逻辑的主要收益窗口接近尾声，下一个五年的结构性机会可能在与国内政策重点转移相关的方向上。他给出的总结是：\n\n你只要站对大方向，其实投资并不难。但是如果你站错了大方向，你这个投资你再努力也不行。\n\n## 九、散户和机构的本质区别：你是蚂蚁，不是河马\n\n1. 要了解机构的操作逻辑，但不必模仿\n\n他说理解机构的投资模式很重要，不是为了照着做，而是要知道大资金进出时对市场产生什么样的波动，以及这种波动对小资金意味着什么机会。小资金的优势在于灵活，可以在大资金引发的波动里找到借势的空间。\n\n当河马进出一个池塘的时候，它所引起的波浪，蚂蚁就可以冲浪玩了。\n\n2. 盲人王国里，独眼就能当国王\n\n他说不需要把所有事情都看得很清楚，只需要在某些关键判断上比多数人早一步或者准一点，就已经具备了超额回报的基础：\n\n在一个由盲人组成的王国里头，你独眼你就能当国王。这一只眼睛可能还是近视，还有点散光，可能还有点白内障，但是你也比盲人强——你只要有光感，你都比盲人强，明白不？","toc":["一、今日盘面：芯片逻辑不要搞反，所有资产都在赌中美缓和","二、铜关税：月底落地，两种结果都是压力","三、黄金：没有锚、没有供求关系，本质是一种拜物教","四、路径依赖：找到了\"投资圣杯\"，是最需要警惕的时候","五、风险的正确理解：不是预测，是不确定性","六、股票市场永远都有机会，但散户认知水平永远不会自动进步","七、心理误区：高位回落为什么不愿意离场？","八、有色金属投资逻辑回顾与新方向","九、散户和机构的本质区别：你是蚂蚁，不是河马"],"url":"https://xueqiu.com/2573414707/411383392","chars":3804},"topics":["路径依赖","黄金祛魅","风险与回撤","上热菜","铜关税"]},{"date":"2026-09-21","bili":{"title":"老木匠 2026年9月21日直播文字稿（模糊的正确、十二年十二倍、大逻辑、铜库存、AI安全谈判）","text":"## 一、开场：捅完马蜂窝，我躲进堡垒里\n\n周六我在论坛里捅了个大马蜂窝，量级可不小。这两天被骂惨了，各种难听的话都用上了——不过我把他们全拉黑了，一个字都看不着。\n\n我跟大家说这个事儿，不是让你们替我去争口袋。你们千万别去跟他们对骂，没意义。我让你们做的是观察：你去看看这种鱼情状态、这种情绪状态，跟这家公司未来的股价、跟它的筹码结构是什么关系。你要是哈哈一乐，什么也没记住，那我这一趟马蜂窝不就白捅了？\n\n也有人骂得很有修养，那反倒是个信号——说明筹码结构还没恶化。\n\n## 二、他们越骂我，筹码锁得越死\n\n这里有个严肃的道理，你们得听进去。\n\n一个人一旦开始对某件事丧失理智，他就会掉进\"自我证明\"的心理误区：他越骂我，越觉得自己特别有道理；越听不进去关于这件事的反面意见。 你越跟他对骂，他越认定自己是对的。反倒是你说一句\"你说的可能也有道理\"，他才会想，那我是不是也该考虑考虑。\n\n所以我的态度是：不争辩。我说错就说错了，错了就错了。你越争辩，越觉得自己英明神武，越觉得自己那套是天下唯一的真理。\n\n回到股票上——他们骂我的同时，其实是在把自己手里的筹码锁死。他们越骂，越觉得自己的筹码高大上；越看越觉得这公司好得不得了。这帮人互相一唱和，就形成了一个\"樊老木匠联盟\"：你看他说的不对，我也觉得他不对；你看这么好的公司，我也觉得这公司好。团结得紧紧的——谁也跑不了了。\n\n本来他们中间有些人是想跑的，现在跑不了了。没有共同敌人的时候，他们之间会起分歧：\"我觉得这不行了，挺不住了，大哥我先跑了\"，那是有可能出叛徒的。可我一出来，好嘛，一致对外，谁都不跑了。\n\n所以说，那些想出货的人，其实都该来感谢我。真正的人要出货的时候，有时候就是会利用这个——你以为人家出货都会夸这个东西好？不是的，有的时候说这东西不好，也是为了出货。做过生意的人都有这个经验。\n\n## 三、互相唱和，是我最害怕的指标之一\n\n我最怕的就是这个局面：股东们互相唱和。这是我最害怕的指标之一，尤其是它出现在高位的过程中，这么多人聚在一起给自己唱赞歌，太可怕了。\n\n所以我说，你们去看相关个股的帖子，就当看个笑话，学学人家怎么骂人。但别参与进去。这话我说清楚：在我这儿别提具体是谁、别提骂我的那些人——我说的是这个事儿，说的是一种状态。对具体的人，我直接拉黑就完了，懒得回。\n\n顺带说一句，现在雪球上你不骂我，反倒显得你不主流。我的意思是：想团结，就得树个共同的敌人。这是人性。\n\n## 四、三年涨五倍，在五倍买入：两年后 75% 的人腰斩\n\n讲个正经的。我在雪球上让一个朋友帮我测算了一个条件：一只三年涨五倍的股票，你在涨到五倍的那天买入，然后持有两年，看看盈亏状况。\n\n结果是这样的：这种情况下，75% 的人会亏损；而且这些亏损的人，平均亏损和亏损的中位数都在40% 左右。也就是说，一只三年涨五倍的股票，你在最高点买入，过两年，四分之三的人大概率都要腰斩。\n\n就这么简单。\n\n有的人不服，说我有基本面支撑，我研究过了，不会出现你说的那种情况。那你就错了——所有三年涨五倍的股票，背后都有基本面因素，没有基本面因素它涨不了那么多。而每个人在研究基本面的时候，都会高估自己对基本面的理解能力。买茅台的人认为自己最懂茅台，买科技股的人认为自己最懂科技股，最后结果都差不多，都是均值回归。\n\n真正能踩中伟大公司的人非常少。那得是万里挑一的公司，还得有大环境配合、大的产业结构调整对它有利——不是这些人会经营、懂技术就够的，关键是踩中时代的风口。万科从 1992 年上市到 2021 年的高峰，涨了一千多倍；格力也一样。可你能从第一天买入、一直拿到今天吗？\n\n所以拿长线不是不行，但不要从买入那天起就准备拿十年。那是动态的过程：今年看明年，明年看后年，这样才靠谱。说\"我买进来就准备拿十年\"，那是胡扯——\"我能看未来十年\"，那也是胡扯。\n\n巴菲特说，你不准备拿十年，就不要持有十分钟。但你要记住，巴菲特是看篮子的。你按他说的把鸡蛋放一个篮子里，那个篮子是他看的，不是你看着的；偷鸡蛋的人就是看鸡蛋的人。你能摊上巴菲特给你看篮子是你走运，可你大部分人摊上的是贾跃亭。\n\n## 五、别去参加股东大会：去了你就是蒋干\n\n千万不要去参加股东大会，甚至千万不要随便见公司的管理层。没有任何一家公司的董事长和管理人员是不懂得忽悠的，否则他坐不到那个位置。你跟他们一聊，你就上当了。你还不如看数据。\n\n这是当年一位做股票的老前辈告诉我的：你买哪个公司，都千万不要去接触它的董事长、总经理。接触完了，他给你一说，你这一辈子都卖不了了。\n\n我职业上给上市公司做过很多年法律顾问，这些我都懂。你们这些小白去参加股东大会，人家骗你们是最简单的。你去参加股东大会，就跟蒋干盗书是一样的——你以为费挺大劲跑一趟，这回我可拿到你们都不知道的消息了，我告诉你，那消息就是给你一个人准备的，就怕你不来。\n\n我举两个例子。当年酱油论坛上有一位意见领袖，天天讲千禾味业，零添加、天然酿造头头是道。我当时就说，你对酱油的理解，都不如我们村口卖酱油醋的小商贩。你买点酱油股票，就真觉得自己会酿酱油了？我说哪个人买酱油会去研究那玩意儿？后来那哥们儿没影了——千禾味业那时候快四十块，现在多少钱？中间腰斩过好几次。\n\n还有汤臣倍健，我当年也买过。它从收购澳洲那家益生菌公司开始，我就觉得这公司
