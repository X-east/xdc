入卖出都无所谓——一共没有几个人看我，另外看我的人他也不信我。所以我说无所谓，没有压力。\n\n现在不行。第一看我的人多，第二看我的人他信我——你看我次数多了、对的次数多了，你就信我了。你信我，我压力就大了。我说一个东西好的时候，我告诉你它好，你买入了，你也拿不住，然后就会给你造成很大的损失。我能做的事，你做不了。\n\n所以最后干脆就不说了。这么多人看着、这么多人信你，这事就不能说——我一说，即便我能挺住，你能挺住吗？完了最后就是天天到我这帖子下面要求我给你按摩。按摩的还算好的，最后挺不住的，给我一顿谩骂，然后拉黑我，我估计他也就是割肉跑了。这种事去年发生得太多了。\n\n那多了是好事吗？你的意思是我通过说个股让这些人来、让他们赔钱、我赚他们的钱？那我和那些杀猪盘有什么区别？ 我了解自己，这种事我干不了，干完了我肯定睡不着觉。\n\n这跟道德不道德没有关系，是我知道我自己是个什么货色——坏事我从小都没干过，不会干，干完了睡不着。我不敢的原因，不是说有人看着我，也不是说这事违法，是我对抗不了我自己的内疚感。\n\n人这一辈子，能干坏事这也是一个本事。你别以为你就能干坏事——你砸人家玻璃，回家你睡不着；人家砸完玻璃特别有快感。这真不是你觉得人家能干的事你就能干。\n\n我现在唯一追求的就是心态平和，然后争取活到芒格、巴菲特那么大的年龄。到那年龄还能给你们直播，那时候我就露脸了——反正都老了，谁也别笑话谁。\n\n## 十二、收尾：就当评书听\n\n今天本来没啥主题，不开盘，要是能评价评价市场我还有点主题，没主题就没啥可唠的。再唠下去口干舌燥，没有主题就没意思。\n\n我为什么现在总给你们直播？这也是一个考量——我脱离职场了，没有太多说话的机会，老不说话，这种来言去语的反应速度就变慢。 前一阶段我已经明显感觉到说话有一点不连贯了。\n\n老说呢，反正也就没有什么话题了，因为再说就重复了。你有来言我有去语，大家也别当真，就是闲聊。昨天有个小伙跟我掰扯法律问题，我说你就别认真，这个事你就闲聊一下——虽然他理解的并不对，但我也不想去讲过深的专业化的东西。\n\n我讲啥你听啥，就当评书一听。 能对你有帮助就有帮助，对你没有帮助你就可以取关。有帮助你也不用多感谢我，你就夸夸我就行了，说那老头说话挺有意思。\n\n我有些知识你们可能一辈子都接触不到——你要是不接触到像我这种不怎么正经的人，你听不着。 你老接触正经人，有些东西你就相当于一辈子都坐在观众席上看戏；我这种人多多少少会经常跑到后台看一看，我不满足于在观众席上看，我一定得跑到后台看看这些人是怎么飞的、风是怎么吹的。所以偶尔我就给你们讲一讲我在后台看到的。\n\n祝大家周末愉快，出去玩一玩，别老搁这儿听老头白话。你们年轻人不像我。再见。","toc":["一、房子贵不等于你有钱，那只是计价","二、AI 取代不了人，但它会制造一个分配难题","三、两次\"效率提高、农民遭殃\"：英国的羊吃人，大明的改稻为桑","四、不要美化资本，反垄断才是真问题","五、AI 这轮闭环，本质是多环节的庞氏骗局","六、今天的大学只教抽屉，不教衣橱","七、AI 竞争的终点不是技术，是制度","八、中美这场博弈，要站在董事长的角度想","九、你的股票是天大的事，只是因为钱在里面","十、先认识你自己是个什么货色","十一、为什么我现在不说个股了","十二、收尾：就当评书听"],"url":"https://www.bilibili.com/opus/1244868280480432130","bv":"","minutes":0,"chars":10647},"ai":{"title":"老木匠·2026年9月6日：AI的账与投资的三重境界","text":"## 一、房子和股票一样：账面财富不等于能花的钱\n\n1. 达利欧那句话，他觉得很关键\n\n达利欧提醒风险的时候说过一句很重要的话：在美国，资本市场大幅上涨后很多人财富增加了，但你不能花自己的财富，你最终只能花钱。\n\n他说这句话在中国同样适用：\n\n你在支付的时候不能花你的房子，只能花钱。你别看你人均财富很高、房子很贵，你实际上能花的只有钱——需要变现的时候，大家同时变现，这些房子是值不了这么多钱的。\n\n一个500万的房子和一个1000万的房子，当它跌到500万的时候，你的财富就减少了500万，但你什么都没有变——房子在计价上的价值，不等于变现价值。\n\n## 二、AI带来的通缩：这次的正课\n\n他借沃什的一个观点展开，说这是格林斯潘在2000年互联网泡沫时就有的判断。\n\n1. 先说机理：技术革命为什么会通缩\n\n所有的技术革命都有引发通缩的倾向。一方面是它提高了劳动生产效率，东西都会变便宜；另一方面，更重要的是它会让一部分人被剥离出劳动领域，大量失业，导致整体人群购买力下降。\n\n2. 关键的问题不是技术，是这部分人怎么办\n\n你如果什么都不处理这部分失业人群，社会上就会引发动荡——人不能让尿憋死，只要有人在的地方，他吃不上饭，就一定得想办法吃上饭。最后科技进步给人类带来的福利，会因为这种形式彻底消失殆尽。\n\n这不是技术问题，是分配问题——你怎么保证AI提高的劳动效率能惠及全民，而不是只让能干活的人继续工作、不能干的人直接失业。\n\n3. 历史上的两个先例：英国「羊吃人」与明朝「改稻为桑」\n\n他讲了英国工业革命初期的圈地运动：纺织业发展需要羊毛，资本大量收购农田改成牧场，原本种地的农民变得一无所有，被迫进工厂当工人，「当时英国工人普遍一天工作16个小时，工人罢工要求的是12小时工作制」。他还提到《大明王朝1566》里的「改稻为桑」——把稻田改种桑树养蚕产丝换白银，经济上划算，但农民没了地、吃不上饭，最终朝廷还是得花钱解决。\n\n这跟今天的AI人工智能发展是一个道理：把大部分老百姓推向失业，同时催生极大的财阀，这会引发巨大的社会问题。\n\n4. 他给了一个不太留情面的判断：大资本集团会成为新的「豪强」\n\n你看今天的马斯克、黄仁勋，未来都是麻烦。他们希望所有的工作都被AI替代——出租车司机被无人驾驶取代、数据中心把人顶得没有工作。但谁富裕了？大资本富裕了。谁受苦了？政府受苦了，因为这些人回家，就变成了社会问题，需要政府去解决。\n\n千万不要美化资本，任何资本扩张起来，都没有你们想的那么多道德感。这不是说私营企业一无是处，是反对「私营资本就没问题」这种说法。\n\n5. 反垄断为什么现在不管用了\n\n美国七八十年代把贝尔电话公司拆成七个小公司，那是反垄断的大手笔，那时候美国是真牛。但你看这些年反垄断有什么成功案例？英伟达发展到多大了？苹果的生态链也没人反垄断——这说明大资本集团已经可以对抗政治了。\n\n6. AI产业链：他直接把它定性为庞氏骗局\n\n从算力公司到大模型公司，这是一个闭环的多环节的庞氏骗局，你们一定要知道这一点——起码到今天还是。如果真搞出了东西、成功了，未来可能可以解决这个问题；但如果稍有闪失，就会酿成巨大的社会问题。\n\n他把这和当年的高端白酒类比：\n\n白酒是个双循环的庞氏骗局——卖酒买股票，买股票赚的钱再去买酒，酒和股票都越来越贵。英伟达玩的是多环节共同参与的方式：黄仁勋投资大模型，大模型买算力，算力公司建数据中心，数据中心买黄仁勋的芯片——那黄仁勋的钱最终从哪来？从投资者这儿来的。他的需求都是人造出来的，所以股票才一直在涨。\n\n他提到可以参考标普关于这类循环融资的报告，也提了一句对高志凯「美国将有金融危机」说法的态度：大方向没问题，但具体时间他不敢说那么准确，因为没有可靠数据。\n\n## 三、投资的三个阶段：基本面、博弈、你自己\n\n这是他这场给出的一个总结性框架。\n\n1. 第一阶段：研究基本面\n\n你刚开始做股票，研究的是股票本身——一年产铜多少、挖矿挖多少、挣多少钱，这是最初的阶段。\n\n2. 第二阶段：研究博弈\n\n你研究完基本面会发现，基本面再好也可能不涨，因为没有人买。没有人规定基本面好就一定涨，股票的涨跌最终是买卖双方博弈决定的。\n\n3. 第三阶段：研究你自己\n\n你研究明白博弈了，还是赢不了——因为股价特别低的时候，你自己不敢买了，这是你自己的问题，不是博弈的问题。\n\n你嘴里念着别人恐惧我贪婪，而实际上你就是别人——别人恐惧的时候，最终你也会恐惧。你最终要解决的是自己的恐惧和贪婪，这才是最高阶段。\n\n他还讲了这三段和心法的关系：\n\n心法就是身心合一：无论涨跌，你都能保持理性和平和，不能心跳快、血压高、呼吸急促、浑身冒汗、晚上睡不着。你为什么一学就懂、一用就废？因为你没有解决自己的问题——你都知道低买高卖，只是低的时候拗不过自己，高的时候也拗不过自己，你用感觉代替了理性思考。\n\n他也提醒这是循序渐进的：\n\n这是高端武功，你不从扎马步开始，就想学降龙十八掌是不行的。\n\n## 四、上周五那波跳水与芯片股上涨：又一次带不确定性的猜测\n\n他反复强调这段纯属猜测，「没有信源，只是自己的推理，你别当真」。\n\n1. 他觉得蹊跷的地方\n\n上周五下午科技股开盘跳水非常明显，同一时间人民币在快速升值，这个时点冲的那一波也非常明显。而美国那边，在非农就业数据大超预期的情况下，芯片和光模块却突然大幅上涨。你们不觉得这事儿蹊跷吗？\n\n2. 他的猜测：中美贸易代表团这段时间往来频繁\n\n美国的贸易代表团今年已经来中国三次了——一次在特朗普来华之前，一次在七月，这是第三次。公开报道就那么几条，我拼命找也找不到更多消息。\n\n他给出的猜测是可能在半导体芯片方面有缓和，但明确说明：\n\n这只是通过蛛丝马迹做的一个逻辑判断，起码逻辑是对的，但准不准我也不知道。你要跟我掰扯这个，直接说我不懂，那我就拉黑；正常说不同意这个判断，这都是正常交流。\n\n3. 「半渡而击」：他认为对美国最有利的策略是什么时候放开\n\n对老美最有利的方式就是放开——但不是现在放，也不是等你国产替代都做出来了再放，是半渡而击：你搞国产替代搞到一半、钱投进去了产品还没出来的时候放开，这是最好的时机。你要是等他都搞出来了，你再放开就没用了，两边已经是竞争关系了。\n\n4. 看问题要用「董事长思维」，不是「工程师思维」\n\n你做科技股，要从董事长的角度考虑问题，而不是从技术工程师的角度。工程师考虑的是技术怎么做得更完美；董事长考虑的是技术再完美，东西卖不出去，狗屁用没有。\n\n说「美国自己都不够用，不可能放开」，这是工程师角度。你要从董事长角度问：美国用这些东西建数据中心、生产大模型是为了干啥？最终是要卖给中国的——你把芯片直接卖给他，连大模型的钱都挣回来了，哪有什么够用不够用，看你给多少钱。\n\n他打了个比方：「你卖鸡的，有人只要买鸡脑袋，出的钱比整只鸡还贵——人家说摆在家里辟邪。生意就是交易，没有什么够用不够用，关键是给多少钱。」\n\n5. 关于「谁能救美债」，他讲了一句很直白的话\n\n中国现在不仅能救杨白劳，也能救黄世仁——中国账上外汇储备三万多亿美元，加上这些年顺差里没结汇、还在企业手里的美元，你算算有多少。你现在美元倒了，第一个受损的其实是中国，因为我们是在美元作为统一货币的基础上发展起来的国际贸易。世界上没有「有仇」这回事，只有利益。\n\n人民币结算替代美元，这不是十年二十年能算完的事，得用五十年的时间长度才能平稳过渡。\n\n## 五、他为什么不再点评个股\n\n这是他借着「不聊行情」的这天，重新解释了一遍这个立场。\n\n1. 粉丝少的时候和现在不一样\n\n原来粉丝少，我说什么个股买入卖出都无所谓——一共没几个人看，看的人也不一定信我，没有压力。现在不行，看的人多，而且他信我——因为你看我说对的次数多了，就信我了，我压力就大了。\n\n2. 他不愿意承担的那个后果\n\n我说一个东西好、你买入了，你也拿不住，会给你造成很大损失——我能做到的事，你不一定做得到。所以我干脆就不说了。\n\n他还回忆了去年确实点评过个股时的情形：「天天有人在帖子下面问某只股票怎么办，如热锅上的蚂蚁——我天天得给你们按摩，最后他挺不住了，割肉跑了，再骂我一顿拉黑。」\n\n3. 他把这个和「杀猪盘」划清了界限\n\n如果我通过说个股让这些人赔钱，那我和杀猪盘有什么区别？我不敢干这种事，不是因为怕别人看着我，是我对抗不了自己的内疚感。","toc":["一、房子和股票一样：账面财富不等于能花的钱","二、AI带来的通缩：这次的正课","三、投资的三个阶段：基本面、博弈、你自己","四、上周五那波跳水与芯片股上涨：又一次带不确定性的猜测","五、他为什么不再点评个股"],"url":"https://xueqiu.com/2573414707/408222548","chars":3455},"topics":["AI通缩与分配","圈地运动","反垄断","中美博弈","炒股三段"]},{"date":"2026-09-05","bili":{"title":"老木匠 2026年9月5日直播文字稿（幸存者偏差、长期持有、非农超预期、加息、AI含科量、船周期）","text":"## 一、开场：少情绪，多理性，别搬运骂声\n\n背后有人骂我，第一你别把骂我的话搬给我看，那是恶心我；第二也别为了维护我去怼他。普通人赚钱的唯一途径，是让自己成为一个不普通的投资者——所有问\"普通人靠什么简单方式赚钱\"的人，都暗含一个假设：我既不想学也不想进步，你直接告诉我怎么赚。没有这种方式。\n\n一句话要刻在脑子里：复杂的问题没有简单的答案。\n\n为什么很多人容易被洗脑、容易亏？因为他们表达的全是情绪。一段话信息量是一百，他们连十都接收不到，只抓住某一个词就开喷。世界怎么运行和你的情绪毫无关系，你需要做的是在\"理性\"和\"规律\"之间建联系，而不是在\"情绪\"和\"规律\"之间建联系。有个小法门：把注意力放在头部就相对理性，放在胸部就感性——发表观点前把内生注意力移到脑部，你就冷静了。\n\n## 二、幸存者偏差：长期持有不是万能钥匙\n\n现在最时髦的说法是\"持有资源股是最好的赚钱方式\"，就像二一年之前所有人说\"持有白酒最好\"。老木匠的结论很直接：长期持有一类或一只标的而赚钱，基本都属于幸存者偏差。\n\n没有人能看十年。站在 2016 年（年初熔断、每天只交易十分钟就跌停）那个时点，你预计得到 2018 贸易战、2020 疫情、2021 地产见顶、2022 OpenAI 吗？全都预计不到。今天的股市格局，和这些东西有绝对大的因果关系。\n\n你持有紫金矿业赚了很多，那只是你幸存下来；问你如果持有的是乐视、康德新、康美药业怎么解释？\n\n二一年之前最著名的单调茅台者\"乐趣\"赚了大钱，他跟\"买彩票中大奖的邻居\"没有区别——你没看到的是那些持有康德新的人。\n\n中国远洋的故事最扎心：他从 25 块开始买、补到 3.9，2014 杠杆牛涨到 17 却八九块就卖了，七年只搞个保本；而一个朋友 3.9 满仓单调，涨到 17 时浮盈约 7000 万没卖，后来又跌回 3.9 仍没卖，直到疫情航运爆发才真正赚到。盈亏同源——你曾成功的东西会形成路径依赖，下次亏损可能正源于此。\n\n当年坚信\"长期持有高 ROE 消费白马\"的人，2021 之后被彻底打破：五粮液从 400 跌到 70，长春高新、爱尔眼科、中国中免一路崩。不仅亏了钱，还失去了最重要的东西——机会成本。\n\n老木匠不反对长期投资，只是提醒：别把复杂问题简化成一个公式去迷信。\n\n## 三、自我降维：别只盯一个因子\n\n有色金属的拥趸有个通病——只看供需关系，这叫自我降维。影响价格的因素实在太多：\n\n美联储加息加不出铜矿，但可以把铜的需求加没、把铜价加下去。\n\n铜需求之所以在房地产基建趋缓后还能涨，是因为突然有了 AI 这条线（数据中心→电网电源建设→铜铝需求）。这条线站在 2016、甚至 2021 的时点上都预计不到。\n\n2021 年有色、白酒、地产同在那一年见顶，因为中国房地产周期见顶 + 美国开始有加息预期。\n\n影响股价的是宏观经济、行业涨落、自身周期、近期业绩多维度叠加。你只抓其中一个，就是自我降维。\n\n## 四、非农数据超预期：你是怎么一步步被洗脑的\n\n小非农不及预期时，所有主播都给你灌输\"大非农也一定反向、是利好\"。结果昨晚大非农不仅不是不及预期，而是大超预期，还把六月七月数据上修。黄金、风险资产没跌，半导体还涨。\n\n于是话术立刻转向：\"利空出尽是利好\"\"加息也不影响美股\"。老木匠拆穿这是先射箭后画靶——逻辑来回变，永远能自圆其说。\n\n阴谋论（\"数据都是编的\"）站不住：如果编，为什么两次编的方向相反？美国体制也不支持系统性造假——一件事参与密谋的人太多一定泄露（重谋必泄）。数据不严谨有可能，按目的去编不可能。关键结论：不管数据真假，你的逻辑不能变来变去，否则永远得不出正确结论。\n\n## 五、美股上涨另有原因：芯片股与中美缓和\n\n昨天美股涨的主要是芯片、存储股（都曾禁止出口中国）。老木匠的猜测：中美在芯片贸易上可能有缓和。依据有三：\n\n1. 人民币对美元出现一段快速升值，说明有先觉资金在建仓；\n\n2. 美国参议员戴恩斯刚结束访华离开；\n\n3. 消息影响价格分两波（内幕资金先买→扩散到第二圈层再买），像讲笑话有两波笑声——第一波是最快懂的人，第二波是反应慢但听懂的人。\n\n反直觉的一点：美国芯片股涨，对中国芯片股是利空。周五下午 A 股科技股那波蹊跷跳水，或许就有人先知。映射到 A 股时务必分清底层逻辑——有时是\"协同\"（产业大发展，如 AI 投资带动），有时是\"竞争\"（如美国对美铝加税利好美铝却利空中铝）。美铝涨，中铝不一定跟。\n\n## 六、特朗普在演戏：角色与真实立场\n\n非农后特朗普喊降息、威胁停止与逆差国贸易。老木匠点破：老特唯一想的是中期选举获胜、以及多赚钱；他最爱的是\"自己能掌握的波动\"。\n\n他说降息是演角色给选民看——就像律师必须为当事人辩护、检察官必须指控，那是角色，不是真立场。鲍威尔（沃什）凭什么听特朗普？特朗普两年就下台，美联储主席任期十六年。沃什多次表态：我只看物价指数。 所以真正关键的是下个月（9 月 11 日前后）公布的美国 CPI，它可能再给你一次惊喜或惊吓。\n\n## 七、乱纪元：判断不了就别冲进去\n\n现在美国内部、美联储内部的博弈都很激烈，是个乱纪元。你试图判断未来走向去战胜市场，会要命。\n\n打个比方：一大群人打群架、风险最大的时候，你根本判断不了，别非要冲进去——可能被自己人打死；等他们打完了剩几个人，你再进去捡点东西。对加息降息，你现在既判断不了加也判断不了降，这就是混乱，混乱就是风险。\n\n敬畏知识：美联储的提名、机制、点阵图不是玩闹，2008 年以来的全球牛市就来自美国 QE。加息冲击最大的是资源类和长久期科技（成长）股；消费、医药、公用事业相对影响小。AI 基建是中美都在烧的巨额开支，谁停谁输，这也是美国国债收益率不断攀升的原因（AI 与美国政府在争资金）。\n\n## 八、AI 竞争与\"含科量\"：中国不赢也行，别被拉太远\n\n真正的科技圈认为中美 AI 差距仍大（算力基础设施、大模型迭代）。老木匠的信心来源不同：中国压根不想赢，只要保第二、别被拉太远，美国就输了——就像跑一万米，你别拉我一圈，拉三五米十来米我能跟上，我是第二也行。\n\n美元最后一次支撑来自高科技（很多东西只能在美国买到，如芯片）。如果 AI 领先差距缩小，支撑美元购买力的东西就没了，美元信用会下一个台阶。所以必须搞科技牛市、提高股市\"含科量\"——哪怕高溢价发行（管清友在批），和中美 AI 竞争比都不在一个量级。这是必须付的代价。\n\n## 九、船周期与猪周期：关注但不推票\n\n昨天造船股放量大涨、逼近涨停，一定有大资金先知建仓。老木匠一直说船周期没有结束，有闲钱可以\"只输时间不输钱\"；近期干散货运价指数涨很多，中国造船不受美国航运弱的影响。\n\n猪周期也没结束（有人胡说结束了），再来时该买的是\"中友\"（不是老二）。他强调：自己目前不持有，不是推票——话说完变成推股票就变味了。\n\n## 十、收尾：少情绪、多幽默、低买高卖\n\n唠嗑是锻炼智力、防老年痴呆最好的方式，五十岁后千万别沉默寡言。发帖多还有个好处——筛选粉丝：气哼哼的人看不过来就取关，正中下怀。\n\n关于背后议论：当面说你直接拉黑；背后说与你无关，皇上背后还骂三声呢。最该防备的是中间传话的人——说你的那个人是正常人，传话的有目的。\n\n投资是来赚钱的，赚钱之余保持乐呵。最后那句要印在骨子里：低买高卖。不是你不知道高低，是低的时候不敢买、高的时候不敢卖。每一个进股市的人都赚过钱，最终还回去，就是因为没实现低买高卖。","toc":["一、开场：少情绪，多理性，别搬运骂声","二、幸存者偏差：长期持有不是万能钥匙","三、自我降维：别只盯一个因子","四、非农数据超预期：你是怎么一步步被洗脑的","五、美股上涨另有原因：芯片股与中美缓和","六、特朗普在演戏：角色与真实立场","七、乱纪元：判断不了就别冲进去","八、AI 竞争与\"含科量\"：中国不赢也行，别被拉太远","九、船周期与猪周期：关注但不推票","十、收尾：少情绪、多幽默、低买高卖"],"url":"https://www.bilibili.com/opus/1244537945952616456","bv":"","minutes":0,"chars":3089},"ai":{"title":"老木匠·2026年9月5日：幸存者偏差与乱纪元里的加息猜测","text":"## 一、长期持有是最好的方式吗：警惕幸存者偏差\n\n1. 先给一个反问：十年前是哪一年\n\n我不相信有一个人可以看到产业状况的未来十年。你知道不知道十年以前是哪年？我告诉你，十年以前是2016年。\n\n你穿越回2016年，我问你几件事：你预计到了2018年的贸易战吗？你预计到2020年的疫情吗？你预计到2021年之后房地产走下坡路吗？你预计到2022年出来个OpenAI吗？\n\n我告诉你，所有这些东西你都预计不到，但今天的股市格局，却都和这些东西有绝对大的因果关系。十年是很长的，不要轻易断定自己能看十年。\n\n2. 幸存者偏差：你看到的都是活下来的那个\n\n你家邻居买彩票中奖了，你会不会推导出买彩票是发大财的手段？你看到的恰好是中奖的这个人，因为没中奖的人千千万万，比中奖的人多得多。\n\n持有紫金矿业这么多年赚钱了，那只不过是你看到了幸存下来的这个人。你如果持有的是乐视呢？你们只知道乐视网，那你知道不知道暴风影音？\n\n他还提醒不要把例子当成个股推荐：\n\n大家不要去讨论那个个股，拿这些个股是来给你举例讲道理的，你不要套用，我不是给你荐票的。\n\n3. 他自己「拿不住」的中国远洋：一个完整的对照样本\n\n他讲了自己当年从25块开始买中国远洋（当时市盈率约5倍），一路补仓补到3.9块（市盈率2.7倍），「绝望到从此再也不做这种事」。后来赶上2014年杠杆牛，从3.9块涨到十几块，他大概八九块就卖了，前后耗时七年，勉强保本略赚。\n\n而他的一个朋友是从3.9块开始买入、全仓单吊，一路拿到17.9块都没卖，后来2015年股灾又跌回3.9块，依然没卖——「你知道不知道多少人都挺不了这个过程？你股票可能在，人可能不在。」他说这位朋友当时最高浮盈大约7000万。\n\n你想一想，你能不能受得了这件事？你们现在把自己带入进去。\n\n后来疫情来了，中国远洋重整为集运公司，赶上美国进口需求暴涨，股价又冲上了21块，「但我告诉你，他后来再也没有拿到17了，不过他还是在这只票上赚了很多钱」。\n\n你现在回看一下爱尔眼科、长春高新、中国中免、五粮液——五粮液从150涨到400，现在只有70。你曾经确实靠持有赚过钱，但持有到今天，你不仅在这只票上亏了钱，还失去了一个最重要的东西，叫机会。\n\n4. 所以他的结论：不是不能有信仰，是不能把复杂问题简单化\n\n不能说不能有信仰，是你不能信誓旦旦把一个复杂的问题简单化，变成一个公式。你只看ROE，或者只看分红，这都不对——一个股票的价格受宏观经济、行业涨落、行业周期、最近经营业绩等太多维度影响，你只看其中一个因素，这就叫自我降维。\n\n有色金属的拥趸也是一样，只看供需关系，这就是自我降维。加息加不出来铜矿，但加息可以把铜矿的需求加没——加息可以把铜的价格加下去。\n\n他还用2021年做了个前后对照：那一年地产、白酒、有色金属都在同一年见顶下跌（地产政策收紧+美国加息预期），此后唯独有色金属重新爬起来——原因是两年前根本没人能预见的两条线：AI数据中心带来的电力需求，以及特朗普二次上台后美元信用变差、各国央行增持黄金。「你在2021年能预计到这些吗？」\n\n## 二、非农就业数据大超预期：怎么拆穿「数据是编的」这种阴谋论\n\n1. 他先复盘了舆论的两次反转\n\n小非农数据不及预期的时候，所有人都说这是在为不加息、降息做铺垫；结果这次非农大超预期，还把六七月的数据都上调了，这些人又开始说利空出尽是利好了。\n\n这就跟先射箭后画靶子一个道理，你怎么解释都对，但逻辑是不对的，没有结果。\n\n2. 他反问那些说「数据是编的」的人\n\n上次小非农不及预期的时候，你们是不是也认为是编的？那既然都是编的，为什么编的两次方向不一样？说大超预期是瞎编的，那不及预期是不是也是瞎编的？\n\n如果他是按目的编数据，那他今天为啥要编一个让自己麻烦的数据？直接编个新增两万、再把上月下修一下，直接降息不就完了？他没有理由编一个不利于自己的数据。\n\n3. 「众谋泄」：参与的人太多，密谋是保不住密的\n\n美国整个统计系统，系统性造假需要多少人参与？中国古代讲众谋泄，一件事参与密谋的人太多，一定会泄露。你怎么防止这些人不把消息卖给彭博社？\n\n他的结论是：数据统计过程不够严谨、不够认真，这是可能的（尤其这一届政府比较「草台班子」）；但按某个目的系统性造假，在美国的政治机制上支撑不了。\n\n4. 别拿自己的生活经验去否定统计数据\n\n很多人说GDP是假的，是因为从自己的生活经验、自己的工作或者开的饭店不景气来判断的。我如果用自己身边朋友的情况来判断房地产，我比现在还要悲观——我不认识一个家里只有一套房子的人。\n\n这种想法来自于信仰，而不是实证。你要昨天说房地产数据在哪查都不知道，还问我数据从哪来，那说明你已经先有了看法，不在乎数据本身。\n\n## 三、一次带着不确定性的猜测：芯片股为什么涨\n\n他反复强调这一段是「猜测」，不是判断，让大家「别当真」。\n\n1. 他先否定了「利空出尽是利好」这个解释\n\n利好利空出尽是利好，那为什么昨天道指和纳指最终都是跌的？你给我解释这事儿。\n\n他观察到的实际情况是：只有芯片股、存储股在涨，而这些股票此前受到对华出口管制，涉及能否重新卖到中国这个全球第二大市场的问题。\n\n2. 消息扩散会有「两波」——他用讲笑话打了个比方\n\n一个核心消息一旦成为公开消息之前，对市场行情的影响会分成两拨：最早知道消息的人先建仓，然后消息扩散到某个圈层周边，第二波人再建仓。\n\n这就跟你讲完一次笑话，全场会有两波笑声一样——第一波是反应最快、最先听懂包袱的人，第二波是反应慢但也听懂的人，没笑的人压根没听懂。\n\n他把这条用在人民币汇率上：「前一阶段人民币对美元出现过一段快速升值，这说明有先觉、有消息的人已经开始建仓了。」由此他猜测中美在芯片贸易上可能有缓和，但明确说「这是我的猜测，没有信源，别当真」。\n\n3. 同一件事：协同关系 vs 竞争关系\n\n美股上涨会不会映射到A股，取决于底层逻辑：如果是产业大发展（比如AI投资带动芯片），那是协同关系，会映射；如果是竞争关系，就不一定。\n\n比如铝加50%关税，只会让美铝受益，其他炼铝企业反而受损——因为进口铝变少，等于刺激了美国国内的铝生产。你必须先搞清楚昨天的涨是协同还是竞争造成的，才能判断今天会不会跟涨。\n\n## 四、特朗普和沃什：每个人都要演好自己的角色\n\n1. 别把特朗普喊话当成真事儿\n\n非农数据超预期后特朗普又喊话要降息，还说了些前后矛盾的狠话。老特唯一希望的是中期选举获胜，如果选举也没希望了，他唯一想的就是多赚点钱——剩下什么「美国必须加息/降息」，那都是你们自己加给他的戏。\n\n你别把老特在角色上演的戏当成真事，那是演给选民看的。他说了多少次要鲍威尔降息，鲍威尔降了吗？\n\n他还用律师角色做了个类比：\n\n律师在刑事案里的角色就是辩护，你得说他没罪、罪轻，这不代表你不知道真相；检察官的角色就是说他有罪。每个人都有自己的角色，要完成自己的角色。\n\n2. 沃什要演的角色，和特朗普完全不同\n\n沃什的作用在于维护美元的信用，他甚至要改变美联储的机制。他为什么要听特朗普的？特朗普再过两年就下去了，沃什有十几年任期。\n\n他重申了哈塞特没被提名的原因：「哈塞特当年就表示只要去了马上降息、一年降100个基点，但他在参议院提名委员会根本过不了。」\n\n3. 接下来最重要的日子是9月11号的CPI\n\n沃什已经多次表态他只看物价指数，所以9月11号公布的CPI才是最重要的。上次小非农出来大家都认为不能加息了，我说加息这件事没有过去；这次非农超预期大家又认为要加息了，我告诉你CPI仍然有可能再给一次惊喜或者惊吓。\n\n现在是一个乱纪元，你现在既判断不了加息，也判断不了降息，这就是混乱，而混乱就是风险。\n\n他重申了应对方式：\n\n这就相当于一大堆人在打群架，你非要冲进去，有可能被自己人打死。你为什么不等他们打完了、剩几个人的时候再冲进去，或者等他们都打累的时候进去捡点便宜？\n\n你说加不加息都无所谓，那就是把这个问题简单化了。你知不知道从2008年到现在，整个世界股市的牛市是从哪来的？是美联储QE来的。你以为沃什是阿猫阿狗？\n\n## 五、加息的影响面：谁受伤最重，谁最安全\n\n1. 受影响最大的两类\n\n加息冲击最大的一个是资源类，一个是长久期的科技成长股，这是基础知识——长久期股票依赖融资，融资成本一变，估值模型全要变。\n\n对资源类的影响有两方面：第一影响美元购买力、反映到价格上；第二影响产业热度，加息后产业需求降温，对资源的需求就会变少。\n\n2. 受影响最小的几类\n\n消费类、医药类、公用事业类相对来说影响都比较小，因为这些跟加息降息的关系不大。\n\n3. AI基建正在和政府「抢钱」\n\nAI基础设施建设需要大量烧钱，这钱得从老百姓储蓄来、国家投资来、国债来、投资者的股票来——因为AI公司自己不能产生现金流。两国都在烧，谁都停不下来，因为谁停下来就输了。\n\n科技公司的AI投资，原来靠自己现金流，现在变成需要额外融资了——这是美国国债收益率不断攀升的原因之一，AI基建已经在和美国政府争夺资金了。\n\n## 六、中美AI竞赛：中国不需要赢，只需要不输太多\n\n1. 真正懂行的人怎么看差距\n\n真正的科技界从业人士（不是投资圈的科技研究员）认为，中国和美国在算力基础设施、大模型迭代上还是有很大差距的。\n\n2. 但这场竞争对中国比对美国简单\n\n中国压根不想赢，也不用赢，只要保证不输、别被拉下太远就行。这就像跑一万米，你只要落后我几米、十来米，我能跟上就可以了——我是第二也行，但美国就输了。\n\n如果这次美国没能把中国拉下太远，美元最后的这个支撑就彻底没了。因为美元的购买力现在很大一部分靠的是「有些东西只能在美国买到」，比如高端芯片；一旦AI和芯片上的代际差距不再明显，这个支撑就没了。\n\n3. 所以「含科量」这件事，再不合理也得做\n\n为什么中国这么下血本也要搞科技牛市，为什么天天喊含科量——你无论今天看到多么不合理的现象，我告诉你它都是对的。这是我们必须要付出的代价，这件事和中美AI竞争相比，根本不在一个量级上。\n\n我对科技没有敌视，我只是不想让自己成为贡献者。\n\n## 七、几个具体板块的位置（他强调都不是个股推荐）\n\n1. 造船：他没说全周期结束了\n\n很多人问我造船的全周期结束了没有，我一直说没有结束。现在有波动，如果你有闲钱，很可能是只输时间不输钱。\n\n对当天造船股放巨量快涨停，他的猜测是「一定有人知道了什么消息，或者有大机构在建仓」，也可能跟某些加税传闻的缓和有关，「但那个事儿没有实质影响」。他提示了一个可以关注的数据：「最近干散货运指数涨了很多。」\n\n2. 养猪：只输时间不输钱，选中游不是老二\n\n猪周期没有消失，这是纯胡扯。你要是不怕波动，现在是只输时间不输钱，但啥时候能涨我也不知道。\n\n他纠正了一个被传错的说法：「我说的是要买中游的，不是老二，你们怎么就传成老二了？」\n\n## 八、收尾：低买高卖要印在骨子里\n\n股票市场的秘诀就是低买高卖。什么是低、什么是高，并不像你想的那么难，难的是低买高卖——因为低的时候你不敢买，高的时候你不敢卖。\n\n每一个进入股票市场的人，没有人没赚过钱，最终你可能都还回市场了，就是因为你没有实现低买高卖。\n\n我讲的东西都是评书，一切都是虚构，不能用来指导投资，所有的东西你自己负责。","toc":["一、长期持有是最好的方式吗：警惕幸存者偏差","二、非农就业数据大超预期：怎么拆穿「数据是编的」这种阴谋论","三、一次带着不确定性的猜测：芯片股为什么涨","四、特朗普和沃什：每个人都要演好自己的角色","五、加息的影响面：谁受伤最重，谁最安全","六、中美AI竞赛：中国不需要赢，只需要不输太多","七、几个具体板块的位置（他强调都不是个股推荐）","八、收尾：低买高卖要印在骨子里"],"url":"https://xueqiu.com/2573414707/408186812","chars":4652},"topics":["幸存者偏差","长期持有","非农超预期","加息","AI含科量","船周期"]},{"date":"2026-09-04","bili":{"title":"老木匠 2026年9月4日直播文字稿（日本民族性、冗余供给、广场协议、日元加息、货币商品化、消费）","text":"## 一、开场：拉黑那些\"反问句情绪党\"\n\n先说个规矩。雪球上只要有人上来就是一顿质问、一堆感叹号问号、对你做人生评价的，一律拉黑。\n\n这些人有个共同特点：所有超出他们认知范围的东西，他们第一反应不是去想你讲的是啥，而是先照顾自己的情绪。现实里也得少接触这种\"说话爱用反问句\"的人——他一听没听过，马上就有情绪，根本不是想学习、想思考。\n\n你大可以好好表达观点：说我哪儿说错了、你不同意，都行。但上来就质问的，拉黑没商量。\n\n## 二、日本民族性：精于战术，疏于战略\n\n今天主线之一是讲日本人的民族性格：精于战术，疏于战略。\n\n看历史就清楚。日本几次想打朝鲜、借朝鲜跳板进大陆，都赶上中原王朝强（唐、明），还选错时机——唐末五代十国、魏晋南北朝时中原衰弱，偏偏日本自己国内也乱。真正最好的机会是清末：明治维新 1868 年率先消化了工业化，而清朝慈禧当政、上层不睦、国力衰弱，又赶上鸦片战争后西方削弱大清。甲午海战赢了、占朝鲜、割台湾、占关东州，跳板都搭好了。可紧接着七七事变想吞并全中国，就开始办蠢事——战略彻底输了，最后台湾没了、东北没了、还挨了两颗原子弹。\n\n偷袭珍珠港也是一样：他觉得炸沉几艘航母美国就完了，根本想不到这会成为美国出兵、苏联出兵、把他打回岛上的转折点。\n\n我给日本公司当过法律顾问，近距离接触过他们，感受非常明确：他们扣细节特别厉害，但从不抬头看一眼战术和战略是否匹配。\n\n## 三、爆花比赛与磨刀：木匠眼里\"扯没用的\"\n\n举两个最能说明问题的例子。\n\n第一个，日本木工有个\"刨花比赛\"：把刨子做得尽量宽、刨出的刨花尽量薄、又不断、又整齐，能拉多长就多长，薄得像纸。听着厉害吧？我当年学木匠，看中国河北老师傅新全生的视频，徒弟问他\"你看人家日本刨花多漂亮\"，老爷子一句话让我顿悟：\"日本人他妈就扯那没用的，你做木匠活是为了刨花还是为了木头？\"\n\n第二个，磨刀。日本人磨刀分粗磨（打薄刀身）、中磨（磨快）、细磨（让刀刃连续顺滑），追求极致。中国人是\"磨吧磨吧拉倒\"，能切肉切菜就行。日本人觉得杀猪刀也得让猪\"死得舒服\"——这就是问题所在。\n\n做木工是为了木头不是刨花，磨刀是为了杀猪不是让猪舒服。 日本人干啥都像那个刨花比赛，忘了最初要干啥。\n\n## 四、冗余供给：榻榻米、名刀与匠人精神的陷阱\n\n这就引出经济学上对日本产品的评价：冗余供给。\n\n榻榻米就是个床垫，日本人非跟你讲棕榈从哪座山来、麻晒多少天、工艺多难——旧了照样有油味儿，没用。名刀也是，世界三大名刀是大马士革刀、马来刀、日本刀，中国刀排不上（中华文明认为\"兵者凶器\"，不花精力在兵器上）。日本刀确实好，我现在用的就是旬、雅、三妹，但磨那么快切个西红柿，和扶一下手切有啥区别？\n\n日本人把大量精力放在冗余供给上，东西是好，但成本也高、很多没必要。 这就是战术和战略的区别——永远要盯住第一目的。所以日本有匠人，没有大师；房地产公司盖个窗台角是不是直角能抠呲好几天，中国人觉得\"你疯了吗业主进来两天就砸了\"。\n\n丰田车耐用、电饭锅用二十年，听着好，但：你强调三菱空调用了二十年没换，说明你这些年白干了、没进步、没换房。 技术早变了，耐用不等于有价值。\n\n## 五、广场协议与失去的三十年：被阉割的日本\n\n日本泡沫破裂后，日元大幅升值，进入\"失去的三十年\"、长期通缩，不断宽松货币，国债达到 GDP 的 2.4~2.5 倍。\n\n有人说\"日本没失去三十年\"，那是站在底层老百姓视角（\"我去过日本生活挺好\"）看问题，就像用\"今天外卖单子好不好\"评价中国经济。日本当年半导体多发达，后来被美国生生阉割——广场协议逼日元升值、产业转移扶持韩国台湾压制日本，都是美国干的。这部分有美国压制，也有日本自身民族性。\n\n关键点：中国不会被这么压制，因为中国是完全主权独立国家。日本飞速发展借了美国东风，被压制也\"合情合理\"；中国借东风是互惠，美国想压压不住。 所以那些学者张口\"要汲取日本教训\"，在日本身上狗屁用没有，手段在中国身上全用过一遍，没用。\n\n## 六、安倍经济学与高市早苗：贬值 vs 贝森特压力\n\n日本国债这么高，最有利的是放任日元贬值——通胀抬头、名义 GDP 上涨，杠杆率就降下来了（国债不涨）。这就是安倍经济学的逻辑，安倍上台后通缩时代结束。现在的高市早苗（安倍拥趸）也想放任贬值。\n\n但贝森特（美国财长）今年 5 月跑去日本骂了财相，因为高市早苗想贬值。道理很简单：你贬值是你的事，但你干预汇率得抛美债（日本是美国国债大持有者），贝森特最关心的是美债收益率，绝不能让你不加鉴别地抛美债。 所以贝森特逼日本加息、搞联合干预。\n\n日元若恢复到 80 日元兑 1 美元，日本又回\"失去的三十年\"状态。这就是日本的无解——稍微通胀抬头，美国马上压你。\n\n## 七、日元加息套利：货币商品化与回流通胀\n\n现在日本一定要加息（这两天日元已到 156）。逻辑链条：\n\n有一部分日元资产在美国投资（借低息日元投高息美国，套利）。日本一加息、美日利差缩小，套利无利可图，这部分日元就回归日本。\n\n这里有个反直觉的点——日元回流，国内反而更通胀、汇率反而更贬值。因为流到海外的日元发生了\"货币商品化\"（在国内是货币，流到国外变成商品，不参与日本货币创造，所以日本印了很多钱国内还是通缩）；一旦回流，重新\"商品货币化\"，变成货币参与创造，相当于重新开动印钞机。原来印的钱都回来了买国内东西，通胀就起来，最终反映到购买力、反映到汇率——越加息、国内越通胀、汇率越贬值，形成循环。\n\n而且加息还抬高了日本企业融资成本（常年低息养大的），国内生产成本又增。对美国的影响是套利资金离开、少了一个买方，可能引发美股动荡。\n\n日元回流美国这个过程一旦成趋势，是对全世界的流动性收紧（对日本自己反而不收紧）。日元印出来的钱被各国拿去当抵押品了，日本自己没用上——非常诡异。最终危机在哪爆发，像三体问题一样预测不了。\n\n## 八、通胀是债务的减免：房贷与国债同一逻辑\n\n为什么通胀能解决债务？举房贷例子：你年轻挣 2000、月供 2000 很难；通胀后工资变 6000、月供还是 2000，压力变小。2010 年贷 48 万，当年觉得多，今天还 48 万对应的财富完全不同——你占了通胀的便宜，这是债务的减免。\n\n国债同理：通胀→名义 GDP 涨（钱毛了、什么都用钱计价）→名义 GDP 涨但名义国债不涨→杠杆率降。所以通胀期间没人爱买长债，长债收益率得往上走（货币要贬值，不给我更高利息不买）。\n\n特朗普搞关税、弄伊朗，本质就是要通胀，只有通胀能解决美国国债。 贝森特怕的不是日本通胀，是日本不加息去抛美债。\n\n## 九、内循环与外循环：防风险先看属性\n\n我们生在中国没问题，但市场里东西分两类：\n\n参与外循环、和国际接轨的（半导体科技、大宗商品——价格由国际定）——越要注意风险；\n\n纯内循环的（国内旅游）——相对抗压、受影响小。\n\n越是和国际统一的，越要小心；越是自己的、跟国际没关系的，风险越小。这是现在防风险的第一前提：对国内要非常自信（A股、国力、政局），但对外循环部分保持警惕。\n\n## 十、消费是主题：离地产远、必选消费的细分方向\n\n讲投资理念。每一段得先定基本理念（\"路线方针\"），方向选错努力白费——2021 年非要买白酒、房地产，大方向就错了。\n\n现在的基本方向：消费是未来一段时间的主题，但别买白酒（白酒是房地产的通行证，离地产太近）。\n\n能看的：必选消费（酱油、米面粮油、牛奶、啤酒、黄酒估值太高下不去手）、旅游出行、餐饮、宠物、服饰、养猪（周期股看时机）、游戏、离地产远的小家电（苏泊尔类）、医药；\n\n要小心的：超市（受电商冲击判断不好）、汽车（周期股看时机）、工程机械（离地产太近，虽然 2024 有换机潮也不买）、白色家电家纺建材装饰（全离地产近）。\n\n逻辑闭环：房地产不行了、房价降，房产支出减少→劳动力成本降（\"房地产红利\"）→其他消费变多。所以消费起来有一部分原因就是大家在房子上花得少了。北京上海房子\"不够用\"是伪命题——普通老百姓非待北京干啥？卖了北京房去廊坊变富翁，身体好不如自己有钱心情好。\n\n最后照例声明：讲的都是评书，别当真，更别听几句就回去买啥。","toc":["一、开场：拉黑那些\"反问句情绪党\"","二、日本民族性：精于战术，疏于战略","三、爆花比赛与磨刀：木匠眼里\"扯没用的\"","四、冗余供给：榻榻米、名刀与匠人精神的陷阱","五、广场协议与失去的三十年：被阉割的日本","六、安倍经济学与高市早苗：贬值 vs 贝森特压力","七、日元加息套利：货币商品化与回流通胀","八、通胀是债务的减免：房贷与国债同一逻辑","九、内循环与外循环：防风险先看属性","十、消费是主题：离地产远、必选消费的细分方向"],"url":"https://www.bilibili.com/opus/1244064473024561153","bv":"","minutes":0,"chars":3374},"ai":{"title":"老木匠·2026年9月4日：日元的死局与消费方向的选择","text":"## 一、日本「想浴火重生，但人家不让你点火」\n\n1. 背景：高市早苗想让日元贬值，贝森特跑去日本骂了一顿\n\n他说这场戏的实质是：高市早苗（安倍经济学的拥趸）想放任日元贬值、让日本走出通缩；但今年五月贝森特跑去见了日本财相，花很长时间批评这套政策，实质是说给高市早苗听的。\n\n如果你一意孤行的话，你可能又干不长了，当然也有可能像安倍晋三那样活不长——这就是道理所在。你稍微有一点通胀抬头，美国人马上就告诉你这不行，这会影响美国。\n\n他给这套压力配了个比方：\n\n你想浴火重生的时候，人家怕把人家房子点着了，直接拿灭火器给你浇灭。你老想着浴火重生，那你就在那闷着，闷死得了呗。\n\n2. 贝森特真正担心的不是日本通胀，是美债\n\n贝森特为什么希望日本加息？他更关心的是美国国债的利率。他现在害怕的是你不加息、反而去干预汇率——你干预的时候两种方式：一是加息，二是自己上市场抛美元买日元，那你抛美元怎么来？你去卖美债。\n\n日本是美国比较大的一个国债持有人，所以贝森特最关心的是美债收益率，他不能允许日本不加息、反而去抛美债。\n\n3. 加息为什么反而会让日本国内更通胀（他又讲了一遍这套机制）\n\n日元原来发得太多了，只是这些日元散落在海外，所以日本国内的通货膨胀还不严重——这是日元的商品化。如果这些东西回流日本国内，重新参与货币创造，就会大幅增加国内的货币持有量，这相当于重新开动了印钞机。\n\n你就会发现一个非常诡异的局面：日本反倒是越加息国内越通胀，国内越通胀汇率越贬值，它会进入到这样一个循环里面。\n\n他还补了对日本企业的连带影响：\n\n日本企业常年享受的都是低利率政策，加息以后融资成本会上升，生产成本又增加了——这是对日本的另一层伤害。\n\n4. 对美国的影响：套利资金回流会冲击美国资本市场\n\n如果日美利差减小，那部分借日元去美国投资套利的资金就会边际上撤出、回流日本。这个过程一旦形成趋势、且数量比较大，会对全世界资本市场都有影响，首先影响美国市场，其次影响日本国内自己的市场。\n\n这真是非常诡异的一幕：日元印出来的钱都被其他国家拿去当抵押品用了，日本自己反倒没用到自己的钱。\n\n他对最终结果的态度很直接：\n\n这最终会怎么解决、会引发什么样的危机，我实在想不出来——这是一个非常复杂的博弈，类似于三体问题：你知道它有风险，但风险在哪爆发，你根本没法预计。\n\n5. 为什么今天的日元贬值对美国没那么重要，但80年代不一样\n\n80年代日元贬值，日本对美国的产业威胁非常大——最典型的是汽车，跟中国现在一样。所以那时候美国要求日本升值，才有了广场协议。\n\n今天日本和美国之间几乎没有什么产业竞争了，日元贬值本身对美国不重要，重要的是日本对付贬值的方式——因为这会牵动美债。\n\n他还借这个类比了通胀和股市的关系：\n\n通胀本身对股市没有影响，但为什么通胀一出来就没有牛市？因为大家一定会想着怎么对付通胀，对付通胀的措施才对股市有影响。日元道理是一样的。\n\n6. 为什么「中国要汲取日本教训」这种说法他很反感\n\n日本的问题有很深的政治背景——它不是一个完全主权国家。日本历史上曾经半导体行业非常发达，是被美国生生阉割了；广场协议逼迫日元升值，也是美国为了阉割日本。\n\n这些手段今天全用在了中国身上，但今天不好用了。不是日本没有聪明人，是他的地位不行——他是挨了两颗原子弹以后，就做不了主了。\n\n中国是一个独立主权国家，这是最根本的不同。中国面临的通缩问题在中国是个伪命题——即便今天人民币升值，也是在我们自己可管理的范围内的升值。\n\n7. 顺带纠正一个常见的认知误区：日本收入是我们四倍，是汇率造成的错觉\n\n日本收入是我们四倍，是汇率所导致的错觉。你不去看在日本理发多少钱、搓澡多少钱、买大米多少钱，光靠收入数字比较是没有意义的。\n\n你在日本赚2万人民币的生活水平，跟在中国赚8000块钱人民币的生活水平几乎没有实质差异。所谓日本人均收入是中国四倍，并不代表他生产和消费的财富就是中国的四倍。\n\n## 二、通胀为什么能解决债务问题：他用房贷讲透了这套机制\n\n1. 核心逻辑\n\n解决通缩不是解决物价问题，是要解决财务杠杆问题。随着通货膨胀，名义GDP会增加，但国债并不会增加——所以杠杆率会下降。\n\n这就跟你们年轻时候买房子借房贷一个道理：你年轻时挣2000块钱工资，房贷一个月还2000。随着时间推移、通货膨胀，你即便没升职，工资也可能变成6000了，但还款还是2000，压力自然就变小了。\n\n2. 通胀本质上是一种债务减免\n\n通货膨胀在某种程度上就是债务的减免。它既然是债务的减免，当然也就是债权人的损失——所以在通货膨胀期间，长期国债就没人爱买了，收益率就该增加，因为大家都认识到货币要贬值了，你不给更高利息我就不买。\n\n十年前贷的48万和今天要还的48万，对应的财富是完全不同的——这实际上就是对你债务的一种减免。\n\n## 三、投资要先有「路线方针」，再谈具体标的\n\n1. 他给的原则\n\n每一段时间你都要有一个基本理念，这在我们的语境里就叫路线方针——先得确定路线方针，再干具体的事。你如果路线方针都不对，干具体的事儿一定干错。\n\n大方向一定要对，你跟这就跟在河上行船一样，你非要玩逆水行舟，那不是自己给自己找累吗？\n\n2. 他当年的具体做法\n\n2021年之后有很长一段时间，我告诉大家产业要离地产远——不光是房地产开发公司，白色家电、家纺、建筑建材、装饰都不能买。甚至当时我连工程机械都没买，因为它离房地产太近。\n\n你如果21年还没看出房地产不行了，那你就不用选公司了，你选哪个公司都是一样的。\n\n3. 他自己框架的变化\n\n这之前我所有的投资理念都是：美元一定会贬值，大宗商品一定会涨价，我们也一定会实现货币宽松。但今年不是了。你只有先确定好一个基本的理念，才能选对大方向；选对大方向，才能保证你的股票不亏损。\n\n## 四、消费方向：离房地产远的都可以看\n\n1. 他给的方法论\n\n房地产不行了它也有好处，就是房地产红利——房子降价了，新增劳动力在住房上的开支会大幅减少，这就会导致在其他方面的消费变多，旅游、出行、餐饮都会受积极影响。\n\n你要想的是：什么东西只有在搬家、换新房子的时候才会消费？你就要离它远一点。\n\n2. 具体的方向（他强调这只是大方向，不是个股推荐）\n\n消费、医药，这都会有很大发展，你都不用想。只要别买白酒就行——白酒是房地产开发的通行证，跟房地产太近了。\n\n必选消费都可以：酱油、旅游、啤酒、医药、服饰、牛奶，出行（火车、飞机）。养猪算周期股，你得选好介入时机。\n\n黄酒我原来一直比较看好，但现在估值太高，下不去手。\n\n他也提了几个存疑的方向：\n\n超市不好判断，因为受电商冲击太大，这些年消费路径发生了很大变化。汽车不是不行，是要看介入时机，它是个周期股。空调这类要看是不是离房地产近的家电——小家电（电饭锅、刮胡刀、吸尘器）可以，但空调这种和房地产强相关的不一定。","toc":["一、日本「想浴火重生，但人家不让你点火」","二、通胀为什么能解决债务问题：他用房贷讲透了这套机制","三、投资要先有「路线方针」，再谈具体标的","四、消费方向：离房地产远的都可以看"],"url":"https://xueqiu.com/2573414707/408186562","chars":2841},"topics":["日本民族性","冗余供给","广场协议","日元加息","货币商品化","消费"]},{"date":"2026-09-03","bili":{"title":"老木匠 2026年9月3日直播文字稿（买卖本质、低买高卖、分红除权、折现率、加息风险、危机防守）","text":"## 一、把直播当课堂：来市场只为赚钱\n\n我原来把做自媒体当成聊天室。你一旦当成聊天室，就等于假设所有人都和你一样，那么别人说出非常蠢的言论时，你一定会有情绪。换个思维，把它当课堂，心态就顺了——学生发表愚蠢的言论，责任在老师。\n\n今天这一场，就当是我把这儿当课堂的第一天。这不是为了忍别人，是让我自己好过一点。\n\n说回根本：我们来市场是来赚钱的，不是来和别人争对错的。谁和谁互撕了、谁和谁好了又不好了、有什么瓜可以吃，这些我一点兴趣都没有。你把娱乐圈那套粉丝文化带进投资里，毫无意义。你有那个时间，不如好好分析分析公司。\n\n生活原本不易，我们就不要再互相伤害了。总有人在背后骂我，我从来不在背后骂他们——骂他们对我挣钱毫无帮助。如果有人说，吵架赢了给一个亿奖金，那我天天骂。没有这个前提，骂人图什么呢。\n\n人最容易犯的毛病，是目的和手段走着走着就剥离了，也就是忘了初心。你原来是来赚钱的，走着走着变成今天非要和别人掰扯清楚。初衷必须刻在骨子里，其余和赚钱无关的东西，都不用关注。\n\n## 二、买卖的本质：卖方要的是价款，不是交付\n\n昨天我说投资赚钱的方式是低买高卖，有人不同意，这超出了我的认知范围——你投资不通过低买高卖，还能怎么实现收益？很多人对这类概念是搅在一块儿的，思维上没有做清晰的切割，所以看着像懂了，其实没到根上。\n\n先问一个最基础的问题：你卖出一件东西，对你来说最重要的利益是什么？\n\n不管是卖房子、卖股票，还是卖黄瓜、卖机械设备，买卖合同里双方各有权利义务。你这方的权利是收到价款，对方的权利是收到物品。所以对你来说，核心利益诉求就是收到价款——钱到手，你的利益就实现了，剩下的交付是义务。\n\n很多人把买卖理解成\"我卖出去就必须把东西交付给对方\"，这是没搞明白。你卖房子，拿到房款，你的利益诉求就已经结束了，把房子过户给对方是义务的实现。现实中有大量卖出并不以过户为根本特征。\n\n中国古代有一类房地产交易叫\"出典\"，典当的典，现在的合同法里已经没有了。出典的意思是：约定一个价格把房子卖给他，同时约定期限和价格，到期再把房子买回来。你用三年的房屋使用权，换来了这一百万现金的使用权——本质上更像抵押借款。\n\n但典权和抵押权不一样。抵押是不转移占有、也不转移使用的：你把房子抵押给银行做房贷，房子还是你住，不是银行住。这是担保物权；典权设置的是用益物权，对方是真的拿到使用权。\n\n再换成出租房子：你把房子租出去收租金，看起来房子还在你手里。但房子有使用年限，你每出租一年，使用年限就少一年。假如房子只能用一百年，你出租一百年，最后残值就是零。所以出租房屋和卖出房屋没有本质区别，无非是对方买走了你这部分年限内的使用权。\n\n## 三、所有权，就是使用权加处置权\n\n顺着这个思路讲融资租赁。大型机器设备、船舶、飞机，都有专门的融资租赁公司在做。\n\n假设我是个跑运输的个体户，需要买辆重卡但钱不够。我可以向银行贷款买车，再把车抵押给银行作为还款保障——这是抵押贷款。另一种模式是：融资租赁公司先把设备买下来，再租给你，你按期付租金。\n\n这两种模式本质一样。对使用者来说，你交租金还是交分期贷款，反正每个月掏这么多钱，没有区别。商用重卡的使用寿命假设是八年，到期强制报废，你也只能用八年。\n\n所以你要明白：所谓所有权，就是在自然使用寿命范围内的全部使用权，加上这段时间内的处置权。这两个加起来，才叫你的所有权。卡车只能用八年，你这八年的所有权就是这八年的使用权加处置权。\n\n现实经济活动里所有人都认这个账，所以才会有融资租赁这种模式。你是个航运公司，船是不是你的，有什么重要区别吗？你不过是要用这条船跑运输，收的是运费，付的是买船或租船的钱。普通人拗不过来，是因为日常生活经验局限了你对本质的认识。\n\n那些大厂商也一样。丰田有自己的金融公司，你从丰田汽车金融贷款买丰田的车，再分期还钱——放贷的和卖车的上级是同一家公司，本质上就是一家。那你这不就是分期付款吗？只不过因为贷款属于金融业务，受央行监管，普通公司对外放贷是违法的，所以必须单独成立一个公司来做。比亚迪、三一重工、徐工机械，都这么干，而且自家金融公司的贷款利率往往比银行还便宜。\n\n## 四、长期持有，也是低买高卖\n\n很多人一听到低买高卖就着急：我不是为了低买高卖，我就是为了持有。持有为了什么？为了收息。\n\n那我要说清楚：你持有的目的只有两个。一个是定期获得收益，也就是分红；另一个是享受估值的提高或利润增长带来的股价上涨。有人说我不图价格上涨，就图分红——那你得分清楚，收分红本身就是涨价的一种形式。\n\n因为你看到的价格都是复权价。每一次分红，都要对历史价格做修正。一只股票某天的最高价是八块一，分红一毛之后，你会发现那天的最高价变成了八块——这就是前复权，它在回溯修改以前的计价。\n\n## 五、分红除权只是记账，不改明天的价格\n\n总有人说\"分红是分我自己的钱\"，这是不懂分红究竟是什么。\n\n除权分完之后，明天开盘什么价？它跟头一天的价格没有必然的因果联系，跟今晚是否分红更没有关系。明天的价格取决于明天所有交易参与者对这个东西的看法。\n\n不信你反推一下：假设昨天的成交价是八块一，如果不分红，你能说明天的成交价必须还是八块一吗？显然不能。那么今晚分了一毛，明天的成交价就必须是八块吗？同样不一定。\n\n要说有影响，只有一点——心理锚定效应。因为明天的交易是在今天的价格基础上进行的，人会被前面的数字锚住。所以当一只股票开始下跌，它不会一天跌到位，总有人不服气。A 股散户占比高，锚定效应就更明显。在美国，一份年报出来，第二天甚至盘后直接跌百分之二十是常有的事。\n\n心理锚定是一种心理误区，只代表你舒不舒服，跟实际定价没有任何关系。\n\n再用房子举例。你家现在住的房子，你心里给它计价多少？你肯定是照着中介最近的成交、邻居卖的价钱，算个单价估出来的。那我问你，你现在心里的这个价，代表你未来卖出时的价格吗？当然不代表。最终卖多少钱，取决于你和买房的人最后谈成什么结果。\n\n股票也一样。每天收盘后，账户里的钱是按当天收盘价计价的。今天账上一百万，代表明天这些东西一定能卖一百万吗？谁都知道不可能。明天能卖多少，取决于明天实际的成交价。\n\n再看分红和除权的关系。昨天聊到母鸡下蛋的例子：我们谈好明天两块钱成交，你来拉鸡，结果头一天晚上鸡下了个蛋。那我问你，明天的成交价会不会变？\n\n你要说下了蛋价格就得改，那前天还下了蛋呢，过去一年下了好几百个蛋，你都要改吗？所以你买一只母鸡，评估的是这只鸡到你手里以后一共还能下多少蛋。它在卖主家下过多少蛋，跟你有什么关系？\n\n分红就是这个道理。分红本质上改变的是你的买入成本。你花一百万买的，现在分回来五万，相当于你在这笔投资上的钱只剩九十五万，买入价变低了。交易软件里你的成本也会自动被调整。\n\n而低买高卖的公式就是卖出价减去买入价。价格没变，但期间分了红，你在 K 线图上看到的依然是卖的时候比买的时候高——无论前复权还是后复权，都是这样。\n\n前复权和后复权的区别只在记账方式：前复权是回溯修正前面的价格，好处是当期的交易价格不会产生大的漂移；后复权是往后累加，好处是前面的价格不会被改得离谱。对于长期大额分红的企业，前复权算下来，十年前的价格可能是负的——你不可能用负价格买股票，那是因为历年分红早就把你的买入成本还回来了。2014 年之前买入茅台的，前复权价早就是负值了。这只是记账方式，跟交易没有关系。\n\n所以结论是：低买高卖包含了持股分红这种方式。长期持有也是为了低买高卖，你说你永远不卖，那也是为了吃分红，而吃分红相当于分期付款的高卖——这就是我前面讲房子出租的原因。\n\n你花一百万买，一年分十万，十年就都分回来了，第十一年再分十万，那不就是白来的吗？\n\n有人问：那要是一直不填权呢？买的时候一百万，明年分十万，价格变成九十万。可你要知道，后年还分十万，再往后是八十万。到最后一年，你分十万，却可以不花钱就把公司买下来——市场会给你这种机会吗？\n\n只要能持续分红的股票，没有不填权的，这跟债券的道理一样。不填权，是因为大家认为你的分红不可持续，或者公司经营出了大问题、未来可能破产倒闭。那时候的低价格不是分红造成的，是人们对公司未来经营的担忧造成的。\n\n## 六、折现率：未来的钱不等于今天的钱\n\n昨天还涉及一个折现率的问题，有人不太懂。学过大学经济学或者财会的人，这个都懂。\n\n折现率说的是一件事：未来能拿到的现金，和你今天手里的现金，不等价。你现在手里有一百万，和一年以后才能得到的一百万，价值不相等——一年后的一百万，显然没有现在这一百万值钱，这个差值就是折现值。\n\n为什么？因为今天的一百万你现在就能用，而一年后的那笔钱你现在用不了。那你怎么才能现在就用上它？把未来的这笔收款抵押给银行借出来，这个过程你必须付利息。这个利息，就是你的折现折扣，也就是成本。\n\n汇票贴现也是同理。银行票据都有付款时间，都是未来付款。你现在就想用这笔钱，就得拿去银行贴现，相当于质押贷款，支付这段时间的利息。\n\n折现、贴现，大体上和当期利息相当，具体还有分母变化等数学细节，这里不展开。\n\n未来的现金流折现法估值，说的就是：你预计一家公司明年分红多少、后年多少、大后年多少，在它的存续期内把每年的分红都折现到今天，加总起来，就是它的估值。\n\n## 七、美国就业数据不及预期，怎么成了利好\n\n昨天有人跟我说，美联储现在又不准备加息了，因为美国的新增就业数据不及预期，所以昨天晚上股市又都涨了。\n\n有人来问我这话，多少有点踢场子的意思，好像认定我就盼着美国马上加息。我都不知道这些人是怎么想出来的——我是防止美国加息的风险，并不是我希望它加息。一旦加息会造成损失，我要防这个损失；但它不加，我手里的股票也会涨，我也受益。这正是为什么我不赞成为了防风险就空仓：你空仓了，另一种可能性带来的收益也就没了。\n\n但我个人认为，加息的风险并没有解除，而且现在美国处在一种极端诡异的氛围里。就业数据不及预期本来是利空，怎么现在大家把它当成利好了？按这个逻辑，是不是越多人找不到工作就越好？失业率干到百分之十才是最好的？这个逻辑本身就非常诡异。\n\n## 八、混乱局面里，散户只做两件事：活下来，再占便宜\n\n我已经反复跟大家说过：不要在非常混乱的局面里试图战胜谁，因为你不是有这个能力的人。局面混乱的时候，作为普通的弱者，你最需要做的是保护自己。\n\n大家都知道竹林七贤。为什么会有竹林七贤？因为那些人认识到当时的社会太混乱，以他们自己的能力解决不了，所以不如隐退到江湖，以吃喝玩乐为主。这是最好的自我保护方式。\n\n你也一样。不要试图在这么混乱的局面里判断出怎么才能赢，你现在要做的是怎么不输。怎么能赢，不是你这个级别的选手需要考虑的。以我们散户获取信息的渠道、分析问题的能力、还有财力，你怎么还想着能打赢呢？\n\n这就好比现在是两个大军团的一场混战，里面有的是武功高手，你非要凑进去，还准备把这场战争结束、把他们都打败。你应该站旁边看着——你进去第一个死的就是你。\n\n这个世界正在进行激烈的博弈，这是我两三年前就给大家讲过的。当然，如果你说我就想赌一把，我是穷小子也没什么钱，赌赢了逆天改命，赌输了拉倒，那可以。但如果你是一个理性的投资者，准备以此为生，那我劝你现在做好防守，做好防守，做好防守。\n\n对待一次危机，你只需要考虑两点：第一，别被危机消灭了，别自己牺牲；第二，在可能的情况下占点便宜。等他们打得都差不多了、都没什么劲儿了，你进去捡两件兵器，就够你吃一辈子了。\n\n投资市场最怕的，就是小散户有一颗巴菲特的心，动不动就巴菲特如何如何。\n\n1998 年亚洲金融危机的时候，泰国有一批人后来靠股票发达起来。我看过其中一个人的传记，她原来是个空姐——一个空姐能赚多少钱？但当大家拼到你死我活的时候，那价格低到难以想象，打一折、打半折的都有的是，一百块钱的股票一块钱买到手的都有。那个空姐把多年积蓄再贷点款全部买成股票，从此就不用再当空姐、不用再给别人端盘子了。\n\n你得找这样的机会。想建功立业的时候，那些人都已经死了。只要你活得足够长，这样的机会总能遇到。\n\n## 九、AI 泡沫，最终一定要有人买单\n\n现在很多人说，一个被预见的危机就不可能是危机。这纯粹是胡扯，因为你根本没经历过。2008 年危机之前，有很多人就跟今天一样提示说危机肯定会来，和今天的氛围一模一样，多少人都不信。等真正的危机来了，无论谁提醒都没有用，大部分人还是不信。\n\nAI 的泡沫最终一定要有人买单。AI 的发展需要泡沫，这没有错，但这种泡沫最终一定要有人买单。发展科技是需要代价的，无论中国还是美国都是如此，最终一定要有人买单。\n\n## 十、收尾：这是评书，不是投资建议\n\n非常感谢大家又陪了我一上午，我要看盘了。\n\n虽然我今天是把它当课堂的第一天，但我依然要告诉大家：这只是转变我自己的思维模式。我讲的内容依然属于评书，不是什么严谨的科学理论，也不是投资建议，都是演绎、虚构出来的，不能用来指导你的投资。你们看我在雪球上的组合，那也不是我的实盘，这件事我说过八百遍了。\n\n只要大家愿意听，我就愿意讲。而且把心态调整过来之后，我觉得今天比以前平和多了。\n\n有一点我要说清楚：你打印我的讲解拿去干什么我都不管，但你不要到我这儿来告诉我\"我听了你的买了什么股票\"，我最烦这个，干脆直接拉黑——这不给我增加压力吗？我什么时候建议你买什么股票了？我引用一条新闻的标题提到某一只股票、告诉大家它中报已经发了，你就说你买了这只，那我就没招了。\n\n谢谢大家，再见。","toc":["一、把直播当课堂：来市场只为赚钱","二、买卖的本质：卖方要的是价款，不是交付","三、所有权，就是使用权加处置权","四、长期持有，也是低买高卖","五、分红除权只是记账，不改明天的价格","六、折现率：未来的钱不等于今天的钱","七、美国就业数据不及预期，怎么成了利好","八、混乱局面里，散户只做两件事：活下来，再占便宜","九、AI 泡沫，最终一定要有人买单","十、收尾：这是评书，不是投资建议"],"url":"https://www.bilibili.com/opus/1243668335351037954","bv":"","minutes":0,"chars":5556},"ai":{"title":"老木匠·2026年9月3日：卖出的本质与除权的真相","text":"## 一、开场：把直播间从「聊天室」改成「课堂」\n\n1. 他自己调整心态的办法\n\n我原来把这个自媒体当成一种聊天室。当你把它当聊天室的时候，你就是把所有人都假设为和自己一样的，这样那些非常蠢的言论出现的时候，你就一定会有情绪。\n\n但你如果转变思维，把它当成课堂的话，就不会——因为学生发表愚蠢的言论，其责任在老师。\n\n他说这么改是为了让自己好过一点，「不是为了忍别人」，同时也答应「以后说话会慢一点儿，照顾一下大家的理解能力」。\n\n2. 不忘初心：你来市场是干什么的\n\n我们来市场是为了赚钱，其他的都没有意义。你不是为了和别人争对错。\n\n人在生活当中也好、工作当中也好，经常会出现目的和手段最后剥离了。这就是我们现在讲的不忘初心——你走着走着就把初心忘了。你原来是来赚钱的，走着走着变成你要和别人掰扯。\n\n他对那种「粉丝文化」式的关注很不以为然：\n\n总是处在那种花边新闻里，把娱乐圈的粉丝文化带到这里来，我觉得毫无意义。你有那时间好好分析公司，看看买哪个公司能赚钱，你看那个戏有啥意思？\n\n他们总是在背后骂我，我从来不骂他们，原因是我认为骂他们对于我挣钱来说毫无帮助。如果说让我骂一个人天天骂他就有人给我钱，那我就天天骂。\n\n## 二、这场的正课：卖出的本质是什么\n\n这一段是他为了说清楚「投资就是低买高卖」而专门补的一课，起点是一个法律上的基础概念。\n\n1. 先问一个问题：你卖东西，最核心的利益是什么\n\n你卖股票也好、卖房子也好，无论卖什么，对于你来说最重要的东西是什么？\n\n他的答案是从买卖合同的结构来的：\n\n买卖合同是所有交易合同的基础。合同是双方既有权利又有义务：你这一方的权利就是收到货款，对方的权利就是收到物品。\n\n所以对于卖方来说，最核心的利益诉求是拿到价款。你只要拿到价款，你的利益就实现了。而把东西过户给买方，那是你的义务，是对方的利益诉求。\n\n2. 所以「卖出」不一定要过户\n\n很多人把买卖合同理解为「我只要卖出就必须得把东西交付给对方」。不是的——你实现卖方利益，只要拿到价款，这个诉求就完事了。\n\n有很多买卖并不以过户为根本特征，有很多卖出实际上是不需要过户的。\n\n3. 古代的「典权」：卖出的是一段时间的使用权\n\n典就是活卖，相当于国债逆回购。你约定一个价格把房子卖给他，同时约定一个期限和回购价格，到期你要把房子再买回来——这个过程就叫出典。\n\n你实际上卖出的是什么呢？是在一定期限内的使用权。你用三年的房屋使用权，换取了100万现金的使用权，其实就有点像借贷。\n\n他还讲了典权和抵押的区别：\n\n抵押不转移所有权，而且抵押权人没有权利使用抵押物——你把房子抵押给银行做房贷，房子是归你使用的，不归银行使用。抵押贷款设置的是担保物权，而典权设置的是用益物权。\n\n4. 出租房屋，本质上是一次分期付款的买卖\n\n你买了房子出租收租金，你认为是在出租，因为到期房子还给你。但你要知道，你的房子是有使用年限的，你每出租一年，使用年限就少一年。\n\n所以你也可以把出租房屋理解为一次分期付款的买卖。假如这房子只能使用100年，你出租100年到期，残值就是零了。\n\n所以出租房屋和卖出房屋并没有本质区别，都是你获得价款、对方获得使用权。只是买卖合同是一次性的：你一次性拿到价款，他一次性获得使用年限内的使用权。\n\n5. 融资租赁：同一件事的另一种写法\n\n你要买一辆重卡但没那么多钱，可以向银行贷款买，然后把车抵押给银行——这是一种模式。还有另一种：融资租赁公司先把设备买下来，再租给你，你按期给他租金。\n\n这两种模式本质是一样的，只是融资租赁公司买入设备时是以自己的名义。对使用者来说没有区别——你交租金也好，交分期贷款也好，道理是一样的。\n\n他还点破了汽车金融公司这层结构：\n\n你从某个汽车品牌的金融公司贷款买它的车，再分期还钱。那两家公司的上级是同一家，本质上就是一家公司——那你不就相当于分期付款吗？他只不过内部需要走一个程序。\n\n为什么要单独成立金融公司？因为对外放贷收息是金融行业的特许业务，普通公司对外借款是违法的，央行要对它进行风险管理。\n\n6. 所以「所有权」到底是什么\n\n所谓的所有权，就是在自然使用寿命范围内的所有使用权和处置权之和。比如一辆卡车只能用八年，那你所谓的所有权，就是这八年的使用权和八年内的处置权之和。\n\n你会拘泥于「我买卖就得拿到这个车辆」，这是你的心理错觉，是因为你没有认识清楚这个问题。在现实的经济活动中，所有人都会认识清楚这一点。\n\n你作为一个航运公司，这船是不是你的有什么重要区别吗？你不过是为了用这个船去跑运输——你收的是运费，付出的是买船的钱或者租船的钱。\n\n## 三、所以「长期持有吃分红」也是低买高卖\n\n1. 持有的目的只有两个\n\n你持有的目的就两个：一个是定期获得它的收益，也就是分红；第二个是获取它估值提高、利润增长所导致的价格上涨。\n\n2. 收息就是「分期付款的高卖」\n\n有人说我不同意低买高卖，我就想长期持有。我告诉你，你长期持有也是为了低买高卖。你说我永远不卖——你永远不卖也是为了吃分红，而你吃分红就相当于分期付款的高卖。\n\n我跟你讲了半天房屋租赁，就是要讲这件事。\n\n你花100万买的，一年给你分10万，十年以后不就分回来了吗？到第11年再给你分10万，那不就是白来的吗？\n\n3. 分红本质上改变的是你的买入成本\n\n你花100万买的，现在给你分了5万回来，那你在这笔投资上的钱是不是就剩95万了？是不是相当于买入价格变低了？\n\n低买高卖赚的是卖价减去买价。虽然它的价格没变，但期间如果分红的话，你在K线图上看到的，它也是卖的时候比买的时候价格高。\n\n## 四、除权：它改的是历史价格，不是明天的价格\n\n这一段他用了三个层层递进的问题，从房子问到股票，是这场讲得最细的一处。\n\n1. 第一问：你心里给自家房子的计价，代表你未来的卖价吗\n\n你自己住的房子，你每天在心理上是按什么计价的？是不是按照邻居前两天卖了个差不多的房子算出个单价？那我问你，你现在心里这个计价，代表不代表你未来卖出的价格？\n\n答案显然是不代表。\n\n2. 第二问：你账户上今天的市值，代表你明天能卖这么多吗\n\n每天收盘以后，你账上的钱是按当天收盘价计算的。那我问你，你今天晚上看账上有100万，代表不代表明天你这些东西就一定能卖100万？\n\n你明天究竟能卖多少钱，取决于什么？取决于最终你卖出的价格，取决于明天的报价。\n\n3. 第三问：明天的价格和今天有必然的因果联系吗\n\n明天的价格会不会受到今天价格的约束？会不会有人说「昨天你报价还是100万，今天为啥不给我100万了」？有没有人敢这么说？\n\n明天的价格和今天没有必然联系。除非因为涨跌停板制度限制了幅度，但那个并不重要。\n\n他补了唯一的那点影响：\n\n明天的价格和今天的价格是有一点点影响的，叫做心理锚定。所以当一只股票开始下跌的时候，它不会一天跌到头。\n\n在美国，某只股票出了年报，盘后立马跌20%，这是经常发生的。A股很难做到，因为A股以散户为主，散户的心理锚定效应更明显。但这只代表你舒服与不舒服，跟实际定价没有任何关系。\n\n4. 所以回到除权\n\n一个东西昨天卖8.1块，今天分了一毛钱，那明天的交易价格一定是八块吗？也不一定。\n\n明天的交易价格是否是八块，跟明天的交易情况有关、跟所有交易参与者对这个东西的看法有关，跟你今天晚上是否分红了没有关系。\n\n他还给了个反证：\n\n你如果认为「分红一毛，明天就必须八块」，那就等于说「不分红的话，明天就必须还是8.1块」——那你就可以反推出来，明天的价格必须和今天一样。这个道理难懂吗？\n\n5. 母鸡下蛋那个例子\n\n我和买方谈好，明天两块钱来买这只母鸡。结果头一天晚上母鸡下了一只蛋，那你告诉我第二天的交易价格会不会变？\n\n如果说下了蛋价格就得改，那我告诉你，它前天还下了个蛋，大前天还下了个蛋，过去一年下了好几百个蛋——那你都得改？\n\n你买鸡实际上评估的是这只母鸡未来一共能下多少蛋。它在人家家里原来下了多少蛋，跟你有什么关系？你考虑的不是这只鸡到你手能下多少蛋吗？\n\n6. 前复权和后复权：只是记账方式\n\n除权只是一种记账方式，它跟交易没有关系。\n\n前复权是回溯前面的价格，后复权是累计后边的价格。前复权的好处是当期价格不会产生大的漂移；后复权的好处是前面的价格不会产生大的漂移。\n\n对于不断分红的企业，前复权会让你发现十年前的价格是负值——那你怎么可能在十年前用负价格买它？那是因为人家不断分红，把你买入的钱都还给你了。\n\n他还讲了「填权」这件事：\n\n只要能持续分红的股票，没有不填权的，它一定会填。不填权都是因为大家认为你的分红不可持续，或者你的公司出现了很大问题、未来会破产倒闭——那种低的交易价格并不是由分红造成的，而是由大家对公司未来经营的担忧造成的。\n\n7. 他借这件事讲的思维方法\n\n为什么叫奥卡姆剃刀——如无必要，勿增实体。你别老给自己那东西往上添东西。你有很多东西都是自己的直觉和好恶所导致的。\n\n你这个头脑一定要清晰。你不清晰，有些问题永远处在一种非常混乱的状态，你就会被带着跑。而带着你们跑的人他们自己也不懂——不要以为他们就是坏，他们自己也认识不清楚。\n\n## 五、折现率：为什么未来的100万不值今天的100万\n\n1. 概念本身\n\n折现率说明的一件事就是：未来获得的现金和你今天手里的现金是不等价的。你现在手里的100万，和你一年以后能得到的100万，价值上是不相等的。\n\n很明显，一年以后的100万没有现在手里的100万价值高，这个差值就叫折现值。\n\n2. 为什么\n\n因为今天的100万你现在就可以使用，而一年以后的100万现在使用不了。那你怎么能现在就使用呢？你把它抵押给银行，这个过程你一定要支付利息——这个利息就是你的折现折扣，这就是你的成本。\n\n他还举了票据贴现：\n\n银行票据都有付款时间、都是未来付款。你现在就想用，就去银行贴现，实际上相当于一次质押贷款——银行到期把这个东西变现，但在这期间他先把钱给你，你就要支付这中间时间差的利息。\n\n3. 所以自由现金流折现是怎么算的\n\n你预计一个公司明年分红多少、后年多少、大后年多少，在它的有限期内一共分多少，然后每年都折现到今天，算出一个数进行累加——这就是这个东西的估值。\n\n## 六、当下的判断：加息风险并没有解除\n\n1. 他先纠正了一个被人反复误读的立场\n\n有人上我这来其实多少有点踢场子的意思，因为他好像总认为我就希望美国马上加息。我一直不太明白这些人的脑回路。\n\n我是防止美国加息的风险，但这并不是我的希望。因为一旦加息会导致损失，我要防止这个损失；但如果他不加的话，我也会受益。\n\n他顺势又讲了一遍为什么不赞成空仓：\n\n这也是为什么我不赞同「你说你预防风险我就空仓了」——那你空仓了，另外一种可能性所带来的收益你就没了。\n\n2. 他对当晚行情的判断\n\n我个人认为加息的风险并没有解除。而且现在美国处在一种极端诡异的氛围里面：你的就业数据不及预期本来是个利空，怎么现在大家把就业数据不及预期都变成利好了呢？\n\n就业数据不及预期变成利好，是不是说有越多人找不到工作就越好？现在美国是认为，如果大家都找不着工作、失业率降到10%，这才是最好的——这个逻辑本身就非常诡异。\n\n3. 所以在混乱局面里，普通人该干什么\n\n当一个局面非常混乱的时候，作为普通的弱者，你最需要干的是保护自己。\n\n现在比如说是两个大军团的一场混战，那里头有的是武功高手，你还非要凑进去，说我准备把这场战争结束了、把他们都打败——你应该在旁边看着。你进去第一个死的就是你。\n\n他还用了竹林七贤做类比：\n\n为什么有竹林七贤？因为这些人认识到当时的社会太混乱，以他们自己的能力解决不了这个问题，所以不如隐退到江湖——这是最好的保护自己的办法。\n\n你现在做的是怎么不输。怎么能赢，不是你这个级别的选手需要考虑的。\n\n4. 还是那两条\n\n对待一次危机你就需要考虑两点：第一，你别被危机消灭了，别自己先牺牲；第二，在可能的情况下占点便宜。\n\n等他们打得都差不多了、都没啥劲儿了，你进去捡两个兵器，就够你吃一辈子了。\n\n5. 他讲的那个泰国空姐的故事\n\n1998年亚洲金融危机的时候，泰国有一批人后来靠股票发达起来。我看过其中一个人的传记，那个人原来是个空姐——你说空姐能赚多少钱？\n\n但当最后拼得你死我活的时候，那个东西的股价就是低到让你难以想象。所以那个空姐把多年的积蓄再贷了点款，全部买成股票，从此就不用再当空姐了。\n\n那时候泰国股市，打一折、打半折的都有的是，100块钱的股票一块钱买的都有的是。\n\n你只要活得足够长，这样的机会你总能遇到。\n\n6. 「未预见的危机才是危机」这句话，他不同意\n\n现在都说「一个被预见的危机就不可能是危机」，这纯粹是胡扯，你根本没经历过。2008年的危机，预见到的人多了——之前有很多人就跟今天的人一样提示危机肯定会来，氛围和今天是一样的，多少人都不信。\n\n当真正危机来的时候，无论谁提醒都没有用，大部分人都是不信的。\n\n7. 对AI泡沫的一句定性\n\nAI的发展需要泡沫，这都没有错。但这种泡沫最终一定要有人买单。发展科技是需要代价的，无论是中国还是美国都是如此——你最终一定要有人买单。\n\n## 七、他自己的收尾\n\n我今天其实应该是把这儿当课堂的第一天。但我依然告诉大家：虽然是课堂，那只是转变我自己的思维模式，我讲的内容依然属于评书，不是什么严谨的科学理论，也不是投资建议。\n\n包括你们看我雪球上的组合，那都不是我的实盘，我跟你说过800遍了。\n\n他还提了一个要求：\n\n你不要到我这儿来老告诉我说你买了什么股票。我什么时候建议你买什么股票了？这不是给我增加压力吗？","toc":["一、开场：把直播间从「聊天室」改成「课堂」","二、这场的正课：卖出的本质是什么","三、所以「长期持有吃分红」也是低买高卖","四、除权：它改的是历史价格，不是明天的价格","五、折现率：为什么未来的100万不值今天的100万","六、当下的判断：加息风险并没有解除","七、他自己的收尾"],"url":"https://xueqiu.com/2573414707/407890998","chars":5603},"topics":["买卖本质","低买高卖","分红除权","折现率","加息风险","危机防守"]},{"date":"2026-09-02","bili":{"title":"老木匠 2026年9月2日直播文字稿（银行股、危机生存、利率估值、国债混乱、美元潮汐、低买高卖）","text":"## 一、带病开场，先提醒打新\n\n刚回来看大家回复，还有点鼻音，感冒好多了，但味觉嗅觉没完全恢复。今天有个科创板打新，概率低，但万一中了呢——别忘了自己去打。我昨天中了个马矿，开盘就卖了，没卖到最高点，也就挣一万来块。\n\n## 二、盘面：黄金跌、日元破160、日本9月加息板上钉钉\n\n昨晚黄金跌了，今早没弹回来；日元汇率还在160以上。这次G20贝森特要求日本加息，9月加息基本板上钉钉。\n\n日本加息对日本其实不利——真为日本好，应该放任日元贬值，而不是去治理贬值。但日本那种政治体制下，真放任贬值老百姓受不了，政治压力太大，只能加息。\n\n银行昨天涨，道理很简单：房贷期限能从三十年延到四十年，每年还贷压力变小，坏账就少了。\n\n## 三、银行为何低估，又为何可能提分红\n\n四大行利差一直不小，盈利状况很好，但估值一直低，核心就是市场担心坏账。按道理这么低的利率水平，银行估值应该更高，现在没那么高，就因为大家担心坏账。\n\n为什么过去分红率不高？前些年房地产大发展，全社会贷款增加得非常快，银行不光受存款准备金率限制，还受巴塞尔协议约束——你可以把它简单理解为自有资本（净资产）占总资本的比率要达标。存款贷款都快速膨胀，自有资本不变，占比就不够了，所以那几年银行动不动就增发补资本。\n\n现在贷款量增速放缓甚至减少，不需要再补充自有资本了，留存利润补资本的压力没了。未来分红率有可能提高——原来不提高是有原因的，不是盈利不行。现在股息率也能到四点多，已经不低了。\n\n利率低银行估值该更高，道理很简单：存款利率就是无风险利率的锚。你存银行一年挣1%，买银行股一年挣5%，当然有吸引力。反过来，如果存款利息10%，分红只有5%，你还会买银行股吗？银行利息、国债利息都一样，都叫无风险利率之锚。所以加息影响这么大。\n\n## 四、加息如何压估值，以及巴菲特不为人知的真相\n\n加息影响巨大，因为所有风险资产估值模型里代入的是当前利率水平。利率（无风险利率）一升，算出来的合理估值就降，金融产品价格全跌；降息反之。这是基础，上过大学或学过点经济学的都知道。\n\n别拿巴菲特\"主席告诉我明天加息我也不为所动\"当挡箭牌。巴菲特的金融产品都做了对冲，利息变不变对估值影响很小；伯克希尔盈利的百分之三十来自复杂金融衍生品，不是你理解的可口可乐、喜诗糖果那些对外讲的故事。他当大股东大公司的投资模式，和年轻时自己当小私募不一样，都和期权期货对冲绑在一起。散户做不了对冲，比不了。\n\n## 五、危机来了先想两件事：活下来，再占便宜\n\n第一，永远排在第一位的：别被这次危机消灭，争取留在市场里。防波动不是嘴上说说——跌百分之三十到五十，大部分散户挺不住。这不是精神能扛的：副交感神经会让血液变粘稠、血压升、免疫力降，浑身冒冷汗。挺不住时会给自己找理由\"我不玩了\"\"我水平不行\"，那就是被市场消灭了。还有家人压力，天天捣鼓你、骂你，多少人最后妻离子散。\n\n第二，在第一条基础上，考虑危机过后怎么占便宜。每次危机都是财富重新分配，大量人占大便宜。伯克希尔成立以来，巴菲特赚大钱全靠危机——中石油、2008年那些股票，都不是白菜价能形容的，是包装盒的价。现在伯克希尔账上三千多亿美金现金，就是等危机。危机能让人赚大钱，但前提是活下来、知道走向。\n\n比喻就是游牧民族过冬：谁在冬夜没冻死，早晨一醒来别人的牛羊都是你的。今年主题是防风险，防住了，风险过后你才能第一个冲出去捡便宜。\n\n## 六、混乱的宏观：全球国债飙升、人民币升值、美元潮汐\n\n比日元汇率更重要的是：日本长期国债收益率大幅飙升，创几十年新高。全世界各国国债收益率都在创新高——英国、德国、法国都一样，美国十年期回到1998年水平，只有中国国债处在低水平。\n\n这种收益率飙升最后怎么收场谁也预料不了，可能直接恶性通胀，也可能先危机再恶性通胀。不确定性极大，千万别以为自己能预判谁赢——过程中先保证自己不处在输家地位。这是一次混乱的博弈，进去先被砍死，肯定不是赢家。\n\n空仓也危险：空仓等于满仓现金，若直接恶性通胀，持现金就是牺牲品。\n\n人民币升值趋势不可避免，不论美国加息降息。若美国加息、强美元下人民币还对美元升值，那对日元欧元会更快升值。当年我投有色时，早就把人民币升值算进前提了——这问题早就在问题之中，你现在才考虑已经晚了。\n\n美元潮汐：加息时全球股市一起崩，但美元重新放水开闸时，第一个缓过来的是美国（2008验证过）。你先挺不住死了，他剩口气开闸时第一个缓过来，你已死透。\n\n## 七、拆解\"美联储不能让你亏\"的信仰\n\n很多人信念：美联储不能加息，因为美国股市跌会造成社会动荡。剥掉虚的，你的逻辑链条本质是\"美联储不能加息，主要因为他不能让我亏\"——因为你持有股票。\n\n问自己：你真关心美国股市涨跌吗？你关心的是自己的A股、自己的股票。所以你的信仰其实是\"美联储不能让我亏\"。\n\n再问：你亏对美国有利，还是赚钱对美国有利？美联储就希望全球股市崩溃，能明天做就明天做。特朗普干的就是自损八百杀敌一千。既然潮汐由美国控制，他先让全世界挺不住，等去除原因（开闸）时第一个缓过来的是他自己。所以\"沃什搞不死美国\"——他搞不死美国，但他搞得死你。\n\n## 八、科技股戴维斯双杀，有色要等别人先死\n\n真加息受影响最大的是长久期科技股：靠融资、产业没闭环、不产生自身现金流，利息一高成本升、利润降，同时估值模型里无风险利率升、估值降——戴维斯双杀，最明显。\n\n有色贵金属同理受冲击，但放水后第一个缓过来的就是有色。问题是：现在就持有有色，便宜你占着了吗？没占着。你得让别人先死、哭爹喊娘时再下手。我13块卖的，现在9块就能买回，但我得等更狠——5块我没想买，原来4块多买的，三块行不行？占便宜要狠。\n\n两条路径：直接恶性通胀就涨上去（没买也没大损失）；或者先崩再买。发展路径不断变化，谁也不知道跌到哪。\n\n## 九、第一性原理：来赚钱的，专注低买高卖\n\n投资模式就是赚差价，不是为分红回本。有人\"价格高低跟我无关，靠分红回本\"——问A股最好股票靠分红回本分了多少年？\n\n同样赚一块钱价差，高位和低位风险完全不同：从1000跌到100买101卖，和从10涨到100买101卖，面临的风险不一样。高位疯涨随时结束直接把你扣里。所以主动追求卖飞——高处的差价可以不要，低位公司多的是，别一棵树吊死。\n\n第一性原理：你是赚钱来的，怎么赚钱？低买高卖。别研究博主谁跟谁好、谁跟谁不合，那都扯犊子。专注把自己的东西低买高卖，别的都是扯犊子。\n\n## 十、闲谈：年化、笨功夫、工资不出头\n\n盘面：中际旭创回购40到80亿，钱靠银行贷款、银行授信75亿，没到腰斩。创业板往上走了点。\n\n从6月30号到现在一笔交易没做，已跑赢所有指数。过去五年大幅跑赢，年化约23%（十二年）。巴菲特小资金时年化能到50%，你看到的是他成大富翁后的20%。\n\n读书没技巧，一个字一个字看，下笨功夫。行业里师傅夸\"聪明\"几乎是贬义——意味着投机取巧没下笨功夫；真夸是\"踏实\"。再聪明的人，想成事也要下笨功夫。\n\n工资不出头：律师会计师再金领，手停口停，没有复利效应。查理·芒格的道理：得让钱替你赚，不工作也有收入。穷爸爸富爸爸讲的也是这个。早投资比晚投资强，股票做好了能成收入来源、让人早退休。\n\n结尾：打\"评书\"标签，低买高卖写墙上每天念，别的都是扯犊子。","toc":["一、带病开场，先提醒打新","二、盘面：黄金跌、日元破160、日本9月加息板上钉钉","三、银行为何低估，又为何可能提分红","四、加息如何压估值，以及巴菲特不为人知的真相","五、危机来了先想两件事：活下来，再占便宜","六、混乱的宏观：全球国债飙升、人民币升值、美元潮汐","七、拆解\"美联储不能让你亏\"的信仰","八、科技股戴维斯双杀，有色要等别人先死","九、第一性原理：来赚钱的，专注低买高卖","十、闲谈：年化、笨功夫、工资不出头"],"url":"https://www.bilibili.com/opus/1243307566639874052","bv":"","minutes":0,"chars":3021},"ai":{"title":"老木匠·2026年9月2日：危机来临时，只考虑两件事","text":"## 一、当天的两个观察\n\n1. 日元：加息基本板上钉钉\n\n日元的汇率还在160以上。现在看来日本九月份加息基本上是板上钉钉的，因为这次G20峰会上贝森特也要求他们加息了。\n\n日本加息其实对日本非常不利。正常来说，假如真正对日本好，就应该放任日元贬值，而不是去治理日元贬值。但是在日本那种政治体制下，如果真的放任贬值，老百姓受不了，政治压力太大。\n\n2. 全球国债收益率同时创新高，只有我们例外\n\n昨天还发生了一件比日元汇率更重要的事：日本的长期国债收益率也大幅飙升，已经升到近几十年的新高。\n\n全世界其他国家的国债收益率都在突破原来的高度，而且是绝对高度，都创了几十年新高——英国、德国、法国都一样，美国十年期国债也到了1998年的水平。只有我们中国的国债还处在低水平。\n\n他对这件事的态度是明确的「不知道」：\n\n这次国债收益率的大幅飙升究竟意味着什么、最后带来什么？我告诉你，现在谁也预料不了。它一定会带来一种混乱风险，最后怎么收场谁也不知道——有可能直接引发恶性通货膨胀，也有可能先导致一次危机再引发恶性通胀。\n\n## 二、这场的正课：危机来临时只考虑两件事\n\n1. 第一件，也是永远排在第一位的：别被这次危机消灭掉\n\n每一次危机来临的时候，你需要考虑两件事。第一，最重要的、永远排在第一位的是：你不要被这次危机消灭掉。这次危机过去以后，你应该争取还留在市场里头。\n\n所以我为什么告诉你一定要防波动？你不要以为你看对了方向就一定会赢——你不一定能忍受得了这个波动。\n\n2. 「消灭」的两种形式\n\n消灭不是指你的钱没了。消灭有两种，还有一种是你被人打服了、产生恐惧感了。你再提股票的时候浑身颤抖、出冷汗、血压高、心跳快、呼吸急促、头晕——这都叫挺不住。\n\n当人最后挺不住的时候，一定会给自己找各种各样的理由：「我不是挺不住了，我是真不想玩了」，或者「我发现自己的水平确实没法在这个市场生存」。总的来说你就是离开了市场，你就是被市场消灭了。\n\n3. 他对「我能挺住」的拆解\n\n跌个百分之十、二十就开始骂证监会了，跌30%到50%你能忍受得了？你精神上可能能忍受，身体忍受不了——副交感神经系统会导致你全身血液变粘稠、血压升高、免疫力下降。\n\n而且它不是挺一下就过去了。市场真正的低迷期会很长。为什么说熊市的持续长度正好比你的忍耐力长一天？就是正好在你忍耐不住的时候，熊市结束了。\n\n他还提醒了一层很现实的：\n\n前两天有人说「我反正没有融资，跌30%、跌50%我都不怕」。你不怕，你媳妇儿怕，天天捣鼓你、天天骂你，你能受得了吗？有多少人最后是那种状态——妻离子散。\n\n4. 所以正确的做法不是「硬扛」，是不让自己进入险地\n\n对付危机实际上有很多种办法。一种是置之死地而后生，有的人就得每天死一回再活过来才有快感，就像那些探险的人。那你怕危险，干脆就不去危险的地方不就完了吗？\n\n5. 第二件：在第一件的基础上，考虑危机过后怎么占便宜\n\n第二条是在第一条的基础上——没有第一条啥都没有。你要考虑：我在这次危机过后怎么能占便宜。有危就有机，一次危机过后都是一次财富重新分配的过程，有大量的人会占到很大的便宜。\n\n自从伯克希尔成立以来，巴菲特赚的大钱利用的都是危机。2008年金融危机的时候巴菲特买的那些股票，那都不能用白菜价来衡量——那是一个包装盒的价：你买一个名牌包，实际上只给包装盒的钱。\n\n即便是包装盒，巴菲特还是要求：你如果涨不上去、最后退市了，你得有人给我担保把这钱退回来。\n\n他还点了个现成的观察：\n\n为什么巴菲特现在账上有三千多亿美金现金？他就是认为马上会来一次危机，他又有机会了。当然现在危机没来的时候，你大可以说他老了——2000年的时候大家说过一次，2008年说了第二次。\n\n6. 他反复用的那个比方\n\n为啥今年防风险？因为你只有防住了风险，到风险过后的时候才能第一个冲出去捡便宜。这就像当年游牧民族在草原上过冬：谁在冬夜里最后没冻死，第二天早上一醒来，别人的牛羊是你的了，别人的帐篷也是你的了。\n\n## 三、这场最锋利的一段：把「他不敢加息」的逻辑链拆开\n\n这是他这天讲得最长、也最步步紧逼的一段，用的全是反问。\n\n1. 先还原大家的推理\n\n大家都有这样一个信念：美联储不能加息，只能降息。理由很好找——40万亿美元国债、中期选举、美国老百姓的养老保险都投在股市里。你不管说啥，最终落到的点都是：美国不可能让美国股市跌。\n\n2. 第一个追问：你真的关心美国股市吗\n\n但是我告诉你，你问问你自己——你真的关心美国股市的涨跌吗？\n\n我告诉你，不是。你真的关心的是你自己股票的涨跌，或者把范围说大一点，是A股的涨跌。\n\n3. 所以那条逻辑链其实是这样的\n\n既然如此，这个逻辑链条就变得非常简单：你认为美联储不能加息的主要原因，是他们不能让你亏。\n\n你把其他虚的东西都去掉，最后是不是就变成了你的信仰——沃什不能加息，因为他不能让股市跌；不能让股市跌，因为不能让我亏，因为我持有股票。\n\n4. 第二个追问：你亏对美国有利，还是你赚对美国有利\n\n接下来我再问你一句话，你马上就能想明白：你亏对美国有利，还是你赚钱对美国有利？\n\n所以我觉得奇怪的一件事是，大家都认为美联储就希望全世界的股市都赚钱——这怎么可能呢？我告诉你，美联储就希望全世界的股票市场都崩溃。他如果明天能做到这一点，他明天就会做。\n\n那你告诉我，沃什有什么理由想让A股的投资者都赚钱？他有什么理由让投资科技股、投资有色金属的人不亏损？\n\n5. 第三个追问：「杀敌一千自损八百」这条挡不住\n\n你无非说的就是他不能杀敌一千自损八百——他不可能为了我这点钱让美国股市也亏。你是不是这么想的？\n\n第一，美国干这个事儿不在乎。特朗普干的事儿就是自损八百杀敌一千，贸易战干的就是这事儿。\n\n而更关键的是第二层：\n\n既然这次是由美元收紧造成的，那么当美元重新放水开闸的时候，第一个活过来的就是美国。既然大家现在全都挺不了，那我就让大家全都挺不了——但你要知道，你挺不了的原因在我；所以当我去除这个原因的时候，起码第一个缓过来的是我自己。2008年这事儿已经干过一次了。\n\n最后你先挺不住了、先死了，但他还剩一口气儿。然后他开始开闸放水的时候，他第一个缓过来，你已经死透了。\n\n所以经常有人说沃什现在加息能搞死美国。我说他搞不死美国，我不知道他能不能搞死你。\n\n6. 顺带纠正一个史实\n\n每一次美元潮汐，他自己也受影响。历史上的美元潮汐现象，在美元紧缩的时候他自己不受影响、只有其他国家受影响，怎么可能？保罗·沃尔克暴力加息的时候，美国股市也经历了很多年的熊市。\n\n7. 他为什么不在公开帖子里争这个了\n\n那些人靠的是信仰，有信仰的人是不能去跟他争论的。你们自己也记住：谁要是靠信仰来支撑自己的观点，你就不要和人争论，因为信仰是争论不了的。就像当年「京沪永远涨」——他说这话的时候靠的是信仰，那你怎么给他讲道理？\n\n## 四、加息为什么影响这么大：无风险利率是估值的锚\n\n1. 机制\n\n大机构投资一个金融产品的时候是有模型、有假设条件的，必须按照现有的利率水平代入，计算出它的合理估值。现在利率水平变了，这个模型算出来的估值就会变。\n\n利率上升，估值模型里的无风险利率就会上升；无风险利率上升，金融产品的价格就都会下跌。反过来降息的时候估值就会上去。这都属于基础知识。\n\n2. 所以受伤最重的是科技股：戴维斯双杀\n\n如果美联储真开始加息，受影响最大的就是长久期的科技股。因为科技股对利率特别敏感——它这个产业并没有闭环，不能自己产生现金流，只能靠融资，融资就对利息水平很敏感。\n\n利息一提高，成本就提高，利润就会下降；同时升息了估值模型也变了。所以它是估值和利润的双重打击，这就是所谓的戴维斯双杀。\n\n3. 「我不在乎利率」这种说法\n\n有人说巴菲特讲过「美联储主席告诉我明天就加息，我也不为所动」。那你跟巴菲特能一样吗？巴菲特所有的金融产品是做了对冲的，利息变与不变对他的估值没有太大影响。你能做对冲吗？\n\n伯克希尔的盈利里有相当一部分是这些复杂金融衍生品赚来的，并不是你理解的可口可乐、喜诗糖果——那是他对外讲的时候你能理解的部分。\n\n巴菲特作为大公司的投资，和他年轻时作为个人投资者或小私募的投资，模式是不一样的。他做小私募的时候跟我们散户一样，可以不做对冲；作为大公司你不做对冲行吗？一旦发生流动性危机，你卖都卖不出去。\n\n## 五、空仓也是一种投资——梭哈现金\n\n1. 他这次把这个说法讲到了最直白\n\n老是我一讲到这时候就有人说，那我就直接脱离市场、空仓持有现金。我不赞成这一点。\n\n空仓本身就是风险的一个组成部分。你知道什么叫空仓？空仓就意味着你投资的全是现金。你不要以为空仓这件事儿跟你没关系——空仓就意味着你投资的是现金，而且是单押现金，你也可以把自己理解为梭哈现金。\n\n2. 为什么现在拿现金也危险\n\n如果直接引发一次恶性通胀的话，你持有现金你就是牺牲品了。\n\n无论你说什么，你都是一种风险，因为未来是不确定的。\n\n## 六、赚差价：同样一块钱，位置不同风险完全不同\n\n1. 先说清楚自己的模式\n\n作为我的投资理念来说，博取的就是差价。我并不是不喜欢分红，我也喜欢分红，但我的投资主要模式还是赚差价。\n\n对「我不赚差价、我靠分红回本」这种说法，他的反问是：\n\n你告诉我，A股最好的股票，你买一只到现在为止靠分红回本的，你分了多少年回本？\n\n2. 关键的那个例子\n\n有一只股票原来是1000，现在已经跌到100，你100买、101卖；另一只股票是从十块钱涨到100，你也是100买、101卖。虽然你都赚一块钱差价，但你面临的风险是不一样的。\n\n一般来说后边那个差价虽然会涨得很快——因为一个公司的股票到最后阶段往往会疯涨——但这种疯涨随时会结束，直接把你扣里，所以那个时候风险非常大。\n\n同样的差价，你在不同的位置，风险是不一样的。\n\n3. 所以他为什么「主动追求卖飞」\n\n高处的那个差价你可以不要，因为还有很多公司处在低位。我有时候特别理解不了：你是来投资的、来赚差价的，你为什么非得在一棵树上吊死？\n\n你为的是价差，那跟你拿什么股票有什么关系？\n\n他举的例子是：\n\n某个标的从12涨到24，和另一个从7.5涨到15，都涨一倍，但它俩面临的风险是不同的。而且你不能用事后的东西来看——风险是事前判断的，不是事后总结的。\n\n## 七、你的很多「习惯性认识」都是错的\n\n1. 投资是理性的过程，不是感性形成的认识\n\n你一进来所形成的那种习惯性的对投资的看法，很多都是不对的。投资里面有很多东西和你想的是不一样的。\n\n2. 他打的那个运动的比方\n\n任何一项体育运动都是一样。你一进去打球，最初的发力点一定是你日常生活习惯带来的发力点，它一定和这项运动所需要的发力点不一样。\n\n所以你刚开始学一种运动的时候，纠正的就是这种习惯性。你必须先把它改掉，按照专业人士的发力方式来做，你才能学会这门运动。投资也是一样。\n\n他举的例子就是前一天讲过的分红除权：\n\n什么「分红分的不是我自己的钱吗」——你这都不对，你根本没经过思考，那只是你自己的感性认识而已。\n\n## 八、有色：便宜你占着了吗\n\n1. 他对有色的判断没变，但强调「位置」\n\n有色金属、贵金属也是一样。当最终不得不重新放水的时候，第一个缓过来的就是有色——所以我为什么说它是一个波动。\n\n但问题是，你如果现在就持有有色的话，那有色的便宜你占着了吗？你说的都对，有色没问题、肯定行——但那个便宜你没占着。\n\n2. 他自己的算法\n\n你不是不死就得了，你得占别人便宜，你得让别人先死。\n\n我如果现在再买回有色的话，是不是就已经占了很多便宜了？我13块钱卖给他们的，现在他们九块钱就可以卖给我。但我告诉你，这还不算占便宜——我占便宜的心要比这大得多，我得等到他们都哭爹喊娘的时候再买回来。\n\n现在这些人还有信仰做支撑，他还不服。现在凉菜都没上完，等上热菜的时候，所有人都会告诉你「这东西不能玩了、从此以后就不行了」——那时候你再进去。\n\n3. 但他也说了另一半\n\n情况是不断变化的，谁也不知道最终会跌到什么程度。甚至它也有可能不跌——发展路径有两条，如果直接就恶性通胀了，那就直接涨上去了。那涨上去你没买就是没赚着钱呗，那你有多大损失？\n\n4. 「凉菜」现在到哪一步了\n\n日韩股市跌两点多算什么大跌？这都是凉菜，热菜还没上呢。现在还这么多人都不服，你哪来的大跌？\n\n六月份科技股刚开始下跌的时候有人问我这算上凉菜吗，我说这连凉菜都不算，这只是餐具上来之前的瓜子和炸虾片。现在才开始上凉菜。\n\n## 九、人民币升值：这是他现在唯一确定的一件事\n\n现在有一个趋势是非常肯定的，就是人民币的升值。不管美国是加息还是降息，人民币的升值是不可避免的——至于升到什么程度，我不知道。\n\n如果美国开始加息，在强美元的形势下人民币还对美元升值，那就意味着人民币对日元、欧元会升值得更快，这你都是需要考虑的。\n\n他也再次说明了自己当年那个前提的变化：\n\n我当年投资有色的时候是做了前提的：我认为人民币应该跟着美元一起贬值，理由是我们也有自己的问题、也有国债需要化解。但今天的世界格局和原来不一样了，所以我现在对「美元大幅贬值时人民币是否也跟着大幅贬值」这件事产生了怀疑。\n\n所以你今天才考虑人民币升值的问题，那已经考虑得太晚了。\n\n## 十、银行为什么涨，以及它为什么长期低估\n\n1. 当天上涨的直接原因\n\n银行昨天上涨，道理很简单，跟房地产政策有关。你原来担心的是房价下跌、收入降低所导致的坏账；现在房贷可以从30年变成40年，每年的还贷压力变小了，坏账就减少了。\n\n2. 长期低估的原因不是盈利不行\n\n中国的大行利差一直不小，盈利状况都非常好。它过去五年一直处在非常低的市盈率，主要原因就是大家担心它的坏账，并不是它盈利水平不行。\n\n按道理说，我们这么低的利率水平，银行应该给的估值更高。\n\n3. 为什么估值和利率是反着的\n\n存款利率是无风险利率的锚。你存银行一年挣1%，那买银行股一年挣5%当然有吸引力；但如果存款就是10%的利息，而它的分红率只有5%，那你还买它干嘛？\n\n4. 为什么以前分红率上不去（这一段是新的）\n\n银行是高杠杆企业，大部分资产来源于老百姓的存款——存款对银行来说相当于负债，所以自有资本占比很少。除了存款准备金率，它还受巴塞尔协议约束，核心资本充足率要达到指标。\n\n前几年因为房地产大发展，全社会需要的贷款增加非常快，贷款一快、自有资本不变，占比就不符合约束条件了。所以那些年你经常看到这个行那个行动不动就要增发，就是这个原因。后来利润好了，就留存大部分利润来补充核心资本。\n\n但这几年银行的贷款量已经增加得很慢了，其实不需要再增加自有资本了。所以未来银行是不是还会提高分红率，我认为是有可能的。\n\n## 十一、几句关于「初心」的话\n\n1. 他当天反复带着直播间背的那句\n\n你干啥来了？赚钱来了。怎么能赚钱？低买高卖。回去写在墙上，每天念一遍。然后在后边写上：别的都是扯犊子。\n\n什么哪个公司是最伟大的公司、哪个公司管理层最优秀——那都扯犊子。不能低买高卖，那都扯犊子。\n\n2. 但他马上补了一句\n\n都认为自己低买高卖简单，好像只是不懂什么叫低、什么叫高。我告诉你，判断高低最简单，低买高卖可不简单。\n\n你低价买进来了，也不见得能挺到高价卖出。你高价卖完了以后，还得后悔一年——然后你已经忘了应该去买下一个低的了，而不是拘泥于这件事儿。\n\n3. 他对「研究别人」的态度\n\n你研究的是市场，你研究我能研究出钱来吗？我兴奋你能赚钱，还是我兴奋你能亏钱？\n\n你唯一需要做的是低买高卖——怎么想办法把别人手里值钱的黄金用白菜价买回来，再把你手里的白菜用黄金的价格卖给他，这是你需要想的。\n\n## 十二、投资不是「炒股玩」\n\n1. 工资是没有复利效应的\n\n所有靠工作的收入，不论你是多高级的工作——会计师、律师这种所谓的金领行业——都是一样的，就是广东人讲的「工资不出头」。所谓的手停口停，就是你只要一不干活，这个收入就没了。这个道理是我从查理·芒格那学来的。\n\n你打工只能给你提供一个启动资金。你做的东西必须要有一定的复利效应，最后得保证：你不工作的时候，钱替你赚钱。\n\n他还提了《穷爸爸富爸爸》里那个对照，并给了个更直观的现实观察：\n\n真正做企业经营的人，消费水平往往不如那些金领行业的人。你到北京、上海看得更明显：这些高收入的金领穿名牌、开名牌车、把孩子送国际学校，这都是标配，外表看起来收入水平更高，但实际上并不高。\n\n2. 所以他给的建议\n\n如果有可能的话，你一定要进行投资，早投资要比晚投资强，越早越好。\n\n而且大家一定不要抱着「我投资就是炒个股票、大家都玩我也赶时髦玩玩」的想法。你千万别把投资股票当成炒股票——它不是玩儿，它是一个非常正经的事业。你做好了，它就能让你辞职不干，甚至可以让你早退休。\n\n3. 顺带：不要学巴菲特现在的模式\n\n巴菲特像我这么小资金的时候，年化收益率能到50%。你们看到的都是巴菲特已经成为大富翁以后的那20%——那是他改变了投资模式以后的。所以有些人刚一进市场就说我要学习巴菲特，这都胡扯。\n\n## 十三、聪明是一种批评\n\n1. 读书没有技巧\n\n读书有啥方法？一个字一个字看呗。不要试图寻找技巧——干啥事都要下笨功夫。别在没干之前就先想「我得找个什么事半功倍的技巧」。\n\n再聪明的人，你要想做成一件事，也要学会下笨功夫。\n\n2. 在行业里，「聪明」几乎是个贬义词\n\n在一个行业里面，如果你师傅夸你聪明，你几乎就是完了，你成不了这个行业顶尖的。\n\n聪明就意味着你有很多时候在投机取巧——别人下的笨功夫你没下，别人遇到的困难你没遇到过。\n\n真正的师傅夸徒弟，应该说的是「踏实」：教你什么事都放心，会下笨功夫，做事有条不紊、一丝不苟。一旦说聪明，那就代表着毛毛糙糙、耍小聪明、抄近道，这些语境都是在一块儿的。\n\n## 十四、他自己的近况与收尾\n\n我从6月30号到现在，一笔交易没做，就跑赢指数了。反正挣钱不挣钱的，现在跑赢指数了，希望这种局面坚持到年底。\n\n他也说了自己在意这件事的原因：「最近五年我都是大幅跑赢指数的，不是跑赢一点儿。就是今年感觉特别累。」\n\n我讲的是评书，不能用来指导投资，所有的东西都是虚构的。","toc":["一、当天的两个观察","二、这场的正课：危机来临时只考虑两件事","三、这场最锋利的一段：把「他不敢加息」的逻辑链拆开","四、加息为什么影响这么大：无风险利率是估值的锚","五、空仓也是一种投资——梭哈现金","六、赚差价：同样一块钱，位置不同风险完全不同","七、你的很多「习惯性认识」都是错的","八、有色：便宜你占着了吗","九、人民币升值：这是他现在唯一确定的一件事","十、银行为什么涨，以及它为什么长期低估","十一、几句关于「初心」的话","十二、投资不是「炒股玩」","十三、聪明是一种批评","十四、他自己的近况与收尾"],"url":"https://xueqiu.com/2573414707/407890361","chars":7484},"topics":["银行股","危机生存","利率估值","国债混乱","美元潮汐","低买高卖"]},{"date":"2026-08-31","bili":{"title":"老木匠 2026年8月31日直播文字稿（地产新政、有色库存、周期反转、心法、看盘、信息茧房、饮食汽车","text":"## 一、房地产新政几乎拉不动产业\n\n有人问昨天的房地产新政。一句话：对实际产业拉动现在几乎没作用。整个行业已交给市场，得等市场出清，出清需要时间。\n\n把三十年房贷转四十年，吸引力有限。关键问题不是利息高低、不是首付比例，而是有没有真实需求。空房子这么多，需要消化很多年。你没有需求，金融条件再宽松也没用。\n\n对于存量房贷的人，转贷能减轻一点月供压力，这是真的。可以约定经济好转后提前还款，算个过渡办法。但\"供不应求、好地段卖一套少一套\"全是当年嘉宾的话——二一年所有人都这么认为，等房价一跌，仓库里的货全变成竞争性供给。\n\n白酒也一样。当年说赤水河的水、酱香型永远不能扩产，一降价，仓库里的存量马上变成竞争性供给。现在的铜同理。\n\n## 二、铜的\"供不应求\"是个伪命题\n\n显性库存口径：世界三大交易所（芝加哥、伦敦、上海）库存仓单 + 中国社会库存 + 保税区库存。让豆包、千问查，从二一年到二五年逐年变化，趋势很明显是增加的——但你查的时候得给时间点，比如\"以八月末为节点\"。\n\n铜价高位时产量会增加，因为贫矿、低品位矿都会重开，大矿企开发新矿。铜矿全球约六千个矿厂，研究员根本不可能挨家走，所以产量预测出入极大。国际铜业协会每年的产量指引每年都说错。\n\n再生铜更没法统计。所以这些东西都不确定，你一定要给自己留安全边际、容错空间。\n\n昨天的实际数据（豆包查，未核实，自行核对）：三大交易所合计显性库存——\n\n2021年8月末：32万吨\n\n2022年8月末：17万吨\n\n2023年8月末：16万吨（逐年下降）\n\n2024年8月末：59万吨（开始增加）\n\n2025年8月末：49万吨\n\n2026年现在：88万吨\n\n库存比历年同期多50万吨，你还说供不应求？库存增加就是用量减少的吸收器。涨价跟供需没关系，是金融属性导致的——黄金涨带动的。黄金没有供需关系，是美元币值下降导致的。\n\n囤积需求是关键。2023年特朗普上台前，芝加哥铜库存只有两万多吨；现在七十多万吨。增加的都是囤积——美国要加关税，大家先买回去囤着，赌涨价。库存累积在中间环节不动，非常危险。一旦未来不需要\"供不应求\"，这些库存全出来。\n\n## 三、铝：铝水交易与印尼扩产瓶颈\n\n铝库存下降不是因为供不应求。国外电价贵、电解铝产量低，不用看国外，看中国就行。\n\n国内铝库存低的主要原因：中国搞铝水交易。电解铝出来是液态，直接拉去铸件，不用铸铝锭。别国要先铸锭才能库存，下次加工再重新加热，多耗一次能源。中国铝厂和加工厂挨着，大部分铝水交易，不需要囤那么多锭。而且铸成的铝锭基本直接出口（国外也缺铝）。\n\n今年影响铝库存的两个原因：中东战争导致中东铝生产不顺利；欧洲能源涨价，很多电解铝厂关了难复产。\n\n印尼扩产的主要瓶颈是发电设备。中国双碳目标后不再帮国外建火电厂、不输出火电设备，别国自己造很慢。中国铝厂去印尼投产，铝生产线能马上建完，但电厂建得慢。印尼在产电解铝几百万吨当量，已建完生产线但电没配套，有的把电解镍的电转过来（镍现在成本高），变量很大。\n\n另一个不确定性：铝价若特别高，中国4500万吨人为上限会不会放开，不好说。投资永远不可能全部确定，要在假设基础上留安全边际。\n\n## 四、周期反转的四大信号\n\n1. 高景气持续足够长时间。产能会逐渐扩张，即便不考虑需求。铝高景气快两年了，铜也两年多，贫矿低品位矿都重开。\n\n2. 周期变成\"非周期\"叙事。当周期股开始讲\"我不是周期股\"的故事时就要小心——当年三一重工最后讲的都是出海、占领国际市场，变成\"周期性成长股\"。\n\n3. 股东人数大幅增加。股价大涨同时股东人数成倍增加（比如50万变100万），说明优势投资者已在抛弃。上下波动10%没统计意义，得是成倍变化。\n\n4. 论坛特别热闹（雨晴特别热闹）。\n\n这四点一出现就要小心，但不是说马上卖——股价谁也判断不准。只是提醒你风险来了。\n\n## 五、2007年有色大牛市回顾\n\n2003年伦铜只有1.6万/吨，到2006年初涨到接近6.5万，两年多涨了四倍。当时有色被称为\"五朵金花\"，相当于现在的科技股，炒的是\"眉飞色舞\"（有色+煤炭+钢铁）。\n\n股票经过两波上涨：第一波到2007年\"五三零\"（半夜加印花税）前，云铜从2块涨到20块（十倍），然后横盘；五三零大跌后，又来一波几倍涨幅，最后那波基本是出货。云铜从98块跌到9块，江铜最高78块。\n\n老木匠零七年刚入市就买江西铜业，23块赚一倍走，后来最高78。当时中国还没有铜矿公司（紫金、洛阳钼业都是后来才有），矿受制于人。\n\n结论：周期股调整时波动极大，能挺住的人都不是一般人。投资模式要匹配自己的天性——有人能追涨杀跌不怕，老木匠自己很难止损、不喜欢止损。\n\n## 六、投资心法：性格、仓位、低买高卖\n\n仓位管理极度个人化。同样投资100万：总资产1000万是一种管法，只有100万是一种，50万还是借的是另一种。最好的仓位就是\"拿着舒服\"。\n\n风险与盈利要兼顾。空仓没风险但也没盈利，那不叫投资。谈风险得是在市场里谈。\n\n低买高卖是唯一赚差价的方法。难点不在判断高低，在低价不敢买、高价不舍得卖。低价时你想着更低，高价时想着更高——最终博弈的是自己，不是别人。\n\n银行案例：三年前四大行分红率超5%、市净率0.8。相当于合伙开银行，别人投1块你只需0.8块，一年挣2毛（ROE约20%），业务国家兜底。2020年工农中交各买25万就行。现在还是0.8PB，是因为每年盈利高但只分5%，积累13%推着股价涨、PB不变。\n\n从2块涨到6块的票，获利盘巨大，某天有人获利了结就形成正反馈，越跌越有人保。两块钱买入的人和六块钱买入的人，对待未来波动的能力完全不同。\n\n与自己博弈：隔着玻璃（屏幕）时胆子大，真上战场枪响一声就懵。别把自己想那么勇敢。军工没法估值、从不买。\n\n## 七、看盘与量价\n\n看盘靠\"手熟\"，不是教能教会的，得沉浸其中、经历多了才有感性认识——像骑自行车、像教育孩子，都是博弈结果，没有指挥部。市场没有对错，有对错的是人。\n\n量价关系：快速上涨期突然放巨量（天价天量），说明有人跑，必然产生大波动。\n\n机构交易模式：机构定好计划，上午（尤其十点半前）基本买完，一天调仓结束。所以成交量十点半前大、之后萎缩。散户可利用这点\"蚂蚁冲浪\"——上午十点半前卖、下午买回，胜率高。但老木匠现在不玩了，嫌累。\n\n看盘要看有队列的成交（六档盘口），能看到大资金异动、程序化定时单（如每12秒买固定手数=机构进货）。无档成交没信息。\n\n## 八、信息茧房与自媒体\n\n防信息茧房最简单办法：隔一段时间把关注的人换一遍。不换，算法老给你推相似的人，你看到的世界越来越窄。可以准备两个手机，一个不断换号。热点不用关注人，算法按你偏好推，反而制造茧房。\n\n众口一词要警惕。大部分人认为美联储不会加息，老木匠观察结论都是\"不加息\"才划走，说加息的反而仔细看——但没几个人仔细说加息。包峰、向松祚等都是一个调子（嘴炮），不仅不加还想降息。\n\n分清\"提醒加息风险\"和\"认为就会加息\"——这是两回事。老木匠说防风险不等于预测一定发生。\n\n特朗普对伊朗开两炮是火上浇油，原油上去，铜怎么控？谁也猜不着，不得不防。\n\n## 九、饮食闲聊\n\n海鱼可生吃（渗透压不同，寄生虫在人身体里活不了）；淡水鱼不行，广东鱼生有肝吸虫。螺类也有寄生虫。猪身东西不敢生食。\n\n肥肉不长胖，是配饭长胖的。纯吃肉吃不下几块。食肉动物体型不大。吃肥肉与低密度脂蛋白无关，可能提高甘油三酯。\n\n核污水比喻：日本人往泳池撒尿——别人都偷偷撒，他非站起来喊\"我准备撒了\"才惹众怒。偷偷撒和公开撒是两回事。\n\n松子榛子十一二月吃，腰果伤肾少吃，干果每天保证量。东北瓜子香（油料作物含油量高）。\n\n三文鱼分种类，国内小市场卖的\"三文鱼\"可能是淡水红鳟，不能生吃。\n\n## 十、汽车与轮胎周期\n\n新能源汽车还处初创期，竞争格局脆弱易打破，不像燃油车已定。与其赌整车，不如赌电池。汽车和轮胎的关系像航运和造船——轮胎有初装+更换双重需求，新能源车自重更大、轮胎磨损更快、用量应增加。\n\n但轮胎前几年无序扩产导致全行业亏损、竞争极激烈。中国轮胎产量大但没有世界响亮品牌（米其林、普利司通都是国外的）。投资要研究：哪家企业未来品牌能国际突围、周期位置、会不会被淘汰、现金够不够熬过周期。\n\n周期股别迷信\"独门技术\"——周期行时大家都行，不行时都不行，关键是别买最易被淘汰的低端。铜矿周期往下，再低成本的矿也不行。新能源车的\"独门技术\"明天补贴一退全卖不动。\n\n邓普顿逆向投资：从低迷期出来时买最烂的汽车企业（弹性最高），做个组合防淘汰。老木匠为保证安全搁中间选、排掉后边。\n\n不买龙头的理由：弹性不够。洛阳钼业4块买到12块就清仓，后面涨到28跟自己无关——后期风险太高不计价。卖飞的钱存银行，有更确定的机会。\n\n宇通客车案例：疫情放开第一个赌，8块买，涨了就卖没拿住（犯同样的错）。航空公司三年疫情都没跌（股东有信仰赌放开），没弹性不买。\n\n所有提到的个股都是老木匠过去的投资（甚至二十年前的），绝非推荐。投资赚的是差价，不是对公司的信仰。","toc":["一、房地产新政几乎拉不动产业","二、铜的\"供不应求\"是个伪命题","三、铝：铝水交易与印尼扩产瓶颈","四、周期反转的四大信号","五、2007年有色大牛市回顾","六、投资心法：性格、仓位、低买高卖","七、看盘与量价","八、信息茧房与自媒体","九、饮食闲聊","十、汽车与轮胎周期"],"url":"https://www.bilibili.com/opus/1242630649737641992","bv":"","minutes":0,"chars":3757},"ai":{"title":"老木匠·2026年8月31日：库存数据与周期反转的四个信号","text":"## 一、房地产新政：金融条件放宽，解决不了需求问题\n\n1. 他的判断很简单\n\n这种政策对实际产业的拉动，现在几乎没有什么作用。现在整个行业是交给市场了，你就得等待市场出清，而市场出清就是需要时间。\n\n你想把30年的房贷变成40年，这个东西能有多大吸引力？现在关键的问题并不在于贷款利息高低，也不在于首付款——关键问题是需求。\n\n你没有实际需求，即便金融条件再宽松也没有用。他不需要房子，你再宽松他也不买。\n\n他补充说对存量房贷的人倒是有实际好处：可以转贷把期限拉长、先缓一缓月供压力，等条件好转再约定提前还款。\n\n2. 对行业周期的判断\n\n地产这事我都不是以年计的，你再过五年以后再看吧。而且即便再过五年、再过十年，他也回不到过去的辉煌了。你想回到21年之前的高点，那是永远也不可能的——那得等把这一波的房子都熬倒了才行。\n\n3. 由此又回到那个老问题：所谓「供不应求」\n\n21年的时候，所有人都认为房子供不应求，什么「好地段是干一套少一套」。等房价一下跌，你发现这些事全是瞎编。当年说白酒也是一样，什么赤水河的水如何如何、酱香型永远不会过剩。\n\n等它一降价的时候，原来存在仓库里头的东西马上就变成竞争性供给。\n\n## 二、这场最硬的一段：三大交易所的铜库存数据\n\n1. 先说清楚什么叫显性库存\n\n所谓显性库存，是指世界三大交易所——芝加哥、伦敦、上海的库存仓单，再加上中国的社会库存和保税区库存，这就是我们国内一般统计的显性库存口径。\n\n2. 他念的那组数（三大交易所合计，均截止八月末）\n\n他强调这还没算中国的社会库存和保税区库存，实际显性库存比这个更多：\n\n2021年是32万吨，2022年是17万吨，2023年是16万吨——这三年是逐年下降的。然后2024年变成59万吨，2025年是49万吨。你知道今年是多少吗？现在是88万吨。\n\n你告诉我，你说铜供不应求，那为什么今年八月末比历年的八月末多出这么多库存呢？\n\n3. 库存本来的作用：它是供需的「吸收器」\n\n铜的供需平衡是非常严谨的，因为库存的财务成本很高，你不可能囤太多。一年的用量和一年的生产量应该是匹配的，不匹配就体现在库存里——库存相当于一个不匹配的吸收器。用量增加，库存会减少；用量减少，库存会增加。\n\n那你现在告诉我库存增加了，是用量减少还是增加了？\n\n4. 多出来的是什么：囤积需求，而且这次有具体原因\n\n所谓供不应求本身就是个伪命题，因为它把囤积需求也当成一种需求了——当然供不应求，但实际上它并没有被消费掉。\n\n他给了这一轮囤积的具体动机：\n\n美国要给铜加关税，所以一大部分人先把铜买回去囤起来——等到有关税那天再卖出去，可以把关税那部分放进自己口袋。\n\n特朗普上来之前，芝加哥的铜库存只有两万多吨，根本不是一个量级；而现在已经是七八十万吨了。这里头增加的全都是囤积需求。\n\n你要不是囤积的话，怎么能在那累积八十多万吨呢？你不是应该买过去就用了吗？你说美国算力需求，那怎么会囤在交易所里头？\n\n5. 所以真正的风险在于\n\n你考虑的都是未来供不应求。那我告诉你，未来一旦供求平衡的时候，这些库存是不是得出来？这相当于是今年节省下来的需求。\n\n6. 铝为什么库存在降，而且不具可比性\n\n铝库存下降不是因为大家想的那样供不应求。国外库存低是两个原因：中东战争导致生产不顺，欧洲能源涨价导致电解铝厂关停后很难复产。\n\n而国内库存低的原因是不具有参考性——中国现在搞的都是铝水交易。我们铝厂和铝加工厂是挨着的，电解出来的铝液直接拉过去就铸件了。而其他国家要先铸成铝锭，铝锭才能成为库存，下次加工时还得重新加热熔成铝水，这就重新耗费一次能源。\n\n他还给了铝的两个不确定性：一是印尼扩产（瓶颈在配套电厂——「我们不再输出火电设备，所以电解铝生产线可以马上建完，但电厂建得很慢」），二是国内4500万吨产能上限如果铝价特别高会不会被放开。\n\n## 三、周期高点反转的四个信号（这次讲全了）\n\n这是他前面几场陆续讲、这天一次性列完的：\n\n1. 第一：高景气持续的时间足够长\n\n当一个周期在高景气里存在的时间足够长的时候，你就要开始加小心了。因为这个过程当中产能就会逐渐扩张——你即便不考虑需求，产能就已经开始扩张了。\n\n铝的高景气周期都快到两年了，铜的高景气周期也两年多了。这个过程就会导致贫矿、低品位的矿都会重新开采，大矿业公司也会去开发新矿。\n\n2. 第二：开始有故事说「它已经不是周期股了」\n\n你发现一个明显的周期股，现在讲的所有故事都认为它不是周期股的时候，你就要小心。比如当年的三一重工，到最后讲的都是出海、都是占领国际市场——就是说已经不是周期股了。\n\n反正会编出来一个什么新名词：成长股、周期性成长股、新周期，就是说和原来的生产模式完全不同了。\n\n3. 第三：股价大幅上涨的同时，股东人数大幅增加\n\n这得是那种成倍的变化，比如原来50万突然变成100万，上下10%不具有统计意义。\n\n你就一定要想这个问题：在这次上涨的过程中，一定有一部分优势投资者已经抛弃了这只股票——否则他的股东人数不会出现大幅上涨。\n\n4. 第四：舆情特别热闹\n\n论坛里头人特别多。\n\n5. 他特意加的一句限定\n\n我不是说这四个现象只要一出现你就应该卖出。股价这事儿谁也判断不准，我只是告诉你这个时候要小心了。至于是不是应该马上卖出，那是你个人的事。\n\n他还提醒要区分两件事：「这是股票价格的波动，还是这个行业的景气周期已经开始反转？我现在不认为有色的景气周期已经反转了，我还没看到反转的证据，包括造船我也不认为反转了——但它的股价会有波动，这是两个完全不同的事。」\n\n## 四、2007年那一轮有色：一个完整的样本\n\n1. 当年的价格变化\n\n2003年的时候伦铜只有16000（每吨），到2006年年初就涨到接近65000。你想一想这个涨幅有多大——两年多的时间。所以那时候有色金属的牛市比现在这次还大。\n\n当时的假设你知道是什么吗？是中国的房地产和基建需要大量用铜铝铅锌，所以炒得眉飞色舞，不光有色在涨，煤炭、钢铁都在涨。那时候有色金属被称为「五朵金花」，就相当于现在的科技股。\n\n2. 股价走了两波，第二波是为了出货\n\n第一波大概涨到2007年的530之前——就是连夜调印花税那次，「半夜鸡叫」就是从那来的。当时那些标的从两块钱涨到20块，已经十倍了，然后就开始横盘，因为大家都认为涨到头了。\n\n结果530过后又来了一波涨幅，也涨了好几倍。但从那以后就完了。我认为最后那一波上涨就是为了出货——那个时候只是不懂。\n\n3. 然后是回撤\n\n后来一直跌到2009年就跌破十块钱了。你想一想，它是从98块钱跌到九块钱的——那么这种回撤你能受得了吗？我不相信有人能受得了。\n\n他也说了自己当年的经历：「江西铜业我是在涨之前买的，赚了一倍就走了，23块卖的，结果后来又涨了三倍。」\n\n## 五、你说你能忍受波动——先把自己带进去\n\n1. 他的追问方式\n\n你们都说能忍受波动。那铜矿股波动个50%很正常，今年年初那些著名的铜矿哪个没波动50%？你是不是普通人都能忍受？你得把自己带进去。\n\n你今年五六月份忍受住了一个50%的回撤。那我告诉你，如果再来一个50%的回撤，你能忍受住不？\n\n2. 更关键的一层：真跌的时候你看到的全是坏消息\n\n最关键的问题在于，你现在的设想是「再跌50%这事儿就开始反弹了」——你是在假设这件事。我告诉你，真正实际发生50%回撤的时候，你那个时候看到的全是坏消息，你根本不知道未来会不会再回来。\n\n3. 他举的那个反例\n\n最典型的，某个白酒老二从400块钱来一个腰斩，你挺住了；再来一个腰斩，你觉得你还能挺住；再给你来一个腰斩呢？现在跌到70块钱的时候，那我问你，你告诉我它一定能涨回去吗？\n\n他还提醒了几个同类的例子：当年那些「毛」——免税、医疗、酱油，「你从400拿到70，那你的东西是不是还一定能回到400？」\n\n4. 所以要找的是「不用挺」的东西\n\n所谓适合自己的，不是「我能挺住、我这个人有信心」。你挺住也不行，你最后高血压了、心脏病发作了，那不行。\n\n你得找到和你身心相契合的——我持有这个东西，我内心没有波澜，而不是靠挺。你要都这么挺的话，巴菲特和芒格能活到一百岁吗？早就挺没了。\n\n5. 两个最要命的心理执念\n\n有的人有那种「最高点情节」——自己经历过最高点以后，就给自己设个心理锚：再回到最高点我就卖。我告诉你，有不少人是这么被套牢的。\n\n还有「回到成本价我就出」。这都是心理误区，而且这都是最后可以导致你倾家荡产的毛病。这些基础毛病你还都没改，你就别提在这个市场上稳定赚钱——那就相当于打高尔夫球的人到了球场还用手使劲。\n\n## 六、同样是低估，两块钱买和六块钱买完全不同\n\n1. 他讲的这个道理很关键\n\n一个标的从两块钱刚刚涨到六块钱的时候，六块钱它也可能还是低估的。但是你现在六块钱买入，和人家两块钱买入的人，对待未来波动的能力是完全不同的。\n\n过两天跌到三块钱、腰斩了，你能受得了吗？\n\n2. 因为高位一定有大量获利盘\n\n从两块涨到六块的票，就一定有大量的获利盘。而这些获利盘突然有一天因为某种原因想获利了结的时候，这个票就一定会波动。\n\n获利了结会形成一个趋势：你越了结它就越跌，越跌就有人越提前要跑，它就会形成一个正反馈。它再上来是需要时间的——不是说今天跌一天，明天就完了。\n\n3. 然后你就开始自我安慰\n\n这个时候你开始安慰自己了：这公司特别好，我不在乎这波动。有人卖出是傻子——他卖出是傻子，他也影响你的心情，你明白不？\n\n## 七、四大行那笔账：你不是不知道它便宜\n\n1. 他把当年的机会翻译成了一个生活场景\n\n三年前银行的分红率都超过5%，市净率零点几。当时投资国有四大行相当于什么呢？\n\n有人跟你说：咱俩合伙开个银行。我们已经投了，一股是一块钱；现在你进来，一股只要八毛就可以了。便宜不便宜？\n\n你说投完了不赚钱怎么办？他说我现在老赚钱了，按净利润一年就能赚20%，你投一块钱一年能赚两毛。你说以后没业务怎么办？他说业务可老多了，都替你找完了，不用你管。而且这个企业永远不会黄，因为国家会保护他。\n\n现在有一个人要跟你合伙做这生意，你做不做？\n\n2. 那为什么当时没人买\n\n那为什么你们都不买呢？你不知道它低吗？因为你不敢买——你还合计那八毛钱再过两天变七毛了、再过两天变六毛了。\n\n他当年给朋友的建议就是一句话：「100万，工农中建各买25万就完事，你啥也不用看。你有一个亿各买2500万也没问题，那点钱扔到四大行里连响声都听不着。」\n\n3. 他顺带解释了银行为什么现在还是0.8倍\n\n是因为它的盈利特别高，但分红率达不到盈利那个水平。比如一年挣20%，只分5%，那每年就积累了13%。你股价每年涨13%，它的市净率是不变的——这是一个简单的算术题。\n\n4. 所以那句结论\n\n低价高价你自己绝对能判断出来，并不难。难的是你低价的时候不敢买，高价的时候不舍得卖——因为低价的时候你想的更低，高价的时候你想的更高。\n\n所以最终市场上你博弈的根本不是别人，你是在和自己博弈。你怎么能拗得过你自己，这是最重要的。\n\n他还补了一句：「现在市场也有的是金子，但我不能跟你说，我只能跟你讲过去的事儿。有的是——你连算都不用算，拿脚后跟都能想明白它低估了。」\n\n## 八、不确定性与安全边际\n\n1. 为什么铜的产量预测总是错\n\n国际上大概有6000个采铜矿的矿场。你研究铜矿实际上不可能挨家去走——你盯着的都是那些年产几十万吨、上百万吨的大矿，那种年产几万吨的很多。\n\n所以国际铜业协会每年的产量指引，最终他都说错：说今年过剩结果短缺，说今年短缺结果过剩。因为它非常不好统计，再生铜更没法统计。\n\n2. 所以结论是\n\n这些东西都是不确定的。不确定你就一定要给自己容错空间，不要把对自己的计算和期望打得特别满——一旦出现错误的时候，对你的冲击是很大的。\n\n你算的那个数都是在你自己假设的基础上算的，而你那个假设本身就不确定。所以你应该怎么办？给自己留足够的安全边际——安全边际就是用来容错的。那什么情况下可以买？它跌到足够低你就可以买。\n\n## 九、仓位管理和「防风险」\n\n1. 仓位管理没有标准答案\n\n仓位管理是一个非常个人化的东西。同样是投100万，你总资产1000万是一个管理办法，你手里只有100万是另一个办法，你只有50万而且是借的又是另一个办法。\n\n什么叫仓位管理？就是按照你自己心里拿着比较舒服，这就是最好的仓位。\n\n2. 要同时考虑两件事\n\n仓位管理最主要考虑的是风险，其次也要兼顾盈利。你不是说考虑风险我就不考虑盈利了——那我直接不做了就完了呗，那就一点风险也没有。\n\n你不能顺着二极管的想法：要没风险那就空仓。那你空仓不就相当于离开市场了吗？你也没有盈利了。我们所聊的风险，是在投资状态下的风险——你已经清仓不在这个市场里面了，你还谈啥风险呢？\n\n## 十、看盘：机构的交易模式和你完全不同\n\n1. 为什么成交量集中在上午\n\n有人问为什么十点半之前成交量特别大，他的回答是：\n\n你们之所以不明白，是因为老拿自己的交易模式和机构去比。机构今天要买多少，是开完会定好的，剩下的就是操盘手去执行，十点之前基本就买完了。\n\n机构不可能像我们个人这样做小波动，他做不了。所以他们的成交基本集中在上午，半个小时基本就结束了，这一天的调仓就结束了。\n\n尤其对于大型机构，那都是定好的事儿——未来三个月把这个仓位给我清了，剩下的就是操盘手一直往下清，同时要防止对股价造成大的扰动。所以买卖要分时间，否则你进出那么一下子，不就变成操控股价了吗？\n\n2. 所以散户是可以利用这个模式的\n\n散户是可以利用机构的这种交易模式赚他们的钱的。比如一个处在上涨趋势的股票，你可以在上午十点半之前卖，下午再买回来，每天赚这个差价，胜率是非常高的。\n\n这就是典型的蚂蚁冲浪——这个浪是由机构进出造成的，河马进出的时候这个池塘就有浪了。但是河马自己是玩不了这个浪的，蚂蚁可以玩。\n\n他说自己现在不玩了的原因是「嫌累了，也干不动了」。\n\n3. 看盘要看什么\n\n主要还是看量价关系。但你得看那种有成交队列的行情，看那种五档委托的没有什么信息。\n\n你看长了就知道哪一个大资金有什么异动——一冲就把上边的卖单全部冲掉，你就知道有人着急要买。你甚至能看到程序化交易的定时单：比如每隔12秒就出现一个固定的数量。那你一看到这种单子，就知道这是机构在进货，他根本不需要人下单。哪个散户能这么干？散户都是一把梭哈完事儿。\n\n4. 但这东西教不了\n\n这不是我能教给你的东西，你得经历。就跟骑自行车有啥区别？你让我讲一讲自行车怎么骑，那我可老难讲了；但你骑两天你就会了。\n\n## 十一、想学会就下注\n\n1. 他的经验\n\n对市场的理解和观察，最好的办法是下注。你只要下了注，你的精力马上就集中了。你说我准备先学会我再下注，那我告诉你，你几乎永远都学不会。\n\n就跟散户说「我准备把它研究明白我再买」一样——那你几乎永远也研究不明白。你买完了一套住，你就能研究明白了。\n\n2. 他自己的模式，以及由此犯的错\n\n我是先做个大致的看法，少买一点。所以这也造成我经常容易犯一个错误：我一买它就涨了，我就不想留了、不想研究了，就卖了——涨了你研究就没动力了。\n\n所以我希望的是我刚买的时候它下跌，然后我可以把它研究得特别明白。研究明白了，我就知道是否可以继续加仓。所以往往刚一买就套住的标的，对我来说反倒能赚大钱。\n\n他举了自己几次「买了就涨、涨了就卖、结果错过大牛股」的经历，并强调那些都是很多年前的持仓、现在早就不看了。\n\n## 十二、他为什么不买龙头（这次说得最直白）\n\n1. 直接的回答\n\n经常有人问我，那你为啥不买有色里面的龙头呢？这回我给你们讲明白了——我不买龙头，我不喜欢龙头，龙头弹性不够。\n\n你看龙头的弹性才多少？从22年之后到现在也就涨了一倍多一点。而且这一倍多一点里，后期有一大段时间是风险急剧增高的——那对我来说都不会计价。\n\n2. 他的取舍逻辑\n\n我只要从两块钱拿到四块钱就行了。他四块钱又涨到十块钱，那跟我没有关系——因为后期的风险太高了，不确定性太强，我不会拿那么高。\n\n所以有人说我某个标的「卖飞了」，那跟我有什么关系？我到那个点就该清仓了，剩下的跟我没关系。我卖完了钱存在银行里，我不还有更确定性的投资机会吗？\n\n3. 他为什么当年买铜不买黄金\n\n为什么我讲美元贬值的时候没买黄金股？因为黄金股的估值实在是下不去手，所以我只能买铜股。\n\n同样的逻辑他也用在了当年的旅行社上：「疫情放开我第一个赌旅行社恢复，但中国的旅行社实在找不到业绩能看得过眼的公司。」\n\n4. 航空公司那个反例，他又讲了一遍\n\n疫情一放开，谁都知道航空公司业绩马上就恢复——那是第一层次思维。第二层次思维是：你得看看那些人在疫情期间绝望了没有？他都没绝望，三年疫情股价都没跌，那说明里头的股东都很有信仰，都在赌哪天放开。\n\n他没卖、他不打折，你买它干啥？他哪有弹性？所有人都认为赌反转，结果你看这些年航空公司的股票——都是傻狍子来接盘，他能涨吗？\n\n5. 邓普顿是怎么做的\n\n你看约翰·邓普顿写的逆向投资就知道了：汽车行业开始从低迷期走出来的时候，他买的都是最烂的汽车企业，因为它的弹性最高。然后他怕哪个企业被淘汰，他就做个组合。\n\n我为了保证安全性，都是搁中间选，把后边的排掉——最低端那个不能买，容易挺不住；最前边那个信仰太足，股价不会跌太多。\n\n## 十三、周期股不用研究那么细\n\n1. 他的方法\n\n我要研究一个行业，就把大概这些企业目前的盈利状况、产能状况列个表看一眼，然后分析每一个公司，就可以了。剩下就看这个周期所处的位置——历史上涨到多高，现在已经跌了多少。\n\n然后你看一看这个企业会不会在这轮周期当中被淘汰掉。如果淘汰不掉、现金还够、你认为他能熬过这一波周期，那你就买了，等着就行了。\n\n2. 别迷信「独门技术」\n\n你不用把每一个公司搞得那么细，这个公司生产这个技术、那个公司生产那个技术——那技术你懂了也没有用。\n\n别跟我扯什么「我用崩裂法挖矿、我的挖矿技术成本最低」。我告诉你，铜矿如果周期往下走的时候，玉皇大帝开铜矿他也不行。\n\n对于周期股来说，周期行的时候大家都行，周期不行的时候大家都不行。如果大家都不挣钱你还挣钱，那只有你财务做手脚了。\n\n3. 轮胎那个例子（讲的是「研究什么」的层次）\n\n你研究一个行业，既要研究需求，还要研究供给。轮胎是跟着橡胶走，而最主要的是跟着轮胎厂的供给走。\n\n中国的轮胎企业多、产量大，但我们在国际上没有叫得响的品牌——前十的品牌里没有几个是中国的。所以如果你要投资轮胎，你要想的是：哪一个中国企业未来的品牌会在国际上脱颖而出？\n\n他还顺带讲了轮胎和汽车不是一个周期：「这个区别就有点像航运和造船。轮胎有两种需求，一种是出装需求，一种是更换需求。而且新能源车自重大、对轮胎等级要求高、磨损更快，所以从价值上说用量是增加的。」\n\n## 十四、货币重置式的通胀里，最抗通胀的是什么\n\n1. 他给的答案不是矿\n\n当有一天美元是那种货币重置式的贬值的时候，所有东西都会涨价。这个时候最抗通胀的不是矿，是品牌消费品——因为他们最有提价权。\n\n矿不见得最有提价权，你矿面临着很大的竞争。而且一旦开始恶性通胀的时候，你的生产马上就受限。\n\n2. 而且算账时你只算了一头\n\n你以为美元贬值只导致铜价上涨？它也导致机械价格上涨，也导致人工成本上涨，而且铜价上涨还导致税收增加。你说那玩意儿都是假设。\n\n3. 需求这一头同样是假设\n\n恶性通胀的时候，这种需求还能进行下去吗？美国政府一加息，AI数据中心还能建吗？电站还建不建？电站都不建了的话，你还需要那么多铜吗？\n\n你现在是按照现有的铜需求在计价——那个假设是没有用的。现在是供不应求，没错；但你说未来一定供不应求，那可不一定。\n\n他还提了个更根本的疑问：\n\n即便是AI，按照现在这个发展下去，是否还需要这么多计算中心，这是需要打问号的。算力基础设施的建设是否可以无限地线性外推？这就跟修高速公路一样——刚改革开放的时候大量需要修，那我问你，你现在还往哪修？\n\n## 十五、他反复要澄清的两件事\n\n1. 「提示风险」不等于「预测一定发生」\n\n很多人分不清你说的风险和确定性的区别是啥。你说要防止美联储加息的风险，他马上就说「你说美联储就要加息了」——这都是哪跟哪儿？\n\n有人说我又说要提醒加息风险、又说这不代表我认为他就会加息，说我这是为了流量。我直接告诉他：我要是流量都像你这种傻狍子，那我干脆就不做自媒体了。\n\n2. 防信息茧房最简单的办法\n\n你隔一段时间就要把你关注的人都换一遍。你不换，算法就老给你推跟你差不多的人。\n\n你可以准备两个手机，有一个就是不断更换。要不然你就被埋在那个信息茧房里头，有些东西你永远也抓不着。\n\n他还举了自己的例子：昨天他说「我看了一天自媒体，大部分人都认为不会加息」，有人回他这是信息茧房——\n\n我啥信息茧房？我要搜的人就是搜，我要搜谁认为会加息，结果我都没搜到。说不会加息的我基本就不看，我直接滑到后边看结论；说会加息的我会仔细看一看——我就没看到几个。\n\n## 十六、当天的一个观察\n\n我今天等了一天，等特朗普对沃什的讲话发表一点什么批评意见。结果意见没等来，特朗普对伊朗又开了两炮，这不是火上浇油吗？\n\n伊朗来两炮，原油价格直接上去了——那你这通胀怎么控制？所以这事儿你们不觉得诡异吗？\n\n他还提了下一个需要关注的时点：\n\n下一步需要考虑的还有日本央行的加息。日本加息的效果不是立马显现的——现在市场承受的只是加息预期的影响，还没有到日本加息以后产生的实际影响。","toc":["一、房地产新政：金融条件放宽，解决不了需求问题","二、这场最硬的一段：三大交易所的铜库存数据","三、周期高点反转的四个信号（这次讲全了）","四、2007年那一轮有色：一个完整的样本","五、你说你能忍受波动——先把自己带进去","六、同样是低估，两块钱买和六块钱买完全不同","七、四大行那笔账：你不是不知道它便宜","八、不确定性与安全边际","九、仓位管理和「防风险」","十、看盘：机构的交易模式和你完全不同","十一、想学会就下注","十二、他为什么不买龙头（这次说得最直白）","十三、周期股不用研究那么细","十四、货币重置式的通胀里，最抗通胀的是什么","十五、他反复要澄清的两件事","十六、当天的一个观察"],"url":"https://xueqiu.com/2573414707/407559699","chars":8870},"topics":["库存数据与周期反转的四个信号"]},{"date":"2026-08-30","bili":{"title":"老木匠 2026年8月30日直播文字稿（独立思考、ROE、性别观、匠与师、现金流、联储加息、反诈周期","text":"## 一、自媒体定位与独立思考\n\n昨天因为\"捅了马蜂窝\"特别想说两句。阳了，嗓子哑，但情绪没有——对这个问题我毫无情绪，只是觉得有话想说。\n\n我做自媒体和别人不一样。大部分自媒体是场边卖瓜子的，靠流量吃饭，他们的意见没有参考价值。我是足球场上的运动员，钱不来自卖瓜子，来自输赢——上场能赢就有奖金。所以我不靠博流量，也不天天拿K线图赌涨跌。\n\n由此引出一个投资里最基础的事：第一件事就是学会独立思考，对众口一词的说法保持怀疑。 我不是说众口一词就一定错，但你不能对它产生信仰。投资里没有信仰、没有期待、没有希望，永远保持理性。\n\n约翰·涅夫小时候就这性格，路边电线杆子都能跟它争论。查理·芒格讲格栅理论，就是多读书、多从不同的理论框架思考同一个问题，才能全面。\n\n为什么普通人很难独立思考？这是写在基因里的。进化过程中，从众最安全——草地上斑马都在低头吃草，一只抬头看见狮子影子就跑，其他的跟着跑，不跑的被吃掉了，基因没传下来。旅鼠跟着跑下悬崖、羊群跟着跑，都是一个道理。这种从众心理是只读存储器（ROM），出生就写进DNA，不用习得。\n\n人靠智力生存，已经不靠感性，但感性留下的枷锁得靠后天训练挣脱。具体办法就是大量阅读、广泛见识、不断实践。你把自己关在小小的信息空间、周围全是和你类似的人，从众心理只会越来越重，因为你们互相洗脑。\n\n所以成功人士说\"不要让自己处在舒服的状态\"，最早是李嘉诚讲的——你从感性上越舒服，往往越错。小孩天性爱玩不爱学，读书就是不舒服的，得逆着天性训练。我从小就很难从众，要是从众反而觉得不安全，这多少有点遗传基础，像芒格、约翰·邓普顿、约翰·涅夫都是这种人。没有先天禀赋，后天训练也能改过来，只是要时间。\n\n做投资没有信仰，只有理性判断和自己的预案。 别人说美联储可能加息，你可以不同意，那是你独立思考的结果；但很多人表达的是恐惧、焦虑、谩骂——这已经变成信仰和立场，没法争论，直接拉黑。一个回教徒和一个基督徒争论谁是唯一真神，到明天也没结果，最后只剩拳脚。\n\n我只和聪明人说话，不和愚蠢的人说话。说话是为了获取别人的营养、检讨自己的错误。孔子说\"毋友不如己者\"——不能和那些都不如你的人打交道。我看到观点不一样但水平相当的人，越应该关注他；至于一出口就是情绪、人身攻击的，一概不看。\n\n## 二、巴菲特为什么重视 ROE\n\nROE 全称净资产收益率，是每年净利润除以净资产。它反映去掉杠杆以后，公司用自有资金获利的能力。ROE 越高，自有资金的使用效率越高。反过来，取得同样的利润，需要的自有资金越少。\n\n巴菲特重视 ROE，是因为他经常把整个公司买下来并入伯克希尔。ROE 高的公司再投资消耗的资本金极少——最典型是喜诗糖果，账上大部分现金可以被巴菲特拿走做别的投资。他不分红也是这逻辑：钱放在他手里投资能力强，分给股东反而收益低。\n\n所以巴菲特买可口可乐、喜诗这类公司，图的是能提供大量可自由支配的现金。\n\n有人问\"这么好的公司为什么卖给巴菲特\"——卖公司的人不见得是经营有问题，可能累了想享受生活，可能有更好的东西要买。市场上所有标价出售的资产，理由不能简单归结为\"已经高估了\"。我每年都必须卖出一部分股票才能生存，再好的公司我也得卖，不卖就饿死了。\n\n同一种生意不同的人经营结果完全不同。同样一家饭店，原来不行换了老板就行。姜子牙年轻时候贩东西总是米贵卖面、面贵卖米，仰天长叹鸟屎掉嘴里，但这不妨碍他后来替周武王打天下。经营失败的人可能只是没找到适合自己的东西。\n\n## 三、性别观与\"弱者自我保护\"\n\n雪球上有人老关注博主是男是女，这在我脑子里从没想过——雪球不是婚恋网站，博主不分男女。用男女评价人，和用地域、种族评价人本质一样，都是弱者的自我保护。\n\n江浙人说东北人如何，一定是江浙底层；东北人说河南人如何，一定是东北底层——因为他在整个社会已经没什么可彰显身份的了，就找个地域踩一脚。男人挂在嘴上\"女人如何如何\"，都是男性竞争里的失败品，成功男士普遍尊重人。\n\n现在男孩危机越来越严重。当年东北从小教育\"男孩和女孩打架你打了女孩简直猪狗不如\"，现在男孩开始和女孩争平等、\"男孩就该牺牲\"，这很荒唐。所谓\"女性结婚是来创业\"我本身不爱听，老话讲\"嫁汉嫁汉穿衣吃饭\"，女人嫁人 historically 是为了生存。\n\n更深层的问题是性激素水平下降。原来有\"剩男没剩女\"——农村娶不起媳妇的打光棍，女的智力有欠缺、有残疾都嫁得出去。现在反过来女人容易剩，这和生育有关，是中性化、性激素水平下降的结果。有统计显示现在男性一次排精量只有六十年代的一半。这不是靠一点就能解决的系统工程。\n\n但关键一点：多在自己身上找原因，别把个人问题推给社会。 就像投资市场散户老亏钱，刘继鹏说交易制度有问题，这从宏观角度要解决；但你个人如果把失败归责于制度，就永远不进步。社会制度的问题永远存在，今天解决量化明天出现游资，但每个市场都有赢家。你是运动员，要把别人的钱变成自己的，不是去研究怎么修改比赛规则——门加宽你也踢不过梅西。\n\n## 四、大学教育与\"匠\"和\"师\"的区别\n\n一所大学里就四种人：学生、老师、行政、后勤。排序决定层次——学生第一、老师第二、行政第三、后勤第四，这是有深厚文化传统的优质大学；很多后续建的工业化学校是后勤第一、行政第二、老师第三、学生最后，这种学校\"有知识没文化\"，本质是技校。大学是为学生开的，没有学生要大学干什么。\n\n\"匠\"和\"师\"的最大区别：匠只传递技能，师传递道理。瓦匠懂得活怎么干得最好，木匠知道怎么刨平，这是匠人传承。大师懂背后的道理——为什么必须刨这么多下才能平，不这么做换一种方法行不行，所以大师会创新。鲁班成了大师，别的木匠只是木匠。\n\n任何行业都一样，包括上学。很多大学老师终其一生对他的内容只是\"熟\"不是\"懂\"——能背下来、能按师傅教的教，但不真懂背后的道理。能把一件事给别人讲明白，才叫真懂；只是背下来，那叫熟。\n\n投资也一样。投资匠也能做好，但要做到精益求精得成投资大师，得知道背后的道理。如果投资就是\"挖多少矿挣多少钱\"这么简单，那最厉害的应该是会计——你算得过紫金矿业内部的会计吗？巴菲特从来没拿计算机算账，他说的是理念。\n\n## 五、公司估值是一门艺术，现金流比资产负债表重要\n\n给公司估值用未来自由现金流按贴现率折算到今天累加，这本身是个理念。真正计算时你要做无数假设——公司能否保持盈利水平、是否面临未来竞争，任何一个假设变了，折算值就没意义。所以声称能看懂公司十年二十年的都是扯淡，你赚到钱也可能是幸存者偏差。\n\n公司最重要的东西是现金，不是资产负债表。 公司最终破产不是因为资不抵债，而是没有了现金流。只要收益还能覆盖利息，公司就能继续运转。\n\n中国中铁账上现金一度比市值还高。如果允许巴菲特按现价收购，把股票收集完，再把账上现金拿回来还贷款，相当于白得一个中国中铁——负债可以用伯克希尔借给它日常经营。账上有没有现金，还三千亿负债完全是两回事。你根本没理解公司财务怎么运转。\n\n美国国债同理。美国国债增加一倍到八十万亿都无所谓，只要他能借来钱、继续获得现金，政府就能运转。负债规模不重要，重要的是能否持续借贷。\n\n## 六、折旧、隐蔽资产与\"无知之幕\"\n\n折旧和现金流的关系，用卖煎饼果子说最清楚。买烙子花一万，按十年折旧一年折一千。今年卖煎饼赚了一千五现金，减去折旧剩五百，报表利润是五百，但手里现金实打实增加了一千五。如果今年只赚八百现金，减折旧后报表亏二百，但公司还能继续——因为现金还在增加。\n\n养猪行业现在就是这个状态：报表亏损，但现金还在流入，所以能撑。\n\n希尔顿酒店很多亏损，因为自有房产按三十年折旧，每年折掉一大笔，报表就亏了。但亏的好处是不用交所得税。运转三十年房子折旧没了，房子扒了吗？不扒，还能用一百年，资产在账上已经是零，这叫隐蔽资产型公司。长江电力、三峡大坝按五十年折旧，五十年后坝倒不了还继续发电，资产账面是零但实体还在。\n\n反过来，有些资产是\"资财毁灭型\"——不是自然寿命到了，是迭代太快。当年买386电脑三万块，按十年折旧，五年后586、686出来，三千块一台到处都是，折旧就没意义了。AI 算力中心的 GPU 按六年折旧，但可能用不到六年就淘汰了。彼得·林奇不愿投生物科技公司，因为公司黄了只剩一堆博士和显微镜，没有任何残值。\n\n所以找公司要区分固定资产形态：三峡大坝折旧完还能发电，面板生产线头几年没折完就被淘汰得减值。资产和费用没有原则界限，只是人为划分——效果管多年的叫资产分期进成本，当期的叫费用。\n\n讨论任何问题要带\"无知之幕\"的心态：先把自己置身事外，忘掉自己的持仓和立场。 我说美联储可能加息，有人马上接\"我不怕，加息有色金属也不跌\"——我没问你有色金属跌不跌，我们讨论的是鲍威尔讲话后加息的可能性有多大。你把自己代入进去，表达的就全是立场和情绪，没法深刻认识问题。就像讨论一个人站在悬崖边怎么脱困，你得先忘了自己是不是在悬崖边，否则说的话都没意义。\n\n## 七、对美联储加息\"众口一词\"的警惕\n\n我说美联储可能加息，引发了远超预期的集体情绪反应，这让我非常警惕。尤其自媒体里，描述像有通稿——从铺垫到转折，最后统一结论\"他加不了，因为中期选举、四十万亿国债等等\"。\n\n越是众口一词说一件事不会发生，我越恐惧。 今年一月份整个市场一致预期今年降息三次，现在时间上只够降两次，从鲍威尔讲话看还预计九月降息简直是胡说。唯一的不确定性就是九月的两组数据：CPI（9月11号）和非农就业（9月3、4号）。沃勒讲得很死——我看数据，数据符合加息前提就加。\n\n为什么很多人替美联储和特朗普操心\"中期选举不可能让加息\"？特朗普两年前刚上任和现在利益诉求会变。一个人刚当总统想干大事，快退休时只想平稳落地，这是人性。你单位领导快退休和刚上来想法完全不同。\"自古英雄出少年\"，讲的就是这个。\n\n而且特朗普这任总统连利益切割都没做完。推荐一本书《硬球》，讲美国政治是怎么玩的。特朗普最想当的是美国最伟大的总统，不是单纯搞钱——你把他看低了。\n\n全球已经进入加息周期。美联储9月、日本9月18号、欧洲可能也加、韩国已加、英国也加。唯一可以不加的是我们，因为国债收益率还低，金融条件最好，人民币还有很大升值潜力。\n\n人民币升值逻辑：疫情后美欧日大量货币宽松、货币贬值，我们没有跟贬，又用管控保持外汇稳定（保护外向型出口）。现在转向双循环、扩大内需，才开始缓慢释放升值压力。人民币对美元升值一倍都正常——你看美元发了多少货币，人民币没跟。\n\n当年我看有色金属写了三个前提：美国国债不靠通胀解决不了、美元对实物贬值带动黄金涨进而带动有色涨、人民币为维持出口不会放任升值。现在第三个前提有怀疑——美元未来一定废纸化，但没人规定人民币也必须跟贬。如果一美元兑三人民币，国内以人民币计价的铜和黄金会降价，那有色金属还是好标的吗？所以别假设\"美元贬值金属就一定最好\"，得想清楚人民币是否跟的问题。\n\n## 八、长端美债收益率为何上涨\n\n国债票面利率是固定的，加息只增加新增短端利息，长端存量不受加息影响。现在长端收益率上涨，根源是美联储不作为、放任通胀，导致外国主权资金对持有美元和美债信心下降，开始抛售。\n\n要分清两类持有者：对国内商业投资者，美元是货币；对国外主权资金，美元只是资产。 主权资金持有长端美债不是为了收益，是为了储备。现在他们觉得持有美债购买力会下降，就卖掉去买入黄金和实物资产。接手的是商业投资者，他们是利率敏感型，要有足够高的利息才买，这就推高了长端收益率。\n\n如果美联储现在加息、表现出治理通胀的决心，主权投资者就不会再抛，长端收益率反而能稳定甚至降低。加息最影响的是短端——发一年期国库券是在和银行存款竞争，存款利息高了，国库券利息也得高。\n\n## 九、自我保护与反诈\n\n任何地方写自己名字都要慎重，尤其有签字权的领导，绝不在空白纸上签名——写完我可以在上面写个欠条。我们以前签字都先打个大叉把空白划掉。公章也不能随便盖在空白纸上。提交身份证复印件可以加备注，说明用途。\n\n单位里领导打电话让你干件事，干完责任你自己担——领导可能调走或不承认。下回给他做个电话录音，一般不拿出来，但出事你有个抓手。你不能把自己的安危寄托在别人的信用上，每天背一遍这句话。\n\n人是怎么被骗的？骗子一定给你营造非常紧迫的氛围——\"过了这村没这店\"\"名额是我争取来的，不买就没了\"，你一紧迫警惕性就降。投资也一样，今天涨停板把你拉涨停了，我不买行不行？删了换一个。\n\n万变不离其宗：不想占便宜就不会被诈骗。白送的不要，有大金饼砸脑袋上你得怀疑——我一贯认为自己运气不好，运气好的事摊到我身上我会恐惧，干任何事都硬磕，只有硬磕出来的东西我用着才踏实。\n\n## 十、周期高点的反转信号\n\n油运是非常典型的周期行业，现在受霍尔木兹海峡和红海地缘政治影响太大，几乎没法判断。景气已经持续一段时间，这些年造的 VLCC 巨型油轮陆续投放，运力在增加。景气持续达到一定时间，本身就是反转迹象——高景气会刺激供给，油运价格高就刺激造船，船造出来运力过剩。\n\n造船周期更长，产能恢复慢。现在能恢复的产能是上次没出清的，只是企业破产、产能还在。造船核心瓶颈是船坞和熟练工人（韩国造船受限就是工人少，很多是中国过去的）。\n\n有意思的现象：航运高景气时大家赚钱，就推迟淘汰老船、凑合用；等航运周期往下走，老船费油、维修贵，反而会刺激造船。所以航运往下走，造船不一定往下。\n\n我六月三十号调完仓后基本没动，交易频率大幅降低。年纪大了精力衰退，关注不了那么宽，现在主要看持仓。下次某个标的清仓了，才会把大量精力放去研究新标的。我讲的都是以前研究的印象，细节你们自己去看、自己去核实。\n\n最后做合规性声明：我讲的都是评书，不能用来指导投资，所有人投资都要自己思考。人第一个需要的底色是善良，理性可以改变，善良很难改变。感谢大家陪我四个小时。","toc":["一、自媒体定位与独立思考","二、巴菲特为什么重视 ROE","三、性别观与\"弱者自我保护\"","四、大学教育与\"匠\"和\"师\"的区别","五、公司估值是一门艺术，现金流比资产负债表重要","六、折旧、隐蔽资产与\"无知之幕\"","七、对美联储加息\"众口一词\"的警惕","八、长端美债收益率为何上涨","九、自我保护与反诈","十、周期高点的反转信号"],"url":"https://www.bilibili.com/opus/1242238450558566404","bv":"","minutes":0,"chars":5714},"ai":{"title":"老木匠·2026年8月30日：从众是本能，独立思考要靠训练","text":"## 一、独立思考：为什么从众是写在基因里的\n\n1. 对众口一词的事，要保持怀疑\n\n大家要想坚持独立思考，就一定要对众口一词的事保持怀疑。在你的头脑中就没有百分之百的东西，你对谁都要有一份怀疑。\n\n别说谁谁谁，你就是巴菲特、芒格，在我心目中他也不是股市的上帝。任何人都有可能犯错误，包括我自己——我说的都只代表我自己。\n\n他还点出了那种句式背后的问题：\n\n有人说「那某某某也被洗脑了吗」——你看这句话暗含的假设，就是某某某是绝对正确、不可能错误的。说某一个人绝对不可能被洗脑，那本身你就已经被洗脑了。\n\n当你盲从的时候，你就已经没有了独立思考。这就不是讨论问题了，这是讨论信仰；这就不是我们在说话，这是宗教了。\n\n2. 从众为什么让人舒服：它写在你的只读存储器里\n\n这是他这场讲得最透的一层：\n\n在一个草地上，斑马都在低头吃草，突然有一只斑马抬头看见了狮子的影子就开始跑。这个时候其他动物不应该思考，就应该都跟着跑。有没有没跑的呢？在遗传变异的过程中，肯定有试图进行独立思维的斑马，但是这些斑马后来都被狮子吃掉了——所以没跑的，基因就没传下来。\n\n这种基因固化了以后，就会形成一种只读存储器（ROM）。这不是你后天习得的，它是你一出生就写在基因里面的，就像小孩一出生就知道吃母乳。\n\n但问题在于，人是唯一靠智力来生活的生物。所以感性给我们留下的很多东西，有时候可能带来安全，但有时候它就会形成一种枷锁。\n\n他还提到旅鼠——群体到一定时候就朝一个方向跑，前面掉下悬崖了，后面的并不知道发生了什么。\n\n3. 所以训练的方法是：逆着天性\n\n你觉得非常有用还不够，你还要去逆着天性来训练自己。成功人士都说过「不要让自己处在舒服的状态」，说的就是这件事。\n\n具体的办法当然是大量的阅读、广泛的见识、不断的实践。但如果你把自己关在一个非常小的信息空间里，周围全都是和你类似的人，那么这种从众心理不仅不会改变，而且还会越来越严重——因为你们互相之间可以洗脑。\n\n他也承认这多少有天赋成分：「像芒格、邓普顿、聂夫这些人，他们天生就对大家都信奉的金科玉律保持怀疑。你没有这种先天素质，那后天训练也是可以的，只是需要时间。」\n\n4. 落到投资上的那句话\n\n做投资里面没有信仰，不要有信仰，不要有期待，不要有希望，你总是要保持一个理性的思考。\n\n你越不想听的声音，你就越要听。而不是找到一些和你观点一样的人在那儿唱和。\n\n如果你永远处在这种状态，你就永远是这个股票市场的耗材。因为你想着的是舒服，而不是为了赚钱；你想看到的是和你观点一样的人，而不是想听到客观的声音。\n\n## 二、观点、立场和情绪：为什么有些人不值得讨论\n\n1. 他的分界线\n\n我不同意你的观点、我认为不会加息——这都是正常的交流，你的观点都可以随便说，因为这也是你独立思考的结果。但问题是很多人表达的是情绪，是恐惧、是焦虑，最后是谩骂和人身攻击，这就是已经产生信仰的结果。\n\n一个回教徒和一个基督徒讨论究竟谁是唯一的真神，我认为讨论到明天都没有结果，最终有可能双方只是拳脚相加——因为这讨论的不是问题，而是信仰。\n\n2. 他为什么只和「说观点的人」来往\n\n我看空有色金属那一段时间，我也依然关注着那些相关的大V，只要他们不表达情绪，我依然看。即便我和某人观点完全不一致的时候，我也非常尊重他，因为他不表达情绪，他说的都是观点。\n\n他还讲了一个自己看到的直播：\n\n有人列了一大堆「和愚蠢的人怎么说、和聪明的人怎么说」。我在底下只回了一句：我只有一个问题，你为什么要和愚蠢的人说这么多话呢？你不应该是远离愚蠢的人吗？\n\n3. 「代入感」——这场提出的一个新概念\n\n这是他后半场花了很长时间讲的，也是最实用的一段：\n\n你不论在讨论一个什么问题，他首先把自己先放进去了，这就叫代入感。我从来没说过某只股票如何，但是因为他持有它，他就认为我在说他。\n\n我说美联储可能要加息、要注意风险，你知道他考虑的是啥？「我不怕。」我没跟你讨论你怕与不怕这件事，这事跟我没有关系。\n\n他给的例子特别生活化：\n\n大家一起聊天说红烧肉该怎么做，聊得兴高采烈，就有的人会说「我就不爱吃红烧肉」。没人问你爱不爱吃，咱讨论的是红烧肉怎么做。\n\n你为什么说话交流感差？就是你没有围绕着这个话题，你总是想你自己那点事儿。你关心的是这个话题和你之间的联系，而不是这个话题本身。\n\n4. 为什么会这样：因为你的世界太小\n\n这些人他就没有把自己的世界打开，所有的思维、所有的精力都在围着他自己的感受在转。他还没有脱离自己的感性。\n\n腹有诗书气自华——为什么书读得多的人聊天就跟别人不一样？因为你看的书少，思维内容很贫乏，除了表达自己的感受之外，你就不知道该聊啥。\n\n他还讲了一层递进：\n\n你越是重视自己的感受，就越会去评价别人的感受，这就变成了人身攻击。\n\n5. 从今天开始可以做的一件事\n\n你在和任何人讨论问题的时候，把「我」从你心里剔除。你会获得很多人的赞同，在交流中你就会变成一个受欢迎的人。\n\n你老考虑你自己那点持仓的事儿，你怎么去观察宏观的问题？这对你的投资是很有伤害的。\n\n## 三、ROE：巴菲特信的和你信的，不是一回事\n\n1. 先说这个指标本身\n\nROE全称叫净资产收益率，就是归母净利润除以净资产。它反映的是你去掉杠杆之后，公司利用自有资金的获利能力。\n\nROE越高，同样的自有资金取得的利润越高；反过来说，取得同样的利润所需要的自有资金就越少。\n\n2. 巴菲特为什么特别重视它\n\n这一段是他这场的一个核心澄清：\n\n巴菲特重视ROE，主要是因为他经常把整个公司都买下来，并入伯克希尔体系。ROE高就意味着这个公司再投资时消耗的资本金非常少——那就说明这个公司账上的现金，大部分都可以被巴菲特拿走去做其他运作。\n\n巴菲特最牛的本事不是经营公司，而是投资。所以他收购一个公司，最主要看的并不是这个公司利润率有多高，而是这个公司能提供给他多少可自由支配的现金。\n\n他还用同一个逻辑解释了不分红：\n\n他认为把红利分给你，不如放在他手里——因为他的投资能力强，可以产生更大的收益。\n\n3. 所以你和他的处境完全不同\n\n巴菲特买入的是公司，他可以对公司施加控制，他能进董事会——我们能进董事会吗？他可以把账上的现金拿走，你能把账上的现金拿走吗？\n\n你所面临的公司财务状况和巴菲特所面临的是完全不同的。你更关注的是他明年能有多少利润，对他来说他并不很关注这件事——他关注的是你明年再投资需要多少净现金。\n\n## 四、公司破产不是因为资不抵债，而是没有了现金流\n\n1. 这是他反复强调的一句基础常识\n\n公司无论欠多少债，只要账上还有现金，它就还能运转。公司最终破产倒闭，并不是因为资不抵债，而是没有了现金流。\n\n2. 他直接把这条用在了美国国债上\n\n美国国债即使再增加一倍、80万亿都无所谓，只要他能借来钱。美国国债是40万亿还是80万亿，这件事对美国完全没有关系；关键的问题是他是否可以继续借债——因为借债他就可以获得现金，美国政府就可以继续运转。\n\n反过来说，即便他现在只有10万亿负债，但是已经借不来钱了，那么美国就完蛋了。资产负债表的负债并不重要，重要的是它的现金流。\n\n3. 顺带纠正一个流传很广的错误\n\n谁告诉你加息以后40万亿存量国债就都得重新计算？已经发出去的国债、尤其是长端国债，票面利率都是固定的。加息只增加新增的利息。\n\n## 五、明亏和暗亏：一个煎饼果子的例子\n\n1. 他把折旧讲得非常好懂\n\n比如你卖煎饼果子，买这个煎饼烙子连炉子一共花了1万块钱，假如能用十年，那一年的折旧就是一千。\n\n今年你卖煎饼果子，赚的钱减去花的钱是1500，这是你今年得到的现金；但要减掉1000的折旧，财务报表上的利润就只有500。\n\n如果有一年你只挣了800，减去1000的折旧，你财务报表上就亏损200——但实际上你手里的现金还是增加了800的。那这个煎饼还能不能继续烙？还能。\n\n2. 养猪现在就处在这个状态\n\n现在养猪就处在「你赚八百、但减掉折旧就是亏损」的状态。由于你还赚了八百，所以这个事儿还能进行下去。\n\n真正开始出清的时候，是从现金流上已经开始亏了——那时候你要继续维持生产，就得不断往里添钱。\n\n3. 折旧年限本身也是一种假设\n\n你那煎饼炉子不是说买了就只能用十年，你用20年他也可能用。\n\n他还举了酒店的例子：\n\n很多酒店在财务报表上是亏损的，因为要减掉房屋每年的折旧。而亏损的好处是什么？可以不用交所得税。你这么运转了30年，房屋折旧完了——那我问你，这房子就要扒了吗？房子还在，甚至还涨价了。\n\n你30年前的旧房子到今天，在账上它的资产已经是零了。这就叫隐蔽资产型公司。\n\n## 六、隐蔽资产 vs 资产毁灭：怎么区分\n\n1. 什么样的固定资产折完了还在\n\n你要区分它的固定资产的形态。比如三峡大坝按50年折旧，50年以后大坝能倒吗？折旧完了它还可以继续发电。核电的核岛按60年折旧，折完了核岛还可以继续发电——那时候账上资产已经是零，但它在发电上不受任何影响。\n\n他还提到土地使用权：作为无形资产每年摊销，但到年限了国家也不会收回去。\n\n2. 反面：什么叫资产毁灭型\n\n面板不行，淘汰率太高。你的生产线头几年还没折完旧，就已经被淘汰了，都得进行资产减值。\n\n就跟当年买计算机似的，九几年买386的时候一台三万块钱，你按十年折旧、一年折三千。等五年以后586、786都出来了，三千块钱一台到处都是——你那折旧就没意义了。\n\n它不是因为自然寿命到期，而是因为产品迭代速度太快，还没等用完就已经没有任何经济价值了。\n\n3. 这条正在被用在AI数据中心上\n\n现在美国有很多人认为AI计算中心的账算得不对，就是因为GPU、芯片按六年折旧，但实际使用寿命可能到不了六年——不是指自然寿命，是因为淘汰太快。\n\n他还引了彼得·林奇的话说明同类风险：\n\n他不愿意投资生物科技公司，说那些公司的资产就是一堆博士和显微镜——等公司黄的时候没有任何残值，博士都跑了，显微镜都过时了。\n\n4. 顺带一条会计常识\n\n费用和资产没有原则的界限，它只是一种人为的划分。区别在于：资产的效果可以有多年，所以要分期进入成本；而费用的效果就是在当期，所以当期就要计入成本。\n\n## 七、估值是艺术，不是算出来的\n\n1. 芒格说的那件事\n\n芒格说，我从来没见过巴菲特在收购一个公司的时候用自由现金流折现去算他的估值。为啥呢？因为这东西只是个理念。\n\n你真正计算20年的自由现金流折算，要假设这个公司能否保持现在的盈利水平、是否会面临未来的竞争等等一系列东西。这里面任何一个假设条件改变，你这个折算值就变得没意义。\n\n2. 所以他的结论\n\n给未来的公司进行估值，它本身就是个艺术，压根就不是个计算出来的东西。如果计算就能投资的话，那直接交给人工智能不就完了？\n\n它就是一个由无数假设构成的计算函数，而你今天所有的假设实际上都带有你的主观判断。\n\n如果通过计算就能决定投资的话，那最厉害的就是会计。你就那点事儿，你还能算过公司内部的会计吗？你问他买不买公司股票？\n\n3. 所以「看懂十年」这种话\n\n声称能看懂未来公司十年或者20年的，我认为都是扯淡。你即便说我投资某个标的20年赚了多少钱，那也是幸存者偏差——你不要信誓旦旦地说我20年前就算到了今天，你算的是因为你有运气。\n\n## 八、匠和师：熟不等于懂\n\n1. 他讲的那个大学老师的故事\n\n我上大学的时候有个教授讲量子力学，他说他刚毕业时讲，学生不懂；讲第二年还不懂；等到第三届学生再讲的时候，学生才懂了——他说那是因为我懂了。\n\n对一个东西「熟」和「懂」是两个完全不同的层次。你能把一件事给别人讲明白，这才叫你真懂；你只是能把它背下来，那只是熟，不叫懂。\n\n他还给了个反推：\n\n所有不能把一个复杂问题给你讲明白的人，大体上都是一个原因——他自己不懂。所有懂的老师就是大道至简。\n\n2. 匠和师的区别\n\n匠只传递技能，而师是要传递道理的。瓦匠懂得这活儿怎么干最好、这个东西怎么能横平竖直，这就是匠人。\n\n大师是你必须要懂这个道理——为什么需要这么做？我不这么做行不行？所以你懂了背后的道理，你就会知道我可以换一个方法做。所以大师就会创新。\n\n为什么鲁班会成为大师，其他人就只叫木匠？就是这个区别。\n\n3. 他把这条用在了投资上\n\n投资也是一样。作为一个普通投资者你也能把投资做好，但是你想把投资做到精益求精，你就得知道背后的道理。\n\n为什么这么多人投资，只有巴菲特、芒格被公认为投资大师？因为你那套东西有一部分赚钱是因为运气，而且不可复制、没有底层逻辑，甚至有时候是歪打正着。\n\n如果投资就是研究「挖多少矿能挣多少钱」这么简单，那就没有所谓的投资大师了。\n\n## 九、加息这件事：把思维打开\n\n1. 他现在的判断和上一场一致\n\n我判断不了九月份一定加息，我只是认为它有一定的加息概率。但有一点是可以肯定的：原来你说可以降息，现在降不了了，这点是肯定的。\n\n今年年初的时候，整个金融市场预计今年一定会降息三次——现在时间上都来不及了，只剩九月和十二月。你说他可能不加息，我还赞同；你说还可能降息，那就是胡说了。\n\n2. 关键的日期\n\n九月三、四号公布就业数据，九月十一号公布CPI。这些数据出来以后，所有的预期还会变化，包括我自己。现在唯一的不确定性就是九月份的这两次数据，其他东西都是确定的。\n\n3. 「美国现在连加个息都加不了了」——他对这个结论的反问\n\n我有时候真不明白：美国作为全世界的金融强国，怎么现在连加个息都加不了了？连俄罗斯都能加息，土耳其都能加息，怎么美国加0.25都加不了了？你知不知道加息减息属于金融主权？\n\n他还列了一串同类的旧预言：\n\n当年说房价不能跌，跌了银行都得黄——现在跌了，哪个银行黄了？当年说中国不能和美国打贸易战，打了怎么的了？什么东西最终都会有负面影响，有负面影响再去解决负面影响。\n\n4. 「利益诉求会不会变」——这场最有意思的一个视角\n\n特朗普刚开始当总统的时候，和今天他的利益诉求会不会发生变化？你刚上来当总统的时候想在这任当中做出大的作为；当发现大的作为最终没有做成的时候，那你会不会转而寻求其他的利益呢？\n\n你们单位的领导要退休回家的时候和刚上来的时候，想法是完全不同的。自古英雄出少年——刚上来都想励精图治干一番大事业，等最后要回家的时候都想着怎么平稳落地。\n\n他还提示了一个可以观察的现象：\n\n讲话之后黄金跌了、美股跌了、美国国债跌了。我问你，到现在为止，即便他是话痨一样的人，他说没说过这次讲话？我这两天天天在等——如果两年前有人干了这么一件事，造成这么大震动，他能忍到今天吗？\n\n真相我们永远都不知道，但是你要观察到现象，你要猜后边的原因。\n\n5. 他自己的警惕\n\n我对众口一词的东西总是保持怀疑，甚至保持一种恐惧。越是大家都认为不会加息，我就越恐惧。\n\n加息、降息、不动，这都不重要，重要的是你自己怎么判断，并且你对自己的判断是否做好了准备——加息你如何应对，降息你如何应对，不动你如何应对，你要有自己的预案。\n\n## 十、他当年看多有色的三个前提，现在动摇了哪一个\n\n1. 先回顾他三四年前的完整逻辑\n\n第一，美国的巨额国债不靠通货膨胀是解决不了的。第二，由于美元必须对实物贬值，所以会导致黄金上涨，而黄金上涨了以后会带动所有有色金属跟着涨。第三，人民币为了维持出口，不会放任升值——所以我们的购买力也要跟着下降。\n\n所以这个时候不仅以美元计价的金属涨价了，以人民币计价的金属也在涨价。这是我当时看好有色金属的三个前提条件。\n\n2. 现在动摇的是第三条\n\n现在有一个前提条件有些许怀疑，就是人民币是否还会维持和美元的汇率。换句话说：美元废纸化了，人民币是否要跟？\n\n没人规定美元废纸化，人民币也一定废纸化。你在讨论这些问题的时候，都假设「只要美元必须贬值，有色金属就一定是最好的投资标的」——那你完全忽略了人民币是否升值的问题。\n\n如果这次不跟了，那国内以人民币计价的铜和黄金是不是会降价？那你的有色金属标的还是好标的吗？\n\n3. 顺带解释了一个估值差\n\n有人说美国的南方铜业是40倍市盈率，而我们的只有十倍。那是因为它所处的金融条件不同，所以给的估值不同——没有一个全世界的投资人比你傻。\n\n4. 为什么人民币现在在升值\n\n按道理美元利息高、我们利息低，我们应该贬值。那为什么今天人民币还在不断升值？什么「利息决定汇率」，那不是胡扯吗？\n\n那是由于我们常年外向型经济所主导的、压制人民币升值所积累的势能，需要一个时间逐渐释放。这些年美欧日都实行了大量货币宽松而我们没有，所以他们的货币贬值了，我们没贬，但我们还用控制的方式保持了汇率稳定。\n\n为什么要控制？因为如果人民币升值过快，会打击出口。所以要先从政治上配合——不以外向型经济为主了，搞双循环、扩大内需，解决好这个问题，然后再让它缓慢升值。\n\n我告诉你，人民币从现在开始对美元升值一倍都很正常。你知道在这期间美元发了多少货币，而人民币没跟。\n\n## 十一、长端和短端：为什么加息反而可能让长债稳下来\n\n1. 加息最直接影响的是短端\n\n讲话之后，美国国债短端收益率迅速上涨，中端几乎没变，长端还稍微跌了一点。为什么加息最影响短端？因为美国发短期国债（国库券）是在和银行存贷款竞争——银行存款利息提高了，你发国库券的利息也得高，否则我就不买。\n\n2. 而长端的逻辑完全不同\n\n现在长端收益率上涨，正是由于美联储不作为造成的。主要原因是投资者结构在发生变化：原来是外国主权资金持有，而他们持有长端国债不是为了收益，而是为了储备——价格对他们来说无所谓。\n\n由于美联储不作为导致美元币值下降，这打击了他们持有美元和美债的信心，所以他们要抛掉美债，也不是为了持有美元，而是要买入黄金和实物资产。\n\n而接手的是美国国内的商业投资者，这部分人是收益率敏感型——他是为了投资而不是储备，所以要有足够高的利息他才买。\n\n3. 所以推论是反直觉的\n\n如果美联储现在就加息、表现出很强的治理通胀的决心，这会导致主权投资者不会再卖出美债。所以加息反倒可能会使美国长端国债的收益率稳定下来，甚至可能降低一部分。\n\n你必须拿出治理通胀的决心，才能给外国主权投资者持有美元和美债提供信心。\n\n他还给了一句概括性的话：\n\n对于美国国内的商业投资者，美元是货币；对于国外的主权资金来说，美元只是资产。\n\n## 十二、全球都在加息，只有我们可以不加\n\n欧洲央行九月份可能也会加息，英国、韩国都加了。全世界都已经进入到一个加息的周期——如果这些硬通货国家都加息，那么全世界的流动性必然受影响。\n\n现在唯一可以不加的是我们，因为我们的国债收益率现在还很低，所以金融条件最好的就是我们，我们还有很大的升值潜力。\n\n他还讲了日本那一环：\n\n日本现在面临非常难的境地：日元又冲到160以上。如果美国加了而日本不加，那日元汇率得贬到多少？国内的输入性通胀就会非常高，那就会面临巨大的政治压力。\n\n但如果日本加了，那些在美国套利的日元资金在边际上就会回归日本，那就会对美国资本市场产生影响。加与不加并不重要，你要知道它们一环扣一环是怎么互相影响的。\n\n## 十三、油运与造船：一条被忽略的反向逻辑\n\n1. 油运现在难判断\n\n油运是一个非常典型的周期行业，但现在不好判断，因为它受地缘政治影响太大。现在油运之所以景气，是由于战争导致运输线路变长、需要绕行，里程变长所以需要的运力增加了。如果战争就此结束，那现在的油运就会受到很大影响。\n\n而且它的景气度已经持续很长时间了，这些年造的巨型油轮很多，都会陆续投放，这就导致运力在增加。\n\n2. 由此他补上了「周期高点反转」的第一条特征\n\n这是他答应了好几场要讲的：\n\n周期在高景气时所经历的时间，如果达到一定长度以后，这就是一个反转的迹象。因为周期处于高景气的时候，就一定会刺激这种周期性行业的供给——油运价格很高就会刺激造船，而造出来的船大量投放就会导致运力过剩。\n\n3. 但造船有一条反向逻辑\n\n造船的核心供给瓶颈是船坞，除了船坞之外还有熟练工人。所以造船的产能恢复不是那么快的——现在能恢复的这些产能，都是上一次没有出清的，只是企业破产了，但产能还在。\n\n而最有意思的是这一条：\n\n航运业处于高景气的时候，由于运货非常赚钱，所以就推迟了淘汰老旧船舶——能凑合用一年就用一年。而当航运周期开始往下走的时候，这时候才开始淘汰老船，因为老船费油、维护成本高，收的运费都不够油钱。\n\n所以当航运周期开始往下走的时候，不见得造船就一定往下走，甚至有的时候它还会刺激造船。\n\n他还给了个时间参照：「上一次造船的高景气周期大概在2003到2005年，而造船周期大概是20年。所以现在即使没有航运的高景气，它也会有一个替代需求——世界上的船队普遍已经开始老龄化了。」\n\n## 十四、保护好自己：几条具体的经验\n\n这一段是从他做律师的经历讲的，但落点仍然是投资。\n\n1. 不要在空白纸上随便签名\n\n你在任何一张白纸上写自己的名字的时候都要慎重，因为你写完名字，我就可以在上面写个欠条。\n\n我们以前签字的时候，都在上面打一个大Z，就是把空白的地方都给它划掉。单位的公章也不能轻易盖在空白的纸上。\n\n他还提到可以在签名下面备注这个签名是干什么用的；领导口头交办的事可以做个电话录音，「你一般不拿出来，但出了事你得要有个抓手」。\n\n2. 那句他要求大家背下来的话\n\n你不能把自己的安危寄托在别人的信用上。不论多么信得过的人都不能这么做。\n\n我说的是安危，钱还无所谓，钱都是有限的——朋友借两万块钱要不要打欠条？不用，大不了不要了呗。但你的安危这种损失，它不是有限的。\n\n3. 骗术的共同点：制造紧迫感\n\n人特别害怕的是别人给你营造一个非常紧迫的氛围，你这个时候的选择是非常难的。诈骗你的时候，他一定会告诉你这事得赶紧，过了这个村就没这个店了——人在紧迫的条件下，警惕性就会降低。\n\n所以你要学会「慢」。不管多紧迫，我不着急。\n\n他直接接到了投资上：\n\n投资也是一样。今天把你涨停了，我不买行不行？你连续拉板，我不买，我把这个股票删了。有多少人卖你金融产品的时候会告诉你「这个名额还是我争取来的，你不买过了这时候就没了」——这个时候你就会放松警惕，这在某种程度上就是被洗脑。\n\n4. 以及一条底线\n\n你只要不想占便宜，基本上就不会被诈骗。如果一个大金饼子砸你脑袋上了，你千万别以为是自己运气好——这世界运气好的事儿太少了。\n\n我自己认为我一贯运气不好，所以运气好的事儿摊到我身上，我就会非常恐惧。我干的任何事儿都得硬啃，只有硬啃出来的东西我用着才踏实。\n\n## 十五、他自己的收尾\n\n我讲的都是评书，不能用来指导投资。所有的人投资都要自己思考，所有的细节问题你们自己去核实。\n\n这一场他讲了四个小时，最后说了一段关于「善良」的话：\n\n人第一个需要有的素质就是善良。对与不对这些事都放在次要的，人起码要从善意出发。\n\n根据我的职业经历，人的底色是很难改变的。理性还可以改变，善良很难改变——你搞同学聚会就会发现，二十年前那样，再过二十年他还那样。","toc":["一、独立思考：为什么从众是写在基因里的","二、观点、立场和情绪：为什么有些人不值得讨论","三、ROE：巴菲特信的和你信的，不是一回事","四、公司破产不是因为资不抵债，而是没有了现金流","五、明亏和暗亏：一个煎饼果子的例子","六、隐蔽资产 vs 资产毁灭：怎么区分","七、估值是艺术，不是算出来的","八、匠和师：熟不等于懂","九、加息这件事：把思维打开","十、他当年看多有色的三个前提，现在动摇了哪一个","十一、长端和短端：为什么加息反而可能让长债稳下来","十二、全球都在加息，只有我们可以不加","十三、油运与造船：一条被忽略的反向逻辑","十四、保护好自己：几条具体的经验","十五、他自己的收尾"],"url":"https://xueqiu.com/2573414707/407559605","chars":9439},"topics":["从众是本能，独立思考要靠训练"]},{"date":"2026-08-29","bili":{"title":"老木匠 2026年8月29日直播文字稿（独立思考、沃什讲话、有色囤积、周期出清）","text":"## 一、先别替沃什操心，把讲话原文读一遍\n\n昨天让你们去看一万九那个完整视频，有去看了的扣个 1。看完是不是发现，跟你原来脑子里的印象不一样了？你原来的印象是：店门口放把凳子，来了个老人坐下发病，店主扶的过程中摔倒了，赔了一万九。看完完整视频，你肯定不这么看了。\n\n我不要给你们结论。热点事件我自己虽然有看法，但我不愿意参与传播。我要告诉你的是方法：任何事你都别被媒体牵着鼻子走。怎么才能有自己的判断？把这件事在没有媒体介入时的原貌重新看一遍。看的时候不要考虑任何人的看法，就盯着原始材料，形成你自己的看法。\n\n这件事对大家的冲击会很大。你原来信誓旦旦、毫无怀疑，还因此发表了很多情绪化看法，看完之后你会发现——自己就是那个傻子，就是被牵着鼻子走的人。你和去康养中心领鸡蛋的老头老太太，在智力水平上没太大差别，因为你同样容易被洗脑。\n\n同样的方法可以再用几次。二十年前的彭宇案，抖音上有个博主叫\"楚音\"，最近做了一期讲彭宇案的来龙去脉，讲得比较客观，你们去看。还有朱令案，当年引起的舆论风波比后来那个还大。你都重新审视一遍，对照一下自己当年被洗脑形成的固有印象，你就会成长。以后再发生类似事件，你就不会轻易被人家牵着鼻子走。\n\n## 二、沃什讲话之后，反对者只有一句\"他不敢\"\n\n昨天晚上沃什讲话讲完，所有说\"美联储可能加息\"的观点，下面的反对者几乎只有一个理由——沃什不敢这么干。\n\n你要是读完沃什讲话全文，认为他\"什么都没说\"，那你需要回去补基础知识，从初中语文补起。所有反对的人论据都一样：他不敢、他不可能、他这么弄美国就完了、这么弄特朗普就不会当选。我告诉你，这不叫论据，这叫立场。\n\n那不是思考，是表达立场——因为加息会给他带来很大问题，所以他不希望加息。所有这么说的人，我几乎可以百分之百断定：要么持有有色金属，要么持有科技股。\n\n他们屏蔽不利消息，连看都不敢看。为什么不敢看？怕看完发现有加息的痕迹，所以不看，用\"他不敢\"来麻痹自己。凡是说\"他改不了\"\"加不了\"\"加完美国就完蛋、特朗普得下台\"的，你都不用跟他争论，这没有任何理论基础，是建立在一个设想上的。\n\n关于打赌多说一句。动不动就要跟人打赌的，都不是赌徒。赌徒得是胜率站在自己这边才下注，你这种毫无胜算的可能就开始下注，那叫赌场的消费者。一个人被称为赌徒，说明他可以以赌为生。你算过胜率吗就赌？动不动把\"赌\"挂嘴边，都是心里没谱的表现。我自己持股有信心的时候，从来不跟别人赌，我巴不得你便宜点再便宜点卖给我。\n\n## 三、我唯一不确定的是路径，而路径对投资影响巨大\n\n我敢不敢肯定沃什百分之百加息？我不敢。我现在也不认为他会百分之百加息。但加息的概率比以前大得多，这就跟以前完全不一样了。以前市场上还在信誓旦旦说不存在加息可能性，他讲完话之后可能性已经变大了。交易员按 50% 的加息概率在给衍生品定价，我认为这个概率要高得多。\n\n这叫思考的结果。你只要认识字，把沃什讲话从头到尾、一个字都不落地读一遍，你就会形成印象。但在这之前你要清空自己，先别有立场，先别替沃什加息之后美国怎么办操心，别管特朗普、中期选举、美国衰退那一套。\n\n你要做的是：根据这次讲话，判断他未来将要采取的策略。你所有说\"沃什敢不敢\"的话，我马上可以问你一句——你是沃什肚子里的蛔虫吗？你知道他敢不敢？无非是给自己壮胆。\n\n沃什现在干的事是重塑美元信用，这件事他干不成，这不用你讲。我唯一不确定的是路径：\n\n第一条路，直接美元贬值、走通胀。那我问你，持有货币和债券的这些老钱能束手待毙吗？那不就等于美国这些年的代价全由他们买单？你以为老钱都是包子？哪个没有政治代言人。特朗普原先想提名哈塞特，是因为哈塞特在参议院过不去。沃什上台本身就代表特朗普在某些博弈中已经认输了。\n\n第二条路，先让沃什控制通胀，导致一场危机，之后再重新走向宽松，从而完成美元币值重置、解决国债问题。因为只有先导致一场危机再重新宽松，政治压力才是最小的。这甚至不是谁设计的结果，是博弈的结果——就像你家孩子出门要干傻事要去创业，你告诉他不行他也不听，最后只能是\"你去试试吧\"，撞了南墙就知道回头。\n\n干成干不成不重要，他朝这个方向努力一下就会要了你的命。\n\n而且不只是美元。日元要加、美元要加，九月份欧元也会加息。货币的拐点不是今天才出现的。\n\n## 四、拒绝前瞻指引，意味着九月重新定价会异常激烈\n\n沃什通篇讲话就讲一件事：美联储必须重视通胀，美联储的唯一职责是重塑美元的购买力。\n\n他上来第一件事就强调：我不能再像以前历届美联储主席那样搞前瞻指引。我讲的话你怎么理解都行，但你不能把它理解为前瞻指引。我要做一个安静的美联储，一切靠数据说话、靠数据判断。\n\n这意味着什么？如果 PCE 指标在八月份最后一次公布时仍回不到美联储要求的 2%，那美联储在下一次议息会议上就一定会加息。这就是我的判断，看完原文就是这个判断。\n\n所以接下来关键问题只有一个：八月份的 PCE 能不能回到 2%。\n\n这里要分清，PCE 和 CPI 不一样。PCE 叫核心消费支出指数，不包含食品和能源。有人说\"那我把石油打下来\"——石油只影响 CPI，而且沃什这次明确说要看 PCE 而不是 CPI。\n\n原文里细节还很多：他说要看到\"未经修饰的数据\"，他说劳动力市场韧性很强，他说经济增长很好、但物价很高。没什么听不懂的，有中文稿，你反复读两遍，再愚钝也能看懂。人家已经铺垫完了：现在的就业率是可以承受加息的。\n\n至于\"他打着左转灯实际往右转\"这种说法，你告诉我你的信息来源在哪儿？你认识沃什，还是认识他家保姆？你无非是先有自己的观点，然后不利的消息一概不认。你唯一能获得沃什信息的渠道，就是他的讲话。除此之外你还从哪儿获得？还有一部分来自自媒体上号称\"认识沃什司机\"的大聪明。\n\n关键在这里：由于沃什上台后没有了前瞻指引，金融市场对加息降息的重新定价必须等到议息会议那一天才开始。从伯南克时代到鲍威尔时代，讲完话市场马上重新定价；现在你不敢完全反应，因为他说得比较模糊，你只能猜。\n\n那结果就是——从现在开始，美联储加息降息导致的金融市场波动，会比以前还要大。9 月十五、十六号如果真加息了，对市场的震动会比以前任何一次加息都大。这对相关标的来说就叫风险，当然也是巨大的机会。\n\n我去年这个时候认为美国一定要大幅连续降息，所以那时我坚定看好有色金属。现在这个条件不成立了，你不敢保证它一定大幅连续降息，甚至有可能加息，那你对有色的信仰就一定要改变——从\"它一定会涨\"变成\"它也有可能会跌\"，从\"可能跌一点\"变成\"也有可能大幅下跌\"。\n\n## 五、有色的真相：不是供不应求，是囤积需求\n\n有人说\"加息还能加出来铜啊？铜不得挖矿去挖吗？\"\n\n这句话是绝对正确的——加息不会增加铜的供给。但是加息会减少铜的需求。铜的短缺是在现有需求的情况下短缺，需求变了，它就有可能变成过剩。\n\n你加息之后所有资本开支都会变贵，融资会变贵。AI 数据中心建设成本变高，边际量会不会减少？会。量减少了，数据中心本身用的铜、以及它带来的电力设施用的铜都会减少。需求减少和供给增加，在本质上有区别吗？你所谓的供不应求是在现有供给条件下，如果供给没变而需求减少了，一样会变成供过于求。\n\n更要紧的是，你要分清这里面有多少铜是真的被消费掉了。\n\n谁能解释一下：铜这么供不应求，为什么现在世界三大交易所的铜显性库存是历年来最高的？\n\n答案是：这是囤积需求，不是真正的工业需求。因为有人认为铜一定会涨价，所以囤起来。这跟当年的茅台一个道理——茅台也供不应求，但买走的茅台没被喝掉，都囤起来了。你把囤积需求也当成供不应求，那它当然供不应求，但实际上实物在整个生产过程中是过剩的、没被消费掉。这意味着当价格反转时，这些原本囤的货会成为你的竞争性供给，重新进入流通市场。现在的白酒你就能看明白。\n\n那铜为什么涨？很大一部分原因是黄金涨带起来的。\n\n黄金没有供需关系，纯金融属性。黄金这些年涨价是因为供不应求吗？是因为美元在贬值。各国央行为什么买黄金？因为外汇储备里是美元，随着美元滥发，美元购买力受损，我要保住购买力就去买实物。而央行不是炒家，买完作为外汇储备就收走了，这部分黄金退出流通，所以黄金上涨。\n\n黄金的金融属性被激活以后，铜也有金融属性。有人觉得囤黄金贵了，就开始囤铜、囤白银。所以你会看到黄金涨完白银涨，白银涨完铜涨——这并不全是工业上供不应求，而是囤积的人多了。\n\n沃什讲话里专门提到了大宗商品，因为大宗商品涨价会传导到 PCE：铜涨价，家电、电力建设成本跟着涨，最后电价上涨，这些都构成 PCE。所以你把黄金和铜炒上天，不就是逼着沃什加息吗？\n\n铝的金融属性少得多。铝上涨两个原因：一是我们的产能控制，二是铝和铜在很多领域可以竞争互换，所以铝价跟着铜价走。铝价最主要是产能控制——我们要是不控制产能，铝早就完了，甚至铝完了铜也就完了，因为价差一大就会出现替代。\n\n别跟我说铝不可替代铜。空调散热器、新能源车高压线束，甚至电机都可以用铝替代。都是成本问题。大米白面一个道理：白面 50 块一
