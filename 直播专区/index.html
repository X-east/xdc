不能再持有了，就卖了，也提醒过他小心这笔收购。结果人家笑我，说人家天天去参加股东大会，什么都知道。\n\n## 六、铜：美国囤了 90 万吨，就等 9 月 30 日那个决定\n\n说点正经的行情。你们看新闻，新奥尔良那个铜仓库，现在都快装不下了。美国现在囤了多少铜？八九十万吨。\n\n美国一年大概消耗两百多万吨铜，也就是说，它现在囤的这些，够它用接近五个月。而以前康麦克斯（COMEX）的库存一般就两万多吨。\n\n那这个事儿怎么收场？9 月 30 号就见分晓了——特朗普到底加不加铜关税，那天得定。一旦定下来，\"囤铜\"这件事就算完了。因为现在往美国运铜，主要就是赚\"加关税以后会涨价\"这个差价：如果定下来要加，那囤在美国的就赚了，你再往那拉也赚不到钱了；如果不加，那就更没必要往美国运铜了。\n\n所以不管加还是不加，这件事都结束了。接下来呢？这些库存得出来，得用到实体当中去。\n\n## 七、不管加不加关税，对铜都是利空\n\n这儿得算一笔账，你们听清楚。\n\n美国现在囤了八九十万吨铜，按它的消耗速度，需要接近五个月才能消化完。这就意味着，未来五个月里，美国不需要再从外面进口铜。\n\n那会发生什么？原来铜涨价，是因为突然多出来美国这么一个\"囤货需求\"；现在这个需求没了，原来囤好的那部分反而变成了供给，砸向市场。在这五个月里，铜会突然供给过剩，铜价马上就\"回家了\"。\n\n所以你就等着看。唯一的不确定性是：如果到 9 月 30 号，川哥又玩一招，说\"我再延三个月，延到 12 月 30 号\"，那这事儿就又不好说了。\n\n但我还是觉得，即便他继续玩，也很难玩下去了。因为现在美国加息了，囤铜的财务成本上去了。 囤铜不是白囤的——仓储费、财务成本，那都需要钱。你看新奥尔良仓库都快装不下了，你还要囤，就得再建新仓库。\n\n再说国内。我们现在的铜价都到十一万了，为什么？因为美国把全世界的铜都吸走了，我们这边特别缺。缺到什么程度？铜的加工费现在是历史最低值，负两百美元——就是说我们给人加工一吨铜，还得倒贴两百美元。\n\n前一阶段说不加关税了，铜价马上就跌下来；后来说又要加，又涨上去了。吵来吵去，这背后就有人不断在编故事。\n\n## 八、川普就是全世界的\"股市指挥部\"\n\n你们别以为这些是笑话。以前有人说我没有内幕消息，我说你咋的，你在\"股票指挥部\"认识人啊？现在看，川哥就是全世界股市的指挥部。\n\n他把原油空单、多单开好了，转头去伊朗开两炮，马上就赚钱；等仓位平完了，就告诉你\"我和伊朗准备谈判了\"，价格马上又接上。明天说一句\"我不准备加铜关税了\"，铜价马上就跌下来——那说明人家空仓已经开完了。\n\n川哥自己说过，他上任这段时间给美国在股市和商品市场挣了不少钱。我觉得他说的是真的。你别以为是他自己在赚钱——他是为美国人民在赚钱。美国现在财政赤字那么高，不得开源节流吗？炒股也是个好办法，无非就是损害一点政府信誉而已。信誉这东西也不是一天两天能损害的，他干两年就下去了，底下人上来再修复。\n\n要是真这样，你说他拿什么发那一千美元？国债收益率这么高，国债都快发不出去了，过两天又到上限，还得等众议院、参议院那帮老头子批——那些人说话都颤颤巍巍的，有的还不戴助听器，你得喊，等他们批完，那都什么时候了。所以川哥说，开源节流，咱动点别的办法，在股票市场上挣钱这么容易，那就挣点呗。\n\n当然，这都是我的猜测，你们别当真。\n\n## 九、中美谈的不是关税，是 AI 的安全\n\n再说这周最大的事儿。今天早上我还没看新闻，贝森特（美国财长）已经说了，跟中国关于人工智能的谈判\"非常成功\"。那就是说，双方可能达成了关于 AI 安全方面的一个协议。\n\n你们得理解这里头的门道：一旦双方开始谈\"安全\"问题，其实安全本身不是最重要的。谈安全，就意味着大家都要放慢速度——原来一百天干完的活，现在得两百天；干五十天，停下来观察观察有没有危险，再干五十天。速度一下就下来了。\n\n那顺着往下想：数据中心、算力的建设，是不是也得放慢？\n\n这周你就盯这几件事：谈判谈成什么样、AI 领域的合作有没有进展、对 AI 的监管会不会导致人工智能投资放缓。你不用在这儿猜，等消息出来再判断，来得及。你别动不动就有信仰，炒个股还炒出信仰来了。\n\n## 十、AI 是武器，这场谈判相当于\"核裁军\"\n\n为什么这个谈判这么重要？因为 AI 不只是一个机器人那么简单，它是武器。\n\n你看俄乌战争用无人机，未来就是机器狗、无人机器人。打仗的时候，这是碾压性优势。而核弹你没法真用——用了核弹，把自己的气候也毁了。所以未来决定战争胜负的，可能就是 AI。它不光是科技竞争，是军事竞争。\n\n所以这场谈判，实际上相当于当年的\"核裁军\"。\n\n大家为什么说安全问题重要？从 AI 刚出来的时候，中美就达成过一个很重要的协议，可能很多人没注意：我们坚决不把核打击的决定权交给 AI。这是双方早就谈成的。否则将来有一天，就像《终结者》里的天网那样，它自己就开始发射核弹，人类不就完了吗？核按钮的最终决定权，绝对不能交给 AI。\n\n但即便如此，问题还是在。核按钮的决定权在总统手里，可你凭什么决定核打击？你得根据情报。如果有一天 AI 发达了，给你编制出一整套完整的情报——雷达影像全是它合成的——你怎么办？俄罗斯\"发射\"了一枚核弹，你回击不回击？\n\n所以我以前跟大家讲过一个理论：AI 出来之后，你所看到的世界有可能就不是真实的世界了。 你现在了解世界无非是靠抖音、靠电视、听谁说的；如果这些东西都被 AI 控制了，它给你编一套完整的消息，让所有人都以为那件事发生了。\n\n## 十一、囚徒困境怎么解：互派监督员\n\n可这事儿大是大，你说停下来，人家使劲往前跑怎么办？这就是个囚徒困境。\n\n所以大家坐下来谈。前两天不是有人提了个建议吗——互派监督员：我派个监督员到你那儿，你派个监督员到我这儿；或者成立一个第三方机构，就像当年国际原子能机构那样，互相核查、互相看着。\n\n只有这样，大家才敢说\"咱们都把速度放下来\"。你发展可以，但安全第一——只要考虑安全，速度就一定受影响，这跟打仗一样，你带着盾牌上去，机动性必然下降。这就跟战国时候互派人质一个道理：你看着我、我看着你，我违约你杀我儿子，你违约我杀你儿子。都押在一块儿呗。\n\n另外，美国那四大 AI 巨头不是提出\"AI 应该受到监管\"吗？现在他们四家在美国还被起诉了，说他们搞产业联盟、搞垄断。但我觉得他们确实是看到了危险。他们之间也是囚徒困境：我停下来你不停，你不就把我拉下了吗？所以最后只能互派监督员、互相核查，大家一起把速度降下来。\n\n我是让大家自己去关注这些事，你别依赖我的解读。多看原文，少看自媒体。\n\n## 十二、少看自媒体，多看官媒\n\n怎么分辨新闻真假？看官方新闻，看新闻联播，看新华社的报道，包括新华社的官方自媒体。我们很多人有个毛病：觉得官方新闻都是假的，只有自媒体是真的。\n\n自媒体你也不是不能看，但得挑那些非常严肃的。别整那种一出来就哗众取宠的——\"美国根本不敢加息\"\"他有四十万亿国债\"，这种你别看。你要是听这种自媒体，你就彻底玩完了。而且算法很坏：你听了一个这样的，以后推给你的全是这样的，你就真觉得这就是世界的真实声音了。\n\n尤其我们中国的自媒体，真正有知识、有理性的太少，多数是人云亦云、煽动情绪，都跟义和团似的，刀枪不入。包括我们雪球上这些，也一样。\n\n## 十三、芯片股要小心\"劈叉\"\n\n回到盘面。这一周你要关注的是下周那个大谈判，AI 合作有没有进展、AI 监控会不会让投资放缓。\n\n按今天的盘面看：纳指期货是涨的，美元指数也是涨的，但人民币还在升值；日元汇率 156 上下，没怎么跌也没怎么涨；美债期货是涨的，说明收益率在往下走，没有像周五那样继续上涨；贵金属今天黄金其实跌了一点；原油在跌，说明中东局势有缓和迹象。\n\n科技股上涨，是因为下周那个大事——双方要谈 AI、要合作，芯片制裁边际上会放松，这就刺激了美国的芯片股。\n\n但这里有个关键：你别以为国外芯片股涨了，我们的芯片股就会涨。 前一阵国外和国内的芯片股就是劈叉的——国外涨得多的时候，恰恰是我们跌得多。为什么呢？因为我们是国产替代链，老外一放松，对国产替代产业链反而是不利的。\n\n所以今天你看，昨天美股芯片涨那么多，今天开盘我们的芯片是下跌的。至于美国的芯片股，如果真放开，那是绝对受益的——你想，那些芯片除了卖给美国，别的国家能买多少？要是能卖给中国，中国比美国买得都多，那是不在一个量级上的市场。闪迪周五涨了百分之十几，很正常；你要真把 GPU 放开，英伟达还能再涨百分之五十。\n\n但我觉得做不到这一步。AI 竞争不是一般的事，这就相当于当年的核弹竞争。\n\n## 十四、创新药：确定性不足，我只买传统医药\n\n有小朋友问创新药。我的看法是：创新药在药品这个大类里是弹性最大的，它相当于科技股；但对我来说，确定性不足。\n\n作为职业投资人，我投它就得投一揽子。比如我买过创新药的 ETF，这个是可以的；但你让我买某一家创新药公司，我是买不了的——对我来说它确定性不足。\n\n这就是我昨天在会员直播里专门讲的：业余投资和专业投资的区分。 对我来说，创新药不能买，就只能买传统医药。\n\n顺带预告一下：下一次会员直播，我给大家讲一个话题，叫\"投资于人\"。 这件事对整个未来五年你的投资都会有巨大影响。\n\n## 十五、投资的第一件事：选对大方向\n\n为什么\"投资于人\"这么重要？因为它是基础逻辑。\n\n你基础逻辑对了，根本不需要去分析那家公司生产多少吨铜、多少吨铝。你坐在一部上升的电梯里，你是在做俯卧撑还是弹跳，都无所谓，你照样上升；反过来，你坐在一部下降的电梯里，你天天励精图治、卧薪尝胆，该跌还是跌。\n\n所以投资的第一件事，是选对大方向。有了基础逻辑，剩下的事儿就简单了。\n\n我五年前选的基础逻辑就是有色金属。你不用纠结\"那我选哪个\"——你选哪个都一样，可能有偏好，就像看对象一样，对上眼缘就行。你要是从 2021 年拿到现在，任何一个有色金属都是上涨的，跟你选哪个基本没关系。当然，你得知道在高点卖。\n\n## 十六、我五年前的大逻辑：赌通胀、买资源、躲地产\n\n五年前我赌的是什么？我赌的是全世界的通胀。 所以我赌的就是资源、有色这一类。\n\n回避什么呢？回避房地产，所有房地产链上的东西都要回避：\n\n高端白酒——它是房地产的影子股；\n\n建筑建材、工程机械；\n\n房地产开发公司，那不用说了；\n\n白色家电、装饰装修；\n\n基建，包括央企基建。\n\n逻辑很简单：大逻辑是通胀，那通胀受益的是谁？资源类受益，金融也受益。\n\n但我不买银行，我认为它弹性不足。我当时买了不少券商。\n\n为什么是券商？2021 年房地产见顶之后，我的基本假设是：钱一定得从房地产里出来，进入到资本市场。 而房地产公司和证券公司，在这件事上是一样的——它们都是把人们的钱变成资产的通道。\n\n建房地产的时候，这条通道上走的财富多，所以房地产公司涨；2021 年房地产到顶，这条通道走不通了，未来老百姓的财富得进股票市场，而进股票市场要通过券商。所以券商一定会受益。 而那个时候券商被骂成\"渣男\"，所有人都不看好——你就获得了一个极好的逆向投资优势。\n\n## 十七、券商和地产公司是一回事：都是财富的通道\n\n看准了这一点，你就拿着券商不用动。至于拿哪家券商？我说拿哪家都行。\n\n我买券商，连资产负债表都不看。你可以说我是在扔骰子。但我会分散：所有制上，买一个国有的、买一个私营的；地域上，买一个上海的、买一个武汉的；规模上，买一个大的、买一个小的。这样就把黑天鹅风险分散掉了。\n\n配置完了就等着。等到 2024 年 9 月 24 号，国家政策转向、所有人开始看好券商的时候，10 月 8 号那天拉到最高点，你直接一卖就完事了。以后卖飞了怎么办？卖飞了跟你没关系了，你不挣那个钱；10 月 8 号之后有 10 月 8 号之后可以买的东西。\n\n这投资很复杂吗？一点不复杂。关键是你没看懂大势。\n\n## 十八、十二年十二倍：年化 23% 是怎么来的\n\n昨天我把收益率给大家看了。今天说两件事。\n\n第一，数据来源。我原来那个券商提供不了一八年之前的数据，最近刚开放，能查到 2013 年了。我是 2014 年开始做职业投资的，2013 年以前没意义——那时候我还是兼职投资，精力根本不在这事上。\n\n拿到数据我自己都没算过，就算了一下，列了个表。结果比我以前自己算的还多。 为什么？因为他算收益的时候，会把我每年拿出来的生活费刨掉，一年一年串下来，那个数据是更真实的。我自己知道去掉所有花销之后大概是多少——就是我以前跟大家披露过的：十二年十二倍。\n\n要算年化，复合收益率大概每年 23%。要是从十八年那个口径算，年化是 27%。\n\n当然我有一些年度没做好，昨天也总结了。最主要的是 2021 年做洛阳钼业没有及时卖出——那一次操作失误，正好影响我一倍的收益。否则我现在是十二年二十四倍，不是十二倍。但那都是过去的事儿了，你回顾、你去假设\"你要是拿着现在又翻一倍多\"，那没有意义，那不是成熟投资人的干法。\n\n## 十九、我怎么做投资：不做深度研究，也能赚钱\n\n第二个要说的，才是我为什么给你们看这个表。\n\n我要告诉你的是：像我这么投资——不追热点、专门做价值投资，也依然可以获得成功。\n\n你们看这个 23% 的年化，我告诉你：\n\n我没买过任何一个时髦的股票；\n\n我没有对任何一只股票做过细致的研究；\n\n我一次股东大会都没参加过；\n\n我没给上市公司打过任何电话；\n\n我没下过矿井去看人家怎么挖矿；\n\n财务报表我看，但不会研究那么细——存货多少、今年挖多少矿、存哪儿了，我不研究这些。\n\n我就是看大势，然后大致看看财务报表，就这样。我就是要告诉大家：这样也能取得不错的收益。\n\n所以你们关注我，如果我投得一塌糊涂、亏得裤衩子都快没了，那关注我有什么意义？我教你的东西、告诉你的东西，这么投还安全，一样能取得不错的收益。\n\n当然，跟人家动不动\"五年赚一百倍\"比不了。我实事求是，我赚不了，这就是我的实际水平：年化 23%。你要能取得这个收益率，你已经非常牛了，你还想怎么的？非得五年挣一百倍？\n\n再说我今年：截至上周五，收益率是 3.21%。年初我就告诉过大家，我今年的收益目标就是不亏损。6 月 30 号我清掉了所有的融资，6 月 30 号之前都是满仓满融。\n\n具体的行业和股票，现在不能说了；未来的更不能说。我只讲道理，你自己去判断。\n\n## 二十、模糊的正确，好过精确的错误\n\n我为什么坚持这套模式？因为这是最适合散户的。\n\n散户最大的缺陷有两个：第一，获取信息的能力有欠缺，你处在信息的末端；第二，分析信息的能力也有欠缺——各种信息综合在一起，因果关系最后怎么影响价格，你也判断不了。\n\n你获取信息有欠缺、分析信息有欠缺，那你只能保持一样东西：模糊的正确。\n\n我以前在雪球上画过一张图：你散户拿的就相当于一支霰弹枪，那玩意儿本身就不准。你还非要玩狙击枪、你还要跟机构对狙——你加个瞄准镜，你那玩意儿也不准啊。\n\n所以你和那些天天写巨长文章、查一大堆数据的小散户一样，说这个项目跟那个项目有什么关系、明年产量多少、按什么价格算利润多少——那狗屁用没有。你明天铜价一跌，这些东西全都没用。\n\n你需要的是模糊的正确，不是精确的错误。 你在一个本来就不准的信息里，想要获得一个准确的结果，那不是纯扯淡吗？\n\n花功夫，要花在你能理解、又对你的结果有用的地方。\n\n## 二十一、宏观有没有用：巴菲特也在看宏观\n\n最后说一个被自媒体带歪的观点：\"宏观没有用\"。\n\n宏观非常有用。宏观是所有人的环境。 你不要以为巴菲特不重视宏观——巴菲特的宏观和你理解的宏观不是一回事：\n\n对巴菲特来说，宏观是他可以提前知道的、是他应知应会的；而对你来说，宏观是你的外在环境。\n\n巴菲特在宏观的理解和知道的先后上，一定比你强太多，所以他可以不重视宏观、只重视微观就够了。但你必须重视宏观——因为有时候，你的宏观就是巴菲特带来的。\n\n我给大家讲过\"蚂蚁冲浪\"的故事。巴菲特买比亚迪的消息传出去，比亚迪的估值就会提一部分；巴菲特卖出比亚迪，就会使比亚迪的估值受到压制——因为大家会想\"巴菲特都卖了\"。他本身就有宏观效果。\n\n所以什么叫宏观？宏观就是一个人由不得自己决定、但对投资结果有很大影响的那些外在因素。 你说巴菲特不重视宏观、所以你也不重视，那就不对了——你把自己想得太大了。\n\n## 二十二、收尾：评书而已\n\n今天我讲得挺好，都是干货。从这次加息开始，又一个转折期出现了，所以我现在开始做下一个五年规划。规划做完了、买完了，我根本不需要动，也不需要纠结买哪个公司——买哪个都一样，只是挣多挣少的问题。 你就记住：坐在上升的电梯里，坐哪部电梯都上升。\n\n顺便说一句，我现在已经不持有有色金属了，但我并不看空有色。他们天天骂我，是因为筹码已经严重恶化了——现在所有人都能给你讲有色金属上涨的故事了。五年前我说这些话的时候几乎没人信，那时候券商的有色金属研究岗位都撤了，公募基金都不配有有色金属。你自己想想，现在什么东西在被低配，未来你就该远离什么。\n\n但我不能给你们推荐未来，我只讲过去——我是为了讲理。未来买啥，你自己判断。\n\n最后照例声明：我讲的一切都是虚构的，都是评书，不能用来指导投资。 我涉及的个股基本都是我过去投资过的历史，现在我自己都不持有；对行业的评价也是如此，讲的都是过去。\n\n谁也别跟我说\"我听你的买了啥\" ——不论你是夸我还是埋怨我，我只要听到这句话，立马拉黑。你可千万买啥都不要听我的，你说这句话，就跟骂我是一样的。评书都给我打在公屏上。\n\n今天就到这儿，谢谢大家陪我度过一个无聊的上午。明天没有直播，我休息一天，嗓子有点哑了。拜拜。","toc":["一、开场：捅完马蜂窝，我躲进堡垒里","二、他们越骂我，筹码锁得越死","三、互相唱和，是我最害怕的指标之一","四、三年涨五倍，在五倍买入：两年后 75% 的人腰斩","五、别去参加股东大会：去了你就是蒋干","六、铜：美国囤了 90 万吨，就等 9 月 30 日那个决定","七、不管加不加关税，对铜都是利空","八、川普就是全世界的\"股市指挥部\"","九、中美谈的不是关税，是 AI 的安全","十、AI 是武器，这场谈判相当于\"核裁军\"","十一、囚徒困境怎么解：互派监督员","十二、少看自媒体，多看官媒","十三、芯片股要小心\"劈叉\"","十四、创新药：确定性不足，我只买传统医药","十五、投资的第一件事：选对大方向","十六、我五年前的大逻辑：赌通胀、买资源、躲地产","十七、券商和地产公司是一回事：都是财富的通道","十八、十二年十二倍：年化 23% 是怎么来的","十九、我怎么做投资：不做深度研究，也能赚钱","二十、模糊的正确，好过精确的错误","二十一、宏观有没有用：巴菲特也在看宏观","二十二、收尾：评书而已"],"url":"https://www.bilibili.com/opus/1250364846465089537","bv":"","minutes":0,"chars":9466},"topics":["模糊的正确","十二年十二倍","大逻辑","铜库存","AI安全谈判"]},{"date":"2026-09-19","bili":{"title":"老木匠 2026年9月19日直播文字稿（人民币升值、职业与业余投资、加息共振、中美缓和、沪伦比）","text":"## 一、开场：孩子的事，该放手时就得放手\n\n今天周六，跟大家聊聊天。有多少人孩子还在上小学中学的？我以前像你们这个岁数，孩子小的时候，每到周六周日都要送孩子去上课，那时候真的挺辛苦。但我要说，你也要珍惜这段时间。\n\n等到孩子一上大学，那就算离开家了；慢慢地他再回家，就像客人一样。父母子女一辈子也都是缘分，过去的东西就过去了。我现在回想，你们小的时候经常拉着玩的时候——我儿子经常问我\"这个对不对爸爸\"，就是这种说话的模式——可你最后拉着他的手是哪一次，你根本回忆不起来。\n\n培养孩子就是这样，你得放手，他有他的一生。教育孩子最忌讳的就是你总替他操劳，该放手的时候一定要放手。他长大了就一定要离开你，否则你养育下一代还有什么意义？千万千万不要有大学还去陪读的想法，这个想法有了，你就把孩子毁了。上大学你就要把他撵出家门，让他自己建立生活圈子，而不是每天只跟你接触。这可不是小事。\n\n## 二、不推荐股票，也不披露持仓\n\n有人问木匠叔重仓的是什么。这我不能说，你一看就是新粉丝——我这里不是推荐股票的直播间，这是一个讲评书的直播间。我不会说自己的持仓。\n\n不是我不愿意给大家代码，我都无所谓，但现在不允许。你要是非问我这个，我就觉得你是在引诱我犯错误。现在的情况和以前不一样了。我刚上雪球的时候，每天买卖都在雪球上直播，那时候粉丝也少，也没人信。信我的人多起来是从二零二四年九月十八号开始，因为我喊了一嗓。\n\n## 三、\"捅马蜂窝\"：我用黑名单做草根调研\n\n这两天我把黑名单清空了，因为我要观察。我前两天就提醒大家\"前方高能\"，就是因为我把黑名单里的人全放出来了。你只要一取消拉黑，他马上就来关注你，然后在你帖子下面骂一句，而且最主要的是这些人还在偷偷看我的帖子，然后背后写文章专门用来骂我。\n\n我纳闷，他们做个股票跟苦大仇深似的。我对他们没什么情绪，说完直接拉黑就完事。我放他们出来是为了观察——我要体会真正的市场温度，就得捅捅马蜂窝。你把马蜂都关起来，捅马蜂窝还有什么效果？得把马蜂全放出来，捅一捅看里头什么情况。\n\n我这一捅，发现散户没啥变化，甚至比以前更厉害了。剩的这些人更容不下不同观点——一个人容不下不同观点，就说明他自己本身有恐惧感，他害怕。你要当过老师就知道，什么样的学生都有，你生气也没用，得站在观察者的角度。\n\n你骂我也没用。任何一只股票都不是我说两句否定意见它就能跌，也不是我赞成两句它就能涨。大家最终都按自己的看法做决策，跟你骂不骂我没关系。\n\n## 四、谁都在评论美联储加息，这是最坏的局面\n\n最近最热闹的就是美联储加息这件事。现在雪球出现一个很不好的局面：是个人都认为自己可以对美联储加息发表看法——不管你懂不懂。你甚至不太懂中央银行是怎么工作的，不懂货币是怎么创造的，不懂加息这种价格工具最后怎么传导，然后就用义和团似的观点来评价，动不动就是\"敢与不敢\"\"怂与不怂\"\"贵与不贵\"。这跟这事儿压根没关系。\n\n今天我看到一个最有意思的说法：\"美联储加息是为了卖美国国债\"。我到现在都没明白这结论是从哪来的。还有人说加息是为了增强美国货币信用、为了治理通胀、最后为了卖国债——这个可不一定。买不买国债有很多决定因素，不光是通胀这一条。而且这一次加息并不能把通胀压回去：你看昨天晚上美国国债期货五年期、十年期、三十年期都是下跌的，三十年期跌了百分之零点四九，这是很大的跌幅，说明人们对未来的通胀预期还在。比特币都八万了，这都是通胀预期压不下来的表现。\n\n美联储加息是不是个狗屁都不顶的事儿？那我问你，当年对美联储主席提名的争夺为什么如此激烈？特朗普把最信任的米兰都安插进去了，最后还是被踢出来。特朗普为什么不惜动用刑事手段调查鲍威尔？这说明货币政策、货币的宽松与紧张，对整个宏观经济影响非常巨大。到中国就变成了\"加不加息都无所谓，那是吓唬人的\"——呵呵。\n\n全世界都盯着这件事，研究点阵图、研究沃什发言的每一个字、研究记者会上每一个字甚至每一个笑容，就像当年研究格林斯潘的公文包——是满的还是空的，满的可能要加息，空的可能就要宽松。轮到我们这边，\"那都没用，那都是吓唬人的\"\"一切帝国主义都是纸老虎\"。你这什么义和团呢？\n\n我做股票时间长了发现一件事：某人在某一只股票上获得成功，他就认为自己无所不懂了。你不是在某一只股票上成功就啥都懂了，该学习还要学习。巴菲特和芒格一辈子取得那么大成功，每天都坚持学习，非常谦逊。不懂的事儿你就是要承认不懂。\n\n## 五、加息是认真的：全球共振，日本才是最大变量\n\n个人判断：沃什一定会把加息进行到底。是否进入加息通道，每个人都有每个人的观点，这很正常，但我认为他要进入一个加息的通道。而且这种加息通道不只是美联储一家，它是全世界共振的。\n\n以前历次加息是没有日本参与的，日本利率一直是零。这次美联储、欧洲、日本共振，最主要的是日本。所以我说，你们把美联储加息这事忘了，日本加息才是要命的，它才是最大的变量。\n\n昨天晚上日本加完息以后，日元汇率立马贬值，一度干到一百五十七，按这个速度很快又到一百六以上。现在日本这次加息完，市场认为日本十月份加息概率很低，但从植田和男的讲话看，我不认为十月加息的概率很低。因为这次日本加息有两个人投了反对票，这两个人是高市早苗任命的，代表高市早苗——我早就跟大家说了，高市早苗是不愿意加息的，因为她属于安倍经济学的拥趸。如果让高市早苗说了算，她就应该放任日本的通胀、放任汇率贬值，这不仅是放任，这就是安倍经济学追求的结果。我上次直播日本还没加息的时候我就告诉你了。但植田和男的讲话比较硬，所以这事儿不好说，这是一个博弈的过程。\n\n## 六、说我\"轱辘话\"的人，其实一个字都没听懂\n\n网上很多骂我的人说我\"天天扯轱辘话来回转\"。我跟你讲，所有这么评价我的人，他根本都听不懂我在说什么。\n\n为什么？因为对他来说，我上次说的他听不懂，这次说的他听不懂，下次说的他也听不懂，他就认为说的都是一回事，都是噪音。这就像听不懂音乐的人——你根本听不出这是布拉姆斯还是贝多芬，你觉得交响乐一出来又喇叭又弦的又叉的，反正都一个味儿，所以你就觉得\"怎么又奏一遍\"。其实不是，不同人的音乐写得不一样，我每天讲的东西都不一样，问题是他听不懂。这跟学渣一样，你上课听不懂老师的话，就觉得老师来回说，其实老师一直在讲新东西，只是你听不懂而已。\n\n所以有些事必须要有基础知识。你在一个信息里能看到什么、得到什么，取决于你掌握什么样的理论、具备什么样的知识。同样一张核磁共振的片子，你一看全是剖面图，肝脾肾都差不多；人家大夫一看，这是良性瘤，那是恶性瘤。你不懂医学，你看啥呢？\n\n今天美国加息了，你是外行，你根本不懂这里头未来会产生什么影响。我作为内行已经看出来了——这地方长了个瘤，而且极有可能变成恶性的。你外行搁那看半天：\"这不挺好嘛，肝也有胃也有。\"这就是我和很多人的区别。现在有个非常不好的倾向：明明没学过医，非要对核磁共振的片子发表看法。\n\n## 七、你说的那个\"美国\"，到底是哪一个\n\n一说美国如何如何，我就问：你说的美国是谁？是特朗普，是贝森特，是财政部，是美联储，还是哪一个公司？你这么说话，就说明你根本不了解美国的政治体制。\n\n你甚至不能用理解中国政策的方式去理解美国的政策。美国是博弈的政治体制——大的方面三权分立，立法、司法、行政三家博弈；立法机构内部共和党和民主党博弈，共和党内部还有不同派系博弈。不同博弈背后代表的利益群体都很复杂，压根没有一个人能说了算，最终都是博弈的结果。\n\n美国议员提的议案一天汗牛充栋，我可以告诉你，他们提的东西屁用都不顶。那既然屁用都不顶，为什么我们外交部还抗议、商务部还提意见？你又不懂国际政治了。你看我们表面上关系都很好，底下该抗议还得抗议——比如我们和越南关系明显很好了，西沙群岛的事该说还得说。你这次往前迈一步，我不说，那我就默认了。这不代表有什么影响，这是宣示立场的战场。就像有人在你家门口倒垃圾，其实没啥影响，但你必须喊两嗓子——这是我的地方，不允许你倒。\n\n## 八、中美关系正在缓和，证据不止一条\n\n我赌中美关系会缓和——上一次美国科技股大涨的时候我就给大家说了，有听过的扣个一波一。\n\n你看现在都谈到什么了：谈到我们要有三百亿美元互免关税的额度，商务部发言人前几天说的，你都不知道贸易关系已经缓和了。然后——中国最近在美国下了很多大豆订单，中粮集团下了好几百万吨。然后人民币开始升值了。然后美国芯片股突然大涨，你以为这是什么原因？\n\n我告诉你，中美关系在缓和，极有可能芯片管制会边际放松（不能全放开，那不可能）。这就是最有利于美国芯片的。十一月是老特来，下个星期我们大领导就去了。你是不是啥消息都不知道？\n\n我是从美元涨价那天开始、人民币汇率开始上涨那天就告诉你：我认为中美关系在缓和，极有可能芯片会边际放开。昨天美国晚上的科技股上涨是芯片股带动的，跟你什么\"加息以后利好落空、利空出尽\"狗屁关系都没有。现在根本不炒那些东西了，炒的是下下星期的大事。\n\n## 九、心理层面的影响已经结束，实质影响才刚开始\n\n我说的\"利空出尽就是利好\"全是胡扯。所有消息只要出来那一刹那，在心理层面的影响就已经结束了——甚至没等你加息，心理层面的影响就结束了。你接下来要关注的是加息的实质性影响。\n\n实质性影响究竟有多大？我说不清，连沃什都说不清，你得观察。但有一点是肯定的：长时间看，如果加息进入一个周期，对股市一定非常不友好。\n\n大家可以想一想：二零二零年以来，疫情以来，欧、日、美是不是股市共振性上涨？你分析美国股市为什么涨，说是因为人工智能；日本股市为什么涨，说是汇率下跌、国内通胀、去日本旅游的人多了；那欧洲股市为什么涨？欧洲汽车企业都快被中国顶黄了，你告诉我欧洲股市为什么涨？只有一个原因：二零二零年全世界共振性地实行了货币宽松，它是个货币现象。\n\n你只看一个一个具体的东西，没有抬头看大框架。你就相当于一只蚂蚁爬在蒙娜丽莎的画像上，觉得啥都看清楚了，其实你根本不知道这画的是什么。为什么二零二零年之后这一波大牛市只有中国掉队？因为中国压根没有随着他们一起大放水。二零二零年疫情来的时候，全世界都生产不了，都得靠货币宽松支撑——谁都知道货币宽松以后会成问题，但你不宽松现在就死了，你知道吃进去是毒药也得吃。吃完的结果就是通胀、资本市场上涨、泡沫。我们二零二零年没跟，是二零二四年才开始货币转向——这就是九二四新政。\n\n那我告诉你，现在货币现象开始全世界共振性转向了。过去的宽松结束了，为什么不转向国债都卖不出去？现在全世界的国债收益率都在共振式上涨，大家都对通胀有巨大预期。纸币已经开始废纸化，在这个过程中总有一些利益集团受损，他们不会被动挨打，一定会反抗，反抗的方式就是通过加息解决通胀、保护他们的利益。但最终他们也保护不了，问题是——他们的努力会要了你的命。这句话你要打在公屏上：抗通胀的努力，才是对股市最大的打击。这是巴菲特说的，通胀本身对股票没什么影响，但抗通胀的努力对股票影响非常大。\n\n## 十、鲍威尔的失误，与中国防疫三年的另一层作用\n\n鲍威尔作为美联储主席是非常失败的，他是一届非常失败的主席。他下台不完全是因为特朗普，是因为所有的利益集团都认为他不合格——不是太软了，是这人水平不行。\n\n二零二一年美国通胀开始起来的时候，大家都认为应该加息，鲍威尔说这种通胀是供给冲击造成的——当时疫情，只有中国在生产，美国码头工人严重不足，中国运到美国的货堆在码头没人分拣，超市供应非常紧张。所以鲍威尔认为这种通胀是暂时的，只要供给恢复、码头工人一上班，通胀立马就下来，所以他就没有加息。后来的通胀率急剧上升，跟他这一次的决策失误有很大关系。\n\n他就没看到一个时代的改变——中国那个时候已经明确提出双循环，一开始就不想给美国生产便宜的廉价生活用品了。所以你后来会看到，美国需要中国商品的时候，中国就开始防疫了，中国防疫愣是搞了三年。你们都不明白这道理：那时候国外全放开了，就中国不放开——就不让你们给别人提供廉价的生活用品。\n\n中国防疫三年起了多大作用？第一，提供廉价生活用品的这些小企业基本上都开始转型了，因为你干不下去了这活儿。第二，房地产就是从那时候开始停止上涨的。这是我自己分析的结果。如果我们不坚持抗疫，房价再涨几年，你现在怎么解决房地产泡沫问题？当时美国有多少人想把中国的房地产泡沫再往上吹大一点然后让它崩溃？今天房地产去泡沫都这么痛苦，如果再推大一点，那就不是痛苦了，是崩溃。\n\n现在房地产当然安全落地了——如果不安全落地，它会导致银行大面积倒闭。房地产公司倒闭倒没什么关系，房子都卖给老百姓了，但房价急剧下跌会导致银行坏账增加。房子都是贷款买的，到时候不还银行款怎么办？未来所有东西都会涨，房子不会再涨了。\n\n损失都是由输家承担的。你说\"损失怎么能由赢家承担\"——那才是逻辑矛盾。就像上一次互联网泡沫，那些建通讯基站、建光纤通道的人，钱都去哪了？他们为科技做贡献了。就像今天建大数据中心的人，就像后来买房子的人，钱都去哪了？全给社会做贡献了——要不然你拿什么修铁路、发射空间站、修高铁、修高速公路、研究歼二零？不都是因为你买房子买的吗？我早就告诉你们，房地产高房价是一种税收，你现在地方财政之所以这么困难，就是因为没有房地产这一项了。\n\n## 十一、这是一场注定有输家的游戏，先保证自己不当输家\n\n什么叫利用危机？中国早就告诉你们有危就有机。每一次危机你都要利用好，美国也一样——美国哪一次收割全世界不是利用的危机？\n\n没有危机你能亏吗？我上次就跟你讲了：现在是一个确定输家的游戏，咱们先决定谁亏。一次危机下来，你手中持有高估值的东西，你的钱就没了。但财富不会消失，它只是转移了。转去哪了？我也不知道，你过两天就知道转去哪了——现在赢家还没露面，逻辑链条长，你看不出来。\n\n你现在需要做的是：在一个确定输家的游戏里面，先别当输家。这个很容易做到。然后等赢家露面的时候那就简单了——输家遍地全是死尸，我推个小车到那捡就完了。你那时候只要不输你就是赢家。我那小图都给你们画多长时间了：你现在就在山坡上看着，看谁输了，等他们都输得差不多了，你小车下去推一车，根本不需要跑，因为没有人和你争。你有多大车，就能捡多少金子。\n\n## 十二、全世界在收紧，只有我们在宽松\n\n美国加息，中国明显不会加息。前几天我说了这对中国有什么影响：他们加息以后，可能导致中国不会那么顺利地降息降准——你不可能在美国加息的情况下我们继续反向降息。但有一点是肯定的：我们现在不会随着他们一起加息，这是基本上可以判定的。最主要的是我们现在利息整个水平非常非常低，货币很宽松。在全世界货币都转向紧张的时候，我们可以提供廉价的资金——我们又一次和世界走了一个反向的路。\n\n那么接下来：原来人家宽松的时候我们没宽松，人家股市上涨的时候我们没涨；现在人家转成收紧了，我们没有收紧，那是不是应该我们股市涨、其他股市跌？我告诉你是的。我现在就给你下决断：未来的股市，中国是唯一的避风港。你说它有多少大涨我不敢保证，但肯定有机会。\n\n外资想进A股那是挤破脑袋。这两天离岸人民币为什么这么快速升值？第一，我们没有控制；第二，有人需要人民币。以前我们要控制它升值，会用金融措施抽干你海外的头寸；现在我们没有控制，它自然就升值了。而升值不是我们主导的结果，是确确实实有人民币的需求。外资要人民币干啥？为了进A股投资。\n\n你们注意没有，前一阶段我们除了提\"含科量\"，在金融市场改革里反复提的一件事是什么？是金融市场的开放——要进一步开放、加大开放、继续开放。你把当年那些会议通稿翻出来看看就知道。这是要在制度上扫清外资进入中国的障碍，你得为老外进中国买股票做好准备。你不能一大堆管制措施，那怎么让人买？证监会历次的发言里都有，只是被\"含科量\"这件事掩盖了。我们为什么这么做？因为我们预见到了未来外资投入中国金融市场的需求量非常大。\n\n那么外资进来会买什么？外面开始加息，外面的股市一定会跌。从逻辑上判断它会跌，所以我逻辑上就会把一些东西取出来，到别的地方做平衡配置。当然不是所有美国人都来中国买股票，它只是一个边际上的变化——但边际上的变化是决定价格的直接因素。你小区的房价取决于最近一个卖房子的人卖多少钱，你的股票值多少钱取决于最近一笔成交价，什么叫收盘价？不就是今天的最后一笔交易吗。\n\n所以，美国有一些外资会到中国来买股票，但这并不是导致我们股票上涨的原因，它是我们股票上涨的结果。他们会分析出：因为中国没有随着全世界一起货币紧缩，在全世界股市下跌的过程中，中国会成为避风港。为什么？因为中国利率没有提升，股市可以维持估值，甚至由于宽松进一步传导，估值还会提升。所以他们才来买。这种结果又会进一步推升我们的估值，这是一个正反馈的环。但最终我们上涨的原因不是外资在买，而是由于我们的货币太宽松了。\n\n从国内角度讲：你有一百多万亿的存款，现在存款利率才多少？我们现在天天防止物价下跌、反内卷，都是在反通缩、推升通胀率。当你的通胀率推升到超过无风险利率的时候，存款的实际利率就是负值了。所以现在公布 CPI、PPI，大家都盼着涨——这是大家努力的方向。我们央行都提出来一个别的国家没提过的政策：推动价格有序回升，什么意思？就是治理通缩。\n\n## 十三、账期治理的真意：不是救中小企业，是为推升通胀\n\n前两天有个消息不知道大家关注没有：对一些大厂在上游供应商的账期太长进行治理——六十天之内必须还钱。\n\n大家说这是解决中小企业回款问题、解决资金流动性、保就业。你们说的都对，但这都不是关键的。这个政策也是治理通缩的主要手段。因为你大的主机厂占有上游中小企业账期的时候，你相当于获得了一笔无息的贷款，你对银行贷款的需求就减少了。现在我让你六十天必须还款，你没钱还怎么办？你就得去银行借款，你就要支付利息，成本就上升了，终端产品就不能像原来那样卖低价了。最典型的就是整车厂——你整车厂为什么低价竞争？因为你压榨上游供应商，不需要花钱贷款，所以即便无序恶性竞争你依然有利润。\n\n还有一个更关键的手段：可以提高货币层数。你在占用上游中小供应商货款的时候，你们是直接的债权债务关系，它是没有货币创造的。现在不允许你这么干了，你去银行借款，你就参与货币创造了，不就增加 M2 了吗。\n\n你说以前没有这情况吗？上游中小企业黄了吗？不也都生产得挺好吗？这就叫内卷，而反内卷的本质就是反通缩。内卷跟我们其实没什么关系，但内卷带来的通缩现在问题太大了。如果现在是通胀环境，谁去管反内卷的事儿啊？我告诉你，明天通胀了，明天就没人管反内卷了——等到通胀的时候，巴不得你们内卷互相降价，正好把通胀压下来。\n\n中国的工具多，通胀的时候我们不仅能治理需求端，还能治理供给端，就是财政手段多。比如美国现在通胀有一个很大的项是柴油——柴油涨价传导到运费，运费增加又推高每一次通胀。如果在中国，马上给我各个石油公司把价格降下来、开闸放水，谁都不许囤油，明天柴油价格就降下来，我们根本不需要加息就能治理通胀。你老美有这个手段吗？你让哪个炼油厂把柴油价格给我降下来？你只有货币手段，那不行怎么办呢？只能贵了谁也不用，都给我让企业黄。\n\n日本哪个部门能去给企业规定账期？日本那些穿燕尾服天天鞠躬的内阁，哪个人能管着\"你不许欠别人钱时间太长\"？美国你让谁管？我告诉你，中国就能管。所以我说我们手段多——你不加息，那我就好好提价，所有东西都让你涨价，这就是好处。\n\n## 十四、外资进来会买什么：不联动、无对标的核心资产\n\n那老外在这种情况下到中国来买什么？你就要想到：所有中国的东西，如果和世界联动的，那么外国股市下跌，中国这些东西也会下跌。\n\n有色金属是国际定价的，国外有色价格因为加息下跌，你国内能不跌吗？那些给美国做配套的光模块——现在美国科技股跌了、数据中心建不起了因为成本太高，你卖给美国的光模块能独善其身吗？你有很多东西都是给人做配套的。所以你越是国内的东西，越不用考虑。\n\n你看为什么黄酒涨？黄酒跟全世界有啥关系？外国人根本不喝那玩意儿。金枫酒业、会稽山、古越龙山这三大黄酒，我一直关注，就是太贵了。它是小众市场，游资最容易炒，但它得有故事讲——它根本不受国际市场影响。啤酒都可以进口，黄酒上哪进口去？所以为什么基本面不如啤酒的啤酒不涨？因为国外有相应的啤酒公司，假如国外股市下跌、经济萧条，啤酒估值也上不来，那国内啤酒估值怎么上来？黄酒的好处就是你根本没有对标公司，连心理层面都不受影响。中药也是，没有对标公司，不受国外估值影响。\n\n所以你现在需要害怕的是：第一，基本面上和国外联动；第二，你的公司在国外有对标。 最好是基本面不联动、估值上也没有对标公司的、完全是中国自己循环的东西。\n\n对于国际大资本来说，他们进来就买中国的核心资产——不受国际联动影响的核心资产，未来二十年都破产不了的。中特估基本上都在这个范畴里，比如大的保险公司、大的银行。这时候你作为普通老百姓，要知道什么东西容易在这次占便宜。整体估值提升理论上所有标的都会涨，但什么能涨得更多，你得考虑弹性问题。\n\n而且最要命的是：它都已经涨那么多了，谁来给你接盘呢？ 所以我为什么老关心一个行业、一只股票的筹码结构？你都涨那么多了，谁还给你接盘？都让你们赚钱，那不就成确定赢家的游戏了吗？那我进来把你们都抬出去，最后钱是谁输的？\n\n筹码结构一旦恶化，你基本面再好也不容易涨——不是说绝对不涨，散户有时也能把价格推高，但概率上、确定性上不足。散户能形成合力吗？人人都想着\"别人来推我、我好把高价卖给他\"，那能形成合力吗？我说我关心筹码结构，有人就抬杠说\"你不关心基本面\"——基本面对我来说早就研究完了，我才去关注筹码。基本面我都不懂（比如科技股），我压根不研究，那我研究筹码有什么用？\n\n我早就告诉你我已经不看空有色金属了，我只是说不看空。但对于我来说现在还没有介入，是因为我认为它的筹码结构还很恶化。你一想到进去全是这帮人跟你当邻居、当同一个战壕的战友，你说这公司怎么涨？一出来说话就是骂骂咧咧的这些人，他们怎么赚钱？你看意见领袖下面动不动一千条回复，这跟天地会、跟宗教有啥区别？\n\n我最怕的就是某一只股票里出现一个意见领袖，然后下面一大堆唱客的人。 如果有一天我在某只股票里说一件事，下面全是这种一千多人的回复，我立马就把它卖了，一天都不留。当炒股票炒成信仰的时候，那就是输家的表征。你跟输家站一块不一定输，但输的概率非常高。\n\n## 十五、我不空仓，也不融资\n\n有人问我什么时候再融资——那得等，我现在还待在山坡上呢，小车还没推，我着急啥融资？\n\n有人问那你为啥不空仓？我不能空仓，我持有的标的我自己心里有数。如果你们实在选不好，空仓也不见得不好，说不定能战胜大部分人，但我不赞成空仓。因为你空仓就面临另外一个风险：万一这种情况不发生呢？所有的东西都得做两手准备，这个市场不是非此即彼的游戏，它是个概率游戏。\n\n我现在只能做到不融资。按我对风险的要求，其实应该再降低一点仓位，但我对自己的持仓太有信心了，所以不舍得降。空仓就是不玩了、离开市场，离开市场还谈啥防风险？\n\n买债券也可以，但债券收益率太低了，收益率低也是风险之一，你不是防风险就一定要防，两个方向的风险都要防。现在国债收益率都非常非常低。现在存在低估值股票的唯一地方就是A股，全世界都没有了。现在比九二四的时候低得都很多了，你怎么还能说没有低估值股票？尤其是A股最近的科技牛把资金虹吸了之后，真正优质的公司估值更低了。\n\n港股不是跟美股一样吗？港股现在不也得加息吗？港币是跟美元联系汇率的，它的宽松和紧缩是跟着美元走的，那在港币紧缩的时候，你认为港股能有多大机会？\n\n## 十六、外资买核心资产，这一幕2013年上演过\n\n现在A股有很多低估的、而且是核心资产的优质公司，这些公司未来一定会吸引流入A股的外资，这是必然的。这就像当年二零一三、一四年之前，茅台高端白酒吸引外资是一样的——当年也是外资先买的茅台和五粮液。零八年过来最初都买\"五朵金花\"、买周期股，谁买消费啊？没人买消费，消费股就是外资买起来的。这个局面在今天又开始重复了。\n\n你以为上一次一三年之前外资买茅台、买消费的时候，我们内资在干啥？我们内资还在钢铁、煤炭、房地产里头玩呢。等茅台起来了，他们往茅台卖了的时候，又开始买科技。当年谁买科技啊？都买茅台白马，\"值得一辈子拥有的五十支股票\"都玩这个呢。等科技起来的时候，他们开始买科技了，人家外资开始买核心资产了。\n\n国内的机构投资者，尤其是公募基金，是一类非常不成熟的存在。为什么？发展时间太短，没有沉淀足够文化。这不仅是代理人风险的问题，还涉及到这些人确确实实就没这个水平——他不是有多坏，他就是挺蠢的。\n\n我给你们讲过一个故事：原本我们发展公募基金，是因为在没有公募基金的时候，我们内资对抗外资是一片损伤，内资全是散户，而外资全是机构、全是正规军。你怎么和正规军对抗呢？ 所以需要发展机构投资、发展公募基金，这是初衷。但公募基金发展起来以后我发现，我们的公募基金属于\"黄协军\"——它并没有代表老百姓去和外资的正规军对抗，而是和外资正规军合在一块儿欺负老百姓，变成伪军了。这个比喻我五年前说的时候还在抱团茅台五粮液、还没抱团\"易中天\"。\n\n这个行业需要成长，这需要时间。但问题是在成长的过程中，他付出的代价为什么要你来承担？ 你应该想的是这件事——你得看清形势，减少自己买单的可能性。谁愿意买谁买，我管不了，我只能管我自己。最主要的是我不能成为输家。输家往里冲的时候，我就往后撤一撤。你现在不要认为机构都买了就如何如何，机构套得惨的多了，套在茅台里的还有的是。\n\n## 十七、加息一定能治理通胀，因为它管的是需求端\n\n现在有一个特别奇怪的说法：\"加息根本治理不了通胀。\" 加息一定能治理通胀。不论什么原因引起的通胀，加息都能治理。我昨天写的帖子又上了热门第一——我在雪球上，我只要想上我就能上。\n\n为什么？因为所有的通胀都是货币现象，这是弗里德曼说的，芝加哥学派。我平常不愿意说这些东西，是因为这些东西没有意义，但不代表我不懂。\n\n如果是由供给冲击造成的通胀，加息的结果是使需求缩减，它一样可以治理通胀。但问题在于你在经济没有过热的时候，需求原本就少，你通过加息再把需求打压没了，那就说明你的经济进入了萧条——萧条也能治理通胀，只不过代价非常大。\n\n如果是由经济过热导致需求增加引发的通胀，这时候加息的后果就比较良性，它可以使经济热度降下来、需求减少，在同样供给的情况下供给就充足了，经济变成温和良性的发展。但无论哪种情况，加息治理通胀压根管的不是供给，它管的是需求端。\n\n所以\"加息加不出一百万吨铜\"这不胡扯吗？它当然加不出铜，它不管供给，但它可以把你的需求给你加没了。你说现在铜缺口一百万吨，是因为需求太多，我加息给你把需求加没了，你马上就过剩。这道理稍微学过一点经济学的人都不用说，沃什不知道加息加不出铜吗？\n\n而且我告诉你：在全球发生通胀的时候，不仅仅能治理需求端、还能治理供给端的，就是我们。因为我们工具多、财政手段多。美国通胀一个很大的项是柴油，那如果在中国，让石油公司降价、开闸放水就行——我们根本不需要加息就能治理通胀。\n\n有人问美国还能制造衰退吗？我问你你说的美国是谁？谁要制造衰退？沃什根本不管这事儿，衰退不衰退跟我屁关系，我就治理通胀——就业率目前充分、通胀还很高，我就加息；加到有一天通胀率没降下来但失业率太高了，那我也就只能不再加了，因为我有通胀和就业两个指标。如果失业率很高、通胀率还没降下来，那就是典型的滞涨，那他也不能再加了。他只能管他自己那一套。\n\n我最怕的不是别人说啥，我最怕的是别人说的这些东西把你们误导了。\n\n## 十八、顺手教你一个实用知识：沪伦比\n\n我现在考大家一个问题：你知道不知道铜价有个\"沪伦比\"？沪伦比就是沪铜主力合约和伦铜主力合约的比值。现在大概在七点五左右，昨天收盘大概七点五五。\n\n那我问你，这个比值从长远看由什么决定？这不很明显是由汇率决定的吗？那现在汇率是六点六九，为什么沪伦比是七点五呢？我告诉你：因为从伦敦买铜进口到中国，需要交百分之十三的增值税。这里我纠正一点：关税现在是零，没有关税，从保税区出来的铜没有关税，但需要交百分之十三的增值税。\n\n我再问你：昨天伦铜主力合约收盘价是一四五六二美元，你知道这个数折合人民币是多少吗？国内铜价现在快到十一万了，而伦铜折合人民币只有九万七。那洛阳钼业这样在海外卖铜的公司，卖给中国的价格是按哪个价？\n\n洛阳钼业是按伦铜的价格在卖——也就是说他们卖铜只能收到九万七，剩下的他得交税。你别看你国内现在十一万，进口那个渠道并没有打开。你从伦敦拉铜回来，交完增值税、再在上海市场卖掉还能赚钱的时候，就会有套利的人从伦敦拉铜往中国运；反过来，如果国内铜价过高了，中国的铜出去加上外国收的税比伦铜还高，那就可以往外拿。\n\n沪伦比这个中枢是由汇率来决定的，它是在汇率上下波动的。 那么随着人民币升值，未来就会出现一个局面：伦铜涨得多，可能沪铜涨得少，因为你要考虑汇率的影响。我只给你讲个大概，你可千万别拿细节跟我抠——我追求的是安全边际。\n\n看个大框以后我要绝对追求安全边际，我不会去研究细节给自己增加信心。一眼定胖瘦，我看一眼知道他胖了、瘦了就行了；如果我需要去要秤、去称，那我干脆不买，我要回避。你要让我研究比如洛阳钼业一年采多少矿、采矿成本比别的矿商有什么优势，那我干脆都不买。我买的所有的东西都是一个行业处在上升期——哪个公司都会涨，我就买一个；如果这个行业不行、要在死里头掏个豆吃，那我干脆不买，我就不干那死里挑豆的事儿。\n\n这就是芒格说的：在一个到处是黄金块的黄金堆里面，你非要找一根黄金针。非要自己研究细节、把自己弄得特别苦，投资的逻辑都是相通的——这个行业要不行了，没有有优势的；行业行了，大家都赚钱，你根本没必要研究那么细。\n\n那前一段有色上涨的时候，你研究啥基本面啊？随便买一个哪个都涨，你基本面好还不一定涨得多呢。你抠着研究半天紫金矿业，你去年下半年到上半年，涨过云南铜业吗？涨过西部矿业吗？哪个不比你涨得多？白银有色我差一点买——所有股票都开始上涨的时候它一直没涨，那它就是个机会。基本面改善的时候大家都改善，你原来认为他亏损、给的价特别低，那他现在只要不亏了就行，所以他的弹性最好。这就像学渣——学霸老考第一，考第二就不行；学渣老考倒数第一，有一天考个倒数第二就行了。大A就爱学渣，但在周期股里，学渣最大的问题是你买完它容易退市，所以不能轻易买。我是拿这事儿说事儿而已。\n\n我不反对买龙头，谁愿意买啥跟我没关系，我讲的只是我自己的道理。职业投资和业余投资的区别非常大，趋势投资和价值投资的区别也非常大，它们没有一个统一的标准。\n\n## 十九、职业投资与业余投资，是两种完全不同的活法\n\n职业投资者和业余投资者的区别非常非常大。\n\n先说分散。 分散是一种理念，是为了应付你的风险。而且要注意：有的人所谓的分散不是真分散——分散是指行业分散。你不是说他买有色，洛阳钼业、紫金矿业、云南铜业、西部矿业都买一点，这几个人都是联动的，你有啥分散呢？所谓分散投资是指行业分散，甚至不止行业，还包括顺周期、逆周期的分散——有的行业没有周期性，有的有一定周期性。你如果都买同一类股票，那就是同涨同跌，那叫啥分散？\n\n所以为什么我说：我给直系亲属的那些小账户做股票，收益率比我自己高？因为我给他们做的是集中，我自己的账户是要保持分散度的。他们的钱亏了对我没有影响——第一他们是我的直系亲属，我就能保证他们不亏；第二他们即使亏了对生活也没影响，而我不行。所以我自己就得分散，我给他们的就集中。他们的承担风险能力比我高。我给他们的投资，都是我持仓里确定性最高、弹性最好的，买完涨一段我就给他卖了，也不想挣太多，所以一年下来反倒比我的高——但这是因为没有发生风险事件。我永远得防止风险事件，他们永远不用防，所以他自然就高。\n\n他们是在按业余投资者的方式做，我的是按职业投资者的方式在做，明白这道理吗？不是说我不知道追求高收益，我也可以追求，但我自己的模式做不了那种模式。一个风险事件下来的时候，他们股票清零了都无所谓；我股票清零了，我就得上天台。我给他们做的股票，十二年都不止十二倍，只有我自己的是最低的。\n\n雪球论坛上、自媒体上给你讲的很多模式，都是业余投资的模式。 所以你总是看他那个收益率特别高，然后推导出他这种模式一定很成功——那是不对的。在职业投资人眼里，业余投资者这种模式实际上就是赌博。而且你们看到的都是业余投资者里的成功人士，他不成功的、不说话了，你就没看着。所有单调一支股票的人，最后你看到的都是成功的；没成功的那些，最后没影了，你没看着。\n\n职业投资者第一件事就是防风险，你要防止回撤。 我现在不挣钱也够了——我从现在开始一分钱不挣，也足够生存，而且生存得不错。但那可千万不能亏损，你花不了多少，可亏起来快得很。这就是职业投资人的想法。所以有人上我这儿来\"我跟你比一比收益率\"，我跟你考虑的问题就不一样——我压根没想赚钱，我现在不赔就足够了。\n\n\"鸡蛋放在一个篮子里\"这句话，误导性极强。 巴菲特说最好把鸡蛋放在一个篮子里，然后看好这个篮子。国内的很多半吊子价值投资者就学这句话，开始集中投资。但你要知道：巴菲特可以把鸡蛋放在一个篮子里然后看好篮子，是因为那个篮子是他自己准备的、他自己看的。你一个小散户，把鸡蛋放在一个篮子里，那个篮子根本不是你看的——是别人看的。而且这个篮子里还不完全是你的鸡蛋，还有很多其他人的鸡蛋，那些鸡蛋里还有臭鸡蛋，那个看篮子的可能把你的鸡蛋换成臭鸡蛋，甚至他晚上出去莺歌燕舞去了，明天你的鸡蛋都臭了。你压根不是看鸡蛋的，你放哪个篮子里，这鸡蛋也不归你自己啃，看鸡蛋这个人的水平高低、道德高低都不归你管，都是点子。\n\n你一个小散户，就那仨瓜俩枣三两个鸡蛋，你还去啃篮子，你算老几呀？那鸡蛋归你买，不归你吃。谁把所有的鸡蛋都放在一个篮子里然后看好它？楼下卖鸡蛋饼的老王两口子——人家天天在那卖煎饼果子，那叫看好篮子。你动不动跟巴菲特比？我要是巴菲特那么多钱，我买个上市公司，把所有的鸡蛋都放一个篮子里然后好好看着，我也能做到，然后我去经营去。这种似是而非的道理都是胡扯，都不动脑子。\n\n散户投资任何一个公司，都有很多偶然性风险，都非常大。你怎么能减少这种风险对你的打击呢？就是你要分散投资——这个公司不行了，你其他公司不至于一起都不行；这个公司有道德风险，那个公司可能没有。你说我全打一个公司，然后天天仔细研究？你散户研究基本面，你看的就是照片——你不就是看财务报表、看公司公开信息吗？那些信息都是人家想给你公开、想让你看的。这相当于你看着照片研究花朵，你连真花都没看过，你能成为研究花朵的专家吗？散户研究基本面，就是研究个大概，你还真觉得自己成专家了？公司里明天有个人掏空上市公司，你马上就玩完。\n\n所以你要保证足够的分散。 我说的是你想做职业投资者；你要是业余投资者都无所谓，你亏了也无所谓，而且业余投资者的钱一般比较少，不会把全部身家都放在股票上，收入也不全来自这儿，那你就是赌一把、跟买彩票一样，你愿意集中投资也无所谓。\n\n职业投资和业余投资并不代表水平的高低，代表的是稳定性。 我给大家讲过高尔夫球：所有的业余球手，可能一生当中都打过一杆进洞，某一杆打得比职业选手好，但时间一长下来，你就是打不过职业选手。投资有很大的偶然性，你说你单调一只股票现在赚了很多钱，那不一定说明你能成为职业投资。\n\n还有一点差别：个人投资者做得很成功，去转做基金也不行，那差别更大，都需要不同的本事。就像做基金的做得特别成功，他作为个人投资者是不是一定成功？可不好说。反过来，个人投资者成功了，你像那样做一个很牛的私募基金，你也做不了。\n\n作为业余投资者，千万别把全部身家投进去。 你把所有的钱都投到股票里，最后的结果就是你工作也干不好、投资也干不好。投资是需要非常专注的，你只要是职业的，就得把所有精力都放在这事儿上，不能受任何东西影响。我举一个最简单的例子：当年律师可以做兼职律师的时候，我就意识到这个问题了。我最初当大学老师的时候可以做兼职律师，也做了一段，后来我发现不行——大家都说大学老师不坐班、当律师不影响，影响非常大。你同时干两件事和干一件事，效果完全不一样。人的精力是有限的。不管多牛的大学老师，他做兼职律师只有两个结果：要么最后辞职做专职律师，要么兼职律师也做不了。他需要的是不一样的本领。\n\n什么水平可以从业余转职业？你能获得稳定的盈利，能用这个稳定的盈利支付你的生活开支，你就可以做职业投资人；但如果你做不到，就最好别做。这还和天性有关。像我这种，哪怕让我收入降低一点——我最初从律师转职业投资人的时候，生活水平和收入水平都是下降的。当然现在我又比做职业律师（我的一些同事）高了，如果我现在还做律师，也挣不到现在股市上的这个收入。但刚开始的时候不行。道理很简单：做律师没有复利效应，你是靠劳动挣钱，挣得多就得干得多；但作为职业投资人，你的收入增加十倍，你干活还是那么多，只不过是钱多了而已。\n\n所以想做职业投资人，都很慎重——涉及到你自己的性格、承受亏损的心理能力、还有你的投资模式是否可以经过长时间验证有稳定的盈利。虽然我给大家讲的是职业投资人的方式，但我不建议你们轻易去做这件事。\n\n什么性格适合做职业投资人？第一，不从众；第二，耐得住寂寞；第三，有足够的耐心。然后你需要大量地学习、阅读，有对多种知识的领悟能力。第一\"不从众\"是最重要的一件事——别人说什么你千万不能跟着跑，你必须性格里得带这个。别人一说啥你就跟着跑了，你就不适合做投资。第二，做职业投资人是非常非常寂寞的，我为什么天天跟你们聊天？因为这其实是一个非常寂寞的行业，没啥意思。这就取决于你自己的性格，像我喜歡独处，那就无所谓，我一个人也能过一天，一天不下楼、两天不下楼都无所谓。\n\n然后你给自己一个时间验证：比如十五年，这十五年是不是保证每年都能稳定盈利。还都是第一步。真正做一个优秀的职业投资人是两个标准：第一，不要让每一个年度出现亏损；第二，每一年都争取跑过指数——大盘下跌的时候你能保证不亏，大盘上涨的时候你能保证比大盘涨得多，这个时候你才可以说我是一个职业投资人。否则大盘涨你也涨、大盘跌你也跌，那你做不了职业投资。\n\n不从众有一部分是先天的，但也有一部分是知识方面的欠缺导致的，会在学习过程中改掉，但还有一部分人天生就容易从众。我个人性格是先天就不容易从众——不管你说啥，我得先想明白这件事，我要想不明白，就不轻易跟着你跑，我从小就这样。\n\n有人问我做职业投资人的年化大概是多少？我说过八百遍了：超过百分之二十，十二年十二倍，大概就这么个数，去掉开支以后。有人问\"分散太散也不行吧\"——分散是一种理念，多少叫太散？还有人说\"我有色涨了，洛阳钼业、紫金矿业、云南铜业、西部矿业都买一点\"，那叫啥分散？他这几个人都是联动的。\n\n## 二十、人民币升值：这一盘大棋的来龙去脉\n\n好，讲人民币升值。\n\n人民币这些年的汇率没有反映真实的购买力，所以我们一直有升值压力。 主要原因是什么？二零二零年之后，由于美国和其他国家都采取了极度宽松的货币政策，导致他们出现大幅度通胀，但我们的汇率没有发生很大变化。这说明啥？说明美元、日元、欧元的购买力在下降——它通胀了，买同样的东西需要更多货币，就是它的货币贬值了。而人民币这些年不但没有通胀，还稍微有一点点通缩，所以现在人民币的购买力比二零二零年相对来说还高一点点。而其他所有货币和二零二零年相比，贬值幅度都很大，累计看贬值幅度都超过百分之三十了。那你还是原来的汇率水平，就相当于没有反映真实购买力。\n\n所以现在就出现一个局面：人民币购买力被低估了。这不公平——你购买力被低估成这样，你出口到我这儿的东西太便宜了，你这么低的成本转换成美元卖到我这儿，不冲击我的产业吗？所以现在全世界都要求你人民币必须升值，要不然贸易就不平衡了。你看我们的贸易顺差这些年一直在增加，所以说要求你升值是有道理的。这就是我们升值压力的由来。\n\n但问题在于：如果我们现在快速升值，那对我们这些出口导向型的企业是巨大冲击。 所以这个东西不可能马上就做到。那怎么办呢？我们就用一些人为的手段干预，所以人民币升值就升不了。\n\n而且最主要的还不是这个，最主要的是：我们提出双循环之后，这些年实际上已经做好了很多关于内循环的准备，也就是我们现在对外贸的依赖度在逐渐下降。 你如果现在的外贸依赖度还像二零二零年、甚至二零一八年以前那么高，那人民币升值你是受不了的。那怎么解决这个问题？第一，先提出双循环，扩大内需；双循环以我为主建立起来以后，外贸依存度开始下降——GDP 三驾马车里，出口所占比重的逐年下降，下降了以后我再升值，外贸部分受冲击对整体 GDP 的冲击就减小。所以这个时候你才开始有序地放开，让它逐渐升值。\n\n但我们依然在控制它升值的速度。 所以你看出它是缓缓地升值——从七点三，现在已经升到六点七，昨天已经破了六点七。这就是通过升值这种模式，逐步反映出真实的人民币购买力。同时也就带来一个局面：你出口的成本开始增加，进口的成本在下降。所以如果是低端的、比如服装鞋帽玩具这些生活用品，你在国外的竞争力就是在边际上下降，这就是升值的问题。\n\n但一旦开始升值、成为政策上允许的升值区间，那老外那些热钱、活跃资本的嗅觉是非常灵敏的。 一旦中国决定开始允许人民币升值，对于这些热钱来说就有巨大的套利空间——因为它现在进来、以后出去，就赚了一个升值的利差。\n\n人民币升值和黄金升值对美元的持有人来说没有啥区别，只是幅度可能不一样。我买成黄金也是赌升值，买成人民币也是赌升值。但问题在于买人民币有一个好处：一旦你买成人民币进入中国国内市场，你还可以享受人民币资产——升值必然带来人民币资产的重估，你就还享受了人民币资产升值的好处。所以它是一个双击：一方面汇率升值，一方面由汇率升值导致的中国资本市场升值。这个优势你也会享受到。所以说热钱为什么热衷于进中国？因为从国际形势上说，人民币所面临的升值压力已经无解了——如果一旦中美关系、贸易缓和，升值是不可避免的。\n\n## 二十一、人民币升值：日本的教训与矿业公司的汇兑损失\n\n这就跟当年日本升值是一个道理。 当年广场协议之后日元升值，也是一大堆套利资本进来。但问题在于日本是门户大开的，这些资本可以随便往里进，所以一旦放开升值，它升值就会非常快。为什么？这就是一个正反馈的循环：你放开升值了，那我现在就开始买日元，越买越升值、越快、买的人越多，瞬间就把日元推上去，然后日本国内的房地产、股票市场一下就冲天了，资产泡沫就产生了。然后日本央行一看不行，快速加息迅速把泡沫摁下去，摁下去就完了，日本就进入到泡沫破裂以后那个\"逝去的三十年\"。就是这么来的。\n\n那么中国现在需要防止的是：外国热钱流入速度过快。 你不能不让人进，但你不能过快，你得控制速度。这东西都是时间换空间的——人民币升值也是一样，缓慢升值，比如我可控的一年升百分之五或百分之十，年年百分之五、百分之十，这个中国能做到，因为我们的人民币对美元并不是自由流动的，我们在资本项下并不是自由流动的，所以能控制。当年日本控制不了，另外一个他的货币主权也不独立。\n\n有人说日本疯狂印钞——你别逗了，日本印的钞票都变成了商品，就是货币商品化了。由于它国际资本流动控制不了，你日本印多少钞票都没用，你印完就被人买走了，而且最主要是买走了他还囤积起来了。所以现在可怕的就是这些被囤积起来的日元，随着日元加息，这些囤积在海外的日元将会回流日本。\n\n所以你会看到一个现象：日本越加息，国内的通胀越严重，而且它的汇率越贬值。这是因为他以前印的钞票太多了，但这些钞票没在国内起作用，现在一加息起作用了——不是加息起作用，是加息导致原来印的钞票起作用了。\n\n所以你会发现未来会出现一个非常有意思的局面：随着日元加息，它的汇率是越来越贬的。 但在日元回流日本的过程当中，就会导致另外一个问题：美国的流动性和东南亚的流动性被抽离。因为美国和东南亚的流动性有一大部分是靠日元来支撑的——这些囤积的日元当年都是用来作为抵押品，到美国去贷款、去投资美国股市、去投资美国国债。\n\n有人说高市早苗支持不支持加息——你就不懂这个道理。高市早苗的意识和安倍晋三一样，是要放任，不是加与不加的问题，是必须要允许这种情况出现。要不然你加息又治理不了通胀，有啥意义？你反倒提高了工商业的成本。\n\n加息虽然治理不了通胀，但它会提高工商业成本，一定要明白这道理。 今天美国加息也好、日本加息也好，对工商业的影响，这个实质影响还没有显现呢，你现在还看不出来。现在一大堆人开始操作\"加息没用了\"，那是因为加息以后需要时间积累——成本是怎么来的？成本不是利率乘以时间吗？你不得随着时间的流逝，在高利率下才能积累成本吗？你把利率提高了，成本马上就提高吗？你不得经过利率提高以后，一年增加多少、两年增加多少、三年增加多少，随着时间逐渐增加吗？\n\n所以人民币升值是一个长期的——它不是一点儿。而且人民币升值就会导致中国的核心资产继续重新估值，它会上升的。 因为人民币升值以后，我们进口的产品就会变便宜，所有工商业的成本都会变低。\n\n我告诉你，人民币升值最不利的东西就是原材料，尤其是国外生产的原材料。 你人民币进口的东西变便宜了嘛——你用铜的人合算了，你生产铜的人就不合算，这不道理很简单吗？你用铜的合算了，因为人民币升值以后你买国外的铜就便宜了，企业成本就下降了，成本下降就预示着你的利润空间被打开，那么你的核心资产估值就会重估。\n\n但在这个过程中牺牲的是谁？就是矿厂在国外的、这种原材料的供应商。 它就有可能受到人民币升值的打压，其表现就是它在利润表上会有一个汇兑损失项。你这个矿藏在国外、定价是国际定价，它本身对国外经济周期的依赖度就很高，这就是你现在要回避的东西。随着加息，黄金、铜开始降价，或者起码说不再快速上涨了，那你这种矿业本身就受影响——你原来认为它还能继续涨，它现在不涨了；不光是不涨了，现在人民币还升值了，你还出现汇兑损失。大家明白不明白？所以这就是个双重打击。\n\n所以你可以看一看：为什么这两天铜、铝涨这么多，矿的股价却不涨？它们有单独的逻辑。矿业涨价受很多东西影响，不代表矿业涨价就一定好。比如美国现在铜涨价，那是因为他要加关税、要把自己的铜价涨上去，唯一和你传导的是说在涨价过程中有人囤铜，会吸收国际上的囤积需求，所以全世界铜价也跟着涨。但这个囤积是有限度的——它不能再囤了，有两个原因。\n\n第一，你现在仓库已经不够用了。 现在美国存的铜已经足够了，八九十万吨、七八十万吨——Comex 库存两年前只有两万多吨，现在是七十万吨，库存已经不够了。第二，随着加息的周期，那个加关税的决定本月底、就是九月底就定了——加就是加，不加就是不加。你要不加的话，囤这些东西就都得回到市场里面。\n\n有人说\"最近巴黎的麦子运到美国，怎么还拉回来\"——他不用拉回来，美国不买不就完了吗？美国这一块需求你不就没了吗？它是个动态的，每天都在生产、每天都在消耗。你现在囤腾的美国不就地消耗就完事了，那美国这块需求没了，对世界需求没有影响吗？这不是个动态的影响吗？你包括前一阶段说荷兰、法国把黄金运回，那些描述都不对——荷兰和法国在美国的黄金就是就地卖了，然后在伦敦重新买。谁会把黄金从美国运过来？那是专门有矿商天天在做这件事。黄金的囤积也是一个动态的东西，只有在不平衡的时候才会两边运去套利。\n\n所以你要知道：人民币升值对这些矿厂在国外的矿产公司，包括洛阳钼业、包括紫金矿业，它会出现一个叫\"汇兑损失\"的东西，随着人民币升值，它的汇兑损失会越来越大。而且最终的汇兑损失不只是产品——你最后买了矿都得重新计价。你现在账上的矿是按美元计价的，如果人民币升值过高，你这个固定资产的计价模式都已经不对了。当然那对实际没啥影响，但它就像商誉计提减值似的，到时候计提减值，资产负债表上能看出来，最后会导致资产减值。如果真要升到百分之五，那你所有固定资产都得计提减值——你原来在国外的东西都是按美元计价的，财务报表反映到中国时要折算成人民币，折算成人民币就少了，少了以后你不得减值吗？\n\n但它也有一个好处：有一些公司在国外有美元债，这些公司就占便宜——比如航空公司就占便宜。 你人民币升值以后，你的美元债务就计提贬值了，你的负债就少了，利润就增加了，资产就多了。\n\n所有的进口都会变便宜，这就导致我们生产成本下降；生产成本下降，就会导致整个资产市场重估。 那么随着人民币本币升值，就必然迎来资产价值的重估，所以就会迎来股市的一个长牛。升值周期一定是有一个估值长牛的，你的估值中枢会抬升。甚至包括房地产都有可能在这个过程中受益——国外的资金进来，除了买股票，还有一个选择是买房地产、买固定资产。当然他不会买住宅，他可以买商业楼宇，而且他赌的根本不是你房子涨价，他赌的是人民币升值，明白不明白这道理？\n\n那你要投资的东西就是以内需为主、和国际大环境不联动或联动不明显的，这些东西你都会受益。 联动也不见得就不受益，但你受益的弹性就没这么大。所以你最好是：第一，基本面上和国际市场没有联动；第二，没有相应的美国对标公司。这都是你未来好的投资方向。但有些东西没等你明白过来，人家就先瞅上天了；等你再明白过来，你又成接盘侠了。\n\n有人问\"地产股会不会升值\"——地产涨价跟地产股没有关系。你现在地产涨价是存量地产，住建部刚开完会不告诉你了吗，地产也已经进入到存量时代。房地产再升值不代表房地产开发商股票就能涨——你没有开发量。你现在升值是由于控制供给造成的：政府不给你供地了，开发增量降下来了，那你房地产开发商靠啥赚钱呢？换句话说，明天所有的房地产开发商都黄了，房子马上就涨价，明白不明白这道理？\n\n所以你要理解：不能简单理解成\"矿涨价矿商就一定受益\"。 有的时候矿涨价是因为禁止开采——像前一阶段碳酸锂涨价，不就是因为不让生产了吗？那不让生产那家，不是最倒霉的吗？他能受益于碳酸锂涨价吗？ 这就像养猪的都盼疫情，疫情一来猪都涨价——那疫情来了谁死你知道吗？你买的那家正好是死了那家呢？\n\n比如现在的石油，涨价是因为沙特的原油运不出来，那所有油田都受益吗？沙特就是受损的。 你把这些东西都要想到底层逻辑，别别人说啥是啥。不是说某一个东西涨价了，生产这个东西的所有生产商就都受益——他正是因为有人受损，他才涨这价。\n\n所以你要分析：别看到昨天铜油大涨，就觉得铜矿商一定涨——昨天美国铜矿商就没怎么涨价。人家各有各的判断逻辑。你不要以为买铜矿的人是按铜矿价格来判断投资价值——当年他们买紫金矿业的时候，铜矿价格还很低、黄金价格还很低，人家是对未来的预期。等你知道价格高了，那这些还有啥优势呢？人家就卖了。这一桌子菜，就等你来买单呢——什么铜矿涨价、什么供不应求、什么没有大矿开采，这些消息都是给你准备的，就等你来发现这件事。你一买人家就走了，这游戏就完了。\n\n什么叫博弈？市场上决定你这个东西卖多少钱的，本身就是博弈。 你说\"市盈率便宜了\"——银行常年五倍市盈率，你告诉我哪个便宜？二零二一年中远海控多少市盈率？三四倍，那咋了？从二一年到现在五年它都没涨，刚刚才回到二一年。你告诉我啥叫便宜、啥叫贵？所有这一轮\"贵也好便宜也好、供不应求也好、矿涨价也好\"，都是为了博弈、都是为了实现低买高卖，剩下的这些都是抹布，都是外表的装饰。就是为了低买高卖——人家低位早就买进去了，然后敲锣打鼓等你来；你一进来、你一发现这事，就完事儿了。\n\n你不信就看着：这些股票高位震荡，你看它多长时间没涨了。我现在为什么说我已经不看空有色了？因为这些东西都在高位横盘。高位横盘有两种可能：一种是他还在出货，还有一种是他重新开始吸货，都有可能，我一点也不排除。但如果他重新吸货，一个表现就是股东人数会重新减少——因为原来已经增加了嘛，我们看中报的时候增加已经很多了。股东人数下降，就变成啥了？全是机构持有。机构持有最简单的验证方法就是：你那个论坛马上冷清下来——机构谁没事天天在雪球论坛上发言、天天跟你斗斗争呢？\n\n你这个时候再捅马蜂窝，就没有多少马蜂出来了，明白不？但我这次捅的效果不理想，我觉得还不行，马蜂还是太多。我前几天认为有一个股票马蜂已经减少了，但我今天一捅还是不行。你看他们一捅完了全骂骂咧咧的，这说明筹码结构还是恶化。就这骂骂咧咧的人，大部分都没怎么挣钱，而且都是高位买进去的。高位买进去的人有个特点：战战兢兢、如履薄冰、如临深渊，稍微有一点风吹草动他都受不了。他这个恐惧心理，你隔着屏幕都能听出来。他为啥骂你？他害怕，你知道吗。你如果是三块钱买的，就没人害怕，你说啥他都不理你，他嘲笑你，嘴角挂个一笑就走了——谁理你这事儿啊。\n\n## 二十二、收官：所有消息都是给你准备的\n\n（关于美股）我对美股不了解，最主要是我最不懂英语。我不买美股，我认为 A 股足够我投资了，二零二零年我投资 A 股也一样赚钱。我不懂英语，怎么投资美股啊？ 所以你们有很多人投资美股还研究基本面，我都不知道你咋研究的。\n\n这些年有个玩笑说：在纳斯达克都不能练技术，因为买进去就不用动了、永远涨。我跟你讲，当这么多人说这件事的时候，就说明已经快到收割的时候了。现在中国很多小散对美股有一种迷一样的崇拜。你稍微看一点美国股市的历史就知道，它根本不是这样，惨烈程度比中国还厉害。A 股下跌还有人救，美股下跌没有人来救。这几年美股是非常特殊的——自从金融危机以后，因为金融危机会出现流动性危机，必然得救；大部分时候美国股市波动是没有人救的。而且美国股市的波动不像 A 股一次跌到底：一九八七年十月份，美股一天跌了道琼斯指数百分之二十三，一天跌百分之五十的股票一抓一大把。你去看美国股市的历史——《伟大的博弈》《华尔街五十年》，这些书多了，它给你讲得清清楚楚，博弈的过程、历次的牛市熊市怎么产生、怎么结束。\n\n所以大家知道，人民币一定会升值，而且最近这两天升值可能还会快一点，因为中美关系的贸易缓和这事儿是个大事儿。你别看周一——美国昨天晚上芯片股涨，周一的芯片股会跌的，你看前两天芯片股已经跌过一次了，那些自主可控、可替代的芯片股都跌成啥样了？那就是在美股大涨那天，A 股的芯片股在大跌，那就是有人已经知道消息了。那绝不是因为某一只股票要解禁——人们都是用一个你能理解的消息，去掩盖一个真实的消息。\n\n你动动脑子想一想：那个芯片股的解禁，是解禁那天你才知道的吗？有谁会在解禁那天才开始卖呢？那他之前为什么不跌、非得解禁那天跌？谁会傻到等到解禁那天才卖呢？解禁不是为了卖，是为了让你买。这是一个表面的消息，很多手段都是这样的：给你卖个破绽，你以为你牛了，然后你就自作聪明了，说这事儿咱无所谓，然后你就冲进去了，然后就被套住了，然后你才知道真实的事儿是咋回事。变魔术都是这么玩的——给你卖个破绽，你净盯着那个破绽，真事儿底下那个手就开始下手了。\n\n你忘了那些\"先告诉你个谣言，然后给你砸个跌停，第二天一辟谣拉起来\"的出货法了？辟谣那一天砸个跌停，出一大堆货——谣言出来那天砸个跌停出了一大堆货，第二天一辟谣稍微拉一点，你一想\"可明白了，这是假的，我这回买进去可占便宜了\"，人家就靠这个时候出货，这才是出货的时候。你以为人家是谣言那天出货？不是，是辟谣那天出。因为这个下跌的真实原因不是这个原因，是为了用这个把你的目光都吸引过去。\n\n所以我告诉你们：你的科技股在最高点的时候根本不危险，危险的是它下跌百分之五十、第一个腰斩的时候。你在高点的时候肯定不会买，那个时候他也没想卖——他拉那个高点，是给你看的，为了起到心理锚定的作用。你未来估值靠啥估值？这就跟卖家讨价还价一样，上来先要个绝高价，然后再给你降个价，你就觉得便宜了——其实人家就想这个价卖你，明白不？你去买衣服，\"多少钱？\"\"五百\"——其实他就想二百五卖你。\n\n科技股的道理都一样，所有股票都一样：先给你拉个高点，这个高点不是为了卖货，是为了给你看；然后你心里就锚定在这个点上了。然后一点一点跌，跌到三十五给你拉到四十五，再跌到三十的时候你就来劲儿了，就开始\"砸锅卖铁往里冲\"了——这时候人就开始都卖给你了。要不然他怎么卖呀？他那么多货能出去吗？对于机构来说价格根本不重要，重要的是成交量、是买盘。那你怎么能吸引足够的买盘呢？你得利用买家的心理。淘宝上\"六一八\"都是这么玩的——先给你提价，然后六一八打个五折，你就觉得占便宜了。这世界就没有新鲜事，都是这点事儿。\n\n好，我到四个小时了，今天算是完成一次完播。谢谢大家，我下播了。\n\n（合规声明）我所讲的一切都是虚构的、都是评书，不能用来指导投资。所有我涉及的个股，都不代表我自己看好或看空，你别给我加戏。你们所有的买卖都得自己负责，我不披露持仓——你在评论区里看到的东西都是假的，不代表我个人，我说的所有股票都不代表我有或者没有。 你们自己弄的那个文字总结稿，别到处乱发，行不行？你天天让我挨着骂，那总结倒挺好，你也别到处乱发，一天天惹祸玩。好了，关播，谢谢大家这四个小时的陪伴。","toc":["一、开场：孩子的事，该放手时就得放手","二、不推荐股票，也不披露持仓","三、\"捅马蜂窝\"：我用黑名单做草根调研","四、谁都在评论美联储加息，这是最坏的局面","五、加息是认真的：全球共振，日本才是最大变量","六、说我\"轱辘话\"的人，其实一个字都没听懂","七、你说的那个\"美国\"，到底是哪一个","八、中美关系正在缓和，证据不止一条","九、心理层面的影响已经结束，实质影响才刚开始","十、鲍威尔的失误，与中国防疫三年的另一层作用","十一、这是一场注定有输家的游戏，先保证自己不当输家","十二、全世界在收紧，只有我们在宽松","十三、账期治理的真意：不是救中小企业，是为推升通胀","十四、外资进来会买什么：不联动、无对标的核心资产","十五、我不空仓，也不融资","十六、外资买核心资产，这一幕2013年上演过","十七、加息一定能治理通胀，因为它管的是需求端","十八、顺手教你一个实用知识：沪伦比","十九、职业投资与业余投资，是两种完全不同的活法","二十、人民币升值：这一盘大棋的来龙去脉","二十一、人民币升值：日本的教训与矿业公司的汇兑损失","二十二、收官：所有消息都是给你准备的"],"url":"https://www.bilibili.com/opus/1249646624898023430","bv":"","minutes":0,"chars":23340},"ai":{"title":"老木匠·2026年9月19日：加息的传导与筹码的哲学","text":"## 一、「义和团式」分析加息：为什么「敢不敢」「怂不怂」都是外行话\n\n1. 这是一个专业问题，不是一个情绪问题\n\n他很不满雪球上一种流行的讨论方式——很多人根本不懂中央银行怎么运作、货币怎么创造、利率这种价格工具最后怎么传导，却动不动就用「敢不敢」「怂不怂」「贵不贵」这类情绪化的词去评价美联储加息，\n\n你这个东西你不能用这东西来考量这个问题，这压根儿就跟这事儿没有关系。\n\n他打了个比方：这就像拿到一张核磁共振片子，内行一眼能看出哪里长了瘤、是良性还是恶性，外行看半天只会说「这也挺好，肝也有胃也有」——不是片子没有信息，是你没有解读信息的知识储备。\n\n2. 加息如果不重要，当年那场任命之争图什么\n\n他反问：如果加不加息真的无所谓，为什么当年美联储主席的提名会争夺得那么激烈，特朗普不惜安插亲信、甚至动用刑事手段调查鲍威尔来打压他？这恰恰说明货币政策的松紧对宏观经济的影响是巨大的——只是轮到中国讨论这件事的时候，很多人却觉得加不加息都无所谓，这才是自欺欺人。\n\n3. 全世界都在紧盯的东西，我们却觉得不重要\n\n他提到格林斯潘时代的一个典故：当年大家会去看格林斯潘开会时随身带的公文包是鼓的还是瘪的，来猜测他是要加息还是放水——今天全世界同样紧盯着点阵图、沃什的每一句发言、记者会上的每一个表情。这些东西被认真研究，恰恰因为它们真的重要。\n\n4. 为什么有人一有点小成绩就觉得自己什么都懂\n\n他观察到一个现象：很多人只是在某一只股票上赚到了钱，就觉得自己什么都懂了、不用再学习了。他拿巴菲特和芒格做对照——两人一辈子在投资上取得了巨大成功，却依然每天坚持学习，始终保持谦逊。\n\n## 二、美联储加息是为了「卖美国国债」？这个说法从哪来的\n\n他专门点出雪球上流传的一种说法——美联储加息是为了卖国债、为了增强美国的货币信用，从而让大家愿意继续买美债，说他到现在也想不明白这个结论是怎么推出来的。他给出的反驳很直接：\n\n买不买国债里面有很多很多的决定因素，它不仅仅是通胀这么一条。而且现在很明显，这一次加息并不能把通胀压回去——你看昨天晚上美国国债期货五年期、十年期、三十年期都是下跌的，三十年期跌幅还很大，比特币也涨到八万，这些都是通胀预期压不下去的表现。\n\n他给了一个明确的判断：既然通胀压不下去，接下来的路径要么是继续加息、要么是认输，而根据美国国内利益集团博弈的结果，他判断沃什会把加息进行到底。\n\n## 三、日本这次的加息，才是真正的大变量\n\n1. 以前的加息潮从来没有日本参与\n\n他提醒大家，以往历次全球加息周期，日本从来不参与，利率一直维持在零附近；而这一次是美日欧三方共振，日本是这次最大的变量，这一点很多人根本没意识到。\n\n2. 投反对票的两个人，代表着高市早苗\n\n他说自己上一次直播、日本还没加息的时候就提前判断高市早苗不同意加息，这次日本央行投票里有两票反对，正是高市早苗任命的人投的——她是安倍经济学的拥趸，如果由她说了算，会选择放任日元贬值、放任通胀，这正是安倍经济学的既定路线。至于十月份还会不会继续加息，他认为植田和男的表态依然偏硬，不能简单认为概率很低，这仍然是一个博弈过程。\n\n## 四、鲍威尔的失败：一次误判引出了今天的连锁反应\n\n他回顾了2021年那次关键的判断失误：当时美国通胀抬头，很多人认为该加息，但鲍威尔判断这是供给冲击造成的暂时现象——疫情导致码头工人短缺，中国生产的货物堆在港口没人分拣，只要供给恢复就能压下通胀，所以他没有加息。他认为这个判断的根子在于没有看清一个时代性的转变：中国那时已经明确提出双循环，不再愿意无限量给美国生产廉价生活用品。\n\n他把这一点和后来中国坚持三年防疫连在一起看，给出了一个不算主流的解读——防疫客观上加速了两件事：一是那些提供廉价生活用品的小企业被迫开始转型；二是房地产正是从那时候开始停止无节制上涨的。他反问：如果没有防疫，经济一直热火朝天地运转，房价还会再涨几年，今天要如何收场这个更大的泡沫？\n\n## 五、财富不会消失，只是转移：一场确定输家的游戏\n\n他重申了之前讲过的框架：一次危机下来，受损的人钱确实没了，但财富本身不会凭空消失，只是转移到了别人手里——只是赢家现在还没露面，逻辑链条太长，你暂时看不出来。\n\n你现在需要做的是在确定输家的游戏里面，先别当输家，这个很容易做到。然后等赢家露面的时候，输家都死得差不多了，你推个小车下去捡就行了，根本不需要跑，因为没有人跟你争。\n\n## 六、边际变化决定价格：外资进A股，图的是什么\n\n1. 价格是被最后一笔成交决定的，不是被「全部人」决定的\n\n他解释了一个基础的经济学原理——边际变化才是决定价格的直接因素。你小区房子值多少钱，取决于最近一次成交的价格，不是所有人达成一致才算数；股票的收盘价，本质上也只是当天最后一笔成交的价格。所以不需要「全部外资都涌入」，哪怕只有5%的资金边际上转向中国，都足以让市场发生剧烈变化。\n\n2. 外资买中国股票，不是原因，是结果\n\n他强调因果关系不能搞反：不是因为外资买了，中国股市才涨；而是外资分析出中国没有跟着全世界一起收紧货币、利率没有提升，所以判断中国股市能维持甚至提升估值，才决定买入。买入行为会进一步推升估值，形成正反馈，但真正的上涨原因始终是货币环境本身足够宽松。\n\n3. 外资来了会买什么：没有国际对标、又不受基本面联动的东西最安全\n\n他给出一套具体的筛选逻辑：最应该规避的，一是基本面和国际市场联动的（比如国际定价的大宗商品，国外因为加息下跌，国内很难独善其身）；二是有国际对标公司的（比如某个国内消费品类，一旦国外同类公司因经济萧条估值上不去，国内同类估值也很难被撑起来）。反过来，完全在国内自成体系、找不到国际对标的品类，比如地方性的酒类品种，不受国际估值影响，故事最好讲。而对于真正的大资本来说，他们不会满足于炒这类小众题材，进来就直接买中国最核心、最安全、基本面和估值都不与国际联动的核心资产——这类标的未来二十年不容易破产，是外资的首选。\n\n4. 整体估值提升，不代表所有标的涨幅一样\n\n他提醒，即便A股整体估值随着这轮行情提升，也不代表随便一个标的都能跟着涨很多——这就是所谓的弹性问题。而他反复强调要关注筹码结构的原因也在这里：一个标的已经涨了很多、筹码结构变差（也就是说愿意接盘的优质资金越来越少），基本面再好也很难再有大涨，因为散户很难形成合力去继续把价格推高。\n\n## 七、人民币升值：不是我们主导的，是有人真的需要\n\n他解释了这一波人民币快速升值背后的机制：以前为了控制人民币升值节奏，会用金融手段抽干离岸人民币的流动性；现在没有再刻意控制，人民币自然升值，说明真实的市场需求在推动它——而这个需求来自想要进入A股投资的外资，他们需要先把美元换成人民币。他还提示大家去翻近年的官方通稿，能发现「金融市场进一步扩大开放」被反复提及，这是在为外资更顺畅地进入中国资本市场扫清制度障碍。\n\n## 八、反内卷的真正目的：治理通缩，不只是保就业\n\n1. 他先用「账期新规」举了个例子\n\n他提到近期一项治理大企业占用上下游中小供应商账期的新规——大厂占款不能超过60天，超期必须还款。他说很多人第一反应是这是在解决中小企业回款难、保就业，这没有错，但只是「第一层次思维」。\n\n2. 真正的机制：把无息占款变成有息负债，本身就能推升通胀\n\n他解释了更深一层的逻辑：大厂占用上游账期，本质上是拿到了一笔无息贷款，这让它们即便低价恶性竞争也依然有利润空间；一旦被要求按时还款，它们就得转向银行借贷，一旦要支付利息，成本就上升了，就不能再用原来的低价卖东西。他还补充了一层货币层面的效果：\n\n你在上游占用中小企业的货款，是直接的债权债务关系，没有货币创造；但你现在去银行借款，就参与了货币创造，等于增加了M2。\n\n他把这条政策的本质定性为反内卷，而反内卷的本质就是反通缩——他反问，如果现在是通胀环境，根本不会有人管这种「内卷」的事，等到真通胀起来了，大家反而希望企业互相降价来把通胀压下去。\n\n## 九、中国的工具箱：既能管需求，也能管供给\n\n1. 美国只能靠加息管需求，中国还能直接管供给\n\n他解释，美联储治理通胀只能通过加息压缩需求，没有办法直接干预供给——比如现在美国因为柴油涨价带动运费上涨引发的通胀，它没有手段直接命令石油公司降价、禁止囤油；而中国可以直接开闸放水、严打囤油，用行政手段让供给端立刻充裕起来，根本用不着加息就能压住这一类通胀。\n\n2. 「加息加不出铜」这个说法本身没问题，但只讲了一半\n\n他重申了自己反复强调的观点：加息虽然不能增加铜矿的实际供给，但它可以直接把需求打压下去——比如让本来要建的数据中心因为融资成本太高建不起来，需求一旦消失，原来的供给缺口自然就不存在了。他说无论通胀是由什么原因引起的，加息都能起到治理效果，只是代价不同：如果通胀是供给冲击造成的，加息打压需求会让本就疲软的经济雪上加霜，代价是陷入萧条；如果通胀是经济过热、需求旺盛造成的，加息压低需求反而是温和而良性的调整。\n\n## 十、沪伦比与铜的进出口套利：一堂具体的计算课\n\n1. 沪伦比是什么，由什么决定\n\n他考了大家一个问题——沪铜和伦铜主力合约的比值（沪伦比）现在大概在7.5左右，这个比值从长期看是由人民币对美元的汇率决定的，会围绕汇率上下波动。\n\n2. 进口铜要交增值税，这笔账很多人没算过\n\n他纠正了一个细节：从伦敦进口铜到中国是没有关税的，但需要缴纳13%的增值税。他现场算了一笔账：按当时伦铜主力合约价格折算，大约相当于人民币97000元一吨，而国内期货价格接近11万——也就是说，海外产铜卖到中国拿到的实际是97000这个价位，中间的差额要用来缴纳进口环节的增值税，这部分成本在计算利润的时候必须算进去，否则算出来的利润会失真。\n\n3. 随着人民币升值，套利空间会怎么变\n\n他解释，正因为沪伦比的中枢是由汇率决定的，随着人民币升值，未来大概率会出现伦铜涨得多、沪铜涨得少的局面——这也是为什么研究铜这类国际联动商品，必须把汇率因素纳入考虑，而不能只看供需关系这一个维度。\n\n## 十一、为什么每场都要提一次那家矿业龙头\n\n他解释了自己反复用同一只矿业龙头股举例、观察股东讨论区的原因——不是看好或看空它，纯粹是因为它足够典型、讨论热度足够高，适合当作一个长期观察样本：从舆情变化、股价波动，到一次加息会带来什么反应，都可以在这上面观察到规律。\n\n我一说多数人根据统计都是亏损的，这不叫人身攻击，这是在阐述一个问题；至于听的人自己往里代入，觉得我在说他，那是他自己的事。\n\n他还提到一个具体的观察结论：情绪化的股东越是自信满满、见不得不同意见，说明这批筹码越不稳定——上次这只票从高位下跌两成多的时候，原本在评论区群情激昂的人，最先开始互相埋怨、找人背锅的也是这批人。他还提到有个长期观点和他不一致、却从不做人身攻击、心态一直很好的股东，特别值得欣赏，\n\n你要遇到这样的股东占多数，说明筹码是在理性投资人手里，这样的标的才更值得买。\n\n## 十二、「把鸡蛋放在一个篮子里」：巴菲特这句话为什么容易误导散户\n\n1. 巴菲特说的是他自己的篮子，不是你的篮子\n\n他专门拆解了这句被很多人当作集中投资理论依据的话——巴菲特说与其分散，不如把鸡蛋放进一个篮子里，然后看好它。但他指出，巴菲特能这么说，是因为那个篮子本身就是他自己的：他可以直接控股、进董事会、把公司的现金调走。而普通散户所谓的「看好篮子」，那个篮子根本不是自己在管，管理层的人品、能力、动机你一概管不了，\n\n你就那三两个鸡蛋，还去看篮子，你算老几？\n\n2. 真正符合这句话字面意思的，是自己开店的小生意人\n\n他打了个接地气的比方：真正把所有鸡蛋放进一个篮子、天天亲眼盯着的，是楼下卖煎饼果子的夫妻店——因为那个篮子确实全是他们自己经营、自己看管的。散户买股票和这完全是两回事，能看的只有公开财报和公告，那都是别人想让你看的，\n\n你研究基本面，就相当于对着照片研究花朵，你连真花都没见过，还想成为研究花朵的专家。\n\n3. 分散投资本身是为了应对不可控的风险\n\n他强调，散户投资任何一家公司都存在大量偶然性和不可控的道德风险——你根本不知道明天会不会有人把上市公司掏空。分散投资的意义正是让一家公司出问题时，不至于把整个身家都搭进去。而他也补充说明，如果只是拿闲钱、亏了对生活没有实质影响的业余投资者，愿意集中投资赌一把，那是另一回事，不存在对错，只是性质完全不同。\n\n## 十三、职业投资和业余投资：完全不是一回事\n\n1. 业余投资者可以赌，职业投资者不能输\n\n他用一句流行的调侃来区分两者的心态：\n\n业余投资者常说，赢了下馆子，输了下地干活；但对职业投资者来说，这句话根本不成立——你输了不是下地干活那么简单，是要出大事的。\n\n他提到期货市场每年都会出现职业投资者因为过度冒险、爆仓后走上绝路的真实案例，这不是段子。\n\n2. 职业投资人的第一原则：绝不单押一个行业或一只股票\n\n他说这是业余投资者可以做、职业投资者绝对不能做的事——业余投资者输了大不了继续上班，职业投资者一旦重仓押错，后果是难以承受的。他还提到自己给直系亲属打理的小账户反而收益率更高，原因是那些账户可以承受更高风险（家人生活不靠这笔钱），所以能集中持有他判断中确定性最高、弹性最好的标的；而他自己的账户必须保持足够的分散度，因为一旦出现风险事件，他没有退路。\n\n3. 怎样才算真正可以从业余转向职业\n\n他给出了两个具体标准：第一，长期跟踪下来不能有任何一年出现亏损；第二，每一年都要跑赢大盘——大盘跌的时候你不亏，大盘涨的时候你涨得比大盘多，只有稳定做到这两点，才有资格考虑成为职业投资人。他还给了适合走这条路的性格特征：不从众、耐得住寂寞、有足够的耐心、愿意持续大量学习——尤其不从众这一条，他认为是最重要的，「别人一说什么你就跟着跑，那你根本不适合做投资，不只是不适合做职业投资人」。\n\n4. 职业和业余需要的是完全不同的本事\n\n他提醒，个人投资做得成功，不代表转做基金管理也能成功，这中间需要的能力完全不同——就像有的人自己做私募基金非常成功，不代表他做个人投资者也一定顺风顺水，反过来也是一样。他还用自己当年从大学老师转型专职律师、又从律师转型职业投资人的经历，说明兼职做两件事和专注做一件事，效果天差地别——精力有限，同时想做好两件事往往两件都做不好。\n\n## 十四、幸存者偏差：单押一只股票，你只看到了活下来的那些\n\n他列举了大量单押某一只股票、后来结果迥异的真实案例——有人重仓某新能源龙头暴涨百倍、也有人重仓某消费白马公司常年不涨、还有人重仓地产股最终大幅割肉离场。他强调：\n\n你只看到了单押成功的那些人，不成功的那些人不说话了，你根本看不着——你没看着的，才是幸存者偏差真正藏起来的部分。\n\n他还提到一位自己一直很尊重、当年在微博时代就关注的投资人，因为长期深耕地产行业、对这个行业有信仰，结果在某地产龙头股上摔了大跟头，最后割肉离场、转投白酒。他强调不该嘲笑这种失败，而应该反思其中的教训——正因为这位投资人本身就是地产行业出身，才更容易对这只票产生超出理性的信心，这正是「淹死的都是会水的」：不懂的人根本不敢下水，也就谈不上淹死；越是自认为懂这个行业的人，反而越容易在这个行业的股票上栽跟头。\n\n## 十五、人民币升值的完整逻辑：购买力被低估了\n\n1. 为什么说人民币汇率没反映真实购买力\n\n他给出了一套完整的推导：2020年之后，美国和其他主要经济体都实行了极度宽松的货币政策，出现大幅通胀——通胀意味着买同样的东西需要更多货币，本质上就是货币购买力在下降。而人民币这些年不仅没有出现明显通胀，甚至还略微通缩。也就是说，如果以2020年的汇率水平为基准，人民币的购买力相对当时不降反升，而其他主要货币对内购买力的贬值幅度早已超过30%。\n\n你还是原来的汇率水平，那这个汇率相当于没有反映真实的购买力，所以人民币现在购买力被低估了，这就是升值压力的由来。\n\n他还从贸易平衡的角度解释了这为什么会引发外部压力：人民币被低估，意味着中国出口商品换算成外币后显得格外便宜，这会持续冲击进口国的本土产业，中国的贸易顺差也因此持续扩大，所以这些年国际上要求人民币升值的呼声一直存在，也是有道理的。\n\n2. 双循环，是为快速升值铺路的准备工作\n\n他解释了为什么升值不能一步到位：如果贸然快速升值，会对出口导向型企业造成巨大冲击，所以这些年一直在用政策手段人为控制升值节奏。而真正的破局点在于双循环战略——通过扩大内需，让出口占GDP的比重逐年下降，等外贸依存度降到足够低的时候，升值对整体经济的冲击也就相应减小了，这时候才具备了有序放开、让人民币逐步升值的条件。\n\n## 十六、人民币升值的「双击」效应，和日本模式的根本不同\n\n1. 对热钱来说，这是双重收益\n\n他解释了国际热钱为什么如此热衷于赌人民币升值：买入人民币本身就是在赌汇率升值，这和买黄金赌升值没有本质区别；但买人民币多了一层好处——资金一旦以人民币形式进入中国资本市场，还能同时享受人民币资产重新估值带来的收益。\n\n一方面你汇率升值了，一方面由汇率升值所导致的中国资本市场也跟着升值，这是一个双重的升值，这就是为什么热钱一定要往中国来。\n\n2. 为什么中国能控制升值节奏，而日本当年控制不了\n\n他把这次和广场协议之后的日元升值做了对照：日本当年是资本项下完全开放、门户大开的，热钱可以随意进出，一旦放开升值预期，就会形成自我强化的循环——买的人越多，日元涨得越快，涨得越快，买的人就越多，很快把日本国内的房地产和股市一起推上了天，资产泡沫由此产生，最终日本央行被迫快速加息把泡沫摁下去，这才有了后来「失去的三十年」。而中国的人民币在资本项下并不是完全自由流动的，可以主动控制热钱流入的速度，用时间换空间，按照可控的年度幅度（比如一年5%到10%）逐步释放升值压力，这是日本当年做不到的。\n\n## 十七、日元加息为什么反而伤得更重：被商品化的钱开始回流\n\n1. 高市早苗的立场：不是反对加息，是主张放任\n\n他专门澄清了一个容易被误读的地方：高市早苗的立场不是简单的「反对加息」，而是主张彻底放任日元贬值和国内通胀——这正是安倍经济学的既定路线。他解释了这套逻辑的合理性：日本加息本来就压不住由汇率贬值引发的输入性通胀，却会实实在在推高国内工商业的融资成本，所以对日本经济来说，加息几乎是有害无益的选择，只是这种政治体制下不能公开这么说。\n\n2. 日本长期滥发的货币，因为被「商品化」，一直没有在国内起作用\n\n他重申了这套机制：日本这些年印了大量货币，但由于国际资本流动不受日本控制，这些钱印出来很快就被买走、囤积在海外，充当抵押品去美国投资股市和国债，没有真正在日本国内参与货币创造，所以日本长期没有通胀。而现在随着日元加息，这些囤积在海外的日元开始回流日本，重新参与国内的货币创造，这才是日本「越加息、国内通胀越严重、汇率却越贬值」这一反直觉现象的根源。\n\n3. 日元回流的另一面：抽离美国和东南亚的流动性\n\n他补充了这个过程的连锁影响：这些囤积在海外的日元，很大一部分是美国和东南亚金融体系流动性的重要支撑，一旦大规模回流日本，相当于同时从美国和东南亚抽走了流动性——这是理解日本加息为什么牵一发动全身的关键。\n\n## 十八、人民币升值背景下，谁受益、谁受损\n\n1. 进口原材料变便宜，会带来核心资产的重估\n\n他解释，人民币升值最直接的好处是让进口商品变便宜，尤其是原材料——用铜的下游企业成本会下降，利润空间被打开，这类核心资产未来会迎来估值重估，这也是他认为升值周期往往伴随一轮估值长牛的原因。他提到，这个过程中境外资金除了买股票，也可能选择买入商业地产（不是住宅），但赌的同样不是房价本身，而是人民币升值。\n\n2. 但矿产资源类的海外资产，会承受汇兑损失\n\n他把这条逻辑反过来用在了矿业公司身上：那些在海外拥有矿产、以美元计价资产和收入的公司，会面临持续扩大的汇兑损失——不仅是当期利润要承受汇兑损益的侵蚀，账上按美元计价的矿产这类固定资产，折算成人民币后也会缩水，触发资产减值。这和商誉减值是类似的机制，人民币升值幅度越大，这类减值压力就越大。\n\n3. 反过来，背着美元债务的公司反而占便宜\n\n他举了个对称的例子：像航空公司这类背负大量美元债务的企业，人民币升值反而是利好——债务折算成人民币后规模变小，利润和资产的账面表现都会因此改善。\n\n## 十九、涨价不代表生产商受益：一组系统性的反例\n\n1. 买入的人，赌的是很多年前的预期，不是今天的价格\n\n他提醒，判断一只矿业股是否有投资价值，不能拿今天的矿价高低作为依据——真正的买入者是在价格还很低、没人关注的时候就已经建好仓了，等到今天矿价涨、供不应求这些消息铺天盖地出现的时候，恰恰是他们准备兑现离场的时候。\n\n这些消息都是给你准备的，等你来发现这件事，你一买人家就走了，这个游戏就玩完了。\n\n2. 碳酸锂涨价，最先被限产的企业反而是受损的\n\n他举了当时锂价上涨的例子：很多人以为原料涨价所有生产商都该受益，但那一轮碳酸锂涨价，很大程度上是因为某地一家下游产业链企业因环保问题被限产，供给减少才推高了价格——被限产的那家企业本身恰恰是最直接的受损者，并没有享受到涨价的好处。\n\n3. 同样的逻辑放在养猪和石油上\n\n他继续用生活化的例子说明这个道理：疫情导致猪价上涨，很多人以为所有养猪企业都能赚盆满钵满，但真实情况是疫情让一部分猪场直接死掉退出了市场，价格才涨起来——问题是你买的那家企业，正好是活下来的还是死掉的那家？石油也是同一个道理：当年因为地缘局势导致某些石油出不了口，油价才涨了上去，但运不出油的那个产油国本身恰恰是受损方，不是所有石油生产商都跟着受益。\n\n你不是说某一个东西涨价了，生产这个东西的所有生产商就都受益——他正是因为有人受损，价格才涨起来的。\n\n## 二十、高位横盘：出货，还是重新吸货？看股东人数\n\n他提醒，一只标的在高位长期横盘不涨，存在两种可能：一种是仍在派发出货，另一种是有资金在重新吸筹、赌未来继续上涨。区分的关键还是股东人数——如果是重新吸筹，中报里已经大幅增加的股东人数就应该重新开始下降，因为机构一次买入的量顶得上大量散户，散户越多、股东数越涨，机构越多、股东数越降。他还提到一个很直接的观察方法：机构进场之后，讨论区会明显冷清下来，因为没有机构会天天在论坛里和散户吵架。他坦承自己前几天观察到的一只矿业标的，「捅」完之后发现讨论区依然热闹，说明散户筹码还没有出清，这个判断目前还没兑现。\n\n## 二十一、美股没有你想的那么安全\n\n他提醒，国内不少散户对美股有一种「买了就躺赢」式的盲目崇拜，但只要稍微了解一点美股历史就知道情况完全不是这样——1987年10月那次，道琼斯指数一天之内跌了23%，而且美股的波动往往没有救市资金托底，除非像2008年那样已经演变成流动性危机才会出手。他建议想了解真相的人可以去读一些讲美股历史的经典著作，里面把历次牛熊市的起落过程讲得很清楚。他也坦白自己完全不懂英语，从不碰美股。\n\n## 二十二、「辟谣是出货法」：为什么消息公布当天反而不是关键\n\n他借着当晚芯片股在美股大涨、A股同类却提前下跌的现象，重申了「消息扩散有先后」的判断——真正提前知道消息的人早就动手了，不会等到消息正式公布那天才行动。他还提醒不要把公开的表面理由当成真实原因：\n\n解禁不是为了卖，是为了让你买——很多手段都是先给你卖个破绽，让你以为自己看穿了真相、放松警惕冲进去，真正的动作是在你没注意的地方进行的。\n\n他把这个逻辑和「先造谣砸跌停、再辟谣拉一点」的老套路连在一起：造谣砸盘那天出的货，不是辟谣那天——辟谣只是为了让你放松警惕、觉得占了便宜，趁着你冲进来的时候把剩下的货出掉。\n\n## 二十三、拉高点是为了让你心里有个锚，不是为了在那卖\n\n他重申了之前反复讲过的一个观点，并补了一个生活化的类比：股价被拉到高点从来不是为了在那个价位成交，而是为了在你心里种下一个价格锚——就像讨价还价，商家开口先报个虚高的价格，等你还价成功，会觉得自己占了便宜，其实那才是他本来就想卖的价格；电商大促也是同一个套路，先提价再打折，让你产生「占便宜」的错觉。他重申了这条判断——科技股真正危险的不是在最高点的时候，而是从高点腰斩之后，因为那个时候的价格已经落回了大多数人心里的「便宜」区间，反而最容易吸引人冲进去接盘。","toc":["一、「义和团式」分析加息：为什么「敢不敢」「怂不怂」都是外行话","二、美联储加息是为了「卖美国国债」？这个说法从哪来的","三、日本这次的加息，才是真正的大变量","四、鲍威尔的失败：一次误判引出了今天的连锁反应","五、财富不会消失，只是转移：一场确定输家的游戏","六、边际变化决定价格：外资进A股，图的是什么","七、人民币升值：不是我们主导的，是有人真的需要","八、反内卷的真正目的：治理通缩，不只是保就业","九、中国的工具箱：既能管需求，也能管供给","十、沪伦比与铜的进出口套利：一堂具体的计算课","十一、为什么每场都要提一次那家矿业龙头","十二、「把鸡蛋放在一个篮子里」：巴菲特这句话为什么容易误导散户","十三、职业投资和业余投资：完全不是一回事","十四、幸存者偏差：单押一只股票，你只看到了活下来的那些","十五、人民币升值的完整逻辑：购买力被低估了","十六、人民币升值的「双击」效应，和日本模式的根本不同","十七、日元加息为什么反而伤得更重：被商品化的钱开始回流","十八、人民币升值背景下，谁受益、谁受损","十九、涨价不代表生产商受益：一组系统性的反例","二十、高位横盘：出货，还是重新吸货？看股东人数","二十一、美股没有你想的那么安全","二十二、「辟谣是出货法」：为什么消息公布当天反而不是关键","二十三、拉高点是为了让你心里有个锚，不是为了在那卖"],"url":"https://xueqiu.com/2573414707/409935169","chars":10018},"topics":["人民币升值","职业与业余投资","加息共振","中美缓和","沪伦比"]},{"date":"2026-09-18","bili":{"title":"老木匠 2026年9月18日直播文字稿（紫金矿业祛魅、周期股纪律、加息血崩、囤铜逻辑、人民币升值）","text":"## 一、开场：情绪是能传染的\n\n有人进直播间就问我，今天是不是不冷静。我明确讲：我是因为把你们当学生，所以什么话都能接受。但如果我把你当成和我一样的同行、同事，那你跟我犯蠢，我一句情面都不留。\n\n人跟人最大的差别在情绪。公园里九十来岁的老太太，我跟她打声招呼，她能乐一天——我的情绪能传染她。可有的人你跟他说一句话，他眼睛一翻、声音一沉，算计半天憋出一句，你这一天的心情全完了。想做到到哪儿都受欢迎，第一条就是先把情绪带过去，说话得有感染力。\n\n生活不只是股票。股票是赚钱的手段，赚钱是人生的手段，不是目的。让自己每天过得高兴，那才是目的。很多人不光在股市里手段和目的搞反了，生活里也一样：你随便说句话，他就在那琢磨你是不是在阴阳他。我这人不阴阳，我在这平台上有个习惯——所有发言只针对股票，不评价人。\n\n## 二、现在说一只股票，等于动了谁家的祖坟\n\n我说紫金矿业，就有人当我在说大黄；我说有色有风险，飞翔云当年就把我拉黑；烟花易冷天天来我这叫板，我才开始聊紫金矿业。\n\n股票怎么就成谁的专属了？你一个散户手里那点筹码，在资本市场主力眼里，哪只股票是你的？逛窑子还逛出感情来了。\n\n就好比我发给大家的那张图：你搭着车在山坡上往下看，底下打得你死我活，你千万别下去，等着就行，早晚他们拼得差不多了。\n\n## 三、大宗商品是货币现象，不是供需故事\n\n昨天黄金涨、铜涨、有色都涨，那又怎么样。\n\n你得先明白美联储加息是干什么的——压通胀。通胀的表现是什么？除了大宗商品涨，生活用品在涨，铜铝铅锌也在涨，这就是通胀。现在有人想的一件事是：加息最后把通胀压住了，但铜铝铅锌还照样涨。这不胡扯吗？铜铝铅锌是所有行业的原材料，它们涨，你的通胀怎么压？\n\n大宗商品在历史上从来都是同涨同跌，你去了解一下 CRB 指数。小波动上各有各的原因——农产品看气候，石油看欧佩克和地缘政治，铜看个别需求爆发（比如 2008 年之前中国的房地产），钢铁看基建。但你把所有具体因素都去掉，它就是个货币现象。\n\n我以前就讲过：你说铜供不应求、铝供不应求，我能理解，怎么现在钨也供不应求、钼也供不应求了？除了黑色系跟中国基建有关、产能实在过剩，其余有色金属、小金属同时\"供不应求\"，你告诉我为什么？它们各有各的需求，怎么可能同时缺？黄金有什么需求，你告诉我它怎么供不应求的？\n\n你搁电梯里研究半天怎么上楼，又是俯卧撑又是弹跳，我告诉你那都没用——是因为电梯在往上走。你以为你上楼是靠在电梯里做俯卧撑上去的？\n\n再看铜的库存：现在全世界整体铜库存是历年同期最高的，你\"过剩\"是怎么攒出这些库存的？你说出多少马上就被拿走，那库存哪来的？显性库存之外，隐性库存比显性还高，很多人都在囤非标铜，而它不进库存统计。\n\n## 四、囤铜：比买黄金更实在的实物投资\n\n2022、2023 年那会儿，有朋友觉得买什么都觉得不牢靠，我给他们出主意：买几吨铜，埋在自己别墅院子里。\n\n为什么？一立方米铜七吨多，得吊车才能叼走，谁偷得走？黄金你还得放保险柜，怕被撬。你就买一吨铜，抹上润滑油——是机器用的那种黄油，不是吃的黄油——用油纸包上，挖个坑埋地里。这就是投资，比你买房子强。当时很多人听了也没人去实施。\n\n铜的流动性非常强。你买符合交割标准的电解铜，江西铜业、云南铜业出厂都带品牌，到时候你直接拉到电缆厂，人家直接就给你钱。买房子呢？装修、交物业费、墙皮掉了壁纸掉了还得求物业来修。\n\n黄金不行在哪？你提实物，检验费用非常高；你买首饰，那都加了多少价；你想买纯金，现在很多银行连纸黄金都不开展了。你真正买实物黄金，还有个没地方放的问题，放家里还怕被偷。\n\n## 五、我为什么不告诉你们我持什么股\n\n我很少跟大家讨论具体投资，现在是因为粉丝太多。如果我说了一件东西，虽然我没推荐你，但你是通过我知道了这只股票，然后你买了、亏了，我会非常内疚。\n\n我最怕听见有人说\"我跟着你买了啥\"。这话对我来说就跟五雷轰顶一样。有人问我持仓，你别问，我也不敢说。\n\n我给自己亲属做投资，2021 年洛阳钼业那一次，我替他们卖了，我自己的没卖，后来我自己回撤非常大。因为我不愿意让他们承担风险。道理一样，我也不愿意让你们承担风险。\n\n所以有些股票到了高位，即便我还持有，我也会开始提示风险。我能承担的风险，你们承担不了。你别说来骂我，你到我这埋怨一句，对我来说比天塌了都难受。\n\n当年有个人十几块钱买茅台，涨到几百上千的时候天天还说茅台，后来茅台跌下来，跟着他买的人怎么办？他良心不受谴责吗？你是没让谁买，可你有这么多粉丝看着，你的一举一动对小白就是有影响的。这就是古话说的\"我不杀伯仁，伯仁因我而死\"。对我来说，这就是内疚。\n\n## 六、紫金矿业：一个被当成成长股的周期股\n\n### 1. 先说我和紫金矿业的两次交集\n\n我一直没评价过紫金矿业。我买过它，两块多、三块钱买的，是从我上雪球以后才不持有，所以我也从来不说它好与不好、有没有风险。\n\n我只说过它两次。第一次是飞翔云跑到我这来挑战，我说有色有风险，他非说紫金矿业一定得涨，我说那不一定，它就是个周期股，为这事我们争论过。第二次就是最近，烟花易冷天天来叫板，我才开始说紫金矿业。要不然紫金矿业跟我有什么关系？我当年说的都是洛阳钼业和中国铝业。\n\n### 2. 为什么我买有色不买龙头\n\n龙头弹性小，因为龙头里拥趸太多——有信仰的人太多。你在最绝望的时候他都特别有信仰、都不卖，价格怎么下来？你占不着便宜。\n\n你看洛阳钼业和紫金矿业 2022 年的起点价，再看两个人各自的高点，就知道谁弹性更大。洛阳钼业再跌都没怎么跌到三十以下，那它现在再涨能涨到多少？\n\n但也不能投太靠后的。作为周期股，投后排弹性是高了，可容易被淘汰。\n\n邓普顿做逆向投资就专门买后排的。他自己也不知道哪个最后会退市，怎么办？买一揽子，都挑排在后边的，哪个成了，弹性特别高。\n\n投资靠的就是低买高卖——低点足够低、高点足够高，这叫弹性。好东西的特点是高点挺高，但低点不够低。比如有一天白酒服输了，你买茅台就不是好投资，应该买五粮液、水井坊。五粮液十七块钱的时候茅台已经一百二了，最后茅台涨到两千六，五粮液从十七八涨到四百，水井坊从三四块涨到一百七八——倍数一算就知道差别。\n\n当然，如果你是买入持有，那还是买龙头，它慢，但胜率高。但周期股没有买入持有这种模式。 彼得·林奇说的\"大烟囱股\"就是这种，K 线隔几年冒出一个大烟囱，你拿它做长期投资就是找死。\n\n### 3. 紫金矿业过去为什么不像周期股\n\n紫金矿业是陈景河缔造的，当年只是一个县级小厂。这个过程里还有一个人做了巨大贡献——陈发树。陈发树是承包工程的，给紫金矿业干活，最后紫金矿业付不出工程款，就把他拉进来入股，后来一起去香港上市。\n\n后来紫金矿业做了一件对今天非常重要的事：收购了刚果金的卡莫阿-卡库拉矿。我投资它的时候它正好刚收购，大概 2010 到 2012 年。那时候有色金属非常低迷，2008 年的高峰下来之后矿产品大量过剩，铜价很低，很多矿亏损，国外大矿开始甩卖手里未开采的矿。\n\n我觉得它当时其实买不起，手里分毛没有。我的推想是：当时国家在搞矿产资源安全计划，鼓励企业走出去买矿，这种收购极容易拿到贷款。紫金矿业当时就是赌一把。你后来听他们说\"我开采成本特别低、技术特别好\"，那都是后话。前提是它是个小厂，跑到国外赌一把。洛阳钼业也一样。\n\n买完矿开始建设、开采，它运气特别好：卡莫阿-卡库拉投产的时候，正好赶上有色金属大幅上涨。如果那轮低迷再持续三年，紫金矿业都挺不住——财务成本老高了，你借的钱、买的设备都要付利息。但它一开始投产就撞上大运了。为什么？因为中国 2010 年之后房地产大发展、基建大发展，需要大量原材料。国家那个计划看得很远，它们赌对了。洛阳钼业也是，TFM 和 KFM 投产之后正赶上价格上框架。\n\n那我问你：如果它投产的时候价格还在跌，怎么办？它说我预计到未来会上涨——你真预计到了，那你不用买矿，买期货比这挣得多。这话就是胡扯。\n\n所以我才说这是赌。邱国鹭写过《投资中最简单的事》，他十几年前专门讲过为什么不能投矿产公司：投矿就是赌博。你不能因为今天赌赢了，就说这有多牛。\n\n再问你一句：你比陈发树更了解紫金矿业吗？陈发树把它清仓式卖掉了——那是他一手拉起来的公司。\n\n紫金矿业过去为什么成长得快？因为它收购的矿正好进入开采期，又正好赶上价格大涨，产量在增加、价格在上涨，成长性当然强。\n\n### 4. 它的增量从哪来，现在还剩下什么\n\n卡莫阿-卡库拉这些矿都投产了，它未来的增量在哪？\n\n它当然还会有提升——多开几个矿坑、再收购一些小矿——但增长率已经远远比不上过去。过去是在矿特别低迷的时候买的，所以赚了。今天它要扩张，就得按今天的价格买矿，那不就回到\"周期高点买矿\"吗？洛阳钼业现在也是在周期高点买矿，下一个低点的时候，这些东西都得计提损失。\n\n那不买矿行不行？不行。矿开一天就少一天，除非你不想干了。买到一个好矿你就赚钱——开采成本低、矿坑浅、土石方工程少；下回买一个贫矿，品位又低，你就亏钱。开矿和开发房地产没有本质区别，你得凭点子。等你什么都剥离好、开始采了，价格哐当下来了。\n\n有人说\"过去增长多少多少\"，我问他：姚明二十岁长到两米，四十岁能长到四米吗？\n\n现在紫金矿业只能算一个普通的矿业周期股：价格涨它涨，价格跌它跌，它已经没有那种颠覆性的增量了。\n\n最怕的是陈景河走了以后，新上来的人还搞扩张。它前段时间不是收购什么金矿股权吗？金价都多高了，你敢担保金价一直维持这个价？一旦回调一点点，你收购的矿立马就亏。原本靠低价买矿扩张获得成功，可一旦成功之后，你不可避免地会转向高位扩张——这是矿业公司，甚至任何一个公司的宿命。\n\n为什么？账上有钱。谁也挺不住不花。个人也一样：账上没钱的时候，出去吃个小摊就觉得挺好；账上有钱了，小摊都看不上，得下馆子。\n\n这就是周期最终一定会结束的原因：高位上这些有钱的大矿一定还会去扩张，这是囚徒困境。你不扩张就完了，因为矿早晚挖没，你必须为下一次储备新的矿场。\n\n追赶容易——小矿很快就能追上国际大矿；但追上以后想超越就很难，因为你当年面临的问题，现在轮到你面对。你小的时候，并进一个大矿，财务报表马上就变；你已经是世界名矿了，得并多少报表才能变？小的时候可以赌，大的时候再赌非常难。这跟炒股一样：你手里只有一两万，单怼一只股可以，成了就成；你上亿了，还能单怼吗？\n\n### 5. 矿本身就是赌，连储量都核实不了\n\n全世界所有矿产公司都有赌博性质，矿不是一个能稳定产出现金流的行业。成熟的投资人大抵都不投矿产公司，尤其有色金属。巴菲特会投石油、煤炭，很少投铜矿。为什么？\n\n第一，铜价变动太快，无法预计。第二，储量根本没法核实。勘探完了说这里有一千万吨铜，我问你，你最终能不能采出一千万吨？谁去给你核实？这打个眼儿那打个眼儿，然后算一下——可矿脉非常复杂，你打眼儿的地方有矿，真挖下去可能就是一薄层。这种事在煤矿、铁矿里经常发生。\n\n这跟獐子岛数扇贝有什么区别？\n\n所以这就是个游戏：股价高的时候报的储量也都多，大家把股票都卖了；等股价跌下来，就说经过核实我们那矿没那么多，开始减储，你觉得天要塌了，不断卖；卖到底了，人家都买回去了，然后又说进一步核实，矿还在，上次算错了。跟扇贝游走了又游回来，没有区别。\n\n你现在看到的为什么都是好消息——又增储、又产量提升？因为现在是矿的牛市。最近十年进来的人，都没经历过矿产品的熊市。矿的熊市是要人命的：所有公司都亏损，矿都得关，开矿这种\"人吃马嚼\"的成本老高了。\n\n## 七、周期股的纪律：留足安全边际\n\n周期股无论是买入还是卖出，都要留出足够的安全边际。\n\n为什么有人投周期股最后亏得连裤衩都没有？就是过于自信。任何一个周期股到最后都跟今天的紫金矿业一样——所有人都认为它不是周期股了，给它起名叫成长股，叫\"未来不可替代、改变全人类\"。名字不重要，重要的是这种现象一出现，就说明它到顶部了。\n\n到顶部是不是明天就跌？不一定，它极有可能在这个位置再涨一倍。周期股弹性非常强。但这时候风险很大：第一，你在信息上有劣势，行业最先起变化你根本不知道；第二，你看到的信息极可能是别人投喂给你的。\n\n所以周期股你不要试图吃到底。你认为已经出现顶部特征了，就卖掉。有人说那后边的钱不就挣不着了？你要会投周期股，就会发现周期顶点的时候，那个周期的低点也到了——你为什么非要可一棵树上吊死？为什么非得投铜股？现在还有大把周期股在底部趴着，又安全、量又足、分量又管饱，容错率极高：你看错了它再跌也跌不了多少，只要能挺住，最终一定涨，涨的时候弹性还非常大。没人拿枪顶着你必须买紫金矿业。\n\n有人老说我\"洛阳钼业卖飞了\"。我十二块钱卖的洛阳钼业，可我七块五买的中国铝业，最后十三四块卖的——按这个比例算，相当于我洛阳钼业卖在二十四。你现在再看洛阳钼业多少钱？\n\n什么叫卖飞？我十三四块卖中国铝业，即便它再涨到三十，我一点感受都没有，这在我预料之中。但如果它从这个点涨到一百，那说明我卖错了，那才叫真正的卖飞。你们说的\"我十二块卖的涨到二十五\"，对我来说都不叫卖飞。\n\n我做周期股根本不是要那个弹性。我买洛阳钼业的时候不到四块钱，拿到十二；我买云铝的时候三块八，八块多卖的；我卖完云铝买洛钼，卖完洛钼买锡业——买锡业是因为它当时太便宜了，我记得十二块钱。投资逻辑都一样：它到周期底部了，所有东西都到周期底部了，只是当时还没人认识到，所以它弹性高。哪地方我卖飞了？钱是活的，股票是死的。\n\n至于有人说\"万物皆周期\"——凡说这句话的人，一概都不懂周期股。\n\n## 八、\"留一手\"是最坏的习惯\n\n很多人喜欢把赚过钱的股票留一手，说这是\"把之前的盈利留一手\"。我告诉你，这是新手最坏的习惯，本质上说明你存在心理账户的误区。\n\n盈利的股票不但不能留一手，卖出之后应该直接把自选删掉。 你不删自选，迟早有一天会把它再买回来；而且买的时候会想\"我曾经在这只股票上赚过钱，所以买贵一点也无所谓\"——你对它就不会像新买一只股票那么谨慎。\n\n你每天打开账户看那个净资产，那是你的本金，没有一分钱叫盈利。那就是我钱包里的钱。如果明天变少了，那叫亏损。所以你要避免的就是明天比今天钱少——这叫控制回撤，这才是专业投资人的干法。\n\n## 九、明年有没有通胀预期\n\n有，而且打破通缩本来就是我们追求的目标。\n\n我们的工具比欧美日本多得多。他们基本只能用货币手段，靠收放货币来解决物价问题；我们除了货币手段，还可以掺很多行政手段和财政手段。\n\n通胀高的时候，我可以强制国有大型企业不许涨价——油价、电价、水电煤气甚至通讯，这些大部分都在国企手里，不让你提价，你亏损无所谓，对国家来说是左兜装右兜。\n\n反过来通缩严重的时候，大型国企就\"反内卷\"，不许降价。你看我们反内卷这件事，欧美做不了。招投标不许低价中标，我给你规定最低价，你再低不允许；甚至房价都可以不允许降价。这些都是财政和行政手段。\n\n好还是坏另当别论，但起码我们的工具比别人多。\n\n还有一件影响很大的事：六张网建设。现在为什么不怎么提？因为现在提的都是科技。为什么只提科技、不提六张网建设受益的东西？大家自己动脑子想一想。你连六张网是什么都不知道，你还怎么做股票？没有六张网建设，哪有现在这么高的铜价。\n\n## 十、2024年9月18日，我在雪球喊了第二次底\n\n今天是九一八。2024年9月18日下午，我在雪球发了一个短贴，很多人是从那时候开始信任我的。那是我在股票市场上第二次喊底，第一次是 2015 年在朋友圈。到现在为止只喊过这两次。\n\n那一轮后来的行情，所谓的\"924行情\"，其实就是从 9 月 18 号开始的。我在 9 月 30 号、十一放假前的最后一天，把所有融资都清了，最主要清的是券商——当时我有华泰、东方、长江三只券商。那次没有空仓，只是清了融资。从那以后我再也没买过券商。\n\n## 十一、券商：当年最好的买点，现在是风险\n\n2024 年 924 之前，券商在市场上被叫\"渣男\"，我因为看好券商天天被人骂。那时候券商自己的主播都说\"券商算个嘚儿\"，说新村长是券商杀手，券商彻底没戏了。\n\n我当时写过帖子：他现在这么整顿券商，难道是为了把市场整黄吗？是为了让市场好。是你们券商这些人太不像样了，发工资把公司资金都发霉了，专门让老百姓亏损，整你们就对了。他整的不是券商，是券商里面那些一个月挣六七万、一个中层经理年薪一百多万的人。\n\n那时候券商一片灰暗，谁都不看好。所有公司、所有行业都一样：当所有消息都是坏消息、所有人都说\"千万别碰这个东西\"的时候，买入机会基本上就来了。 当然具体买不买还要具体分析。我一直秉承这个原则。\n\n后来到 2024 年 10 月 8 号之后，券商大涨，东方财富创了成交量的天量，从那时候我就开始提示券商的风险了——然后又是一堆人来骂我。最有意思的是，骂我的人，就是当年在低位我让他们买的时候骂我的那批人。\n\n券商我现在也没买，也不关注，所以也不评价。但我提醒一件事：现在成交量越来越萎缩，这对券商是实实在在的利空。 而且一旦有风吹草动——比如科技股、随着加息开始下挫的时候——券商很多自营盘买的也是这些东西，它的自营投资损失就会显性化。你持有券商的，建议关注一下风险。\n\n保险我从来都不懂，你别问我。保险的财务报表我看不懂——那套核心价值的算法，很多东西都是假设出来的，很难判定对错；保费收入到底跟什么有关、什么会刺激保费增长，我到现在也没搞明白。我曾经投过平安银行，看他那个报表实在太费劲，后来干脆不投了。看不懂的东西我就永远不回头，包括科技。看不懂，就得服他。\n\n## 十二、离房地产近的周期股，我这些年都避开\n\n水泥属于建材，建材这一大类离房地产基建太近。水泥有供应半径，你要是能找到恰好那个地方基建比较好，行；但普遍性机会没有，选择很难。\n\n水泥、钢铁、建材、装饰、白色家电、工程机械、焦炭，包括土建类基建的央企，这些东西都离房地产太近，我这些年都不投。\n\n2024 年我预计到了工程机械的下一个低点（换机周期到了），也专门写过帖子、跟人争论过三一重工，但我仍然没投，原因就是它离房地产太近。\n\n## 十三、美联储这次加息：点阵图、实质影响和血崩\n\n### 1. 十九个人、十八份点阵图、十二张票\n\n点阵图这次只提交了十八份，而美联储一共十九个人。七个理事由美国总统任命，这七个人都有投票权；十二个成员行的行长里各派一人，纽约联储银行的行长永远有投票权，剩下四个由那十一家联储银行轮换。\n\n每次投票的只有十二个人，机制有点像联合国安理会：五个常任理事国之外，十个成员国轮换，每次替换一半。\n\n这次十八份点阵图里，十六个人赞成今年还要加息一次，其中四个人认为要加两次；只有两个人认为今年余下时间维持不变；没有人认为会降息。沃什本人没有提交。\n\n那就意味着，美联储下一次一定还会加息一次的概率，几乎就是百分之九十。\n\n### 2. 我的判断：十月加息概率很高\n\n我个人认为，九月份的通胀数据出来一定比八月份还难看——因为油价是九月才开始涨的。九月的通胀数据影响的是十月的会议，所以十月加息的概率很高，会出现连着加两次的情况。十月加完十二月还加不加，就没法判断了。\n\n### 3. 加息之后反而都在涨，那是赌博盘的余波\n\n昨天加息落地，美国股市不仅没跌反而涨了，黄金贵金属、有色金属也都涨了。这跟大家想的不一样——大家认为加息之后应该马上跌。\n\n回顾我前几天直播讲过的：从加息前几天一直到加息之后一个星期，行情都不用看，因为现在都是赌博盘在博弈。加息之前涌进去的都是博小概率的赌徒，加完息以后还是这些赌博盘的余波在起作用。你得等一段时间。\n\n### 4. 心理影响已经结束，实质影响才刚刚开始\n\n加息的影响，心理层面和实质层面是分开的。心理层面，一加息、甚至还没加就已经反应完了；真正落地的时候，心理层面这个影响反倒消失了。\n\n但加息不只是影响心理，它还要影响实质——融资成本上升、企业成本提高、利润下降、消费受影响，这些要等下一次数据出来才会发现。\n\n而且今天所有东西都在涨，如果到下周这种局面还持续，那就意味着这次加息已经没什么效果了，下一次他还一定要加。\n\n### 5. 越抵抗，最后越容易血崩\n\n有人问加息加到什么时候为止、会不会导致大宗商品崩盘。会——不崩盘就没办法降低通胀。但\"崩盘\"不一定是一天从一万跌到一千，我指的是价格起码不再上涨、甚至开始下跌。\n\n我告诉你：没有一次加息周期是加完之后所有指标都平稳落地的，一定是以瀑布的形式落地而告终。越是加息前期市场出现抵抗、越不在乎你的加息，最终加息起作用的时候越容易血崩。 最理想的加息模式是一加就平稳下降；最怕的是一加反倒开始涨，利空出尽是利好，下一次再加又利空出尽是利好，加到最后累积作用起来，哐当一下下来。\n\n2008 年就是这么下来的，2000 年也是，日本泡沫破裂也是。这几乎是个宿命。为什么？因为市场化经济就是自由竞争，没人监管、没人微调，最终回调一定是破坏性的。马克思早就分析过：市场经济一定产生生产过剩的危机。\n\n我们有发改委，产能过剩了可以反内卷、不批新产能，所以我们不会出现崩盘式下跌。美国做不到——现在美国有哪个部门能站出来说\"你们不能再建数据中心了\"？没有。所以最终一定是建得太多，然后崩盘。\n\n### 6. 这不是新一轮加息，是2022年那次没加完的继续\n\n现在的利率已经从三点几加到三点七五到四了，怎么能说它是刚开始加息？再加零点五个百分点就是四点五。四点五是什么概念？如果十年期国债利率变成五点五，那我告诉你所有的股市资产都得重估。\n\n鲍威尔没完成加息，主要就是特朗普施加压力。而沃什不像鲍威尔，他有硬后台。沃什上台接替鲍威尔，就意味着在货币政策未来的走向上，特朗普已经斗败了。我从沃什上台那天就开始讲这件事：一定要正视加息。\n\n你的基础逻辑已经变了。如果上来的是哈塞特，你投资有色金属才是最好的投资。现在斗败了，前面就会反扑，就会加息。那些自媒体博主还在那分析\"他不敢加息\"——分析啥呢？\n\n## 十四、这次加息会击穿算力，而不是股市\n\n加息会导致建人工智能的成本增加。再加一次，成本再增加点，迟早有一天他们实在整不到钱了、建不起了。\n\n接下来你会看到融资成本增加。现在国债在涨、收益率在降；再过一段时间积累以后，国债收益率会重新开始上升。国债收益率上升会影响很多东西——比如银行的资产负债表，很多小银行买的国债作为资产，资产重估的时候，同样的资产规模，你的资产就变少了，就会引发中小银行的挤兑性危机，就像当年的硅谷银行、合众银行、签名银行。\n\n这一系列反应究竟怎么发生你不用去预计，你只要知道现在这里有风险就行了。这不是\"利空出尽是利好\"就算完事。\n\n再说一层：那些建算力中心的钱最后怎么办？没怎么办。他们为人类发展做出了巨大贡献，他们已经撤场了。\n\n2000 年光纤通讯基础设施建得太多，最后崩盘；崩盘之后，这些资产太便宜了，在上面产生的互联网公司成本很低，所以微软、Meta、谷歌这些公司，是站在这些人的尸骸上诞生的。未来也一样：这些算力公司迟早会崩盘，崩盘之后真正的大模型、AI 应用公司才会诞生——因为那时候算力会以跳楼价出租，这些应用公司才能获得正的现金流。\n\n每一次工业革命都是这么演的。你今天看到的如火如荼的公司，未来不一定好。人们不可能老买芯片、老建算力中心，因为建算力中心最终是为了应用，只有应用对人类才有意义。\n\n这跟房地产红利是一个道理：未来中国很多公司的成本会大幅优化，因为现在建完的这些房子非常便宜——他卖不出去就要跳楼价卖，那么你租办公场地比以前便宜很多，工人的房租支出少了，降低工资他也能生存，人力成本就下来了。这跟当年的人口红利是一个道理。\n\n## 十五、人民币6.69：外资进来赚的是汇率\n\n接下来有一件特别重要的事：人民币升值非常快。今天美元指数都超过一百了，但离岸人民币已经到了 6.69。\n\n一定要关注这件事。这意味着今年年初进来买中国核心资产的这些外资，从汇率上就已经赚钱了。这个趋势形成以后，会有大量外资进来。\n\n不要拿港股说事。港股是联席汇率，美元加息港币一定跟着加息，不存在港币单独升贬值的问题。\n\n对应到股市：最核心、最稳定、有稳定现金流的那部分资产会获得高估值。因为这些人进 A 股，不是只赚 A 股上涨的钱，他们主要是要赚人民币升值的钱。\n\n现在想进来的资金额度非常紧张。国内的钱跑去纳斯达克，国外的钱想进 A 股。你别听人说\"A 股不能自由流通谁来\"，那是你不理解什么叫多元投资。\n\n如果中国不限制外资，美元和人民币的比值能干到一比三，然后中国就会面临日本\"失去的三十年\"：股市大涨，靠出口的中小企业全部破产倒闭，房地产先涨后崩，最后用三十年的时间给这一代人还债。\n\n因为人民币就会被\"货币化\"——大家把人民币买回去，像买黄金一样等着它升值。你印多少，都被买走收起来，等着升值完再卖给你；你印多少钱国内都不够用，国内通缩、没有流动性。跟当年日本一模一样。\n\n所以今天日本加息以后，当年被囤起来的钱慢慢回流，你会发现日本越加息越通胀、越通胀汇率越贬值。原来日本印的钱都跑国外去了，国内老通缩；现在一加息，钱慢慢回来了，你没印钱钱也多了，就开始通胀；通胀最终反映为购买力降低、汇率贬值。原来的循环是越印钱越升值、越升值越通缩，现在的循环是越收钱越通胀、越通胀越贬值。\n\n根本原因就是：在你没有形成独立、真正强大的国际货币能力之前，你就把自己当成了牛人，以为\"我随便印你们随便买\"。全世界能随便印、随便买的货币只有一个，就是美元。 其余任何一个国家说出这句话，都是灾难。\n\n1998 年亚洲金融危机，泰铢、各种盾为什么不行？因为货币没有闸门。索罗斯把英镑都阻击了。你知道当时韩国人多惨——让老百姓捐黄金，韩元贬得一分钱不值。\n\n## 十六、日本：越加息越通胀，越通胀越贬值\n\n按高市早苗的意思，放任日元贬值是解决日本问题的最好办法——不用加息、不用干预，就让国内出现一次比较大规模的通货膨胀。\n\n但问题是：第一，她拗不过国内财阀，坚持这一点就得下台；第二，她拗不过美国。贝森特好几次去日本，把日本财务相一顿臭骂，要求必须干预、不能让日元这么贬值——你日元贬值，我美国出口不就完了吗？你全是顺差，而且日本很多产业和美国是竞争的，日元这么贬，卖到美国的东西得多便宜，对美国产业冲击多大。\n\n两个力量你都拗不过，硬拗就两个结果：第一你的首相干不成，第二你活不成。安倍晋三两个都选了。所以这次真正动荡起来受损失的还是日本。\n\n## 十七、闲话几段：鲁迅、大黄与择偶\n\n鲁迅写\"门前有两棵树，一棵是枣树，另一棵也是枣树\"，有人说这不废话吗，直接说门前有两棵枣树不就行了？可文学不是为了传递信息，是为了渲染氛围，这两种写法的意境完全不一样。\n\n再举个例子：全世界只扔过两颗原子弹，第一颗是美国人扔的，第二颗也是美国人扔的；更要命的是第一次被炸的是日本，第二次被炸的还是日本。你换成\"美国两次往日本扔原子弹\"，氛围就完全不同了。这就叫文学。\n\n有人老拿我和大黄比，这对我说就跟吃屎一样。我不和任何人比，论坛上也没有朋友——萍水相逢哪来的朋友。前两天有人讽刺我\"你负责正确，大黄负责挣钱\"，我在底下回了一句\"那我祝贺大黄兄挣钱\"，这也被当成阴阳。阴阳就阴阳吧，能咋的。\n\n我把大黄屏蔽了——不是拉黑，是屏蔽。这事不怨大黄，但他评论区那么多人底下骂我，他也不管、还有互动；要在我评论区有人这么说，我早就把他踢出去了。我以前不怎么讲紫金矿业，多少是考虑大黄的感受，现在屏蔽了，我可以随便讲。大黄到现在也是我比较敬重的人。\n\n不过说句社会经验：能跑马拉松、能救助流浪猫、能把紫金矿业拿十年，这种人现实中相当不好相处，我相信他在现实中没几个朋友。这些人极容易成功，但极不好相处。好相处的是那种胖乎乎、笑眯眯、什么都不太在乎的。相处是相处，合伙做买卖是另一回事——好相处的人，大部分不会获得很大的成功。\n\n找对象也一样。小伙找女孩，一定要找稍微胖一点、有点糊涂、性格特别好、特别善良的，这就是最好的老婆。现在流行的审美——大长腿、锥子脸——从面相上看，这些人都很福薄。你看国泰民安脸就明白了。\n\n## 十八、收尾：这是评书，不能指导投资\n\n今天个股说得多，我讲的这些所有个股我现在都没有持仓，也不是推荐，只是用它当例子讲怎么投资。\n\n大家听就是一乐，别给我增加负担。你千万别跟我说\"我听了你的买了啥\"——这话对我来说五雷轰顶。不管在雪球还是 B 站，谁跟我说我跟你买了啥，我马上拉黑，赔了赚了都跟我没关系。\n\n我很珍惜和大家交流这个渠道，别弄得大家不愉快。我说的东西你也不敢保证都涨，涨了你也不保证能拿住。你跟我买了最后亏了再埋怨我，我多不合适，而且我这晚上觉都睡不好。\n\n好，关播，谢谢大家。","toc":["一、开场：情绪是能传染的","二、现在说一只股票，等于动了谁家的祖坟","三、大宗商品是货币现象，不是供需故事","四、囤铜：比买黄金更实在的实物投资","五、我为什么不告诉你们我持什么股","六、紫金矿业：一个被当成成长股的周期股","七、周期股的纪律：留足安全边际","八、\"留一手\"是最坏的习惯","九、明年有没有通胀预期","十、2024年9月18日，我在雪球喊了第二次底","十一、券商：当年最好的买点，现在是风险","十二、离房地产近的周期股，我这些年都避开","十三、美联储这次加息：点阵图、实质影响和血崩","十四、这次加息会击穿算力，而不是股市","十五、人民币6.69：外资进来赚的是汇率","十六、日本：越加息越通胀，越通胀越贬值","十七、闲话几段：鲁迅、大黄与择偶","十八、收尾：这是评书，不能指导投资"],"url":"https://www.bilibili.com/opus/1249260627589857305","bv":"","minutes":0,"chars":11808},"ai":{"title":"老木匠·2026年9月18日：周期、信仰与货币的逻辑","text":"## 一、紫金矿业为什么这么多年「不像周期股」\n\n1. 陈景河和陈发树，两个人的故事\n\n他讲了紫金矿业的来龙去脉：陈景河把一个县级小厂一步步带成了全球级的矿业公司；而陈发树最早是给紫金矿业干工程的，因为公司一度付不出工程款，干脆把他拉进来入股，后来才有了在香港上市这一段。\n\n2. 真正的转折点：低迷期赌了一把\n\n他说紫金矿业后来收购刚果金的卡莫阿卡库拉矿，正好是在有色金属经历08年高点之后的深度低迷期——那时候大型矿场普遍亏损，纷纷甩卖手里囤积的未开采矿产，紫金矿业和后来收购同一地区另一处矿的洛阳钼业，都是在这个阶段捡了便宜。他分析，当时紫金矿业其实是买不起的，很可能是国家为了矿产资源安全鼓励企业走出去而给了贷款支持，\n\n你别听他们后来说什么开采成本特别低、技术特别好，那都是后话——前提就是因为他是个小厂，去国外赌了一把。\n\n而真正让这一把赌博变成传奇的，是投产时机正好撞上了中国房地产和基建大发展带来的原材料需求井喷，铜价随之大涨。他强调这不是提前算准的：\n\n你要是预计到了会上涨，那你就不用买矿了，直接买期货比这挣得多。\n\n3. 邱国鹭为什么不投矿产公司\n\n他提到财经作家邱国鹭多年前专门讲过为什么不投矿产公司——矿产储量这种东西，本质上是没办法被外部投资者真正核实的，勘探报告说有多少吨，谁也没法把矿石一块块过秤验证，这和水产养殖里没法清点鱼虾产量是同一类问题。所以矿业投资本质上带有赌博性质，成熟的机构投资者大多不碰这类公司，连巴菲特都只投煤矿、石油，很少碰铜矿。\n\n4. 紫金矿业未来的增量在哪，这是个问号\n\n他抛出一个关键的问题：卡莫阿卡库拉这种级别的矿都已经投产了，紫金矿业未来还能靠什么再造一次当年那种跃升式的增长？他指出一个容易被忽略的陷阱——当年是在有色金属深度低迷期低价买矿才赌赢了，而今天紫金矿业如果继续扩张收购，买的是今天这个价位的矿，性质已经完全不同了，\n\n那你现在洛阳钼业这些也一样，都是在周期高点买矿，等下一个低点，这些资产都得计提损失。\n\n他还提醒，公司在低位的时候容易励精图治，一旦手里有钱了，扩张的冲动是很难抑制的宿命，这一点放在任何一家公司身上都成立。\n\n## 二、周期股不能买龙头：这次用具体的数字讲透了\n\n1. 洛阳钼业和紫金矿业，弹性完全不一样\n\n他建议大家自己去对比2022年这两只票各自的起点价格，再看后来的最高点，就能直观感受到弹性的差别——龙头因为拥趸太多、信仰太强，跌得不够狠，涨得也就相应有限，而这些信仰坚定的资金不肯离场，本身就说明散户很难在这类标的上占到便宜。\n\n2. 为什么也不能买行业末尾的公司\n\n他解释，末位公司虽然理论弹性更高，但也最容易在周期低谷中被直接淘汰出局，所以他提到邓普顿的逆向投资法作为参照——邓普顿专挑那些濒临退市、已经严重亏损的公司买，但从不押注某一家，而是买一揽子，靠组合分散来对冲个别公司真被淘汰的风险，只要其中有几家挺过来，弹性就足够可观。\n\n3. 「好股票」和「弹性股票」是两回事\n\n他用白酒举例：好的公司高点足够高，但低点往往不够低，就像茅台——如果哪天白酒真正认输见底，茅台反而不是最好的投资标的，五粮液、水井坊这类高点略逊但低点更低的公司，涨幅反而可能更夸张。他给出了具体数字：茅台从一百多涨到2600，涨幅有限；而五粮液从十七八块涨到400，水井坊从三四块涨到一百七八，弹性完全不是一个量级。\n\n4. 医药不是周期股，「万物皆周期」是外行话\n\n他强调这套弹性逻辑只适用于真正的周期股，医药不在其中。他还专门点了一句：\n\n所有说万物皆周期的人，一概都不懂周期股。\n\n## 三、什么才算真正的「卖飞」\n\n1. 他自己的标准和别人不一样\n\n他解释，很多人说的「卖飞」，是拿卖出价和后来涨到的最高价简单相减，但他判断卖飞与否的标准，是看结果是否超出了卖出当时自己预判的合理范围——如果卖出时就预计它还可能涨到某个位置，后来真涨到了，那不叫卖飞；只有远超自己当初的预判，才算真正判断错了。\n\n我13、14块钱卖的中国铝业，即便它再涨到30，我都没有任何感受，这在我的意料之中；但如果它从这个点涨到了100，那才叫我真正意义上的卖飞。\n\n2. 他举了自己历史上的几次操作\n\n洛阳钼业他三块多买入、12块卖出；云铝股份3.8块买入、8块多卖出；螺母（他没细说具体名称）5块5卖出后转投了当时更便宜的锡业股份；中国铝业7.5块买入、13块卖出。他强调这些都是很多年前的历史操作，不是现在的持仓，讲这些只是为了说明周期股买卖的逻辑，不是让人抄作业。\n\n## 四、心理账户：为什么盈利的股票要立刻删除自选\n\n他提醒，很多新手有个坏习惯——卖出盈利的股票后还留着自选，为的是记录自己曾经在这只票上赚过钱。他说这本身就是一种心理账户的误区：留着自选，未来大概率会把它买回来，而买回来的时候一定会不自觉地想起「我曾经在这只票上赚过钱」，从而放松对买入价格的警惕，还不如当成一只全新的票那样谨慎对待。\n\n你每天打开账户看到的净资产，全都是你的本金，没有一分钱是盈利——今天比昨天少了，这才叫亏损，这才是专业投资人的看法。\n\n## 五、通胀预期：中国的工具箱比其他国家多\n\n1. 美欧日只能靠货币手段，中国还能用行政和财政手段\n\n他解释，美国、欧洲、日本要调节通胀或通缩，基本只能靠加息降息这类货币手段；而中国除此之外还能动用行政和财政工具——通胀高的时候，可以强制水电煤气这类国企定价的公共事业不许涨价；通缩严重的时候，也可以反过来要求大型国企「反内卷」、不许低价竞标。\n\n他提到「六张网建设」是当前一个刻意被淡化宣传的方向，建议大家自己去想为什么现在只强调「含科量」而很少提六张网建设的受益板块。\n\n## 六、918：对他来说是个特别的日子\n\n1. 两年前的同一天，他喊过「冲」\n\n他回忆，2024年9月18日晚上10点10分，他在雪球发了一条短帖喊多，这是他做投资以来第二次公开喊「冲」（第一次是2015年）。那正是后来被称为「924行情」的起点，只是真正的爆发是从18号就开始酝酿的。他也提到自己在9月30号、十一假期前的最后一个交易日，把当时持有的三只券商股的融资全部清掉了。\n\n2. 券商这一波，是他讲过很多次的完整案例\n\n他回忆2024年之前券商被普遍看衰、被骂作「渣男」，甚至有券商从业者自己在直播里说这个行业没戏了；他当时反而认为整顿是为了让行业更健康，而不是把市场搞垮，坚持买入并且和不少人对骂过。等到2024年10月8号之后券商大涨、成交量创出天量，他又开始提醒风险，同样挨了不少骂——而且骂他的人，很多正是当年在低位被他劝着买入的同一批人。他说现在自己也没有持有券商，理由是成交量持续萎缩对券商是实质利空，一旦科技股这类自营盘常配置的资产开始下跌，风险会显性化。\n\n3. 对哪些行业不懂，他也坦白说清楚\n\n他说保险的财务报表他一直看不明白，核心价值之类的算法牵涉太多假设条件，自己判断不了哪些因素真正驱动保费收入；航运这些年也没跟踪，不敢乱评论。他重申自己避开的是那些离房地产、基建太近的周期股——建材、装饰、白色家电、工程机械、水泥、钢铁、焦炭，这些年一直不碰。\n\n## 七、这次加息：点阵图透露的信息\n\n1. 投票机制\n\n他简单介绍了美联储的票委结构：19人里7人是政府任命的理事，12人来自各地区联储银行，其中纽约联储行长常年拥有投票权，其余11家轮换、每次替换一部分，机制上有点像联合国安理会非常任理事国的轮换方式。\n\n2. 这次18人提交了点阵图，结果很明确\n\n16人认为今年剩下的时间还会再加息一次，其中4人认为会加两次，只有2人认为可以维持不变，没有人认为会降息——他据此判断，年内再加一次息的概率接近九成。他个人还判断9月的通胀数据大概率比8月更难看（因为9月油价才开始上涨），这会直接影响10月的议息会议，所以10月加息的概率也不低，有可能出现连续两次加息。\n\n## 八、加息前后那段时间的行情，可以先不看\n\n他提醒，从加息前几天一直到落地后大约一周，市场里活跃的主要是博小概率的赌博盘，这段时间的走势参考价值有限，需要等赌博盘的余波过去再看。他还解释了加息影响分两个层面：心理层面往往在加息落地之前就已经提前反映完了，真正落地的时候这部分反而会消退；但对实体经济的影响——融资成本上升、利润下降、消费走弱——才刚刚开始，要等下一轮数据公布才能体现出来。\n\n## 九、这次加息不是「第一次」，是没加完的那一次的延续\n\n他强调不要把这次加息当成一次全新的周期。这一次的加息进程实际上从2022年就已经启动，只是中间因为特朗普向鲍威尔施压而出现了波折、没有加完——从沃什上台那天起他就一直提醒大家，沃什接替鲍威尔本身就意味着特朗普在货币政策的博弈中已经落了下风，所以「美国一定不敢加息」这套逻辑的基础早就变了。\n\n越是加息前期市场表现出很强的抵抗性，根本不在乎你加，那你就继续加，最后累积到一定程度，就越容易演变成一次雪崩式的下跌。\n\n他提到2008年危机、2000年互联网泡沫破裂、日本当年的经济泡沫破裂，走的都是同样的路径——前期市场毫不在意、利空出尽反而涨，直到某个时点突然崩塌。他把这一点归结为自由市场经济一个逃不开的宿命，明确点了马克思生产过剩危机的理论：市场经济下产能扩张没有任何机构居中调控，一窝蜂扩产、一窝蜂崩盘、再重新洗牌，这个循环本身是破坏性的，谁也没法从中提前微调。\n\n1. 加息还会顺着利率往上传导，最终冲击中小银行\n\n他补上了一条容易被忽略的传导链条：加息会推高国债收益率，而很多中小银行的资产里持有大量国债——一旦国债价格因收益率上升而下跌，这些银行持有的资产就要面临重估贬值，同样规模的资产，账面价值却变少了。这种资产端的减值一旦累积到一定程度，就可能引发挤兑性危机，就像当年的硅谷银行、合众银行、签名银行那样。他说具体会怎么爆发、什么时候爆发不用去预测，知道这条链条上存在这个风险点就够了。\n\n2. 中国不会走「崩盘出清」这条路，靠的是「反内卷」\n\n他对比了中美两种不同的产能出清方式：美国这类自由市场经济，没有一个部门能出面叫停企业无序扩张——建数据中心也是一样，没有哪个机构能喊停，所以最终只能靠价格战打到全行业崩盘、破产退出，用最惨烈的方式完成出清；而中国可以通过发改委限制新增产能、推动「反内卷」，用行政手段主动让过剩产能有序退出，不需要等到系统性崩盘才能解决问题。\n\n你今天觉得产能自然出清是好事，那是你没考虑那些被出清的人——你要是那个被淘汰的光伏企业，你会希望政府别管吗？你一定希望赶紧有人出来主持大局，别让大家都死。\n\n## 十、房地产红利与算力红利：崩盘不是终点，是新公司的起点\n\n他用2000年互联网泡沫做了个类比：当年光纤通信基础设施建得太多，最终崩盘，但正是因为崩盘之后基础设施价格变得极其便宜，后来的互联网公司才能以极低的通讯成本运营，现金流转正，从而真正发展起来——微软、Meta、谷歌都是建立在那次崩盘留下的廉价基础设施之上的。他判断算力行业未来也会走同样的路：\n\n这些算力公司崩盘了以后，真正的大模型公司才会诞生，因为他们能用跳楼价租到算力，现金流才能转正——投资算力中心的那些人，钱打了水漂，但他们已经为人类做出了贡献。\n\n他把这个逻辑也用在了房地产上：现在很多房子降价卖，对购房者来说降低了未来的居住和创业成本，这也是一种红利——就像人口红利让企业用工便宜一样，房地产红利让房租和购房成本变便宜，会逐渐体现在企业利润里。\n\n## 十一、人民币升值：外资赚的不是股价的钱\n\n1. 离岸人民币已经破了6.69\n\n他提醒大家关注人民币升值这件事——美元指数已经超过100，但离岸人民币还在持续升值，这意味着今年年初进场买中国核心资产的外资，仅从汇率上就已经获利，这种趋势一旦形成，会吸引更多外资跟进。他特别提醒不要把港股和这个逻辑混为一谈：港币和美元是联系汇率，美元加息港币也得跟着加，不存在对美元升贬值的问题。\n\n2. 股市里最受益的是稳定现金流资产\n\n他解释，这批外资进入A股，主要不是为了赚股价上涨的钱，而是为了赚人民币升值的钱，所以最受益的会是那些最核心、现金流最稳定的资产，会获得比其他板块更高的估值溢价。\n\n3. 如果现在完全放开人民币，会发生什么\n\n他给出了一个警示性的推演：如果不限制外资、放任汇率自由化，热钱会把人民币当成黄金一样囤积、等着升值再卖出，导致国内印多少钱都不够用、陷入通缩；这和当年日本走过的路一模一样。他还提到1998年亚洲金融危机的教训——泰铢、韩元这些没有真正建立起国际货币地位的货币一旦放开管制，就会被索罗斯这类做空资金狙击，韩国当年甚至发动老百姓捐黄金救国。\n\n你的货币在没有真正成为世界第一之前，你要是把它放开了，你就是美国的血包。\n\n他说这也是理解今天日本困境的钥匙：高市早苗想放任日元贬值来解决通缩，但既拗不过国内财阀、也拗不过美国的干预压力，最终大概率只能在「首相干不长」和「本人活不长」这两个结果里选一个——他说安倍晋三是两个都占全了。","toc":["一、紫金矿业为什么这么多年「不像周期股」","二、周期股不能买龙头：这次用具体的数字讲透了","三、什么才算真正的「卖飞」","四、心理账户：为什么盈利的股票要立刻删除自选","五、通胀预期：中国的工具箱比其他国家多","六、918：对他来说是个特别的日子","七、这次加息：点阵图透露的信息","八、加息前后那段时间的行情，可以先不看","九、这次加息不是「第一次」，是没加完的那一次的延续","十、房地产红利与算力红利：崩盘不是终点，是新公司的起点","十一、人民币升值：外资赚的不是股价的钱"],"url":"https://xueqiu.com/2573414707/409935051","chars":5335},"topics":["紫金矿业祛魅","周期股纪律","加息血崩","囤铜逻辑","人民币升值"]},{"date":"2026-09-15","bili":{"title":"老木匠 2026年9月15日直播文字稿（技术崇拜、最优方案未必胜出、A股避风港、热菜还早、紫金观察）","text":"## 一、开场：加息的影响才刚刚开始\n\n早上好，刚回来把雪球上的回复看了一下——雪球上的回复我都会看。\n\n昨天的 A 股、晚上的外盘，还有金属价格，大家都看了吧。现在估计没有人说\"利空出尽是利好\"了。\n\n你以为加息的影响就结束了？其实才刚刚开始。 包括 AI 放缓的舆论，都是加息带来的余波。类似的\"黑天鹅式余波\"未来还会发生：突然公布某个月财报，某公司大幅不及预期；公布资本开支的时候也大幅不及预期——然后你就会想到：芯片和光模块还会有原来想的那么大需求吗？迭代速度还有那么快吗？铜铝硅锌还会用那么多吗？你都会重新评估。\n\n昨天美国科技股下跌，矿业公司也在跌，这个逻辑是连在一块的。\n\nAI 基础建设投资慢下来之后，对铜铝的需求——尤其是需求的预期——也会降低，这就把原来的投资逻辑破坏了。原来的逻辑是：AI 建设需要大量电力 → 全世界电力不足 → 需要电网建设 → 需要大量铜和铝。但如果 AI 基建慢下来，这个基础假设就要打问号，人们由信心满满变得狐疑，这个就会反映到价格里。\n\n这都是加息造成的涟漪。 加息的影响不是立马体现的，它会通过很多\"黑天鹅式的偶然事件\"引发出来。\n\n回顾历史上加息也好降息也好，金融市场都不是立即反映的。降息导致股市上涨也不是立即的——它先反映到上市公司业绩里，再反映到投资强度，再反映到经济热度，最后才反映到股市。 你最初看到的只是炒股票人的预期。\n\n但问题在于：你现在就能判断周四一定会加息吗？我告诉你，我依然判断不了。\n\n昨晚美国有个对经济学家团体的调研，90 多个人里有 80 多个认为这次一定会加息 25 个基点。各种预期基本上都认为加息板上钉钉，但对我来说它仍然是个概率。\n\n我个人从来都是按\"加息概率最大\"来准备的：清掉融资、选择标的，都是按未来全球（美联储、日本、欧洲）都进入货币紧缩阶段来准备的。 货币紧缩之后市场上流通的货币会减少，影响会逐渐显现。\n\n但货币减少的影响不全是负面的。 加息会让某些行业的资金被挤出来，这些资金会去找别的投资渠道——所以有些东西实际上是受益于加息的。\n\n你看昨天美股：消费股和医药股是上涨的，我们周一的药股也上涨。昨天市场主要是科技股权重股下跌拖累的——实际上上涨的股票并不少（A 股上涨的可能还比下跌的多一点），但指数还是跌，因为权重股跌得多。\n\n光模块这些下跌我昨天早晨讲过了：它们最受益于 AI 建设，也就最对标美国科技股。 而单从科技股角度看，我们现在的泡沫应该比纳斯达克还大。 当然，A 股这轮是结构性牛市，大部分蓝筹和周期股其实还在底部。\n\n## 二、A 股会不会成为避风港\n\n还有一个特别有意思的现象：昨晚 A50 期货和恒生指数期货是涨的，即便纳指、道指在跌，我们的指数期货是涨的。\n\n这让我想到我一直给大家验证的那个判断：未来 A 股会不会成为一个避风港？我认为这种可能性非常大，而且越来越大。\n\n而且我认为：一旦外资开始进入港股或 A 股，他们绝对不会再买和美股对标的这些行业。 因为如果他继续投资科技，他就应该留在美股；他从美股流出来就是为了避险，怎么可能到中国还买科技呢？\n\n纳斯达克那些当红辣子鸡——闪迪、美光、超威、西部数据、光模块那些——如果他们从这些东西里流出来，这个行业会受影响，中国相应的行业也会受影响。 而现在中国的牛市正是这些对标行业引发的。\n\n所以外资进来，我认为不会买对标标的，而是买 A 股的蓝筹股。\n\nA 股成为避风港还有一个原因：人民币在持续升值，外资来是要赚人民币升值的收益。\n\n（顺便说一句：明天早晨不播了，因为明天晚上要直播，嗓子受不了。以后白天的公开直播就固定在早晨八点半，讲够两个小时、十点半左右下播。）\n\n## 三、今天要讲的是\"技术方案\"问题\n\n今天主要讲技术方案——怎么认识技术迭代，以及它在经济上的应用。\n\n先说个事：以后雪球上的长文我会慢慢少写。 写文章传递信息非常有限，很多人读文字理解起来很困难。像这种长逻辑、细节多、来回磨叽的东西，我可能都放到直播里讲。\n\n口头讲有个好处：容易懂。 代价是有时候不够严密，但主要是为了让你懂——我要讲得特别严密，就成了照书本念了，你就懂不了。很多大学老师没理解这一点，总想讲得像学术论文一样严密，学生就听不懂。\n\n## 四、AI 放缓的三种解读\n\n今天市场的直接诱因还不是加息，是那三个大佬突然说 AI 迭代要放缓。 他们说的理由很高大上：迭代过程中产生了很多安全隐患，为了人类安全应该放慢速度。\n\n对这件事的解读大概有几种：\n\n第一种，我倾向的：AI 烧钱速度太快，已经和国债争夺资金了，这种状况不可持续。\n\n它直接导致了国债收益率升高、实际利率升高。因为他发债，美国国债也发债，市场上资金就那么多，发的债太多，利率自然上去。利率上升，美联储加息不过是顺理成章的事。 否则你的名义利率和实际利率就脱钩了，反映不出实际局面。\n\n所以即便美联储不加息，现在实际利率也已经是加息的了。 资金已经很紧张——这叫利率，它是资金的价格，不是数量。 而价格已经很高了。\n\n你在融资搞 AI 基建（建智算中心、自建发电站）的时候，成本已经开始上升，现在不停下来，你自己就崩了。 再按这速度融资建智算中心，你最终的现金流连利息都还不上——你净现金流现在已经是负的了，别提还本，连利息都覆盖不了。这才是问题所在。\n\n第二种： 国内一些偏\"公知\"的人认为，美国人比较负责，发现 AI 出现危险时人类的道德之光又起作用了，主动放慢速度体现了负责任的心态。一般这么说的人，同时会指责中国继续投入 AI 是不负责任。\n\n这事儿以前在新能源上已经出现过一次了。 当年脱碳目标最初是美欧搞出来的，讲碳排放指标、净零排放、地球变暖，振振有词，站在道德制高点上。\n\n当年有个前央视主持人柴静采访过我们的院士丁仲礼（现在是全国人大副委员长），那个采访我看过很多次。 柴静一直追问：如果所有中国人都享受美国人的生活，地球就会毁灭——意思是中国必须脱碳，不能再追求高生活品质了。\n\n丁仲礼问了一句特别提气的话：中国人是不是人？\n\n既然都是人、讲人人平等，你根据什么说美国人能享受碳排放指标、我就不能？我那时候就对丁院士肃然起敬，也从此非常讨厌柴静这个人。\n\n后来的故事大家都知道了：中国也加入了，也努力在做，新能源转型转得非常好。结果现在情况变了——美国退出了当初倡导的京都议定书，特朗普说\"地球变暖就是个骗局\"，回归传统能源，大量烧石油、烧煤、烧天然气往大气里排碳。\n\n那你柴静当年把美国当灯塔、说他们特别负责任的那套基础假设，就已经不存在了。 现在反倒是中国很负责，\"3060\"指标一直没变。而欧洲呢？当年提 2035 年禁售燃油车，现在还有人提吗？打不过就开始改规则。\n\n举个更典型的例子：自由贸易最初是美国倡导的——所有国家都不该有关税壁垒，自由贸易是对全世界最大的贡献。等自由贸易搞起来、你发现进口产品竞争不过人家的时候，你就开始玩别的了。这事儿第一次是在日本身上玩的（逼迫日元升值）。到中国这儿，\"你让人民币贬值\"说不明白了，干脆直接加关税——而且是针对全世界加。\n\n那你柴静当年假设的美国灯塔在哪儿呢？\n\n我们这一代人（我在年轻的时候美国确实是灯塔）心里形成了\"美国是灯塔\"的成见，要改变这一点非常难。像我当律师的时候，对美国法律制度崇拜得五体投地，那个波士顿律师的电视剧我看过 n 遍。\n\n但我今天不但怀疑美国的法律，甚至怀疑\"法治\"是否是解决社会矛盾的唯一办法。 我现在的观点是：法律甚至不是解决社会矛盾最有效率、最经济有效的办法。 任何一门生意，如果最后靠诉讼来解决纠纷，都意味着这生意的失败；朋友之间开始用法律讲理，就意味关系的崩塌。\n\n法治是个奢侈品，得是社会非常非常好的时候才能玩的东西。 欧洲就是典型的例子：中美都在搞 AI 竞赛，欧洲在给 AI 立法。 欧洲规定鲨鱼不能用锤子敲脑袋，得用药晕过去，因为不人道——我觉得吃鱼就不人道。\n\n第三种：认为这是烟雾弹。 就是学渣学霸那个例子：大家都说\"明天不写作业\"，结果最后只有你自己没写。这种计谋对中国来说太简单了，我们的棋谱里都写烂了，属于江南七怪用的低端招数。\n\n## 五、他们不是想放缓，是融不到资了\n\n我倒认为：这些人出来讲这些事儿，压根没啥影响。我也不认为他们说完就会主动放缓。\n\n但会不会放缓？会放缓——不是因为主动想放缓，是因为融资实在太贵了。\n\n今天市场的反应也不是\"相信他们会放缓\"，而是大家通过他们的言论终于认识到：再这么烧钱下去，这事就不能再持续了。 你从他们的发言里已经看出来他们很累了。这才是资本市场看到的东西。\n\n他们不是因为有道德而放缓，是不得已。\n\n那我们会不会放缓？你看昨天外交部发言人的发言就知道了。 我们已经明确告诉你：别扯那一套不负责任、又危险的说法，你一会儿搞不正当竞争、一会儿扯威胁论——我们先把大门给你堵上了。 你愿意觉得不安全就放缓，拿这个绑架我没用，我认为没啥危险。\n\n当然我们要强调：中国和美国在 AI 大模型上还是有很大差距的，我们还是追赶的局面。 有人以为我说中国领先了，没有这回事。\n\n我们就像阿甘一样：你觉得你累了、呼哧喘气、弯下腰跑不动了，我们没事儿，我们还能跑，也不知道累。\n\n昨天外交部专门为一个商业舆论答记者问、还在各媒体上发——那不是随便答的，发什么不发表什么都是有目的的。 我们就是先把路堵死：你别拿道德、拿\"安全\"来绑架我。\n\n我有的是钱，你没钱了你就说你没钱了。 我们压根也不想跑第一，我们主要防的是你剥削全世界，只要把这条路堵死就行。AI 能不能成我不管，我的目的就达到了——所以我干的都是开源的。\n\n最近沙特等国都在中国开源的基础上建自己的大模型，这就是中国的目的：我根本没想干成这件事，我是让你干不成。 你要跟我卷价格，你卷不过中国——研究高科技我不如你，卷价格你干不过我。\n\n（顺便回应一句：A 股和港股 ETF 里，有些是最近发行的算力基础设施 ETF 在建仓，所以现在科技股的交易是失真的，不代表真实的交易结构。 等他们建完仓再看。）\n\n## 六、技术崇拜：技术人员为什么创业容易失败\n\n从 AI 这事想到另一个问题：搞技术的人对技术总是有一种崇拜。\n\n所以很多技术人员创业时经常走向\"技术追求\"的极端，反倒失去了商业化的机会。\n\n（这里他批评了但斌等人：） 但斌认为这是安全问题，因为他买的很多东西下跌了。但斌懂技术吗？他是学体育的，原来讲\"时间的玫瑰\"——他是做私募的，收的是管理费，不需要靠炒股赚钱，你知道这个就明白他为什么这么说了。\n\n在商业领域里，并不是技术最先进的就一定会胜出。\n\n学科学技术史有个绕不过去的话题：一星（注：卫星通信）系统。 当年邓公提出\"科学技术是第一生产力\"的时候，大家对科学技术有崇拜。原来大学里有门课叫技术经济学——研究技术的时候也要考虑成本、转化、转化效率。但提出\"第一生产力\"之后，就开始搞\"科学技术至上\"了。\n\n其实对一个企业来说，最适用的技术就是最好的——能最快商业化、最快满足应用需求的就是最好的。\n\n有人说人家那大模型特别好，解数学方程比数学家都厉害。那我问你：发展 AI 是让它解数学题的吗？ 有多少老百姓会用 AI 解数学难题？你花大价钱研究出来只是为了攻克哥德巴赫猜想，这有什么实际意义？钱谁出呢？\n\n我告诉你，AI 最终出钱的就是那些拿它写总结、写文章、聊天、问病的人。 搞科学研究是非常小众的系统。\n\n这跟卫星通信是一个道理： 有几个人会在大洋深处、亚马逊丛林里用卫星通话？你那个东西原本只要满足聊天功能就够了，非要让它当科学家——对大部分人来说没有意义。\n\n所以中国走的是另一条路：尽快做出来、尽快让人用。 豆包现在就能解决大部分问题。你不要强调豆包比 OpenAI 那些\"渣渣\"——没几个人会用你那个东西。\n\n就像手机：有几个人买手机还考虑跑分多少？ 你买苹果是冲着品牌、冲着软件生态、冲着它代表的文化去的，你关心它芯片是几纳米吗？大部分人买新款手机，百分之十的功能都用不上。\n\n你们的手机最终是因为功能跟不上被淘汰的吗？ 不是，是出新品了你就换。我买手机从来买次新款——出 90 我买 80，出 80 我买 70。能用就行。笔记本电脑也一样，我用过的就没有一台把硬盘用到十分之一的。\n\n当然，你要玩 3D 游戏、要做 CAD 设计，那确实需要好配置——但那是小众市场。\n\n你要对技术理解全面。 很多技术人员在公司里地位并不高：大公司出 CEO 的就两个部门，一个是财务部门，一个是销售部门。 有几个总工程师能当上 CEO 的？他考虑的全是技术问题，卖不卖得出去跟他没关系——那你公司不卖东西，吃啥喝啥？\n\n## 七、做买卖的人有情怀，是最要命的\n\n我最怕的就是做买卖的人有情怀。\n\n很多有艺术气质的人想开餐厅、酒吧，最终都黄了。因为他们在做买卖的时候先考虑的是自己——动不动就\"我这个餐厅要有情调\"，装修得超凡脱俗，结果生意最差。\n\n老百姓来餐厅就是吃个饭，装修超不超凡脱俗没关系，主要得把饭做好吃。 我认识不少搞艺术的（作家、画家）非要搞个超凡脱俗的餐厅、咖啡馆、酒吧，我说我劝你别整了，你不是那块料。\n\n技术人员也一样：所有的技术人员都有\"技术完美\"的倾向。 我当年学理工科的时候也是一样，东西不做得特别完美自己都拿不出手。\n\n但对公司来说：你做得再完美，得花钱，谁来花？你做得再完美没人买单，有什么用？你把哥德巴赫猜想攻克了，你卖给谁？\n\n现在美国出现了个特别魔幻的局面：特朗普反对\"AI 放缓论\"，说那些威胁都是骗子、是胡扯。特朗普是靠红脖子选上去的，结果现在他成了支持 AI 的人——AI 一旦发展起来，第一个受损的就是红脖子。\n\n因为 AI 投资带来了美国 GDP 数据的非常好看，现在美国的 GDP 数据全靠 AI 投资支撑着。 美国是最典型的 K 型分化。\n\n而民主党变成了反对的：昨天奥巴马出来站台说 AI 太危险、必须放缓、必须审查。这世界现在充满了诡异的气息，我真是越来越看不懂了。\n\n## 八、看不懂就离远点：我拿的是霰弹枪\n\n所以我离得远点。\n\n到现在为止，世界市场的走势和我预期基本差不多。未来会不会变？我不知道，走一步看一步，谁也别试图看多远。我不像他们能看十年，我连两天都看不了——明天美联储说不加息了，我所有的观点全变。\n\n我也不认为他们说的放缓就能缓下来，这点我和很多人想法一样。除非他融不到资；融到资他就继续大干快上。\n\n今天科技股开盘都是红盘，虽然涨一点点，很多人说\"这次加息就是做做样子、以后就不会加了\"。大家都这么说的时候，都是瞎猜。我不会猜。\n\n我认为他们说的也不是没道理，但我猜不出来。没根据的话我就不去猜，得看他以后是不是还加。\n\n你这种没根据的话猜完了，无非是给自己壮胆——这么说的人，第一是给自己壮胆，第二是准备赌一把。这两件事我都不干。\n\n我必须等大象出来才能开枪。 巴菲特早就告诉你了：你不得等大象出来才能开枪吗？ 我拿的是霰弹枪，打不准——目标是散弹枪，得离得近，不用瞄太准，大概方向搂一枪就完事。 你们那些配着瞄准镜、准备在楼上趴着狙击的，你那霰弹枪配个瞄准镜有屁用啊，你那枪就不准。\n\n## 九、最优的技术方案，未必能胜出\n\n两个技术方案的问题：不见得最先进的就是最好的，极有可能是你最适用的才是最好的。\n\n例子一：VCD 和 DVD。\n\nDVD 是日本搞出来的，技术上完全不在一个量级——DVD 分辨率、画质比 VCD 强太多（LD 那种还是模拟信号，像唱片、录像带；VCD、DVD 都是数字化的，VCD 清晰度非常低）。但 VCD 在中国做成了大生意，DVD 在中国一直没发展起来。\n\n结果最后 VCD 也没了、DVD 也没了——网上播放了，这东西根本不存在了。 你花那么多钱研究最优技术方案，其实并没赚来多少钱。你要是在中国拘泥于\"我必须做 DVD\"，你就错过了整个时代。\n\n例子二：留声机。\n\n爱迪生发明留声机，最初想解决的是\"记录\"问题——录音，做记录。但真正让留声机发扬光大的，是音乐，跟记录没关系。 后来谁还拿录音机去录音？都是直接放音。\n\n例子三：短信。\n\n中国电信、中国移动搞的短信，原本用来传递信息，被微信竞争没了，但它在\"安全验证\"上获得了新生——现在的短信都是用来发验证码的。这是它最初能想到的吗？\n\n例子四：氢能源 vs 锂电池。\n\n我现在也认为氢能源是最佳方案。锂电池对环境非常不友好：所有电池都在解决储能问题，而储能都是氧化还原反应。 你充电是还原、放电是氧化，氧化后的废物对环境不友好，所以必须用封闭的壳子装起来——车开出去得把介质带着，排完的废物还得拉回来，这本身就不经济。\n\n氢能源是最经济的，因为它的废物是水，直接排放到大气里，回来加氢的时候大气就把水带回来了，那边再电解水就行。锂电池就像一个人出发时不仅把吃的带着，还得把粑粑尿都背着。\n\n但日本人最大的错误是：把氢能源专利全注册了，形成严格的专利壁垒。 中国要进去就得交大量专利费。结果导致大家都不用。 这让我想到比尔·盖茨的聪明：当年有人说中国人用的微软全是盗版，盖茨说\"就让他们盗版，盗版之后他们就形成路径依赖了\"——如果微软一进中国就是全收费软件，根本发展不了这么大。\n\n日本人就是战术厉害、战略老失败。\n\n例子五：GSM。\n\nGSM 是最垃圾的技术方案——在城市里建无数天线互相连，覆盖范围就一点点。但最后就是 GSM 发展起来了，就是蜂窝电话、就是我们现在用的手机。 谁没事跑太平洋中间去打电话？没信号能咋的？\n\n现在马斯克搞星链、中国也搞星链，针对的是特殊需求（军事、航海、物流），而且是因为有了可回收火箭，发射卫星变便宜了。 一星那个年代你没有可回收火箭，怎么便宜发射卫星？技术方案和原来也不一样。\n\n所以千万不要对技术过于崇拜。\n\n## 十、淹死的都是会水的：别投资自己最懂的行业\n\n投资上还有一点特别要注意：你是某个技术行业的专业人士，投资自己本行的股票时一定要格外小心。\n\n不要对自己掌握的技术产生崇拜。这种人特别容易形成巨大亏损。\n\n我认识一些人，因为他是这行里的人，对自己这行的技术方案特别迷恋，于是大量投资，结果失败了。他失败不是因为不懂技术，而是没有把\"投资人\"和\"技术人员\"这两个身份区分开。\n\n作为技术人员、作为创业者，你按自己的技术方案去创业，这是对的——那是一种赌，万一赢了呢？但作为投资人，你不需要赌这件事，因为你投资的最大优势在于\"选择\"，不在\"研究\"。\n\n我非常反感有人一投资某个东西就给人家出主意说\"你这生意应该怎么做\"。 你投资的优势就是选择——谁胜出了我就投谁。\n\n巴菲特投苹果是什么时候？投谷歌是什么时候？他会不会在谷歌、苹果很小的时候投？根本不投，他不赌。\n\n巴菲特投资只有两个时候：第一，你他妈要死了、没办法了，这时候投你，价格极端便宜；第二，你在这个行业已经胜出了、没人能和你比了，我再投。\n\n你以为巴菲特懂谷歌研究啥？你问他他懂吗？苹果用几纳米芯片，你问他懂不懂什么叫纳米？\n\n你是投资人，别把自己当成技术人员。这叫\"淹死的都是会水的\"。你越觉得自己懂技术，投资技术越容易亏。\n\n你真不如那些啥都不懂的人——不懂的人他害怕，不敢乱投。你啥都懂，光模块 1.6T 你都懂，过两天技术方案变了，人都不需要光模块了、玩 CPO 了，你怎么玩？你懂的那点东西很快就过时了。\n\n（顺便说一句：中继续创的融资余额基本上没变。易中天这些的融资余额都没有太大变化。所以有人说\"是不是该上热菜了\"——我认为还早，必须得在融资发生变化的时候才开始上热菜，现在还是凉菜阶段，不服的人还多着呢。）\n\n## 十一、每一代最后消灭的都是不服的人\n\n每一代最后消灭的都是不服的人。\n\n当年白酒刚开始下跌，不服的人多了：\"我就不相信他还能跌多少。\"你看五粮液能跌多少。\n\n当年房地产不行、万科下来的时候，\"我就不相信他还能跌到八块钱\"。当年我说四块钱的时候我去冒冒险试试，那家把我嘲笑的，现在三块钱我都不敢试。\n\n当年认为不能跌多少的人多了去了。 现在还能跌多少？我不知道。我早就不看空白酒了，这我在雪球上说过——我现在不会买它，但我不看空它，我在等一个机会，等一个特别能占便宜的机会我再买入。\n\n说起万科：我当年二十多块钱买过，很快十八块多就全卖了割肉，还亏了不少。刚开始跌的时候我认为\"别人都挺不住，万科还是能挺住的\"，后来一看他也挺不住。后来有一年年初万科债券出问题，那时候股价还九块多。\n\n那时候我讲了个\"何不食肉糜\"的故事。 有人说债券出问题、股价这么跌，那我就靠吃股息回本呗。我说你知道\"何不食肉糜\"为什么荒谬吗？因为没有粮食吃的时候，就一定是没有肉吃。\n\n万科连债券都还不上了，拿什么给你分红？ 当债券出现危机的时候你还等分红，不是胡扯吗？股息也是变化的，没有一个简单的公式。\n\n任何试图把投资简单化的想法都是错误的，复杂的问题没有简单的答案。\n\n你说我买入就不动行不行？不行。我天天做题行不行？不行。我天天做波段行不行？不行。具体问题具体分析。\n\n有的村适合打地道战，有的村适合打地雷战。 你在山区打个屁地道战，你能挖出地道来吗？打地道战得在华北平原那全是黄土才行。\n\n伟大领袖早告诉你了：具体问题具体分析，实践是检验真理的唯一标准。 你们没事多看看《毛选》、《孙子兵法》——那比看那些自媒体强多了。\n\n读书少你自然不明白，读多了就明白了：书刚开始越读越厚，后来越读越薄。 一类书读多了，一翻开头你就大概知道观点，可以跳读、整页整页翻。大部分人的书里真正有内容的东西连四分之一都到不了，剩下都是佐料——跟辣子鸡丁差不多，大部分都是辣椒，鸡丁很少。\n\n## 十二、科技股现在失真了\n\n今天科技股还挺强，强不强都没用，加不加息都没用。\n\n科技现在到底了吗？我写过一篇文章你没看——\"不长记性\"，看完也没记住。\n\n科技现在到底了吗？我不知道。 我早年就在雪球写过文章，还没下跌的时候就写，那时候就给大家打好预防针：科技股天天涨的时候并不危险，危险的时候是他腰斩的时候、跌百分之四十的时候，那才最危险。\n\n这两天科技股有一点失真：因为前一阶段发的那些算力基础设施 ETF 在建仓，等他们建完仓你再看。所以现在它并不代表真实的交易结构。\n\n就像今年年初有些股票持续下跌，也不代表真实的交易结构——那是因为证金、汇金一直在卖出。 国家给他们定的是退出任务，那他就只负责卖，根本不在乎价格，也不是来赚钱的。\n\n真实的交易结构，是市场双方博弈、按理性选择做出来的。\n\nETF 根本不择时。 它是被动基金，建仓的时候就要买、买够拉倒。它考核的不是挣不挣钱，而是跟踪指数的拟合程度——沪深 300 ETF，指数涨 2% 我也要涨 2%，跌 2% 我也跌 2%，这才叫成功。所以算力 ETF 发完了就马上买，它不管价格高低。\n\n你没发现有不少算力 ETF 发行得并不好？国家这么推，最后发了十个算力 ETF，募集资金并不多——现在傻狍子也不够用了。 有不少是提前结束募集的，没结束的就延期、干脆不发了。赶紧递进去，能整到啥程度算啥程度，不行就踩刹车。\n\n下一步：长江存储、长鑫存储上市，这些都弄完了，就完事了。时间紧任务重。\n\n## 十三、踩刹车不是踩油门：加息的受益与受损\n\n踩刹车解决不了趋势。 为什么我说是踩刹车不是踩油门？刹车是说你跑太快了点一脚，它并不会改变方向。 你踩完刹车就倒车了？不可能。刹车只是为了让他跌得慢点，仅此而已。\n\n加息是不是利好？最终都是——看买啥呗。有些东西加息就是利好。\n\n加息的时候，资金从\"加息利空\"的板块里被挤出来，需要找地方避险。避险板块——医药、消费（尤其是必选消费）——多多少少是有利的。\n\n最不利的是：\n\n周期类、世界定价的东西（有色、大宗）\n\n长久期的东西：科技这类需要大量融资的\n\n加息最有利的很明显就是银行——利息差会增加。\n\n观察是一个很长时间的事，加息不是一两天就反映完的。 你之所以经常看不懂，是因为你用的时间轴不对——你的时间刻度跟真正的反应周期不一样。 你觉得\"为什么加息了今天还涨\"，你看的时间太短了，得看长。\n\n（关于大资金：现在科创 50 ETF 量比都起来了，肯定有资金在干预介入；也有可能是算力 ETF 在建仓。所以现在没法看，得等他们建完仓。）\n\n特别有意思的是：加息/降息消息出来的那一刹那，波动特别好玩。 你经常发现它先往一个方向走，再往反方向走，然后回到正向。你可以通过那个观察美股、黄金、铜、各种指数、美元指数、日元汇率的变化。不过我的软件都是免费的，有延时（一两分钟甚至有十分钟），看得不那么仔细。\n\n## 十四、紫金矿业的论坛，消停了\n\n我这两天看紫金矿业的论坛，消停一点了——喊口号、表现雄心壮志的人少了一些。\n\n顺便说几句别的：\n\n写文章要写短。 如果你用一万字能写明白，就努力压缩到一千字。文章写长非常容易，写短不容易。 但你必须写短才能抓住人——谁会看你那种像论文一样的文章？ 自媒体上不光要通俗易懂，还得短。\n\n有人抬杠说\"你也没有数据呀\"。我数据还用我写？你自己随便去查，豆包比我全。 我写文章想要数据还不容易？关键是你要把数据之间的关系讲明白。\n\n真正要数据的时候，人自己会去找；你把数据罗列出来了，那数据之间是什么关系？你能分析清楚吗？ 你无非就是拟合一下，然后得出结论\"黄金上涨的时候都是加息周期，所以加息有利于黄金上涨\"——这都是狗屁不通的逻辑。\n\n你要真了解一个行业，得去找那些\"卖兽药的、卖饲料的、卖猪崽的\"人聊，才能真正了解这个行业的发展状况。\n\n（这里他特别强调：说话要就事论事，不要指名道姓说人。\"静坐常思己过，闲谈莫论人非\"，古人告诉你多少年了。我最反感这种背后说人的，你有什么意义？说事儿就说事儿。我这论坛里说的事都是挣钱的事，你动不动就来争个高下、谁对谁错，我从上班那天起就烦这事儿。）\n\n## 十五、收尾\n\n好了，还有几分钟下播，我看看盘——今天这两个指数都翻红了。\n\n我说过了，注水口变成出水口了。\n\n都别跑，把\"评书\"给我打在公屏上。\n\n我说的所有东西都不能用来指导投资，提到的个股更是不能用来指导投资。所有内容都是虚构的，讲的是评书。\n\n声明一下：我不是经济专家，不是金融专家，更没有投顾资格，讲的是评书。 谢谢大家的礼物、点赞、粉丝灯牌。\n\n明天早晨不播，明天晚上见。\n\n再见。","toc":["一、开场：加息的影响才刚刚开始","二、A 股会不会成为避风港","三、今天要讲的是\"技术方案\"问题","四、AI 放缓的三种解读","五、他们不是想放缓，是融不到资了","六、技术崇拜：技术人员为什么创业容易失败","七、做买卖的人有情怀，是最要命的","八、看不懂就离远点：我拿的是霰弹枪","九、最优的技术方案，未必能胜出","十、淹死的都是会水的：别投资自己最懂的行业","十一、每一代最后消灭的都是不服的人","十二、科技股现在失真了","十三、踩刹车不是踩油门：加息的受益与受损","十四、紫金矿业的论坛，消停了","十五、收尾"],"url":"https://www.bilibili.com/opus/1248129728311722003","bv":"","minutes":0,"chars":10786},"ai":{"title":"老木匠·2026年9月15日：技术越先进，产业就越领先吗","text":"## 一、加息的影响才刚开始：还会有更多「黑天鹅式」余波\n\n1. AI放缓的舆论，本身就是加息的余波之一\n\n他说不要以为加息的影响已经结束了，其实才刚刚开始。像这两天关于AI迭代放缓的讨论，本质上也是加息带来的连锁反应之一，而这种偶然事件式的余波未来还会陆续出现——比如某家公司公布财报大幅不及预期，或者公布资本开支大幅缩水的时候，市场都还要重新调整一次。\n\n2. 由此牵连的是铜铝的需求逻辑\n\n他解释，原来支撑铜铝上涨的核心假设是AI建设需要大量电力、电网扩建需要大量铜铝；一旦AI基础设施建设放缓，这个需求预期就要被重新打问号，这也是为什么昨晚不仅芯片光模块在跌，矿业股也跟着跌——人们从原来的信心满满变得开始狐疑，这种情绪变化会直接反映在价格里。\n\n3. 加息、降息的影响传导都有一个固定的顺序\n\n他提醒，无论加息还是降息，金融市场都不会立即反应——最先反映到上市公司业绩，然后是投资强度，再往后才是整体经济的热度，最后才传到股市。最初的股价波动，其实只是炒股的人自己的预期在提前反应而已。\n\n## 二、不是所有行业都受伤：资金会挤出去找避风港\n\n1. 消费医药反而受益\n\n他提醒不要以为加息对所有行业都是坏消息——原本投在受冲击行业里的资金，被挤出来之后会去找别的出路。他举了当天的例子：美股里消费股和医药股是上涨的，A股当天上涨的个股数量其实并不比下跌的少，只是权重最大的几只科技股跌得太狠，把指数拖了下去。\n\n2. A股这次的科技泡沫可能比纳斯达克还大\n\n他分析，由于国内科技股本身就是对标美国科技股炒起来的，一旦美股这边放缓，A股对应板块受到的冲击可能比美股本身还剧烈——单从科技股这个角度看，他认为现在国内的泡沫程度未必比纳斯达克小。\n\n## 三、A股会不会成为资金的「避风港」\n\n他注意到一个细节：即便前一晚纳指道指在跌，A50和恒生指数期货反而是涨的。他重申了自己之前的判断——一旦境外热钱因为避险从美股流出，进入A股或港股的这部分资金，大概率不会再去买那些和美股科技对标的板块（否则他们留在美股就好了），而是会去买蓝筹股，一方面图个避险，另一方面也是为了赚人民币升值的收益。\n\n## 四、AI放缓传闻：三种解读，他信哪一种\n\n1. 他自己倾向的解读：不是不想烧，是烧不起了\n\n他认为核心原因是AI建设烧钱的速度已经在和国债抢资金，直接推高了国债收益率和实际利率——名义利率还没动，实际利率已经涨上去了。融资成本一旦上升，继续按现在的速度建数据中心，账面现金流可能连利息都覆盖不了，\n\n你现在不停下来也不行，你不停下来你自己就崩盘了。\n\n2. 他不认同的一种解读：「美国是负责任的灯塔国」\n\n他对这种说法很不以为然，还联想到当年碳排放议题上类似的争论。他提到多年前一段经典的采访——主持人追问一位院士，如果所有中国人都过上美国人那种生活，地球会承受不了，所以中国应该降低标准；院士反问了一句\n\n中国人是不是人？\n\n他说后来的事大家都知道了，中国认真推进了新能源转型，而美国后来退出了当初自己倡导的气候协议，转头继续大烧化石能源——所谓「灯塔」的说法，连自己都没能坚持住。\n\n3. 第三种解读：这是放给对手看的烟雾弹\n\n他觉得这个解读有点道理，但没那么重要——即便真是烟雾弹，这种「大家都别学习」式的小伎俩，对中国来说太简单了，一眼能看穿。他的判断是，AI迭代大概率确实会放缓，但不是因为几位大佬嘴上说的「为了人类安全」，而是因为真的融不到那么多钱了——资本市场看懂的也不是他们说了什么，而是从他们的表态里读出了「已经很累了」这个信号。\n\n## 五、法治是个奢侈品\n\n他讲了一个自己观念转变的过程：年轻时当律师，对美国的法律制度崇拜得五体投地，现在他却开始怀疑法治是否真是解决社会矛盾最有效率的办法。\n\n任何一个公司做生意，如果要靠打官司来解决问题，那本身就意味着这笔生意已经失败了。\n\n他把这个逻辑延伸到国家层面：法治是社会发展到一定阶段、大家都不缺资源竞争的时候才玩得起的东西——他举了欧洲的例子，中美都在拼命卷AI竞赛，欧洲却在忙着给AI立法，这恰恰是欧洲逐渐走向没落的一个缩影。\n\n## 六、技术崇拜的陷阱：淹死的都是会水的\n\n1. 懂技术的人，反而更容易在自己熟悉的领域栽跟头\n\n他提醒，技术行业的从业者投资自己所在的行业时要格外小心——不是因为不懂技术会吃亏，恰恰相反，是因为太懂、太容易对自己掌握的技术方案产生迷恋，把「技术人员」和「投资人」这两个身份混在了一起。\n\n作为技术人员，你按自己的技术方案创业，这是一种赌，赢了就大富大贵。但作为投资人，你不需要赌这件事——你的优势在于选择，谁胜出了投谁。\n\n他举了巴菲特做例子：巴菲特只在两种情况下出手——标的已经便宜到极致，或者已经在行业里彻底胜出、没有对手了，从不在一个领域早期押注赌技术路线。\n\n2. 做买卖不能讲情怀，技术也一样\n\n他打了个比方：很多有艺术气质的人开餐厅、开酒吧，一心追求「超凡脱俗」的格调，结果生意最差——因为他们满足的是自己的情怀，而不是顾客的真实需求。技术人员也常常掉进同一个坑：总想把技术做到极致完美，却忘了对公司来说，能不能快速商业化、满足实际应用，才是真正重要的。\n\n## 七、技术不是越先进越好，是越「适用」越好\n\n1. 几个历史上的反直觉案例\n\n他举了一连串例子说明这个道理：当年VCD和DVD相比技术差了一大截，却在中国做成了大生意，DVD反而没起来；最原始的GSM蜂窝网络技术方案很粗糙，却成了后来手机通信的基础；爱迪生发明留声机最初是为了解决「记录」问题，结果真正让它发扬光大的是音乐，和最初设想完全不是一回事；国内的短信业务被微信冲垮之后，却靠验证码功能意外获得了第二春。\n\n技术领先会不会让产业领先？我从来没怀疑过这件事。但技术越领先，产业就一定越领先吗？那不一定。\n\n2. 苹果手机也是同一个道理\n\n他反问：普通人买手机会关心芯片是几纳米制程、跑分多少吗？绝大多数人买苹果，买的是品牌和身份认同，而不是那些他们根本用不上的顶配参数——他自己买电脑用了这么多年，从没把硬盘存储用到十分之一。\n\n## 八、氢能源与专利壁垒：日本人的「战术强、战略弱」\n\n1. 从环保角度看，氢能源确实更优\n\n他解释了原理：锂电池的问题在于，充放电产生的废物不能直接排放到环境里，必须用一个封闭外壳把它一直带着走，这本身就不经济；而氢能源放能之后产生的废物是水，可以直接排放到大气里，用的时候再电解水补充氢气，不需要背着代谢废物到处跑。\n\n2. 但日本人自己把这条路走死了\n\n他指出，日本当年把氢能源相关的专利几乎注册了个遍，形成了严密的专利壁垒——想用就得交钱，结果反而导致全世界几乎没人愿意用。他拿比尔盖茨当年放任微软在中国被盗版做了对照：\n\n盗版了以后就形成了路径依赖。如果微软刚进中国就是收费软件，它在中国根本发展不了这么大。\n\n他的结论是：日本人干技术上的事总是战术精细，但在战略格局上经常出问题。\n\n## 九、「何不食肉糜」：万科给他上过的一课\n\n他回忆了自己当年在万科上的一次操作：股价从二十多跌到18块左右，他觉得亏得不多就割肉卖了，后来股价一路跌到个位数，现在回头看简直是灾难。他还提到万科债券刚出问题那阵，股价还有九块多，有人说反正股息高、拿着吃分红就能回本，他当时讲了「何不食肉糜」的故事来反驳：\n\n当债券都还不上的时候，他拿什么给你分红？\n\n他说这不是说股息不重要，而是任何试图把投资简化成一个固定公式的想法都是错的——买入不动行不行？不行；天天做波段行不行？也不行。具体问题要具体分析，这跟战术要因地制宜是一个道理。\n\n## 十、拿的是散弹枪，就别配瞄准镜\n\n他重申了自己的投资方式——不追求精准命中，而是等一个足够大的目标出现，朝大概方向打一枪就够了。\n\n拿散弹枪的人，你配个瞄准镜有什么用？枪本来就不准。\n\n他把这个道理接回了技术崇拜的话题：懂得太细的人，反而容易在技术路线一换代的时候手足无措——今天懂光模块，过两天技术方案变了，用不上那么多光模块了，你怎么办？他觉得知道得太具体的东西，往往很快就会过时。\n\n## 十一、当前科技板块的交易结构是「失真」的\n\n他解释了这两天科技股走势为什么不太能反映真实的多空博弈——前一阶段发行的一批算力基础设施ETF正在建仓期，而ETF这类被动基金根本不择时，募集到多少钱就照单全买，不管价格高低，只考核跟踪指数的拟合程度。所以现在看到的成交量和价格变化，很大程度上是这批建仓资金造成的，要等它们建完仓，才能看出真实的筹码结构。他还提醒，今年年初部分股票持续下跌，也是同样的道理——那时候是汇金持续卖出完成既定任务，同样不是市场博弈的真实反映。\n\n## 十二、观察窗口要拉长，别用错误的时间刻度\n\n他提醒，很多人看不懂「为什么加息了股价还涨」，是因为用错了观察的时间刻度——加息的影响不是一两天就能反应完的。他还提到一个可以关注的现象：每次加息、降息消息公布前后那一小段时间，美股、黄金、铜、美元指数、日元汇率往往会出现「先正向波动、再反向、再回归」的规律性变化，很值得留意，只是普通人能看到的行情大多有延迟，看得不够精细。","toc":["一、加息的影响才刚开始：还会有更多「黑天鹅式」余波","二、不是所有行业都受伤：资金会挤出去找避风港","三、A股会不会成为资金的「避风港」","四、AI放缓传闻：三种解读，他信哪一种","五、法治是个奢侈品","六、技术崇拜的陷阱：淹死的都是会水的","七、技术不是越先进越好，是越「适用」越好","八、氢能源与专利壁垒：日本人的「战术强、战略弱」","九、「何不食肉糜」：万科给他上过的一课","十、拿的是散弹枪，就别配瞄准镜","十一、当前科技板块的交易结构是「失真」的","十二、观察窗口要拉长，别用错误的时间刻度"],"url":"https://xueqiu.com/2573414707/409431864","chars":3751},"topics":["技术崇拜","最优方案未必胜出","A股避风港","热菜还早","紫金观察"]},{"date":"2026-09-14","bili":{"title":"老木匠 2026年9月14日直播文字稿（利空出尽是利好、加息没被定价、猫屁股抹辣椒、循环融资、注水口","text":"## 一、开场：难过的周末总算过去了\n\n早上好，都来了。今天人气上得挺快，先点点赞、刷一波人气。\n\n对我来说最难过的日子就是周五收盘以后。 周五一收盘就百无聊赖，就盼着开盘。以前我经常给大家写文章，题目就叫\"明天就要开盘了，想一想都挺高兴\"——那是真高兴。我就是为交易而生的，跟宋丹丹说的似的，她是为奥运火炬手而生的。\n\n现在不太爱写了，一写就一堆人抬杠。有个叫\"不长记性\"的小子天天来气我，我估计至少拉黑过他五回，最后又都给放出来了——我觉得人不是坏人，就是不咋会说话。\n\n最近我把雪球里的拉黑名单又清空了。这就像《水浒传》开篇，把三十六天罡七十二地煞又都放出来了，所以未来一段时间论坛估计又要热闹。现在他们刚放出来还发不了言，得关注我三天以上才能说话，再过三天就该吵起来了。\n\n昨天就有个小子来，那人是靠怼人当特点的，一放出来就说\"我能看着你了\"。他发不了言就艾特我，我直接就又拉黑了。名单里现在就他一个人。我给他留言说：我看看你这吃屎的毛病改没改——一看还没改。\"吃屎的毛病是改不了的\"，这是老话，说得非常有道理。\n\n但大部分人在我这折腾一次，人家就不关注了。不关注我，我就不拉黑人家，因为没有交集了。你在背后说我，我也不在乎。\n\n## 二、为什么我专门去听看空的人说话\n\n那有人问：你为什么要把这些人放出来？\n\n因为我要是不放出来，对我来说也是信息茧房。 如果要了解市场的全面状况，那就得什么声音都得听。你要是全剩下铁粉，天天都是跟你一个观点的，那你不就自己把自己关在小院里了吗？听不到别的动静了。\n\n所以我以前给大家讲：我看多的时候，我关注的博主反而是看空的。 我买了一个东西，就把那些对它有像样质疑、能说出点道理的看空的人全关注上。\n\n我不像有些人，一看多就不许别人说看空。我专门听听空的人在说什么——只有这样才能保证自己的思维没有死角。 你不可能有上帝视角，人家从空的那个角度跟你讲的时候，你就得考虑人家说得有没有道理。即使没道理，你至少知道有人是从这个角度在思考的。\n\n你来股市不是来党同伐异的，你是来赚钱的。 很多人目的和手段老是不匹配。你上雪球干啥？雪球不就是个大家互通有无的股票论坛吗？你不为赚钱你来干啥？既然是为了赚钱，那你就得什么观点都听。买上股票就有风险，你就得听那些能给你带来风险的人是怎么想的。\n\n真不为炒股票，我早把雪球删了，天天看大长腿不好吗？\n\n## 三、闲聊一段：阿尔兹海默症\n\n先说个题外话，我不是医生，这只是我做低碳饮食的时候，那些科学博主老给我推，我听来的。\n\n阿尔兹海默症的第一个变化是性格变化。如果家里的老人突然变得多疑、敏感、焦虑，原来特别有修养的老太太开始骂人了，那就一定要小心，这可能是阿尔兹海默症的前兆。一开始还不是记忆力和理解力的丧失，先是性格。\n\n这病的遗传因素很强，三代以内直系亲属里没有的，得病概率就低。年轻人现在也有这个趋势，我听说有的人五十多岁就有前兆了。\n\n高糖、高碳水的饮食对阿尔兹海默症是有促进作用的，多运动、多吃富含欧米伽三的食品（核桃、三文鱼、深海鱼）有好处。全世界最高发的地区是西北——高碳水饮食区。\n\n抖音上有个叫罗西西的博士专门讲这个，讲得挺专业，你们可以去看看。\n\n## 四、\"利空出尽是利好\"——一句口号就能把你洗脑\n\n回到市场。\n\nCPI、PPI 数据出来以后，美国加息的概率出现了很大提升。但昨天美股和贵金属并没有出现很大波动，甚至还有些上涨。于是又有人说：这是\"利空出尽是利好\"。\n\n这个说法大家一定要警
