斤、大米 5 块一斤，你也改吃大米。口味都能改，价差够就行。\n\n中国电解铝 4500 万吨产能上限，也没什么不可逾越的。铝要是涨到五万块一吨，产能上限马上放开——是人定的事，就能放开。铜不一样，铜扩产要勘探、要剥离土石，从勘探到挖矿六七年。但铝扩产非常容易。\n\n有人问：既然铜从勘探到开采要那么久，为什么不先勘探好、剥离完、达到开采条件存起来？为什么不做储备？\n\n因为成本不对。铜价低迷的时候，现有铜矿都在亏损，你不会去投。我们国内两个著名铜矿在低迷期扩张，现在大家都给了非常正面的评价——在非洲收购的铜矿都是在低迷期买的。但你要反过来问：他们的铜矿都是从欧美大矿手里买的，为什么人家在低迷期以那么便宜的价格卖了？那些人是傻吗？\n\n不是。在低迷期买矿，和买周期股一个道理，要担负巨大风险。你只是今天熬过来了，因为铜又出现了上升周期。如果铜再低迷二十年，这两家企业都得亏，甚至破产。你不能用事后的结果说他赌赢了就是优秀企业，赌性非常大。\n\n为什么他们能赌？因为当年他们是光脚的，国际大矿是富人。穷人和富人投资同一样东西，采取的策略完全不同。赌适合穷人——那两个矿当年在全世界非常不起眼，根本入不了人家的法眼。正常竞争你永远翻不了身，所以赌一把。好处是正好赶上 AI 导致铜供不应求，铜踩上了第二个超级周期，这些年是赚得盆满钵满。\n\n人家大矿为什么卖？人家有的是铜矿，做的是稳定投资，你做的是赌博。你卖的这两个矿，在人家眼里都是贫矿，属于边角料，不属于优质铜矿。如果铜价持续在五千美元以下，光财务费用就能把这两家拖死。\n\n至于\"我采矿成本低、别人采不了我能采\"——扯淡，技术上有啥壁垒？唯一成本低是因为人员工资低。这背后还有很多国家战略在里面，为什么你能贷着款？你自己去收个矿，看你能贷着款不。深层原因不方便讲。\n\n## 六、怎么判断周期底部：明亏和暗亏\n\n光伏行业现在处在周期底部。你要找到那些你认为一定能度过这次低迷期的标的，按现在的价位买入，基本上只输时间不输钱。前提是找账上现金非常多、资产负债表状况很好的，因为现在还处在全行业亏损阶段。\n\n猪周期现在也可以关注了，不怕时间长的话，有些标的可以入。但有几个条件：\n\n第一，股东必须已经出清，他得认输。什么叫股东出清？你可以明显看到它从高点到低点经过了大幅度下跌。如果一家公司从周期高点到低点股价没经过大幅下跌，说明里面的股东现在不认输。有些坚定的股东明明已经亏损了，但\"我不认输我就不卖\"。\n\n那这些股票周期反转时会不会涨？会。但由于他们没卖、有信仰，你不要指望这些股票有多大弹性。高点的时候股价按业绩衡量，低点的时候按信心衡量。亏损的股票你估不了价格，靠的就是信仰。\n\n所以龙头周期股在低迷期为什么跌得少？因为大家信仰强，都知道这公司不可能被淘汰，追求安全性的资金不肯离去，于是低迷期就给了过高估值，导致以后恢复时弹性很小。\n\n猪周期现在已经进入全行业亏损。只要一旦进入全行业亏损，就离反转可以看到希望了。没经过全行业亏损，连希望都看不到，因为有收益的人还在扩产。\n\n但要注意，真正导致周期出清的不仅仅是亏损，是要去掉折旧等非现金流项目之后的亏损，也就是现金亏损。\n\n现在猪的亏损还只是财务亏损——把折旧、财务费用加上去是亏的，但如果不算这些，实际上还没亏，也就是还不是\"养一头亏一头\"，只是没把折旧挣出来。\n\n我们原来做企业管这叫明亏和暗亏。真正开始出清的时候，是从现金流开始亏了，养一头亏一头，你想维持生产就需要不断往里添钱，那叫明亏。现在的亏损只是财务亏损，不需要往里添钱，甚至还能拿出一部分。但我估计也差不多了，现在没几个能挺住的了。\n\n地产行业的全行业亏损没有意义。地产周期非常长，现在才开始全行业亏损，但即便如此，地产周期也没到底。你不能把全行业亏损当作判断周期底部的单一标准，还要看周期长度，是个综合判断。\n\n另外说个指标：股东人数大幅增加要分两个阶段看。拉到顶部时股东人数大幅增加是危险信号；在底部时股东人数大幅增加是介入信号。你不能单独看股东人数这个指标，得结合股价综合来看。\n\n## 七、收尾\n\n今天凑够两个小时，明天不播了，正好这两天感冒歇一歇。该说的也都说过好几遍了。\n\n谢谢大家。","toc":["一、先别替沃什操心，把讲话原文读一遍","二、沃什讲话之后，反对者只有一句\"他不敢\"","三、我唯一不确定的是路径，而路径对投资影响巨大","四、拒绝前瞻指引，意味着九月重新定价会异常激烈","五、有色的真相：不是供不应求，是囤积需求","六、怎么判断周期底部：明亏和暗亏","七、收尾"],"url":"https://www.bilibili.com/opus/1241943085618823177","bv":"","minutes":0,"chars":5460},"ai":{"title":"老木匠·2026年8月29日：读原文，还是读别人的转述","text":"## 一、接着上一场：看完全貌之后，你的结论变了吗\n\n1. 他先收了昨天留的作业\n\n他让大家去看那段完整视频，这天开场就问了结果：\n\n你看完那个完整视频，和你原来形成的固有印象，是不是多多少少有点改变？我相信所有人看了都会有改变，因为那个视频非常清楚，不存在不同的人有不同看法的问题。\n\n2. 他想让大家记住的不是结论，是那个冲击感\n\n我想这件事对大家来说一定会有非常大的冲击。就是你原来信誓旦旦、认为没有任何怀疑的地方，而且你还就此发表了很多情绪性的看法。等你看完以后，你会发现自己就是那个被牵着鼻子走的人。\n\n结论不重要，我不想给你们得出结论。我要告诉你们的是：无论什么事件，你都不要被媒体牵着鼻子走，你要有自己的判断。\n\n方法他也给了：「你就把这些事发生的时候、在没有媒体介入的情况下的原貌重新看一下。你这个时候不要考虑任何人对这个问题的看法，你就看那个视频，然后形成自己的看法。」\n\n3. 他还留了两个「作业」\n\n他建议大家再去把二十年前南京那个案子、以及当年北大那起中毒案的来龙去脉重新查一遍，理由是：\n\n你都重新审视一遍、研究一遍，然后对照一下你自己当年被洗脑所形成的固有印象，然后你就会成长。以后再有类似的事件发生的时候，你就不会轻易被人牵着鼻子走。\n\n## 二、这场的核心：读原文，而不是读别人的转述\n\n1. 他的判断：绝大多数人根本没看讲话全文\n\n我到现在都认为，今天直播间里六百多人，90%的人依然没有看过昨天那篇讲话的全文。\n\n如果你读完全文，认为他什么都没说，那你需要做的是回去补充基础知识，得从初中语文开始补起来。\n\n2. 「他不敢」不是论据，是立场\n\n这是这场他最反复强调的一点：\n\n所有反对的人几乎只有一个理由：他不敢、他不可能、他这么弄美国就完了、这么弄特朗普就不会当选了。我告诉你，这不叫论据，这叫立场。\n\n这不是思考，这是表达立场。它是建立在一个设想的基础上，而且他根本不屑于去看那个全文——因为他一看就怕发现有加息的痕迹，所以他用「他不敢」来麻痹自己。\n\n他还给了个判断人的办法：\n\n所有这么说的人，我几乎可以百分之百地断定，他要么持有有色金属，要么持有科技股。这就是我昨天讲的公共汽车的踏板效应。\n\n3. 他自己的结论，以及他强调这叫什么\n\n你要问我敢不敢肯定百分之百加息？我不敢肯定，我现在也不认为他会百分之百加息。但问题在于，加息的概率要比以前大得多——这就是我的结论，这就和以前完全不一样。\n\n在这次讲话之前，市场上还在信誓旦旦地说不存在加息的可能性。他现在说完了，加息的可能性已经变大了。我现在认为超过50%。\n\n这叫思考的结果。\n\n4. 读之前要先做的一件事：清空自己\n\n你把那篇讲话从头到尾、一个字都不落地读一遍，你就会形成一个印象。但是在这之前你要清空自己——你先没有立场，先别替人家操心加息之后美国怎么办、中期选举怎么办、会不会衰退。\n\n你就先说：根据这次讲话，他未来将要采取的策略是什么。\n\n5. 「你怎么知道他心里怎么想的」\n\n所有说他敢与不敢的，我马上就可以问一句：你是他肚里的蛔虫吗？你知道他敢不敢？你无非就是给自己壮胆而已。\n\n你唯一能获得他信息的渠道就是他的讲话。除此之外，你所有的信息来源是什么？无非就是自媒体上那些号称认识他的、会算命的、会看相的。\n\n你要真有信息来源，比如说他家那个司机告诉你、说他坐车的时候唉声叹气地说「我虽然是这么说，其实做不到」——你要有这个信息来源，我就信你。\n\n## 三、他从那篇讲话里读出了什么\n\n1. 第一件事：取消前瞻指引\n\n他上来第一件事就强调，我不能再像以前历届美联储主席那样给你们搞前瞻指引。我讲的东西你怎么理解都行，但你不能把它理解为前瞻指引——我要做一个安静的美联储，一切靠数据说话。\n\n2. 所以真正的关键变成了一个具体指标\n\n那就意味着：如果PCE指标在最后一次公布的时候仍然回不到美联储要求的2%，那么美联储在下一次议息会议上就一定会加息。这就是我的判断，你看完原文就是这个判断。\n\n所以接下来关键问题就是：八月份的PCE能不能回到2？\n\n他还专门纠正了一个常识错误：\n\nPCE和CPI是不一样的。PCE叫核心消费支出指数，它不包含食品和能源。有人说「我把石油打下来」——石油只影响CPI，而且这次他明确表明是要看PCE而不是看CPI。\n\n3. 几个被忽略的细节\n\n你要看他原文里的细节，还有很多。他说要看到未经修饰的数据，这都在暗示啥？他说劳动力市场的韧性很强，这是什么意思？他说经济增长很好，但是物价很高——就说明现在的就业率是可以承受加息的。人家已经给你铺垫完了。\n\n他还提到讲话里专门谈到了大宗商品：\n\n他专门提到要关注大宗商品的涨价，因为大宗商品涨价也会传导到PCE里面——你铜涨价了，家用电器、电力建设成本、最后电力价格都会跟着涨。那你现在把黄金和铜都炒上天，那不是逼着他直接加息吗？\n\n4. 一个很多人没意识到的后果：波动会更大\n\n这是他这场最有价值的推论之一：\n\n因为现在没有前瞻指引，所以你对他的讲话都是猜。以前从伯南克时代一直到鲍威尔时代都有前瞻指引，讲完话金融市场马上就重新定价了。现在你不敢完全反应，你就得等着九月份。\n\n那也就意味着，所有金融市场对加息降息的重新定价，必须要等到那一天才发生。由于市场没有反应时间，所以重新定价会非常激烈。\n\n重新定价非常激烈，对你来说那就意味着面临巨大的风险，当然也是一个巨大的机会。\n\n5. 所以他自己的框架变了\n\n我再重申一遍：去年这个时候我认为美国一定要大幅、连续地降息，所以那个时候我是坚定看好有色金属的。但是现在这个条件不成立了——你不敢保证它一定大幅连续降息，甚至现在有可能加息了。\n\n那你对有色金属的这种信仰就一定要改变：由原来信誓旦旦它一定会涨，变成它也有可能会跌；由原来可能跌一点儿，变成也有可能会大幅下跌。\n\n## 四、路径之争：为什么他认为会「先危机、后宽松」\n\n1. 他先澄清：40万亿最终靠通胀解决，这是他自己的老观点\n\n总有人来给我上课说「不通胀怎么解决美债」。那都是我的词儿——40万亿就得用通货膨胀来解决，别的办法没有，这我讲过800回了。\n\n我现在唯一不确定的是它的路径是什么样的。而这两个完全不同的路径，对于投资的影响是巨大的。\n\n2. 为什么不能直接走通胀这条路\n\n你如果现在就让美元直接贬值，我问你：现在持有货币和持有债券的这些老钱能束手待毙吗？那不就相当于把美国这些年的代价全由他们来买单了吗？\n\n你以为那些老钱都是包子吗？哪个没有政治代言人？你以为特朗普不想提名哈塞特、只想提名沃什吗？他是因为提名哈塞特在参议院过不去。沃什上台本身就代表着特朗普在某些博弈当中已经认输了。\n\n3. 所以他的判断\n\n我认为现在极有可能是先控制通货膨胀，然后导致一场危机，然后再重新走向宽松，从而完成美国的币值重置，最终解决国债的问题。因为只有导致一场危机再重新宽松，在政治上的压力才是最小的。\n\n这甚至不是谁设计的结果，这是个博弈的结果。\n\n4. 「你别替人家操心撞南墙」\n\n这是他这场最形象的一段：\n\n你就假如说你家孩子出门要去创业，你告诉他这个事儿不行，他都不会听。最终的结果都得是让他去试试——撞了南墙他就知道回头了。\n\n你别老说「你这事儿做不成」。做不成咋的？我就想撞一下南墙行不行？我撞完南墙我再回来行不行？\n\n还是那句话：他这事儿干成干不成不重要，他朝这个方向努力一下，就会要了你的命。\n\n5. 顺带一句关于「打赌」的话\n\n动不动就把赌挂嘴边的人都不是赌徒。因为赌徒得是胜率站在自己这边才下注；你这种毫无胜算的就开始下注——你算过胜率吗？\n\n只要一提出来跟别人赌，就说明他们自己没有信心。我持股有信心的时候，我从来不跟别人赌——我赌啥？我巴不得你便宜点、再便宜点卖给我。\n\n## 五、这场最硬的一课：「加息加不出铜来」这句话错在哪\n\n1. 他先承认这句话本身是对的\n\n加息加不出来铜，这句话是绝对正确的。你就是加息，也不能保证铜的供应就增加了。\n\n2. 但它漏了另外半边\n\n但是我告诉你，它会导致需求减少。加息不会增加铜的供给，但是它会减少铜的需求。\n\n你加息了以后，所有的资本开支都会变贵，融资会变贵。那AI数据中心的建设由于成本变高，是不是就会导致边际的量减少？量减少了，数据中心本身的用途以及它带来的电力需求都会减少。\n\n3. 从供需关系上说，这两件事是等效的\n\n需求减少了，和增加了供给，在本质上有什么区别吗？你所谓的供不应求是在现有的供给条件下——如果供给没变而需求减少了，那也会导致供过于求。\n\n铜的短缺是在现有需求的情况下它短缺。如果需求变了，它就有可能变成过剩。\n\n「铜未来十年都短缺」——那是因为现在的需求水平。这个前提你一定不要忘。\n\n4. 他抛出的那个反问：为什么库存反而是历年最高\n\n谁能给我解释一下：铜这么供不应求，为什么现在世界三大交易所的铜显性库存是历年来最高的？\n\n答案还是那个他讲过多次的概念——囤积需求：\n\n这是囤积需求，它不是真正的工业需求。是因为有人认为铜一定会涨价，所以在囤积。这跟当年的茅台酒道理是一样的：茅台酒也供不应求，但买走的酒都没有喝，都囤起来了。\n\n如果你把囤积需求也当成供不应求，那它当然就是供不应求。但实际上它在整个生产过程中是过剩的、是没有被消费掉的。\n\n这就意味着：当价格出现反转的时候，这些原本囤货的就会成为你的竞争性供给，会重新进入流通市场。你看现在的白酒，你就能看明白。\n\n5. 所以要分清哪部分是真需求\n\n你必须要分清楚这里面有多少铜是真的被消费掉了——比如生产电缆、生产各种导线、生产发电设备，这是真正的需求。还有一部分是买过来等着涨价的，这就不是真正的需求，这是投机需求。\n\n任何一个东西在上涨的过程当中都会出现这种需求。不是说涨价就一定供不应求。\n\n6. 黄金是最好的例子：它根本没有供需关系\n\n黄金没有供需关系，黄金纯金融属性。你说他供不应求？买过去还是囤积，放在你手里是囤积，买到别人手里还是囤积。\n\n黄金的上涨不是因为供不应求，是由于美元贬值所导致的主权基金增持。各国央行的外汇储备里是美元，随着美元滥发购买力受损，那我要保住购买力就得去买实物，这时候就去买黄金。\n\n而且央行不是炒作，不是今天买明天卖——他买完作为外汇储备就收走了。所以黄金你可以把央行持有的那部分从存量里剔除掉，这就导致了黄金的上涨。\n\n7. 铜的上涨里，也有一部分是黄金带起来的\n\n最近铜价的上涨有很大一部分原因是由于黄金的上涨造成的，并不是完全由供需关系造成的。黄金的金融属性被激活以后——铜也有金融属性。所以有人就开始认为囤黄金已经贵了，就开始囤铜、囤白银。\n\n所以你会发现黄金上涨以后白银会跟着涨，白银涨了铜会跟着涨。这并不是说它在工业上多么供不应求，而是囤积的人多了。\n\n## 六、铝：没有什么不可替代\n\n1. 铝的两个上涨原因\n\n铝的金融属性要少得多。铝的上涨主要是两个原因：第一是我们的产能控制；第二是铝和铜在很多领域里可以形成竞争或者互换，所以铝价一般是跟着铜价走的。\n\n没有哪个时候只有铜涨铝不涨、或者只有铜跌铝不跌，它俩基本上是同向的。\n\n2. 替代是价格问题，不是技术问题\n\n没有「铝不可以替代铜」这件事，那都是你的固有观念。只要价格对了，什么都能互换。无论是空调散热器，还是新能源车的高压线束，甚至电机，都可以用铝来替代。\n\n现在用铜更便宜，是因为铝的导电性能不如铜，要做很多特殊处理，增加了成本。所以那一点点价差不足以弥补这个成本的时候，替代就不会发生；反过来就会发生。\n\n他打的比方是米和面：\n\n无论你多么爱吃白面，如果白面50块钱一斤、大米5块钱一斤，你也会改吃大米。你别跟我扯说「我是西北的我就爱吃白面」——那是因为价差不够，价差够了你就会改。\n\n3. 产能上限也不是不可逾越的\n\n包括中国电解铝4500万吨的产能上限，也没有什么不可逾越的鸿沟。铝如果涨到五万块钱一吨、导致通胀已经非常严重了，那产能上限马上就放开——是人定的事儿就能放开。\n\n铜不一样：铜你现在没有，那你就得等时间，从勘探到挖矿得六七年，这是确实的。铜扩产非常不容易，但铝的扩产是非常容易的。\n\n## 七、一个很好的思考题：为什么不提前储备铜矿\n\n1. 他先把问题抛出来\n\n既然说铜从勘探到开采需要那么长时间，那为什么不提前勘探一部分、把土剥离完、达到开采条件，然后储备起来呢？大家想没想过这个问题？\n\n2. 答案：因为在低迷期，成本根本不对\n\n你不勘探的原因是啥？因为那个时候现有的铜矿都会亏损。你今天铜供不应求的时候，就觉得铜矿是个香饽饽——我跟你讲，那投资铜矿的赌性是非常大的。\n\n3. 他由此反问了一个很少有人问的问题\n\n我们在非洲收购的那些铜矿都是在非常低迷期扩张的，大家现在都给了很正面的评价。那我问你一个问题：他们的铜矿都是从欧美那些大矿手里买的，为什么在那个低迷期，人家以那么便宜的价格卖了？那些人是傻吗？\n\n4. 他给的解释：那是穷人和富人的不同策略\n\n在低迷期买矿，跟在低迷期买周期股道理是一样的——他也要担负着巨大的风险。你只是今天熬过来了，因为铜又出现了上升周期。如果存在过20年的低迷期，我跟你说这俩企业都得亏，甚至都得破产。\n\n你不能用事后的结果说他赌赢了、所以他就是优秀企业，那赌性是非常大的。\n\n为什么他们能赌？因为当年他们是光脚的。那些国际大矿是富人，人家做的是稳定投资，你做的是赌博。人家不是赌错了，是人家不需要赌——人家手里富矿有的是，你买的那两个矿在人家眼里都是贫矿，属于边角料。\n\n穷人和富人在投资同样东西的时候，采取的策略是完全不同的。赌就适合穷人——因为那两个矿当年在全世界非常不起眼，你要是正常竞争的话，永远都翻不了身。\n\n他还提醒别把结果归因到技术上：\n\n你也别扯什么「我这个采矿成本就低、别人采不了的我能采」，那扯淡，那技术有啥壁垒？唯一的成本低是因为我们的人员工资低，就这点儿。\n\n## 八、上市和不上市，最简单的区别是什么\n\n有人问到几家著名企业为什么不上市，他没有猜测内情，而是把一个基础概念讲清楚了。\n\n1. 答案：信息披露\n\n上市和不上市最简单的区别是什么？上市就要信息披露——要披露财务报表、在什么领域投资了什么、生产了什么产品、股东究竟是谁。\n\n那我问你，你们现在知道那家公司的股东是谁吗？知道它每个板块投资多少、每年产值多少、成本是多少吗？他上市就必须得公开，那你不就都知道了吗？\n\n2. 以及为什么有些企业不缺钱\n\n不是他自己能有多少钱，是他想贷款、想贷多少都能贷。\n\n他还提到一个可以直接去看的例子：某些上市公司的财报里有一部分业务是不披露的，而且有一部分净资产是专属于国有的——「你们要是投资的话，都该明白一点儿」。\n\n## 九、周期股：底部该怎么选\n\n1. 光伏：现在是周期底部，「只输时间不输钱」\n\n光伏行业现在我认为是处在一个周期的底部。如果你能找到相对比较安全的、你认为它一定能度过这次低迷期的，那么按现在的价位买入的话，它是只输时间不输钱。\n\n因为现在还处在全行业亏损阶段，所以你要找那些账上现金非常多的、资产负债表状况都很好的、你认为他一定能挺过去的。\n\n2. 猪周期：他认为可以开始关注了\n\n我认为现在猪周期也可以关注了，如果你不怕时间长的话。但是这个你得自己去选。\n\n他给了一条硬标准，也是这场里最实用的一句：\n\n第一，他必须得是那里面的股东已经出清了、他得认输。什么叫股东已经出清？你可以明显看到它从高点到低点是经过大幅度下跌的。\n\n如果一个公司从周期高点到周期低点，股价没有经过大幅度的下跌，那就说明里面的股东现在不认输。\n\n3. 为什么「不认输」就意味着没有弹性\n\n这一段把他前一天讲的「周期股不能买龙头」补完了：\n\n他们有信仰、他们没有卖，所以你不要指望这些股票有多大的弹性。因为高点的时候是按照业绩来衡量的，低点的时候是按照信仰来衡量的。\n\n你的股价没有下跌，并不是因为你没有亏损。亏损的股票你怎么估价？你估不了价，所以靠的就是信仰。\n\n为什么周期股的龙头在低迷期跌得少？因为大家的信仰比较强烈，都知道这个公司不可能被淘汰，所以追求安全性的资金就在里面不肯离去。所以它在低迷期就给了过高的估值，这就导致它以后恢复的时候弹性会很小。\n\n4. 全行业亏损也要分两种：明亏和暗亏\n\n这是一个很实用的新区分：\n\n真正导致周期出清的还不仅仅是亏损，而是去掉折旧等非现金流项目之后的亏损，也就是会出现现金的亏损。\n\n现在的亏损还只是财务亏损——把折旧、财务费用加上去是亏的，但如果不算这些，它实际上还没有亏，就是说他还不是养一头亏一头。\n\n我们原来做企业的时候，这叫一个明亏、一个暗亏。等真正开始出清的时候，是从现金流上已经开始亏了——你要继续维持生产，就得不断往里添钱。\n\n5. 全行业亏损不是单一标准\n\n地产行业的全行业亏损没有意义。地产的周期是非常长的，它现在才开始全行业亏损，但即便如此，它的周期也没到底。\n\n这东西不是说全行业亏损你就能作为周期底部的判断标准。还要看这个周期的长度——这个判断是综合的，不是单一指标就能判断出来的。\n\n6. 股东人数：同一个指标，在两个位置含义相反\n\n股东人数大幅增加有两个阶段：在顶部大幅增加是个危险信号，在底部大幅增加是个介入的信号，这是两个完全不同的。\n\n你不能单独看这一个指标，你得结合它的股价来综合看。\n\n## 十、接下来三周该看什么\n\n现在是从现在开始到9月15、16号，然后日本的议息是9月17到18号——这三周时间很关键。\n\n你就得看是不是又出现什么信息。如果这三周消息面都很平静、没有巨大变化，那你一定得把九月份的议息会议当回事。\n\n他还提到了当晚外盘的分化：\n\n昨天美股的科技股、芯片、光通讯，还有金属、贵金属，这些都下跌了。那些现金流好的相对来说涨了，涨得最多的是银行——因为如果加息的话，银行是受益的。\n\n以及一句提醒：\n\n你能做的只有判断人家未来要干啥。你不仅可以替特朗普做主，还可以替沃什做主，还替他们操心——你就都忘了自己该干什么了。","toc":["一、接着上一场：看完全貌之后，你的结论变了吗","二、这场的核心：读原文，而不是读别人的转述","三、他从那篇讲话里读出了什么","四、路径之争：为什么他认为会「先危机、后宽松」","五、这场最硬的一课：「加息加不出铜来」这句话错在哪","六、铝：没有什么不可替代","七、一个很好的思考题：为什么不提前储备铜矿","八、上市和不上市，最简单的区别是什么","九、周期股：底部该怎么选","十、接下来三周该看什么"],"url":"https://xueqiu.com/2573414707/407229540","chars":7383},"topics":["独立思考","沃什讲话","有色囤积","周期出清"]},{"date":"2026-08-28","bili":{"title":"老木匠 2026年8月28日直播文字稿（独立思考、信息茧房、斯德哥尔摩、司法案例、甲醛白菜）","text":"## 一、少看花边新闻，别活在被别人营造的\"拟像世界\"里\n\n今天有点感冒，但咱该聊还是聊。先说一句最实在的：少看那些花边新闻。明星行踪、谁又说了句什么话、哪个地方又破了点小破事——这些都是媒体做出来骗流量的，隔一段时间就冒一波，过一阵你也就忘了，除了浪费精力没有任何意义。\n\n我到现在都没看\"景田那个事儿\"到底是咋回事，一般看个标题就不再往下翻，时间长了平台也不给我推这种东西。你们也得做到这点：你的平台老给你推花边新闻，你一定要检讨自己的注意力——那一定是因为你过多地关注了这些。\n\n这事儿通俗叫\"信息茧房\"，理论上叫什么？叫你生活在一个虚假的世界里。媒体发达之后，普通人很难架住这种信息轰炸。你天天需要干的事，是别让你的世界观被别人灌输、被别人植入，而是你自己去思考。\n\n怎么做到？第一点，别人推送给你的信息，你要有识别能力，否则你根本经受不住这种反复洗脑。\n\n## 二、脱离感性、进入理性，是投资最基础的门槛\n\n人最大的好处是通过学习可以脱离本能、进入理性思考阶段。如果你所有东西都是感性的、所有欲望都要及时满足、所有判断都是\"我感觉怎么怎么地\"，那你永远脱不离作为一个人的低级状态。\n\n芒格说过：投资最重要的东西是什么？是理性。理性来自思考和学习获得的认知，不是\"我觉得\"\"我认为\"，更不是自媒体喂给你的信息。\n\n你们自己问自己：多少下判断的时候，是用\"我感觉明天会涨、我感觉明天会跌\"开头的？我经常在帖子下面看到\"我感觉怎么怎么样\"，我一般都会问他们——你用什么器官感觉的？人又没有能感觉股票涨跌的器官，那不都是思考的结果吗，怎么能用感觉呢？\n\n人为什么愿意用感性思维？因为它来得快，而且跟情绪挂钩——你按感性认识做决策时是有快感的；而按理性做正确选择时，不仅没快感，反而常常感到痛苦。所以普通人总跨不过感性这道门槛，根源就是没提升自己。\n\n投资是典型的\"概率游戏\"，但人在进化过程中根本没有一个器官用来判断概率，所有关于概率的判断都必须是理性的。在感性层面，你判断不了概率。\n\n## 三、股市版的斯德哥尔摩综合症\n\n我昨天就跟你们说过：你们在股票市场上的斯德哥尔摩综合症实际上非常明显。\n\n那些亏钱的散户，明明是被大户反复收割，结果你只要说一句大户的问题所在，反倒一大堆人跑出来为这个大户辩解。这就跟斯德哥尔摩综合症一样——你原本是受害者，却开始为加害你的人辩解，甚至\"爱上他\"。\n\n所以别老去羡慕\"人家是人精、到处收割\"，你唯一需要做的，是离他远点。\n\n## 四、\"一万九\"案与彭宇案：先看全貌，再下判断\n\n最近有个新闻挺有意思，我教你们看点有用的东西。就是有个老人坐在麻将社门口，后来因病去世，最后赔了一万九。现在自媒体上都在演段子，各个商家把门口板凳拿进去说\"我可没有一万九\"。\n\n你们什么看法？我看你们跟自媒体的看法都一样——道德败坏、做好人难。但我先问一句：你们有谁把那个视频从头到尾完整看过？\n\n从老人进屋、坐到凳子上，一直到去世，整个过程你们谁看了？我相信你们看的都是其中一段——就是那个女的去扶、然后摔倒了。我不愿意说结果，因为对你们感官冲击太大，但我劝你们少关心画面新闻，去把完整视频找来看一看（现在平台不推送，但你搜一下就有）。看完你可能会有完全不同的看法。\n\n这件事比\"景田的事\"重要一万倍。它教你的不是案子本身，而是：别被别人设定的固定观点带着跑。\n\n回到投资也一样——你别先看人家观点、截个图截两句话，就开始跟着情绪跑。你先去了解这件事的来龙去脉，再决定自己的看法。\n\n这件事的恶劣，根源不在案子本身，而在南京彭宇案。任何一个案子双方都有理，只有一方完全有理的根本不会成为诉讼。彭宇案这么多年了，消极影响至今没解决，今天这个\"一万九\"也是它的余波。从传播学角度说，彭宇案一旦开始传播，真实情况反倒不重要了，最后大家形成的都是\"拟像\"——一个简单的口号式判断：\"不是你碰的，为什么去扶？\"\n\n一个恶劣的司法判例，带来的社会代价是巨大的、多少年都解决不了的。 我现实生活中遇到的类似案子多了去了，旁边家具市场一对老夫妇看家具时突发心脏病去世，店主都赔了钱——跟这情况差不多。这就是司法模糊化导致的\"不再说理\"，片面追求结果正义而不是程序正义。\n\n讲这个，还想教你们一个工具：\"无知之幕\"。讨论社会问题时，你首先要做一个假设——你不知道自己在这个社会里是什么角色。你一旦先知道了角色再去参与讨论，就很难客观。所以你说话时要时刻警惕：你究竟在陈述一个客观事实，还是在陈述你的立场？\n\n立场的问题没法争论。很多人貌似在客观分析，其实是在陈述立场——他买了某只股票，就认为这只股票好。你可以问问自己：假如你现在不持有这只股票，你还这么认为吗？做股票一样，你以为在陈述客观分析，其实在陈述立场。\n\n## 五、甲醛白菜与马光远暴论：罪行相适应、罪责自负\n\n再讲一件有意思的事——甲醛白菜。几个农民往白菜上蘸甲醛溶液防腐，这是国家不允许的，我也认为这事儿丧良心。但昨天马光远（一个经济学家）评价这事，说了两个暴论，非常不慎重：\n\n第一，他说出现这种情况应该直接判无期徒刑。\n\n第二，这个地方的白菜占过甲醛，就应该列黑名单，以后这地方的白菜干脆不准上市。\n\n我先说法律常识。现在刑法有个基本原则叫罪行相适应——刑期要和危害程度相适应，不是因为你心里不安就重罚。白菜蘸甲醛就判无期，那蘸敌敌畏该判啥？判死刑？按他这逻辑，2021年房价高点还催大家买房子的经济学家，给老百姓造成的损失比甲醛白菜大得多，更该判无期。\n\n第二个暴论更离谱——一个县的白菜占甲醛，整个县的白菜都不准上市，这不就是连坐吗？现代刑法还有个基本原则叫罪责自负：一个人犯的罪自己承担。为了一棵白菜搞连坐，既违背罪行相适应，也违背罪责自负。\n\n而且从执法经济性说，白菜单判无期也防不住——全国一年种多少白菜，谁去看？我们国家毒品治理得好，不是因为处刑重，而是因为反毒警力投入巨大。食品安全领域要是也按那种力度执法，费用你承担得起吗？\n\n最后我要说的是：一棵白菜从山东运到海南，不用防腐剂怎么保鲜？从河北到北京经过批发、零售环节，鲜菜不防腐怎么保鲜？全用冷链车拉白菜，北京白菜得卖十块钱一斤，你承担得起吗？\n\n所谓经济，就是一种取舍。 你想吃绿色蔬菜，得承担得起成本；真全绿色了，你马上又想要便宜。所以一件事出来，你先把全貌和来龙去脉搞清楚，别被人带着跑。我并没有固定观点，这些观点你们自己去形成。\n\n（顺带说，别迷信什么会员超市，那都是中产小资的迷信。我就在菜市场买，别人吃啥我吃啥，咱们都是吃这些长大的，人均寿命还在涨。自己种菜？你去农村种一回地就知道了，两天不出勤草比人都高。少吃叶菜、去皮吃、水果吃西瓜，这就是我的办法——解决焦虑其实没那么难。）\n\n国外鲜菜比我们少得多，大部分是罐头，防腐剂一点不比我们少，只是环节不同。中国是以鲜菜为主，别妄自菲薄——我们有问题，他们也有问题。你不客观，投资也会不客观，老表达立场、表达情绪，没有看问题本质，这习惯在股市上就是亏裤衩。\n\n## 六、学习没有技巧，先去做；独立思考是修行\n\n前几天有个小朋友问我：股市上有没有又稳又快的赚钱方法？\n\n我告诉他：想赚钱稳，就不快；想赚钱快，就不稳。又稳又快的有没有？有，刑法一百八十条到一百八十二条写得清清楚楚——内幕交易罪、编造虚假信息罪、操纵市场罪，随便选一个，挣钱又快又稳，前提是你没被抓。所以别羡慕那些\"又快又稳\"的，他可能只是还没被抓。\n\n学习没有技巧，干什么都别老问技巧，这出发点就错了。 人不管是学习还是干事业，都不能投机取巧，得下笨功夫。投资也一样——你说有什么技巧？没有。把该读的书一个字一个字读完，读完了问自己懂不懂。\n\n你老问\"读哪本书\"，说明你一直没在读。这就跟减肥的人老问\"用什么办法减最快\"一样——一辈子都减不成。你还没出发呢，就天天琢磨哪条路径费劲最少、效果最好，这不还是投机取巧吗？\n\n不管干啥，第一件事就是去做。 先别想用什么办法效率最高，你做着做着就知道了。读书也是，你先找一本书看，书与书之间互相推荐，你自然就知道下一本读啥了。你把精力全耗在\"琢磨看哪本\"上，那就是内耗。\n\n今天我主要就是给大家讲独立思考。在这个自媒体时代，信息对你的轰炸太猛，稍有不慎就容易被带着跑。有时候与其掌握信息太多，不如隔绝信息——把那些自媒体 App 都删了，减少信息摄入，你反而更容易独立思考。但这对我都挺难，对你们更难，得靠自己锻炼。\n\n为什么难？因为\"求同\"、跟着团体走，是人类进化的结果。草原上斑马都吃草，只要有一只开始跑，你就得跟着跑，否则容易被狮子吃——这写在你基因里。\n\n（合规声明：我所说的一切都纯属评书、虚构，不能用来指导投资。所有涉及股市的内容都不是投资建议，投资有风险，入市请谨慎，风险自担。）\n\n收尾：今天主要讲独立思考——别活在被别人营造的拟像世界里，用理性脱离感性，先看全貌再下判断，警惕自己在陈述立场还是客观事实，学习下笨功夫、先去做。这不光是做人的事，更是投资的事。","toc":["一、少看花边新闻，别活在被别人营造的\"拟像世界\"里","二、脱离感性、进入理性，是投资最基础的门槛","三、股市版的斯德哥尔摩综合症","四、\"一万九\"案与彭宇案：先看全貌，再下判断","五、甲醛白菜与马光远暴论：罪行相适应、罪责自负","六、学习没有技巧，先去做；独立思考是修行"],"url":"https://www.bilibili.com/opus/1241448971138760741","bv":"","minutes":0,"chars":3692},"ai":{"title":"老木匠·2026年8月28日：独立思考与理性的门槛","text":"## 一、少看花边新闻：你的注意力就是你的资源\n\n1. 他自己的习惯\n\n我劝大家少看那些花边新闻，人的精力是有限的，那种狗血的东西尽量还是少看。什么明星的行踪、有钱人的生活和想法，这些东西都要少看——这都是媒体做出来骗流量的。\n\n隔一段时间就会有这些东西把流量都吸引过去，然后过一段时间你就会忘了。除了浪费你的精力之外，没有任何意义。\n\n他还给了个自检的办法：\n\n这种东西我一般看个标题就不会再往下看，所以时间长了平台也不会给我推这种花边新闻。如果平台老给你推这种东西，你一定要检讨自己的注意力——那一定是因为你过多地关注了这些新闻。\n\n2. 那该看什么\n\n古今中外那么多聪明的人，写了那么多书，把一生的精华都写在书里面，你不去看，你非要看那些花边新闻？人家富人的生活、明星的生活再丰富多彩，你还能参与还是咋的？\n\n3. 拟像理论：你生活在一个被营造出来的世界里\n\n现在由于媒体的发达，普通人很难跳出这种媒体所营造的信息，你们通俗地管它叫信息茧房，其实在理论上这叫拟像理论——你是生活在一个虚假的世界里。\n\n你天天需要干的事，是不要让你对世界的认识被别人所灌输、你的思维不要被别人植入，而是你自己去思考。要做到这一点，第一步就是对别人给你推送的信息要有一定的识别能力，否则你根本经受不住这种反复洗脑。\n\n## 二、理性和感性：为什么大多数人跨不过这个门槛\n\n1. 人通过学习，最大的好处是可以脱离本能\n\n你如果所有的东西都是感性的，按照老天给你设定的这种偏好来，那你就永远脱离不了作为人的这种低级状态——所有的欲望都需要及时满足，所有的判断都是直观的，说话就是「我感觉怎么怎么的」。\n\n他把这条接到了芒格那句话上：\n\n芒格说投资最重要的东西是理性。什么是理性？那需要你经过思考、学习获得的理性认知，而不是「我觉得、我认为」，或者是通过自媒体所得到的信息——那说明你都没有脱离感性阶段，你哪来的理性？\n\n2. 「我感觉」这三个字\n\n有多少人下判断的时候用的是「我感觉明天会涨、我感觉明天会跌」，都是用「我感觉」开头。我在帖子下面经常看到这样的评论，我一般都会问他们：你用什么器官感觉的？\n\n我不知道人还有感觉股票上涨和下跌的感觉器官。那不都是思考的结果吗？怎么能用感觉呢？\n\n3. 为什么人天然偏爱感性思维：因为它给快感\n\n这一段是他讲得最深的一层：\n\n感性来得快，而且它和情绪挂钩。当你按照感性认识去做决策的时候，你是会有快感的；当你按照理性去做决策的时候，就没有这种快感。\n\n有的时候理性和感性刚好是相反的，你不仅没有快感——你按照理性选择正确的道路的时候，会感到非常痛苦。所以普通人为什么总是跨不过感性这个门槛？就是你没有提升自己。\n\n4. 更要命的是：人根本没有判断概率的器官\n\n投资股票市场是一个最典型的概率游戏。但是人在进化的过程中，根本没有一个器官是用来判断概率的。所以你所有关于概率的判断都必须是理性的——在感性这方面，你就判断不了概率。\n\n## 三、独立思考的第一课：先把全貌看完\n\n他用当时几件热点新闻做了教学案例，但反复强调「我根本不关心这件事，我是拿这事告诉你们怎么坚持独立思考」。\n\n1. 那个赔偿19000元的案子：你看的只是其中一段\n\n你们有谁把那个视频从头到尾完整看过？从那个老人进屋、坐到凳子上，一直到老人去世，其实也不长，大概也就十多分钟。我相信你们看的都是其中的一段。\n\n你只是因为没有看到视频的全过程，然后就按照媒体给你设定的这个角度开始评价了，并且你还非常有情绪。\n\n他还纠正了两个被段子带偏的事实细节：凳子并不在店门外，就是店里的一个凳子；以及\n\n这个老人发病以后，你正常应该不去动他，而直接打120或者110。但是你去看一看那个女的是怎么处理的，然后你们自己就会有自己的判断。\n\n2. 他真正想说的那条道理\n\n你在投资的时候也是这样。你别先看人家观点、先给你截个图或者截两句话，然后你就开始跟着人家情绪跑了。你先去了解一下这件事的来龙去脉，然后你再决定你的看法是什么。\n\n3. 顺带的一个专业判断：一个坏判例的社会代价有多大\n\n一个恶劣的司法判例，它所带来的社会代价是非常巨大的。当年南京那个案子到今天二十年了，它带来的消极影响依然没有解决——今天这个案子也是那个案子的余波。\n\n他解释了为什么店主会怕：\n\n原本一个人如果在我店里因病去世，这件事跟我没有关系；他又不是摔倒的。但由于那个案子造成的心理压力，就变成了「只要在你的店里面出事，你就要承担责任」。\n\n他还说这类案子在现实中很多，只是没被传播——他举了本地一个家具展厅里老夫妇突发心脏病去世、店主赔钱的例子。\n\n## 四、无知之幕：你陈述的是事实，还是立场\n\n1. 「公共汽车效应」\n\n你别看你今天义愤填膺，那是因为你是旁观者。明天把你换到家属那边，你的观点马上就变。\n\n就像原来挤公共汽车，没上车的时候都在往上挤、都喊再挤一个；你只要一踏上那个板儿、一进到那个门里头，你马上就说「你们后边等下趟吧，老挤啥挤」。立竿见影。\n\n2. 所以讨论社会问题要先假设自己不知道自己的角色\n\n国外在讨论这些社会问题的时候有一个假设叫「无知之幕」：每个人出生的时候并不知道自己的角色，这个时候我们在一块儿讨论，才能得到一个公正的结论。否则的话，你每个人描述的都不叫客观的观点，而都叫做立场。\n\n你说话的时候必须要分清楚——你要时刻警惕你自己究竟在陈述一个客观事实，还是在陈述你的立场。\n\n3. 这一条直接对应到投资上\n\n有很多人貌似在陈述一个客观的分析，其实他陈述的是立场。比如他买了某一只股票，他就认为这只股票好，貌似在给大家分析，其实是在陈述自己的立场。\n\n那你可以问问自己：假如说你现在不持有这只股票，你是不是还会这么认为？\n\n他还说了立场为什么没法争：\n\n立场的问题是没法争论的。他就那么看的，你怎么争论？说这个股票就是他专属的——那他表述的是立场，我怎么跟他争论？\n\n## 五、第二个案例：为什么名人说话要慎重\n\n他拿一位知名经济学家对「甲醛白菜」事件的评论做了个法律上的拆解，用意还是同一个——别人给的结论，你要自己过一遍脑子。\n\n1. 第一个问题：违反罪刑相适应原则\n\n自从现代刑法学改革以来，我们刑法一个最基本的原则叫「罪刑相适应」——你的刑期要和罪的危害性程度相适应。不是说因为你是吃白菜的、这事让你心理不安了，就一定得重罚。\n\n如果沾甲醛就判无期徒刑，那我问你：沾完甲醛死人了应该判啥？如果白菜沾敌敌畏，那是不是应该判死刑？\n\n他还说了这种主张是怎么来的：\n\n那是因为你是吃白菜的。假如你是种白菜的农民，你对这事儿是什么看法？\n\n他自己也顺势举了个对照的例子：\n\n站在我的角度，我特别想说的一句话是：在2021年房价高点的时候还鼓吹买房子的，都应该判无期徒刑——因为给老百姓带来的损失，要比吃这甲醛白菜大得多。\n\n2. 第二个问题：那个「列入黑名单」的主张，本质是连坐\n\n说这个地方的白菜列入黑名单、以后都不准上市——这个观点在历史上就有，叫做连坐。我们家有个邻居的白菜沾甲醛了，我们家的白菜也不能卖了，这不就是连坐吗？\n\n现代刑法学第二个基本原则叫「罪责自负」，就是一个人犯了罪，一个人自己承担。你现在为了一个白菜问题，搞出连坐来了。\n\n3. 第三个问题：执法不只要有效，还要讲经济性\n\n现在的执法除了要讲究有效性之外，还要讲究经济性。白菜沾甲醛如果就判无期的话，你也防止不了他沾，为什么？因为你执法不过来——你知道全国一年种多少白菜？谁去看着？\n\n他还用禁毒做了个对照：\n\n我们国家毒品治理得特别好，并不是因为毒品犯罪处刑特别重。对于毒贩来说，多少克判死刑这件事根本不重要，那对他没有威慑。主要的原因是我们在反毒上的警力投入是非常巨大的。\n\n那你如果在食品安全领域也按照防毒品那种执法强度来，这个执法费用你能承担得起吗？\n\n## 六、由此延伸：所谓经济，就是取舍\n\n1. 先想清楚成本\n\n你告诉我，一棵白菜从山东运到海南，如果不用防腐剂的话得怎么防腐？就算近点，从河北运到北京，经过收购环节、批发环节再到零售环节，鲜菜不防腐的话怎么保鲜？\n\n有人说用冷链车，他的回答是：\n\n如果全用冷链车来拉白菜，北京的白菜会卖十块钱一斤，你能不能承担？\n\n2. 绿色蔬菜技术上完全没问题，难的是两件别的事\n\n绿色蔬菜在技术上是完全没有任何难题的，关键的问题是两项。第一，你如何让大家相信你的是绿色蔬菜——因为市场上良莠不齐，有的人不是绿色也冒充绿色，你没办法让别人信任你。这对消费者来说是一个巨大的选择成本。\n\n第二，你只要把蔬菜种在开阔地里，不打农药它就生虫子。所以真正的绿色蔬菜是在大棚里种出来的，要有封闭的空间，虫子用物理方法杀灭。\n\n绿色蔬菜种起来是非常简单的，在技术上没有任何难题，问题在于你承担不了成本。\n\n3. 这场里一句可以直接搬到投资上的话\n\n你今天想的是要安全、要绿色；等明天都是绿色的时候，你马上就开始想另外一个问题——我们要便宜、要价格。所以你一定要想清楚自己想要什么。你不可能什么都是你的，所谓的经济就是一种取舍。\n\n4. 他自己的做法\n\n我去菜市场买。我的想法和你们都不一样：因为根本就分不清，我也没看哪个人因为吃了这个蔬菜就出现多大的问题，中国的人口平均预期寿命还在不断增加——所以别人吃啥我就吃啥，就这么简单。\n\n他说自己在农村长大，真要规避也有土办法：少吃叶菜、多吃能去皮的（萝卜、黄瓜、胡萝卜、茄子），并顺带纠正了一个常识——「最容易生虫子的是水果树，因为糖分高，所以农药打得最多的其实是水果」。\n\n5. 别妄自菲薄，也别迷信\n\n国外的鲜菜产品要比我们少得多，他们大部分是罐头居多，防腐剂用得一点也不比我们少，只是用的地方环节不一样。罐装的东西不用防腐剂，怎么保鲜呢？\n\n解决鲜菜的运输和物流，实际上中国解决得是最好的。我们鲜菜鲜果吃的量在全世界来说都是相当多的。\n\n我就烦这个事，你们动不动就是拿两个国家一比完事，就是妄自菲薄——老是「人家怎么怎么的，我们怎么怎么的」。我们有我们的问题，他们有他们的问题，你要客观。\n\n6. 他把这条直接落回投资\n\n这个事你要不客观的话，你投资也会不客观。你老是表达立场、表达情绪，你没有看问题的本质，你没有陈述你的客观看法——这是一个非常不好的思维习惯。\n\n你这个思维习惯，你干别的事儿别人说你是傻子；但是你在股票市场上还坚持这个思维习惯，你这裤衩子就得亏没。\n\n## 七、又稳又快的赚钱方法，在刑法里\n\n1. 有人问他有没有又稳又快的方法\n\n股市上你要想赚钱稳，那就不快；你要赚钱快，基本上就不稳。\n\n至于又稳又快的有没有，他的回答是：\n\n有。刑法180条、181条和182条说得非常清楚，你就可以参考那里面的办法——一个是内幕交易罪，一个是编造虚假信息罪，一个是操纵市场罪。你随便选一个，挣钱都是又快又稳的。当然你得没被抓住。\n\n2. 所以别羡慕那些又快又稳的\n\n你不用羡慕那些又快又稳的，也可能他还是处在没有被抓住的情况。所有赚钱又简单又快、又赚得多的办法，刑法里面都有，而且介绍得非常详细。\n\n别人赚多少钱，你别老羡慕——别人能做的事你做不了。\n\n## 八、学习和投资都没有技巧，只有笨功夫\n\n1. 追求技巧本身就是错的出发点\n\n你干什么事老问技巧，这个出发点就错了。人在学习也好、干事业也好，都不要追求技巧，要学会下笨功夫。你如果老是惦记着技巧，那就叫投机取巧。\n\n一说学习你就问有什么技巧——没有技巧。你把那些该读的书都读一遍，而且是每一个字都读，不是一目十行地跳。读完了以后你问你自己：懂不懂？\n\n2. 「该读哪本书」这个问题本身就说明你没在读\n\n你老是问我要读哪本书，就说明你一直都没在读。你找到一本书，从头到尾看完，你就再找下一本——你在读书的过程中，那些书里就互相在介绍。\n\n3. 他打的那个比方：老问怎么减肥的人，一辈子减不成\n\n这就跟一个减肥的人老问「我用什么办法来减肥呢」一样。天天跟你商量用什么办法减肥的人，我跟你说，这一辈子都减不成。\n\n你还没出发，就天天琢磨用什么办法路径最快、费劲最少效果最好——这不还是投机取巧吗？你的精力就都耗费在这个事上了，这就叫内耗。\n\n不管干啥事，投资也好干事业也好，第一件事就是去做。先行动起来，做来做去你就知道了。\n\n## 九、坚持独立思考为什么这么难\n\n1. 有时候隔绝信息比掌握信息更重要\n\n你们处在这种自媒体的时代，信息对你的轰炸，你如果稍有不慎就极容易被人带着跑。在这个时代坚持独立思考尤其难。\n\n有的时候与其你掌握的信息太多，还不如隔绝信息——你都不如把那些自媒体的APP都给删掉。你减少信息的摄入，可能更容易独立思考。\n\n2. 但求同是写在基因里的\n\n这件事是非常不容易的。因为求同、和大家保持一致这种现象，是人类进化的结果——别人做啥你做啥，你就会有安全感。\n\n因为在草原上斑马都吃草的时候，只要有一只斑马开始跑，那你就一定得跟着跑，否则你就容易被狮子吃掉。这就是进化的结果，是写在你基因里头的。\n\n3. 他自己的态度\n\n对于我来说，我个人认为都挺难。但我认为我是能够抵御这些人对我的洗脑的。那你们自己能不能抵御，那就得靠你自己去锻炼了。\n\n我今天主要是要给你们讲独立思考的问题。至于说你的结论是啥样的，并不重要——但是你一定要坚持独立，你不能让自己的观点都是别人喂给你的。\n\n如果在投资上所有的东西都是别人喂给你的，你怎么赚钱呢？\n\n## 十、他自己的收尾\n\n我所说的一切东西都是评书，纯属虚构，不能用来指导投资。即便涉及到股市、股票市场还是个股，都不是投资建议，你们一定加十二万倍的小心。\n\n投资有风险，入市需谨慎，你所有的投资都得是风险自担的——你自己决策，风险自担。","toc":["一、少看花边新闻：你的注意力就是你的资源","二、理性和感性：为什么大多数人跨不过这个门槛","三、独立思考的第一课：先把全貌看完","四、无知之幕：你陈述的是事实，还是立场","五、第二个案例：为什么名人说话要慎重","六、由此延伸：所谓经济，就是取舍","七、又稳又快的赚钱方法，在刑法里","八、学习和投资都没有技巧，只有笨功夫","九、坚持独立思考为什么这么难","十、他自己的收尾"],"url":"https://xueqiu.com/2573414707/407226838","chars":5612},"topics":["独立思考","信息茧房","斯德哥尔摩","司法案例","甲醛白菜"]},{"date":"2026-08-27","bili":{"title":"老木匠 2026年8月27日直播文字稿（周期股弹性、成本外部化、思考防误区）","text":"## 一、周期股投资：弹性在二线，不在龙头\n\n投资周期股，你一定要明白一件事：有些有名的周期龙头里面，有一大群有信仰的拥趸。\n\n这些人对龙头有信仰，低迷期不卖，股价就跌不下去。而新来的人恰恰是在低迷期买入、高涨期卖出——他们不是把龙头当\"茅\"长期持有，目的是赚差价。\n\n结论很反直觉：你越看不上的二三线企业，涨得越多。\n\n龙头大家都认可安全，都知道它会好转，那\"差价在哪儿\"？没人打折出售，你上哪占便宜？\n\n二线弹性完全不同。从低点拉到高点，二线的涨幅远超龙头。\n\n别碰行业末流（容易淘汰），但也别买大家都认的龙头——它价格不会跌太多，没有弹性。\n\n博弈的第二层思维：市场上流传\"利好出尽是利空\"，这句话本身不对。准确的理解是——所有人都知道的利好，才是利空。因为总有人先知先觉先走，等所有人都知道时，恰恰是派发的最好时机。\n\n现在的科技股中报个个增长几百%，但股价照跌不误。股东人数不断增加、价格不断下跌，这就是派发过程：筹码从有优势的投资者（机构）转移到没优势的（散户）。散户做的是布朗运动，形不成合力，只有机构能推动价格持续运动。这个过程相当于股票的\"熵\"在增加——全是好消息却在增熵，是物理学给你们的层次。\n\n## 二、日元商品化：避险货币被大宗商品替代\n\n当年很多人认为日元加息会升值、通胀会缓解，我下过相反的结论：日本加息反倒导致汇率继续贬值、通胀更重。\n\n根本原因在于日元的商品化——日本发的大量货币没有留在国内，而是被运到国外以\"商品\"形式存在。所以日本国债占 GDP 比例超 240%，却长期通缩。\n\n日元过去被称为避险货币，是因为购买力极稳（通缩基础、近乎零息），美元币值波动时大家买入日元避险。但后来全世界的资本找到了\"更好的玩具\"——大宗商品和黄金，日元就不再香了。\n\n所以真正和大宗商品反向的，是日元汇率，不是美元指数。美元指数只是个\"比烂指标\"（相对汇率），不代表美元绝对购买力；美元购买力的镜像是美国国内物价。我多年前就预言：当日元贬值时，最好的投资是买入大宗商品。这也是我重仓有色的最底层逻辑。\n\n黄金的教训同理：1980 年黄金就涨到 800 美元/盎司（按通胀折算今天都没回到），当所有人都对它有信仰时，它已被炒高，不是好标的——和周期股龙头逻辑完全一样。\n\n## 三、思考要防误区：查理·芒格的鱼漂\n\n查理·芒格讲过：他去渔具店看鱼漂五颜六色，问老板\"鱼喜欢这么花哨的吗？\"老板说——我的鱼漂又不是卖给鱼的，是卖给钓鱼人的。\n\n这个故事提醒我们：思考时经常陷入自以为是却没道理的误区。你说\"科技是未来方向\"没错，但那是产业方向、国家投资方向，不见得是个人投资方向。一句话里只要有混沌，慢慢就会自我洗脑。\n\n雪球粉丝多了以后我不讲个股（20 多万粉丝，讲了就封号）。那些有\"专属股票\"的信徒，谁评论不同就来教我、演变成人身攻击——二级市场要饭的，还整出\"谁的股票\"？紫金矿业是谁的？买个仨瓜俩枣就成你的了？你先背诵清楚：你是来赚差价的，不是来挖矿、造船、养猪的。低买高卖是唯一正事，别的都是为这服务。\n\n## 四、成本外部化：国企与私企不对称的真相\n\n水产养殖为什么容易出事？ 库存没法清点——王八冲走了又公告趴湖底没冲走还繁殖了；海参有\"自溶\"机制，生病了自己就化了。所以这类靠天吃饭、难以清点的行业，要远离。\n\n由此推到更本质的：交易最靠谱的不是合同，是对手的人品。巴菲特买公司合同从不超过一页纸，因为他不信合同能把不诚实的人变诚实——要看交易对手。在中国现实下，投资上市公司最好选国企/央企，因为国企没有个人利益驱动去造假，且刑法对侵吞国企（贪污）和私企（侵占）的震慑力度完全不同。\n\n成本外部化是理解很多现象的关键：\n\n造纸厂直排废水省了治污成本，成本转嫁给大自然——私企能和严格合规的国企不平等竞争，最终导致东北国企在和南方私企竞争时大批倒闭，下岗成本由东北担、收益由南方取。\n\n1998 年压锭，压的全是国有纺织厂，私人厂趁机扩张，造成大量职工下岗。\n\n美国科技腾飞，人才主要来源是中国和印度——相当于我们种最好的瓜送美国吃，这也是一种成本外部化。\n\n思考要全面，别口号化。别说\"投资不过山海关\"，也别把美国当天堂——美国当年占先机是占了欧洲战乱的便宜，如今它也\"老\"了（美债高企、加降息两难）；罗马的荣光底下是奴隶制，天堂是有代价的。\n\n## 五、收尾\n\n就讲到这，下播。所有内容都是\"评书\"——虚构演绎、讲道理，不能用来指导投资，我也不提个股，别望文生义跑去下单。\n\n核心三句话：周期股赚的是二三线弹性不是龙头信仰；日元的避险功能早被大宗商品替代；思考时警惕自以为是却无据的误区，成本外部化能解释太多不对称。","toc":["一、周期股投资：弹性在二线，不在龙头","二、日元商品化：避险货币被大宗商品替代","三、思考要防误区：查理·芒格的鱼漂","四、成本外部化：国企与私企不对称的真相","五、收尾"],"url":"https://www.bilibili.com/opus/1241081596807741463","bv":"","minutes":0,"chars":1930},"ai":{"title":"老木匠·2026年8月27日：周期股为什么不能买龙头","text":"## 一、这场的正课：周期股为什么不能买龙头\n\n他说这是前一天和人讨论时突然想到的，早上专门写了个帖子，直播里又完整讲了一遍。\n\n1. 问题出在「有信仰的人太多」\n\n有些特别有名的周期股里面是有一些拥趸的，有一些人对龙头有信仰。那么就会造成一个局面：当这个周期股在周期低迷的时候，这些人因为特别有信仰，所以他不卖。\n\n他们不卖，股价就没有崩塌。而你作为投资周期股的人，一定是在周期低迷期买入的——那你就买不到便宜。\n\n2. 投周期股的人不是来长期持有的\n\n投资周期股的人并不是拿它当龙头、当什么毛来投的，所以并不会长期持有。你在这里面投资主要的目的是为了赚取差价。\n\n差价有两个方面可以获利：卖价高、买价低，都可以造成差价。所以你在投资周期股的时候，主要看的是弹性——当然最主要看的是安全性。\n\n3. 所以龙头的问题是：什么都占优，价格也占优\n\n你能看上的那些东西，大家也都能看上。你知道它是龙头，大家也都知道它是龙头；你知道它是安全的，大家也都知道它是安全的。那我问你，差价在哪呢？没有人打折出售，你上哪儿去占便宜呢？\n\n你什么都占优，你股价也占优——股价占优的话，那你弹性就不足。\n\n他打了个很好懂的比方：\n\n一个人如果是美女，你知道她长得漂亮，别人也知道她长得漂亮，那嫁妆就一定会多。如果一个美女，一看嫁妆特别少，那你就得想其他的问题了。\n\n4. 但也不能买最末流的\n\n周期低迷期的时候，你不是所有的都可以投的。处于这个行业竞争末流的那些企业极容易被淘汰，你投资它就冒着很大的风险。\n\n有人问那能不能等看清楚谁会被淘汰再买，他的回答是：\n\n那不行。等一切都透明化、你已经知道谁能淘汰谁不能淘汰的时候，你最好的时机就已经过去了。\n\n所以他自己的做法是：\n\n我给你们讲过，为什么我绝不投第一，要投第二和第三。因为我买的是周期股——第一弹性不大，第二第三才更有弹性。\n\n你今天回看一下，从低点到高点拉个线，你看看是第一涨得多还是第二涨得多。是从15涨到45大，还是从5块涨到28大？\n\n5. 航空公司那个例子：没跌，就是问题\n\n疫情刚结束的时候有很多人要投资航空公司。我当时就提醒过：航空公司在疫情以后基本面肯定会好转，这谁都能想明白。但问题在于——航空公司在疫情期间压根就没跌，这就是问题所在。\n\n他明明受到了那么大的经营冲击，那三年亏得裤衩子都快没了，为什么股价没跌呢？因为大家都不认输。那你指望他反过来的时候就会涨吗？不会。缓过来的时候，他首先要用钱去弥补亏损。\n\n6. 所以博弈是「第二层次」的思考\n\n你不是说「我这个企业一定是最好的」，天天分析这个也占优、那也占优。博弈的东西是第二层面的——你的思维要开阔，不是顺着你那条道跑到黑。\n\n他还把这条规律推到了周期顶点：\n\n有很多周期股，当周期的顶点真正来临的时候，它们反倒是下跌的。它可能在最初也跟着涨一段，但涨到头的时候可能不会再涨了，甚至可能会下跌，因为它的弹性很小。\n\n你看多少周期股业绩非常好，它就是不涨，你骂说是科技股夺走了资金——那都没有用。每一个投资者都是理性的：你那个东西根本没跌，我凭什么去接你的盘呢？我有的是跌下来的、弹性很高的。\n\n你也可以把股票理解为它们在竞争你们这些资金。你养猪养得好、挖矿挖得好，但是你的股价没有吸引力。\n\n## 二、「利好出尽是利空」这句话本身就说错了\n\n1. 他给了一个更准确的版本\n\n不是「利好出尽是利空」，而是「所有人都知道的利好就是利空」。\n\n因为总有一部分人是先知先觉、是先知道的。你应该想的是：你所知道的这个利好，你是第几个知道的？\n\n2. 为什么必须等到所有人都知道\n\n只有在所有人都知道利好的情况下，这个股票才是卖出的最好时机。如果还有一些傻狍子不知道利好的情况下就卖，那就卖可惜了。\n\n3. 所以看着中报去买，是等着被套\n\n今天科技股有很多回调的，是因为出的中报不好吗？你看科技股的中报哪个不好？哪个中报不是一增长就是百分之几百的？\n\n如果你看着这个中报去买股票，那你不是请等着被套吗？人家把这个菜都准备好几年了，就等今天等你来上桌。\n\n## 三、一个可以直接照着看的组合信号\n\n1. 四个特征同时出现，说明在派发\n\n基本面全是好消息，股东人数不断在增加，价格不断在下跌，成交量甚至也没有明显的缩减——这就说明这个股票里面在派发。\n\n就是人均持股在下降，由有优势的投资者转到没有优势的投资者，由机构转到散户，就这么一个过程。\n\n2. 转到散户手里之后会怎样\n\n谁也不敢保证由机构转到散户就一定会下跌，但是这只股票再想上涨已经很难了。\n\n因为散户的交易是非常随机的，它不会形成主导价格的合力。散户做的是布朗运动，形不成合力；只有机构才可以形成合力，才可以导致价格朝着一个方向持续运动。\n\n无论多么好的基本面，如果这个股票的持股结构全部都是散户，它也形不成合力。\n\n3. 他给这个过程起了个物理学的名字\n\n股价在下跌，股东人数在上涨，然后全是好消息——这个过程实际上相当于这个股票的熵在增加。你要学过物理学就知道了，它是一个增熵的过程。\n\n## 四、日元加息：为什么加息反而更宽松\n\n1. 先说对美股的影响\n\n日元一旦加息，就会导致借日元投资美股美债的这些资金在边际上失去套利的基础。对利息特别敏感的这些边际资金就会从美股和美债撤出，回流日本。\n\n所以对美股来说，会造成一种流动性紧缩的效果，这对美股是一个打击。\n\n他还说了日本这么做的动机：日元对美元不断贬值，而日本对外依存度非常高，所以造成了「输入性通胀」——「不是由国内经济过热导致的内生性通胀，而是由汇率变化导致的」。\n\n2. 但他认为这解决不了日本的通胀\n\n我认为加息对解决日本的通胀问题意义并不大。它可能会解决汇率问题，但解决不了通胀问题。\n\n随着日元回流，汇率的贬值可能发生逆转、甚至可能升值，进口的东西可能便宜了；但问题在于日本国内的日元多了。所以日本加息以后，会导致国内的内生性日元增加——他越加息反倒流动性越宽松。\n\n他和别的国家都不一样。别的国家加息会实现流动性紧缩，但日本加息反倒使它国内的日元流动性在边际上更加宽松。\n\n所以他的推论是：「日本国内的通货膨胀可能不会缓解，反倒有可能更厉害。而最终通胀又会反映到汇率上——所以加息可能导致它的通胀不降反升，最终汇率也一样。」\n\n3. 根子还是那件事：日元被商品化了\n\n日元为什么能加息反倒宽松、加息反倒导致汇率贬值？一个主要的原因就是日元在过去二三十年被大量商品化。\n\n日本借了那么多国债、发了那么多货币，日本央行甚至下场买过股票ETF，但日本依然通缩，为什么？因为他的日元发出来以后，并没有留在国内以货币的形态存在，而是被运到了国外以商品的形式存在。\n\n他还给了个数字：「日本的国债和GDP的比值是所有发达国家里最高的，超过200%、240%，比美国高得多——发了这么多货币，最后居然还是通缩的。」\n\n4. 他当年的那次判断\n\n第一次日元加息的时候，大家都认为日元会升值、日本国内的通货膨胀会获得解决。我当时就下过结论：这次加息一定会导致它的汇率继续贬值，而且贬得更快，通胀会比以前还严重。\n\n结果加完息，日元升一下，然后开始继续贬。一大堆人说日元反常地出现了贬值——我说不是反常，是因为你们理解的这个规律压根就不对。对日本这个国家的理解，和你们对一般主权国家的理解是不一样的。\n\n## 五、这场最有分量的一段：美元指数是个「比烂指标」\n\n1. 他反对那条流行的说法\n\n有很多人跟你们讲，大宗商品和美元指数是反向关系——美元指数上涨，大宗商品就下跌。我从来不认为美元指数和大宗商品之间有什么必然联系。\n\n我还给大家拉过一个图，从1980年到现在，大宗商品和美元指数之间并没有很强的关联性。我一直都不知道那些专家是怎么推导出来的。\n\n2. 原因：美元指数根本不代表购买力\n\n美元指数实际上是个汇率指标，或者说是个比烂指标。它并不代表美元的购买力，而是美元和六种货币之间比较时哪个币值更高的问题，它是一个相对指标。\n\n如果所有的货币都贬值、比美元贬值还快，那么美元指数就会上升。它跟美元本身的绝对购买力是没有关系的。\n\n3. 那美元购买力的真正镜像是什么\n\n美元购买力的镜像，严格地说是所有的物质财富——如果做一个指标的话，其实是美国国内的物价指数。\n\n当美国出现通货膨胀的时候，就意味着美元的购买力在下降，这跟美元指数没有什么关系。美国国内通胀、美元购买力下降的时候，可能其他货币下降得更快，所以这时候美元指数可能反而是上升的。\n\n4. 真正和大宗商品反向的，是日元汇率\n\n这是他当年那个预言的完整推理。第一步是日元为什么会成为避险货币：\n\n日本所谓的失去多少年，其实是以通缩为基础的，或者说他没有通货膨胀。没有通货膨胀就意味着日元的购买力非常稳定、内涵价值几乎不变。所以当美国有风吹草动的时候，大家就买入日元——这就是它被称为避险货币的原因。\n\n日元其实都没有利息，持有它是没有孳息的。但你为什么要买入日元？因为它的购买力稳定。\n\n第二步是：还有什么东西能起这个作用？\n\n这东西和黄金很像。所以当大家开始发现用黄金能更好避险的时候，大家就会抛弃日元。\n\n所以他当年的结论是：\n\n真正的大宗商品走势其实和日元的汇率是反向的——当日元汇率走高的时候，大宗商品就走低，而不是和美元指数反向的。\n\n我当时的原话是：之所以现在日元没有保值功能、不会再成为避险货币，是因为全世界的资本找到了更好的玩具，那就是大宗商品。所以那个时候我预言了未来的大宗商品会上涨，包括黄金。\n\n当日元出现贬值的时候，你最好的投资就是买入大宗商品。其实那也是我一直投资有色金属标的最底层的理论基础。\n\n5. 但黄金有个问题：信仰太多\n\n他在这里把这条线和开头的周期股接上了：\n\n黄金以前也有这个功能，但黄金的问题在于它经过一次上涨，到1980年的时候价格就太高了——涨到800美元一盎司。按通货膨胀率折算的话，今天还没有涨到那个价格。\n\n当某一个东西有很多人有信仰的时候，它就不是一个好的投资标的。当大家都崇拜黄金、对黄金有信仰的时候，你再用黄金去避险那就不对了，因为它已经被炒高了。\n\n它不仅仅被炒高了，最主要是它没有下跌，所以它就不是一个好的投资标的。你要买入它，你就会承担巨大的风险，因为它一定会价值回归。这就跟我开头讲的周期股龙头为什么不值得投资，道理是一样的。\n\n## 六、思维的清晰度：别给自己留混沌的地方\n\n1. 「科技是未来的方向」这句话的问题\n\n科技是未来产业的方向，这没错；是我们国家投资的方向，这也没错。但不见得是投资的方向，不见得是我们个人投资的方向。\n\n你如果老说「科技是未来的方向」，慢慢你就容易傻乎乎地冲进科技股里面去买。\n\n2. 所以他要求思维要「条块分割清晰」\n\n你的思维一定要特别清晰，条块的分割特别清晰，不要有任何混沌的地方。你只要有一个混沌的地方，甚至你说话有混沌的地方，慢慢你就会自我洗脑——你没有分析清楚这事儿，自己就给自己洗脑了。\n\n3. 芒格的鱼漂故事\n\n芒格爱钓鱼，有一次上渔具店买鱼漂，那些鱼漂做得五颜六色、非常鲜艳。他就问渔具店老板：鱼真的喜欢这么五颜六色的鱼漂吗？老板说，我的鱼漂又不是卖给鱼的。\n\n芒格讲这个故事是想说：你在思考的时候经常会陷入一些误区，你要时刻警惕——你觉得看似有理的地方，其实没有道理。\n\n## 七、你到市场来是干什么的\n\n1. 他对「你是什么派、主打什么方向」的回答\n\n有人问我，老师你用什么方式投资？我说我投资主要的方式就是用挣钱的方式。问我主打什么方向？我主打赚钱的方向。\n\n三脚猫老有门派之分。你看东邪西毒南帝北丐，谁是啥派的？是人家自己说过啥派？就他妈寒碜的，天天说自己是名门正派。\n\n2. 把正事记住\n\n你不是来养猪的，不是来挖矿的，也不是来造船的，你是来赚差价的。你唯一需要做的是低买高卖，别的都是为了服务这件事的。\n\n你也不是为了知识科技发展的——你支持科技发展也是为了低买高卖，你长期持有也是为了低买高卖。你先别骗自己，先背诵一下你自己干啥来了，别把正事都忘了。\n\n3. 以及一句自嘲式的提醒\n\n你研究了挖矿，就天天觉得自己是矿业专家了。你懂矿？你下过井吗？\n\n我有时候一看，咱中国最厉害的科技专家都在证券公司——那研究员最懂科技，啥都懂，中国的科技未来都在他们掌握之中。你问问他们投资的业绩咋样？\n\n他还讲了个九十年代流传的老段子：有个老股民炒股亏得销声匿迹，多年后西装革履地回来给大家讲课，人家问他怎么翻身的，他说——\n\n所以你要知道，研究员就是被骟了的基金经理。\n\n4. 他对自己的定位\n\n大家见过我捍卫过哪个股票吗？哪个股票也不是我的，越骂得多不是越便宜了吗？骂便宜了我不可以多买点吗？\n\n我卖出了就告诉你有风险；如果我卖出了还告诉你它特别好，那我不是骗你们吗？我买入的时候当然就会觉得它好——这叫知行合一，说的和心里想的是一样的。\n\n你不论买哪个股票，包括我自己买的，都是概率游戏，多多少少里面都有运气成分。你只是通过自己的思考，把运气成分排除到最低。\n\n## 八、什么行业不能碰：清点不了的行业\n\n1. 水产养殖最容易出问题，原因只有一个\n\n水产养殖最大的问题是：你没办法清点。不是财务容易造假，是他的库存你不好清点——我告诉你这个湖里头有一万只王八，你去数，你咋数？\n\n其实对于普通的养殖户来说，他自己也清点不了，这东西就是一个靠天吃饭的东西。\n\n他举了海参做例子：「海参在捞之前，养殖户自己都不知道下面一共有多少、成活的产量是多少。而且海参有个机制叫自溶——一旦有某种疾病，它自己就化了，啥也没有了。」他还提到当年那家在鄱阳湖养甲鱼的公司，发洪水后先说甲鱼被冲走了、股价跌下来，过几天又发公告说清点完毕、甲鱼都趴在湖底没被冲走，还繁殖了不少。\n\n2. 这条规律可以推广到整个养殖业和农业\n\n由此你也可以推导到整个养殖行业都存在这个问题，养鸡也是一样——鸡舍里一共有多少只鸡，你怎么数？你今天数完这个鸡舍，明天再数那个的时候，我连夜把这些鸡拉到那边去，你可以随便数。\n\n农业是靠天吃饭的，你在收成的那一刹那，谁也不知道今年收成是多少，抽样统计也不一定就准。\n\n3. 所以最终要看的是人，不是合同\n\n什么东西都能造假。所以巴菲特说你要投资的话，最主要是投资管理人员，你要找到一个诚实的人，而不是想办法把不诚实的人给束缚住。\n\n根据我多年的法律从业经验：如果他想骗你，你把他绑上，他也能骗你。\n\n交易最靠谱的东西根本不是写一个500页的合同。巴菲特买公司写的合同从来不超过一页纸——因为他根本不信用合同就能把人变得诚实。关键在于看交易的对手。\n\n4. 由此他给了一条选股上的偏好\n\n在判断管理层和所有者的信誉方面，国企要比私企强得多。不是说私企没有好的，是私企对于我们普通小散来说难以判断、选择太困难。\n\n央企总的来说是没有个人利益的。他没有必要找一大堆人非要造假——造假以后利益他也得不到，最后责任还都是他自己担。\n\n他还提到一个法律上的差别：「同样是把企业的钱拿回家，国企叫贪污，私企叫侵占，两者的刑期是完全不同的。刑期不同，震慑力就不同。」以及「国企有专门的机关看着，而这个反腐成本是外部化的；私企的反腐成本基本上是自己担」。\n\n## 九、成本外部化：一个解释了很多事的概念\n\n1. 先用造纸厂讲清楚这个概念\n\n造纸的排放污染特别严重。对一个央企来说，他敢不敢把废水直接排到河道里？不敢——排放对他来说是为了省钱，可省下的钱不归他自己、归国家，责任却是他的，所以谁也不愿意干这件事。\n\n而一个小的私营造纸厂不在乎这个，他就把废水直接排到河道里，抓住我再说，抓不住我就干一天是一天。他直接向江河湖海排污的这个过程，就相当于成本的外部化。\n\n它本来应该有污水处理设备、达到排污标准才能排放，是要花一笔钱的。现在他直排了，成本就省了——那这个成本转嫁到哪去了？转嫁到大自然了，转嫁到国家了。\n\n2. 所以竞争地位从一开始就不均等\n\n同样生产一张纸，国企用一块钱，人家用八毛钱就可以了。那两毛钱的成本负担是被社会承担了。那你怎么在这个行业里和私营企业竞争呢？你竞争不了，国企就破产倒闭，私企就站住了。\n\n他还举了第二个例子：\n\n私企在雇佣员工的时候可以不交保险，国企做不到这一点。你国企不给人提供五险一金，你就违法了。\n\n3. 他用这个概念重新解释了九十年代那段历史\n\n1998年大量东北的工业企业倒闭，本身是因为和南方的私营企业竞争的时候并不处在同等的地位。东北的国企需要解决的问题非常多——不仅包括保险，还包括养老、采暖费，还有排污和各种社会责任都得承担；而南方的私企什么都不需要考量。\n\n最典型的是当年纺织行业产能严重过剩，国家主导了一次「压锭」，相当于供给侧改革。但压锭最终压的都是国有纺织厂，而私人纺织厂根本不在乎、在此期间大量扩张。所以从那以后国有纺织厂全军覆没——而国有纺织厂是最大的劳动密集型产业，导致了大量职工下岗。\n\n这些工厂下岗倒闭的成本是由东北来担的，而后来南方私人纺织厂的收益是由南方获取的。当产业转移的时候，我担的全是成本，你获得的全是收益——这对于不同地方的竞争来说，也是一种成本外部化。\n\n别人一说就是「投资不过山海关」——你分析过当时的历史原因吗？他自然有效率低下的问题，但不全是。你今天在想这些问题的时候，要客观全面。\n\n4. 同一个概念也能解释国际间的事\n\n最近几十年美国科技获得极大发展，其中人才的主要来源是中国和印度。这也相当于成本外部化。\n\n我上大学那会儿，清华北大得有一半学生最终都去了美国、没回来。那相当于我们是种瓜的，最好的瓜摘下来送到美国去吃——而种瓜的钱是我们出的。\n\n他还顺带给了个判断：「如果长此以往，中国不再向他们输送这些最顶级的智能资源的时候，那他的科技怎么发展呢？」\n\n## 十、别把结论口号化：美国、深圳与罗马\n\n1. 美国最初有什么科技\n\n别把美国想得像太阳似的、像天堂似的。他最初有啥科技？他们最初的科学家不都是欧洲去的吗？是因为两次世界大战，欧亚大陆都是战乱，你要想研究科技只能去美国。\n\n2. 深圳工资高的真正原因\n\n你说深圳工资高是由于科技——我告诉你科技是结果，不是原因。原因是那个地方是一个新出现的地方，它没有历史上的负担。\n\n你把东北那些老头老太太都派过去，一个养老费、一个医疗费就把你拖死。深圳去的都是各地最好的年轻人，交医疗保险的人多、用医疗保险的人少，所以财政非常健康，所以什么都好——他是因为他没老。\n\n3. 美国也是一样：它老了\n\n美国今天也是一样。为什么王朝都是二百多年就完了呢？他也没老的时候什么都对——二次世界大战的时候他做啥都对。为什么今天做啥都不对了呢？你加息也不敢加，降息也不敢降，美债那么高——因为你老了。\n\n4. 罗马和大观园\n\n罗马还是天堂呢。你现在想古代最辉煌的罗马，那代价是有一大部分人是奴隶。罗马的天堂不是所有人的天堂，真正的罗马公民是很少的。\n\n你们都合计大观园多好，贾宝玉、林黛玉天天吟诗作画、吃鹿肉。那你穿越回去，你咋不想着当丫鬟？晴雯有病了，就给你撵出去。\n\n他的落点是：「你在下结论之前，先别口号化了。思考要全面，打开你的思维，别那么狭隘。」\n\n## 十一、他自己的收尾\n\n我讲的都是评书，你不能用来投资，也不能用来指导你的下单。我也不提个股，你别望文生义。\n\n讲道理的时候有时候会举些例子，你别看到例子就开始拆、然后就开始投资了——那不行，你把裤衩子亏没了，这事不怨我。","toc":["一、这场的正课：周期股为什么不能买龙头","二、「利好出尽是利空」这句话本身就说错了","三、一个可以直接照着看的组合信号","四、日元加息：为什么加息反而更宽松","五、这场最有分量的一段：美元指数是个「比烂指标」","六、思维的清晰度：别给自己留混沌的地方","七、你到市场来是干什么的","八、什么行业不能碰：清点不了的行业","九、成本外部化：一个解释了很多事的概念","十、别把结论口号化：美国、深圳与罗马","十一、他自己的收尾"],"url":"https://xueqiu.com/2573414707/407226781","chars":7955},"topics":["周期股弹性","成本外部化","思考防误区"]},{"date":"2026-08-26","bili":{"title":"老木匠 2026年8月26日直播文字稿（汇兑损益与金融市场如何替实体扛风险）","text":"## 一、开头：人民币升值的背后\n\n大家早上好。今天一上来先说一个事——现在人民币升值升得非常稳、非常快，我认为这可能预示着有外资正在进入中国市场。他们来是买债券还是买权益市场，我不知道。\n\n但还有一个原因：前一阶段很多企业出口后没有及时结汇。因为现在人民币有升值趋势，这些企业如果不快速结汇，就会造成汇兑损失。原来一些大企业出口后，美元没及时结汇，放在国外吃利息——美元利息高嘛。所以我们看到，贸易顺差这么大，但外汇储备没同步增加，说明很多人没结汇。没结汇的原因，就是美国市场无风险收益率高，搁那儿能吃利息，尤其一些大国企央企基本都这么干。但现在一升值，利息吃完了可能还不如人民币升值带来的损失多。\n\n光伏的汇兑损失，主要就是当年应收都是美元——资产是应收美元，出口以美元计价又没收到现金，记的是应收账款，换回人民币时就有汇兑损失的问题。\n\n## 二、核心知识点：汇兑损失到底怎么回事\n\n### 1. 先搞懂一个根本前提：在中国，美元是商品不是货币\n\n对国家来说，货币是法定的，叫法币。除了自己的法币，其他东西在本国都被认为是商品。所以虽然你觉得美元信用比人民币好，但对中国人来说美元是一种商品。\n\n你买美元、买黄金、买国内股票、买房地产、买外国股票，道理都一样——是用人民币计价的一种商品。美元在中国的地位不是货币，这点必须牢牢记住，才能理解后面的东西。\n\n有人不明白，觉得美元也是货币，不对。美元、日元、欧元，只要外币，在本国范围内都不叫货币，都叫商品。\n\n记账本位币：你在中国境内经营，记账本位币就是人民币。特殊情况也有，比如你发的B股，财务报表本位币可能不是人民币；你在香港发的港股，本位币可能是港币。同一个上市公司，上市地点不同，记账本位币可能不同。\n\n货币是主权。前一阶段阿根廷总统米莱允许美元流通，相当于放弃了货币主权，金融就国门大开，被别人控制。津巴布韦为对抗恶性通胀，把好几国货币都定义为货币在本国流通，也是放弃了货币主权。这在中国绝对不允许。\n\n所以你国内用美元买东西，经济学本质上是物物交换、易货贸易——美元是商品，买的东西也是商品，商品换商品。你不是用\"钱\"在支付。\n\n### 2. 汇兑损益怎么产生的\n\n上市公司有海外业务、出口业务或在国外有分公司，里面很多资产是以美元计价的。比如你在美国有个全资子公司，当地用美元结算，它的财务报表本位币是美元；并表时就要把美元折算成人民币。出口签美元合同，没收到款时是一笔美元应收账款，也要折算成人民币；收到美元现汇，美元现金也是商品，同样按人民币记账；在国外买矿，当地也按美元计价，进公司先折算成人民币。\n\n问题来了：人民币和美元汇率是浮动的，按什么标准折算？按你出财务报表那天的汇率折算。一季报按3月31号汇率，中报按6月30号汇率，同样一笔美元资产，汇率不同，折算成人民币就有差异。\n\n美元升值（人民币贬值）→ 美元涨价 → 折算成人民币凭空多一笔 → 记账为汇兑收益\n\n美元贬值（人民币升值）→ 折算成人民币变少 → 形成汇兑损失\n\n汇兑收益和损失合起来叫汇兑损益，记在利润表的财务费用里（利润表三大费用：研发、销售、财务）。\n\n所以你就明白，为什么人民币升值时，那些出口业务大的企业会平白无故产生一笔损失。矿在国外的，挖出来的矿当地按美元算、国际市场也按美元算，卖到国内折算成人民币，就有汇兑损益差。升值对这类企业不利，贬值有利。\n\n细节上，以美元计价的固定资产（比如矿）和以美元计价的流动资产（应收美元账款、美元现汇）还不太一样：流动资产的汇兑损益当期就计入费用；固定资产的汇兑损失一般不会立即反映到报表里。\n\n### 3. 企业怎么规避：套期保值与金融掉期\n\n出口占比大的公司，为防止汇兑损失，在卖出那一刻就直接锁定付款时刻的汇率，这叫套期保值，本质上就是现货市场上的远期交易。比如约定三个月后付款，怕期间汇率变，就用外汇期货套期保值——现在就把三个月后的美元卖掉。\n\n矿产资源套期、原材料套期，工具很多，都是为了锁定汇率、避免汇兑损失。因为企业不想赌汇率，生产型企业承受不了这种金融变动带来的损失，也不想要收益，就把风险在金融市场上切割出去。\n\n金融市场最主要的好处，就是承接实体经济的风险。 期货市场、汇率市场都是干这个的——实体经济有些损失不想承担，就甩给金融市场，因为金融市场上投机的人多，能承受损失也能获取利润。\n\n除了汇兑，还有信用违约掉期（CDS）：企业应收账款可能债务人违约，对实体经济也是风险。出借人不想承担违约风险，就付一定成本把这个风险打包卖出去，相当于给违约上一份保险。就像你买车险三者险，出事故要赔人钱时由保险公司赔，代价是付保费；保险公司因为不是所有人都出事，经过精算有盈利。CDS也一样，经过精算知道有多少人会违约。\n\n对应汇兑风险，企业用的工具叫外汇掉期，也是给汇率变动买一份保险——保证签合同交付时的汇率和付款时的汇率一样，避免没收到钱就凭空来一笔损失。\n\n这些金融工具，本质都是把实体经济中金融变动带来的风险分摊出去。知道原理就行，别钻细节。\n\n## 三、扯远一点：慎独与修身\n\n平台最防的是引流、是同行。所谓\"同行是冤家\"，公牛最大的敌人是公牛不是狮子。你得守规矩，不是看有没有人抓你，是刻在骨子里——没人看着你也别随地大小便，这叫慎独。\n\n中国古代君子标准之一就是慎独：不是人前装得像君子，自己一个人的时候也要要求高。休河无人见，存心有天知。修身、齐家、治国、平天下，是进阶过程，先得修身，家里乱糟糟的谈什么治国。\n\n但现在从短缺经济过来的那一代人（六七十岁老人），很多把传统东西忘了。贫穷刻在骨子里：抢东西、插队、不守规矩，是因为当年守规矩可能就没饭吃。我住的小区，常有老人用消防气瓶顶住单元门不让它关，物业都收拾不了，穷横。\n\n所以物业公司在中国是个\"舶来品\"，最失败的模式之一。本质原因：中国人不会行使成员权——作为组织成员，由自己决定组织决策的权利。成员权的政治基础是公民训练，我们这代人习惯的是被管理。我认为小区最合理的是像八十年代归街道办事处管，不交卫生费就罚钱。\n\n千金买房，万金买邻——你买的是邻居不是房子。越穷越横，腰里无钱心似铁，老赖不是不要脸，是真没钱。\n\n## 四、给孩子的一课：你没那么重要\n\n昨天雪球上有人跟我争论，带着莫名的自信，觉得我瞧不起他，后来我把那小伙拉黑了。这种孩子是被惯大的，独生子女教育容易教废——觉得自己是世界的中心。\n\n你们上学时有没有这种感觉：我认真学习了、熬夜了，全世界都欠我的，父母连电视都不敢看。但学习是你自己的事，跟别人没关系。我大学毕业一边工作一边考研究生，同事在旁边聊天我气得不行，后来才明白——考研究生是我自己的利益，别人凭啥觉得我对世界有贡献。\n\n我们律所招助理，985、211来了都觉得自己有五把刀，一毕业就要高工资。我第一件事就打击他们：你对我现在是负资产，我得教你，按道理该你给我钱。沈阳市法院门朝哪边开你都不知道，让你去立案我还得重新教。等你真有能耐了，给多少钱都有人聘。\n\n进入社会第一课：把自尊藏起来。大家都忙自己的柴米油盐，没人关注你。说话老说\"我\"，就把注意力放自己身上了。跟领导提意见得会提——领导让你提，你就说\"您太累了得照顾好身体，要有个三长两短我们可怎么办\"，这意见就提完了。\n\n拍马屁也得会拍，不能直拍，那不成打屁股了。\n\n所有有时间积累效应的行业，你一毕业境遇都很糟——律师、医生、公务员都是。一毕业就有高待遇的，都是吃青春饭的（比如码农），年龄越大重要性越低。很多高分学生都去报计算机，我说那职业干不到五十岁。你要从事的是年轻人根本不行的行业，那才是未来衣食无忧的——时间的积累不可替代。\n\n当然第一重要的是喜欢，不喜欢啥也不行。教育的目的不是给你找份工作，而是提升你改变命运的能力。现在大学按技校模式办，用就业率衡量大学非常匪夷所思。教育提高的是素质，不是劳动技能。\n\n## 五、收尾\n\n今天就讲讲汇兑损益这个知识点，每天给大家讲一个，再扯点闲篇，大家一乐呵，别太认真。我今天还得看盘，创业板往下走了。\n\n我说的东西都没有现实依据，就当评书听——评书、笑话、说唱艺术，属于曲苑杂谈。谁被刮着了也别太认真，要不我得天天哄小孩。昨天那小伙我直接拉黑拉倒，你们互相争论话不投机就拉黑，别掰扯。\n\n行了，关播，谢谢谢谢大家，我要看盘去了。","toc":["一、开头：人民币升值的背后","二、核心知识点：汇兑损失到底怎么回事","三、扯远一点：慎独与修身","四、给孩子的一课：你没那么重要","五、收尾"],"url":"https://www.bilibili.com/opus/1240710425703612425","bv":"","minutes":0,"chars":3424},"ai":{"title":"老木匠·2026年8月26日：人民币升值与汇兑损益","text":"## 一、当下最该关注的：人民币在快速升值\n\n1. 他给的第一个提醒\n\n大家现在一定要关注人民币升值，现在人民币升值得非常稳、非常快。\n\n他给了两种可能的解释。第一种：\n\n我认为这可能预示着有一些外资在进入中国市场。至于他们来是买债券还是买权益市场，这个我就不知道了。\n\n2. 第二种解释：企业开始集中结汇了\n\n这一条更具体，也解释了一个长期存在的疑问：\n\n前一阶段有些企业出口以后没有及时结汇——因为美元利息比较高，把美元放在国外去吃利息了。所以我们会看到，虽然贸易顺差这么大，但外汇储备没有同步增加，这说明有很多人并没有结汇。\n\n尤其一些大的国企央企基本都这么干。但是现在一升值了以后，就会造成很大的汇兑损失——你这个利息最后吃完了，可能还不如人民币升值所带来的损失多。\n\n所以现在这些企业会急着结汇，而集中结汇本身又会进一步推升人民币。\n\n## 二、这场的正课：汇兑损益到底是怎么回事\n\n他说讲这个是因为「你们有些基础知识都不懂」，而在人民币快速变动的时期，很多人根本不知道汇兑损失是什么。\n\n1. 第一步，也是最关键的一步：外币在本国是「商品」\n\n对一个国家来说，货币是法定的，叫法币。除了自己的法币之外，其他的东西在本国都被认为是商品。\n\n虽然你认为在国际上美元的信用可能比人民币还好，但对于中国人来说，美元是一种商品。你买美元、买黄金、买国内的股票、买房地产、买外国股票，道理都是一样的——它是一种用人民币来计价的商品。\n\n他要求先把这一点记牢：「你才能理解以后的东西。很多人不明白这一点，他认为美元也是货币，那是不对的。」\n\n他还顺带解释了「在国内用美元买东西」是怎么回事：\n\n那在经济学本质上属于物物交换、属于易货贸易。因为美元也是一种商品，你所买的东西也是一种商品，实际上是商品换商品。\n\n以及为什么货币主权不能放弃：\n\n阿根廷总统上来以后直接允许美元在阿根廷流通，那实际上相当于放弃了货币主权。货币本身是主权的一个范围，你放弃了货币就相当于金融上国门大开，相当于被别人控制了。\n\n2. 第二步：什么叫记账本位币\n\n你记账是不能用商品来记的，你只能把所有商品都折算成货币。用来折算、用来在财务报表上体现的那个东西，就叫做记账本位币。在中国境内，你的记账本位币就是人民币。\n\n他还提了个容易忽略的细节：\n\n同样一个上市公司，由于财务报表发布的地方不同、上市地点不同，记账本位币也可能不同。比如你在香港发行的港股，那份财务报表的记账本位币可能就是港币。\n\n3. 第三步：汇兑损益是怎么产生的\n\n由于人民币和美元的汇率是浮动的，那你究竟按什么汇率来折算呢？是按照你出财务报表那天的汇率。\n\n一季报是按3月31号的汇率折算的，中报是按6月30号的汇率折算的。这个时候同样一笔美元资产，由于汇率不同，折算成人民币就有差异了。\n\n假如美元升值了，也就是人民币贬值、美元涨价了，那你折算成人民币就凭空多出来一笔——这一笔就记为汇兑收益。反过来，如果这期间人民币升值了，那折算成人民币的时候就会形成一笔损失，这就叫汇兑损失。\n\n4. 第四步：它记在报表的哪个位置\n\n汇兑收益和汇兑损失合起来叫汇兑损益。它记在利润表里的财务费用里面。合并利润表里有三大费用——研发费用、销售费用和财务费用，汇兑损益就记在财务费用里。\n\n5. 所以人民币升值，对哪些公司不利\n\n你为什么人民币升值的时候，一些有很多出口业务的企业就会平白无故产生一笔损失？这笔损失就是人民币升值造成的。\n\n他举了两个例子。一个是光伏：\n\n光伏的汇兑损失主要是因为当年都是应收美元——他出口时以美元计价，而且没收到现金，记的是应收账款。这些应收美元现在换回人民币，就存在汇兑损失的问题。\n\n另一个是海外有矿的公司：\n\n你在国外的那些矿，挖出来的矿产资源在当地是按美元计算的，在国际市场上也是按美元计算的，你卖到国内的时候就要折算成人民币，所以就会有汇兑上的损益差。\n\n升值的时候一定是对这些企业不利的，贬值的时候一定对这些企业有利。\n\n6. 一个细节：固定资产和流动资产不一样\n\n以美元计价的固定资产，和以美元计价的流动资产还多少有点不同。比如你买了一个矿，随着人民币升值，这个按人民币计价的固定资产价值是在逐渐减少的，但这个汇兑损失一般不会立即反映到财务报表里。而流动资产——比如应收美元账款、美元现汇——在当期就计入费用。\n\n他强调不必陷进细节：「你知道这个东西的原理就行了，要不然你就成会计了。」\n\n## 三、由此延伸：金融市场是干什么用的\n\n1. 汇率套保：把风险切割出去\n\n套保的道理实际上相当于远期交易。你在三个月以后会收到一笔美元，你怕这期间汇率发生变动，那你现在就把三个月之后的美元卖掉。\n\n他解释了企业为什么要这么做：\n\n汇兑损益原本波动是双向的，你有吃亏的时候，也有占便宜的时候。但对于生产型企业来说，他承受不了这种金融上的变动带来的损失，他也不想要这个收益——对他来说没有意义。所以他把这个风险在金融市场上给切割出去。\n\n2. 这就是金融市场最主要的好处\n\n金融市场一个最主要的好处，就是它可以承接实体经济的风险。尤其期货市场和汇率市场都是干这个的——你实体经济里有些损失不想承担，就把这些损失甩给金融市场。因为金融市场上投机的人比较多，他既然能承受那个损失，他也就能获取那个利润。\n\n3. 同一个道理：信用违约掉期\n\n银行给客户做房贷，不可能所有人都按时还，总有一些人违约。这些违约的风险怎么办？对于出借人来说不想承担，那就付一定的成本，把这个风险打包卖出去，让有些人来承担。\n\n它相当于给客户违约设置的一份保险，由担心风险的债权人买入。\n\n他用车险做了个类比：\n\n第三者责任险就是：当你需要赔别人钱的时候，这个钱不用你赔，由保险公司赔。这就是把交通事故的责任事先分担出去了，代价是你要支付一部分费用。而对保险公司来说，因为不是所有买保险的人都会出事故，所以他还是有盈利的——他是经过精算的。信用违约掉期也是这样，精算算的是有多少人会违约。\n\n4. 外汇掉期也是一份保险\n\n外汇掉期就是给汇率变动买了一份保险——我保证签合同交付产品时的汇率，和你付我款时的汇率是一样的，要不然我还没收到钱，凭空就有一笔损失来了。\n\n他的总结是：「这些东西都是金融工具，对实体经济来说都是为了分摊掉金融变动带来的风险。大家知道就可以了，不要沉浸到细节里面。」\n\n## 四、慎独：他对自我约束的看法\n\n这段起因是有人让他推荐商品，他借机讲了自己的行为准则，和他一贯讲的「对自我的约束要画得比法律和道德更大」是同一条线。\n\n1. 不是怕被抓住，是要守规矩\n\n这不是谨慎，这是你得守规矩。不是说他能抓住我——他抓不住我，那你也不能做。你不得慎独吗？在你没有被抓住的时候，你也要守规矩。\n\n你要刻在骨子里，不是看有没有人看着你，没有人看着你你就随地大小便。\n\n2. 慎独是君子的标准之一\n\n中国古话讲，头上三尺有神明。你得自己严格要求自己，别一整就是「没人抓住」——你不要形成一个习惯，觉得这事只要没人看着我，我就偷偷做。\n\n你不是说在人前装得像君子似的，你自己一个人的时候也要要求高。\n\n他还讲了这对孩子的影响：「我见过太多的小孩，只要一离开监管，自己放飞了以后，别人只要没抓住这件事就没发生。他一旦形成这个理念，那这孩子以后就是个事儿——他就会千方百计钻空子、占小便宜。」\n\n3. 顺带一句关于竞争的话\n\n平台最防的是平台，所谓同行是冤家。我跟你讲过——公牛最大的敌人是公牛，不是狮子。\n\n## 五、物业与「成员权」：一个被忽略的概念\n\n1. 他的判断：物业公司在中国是最失败的舶来模式\n\n物业公司在中国是一个舶来品，是一个最失败的模式。本质的原因就是中国人不会行使成员权。\n\n2. 什么叫成员权\n\n你作为一个组织的成员，这个组织干什么、怎么决策，都是由每一个成员来决定的，这就叫成员权。这个东西对中国人来说极其陌生。\n\n公民才能行使好成员权，臣民是行使不好的。所以我们从历史到今天，最主要、最容易行使的是管理权——就是你需要有人管理。\n\n3. 所以现在的小区物业只是一种「习惯」\n\n现在我们所有的小区，无论高档低档，所形成的只是一种习惯而已。开发商开发完住宅留下的物业公司，只是形成了一个习惯，并不是由真正业主决定的。\n\n即便住在高档小区里面，住在里面的人也是有一种「我是被物业公司管理」的感觉，都没有建立起「物业公司原本是你们共同商量聘请来的」这种意识。\n\n4. 他讲的两个真事\n\n一个是不交物业费还要提意见的邻居：\n\n邻居振振有词地说这物业费就不该交，你看他们地都没扫、坏的东西都不修。我心里在想：你没交，占的是我的便宜，因为我交了。你以为占的是物业公司的便宜？你不交物业费，物业公司能亏钱给你干活吗？你正好把这事整反了。\n\n你要作为成员提意见，你得先交完物业费再提。你钱都没交进来，就觉得自己是消费者。\n\n另一个是疫情期间封门的邻居——先是骂为什么不封门，等真把他家旁边那个门封了、进出不方便了，又开始骂为什么封我家旁边的门。他说这是「那个时代老人的写照」。\n\n5. 他对这一代人的理解\n\n现在全国出现的各种乱象，很多都是六七十岁的老人，都是我们这拨人。因为都是从短缺经济出来的——任何商品的赠品，即便没有需求也要拿走，这就是穷所造成的后遗症。抢座、插队、不守规矩，因为当年你守规矩你就可能没饭吃。\n\n中国古话叫仓廪实而知礼节，衣食足而知荣辱。还有句老百姓的话叫「腰里无钱心似铁」——你像那些老赖，真没钱，他要能还上钱，他不愿意这样。\n\n他由此又回到了买房那条建议：\n\n买房子你不用在乎新旧，关键要看这个小区的档次。千金买房，万金买邻——你买的是邻居，而不是买的这个房子。\n\n## 六、给年轻人的几条：关于位置和职业\n\n1. 「我学习了，全世界就欠我的」——这是最需要被打破的错觉\n\n他说自己也有过这种感觉，直到工作后一边上班一边考研：\n\n我学习的时候，那帮同事在那聊天，把我气的——我都学习了，你们怎么还能聊天呢？后来我才慢慢发现：考研究生这是我自己的事，跟人有屁关系。你学习本身相当于在工作当中已经分神了，不是该夸奖你，是该批评的。\n\n你学习是你自己的利益，别人凭啥要觉得你已经对世界有贡献了？\n\n2. 刚毕业的时候，你对单位来说是负资产\n\n他讲了自己当年招法律助理时说的话：\n\n我告诉你，你对我来说就是个负资产。现在我得教你，按道理应该你给我钱，不是我给你钱。你985、211那都是狗屁——我现在让你去立案，我得重新教你一遍，比我自己去还费劲。\n\n我给你钱是为了可怜你，你别觉得自己多能耐。当你真正有能耐的时候，给你多少钱都有人聘。\n\n3. 走向社会第一件事：把自尊藏起来\n\n你把自己的自尊想得太强了。这个世界大家都为了自己那点柴米油盐的事儿，挺忙的，没人关注你。你以为像班级课堂上没回答上问题、别人会笑话你？都是把自己看得太高。\n\n你说话的时候老是「我怎么怎么样」，你就会把注意力放在自己身上，老是强调你自己的感受、你自己的观点。\n\n4. 这场最实用的一条：一毕业就吃香的，都是吃青春饭的\n\n一毕业就会有很高待遇的，这都是吃青春饭的。因为它没有时间的积累效应——随着时间的推移，一般来说它的重要性会降低。\n\n所有有时间积累效应的行业，你刚毕业的时候境遇都很糟糕，包括律师、医生、公务员。如果你恰巧进入了一个一毕业就特别难受的行业，那我告诉你，恭喜你——这个行业是有时间积累效应的，通俗地说就是越老越值钱的行业。\n\n没有一个职业是一毕业就高、而且会越来越高的，那你就把其他职业都吞噬掉了。跑百米就是跑百米，跑马拉松就是跑马拉松。\n\n他还补了一句前提：「第一件事是自己喜欢，兴趣是最好的老师。你不喜欢啥也不行——你让他当皇上他都不喜欢，人家还愿意当木匠打家具。」\n\n5. 他对当下大学教育的批评\n\n教育提高的是素质，不是提高劳动技能。通过教育你要提升的是自己改变命运的能力，而不是说教育最后给你找到了一份职业——那是完全错的。\n\n现在大学教育基本都是按技校的模式来的，都是为了毕业就业。用大学的就业率来衡量某一个专业，是一个非常匪夷所思的指标，这是我一贯最反对的。\n\n6. 关于「代际累积」的一段\n\n你别一出生就觉得人家父母有经验、有钱、是大官，我们啥也没有，老是一副不忿的样子。那是因为当年你父亲没受那苦、没成长起来，就得从你这一步重新成长。每一个家族想改变命运，总有一个人要受辛苦，总有一代人是很辛苦的。\n\n我进入社会的时候，父母给不了我任何建议，因为我所面临的世界对他来说太陌生了。所以我都是无数次碰壁慢慢明白的，比人家明白得晚。我现在明白了，我儿子就不会再走我那个老路——这就是代际之间的累积。\n\n## 七、他自己的收尾\n\n今天就讲一讲汇兑损益的事，每天给大家讲个知识点，我觉得挺好。完事再扯点闲篇就下播，大家一乐呵，都别太认真。\n\n今天讲的都是评书，不能用来指导投资。我所说的东西都没有什么现实依据，你就当评书一听，没有真事，全都是虚构出来的。","toc":["一、当下最该关注的：人民币在快速升值","二、这场的正课：汇兑损益到底是怎么回事","三、由此延伸：金融市场是干什么用的","四、慎独：他对自我约束的看法","五、物业与「成员权」：一个被忽略的概念","六、给年轻人的几条：关于位置和职业","七、他自己的收尾"],"url":"https://xueqiu.com/2573414707/407226706","chars":5315},"topics":["人民币升值与汇兑损益"]},{"date":"2026-08-25","bili":{"title":"老木匠 2026年8月25日直播文字稿（美元重置与散户看不见的筹码游戏）","text":"## 一、昨天美股科技大跌，别急着喊流动性危机\n\n昨天美国科技股（半导体、光通讯）跌幅很大，但我说现在还谈不上流动性危机——目前只是市场对\"AI 能不能持续盈利\"的怀疑，不是钱的问题。\n\n流动性危机什么时候才来？当市场下跌触发保证金交易的强制平仓时才叫危机。美国那套是自带杠杆的保证金交易（交 50% 保证金等于两倍杠杆），股票跌到保证金不够就要追加（margin call），追加不上就强平。我们 A 股的融资是\"真借钱\"，性质不同。所以现在的跌，还只是怀疑，不是危机。\n\n## 二、美国政治体系在\"家族化\"，贝森特是宠臣不是救世主\n\n贝森特现在干的事（谈伊朗制裁、对日谈判）本该是国务卿的活儿，但卢比奥长期不露面、国防部长赫格塞思也很少出来，全由贝森特顶上。这说明特朗普在按家族企业模式管国家——宠信谁，谁就管得多。\n\n我对贝森特能力很怀疑。当年\"做空日元\"是老板索罗斯定的，他只是下单的；把回购上限从 20 亿提到 40 亿、小纸条写\"买 50 亿日元\"都是小技巧，不是大智慧，解决不了根本问题。\n\n## 三、拆穿\"TGA 9500亿买国债\"的瞎传\n\n昨天传得飞起的\"把 TGA 账户 9500 亿全拿出来买国债\"，纯属胡扯。TGA 是美国的\"活期钱包\"——日常运转、打仗、买军火的钱，相当于你微信零钱，你能拿来全买理财吗？能动他早用了，还发什么国债借债？这消息大概率国内有人造的，因为传到国内就意味着\"美国又要宽松、科技又要涨\"，有人就爱挑这种东西传。\n\n## 四、沃尔克能救美国吗？难，因为成本没人替你扛\n\n周五沃什在杰克逊霍尔的演讲是看点。但我要泼冷水：哪怕再来一个沃尔克也解决不了今天美国的问题——因为治理通胀不难，难的是\"治理通胀的同时不衰退\"。\n\n当年沃尔克能把利息加到两位数、平稳过渡，是因为运气好：中国改革开放 + 苏东巨变，美国白拿了廉价商品、军费压力骤减，外部有人替它扛了成本。今天谁给你扛？没有。所以沃尔克重生也白搭——这事儿跟谁当主席无关，跟中国有关。\n\n## 五、通胀本身就是赖账，美元迟早再来一次重置\n\n美国治理不了通胀，因为境外美元就是它开的借条，现在大家要兑现，只能买金属、黄金、石油这些原材料。你印的超出你生产的，就得通胀。\n\n通胀就是赖账：印的时候米 1 块一斤，收的时候变 2 块，一半就赖掉了。当年布雷顿森林体系解体（35 美元一盎司黄金 → 80 年 800 美元）就是一次集体赖账、一次美元币值重置。这事儿现在还得再搞一次——美元印的量早超出全球财富对应的比价了。\n\n## 六、黄金是美元重置的对冲，但风险是波动不是方向\n\n我不看空黄金，也不看空有色（六月三十就公开说了不再看空），但不代表我马上买——它不符合我的确定性标准。黄金的风险是波动性风险，不是涨价到头。币值重置不可避免，因为只有重置才能解美国的债务。紫金那些股东涨两天就来嘚瑟，忘了二十多块哭爹喊娘的时候了。\n\n## 七、股东人数揭秘：你看不见的那侧筹码游戏\n\n为什么看股东人数？它暴露了机构收集 / 派发筹码的全过程，而散户永远慢半拍：\n\n底部阶段：股价长期低迷、全是散户被套、交易极清淡，表现为阴跌后横盘，这时股东人数最多、最容易出低估值（三年前的银行就是这个状态，彼得林奇的十倍股生于机构不跟踪）。\n\n收集阶段：行业好转或别处太热，机构开始买入。它一买就涨、涨完又回、底下再等，反复\"冲击性上涨\"。你看实时股东人数会发现：股价没涨，人数已开始下降——机构在吸筹。\n\n抬升阶段：认可的人多了，散户手里筹码越来越少，股价波动抬升。到解套区间散户开始卖，筹码进一步导给机构，股东人数持续减少，可能持续一两年。\n\n癫狂阶段：铺天盖地的好消息，股价大幅拉升、成交量快速放大，但股东人数仍然在减少——因为机构要拉出出货空间，抱团猛拉。这时\"星辰大海\"的故事来了，散户开始买。\n\n顶部派发：一次巨量见尖儿，机构开始出。但顶部出不去，它得把股价再买上去维持，跌一点买一点。真正的底，是\"晾凉\"、量彻底萎缩才叫底——现在水刚从 100 度降到 70 度就来\"抄底\"的，全是扯淡。\n\n## 八、现在的科技才危险，别被\"基本面\"骗了\n\n我早就说过：科技高高在上的时候不危险，腰斩才危险。刚回调时我说\"不危险\"，你不会买、跟你没关系；最危险的就是现在——跌两天你以为便宜了，过两天又涨，你心里那草长得拦不住。\n\n你研究的基本面是\"死\"的，机构研究的是\"吃\"的——等你看懂基本面，黄瓜都凉了。顶部是用来给你\"看\"的：它拉到一千，其实想八百出；告诉你值五百，从一千跌到五百你就觉得便宜了。所有顶部都不是为了交易，是给你做心理锚的。","toc":["一、昨天美股科技大跌，别急着喊流动性危机","二、美国政治体系在\"家族化\"，贝森特是宠臣不是救世主","三、拆穿\"TGA 9500亿买国债\"的瞎传","四、沃尔克能救美国吗？难，因为成本没人替你扛","五、通胀本身就是赖账，美元迟早再来一次重置","六、黄金是美元重置的对冲，但风险是波动不是方向","七、股东人数揭秘：你看不见的那侧筹码游戏","八、现在的科技才危险，别被\"基本面\"骗了"],"url":"https://www.bilibili.com/opus/1240342531693084674","bv":"BV1BkhM6vEAP","minutes":102,"chars":1910},"ai":{"title":"老木匠·2026年8月25日：股东人数的四个阶段","text":"## 一、美国市场：现在还谈不到流动性危机\n\n1. 昨晚美股科技股大跌，是怀疑而不是危机\n\n现在还谈不到流动性问题，现在只是对未来AI人工智能是否能够持续产生盈利的一种怀疑。\n\n他说纳斯达克整体没跌多少，但半导体芯片和光通讯跌幅非常大。至于原因，「我真的没找到什么明确的原因，感觉好像就是受A股昨天科技股大跌的影响」。\n\n2. 什么时候才叫流动性危机：先搞懂保证金交易\n\n美国市场基本上是保证金交易，你可以理解为它自带杠杆——比如给你50%的保证金额度，那就相当于两倍杠杆，你花50%的钱就可以买了。所以他们才有margin call这种东西，就是追加保证金。\n\n当股票跌到一定程度，你存在那里的保证金不够了，就需要追加；如果追加不了就会强制平仓——那个时候才叫做流动性危机。\n\n3. 和我们的融资完全不是一回事\n\n我们即使上杠杆也是借钱，这个钱是真真切切存在的，只是不是你自己的，是从别人那儿借来的。但保证金交易压根就不需要这么多钱——你买股票花100万，实际上只要给50万就可以了，大家是一个对赌游戏，最后结算就完了。\n\n他还点出这和昨天讲的代持制是连着的：\n\n它之所以可以不用全款买，是因为这个股票压根就不在他名下，而是在中介机构名下，中介机构必须得全款买。\n\n## 二、对贝森特那些操作的评价：小技巧，不是大智慧\n\n1. 先说一个不正常的现象\n\n他注意到现在很多本该由国务卿负责的事（谈伊朗制裁、外交、日本问题）都是财政部长在做：\n\n国务卿在美国的政治地位实际上比副总统还要高。你看现在卢比奥大有被架空的势头，国防部长也很长时间不出来了——谈战争问题就是总统和财政部长，这事本身就不太正常。\n\n这说明美国现在的政治体系非常不稳定，完全由个人偏好在决定。整个运作体系更像是一个家族，特朗普是按照管理他的家族企业的模式在管理美国。\n\n2. 他对贝森特能力的判断\n\n很多人对贝森特的能力赞不绝口，说他当年做空日元如何——他当年是个操盘手，背后是由老板来决定的，哪个东西是由他来定的？\n\n把回购上限从20亿提高到40亿，然后在小纸条上写买入多少日元——这都是小技巧。跟人做生意你会发现，有些人是有小技巧，有的人是有大智慧。干这个事就属于没有大智慧。\n\n3. 「拿TGA账户的钱去买国债」这个传言是胡扯\n\nTGA是美国的经常账户，那是涉及整个国家运转的钱，相当于国家的钱包、相当于你日常开销的活期存款。你能把它拿出来都用吗？那平常遇着个风吹草动你咋办？\n\n要能动的话，他要有那么有钱的话，他何必发国债借债？那里头的钱都是借来的。\n\n4. 他怀疑这类消息是国内传的\n\n我都怀疑这消息是咱们国内的人造的。这个东西在美国可能压根就没什么人信，但传到我们这就有很多人信。因为这就意味着好像美国又要宽松了，我们又要按照宽松这个模式去投资某些标的，所以科技又要涨了。\n\n他给的验证方法很直接：「你看他说9500亿都要买国债的时候，美国国债收益率有啥变化吗？美国哪有人信。」\n\n## 三、为什么谁来也治不了美国的通胀\n\n1. 治通胀本身不难，难的是不衰退\n\n加息治通胀这件事没什么难的，你使劲加息、使劲紧缩，它就能治理通胀。难在你治理通胀的同时还得保证它不衰退。\n\n那就意味着你在治理通胀的时候，得有人给你承担这个成本。当年美国治理通胀的成本是由东南亚和我们来承担的，甚至也包括日本。那现在谁给你承担这个成本呢？\n\n2. 沃尔克当年靠的是运气和外部条件\n\n他把当年那条线完整梳理了一遍：改革开放、苏东剧变、军费压力骤减，「当年苏东的巨变其实是救了美国，包括我们是给美国打了很多年工」。\n\n大幅加息一定会引起经济衰退。你要想在治理通胀的同时还不产生萧条，那只有一个条件——外来的输入发生了变化，有人给你提供廉价的商品。\n\n他还往前推了一步：\n\n沃尔克加息之前其实还有一件事，就是尼克松访华。如果当年没有中国和美国实现关系正常化，美国是没有机会的。这一切的东西你应该串起来看。\n\n3. 布雷顿森林体系解体，本质就是一次币值重置\n\n当年谈判的时候，各国是按35美元一盎司把自己的黄金运到美国的，你给了我美元、说可以随时兑换黄金。结果你美元越印越多，自己的黄金就不够了。最早看出来的是法国人，拿到美元就要兑换黄金，美国的黄金消耗非常快，最后布雷顿森林体系就解体了——实际上就是美国一次违约。\n\n黄金从35美元涨到800美元，涨了二十多倍，那就相当于原来的1美元后来只值5美分——你的币值重置多厉害？\n\n由此他给了一个和主流说法完全不同的判断：\n\n所有经济学家给你总结说七八十年代美国的通胀是因为伊朗石油危机，那都是表象。它的本质在于美国的币值重置。你在这种美元的情况下，石油能不涨吗？\n\n这个事儿现在其实还得再搞一次。币值重置当然不可避免，因为只有币值重置才能解决美国的债务危机。\n\n4. 通胀就是一种赖账方式\n\n对于美元来说，通货膨胀本身就是赖账的一种方式。他印美元的时候大米是一块钱一斤，他收美元的时候大米变成两块钱一斤——那不就相当于有一半赖掉了吗？\n\n你今天为什么治理不了通胀？是因为大家现在拿着你的借条，不觉得那么可靠了，都需要把这个借条兑现。你一年生产的东西，现在有两年的GDP创造的钱准备兑现，你怎么控制通胀？\n\n5. 但他真正担心的不是这个\n\n我最害怕的是——沃什他有理想。他有理想我就想试一把，那这个过程就要人命。他试一把就有可能产生危机。\n\n那产生危机了，那顺理成章的我再宽松呗，那我还成大救星了。\n\n他还提醒了当年的教训：「保罗·沃尔克刚上台的时候，大家也都认为你根本不敢加息，加息就完了。没想到后来沃尔克玩是真的，最后把利息加到两位数。」\n\n6. 一条更根本的常识\n\n谁也不能通过金融这种方式创造财富。金融只是财富的度量，它不会创造财富。你用发货币、收货币的方式能让大米生产出来吗？能生产出衣服吗？\n\n唯一能拉动经济的是生产，剩下的东西都是为生产服务的。无论出口、投资还是消费，这三驾马车都是为了刺激生产。你经济的总量代表的是你生产的能力。\n\n他还用了个家庭的比方：「你看哪家说我们家邻居就是特别能消费，所以他们家最厉害？他得有生产的，要不然他不得借去吗？美国就是这个道理——他特别能消费是因为他能印钱，而他印出来的钱对全世界来说就是借条。」\n\n## 四、这场的重头课：股东人数的四个阶段\n\n这是他第一次把「为什么要看股东人数」从头到尾讲完整，可以当作前面所有「筹码」话题的总纲。\n\n1. 第一阶段：股东人数最多的时候，恰恰是最低迷的时候\n\n股东人数最多的时候，是这个股价极度低迷的时候——这个票已经长期没人看了，也没有机构在里头了，已经全是散户了。\n\n虽然股东人数最多，但它的交易是很低迷的。因为大部分持有股票的散户都处在被套状态，他们基本没有交易的冲动。\n\n他描述了这个阶段的形态：\n\n那都是上一波人家出货，货都出没了压到底下，然后有些散户零星交易把价格压下来——套得实在受不了了就卖一点，再受不了再卖一点，但底下没有承接盘，所以价格越来越跌，表现为阴跌。然后横盘，就是再也没有人想卖了，买卖达成平衡，会横盘很长时间。\n\n所以这个时候这样的股票容易产生低估值。这就是彼得·林奇说的十倍股为什么产生在机构不跟踪、研究员不追踪的地方。这就是我说的坑，你就得找这样的东西。\n\n2. 第二阶段：股价没涨，但股东人数已经开始下降\n\n突然有人发现这个行业还很低迷，而且未来前景不差，这时候就会有人开始进来买入。当机构进来买入的时候，它一买就会涨。\n\n所以你会发现一个现象：它突然有一天出现放量大涨，但很快又回来了。为什么？因为这时候机构持股很少，它进出非常不方便，一买就会涨。所以我买一下冲上去我就再等，等你跌回来我再买。\n\n这个时候如果你能看到实时的股东人数，你会发现虽然股票价格没涨，但股东人数已经开始下降了。\n\n3. 第三阶段：股价慢慢抬升，靠「解套-回落」反复清洗\n\n在底下买它就没有了、买不着了，没有人卖了。那你想买就得拉升股价——拉升股价谁在卖呢？解套的散户在卖。\n\n一旦股价到某个散户的解套区间，这些散户就开始卖了。然后就在这个套牢区间里反复波动：让你解套、再让你回来，让你解套、再让你回来，这样你就根本拿不住。散户的筹码就这样逐渐倒到了机构手里。\n\n4. 第四阶段：铺天盖地全是好消息，而股东人数仍在减少\n\n大约持续一两年，突然有一天铺天盖地全是关于这个行业的消息，所有人都知道业绩变得非常好了，股价开始大幅拉升。但这个时候股东人数如果你能看到的话，它仍然是减少的。\n\n因为这个时候机构主要是要影响价格，为未来的出货拉出一个空间。大家一定要明白：出货不是说你拉到十块钱、十块钱就能出的。你要想十块钱出货，你可能得拉到20。\n\n这个时候股东人数已经非常集中了，所以稍微买一点点股价就会大幅上涨。表现为成交量快速放大、股价快速上涨，但股东人数还是下降的。这时候舆论、研究报告最热闹，散户会发现这是一个好股票——星辰大海的故事就来了：未来不可替代、值得一生持有、改变全人类。\n\n5. 然后是顶部：那一根巨量\n\n直到有一天你突然发现它到了一个尖儿，在顶部突然放了个巨量，然后出现下跌——那就意味着机构的出货开始了。\n\n但我告诉你他出不去，在顶部这么出是出不去的，他只是第一次出了一点而已。而且即便他出这点货获得的钱，最终也还得把这些股票再买回来——这次出的钱实际上是未来用来维持股价的成本。\n\n他解释了为什么维持股价需要成本：「当你出货的时候它跌得多了，你还得把它买上去再拉起来。所以你会发现跌下来冲一点，再跌下来再冲一点。」\n\n## 五、什么才叫抄底：得把这锅水晾凉\n\n1. 他这次给了一个很形象的标准\n\n抄底你得把它晾凉，让它彻底凉透，你才能抄底。现在抄啥底？水刚开完，从100度刚刚降到70度，你就来抄底。\n\n散户所谓的抄底都是扯淡，他根本就不知道什么是底。真正到底的时候，他根本就不敢买。\n\n2. 高位那个价格根本不是用来成交的\n\n所有这种东西的顶部都不是为了交易的，它是用来给你看的，是给你做心理锚的。我拉到1000，其实我出货就想800出——甚至我本来就想500出。\n\n为啥要拉到1000呢？因为从1000跌到500的时候，所有散户都认为这个股票原来值1000、现在500就能买，非常便宜。\n\n3. 所以「腰斩之后」才是最危险的时候\n\n他提醒大家回想他之前说过的话：\n\n我说过科技现在不危险，再过几天腰斩才危险。\n\n高高在上的时候它根本不危险，所有散户都知道它贵、不会去追高买。那个时候不是散户买的，那是人家机构自己做着玩儿出来的。\n\n你看这两天它跌的时候你觉得不危险，过两天咔嚓又来一个上涨，你心里头那草长的，让你难以自主。\n\n他用有色做了个现成的对照：\n\n有色也是一样，45的时候并不危险；跌到23再涨回到35，那才是危险的。\n\n4. 所以你研究的基本面是滞后的\n\n你研究的基本面就不对——等你研究基本面的时候，黄瓜都凉了。\n\n## 六、科技牛市与「不要让自己成为税基」\n\n1. 他重申了对科技牛市的态度\n\n科技的牛市是没有任何问题的。但是你买不买科技股，那取决于你自己。因为科技股的特点就是赔率高而胜率低。\n\n我提示大家风险是从个人角度上来说。我认为科技应该涨，但我不会买。\n\n2. 为什么这件事在宏观上是对的\n\n我们现在财政这么困难，房地产低迷之后各个地方政府财政都很困难。你不靠股民来给科技投钱，靠财政，财政哪有钱再投？\n\n他还回顾了自己早年的一个说法：\n\n我以前说过，茅台和五粮液是美国锁死我们外资、锁死我们科技的两个质子——就像《三体》里三体人为了锁死地球科技发了两个质子来。当年所有资金全部聚集到酱香科技、浓香科技上，那些年我们的股市对科技是没有贡献的。\n\n既然散户都是亏钱的，那亏在科技里要比亏在白酒里好得多。起码你亏在这儿是有意义的。\n\n3. 高房价是一种税\n\n他把这条老观点又讲了一遍，并把逻辑补全：\n\n高房价大部分是因为土地出让金高。不是房地产开发公司挣了多少钱——土建成本、开发利润没有多少。土地出让金去哪了？那属于财政收入，只是我们人为规定它叫非税收入。非税收入和税收收入，对财政来说有啥区别？\n\n所以为什么叫土地财政？你今天中国的基建做得这么好，高铁、高速公路，钱从哪来的？那不都是你们买房子的钱吗？\n\n4. 所以真正该防的是：别让自己成为税基\n\n你在社会上无论是投资也好、升值也好，第一件事应该考虑的是——不要让自己成为税基。\n\n收税对我来说是最好的一件事，但前提是这个税不是从我身上收的。为什么2021年不能买房子？因为你2021年买房子就是成为税基了。那你今天买某些股票，也会成为税基。\n\n5. 顺带：对自己诚实\n\n有的人说我就是为了给科技做贡献——那是因为你买完被套了。你买的时候肯定不是想着做贡献，你是为了赚差价，只是没赚着、被套里头了，为了安慰自己又扯什么做贡献。那你为啥当年不给科技捐款呢？\n\n## 七、做有色的那个隐含假设：人民币也得跟着重置\n\n1. 这是他这场最锋利的一个提醒\n\n做有色得有一个假设：美元崩，我们得跟着美元崩才行。美元币值重置，人民币也得跟着币值重置，你才能做有色的股票。\n\n因为你计算有色金属这些公司的利润是以人民币作为本位币的。那我问你，如果有一天人民币不跟着美元重置呢？人民币要升到3呢？同样的黄金价格，以人民币计价是不是得折一半？\n\n他强调这只是个思维训练：「我说的这东西不太可能。我是跟你讲这个道理，你得知道人家在想什么。你天天想的是国外又创新高了——国外当然创新高了。那我问你，你敢保证人民币币值一定重置吗？」\n\n2. 所以「只看挖多少矿」是不够的\n\n有人说分析宏观没有用，你知道挖多少矿就行了。你挖多少矿，不得拉回来以人民币计价吗？知道啥叫汇兑损益不？你大量的资产都是美元，如果人民币大幅升值，你的资产就得有减值损失——这就叫汇兑损失。\n\n我只是告诉你，分析不是那么简单的，不是知道能挖多少矿、够不够用就行。\n\n3. 人民币升值会带来什么：中国核心资产上涨\n\n他把这条推到了国外投资者的视角：\n\n假如美元币值一定重置，那持有美元的人最好是换成黄金、换成实物资产。但除此之外容量都太小了——全世界的黄金能有多少？\n\n我告诉你，人民币资产就是最好的避险资产。这跟当年美元去买日元资产道理是一样的——当年为什么大量美元去买日元资产？因为日元在升值。\n\n对国外投资者来说，我买入一个国内的核心资产，我不指望它股票涨多少。只要人民币不跟随美元贬值、甚至贬值速度慢于美元——比如美元一年贬20%、人民币只贬10%——那对我来说我就赚了，股价都不需要涨。\n\n他说债券也是同理，并借此解释了日本当年的情况：「日本债券收益率那么低为什么还有人买？因为它对美元在升值，持有美元的人买入日本债券再换回来就是一个收益。」\n\n4. 但我们不会重蹈日本的覆辙\n\n那种情况我们的人民币也会被商品化，那对国内的通缩是一个巨大的促进作用。我们不能允许通缩这种事件发生。\n\n## 八、货币国际化的代价\n\n1. 被商品化的货币，会同时带来通缩和通胀风险\n\n你现在全世界有多少人拿着美元是当资产在储存的？这些美元都被商品化了。你对商品化就有通缩的势头，那你防止通缩就得狠印钱。等这个趋势有一天反转过来、形成反向正反馈的时候，那你就会通货膨胀，就像今天这样。\n\n所以你别以为成了国际货币就一定好。你国际货币得控制好，控制不好那个代价是非常大的。\n\n他由此给了一个对日本的判断：\n\n当年日本为什么后来有失去的三十年？最主要的原因就是在他不具备力量的时候，先实现了本国货币的国际化。\n\n你货币国际化变成自由兑换货币，就相当于在财政管理和金融管理上国门大开——你把一切都交给市场了。国门大开取决于什么？取决于你的力量。\n\n2. 所以港币的定位是「人民币的稳定币」\n\n港币不会升值，它现在和美元是联系汇率。我说过港币就是人民币的稳定币，未来它的地位就是人民币的衍生货币——因为拿着港币可以没有监管，但又可以投资中国资产。这样我们实际上就相当于进退有度。\n\n3. 「最强的人都希望没有秩序」\n\n这是他这场里最好懂也最锋利的一个道理：\n\nIMF虽然叫国际货币基金组织，但实际上是受美国控制的。当你出现金融危机他给你贷款的时候，条件都是要求你减少监管、放开金融市场——那些条件都是美国定的。\n\n那个时候为什么美国都要求你放开市场？因为那个时候美国是最强的。最强的人都希望没有秩序。\n\n就像两个小孩在一块玩，有一个小孩说咱谁也不许打谁——这个小孩一定是因为打不过别人。那个如果所有人都能打过的，他就会主张咱们可以随便打。\n\n他用这条逻辑解释了今天的转变：\n\n那今天为什么他又开始玩关税这一套了？因为他打不过中国了。所以他现在开始说咱不能随便打，咱得有价值观、得实现世界贸易平衡。无论他说得多么好听，都是这个原因。\n\n现在谁是自由贸易的主导者？你看看现在是谁天天在说应该自由贸易。\n\n## 九、又一次的「预期课」\n\n1. 周末的一致预期，又一次落空\n\n昨天有多少人认为今天黄金和有色的股价会大幅上涨？这两天给你们上这个课上得咋样？\n\n2. 该问的不是「为什么不涨」，而是「谁在卖」\n\n你以为的东西为什么没有出现，那你得去反思。大家周六周日认为黄金股票应该涨停，那为什么它不涨呢？那你也想，它不涨一定是想卖的人多——那你告诉我谁在卖？\n\n你应该去想：这次为什么我判断错了？和我原来设想的框架哪里不一样？你应该吸取教训、重新调整自己，而不是跑来说这市场不对。\n\n他还给了那句他反复讲的话的又一个版本：\n\n市场从来不跟你讲理，也从来不试图说服你，他只是简单地消灭你。市场才不会跟你掰扯说我对还是不对，他只是消灭你拉倒。\n\n3. 一个具体的追问\n\n前两天有色不涨的时候你赖科技；这两天科技也跌了，有色还是不涨——你告诉我，你这回你赖谁？\n\n4. 他自己的立场说明\n\n他解释了为什么只说看空、不说看好：\n\n我原来看空、现在不看空的，我都会告诉你，这主打一个有始有终。但我不能告诉你我看好哪个——我一看好就有人冲进去，说是我推荐的。\n\n我说我不看空有色了，我都得加一句：那不代表我就马上买入。为什么？我怕你们说「你看你说的不看空了，就意味着我可以买了」。我可没告诉你买。\n\n他还提到一个已经明确的时间点：「不管美国加不加息，日本九月份加息基本上是铁板钉钉的。如果九月份日本真加息，那你需要看的戏还多着呢。」以及对黄金的定性：「我说的风险是黄金的波动性风险，我不认为黄金现在就涨到头了，但是你能受得了它的波动吗？」\n\n## 十、他自己的说明\n\n我今天讲的东西是比较干的，当然也没有计划，就是想起来哪儿讲到哪儿。我发现有很多人对这些东西误解太深了——说巴菲特不了解宏观，你就不了解宏观。巴菲特那个时代美国就是世界中心，他需要了解啥宏观？别人都得围着美国转。\n\n我讲的都是评书，都是演绎。本讲座纯属虚构，如有雷同纯属巧合，据此投资责任自负。股市有风险，入市需谨慎。","toc":["一、美国市场：现在还谈不到流动性危机","二、对贝森特那些操作的评价：小技巧，不是大智慧","三、为什么谁来也治不了美国的通胀","四、这场的重头课：股东人数的四个阶段","五、什么才叫抄底：得把这锅水晾凉","六、科技牛市与「不要让自己成为税基」","七、做有色的那个隐含假设：人民币也得跟着重置","八、货币国际化的代价","九、又一次的「预期课」","十、他自己的说明"],"url":"https://xueqiu.com/2573414707/407226647","chars":7738},"topics":["股东人数的四个阶段"]},{"date":"2026-08-24","bili":{"title":"老木匠 2026年8月24日直播文字稿（看懂交易结构，别当最后知道的狍子）","text":"## 一、今年你的目标只有一句话：保住本金\n\n今天上午不少买科技的吃了大面。我早就强调过——你今年的主要目的就是保住本金。\n\n保住本金和离开市场是两码事。你清仓离开，本金是保住了，但获利的可能性也被你一起取消了。正确的姿态是：别离开市场，但时刻把保住本金放在第一位，同时保留获利的可能性。市场永远是个概率化的东西，不可能有极端的确定性。你是在\"保本\"和\"获利\"之间做权衡，出发点是保本，但不放弃获利的机会。\n\n有人说下午科技能V上来，我不那么乐观。尾盘可能有神秘资金点一脚刹车，但别指望。\n\n## 二、交易的底层结构：你连这个都不懂，怎么做股票\n\n很多人对市场基础结构一无所知。今天给你们补一节基本功。\n\n第一，中登（中证登）是干嘛的。 股份公司依法要备股东名册，股东买卖时要过户登记。上市公司自己干这个工作量太大，所以统一委托给中证登。中证登是根据公司法代行股份公司的登记结算义务，它不是管理机关，是个服务机构。\n\n第二，T+1 从哪来。 你今天买，晚上结算时才登记进股东名册，第二天才成为正式股东，才能卖——这就是 T+1。它源自登记结算制度，是基础知识。\n\n第三，A股是唯一彻底的实名制。 你开户时领的代码和中证登一一对应，买入直接登记在你名下、和身份证绑定。而港股、美股很多是代持制——你通过汇丰买，股票登记在汇丰名下，不在你个人名下。所以：\n\n港股/美股能 T+0，因为不实行严格登记，你相当于和券商对赌；\n\nA股是彻底的集中竞价，所有委托单必须发到上交所/深交所服务器统一撮合，券商只是通道，不能私自撮合。\n\n第四，纸黄金、原油宝的本质也是对赌。 你开纸黄金账户，银行并不把黄金给你，只是和你对赌金价。银行为了不被挤空，会去公开市场买实物黄金做储备（原油宝当年干的也是这事）。你买实物黄金成本极高，因为有验成色、提存的手续费；纸黄金没有这些成本，因为它本来就没有黄金。\n\n第五，撮合原则：价格优先、时间优先。 同价看谁先下单。美国的券商内部还能先匹配、吃\"滑点\"差价，交易成本更高；我们的制度最现代化、最科学。\n\n结论：这些全是交易的基础结构。很多天天在自媒体哇啦哇啦讲的人，你问他订单具体怎么走他都不懂。你蒙着眼睛进屋就开枪，还想打着猎物？先把眼罩摘了。\n\n## 三、量化不是洪水猛兽，你怕它干啥\n\n量化有很多种策略，不都是超高频。真正超高频的原来把服务器直接放交易所席位上（特殊通道），现在限制了。\n\n量化客观上提供流动性、平抑波动——它扮演做市商，上下挂单吃点差。没有量化，回到庄股时代，连续打板，波动率比现在大得多。游资现在打板都干不过量化。\n\n战胜量化最简单：低买高卖。 量化总的来说干一件事——站在少数那一面。它创造低点你就跟着买，创造高点你就跟着卖。大部分人输在：人家创造低点时你不敢买，创造高点时你舍不得卖。你的问题不是战胜量化，是战胜自己。\n\n## 四、\"抢狍子游戏\"：你永远是最后一个知道消息的人\n\n周六周日舆论一片看多，说有色、科技周一该全线涨停。结果现实又给大家上了一课。\n\n真相是：随着中报出来，股东人数也出来了。你越看好，股东人数却在增加——因为因果关系你搞反了。你是看到好才想买，而那些人两年前就看到今天了，正等着你进来接盘。\n\n这就是市场的轮回：低位讲鬼故事，高位讲星辰大海。所有故事都是围绕\"差价\"编的，马甲（科技、有色、美元贬值）毫无意义。好消息出来时全世界都知道了，你依据它做决策？你永远是最后一名知道的人。\n\n市场有效假说：价格反映一切（过去的）。你依据消息买卖必输，因为你没有信息差。等你想买，已经反应完了；等坏消息出来你想卖，已经晚了。\n\n所以第一条铁律：问自己\"我是第几个知道这件事的\"。最后一名，就别依据它决策。 黄金都涨成那样了，别再依据\"黄金涨\"去追黄金股。\n\n## 五、技术派就是扯淡，是新时代的算命\n\n技术派试图用过去的价格判断未来的价格。但决定未来价格的是未来的事实，不是过去的。你靠几浪能算出明天特朗普打不打伊朗？算不出来。\n\n有人举特例说\"江恩可准了\"——这跟算命一样，偶尔算准的人到处传播，没算准的人沉默了，于是你觉得算命灵。把所有算命结果统计一遍，准与不准都是随机现象，连统计学意义都没有。\n\n所有的技术派，本质都是逻辑混乱：均线、主力位、波浪……都在做同一件扯淡的事——用过去价格决定未来价格。这事在逻辑上就不成立。不用争，我直接告诉你结论。\n\n## 六、研究历史是学\"应对\"，不是算未来\n\n常有人问\"研究历史能预测未来吗\"。不能。你穿越回清朝也只知道今天，不知道未来。\n\n研究历史是为了：当同样的事实再次出现时，我们该怎么处理。历史上这件事无数次发生过，哪次处理好、哪次处理不好，今天再出现就用对应的方式处理。不是给未来算一命。\n\n## 七、闲聊：别被舆论带节奏\n\n火车票是实践合同。 买票不等于合同成立，必须检票（打口）才算。你买了不来检，合同没成立，票可退，且出事故时只有打口的票能索赔。铁路局说\"不检票视为放弃\"完全正确。一大堆人替女孩鸣不平，是制造社会矛盾——你把整节车厢包了也不行，铁路运输有福利性质假设，不是完全自由合同。\n\n北大老师说\"灵活就业是福利\"惹众怒。 何不食肉糜。象牙塔里待太久，从纸面来、到纸面去，不懂人间疾苦。很多大学教授说话不过脑子，不是拱火，是真的不了解社会。\n\n某地产公司叫年轻女孩陪酒、灌醉后搂抱。 这种人我最瞧不上——借职务之便、利用甲方地位施压。不是坏，是\"下作\"（下九流是职业社会地位低，跟道德无关，别乱用）。既然成了舆情，该重判。\n\n## 八、结尾\n\n今天市场没啥可看的，看戏就行。易中天跌九个多点，龙哥这两天没出来——之前讲过，拉太高把跟风的鸟都吓跑了，今天不用拉是因为周末看多的人多、自己就进来了。多看几次你就懂这套游戏了。\n\n别寄托希望于\"哪个能上\"，你一卖它就上，那是因为你就是被收割的狍子之一。","toc":["一、今年你的目标只有一句话：保住本金","二、交易的底层结构：你连这个都不懂，怎么做股票","三、量化不是洪水猛兽，你怕它干啥","四、\"抢狍子游戏\"：你永远是最后一个知道消息的人","五、技术派就是扯淡，是新时代的算命","六、研究历史是学\"应对\"，不是算未来","七、闲聊：别被舆论带节奏","八、结尾"],"url":"https://www.bilibili.com/opus/1240034689938358306","bv":"BV1iW8v6BEuV","minutes":0,"chars":2415},"ai":{"title":"老木匠·2026年8月24日：交易的底层结构与狍子争夺战","text":"## 一、今天的关键词：保住本金，但别离开市场\n\n1. 「熬什么」这个问题问错了\n\n有人问他现在该怎么熬，他的回答是：\n\n你今年的主要目的就是保住本金，你熬啥？别离开市场，但同时要保住本金。\n\n2. 为什么不能干脆空仓\n\n你不能说我要保住本金，那我干脆离开市场。你离开市场是保住本金了，但你获利的可能性也被取消了。你的出发点是保住本金，同时还要保留获利的可能性——一旦卖出离开市场，那获利的可能性就没了。\n\n市场任何时候都是获利和保本这种风险的权衡。未来永远是一个概率化的东西，不可能有那种极端的确定。\n\n## 二、这场最扎实的一课：交易的底层结构\n\n他这天花了很长时间讲交易制度，理由很直接——「这都属于交易的基础结构，这些东西你都不知道的话，那你怎么做股票？」\n\n1. 先搞清楚中证登是干什么的\n\n公司法规定股份有限公司应该置备股东名册，当股东发生买卖的时候，公司应该为股东提供过户登记服务。但上市公司的登记过户非常频繁，自己做工作量太大，所以都统一委托到中证登。\n\n你可以理解为中证登是根据公司法的规定，代行股份公司的登记结算义务。它是一个服务机构，不是管理机关，它实际上也是一个公司。\n\n他打了个最好懂的比方：「这就相当于房产局给你登记过户房子。你买了一套房子，怎么证明这房子是你的？得有房产证。中证登起的就是房产局的登记作用。」\n\n2. 所以T+1不是拍脑袋定的，是从登记制度来的\n\n你今天买入的时候还不是股东，要到晚上登记结算的时候才把你登记到股东名册里，所以你第二天才成为正式股东。只有成为正式股东你才能卖出——这就叫T+1。中国的T+1交易制度是从登记结算制度来的。\n\n3. 为什么港股美股能T+0：因为不是完全登记制\n\n我们A股是唯一一个彻底实名制的市场，每个人买股票都会登记在你自己名下——你开户时拿到的那个代码就是在中证登开的户，和你的身份证绑定。\n\n而港股、美股很多是代持的。你通过某家券商买入某只股票，这股票实际上是登记在那家券商名下的，并没有过户到你个人名下。所以不存在登记结算问题，当日就可以再卖出——这就是T+0。\n\n他还讲了这带来的一个副作用：\n\n经常有新闻拿这个忽悠你，说某某大行又增持了谁、又减持了谁——那都扯淡，那是下边客户做的。券商一天当中既有买也有卖，最后砸平那个差额去结算而已，并不代表他对这只股票的看法。\n\n他还用纸黄金做了个类比：「你到银行开个纸黄金账户，买入一克黄金，这黄金并不给你，相当于你和银行在对赌黄金价格。当年的原油宝干的也是这种事儿。」\n\n4. 为什么美国的成交量比我们低：券商内部就撮合了\n\n美国很多大券商，你下单的时候它先在券商内部进行匹配——看我这个券商名下有没有人卖出这只股票，有的话就先把你俩撮合了。解决不了的，才把委托单发到统一的交易机构。\n\n所以我们的成交量才是真正的股东和股东之间的成交量，美国的成交量不是股东之间的，是券商之间的尾差。\n\n5. 我们的制度：连续竞价的集中撮合\n\n我们A股是发达市场里唯一一个集中竞价交易的市场——所有委托单都不允许经纪商私自处理，券商只是一个通道业务，必须把订单发送到交易所。只有在交易所的服务器里才进行集中撮合。\n\n撮合的规则是价格优先、时间优先：「我现在五块钱以下都可以买，那4.95、4.96、4.97的订单先来，因为价格优先；同样都是五块钱的订单，那就按时间排序。」\n\n6. 所以我们没有滑点，而国外有\n\n你要是国外的券商，他自己是可以控制的、可以吃滑点的。他在内部先匹配的时候，会先找有滑点的交易来撮合——你五块钱买，那个人4.95就肯出，他先给你匹配这个，中间那个差价他就拿走了。\n\n他由此评价了那种「T+0好、美国制度先进」的说法：\n\n交易制度上最合理、最科学的就是我们。一说就是T+0、美国制度如何，那都扯淡，他都不懂。国外的交易成本是很高的。\n\n7. 量化的速度优势，根子也在这里\n\n你下单是先通过本地服务器发委托单，中间要转好几次；而超高频量化可以把服务器直接放在交易所席位上，有特殊通道。你下个单是坐马车去的，他下个单是坐飞机去的。\n\n他说现在虽然限制了，但物理空间的差别还在：「网络理论上以光速传播，但毕竟还有距离、就有时间。你在上海交易所周边的服务器还是快，要跟新疆比那还快不少。」不过他强调这只对超高频有用，「量化只是一个统称，内部的交易策略差别非常大」。\n\n## 三、他为量化说的几句公道话\n\n1. 量化其实是抚平波动的\n\n说量化放大了波动，实际上你根本不懂量化。理论上来说量化是抚平波动的。真正如果没有量化，回到庄股时代，那波动要比现在大得多——庄股时代最盛行的就是连续打板，那波动率非常大。\n\n2. 它客观上起了做市商的作用\n\n超高频量化实际上提供了一种做市商的功能。他挣的是点差——五块和5块01他都挂单，五块他就买、5块01他就卖。所以不存在有人愿意出五块、有人愿意出5块01却成交不了的情况。他提高了流动性，这是客观的。\n\n他还提醒了限制之后的代价：「超高频量化一旦限制了，它有一个成交量的损失。」以及一个预判：「你现在量化没有了，游资马上就抬头，过两天你就会发现连板的又来了。」\n\n3. 怎么「战胜」量化：还是那句话\n\n战胜量化是最简单的事儿。因为量化总的来说干的一件事就是站在少数那一面。你只要能站在少数那一面，你就能吃量化。\n\n不管怎么说，量化玩的也是低买高卖。他怎么实现低买高卖？他在创造低价、创造高价。那他创造低点的时候你也跟着买，他创造高点的时候你也跟着卖，不就完了吗？\n\n但问题在于，人家创造低价的时候你又不敢买了，人家创造高价的时候你又不舍得卖了。关键在于战胜自己，不是战胜量化。\n\n## 四、当天的行情：一堂现场的「预期课」\n\n1. 周末的一致预期，周一被打脸\n\n周六周日的时候，大家有没有感觉舆论上都认为有色今天应该开盘全部涨停？甚至有人认为科技也应该大涨。现实是不是又给大家上了一课？\n\n2. 去看中报出来的股东人数\n\n这是他给的具体作业：\n\n你去看一看那些所谓「中报超预期」的有色也好、科技也好，随着中报出来股东人数就出来了。你就想一个问题：为什么你这么看好，但股东人数却在增加呢？\n\n因为你搞错了因果关系。你是看到它好的时候才想买的，而那些人是早就看出来今天会好。你不看好、不进来买的话，他怎么出？\n\n你前几天不是说科技中报超预期吗？人家等超预期这一天等得花都谢了，就等你来了。\n\n3. 「见光死」不是玄学，是客观规律\n\n这不叫见光死，这是一个客观规律。你傻狍子这些人不来的话——人家两年前就看到今天了——你不在这个时候跑，你什么时候跑？\n\n4. 所以现在争的不是价格，是「狍子」\n\n现在什么价格、什么好消息那都不重要。狍子才最重要。对于有些人来说，狍子才是资源，现在是一种狍子争夺战。\n\n他从来就是这么个游戏，它就是个抢狍子游戏。都抢完了狍子、都把东西拿到手了、都如愿以偿了，然后人家都跑了，只剩散户在风中凌乱——这就是一个市场轮回的结束。\n\n5. 为什么第二波不会马上来\n\n有人问还有没有第二波，他让大家自己推：\n\n假如现在我是一个机构想做第二波，在这么多散户的情况下，我会直接把它拉上去吗？那我不得制造点啥玩意儿让你们都害怕，等跌下来的时候我再重新收集筹码再玩吗？\n\n你没看有的标的都已经开始了——所有的消息都是坏消息，然后接着坏消息使劲往下砸。\n\n他还补了一句更现实的：「人家有老多可玩的东西了，为啥非在这一棵树上吊死？人家要的是差价，根本不在乎是科技还是有色、是不是美元贬值——那对他来说都是马甲。」\n\n6. 低位和高位，故事是两个版本\n\n给你讲的所有故事都是源于差价。低位的时候都是鬼故事，高位的时候都是星辰大海。他必须得在低位的时候也让你觉得合理，在高位的时候也让你觉得合理，所以高低位的故事是不一样的版本。\n\n## 五、你是第几个知道这件事的\n\n1. 这是他反复强调的那个自问，这次讲得最完整\n\n每一个好消息也好、坏消息也好，你第一件事先问自己：你是第几个知道这件事的？如果你是最后一个知道的，那你就不要依据这件事来做决策。\n\n不是说不让你买或卖，关键在于——你知道的这件事你是最后一名知道的，那就别拿它当决策依据。你看黄金都一直涨了，你别依据这件事买入黄金股。\n\n2. 背后的理论：市场有效假说\n\n市场对所有信息都是充分反映的。你只有在信息超前、和别人不对称的情况下才能获得收益。否则这个消息出来的时候你再反应是没有任何意义的，因为所有人都看到了。\n\n你有信息差吗？你要是根据信息来买入卖出股票，那你一定是输家——等你想买的时候，这个东西已经反映完了；反过来等坏消息出来你想卖的时候，也已经晚了。\n\n他还给了个很到位的总结：「所以你为什么欢呼雀跃的时候，市场总是跟你想象的不一样。」\n\n## 六、技术分析：他这次说得最狠\n\n1. 根本的逻辑错误在哪\n\n决定未来价格的东西是未来的事实，而不是过去的事实。过去的事实决定的是过去的价格。你试图用过去的价格来决定未来的价格，这件事本身在逻辑上就是扯淡。\n\n市场有效假说是说：过去的价格是由过去的信息决定的；同样道理，未来的价格是由未来的信息决定的。那未来的信息你能通过技术判断出来吗？你能通过数浪判断出明天特朗普要不要打伊朗吗？\n\n2. 他把它类比成算命\n\n技术派这种东西就是一个新时代的算命，信的人就是信、不信的人就是不信。到今天为止也有人信算命，他会给你举出一大堆特例说特别准。但如果你把所有经过算命预测的事实全部拿出来做统计，准与不准都是随机现象。\n\n他还讲了这种错觉是怎么形成的：\n\n算准的那次他就会传播，没准的他就不说了。就像「面包总是抹黄油那面掉地上」——那都是扯淡的，是一种心理错觉。抹黄油那面掉在地上对你来说特别容易记住，反过来你非常容易忘掉。\n\n我现在就告诉你，技术派就是扯淡，你不用争论这件事。江恩也好、道氏理论也好，我全都看过。\n\n3. 顺带纠正一个关于「研究历史」的说法\n\n有人说研究历史就能预测未来，他不认同：\n\n你研究历史不是要预测未来。你研究历史是为了吸取经验和教训——历史上这件事无数次发生过，哪次处理得好、哪次处理得不好，今天再出现的时候我们用什么方式来处理。而不是研究了历史然后给未来算一命。\n\n## 七、他为什么反对动不动就改交易制度\n\n1. 改规则不会让所有人都赢\n\n一亏钱了就要改变交易制度，好像你改完了以后他就不亏钱似的。你把世界足联的比赛制度从头到尾都改一遍，怎么的，所有人都是冠军呢？\n\n博弈只要有规则就有输有赢。\n\n他还讲了个很形象的推论：\n\n如果有一天进球减分，我跟你讲，散户想不进球都难。你别以为现在市场发钱了所有人都能赚——到时候你找不着窗口，排队都排不到前头。\n\n2. 他对高考也是同一个态度\n\n我现在觉得高考是最合理、最公平的制度。前几年搞什么校长推荐、中学校长保送，最后都变成寻租了。只要现在有人一开口说「我们不能唯分数论」，我告诉你这些人就没憋好屁。\n\n## 八、埋人是一层一层埋的（当天的现场版）\n\n1. 为什么今天不用拉了\n\n这跟扣鸟一样，你不能拉得太高——拉太高那些扣住的鸟都跑了。但你不拉也不行，不拉就没有人跟风。为什么今天不用拉了呢？因为周六周日看好的人很多，今天就不用拉了。\n\n2. 你等的那个价位，暂时不会到\n\n你还在寄托希望说到哪个位置我就卖。我告诉你，现在所有散户都是这么想的，都在等着到哪儿我就卖出、我甚至宁可割肉了。我告诉你那个位置可能就不会到，起码暂时不会到。\n\n等真正有一天再到那个地方的时候，你又不舍得卖了——因为它一定有到那个地方的道理，你又看到希望了。\n\n3. 这不是谁指挥的，是博弈的结果\n\n为什么叫埋人都是埋得一层一层的？你上一层埋完，得让上一层别跑，然后再埋下一层。这不是谁指挥的结果——有的人老是拟人化，说有人就想这么干，不是，它是一个博弈出来的结果。\n\n因为那些人想跑，就一定要有人想买。而现在真正有钱的人都是想卖的，哪还有人再来买？那些优势投资者现在都准备出，他还去给你买？他一买不全买他手里来了吗？好不容易出这点儿，你再一拉不又跑他手里了吗？\n\n所以他给的方向是：「你现在持仓应该逐渐减少，而不是逐渐增加。」\n\n4. 「又发苹果了」\n\n它不会一直跌的，过两天还会涨一下。涨的时候它有好消息，会让你觉得这个一定会涨。\n\n上周我不是跟你们说了吗——又发苹果了。你知道有多少人那天又转进来、手上又拽上苹果？那天发苹果的价格和今天的价格比，就又下一个台阶了，说明那天领苹果的人手又被夹在里头了。\n\n## 九、上凉菜了\n\n1. 他自创的一个阶段比方\n\n他说前几天说「上凉菜」很多人没听懂，这次解释了一遍：\n\n前两天连凉菜都不是，那是花生米、炸虾片之类的，在我们东北这叫压桌——你刚进去餐具还没上，桌上摆点用手抓着吃的。上凉菜的时候，你得上餐具了。\n\n今天有点上凉菜的意思了。但你说热菜，那还早着呢。\n\n他还补了个段子式的注脚：「大部分人没等到热菜就已经喝多了——凉菜上完，基本上大部分就受不了了。」\n\n2. 这个阶段的特征：波动加大，成交量还没缩\n\n这个阶段会很长一段时间，加大的是波动。现在成交量还没开始缩小，等成交量一开始缩小的时候就彻底完了。\n\n现在不服的人还很多，有不少试图抄底的。今天还有人问我能不能抄底。\n\n## 十、几句零散的\n\n1. 人性为什么不会进化\n\n人性进化太难了。一个时代里聪明人是多少、笨人是多少、容易上当的是多少、能独立思考的是多少，和下一代人这个比例是没有什么变化的。\n\n2. 对前瞻指引的一句解读\n\n取消前瞻指引的意思，是让市场来决定利率。\n\n3. 他最不愿意回答的那类问题\n\n我不指导任何人操作，别问我这种话。你们挣钱也不给我，老问我啥？完了我要告诉你，亏钱你肯定赖我。\n\n4. 他自己的收尾\n\n我讲的就是评书，大家不能以此为依据来投资。所提到的所有东西都是为了解说方便，都不是任何投资建议，你别那么望文生义。评书，且听下回分解。","toc":["一、今天的关键词：保住本金，但别离开市场","二、这场最扎实的一课：交易的底层结构","三、他为量化说的几句公道话","四、当天的行情：一堂现场的「预期课」","五、你是第几个知道这件事的","六、技术分析：他这次说得最狠","七、他为什么反对动不动就改交易制度","八、埋人是一层一层埋的（当天的现场版）","九、上凉菜了","十、几句零散的"],"url":"https://xueqiu.com/2573414707/407226501","chars":5702},"topics":["看懂交易结构","别当最后知道的狍子"]},{"date":"2026-08-23","bili":{"title":"老木匠 2026年8月23日直播文字稿（从美军干预看美元信用）","text":"## 一、特朗普\"美军干预美债\"不是玩笑：主权投资者被瞄准\n\n特朗普随口说\"动用美军去干预美债\"，看似荒唐，但作为国家首脑说出这句话，对美债流动性评级是有实质影响的。\n\n第一，美军只能威慑主权投资者。 美军是对付国家的，不是对付个人。你能用军队威胁一个普通散户吗？不能。所以这一招只对主权投资者（外国央行、主权基金）有效，对个人投资者——无论国内国外——毫无作用。\n\n第二，威慑的本质是限制美债交易。 贝森特之前说\"飞马交易\"（把美债抵押给美联储换贷款），等于说\"不准在市场上卖，只能抵押给我\"。现在又说\"再卖就动用美军\"。这两件事本质一样：都是在给美债施加流动性限制。\n\n第三，流动性限制 = 事实上的违约前奏。 美债原本是不记名、完全流通的证券。一旦施加限制，它就成了\"不完全流通\"的证券。同样的偿债能力、同样的收益率，流动性不同的证券，估值完全不同——这就是金融学基本原理。给流动性就附\"流动性溢价\"，限流动性就产生\"流动性折价\"。\n\n用一个最直白的例子：2021 年你挂中介卖房明天就能出手，现在挂一年不一定卖得掉。同样的房子，流动性条件完全不同，金融学上给的价格也完全不同。房地产当年\"满五唯一\"免税也是一种流动性限制，房价就是从那开始跌的。\n\n## 二、美债收益率必升的底层逻辑：投资者结构变了\n\n为什么美债收益率（长期利率）压不住？根子不在美联储，在投资者结构。\n\n对收益率不敏感的人在撤出（外国主权投资者，因为被美军威慑），对收益率敏感的人在进入（追求价差的对冲基金、个人）。买方结构一变，自然就会不断抬高收益率、压低拍卖价格。\n\n更荒诞的信号：现在有人问普通老百姓\"你信美国国债还是信微软公司债\"，很多人选微软。当一个国家的公司债评级超过主权评级，这个主权评级本身就有问题了。\n\n所以贝森特是\"苦肉计\"：他明知道压不住长端利率，仍把能用的力量全使上（提高到 40 亿回购上限、飞马交易、美军威慑），把政治压力踢给美联储。这招对我们毫无用处——算不上贸易战，只对日本、韩国、欧洲这些美军驻扎国有一点点威慑，而且会不会适得其反还要观察。\n\n## 三、美元贬值的真义：不是汇率，是购买力\n\n很多人一听\"美元贬值\"就去看美元汇率指数，发现美元汇率在涨，就以为\"美元没贬值\"。这是朴素误解。\n\n关键区分：其他货币贬值，说的是它对美元的汇率在走贬；美元贬值，说的不是美元汇率，而是美元的购买力在降低——具体表现就是黄金在涨价。\n\n为什么全世界大宗商品用美元计价？因为二战后美国生产力世界第一，美元信用靠\"强大的生产力 + 强大的控制力\"双支撑。你现在拿美元去美国能买到啥？美国生产能力并不强，美元的购买力其实是靠中国商品在支撑。\n\n致命推演：如果人民币汇率从现在水平大幅升值（比如有人喊的 1:3），那中国商品以美元计价就翻一倍，你手里持有的美元实际购买力直接腰斩。这就是为什么\"美元是我们的货币，却是你们的问题\"——美国印一张纸就能换全世界的财富，靠的就是这个信用闭环。\n\n## 四、未来真正威胁：数字货币去中心化\n\n美元作为\"超级货币\"存在的理由，是国际贸易需要一般等价物做价格发现。卢布对卢比没有活跃市场，价格容易被操控，所以需要美元做中介。\n\n但区块链和网络的发展，让任何两国货币可以实时双边交易、实时价格发现。未来如果全世界建一个统一的数字货币交易系统（数字人民币的方向正是如此，和各国签双边货币互换协议就是\"去中心化\"），那还要美元干嘛？\n\n这不是一年两年的事，但是个大方向。美元信用松动，是慢变量，不是突发事件。\n\n## 五、产业链迁移：远离低端出口，盯住\"卖铲子\"的\n\n明确回避的方向：\n\n低端出口加工贸易企业（人工成本上升、出口退税取消、海外加关税，三重挤压，这部分中小企业主就是时代变迁的受损方）\n\n房地产链（今年前六个月土地出让金同比又大幅下滑，新开工少→钢筋水泥少→建材、玻璃、电线电缆、甚至高端白酒全链条减量）\n\nK 型分化里，技术含量低、以出口导向为主的，就是受损的那一端\n\n确定性的方向——AI 的\"卖铲子\"逻辑：\n\n你不知道 AI 最后哪个技术方案胜出、哪个公司最终受益，那就找给 AI 卖铲子的。无论基建还是运行，用电不会变。在国家房地产开发萎缩的情况下，用电还在增长，这说明电网建设、电力设备、发电设备是实打实的方向。\n\n有色金属也是同理：原来大头用在房地产，地产低迷但有色需求没减，说明需求结构已转移。但注意——有色预期早已打进价格里，别追高。\n\n年轻人买房支出少了，旅游和日常消费比例会上升，相关的消费机会可以研究。但个股我不能讲，只能讲大方向。\n\n## 六、读官方通稿的\"政治美学\"：字字都是信号\n\n新闻联播是中国最高权威舆论工具，得学会从里面看动向。\n\n中财文发\"中国经济才有韧性\"——第一反应\"经济数据不好打气\"是对的，但真正目的是预防针：未来可能有更复杂局面，而且强调\"不是我们引起的\"。突然发这种文章，恰恰说明可能有更大问题。\n\n外交部\"双方进行了坦诚的交流\"= 吵起来了；\"充分交换了意见\"= 谈了很久啥也没达成；\"持保留态度\"= 我不同意但不干涉你。\n\n这些词都是话术，国外白宫发言人也一样。慢慢悟。\n\n下周预计美元贬值交易+贵金属有短期机会，但不建议追高，风险自己担。石油价格永远判断不了，影响因素没一个可预测。\n\n## 七、投资方法论：安全边际才是应对不确定性的唯一解\n\n反对拟人化：动不动\"他们想让涨就涨、想让跌就跌\"，这是思考能力不足的表现（把雷公电母当真）。大盘没有主谋，只有博弈。2015 股灾不是谁设计出来的，是每个人追求自身利益最大化导致的混沌结果。\n\n反对技术分析迷信：波浪、金叉死叉、支撑阻力，都是安慰自己。求雨持续了一千年，一半的时候都不灵，为什么还信？因为人面对未知有恐惧，总要抓根稻草。未知就是未知，别试图\"解决\"它。\n\n均值回归是价值投资的底座：格雷厄姆在国会作证时被问\"如果永远不回归呢？\"他说\"我不知道，但经验上最后都回归了\"。为什么？因为所有机构都靠价差赚钱，价差 = 终点高 − 起点低，所以起点越低对他们越有利，低起点东西自然有人来做。你要做的，就是找坑趴着——但避开价值毁灭型（技术过时、时代淘汰，如汽车时代的马车资源）。\n\n安全边际应对不确定性：值一块钱的东西你五毛买，容错空间比两块钱买大得多。趋势投资者假设\"涨的会一直涨\"，价值投资者假设\"低估的会回归\"——你要清楚自己做的是哪一种。\n\n囚徒困境：茅台当年所有机构抱团\"都不卖\"，但有人想先跑，协议绑也没用。所有人的出发点都是自身利益最大化，没有谁真为群体扛着。\n\n## 八、闲聊与结尾\n\n血糖黎明现象：夜间血糖正常（5.9–6.0），早晨空腹高，是升糖激素生物钟导致，说明胰岛素反应变慢，控制标准随年龄放宽。计划再减十公斤，但不做深蹲（危险）。\n\n灵活就业\"狗血新闻\"、白菜甲醛都是媒体流量话题，过两天就淡了，别当真。\n\n公园老头撅屁股下棋、二十人围观吵架——\"男人至老是少年\"。\n\n设想未来开线下课（需系统备课，现在直播太乱），当旅游热闹。\n\n听直播别一惊一乍：买不知为何买、卖不知为何卖，就会来回被套或卖飞。搞清基础假设，才能摆脱这种状态。市场没啥可天天说的，投资的东西就那点，讲完就没了。","toc":["一、特朗普\"美军干预美债\"不是玩笑：主权投资者被瞄准","二、美债收益率必升的底层逻辑：投资者结构变了","三、美元贬值的真义：不是汇率，是购买力","四、未来真正威胁：数字货币去中心化","五、产业链迁移：远离低端出口，盯住\"卖铲子\"的","六、读官方通稿的\"政治美学\"：字字都是信号","七、投资方法论：安全边际才是应对不确定性的唯一解","八、闲聊与结尾"],"url":"https://www.bilibili.com/opus/1239629030259425369","bv":"BV1nv8s6nEXh","minutes":0,"chars":2976},"ai":{"title":"老木匠·2026年8月23日：热闹的地方就是险地","text":"## 一、动用美军干预美债：这件事真正的意义\n\n1. 他一开始以为是假消息\n\n他说看到「特朗普随口说要动用美军去干预美债」这条新闻时，第一反应是假的，追到CCTV4的消息源才确认。他的评价是：虽然是句玩笑话，但作为一个国家的首脑说出来，对整个美债的流动性评级是有影响的。\n\n2. 这一招只能对主权投资者有效\n\n你动用美军去干预美债，那你只能干预外国的主权投资者。即便是外国的非主权资金，你用美军也没有用——美军不是用来对付个人的。\n\n他说除了美军，类似的威慑手段还有军售限制。而这恰恰印证了他前几天讲的那条主线：\n\n这就更彰显了美债的投资者结构发生了变化。是对收益率不敏感的人在撤出，对收益率敏感的人在进入，所以买家会不断提高收益率，也就是压低国债的拍卖价格。\n\n3. 但可能适得其反：你能限制我卖，能限制我不买吗\n\n各个国家就得想：我这个美债现在卖与不卖是一件事儿，那我未来买不买是另外一件事儿。你现在可以威慑我让我不卖，我可以做到；但是我不买行不行？到期了你得还我，我不去买了行不行？\n\n4. 更根本的一层：额外的流动性限制，本质上就是违约\n\n美国国债原本是完全流通、不记名的证券，没有任何限制。你现在突然施加这么多限制——不准在市场上卖，只能抵押给美联储借钱；现在又说你再卖我准备动用美军了。这本质上就是美债的一种违约形式。\n\n5. 所以估值必然下降：流动性溢价与流动性折价\n\n他把这一层讲成了一条金融学原理：\n\n同样的收益率、同样的偿债能力，如果流动性不同，估值也是完全不同的。你施加流动性限制的时候，它就会产生流动性折价。所以美债的价值在理论上就应该降低——价值降低，收益率自然就应该升高。\n\n他举了两个例子做类比：同一家公司上市前和上市后估值完全不同，那个差额就是流动性溢价；而当年房地产调控规定「满五唯一」才免税，那也是对房子施加流动性限制，所以才导致房价开始逐渐走跌。\n\n同样的房子，现在和2021年为什么有这么大的价格差异？一个很重要的原因就是流动性已经完全不同了。2021年你挂到中介明天就能卖掉，现在你挂一年不一定能卖掉。\n\n6. 别以为这些人笨——是条件不一样\n\n大家不要以为这些人笨，这些人都不笨，都很聪明。只是他面临的条件就是这样。就像大明朝，崇祯皇帝一定比前边那些皇帝差吗？崇祯个人能力更强、励精图治的心更好，但问题在于他遇到的条件不一样——到大明晚期财政难以持续，谁上来都是一样的。而早期的时候，木匠都能当皇帝。\n\n## 二、为什么沃什成不了保罗·沃尔克\n\n1. 这是他两三年前就写过的判断\n\n他说2020年美国通胀刚起来时，很多人认为加息就能降通胀，他当时就说不行——「鲍威尔成不了保罗·沃尔克，今天的沃什也依然成不了保罗·沃尔克」。\n\n2. 沃尔克能成功，是因为有人给他提供廉价商品\n\n保罗·沃尔克那个时代，苏联已经开始走下坡路，中国刚开始改革开放。他把利息加到两位数能解决通胀问题，是因为全世界在给他提供廉价的劳动商品——刚开始是四小龙、四小虎，体量太小；到九十年代之后，就完全是中国接过这一棒了。\n\n他还纠正了一个常见的因果倒置：\n\n中国给美国提供廉价生活用品，并不是我们加入世贸才开始的。加入世贸只是结果，它不是原因。美国后来之所以同意中国加入世贸，就是因为中国可以源源不断地给美国提供廉价生活用品。\n\n3. 而这个前提已经变了\n\n他说2018年贸易战之后，中国已经开始警觉这件事，提出了内循环、双循环和「两山论」：\n\n那时候就已经很明显了，告诉你不要再给国外提供这种廉价生活用品了。所以慢慢地，很多廉价生活用品的出口退税都取消了。\n\n你美国加息就能治通胀吗？那得有人给你提供生活用品，而且得是廉价的。你美国自己明显已经提供不了了。\n\n4. 一个很好懂的比方：加息能让母猪快点长大吗\n\n就像当年猪价上涨造成的CPI上涨，你通过加息去解决这种通胀是没有任何意义的。你加息能让那个母猪快速成长吗？能让小猪快速成长吗？你不得等这些猪都养出来吗？金融工具并不是万能的。\n\n5. 顺带的一条产业判断\n\n他借这条线讲了为什么要远离某类企业：\n\n这些年一定要远离那些低端的、以出口导向为主的加工贸易型企业。第一，老外加关税了；第二，人民币在升值；第三，出口退税在取消；再加上人工成本极大提高，成本优势都在降低。\n\n你只要远离这些东西，很多大坑你就排除掉了。拿着那些相关标的，这些年不见得跌，但肯定没有什么机会，因为它的业务在逐渐被替代。\n\n他还把同样的逻辑用在地产链上：今年前六个月土地出让金和地块又大幅下滑 → 明年新开工减少 → 钢筋水泥、建材、玻璃、电线电缆都是减量 → 「房地产开发行为少了，高端白酒也卖不了多少」。\n\n## 三、怎么从大方向上找机会\n\n1. 找不到胜出者，就找卖铲子的\n\n你如果搞不清AI最后哪个技术方案会胜利、哪个公司会胜出，那你就找那些给AI卖铲子的公司。\n\n但他紧接着提醒：光模块本身就是这个逻辑，「只是说它做得太高了，我们现在也不知道未来建设的力度是否还需要这么大，这个我判断不了」。\n\n2. 一条更稳的线索：用电\n\n无论是现在AI的基建，还是未来AI的运行，用电这点是不会变的。\n\n他特别点出一个容易被忽略的观察角度：\n\n你要充分考量到一点：我们国家用电量的增长，是在房地产开发萎缩的情况下实现的，这是非常不容易的。那我问你，如果有一天房地产开发又开始有增量了，用电是不是会继续增长？\n\n他说有色金属也是同一个道理——「原来应用的大头就是中国的房地产，现在房地产如此低迷，有色的应用并没有减少」。但他马上补了一句：\n\n问题在于现在这种预期已经被很多人打在里头了。我要跟你说的不是这个，我是给大家讲你怎么从大的角度先思考问题、然后去找机会，起码先排除一些明显是坑的东西。\n\n3. 基本面分析完了，还有一步\n\n这只是从基本面的角度来分析，并不是说我分析完基本面挺好、明天我就买它。你还要考虑现在的价格是否已经反映了这种预期。\n\n4. 一个长周期的方向：对外买资源\n\n随着人民币升值、进口量增加，我们未来一定会实现贸易平衡——你不可能老维持如此大的贸易顺差，钱都让你挣回来了，人民币还怎么国际化？\n\n我们不光要花钱进口原材料，未来还会把大量外汇储备用在购买国外的资源矿场上，因为我们不是一个富矿的国家。\n\n## 四、怎么读官方文件：政治美学\n\n1. 他为什么强调要看通稿\n\n新闻联播是中国最高权威的舆论工具，你看都不看，你看啥？各种大会的新闻通稿，我是一定要每个字都读的。最后大家在自媒体上你传我我传你，传的都是不知道被人整了几手的信息，那都扯淡了。\n\n他说这种解读能力有人管它叫「政治美学」——「你感觉每天说的话都一样，那差别老大了」。\n\n2. 他现场做了一次示范\n\n他提到前一天有一篇很重要的署名文章，讲「中国经济为什么有韧性」，然后问大家：你的第一反应是不是「现在经济数据不好，所以发文章来打气」？他说这个理解是反的：\n\n真正的目的在于告诉你，可能会有更严重的问题——但是这种问题不是我们引起来的，你也要看出来。\n\n如果是为经济不好打预防针，那不是得先承认我们经济不好吗？可我们从来没认为过经济不好。所以它不是对经济不好的回应，而是告诉你未来可能面临更复杂的局面。总不能直说未来可能有金融危机吧。\n\n3. 外交辞令的对照表\n\n「双方进行了坦诚的交流」，这就是干起来了、吵起来了。「充分交流了意见」，就意味着没有达成协议。「持保留态度」的意思是：我们不同意这件事，但是我不干涉你。\n\n他说这不是我们独有的，「美国的白宫发言人他也都是这么说的，这就是话术」。\n\n## 五、美元贬值到底指什么\n\n1. 先纠正一个概念错误\n\n有人质疑「美元贬值」这个说法，他专门解释了两套计价标准的不同：\n\n现在的货币体系依然没有脱离布雷顿森林体系——全世界的大宗商品是以美元计价的，而其他国家的货币也是以美元计价的。所以你说日元贬值，是说日元的汇率在变化；但你说美元贬值，实际上指的是黄金在涨价。\n\n说美元贬值的时候，其实是说美元的购买力在降低；说其他货币贬值的时候，是说它对美元的汇率在走贬。这是两个完全不同的标准。\n\n他还借此说了句方法论上的话：\n\n你听到一个东西不懂的时候，先争取把它弄懂，先别按照你朴素的理解。有的人说话习惯就是：这事儿只要我没听过就不对——你没听过，也许是因为你知识水平不够。\n\n2. 为什么世界需要一个「超级货币」\n\n他把这件事从头讲了一遍：两个国家做贸易，卢布和卢比之间需要一个价格发现机制，但这两种货币的交易量都很小，价格容易被控制、难以反映真实购买力。所以需要一个大家都接受的一般等价物。\n\n每一国的货币只在国内才叫货币，走出国门它就变成一种特殊的商品。所有的外汇都是特殊的商品。\n\n有了美元以后，卢布和美元有比例、卢比和美元有比例，你马上就能算出卢布和卢比怎么换算，交易效率就提高了。\n\n3. 但美国也只是一个普通国家\n\n美国它并不是上帝，它也是一个普通的国家。美元成为超级货币之后，美国就自然而然获得了极端的优势地位——因为国际贸易上的货币是他发的，他就成了世界的央行。所以才有了那句「美元是我们的货币，但是你们的问题」。\n\n4. 美元信用靠的两样东西，现在都在流失\n\n第一，你这东西得能在美国换取相应的财富；第二，你得有强大的力量来保持它的流通秩序。也就是强大的生产力，加上国际上的控制力。\n\n你现在拿着美元到美国能买到啥？外国人愿意持有美元，是因为资源国愿意用美元结算资源、生产国像中国愿意用美元结算产品。所以美元的购买力现在都是靠中国在支撑。\n\n他还做了个推演：「如果中国的汇率有一天变成1比3，就意味着中国的商品以美元计价都是现在的两倍——那你手里的美元是不是在贬值？」\n\n5. 美元真正的长期威胁：去中心化\n\n未来极有可能出现一个统一的交易系统——由于网络发达，所有货币交易都可以实时进行价格发现，任何两个国家的数字货币在任何时刻都会有一个比值。那你还需要一个超级货币吗？这就叫去中心化。\n\n他说这也是数字人民币的意义所在：「并不是为了现在用人民币代替美元。如果所有国家都搞数字货币，都放到一个系统里实时交易，那你还需要美元干嘛？」他还提到我们和很多国家央行签的双边货币互换协议——「那就是去中心化，咱俩之间货币互换就完了」。他补充说这种努力国际上一直在做（比如特别提款权），只是当年网络不发达、价值发现太慢。\n\n## 六、关于「信仰」：这场他发了两次火\n\n1. 他最反感的是先有立场再有分析\n\n所有的东西你都不能靠信仰去支撑。你客观分析美国，那就像踩到尾巴上似的——你说美国是普通人这件事就不对，你必须得说美国是上帝的才对。\n\n我也反对小粉红，我也反对公知。这两种都是一样的：都不能从客观的角度来分析问题，都是先有信仰。\n\n他还举了个具体的例子：「你看当年日元升值的时候，有人说美元贬值都是美国设计出来的、千万不要小瞧美国。我说你们这都胡扯到哪儿去了。」\n\n他也说了自己的转变：\n\n我们小时候美国在我心目中也是神，那个时候人家真是神，你不服不行。问题在于所有的东西都在与时俱进——情况发生变化了，你的思维也要发生变化。\n\n2. 对标的的「信仰」同样致命\n\n很多人形成思维定式以后就很难改。他认为哪个好了，那就是双眼爆皮儿，那就绝对不能有任何不好的地方。\n\n前几年的茅台，谁说茅台有毛病那还行？茅台是唯一的真神。现在有人认识到某只有色金属股票好，那就绝对好，所有股票都比不了它，如果能选总统的话这股票就能选上。\n\n3. 所以他给了一个通用的警报\n\n你什么东西只要一信誓旦旦，你在股市里面就快亏了。最后让你形成一个信仰你就完了——就像当年的白马，你形成信仰说这玩意可以一辈子拿着，你就完了；「京沪永远涨」的时候，你的房子就完了。\n\n你一说这个铜永远不可替代、黄金未来成为最稀缺的资源，那你就完了。\n\n他举了黄金的历史做例证：「2008年救市的时候黄金涨到将近2000美元，国内涨到快500块一克，多少人冲进去被套在山顶上？到2019年才二百多，十年了。那个时候你让别人买黄金，人家都认为你跟他有仇。」\n\n4. 最该防的是被人植入念头\n\n你做股票不是说睡觉都得睁一只眼睛——你最要防止的还不是金融市场的变化，最要防止的是被别人在你心里种植了一个念头。就像《盗梦空间》里讲的那个故事。你一旦产生了对某个东西的信仰，你就快完了。\n\n## 七、市场为什么不可能被「设计」出来\n\n1. 拟人化是思考能力不足的表现\n\n金融市场的变化没有哪个东西是设计出来的。总有人把金融博弈进行拟人化处理，这本身是思考能力不足的表现——比如说天上打雷就是雷公，闪电就是电母，刮风就是老天爷吹气。这都是因为你不了解背后的来龙去脉。\n\n2. 抱团为什么必然瓦解：又是囚徒困境\n\n即便所有机构都签了协议说大家都不卖茅台，我告诉你都没有用。别说签协议，你拿绳子绑上都没有用，都有人想先跑。\n\n因为每个人决策的出发点都是自己的利益最大化。他会想：我永远不卖，那要是别人卖了咋办？我不就吃亏了吗？所以就会有人先卖——这就是囚徒困境的表现。\n\n3. 国家也只是博弈中的一股力量\n\n你动不动就说国家不可能让科技股下跌——那咱们历史上的科技熊市都是国家想让它下跌？在博弈里面，国家也是其中的一个力量而已。2015年的股灾是设计出来的吗？2024年的低点是他们想出来的吗？\n\n每一个人都是为了自己的利益最大化出发，最后导致的博弈结果是个混沌的结果。如果有一个人永远知道明天的确定性，这个人马上就是世界富翁。\n\n4. 技术分析为什么屡错不改：因为人要解决对未知的恐惧\n\n这是他这场给的一个新解释：\n\n人们面对未来的时候都有未知的恐惧，这是人作为生物固有的心理特征。他要解决这个恐惧，就一定要找一个救命稻草。其实未知的东西就是未知，你应该承认这种恐惧是合理的，不要试图去解决它。\n\n他还举了个很有力的反例，回应「这么多人信，一定有道理」：\n\n我们历史上靠求雨的方式希望老天爷下雨，持续了多少年？最少有1000年。那你告诉我求过雨的人有多少？肯定这么多人都发现，起码有一半的时候是不对的。那为什么人还是信奉求雨呢？\n\n所以改变一个思维定式并不简单。不是说这么多人相信他就一定有道理——这么多人相信他也没有道理，他就是没道理。\n\n## 八、这场最扎实的一段：为什么低估值一定会均值回归\n\n1. 先分清你做的是哪种投资\n\n趋势交易者最基本的假设是：涨的东西会一直涨。价值投资者的假设是：低估值的东西一定会恢复估值。你一定要知道你做的是哪种投资。\n\n他还讲了格雷厄姆当年在美国国会作证的故事：有议员问他「如果这个东西永远也不均值回归呢」，格雷厄姆回答说——「这是我们这个行业非常奇妙的一个地方。我不知道它会不会均值回归，但根据我的经验，最后都回归了。」\n\n2. 他自己给出的解释：机构靠价差吃饭\n\n这一段是他这场最有原创性的推理：\n\n所有的机构都得靠价差来赚钱。而追求价差，一个最简单的道理就是起点要足够低——价差就是终点高、起点低。所以起点低的东西对他们来说本身就有优势。\n\n那你如果越炒越高，价差就越来越小了。所以当一个东西无论多么优秀，价差已经足够的时候，有人就会离开，去寻找新的低起点。所以低起点的东西未来价值就是会回归的。\n\n3. 所以「坑」就是资源\n\n什么叫坑？坑就是资源。你找到坑在里头趴着就行了，自然有聪明人来做这个坑。\n\n4. 唯一要避开的：价值毁灭型\n\n你要找的坑不能是价值毁灭型的——那种坑你爬进去以后会越来越深。价值毁灭要么是因为技术过时了，要么是因为时代变了，反正这样的企业就注定被淘汰。就像汽车时代出现的时候，马车的那些资源就没用了。\n\n5. 投资的真谛，还是安全边际\n\n一个值一块钱的东西，你五毛钱买也不敢保证明天就一定涨，它也有可能跌到两毛五。但问题在于，既然它值一块钱，你五毛钱买的容错空间要比两块钱买大得多——这就是投资的真谛。\n\n他还说，把这些基础假设想清楚，你才不会「一惊一乍」：「你买你也不知道因为啥买，你卖也不知道因为啥卖，卖完了要么被套、要么卖飞，老是在这个状态里。」\n\n## 九、国家队的进出，不是在炒股\n\n1. 先纠正一个流行的误读\n\n他说看到有人分析「某救市资金卖出了某白酒，说明一个时代结束了」，「听得我心都堵得慌」：\n\n它卖什么都跟这个行业没有关系。它是要解决2015年遗留的问题——当年那些持仓都是2015年救市的时候被动买入的，钱是银行提供的贷款，那是个历史遗留问题，在今天这个牛市必须得解决。\n\n2. 关键在于：这类资金根本不在乎价格\n\n为什么它一定会下跌？因为卖的时候这些人根本不在乎价格。他是来赚钱的吗？他又不是来赚钱的。\n\n他把这个逻辑和美债直接对上了：\n\n美国国债不也是这样吗？为什么这么高的收益率还有人卖？因为现在卖的这部分是国外的主权资金，他根本不在乎价格——他怕的是美元贬值，他原来买美债也不是为了赚钱，是为了储备。\n\n3. 救市资金买入，是在投放流动性\n\n他回忆了2024年9月那一段自己的观察：\n\n那时候救市资金每天买入的都是宽基ETF——沪深300、上证50这些。有人说他们是为了挣钱、买带血的筹码，不是，他是在向市场提供流动性。因为那时候市场交易量很低。\n\n我根本不在乎价格，我是把钱扔在市场里头，市场里堆的钱就越来越多。等钱堆到一定程度、钱多票少的时候，买卖的力度就反过来了。所以我9月18号才说「冲」——那时候你可以非常明显地看到买卖力度已经发生本质变化。大家都说924行情，你去看一看，是9月24号涨的吗？是9月18号开始涨的。\n\n所以你不要把他们的进出理解为炒作。他是投放流动性、收回流动性，是这么调节的。你动不动就用你自己那点小钱来理解他们——他们为什么要挣钱呢？他们挣钱有啥用？\n\n4. 为什么不能协议转让给养老金\n\n有人问为什么不直接场外协议卖给公募或保险，他的回答是：\n\n你卖给谁、多少钱，这就会出现道德风险和寻租空间。掌握权力的人不又出问题了吗？\n\n5. 一个很实用的观察方法：看股东人数\n\n大量抛售之后，如果股东人数并没有增长，这说明有机构在接；如果是散户接的话，那得多少散户？你看看那几个有色金属的股东人数变化多大——翻一倍。\n\n国家队在出的时候，大部分票都是下跌的，说明他根本不在乎价格。而有色里面的机构出来是为了赚钱，他不在最热闹的时候出，什么时候出？\n\n他给了一条可以直接去查的：\n\n现在所有科技股的半年报不都出了吗？你比较一下股东人数，看看哪个是减少的。包括去年一季报的时候，你看看哪个有色金属的股东人数是减少的——全是大幅增加。\n\n6. 机构撤出之后会怎样\n\n一旦他们出去了，即便价格继续上涨也很难再涨了。因为你现在已经全部变成散户博弈——散户能形成合力吗？他的交易是随机的，怎么能把价格向一致的方向推？\n\n那就变成随机抖动：今天出个好消息大家朝这个方向走，明天出个坏消息大家朝那个方向走。这就是散户主导的。要是机构主导，出坏消息的时候它有可能还涨。\n\n他还顺带否掉了「散户抱团」这个说法：「散户就是乌合之众，永远形成不了合力。」\n\n7. 反过来，卖盘消失时的上涨也不需要有人拉\n\n等大的卖主不卖了，它自己就会回升。因为在同样的买盘下，一个大的卖盘突然没了，它自然就会回升——你不需要有人去刻意拉升它。\n\n他把这个和「顶与底」那条判断合在了一起：\n\n所有的高点都是基金买出来的，所有的低点都是基金卖出来的。等基金都卖完了，就没有人卖了，那就是低点。\n\n他还回应了「市场里都是机构没有散户」这种说法：\n\n基金是谁？基金就是基民。基民是谁？基民就是散户。哪个标的里只要基金一扎堆，你就一定要考虑风险。\n\n## 十、居不落险地\n\n1. 下棋里的这句话，用在投资上\n\n下棋有一句通俗的说法叫「车不落险地」。投资也是一样——无论这个地方挣钱挣多少，只要这个地方有危险，你就不能去。\n\n2. 什么叫危险？热闹就是危险\n\n为什么热闹的地方就危险？因为现在的猎物都在热闹的地方。用一句扎心的话说：现在输家都在热闹的地方，他只是等待箩筐什么时候扣下来而已。\n\n他重申了前一天那条判断：\n\n猎人站在哪个位置，取决于猎物在哪个地方扎堆。猎人的位置你是不好判断的，因为猎人是动弹的；你得判断猎物在哪扎堆，扎堆的地方你就别去。\n\n所以大家都认为美联储肯定不能加息，这个时候你就一定要加小心，因为傻子都在这边了。\n\n3. 他自己现在的状态\n\n我现在跟大家是一样的想法，我也觉得美国现在的经济状况经不起这种货币紧缩。但你不能寄托在「他一定不敢怎么样」上——那他要是犯傻呢？或者他不是犯傻，他干脆就是想来这么一下子，你受得了吗？\n\n有个朋友说沃什头发都愁白了，我比沃什现在都愁。\n\n他还给了一条对有色的明确定性：\n\n铝以后不会是红利股，所有的有色金属包括铝都只是周期股。现在唯一不好判定的是它这个周期到底结束没结束、未来会不会面临抖动。它绝不会成为你所说的红利股。\n\n以及一条提醒：所谓政策形成的稀缺性并不牢固——「那个产能上限也不是什么禁令，那玩意儿说改就改。原来还有三条红线、还有二手房限制交易，现在还有吗？原来还不让生孩子，现在鼓励了。」\n\n## 十一、把十年想清楚\n\n1. 大部分人把十年想得太短\n\n我说让你十年挣两倍、三倍，他觉得挣太少了。但结果是大部分人在十年这个时间段里都亏没了。\n\n你把十年想得太短了——十年涨三倍的东西多了去了。你现在是2026年，回看2016年到现在涨三倍的有多少？即便现在很多东西都跌下来了。\n\n他还指出为什么很多人做不到：\n\n你十年只涨两倍的原因，是因为你买的时候那个股票一定是非常热闹的。\n\n2. 但中间那段你不一定忍得过去\n\n从现在开始是牛市，我告诉你十年之后这个时候还是牛市——但中间的过程你肯定不一定能忍过去。2026年到2036年这期间一定会经过熊市，也一定会到那时候还是牛市。但这之前会有一次熊市，你能受得了吗？\n\n3. 回看K线时你都很英明\n\n你看过去的K线图，好像自己就能忍受似的——那是因为过去的事已经发生了。你要回到三国时期，你得比诸葛亮都厉害，你都知道街亭别派马谡去。\n\n动不动就回看美国。你看美国股市一直涨，中间那个波动你能忍受得了吗？2020年年初天天熔断的时候，你能忍受吗？\n\n他给出的结论是：\n\n你在考虑自己所有投资决策的时候，得把自己带进去——你自己的忍受能力是啥样的、心理承受能力是啥样的，这是一个很重要的自变量，最终的结果函数跟这个有关系。\n\n## 十二、关于亏损比例和「冠军」\n\n1. 七成人亏是正常年份\n\n七成人亏就是正常。如果所有人都亏，那是熊市。以五年这样的长时间段来看，那是九成人都是亏的。\n\n他对今年的定性是：\n\n今年是结构性牛市。你只要买重科技、意识不到风险的人，今年都很赚钱而且赚得很多。但我告诉你，在这个结构性牛市里赚了钱的人，70%最后都拿不走这个钱。\n\n2. 为什么冠军基金一定不要买\n\n某一年成为冠军的基金，那他一定承担了过大的风险，这样的基金一定不要买。你看巴菲特哪年取得过投资冠军？\n\n冠军都是城头变换大王旗，今年是你、明年是他，它就是一个随机分布——你今年这个策略正好和市场切合，你单押科技你就是冠军；明年换了，单押白马的就是冠军。\n\n他对实盘大赛的评价更直接：「那都是赌一把，你注册100个号随便整。那种东西明年他亏得裤衩子都没有。」\n\n3. 单押不是职业投资人的做法\n\n所有单押一只股票、单押一个行业最后获得成功的，多多少少都有一点幸存者偏差。你不要把它完全理解为能力——这都不是职业投资人的看法。你可以说80%都是运气。\n\n你看哪个真正的大私募基金经理会单押一只股票？\n\n他还澄清了一个常见误解：那些以某类资产著称的基金经理并不是「单押」，而是基金本身就有主题——「你选择了这个主题基金，他就得配置那些东西，否则就叫风格漂移」。他对风格漂移的定性是「本质上属于基金的违约」，而他自己的处理办法是：「很简单，不要买基金。」\n\n4. 择时这件事，当年是被嘲笑的\n\n2021年白龙马行情盛行的时候，你只要说择时，那就是一个另类——「你连投资怎么还能择时呢？不是买入以后就应该一辈子持有吗？任何时候买都是对的。」\n\n择时就是考虑价格。谁都得择时，你看巴菲特他也择时。\n\n他还用「裙子长短」做了个比方：「这个市场就是不断在变化。前两年流行长的，过两年流行短的，再过两年长的又回来了。你看现在都是高科技做成长型投资，再过几年他又变成价值投资和高股息了。」\n\n5. 鸡尾酒会理论用在今天\n\n彼得·林奇说，当有人给你推荐股票的时候你就应该清仓了；当你一跟人谈起股票、人家就觉得你要杀他父母的时候，是最好的建仓机会。那你说现在是有人推荐股票，还是要杀人父母呢？我说现在两者同时存在——所以它是一个结构性牛市，也是一个结构性熊市。那你自己买啥，你自己就知道了。\n\n## 十三、他看好的长期方向：品牌消费与医药\n\n1. 最能抗通胀的两样\n\n如果从跨年代的通胀角度看——不是今年和明年，是以十年为时间段——最能抗通胀的东西是品牌消费，还有医药。因为品牌消费和医药的定价权是很强的。\n\n他特别点了「和日常生活息息相关的调味品、酒类」这类。\n\n2. 但起点很重要\n\n你要注意起点，最热的时候你买的不对。现在给医药和品牌消费的估值并不高，因为市场大的方向热点不在这儿，没有机构来。\n\n3. 要等的是什么，以及要准备承受什么\n\n你要等到这一波科技行情过去，那些资金会寻找新的方向。问题在于，当科技开始下调的时候，这些东西最初可能也是下调的——所以你现在买可能会买贵。但你从长远看它还会回来；而科技你现在买再想回来，那你可太难了。\n\n4. 为什么现在难，才给你低估值\n\n热闹的地方没有低估值，你的价值都被充分发现了。而且现在的成交拥挤度，TMT一度占到全市场交易量的60%——这种东西无疑是持续不了的，因为交易是有摩擦成本的，你每交易一次就要付佣金、付印花税，交易来交易去就给你摩擦没了。\n\n现在是难的时候才给你低估值。你不难，为啥给你低估值？\n\n他还举了个耐心的例子：「可口可乐从1988年创了新高之后，一直到1998年才重新上涨。」并给出了自己对几个方向的看法：火电看不了（受煤价影响太大），核电长远看不错。\n\n## 十四、他自己的收尾\n\n以上讲的所有的都是财经评书。我没有任何理论基础，也不给你推荐股票，你也不要按我讲的来投资。我说涉及到的个股，也只是为了举例，只是为了让你们听懂一个道理，不是任何推荐。\n\n股市有风险，入市需谨慎，一切的投资都应该自己做主，不能听从任何人的建议。\n\n他还说了一句关于自己讲课的话：\n\n你反复听我，慢慢你也被我植入一个念头，就是逆向思维。但逆向思维的关键在于你得找对方向，你得是一个能辨别方向的人——否则有的人说的逆向思维，他妈就是自己转向了。","toc":["一、动用美军干预美债：这件事真正的意义","二、为什么沃什成不了保罗·沃尔克","三、怎么从大方向上找机会","四、怎么读官方文件：政治美学","五、美元贬值到底指什么","六、关于「信仰」：这场他发了两次火","七、市场为什么不可能被「设计」出来","八、这场最扎实的一段：为什么低估值一定会均值回归","九、国家队的进出，不是在炒股","十、居不落险地","十一、把十年想清楚","十二、关于亏损比例和「冠军」","十三、他看好的长期方向：品牌消费与医药","十四、他自己的收尾"],"url":"https://xueqiu.com/2573414707/407226453","chars":10936},"topics":["从美军干预看美元信用"]},{"date":"2026-08-22","bili":{"title":"老木匠 2026年8月22日直播文字稿","text":"## 一、美债博弈后续：贝森特甩锅见效，但美元重置挡不住\n\n承接前几天讲的——贝森特提高美债回购上限，本质是\"苦肉计\"把政治压力踢给美联储。现在看，这招短期好像奏效了：市场开始赌美联储挺不住、要投降，黄金有色金属都在涨，美债收益率也往上走。\n\n关键时刻是下周杰克逊霍尔年会，鲍威尔的发言很关键。但现在所有人都押注\"美联储必须马上宽松\"，这恰恰最危险——因为当所有人都预期宽松时，黄金、有色、高风险股票都涨到高位，买入的人全处在危险境地。一旦它突然紧缩，这些资产持有者就被洗劫。\n\n一点是确定的：未来美元要解决今天的问题，一定得币值重置，恶性通胀一定会发生。 历史上 1973-1974 年布雷顿森林体系解体时就发生过一次。但市场现在的普遍共识很危险——大家都认为\"必须马上宽松才能解死结\"，急于预判宽松，反而把自己摆在了接盘位。\n\n## 二、真正的博弈视角：输家先确定，赢家后分配\n\n这轮博弈里，最重要的是一句话：输家先确定了，赢家后分配。就是说，未来成本由谁负担已经注定，至于怎么分配那是后话。\n\n作为个人投资者，你决定不了任何事，唯一能做的是避免自己成为最后的买单人。买单有两种方式：\n\n持有股票，来一场股灾，你亏了；\n\n持有现金，现金慢慢贬值，你也是亏。\n\n所以你要想的是\"我怎么不成为买单人\"，而不是去替美联储操心\"他到底怎么赢\"。主动权在\"猎人\"手里——美联储和华尔街资本集团知道猎物（散户仓位）都在哪边，就从哪边下手。你作为看不到底牌的人，唯一安全做法是站在人少的那一面。\n\n我的现状：今年上半年已经把融资清掉了（割肉清的），现在绝不增加仓位。这是我头一次感觉到风险这么大——2015 年之后，今年的风险感知是最强的。危机真来了，第一个躺下的可能是日本（日元贬值那条线）。\n\n## 三、一张被忽视的牌：A股科技牛市是在打金融战\n\n很多人没意识到，今天美国国债的窘境，其中一个主因是 AI 公司大举发债融资，和美债竞争有限的市场资金。而美国 AI 为什么急着发债？是被中国追的——中国开源模型狂烧钱，逼得美国必须更快更大融资才能保持领先。\n\n所以逻辑链是：中国科技牛市 → 逼美国 AI 更快融资 → 美债收益率上升、财政窘境 → 消耗美国金融力量。这叫金融战。你买科技股，不管最后赚不赚，客观上都为中美竞争做出了贡献，就像买福利彩票不管中没中都做了贡献一样。至于个人买不买，那是你自己的选择，但我自己不愿意当买单人。\n\n## 四、当下策略：防守、不加杠杆、等危机\n\n现在的特点是什么都\"确定性不足\"——看空看多都不对，机会都是跌出来的，但它又不跌。\n\n我的做法：\n\n不加息、不清仓，但绝不增加仓位，已经没有融资；\n\n绝不碰杠杆，给自己留容错空间；\n\n远离受危机影响大、弹性大的品种（出口导向、国际定价的大宗商品）；\n\n危机真来时，跌得多的和跌得少的会分化，那时做扭转操作——把跌狠的买回来，这叫逆向交易。\n\n巴菲特账上三千亿现金就是在等一次下跌。他 2008 年之前就备好现金，危机一来遍地黄金（很多金融股跌 90%-95%），随便捡。你回看 K 线会奇怪\"当时怎么那么低\"，但真到那时你还是去追热闹的。\n\n别碰衍生品：期权、期货散户都别碰。期权是机构为对冲流动性风险买的保险，你那点持仓根本没有流动性风险需要对冲，买期权本质是在赌隐含波动率，你根本评估不了它的真实价值。当年的权证、港股的涡轮，对散户都是赌博工具。\n\n## 五、周期股铁律：高点一定告诉你\"这次不是周期了\"\n\n现在聊周期股的人多，先讲最本质的规律：\n\n周期股到高点时，一定会有一个故事告诉你\"这次不一样、不是周期了\"——它会改名叫\"周期成长股\"\"成长股\"\"新能源股\"\"AI 股\"，反正就不是周期股。道理很简单：如果高点时大家都明白周期还会跌回去，就没人买了。反过来，低点时会告诉你\"这次永远起不来了\"，也是镜像逻辑。\n\n猪肉是最典型的完美周期——上一轮超级周期，现在正经历超级波谷。波谷什么时候过去？得等一家大企业破产，拐点才到。现在全行业亏损已经满足，但出问题的企业\"个子太小\"，得几家头部里有一个出问题，才是转折标志。\n\n光伏也是全行业亏损、底部出清阶段，都不好选。什么时候好选？等成交量只有五千亿的时候，啥都好选。 现在两万亿成交、大家大干一场，你选啥都有风险。造船属于景气周期，但别被乐观带偏。\n\n## 六、房产：买高档二手房，别买新房\n\n如果自住，现在房子不贵了可以买，但只买高档二手房，绝不买新房。\n\n理由很现实：\n\n新房有入住率风险——小区只住 20% 的人，物业很快垮，你不敢住；\n\n高档二手房的物业服务已稳定运行十年，相当于帮你筛好了邻居（千金买房万金买邻）；\n\n当年炒房的人很多挺不住了在抛，原封没住过的高档二手房现在很便宜，你是在\"占他们便宜\"；\n\n新房面积算法、层高、装修标准都和旧房不是一回事，价格不可比。\n\n投资角度我不建议买，消费角度自住可以。无论买不买，别急着追，越等越便宜。\n\n## 七、医药与消费：逆向布局的窗口\n\n医药（仿制药/器械）：现在进入最黑暗时候，中报普遍不好（集采、反腐、控费）。但逻辑是——从今年下半年起，1961 年前后出生的人开始密集进入 65 岁，老龄化带来用药量持续增加。医药估值历史低位、能抗通胀，是防守品种。但器械有周期性（前几年医院扩张快，现在周期已过），不如仿制药纯消耗逻辑稳。莫德纳那种创新药更像科技股，另算。\n\n消费：被科技资金分流，现在反而便宜。年轻人住房支出占比大幅下降（房地产红利），钱会流向旅游、服饰、宠物、啤酒、必选消费。高端白酒和地产链离得太近，回避；啤酒、宠物这类和地产无关的，未来有反转可能。但别听了就马上买，要看价格便不便宜。\n\n证金公司退出茅台这类操作是结构性甩卖，不是看空公司——国家队 2015 年救市买入的，现在策略性退出，根本不在乎价格。甩卖时正好是占便宜的机会，等\"傻狍子\"回来给你讲新故事时你再卖给他。\n\n## 八、结尾：听评书，别较真\n\n今天聊得杂，但核心就一句——你永远在和自己的心魔斗。贵的时候你觉得还能更贵，便宜的时候你觉得还能更便宜，你不是分不清贵贱，是斗不过自己。\n\n连续六年百分之百收益？那种方法刑法里都写着（老鼠仓、操纵、内幕）。最赚钱的方法都在刑法里。学巴菲特，活得长比赚得猛重要。\n\n---\n\n声明：以上为直播内容精炼，从宏观逻辑与投资方法论角度整理，不代表推荐任何股票或房产。投资有风险，决策在自己。","toc":["一、美债博弈后续：贝森特甩锅见效，但美元重置挡不住","二、真正的博弈视角：输家先确定，赢家后分配","三、一张被忽视的牌：A股科技牛市是在打金融战","四、当下策略：防守、不加杠杆、等危机","五、周期股铁律：高点一定告诉你\"这次不是周期了\"","六、房产：买高档二手房，别买新房","七、医药与消费：逆向布局的窗口","八、结尾：听评书，别较真"],"url":"https://www.bilibili.com/opus/1239373312172228632","bv":"BV1aQ816FERW","minutes":0,"chars":2652},"ai":{"title":"老木匠·2026年8月22日：输家是先确定的","text":"## 一、当下最危险的地方：大家都跑到了同一边\n\n1. 贝森特那一招，效果比他预想的还好\n\n他先接上前几天那堂课：财政部扩大回购美债这件事本身没什么实际作用，主要是给美联储甩锅。但这两天他观察下来：\n\n现在好像大家都在预计这次贝森特这个甩锅效果挺好。我感觉可能大家都预计美联储要挺不住了。\n\n他说昨晚黄金拉得那么猛，「就是大家都在赌，最后美联储一定会投降」。他提醒关注下周的杰克逊霍尔年会，看沃什的发言。\n\n2. 但这个「一致预期」本身就是最大的风险\n\n现在市场上一个普遍的共识很危险在哪呢？就是大家都认为你必须得马上进行宽松来解决这个问题。因为所有人都预计宽松的时候，那么所有这些资产——包括黄金、有色金属、高风险的股票——都涨得非常高。在这种情况下，所有买入的人都处在一个危险境地。\n\n如果这个时候他突然紧缩，那现在持有这些资产的人是不是就被洗劫了？\n\n他把这个局面形容成：\n\n相当于所有的鸟都跑到扣鸟的那个箩筐底下了。\n\n3. 这场最重要的一句：输家是先确定的\n\n有的时候那个博弈的赢家是谁还不知道，但输家先确定了。就是未来这个成本现在已经有人担了——至于说怎么分配这个事，那是另外一回
