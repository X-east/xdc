":["一、开头：只谈方法，不谈具体标的","二、转折的起点：联储人事变动","三、科技确定性不足，AI没有经济闭环","四、美国低通胀与科研的底层逻辑","五、强平与踩踏：为什么六月底清掉所有杠杆","六、筛选主播的五条铁律（重点）","七、价值投资就是逆向投资"],"url":"https://www.bilibili.com/opus/1241065555115376641","bv":"","minutes":0,"chars":3367},"ai":{"title":"老木匠·2026年7月18日：风险是怎么判断出来的","text":"根@据2026年7月18日直播整理 · 按点分段讲解 · 保留原话语气和比喻\n\n## 一、他为什么从看多有色、贵金属转为谨慎\n\n1. 转变的起点：美联储主席人选换成了沃什\n\n他说自己去年一整年都非常看好贵金属和工业金属，也判断对面央行一定会大幅降息。但今年二三月份开始，情况变了——美联储主席提名从哈塞特变成了保罗·沃什，这件事让他一点一点转变了态度，不仅把手里的相关标的全部清掉，还一直在公开提示风险。\n\n他解释为什么这个人事变动这么关键：哈塞特是白宫经济顾问，完全按川普的意思办事；而沃什属于美联储的建制派，当年就强烈反对伯南克搞量化宽松。既然最终选的是沃什，说明川普原本想推的那套东西遭到了很大阻力，很难实现——「对面不是川哥想干什么就能干得了的」。\n\n2. 结果：降息预期彻底翻转，美元指数一路上行\n\n他说今年年初市场还普遍预期要降息三次，现在几乎没人这么认为了，这是个很大的变化。美元指数因此不断上涨，而美元一强，贵金属就一定承压，工业金属跟着承压。这也是他清仓有色的直接原因。\n\n他还提醒：美元走强的过程中，一些国家的货币压力会很大，比如韩元、日元，这些「类似美元影子货币」的货币如果被迫加息，对整个国际流动性的影响是很大的。\n\n## 二、为什么他说科技的「确定性不足」\n\n1. 科研本身就带两重不确定性\n\n他说科技研发的不确定性有两个层面：第一，科学研究本身就有风险——你朝着某个方向研究，最后不一定能做出你想要的结果，创新药也是同样的道理；第二，即便做出来了，还有「哪条技术路线最终胜出」的问题。现在的GPU、CPU、各种数据中心方案，最终哪个方案胜出、甚至到底需不需要这么多数据中心，都是未知数。\n\n他以自己的理工科背景（本科学物理、专业方向就是芯片和固体物理）说，自己对科技的理解在普通人里不算低，但即便如此也判断不了技术发展会带来什么样的经济因果链条——「哪个行业会受益、哪个行业会受损，我判断不了那么精确」。\n\n2. 堆算力这条路本身可能就跑不通\n\n他提出一个更根本的疑问：现在这种「堆算力+免费大模型」的训练方式，能耗是呈指数级增长的，可能把地球上所有能量都投进去也达不到最终效果。所以这个技术方案本身能不能跑通，就是个大问题，更别说后面怎么变现了。\n\n3. 现在很多人已经不研究细节了，只讲宏大故事\n\n他说现在很多热衷投科技的人其实也算不清楚账，索性就简化了——「我不需要搞清楚，我只要讲一个宏大的故事、知道一个大方向就行了」。比如「算力增加→电力需求增加→工业金属需求增加」这条链条，大家都是这么推出来的，但你问「铜的用量到底会增加多少」，几乎没人能算出来，而且技术还在变（原来英伟达用铜连接，后来改光连接，用量就变了）。\n\n## 三、库存高企的双刃剑：商品金融化\n\n1. 都说供不应求，为什么库存反而这么高？\n\n他提醒大家去看数据：铜在伦敦、美国、上海三大交易所的库存，加上中国的社会库存和保税区库存，其实是非常高的。既然都说供不应求，为什么库存会沉淀这么多？这就是需要思考的地方。\n\n2. 库存高不等于要跌，因为里面有「囤货需求」\n\n他解释：库存高不代表价格一定下降，因为库存里包含了一种非实际需求——囤货需求。买铜的人不是为了做电缆、做铜箔，而是留着等涨价，这就是「商品的金融化」。这和当年的高端白酒一模一样：供不应求的时候库存越来越多，因为酒并没有被喝掉，而是被人囤起来炒。\n\n3. 双刃剑：只要不涨，囤货者就会变成竞争性卖家\n\n这是他这段的核心：\n\n价格上涨的时候大家都在囤货。但反过来，它不用下跌——只要不涨了，这些东西本身就有成本，就是机会成本，因为它不产生孳息。\n\n他说，一旦错过了快速上涨期，原来不断增加库存的人就会转为不断减少库存——这时候他们就和生产者构成了竞争关系。而且囤货者可以不计成本地卖，生产者不行（生产者不计成本卖就亏了）。他举白银为例：现在很多现货持有者其实卖不掉，因为手里的货不是交易所注册的标准品，没法通过期货交割出去，散户更是没有这个资质。\n\n## 四、纳斯达克的风险：不在于涨多高，而在于「太窄」\n\n1. 风险来自投资范围过度集中，而不是点位\n\n他说自己从去年就一直认为纳斯达克风险非常大，但原因不是它涨得有多高，而是整个市场几乎把所有的资源、能源、货币都投在一个非常窄的范围里——AI、光模块、芯片、光纤，全都围着这一件事转。\n\n2. 整个AI行业加起来还没形成经济闭环，仍在烧钱\n\n他打了个比方：如果把这个行业里所有公司当成同一家企业来看，你会发现这家企业现在还没开始赚钱，还在烧钱。英伟达把芯片卖给云厂商，云厂商把算力卖给大模型公司，大模型公司的产品最终卖给谁？确实有人买，但买方付的钱和整个行业的投入相比，缺口非常大。\n\n那这个钱怎么平衡？他说只有两个渠道：一是上游（比如英伟达）反过来投资下游给他们输血，二是到市场上融资借钱。所以即便像英伟达这样「卖铲子」的公司，业绩看起来亮丽，本质上也是虚弱的。他引用塔勒布的《反脆弱》说，这个行业现在就很脆弱，不该把身家投在一个脆弱的行业里。\n\n## 五、AI竞争的本质是金融竞争，不是科技竞争\n\n1. 谁垄断了AI，谁就救了自己的货币\n\n他说美国在AI上孤注一掷是有原因的：全世界最终能胜出的可能就一两家，谁胜出谁就取得垄断地位。如果美国某家公司拿下了全世界AI的绝对制高点，那么「你只要买我这个东西就得用美元」，这实际上就救了美元——因为拿着美元现在去美国，武器不卖你、高科技产业不卖你，你只能买它的高科技终端服务，而它有垄断利润，可以随便定高价。\n\n2. 所以我们只要「不落后」就够了，不需要赢\n\n这是他反复强调的一个观点：\n\n这个科技竞争的背后实际上是金融的竞争。我们在AI上并不需要超过对岸，只要不落后、甚至不落后太多就可以了。\n\n他解释逻辑：假如美国最终做出来的是100分的东西，我们做出来只有75分，但75分能满足大部分需求，那美国的垄断利润就没有了——因为你再卖高价我就有别的选择。他用买手机打比方：新款和旧款的低端需求其实是一样的，「你出80的时候我买70，价格还便宜，够用就行」。\n\n他还借此解释了那场被很多人嘲笑「没什么像样的人来」的AI大会：来的那些非洲国家代表，正是未来「75分产品」的客户——我们能打75分的产品是卖给他们的，不是卖给自己的，「那是一次非常高明的营销」。\n\n## 六、美国当年为什么能治住通胀：靠的不是货币政策\n\n1. 沃尔克能成功，靠的是廉价商品的供给\n\n他说自己三四年前就写过这个观点：保罗·沃尔克当年治理两位数通胀却没引发大萧条，不是因为他有多英明，也不是货币立场多强硬，而是机缘巧合——先是亚洲四小龙、东南亚，后来是我们改革开放、加入世贸，全世界的物质商品生产大部分转移到了中国，我们又刻意维持很低的汇率，产品源源不断进入美国，便宜到匪夷所思。有了这个前提，美国才能维持低通胀，才能把大部分社会资源投到高端产业上。\n\n2. 比方：贾宝玉能吟诗作画，是因为有人替他做饭扫地\n\n他打了个《红楼梦》的比方：\n\n为什么贾宝玉、林黛玉能天天在大观园里吟诗作赋？那是因为有丫鬟、有老婆子在给他们做基本的生活劳动。你把这些人解散了，贾宝玉早上起来得生炉子、做饭、切菜、种菜、扫院子，晚上累个臭死，还吟什么诗作什么画。\n\n他说美国的情况也一样——他们最瞧不上的东西，恰恰支撑了他们的社会发展和高科技研究。他还用古希腊做了同样的类比：亚里士多德们能整天琢磨勾股定理，是因为有一个阶层在为他们提供服务，所以「基尼系数高的社会反而容易产生科学发现」。\n\n## 七、科学 vs 技术：我们的强项是技术\n\n1. 近八十年科学几乎没变，变的全是技术\n\n他强调科学和技术要分开看：科学的突破极少，需要天才，不是线性的——从牛顿到爱因斯坦中间隔了很久，而自上世纪40年代打下相对论、量子力学的基础之后，科学的底层框架几乎没变过。近八十年我们看到的变化，其实全都是技术在进步。\n\n2. 技术是人海战术，而我们人最多\n\n他说技术进步的本质是「堆人」——足够多的参数、足够多的方案、无数次失败之后确定下来的，跟学自行车一样，就是熟能生巧。所以他说「有人说光刻机中国人永远做不出来，我根本不信，只要是人做出来的，中国人一定能做出来」。而现在恰好是技术进步的时代，我们有工程师红利，理工科人数最多，「这是恰逢其时」。\n\n3. 1840年我们落后，是因为错过了一次科学革命\n\n他做了个历史梳理：1840年之前中国生产总值一直占全世界一半以上，之后落后，是因为那前后西方发生了一次科学革命（经典物理、天文、电磁学）——有了热力学才有蒸汽机，有了电磁学才有电机，而我们那时还在用没有科学理论支撑的朴素技术。到清末其实已经开始追平了，只是后来的社会动荡打断了这个进程。从1976年重回正轨到现在也才五十年，我们又成了全世界的生产中心——正是因为这五十年科学没什么变化，变的都是技术。\n\n## 八、他为什么在6月末清掉了全部融资\n\n1. 原因：结构性演化走到了极致\n\n他说今年上半年自己一直信心满满，后来失去信心，是因为判断这个市场的结构性演化已经走到了极致——把少数标的推到了一个无以复加的高位。他打了那个后来反复用的比方：\n\n那就相当于你住在一个村子里，有一个邻居家天天玩火。这个时候你要注意风险，虽然你不玩，你是不是也得准备点消防器材？\n\n2. 真正怕的是「连环强平」的正反馈\n\n他详细拆解了这个风险：高位融资的人跌到强平线后想平仓，但下面没人接，平不出去，第二天再跌一个板，本来没到强平线的人又到了——这个风险会自我实现。更关键的是，券商为了把钱拿回来，会去卖你账户里其他的东西，这就是「被动卖出」，被动卖出根本不考虑价格合不合理、估值是不是低。\n\n他说自己就差两天没卖在更好的位置，但那天晚上就决定第二天开盘不看价直接做，亏损也很多——「我可以不赚钱，但是我不能在这个地方有大的损失」。他强调风险永远是第一位的，同时也提醒：他是职业投资者、这是唯一收入来源，所以对风险的敏感度更高，业余投资者可以有自己的风险偏好，不必照搬。\n\n3. 踩踏是一阵风，关键是别在踩踏中出局\n\n他说踩踏这种风险杀伤力很强，但也是一带而过、过去就完了，所以「你一定要保证在踩踏的过程当中不出局」。但踩踏过后要分析引起踩踏的原因是否已经过去——他判断那些跌得又多又快的东西，回到原来那种模式的可能性不大，接下来要么继续缓慢下行，要么进入宽幅震荡。\n\n## 九、哪五类主播不用看\n\n他给了一套具体的筛选标准，说照这五条基本能筛掉大部分主播：\n\n1. 直播间人数超过5000的（严格点，超过2000的）\n\n他的逻辑是：水平高的人一定是曲高和寡、受小众追捧的；如果受大众追捧，那他就必须揣摩大众爱听什么、讨好大众。「我说的东西跟流行观点都不一样，搁雪球上发文章都有人骂我，能有很多人爱听吗？」他还说，人数上万的那种主播基本都是把这个当职业、靠这个赚钱的，而不是靠投资赚钱——真做投资的人有自己的能力圈，不可能什么都懂。\n\n2. 每天煞有介事说「主力资金进出」的\n\n他说凡是天天讲资金进出、主力资金流向的，这个人的逻辑思维有欠缺，不用看。\n\n3. 对市场进行拟人化描述的\n\n比如「他们把它拉起来是准备做什么」「主力今天就想砸盘」这类说法。他说市场是博弈的结果，它没有指挥部，你怎么能说「市场想干什么」呢？他打了个天气的比方：\n\n就像某一天下雨了，你不能说今天老天爷想下雨。你应该说南方的暖湿气流和北方的干冷空气相遇形成锋面，导致了降雨——这是冷暖空气博弈的结果。同样，打雷也不是老天爷想放屁。\n\n4. 一开口就埋怨这个埋怨那个的\n\n他说这类内容「不仅不能看，而且有毒」——它们提供的是情绪价值和甩锅出口，无论你多爱看，都解决不了你是否盈利的问题，反而会让你慢慢形成一种思维习惯：所有亏损都不怨自己，都是「有人想害朕」。他强调：\n\n这个市场既没有人拿着你的手去下买单，也没有人拿着你的手去下卖单。所有的买卖都是你自己决定的，收益你自己享受，亏损也由你自己承担。\n\n5. 总想改变交易制度的\n\n他打了个足球的比方：这就像中国足球一踢输了就说球有点小该换个大的、门有点小该换个大的、场子太长该改短。他说不是改变制度没用，而是「改变制度不是博弈者需要关心的事」——今天的规则下梅西是球星，明天改成八个人踢，梅西还是球星。所有交易制度都是你的外在条件、你的角色边界，是你改变不了的。\n\n## 十、价值投资和逆向投资，说的是同一件事\n\n1. 一个从价格看，一个从筹码博弈看\n\n他说价值投资是从「标的的价格低于它的实际价值」这个角度说的；逆向投资是从筹码博弈的角度说的——别人都不买的时候你去买。两者其实是一回事：\n\n只有大家都不看好的时候，它的价格才会被低估。没有一个大家都看好的东西，它的价格会被低估。\n\n所以通俗地讲就是「人多的地方不去」——人多的地方哪有便宜货？\n\n2. 低估的东西永远有，难的是你不敢下手\n\n他说不用担心找不到低估的东西，低估的东西永远会有，而且并不难找——「你就是一眼的事，就像从外面进来一个人，你一眼就知道他是胖子还是瘦子」。真正难的是：你找到了低估的东西却不敢下手，而这个时候你心里还想着买那个「胖子」。","toc":["一、他为什么从看多有色、贵金属转为谨慎","二、为什么他说科技的「确定性不足」","三、库存高企的双刃剑：商品金融化","四、纳斯达克的风险：不在于涨多高，而在于「太窄」","五、AI竞争的本质是金融竞争，不是科技竞争","六、美国当年为什么能治住通胀：靠的不是货币政策","七、科学 vs 技术：我们的强项是技术","八、他为什么在6月末清掉了全部融资","九、哪五类主播不用看","十、价值投资和逆向投资，说的是同一件事"],"url":"https://xueqiu.com/2573414707/407225674","chars":5409},"topics":["清杠杆","美联储变天","AI金融战","五类主播避坑"]},{"date":"2024-11-30","bili":{"title":"老木匠 2024年11月30日直播文字稿（期股区别、有色供需TC·RC、买重於卖、买股即博弈、确定性","text":"## 一、做股票还是做期货：完全不同的游戏\n\n有人问：你看好铜铝价格坚挺，为啥不去做多期货、非要买股票？结论：老木匠会买入并持有铜铝上市公司股票，但不会做多铜铝期货。\n\n铜铝从2021年起高位维持够久，这些公司这些年都以相对高价卖产品，年报会非常好——即便价格小幅下跌（非趋势性），业绩也不受影响；而期货现在做多没有必胜确定性，可能原地波动甚至小跌。做空更难，比做多难一百倍，市场多数空头是\"套保盘\"（有实业背景），纯投机空单极难。别研究两天价格就敢做空。\n\n## 二、有色供需与 TC/RC：缺矿是涨价前奏\n\n铜的逻辑简单：2011年后勘探开发投资低迷，新增矿产极少，老矿山扩产为主，新大矿几乎没有。且矿石品位下降、开采深度增加→成本升→部分不合算就减产，要维持供给必须提价。\n\nTC/RC（铜冶炼加工费）是照妖镜：矿紧时冶炼厂多、加工费被压低。去年 TC/RC 约80美元，今年降到十美元，一度出现负值（买矿不仅不能扣加工费还要倒贴）——说明矿太缺。但去年传导不顺：房地产低迷使大量废铜转做阳极板（与铜矿等效），废铜把精铜价格压住、精废价差缩小，利废企业改用精铜，废铜也被收去做阳极板，最后阳极板也紧了。叠加硫酸价高、副产黄金价高，冶炼厂还能撑。但库存（矿+废铜）都极低，明年若冶炼厂停产，才会真正传到铜价上涨。TC/RC 急剧下降往往是新一轮铜涨价的前奏。\n\n铜的需求端：房地产低迷使建筑用铜下降，但新能源（分布式光伏/风电发电端、新能源车用电动机增量、电网配网改造用铜线）填补了空缺，且这是持续性增量。电动机还带永磁体→稀土重元素需求。特朗普制造业回流美国→设备投资+电网建设→对铜铝是巨大增量（\"分家过日子得多备一套勺\"）。\n\n资源品警惕\"星辰大海\"叙事：九几年专家说石油40年枯竭，2008年高点又提，现在石油供过于求靠OPEC减产维持。锂年初暴涨后供大于求、萎靡至今（磷酸铁锂替代三元、产能狂扩）。任何时候提星辰大海都危险。\n\n## 三、买比卖重要：买错才亏钱\n\n\"会买的是徒弟，会卖的是师傅\"是错的、大错特错。买才最重要——买这一刹那决定了赚还是亏。你亏钱是因为买错了（标的错或价格错），不是卖错。买对了一定赚钱，卖只决定赚多赚少。\n\n别贪婪地要求卖在最高点。五块买七块卖赚40%够了，后来涨到九块与你无关；卖完变现金，下一步又是\"买什么\"的问题，没人规定卖了的票必须买回。钱没闲着（转去买别的），收益率看的是换仓后的标的。\n\n## 四、买股票就是买股票，不是买公司\n\n巴菲特\"买股票是买公司\"对他成立——他是发股票的，买下整个公司能用账上现金（如中铁账上现金比市值多），还得进董事会。你散户买股票就是买股票：你连董事长都没见过，看的只是按规则披露的财报，公司知不知道你买它都不知道。\n\n股票是公司所有权的一部分，平常由众人博弈定价。你可以分析基本面（股息率、每股盈余未来成长），但它仍不代表你\"买了公司\"——你每股对应的那块现金永远拿不到，得看分红和内部博弈。神酒账上那么多现金你每股能花着吗？对自己诚实，知道自己在市场上是\"啥东西\"再投资，别背谚语。\n\n## 五、确定性第一，分散防归零\n\n光上涨对你没意义——必须能预见且已下注的上涨才有意义。一年全仓赚20%就是牛人中的牛人；一支票涨100%你不敢重仓，屁用没有。银行定期5%你敢全存，因为确定性；股票拿不住是因为没确定性、在蒙。\n\n\"卖飞\"不要紧，卖飞前那段是确定的（如某票4块到5.5满仓，确定性够）。专业投资者视踏空为更大风险，所以常在低点前就买。\n\n防巨亏两法：①买得足够便宜（安全边际，参见塞斯·卡拉曼《安全边际》）；②分散投资。给亲属的小账户收益好是因为不用分散、不怕黑天鹅；自己的全部身家必须分散，否则一个归零就完了。\"一支单调\"是幸存者偏差，那是赌博不是职业投资。业余投资者（钱不涉身家）反而可适度集中，但原则：不急、不追高收益（高收益=高风险）、必分散。\n\n## 六、其他要点\n\n不投港股/美股的前提：你的资金体量是否大到一买A股就涨、一卖就跌？否则A股五千只、日常关注不超五十只足够玩，波动即收益。\n\n黄金股估值仍高：金价涨多但利润没跟上，且整个有色不是当前热点，股价终会反映业绩（格雷厄姆：短期投票机、长期称重机），但时间难判。\n\n固废回收\"理想丰满现实骨感\"：大厂难驱逐小作坊，因小作坊成本外部化（偷排、不交社保、骗退税），执法成本极高；除非特许经营+严环保+强共识，否则规模不经济。\n\n铝出口退税：原铝/氧化铝本无退税，仅简单铝加工品有；取消退税利好淘汰靠退税活着的低端加工厂（也是在补贴老外）。\n\n购买力保值：利息越来越低，存款保不住购买力；房子（有房者）降价、信托/P2P暴雷，未来更多人会进资本市场——\"先想不赔钱，再想赚钱\"。","toc":["一、做股票还是做期货：完全不同的游戏","二、有色供需与 TC/RC：缺矿是涨价前奏","三、买比卖重要：买错才亏钱","四、买股票就是买股票，不是买公司","五、确定性第一，分散防归零","六、其他要点"],"url":"https://www.bilibili.com/opus/1242934510121648131","bv":"","minutes":0,"chars":1966},"topics":[]},{"date":"2024-11-03","bili":{"title":"老木匠 2024年11月3日直播文字稿（铝产业链成本、劳动收入占比、中美通胀汇率、东北与地产偏见）","text":"## 一、铝产业链：利润被氧化铝端拿走了\n\n老木匠重申抛北船不是不看好造船周期，而是南北船换股比例锁定后市值已不低；同理年初抛紫金也不是不看好铜周期，只是涨太快。公司基本面和股价是两码事。\n\n看铝要看氧化铝。中铝不只炼电解铝，更主要生产氧化铝，其中三到四成外销，所以氧化铝涨价对它极有利；而云铝等外购氧化铝的电解铝厂，氧化铝涨价直接侵蚀利润。中铝的氧化铝全部自产，两端抵消，外销部分更是纯利润。\n\n电解铝成本两大头：①一吨电解铝耗电约一万三千五百度（小槽可达一万四千六），按五毛一度约七千元；②一吨电解铝需约三吨氧化铝。两项加起来逼近两万时，纯电解铝厂基本不赚钱——利润都被氧化铝端拿走了，所以中铝利润\"没地方长\"是因为氧化铝太赚。中铝有矿（几内亚博法铝土矿，80%自给），这是它区别于其他铝企的根本。\n\n冬天电解铝易涨价有两因：一是云南枯水期水电不足、火电配给有限，而大量铝厂迁入云南后电力负荷超载，枯水期被迫限电；二是北方采暖季雾霾，自备火电厂最后被停。两端同时限产，电解铝就易涨。海运成本占比低，干散货运价没怎么涨。\n\n## 二、提高劳动收入占比：被忽视的重大信号\n\n前几天文件提出\"提高初次分配中劳动收入占比\"，这是大事。我国长期资本、技术分配占比高、劳动力成本低，这是劳动密集型产品的价格优势来源，但也压制了全社会消费能力——靠资本/技术收入的人再有钱也不会多消费，而劳动收入群体基数庞大，只有他们收入增加才能释放消费。\n\n后果：低端消费、中老年消费（医药属大消费）受益；而以年轻人为主、依赖人工成本优势的服装加工、出口加工小厂受冲击（珠三角长三角首当其冲）。但品牌服饰（尤其女装）、啤酒（年轻人消费场景）他不看好——生育率下行，年轻人越来越少。曾经的抱团股把海天、千禾等低端消费炒太高，再好公司价格高了也不好。\n\n## 三、中美通胀与汇率：人民币是被严重低估的\n\n中国不会通缩，\"只能通胀不能通缩\"，治理不难。美国上一轮通胀以服务业为主，对底层劳动者工资是利好；下一轮若转为货物通胀，则会侵蚀底层。中国提高劳动收入后，输出的低端生活用品必然涨价，给美国带来输入性通胀——这不是我们追求的结果，是决策必然带来的。\n\n汇率上老木匠最担心的是人民币升值而非贬值。同样理发（无品质差异），中国二十块、美国二十美元，按购买力人民币美元应接近一比一，说明人民币汇率被严重低估。初级农产品中国更贵是正常的（美国土地便宜、轮耕制、机械化），但我们维持高粮价是为保护农民、保障粮食安全——十四亿人口不能把粮食依赖国外，这是底线思维，不是用钱能衡量的。\n\n## 四、破除偏见：东北与房地产\n\n东北经济没抖音里那么差，人均收入/存款并不落后；北船总部在北京、基地含武昌/重庆/青岛/天津造船，\"投资不过山海关\"是跟风瞎喊。老木匠强调客观视角、多跑地方。\n\n房地产现在\"不是看多空的问题，是不该关注\"——超发货币原来囤在房子里，未来都在资本市场；所有看多地产的大V都只盯交易条件（首付、利率、限购），从不讨论需求。未来十年赚钱的地方在投资市场。\n\n投资心法：①\"不下注的看空一毛钱不值，不下注的看多也是一毛钱不值\"——背下来；②最忌党同伐异，自己看多时更要关注高质量看空；③为证明自己正确而找理由维持旧观点是思维误区（马光远看多地产即此）；④乐观才能赚钱，悲观者正确、乐观者赚钱；⑤职业投资先求心理上财富自由，钱少、有紧迫感动作会走形。","toc":["一、铝产业链：利润被氧化铝端拿走了","二、提高劳动收入占比：被忽视的重大信号","三、中美通胀与汇率：人民币是被严重低估的","四、破除偏见：东北与房地产"],"url":"https://www.bilibili.com/opus/1242635997003382792","bv":"","minutes":0,"chars":1412},"topics":["铝产业链成本","劳动收入占比","中美通胀汇率","东北与地产偏见"]},{"date":"2024-11-02","bili":{"title":"老木匠 2024年11月2日直播文字稿（财报本质三表、现金流防造假、财报非投资唯一、有色股价金属价）","text":"## 一、财报本质：按规则披露的有限信息\n\n财报是上市公司按监管规定披露的财务信息，不是公司经营全貌——只披露规则要求的部分，自愿披露也有限度。社会公众投资者了解公司的唯一渠道就是财报，但别迷信它、也别把它当上帝视角。\n\n老木匠反对两个极端：技术派完全摒弃财报；财会派把财报研究到走火入魔。前者不对，后者\"只见树木不见森林\"，甚至可能有害。\n\n不要用\"强者思维\"投资。你看到的永远是碎片，内幕人员（如巴菲特是董事）掌握的信息你根本没有。很多影响经营的信息财报里根本反映不出来——比如猪周期，光数存栏、算料肉比没用，那研究的是人的心理和社会。投资者要\"不要自我降维\"，宏观、情绪都是维度，别把多维视角压成单一财报视角。\n\n## 二、三大表：照片、视频、血液\n\n资产负债表是\"照片\"（某一时点的财富快照，如每年12月31日），记录资产=负债+所有者权益（净资产）。资产是公司财富照相，负债是资产的第一来源（借来的），所有者权益是第二来源（股东出资）。\n\n利润表是\"视频\"（一时段的经营记录），解释两张照片之间的变化——今年比去年胖了，用一年的吃喝消耗能算出来。费用与资产的分界：能用多年的记为资产（折旧/摊销分年进成本），只用一年的直接计费用。\n\n现金流量表是\"特殊视频\"（只记录现金流入流出），因为现金是公司的血液，很多公司（尤其金融类）不是资不抵债死的，是现金流断裂死的。\n\n## 三、现金流是最难造假的照妖镜\n\n利润表按\"权责发生制\"——货发出去没收到钱也计应收账款、确认收入。所以营收很好看但没收到现金，要格外警惕造假嫌疑（如向经销商压货、抽屉合同\"卖不出可退\"）。\n\n现金流量表对应银行流水，极难造假。两种异常要警惕：①营收持续大幅高于现金流入（可能虚假销售）；②经营净现金流持续大幅高于净利润（可能利润调节）。白水类有海量经销商，卖方市场时压货无碍，买方市场时压货就涉嫌虚假销售。\n\n## 四、财报不能单独指导投资（维度论）\n\n九月末到十月初大部分公司财务没变，只因市场情绪变了股价就大涨。球球上著名看空者天天论证\"经济差所以市场不行\"——经济差可能是事实，但推导出\"市场不行\"错了，推开窗户看看是不是牛市。\n\n世界最好的投资人没有财会出身的，学太细反成障碍。老木匠自己很多公司一眼财报都不看：同质化经营（如券、银、保）看一眼利润即可，靠市净率高低判断低估；低估时买江苏某券商，错了也跌不多。周期股（中远、中国重工）在亏损时买入才有机会，经营最好时恰恰是股价最贵该离开时。\n\n但消费类一定要细看财报——个体差异大（如白水公司之间差异极大）。周期类公司一般也不细看报表。\n\n## 五、有色股价与金属价：看\"积分\"不看\"尖峰\"\n\n看有色价格投有色股是对的，但两者不是一一对应。理想状况下日产量×当日价格=日收入，全年营收是\"价格-时间曲线下的面积\"（积分）。所以关键不是价格多高，而是高价维持的时间。\n\n2021年后铜价中枢上了台阶，即便现在不涨甚至小跌，采掘类公司今年都赚翻了。两点：①洛阳钼业等高价期还在扩产能（一般公司做不到，它恰在低迷期逆势收购刚果金铜矿）；②周期股低迷期会\"寅吃卯粮\"调节利润（该计提不计提），好转时要补窟窿，所以经营好转利润未必好转——典型如中铝。\n\n中铝案例：2018年前有色低迷亏到极致，关停产能、堆积减值。2018年后回暖但净利润迟迟不高，因为连续四年大额计提（经营现金流大幅高于净利润已三四年）。到今年\"利润没地方藏了\"——该提的提完了，利润会释放。即便铝不涨，未来净利润还会更好。\n\n## 六、减值与商誉暴雷：往往是占便宜的机会\n\n计提（减值损失）：闲置不用但还在账上的资产（如改卖馄饨后烙煎饼的锅），经营好时一次性处理掉。商誉暴雷：高价并购超出净资产的部分，真正损失发生在\"花高价那天\"，报表反映时危机已过。所以商誉暴雷那一下对经营实质没影响，往往是买入好机会——上海电气（专网通讯诈骗硬伤）、福田（宝沃汽车生产线报废硬伤）都是\"预后好\"的硬伤，跌下来是机会；而那种不诚信收购（隔膜公司、澳洲益生菌保健品公司）是\"癌症\"，直接删除永不看。\n\n## 七、ROE 误区：巴菲特的工具不是你的\n\n前几年抱团股把 ROE（净资产收益率）当图腾，说\"只看一个指标就看 ROE\"。错。ROE 高往往意味着净资产少（轻资产，如白酒）；重资产周期股（铜、铝）ROE 天然低。\n\n巴菲特看重 ROE，因为他是经营企业者——高 ROE 公司产生大量自由现金流可再投资（如茅台账上闲置现金）。他若来中国可能买中铁（账上现金比市值还多）。你是二级市场小投资者，地位和他不同，别照搬他的指标。","toc":["一、财报本质：按规则披露的有限信息","二、三大表：照片、视频、血液","三、现金流是最难造假的照妖镜","四、财报不能单独指导投资（维度论）","五、有色股价与金属价：看\"积分\"不看\"尖峰\"","六、减值与商誉暴雷：往往是占便宜的机会","七、ROE 误区：巴菲特的工具不是你的"],"url":"https://www.bilibili.com/opus/1242635872445136914","bv":"","minutes":0,"chars":1905},"topics":["财报本质三表","现金流防造假","财报非投资唯一","有色股价金属价"]},{"date":"2024-10-27","bili":{"title":"老木匠 2024年10月27日直播文字稿（货币起源、银票本质、钱庄信用创造、金属仓库信用创造）","text":"## 一、货币的本质从一般等价物讲起\n\n人类走出原始社会后，劳动生产率提高带来剩余产品，于是出现交换。最早的交换是物物交换，缺点是匹配极难、效率极低。\n\n为了提高效率，各地逐渐出现\"所有人都欢迎\"的东西充当交换媒介，这就是一般等价物。历史上什么都有过——中东用羊、各地用粮食，但低值消费品仓储运输难、易损耗。后来高值、易储存、易分割的金银天然胜出，所以马克思说\"货币天生不是金银，金银天生就是货币\"。\n\n几个冷知识：中国商代用南海来的贝壳做一般等价物（离海极远却因稀缺而贵），汉字里\"财、购、货\"带\"贝\"字根就是这么来的；太平洋部落用火山石，沉到海底大家口头认可也算数，已是信用雏形；二战战俘营里香烟是一般等价物，今天监禁场所里则是方便面（老干妈不行，玻璃瓶摔碎成凶器）。核心启示：一般等价物是\"场合需要\"催生的，不是国家专属。\n\n## 二、通缩从一般等价物不够用开始\n\n当经济总量发展、一般等价物数量跟不上时，就会发生通缩——用稀缺的一般等价物标价，其他商品价格越来越低，大家就都囤着不花，抑制经济活力。古代靠开采贝壳/金属，现代靠可调控的信用货币。\n\n中国从贝壳转向金属货币：贝壳难取得→用玉、陶仿贝→青铜冶炼后铸铜贝，是标志性事件。金属货币按重量计价（一两银币磨损掺假后成色不足，仍按足值流通），于是出现\"劣币驱逐良币\"——足值货币被熔化重铸获利，逐渐退出流通。这句话的来历就是金属货币流通，不是今天才有。\n\n## 三、银票不是货币，是凭证\n\n中国长期用白银（黄金少，用金会通缩），白银运输仓储难，催生了钱庄（南方）、票号（北方，起源山西平遥祁县太谷）。把白银存进钱庄，开出\"银票\"，可在异地分号兑付，免去运银之苦。\n\n关键法律区分：银票最初是存货凭证/物权凭证——你存五两，提的还是你那五两，凭证只对应你自己的货。但白银是\"种类物\"，取的时候谁的五两都行，很快银票就变成债权凭证/支取凭证——凭票到任意分号取五两，不管这五两是谁的。这和今天银行存款一模一样：你存进去的一万，取出来的绝不是原来那张钞。很多讲货币的主播（甚至专家）都分不清这层本质。\n\n## 四、钱庄如何变成银行：信用创造\n\n钱庄票号经营中，总有一部分白银沉淀（不可能所有人同时来取）。有人来借一百两白银、付利息，仓储企业就变成了信用经营企业。更进一步：借的人也不给实物白银，直接开银票。此时银票数量＞白银数量，这就是信用创造——只有到这一步，银票才真正成为纸币。没有信用创造之前，银票只是实物货币的代表，不是货币。\n\n## 五、有色金属仓库的\"不翼而飞\"真相\n\n新闻常报\"某港口铜不翼而飞\"，老木匠说写这词的人不懂行。铜仓库和古代钱庄一样在做信用创造：经销商存一万吨铜（付仓储费，本质是物权凭证），仓库有沉淀铜，下游加工企业来\"借铜还铜\"（不是借钱），赚的是利息——这就是今天的供应链金融，借铜和借钱等效。\n\n铜价大涨时，经销商要获利了结、提取存货，但仓库早把铜融出去了（借给加工企业未到期），于是提不到货，被说成\"不翼而飞\"。黄金\"消失\"同理。这不是管理漏洞，是信用创造过程中的期限错配，圈内人都心知肚明。","toc":["一、货币的本质从一般等价物讲起","二、通缩从一般等价物不够用开始","三、银票不是货币，是凭证","四、钱庄如何变成银行：信用创造","五、有色金属仓库的\"不翼而飞\"真相"],"url":"https://www.bilibili.com/opus/1242635756457951239","bv":"","minutes":0,"chars":1291},"topics":["货币起源","银票本质","钱庄信用创造","金属仓库信用创造"]},{"date":"2024-10-17","bili":{"title":"老木匠 2024年10月17日直播文字稿（发布会解读、地产开发ABC、房价下跌风险、转道资本）","text":"今天加播一期，专门纠偏住建部房地产发布会后自媒体上各种混乱解读，免得大家被误导。核心一句话先放这：国家是稳房价，不是保房地产行业，这是两码事。\n\n## 一、发布会解读：所谓\"不及预期\"是个伪命题\n\n很多人说发布会内容\"不及预期\"，这个说法值得商榷。大部分非专业人士对这些政策本来就没有预期——你问他说\"超了谁的预期\"，他答不上来。普通散户对这些东西基本都没预期，何来\"不及预期\"？\n\n对我而言，今天发布会一点也不超预期，效果完全在昨天直播的预测里（昨天就讲了保房价、控增量、房企经营会恶化，并指出相关上市公司股价会波动）。今天下午市场大跌，直接原因就是房地产及关联行业股价大幅波动。我没什么新观点，主要是针对以讹传讹的说法做澄清。\n\n房地产从1998年房改（住宅商品化）起步，一路涨到2021年（2021年已拐头向下，但开发量有惯性），标志性事件是恒大暴雷，开发量急剧下降，2023年这轮大开发时代彻底结束。之后大家还指望政策挽救行业、挽救房价，但先要想清楚你究竟在指望救什么。\n\n我们为压住房价过快上涨，出台过三道红线、限购、购房资格审查等收缩性限制措施。今年鼓励性措施力度已经非常大（除核心区外限购基本取消，首付和利率大幅降低，从限制买房变成鼓励买房），但过去一年行业低迷状态没改变。这引出一个关键问题：房地产低迷究竟是调控的结果，还是供求关系发生了根本变化？ 经济工作会议早有精确定调——\"供求关系已发生实质性变化\"。最大矛盾不再是调控，而是实际需求不足：一是开发量太大（地方有冲动鼓励开发，因这是财政收入主源），二是人口结构逆转（老龄化+新生人口少，净人口开始下降）。已从供不应求变成供大于求。\n\n## 二、地产开发ABC：怪胎模式与土地财政即税收\n\n房地产开发企业是个\"怪胎\"——它自己不设计、不盖房、不卖房，只负责一件事：筹钱整合资源。所以这是最没技术门槛的行业，只要有钱谁都能做，央企当年也能顺滑切入。我们借鉴了香港模式（预售制等），而香港高房价本质是财阀对政府的绑架。\n\n资金流向要理清：开发商买地拿的是银行的钱（开发贷），老百姓买房拿的也是银行的钱（按揭贷），所以房企是极高杠杆，自有资金极少。\n\n钱最终去哪了？最大一项是交给政府的土地款。无论北京上海哈尔滨，建安成本（水泥钢筋）都差不多，区别最大的是地价。政府拿地两种方式：\n\n农地转建设用地：给农民补偿极少，成本很低；但耕地有十八亿亩红线，占一亩要\"占补平衡\"（可货币化交费，去新疆新开垦一块补上），耕地总数不变。\n\n拆迁（征收）：成本比农地高得多，但地块在城市核心区。拆100平老房一定建400平新房才有人做——给原住户的拆迁补偿，最终是新买房人出的钱。这句话记住：拆迁款虽由政府发，来源是购房者的房款。\n\n当需求不足、房子卖不动时，整个资金链就断了——既没钱给农民，也没钱给拆迁户（一般政府先垫付，后期打进地价收回；若开发商算账卖不出去，政府就没财政去拆迁补偿）。随着开发低迷，地方财政那块非税收入锐减，各地捉襟见肘，基建不见起色主因就是地方政府没钱。\n\n过去二十年的高房价，本质上类似于一种税收。 政府卖地收入和政府财政支出等效，支撑了我们的基建、铁路、公园、地铁、教育、科研、福利。居民忍受高房价付出的钱，大量用于公共开支——取之于民、用之于民，你也享受了高速路高铁。房地产作为支柱行业，对我国过去二十年的高速发展促进作用极大，和买房人极大相关。\n\n## 三、房价下跌的两大风险\n\n房子有资产属性（耐用消费品）、也能带来孳息（出租），但使用年限极长+耐储存+曾稀缺，必然引投机资金介入。投机资金推高房价，而相关部门起初没重视甚至放任（地价高政府受益，地方没动力打压）。房价太高最终制约了全社会消费能力——普通人收入大半用于买房，没钱做其他消费。后来限售限购限贷出台，但真正让趋势逆转的不是这些措施，而是供求关系变化：房子越盖越多、旧的又不退出市场（不像啤酒喝了再产），空置增加；人口逆转需求减少；居民加杠杆买不动了。价格转跌时，投资领域普遍现象出现——上涨时没货（日光盘），下跌时没人要货，投机客手中的房子全变成房源，越跌房源越多（中介门市一看便知）。价格还影响审美：房价涨时炫耀大房子，跌时大房子全是缺点、挂出去又卖不掉，人心烦。\n\n房价下跌两大严重问题：\n\n1. 金融系统性风险。 房子是抵押给银行的。价格跌到抵押不足时，工厂贷款会被要求补充抵押品，但居民没有可补充的抵押品。当房子变成负资产（如100万的房贷款80万，房跌到40万还欠80万），理性上购房者最优选择是断贷（把房给银行拉倒）。很多人误以为\"房不要了事就了了\"，但法律上房子只是抵押品，欠银行的贷款仍要还，差额有义务补，不还就上征信、被起诉、限高消费。房价一旦下跌→抵押品不足→断贷→银行坏账→法拍→房价再跌→恶性循环，最终系统性危机。 这正是国家严防房价下跌的原因。\n\n2. 财富效应导致消费收缩。 房价高时觉得自己有钱，消费冲动强；下跌时房子还是那套房、也没卖，但觉得财富缩水，就会节衣缩食。全社会这种效应叠加，消费能力下降。\n\n这两点必须解决，所以才大力出台政策。\n\n## 四、大开发时代结束与资金转道资本\n\n国家不是保房地产，是稳房价——记住这四个字。稳房价的措施围绕两件事：扩大需求（降首付、降利率、解除限购限售、放宽落户）和限制供给（不新批建设用地、严控新增规模、贷款鼓励收回未开发土地）。\n\n关键推论：限制供给=限制房企开发活动。 房企以盖房为生，买地—设计—开发—销售才能赚钱，现在人为让它停，手里的地政府买回去，固定成本（人吃马嚼、办公）照付，它怎么活？怎么会有利润？所以今天房地产开发企业、建筑建材、钢铁（螺纹、铁矿石）大幅下跌完全符合逻辑。前几天还去炒房企标的的人，没想明白它怎么活下来。\n\n而有色（铜、铝）对房地产低迷已经\"免疫\"——去年开发投资就已很小，保交楼下需求不足，但铜铝价格依然坚挺，说明出现了新需求（新能源发电、电网建设）或供给端出问题（铜矿勘探不足、矿老化）。今天的下跌多是情绪错杀，反而是买入机会。黑色系跌正常，有色不跌，区分就在这。\n\n我把这次发布会理解为大开发时代结束的时间标志——时代虽从2023年已结束，但人们总还指望\"有人拉我一把回到高光\"。看完发布会该彻底死心了：国家保的是房价，不是房地产行业。\n\n有人恐慌\"房地产不行其他行业都完\"。问一句：欧洲、日本、美国开发时代早结束了，经济为什么发展得好？这是路径依赖（静音效应）。人在解决居住需求后，有余钱余力会创造新需求——就像你还完房贷装修完，会想洗浴、旅游、露营，新需求就出来了。国内旅游已肉眼可见地旺盛。当然公共部门（公务员）非常困难：过去二十年高工资由房地产支撑，地方财政窟窿难补，唯一办法是裁员（退休不补、部门财测都是裁员）。别削尖脑袋考公务员，不如学会烙饼——九十年代公务员不如开出租的，社会在变，别以为最近二十年看到的永远不变。\n\n对投资的影响——资金转道资本：\n\n1. 沉淀在房地产投机里、买信托理财的资金，会从行业里脱离出来找新生息渠道。资本永不眠，永远在寻找生息的路上。这些资金进入资本市场，是第一个大影响。\n\n2. 居民在房子上支出减少，用在\"行游衣餐\"和其他投资的比例增加。未来要投资什么，建议离房地产开发产业链越远越好——不投钢铁、铁矿石、建筑建材、家具、装饰装修（今天防水材料跌很多），家电稍复杂（寿命短有更新需求）。医疗需求更不用说会增加。\n\n1998年起，居民财富通过买房沉淀在房子里，房企是那个\"通道\"；未来财富会通过券商购买资本市场上标的沉淀，券商起的作用和当年房企类比。所以长期看好券商——但注意，看好行业不代表永远看好价格，市场预期很快走完，行情对多数标的来说急而短，除非是最终走出来的龙头有缓慢持续上升期。\n\n行业好不代表票好，行业差票不一定差——造船行业我长期看好却抛了大连造船厂，因并购方案算下来已不便宜；行业低迷时恰恰可能是买好票的时候。分清你考察的是票还是行业。","toc":["一、发布会解读：所谓\"不及预期\"是个伪命题","二、地产开发ABC：怪胎模式与土地财政即税收","三、房价下跌的两大风险","四、大开发时代结束与资金转道资本"],"url":"https://www.bilibili.com/opus/1242158430975688725","bv":"","minutes":0,"chars":3279},"topics":["发布会解读","地产开发ABC","房价下跌风险","转道资本"]},{"date":"2024-10-16","bili":{"title":"老木匠 2024年10月16日直播文字稿（房地产周期、有色超级周期、医疗低估、周期股估值、国产品牌回","text":"今天主要讲几块硬内容：房地产为什么不是短期能跌完的、有色金属（铜和铝）的超级周期逻辑、医疗为什么是极度低估的长标、周期股的估值该怎么看、以及国产品牌回归的底层逻辑。\n\n## 一、房地产周期：保房价不是保行业，周期以三十年计\n\n房地产价格下跌后，居民财富缩水，消费信心不足（财富效应），全社会都感受到了跌幅。网上有人传\"拆改\"消息说拐点来了，官方当晚就辟谣了。这消息其实是\"预言\"——拆迁成本极高，以前能拆是因为拆完腾出的地能盖更多更高密度的新房卖出去；市场逆转、新房卖不动时，没人会主动来拆。\n\n不要期望从九八年涨到二一年的市场，调整几年就完。 所有价格周期性变化都由供需结构引起。房子有消费品属性，最终要有人住。现在大面积空置、明显过剩，一旦过剩，投资品属性也会逆转——历史上葱姜蒜短缺时有人炒，房子供不应求时也有投机资金炒作，所以高层才提\"房住不炒\"。基础供求关系逆转时，里面的投机资金就要套现离场。\n\n一个反直觉现象：房价下跌时，二手房挂牌反而变多，不是变少。按一般经济学，价格降供给应减少，但现实是越跌越有人卖。解决过剩只有两个办法：人口增多（短期做不到，人口已负增长，我那年代一年出生两千四百万，去年才九百多万），或房子自然出清（寿命约五十年，一年淘汰约2%，不新增的话二十年减少约40%，足以逆转供求）。这就是房地产周期极长的原因——和房屋寿命直接相关。\n\n规律适用于所有周期行业：船寿命约二十年，完整周期约二十年；工程机械正常用六到八年，完整周期六到八年（上一轮高峰2018，下一轮谷底大概2024）；猪周期出清快，两到三年，但上一轮是超级波峰（疫病+南方水网禁养政策叠加），所以特别长。\n\n当市场上所有人都开始说一个行业\"不再是周期行业、是成长性行业\"时，往往意味着上升周期到头了。 工程机械到顶峰时市盈率极低（赚得多），就有人找理由说它是成长性行业（出海弥补国内）；锂矿上一轮高峰也有人说是成长性行业（新能源星辰大海），后来事实打脸。我对锂矿当前是否到底的判断：还没有，因为到顶时投的产能还没实际产出，产出后竞争格局更惨烈。\n\n保房价和保房地产行业是两个完全不同的事。 大部分房子在居民手里，保房价保的是居民财富不缩水、抵押物不贬值（避免断贷→银行坏账→法拍→房价再跌的恶性循环）。银行并不想要你的抵押品——大宅门里白景琦用一坨屎做抵押拿到钱去垄断阿胶，故事背后是：抵押品大多难以实现，银行真到变现抵押品时就完了，会引发系统性危机。所以国家严防房价下跌。\n\n保房价的供给角度是控制供应——减少供地、收回闲置开发土地、中央强调\"控制增量\"（不轻易新批开发项目）。这意味着房地产开发建设投资一定会减少。在严控增量下，房企（如万科）固定开支靠裁员解散解决，经营走向恶化。所有保房价措施对房企经营毫无意义，且我认为即便出了这么多措施，房价也难保住——供需决定，未来房价还会继续跌。\n\n## 二、有色金属：铜的超级周期在矿端，铝瓶颈在冶炼端\n\n铜的典型周期是\"铜博士\"，反映经济周期。这次是超级周期，原因不是需求爆发（房地产、机械低迷，铜需求并无颠覆性增长），而是供给不足——考虑供需错配而非单纯需求。\n\n铜的瓶颈在矿端：上一轮开发高峰在04、05年，价格高涨刺激勘探，从勘探到形成产能约七到八年，所以2011年左右大量产能出来，之后供给过剩到2018年才基本匹配。2011年后铜价低迷，导致铜矿勘探开发投资极少，到今天新发现新产能严重不足。现在是紧平衡，稍微过剩（上海库存去库不顺），但明后年供给不足就会显现——老矿品位下降退化，新矿难为继。\n\n冶炼费用（TC/RC）最能说明问题：去年加工费一度出现负数，即炼铜不但白干还要倒贴钱给矿主。为什么矿主还干？因为停产重启成本极高、要安置工人；且冶炼有硫酸等副产品（成本一百多卖三百多）和金银伴生可补偿。费用低说明铜矿极度紧缺，竞争采购的冶炼厂被迫压低自己的加工费。费用低到一定程度，有的冶炼厂无以为继就停产，电解铜产量下降，铜价进一步上涨。全世界冶炼产能约两千万吨，每年只能产出约一千八百万吨矿，缺口会让部分厂买不到原料而停产，那时才出现真正的供不应求。\n\n一句话：铜的瓶颈在矿端，超级周期由过去十年铜矿勘探投资不足造成，价格可能涨到难以想象。 另外，有色价格不只由供需决定，还由币值变化决定——信用货币一直在膨胀，每次经济危机都靠发货币解决（稀释债务）。黄金是美元镜像，一直涨；美元指数因高利率（孳息优势）被人为抬高，掩盖了以美元计价商品的真实涨幅，一旦美国降息、美元指数走弱，大宗商品尤其黄金会涨价，反映美元购买力降低。\n\n铝的瓶颈在冶炼端。 铝土矿不缺，我国冶炼产能占全球一半以上，且有4500万吨电解铝\"天花板\"政策（指标可买卖、有稀缺性）。铝极端耗能，早年北方采暖季雾霾时小铝厂停产，电解铝价上涨；后来大厂搬到云南用水电（还符合绿色铝标准），但云南枯水季电荒又逼停产（电解铝停产重启成本比铜还高）。今年氧化铝涨很多，一是中原氧化铝厂环保不合格停产，二是可能叠加印尼铝土矿出口管制、几内亚发运困难。氧化铝涨、电解铝没明显涨时，有自有氧化铝的央企铝公司极有利（外购氧化铝的纯冶炼厂利润被挤压）。我买过云南铝（看重绿色铝），后清掉换央企铝——后者从2018年供需平衡后每年现金流都很好，但利润体现不出来（过去上了无效产能，停产就减值，如千万建的生产线当废铁卖百万，九百万从当年利润里减掉；还有应收账款核销），且在几内亚买铝土矿全用自有资金、负债持续下降。看标的要看它过往多年的经历，才敢在相对高价时仍买它。\n\n## 三、医疗：全市场最被低估的长标\n\n医疗行业从长远看是投资，不是短期标的——逢低买一点，涨太快就慢一点。逻辑极简单：人口老龄化、寿命增长增加医疗成本。现在医疗是极度低估的行业，我认为整个市场最低估的就是它。为什么低估？坏消息太明确了——集采、医疗整顿、医保控费，大众全知道，估值自然低。\n\n但我坚信这些是暂时的。医保控费可预计：过去三年花费太多、交的少，出现亏空，所以勒紧裤腰带，这是\"堵上亏空就好了\"的事，不是常态，过一段会反过来（控费导致医疗质量下降，和人民性不符）。未来医疗需求非常确定，有些标的十年后一定还在。血液制品产能极端受限（经营人血浆的执照不是有钱就能批），现有产能指标都是钱。\n\n好公司都在市场上，未来能上市的公司越来越少，上市公司是稀缺标的。以前有钱买房就能赚，现在钱生息的地方越来越少，老百姓钱越来越多能投资的地方越来越少，我国未来一定是投资大国——这也是看好资本市场的重要原因。\n\n## 四、周期股估值与困境反转：骨折和癌症要分清\n\n船舶（大连造船厂）我持了很长时间，现已清掉，主因是并购方案让我失望：按方案折算，上海造船厂合并后总股数约75亿股，若市值到三千亿至四千五百亿已偏高估，从当前涨50%就偏高，意义不大。\n\n周期股有巨大好处（周期一定来），但必须刻在脑子里：上升周期一定会结束，别在上升时又憧憬星辰大海说它不是周期行业。 著名央企航运公司，周期已结束，等下一个周期，没有大机会，还留在里面是浪费机会。\n\n关于\"拿不住\"：银行给5%定存利息你能拿一年，因为确定性收益；不确定收益和确定性收益是两回事。\"两鸟在林不如一鸟在手\"——买入经过计算大概率挣20%，就非常厉害；\"可能赚两倍也可能亏50%\"没意义。\n\n北京小卡（福田）我买它是赌困境反转。这公司由山东一堆汽车配件小厂合成、挂靠北汽，王金玉带队从\"时代\"小卡做起，后来有风景面包车、萨普皮卡、欧曼重卡（曾市占率很高后被解放/东风/重汽超越）。王金玉想做乘用车，德国买宝沃品牌做砸，连生产线带品牌卖给神州租车的陆正耀（瑞幸创始人，后因瑞幸造假出事），留下一堆银行担保烂账，公司这些年挣的钱都在填这个窟窿（和央企铝填矿坑同理）。今年看好它，背景是国家以旧换新——商务车比乘用车更受益（补贴高，用车赚钱的人更敏感），小卡（欧马可）市占率极高，用于城市物流配送。\n\n选股底层逻辑：买\"骨折\"的公司，不买\"癌症\"的。 骨折是硬伤，刚开始重但预后没问题；癌症刚开始轻但预后差。我买的标的多多少少遇到过困难但能过来：上海那家电器设备公司（被国网通信诈骗亏几十亿，这些年赚钱填坑）；而有的公司出现利益输送（如隔膜公司大股东把持有的子公司2%股权用极高估值评估给自己收购），这种\"癌症\"直接拉黑，一件这样的事都不能再看。现实生活中坏人很少变好，编剧编的\"撒旦变耶稣\"现实中不存在。\n\n## 五、国产品牌回归：本质是文化自信\n\n上海日化（原葛文耀时代）、葡萄酒公司，买它们的底层假设是：未来国产品牌一定会兴起。为什么大家觉得国外好？因为我们当年不发达，品牌是领先者的附属物——你若想往上靠拢，生活习惯、吃穿用度会向人家学，没自信。提四个自信，其中文化自信就是慢慢回归自己的东西，未来可能别国开始仿我们（如非洲高铁上中式制服，是文化输出）。\n\n最荒谬的衣服就是西装——天热不敞领、系根领带毫无道理，和体型无关；香港律师戴亚麻假发也不代表现代化，那只是文化。当年觉得西装代表现代化、国外电视衣服好，是因为不发达得学人家。现在马面裙、唐服、汉服被认可，中山装也有很多改型。品牌是文化自信的表现，当年没自信才觉得国外的好。包括服装连锁店，底层逻辑都一样：我相信会有一次中国品牌的回归。\n\n这些都不是短期投资，和券商、有色、造船理念完全不同。足球永远不会顶尖（不是我们发明、不符合我们的标准），但技巧类项目（斯诺克、高尔夫）中国未来会很行——符合我们的习惯。按人家定的标准玩就永远不行，以后我们自己定标准。","toc":["一、房地产周期：保房价不是保行业，周期以三十年计","二、有色金属：铜的超级周期在矿端，铝瓶颈在冶炼端","三、医疗：全市场最被低估的长标","四、周期股估值与困境反转：骨折和癌症要分清","五、国产品牌回归：本质是文化自信"],"url":"https://www.bilibili.com/opus/1242157782479667209","bv":"","minutes":0,"chars":3919},"topics":[]}]}</script>
<script>
(function(){
  var LZ = JSON.parse(document.getElementById('LZ_DATA').textContent);
  /* 交给全站统一编辑内核（app/edit_kit.py）：original 直接复用本页已有的 LZ ——
     同一份对象，不额外内联第二份数据（省 0.7MB，也避免两份不同源）。
     list/recField：按直播日期定位场次（**不用数组下标**，数据重排不会错位）。 */
  window.__EDIT__ = {
    module: 'live', name: '直播专区数据',
    src: 'live-直播专区数据.json',
    list: 'days', recField: 'date', original: LZ
  };
  var days = LZ.days, byDate = {};
  days.forEach(function(d){ byDate[d.date] = d; });
  var cur = days.length ? days[0].date : '';
  var ver = 'bili';

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  function dayLabel(d){
    var p = d.split('-');
    return p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日';
  }
  function firstAvail(d){
    if (d.bili) return 'bili';
    if (d.ai) return 'ai';
    return 'bili';
  }

  function fillSelect(){
    var sel = $('day'), groups = {}, order = [];
    days.forEach(function(d){
      var k = d.date.slice(0,7);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(d);
    });
    var out = '';
    order.forEach(function(k){
      var p = k.split('-');
      out += '<optgroup label="' + p[0] + '年' + (+p[1]) + '月">';
      groups[k].forEach(function(d){
        var t = (d.bili && d.bili.title) || (d.ai && d.ai.title) || d.date;
        t = t.replace(/^老木匠[·\s]*/, '').replace(/直播文字稿|直播内容总结/g, '').trim();
        var tag = (d.bili ? '' : '［仅AI版］') + (d.ai ? '' : '［仅原声版］');
        out += '<option value="' + d.date + '">' + esc(dayLabel(d.date) + '　' + t + tag) + '</option>';
      });
      out += '</optgroup>';
    });
    sel.innerHTML = out;
    sel.value = cur;
  }

  /* data-ln = 该块在**源 markdown 里的行号**：编辑内核按行号回写并保留原行的
     `## ` / `1. ` / `- ` 前缀（见 app/edit_kit.py），所以改一个字不会毁掉整段结构。
     行号与落点只在「本页带编辑能力」（__EDIT__ 存在）时才输出，普通浏览不多背属性。
     path 用 `<版本>.text`（不带 days 前缀），rec 用直播日期 —— 内核据此定位到
     days.<该日期的下标>.<版本>.text，数据重排也不会错位。 */
  var curEdit = null;                 /* 当前渲染的可编辑落点 {path, rec} */
  function editAttrs(li){
    if (!window.__EDIT__ || !curEdit) return '';
    return ' data-ln="' + li + '" data-edit="' + curEdit.path + '" data-rec="' + curEdit.rec + '"';
  }
  function mdToHtml(text){
    var A = editAttrs;
    var lines = text.split('\n'), out = [], list = null, buf = [];
    function flushList(){
      if (list) { out.push('<' + list + '>' + buf.join('') + '</' + list + '>'); list = null; buf = []; }
    }
    var sec = -1;
    lines.forEach(function(raw, li){
      var ln = raw.replace(/\s+$/, '');
      if (!ln.trim()) { flushList(); return; }
      if (ln.indexOf('## ') === 0) {
        flushList(); sec++;
        out.push('<h2 id="sec' + sec + '"' + A(li) + '>' + esc(ln.slice(3).trim()) + '</h2>');
        return;
      }
      var m = ln.match(/^(\d+)\.\s+(.*)$/);
      if (m) {
        if (list !== 'ol') { flushList(); list = 'ol'; }
        buf.push('<li' + A(li) + '>' + esc(m[2]) + '</li>'); return;
      }
      var b = ln.match(/^[-*]\s+(.*)$/);
      if (b) {
        if (list !== 'ul') { flushList(); list = 'ul'; }
        buf.push('<li' + A(li) + '>' + esc(b[1]) + '</li>'); return;
      }
      flushList();
      out.push('<p' + A(li) + '>' + esc(ln) + '</p>');
    });
    flushList();
    return out.join('');
  }

  function renderSummary(d){
    var has = { bili: !!d.bili, ai: !!d.ai };
    var v = has[ver] ? ver : firstAvail(d);
    var cur_ = d[v];
    var topics = d.topics || [];
    var parts = [];
    var nTopic = topics.length;
    if (nTopic) parts.push('本场覆盖 <b>' + esc(topics.join('、')) + '</b> 等 ' + nTopic + ' 个话题');
    else parts.push('本场为一场直播的文字整理');
    parts.push('原声文字版 ' + (d.bili ? (d.bili.toc.length + ' 节 / ' + d.bili.chars.toLocaleString() + ' 字') : '未收录'));
    parts.push('AI 整理版 ' + (d.ai ? (d.ai.toc.length + ' 节 / ' + d.ai.chars.toLocaleString() + ' 字') : '未收录'));
    var s = '<div class="sum-h">摘 要</div><p class="sum-p">' + parts.join('；') +
            '。当前展示：<b>' + (v === 'bili' ? '原声文字版' : 'AI 整理版') + '</b>。</p>';
    if (topics.length) {
      s += '<div class="chips">' + topics.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') + '</div>';
    }
    var facts = ['<span>直播日期 <b>' + esc(dayLabel(d.date)) + '</b></span>'];
    if (d.bili && d.bili.minutes) facts.push('<span>时长 <b>约 ' + d.bili.minutes + ' 分钟</b></span>');
    if (d.bili && d.bili.bv) facts.push('<span>录像 <b>' + esc(d.bili.bv) + '</b></span>');
    facts.push('<span>模块 <b>' + (cur_ ? cur_.toc.length : 0) + ' 节</b></span>');
    s += '<div class="facts">' + facts.join('') + '</div>';
    var links = [];
    if (d.bili) links.push('<a href="' + esc(d.bili.url) + '" target="_blank" rel="noopener">B站图文原文 ↗</a>');
    if (d.bili && d.bili.bv) links.push('<a href="https://www.bilibili.com/video/' + esc(d.bili.bv) + '" target="_blank" rel="noopener">直播录像 ↗</a>');
    if (d.ai) links.push('<a href="' + esc(d.ai.url) + '" target="_blank" rel="noopener">雪球原文 ↗</a>');
    if (links.length) s += '<div class="sum-links">' + links.join('') + '</div>';
    $('sum').innerHTML = s;
    return v;
  }

  // ── 本场模块导航：吸顶栏里一行「当前章节」，点它展开完整目录，点条目跳转 ──
  var tocOpen = false;
  var stickEl = document.querySelector('.stick');

  function renderToc(d, v){
    var secs = (d[v] && d[v].toc) || [];
    var box = $('toc');
    if (!secs.length) { box.innerHTML = ''; box.style.display = 'none'; return; }
    box.style.display = '';
    box.innerHTML =
      '<button type="button" class="toc-btn" id="tocBtn" aria-expanded="false">' +
        '<span class="toc-cur">' + esc(secs[0]) + '</span>' +
        '<span class="toc-n">1/' + secs.length + '</span>' +
        '<span class="toc-ar">▼</span>' +
      '</button>' +
      '<div class="toc-panel" id="tocPanel" hidden>' +
        secs.map(function(s, i){
          return '<button type="button" data-i="' + i + '">' + esc(s) + '</button>';
        }).join('') +
      '</div>';
    tocOpen = false;
    syncTocCur();
  }

  function setTocOpen(on){
    var p = $('tocPanel'), b = $('tocBtn');
    if (!p || !b) return;
    tocOpen = !!on;
    if (tocOpen) p.removeAttribute('hidden'); else p.setAttribute('hidden', '');
    b.setAttribute('aria-expanded', tocOpen ? 'true' : 'false');
  }

  // 收起态那一行跟随滚动：显示当前停在哪一节（吸顶栏底边以上的最后一个标题）
  function syncTocCur(){
    var b = $('tocBtn'); if (!b) return;
    var hs = $('doc').querySelectorAll('h2');
    if (!hs.length) return;
    var k = 0, limit = (stickEl ? stickEl.getBoundingClientRect().height : 0) + 10;
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].getBoundingClientRect().top <= limit) k = i; else break;
    }
    var cur = b.querySelector('.toc-cur'), n = b.querySelector('.toc-n');
    if (cur && cur.textContent !== hs[k].textContent) cur.textContent = hs[k].textContent;
    if (n) n.textContent = (k + 1) + '/' + hs.length;
    var items = $('tocPanel') ? $('tocPanel').querySelectorAll('button') : [];
    for (var j = 0; j < items.length; j++) items[j].classList.toggle('on', j === k);
  }

  function render(){
    var d = byDate[cur];
    if (!d) { $('doc').innerHTML = '<p class="empty">没有这一场。</p>'; return; }
    var v = renderSummary(d);
    ver = v;
    renderToc(d, v);
    ['bili','ai'].forEach(function(k){
      var b = document.querySelector('.seg button[data-v="' + k + '"]');
      b.disabled = !d[k];
      b.classList.toggle('on', k === v);
    });
    var body = d[v] && d[v].text;
    curEdit = { path: v + '.text', rec: d.date };      /* 编辑落点：版本 + 直播日期 */
    $('doc').innerHTML = body ? mdToHtml(body) : '<p class="empty">这一场没有该版本的文字稿。</p>';
    window.scrollTo(0, 0);
    syncTocCur();
  }

  $('day').addEventListener('change', function(e){ cur = e.target.value; ver = firstAvail(byDate[cur]); render(); });
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      if (b.disabled) return;
      ver = b.getAttribute('data-v');
      var d = byDate[cur];
      renderSummary(d); ver = ver;
      renderToc(d, ver);
      ['bili','ai'].forEach(function(k){
        var x = document.querySelector('.seg button[data-v="' + k + '"]');
        x.classList.toggle('on', k === ver);
      });
      curEdit = { path: ver + '.text', rec: d.date };
      $('doc').innerHTML = d[ver] ? mdToHtml(d[ver].text) : '<p class="empty">这一场没有该版本的文字稿。</p>';
      window.scrollTo(0, 0);
      syncTocCur();
    });
  });
  // 标题栏那一行：点开/收起目录；目录条目：跳转并收起
  $('toc').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'tocBtn') { setTocOpen(!tocOpen); return; }
    var i = b.getAttribute('data-i'); if (i == null || i < 0) return;
    var el = document.getElementById('sec' + i);
    setTocOpen(false);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  // 点目录之外 / 按 Esc 收起，避免展开面板一直挡着正文
  document.addEventListener('click', function(e){
    if (!tocOpen) return;
    var t = $('toc');
    if (t && t.contains(e.target)) return;
    setTocOpen(false);
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') setTocOpen(false); });
  /* 登记到全站返回栈（app/back_kit.py 的 MPB）：直播目录面板算**一层**。
     顺序 120 —— 浮在正文上、点空白即收，比地图那些整屏浮层轻。
     ⚠ 走 __mpBackReg 入队兜底而不是直接判 window.MPB：本页离线单开时没有注册表，
       直接判会不报错地丢掉这条登记。 */
  (function(){
    function tocBack(){ setTocOpen(false); }
    function tocActive(){ return tocOpen; }
    var f = window.__mpBackReg;
    if (f) { f('liveToc', 120, tocActive, tocBack); return; }
    (window.__mpBackQ = window.__mpBackQ || []).push(['liveToc', 120, tocActive, tocBack]);
  })();

  var top = $('top'), ticking = false;
  window.addEventListener('scroll', function(){
    top.style.display = window.scrollY > 600 ? 'block' : 'none';
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){ ticking = false; syncTocCur(); });
  }, { passive: true });
  top.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });

  fillSelect();
  render();
})();
</script>
</body>
</html>
