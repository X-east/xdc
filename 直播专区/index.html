## 下播（136:00）\n\n沈阳来你就是感受一下夏天那个气候比较好。那今天也特别热，行了我要下播了。谢谢大家，点赞到二十万——你再点一波赞，给我点到二十万了，现在十八点二，你给我点一点，到二十万我就下播了。又白我一上下午继续看戏，这有啥呀，这是瞎掰，我这里没有正经事儿，你们说爱听我就。我主要是没事儿干，我还有好多好的主播呢。好了，再见再见再见，都二十万了，谢谢大家，再见再见再见。","toc":["开场与除权除息（00:00-09:50）","转基因与种子安全（09:50-19:30）","科学素养与投资判断（19:30-35:00）","利好出尽与生态链（35:00-50:00）","美联储与风控（50:00-60:30）","空仓不是风控（60:30-66:00）","主播恩怨与自我定位（66:00-75:00）","牛还在吗与美联储加息（75:00-85:00）","通胀化债与受益行业（85:00-95:30）","财报滞后与\"第几个知道\"（95:30-105:00）","周期轮回与性价比（105:00-117:00）","生育税、阶层与出国无用（117:00-136:00）","下播（136:00）"],"url":"https://www.bilibili.com/opus/1236044510713085987","bv":"","minutes":0,"chars":10253},"ai":{"title":"老木匠·2026年8月13日：怎么判断自己是否合格","text":"## 一、除权除息：它调整的是历史价格，不是未来价格\n\n1. 很多人连这个基础概念都搞反了\n\n他一上来就被「分红是不是拿自己的钱分给自己」这个讨论气着了。他说这些人根本没搞明白除权除息解决的是什么问题：\n\n除权除息它不是规定未来的价格，它是调整以前已经发生的价格。你没发现除权除息的时候，最高价什么的都会跟着变吗？它调整的是历史价格。\n\n他举了个具体的：昨天收盘价5.1元，现在分一毛钱，今天把昨天的收盘价调整成5元。那明天的价格是多少？\n\n明天的价格跟这个一点关系没有。明天的价格不都是重新交易出来的吗？\n\n2. 更根本的一层：净值本身就只是个习惯性的计价方式\n\n他把这个问题往下推了一层，讲了个很值得记住的观点：\n\n真实的计价方式是：我持有某只股票100万股，完了。这100万股究竟值多少钱，取决于你卖的时候的价格。\n\n他说你今天收盘看到的100万净值，是用当天收盘价乘以股数算出来的——「那我问你，明天一开盘，你敢保证这100万还是100万吗？」所以：\n\n价格只有在撮合交易那一瞬间对你有意义。平时的价格变动只对你未来判断买卖时机有意义，除此之外对于你计价手里的资产是没有任何意义的，它只是一种习惯而已。\n\n他还用房子做了同样的类比：你小区现在有个平均价，那是邻居卖房形成的公允价格，「那我问你，你真正卖的时候一定能拿到这个钱吗？说不定还比这个多」。\n\n3. 一个更好懂的比方：卖房子时那笔没收的房租\n\n你有个房子租出去了，有一年的房租后天才付，但今天你把房子卖了。买家知道这笔房租还没给，那你俩是不是可以就这笔房租磋商一下——如果房租给买家，那房价上是不是就得有点折扣？\n\n他说这就是分红的道理，「这是孳息，是历史上产生的孳息」，不存在什么「拿自己的钱分给自己」。\n\n## 二、从转基因说起：什么叫从底层逻辑开始理解\n\n这一段他花了很长时间，但落点始终在思维方式上——「你稍微有一点科学素养，你自己就会得到自己的判断」。\n\n1. 先问机理：吃进去的基因凭什么影响你\n\n你吃什么东西的基因就受什么影响？那你这些年吃猪肉，猪肉里全是猪基因，我也没看你变猪。\n\n他解释：基因就是脱氧核糖核酸，进入人体以后就被消化分解了，「它又不是活体植在你身体里」。基因本身没有毒性，有毒的是基因表达出来的东西（比如蛇的基因产生蛇毒）——「那你通过转基因培育出含毒素的植物，那当然不能吃，但那跟普通有毒植物没什么区别」。\n\n2. 他讲的一个大部分人不知道的点：转基因主要是为了跟农药配对\n\n他说抗虫、抗倒伏、高产这些性状问题只是目的之一，「但这都不是转基因最主要的原因」：\n\n转基因最主要的用途是要和农药配对。相当于在基因上做了个记号，然后生产一种农药——这种农药什么都能杀，就杀不死这个植物。所以农药一撒下去其他东西全死，只有这个植物不死。\n\n他说这会带来两个后果。第一是**生态链被改变**：「原来依赖杂草生存的小虫这一套食物链就没了，没有虫子就没有青蛙」——所以有人说转基因的地里连老鼠虫子都没有了，那是农药破坏了生态，不是这个食物本身能把青蛙毒死。\n\n第二是**种子安全**：\n\n农药在这个地里是有残余的。你明年不买这个种子，你种什么它都不长。农药在地里残留十年，你这十年什么都不长，只能种那一种东西——所以为什么我们国家反复强调种子安全？光有地不一定就能长东西。\n\n他还顺带纠正了一个直觉：非转基因反而需要撒更多农药，「因为你那地里什么杂草都会长起来，你要杀这种草、杀那种草」。他自己买豆油专挑转基因的，因为便宜——「非转基因豆油对我来说就是智商税」。\n\n3. 同类的例子：压榨油 vs 化学浸出，酿造酒 vs 勾兑酒\n\n他说大家都觉得「古法的、天然的」就一定好，其实不见得。化学浸出的油出油率更高、更纯，而且过程中不会被细菌感染；压榨出来的东西反而不纯，杂质也会被一起压出来。\n\n酒更典型：\n\n对于便宜的酒，勾兑的更安全。因为勾兑用的是食用酒精，工厂化生产提纯得非常纯，里面没有杂醇。而土法酿造过程中既有乙醇也有甲醇，甲醇是有毒的——为什么小烧酒作坊做出来的酒容易上头？就是因为杂醇多。\n\n他说酿造和勾兑真正的区别在香味物质（酯类和芳香烃决定口味），而这些现在用化学方式一样能做出来、分不出来。他还补了个冷知识：黄酒本身是不黄的，那个黄是加的焦糖色，「跟红烧肉做法是一样的」；黄酒杂醇多是因为它不是蒸馏酒——「蒸馏其实就是提纯的过程」。\n\n4. 落点：别一听风就是雨\n\n我主要是给大家讲一件事：你别什么事一听风就是雨，一说这事儿就来了、就是别人都想害你。你稍微有一点点科学素养，你自己就会得到自己的判断。\n\n## 三、真相要靠自己思考，没有人会告诉你真相\n\n1. 他自己举的例子：彼得·林奇为什么13年就退休了\n\n他讲了个自己推理的例子，用来说明什么叫「自己去想」：当年富达基金的总裁想把位置传给儿子，而彼得·林奇在公司里的威信太高。\n\n所以我觉得是因为这个原因，彼得·林奇才不得已辞职走的。而且我认为他一定得到了一大笔钱，因为他后来就没再工作了。当然他对外不能说这话，对外一定说我觉得工作太累了不做了。\n\n他说林奇自己从来没说过这些事，是他从书里那些和总裁儿子聊天的情境描写中感觉出来的。\n\n2. 芒格那句话，他又强调了一遍，而且推进了一层\n\n你所看到的都是假象，而且你所看到的都是很多人想让你看到的。真相需要你自己去思考——动用你的理性，动用你的抽象思维能力，透过现象看本质。真相藏在你看到的东西的背后；如果你一看到就认为是真相，那就永远没有真相。\n\n他还讲了更让人警醒的一层：\n\n有的时候你突发奇想的想法，你以为是独立思考来的，其实都是别人在你心里种的种子发芽了。就跟《盗梦空间》一样，说不定昨天晚上有人在你梦里植入了一个念头，你早上突然就觉得科技股好了。\n\n## 四、一个非常具体的自测标准：你是不是合格的投资者\n\n1. 他给的判断方法（新手不算）\n\n这是这场最实用的一段。他说如果你投资已经超过五年了，可以用这个标准自测：\n\n如果你这五年头四年都没赚钱，但今年突然赚了很多——我告诉你，你的新手期还没过，你不合格。如果你投资十年了还是这种结果，那你更完了，我劝你干脆卖了就别来了。\n\n反过来：\n\n如果你过去五年是赚钱的，今年没怎么赚，当然也没有亏——我认为你就是一个合格的投资者。\n\n2. 为什么今年赚太多反而是问题\n\n你今年赚太多，说明你没有进行风险补偿、没有风险意识，说明你赌性太强。不能说你今年赚了钱你就厉害了——你买彩票中奖也可能赚钱，那能说明你厉害啥？\n\n3. 还有一条：最近一年从不被套，也是危险信号\n\n有人说自己最近一年基本不被套，他的回应是：\n\n说明你这个人投资不合格，你没有进行风险补偿，你买的标的现在都是风险非常大的。你最近一年如果一直没被套的话，我认为你离被清除出这个市场已经很近了。\n\n他说自己买的东西经常被套：「去年我在有色金属里套着，前年我在券商里套着，嘲笑我的人多了去了。我也想买在最底部，但我没这个能力。」\n\n4. 给新手的话：先别总结经验\n\n假如你今年进来半年就挣了100%，我只劝你一件事：等活过五年以后你再总结经验。你现在先别总结说「我就看准了科技」或者「我把某个浪整明白了」——千千万万别总结。\n\n他说新手最要命的一件事就是：\n\n我进来半年就挣100%，这赚钱也太容易了，我这就是天选之子，那我回家把房子卖了继续干——我觉得你离开市场已经很近了。\n\n他建议：把本金拿出去，留一部分在里面，看看五年能不能亏光。\n\n## 五、防风险、不亏钱，赚钱是副产品\n\n1. 顺序不能颠倒\n\n市场上真正需要你每天练到的是防风险、是不亏损，赚钱是在这两个基础上的副产品。你首先第一件事进来就是防风险、不亏损；至于什么时候能赚钱，那不是你能定得了的。\n\n他又引了那句孙子兵法：\n\n不可胜在己，可胜在敌。你不亏钱这件事你自己能定，剩下的你都定不了。你就是武功天下第一，也不敢保证一定能打过别人——那得等别人犯错误。\n\n2. 「防风险就是空仓」，这是理解错了\n\n他这次说得比之前更直接：\n\n你空仓就离开市场了，那叫什么防风险？你不是属于不玩了吗？我说的是你上场的时候要注意风险、你在参加比赛的时候要注意风险。你待在替补席上坐着，你还防个屁风险。\n\n他还补充了一个实际的理由：\n\n你空仓几天，你对市场就没感觉了，很快就无感了。\n\n3. 顺带：模拟盘为什么没用\n\n他看到有主播建议新人先做模拟盘，很不认同：\n\n你玩CS和真打仗能一样吗？你认真玩CS它也不是打仗，因为你心里知道你死不了。模拟盘你就敢冒险，真钱你就不敢冒——模拟盘赔没了哈哈一笑，真钱亏没了可没人给你还回来。\n\n他讲了个真事：同事家小孩打电脑CS特别厉害，绝招是一出来就不停跳，别人瞄不上他。\n\n后来我们去公园打真人CS，他出来也一直跳。你跳两下，舌头都得吐出来了，你能跳得动吗？——所以你在模拟盘里认为是绝招的东西，在现实当中根本没用。\n\n他还是用那个走钢丝的比方收尾：50米高和5厘米高走同一根钢丝，理论上没区别，「但你唯一忽略了一点——人的主观性是带入到这个市场里头的」。\n\n## 六、你是第几个知道这件事的\n\n1. 这是他反复强调的一个自问\n\n无论你知道啥，包括财务报表，你都要问自己：你是第几个知道这件事的？\n\n他举了报表的例子：\n\n哪个公司的报表超预期能保密？你告诉我一声。那会计知道不？会计他三舅知道不？三舅的亲家最后知道不？\n\n2. 所以「利好出尽是利空」的底层逻辑是什么\n\n因为这个消息没出来的时候，已经有很多人知道了，真不是今天才知道的，两年前人就知道。人家两块钱买完了，然后一顿拉干到20块，然后告诉你这东西未来不可替代——你也跟着背「未来不可替代」，然后你冲进去了，20块全卖给你。\n\n3. 一个很锋利的追问\n\n他对那些拿基本面说事的人有个反问：\n\n你要认为这东西还会继续增长，那你为啥不原来就认为它继续增长呢？为啥等到好消息出来的时候，你才判断它会继续增长？\n\n那个东西股价五块钱的时候，你咋不知道它供不应求？等到25了，你现在开始天天念叨供不应求了。\n\n他还回忆说，当年他讲铜会供不应求的时候，「多少人跟我讲铜这玩意儿可回收，所以不存在供需缺口」；现在反倒是别人来给他讲供不应求了。\n\n4. 看中报，要看的不是利润增长了多少\n\n他提醒即将到来的中报该看什么：\n\n那些著名公司的股东人数是否还在继续增加，这是需要你看的。你不是看它今年利润又增长多少——人家两年前都预计到今天的增长了。现在卖出的人考虑的是：未来一年它是否还像现在这么增长。\n\n如果未来一年还这样增长，那时候进来的傻子会更多，我卖给他们；但如果未来一年已经不增长了，那接盘的是不是会越来越少？那你还卖给谁？那不得趁热乎的时候现在就卖吗？\n\n## 七、加息这件事：你该问的不是「会不会」，而是「有没有可能」\n\n1. 预测加不加息没有意义，判断可能性才有意义\n\n美联储加息这件事，对你判断未来行情只有一件事有意义——就是它有没有加息的可能。如果有加息的可能，这件事你如何应对，这才是对你有意义的。\n\n他做了个前后对照：去年这个时候你可以非常肯定地说没有加息可能，所以那时候有色处在低位、业绩又好，你可以做出明确判断。\n\n那你今年还敢吗？现在华尔街的交易员押注加息和降息的比例基本上接近50%。人家都分析不出来，你是根据啥分析的呢？\n\n2. 散户判断的依据，全称叫「感觉」\n\n你无非就是蒙，给自己壮胆儿——我持有的是受利息影响的标的，那我就希望它不加息，所以给自己壮胆说它肯定不能加息。散户得出这种依据的全称叫做感觉。\n\n3. 慎言，因为说着说着你自己就信了\n\n这是他讲的一个很有意思的心理机制：\n\n你不要随便说那种没有依据的判断，那种不严谨的话尽量少说——因为说来说去你自己就信了。你说十回美联储不能降息，这事儿就刻在你骨子里了，你就认为它真的不会降。那我问你，一旦降了你怎么办？一旦加息你怎么办？你做好准备没有？\n\n他自己的态度是：「我也判断不了，但是你要对所有的东西都做好准备。」他还提醒了一个事实：欧洲央行已经加息了、澳大利亚加息了、日本也加息了，「怎么美联储就不能加息呢？」\n\n4. 顺带纠正一个流传很广的说法\n\n你别动不动就说美国不能加息、加息国债受不了，那都是以讹传讹。美国已经发出去的国债都是按票息付息的，跟加不加息一点关系没有。加息只影响当期新发的国债——财政部发国债是一级市场，跟二级市场没有关系。\n\n## 八、通胀化债：那笔被减免的债务，总得有人出\n\n1. 先看清楚这件事的实质\n\n他说通胀可以化债这件事本身没错，「这不很简单，都不用去分析了」。他用自己的经历讲了机理：\n\n我年轻时买房子贷款贷几十万，那时候工资只有八百一千块，一个月还几百块钱就觉得挺多了。后来通胀就相当于把你这个债务全给你减免了——东西贵了，你工资也高了，但债务不会增加。\n\n2. 关键的追问：这笔钱是谁出的\n\n你的债务被减免了，你相当于得到一笔钱——那这个钱谁出的？它一定得有人出。\n\n他给的答案是：银行贷出去的贷款购买力降低了，而银行的钱是老百姓的存款，「所以是由存款这些人来承担的」。他还指出银行本身是通胀的受益者：「银行计价完全不计购买力。通胀多了意味着钱多，钱多了存贷款基数就多，利差的基数多了，利差就多了。」\n\n3. 更值得警惕的一层：过程中会不会有抖动\n\n这是他引申出来的问题：\n\n如果一直平稳地通胀下去，相当于所有人平摊这个成本。但问题在于——你和真正的大资本，在政治上的地位是平等的吗？会不会在中间产生什么抖动，让你先承担得多一些？这些问题你去思考。\n\n4. 推论：重资产行业也是通胀的受益者\n\n这是个很实用的推论：\n\n重资产行业——资产负债率很高、有大量银行贷款、同时有大量固定资产的——这些固定资产在通胀过程中都会增值，但是在资产负债表里看不出来，因为它不会总去重估。这就叫隐含资产。\n\n他举了核电的例子：「以前建一个核岛用100亿，未来建一个核岛要500亿了，那你原来那个是不是得按500亿计价？但它还是按100亿计价的。」而且通胀的时候电价也会增高。\n\n## 九、他自己的取舍：任何标的都只是一个「罐子」\n\n1. 他怎么看待自己换仓\n\n有人质疑他「原来不是看好某个东西吗，怎么又卖了」，他的回应很干脆：\n\n任何一个东西它都是你的一个道具而已。哪个东西更有性价比，你就换到哪个上。你来这个市场是来赚钱的，不是来当持股模范的。\n\n每一只股票无非相当于一个罐子，哪个罐子的性价比高，你就把钱扔在哪个罐子里头，就这么回事。\n\n他还举了个具体的思路：如果现在持有医药，而原来卖掉的东西跌回了很低的位置，那就可以把医药卖了再换回去。\n\n2. 他不碰科技和创新药的真实原因\n\n他澄清了一个被反复误解的事：\n\n有人说我从去年就看空科技，那不胡扯吗？我去年从来都是告诉大家：科技这东西我看不了。因为我不知道它们之间的因果关系，我没有那个研究能力，所以对我来说确定性不足、不符合我的投资标准，仅此而已。\n\n他说创新药也是一样——「对我来说确定性不足，但如果大家去赌一把，那是你们自己的事」。他也明确说了自己看好的大方向是医药、必选消费、公用事业这类，「但别提个股」，而且强调医药是慢功夫，「你不能指望一进去它就该涨多少」。\n\n3. 周期股不能看静态估值\n\n周期股看静态估值是没有任何意义的。2020、2021年的时候，远洋运输集运的市盈率跌到什么程度了？它该不涨一样不涨。你看到的只是静态的，人家大资金早看到的是动态的——等你看到的时候，都已经是滞后的东西了。\n\n## 十、历史一遍遍重复，连标点符号都没改\n\n1. 券商那一轮，他完整讲了一遍\n\n他回忆2023年底自己说某上海券商是好时机时被骂得很惨（当时正好出了造假争议），而到了2024年10月8号之后所有人一致看好券商，「多少人来问我券商，我说我现在不看好了，因为性价比不高」。\n\n那时候券商直播间里的主播自己都说券商是个渣，都不看好——又是降工资、又是裁员、又是「券商屠夫」，说以后券商就没戏了、同质化严重、严格监管、好日子已经结束了。说完这话没过几个月……\n\n他说自己2024年10月28号就已经没有券商了，「从那天以后我就不关注它，那时候正好是券商最受关注的时候」。\n\n2. 然后是有色，剧本一模一样\n\n你回首这些事的时候，就觉得特别有意思，世界就是这样一次一次的轮回。连标点符号都没改过——也别说改词了，连标点符号都没改过。一遍一遍地重复。\n\n他说自己今年1、2月份就把有色清掉了，「现在也没有了，也不看了」。他还提到那些人前几天科技被抛售时呼天喊地，「这两天有色涨两天又跑到我这来踢场子，一脸嘲笑地问我还看不看空」。\n\n3. 「别人恐惧我贪婪」的又一次纠正\n\n看到某有色公司高位下来后有人喊「别人恐惧我贪婪」，他的反应是：\n\n你看现在哪个像恐惧的样子？十分钟能发20个帖子，还恐惧？你们是因为都贪婪。什么别人恐惧我贪婪——你他妈就是别人。\n\n## 十一、一个很妙的回答：牛还在吗\n\n有人问他「牛还在吗」，他的回答值得单独记一笔：\n\n你只要还在，牛就还在。牛不在了的最大标志是你先不在了——你问我这句话，就说明牛还在。\n\n最后没人问了，我这直播间里都没有人了，那就彻底完了。\n\n## 十二、几个题外的观点\n\n这些不是市场话题，但他讲得比较系统，也能看出他一贯的思维方式，一并录在这里。\n\n1. 关于生育政策\n\n他认为奖励生育和对无子女征税在本质上是同一件事：「大家一起收的，你生了税收返还，没生那不就相当于收了吗？税收本身就具有调节二次分配的功能。」他还预判审美会变：\n\n你别以为怎么的，我们这个宣传机器是非常厉害的。你现在觉得单身时髦，过两天你觉得单身你出不了门。\n\n2. 关于阶层\n\n你改变不了你的祖先，也改变不了你的父辈，你只能改变你自己，而不是去埋怨社会不公平。难道你希望你努力完了以后跟没努力的人是一样的？\n\n他还提到一个对比：「解决上下层流动最好的就是我们中华文化，没有长期固化的门阀——欧洲的贵族可以几百年，中国哪有？科举制就是解决上下层流动的最好办法。」\n\n3. 关于「你去过吗」\n\n他最反感那种用「你去过吗」来堵人嘴的说法：\n\n去过和没去过没有什么区别，你去过也不见得就更了解。你去趟美国旅游能调查啥？你在中国生活这么长时间了，你了解中国吗？\n\n了解一个东西需要靠阅读，你得知道它的历史来龙去脉。我刚才说的你又忘了——你所看到的都是假象，真相是需要用思考来得到的。感性是代替不了理性的。\n\n他举了个很实在的例子：看风景，你在现场其实没有在纪录片里看得清楚——「人家用无人机给你拍，又给你讲这个地貌是怎么形成的；你到现场走马观花转一圈，看着别人的后脑勺，你能看明白啥？」他补充说不是否定去现场，「兵马俑那气势压人，不到现场看不出来」，只是「你别迷信这件事」。","toc":["一、除权除息：它调整的是历史价格，不是未来价格","二、从转基因说起：什么叫从底层逻辑开始理解","三、真相要靠自己思考，没有人会告诉你真相","四、一个非常具体的自测标准：你是不是合格的投资者","五、防风险、不亏钱，赚钱是副产品","六、你是第几个知道这件事的","七、加息这件事：你该问的不是「会不会」，而是「有没有可能」","八、通胀化债：那笔被减免的债务，总得有人出","九、他自己的取舍：任何标的都只是一个「罐子」","十、历史一遍遍重复，连标点符号都没改","十一、一个很妙的回答：牛还在吗","十二、几个题外的观点"],"url":"https://xueqiu.com/2573414707/405870213","chars":7702},"topics":["怎么判断自己是否合格"]},{"date":"2026-08-10","bili":{"title":"老木匠直播 20260810（录屏回放）","text":"## @买股票的老木匠​\n\n01:59:30\n1611观看\n2弹幕\n老木匠 2026 年 8 月 10 日直播 (带文字稿)\n\n## 开场与直播方式 (00:38-02:13)\n\n中午开播，进来先打招呼、求个赞，顺带把话挑明：没系统讲稿也没课程，想到哪儿讲到哪儿，主要就是聊天。昨儿扫了眼创业板两融数据，发现好几个当红标的两融还在继续往下掉。\n\n## 创业板回调与杠杆正反馈 (02:13-09:13)\n\n今天上午创业板回调得挺狠。杠杆这事儿得说清楚：融资的人一少、越往外跑就越降杠杆，抛压越大跌得越多；跌多了有人杠杆率不够监管要求就被迫卖，这就成了循环。下跌斜率太陡、速度太快时，得有外力把正反馈打断，否则容易出大篓子。最好慢慢往下磨，不丧失流动性、也没人强平；可现在主动降杠杆的人多，抛压还在。\n\n人都是不逼到墙角不作选择。杠杆率随价格往下走越来越高，接近平仓线了自己就主动卖了，所以这趋势要扭过来不容易，得看外力干预，光靠市场自己很难变。\n\n拿麦克风啸叫打比方最直观：收的音经喇叭放出又被麦克风收进去放大，相位正好互相加强就尖叫，改个延迟就能打破。卡拉OK现在一般自动就避了。\n\n操作上就给大伙一个词——\"不急\"。现在别着急，等着就完了。拿稳健标的的主要任务是防风险，保证波动时别被动出局。是不是泥沙俱下判断不了，可一旦出流动性危机一定泥沙俱下，所以得防。自己把融资清了，防的就是这回事。\n\n全球市场也悬。全世界现在都挺悬，反倒A股风险相对是结构性的，美国是全局性的，真出事道指也跑不掉。A股不是不危险，是多亏去年十月那\"神秘队\"不停压着价格，韧性比别的市场强。真来一把像韩国那样的，谁都扛不住，那不又成2015年了。\n\n## 普通人别替庙堂操心 (11:17-13:59)\n\n有人老爱替庙堂出主意。那些985、211、双一流的人成群成堆的，上学时你都没考过人家，聚一块儿还能看到你看不到的信息，能比你笨吗？别一天到晚替上头操心。顺带说一天三个水煮蛋不算多，自己以前都吃四个，到这岁数吸收蛋白能力弱了，吃进去大部分吸收不了。\n\n## 鸡蛋与营养辟谣 (13:59-17:30)\n\n\"蛋黄升高胆固醇\"早被辟过了，没有任何医学证据。人的血脂里甘油三酯大部分是人体自己代谢出来的，吃很多碳水才会导致血脂升。到这岁数一天三个鸡蛋正常，年轻吃俩就成。鸡蛋是\"食物之王\"，营养最全，蛋黄里除了脂肪胆固醇还有一堆不可替代的营养。\n\n欧洲干酪（帕玛森那类）也爱吃，也是咸的得少吃。碳水可以完全不吃，它是六大营养素里唯一人体能完全不摄入的，就提供能量。\n\n\"柴鸡蛋\"\"土鸡蛋\"都是鸡下的，营养没区别，所谓土鸡蛋好多是多加了饲料。生鸡蛋刚下完能生吃，放久了细菌滋生就不能了。\n\n## 先定义概念再下判断 (17:30-26:44)\n\n有个哲学问题一直想说。拿\"喝粥养胃\"举例：得先定义啥叫养胃、指标是啥，才能说某种食品养胃。其实粥可以理解成糖水——糊化淀粉几乎不用胃蠕动，直接进小肠吸收、升血糖，跟喝糖水没两样。\n\n\"吃核桃补脑\"也一样：得先定义啥叫补脑、啥表现、拿啥衡量，下判断前先定义前后概念，本质是大集合小集合的三段论。\n\n\"去湿气\"也是：公园老头老太太说喝姜水去湿气，得告诉我啥叫湿气、有啥表现，得在逻辑和哲学上把我说服。老头老太太领鸡蛋、信誓旦旦传这些经验，一般不反驳，图一乐无所谓，但思维训练在这一点上不过关——说话前没细想判断依据从哪来。\n\n\"黑芝麻糊黑头发\"更经不起推敲：如果因为黑就变黑，那喝墨水、吃煤块行不行？道理其实简单——股票少赔钱头发就黑，老赔钱白得快。彼得林奇年轻就是白发，跟吃不吃黑芝麻没关系。生活里不抬杠，老太太说核桃补脑，就顺着说\"对对对回去买点\"，她高兴就完了，跟九十多一百岁的老人抬杠没意思。\n\n## 边看盘边\"算卦\" (26:44-31:29)\n\n一边直播一边看盘，开玩笑给老太太算卦\"一百二那年有个坎\"，老太太乐了。自己说算的是一百五才有坎，之前一马平川、股票天天涨。调侃那些\"战斗脸\"的人——不管说啥都觉得别人要害他、要骗他钱，活得累。念了一下午\"麻哩麻哩红\"（中签）的经。\n\n## 技术派批判 (31:29-35:01)\n\n技术派看的各种浪、各种线（利弗摩尔、江恩、查尔斯·道那套）都是安慰自己。逻辑上所有技术指标都是过去量价关系的函数，拿过去判断未来没用——今天数完八个浪眼睛数花了，明天特朗普一句话打仗全没用。八个人能数出八种浪。跌到五日均线以下第二天走势还是随机，概率百分之五十，和均线没因果关系。\n\n投资书都看了，唯一看不下去的就是技术分析。早年看了很多，最后结论是所有技术分析都狗屁不通，拿主力进出当真事的都不用看，基础逻辑有问题。\n\n## 牛肉与三文鱼网购 (35:07-37:07)\n\n生活上也聊几句。牛肉一般网上买，和牛、安格斯、澳洲、南美都有，辽宁也卖和牛。国外和牛质量好但周转长（船运航运周期长，不可能空运）。三文鱼也网上买，找对卖家基本没问题，平台靠不靠谱取决于商家而非平台。山姆进口周转也长。\n\n## 尿酸、果糖与人工甜味剂 (37:07-41:46)\n\n尿酸增高主因是含糖饮料喝太多——里头加的玉米糖浆果糖特别多，果糖代谢过程产生大量尿酸，好多小孩痛风是因为可乐喝太多。果糖分子式决定了代谢必产尿酸，不是葡萄糖。大部分尿酸是人体自己代谢产生的（约80%），高嘌呤饮食地区（比如海边吃海鲜多的）普遍高。水果里果糖其实不多，主要是葡萄糖，真正多的是添加糖浆这种人造东西。果糖甜度高，加一点就很甜。\n\n人工甜味剂（三氯蔗糖、阿斯巴甜）都是化学添加剂，不在天然代谢通道里，出现时间短，五六十年后有没有问题不好说——小时候的糖精现在不让用了。便秘可补可溶性膳食纤维、吃点橘粉，尽量别吃人工甜味剂食品。也喝零度无糖可乐，但现在喝得少了。胃不好喝茶得少喝。\n\n## 历史叙事与西方伪史论 (41:46-61:53)\n\n两条热新闻值得说：上海\"撅屁股\"女采访、留美博士采访诺兰讲《奥德赛》。西方人演的历史是现代人改造过的——诺兰拍《奥德赛》硬把\"赎罪\"理念（基督教理念）塞进去，可古希腊神话里宙斯花心、诸神混乱，根本没赎罪这理念。你看到的是按现代人视角讲出来的古代史，不是真古代史。\n\n犹太人这块也得掰扯清楚：从血缘、文化上说，既没有犹太人也没有犹太文明，今天以色列是美国在中东插的钉子、硬造出来的国家。古罗马凯撒时代犹太人就被遣散离开耶路撒冷，留在那的血缘犹太人就是今天的耶路撒冷人，跑世界各地的血缘早稀释了，二战后复国连黑人都算进去了，哪来的犹太人？没有犹太人、没有犹太文明，只有犹太教——犹太是宗教不是人种不是文明。今天以色列的政治文化完全是西方的。犹太复国当年选过澳洲、中国东北，最终定中东是因为美国支持、那产石油。历史上屠杀犹太人最多的是沙俄不是苏联。\n\n抖音小众主播\"爱聊爱玩的老王\"（原头条，后改\"老王特爱聊\"）讲犹太人讲得好，强烈推荐——小众主播才有真东西，大主播都是玩流量、你说啥他顺着你说。\n\n海归这事儿也得客观：不出国只国内受教育有狭隘性，很早出国只受国外教育也有狭隘性，客观中立的办法是\"读万卷书不如行万里路\"——国内国外都接受、互相理解。\n\n西方伪史论这个坑得绕开。既反感\"西方伪史论\"也反感\"西方什么都好\"。各个文明都有灿烂处，中国是自古至今唯一延续下来的文明。说我们不行，那你们那么行最后都没了；说我们什么都行也不对，科学确实不行，这是事实。非此即彼都是思维能力欠缺、人云亦云。西方伪史论站不住脚——一个民族历史能被系统性造假，那造假过程谁领导的？参与的人多必然泄露，你连政府里间谍都防不住，怎么可能全国统一给古希腊造假还没人泄密？古埃及比我们古老得多，拉美西斯二世打仗用的弓箭战车是公元前两千年的。法门寺出土的瓷器法器跟昨天做的一样新，西方人也可以说我们的是假的。伪史论反驳者都没论据，就说\"这东西太新了像昨天做的\"——新的为什么就是假的？所以思考能力在哪都有用，投资、考古都一样。\n\n## 哲学缺环：实证主义 (61:53-70:41)\n\n再往深了说个哲学问题：现在哲学缺一环。主流是唯物主义，可引领现代科学和思维的不是唯物也不是唯心，而是实证主义——爱因斯坦相对论开始统领西方科学的就是实证主义。\n\n\"形而上学\"被误解太久了。中国古语\"形而上者谓之道，形而下者谓之器\"，形上边虚无缥缈的是道（理论），形下边有形的是器物（物理化学这类实验科学）。真正的形而上学指形之上的理论。实证主义认为唯物和唯心都既不可证实也不可证伪，争论没胜负，所以抛弃\"背后本体是唯物的还是唯心的\"这问题，只问\"你有什么证据\"——相对论就建立在这基础上。\n\n拿宇宙举例：看到一颗十亿光年远的星，看到的是它十亿年前的样子；现在问这颗星什么样，在爱因斯坦理论里它处在\"光锥之外\"，是不可感知的，讨论没意义。\n\n## \"以事实为根据\"的司法真相 (70:41-81:21)\n\n\"以事实为根据，以法律为准绳\"这句得拆开看。以法律为准绳简单——规则定好了看是否符合。但以什么事实为根据？诉讼中双方描述的事实完全不一样，第三方强制力量没有上帝视角，根本不知道当时客观事实是啥。\n\n拿唯物主义追求\"客观事实\"的话这事儿没解。法庭实际是以\"证据证明的事实\"为依据，而证据证明的事实不一定就是客观事实——有人有理但证据不足，有人没理但证据充分。如果强调以客观事实为依据，案子干脆判不了，必须以证据证明的事实为依据。错案就是这么来的。\n\n二审更说明问题：一审根据证据认一个事实，二审根据证据认另一个事实把一审推翻。从逻辑上没法说二审比一审更客观，否则直接让二审审就行了，何必一审？所以根本不知道啥叫客观事实，有些案子一审对、二审改错，但生效判决是二审。这是制度问题，不是谁更客观。\n\n历史上因此有\"神明裁判\"——决斗就是神明裁判的一种，谁赢谁对因为上帝保佑他；商代占卜也是一种。投资时也得想，你得出的结论有没有证据，不能光靠信仰说\"科技要发展所以买科技股\"，理论依据和事实依据是啥得想清楚。想不一定得结论，不想一定错。投资不是背口诀，\"京沪永远涨\"不一定涨；一旦出现朗朗上口的口诀就完了。彼得林奇说过，当心\"下一只茅台\"这种说法——一旦有人说某只股票是下一只茅台，不但这只不行，原来那只也要不行。\n\n## 人本主义与中国文化 (82:18-86:51)\n\n回到哲学体系上：中国历史上的哲学是人本主义的，重点放在人本身而非人和客体的关系，不讲认识世界讲人本身，修为、伦理是强项，文化灿烂在这点上。有些舶来东西放我们这不适合是因为文化不匹配。\n\n物业管理就是个例子：这东西是舶来品，在中国极度水土不服。它本质是业主自治，可我们发现最终业委会自主决定都是虚的，大家更习惯被第三方力量管（小时候扫楼道归居委会，是行政管理）。\n\n## 物业费与成员权 (86:51-93:12)\n\n物业费这事儿得拎清楚：有人天天说物业不好所以不交，其实不交占的便宜是那些交了钱的人的——物业不可能贴钱运营，你不交它才不扫楼道。无论哪个小区一分没欠过，老破小那个小区物业费极少，收的人都不好意思敲门，没想到真有个交的，还以为缺心眼。\n\n呼吁\"从我做起\"：不管对物业多大意见先交了，你越不交服务越不行，最后房子贬值损失的是自己。这里头法律上的点是\"成员权\"——作为组织成员的权利我们不会行使，只习惯被别人管，让自己做主时就不会了。对未来不悲观，适应期刚来需要适应。\n\n## 捡纸盒与\"给别人留口饭\" (93:12-99:48)\n\n老头老太太捡纸盒这现象有意思：有的退休金不少也爱翻垃圾箱捡，家里堆得没法待人，可能是一种消遣。楼下老太太天天捡、推车东推西推，身体特别好，看来剪纸盒也能长寿。\n\n\"给别人留口饭吃\"非常关键，任何领域都一样。有退休工资就别去捡垃圾；各种补贴不缺钱就别领，虽不违法但一贯这观点。古语\"伐冰之家不畜牛羊\"——你已经有钱了就别和下层争利，可现在这传统丧失了，开奔驰领失业金的大有人在。巴菲特把钱留孩子也行、捐也行，是个人事。\n\n这代人出不了马斯克这样的企业家，根子在穷过——挣了钱还想挣更多。淘宝赚那么多还想挣买菜钱（社区团购）、挣外卖钱。微信做小店，钱都不让别人挣。都那么有钱了还去造车，除了挣钱啥也不想。自己要有那钱就搞科学研究或做木匠活打发时间。\n\n## 木匠与文玩核桃的周期 (99:48-106:06)\n\n木匠活自己也在玩：业余玩玩，工具买不少没怎么做，做了三四年没做出啥，现在玩不动了。手串、车床件都能做，打个小板凳还行，大床整不了。木匠是\"百工之首\"——古代没金属时结构件都用木头，建筑家具门窗都靠木头；今天百工之首应该是金工。\n\n文玩核桃当年特贵，现在十块钱。核桃是典型农产品周期——最早麻核桃皮厚没瓤没人要、烧火，后来有人玩文玩核桃，树被砍光变少就炒高；贵了大家嫁接，三四年后果烂大街。和猪周期一样，猪肉贵时猛养，出栏时烂大街。好核桃（四座楼、南疆石、白狮子）当年上万一对，现在十块。猪周期就是典型周期股。\n\n## 打新、稀缺性与收尾 (106:06-119:08)\n\n新股申购早上起来就申，\"念完天灵灵地灵灵\"，调侃太上老君显灵让语数科技翻一百倍。北交所打新从没参与过，不敢参与，怕破发。\n\n收尾前说稀缺性：股票太多要想什么是稀缺的。买房子最早盯院里有没有树、绿化水系假山，后来发现这些容易做，要找真正稀缺的——不可能再新上市的公司。A股资金还在找容易操纵的，港股资金找真正稀缺资源；A股拉两个涨停就全去追不看猫腻，港股是成熟市场表现——你涨一百倍卖不出去全在手里，没人上当。\n\n下播前还有五分钟凑够两小时，呼吁点赞冲十五万（当时十三点六万）。说创业板还是跌的，波动正常、是博弈结果，刚开始不认输想抢反弹的人多，一旦下跌要扭转得大量成交量。最后谢谢大家、说明天不来了要歇一周，玩笑说\"今天点赞的都能中语数科技\"。投资市场就那几句话——低买高卖，剩下没了。","toc":["@买股票的老木匠​","开场与直播方式 (00:38-02:13)","创业板回调与杠杆正反馈 (02:13-09:13)","普通人别替庙堂操心 (11:17-13:59)","鸡蛋与营养辟谣 (13:59-17:30)","先定义概念再下判断 (17:30-26:44)","边看盘边\"算卦\" (26:44-31:29)","技术派批判 (31:29-35:01)","牛肉与三文鱼网购 (35:07-37:07)","尿酸、果糖与人工甜味剂 (37:07-41:46)","历史叙事与西方伪史论 (41:46-61:53)","哲学缺环：实证主义 (61:53-70:41)","\"以事实为根据\"的司法真相 (70:41-81:21)","人本主义与中国文化 (82:18-86:51)","物业费与成员权 (86:51-93:12)","捡纸盒与\"给别人留口饭\" (93:12-99:48)","木匠与文玩核桃的周期 (99:48-106:06)","打新、稀缺性与收尾 (106:06-119:08)"],"url":"https://www.bilibili.com/opus/1234844694421176338","bv":"","minutes":0,"chars":5698},"ai":{"title":"老木匠·2026年8月10日：降杠杆的正反馈与凡事要证据","text":"## 一、降杠杆的正反馈：这轮下跌是怎么自我加强的\n\n1. 先看得见的数据：融资余额还在继续下降\n\n他说自己头一天看了创业板的两融数据，很多当红标的的融资还在继续下降。他还教了具体怎么看：\n\n你用东方财富，点开一个标的以后，它名字下面有几个小字——代码后边是什么创业板、融、深股通、L2这几个字，你把它点开就能看到它的融资融券数据，是个股的。\n\n2. 这个过程会自我加强，形成一个循环\n\n他把机制拆得很清楚：\n\n越是融资的人减少、越往外跑、越降杠杆，它的抛压就越大；越大的抛压，它就下跌得越多。跌得多了，有人的杠杆率就不满足监管要求了，所以他就得被迫卖出——所以它就会形成一个循环。\n\n他补充说，这就是索罗斯讲的反身效应，「在物理学上就是正反馈」。他还举了个大家都听过的例子：\n\n你用麦克风讲话的时候，有时候会突然发出一声特别大的噪音，那就是正反馈——麦克风接收的声音传到喇叭，喇叭又传回麦克风再放大，相位正好互相加强。\n\n3. 斜率过大的时候，就需要外力打断\n\n如果斜率过大，就是下跌速度太快的话，就需要外力把这个正反馈给它打断。\n\n他说前几天有一天跌得特别快的时候他就说过这话——这种快速下跌容易出问题。他认为最好的方式是慢慢往下走：\n\n慢慢往下走，它就不会丧失流动性，那么就不会有人被强平。\n\n4. 但主动降杠杆的抛压躲不掉，因为人性如此\n\n人都是这样的，你不把他逼到墙角的时候，他一般都不会做选择。随着价格下跌，你的杠杆率就会越来越高；等杠杆率接近平仓线的时候，你自己就开始主动选择卖出了。\n\n所以他的判断是：「扭转这个趋势并不是一朝一夕的事，它并不容易，光靠市场自身实际上是很难改变的。」\n\n5. 赚钱效应和亏钱效应，都是正反馈\n\n市场上涨的时候有赚钱效应，买的人多它就继续上涨，这也是一种正反馈；下跌的时候它就有亏钱效应。\n\n## 二、这个阶段的关键词：先防风险，然后「不急」\n\n1. 防风险的定义：保证不被动出局\n\n他把自己反复讲的这三个字又收紧了一下：\n\n防风险就是说，当它出现巨幅波动的时候，你应该保证不出局、不会被动性卖出。\n\n他说自己清掉融资就是为了防这件事——「防止一旦出现泥沙俱下的时候，能保证我不会被动出局」。至于会不会真的泥沙俱下，他说判断不了，「但是也得防」。\n\n2. 在这之外，现在的关键词是「不急」\n\n还有一点是我今天想说的，就是不急。你不要着急，等着就行。\n\n他特意说明怕别人误解：如果你拿的是稳健标的、又没有融资，那就别急，等着就行。\n\n3. 他对两个市场风险性质的区分\n\n我认为A股市场的风险相对来说是结构性的，而美国市场的风险是全局性的——一旦发生的话，稻子也很难幸免于难。\n\n他说我们不是不危险，「有些东西也很危险，但不是全局性的危险」。\n\n4. 一个反直觉的说法：该感谢去年10月的减持\n\n他讲了个大部分人不爱听的判断：\n\n这得多亏我们去年10月份神秘队不断减持、压制这些东西的价格，你应该感谢他。这种行为导致了我们市场的韧性要比其他市场要强一些。\n\n他说如果我们真来一把像韩国那样的，「那谁能承受得了？那不又出现了一次2015年这种情况」。他还补了一句：\n\n你说砸死是因为你在他砸之前买的。你要是他砸之后买的，你应该感谢他们——没有他砸，哪有这么便宜的标的，你上哪占这些便宜去？\n\n5. 顺带说到「替庙堂出主意」这件事\n\n他对那些天天给政策提建议的人有个很实在的提醒：\n\n那里头985、211、双一流的人都成群，那些人上学你都没赢过人家，其中的一个你都没赢过。你学习都学不过人家，何况那些人聚在一块，还能看到你看不到的信息——他能会比你笨吗？\n\n## 三、技术分析：用结果判断结果\n\n1. 所有技术指标，本质上都是过去量价关系的函数\n\n这是他这段的核心论证：\n\n所有的技术指标都是过去的量价关系所得到的一个函数。用过去的量价关系判断未来，是没有任何用处的。\n\n他还提到自己是真看过的：「我这些年所有关于投资的书我都看了，唯一看不下去的就是技术分析。早年看过很多技术分析的书，最后我得出的结论是——所有的技术分析都一样，狗屁不通。」\n\n2. 一个消息就能让你所有的推演作废\n\n你今天数浪，数八个浪眼睛都数花了，明天特朗普早上起来一句话又打仗了，你所有的东西都没用。你说明天我又准备轰炸伊朗了，油价你数多少浪有啥用？\n\n他还吐槽了一句：「搞技术研究这些人，八个人能数出来八种浪。」\n\n3. 均线为什么没有因果关系\n\n他用概率的角度拆了一遍：\n\n跌破5日均线，第二天的走势仍然是随机的，既可能上涨也可能下跌，概率是50%，跌破10日均线还是这样。你今天跌破5日线了，恰巧明天特朗普说又和谁谈好了，市场又变化又上涨——那跟你这个均线有什么关系？它本身就是个结果，哪有用结果判断结果的？\n\n4. 他的筛选标准里，又加了一条\n\n所有拿技术分析跟你煞有介事讲的，你都不用看；包括所有拿主力进出来给你讲得跟真事似的，也都不用看。这些人基础逻辑有问题。\n\n## 四、这场最特别的一段：先定义，再判断\n\n他用了大半场时间讲思维训练，出发点是——「这些东西用在你的投资上是非常有用的」。\n\n1. 「喝粥养胃」：你先定义什么叫养胃\n\n大家都说喝粥养胃，那你是不是先要给我定义一下什么叫养胃？养胃的指标是什么？你连养胃都没定义出来，那你为什么在喝粥后面就能下这样一个判断呢？\n\n他自己给出了粥的机理：粥本质上是糊化淀粉，几乎不需要胃的蠕动，直接就是稀泥状，可以进小肠；淀粉酶一分解就变成葡萄糖直接入血——「所以血糖高的人喝粥马上就升糖，它跟喝糖水没什么区别」。\n\n2. 「吃核桃补脑」「喝姜水去湿气」，同样的问题\n\n你告诉我啥叫补脑？补脑是什么表现、什么指征？你没补之前是什么样，补完之后是什么样，用什么东西来衡量？\n\n他说这些都是哲学问题——「你在下一个判断的时候，是不是得先定义前面的概念、定义后面的概念，然后才能说这个集合属于不属于那个集合」。\n\n3. 「吃黑芝麻头发变黑」：那喝墨水行不行\n\n他把这个追问推到底：\n\n是因为它是黑颜色的，所以会使头发变黑吗？如果吃黑的就能让头发变黑，那我问你喝墨水行不行，吃煤块行不行？如果不是因为它黑，那你告诉我是黑芝麻里的什么东西、通过什么样的生物化学反应，最后导致头发变黑——你告诉我，我不是不信，我会信的。\n\n他自己给了个玩笑式的答案，但道理是真的：\n\n让头发变黑的道理很简单，就是把你这个股票少赔钱，头发就会变黑。你要是股票老赔钱，你就是拿黑芝麻当主食，你头发也得白。\n\n4. 他强调：这不是让你去抬杠\n\n我不是教大家拿这些东西跟人抬杠。日常生活中我从来不纠正人，老阿姨告诉我核桃补脑的时候，我说对对对，我回去买点。\n\n他真正想说的是：\n\n我在思考的一个问题是——我们思维的训练在这一点上是不过关的。你说这个话之前，没有细想你这个判断是怎么来的、判断依据是啥。你一定要杜绝人云亦云这件事。\n\n## 五、实证主义：不争本体，只问证据\n\n1. 他说我们的哲学「缺一环」\n\n他抛出了这场最大的一个观点：\n\n从爱因斯坦的相对论开始，统领西方科学的哲学思想是实证主义——既不是唯物的，也不是唯心的。\n\n他解释实证主义的立场：唯物主义和唯心主义本质上都属于形而上学，而这两者「既不能证实也不能证伪，你俩争论实际上是没有胜负的」。所以实证主义干脆不去争论本体究竟是唯物还是唯心，「我不管这些事，我管的是你有什么证据」。\n\n他还顺带纠正了「形而上学」这个词的用法：中国古代讲「形而上者谓之道，形而下者谓之器」——形而下可以理解为物理、化学这类实验科学，形而上就是这些东西背后的理论。\n\n2. 光锥之外的事，讨论它没有意义\n\n他举了个天文学的例子来说明什么叫「不可实证」：\n\n你现在看到一颗星，离我们十亿光年远，那它现在发出的光是不是就是十亿年前的？假如你问我「这颗星现在是什么样的」——这个东西就没有任何实证。在爱因斯坦的理论里，它叫处在光锥之外，是你不可感知的事物，讨论这个问题是没有任何意义的。\n\n3. 法律上的例子：什么叫「以事实为根据」\n\n这是他讲得最透的一个例子（他做过律师，所以讲得很具体）：\n\n以法律为准绳这事非常简单，因为法律是人规定的。但以事实为根据——我问你，以什么样的事实为根据？在执法过程中，诉讼双方描述的事实是完全不一样的。\n\n他把这个逻辑推到底：所谓诉讼，就是引入第三方强制力量来介入双方的争议，而当时的事实只有诉讼双方知道。\n\n第三方没有上帝的视角，他们怎么知道当时的客观事实是什么样的？所以你如果一直追求客观事实的话，这个事就没解。\n\n他给出的答案是：在法庭上，实际依据的是「证据证明的事实」，而证据证明的事实不一定就是客观事实——「有的人明明有理但证据不足，有的人明明没理但证据充分。要不然错案是哪来的？」\n\n4. 再往下问一层：一审和二审谁更客观\n\n他继续追问：\n\n一审法院根据证据认定一个事实，二审法院又根据证据认定另一个事实，把一审推翻了。那我问你，一审认定的更客观，还是二审认定的更客观？你在逻辑上有什么根据说二审就一定比一审更客观？难道二审法官都是神吗？\n\n他说如果二审天然更客观，那从效率上讲干脆不要一审、直接二审就完了。所以结论是：\n\n这些东西都是制度问题，没有说二审就一定更客观的。但从诉讼制度上来说，你得以二审的事实为依据。所以我告诉你，你根本不知道什么叫客观事实。\n\n他还提到历史上确实有过「上帝视角」的替代方案——神明裁判：决斗就是一种，谁赢了就是谁对，因为「上帝保佑你了」；商代用龟甲占卜也是同类。\n\n5. 落到投资上：你的结论有没有证据\n\n绕了一大圈，他把话收回来：\n\n你在投资的时候也要想一个问题：你得出的结论是否有证据？你不能光靠信仰说「我就觉得需要发展科技，所以我就买科技股」。那你告诉我，你的上涨理论依据是啥？事实依据是啥？\n\n这些问题你想，不一定得到结论；但你不想，一定是错的。\n\n6. 投资不是背口诀，尤其当心「下一只某某」\n\n投资不是背口诀，不是说「京沪永远涨」你就一定能涨。而且在投资过程中，一旦出现某些朗朗上口的口诀的时候，就一定完了。\n\n他引用彼得·林奇的话：\n\n当心下一只某某。一旦有人说某只股票是「下一只某某」的时候，那不但这只股票不行了，原来那只股票也要不行了。\n\n## 六、稀缺性：股票太多之后，什么才值钱\n\n1. 先想清楚：什么是稀缺的\n\n他用买房子的例子做类比：最初大家买房都盯着院里有没有树、有没有绿化、有没有水系假山，「后来才发现这些东西都很容易做」。所以真正该问的是：\n\n你要找真正稀缺的东西。你要想什么东西不可能再有新的上市公司了——你说哪个领域里面不可能再有新上市的了？\n\n2. 港股的对照：为什么会仙股遍地\n\n他讲了个很有说服力的对比：\n\n你只要炒那个东西，我就可以源源不断地给你供给。所以慢慢地，很多没有实际业务、没有真正盈利能力的，最后都沦为仙股——没人看，也没有人买。\n\n而港股里有些票比A股还贵，原因是：\n\n港股的资金是在寻找真正的稀缺资源，而A股的资金现在还在寻找哪个更容易操纵。\n\n他说在成熟市场里，容易操纵反而没人买：\n\n你敲锣打鼓也没人买。你可以一天涨100倍，没有用，你卖不出去，最后全在自己手里头——因为没有人上当。\n\n他对我们市场的评价是：「一说哪个涨了、拉两个涨停板，大家全去追，完全不去看这里头的猫腻是啥。」\n\n## 七、核桃的故事：一个完整的小周期\n\n有人聊到文玩核桃，他顺手讲了个非常干净的周期样本：\n\n麻核桃因为皮厚、没什么瓤，最早根本没人要，都拿去烧火；后来开始有人玩文玩核桃，而那些老树很多已经被砍掉了，东西就特别少，于是越炒价格越高。\n\n那你种核桃树、种上到能结核桃，还得好几年。所以核桃贵了以后，大家就开始嫁接这个树，然后一点点到三四年以后，这核桃就烂大街了。\n\n他的总结是：\n\n这跟养猪没有啥区别。猪肉贵的时候大家猛养猪，等到大家都养出来了，卖的时候就烂大街了。\n\n他还给了个具体数字：当年上万一对的好核桃，现在十块钱。\n\n## 八、题外一则：给别人留口饭\n\n这段不是市场话题，但他讲得很郑重，也和他一贯的价值观一致，所以一并录在这里。\n\n他说中国古代讲「伐冰之家，不畜牛羊」——古代能用得起冰的人家就是很富裕的，那就别再养牛养羊和老百姓争利了。\n\n你要给别人留一口饭，不要把这个饭都吃尽了。你如果是有工资的话，就不要去捡垃圾；各种补贴，你如果是不缺钱的人，就不要去领，虽然你领也不违法。\n\n他还把这个引申到企业上：\n\n为什么我们这一代人就产生不了像马斯克这种企业家？那是由于我们这一代人穷过——你挣了点钱，你就想挣更多的钱。已经挣了那么多钱，还想着怎么把买菜的钱也挣了、把外卖的钱也挣了。\n\n## 九、他自己的收尾\n\n这场结束时他说要停播一周，理由和上一场如出一辙：\n\n没有啥可说，你老说的就是那点话。投资市场就那么几句话——低买高卖，剩下没了。","toc":["一、降杠杆的正反馈：这轮下跌是怎么自我加强的","二、这个阶段的关键词：先防风险，然后「不急」","三、技术分析：用结果判断结果","四、这场最特别的一段：先定义，再判断","五、实证主义：不争本体，只问证据","六、稀缺性：股票太多之后，什么才值钱","七、核桃的故事：一个完整的小周期","八、题外一则：给别人留口饭","九、他自己的收尾"],"url":"https://xueqiu.com/2573414707/405869839","chars":5276},"topics":["录屏回放"]},{"date":"2026-08-08","bili":{"title":"老木匠 2026年8月8日直播文字稿","text":"@买股票的老木匠\n\n## 一、开播闲聊与状态\n\n今天早晨起来就有点冷了，前一天还挺热，这一下就入秋了。直播间里老有人吵，我倒挺爱吵的，说你们比我还爱吵。有人问我语音直播怎么检查画面，我说我这是纯语音，没有画面。\n\n不开盘的时候不知道干啥，开盘了也不知道干啥。现在不像以前能天天做 T，仓位基本不动，交易频率降下来了，融资也没了。健身也不能天天去，我现在基本不去健身房，家里弄了点器械自己玩。连续播了两天，嗓子有点哑——以前当老师连着讲课都没事，关键是现在老也不说这么多话，偶尔一次说多了就受不了。\n\n有人以为东北人都穿花棉袄、戴狗皮帽子，就跟以为内蒙人都骑马上学一样。我告诉你们，全国各地没啥不同，你到贵州戴那个银帽子那是给游客看的。你现代化了，人家也现代化，你只是自己希望别人别现代化，好让你还觉得东北人就该穿花棉袄。这就跟美国人都希望中国人还住窑洞一个心态。\n\n## 二、不再看空有色与美股波动\n\n有人昨天跑来问黄金、问有色的事，说央行又增持黄金了。你们难道不知道我早就不看空有色了吗？而且我很明确告诉过大家，从某一天开始我就不再看空有色了。我不看空的原因、不买的原因都说过。前两天跌的时候一个个惶惶不可终日，这两天一涨又觉得自己行了。\n\n风险唯一的原因就是美联储的政策。我现在还害怕一点，就是美股的拥挤度——现在 A 股的博弈太厉害了。昨天晚上纳斯达克涨了百分之一，其实涨幅不算小，但它的存储类股票实际上是跌的，前几天存储还大涨呢。光模块昨天也是暴涨，所以现在的波动率非常大。你看前两天甲骨文这些搞 AI 基础设施的又开始大涨，但它们前几天已经跌了很多了。\n\n其实咱们的标的也是这样：昨天涨得多的，都是之前跌得多的，好多跌幅超过百分之五十的昨天涨得多。但这种涨幅根本不足以让上边的套牢盘解套，却足够吸引下边的跟风盘。\n\n## 三、韩国去杠杆与 2015 年股灾的教训\n\n韩国的去杠杆那种激烈程度，你认为到现在就完了吗？我不这么认为。大家回过头去看看 2015 年，大概五六月份咱们开始去杠杆的时候，连续跌停；后来证金公司入市救市，又连续涨停再跌停，头一天涨停第二天跌停。一点一点波动率降下来、流动性恢复的时候，大概已经到八九月了，大家都以为这事儿结束了，开始憧憬未来。\n\n结果 2016 年年初连续暴跌。我在 2015 年股灾是空仓逃过去的，跌到底的时候我也进去了——我不说了吗，这些年我只喊过两次充，其中一次就是 2015 年股灾到底的时候，那时候我是买进去的，也赚了一些钱。都以为结束了，画风突变，2016 年元旦开始连续熔断，然后进入长达三年的熊市，一直到 2018 年贸易战之后这轮才算走到底。\n\n你以为一个风险出来就那么一下完事了？大家老拿美国纳斯达克、美国股市那长达十多年的牛市说事儿，觉得美股就一直涨。我告诉你们，美国这十几年的牛市有个特殊背景，就是无数次 QE 印钱印出来的，而且这种事在历史上非常少见。就像你 98 年二十岁，碰巧看到中国房地产天天涨，你就会形成信仰：房地产就该永远涨、京沪就该永远涨。可它一直涨到 2021 年，二十三年都在涨，对一个二十岁的人来说，他从接触社会起房地产就一直涨，涨到他四十三岁，他才明白这东西原来是可以下跌的。\n\n## 四、货币信用与美元的本质\n\n有人说中国货币超发严重，你的问题都是从抖音来的，给你讲 M2 如何如何。中国货币超发如果严重的话早就通胀了，你现在是在通缩。\n\n美股也是一样，从 2008 年金融危机以后不断救市，这轮牛市已经走了十六年。前几轮 QE 有个很重要的地方：美国的 QE 并没有立刻引发美元币值变动，这是因为美元作为国际货币有惯性——一种货币刚开始多印的时候，并不是立即引起币值变动，得积累到一定程度。所以你看美国印了那么多钱，只是股市在涨，没出现严重通胀，一直到 2020 年之后通胀才开始。\n\n货币最初成为超强国际货币，原因就是它的生产力强——你用它的货币能买到东西，英镑、美元都是如此，美元替代英镑也是因为后来美国生产力超过了英国。一旦被大家认可，这东西就可以脱离原来的基础原因，就像比特币，它作为货币有啥基础原因？就是因为大家都认。但问题在于，\"大家都认\"这件事非常不稳定，当你长时间发现这种货币的信用有问题，或者有人开始不接受它的时候，它就开始崩塌。\n\n美元现在仍被认可，这种共识非常有惰性，不是一天两天能改的。但问题在于，美国现在长期提供不了最基本的生活用品，现在最基础的工业消费品用美元支付，这情形是由中国背书的——是因为中国收美元。假如某一天中国说所有东西都不要美元了，你认为对美元信用会不会产生巨大冲击？沙特手里的美元，每天买入的中国东西多，还是买入美国的东西多？我告诉你们，如果中国不要美元了，沙特也会不要美元，因为沙特要美元就是要到中国来买东西。\n\n你们去查查全世界一年的石油贸易折合美元是多少——大概就一万多亿美元。中国一年的贸易顺差就是一万多亿美元，中国每年出口额是多少？拿美元如果就为了买石油，那根本不需要拿着美元，拿美元是因为现在中国接受美元。所以先去比一比这些贸易额和石油额，再听那些专家扯什么石油美元。美国人自己现在都认为是\"人民币美元\"，哪来的石油美元。\n\n中国现在也要维持以美元为主的国际货币体系，因为中国是在这个体系下发展起来的。美国在每年维持这个体系上是搭着成本的，相当于人家搭好的舞台我们在上面唱戏，他愿意搭就让他搭，我们也配合。现在的问题不在于中国想改，而是美国自己想改，但他忘了自己是这个体系的最大受益者，中国是第二。所以改变这个体系，最终美国受的损失比中国还严重。\n\n我们为什么不直接甩了美元？一下这么做冲击非常大。所以人民币国际化是循序渐进的：今天跟俄罗斯可以用石油用人民币结算，明天再推其他东西用人民币结算，慢慢走出去。你还得给国外一个人民币的信用基础——这就是为什么我们买大量黄金，为什么要在香港建立以人民币结算的黄金中心。只有人民币有了最终的信用基础，别人才能放心持有。越南这种国家对人民币毫无冲击，现在唯一能冲击人民币的就是美国，剩下包括欧盟都冲不了。\n\n## 五、基金发行机制与信托风险\n\n昨天发的算力和科创 ETF 确实把我惊呆了。大家记不记得 2021 年各种茅开始下跌的时候，我们也干过一次这样的事——当时推出一个 A500 ETF。那时候各基金公司发这个东西都是有安排的指标的。当时 A500 指数第一大权重是谁，我记不清具体时间了，但我有个朋友刚推出时要买，说这是未来中国最有实力的五百只股票，我让他把指数调出来看第一权重是谁，他看完就决定不买了。\n\nA500 本质上属于宽基 ETF，还不是行业 ETF。但你现在是行业 ETF，持股更集中。科创 ETF、算力 ETF 有啥？从去年科技股行情以来涨幅最多的、超过十倍的，一定就是它的权重最高的。所以你现在发行的科创 ETF、算力 ETF，本质上就是最高位的那些票。\n\n\"日光基\"的意思是某个基金一发行一天就募完，说明申购积极性非常高，一般产生在标的投资非常热的时候——白酒最高时有白酒的日光基，今年年初有色也有日光基。我认为如果发科技基金，就会有科技的日光基。但对长期投资者来说，日光基就是一样东西走到顶端的标志之一。顶都是大资金买出来的，底都是大资金卖出来的。大资金都买进去了，后边没人再买了，这东西就到顶了；反过来，大资金都卖出来了，别人再卖也影响不了价格，这就到底了。\n\n为什么高点都是大资金买出来的？因为大资金每个人都觉得这东西好，等买完的时候，后边的人要么不认为好了，要么认为好但价格已经很高了，没人再买，好东西也会降价。这是个博弈的结果，你不知道大资金什么时候买完，所以不知道的东西风险一定很大。当一个标的里大资金已经非常集中，那就是风险信号。\n\n你看大资金进去了没有，看股东数、股东集中程度，交易软件里都有。你做超短线，连基本面都不用看，玩的就是筹码博弈、追涨杀跌，有那能耐就做，没那能耐就别做。太多散户是追涨进去的，一跌下来开始研究基本面了——你追涨进去的还研究个屁基本面，后边没人追了你就应该跑。赔大钱的都是开始小套的时候研究基本面，研究完来信心了，最终血本无归，所有的血本无归都是这么来的。\n\n基金不是不能买，是不能现在这个时候买。2024 年我是推荐很多人买创业板 ETF 这种宽基的。现在推什么都要\"穿透\"一下，看它背后权重怎么配置的。而且现在开始推主动 ETF 了，你们一定要知道这个变化要干什么。原来主动基金臭大街卖不动，大家改买 ETF；后来发现 ETF 也不行，你一买 ETF 大家就猛炒一只股票，把它炒到指数权重里让 ETF 接盘，现在又要推主动 ETF——我认为一旦推出来又回到主动基金那个死循环。\n\n本质不是基金制度设计不合理，本质就一点：从改革开放以来，人和人之间的信托义务、信托道德太差。金融上这叫信托风险——你把东西交给别人运营，收益归你，这就要求受托人绝对高的道德水准。我要是当别人的信托人，一定拿他的东西像拿自己的东西一样。但现实是大部分受托人拿信托人的资产，不是为了实现资产最大化，而是为了实现自己利益最大化。\n\n你看基金经理层，他们考虑的从来是工资多高、奖金多少、规模能做多大，不主要考虑能给委托人带来多少利益。所以你会发现一个很奇怪的事：越是股市到顶端的时候，基金越猛发，而这时候挣钱概率最低。因为公募基金不允许空仓，有最低仓位要求，发完了募集完你就得买，明知道股票已经很高了你也得进。你看现在有些私募做得好一点，高的时候它就封闭了、不准再申购了——人家知道市场高、风险大，这时候不让你买。但咱们正好是反过来的，越炒上天越大力发基金。当年白酒炒上天大量白酒医药基金，今年年初大量有色基金，现在又开始科创算力基金了。\n\n## 六、诈骗套路与\"翻缸叠杵绝后处\"\n\n有人问诈骗的\"翻缸叠杵绝后处\"是啥。一个人在被诈骗的套路里会有好几波人诈骗你：先有人诈骗你一下，再有人来\"解决\"这个问题，然后最后有个人来最后一击把你彻底骗走，以后再也不来了，这最后一下就叫\"绝后处\"。\n\n先给你整点事儿让你担点麻烦，再给你找黑社会来摆平，黑社会再败露，再让你去找人、找警察——一步一步的，每一步不仅诈骗，还为下一步做铺垫。绝后处就是最后一步，不用再考虑以后了，因为这一步骗完你基本就没油水了，你已经倾家荡产。\n\n这道理在现实里会变形。比如出现一个坏消息，有人利用它猛砸猛出货，把股价砸特别低，这是第一步；明天再拉起来还在卖，这是第二步——这就是翻缸叠杵。绝后处呢，等卖到最后没多少了，一把干跌停全给你，都是你的了，以后不用考虑了，公款都给你了。赵本山说的那两万块钱一只鸡，你想吃都拿走，反正都是你的了。前几把为什么叫翻缸叠杵？因为今天卖完不会一下卖完，明天还得卖，这是个系列的事，逐渐演进，每次你想走的时候都让你觉得这事儿还值得参与，所以不能走。\n\n## 七、江湖与喜剧的南北差异\n\n现在哪还有江湖，讲江湖的人都是拿江湖做幌子，但那些套路还在，江湖这种主子已经没有了。赵本山他们理论上属于江湖人士，他家原来就是走街串巷唱二人转的，在东北叫蹦蹦。赵本山是不世出的人才，他的幽默品质不输卓别林，都是天生的，而且他这东西传承不了——他那些徒弟哪一个都差十万八千里。\n\n你看他虽然没上过大学没学过表演，但表演上的东西谁也比不了。当年梁左讲过天津一个说相声的，上台往椅子上一坐，一句话没说底下已经前仰后合了，有的人就是有这种天分。郭德纲还谈不上。迈克尔·杰克逊、赵本山这些都不是学校教育能教出来的。\n\n你们听东北口音觉得有意思，其实跟你的口音不一样才觉得有意思，我听四川口音也觉得有意思。但这还不是幽默的本质。沈腾其实占了个巨大便宜，就是赵本山退场后留下的巨大空间，沈腾点子挺好、运气挺好。周星驰的喜剧更符合南方口味，实际上周星驰不叫喜剧叫无厘头，是他自创的，有点像南方的滑稽戏——以夸张动作、自嘲来博观众一笑。南方的喜剧和幽默是完全不同的东西。\n\n北方追求的是幽默，南方追求的是滑稽，两个完全不同的风格，但都能博人一笑。咱们最近这些年的喜剧演得都不行，我小时候那时候排得真好，陈强、陈佩斯、韩善续这些老艺术家演幽默非常厉害。相声南方说得好的，当年奇志大兵没掰的时候挺好，后来大兵配别人都达不到那个效果，大兵就得配奇志。现在的脱口秀鱼龙混杂，也有说得好的。冯巩牛群属于政治相声，太政治化了，不算真正的幽默。洛桑那个藏族小伙车祸去世太可惜，天分非常高。\n\n我在大学才明白，各地的幽默差异太大。在东北你觉得特别有意思的事，跟南方同学讲，他们眨巴眨巴眼说这有啥意思——这天都没法聊了。所以现在还能看春晚的人，我都非常佩服，你都是硬汉级别的。\n\n## 八、秦腔、地方戏与面食\n\n我们当年在陕西念研究生的时候，跟西北农大的几个博士打扑克，谁输了惩罚措施是关宿舍里听半小时秦腔——所以我们说能听半小时秦腔的都是硬汉。不过我现在年龄大了还挺爱听秦腔的，可能因为我在陕西生活过。\n\n地方戏曲里我第一爱看的是黄梅戏，然后越剧，然后秦腔，最不爱看的是京剧，看不懂。西安生活很好，跟东北差不多，就是夏天稍微热一点，隔三差五我就去一次，跟回家似的，同学多、东西熟、吃的也适应。西安主要是碳水，面食最好——陕西山西的过水面食，你吃完别的地方都不用吃了。东北主食其实是大米，很多南方人当年都不知道东北产大米，现在没人不知道了。\n\n## 九、市场分化与寻找被低估的东西\n\n现在值得入手的标的太多了，无人问津的东西不也多吗？越是现在越多，因为结构性极度分化，有的炒得过高把资金吸走了，才导致有一些东西极度低估，这才是机会。所以我明明知道风险大却舍不得离开市场，就是因为有很多东西极度低估——没有这种极度高估的行情，你等不到这样的机会。\n\n所有的东西都一样：一提这东西大家都皱眉头、都不想买，你再让他买跟断他财路似的，那你就可以买，因为这种东西一定低估，所有人都能看到它的坏消息，而它又绝对不会被替代。你甚至都不用分析具体个股。彼得·林奇不是讲过吗，最好找那些压根没人关注的，最好人人喊打的，一提它的业务你都想吐，这时候才能找到低估的股票。\n\n白酒明显看到现在消费都在降了，它能不能起来我不知道。而且白酒不可替代吗？我小的时候啤酒比白酒贵——当年最普通的白酒和最低端的啤酒一样价，二锅头一块多，啤酒也是一块多，因为酒精含量不一样，穷学生喝不起先喝白酒。现在反过来了，喝啤酒便宜，喝白酒动不动几百。所以白酒贵就是这几年的事，历史上白酒都很便宜，那玩意儿粮食一酿就出来了，口味都是勾调出来的，都神话了。\n\n房地产你们老提，是因为它的高光时刻刚过你还没忘。老多东西都被你遗忘了。你得到那些没人关注的地方去找。一提券商、白酒、房地产，都是高光刚过你还没忘而已。\n\n我不给你们推荐个股，只能讲道理，自己去找。我看空的不说，我看好的坚决不能说——看好的说了不就成推荐了吗？你们都提民航，我就问一个问题：民航从 2020 年大幅亏损以来，有没有和业绩匹配的大幅下跌？它没有大幅下跌，说明里面的人现在还不认输。这博弈非常残酷，最终认输的时候你是能看出来的。你看张坤最坚定的都给他安排一个基金双经理制度，另一半钱交给别人处理，那人上来就把白酒乒乓都卖了买大红辣子鸡——这不是张坤认输，是基金公司认输了，张坤我说了不算。我不认为张坤最初做的是对的，但他最后的坚持是对的，起码言行合一。\n\n那些说白酒说医药是\"老登\"的，是不了解这些人，他们不是老登。被称为尊称\"老登\"的人，没有一个是 2021 年之后还继续买白酒的，那都不配叫老登。这些人是上一代的\"小登\"而已，小登老了大部分结局是死，没有几个能混成老的。今天这些小登最终也都是夭折的。当年我跟他们争论白酒，跟今天争论科技没有任何区别——只是当年白酒的故事是\"这些东西可以一生拥有，任何时候买入都是对的，人生只做一次决策买入然后一直持有\"。\n\n## 十、房子计价与二手房的真相\n\n2021 年之前我在科技上说的这些话，主要两个方面：各种茅（以白酒为代表）和房地产（我说的是房子不是股票）。2021 年我说房子的时候也是这么说的——这东西不值这么多钱，没人信，我说房子早晚会下跌、不可能永远涨。我告诉周围所有亲朋好友都不要买房子，大概 2017、2018 年之后就开始这么说了，千万别买。但房子还是涨到了 2021 年。\n\n回头看，2004 年我从上海回来的时候，告诉所有亲朋好友有钱就贷款买房子，那时候还没几个人敢贷款买。一直到 2016、2017 年我开始说不能再买了。现在房子没跌到 2017、2018 年价格的城市，你给我说一说？我认为现在所有房子只要能卖出 2017 年的价格你已经很赚了。你别搁自己那想，你自己去卖一个房子试一试，现在你那房子有流动性没？\n\n你不要拿新房来比，新房就相当于消费品，跟衣服一样，买出来就是旧的。资产没有新旧区分，消费品才有，你作为投资应该比二手房值多少钱。而且现在很多新房计价规则和原来不一样了——原来一百二十平米的房子现在按一百平米计价，当然单价变高了，这根本不是一回事。有一段时间新房不允许降价，你控量又控价，就一定有黑事，有好多种办法。\n\n你看抖音上那个小女孩，看菜上水特别多，说一斤菜半斤水，使劲摇完说这回你称吧，卖菜的菜贩说不用称，两块钱一把，你这菜板卖的，水白摇了。中国房子有单价，国外的房子都是按套卖、套内计价，没有单价问题。\n\n## 十一、住房面积、供暖与电暖器原理\n\n两个人住，我认为一百五十平米足够。你两口人住五百平米，跟打更的有啥区别，不就是个看楼道的吗？房子太空非常不舒服，晚上睡觉另一个屋东西掉地你都不敢去看。\n\n日本的东京高层公寓比一户建价格还高些，大家图方便，但别墅有院子就得自己打理，年龄大了干不动。我头几年天天做木匠活，这两年干不动了，干完哪儿都乏。\n\n日本的房子很多没集中供暖，不舒服。价格影响审美：五百平米房子贵的时候住里头觉得自己是皇上，降价以后再住里头就觉得自己是太监了。南北供暖不一样，现在用电供暖就可以，东北我家就用电供暖。\n\n你说小太阳不行，那是局部供暖，最不舒服的一种——烤哪哪热，离开就凉，烤前胸热后背凉。供暖必须均匀、大面积，屋里哪都一个温度才舒服。空调制热不能用来供暖，空调是热机、电热器是直接把电能转热能，这俩机理完全不同。空调制热跟电暖器是完全不同的东西。\n\n热泵是热量的搬运工具，不产生热量，是把热量在两个空间搬运：制冷把屋里搬到外面，制热把外面搬到里面。热量正常只能从高温往低温扩散，热泵通过做功反过来让热量从低温跑到高温。空调制热是否经济取决于室外温度——一般零上七度时制热效率正好是一，高于七度更省电，低于七度（像东北零下二十度）效率连零点三都不到，消耗三度电才相当于电暖器一度电的热量。\n\n电热器直接把电能转热能，理论效率百分之百。电暖器、电锅炉、电热膜、发热电缆都一样，南方最适合发热电缆盘地上抹保温层就行。小太阳那种局部供暖不行。电暖器一拿出来国内大牌子都行，美的格力都产，最简单的就是一个发热管加油汀，还有铝板发热的，现在所谓石墨烯其实就是电热膜，都一样没区别。说电暖气又节能又升温快的都扯淡，都是噱头，你抖一点物理就知道所有电暖器制热效果一样——一千瓦一小时就是一度电。油汀表现慢是因为油有热容量，得先把油点热，但关的时候它也不是马上凉，道理一样，油汀是最舒服的。\n\n取暖效果不仅仅取决于电暖器省不省电，最主要是房子的保温性能。东北房子保温好，电采暖电价有优惠。地暖和油汀区别不在哪个舒服，是供热终端不一样，地暖散热面更大，但你没地暖不得先把地板刨了吗？我在上海过过一个冬天，太苦了。东北采暖时也开窗，只是不能一直开，每天得通风，南方人一般适应不了那种干燥。一方水土养一方人，北方人受不了南方潮湿。\n\n## 十二、收尾\n\n行了，两个小时了，我下播了。也没什么具体内容跟大家白活了一上午，现在还有四百七十个人，谢谢大家陪我聊天。我就是今天没事干。有机会都可以来趟东北，如果你没来过还是要来一趟看一看。\n\n其实真正对你们市场有用的就是那么几句话，你把那几句话反复听，落实在行动上、融化在血液里，那你就可以了。东西并不复杂，只是你能不能落实。好了谢谢大家，我关播了。","toc":["一、开播闲聊与状态","二、不再看空有色与美股波动","三、韩国去杠杆与 2015 年股灾的教训","四、货币信用与美元的本质","五、基金发行机制与信托风险","六、诈骗套路与\"翻缸叠杵绝后处\"","七、江湖与喜剧的南北差异","八、秦腔、地方戏与面食","九、市场分化与寻找被低估的东西","十、房子计价与二手房的真相","十一、住房面积、供暖与电暖器原理","十二、收尾"],"url":"https://www.bilibili.com/opus/1239625010186813459","bv":"BV1388g6tEP8","minutes":0,"chars":8252},"ai":{"title":"老木匠·2026年8月8日：美元、基金热潮与低估的找法","text":"## 一、风险出来一次，不是「那么一下就完事了」\n\n1. 2016年元旦那次，是他自己吃过的亏\n\n他说自己讲这件事是因为「当年这个错误我犯过」。2015年的股灾他是空仓躲过去的，而且在跌到底的时候还进场买了，赚了一些钱——他说自己这些年只喊过两次「冲」，其中一次就是那个时候。\n\n但接下来发生的事让他印象很深：市场稳定下来之后，大家都以为这事就算结束了、开始憧憬未来了，结果过了2015年12月31日画风突变，2016年元旦开始连续熔断，然后进入了一轮长达三年的熊市。\n\n你从2015年开始算，2015、2016、2017一直到2018年贸易战之后，这一轮才算走到底。你以为一个风险出来，就那么一下就完事了？\n\n2. 光看K线感受不到当年的氛围\n\n他建议大家回过头去看2015年那段K线，但也提醒：\n\n我要不给你讲，你感受不到当时的氛围。你光看K线，只能看到价格的变化，感受不到当年的氛围。\n\n他描述当时的情形：去杠杆时连续跌停，证金入市救市后又连续涨停，然后又跌停——「一天是千股涨停，第二天是千股跌停」，直到波动率一点点降下来，市场自然的流动性才恢复，那已经是八九月份了。\n\n3. 对照当下：涨幅解不了套，但足以吸引跟风盘\n\n他说当天的反弹结构值得注意——涨得最多的都是前面跌得最多的，「跌幅超过50%的，昨天涨的多」。他的判断是：\n\n这种涨幅根本不足以让上面的套牢盘解套，但是却可以吸引下面的跟风盘。\n\n他还提到美股的波动率现在非常大：纳斯达克涨1%，但存储类股票是跌的，而前几天存储还在大涨；光模块又是暴涨。他说韩国那种激烈的去杠杆，「你认为到现在就完了吗？我不认为」。\n\n## 二、美股十几年的牛市，是特殊背景造出来的\n\n1. 那是QE印出来的，历史上也很少见\n\n他说很多人拿美股长牛来举例，认为「美国股市就是一直涨」，但要看背景：\n\n美国股市这么多年的牛市，有一个特殊背景，就是数次天量的QE造成的，就是印钱印出来的。而且这种现象在历史上也非常少见——只是你们碰巧开始了解股市的时候，看到的正好是美国一个特殊的年份。\n\n2. 比方：1998年20岁的人，会觉得房子就该永远涨\n\n他用房地产打了个特别贴切的比方：\n\n如果你98年的时候是20岁，碰巧看到中国的房地产天天涨，那你一定会认为房地产就应该天天涨。它确实一直在涨，一直涨到2021年——23年时间都在涨。对一个20岁的年轻人来说，他从开始接触社会房地产就一直涨，一直涨到他43岁。\n\n他说这就形成了长达二十年的路径依赖，「你就觉得这东西永远是这样的」。美股同理，从2008年金融危机后不断救市，这轮牛市已经走了16年，「当然它的基础原因发生过几次变化，但从你的体感上来说，你就认为它一直在涨」。\n\n3. 为什么前几轮QE没引发美元贬值：货币有惯性\n\n他解释了一个时间差：\n\n一种货币刚开始多印的时候，并不会立即引起币值的变动，它得积累到一定程度。所以你看美国印了那么多钱，只是股市在涨，并没有出现严重的通胀——一直到2020年之后，通胀才开始。\n\n## 三、美元到底靠什么背书：石油美元是扯淡\n\n1. 货币最初的地位，来自生产力\n\n他从根上讲起：\n\n一个货币能成为超强的国际货币，最初的原因就是它的生产力强——因为你用他的货币就可以买到东西。无论是英镑还是美元都是如此。美元替代英镑，也是由于后来美国的生产力超过了英国。\n\n但他补了关键的一层：一旦被大家认可，这个东西就可以脱离原来的基础原因，「只要大家都认，它也可以作为货币，比特币就是这样」。问题在于：\n\n大家都认这件事是非常不稳定的。当你长时间发现这种货币的信用有问题，已经开始有人不接受、开始产生怀疑的时候，这种货币就开始崩塌了。\n\n2. 算一笔账：石油贸易一年才一万多亿美元\n\n他当场让直播间的人去查数据，然后给出对比：\n\n全世界一年的石油贸易折合美元，大概就是一万多亿美元。那我问你，中国一年的贸易顺差是一万多亿美元，中国每年的出口额又是多少？\n\n他说而且这一万多亿里还得刨掉俄罗斯、伊朗那些根本不用美元结算的部分。所以他的结论很直接：\n\n先去比一比这些贸易额和石油额，然后你再听那些专家白白扯什么石油美元。美国人自己现在都认为是人民币美元，哪来的石油美元？\n\n3. 沙特要美元，是因为要拿到中国来买东西\n\n他把逻辑推到底：\n\n如果有一天中国不要美元了，沙特也会不要美元——因为沙特要的美元就是要到中国来买东西。你认为沙特手里的美元，每天买入中国的东西多，还是买入美国的东西多？\n\n他说所以今天最基础的生活用品、普通工业品和消费品用美元支付，这个局面「是由中国来背书的，是由于中国收美元」。\n\n4. 那我们为什么不干脆废掉美元？\n\n他先反问「中国现在还需要美元干嘛」，然后自己给出了答案：\n\n中国现在也要维持以美元为主的国际货币体系，因为中国是在这个体系之下发展起来的。香山是人家搭好的舞台，我们在上面唱戏，他愿意搭台就让他搭呗。\n\n他强调当国际货币并不轻松——「你需要维持国际货币的秩序，美国每年在这上面是搭了成本的」。而现在的问题是：\n\n不在于中国想改变这种体系，而是美国自己想改变这种体系。但他忘了他是这个体系的最大受益者，中国是第二。所以改变体系最终导致的损失，美国要比中国还严重。\n\n他说一下子废除美元带来的冲击非常大，所以人民币国际化只能循序渐进：今天和一个国家用人民币结算，明天再多一样，慢慢就走出去了。他还解释了买黄金和在香港建人民币黄金结算中心的用意：\n\n那都是给国外人持有人民币的一个最终的信用基础——你最终什么都买不了，我告诉你，你可以到香港买黄金，把黄金拿走。\n\n他还顺带表态：「现在唯一一个能够冲击人民币的国家是美国，剩下任何国家包括欧盟都冲击不了。」至于我们M2高、货币超发的说法，他也直接否了：「如果超发严重的话，早就通胀了，你现在是在通缩的。」\n\n## 四、日光基：一个东西走到顶端的标志之一\n\n1. 什么是日光基，它一般什么时候出现\n\n他解释：某只基金开始发行后一天就募集完毕，这就叫日光基。它说明申购的积极性非常高，而这一般发生在对应标的投资非常热的时候。\n\n白酒最高的时候就有白酒的日光基，今年年初的时候就有有色的日光基。那我认为现在如果发科技基金的话，就会有科技的日光基。\n\n2. 核心判断：顶是大资金买出来的，底是大资金卖出来的\n\n这是他这一段最重要的一句话：\n\n顶都是大资金买出来的，底都是大资金卖出来的。大资金都买进去了，这个东西就到顶了，因为后边没有人再买了；反过来，大资金都从里面卖出来了，这东西就到底了，因为别人再卖也影响不了价格了。\n\n他说所以对长期投资者而言，日光基就是走到顶端的标志之一——「我不敢保证它一定到顶端，但这是标志之一」。\n\n3. 推论：大资金越集中，就越难再集中\n\n他讲了个基础的判断：\n\n一个东西里面大资金少，它容易集中，还是大资金多容易集中？我从长远考虑，认为大资金持有少的时候更容易集中——因为只要稍微买一点，它就会涨。\n\n所以当一个标的里大资金已经非常集中的时候，「这都是风险信号，你就应该想会不会进一步集中」。而「你知道大资金什么时候能买完吗？其实你也不知道——不知道的东西，风险就一定很大」。\n\n4. 怎么看：股东数和持股集中度，软件里都有\n\n他说这些数据在交易软件里都能查到——一只标的有多少股东、每个股东平均持股多少，都有统计值。至于「股东数滞后」的问题，他的回应是：\n\n股东数一般是按季报公布的。如果一个季度三个月你都等不了，那你做的是超短线——你不用看股东人数，看博弈的激烈程度就可以了。你看的东西和你做的东西要匹配。\n\n## 五、买ETF要「穿透」看权重\n\n1. A500的例子：当年第一权重是谁\n\n他讲了个亲历的故事：当年A500推出的时候，一个朋友说要买，理由是「这是未来中国最有实力的500只股票」。\n\n我说你把它指数调出来看看第一权重是谁。他看完就决定不买了。我说你如果买A500的话，那你还不如直接买那第一权重，可能还好一些。\n\n他提醒大家：当时各个基金公司发这个东西「都是有目的、有安排的指标的」，而买进去的钱「大量都去买各种茅了」。\n\n2. 宽基已经如此，行业ETF的集中度只会更高\n\n他说A500本质上还是宽基ETF，而现在发的是行业ETF，持股集中度更高：\n\n你想一想科创ETF持有啥、算力ETF持有啥？我认为你都不需要查——你按照从去年科技股行情以来涨幅最大的、从上往下排前十的，那就一定是它权重最高的前十。\n\n他说所以现在发行的这类基金，买的就是涨幅最高、甚至涨了十倍以上的那批东西。\n\n3. 基金不是不能买，是现在这个时候不能买\n\n他澄清自己不是一概反对：\n\n基金不是不能买，是不能现在这个时候买。24年的时候我是推荐很多人买创业板ETF这种宽基的。\n\n他的要求是：无论买哪种基金，「你都要穿透一下，看看它背后的权重是多少、是怎么配置的」。\n\n## 六、为什么股市越到顶端，基金发得越猛\n\n1. 机制上的原因：公募不允许空仓，募完就得进\n\n他解释这个看似反常的现象：\n\n基金是有约束的，你发完了就得马上进，建仓是有法律要求的，公募基金不允许空仓，而且有最低仓位要求。所以你在股市处在高点的时候，募集完了你必须得进——你明知道这股票已经很高了，你也得进。\n\n他说所以真正该问的是：「那为什么这个时候非要募集资金呢？」\n\n2. 根子是信托风险：受托人图的是自己的利益\n\n他把这件事归到一个更根本的概念上：\n\n你把东西交给别人来运营，这个人就是受托人。这要求受托人有绝对高的道德水准——我不敢保证一定赚钱，但我一定敢保证拿他的东西就像拿我自己的东西一样。\n\n但现实是：\n\n大部分受托人拿着委托人的资产，并不是为了实现信托资产的最大化，而是为了实现自己利益的最大化。\n\n他说所以基金经理这个层面考虑的是「工资多高、奖金多少、规模能做多大」，而不是主要考虑能给受托人带来多少利益。他还把这个概念在不同领域做了对照：管理上叫道德风险（职业经理人吃回扣、采购找熟人），金融上叫信托风险，打官司找律师那叫代理风险——「代理人应该为委托人服务，但主要考虑的是自己的利益」。\n\n3. 国外和私募的对照：高的时候反而限购\n\n他举了个反例：有朋友说在美国买的基金是限购的。\n\n因为人家就知道这件事——现在市场高，风险就大。那你资金想往里进的时候，我认为你实现不了收益，所以这个时候我停止申购，我不让你买。\n\n他说国内现在有些私募也开始这么做了（高的时候封闭、不准申购），但整体上「我们正好是反过来的：越炒上天，越大力发行、大力募集」——「当年白酒炒上天的时候，大量的白酒医药基金；今年年初有色炒上天，大量的有色基金；现在又开始科创、算力基金了」。\n\n4. 对「主动ETF」的看法\n\n他提醒大家注意这个新变化背后的意图：\n\n原来是主动基金已经臭大街了、卖不动了，然后大家都开始买ETF；后来发现ETF也不行，你买ETF大家就猛炒一只股票，把它炒到指数权重里去，让这些ETF来接盘。现在又要推主动ETF——但我认为主动ETF一旦推出来，又回到主动基金那个窠臼里了，又回到那个死循环。\n\n他说这个东西的本质不是基金，「是这种制度设计不合理」，而根子还是前面说的信托风险。\n\n## 七、追涨进去的人，不要再研究基本面\n\n1. 看的东西要和做的东西匹配\n\n他把这个道理讲得很直接：\n\n做超短线的人完全玩的是筹码博弈，就是追涨杀跌，连这公司干啥的我都不想看。你要做超短线还要研究基本面，那你不套你套谁？\n\n追涨杀跌是博傻游戏，你考虑的根本不是基本面，你考虑的是后边还有没有人买。后面没有人追了，你就应该跑。\n\n2. 所有的血本无归，都是这么来的\n\n他说最要命的一种情况是：\n\n赔大钱的都是开始有一点小套的时候研究基本面，然后研究完基本面开始来信心了——这最终会使你血本无归。所有的血本无归都是这么来的。\n\n他补了一句：「你要是研究基本面，是应该等它跌下来再买。」\n\n## 八、江湖里的「翻杠叠杵」与「绝后楚」\n\n1. 旧社会连环骗局的结构\n\n他先解释了这两个《江湖丛谈》里的词：一个人落进套里，会有好几拨人接力骗你——先有人骗你一下，再有人来「帮你解决这个问题」，每一步不仅要骗，还要为下一步做铺垫，这叫翻杠叠杵。\n\n最后一步就不用再考虑以后了，因为这一步骗完你以后，你基本就没啥了、已经倾家荡产了——这最后一下就叫绝后楚。\n\n他举的例子是：先给你整点麻烦，然后找黑社会来摆平，黑社会败露了再让你去找警察，一步一步往里套。\n\n2. 对应到市场上的变形\n\n他说这种结构在今天的市场里会有变形：\n\n出现一个不好的消息，有的人利用这个消息猛砸猛出货，把股价砸得特别低——这是第一步。下一步再一辟谣，把它拉起来，拉起来还在卖，这是第二步，这就是翻杠叠杵。\n\n什么叫绝后楚？等卖到最后已经没有多少了，一把干跌停全给你，完事，都是你的了——以后不用为这事考虑了。\n\n他解释为什么要分好几步：\n\n因为今天卖完了不会一下就卖完，明天还得卖。所以这是一个系列的事，会逐渐演进。每一次你想走的时候，都会让你觉得这事儿还值得参与，所以你不能走。\n\n## 九、要去找那些「压根没人关注」的东西\n\n1. 你们说的这些，都没脱离它的高光时刻\n\n他对直播间提到的各种标的做了个总的点评：\n\n你们现在说的这些东西，都没有脱离它的高光时刻——有的可能是高光刚过，有的是刚刚起来，也处在别人的关注之下。你就没有几个人能说到那种压根就没有人关注的。\n\n他说大家总提券商、白酒、房地产，「是因为这些东西的高光时刻刚过，你还没忘而已」——「老多东西现在都被你遗忘了，你都想不起来了，你得到那里去找」。\n\n2. 彼得·林奇的标准：名字奇怪、一提就皱眉\n\n最好是有一个奇怪的名字，你根本不知道它是干啥的；最好是他一提他的业务你都得吐、特别反感。这个时候你才能找到低估的股票。\n\n他补充了一个判断条件：\n\n所有人都能看到这个东西的坏消息，而这个东西又绝对不会被替代的时候，它就一定会低估。\n\n但他也提醒这只是必要条件、不是充分条件：「那不是说所有的股票都行，有的就是不行，你也得自己区分。」\n\n3. 他为什么明知风险大也舍不得离开市场\n\n他说了自己现在留在场内的理由：\n\n现在结构性极度分化，有的东西涨得过高，把资金都吸走了，才导致有一些东西会极度低估——这才是你的机会。如果没有目前这种极度高估的行情，你是等不到这样的机会的。\n\n4. 怎么判断一个行业「还没认输」：看民航\n\n他用民航举了个方法论上的例子（他强调不推荐个股，只讲道理）：\n\n民航从2020年那个事件大幅亏损以来，连裤子都快亏没了，它有没有和业绩匹配的大幅下跌？没有大幅下跌说明什么？是不是说明在里面的人现在还不认输？\n\n他说这个博弈是非常残酷的，「他最终认输的时候，你是能看出来的」。\n\n## 十、所谓「老登」，其实是上一代的小登\n\n1. 白酒当年可不是老登股\n\n他对现在流行的「老登」说法很不以为然：\n\n说白酒、说医药是老登的，都是不了解这些人。这些人不是老登，是上一代的小登而已。\n\n他回忆当年的说辞：\n\n当年白酒的故事是：这些东西可以一生拥有，任何时候买入都是对的，人生只要做一次决策，买入就可以了，然后一直持有。他们算啥老登？\n\n他还提醒：当年那些基金经理都是有粉丝群、有粉丝文化的，「兰兰坤坤是怎么叫出来的？」他说：\n\n被尊称为老登的人，就没有一个人在21年还会拿着白酒、还会在21年之后继续买白酒——那都不配称为老登。\n\n2. 「小登老了不会变老登，大部分结局是死」\n\n你不要以为小登老了就变老登。小登老了，大部分的结局是死。今天这些小登，最终也都是要折的，没有几个能混成老的。\n\n他还说自己当年跟人争论白酒的时候，「跟今天说科技是一样的，如出一辙，没有任何区别」。\n\n3. 什么叫「认输」\n\n他用一个具体现象来定义认输：某位以白酒著称的知名基金经理，最后被基金公司安排成双基金经理制，另一个人上来就把原来的持仓卖了、直接买入当下热门。\n\n啥叫认输？这就是认输。不是他认输了，是基金公司认输了。\n\n他还给了个中立的评价：「我不认为他最初做的是对的，但是他最后的坚持我认为是对的，起码他是言行合一的人。」\n\n## 十一、房子：别拿新房价格骗自己\n\n1. 他自己的两次判断\n\n他说2004年从上海回来的时候，他告诉周围所有亲朋好友「有钱就买房子、贷款买房子」——「那时候还没有几个人敢贷款买」。而到了2016、2017年之后，他开始告诉所有人不要再买房子了。\n\n21年我说房子的时候也是这么说的，我说这东西不值这么多钱，没有人相信。房子还是涨到了21年。\n\n2. 要比二手房，不能比新房\n\n他讲了一个很关键的区分：\n\n资产没有新旧这种区分，消费品才有新旧的区分。你要把房子作为投资，它就没有新旧的区分——你应该比较的是二手房，不能老说新房。\n\n他说新房就像衣服，「你只要买出来就是旧的」。\n\n3. 更隐蔽的一层：新房的计价规则已经变了\n\n这一段是他讲得最具体的：\n\n现在很多新房的计价规则和原来不一样了。不是得房率的问题，是标称面积的计算方式就和以前不一样。你现在买个100平米的，按原来的计价规则可能得是120平米——所以你现在这个单价是100平米的单价，原来是120平米的单价。\n\n他解释背后的原因：有一段时间新房价格有刚性、不允许降价，「你不允许降价，还想卖掉，那怎么办呢？那不得在面积上做手脚吗？」他把这个归到自己以前讲过的那条规律上——\n\n我没给你们讲过吗？你又控量又控价的时候，就一定会有黑市，它有好多种办法。\n\n4. 先问自己一个问题：你的房子现在有流动性吗\n\n你别看那些统计数据，你卖过房子吗？你问一问你的房子有没有流动性。你自己在那想「我这房子还能值2017年的价」——我告诉你，你现在要是卖的话，根本没有人买。\n\n5. 价格影响审美（他又用房子讲了一遍）\n\n500平米的房子贵的时候，住在里头觉得自己是皇上；等500平米的房子便宜的时候，住在里头就觉得自己是太监了。\n\n他说房子贵的时候大家都晒大平层、大花园，降价之后再看就全是麻烦——扫地费劲、上下楼费劲、花园长荒草、一楼有虫子。他自己的看法是「两个人住150平米足够」，「你两口人住500平米，那跟打更的有啥区别？」\n\n## 十二、收尾：真正有用的就那么几句话\n\n他在下播前说了一段话，可以当作这十几场直播的总结：\n\n也没啥可讲的，市场就那点东西，讲一遍就行了，再讲一遍就重复了。其实真正对你们有用的就是那么几句话——你把那几句话反复听，然后能落实在行动上、融化在血液里，那你就可以了。这个东西并不复杂，只是你能不能落实。","toc":["一、风险出来一次，不是「那么一下就完事了」","二、美股十几年的牛市，是特殊背景造出来的","三、美元到底靠什么背书：石油美元是扯淡","四、日光基：一个东西走到顶端的标志之一","五、买ETF要「穿透」看权重","六、为什么股市越到顶端，基金发得越猛","七、追涨进去的人，不要再研究基本面","八、江湖里的「翻杠叠杵」与「绝后楚」","九、要去找那些「压根没人关注」的东西","十、所谓「老登」，其实是上一代的小登","十一、房子：别拿新房价格骗自己","十二、收尾：真正有用的就那么几句话"],"url":"https://xueqiu.com/2573414707/404303462","chars":7618},"topics":["美元、基金热潮与低估的找法"]},{"date":"2026-08-07","ai":{"title":"老木匠·2026年8月7日：从筹码和量里识别危险","text":"## 一、日元与美国内部博弈：不确定性就是风险\n\n1. 上一次干预动用了870亿美元\n\n他说日元汇率又反弹了一下，现在压到158点多。当天早上他看到一个消息：上一次日本干预汇率动用了870亿美元，「这数可是比较大的」。他还提到前一天晚上日元突然又开始贬值，可能跟一则传闻有关——有接近沃什的人说他已经决心准备加息了。他强调自己不确定这个消息真假，但市场的反应本身就值得看。\n\n2. 财政部拿的是手枪，美联储拿的是炮\n\n他从这件事里看出美国内部博弈之激烈：\n\n贝森特实际上是希望日元汇率走贬的。但美联储如果不配合，你这种努力在美联储的武器面前毫无招架之力——美联储拿的是炮，财政部拿的是手枪，根本不在一个量级上。问题是他俩现在不能协调。\n\n3. 三条路全都被堵死了\n\n他把当前的死局梳理了一遍：想救日元汇率，唯一的办法是美国降息，但沃什现在一直在想的是怎么加息；另一个选项是日本自己加息，但日本一加息就会导致大量日元回流——那些原本已经换成美元、留在美国资本市场上的钱会被甩卖，美国的资本市场流动性就会缩减。\n\n所以现在美国既想维持日本的汇率不变，又不想让日本去加息，那就只能美国降息——但美联储又不配合。所有这些政策都在互相牵制。\n\n他说最终结果谁也判断不了，「那都是博弈的结果，既包括不同国家之间的博弈，也包括美国内部不同利益集团的博弈」。他补充说沃什代表的就是「老钱派」——这些人持有的是流动性、是债券和货币资金，货币一贬值对他们就是一种洗劫。\n\n4. 关键推论：判断不了，就等于风险\n\n这是他这段的落点：\n\n你能判断出美国国内各个不同利益集团最终的博弈结果吗？肯定判断不出来。判断不出来，这对你来说就是不确定性——而不确定性，我翻译一下，不确定性就是风险。\n\n他说全世界（包括他自己）都认为沃什这件事最终做不成，现在黄金上涨交易的就是「他做不成」这个预期。但关键在于：\n\n他做不成，他也要试一试。而这个努力的过程，就会对全世界的市场产生很大的影响。\n\n他说一旦加息，不光有色金属受压，纳斯达克的冲击也会非常大——「它们都是同样一个来源，来源就是美联储的利率政策」。这也是他现在对有色「不敢买」而不是「不想买」的原因：按现在的价格，有色标的都很便宜，但你判断不了未来，那就是在冒险。\n\n## 二、都说供不应求，为什么库存越来越高\n\n1. 美国有100万吨铜库存，这个数字该怎么解释\n\n他抛出这个反问：大家都说铜供不应求、实体需求非常旺盛，那为什么现在美国有100万吨铜库存？\n\n就像当年说我们的白酒供不应求，结果你打开经销商的仓库，里头屯的全是白酒——那你的供不应求是从哪来的？\n\n他给出的答案是：这里面有大量投机性的囤积居奇。而这类需求是有反噬的：\n\n囤积居奇的这些人是因为价格在上涨才囤的。一旦价格开始反过来下跌，他们就会开始甩卖，和你形成一个竞争性的卖盘——价格弹性会非常高。\n\n2. 存储芯片同理，而且更难统计\n\n他说这不只是铜的问题，存储芯片也一样，「你别说存储器供不应求，有很多都是被囤积了」。而且更麻烦的是根本没法统计——铜好歹还有显性库存，隐性库存你怎么算？\n\n现在厂家都提高了自己厂内的库存，都怕铜涨价。我是做电缆的，那我就多买点铜先留着。你囤两吨、我囤两吨，最后加起来这个数就很大。\n\n他说自己的态度是：「我不赌，我是一个损失厌恶型的，我对所有的风险都保持非常大的警惕。」\n\n## 三、人为干预的痕迹太重，这不是好现象\n\n1. 事出反常必有妖\n\n他说当天的开盘方式让他觉得非常危险：\n\n他一切做的这些东西都和你想的不一样，这就叫事出反常必有妖。明明已经有很多消息对你非常不利了，你却还要硬拖着他——这个反倒更危险，这说明有人出不来。\n\n2. 干预改变不了方向，只会让你更跑不掉\n\n他把这个道理和日元的干预对照起来讲：\n\n你看日元跌得好好的，突然被拉起来，那是市场自然交易的结果吗？典型不是。正常他就应该贬，但是不想让他贬，就人为干预——那你能改变啥？不越来越危险吗？\n\n他说这种干预最终会有一个很坏的后果：\n\n原本有些人认为没有机会了、准备跑了就拉倒，可能是亏点钱或者少赚一点。结果你老是用这种干预的方式，他就不忍心走了。最终这种干预把你害了——你老是没办法跑。\n\n3. 怎么观察：看宽基ETF的量，不看涨跌\n\n他给了一个具体的观察方法：去看那些科创类的宽基ETF最近的成交量。\n\n这个东西不是看上涨下跌，主要是看量。你看它的量是突然放起来的，而且是从哪天放起来的，是有迹可循的。\n\n他特意说明这不是推荐，「这些东西我认为我都不会买，我是让你们观察一下」——「不是大家不知道该看什么吗？我这不是在教你们该看什么吗？」\n\n4. 有人组织小号来骂，反而是个信号\n\n他提到自己前一天说「人为干预的迹象很明显」之后被大量小号围攻，他的解读是：\n\n越是有小号组织来骂我的时候，你反倒越应该警惕。无利不起早，组织小号来骂我也是需要成本的。\n\n他还教了个识别方法：这些账号往往只有一个关注的人，最近几天发了十几条帖子，再往前就什么都没有了——「这东西实际上非常容易看」。他说原来自己还有点狐疑，「但是现在就是踩着他们尾巴了」。\n\n## 四、突发消息出来时，优势资金为什么反而先拉一把\n\n1. 第一步：散户判断不了消息是利空还是利好\n\n他从一个前提开始推：\n\n当一个消息突然出现的时候，散户实际上判断不了这个消息究竟是利空还是利好。或者判断了以后他也不敢直接相信，心里是非常狐疑的。\n\n2. 第二步：所以散户会用「价格」来反推消息的性质\n\n他接着问：在你判断不了的时候，如果价格上涨了，你会不会自然而然地认为「这就是一个利好消息」？他说大家都遇到过这种现象。而一旦你认定这是利好，你就会有买入的冲动——或者本来想卖的，现在不想卖了。\n\n你可能不买，但你可能持有。原来你觉得这个消息判断不好、准备想卖，但突然看股价上涨了，你是不是就不想卖了？这两个是等效的。\n\n3. 第三步：能影响价格的人，知道你会这么想——而且他知道真相\n\n这是整个推理的关键转折：\n\n能够操纵、能够影响价格的投资者，他知道你是这么想的。但有一点和你不一样：他知道这到底是利空还是利好。\n\n他推演：假如我是大资金，我知道这是个利空消息。如果我现在卖，股价就会下跌，那就等于告诉所有散户「这是利空」，大家会跟着一起卖，股价会大幅下跌——那我实际上是卖不出去的。\n\n所以这个时候最理智的办法是反向操作：你不仅不能卖，反倒应该买一部分。\n\n4. 所以你才会见到「明知是利空却涨了好几天」的走势\n\n你明明知道它是个利空消息，但它突然上涨了，而且还涨了好几天，最终才开始下跌——你看过太多次这样的走势了，背后的原因就是这个。\n\n他强调一个容易被忽略的点：\n\n不要以为一个标的只有在下跌的时候优势投资者才在出货。很多时候是它在上涨的时候，他就开始出货了——而且越涨越利于他出货。\n\n5. 最典型的例子是新股\n\n他说新股最能说明这个道理，因为它刚上市那天根本没有价格锚：\n\n你打新中了以后，你告诉我这个应该卖多少钱，你知道吗？那不是由人家控制吗？人家给你定多少钱就是多少钱。\n\n他的建议是：「新股来的时候，人家在做局，你差不多就撤了，别老想吃到最后。」并用东北话补了一句——「你别老想着好吃不下桌，好吃不下桌，你最后容易买单」。\n\n6. 讲这些不是让你学着做，是让你别上当\n\n他专门声明了用意：\n\n我给大家讲的这些东西都不是希望大家用这种方式来赚钱，这都是旁门左道。但是你要知道，你不能被这些东西所骗。你干不了这个，这不是你干的事儿。\n\n## 五、斑马什么时候最安全\n\n1. 你不是狮子，但你得摸透狮子的套路\n\n你不是草原上的狮子，你别老合计干捕猎那种事儿。但你要明白狮子做这件事的步骤是啥——你即使是一只斑马，也要了解狮子的规律。\n\n2. 答案：刚刚有别的斑马被扑倒的时候\n\n他问「斑马什么时候最安全」，有人说是狮子吃饱的时候，他说不对：\n\n最安全的是它们刚刚扑倒一只斑马的时候。这道理不是很简单吗？\n\n3. 推论：别老想着「跟庄」，那等于离狮子最近\n\n你平常要研究狮子捕猎从哪个地方下水、经常从哪个地方开始，你就离那个地方远一点。别老是跟庄——那你不相当于离狮子最近了吗？\n\n他还补了一句：「找老斑马在一块是非常危险的，狮子专门找老斑马和小斑马下手。」\n\n## 六、这一场最干的一段：高度控盘的东西为什么怕高位放量\n\n1. 先明确前提：高度控盘 = 筹码集中度高\n\n他一步步往下推。第一步：所谓高度控盘，就是筹码相对集中在有资金优势的人手里，换句话说外边散户持有的已经很少了——「否则他做不到高度控盘」。\n\n2. 推论一：所以拉升阶段反而会「缩量上涨」\n\n既然散户手里筹码已经很少，那这些大资金如果还想买入，外面能卖给他的人就不多了。\n\n这时候量就会很小，而且价格弹性会非常高——你买一点它就涨很多。这就是缩量上涨。\n\n他给大家留了个作业：\n\n你回过头去看那些大牛股，看有没有经历过一段缩量上涨的过程。而且这段缩量上涨的涨幅往往是最快的——因为外面已经没有多少筹码、没有多少对手盘了。\n\n3. 推论二：所以高位突然放量，只有两种可能\n\n他说既然散户手里已经没货了，那高位突然放量就只能是这两种情况之一：\n\n第一种：大户A把筹码卖给了大户B。第二种：所有的大户都开始卖了。\n\n在高位突然放量了，只有一种可能就是大户开始卖了。当然买的人不一定是散户，也可能是其他的大户。\n\n4. 两种可能，都是危险信号\n\n他分别拆了这两种情况的含义：\n\n第一种，如果大户A把筹码卖给大户B，这说明高位的筹码已经开始不稳定了——有人抱团抱不紧了。早晚有一天大户C也会卖给大户B，最终大户B也受不了，这就是散团的过程。\n\n第二种更可怕：所有的大户都认识到不能再持有了，都想把这些东西倒给散户。\n\n他强调：\n\n无论是哪种情况，它都预示着一种危险。我不敢保证它一定会下跌，但这个时候你需要重视。\n\n5. 他当初判断有色有风险，用的就是这套方法\n\n他说自己今年1月份提示有色风险，凭的就是这个：成交量放大，同时年报公布出来，那些著名标的的股东人数急剧增加、甚至是翻倍增加。\n\n成交量增大了，然后股东人数成倍增加，那是为啥？那是因为有人在卖，大户在卖。甚至有的公募基金人家都告诉你了，我开始减仓了——那不危险吗？\n\n他说而那个时候大家还在跟他算「一年能采多少铜、能卖多少钱、利润是多少」：\n\n那都没有用。他正是利用现在所有东西都好的时候，才能出得去。等他的利润下来的时候，他再想出还能出得去吗？谁会买？\n\n6. 三个信号一起出现，就要格外小心\n\n他把可以观察的信号总结在一起：股东人数大幅上升 + 论坛帖子数急剧增加 + 任何看空言论都会遭到围剿。\n\n我一般认为，如果我看中的大户已经开始出了，那我也先出来看看。\n\n7. 再次声明：这是用来「少挨骗」的，不是用来赚钱的\n\n这都是我思考的结果，不是从任何地方看来的。这东西不一定对，但它可以让你少亏。你想用它赚钱是不对的——你别合计我这回学会倚天屠龙了，你只能把它用在少挨骗上。\n\n## 七、埋人是一层一层埋的\n\n他解释为什么行情要在高位反复维持：\n\n什么东西都是埋得一层一层的。所谓温水煮青蛙也是这个道理——你不用温水，是煮不了青蛙的；咔嚓一下下来的话，他也跑不了。不维持在这个地方，筹码能交换吗？\n\n他还描述了自己看这个过程的心态：「你们能不能挺住？现在前棚天天敲锣打鼓、天天吹喇叭，那大红绸子来回舞，你们能不能挺住？」他说自己挺得住，而且乐呵——「我就想，这帮小子在后棚都要急疯了，怎么也没人来，怎么整？」\n\n## 八、价格会影响审美\n\n1. 从别墅到黄金，都是同一个道理\n\n他说这是自己讲房地产时提过的一个观点：\n\n房子贵的时候，大家都会晒我的大花园、我的大平层。价格一开始下跌，大家一看到大花园大平层就烦了——扫地费劲、还得擦灰、花园里天天长荒草、一楼还有虫子有蚊子。\n\n他说黄金也是一样：\n\n我年轻的时候，黄金被认为是非常土的东西，黄金没有白金贵。那时候结婚谁买黄金戒指？那是暴发户干的、乡镇企业家戴的。所谓「穷戴金、富戴表」，真正有品位的人得戴手表。现在黄金是白金的好几倍，所以大家就觉得黄金好了。\n\n他还举了茅台和五粮液的例子：自己年轻时有一段时间五粮液比茅台贵，喝五粮液的人比喝茅台的多，「大家都认为喝茅台是很土的」——后来是茅台的股票涨起来了，也导致了审美的变化。\n\n2. 奢侈品是精神消费，跟东西好坏没关系\n\n你背个LV包，就相当于你把10万块人民币串成串儿拎在街上走一圈，让别人都知道你有10万块钱没地方放。买10万块钱黄金戴手上也好，买一块大家都知道值10万的表也好，道理都一样——是情绪价值，是一种精神消费。\n\n他补了一句：「我认为所有的包都不如蛇皮袋——要从装东西的角度来说，最好用的就是蛇皮袋。」他还举了拿破仑的例子：当年招待大臣吃饭，别人用银杯子，他自己用铝杯子，因为那会儿铝贵。\n\n## 九、方法论：不要自我降维\n\n1. 复杂的问题没有简单的答案\n\n他在收尾时讲了这个观点：\n\n你所有把分析都停留在某一个片面的、很窄的方面的时候，你都是在自我降维——你都是在把一个复杂问题试图简单化。复杂的问题没有简单的答案。\n\n他说尤其像市场这种众多人数参与、总体处在混沌状态的地方，「你试图把一个复杂的问题简单化，这种努力是不对的」。他举的反例就是那些只算「一年采多少矿、卖多少钱」而不看价格和货币政策的分析。\n\n2. 没有一条策略能贯穿始终，包括他自己的判断\n\n所有的东西都是有相对性的，没有东西是放之四海而皆准的。市场是千变万化的，没有一条策略能够贯穿始终。所有的东西都在不断变化，包括我的判断——我没有任何一条道跑到黑的判断。\n\n他说自己看到风险的时候会告诉大家，而从哪天开始认为没什么风险了，也一样会告诉大家。\n\n3. 防风险，而且是「在场内防风险」\n\n最后他反复强调的还是这三个字，并且澄清了一个常见的误解：\n\n有人说，那我防风险就干脆空仓了——那你就相当于不做了，那还叫什么防风险？你空仓持有资金，你不就是退出市场了吗？防风险是说我在市场中防风险，你退出还防啥风险？\n\n他说正因为要在场内防风险，你才必须看懂那些可能让你陷入危险境地的态势——「要不然你咋防？」\n\n## 十、题外一则：不要把自己行业的秘密讲给外人听\n\n这一场开头他讲了段行规，虽然不是市场话题，但他自己把它和投资串在了一起，所以一并录在这里。\n\n他说自己做律师时从不把经手的案件当故事讲给别人听，这不符合职业道德也不符合行规；他反感的是那些「靠揭秘自己所在小群体的秘密来吸引眼球」的人——比如专门在自媒体上揭秘魔术怎么变的魔术师。\n\n如果现实中你遇到一个这样的人，我告诉你这个人没有底线做事。而且靠揭秘魔术来混日子的人，第一在魔术界一定是混得不好的，第二他已经混不下去了。\n\n他说这类人讲这些的时候「是带着一种优越感的，是在告诉你：你们这些傻子啥都不懂」。他还引了《江湖丛谈》里的那句老话——「宁舍一锭金，不给一句春」，意思是不要把自己的职业秘密讲给行外人（「空子」）听。\n\n顺带他极力推荐了这本书：\n\n你在这个市场上生存，如果只能看一本书的话，我就推荐你看《江湖丛谈》。看完你就豁然开朗——今天所有市场上发生的一切，没有一件事是新鲜事。\n\n他还说那些看似专业的术语，本质上和江湖黑话没什么区别：「他们说的都是黑话，你以为那些分析师说的不是黑话？又是ROE，又是20天均线，又是这个浪那个浪的。」\n\n关于读书，他还转述了自己从芒格那里学到的习惯：\n\n你没看人家芒格和巴菲特，基本上什么书都看，就是不看金融类的、不看市场类的。\n\n他说自己就是因为芒格推荐才看的《自私的基因》，觉得写得非常好，同一作者的《盲眼钟表匠》写得更好。而对被广泛推荐的《枪炮、病菌与钢铁》，他评价是「盛名之下其实难副」，并指出其中有意识形态成分——「他最基础的结论是南北美的印第安人不是白人杀的，是带去的细菌害的，把这个东西粉饰到这种程度。得病死的和被杀死的，那在道德的负罪感上是完全不一样的」。","toc":["一、日元与美国内部博弈：不确定性就是风险","二、都说供不应求，为什么库存越来越高","三、人为干预的痕迹太重，这不是好现象","四、突发消息出来时，优势资金为什么反而先拉一把","五、斑马什么时候最安全","六、这一场最干的一段：高度控盘的东西为什么怕高位放量","七、埋人是一层一层埋的","八、价格会影响审美","九、方法论：不要自我降维","十、题外一则：不要把自己行业的秘密讲给外人听"],"url":"https://xueqiu.com/2573414707/404308523","chars":6576},"topics":["从筹码和量里识别危险"]},{"date":"2026-08-06","bili":{"title":"老木匠 2026年8月6日直播文字稿","text":"## 一、拉黑、认知层次与博弈本质\n\n我现在拉黑这些人，其实是不想跟他们废话，没有那个闲心去解释，倒不是说他们能影响我，对我都没啥影响。你们以前在那只有色金属的标的上，脑子都被洗得一波一波的，一路被带到底。我最后明确告诉大家\"我不再看空\"的时候，反而没人来了。当年那只有色金属的著名标的上，多少人跑来踢场子、抬杠挑衅。一往上冲，就有人来；还能屎猫跳不？一直熬到二十五块，都没人吱声了。我现在都懒得理这些，谁来这套，干脆拉黑拉倒。有色的时候我还跟他们说两句，现在我发现这些人不能被教育，只能被消灭。另外现在也不允许谈具体的标的，我也没法跟他们细说。\n\n你讲宏观了，他听不懂；讲具体了，又违规。所以干脆道不同不相为谋，能听懂多少算多少，听不懂就拉倒。我以前拉黑还会放出来，现在不会再放了。有些人跑来装傻充愣，时间长了也烦。其中很多是不会聊天——你说的东西他根本没有交流感，总是绕回他自己那点事，话就没法聊。还有一种人，只要没听过的事就怀疑。你给他讲一件超出认知范围的事，正常心态是先了解一下来龙去脉，他们第一反应是\"能吗？不可能\"，自动把事否定。这其实是一种心理防卫机制：听到超出认知的东西就感到不安全感，本能地把它赶出去。这就像罗马皇帝杀掉带来坏消息的信使，以为没消息就还在胜利。现实中这类人非常多，所以认知层次低的人尽量少接触，你是说服不了他的。\n\n因为概念体系不同，我说\"市场有风险\"，到他脑子里立刻翻译成\"你看空，而且明天就得跌\"。我说的风险和看空是两回事，但他自动这么转译，所以没法解释。今天一涨，大家又觉得行了。要是以往我会问：\"就涨这两天，你回本了吗？现在再涨两天，能卖出吗？你不是也不能卖吗？\"所以今天涨不涨，跟你压根没关系。\n\n那是人家在继续狩猎，没有这一下哪来新进场的人？新进来的人也不是来救你的，因为你不会跑。这地方反复波动对人家来说最安全——上边扣着的鸟跑不了，下边有幻想的鸟会进来。你为什么在有色金属的标的里能从四十四一直拿到二十四？你有多少机会跑出去？白酒里的二哥，你为什么能從三百多拿到七十多？你为什么没跑？因为你画地为牢，每次想跑都有幻想。今天又开始幻想、憧憬了。我不是给你们讲过渣男的道理吗？你一想分手，渣男又是送玫瑰、又是下跪、又是到单位门口拉条幅表决心、又是写决心书、又是找你父母。最后你原谅了，下回他还是那样，你错过了最好的分手时机，用一辈子眼泪来偿还。渣男第一次犯错误就该分手，不要有幻想。\n\n## 二、芈月与秦史\n\n今天有个球上的朋友给我发了《芈月传》的剧照。剧里芈月跟义渠王通奸怀孕，居然在朝堂上睁眼说瞎话，说是先王在梦里跟她幽会。这骗鬼呢。现在很多带热点的标题，跟芈月说的话差不多。讲到芈月，我给你们讲讲这段历史——你们看《芈月传》只是看个乐呵。有人想听没？\n\n《芈月传》只是文艺作品。历史上芈月正式册封叫芈八子，是嫔妃的一个等级，相当于后来的皇贵妃。电视剧说她和楚怀王是兄弟，那是演义、胡扯，历史没记载这么细。芈月嫁的是秦惠文王，也就是秦孝公的儿子。秦孝公因商鞅变法出名。秦国最初只是子爵国，等级很低，后来国力扩张自己升级；到秦穆公时变成公爵国。战国时期诸侯都自立为王，周天子就没用了——原来只有周天子能称王，后来大家都称王，自认跟天子一个级别。这就像现在的公务员：原来都叫\"处\"，现在也都叫\"局\"了，职称也在通货膨胀。最早县级下面的基层机构叫\"股\"，后来叫\"科\"，现在县级都叫\"处\"了。秦惠文王之后是秦武王，就是举鼎砸断大腿死的那位——他跑到洛阳举当年周天子象征权力的九鼎，举起来却砸断腿，死了。这才轮到芈月的儿子嬴稷，也就是秦昭襄王。秦昭王在位四十七八年，前期由芈八子垂帘听政，史称宣太后。现在兵马俑究竟是秦始皇还是宣太后的陪葬坑，学界还有争论。\n\n秦昭王是秦始皇的曾祖父。秦始皇能统一中国，有很多机缘巧合：他小时候随父亲在赵国做人质，若按正常排序，他爷爷、父亲都长寿，他登基就晚得多、变数也多。但他爷爷、父亲都只在位几年就逝世，他很小就登基了。所以自古英雄出少年——你必须在年轻时就登上历史舞台，到六十岁再登基哪还有雄心壮志？当然也不绝对，晋文公、姜子牙都很晚才成事，但概率上还是年轻更好。霍去病立大功时才二十岁，正是年轻时那股闯劲。\n\n## 三、年轻与无限可能\n\n这就像投资：年轻时钱少，可以参与胜率特别高的标的，亏了从头再来；年纪大了才找胜率高的。年轻时应先\"意气用事\"、多尝试，否则老了哪来的心如止水？年轻啥都没经历，老了反而容易老房子着火。\n\n你年轻时该多尝试各种可能，到一定年龄再沉淀。古话\"老要张狂、少要稳\"说的是日常行事：年轻人本就不稳，所以要鼓励稳；事业上老了还张狂啥？人本身就稳了，所以要对抗自己那股木气。年轻时候稳并不好。你经历够了，自然就有认识。年轻该玩、吃喝玩乐也是生活的一部分，但无论干什么都要注意安全，不能把下半生玩没了。\n\n年轻有无数可能，但得保证生命不结束。芒格说过，人生有些事不值当，比如别得艾滋病、别吸毒，一旦尝试就没有未来了。多种可能性不包括作死。在市场上也一样，你可以尝试任何风格，但必须保证本金还在。你刚进市场别想着赚钱，前五年越想赚亏得越多。这五年主要目的是五年后还在这个市场上，其余做啥都行。\n\n我特别不赞同一进来就买入持有吃息，那是把自己锁死。我特别反对年轻时就少年老成。做父母的也别把自己的经验锁死孩子：我从不跟我儿子说该干啥，只说干啥都支持、不行就换。一辈子绝不是选一次就结束，你今天设计的路和未来走哪条几乎无法预计。太多人把孩子可能性锁死，根据的只是自己那点经验，而且最要命的是他自己并不是成功人士。我见过太多在体制内混一辈子、退休只是个处长，却让孩子去考公务员的。\n\n## 四、公务员与土地财政\n\n我二十多岁刚毕业时，几乎没人想当公务员，那时讲的是下岗创业、搞钱。公务员受追捧也就是最近十年，基础是房地产大开发带来的地方财政宽裕、待遇变好。但这只是历史上很特殊的一段。公务员待遇不可能永远好，因为公共财政状况不可能永远宽松。我们的土地财政带来的地方财政宽松，在历史上是非常短暂的，所以现在进公务员队伍，未来面临的是待遇降低。\n\n有公务员跟我怼：\"他不能欠我工资吗？\"你想过没有——他发工资的钱如果没有了，怎么办？当财政开始捉襟见肘，一定导致待遇降低。有的降低不明显：原来月初发，现在月末发，相当于欠薪一个月；再过阵子半年一开，就是欠薪半年；原来有的绩效工资也开始缩减。你的工资建立在财政宽松程度上。\n\n就像投资，有人说\"国家不可能让市场跌\"，这话不对——历史上哪次下跌是国家让它跌的？一五年、一六年熔断，哪次是国家说\"我就让它跌、让你们赔钱\"？这就叫第一性原理：你要抽丝剥茧，找到最底层的原因再判断决策，而不是站在自己角度想\"国家不应该让我亏\"。国家不能让市场跌没错，但国家跌的时候咋办？它就得跌。幺六六四（1664点）是国家让它跌的吗？九九八（998点）是国家让它跌的吗？宏大叙事都没用。\n\n## 五、借钱的风险逻辑\n\n\"烧大腿\"是东北土话：做饭没柴了，你也不能烧大腿做饭。你尊重客观事实，钱没了就是没了。现在各地政府，尤其基层三四五线城市，都得靠转移支付，当地税收根本不够行政开支。抢险救灾、老百姓福利、安全、警察，这些开支砍不了。最终不用裁员，五年不给你发工资，你自己就辞职了。不止东北，连深圳现在财政都一样——深圳当年教师工资特别高，这两年都开始降了。他没钱了就是没了，你总不能让我印钱发工资吧？所以朋友之间借钱一定要小心。\n\n比如朋友做生意跟你借，一律不借。他说信用好一定还，错了——做生意就有风险，赔光了拿什么还？借款相当于把他经营风险绑在你身上。老百姓讲\"救急不救穷\"：因为穷借钱不行；因为急（比如小孩有病）可以借。但借钱做生意不对——真能做好他早借到了，现在跟你借，多半也做不好。他信用再好，钱亏没了也不能抢钱还你。亲戚朋友借钱：不借，他可能愁十五天；借了，俩人一辈子做不了朋友。不借的愁只有十五天，借完的愁是一辈子。下次有人借，你给他找个借款平台办好、利息你担了，比直接借他强。\n\n你就直接说不借就完了，最好听。编理由他还会去核实，发现你骗他反而生气。最简单的办法是把事推给媳妇：\"钱都在媳妇手上，我零花钱都没有。\"一个人因你不借就对你有看法，这人不值得做朋友。我打过太多这种官司，最后都是一辈子仇。朋友间就不要有借钱往来。几千块也不借——你的大方取决于日常，跟借不借钱无关。至亲有大事，你直接拿钱给他，他就觉得你大方了。所有借出去的钱，只有一种情况可以借：这钱你本来就不要了，直接给就完了。\n\n## 六、科技套牢与确定性\n\n科技现在不是在跌吗？大家都套住了，我也套着，前两天刚吹完牛，现在也平了。套不套不重要，套是浮亏；关键在浮亏会不会变成永久性亏损。别吹牛，一吹就容易打脸。别提个股（暗示也不行）。关键在确定性：我反复强调，上涨不一定赚钱，能预见到的确定性上涨才赚钱。你不能回头看人家涨了十倍，就觉得那投资对——那跟买彩票一样，下一期中奖号你能预见吗？能预见到的确定性上涨，哪怕只有百分之十也很厉害。说一只票一年确定涨百分之十，这就够了；而不是找\"可能涨百十倍\"的。有人说\"国家不可能不重视科技，我就该亏吗？\"——国家该发展科技，不代表你就该赚钱。确定性最简单的形式就是存银行：一年定期一点八，存一万年底给一百八，这就叫确定性。\n\n你见过谁今天存明天取、后天再存？都是到期再取，因为确定性。你买入一只标的，不用老折腾，起码自己主观上找到了确定性。我年初还满仓满融，为什么现在不敢有融资了？我白天讲的例子：相当于邻居小孩在玩火，后来玩鞭炮，现在玩炸弹，扔来扔去像篮球。我哪睡得着？所以把融资清了——他哪天一炸我受不了。等哪天一响，机会就来了。你发现的风险，说\"我根本没涨哪来风险\"？你没涨也有风险，隔壁熊孩子有风险。\n\n## 七、市场的博弈本质\n\n所以投资方法可以讲，不违规；但别提个股、别预测大盘。一个东西从上面下来，上面套着层层人，谁去解放他们？都盼着别人踩七彩祥云来救你。傻子都走了，谁来接最后一棒？现在的折腾，都是有人在折腾。未来波动是常态。我以前讲有色时，从上面到底抽风多少次？老粉丝都知道，当年在那只有色著名投资标的上大战群雄，多少人天天跟我争这个争那个，一直到最后底了没声了，我才说\"我不再继续看空了\"。\n\n不难，参透这些万变不离其宗——整个市场是博弈的结果，套路都一样。市场上常说\"互道傻逼\"：有人买就有人卖，方向不一致，有成交就在互道傻逼。我反对把市场拟人化——好像有个单一主力在指挥，想上就上想下就下。没有这样的主力，大机构也在博弈。为什么跌着跌着开始涨了？因为卖的人发现根本卖不出去，再卖就跌太狠，于是停止卖，底下买盘还在，就把价格买起来了。这是博弈出来的。所有把市场拟人化描写的，都是我让大家排除的主播。一讲\"大盘主力今天如何\"，基础逻辑就有问题。你一听到这种，就知道这人基础逻辑有毛病，不用再听了。没有一个人的选择不理智——从他自己角度都是理智的，这些理智结果碰撞在一起，得出一个不是任何人预先设计的结果。市场本质是个博弈结果，不是谁设计的。凡有人说\"这结果国家应该这么设计\"，都扯淡。明天的市场，从今天角度谁都判断不了，只能说按现在价格，安全边际有多少，而且这也是概率化的。有人说大盘多少点是支撑、多少点是主力位，那都是扯淡，录下来看没有一次准的。\n\n## 八、概率、三体与不可预测\n\n市场是博弈，既然是个博弈，就是个概率游戏。为什么是概率游戏？因为最终是个统计值：每个人从自己角度出发，博弈出的结果是个统计值。你回到昨天预测今天是这个值，能预测到吗？告诉你，如果回到昨天重来一遍，都不一定是今天这个结果。这就像量子力学讲的\"薛定谔的猫\"：你打开盒子一刹那，观察者对对象有影响。猫是活是死、甚至有没有猫，都不一定；下次打开可能里头没有。世界本质就是概率化的。我最怕有人信誓旦旦讲宿命论。宿命论最大问题是因果决定论——按牛顿力学，万物受力决定轨迹，初始条件决定结果，理论上都能算，人受宿命论。但量子力学里这完全不可接受，后来也发现很多东西不可接受。比如三体：三个星体围绕旋转，按牛顿力学引力关系可算轨迹，但后来发现三体不遵从——任何微小改动对未来说都是巨大变化，轨迹不收敛、非常不稳定。所以三体不可预测，连天体系统都预测不了轨迹。这讲杂了，扯到物理上来了。又熔断了？我看一眼——没有，是上午熔的。\n\n## 九、日元汇率与日本死局\n\n大家需要关注一件事：日元的汇率现在又开始走高了。美国也干预，但干预不了太长时间。日元的汇率是未来的一个大事，很多华尔街投资人认为，未来点燃危机的一定在日本。日本这个局是死局，解决不了。除非日元能忍受一次性贬值，像当年俄罗斯那样，否则都是死局。但日元若接受一次性贬值，对日本打击太大——日本能甘心吗？只有一次性贬值才能救世界，但那等于日本老百姓财富归零。当年委内瑞拉、津巴布韦、阿根廷，都是一次性贬值的结果。贝森特说压着日元汇率，是怕亚洲货币出现净贬——我说他这是做梦，现在日元贬值影响不了亚洲货币，日本在亚洲没以前那么重要了。现在真正重要的是我们，谁怕日元贬值？我们自己还在升值。现在如果不管，人民币都升上天了。每天人民币都在升值，因为大量外汇在进中国。这些专家有的揣着明白装糊涂，我看他们胡说都想把杯子扔地下。港币和美元联系，所以人民币对美元汇率会影响对港币汇率。我估计最终港币一定挂钩人民币——港币就是人民币天然的稳定币，香港是我们外汇的缓冲区。现在日元又回到一百五十七以上，回到一百五十八也用不了多久。在这个价位，给大鳄做空提供了空间。靠汇率投资更混沌，能预测汇率的人更少。\n\n## 十、人民币升值与双循环\n\n短期汇率可以预测，长期回归市场反而没法预测。长期人民币一定升值，这是我多年来的观点。原来抖音上有人专门讲外汇、让大家换美元，现在还在讲人民币该贬值——你要听了，当年换美元裤衩都没了。傅鹏有些观点还可以，他不当首席后说话客观了点。人民币升值，外贸咋办？外贸不做了呗。为啥叫国内国际双循环？你没看新闻吗？我们对外贸依赖越来越小。当年做外贸是因为国内极度缺资本，得上国际挣硬通货；现在我们不缺资本了，开始输出资本。一个输出资本的国家要外汇干嘛？美国不做出口，它怎么了？你形成路径依赖，好像不出口就完了。我们国家人口加起来比整个欧美发达国家市场还大，我们自己就是国际贸易。从外向型为主转向双循环，不是一年两年能解决的，但策略是明确的。你别一提\"庙堂\"就觉得不如你。庙堂里多少九八五、二一一、双一流毕业的人聚一块儿？你上学时都没鬼过这帮人。别用自己的生活经验思考宏观问题——你现在存款都装不下了，怎么叫没钱？\n\n## 十一、社会福利、欧美福利与历史来源\n\n我们国家的养老水平是好的。你问韩国、日本、新加坡，老人光靠退休金能不能生活？日本、韩国很多老人还在工作——有人说人家有敬业精神，其实是不工作养活不起自己。咱们老头老太太天天跳广场舞、走南闯北旅游，全靠老头老太太支撑。很多人对现状还停留在僵化看法上。基础设施和社会福利这一块，中国做得非常好。别听风就是雨，说年轻人钱都给老年人了——你去国外工作一下，看一年交多少税。我们社会福利不敢说最好，比北欧、美国可能还差，但比日本、韩国、东南亚好得多。接下来该操心的是欧盟经济是否可持续、高福利是否可持续——年轻人找个五千的工作都不容易。\n\n欧美福利到现在也没花完——比如美国，福利体现在土地上：当年跑到那儿把人杀了，土地弄过来，这福利至今没花完。所以美国农产品、养殖这么便宜，因为有巨大土地福利。美国能维持如此复杂、互相制约的低效率行政体系，是因为包袱少。北欧很多国家也是\"抢劫福利\"。加上一点：二战后欧洲大部分防务开支由美国承担。特朗普说北约是美国花钱保护你、你们啥也不干，所以你们钱挣了都花，军费由美国出。欧洲人包括特朗普、万斯、马斯克，为什么对欧洲很有微词？因为欧洲把资本都转嫁到美国身上，自己天天搞意识形态——今天保护这个动物，明天保护那个动物，净扯没用的。\n\n## 十二、特朗普、审美与成平日久\n\n在这方面，我认为特朗普是个男子汉、正常人。特朗普那些官员，起码女人出来都长得好看，这一点我赞成。去不去罗利岛是另外一回事，那算啥事儿？那是现代政治的产物。你了解了解\"扬州瘦马\"就知道，历史上这行当最古老，算啥阴暗面？澳大利亚都有妓院上市公司。你多读点历史，这算什么事？我小时候受的教育是\"逼良为娼\"，等我长大才发现，几乎没有一个是被逼的，都是主动自愿的。那叫什么阴暗面啊？那是社会正常的表现。天下承平日久的时候，人们就把以前一些东西慢慢淡忘了。\n\n俄乌战争刚开始，乌克兰老太太拦住俄罗斯坦克骂士兵，这就是成平日久的表现——你已经不知道战争残酷了。当年苏联老太太骂德军，直接一枪完事，有啥可骂的？战争刚开始，采访全说没水没电、没供暖，多不方便。我说你该操心的是还有没有命，扯没水没电干嘛？今天成平日久，人们把社会残酷都忘了。我们国家现在可以说是全世界最安全的地方，大家都认为理所应当。我小时候治安也不好，东西放哪儿都丢；现在几乎路不拾遗，快递随便扔没人琢磨。没人觉得这是我们努力的结果，都当理所应当。老外看到中国快递乱扔，反而惊讶于治安好，才知道全世界不全如此。今天高铁去哪儿都方便，当年去北京坐十二小时火车，现在一个多小时。你认为理所应当，但这些来得不容易。\n\n## 十三、欧洲隐私文化的根源\n\n欧洲人那么强调隐私和自由，为什么呢？我考大家：为什么欧洲人这么反感摄像头、这么强调隐私和自由？为什么有\"风能进、雨能进、国王不能进\"的口号？为什么中国人对这事儿不怎么在乎？有人说\"奴性\"，你告诉我奴性怎么产生的？欧洲历史是一段非常黑暗的历史，传承自罗马奴隶制。希腊也是奴隶制——为什么有光辉文化？因为有奴隶制，奴隶主阶层吃饱了没事干，去搞科学研究、艺术创作。欧洲文化不是人本主义的，一部分人的自由建立在另一部分被奴役基础上。不可能有一部分人特闲、去搞科学艺术，另一部分人不多干活。所以有上层对下层的极端压榨。罗马的角斗场，是把人当人看吗？上层聚一块儿看人杀人玩儿，那不是辉煌，是耻辱。欧洲历史上对下层的压榨到了极点，没有谦意，完全建立在生物学基础上，是纯粹的生物的快感，没经过人文处理。\n\n中国古代也有奴隶，但地位不像欧美压榨那么厉害。《红楼梦》里的丫鬟有卖身契，但很少受欧洲那种压榨——我们有从春秋就产生的统治文化，奴隶主怎么对待奴隶都有行为规范，再大的权利也不能随便干。《勇敢的心》里苏格兰女孩出嫁，英格兰贵族有\"初夜权\"，这在中国不可思议；欧洲司空见惯。为什么中国没有？因为我们有\"民为贵、社稷次之、君为轻\"的统治文化，遭灾时政府得出去抢险救灾。\n\n欧洲的底层压榨是你不可想象的，到今天也一样。罗利岛事件在欧洲人看来，就已经有违人伦了——欧美根本不懂什么叫人伦。你看动作片就能感觉到，他们纯生物的那层品质没脱离太多。一旦产生阶级差异，他们一般没有自谦的想法——掌握生杀大权，就折磨你无所不用其极。但在中国不行，再大的老板对下属也不能那样。欧美下层受压榨太重，资产阶级革命时对封建贵族非常警惕，怕隐私再被侵犯、又回到当奴隶的状态。所以老百姓对隐私、自由、权利看得比中国重得多，不相信政府——历史上被政府欺负怕了。而中国封建时代总的来说坚持人本主义，再混蛋的皇帝，遭灾也得去救。所以中国老百姓养成遇事找政府的习惯，欧美老百姓最不相信政府。这文化差异是由文化造成的。所以中国的老百姓能在街上跟警察顶嘴、吵架、扇嘴巴子，欧美没几个敢的。我们的军队叫子弟兵。这些事你们都得想想，不要认为一切理所应当。我们文化里慎独、自谦、法的谦抑性，都刻在骨子里。现在又有人嘲讽满清、嘲讽历史，多读点历史书——不光中国的，外国的也得读，知道怎么演进到今天。有人一说英国大宪章如何如何资产阶级革命，那大宪章跟资产阶级革命有屁关系？那是诸侯制约国王权力的分权，跟老百姓有屁关系？西方历史很灿烂，但别听唯史论。现实就是这么来的，不评价好坏。你别人云亦云，坚持自己思考，搞清楚根源在哪儿，这得通过阅读。\n\n## 十四、阅读与书房\n\n阅读，不论投资还是做人，都是生活必须的。我发现很多朋友家里居然没有书房，会感到奇怪。我倡导：无论多大房子，必须有一间书房，大小不论；包括有未成年孩子，对教育也非常重要。看书应该成为吃饭睡觉之外唯一最重要的需求。最好有单独书房。我现在眼睛花了，也用电子阅读，但有未成年孩子还是得看纸质书，关键是养成阅读习惯——读什么不重要，爱看三国演义、西游记也行。年轻人听我的，不管多大房子一定要有个书房；没条件就有个读书角落。我每回买房子都要有书房，后来老了不怎么念书，书房兼茶室。睡前每天看几页书，不看书就像差了点什么。我看的书相当杂：小说、历史、财经、投资、法律，天文地理都看。年轻人别只刷短视频，沉下心读本书，眼界不一样。今天讲的有色、秦史、量子、日元，看似散，其实都指向一件事：用底层逻辑看世界，别被表象和宏大叙事带跑。\n\n## 十五、下播告别\n\n好了，两个小时了，我要下播了。大家又陪了我一下午。如果还能这样聊天，就可以陪大家聊。今天就这样了，下播了。点赞太少了，谢谢大家陪我聊天。我能坚持俩小时，正常考核应该是四小时，我实在说不了恁长时间。谢谢谢谢大家。\n\n由 bilibili-transcript skill 生成 · 白底阅读版","toc":["一、拉黑、认知层次与博弈本质","二、芈月与秦史","三、年轻与无限可能","四、公务员与土地财政","五、借钱的风险逻辑","六、科技套牢与确定性","七、市场的博弈本质","八、概率、三体与不可预测","九、日元汇率与日本死局","十、人民币升值与双循环","十一、社会福利、欧美福利与历史来源","十二、特朗普、审美与成平日久","十三、欧洲隐私文化的根源","十四、阅读与书房","十五、下播告别"],"url":"https://www.bilibili.com/opus/1237813805254180868","bv":"","minutes":0,"chars":8739},"ai":{"title":"老木匠·2026年8月6日：市场不可预测，只能求确定性","text":"## 一、为什么「有风险」总被人听成「明天要跌」\n\n1. 「有风险」和「看空」是两回事，但很多人自动翻译错了\n\n他说自己只要一提示「市场有风险」，很多人脑子里会自动翻译成「你看空，而且是明天就要跌」——这完全是两个概念被混在一起了。他吐槽说，只要今天一涨，这些人又觉得「行了」，却不去想一个关键问题：涨这两天，你回本了吗？你能卖出去吗？如果不能，那涨跌其实跟你没关系，「人家还在继续狩猎」。\n\n2. 低认知的人很难被说服，尽量少纠缠\n\n他提到一个现象：有些人一旦听到超出自己认知范围的事，第一反应不是「我先了解一下」，而是直接反驳、怀疑，把这件事「赶出去」，好像不听、不信，这件事就没发生过一样。他把这个类比成古代「杀掉报信人」的心理——没有坏消息，就还能维持原来的幻觉。他说这种认知层次不同的人很难被说服，尽量少接触、少纠缠。\n\n## 二、渣男式反复拉扯：为什么你从44拿到24、从三百多拿到七十多都没跑\n\n1. 反复的拉扯，是为了让套牢的人「跑不了」\n\n他直接点出了一个扎心的现象：为什么在某个有色金属标的上，能有人从44块一路拿到24块；在某只知名白酒标的上，能有人从三百多块拿到七十多块？他说，这不是没机会跑，而是每次想跑的时候，行情就给你一点「幻想」——一点点反弹，让你觉得「要反转了」，于是又继续拿着。这跟反复的高位震荡是一个道理：上面被扣住的筹码跑不了，下面还有抱着幻想的资金不断进来接盘。(装逼说法：叫做路径依赖；使用说法：惯性思维。）\n\n2. 比方：渣男分手时的套路——玫瑰、下跪、决心书\n\n他打了个特别形象的比方：\n\n渣男要分手的时候，又是送玫瑰，又是下跪，又是去你单位门口拉条幅表决心，又是写决心书，又是去找你父母。最后你原谅他了，下回他还是那样，最终你就错过了最好的分手时机，用一辈子的眼泪来偿还这件事。\n\n他说，渣男第一次犯错误的时候就应该分手，不要有任何幻想；投资也是同样的道理，一个标的第一次让你意识到不对劲的时候，就是该止损的信号，别指望它会「改」。\n\n## 三、别被「故事」忽悠——芈月的比方\n\n1. 很多热门标的的「故事」，跟睁眼说瞎话没什么区别\n\n他借着聊芈月的话题打了个比方：芈月在史书（剧情设定）里跟义渠王私通怀孕，却在朝堂上编了个「仙王入梦」的故事来自圆其说。他说，现在很多热门标的讲的那些「稀缺资源」「改变人类的革命」之类的故事，性质跟这个差不多，「你还合计它有多高，别太当真」。\n\n## 四、不同阶段该用什么打法：年轻搏赔率，年纪大了求胜率\n\n1. 年轻本金少的时候，可以尝试各种打法，包括追涨杀跌\n\n他说，年轻、资金量小的时候，可以随便尝试各种风格，追涨杀跌都可以试——大不了亏了从头再来。但年龄大了、本金多了之后，就应该逐渐转向追求胜率更高、更稳的打法，而不是继续追求高赔率、高波动的机会。他把这个类比成人生的不同阶段：年轻时应该「鲜衣怒马」，多尝试、多经历，但年纪大了就该逐渐沉淀下来，追求稳定。\n\n2. 唯一的底线：不管尝试什么，必须保证本金还在\n\n他反复强调一点：不管年轻时怎么折腾，唯一不能碰的底线是本金归零，「你可以尝试无数种可能性，但这些可能性不包括作死」。投资也是同理：进场前五年，你最主要的目标不是赚钱，而是五年后还能留在这个市场里——「你前五年越想赚钱，最后往往亏得越多」。\n\n3. 他不赞成一进场就「买入持有吃股息」，那是把自己的可能性提前锁死\n\n他说自己现在确实是偏保守、买入持有吃股息的打法，但这是因为他判断当前市场风险比较大，属于特殊阶段的选择——从今年1月开始，他给自己定的目标就是「不亏」。但他不建议刚入市的年轻人也这么做，因为你还没尝试过其他风格，根本不知道哪种打法更适合自己，过早把自己锁死在一种模式里并不好。\n\n## 五、浮亏不重要，会不会变成永久性亏损才重要\n\n1. 套住不是问题，套住之后回不来才是问题\n\n他坦言自己最近也被套住了，前两天还有6个点的浮盈，现在基本打平。他说：\n\n套与不套这件事儿并不重要，套就是浮亏，但问题在于你的浮亏是否会变成永久性亏损，这才是一个非常关键的地方。\n\n## 六、确定性怎么判断\n\n1. 能预见的确定性上涨才能赚钱，事后看涨了十倍没有意义\n\n他说，上涨不一定能赚钱，只有你能提前预见到的确定性上涨才能赚钱。你不能因为回头看某个标的涨了十倍，就觉得当初该买——因为涨之前你根本不知道它能涨十倍，这跟买彩票中了奖号码没什么区别，事后诸葛亮没有意义。\n\n2. 哪怕只有10%的确定性上涨，也比赌百倍的不确定机会强\n\n他说，你能提前判断出「这个标的一年内大概率能涨10%」，这就已经很厉害了，比找一个「说不定能涨百倍」但完全没把握的机会要靠谱得多。判断确定性最简单的例子就是银行定期存款——你把钱存进去，从来没人今天存明天就取，因为你知道到期一定有确定的利息，这就是确定性；投资一只标的也是一样的道理，你得先给自己找到这种「主观上确认」的确定性，而不是老想着折腾。\n\n## 七、风险的比方：邻居家孩子在玩炸弹\n\n1. 风险不是不存在，而是还没爆——但不知道什么时候会爆\n\n他用了一个挺生动的比方，来解释自己为什么从年初的满仓满融变成现在清空融资：\n\n你相当于邻居的小孩儿现在天天在玩儿火，本来玩玩鞭炮也就算了，可现在这些小孩玩的是炸弹，扔来扔去跟玩篮球一样。我哪知道他哪天会炸，但我知道这么玩下去，我根本睡不着觉。\n\n他说，风险的存在跟这个标的本身涨没涨没有直接关系——你没涨，也可能有风险；你没风险，隔壁那个「熊孩子」也可能有风险。这几天这种反复拉扯的走势，反而让他更担心，因为「本来这些小孩都玩累了，结果又有人在旁边继续鼓励」，风险没有被释放，反而在被放大。他判断，未来这种大幅波动会成为常态，就像当年那只有色金属标的反复抽风一样。\n\n## 八、反对把市场「拟人化」——线是博弈出来的，不是画出来的\n\n1. 「主力今天想拉升」这种说法，基础逻辑就有问题\n\n他再次强调自己一贯的观点：把市场想象成有一个单一的「主力」在操控涨跌，这种拟人化的描述是不对的。他说：\n\n你只要一听到有人说『主力今天应该拉升』『主力今天就想砸盘让大家进小灯』，你就可以断定这个人的基础逻辑有问题，不用再听了。\n\n他说，市场里的大机构也不止一个，他们彼此之间也在博弈，没有人能单方面决定涨跌。为什么卖着卖着又开始涨了？因为卖到一定程度发现卖不动了、再卖价格会崩得太厉害，于是停止卖出，下面的买盘就把价格顶起来了——\n\n线不是画的，线是博弈出来的。\n\n2. 市场的结果不是任何人设计的，是所有人理性决策碰撞出来的\n\n他说，市场里每个人的决策，从他自己的角度出发都是理性的，所有这些理性决策碰撞在一起，最终形成的结果不是任何一个人事先设计好的。凡是有人说「国家应该把市场设计成什么样子」，这种说法也是不成立的——如果市场是被设计的，那历史上的股灾也应该是被设计出来的，但显然没有哪一次下跌是「国家主导」的结果。\n\n## 九、市场的本质是概率，不是宿命——量子力学的比方\n\n1. 明天的市场没人能判断，只能判断当下的安全边际\n\n他说，对于明天的市场，谁都判断不了，能判断的只是「按现在这个价格交易，安全边际有多少」，而且这也是一个概率化的判断。至于那些信誓旦旦讲「多少点是支撑位、多少点是阻力位」的人，他说这些话「都是扯淡」，把这些人的历史发言录下来回看，基本没有一次是准的。\n\n2. 市场是统计出来的结果，换个时间重新来一遍都不会是同一个结果\n\n他打了个物理学的比方来说明市场的不可预测性：\n\n如果把今天的数据取消，明天重新在昨天的基础上重新开盘，结果都不一定是今天这个样子——这就跟量子力学里薛定谔的猫一样，你打开盒子的那一刹那，观察者对观察对象是有影响的，世界的本质就是概率化的。\n\n他还提到「三体问题」：即便知道三个星体的初始位置和运动轨迹，理论上似乎可以按牛顿力学计算出它们未来任意时刻的位置，但实际上三体系统对初始条件极度敏感，任何微小的扰动都会导致结果发生巨大变化，所以根本无法长期预测——市场也是类似的道理，任何一点点变化都可能让明天完全不同于今天的推演。\n\n## 十、日元汇率：还是那个「死局」判断\n\n1. 日元汇率又开始走高，华尔街认为下一场危机会从日本引爆\n\n他提醒大家关注日元汇率，说现在又回到157以上，用不了多久可能到158。他提到很多华尔街投资人认为，未来点燃全球金融危机的引信很可能在日本——除非日元能像当年的俄罗斯一样接受一次性贬值，否则这个局解不开。\n\n2. 一次性贬值代价太大，日本很难甘心接受\n\n他解释说，日元如果不接受一次性贬值，那这个局就是死局；但如果真的一次性贬值，日本老百姓的财富相当于直接归零，参考委内瑞拉、津巴布韦、阿根廷这些一次性大幅贬值国家的结局，这个代价日本很难甘心承受。\n\n3. 美国财长的说法他不认同：现在真正的压力是人民币升值，不是贬值\n\n他提到美国财长贝森特的说法——干预日元汇率是担心引发亚洲货币竞相贬值。他对此并不认同：\n\n现在日元贬值影响不了亚洲货币，日本在亚洲已经没有以前那么重要了。真正的压力是我们现在还在升值，如果不去压制的话，人民币早就升上天了——大量外汇正在流入中国，这才是现实。\n\n他重申了自己多年的观点：长期看人民币一定是升值的，这是他一直坚持的判断；至于短期汇率走势，包括日元在内，都是「更混沌」的，很难预测——只有当汇率长期被人为控制、偏离市场水平的时候，才有比较确定的回归方向可以判断（比如日元长期人为维持强势后终将向真实价值回归），一旦完全交给市场决定，短期涨跌就没法预测了。\n\n4. 港币未来大概率会跟人民币挂钩，是人民币的「天然稳定币」\n\n他提到一个观点：港币现在跟美元挂钩，但他估计未来会逐步转向跟人民币挂钩。他把香港的外汇缓冲机制类比成人民币「天然的稳定币」——我们已经有这样一个外汇缓冲区，只是现在还没有真正用起来。","toc":["一、为什么「有风险」总被人听成「明天要跌」","二、渣男式反复拉扯：为什么你从44拿到24、从三百多拿到七十多都没跑","三、别被「故事」忽悠——芈月的比方","四、不同阶段该用什么打法：年轻搏赔率，年纪大了求胜率","五、浮亏不重要，会不会变成永久性亏损才重要","六、确定性怎么判断","七、风险的比方：邻居家孩子在玩炸弹","八、反对把市场「拟人化」——线是博弈出来的，不是画出来的","九、市场的本质是概率，不是宿命——量子力学的比方","十、日元汇率：还是那个「死局」判断"],"url":"https://xueqiu.com/2573414707/404385071","chars":4054},"topics":["市场不可预测，只能求确定性"]},{"date":"2026-08-05","bili":{"title":"老木匠2026年8月5日直播内容总结","text":"@买股票的老木匠 ​\n\n市场 · 财经\n\n光模块放量怎么看\n\n今天光模块的成交量急剧放大。如果没有昨天的消息，跌这么多不可能有这么大的量。大家这些天成熟得很快，因为我趁没事把很多东西讲得很细。\n\n所谓\"出货\"只是个形象化说法，不能理解成\"有一个人正在出货\"。市场里的优势交易者不止一个，他们之间也在博弈，甚至彼此会有信息勾兑，但约束力很弱。所以巨额成交本质上是博弈的结果，不是某个主体的意志。\n\n巨量一定代表巨额换手，但不必然是出货，也可能是吃货。到底是哪个，要结合位置、运行态势、前期涨跌幅来判断。一般规律是：高位放量多为派发，低位放量多为吸货。今天早盘冲进去的又是一批人，昨天冲进去的大多已经埋得很深。\n\n怎么看老骗子的套路\n\n一个经验丰富的老骗子在你面前露出破绽，而且破绽已经被你发现——此时你该想的不是自己多聪明，而是：这个破绽背后是不是藏着更大的骗局？魔术师变戏法时也常故意露破绽吸引注意力，等你盯住\"破绽\"时，他正在暗度陈仓。\n\n这就是\"第二层次思维\"：别人发现一个便宜就觉得自己天选之子、捡了大漏，其实要多长个心眼。\n\n相亲也是同理——一个各方面优秀的姑娘死心塌地要跟你，你条件又不怎么样，就该想想是不是有问题，比如很快就要当爹了。相亲是认识自己最好的方式：看到对方那刻，你就知道自己在介绍人眼里是个什么水平。\n\n投资也一样。你突然觉得捡了大便宜，很可能捡的是雷。一哥开盘一小时成交四百四十亿，太漂亮也别得意，要想想有没有别的问题。\n\n博傻游戏与最后一棒\n\n博傻游戏里，没事就回头看看后面还有没有人排着你。如果你排在队尾，基本就是最后一棒，就别参与了。今天的博弈非常激烈，只要在昨天说的关键位置之下，想卖的人都是安全的，可以随便玩，只要别让昨天被套的那些人跑掉就行。\n\n所谓\"博弈向好的方向发展\"是个伪命题——博弈的两个参与者方向一定相反，哪来的共同\"好方向\"？昨天追高的割没割肉，现在还看不出来。\n\n高位别亏掉本金\n\n这段时间大家一定要控制风险。第一，别在市场的波动中被淘汰出局；第二，别在高位品种上造成永久性本金损失，该止损就止损。买什么你自己定，但我只提示这两个最危险的地方。\n\n日元的问题远远没有结束，不是一天半天能过去的，连上帝出手都救不了。大幅下跌之后，必须缩量走平才算稳。\n\n主力运作的三个阶段\n\n大幅波动一定有优势投资者在通过影响价格赚差价。他们的典型节奏是：\n\n低位横盘时慢慢买入，量很大，但不能让价格上涨，所以表现为平盘缩量，这个阶段会持续很久。\n\n平盘结束、开始拉升，往往意味着买入量已经够了；拉升过程中他们会继续买，量越来越大，跟风盘也涌进来，表现得很活跃。上涨时会有抖动——涨太快就卖一点，回调再拉，目的是不让自己的筹码越积越多，成本变化不大。\n\n等故事来了（稀缺资源、改变人类、供不应求、签大合同），配合价格影响快速拉升，但主力在最后一波上涨中已经开始减仓。减多了价格就掉，于是大家停手不卖，跟风盘再把价格顶起来，期间再回补一点，表现为高位反复震荡——这个过程就是让筹码越来越少。少到一定程度，股价开始往下走，下一波人想再来拉，可能性很小，因为新来的人也得重走\"低位横盘\"的老路。\n\n所以它会跌很久、跌出空间、再横盘很久才来下一波，否则就是给上一波接盘。也有两波人接力的例外，比如公司基本面发生重大变化，但周期性行业基本不会这样。尾部时无论怎么分析都很便宜却还在跌，因为人家两年前就知道这个结果了——就像当年的券商，怎么分析都没投资价值，却已经开始有人买了；光伏全行业亏损，有色供需微观没问题，最大变量来自美联储甚至日本央行。\n\n周期股的高低位逻辑\n\n周期本质是供需错配，时间会修复错配。低位持续时间越长越是利好——供给会缩减，离反转越近；高位持续时间越长越是利空——供给会增加出来。\n\n以铜为例：高价持续久了，一来会刺激矿山勘探开发，让原本不经济的贫矿有了价值，供应量增加；二来在需求端催生替代（铝代铜），需求边际减少。矿主只会趁高价猛挖快卖，不会囤积。集装箱船高价持续很久，集运高景气还能撑多久？煤炭龙头的高估值靠政策（供给侧改革关了小矿，不是煤不够挖）；电解铝有产能上限，放开上限全世界铝价立刻跌。油运刚进高景气，集运从 2021 年火到现在。\n\n做T只是辅助\n\n做T原则就一句话：先卖后买，如果买不回来，这个位置当减仓也能接受；先买后卖，这个位置买入可以不出、当加仓也行。高位用先卖后买，T飞了就当减仓；低位用先买后卖，买进了卖不出就当加仓。\n\n做T千万不能为了T而T。没有容错空间的T毫无意义，它只是锦上添花，基本不是利润来源，大利润不能靠做T。全仓做T就成了短线交易，你玩得过量化吗？机会不多，大部分时间是在等待。追求的是确定性，而确定性不常出现，所以别硬做，尤其不能用手痒去做。\n\n从ETF看神秘资金\n\n很多人不知道怎么观察神秘资金的身影——把宽基ETF打出来看就行：科创50、上证50、创业板、沪深300，这些ETF里有一些是神秘资金专门在用的，买入时量变化非常突兀，放量拉升很多。今天科创成长、科创50这些ETF场内都明显放量，放量比达到昨天的两倍，就能判断是谁在买。今天在科创上\"踩油门\"很正常，必须防止正反馈恶化。\n\n但别指望神秘资金来给你解套、让昨天冲进去的人跑掉，可能性不大。这种跌在逻辑外、涨也在逻辑外的市场，参与性价比不高，因为你根本不知道明天特朗普又说什么、我们怎么应对。\n\n反转还是反弹只看概率\n\n反转反弹我判断不了。所谓反转是今天涨明天还涨，反弹是今天涨明天不涨——这本质是对明天涨跌的判断，我做不到。我只能说未来涨的概率大还是跌的概率大。今天博弈激烈，是看戏的好时光。昨天冲进去的人，走不甘心、不走胆突的，正是\"危墙之下\"的典型。\n\n买入要有韧性\n\n高位、大量获利盘的东西相当于一个不稳定平衡，稍微一个外力就完了；低位、有业绩支撑、极度低估的东西相当于稳定平衡，波动后会回归。今天的下跌不是因为对岸有什么消息，是因为平衡本身不稳。\n\n这个位置，你买入的东西必须有韧性——它下来时你敢坚持、甚至敢再买。现在很多人想的是跑还是不跑、割肉跑还是回本跑。上面套牢盘都被锁死了，跑很难，能跑的确实成熟。卖出是件极难的事，所以你该提前有一套卖出计划，而不是临时慌乱。\n\n伪科技没有真护城河\n\n现在当红的大部分都是伪科技，一年研发支出没多少就给自己贴上科技标签。真正的科技会被别人制裁吗？谁能制裁英伟达、阿斯麦？都是人家制裁别人。你说的科技不可替代，却老被制裁，那护城河在哪儿？\n\n提醒一句：告诉你某个东西有风险，不代表它明天就跌，而是说真跌到那个位置，你敢增仓吗？不敢就得止损。这才是\"有风险\"的真实含义。\n\n有色看美联储政策\n\n有人问有色能不能回到年初高点，这取决于美联储货币政策。今天有美联储理事发言仍偏强硬——若不继续宽松，周期股就很难。逻辑很简单：周期股高位持续越久越利空，低位持续越久越利好，因为时间会修复供需错配。\n\n医药看老龄化\n\n最近有个新闻说门诊量持续减少，很多人归因为集采、医保支出，其实不是——是这些年看病的老人在减少。1959-1961 是出生低峰，这批人刚进 65 岁（看病高峰）；从 1962 年出生高峰回升，到 1963 年那批 2028 年进 65 岁，需要看病的老人会急剧增加、且一年比一年多。\n\n医药是长周期投资，不是今天投明天涨。现在医药里能找到低估值的东西，因为大家都不看好，跟 2024 年的券商一样。创新药不确定性高，研发风险大，二级市场投资都像赌博。今天指数都拉红了。\n\n有业绩就不是白龙马\n\n我一直好奇科技最后怎么收场。白龙马（指无业绩纯炒作）的结局到不了，很多优质公司、有业绩的不会有白龙马的下场。也许我杞人忧天，但这么大的风险我不会参与。你说出天花乱坠我也不参与——市场活跃对我也有好处，但我不需要为宏大叙事做贡献。\n\n今年收益预期要保守\n\n适合我的模式不一定适合你们。我每年如果能挣 15% 就已经非常高兴，虽然历史复合收益率更高，但那不是我追求的目标，只能算运气好。这两天回撤厉害，现在大概在成本附近。从今年起我才追求稳定，因为市况风险很大——以前也带融资，现在不敢。\n\n全世界的 risk 都在急剧累积。我一直说纳斯达克危如累卵，但究竟能垒多高我不知道；累卵的东西，一旦崩塌非常快，2008 年就是例子，根本不给你时间出。所以你的组合必须有一定韧性。明天后天会很好，但大部分人活不到明天——你今晚就可能完了。做投资不能老提现，不断提现是小散户玩法，那巴菲特的钱到不了今天。\n\n先保证不亏钱\n\n孙子兵法说\"先为不可胜，而后求胜\"。不亏钱这件事你自己就能定；赚钱这件事你定不了，得有傻子来接盘。你五块买的东西，为什么有人八块从你手里买走？要么他发现了价值，要么他比你还傻。我倾向第一种——买有价值的东西，等别人来发现。但什么时候被发现、被八块买走，我定不了，得等敌人配合。\n\n防风险是第一位的，无论职业还是业余。核电不适合短炒：它是长期稳定增长的标的，没有所谓\"买卖时机\"，你要炒它反而选错标的了。你问核电，只是因为它最近因政策消息涨了才想起来——年初咋不问？你每问一个问题，都要想清楚\"我为什么要问这个\"。\n\n热点别追高\n\n你们问的问题大多是标的已经被炒热了才问——海运还能买不？铜铝都炒多久了？券商你 2024 年还骂它是渣男，十月份时机就结束了。你问的时候就没有好时机了。查理·芒格说过：在一堆金块里，你非要找一根金子做的针。大飞机 C919 的产业链多长，业外人士分析得了？\n\n投资找简单机会\n\n很多东西太难，你非要研究飞机、商业航天、卫星的成本核算——那都是网络热词。巴菲特、芒格说\"投资分三类：可投资的、不可投资的、太难而无法理解的\"。卖酱油多简单？看利润就知道高估低估；旅游公司卖门票，一年卖多少、分多少，多简单。但你们非要整商业航天、大飞机。\n\n对我们小散，市场上大部分东西都\"太难、无法理解\"，因为没有专业背景。有意思的是：市场里几乎所有人都不投资自己本行业——因为了解的东西只看到缺点，不了解的才心生向往，远来的和尚会念经。所以近处没有风景。\n\n闲聊 · 生活\n\n旅游就是换个地方\n\n旅游就是跑到别人呆腻的地方呆两天。小时候说\"闯世界\"得离开家上外地，其实搁哪儿都能闯，可以闯身边的世界。很多年轻人说\"闯世界得出国\"，出国最后去餐馆端盘子——跟国内端盘子不一样吗？工资花销不同罢了。我那出国的同学，没发现比国内过得好，都是错觉。在故乡过得不好别人知道，在异乡过得不好能自己挺着，有面子问题。我哪儿都不去，每天活动范围一平方公里。\n\n牛排别讲仪式感\n\n我一般吃西冷、眼肉，菲力板腱不爱吃。牛排越简单越好，解冻回温直接煎，西冷有筋剪一剪。蘸料随便——韭菜花、腐乳、麻酱、烧烤料都行，谁规定非得黑胡椒？我喝牛排配二锅头，牛排也是尖肉。年轻时被仪式感迷惑：戴沉表、穿沉皮鞋、西装领带。其实都是装出来的，活到我这岁数就不在乎了，财富自由更不在乎。真正有钱的老板穿布鞋、电子表，打领带的全是打工的。在乎这些的都是有点钱还不是真有钱的白领。\n\n年轻人该去闯\n\n我现在一夏天就两件一样款式的背心，每天换一件掏出来就穿，不用比。你们年轻人现在就该\"一怒马\"（闯），别学我成老头。老男人有的钱你会有，老年人前列腺增生你也会增生——普通人的历程。女人也一样。我现在看花哨皮鞋就觉得沉得慌。品味靠学习和头脑、谈吐，不是穿啥带啥就有品味。我现在基本优衣库，回力也喜欢，但不带货。\n\n我就是爱聊天逗闷子，不能有任何压力。最反感装逼犯，看都市白领电视剧里演律师会计师装高端就烦——那都是乙方，一辈子没当过甲方，半夜被叫就得来，钱挣得不易。\n\n律师经历与芒格\n\n我 2007 年入市，2014 年开始职业做。律师当得还可以，但受芒格一句话破防：\"我明明比他们聪明，为什么还为他们服务，不能为自己服务？\"当事人明明蠢呵呵的还指导我写合同，我最气这个。\n\n但律师是了解社会的好窗口，相当于坐在后台看戏。律师像社会的医生——医生治自然人的病，律师诊断和治社会的病，看到的人性赤裸裸。你到五星级酒店、机场看到的都是温文尔雅的装逼范，看不到他们为争遗产说亲兄弟坏话。年轻人当几年律师很好，了解社会运转规则——大部分大学老师都不了解真实规则，显得幼稚。蔡雅琪那种律师干得比较苦。\n\n电车安全与自我设限\n\n电车安全问题最终都会解决，只是技术进步的过程——油车刚出来事故也多，出一次事故就规避一处风险，慢慢比油车还少，比飞机风险小多了。同济\"非升即走\"早该如此，讲课好不一定评得上职称，太多狗屁不通的人当了教授。\n\n我对评职称深恶痛绝。规则主观、和现实脱节。李娜、屠呦呦（连院士都不是）、黄老邪评不上职称，柯镇恶、丘处机反倒是高级职称——真正有能力的人不屑于留俗。我硕士毕业就是中级，再没评过，一篇文章不写，不影响讲课别人来听。人出生不带职称，退休了教授副教授都是老头，没区别。\n\n最坚固的牢房是\"画地为牢\"——画在自己心里。很多公务员一辈子把自己限制住了，认为子女必须进体制内、没编制就不如死。我从不让我儿子靠编制，那东西是保护也是牢笼，像自家窗户装铁栏杆，防住外人 also 防住自己。南方相对好些，现在也北方化了。\n\n专业选择与AI冲击\n\n很多孩子考大学选\"现在就业好\"的专业，我反感这个——上学不是为了就业，而且你现在看好的行业未来不一定好。我上学时工民建、建筑学最好，现在都下岗了；今天搞 AI 自动化，未来也不一定整个生涯吃香。上学提高的是改变命运的能力和终身学习的习惯。\n\n从 AI 角度，最容易被淘汰的就是白领。会计财务极容易被替代，医生诊断会是第一个被淘汰的——AI 读数据流、数据库比任何医生都大，根本不需要看片子。外科处置暂时替代不了，但诊断太简单了。律师写合同也很多靠 AI 了。所以与其学这些，不如学烙饼——那玩意替代不了。中医的望闻问切本质也是凭经验判断，反倒容易靠 AI 回归；中药是经验科学，没过双盲实验，但在 AI 下也能改善。中医和中药是两回事，这话题公开平台没法讨论，全是立场。\n\n下播\n\n我还没吃饭呢，下播了。谢谢大家陪我一上午，想听的扣 1。下回还这么白话行吗？你们爱听就行，对我来说不算啥，就是想到啥说啥。\n\n本总结由直播语音识别稿（约 2 万字）改写而成","toc":[],"url":"https://www.bilibili.com/opus/1234763193060950021","bv":"","minutes":0,"chars":5847},"ai":{"title":"老木匠·2026年8月5日：一轮行情的完整流程","text":"## 一、这轮巨量博弈该怎么看\n\n1. 出货不是「一个人在操作」，是博弈的结果\n\n他特别强调：所谓「出货」只是一个形象化的说法，市场里优势交易者也不止一个，他们彼此之间也存在博弈，不能把这个事想象成某个人在拟人化地操纵。虽然讲的时候还会用「出货」这种约定俗成的说法，但实际上都是博弈的结果，不排除有信息上的勾兑，但这种勾兑的约束力通常很弱。\n\n2. 巨量成交，究竟是吃货还是出货，得结合位置判断\n\n巨额成交一定代表巨额换手，但这换手究竟是从优势投资者手里换到散户手里，还是反过来，说不准，得结合当前位置、运行态势、前期涨跌幅来判断。他给了个大概率的经验：高位放量大概率是派发，低位放量大概率是吸货，逻辑上比较合理，但不是绝对的。\n\n3. 比方：经验丰富的老骗子露出破绽，你该多想一层\n\n他讲了个道理：\n\n一个经验丰富的老骗子，在你面前突然露出了破绽，这个破绽已经被你发现了，那么你应该想的不是自己怎么这么聪明一下就识破了他的骗术，而是应该想这个破绽背后是不是要隐藏一个更大的骗局。\n\n他还打了个魔术师的比方：魔术师变魔术时会故意露出一些破绽来吸引你的注意力，等你盯着那个破绽的时候，他其实是在暗度陈仓。这不是说什么都不能信，而是提醒大家要有「第二层次的思维」，发现一个东西别急着觉得自己特别聪明、捡了大便宜。\n\n4. 比方：相亲——好得不正常的事，要多想一层\n\n他举了个相亲的比方：如果一个各方面条件都比你优秀的人，却死心塌地要跟你，你得多想一句「是不是有什么问题」；反过来，相亲对象长得丑，你也别生气，因为那正代表着你在介绍人眼中的水平。太漂亮的时候，你也别得意，得想想是不是有其他问题——这跟投资是一个道理：突然觉得自己捡了个大便宜，很可能是捡了个雷。\n\n5. 博傻游戏：要经常回头看看，后面还有没有人排队\n\n他说，在一个博傻游戏里，你得经常回头看看后面有没有人排在你后面——如果你已经排在了最后一个，那你就别再参与了，你就是最后一棒了，还跟谁博傻？\n\n## 二、这段时间的风险提示\n\n1. 两件事最重要：别在波动中出局，别在高位造成永久性亏损\n\n他反复说：这段时间大家一定要注意风险。第一，别在市场的波动中被淘汰出局；第二，不要在高位品种上造成永久性的本金损失——高位的品种，该止损就要止损。至于具体买什么，那是自己的事，他只能提醒这两条风险。\n\n2. 日元的问题还早着呢\n\n他提醒大家：应对好波动，日元的问题远远没有结束，不是一天半天就能解决的，千万别以为日元的问题现在就已经结束了——「上帝出手都救不了，别说美国出手」。\n\n## 三、大幅下跌之后，为什么非要「缩量走平」才安全\n\n1. 完整的一轮机构建仓流程：低位横盘、缩量，是在慢慢吃货\n\n这段他讲得特别细，把一整轮机构行为的逻辑链条从头到尾捋了一遍。起点是：优势投资者资金量很大，如果想在低位买够量，就不能让价格涨起来，所以会表现为长时间的横盘和缩量——买得越慢，横盘的时间就会越长。\n\n2. 拉升阶段：吸引跟风盘，同时自己也在高买低卖控制筹码\n\n一旦横盘结束、开始拉升，往往意味着筹码已经买得差不多了。拉升过程中价格上涨会吸引跟风盘，行情变得活跃；但这时候机构自己已经在小心不再增加筹码，涨得快的时候会顺势卖出一部分，所以过程中会有反复的「拉升-回调-再拉升」的抖动。这个过程也会让机构自己的持仓成本略微抬高（因为要高买低卖去维持这个节奏），但整体成本变化不大。\n\n3. 各种「好消息」和「大故事」，往往是这个阶段的配套动作\n\n接下来就会出现各种利好故事——稀缺资源、改变人类的革命、供不应求、签大合同等等。这些消息配合价格上涨，会让价格快速拉升，而这个阶段机构其实已经在悄悄减少自己的筹码了，但不能减太快，一减价格就会掉下去，于是就表现为高位的反复震荡——卖一点、价格掉了就先停一停，甚至再投一点钱把价格顶回去，如此反复，直到手里的筹码消化得差不多了。\n\n4. 筹码减完了，行情才会真正往下走，而且往往要跌很久\n\n等到机构手里的筹码真的减到一定程度，股价才会开始真正下跌。这时候你也别指望马上有下一波资金进来接盘拉升——因为下一波资金进来也需要一段低位横盘吸筹的时间，所以通常要跌出足够的空间、横盘足够长的时间，才可能迎来下一轮行情，除非公司基本面发生了很大变化，才可能出现「两拨资金接力」的情况，但这种情况在周期性行业里很少见。\n\n5. 标的到底部时，「基本面全是渣」反而正是买点\n\n他说，走到尾部的时候，无论从宏观还是微观角度分析，这个标的看起来都很便宜，但它就是在跌——这不是你分析得不对，而是别人两年前就已经知道这个结果了。反过来，当一个行业「基本面全是渣」，怎么分析都觉得没有投资价值的时候，恰恰可能已经有人开始买入了——他举了当年的券商和现在全行业亏损的光伏做例子。\n\n## 四、怎么看周期股的高低点\n\n1. 高位持续时间越长越利空，低位持续时间越长越利好\n\n这是他讲的一个核心逻辑：周期本质上是供需错配，而时间对供需错配有修复作用。价格在高位持续得越久，就会刺激供给增加（比如高铜价会让原本没有开采价值的贫矿变得有价值，矿山会加快开采）、同时刺激需求端的替代（比如铜价高了会出现「以铝代铜」），所以持续在高位越久，反而越是利空。反过来，价格在低位持续越久，供给会逐渐收缩（比如减少养猪），也就离反转越近——但具体哪天反转，谁也判断不了。\n\n2. 举例：铜的高位、集运的高位，都符合这个逻辑\n\n他举了铜和海运集装箱的例子：铜价高位持续这么久，一方面会刺激矿山开采、勘探增加供给，一方面会在需求端造成替代，这两个因素都在往下压铜价，即便静态供需关系看着仍然「供不应求」，也不能只看静态，还得看这些动态变化。海运集运的高景气从2021年就开始了，同样持续太久本身就是风险积累的过程。\n\n3. 煤炭、电解铝的高估值，是政策决定的供给上限，不是资源不够\n\n他特别提醒：像煤炭和电解铝这类品种，价格受政策以外因素影响很大——现在的煤炭开发实际上是被人为控制的（当年供给侧改革关停了很多小矿，不是煤不够挖，是不让挖）；电解铝也是一样，是因为设定了产能上限（4500万吨），如果政策放开产能上限，全世界的铝价马上就会下来。这类品种的「稀缺性」很大程度上是政策造成的，跟真实的资源稀缺不是一回事。\n\n4. 反转的时间点没法精确判断，但风险和确定性是有方向的\n\n他打了个季节的比方：你知道冬天一定比现在冷，但你没法保证明天一定比今天冷。周期反转也是同样的道理，你可以判断「风险越来越小、确定性越来越强」这个大方向，但具体哪个季度见底，没人能精确判断。\n\n## 五、做T的原则\n\n1. 先卖后买 vs 先买后卖，各自的容错逻辑不一样\n\n他把做T的原则总结成一句话：如果是先卖后买的做法，就是说这个位置即使买不回来，把它当成减仓也能接受，这种情况下才可以做先卖后买的T；如果是先买后卖，就是说这个位置买入了即使卖不出去，把它当成加仓也能接受，这种情况下才可以做先买后卖的T。\n\n2. 做T不是为了满足「手痒」，它只是锦上添花，不是利润的主要来源\n\n他特别强调，做T千万不能为了T而T——「你没有容错空间的T是没有任何意义的」，做T的目的是增厚收益，而不是用来解决手痒的问题。如果全仓都在做T，那就已经变成短线交易了，这时候得掂量掂量自己的短线交易水平能不能玩得过量化，玩不过就别硬做。他说交易追求的是确定性，而确定性的机会并不常出现，大部分时间都是在等待——不能什么都硬做。\n\n## 六、怎么观察「神秘队」（国家队）的身影\n\n1. 看宽基ETF的成交量突变，很容易发现\n\n他说观察「神秘队」其实不难，把科创50、上证50、创业板这些宽基ETF的成交数据打出来看，神秘队买入的时候量能变化会非常突兀，比如突然放量到平时的两倍以上，这种情况就很值得留意，是场内非常容易观察到的信号。\n\n## 七、买入的东西要有「韧性」——稳定平衡 vs 不稳定平衡\n\n1. 高位大量获利盘=不稳定平衡；低位有业绩支撑=稳定平衡\n\n他打了个物理学的比方：\n\n高位的东西、大量的获利盘的东西，它就相当于一个不稳定平衡；而低位的、有业绩支撑的、极度低估的东西，它就相当于一个稳定平衡。稳定平衡也可能会发生抖动，但它会回归原来的位置；不稳定平衡，你稍微给它一个外力，它就完了。\n\n他借这个逻辑说，某一天的下跌，很多时候并不是因为出了什么具体利空，而是因为「这个平衡本来就不稳」。\n\n2. 检验标准：跌下来了，你敢不敢加仓\n\n他说，你买入的东西必须要有韧性，也就是它下跌的时候你敢坚持、甚至敢再买。这也是判断风险的真正标准：不是说「有风险」就代表明天一定会跌，而是说，等它真跌下来的时候，你敢不敢在这个位置加仓——如果不敢，那就说明你原来低估了它的风险，该止损就得止损。\n\n3. 卖出比想象中难，别老想着卖在最高点\n\n他提醒大家，卖出所有的东西都是非常难的一件事，不应该老想着「卖到多高多高」，而应该提前给自己定一个卖出的计划。\n\n## 八、「伪科技」与真正的护城河\n\n1. 真科技不会被制裁，被制裁的多是「伪科技」\n\n他说得比较直接：现在很多被追捧的科技股，谈不上有多少真正的科技含量——真正有核心技术优势的公司（比如他举的英伟达、阿斯麦），是可以去制裁别人的，而不是被别人制裁。如果一个所谓的「科技」公司天天被人卡脖子，那它所谓的技术优势、护城河到底体现在哪？\n\n2. 有风险≠明天就跌，而是「跌下来你敢不敢扛」\n\n呼应前面的观点，他再次强调：告诉你一个东西有风险，不代表它明天就会往下走；有风险的真正含义是，一旦它真的往下走了，这个位置你敢不敢加仓？如果不敢，那你就该考虑止损。\n\n## 九、你问「什么时候是好时机」的时候，好时机往往已经过去了\n\n1. 问题本身就是信号：你会问，是因为它已经被炒热了\n\n他举了个核电的例子回应提问：核电这类标的本身没有太明确的买卖时机，它是随着长期需求不断增长的品种，不适合短炒；而之所以这两天有人开始问核电，是因为国家刚好释放了「加大核电建设」的消息，核电涨了，大家才想起来问。他反问：你今年年初为什么不问核电？\n\n他说得挺直白：\n\n你应该想的是，这件事我都知道了，那还有谁不知道呢？你每问一个问题，都要想一想你为什么会在这个时间点问这个问题。\n\n他还拿有色、海运、券商举例：这些标的大家蜂拥去问「还能不能买」的时候，往往已经涨了很久了——2024年该问券商的好时机是当年10月之前大家都骂它「渣男」的时候，等到大家一致看好了再问，好时机早就过去了。\n\n## 十、别研究自己搞不懂的复杂行业\n\n1. 芒格的比方：一堆金子里，别非要找一根针\n\n对于大飞机、商业航天这类被问到的热门赛道，他直言这些产业链太复杂，不是普通投资者能研究明白的，他引用查理·芒格的话：\n\n在一个满是金块的黄金堆上，你却非要找一根黄金做成的针。\n\n他说，这种复杂产业链是网络热词式的题材，你连基本的成本核算、技术路线走向都搞不清楚，不如去研究那些简单易懂的公司——比如卖酱油的公司，看看它的利润情况就能大致判断出高估还是低估。\n\n2. 巴菲特和芒格的投资三分类法：可投资的、不可投资的、太难理解的\n\n他提到巴菲特和芒格把投资标的分成三类——可以投资的、不可以投资的、太难以理解无法理解的。他说，对普通散户而言，市场上大部分东西其实都属于「太难理解」这一类，因为普通人没有相应的专业背景。\n\n他还提醒一个现象：市场里几乎所有人都不太投资自己最熟悉的本行业——因为了解的东西看到的都是缺点，不了解的东西才容易心生向往，「远来的和尚会念经」说的就是这个道理。\n\n## 十一、医药行业里一个容易被忽视的人口周期逻辑\n\n1. 看病人数减少，不是因为集采，是因为出生率的历史低谷\n\n他提到最近门诊量在持续减少这个现象，很多人以为是集采、医保支出收紧导致的，但他认为真正的原因是：59、60、61这三年是出生的低谷期，而这批人恰好在近几年进入65岁（看病高峰年龄），所以看病的老人数量在减少。\n\n2. 从62年出生高峰开始回升，2028年后看病人数会明显增加\n\n他说，随着62年之后出生高峰逐渐进入老年阶段，尤其是63年那批人大约在2028年进入65岁，需要看病的老人数量会开始快速回升，而且是逐年增加。他强调医药是一个长周期的投资逻辑，不是今天投明天就能涨，但现在这个阶段可以在医药板块里找一些被普遍看空、估值偏低的标的——就像2024年的券商一样，大家都在讲集采、医保支出的负面因素时，往往才是估值真正被压低的时候。创新药则不确定性更高，本质上跟科技研发类似，多少带点赌博的性质。\n\n## 十二、他自己的收益目标与风险心法\n\n1. 年化15%他已经很满足，追求的不是历史最高复合收益率\n\n他说，自己每年如果能挣15%，就已经非常高兴了——虽然历史复合收益率比这个更高，但那不是他追求的目标，那更多要归结为运气好。即便某一年没赚钱，长期的复合收益率也不会因此降低太多。\n\n2. 今年他自己回撤也很厉害，但他并不在意\n\n他坦言这两天自己被回撤得比较厉害，大概处在成本线附近；前几天刚发帖说跑赢了创业板，这两天就被现实打脸了——他说这都很正常，自己也不太看重这种短期的对比。\n\n3. 从今年开始追求稳健，是因为全球风险在急剧上升\n\n他说自己以前也是带杠杆（融资）操作的，不是一直很稳健，但今年开始不敢这么做了，因为全世界的风险都在急剧积累。他反复提醒纳斯达克「危如累卵」——虽然没法判断它还能垒多高，但危如累卵的东西一旦崩塌是非常快的，参考2008年，根本不会留给你反应时间。所以现在最重要的是让自己的持仓组合具备足够的抗风险能力和韧性。\n\n4. 不要频繁提现，那不是职业投资人的做法\n\n有人问他能不能经常把赚的钱提现出来，他不赞成：\n\n做投资你不能老提现，你动不动说我把今年赚的全拿出来，那你还有啥复合收益呢？不断的提现，实际上是一个业余的玩法。\n\n他说如果巴菲特也是这么做的，他的资产不可能滚到今天这个规模。当然，如果是业余投资、自己开心就好，那怎么舒服怎么来；但如果是职业投资，防风险永远是第一位的。\n\n5. 「不亏钱」自己能决定，「赚钱」得靠别人配合\n\n他引用孙子兵法总结自己的风险观：\n\n先为不可胜，而后求胜。你不亏钱这件事是你自己就能定的，但你赚钱这件事你自己定不了，你得有人来接你的盘才行——你不可胜在己，可胜在敌。\n\n他说，自己能做的是把标的的价值研究清楚，但什么时候会有人愿意用更高的价格从他手里买走，这件事他决定不了，得等对方（市场）配合。","toc":["一、这轮巨量博弈该怎么看","二、这段时间的风险提示","三、大幅下跌之后，为什么非要「缩量走平」才安全","四、怎么看周期股的高低点","五、做T的原则","六、怎么观察「神秘队」（国家队）的身影","七、买入的东西要有「韧性」——稳定平衡 vs 不稳定平衡","八、「伪科技」与真正的护城河","九、你问「什么时候是好时机」的时候，好时机往往已经过去了","十、别研究自己搞不懂的复杂行业","十一、医药行业里一个容易被忽视的人口周期逻辑","十二、他自己的收益目标与风险心法"],"url":"https://xueqiu.com/2573414707/404385433","chars":5943},"topics":["一轮行情的完整流程"]},{"date":"2026-08-04","bili":{"title":"老木匠 2026年8月4日直播文字稿（出货逻辑、缩量非危机、量化受限、长期生存、风险偏好、江湖庙堂）","text":"## 一、日元干预只能改变贬值的速率\n\n美元干预日元，只能改变日元贬值的速率，改变不了方向。\n\n昨天我说过一个观点：美元之所以出手干预日元汇率，是怕日元加息。这个观点在当时其实非常小众，但今天已经有不少人在说了。我不能说人家是抄我的——看法一致很正常，但有些人说话的腔调明显就是我的风格，看着就挺有意思。抄不抄无所谓，我也管不了。\n\n## 二、庙堂与江湖：学院派为什么在实战中不管用\n\n我讲的这些东西，可以明确告诉大家，全都是野路子，不属于学院派。\n\n我在大学当过老师，学院派那套东西是怎么来的，我认识得非常清楚。学院派看起来非常高大上，但在真正的现实当中，不见得管用。所以我对学院派实际上是抵触的。\n\n但要注意分寸：形成基础知识的时候，你得看学院派，它讲得细致、周严、严谨，跟你上学必须学教材是一个道理。可一旦走到社会上，无论是投资决策还是工作里怎么取得成就，学院派就不见得非常管用了。\n\n原因很简单——大部分学者不怎么参加社会生活，社会上那些弯弯绕绕，很多学者压根没有认识。所以他们说出来的东西，在社会人士看来不光是不接地气，而是幼稚。\n\n这就是我说的庙堂和江湖考虑的事情永远不一样。学院派的人适合在庙堂，普通老百姓行走在江湖。\n\n现在有一种倾向，动不动就嘲笑专家，说专家什么也不懂，这个话我非常反感。专家懂得比你多得多，只是他的东西在庙堂有用，在江湖没用。这两件事完全不同。\n\n顺便纠正一个误解：真正的江湖不是港片里那种打打杀杀的黑社会。江湖比那宽广得多——唱戏的、说书的、变魔术的、历史上卖药的、各种行会组织，这都叫江湖。把江湖归结为打打杀杀，那是港片看太多了。江湖有江湖的弯弯绕绕，庙堂的人不懂江湖，这很正常。\n\n组织里还有个规律叫精英淘汰制，大学里也一样，越是不愿意东抄西抄文章的老师，越是评不上职称。真正的特立独行、真正有本事的人，在哪个组织里都不讨好。射雕里黄药师为什么最后成了黄老邪？因为他厌蠢。他哪有那个耐心，跟江南七怪坐在一块儿天天商量匡扶大宋。金庸写人性写得很准。\n\n## 三、聊天的本质是解决情绪，重复不是问题\n\n现在我知道的这点知识，大部分都已经跟大家讲了，再写也是重复，所以没什么可写的，就聊聊天。\n\n而聊天本身就是重复——昨天聊过的今天可能再聊。因为聊天的本质不是解决信息问题，是解决情绪问题，人是因为无聊才聊天的。\n\n我最反感一种聊天方式：你讲一件事，他告诉你\"这个你昨天讲过了\"。这就是不了解聊天的本质。聊天有点像听相声，扔靴子那个段子你听过多少遍了？等第二次靴子落地的时候你依然会笑。同一部戏戏迷能看一百遍，到该流泪的地方照样流泪，该鼓掌的地方照样鼓掌。这解决的是情绪，不是信息交流。\n\n世界上的知识如果不想重复，其实就那么点儿，你不可能不重复。刘纪鹏天天重复的也就那点事——T+0、一股独大、大股东减持。不让他重复，他还说啥？\n\n## 四、合规的自我约束：把行为规范划到球场那么大\n\n对大盘的预测、对个股的点评，现在都是禁忌，我只能讲讲宏观。\n\n有些东西因为没法直说，你只能自己去体会。而我要提醒大家的是：你要看到趋势，不是现在管你才叫违规，而是未来这个东西有可能违规，那你现在就得自我约束。\n\n我昨天讲过，规则是篮球那么大，你就得把自己的行为规范划到球场那么大，要不然非常容易违规，因为很多东西处在灰色地带。\n\n我为什么每天说完的那些短话全部删掉？不是怕雨晴，雨晴跟我有什么关系。一旦违规你是麻烦的，不光是关账号的问题。两年前在球q上还能做操作披露，现在球q不管你，但你自己得管自己。\n\n我赞成严格管理，现在吃相太难看，今天这么管依然有很多人在骗，所不同的是现在这些骗子反倒有资质了。你就看每天在自媒体上评价市场的那些人，把他的视频连贯看一遍：前几天还在看好科技，这两天普遍改口说\"我早就提示你风险了\"。所以那事儿不用信。\n\n## 五、来市场只有一个目的：低买高卖，别感动自己\n\n现在很多人买AI、买科技，动不动就要为AI做贡献、要参与大国博弈、要玩国运，动不动就是\"关乎人类未来\"，这些话都是扯淡。\n\n科技也好，非科技也好，老登也好，小登也好，这些都不重要。我告诉你，这些东西全是马甲、工具、道具。你真正来这个市场想做的就一件事：你怎么把别人的钱变到你手里头来。\n\n你别骗自己。别进来了以后就玩\"为科技现身\"那一套。你最初要是为科技现身来的，那你就把钱直接捐给科技公司不就完了？\n\n你不论干什么、不论买啥，最后都是一件事：想办法低买高卖，把别人的钱弄到自己手里头，这是你的唯一目的。很多人玩到最后，玩成感动自己的游戏了。很多人很难做到对自己诚实，这并不容易。\n\n## 六、出货的逻辑：主力要的是对手盘，不是价格\n\n对主力机构来说，价格没有意义，对手盘才有意义。\n\n价格对主力有什么意义？我可以无限往上拉，拉完了都在我自己手里，有啥意义？\n\n举个例子：我是二百块买的，原来就准备八百卖。我把价格拉到一千四，在一千四待一段时间，大家都换手了，你们成本都是一千四，然后我快速杀到八百。一千四进来的人，没有一个想跑。等跌到八百，有人觉得便宜了开始买。\n\n这个时候的好处是什么？一千四买的人不想卖，八百进来的新买盘只有你可以卖——因为你是二百买的，他们是一千四买的。\n\n所以出货不是\"把别人骗进来\"就行，出货既要有人来接你，还得保证没人和你一起卖。这就是所谓的缩减竞争性卖盘。\n\n套住的人没有卖出意愿了，竞争性卖盘就没了。你从逻辑上要明白：你是一个主力机构，你想卖的时候别人不卖，不代表你就能卖出去，因为买盘数量是有限的。接盘的\"傻狍子\"也是有限资源。你怎么能让你卖的时候上面那些人不卖？你就得把价格迅速打下来，让那些人全套住。套住了他就不卖了。\n\n所以为什么主力要出货的时候会迅速拉高、在高位挺一段时间？因为要在高位充分换手，让新进来的人都在高位买入，然后迅速下杀把他们都套在里面。这时候再有人来买，这些人是不会卖的。你如果再把价格拉上去，那些人也卖了，你的买盘不就消耗没了吗？\n\n拉到一千四还有人敢往里冲，这需要大量配合——舆情的配合、公司基本面的配合。你以为那么容易？你在一千四买进去的时候，半夜都能笑醒，觉得自己窃喜发现了个大金矿，只有这样你才会买，你得觉得自己占了个大便宜。\n\n反过来，他在买的时候你根本不知道：低位横盘很长时间，全是坏消息。要不然你怎么会心甘情愿在低位把筹码倒给他？\n\n就像二〇二四年我做券商的时候，你一说券商好，那感觉跟抢他家钱似的。当时全是说券商是渣男，你只要说一句券商，马上有人写出特长巨长的文章，论证券商为什么已经没有未来、永远没有未来。现在那些文章你都还能搜到。前几年要是有人开始吹黄金，我问你谁会把黄金卖给他？\n\n这就像箩筐扣鸟：下雪天扫出一块地，撒上粮食，用筐扣着，等鸟都进去吃，你一拽绳就扣住了。现在就相当于把这些鸟都扣里头了。那我问你，如果再把价格拉上去，不就相当于把筐又揭开了吗？鸟不就飞了？\n\n所以套住之后，轻易不能揭开。套住的诀窍不在于稳准狠，在于扣住以后得有很长时间干别的，得让这些鸟丧失斗志。\n\n还有个比喻叫抓猴：手里给了你一只苹果，你是不舍得扔的，你最终只有被抓住而已。今天跳起来的行情，有多少人有那个决心说\"我今天就不玩了，我出去\"？大部分猴想的是\"我必须得把苹果掏出来我再走\"。\n\n## 七、什么叫真的\"亏了\"：先想怎么活十年\n\n有人说科技今年赚了好多钱，七月一直没走，现在已经亏了。这不叫亏，这只不过是把原来赚的钱还回去，还谈不上亏。\n\n亏不是把你现在的本金亏完就算完事。你知道赌徒最后怎么倾家荡产的吗？最后回家把房子、媳妇都当了，准备最后一把翻本儿——那才叫亏了。\n\n以前有人问我进市场先干一件啥事，我说你先把房子过到别人名下。他说为啥？我说你赌红眼的时候会把房子卖了，你先把房子过到你媳妇名下，你这才叫亏了。这才到哪儿啊。\n\n你在投资市场上，进来先不用考虑赚钱的事。假如你们是因为这波上涨进来的，不是二零年以后进来的，你根本不用考虑赚多少的问题，拿着计算器给自己设定目标都没有用。你就想一件事：十年之后我还能不能在这个市场里存活。\n\n剩下的事你可以随便做，你的交易系统不一定适合我，但你一定会在随便做的过程中发现一个适合自己的系统。前提是你必须得活十年。\n\n活十年不那么容易。有的人不是亏了本金才离开市场的，是心气儿没了——你并没有亏本金，但自信心已经被磨得彻底没了，就像被训狗似的训熟了。你要做一只坚强的小强。\n\n你二零二零年进来，就争取活到三零年，然后回过头来总结市场。别进来两年，参照一个牛市赚了点钱就开始总结经验——你有啥可总结的？连家门都没出呢。你见过熊市吗？\n\n你要经过完整的两个周期都活下来，才可以开始总结经验。 否则你越是觉得自己经验充足，死得越快。因为最终你会发现，你总结的任何一个经验，最后都是用来让你赔钱的——这就是路径依赖。所有你现在感受到的、总结出来的经验、规则、模式，可能都是你未来赔钱的最根本原因。\n\n市场的理性其实很简单，能赚钱的模式就一种：低买高卖。但为什么大家都赚不着钱？因为最终大家都是高买低卖。\n\n你从低买高卖走到高买低卖，你不知道高买低卖一定会亏钱吗？我告诉你，你最终一定会高买低卖。为什么呢？因为到时候你会觉得高买是很有道理的，低卖也很有道理，并且会为了自己的高买低卖而沾沾自喜。你把这市场想得太简单了。\n\n所有你今天看到的——\"不买就错过机会\"\"人类最后一次科技革命\"——所有这些东西你看着的，都是想让你看着的。\n\n## 八、缩量不是流动性危机，跌停板才是\n\n我需要澄清一个概念：缩量不叫流动性危机。\n\n有人看缩量就说流动性危机，那是纯胡扯，根本不懂。缩量意味着上边卖的人已经变少了，哪来的流动性危机？缩量说明筹码很稳定。\n\n流动性危机是\"想卖的人卖不出去\"，它伴随着大幅下跌，然后开始缩量。跌停板才叫流动性危机。如果是温和下跌伴随缩量，说明交易非常顺畅，那是流动性降低，不叫流动性危机。如果大家都不卖了，可以一分钱都不交易，那也没有流动性危机。\n\n流动性危机一般来说是由被动卖出导致的：有人到了平仓线需要平仓，但这些仓位平不出去，那明天还得卖，于是形成正反馈。\n\n像现在这种跌一天涨两天、跌一天涨两天的抖动，没有流动性危机。这个时候你不卖，是你自己的问题，你还等谁来救你？现在市场是有效的，你卖就有人买（对小户而言）。但特别有意思的是，恰恰在这个时候他们又不舍得卖了，开始憧憬了，他们会等到下一次大幅下挫的时候才又想起来卖。这就是人性。\n\n## 九、每一次上拉都是因为出货不顺畅，洗盘只是自我安慰\n\n有人说这是\"洗盘\"。洗啥洗？人家从底下上来都赚多少钱了，还洗。\n\n\"洗盘\"是散户给自己的安慰——我不出去，他还会拉高起来。\n\n现在每一次上拉，都是因为出货不顺畅，所以会在这个地方一直波动。波动一段时间，下个台阶，再波动一段时间，再下个台阶。就这个价格他们也出不去，要能出去他们都能乐疯。\n\n你慢慢会习惯这种节奏：抽冷子来一个，然后阴几天，再抽冷子来一个。要不然下边能有人接吗？你把K线图放大到大周期来看，它就是一个很稳定的下山通路。套在上面的人越来越绝望，最后账户一关，从此再也不进，不仅自己不进，儿子也不能进，要进就打断他的腿——这就是一个轮回结束了。\n\n这就像傅老太太下楼的做法：一步一步往下挪，这样就没有流动性危机。前几天有一天我就说那天应该出手，不出手的话就容易产生问题，那就容易车毁人亡。\n\n这种不断吊着你、让你没有决心彻底砍仓走人的走法，你会永远下不了这个决心。\n\n市场离真正的惨烈还相去甚远，现在还都在做标准动作，自由动作还没做呢。你不要以为现在就是高潮了，最后还得来一个\"加尼腾月转体三百六十度平稳落地，再搁怀里变出一个大火盆\"，那才叫高潮。让你意想不到的事儿多了。\n\n现在这个市场还非常割裂，泡沫和有投资价值的同时存在，还没有出现普遍的向上。泥沙俱下现在还谈不到。我每天的心态就是看戏，看这出戏怎么收场。\n\n## 十、你就是别人：投资最终是和自己博弈\n\n人性的博弈，最终都不是和别人博弈，是和自己博弈。尤其对我们普通小投资者来说，你的筹码数量不足以影响价格和流动性，你博弈的时候根本不用考虑对手盘，你就是考虑你自己就行。但问题是很多人连自己也战胜不了。\n\n大部分人的宿命是：高了就想更高，回调了就想回到高位，套住了就想解套，最后一直到裤衩子亏没，一把割掉完事。\n\n所以为什么你一割它就开始涨了？因为你和普通人是一样的。\"别人恐惧我贪婪\"，你恐惧的时候就是别人都恐惧了，因为你就是别人，你和任何人都没有差异。所以你恐惧的时候，这事儿就快到头了；反过来说，你还没有恐惧，就说明这事儿没到头。\n\n你可以成为少数人，但那需要长期的经验、大量的学习和多次操作的积累。你现在还不是，你现在还只是会背口诀而已。\n\n所以我为什么说\"你一割它就开始涨、你一买它就开始跌\"——因为你开始贪婪的时候，大家都贪婪了。\n\n有人问我要坚持逆向投资。大哥，你只是有点转向了，就像从地库里出来分不清东南西北，你以为的逆向其实就是顺向。你得经过长期训练，建立一套正确的方向系统，知道东西南北，你才能和别人逆向。你连东南西北都不知道，你逆向个屁呀？你都是顺着大伙在走，只是以为自己是逆向。\n\n至于买完就涨，那不算进步，算你运气好。你既不要追求买完就涨，也不要认为买完就涨是你的水平。你买完以后它涨跌只是个结果，跟你最初的判断没有关系。你买完了如果它跌了，那它不就是变得更便宜了吗？那你就应该更多地买入，而不是在买的时候就开始判断明天是涨还是跌——谁也判断不了这件事。\n\n## 十一、高频量化受限后的连锁反应\n\n现在不适合做T了。量化的高频被限制以后，日内买卖基本没有意义，因为波动很小。\n\n关键在于：高频量化其实没有被限制，只是不允许有特殊的通道了。我举个例子——原来他坐高铁，你坐绿皮火车，等你到站的时候他已经到站很长时间了。虽然只快个毫秒级，但消息的前后序列是不变的，尤其突发消息出现的时候，你准备买进去，他已经在高位挂好卖单了。\n\n所以他的信息优势不是内幕交易，而是他知道了以后跑得快。现在特殊通道取消，大家都坐绿皮火车了，那他凭什么有确定性战胜你？他就不做了。\n\n那问题来了：他不做了，留的底仓还有用没？高频量化才有T+0的需求，需要底仓；非高频量化做波段的，要什么底仓？T+0做不了了，底仓留着有什么用？不得卖吗？所以谁来接这部分底仓？\n\n你原来的经验是建立在有高频日内量化的基础上的。 你以前会发现在低点买，一定能在高点卖——那是因为有量化在那给你做盘。现在你会发现，你在低点买的根本卖不出去，因为它没有波动。所以我昨天说，你所形成的一些经验最后都会失效。\n\n这套逻辑往下推还有一层：日内量化实际上相当于做市商，它赚所有交易人的钱，但也作为所有交易人的对手盘提供了流动性。流动性高的时候市场才会有溢价，流动性低的时候市场要重新估值，溢价就会下调。\n\n所以你未来会看到市场阴很长时间，除非有外力干预，否则会达到一个新的动态平衡。你现在正处在一个估值调整的过程中，这个调整是由日内成交量紧缩带来的。\n\n再往下还有一层：前一阶段的流动性溢价实际上是结构性的。有的标的每天成交四五百亿，占市场成交量的百分之十、二十，其他的成交量都被抽干了。这是由量化日内交易偏好造成的——它就在那几只有散户基础的里面做，没有成交量你怎么做日内波动？所以那些被抽血的标的，反倒给能做量化的人更加抽血。\n\n现在开始回归常态了。你不能做日内了，就得做大波段，结构性就会均值回归。所以你会看到有些原来不动的东西反倒开始上涨。整体的成交量会越来越少，但原来被压榨的那一部分成交量反倒会恢复。\n\n我不反对限制量化，鼓励量化对我来说也无所谓。有量化的时候有量化的玩法，没量化有没量化的玩法。你不用一输了就说\"是量化的原因\"，然后开始找刘纪鹏。我跟你讲，过两天没量化了你还输，那我问你再找谁？\n\n## 十二、草地、斑马与狮子：你的盈亏由食物链位置决定\n\n昨天我写了个帖子，用非洲草原打比方：狮子少的时候，猎狗就会多。斑马不会因为狮子少了种群就增加，斑马的种群跟草地有关，取决于有多少草。你把狮子都消灭了，猎狗马上就繁殖起来，斑马每天损失的量还是那样。这就是一个动态平衡。\n\n对应到市场：你亏多少钱，取决于散户整体一共带来多少钱，跟这个钱让谁赚走了没有关系。\n\n最恨量化的是游资。量化实际上增加了整个市场的交易摩擦成本，它被赚走的钱相当于摩擦成本。你如果不做短线，高频日内量化对你其实没有影响，它同时也增加了机构建仓和出货的成本。\n\n散户被割韭菜，是由食物链的地位决定的。生物界的食物链：草地、食草动物（斑马角马羚羊）、食肉动物（猎狗狮子）、食腐动物（秃鹫）。哪一级别少了，下一级就会补上，斑马不会增加——斑马增加了草地受得了吗？\n\n草地就是散户一共带来的钱。盈亏比例是固定的，比如百分之九十的人亏损，一共亏掉百分之九十的钱，这些钱都亏完了，这波牛市就完事了。这跟你被谁赚走没啥关系。草地能增加吗？能——多打工多赚钱，多送点外卖，草地就增加了。\n\n你现在亏的只是市场上账面的钱，你家里还有钱呢，还有房子有地，都还没卖呢。\n\n## 十三、盈亏同源：年初赚百分百的人不合格\n\n今年年初我说过一句话，被很多人嘲笑：今年上半年如果你获得超高收益率，你就不是一个合格的投资者。\n\n所谓超高收益率，就是百分之百甚至更高的那种。你上半年赚了百分之一百，你一定不合格，因为你承担了过高的风险。\n\n道理很简单，当时有人嘲笑我：我挣钱了怎么还不合格呢？因为你不了解市场的风险。你现在可以做一个调查：今年上半年挣百分之一百的人，现在大部分利润都已经回吐得差不多了。而且我不认为这就是结束——他们不会利润回吐得差不多就完事，这就跟去赌场赌博赢过一次一样。你知道现在有多少人准备卖房子卖地加哈了？\n\n你上半年赚个百分之三十，这都
