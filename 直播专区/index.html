惕。\n\n我不是说它一定不成立，我是说：一旦某种说法变成口号式、朗朗上口的东西，你就要警惕它对你警惕性的打击。 不管政治、宗教还是投资的洗脑，都是把一个非常复杂的原理浓缩成一个口号开始的。\"站在光里\"\"不要站在光里，要站在田里\"，现在又来个\"利空出尽是利好\"，慢慢你就觉得这是真事儿了，然后你就不再去分析了。\n\n一个逻辑上非常荒谬的东西，为什么你会信？因为它顺口。\n\n## 五、加息这件事，现在被充分定价了吗\n\n\"利空出尽是利好\"会不会发生？会。 什么情况下会发生？当一个消息在出来之前被充分定价的时候。\n\n如果一件事的近期影响、远期影响都已经完全反映在价格里了（不管是股票、金属还是衍生品），那消息真出来的时候一般就不会构成冲击。而且消息出来之前，人们的定价往往偏谨慎、倾向于把影响放大，所以消息落地反而会回调、反弹。\n\n所以关键问题是：美联储加息，现在被金融市场充分定价了吗？\n\n显然没有。 道理很简单——现在还没加息呢。 你连息都还没加，这个事怎么能被充分定价？\n\n现在被定价的只是心理预期，真正加息带来的影响根本还没发生。加息必须落地、而且要持续一段时间，影响才会显现出来。比如：\n\n对企业利润的影响——如果利率走高，那些 AI 基建公司要建数据中心得大量融资，融资成本一上升就侵蚀利润，这个要等下一个季度公布财报才看得出来，你不可能现在就给它定价。\n\n对消费者购买能力的影响、对大宗商品和有色金属持有成本的影响、对汇率的影响、对美债的影响——都还没发生。\n\n加息的传导是非常复杂的，没有任何一个人能计算出来。 就像台风预警了，但台风还没来；真来了才会出现问题。\n\n如果谁能算出来，那美联储也不用一次加 25 个基点、看一眼、再加 25 个基点、再看一眼了，直接一次加到位不就完了？它必须加完观察一段时间，就是因为谁都算不出来。\n\n所以有人说\"利空落地是利好了\"，那我问你：加完这次息，黄金、铜、石油现在都开始涨价——那是不是就相当于通胀没压住？\n\n你忘了美联储加息是干啥的了吧？美联储加息就是要压住物价。 你认为加完这一次就完事了，物价该涨涨、歌照唱舞照跳——那美联储不会继续加吗？\n\n所以有人问加息加到什么时候为止，我告诉你：加到这些价格不再上涨、甚至开始下降为止。\n\n抑制通胀，不是把价格压住不涨，而是把上涨的速度压下来，是二阶导不再变化。这个思维链条你得转过来。\n\n## 六、反驳\"美联储不敢加息\"的三个理由\n\n在 PPI、CPI 数据出台之前，大家讨论这事儿都是一个说法：\"美联储不敢加息。\" 理由就那么几条，我都能背下来：\n\n第一，美国国债四十万亿，利息太多。\n\n第二，特朗普不让。\n\n第三，中期选举，加了就失败。\n\n当你用\"敢与不敢\"来考虑美联储行为的时候，你就已经脱离理性分析的框架了。\n\n\"敢不敢\"是个拟人化的、简单化的理解方式，它的接受度最高，因为你特别容易明白。但没人说得清楚路径。\n\n第一条，四十万亿美债的利息。\n\n加息会增加利息负担——增加多少？不是所有存量美债都跟着这次加息调整收益率，它只影响新发美债。 已经卖出去的，按原来的固定票面利率付息，怎么影响它的利息？\n\n只影响新发那部分。 你算一算美国一年新发多少，再算加息 25 个基点给新发规模带来的额外成本——实际上是非常低的一个数，有人算过不到一千亿美元。 不是你想的那样\"四十万亿乘以 0.25 = 一万亿\"。那个数算出来是一千亿，但实际比这还少得多。具体数字你们自己算，我讲的是这个道理。\n\n而且加息降息是动态调整的：加完息物价回落了，我再降回来，我还省了呢。不是加完这一次以后永远都是高息。\n\n第二条，特朗普不让。\n\n这事儿压根不是特朗普定的。特朗普当然不让了——每个人都要完成自己的角色。 特朗普说了，你们不能加息，加息美国市场崩溃责任在你们。他还说全美国最伟大的总统正在执政，所以美国的利息应该是 0.5%。他自己说要 0.5%，这是现实吗？ 这跟\"不让加息\"不是一回事吗？\n\n第三条，中期选举。\n\n中期选举怎么就了？老百姓喜欢通货膨胀吗？\n\n加息是治理通胀的。 说加息不利于中期选举，这个逻辑我一直没搞清楚——你的意思是老百姓喜欢通胀、反对治理通胀？你仔细想想这个问题。\n\n我不是说美联储下周四加息是百分之百、铁板钉钉，我也不敢保证。我不做百分之百的预测。 但即便到今天，我认为这次加息的概率几乎是百分之百，我按这个来调整。\n\n## 七、因果关系：得前列腺癌的人，平均寿命更长？\n\n这两天的说法里有一个特别奇怪的：\"加息期间有色金属和黄金都是上涨的，所以加息会导致有色金属和黄金上涨。\"\n\n这是完全错误的。加息一定会使有色金属和黄金价格下跌。\n\n理论上的路径很清楚：加息导致需求减少，同时囤积成本上升（借钱付的利息多了，机会成本上升），消费也受抑制——它怎么可能反倒涨？\n\n那为什么历史上加息周期里，有色和贵金属确实涨？因为你把因果关系搞反了。\n\n是因为有色金属、贵金属先上涨，才导致了通货膨胀；是因为有了通胀，才导致了加息。 而第一次加息极有可能压不住通胀，所以有色贵金属还在上涨。\n\n这次加息完了，即使黄金继续上涨，那也不是加息导致的上涨，而是导致它上涨的因素还没因为这一次加息而改变，或者时间还不够长、幅度还不够。加息是导致它下跌的力量，但问题在于：加息的时候，一定有导致它上涨的力量，才需要加的息。\n\n我给你们举个例子，医学统计上：得前列腺癌的老男人的平均寿命，比普通人高。\n\n你能说是因为前列腺癌有利于长寿吗？ 百分之八十的百岁以上老人都有前列腺癌。为什么？因为随着年龄增长，前列腺癌发病率是线性增长的。得了这个病的都是老人，年轻人没得，但年轻人会因为别的病死了。\n\n你能得出结论说得了前列腺癌寿命变长吗？\n\n再举一个：非洲是全世界的肿瘤发病率最低的地区。\n\n你能说非洲医疗条件不好有利于预防癌症吗？ 不是。非洲医疗条件差，大部分人死于感染，平均寿命不到五十岁——大部分人还没活到得癌症的年龄就死了。\n\n所以你要分清因果关系，不能把两个伴生的事儿理解成一定有因果。\n\n前列腺癌有利于长寿这话，谁听了都说是傻狍子——但天天有傻狍子在说\"加息有利于有色金属上涨\"，这两个背后的逻辑完全一样。\n\n按这个逻辑还能推出：牛顿第一定律说物体应该保持静止和匀速直线运动，可现实里根本没有绝对的匀速直线运动。 加息最终一定会让金属价格跌，但现实非常复杂，具体哪一天、因为哪一件事跌，我判断不了。\n\n你不代表你加一次息这些东西都会跟着改，但随着加息不断加，它一定会跌——除非加到半道出现了别的事。而且我认为那种情况极有可能发生：美联储救不了黄金，也救不了美国，最终一定会重新开始宽松。但你要躲过这次波动。\n\n## 八、猫屁股抹辣椒：加息是为了让老百姓自己要求降息\n\n我给你们讲过，要让猫舔自己的屁股，有三种办法：\n\n第一种，它不舔你就打它。它会反抗，会咬你。这是最笨的。\n\n第二种，它舔的时候你喂它吃的。它可能会舔，不会很反感，但心里骂你损。也不高明。\n\n第三种，给猫屁股上抹辣椒，然后告诉它不要舔——它一定会舔。\n\n当你要让老百姓做一个选择、而老百姓不愿意选的时候，你要让他面临一个更难的局面，他自己就会选择你需要的那个结果。\n\n现在所有人都知道（连沃什都这么认为）：美联储就应该降息，否则美债问题根本解决不了；美国国内就应该通胀，美元就应该重置。 这没有错。\n\n但问题在于：你直接告诉老百姓要通胀、要美元贬值，政治上承受不了。 能干这事儿的只有特朗普一个人，他从上台那天起就致力于通胀——加关税、打伊朗，包括逼美联储降息，都是这一件事。因为所有的美国精英阶层都非常清楚：只有美元贬值、只有美国通胀，才能救美债、才能救美国。 那些说\"重振美元\"的，都是说给老百姓听的。\n\n所以最好的办法是什么？先加息。 加息完了把所有的东西都打崩，让老百姓连饭都吃不上，然后他们就会主动去赞同降息了。\n\n这就是给猫的屁股上抹辣椒。\n\n你要做的，是在这个过程里别把自己牺牲了。等真到那天，你还得想着冲进去赚点便宜——这才是金融投资的真谛。\n\n## 九、对照布雷顿森林：这一次要重置的是美债\n\n回顾七十年代，尼克松主导美元和黄金脱钩、布雷顿森林体系瓦解的时候，很多人是有意见的。但你看看当时的情况：法国天天来提黄金，戴高乐开着航母到美国来运——只有戴高乐来提黄金，才能让你认识到：美元再和黄金挂钩，美国就完了。\n\n脱钩之后一定是巨大的通胀，这些精英早就算明白了。 基辛格他们都清楚：先通胀——通胀就相当于赖账。\n\n当年布雷顿森林体系建立的时候，各国把黄金送到美国，是按 35 美元一盎司送去的。到 1980 年大通胀之后，黄金变成 800 美元一盎司。原来人家要拿回黄金，你是按 35 美元给的钱；现在人家要买回去，得用 800 美元。这不就相当于赖账吗？\n\n没有那一次先脱钩、后通胀、再治理通胀，美国那时的财政就持续不下去了。 正是这个过程让美国延续了很多年。\n\n今天美国面临的问题和当年一模一样，只不过对标物从黄金变成了美债。\n\n如果美元贬值百分之十，那四十万亿美元的国债，按可比价格算不就相当于变成四万亿了？道理不复杂。\n\n但你想让美元直接贬到现在的一成，国内政治压力受不了。那怎么让老百姓支持？先加息，加息让他们更受不了，然后他自己就会选择降息。\n\n这个世界就是这么运转的。 所以关键不只是认清这件事，更关键的是：在这样一个不断重复的过程里，你自己别吃亏——不但不吃亏，还得占点便宜。别老当那个买单的，每次口号一喊你就冲进去，年年看着英勇神武，一算账总是亏损。\n\n## 十、AI 是个零盈利的循环游戏\n\n今天开盘科技股出现调整了，跟昨天那几个大佬的表态有关——他们说 AI 迭代研发的速度要降下来，理由是迭代太快可能产生不利影响，比如大模型溢出、会造成人类灾害。\n\n这都是扯犊子。 真实原因是：要加息了，他们明显感受到以后再融资会非常困难，照现在这个强度很快就带来崩溃。\n\n你把美国整个 AI 产业当成一家公司来看：它没有任何收益，一分钱盈利都没有。 你别看英伟达这些\"卖铲子\"的挣得盆满钵满——如果把它当成同一家公司里的车间：生产芯片的车间、建数据中心的车间、训练大模型的车间、搞应用的车间——这个公司整体上就没有销售收入。\n\n现在唯一盈利的车间就是卖铲子的（光模块、HBM、GPU 这些）。但它的盈利是其他车间给的，而那些车间根本没有收入。\n\n那些车间的钱哪来的？两个来源：一是融资，二是卖铲子车间挣的钱再给它。玩的就是一个循环游戏。\n\n所以你就理解为什么会出现\"降速\"这个表态了。也有人说这是放烟雾弹给中国看，那也有可能，背后的事谁知道呢。但我倾向于怀疑它真能降下来——现在大家都是囚徒困境：你不干，你就落后，落后就被淘汰；你干，你也受不了，最后烧钱烧死自己。\n\n不管怎么说，如果 AI 训练速度真降下来，数据中心建设就会减缓，芯片、光模块、存储的应用都会减少——而中国现在的科技股热点恰恰就在这些方面。所以你可以理解今天科技股的下跌。\n\n## 十一、中美这场竞争，拼到最后拼的是国家资产负债表\n\n美国今天的局面为什么这么难？明明知道融资这么困难、都开始跟国债抢资金了、国债收益率都开始上升了，为什么还得咬着牙做？\n\n因为后边有一个中国一直在追。\n\n你不可以把中国理解成阿甘——我不知道累，我就一直跑，我跟着你后边跑，我也没想得第一。但你第一的这个人受不了了。 最后烧钱烧的是整个国家的资产负债表，这是4G 级别的、赢了顶一百年的大竞争，谁都不想输。\n\n现在场上的选手就是中国和美国，别的国家已经被拉好几圈了。中国不领先，但我保持第二，你拉不了我太远——这就很要命。 所以美国这么难，还得保持融资速率、甚至跟国债抢资金，也得咬着牙往前跑。\n\n最后拼的是整个国家的资产负债表，那我们的优势就来了。\n\n我们国家的资产负债表太优秀了：美国哪有什么国有资产？美国国债发了多少，中国国债才发多少？再说，美国哪有这么多散户去买科技股？ 我们这边人气一上来，科技牛市一发动，散户都玩疯了——银行里还趴着一百多万亿存款没动呢，着什么急？\n\n而且你看：美国那些大型数据中心（Meta 那些）跑到英国去发债，开始发五十年的、一百年的债券了——这都快跟民国时候发金元券似的了。上个月英国一次拍卖国债已经出现流标了。 流标意味着什么？意味着已经没有人买了——不是价格高低的问题，是我不投标。\n\n所以加息对全世界都是打击，但现在已经不是原来的美元潮汐了。\n\n按照原来的玩法，加息的过程中美国自己能剩一口气，其他人都死了；等美国拿着麻袋到处把尸体往回划拉，再把美元放松，大家又活过来——但你缓过来的时候，你家的东西已经被美国捡走了。\n\n现在的问题是：美国可以把全世界都勒死，但就勒不死中国。而中国的麻袋已经准备好了。\n\n你不是要加息吗？我就在这等着，我先出去捡，说不定还捡到你家去。你自己都勒迷糊了。\n\n美元潮汐不管用，主要因素是我们；美国的制裁不管用，主要因素也是我们。\n\n这个观点我从 2014、2015 年克里米亚危机就开始讲了。当时奥巴马制裁俄罗斯，我就说替奥巴马愁得慌——你怎么制裁俄罗斯？ 俄罗斯生产的石油中国全要，俄罗斯需要的东西中国全有：轻工业产品、服装鞋帽，什么都有。俄罗斯在中国买不着的东西，在美国、日本、德国也照样买不着。而俄罗斯生产的东西我们全要：原油、天然气、铜、铝……你有什么我要什么。\n\n## 十二、散户的账本，和\"神秘队\"的注水口\n\n上半年挣百分之百的人，现在变成亏损的有很多。今年上半年盈利过高——到 6 月 30 号之前盈利百分之一百左右的，都不是成熟的投资者。 我告诉你们，这些人有一大半现在都是亏损的，就在七月份一个月就亏掉了。\n\n现在 A 股散户盈利的比例不超过百分之二十，百分之八十的人今年是亏损的。\n\n现在还有人跟你讲\"老灯小灯\"吗？说老灯小灯这些人都是亏货。 尤其是新进来的小白，已经形成路径依赖——他们享受过上半年那些荣光，认为那个很快还会再来。我告诉你，不会来了。 真要成为成熟的投资者，现在就应该跑路；不跑路的，那就等下次牛市吧，而且下次你还得买对，买不对连跑路的机会都没有。\n\n创业板今天往上走了，我看是有人踩刹车了——你看科创 ETF 一放量，量比都二点多，这就是典型的踩刹车。\n\n但你不要指望着它能把你再拉上去。神秘队不是傻狍子。\n\n神秘队只负责不要发生系统性的流动性危机，它不管你价格高低。 真正你亏钱的时候，没有人踩着七彩祥云来救你。\n\n注水口给它注完了，那些需要救的就不咋跌了——然后有人就会告诉我：科技股又大涨了。\n\n我说是，都从一千二涨到八百了，天天大涨。江波龙从七百五涨到三百三十五，中国铝业从十三块跌到九块三——这些人跑到我这来说\"大涨\"，无非是给我上眼药、踢场子、打我的脸。 我一般不理，你打就打吧。市场好的时候我苛刻，市场不好的时候我宽容，因为市场不好的时候我需要看所有人的发言。\n\n而且你现在可以很明显地观察到：注水口已经不在科技上了。 今天上涨的那些股票，就是新的注水口。\n\n## 十三、放弃预测：人根本没有感受概率的器官\n\n有人预测明天的股票高开低走，有人说明天科技高开低走。你们对预测都是有执念的，不预测你就恐惧。\n\n而我个人的投资理念里没有预测这件事。你今天问我股市怎么走，我不知道。在我的思考框架里，就没有\"今天应该怎么走\"\"明天紫金矿业是上是下\"这种问题。\n\n我只有概率的判断，我只有应对：这样的情况我应该怎么做，那样的情况我应该怎么做。\n\n人先天是没有对抗不确定性的能力的，就像人没有一个感觉器官能感受到概率一样。\n\n视觉、听觉、触觉，都是进化过程中和外界刺激直接作用的信号系统——眼睛能感受光线，耳朵能感受声音的波动，皮肤能感受温度、湿度、粗糙细腻。但概率这种东西，自然界并没有把它进化成能和人相互作用的信号。\n\n所以你说\"我感觉明天会跌\"——你是用哪个器官感觉出来的？ 眼耳鼻舌身，你是鼻子闻出来的、眼睛看出来的，还是耳朵听出来的？都不是，你就是在瞎猜。\n\n人没有感受概率的器官，所以人对不确定性非常恐惧。 任何东西只要是不确定的，人就恐惧。所以每个人都要判断未来——预测未来是写在基因里的生存法则。 石头撇过来你得预测轨迹才知道往哪躲，打雷了你要预测下雨。\n\n但股票市场就是没办法预测的，因为它是概率化的东西。\n\n所以所有的预测，都相当于走夜路吹口哨——自己给自己壮胆。 那些财经直播间里说\"主力位多少点\"\"压力位多少点\"\"下周中枢多少点\"的，全都是走夜路吹口哨，除了安慰他自己之外什么用都没有，在科学上没有任何因果关系。\n\n价格就是一个博弈的结果：一个消息出来，对买方有影响、对卖方也有影响，双方看法不一样才成交。你不能说一个下跌就是什么什么原因——里面不排除有优势交易者、有机构互相通气，短期对价格有影响，但长期它影响不了。 机构也不点石成金，公募基金裤衩都快亏没了。张坤知道白酒要跌吗？知道的话他早卖了。\n\n所以你第一件事是放弃预测。 你需要关心的只有一件事：在现有的宏观、政治、行业、公司背景下，你买的这个公司是否安全。 然后它开始上涨的时候，你决定赚多少钱就卖。\n\n低买高卖，为什么大家老问\"什么叫高、什么叫低\"？因为他们试图预测什么叫高低。 谁都预测不了，你只能等——等来的低点你就买，等来的高点你就卖。\n\n低点高点很好判断，但敢不敢买、敢不敢卖是最难的。\n\n现在低的股票有的是，我能不瞅就给你说出一大堆，而且未来二十年都不会黄。但你敢买吗？ 我跟你说你都觉得我要抢你钱、我要抱你孩子下井。\n\n高也一样。去年有色金属到今年一月份，我跟你说高了、该卖了，你敢卖吗？ 你不敢——因为卖出会给你带来恐惧感，否则它就不叫高了。 你得搞清这个因果关系：正因为大家都不敢卖，它才高。\n\n## 十四、下周看什么，以及一段闲话\n\n下周四凌晨（北京时间周四两点半，也就是周三晚上），如果美联储确定加息，市场还会有相应波动。加息的风险和它带来的影响才刚刚开始，不存在所谓的\"利空出尽是利好\"，那是纯粹胡扯。\n\n要关注加息之后的发言和投票情况，你要判断他是不是还会连续加。周四早上肯定一大堆人告诉你\"这是一次性加息，加完就完了\"——你太小瞧美联储了。 美国 CPI 一出，你看看中国央行加息降息影响多大，美元加息降息影响没有？一定要看原稿，别看直播间给你解读。\n\n如果不加息，那才是超预期——超预期的话贵金属一定会涨，而且会大涨。但我认为加不加息，科技都很悬。\n\n顺便说几句闲话。\n\n中华民族压根儿就不是血缘种族，它是文化种族。 一说娶个外国媳妇儿就有人喊\"串种\"——你南方人对这些事相对保守，北方不怎么在乎。魏晋南北朝、北魏持续多少年，你串了多少次了？所有认同中国文化的，都是中华民族。\n\n\"民族\"这个概念本身就是舶来品，是从欧洲、从苏联学来的，强调血缘。中国历史上哪有\"民族\"这个概念？我们有\"汉人\"，没有所谓\"汉族\"。中国原来不叫中国，叫\"天下\"。\n\n中国为什么叫皇帝不叫国王？ 因为\"国\"是欧洲的舶来品，是单一民族建立的国家，所以他们的首领叫\"国王\"——是这个民族的王。我们周朝叫\"天子\"，周是天下，没有分族的说法。所以中国从来没有\"国王\"这个说法，叫王的都是东周那些只管一族一姓的诸侯。\n\n英语学多了，历史就整不好了。少学点英语，多看点历史。\n\n英国、美国这套东西，本质上就是生产力先发展上去了——从工业革命开始掌握了先进生产力，人们就推导说\"既然你生产力先进，那你制度一定先进、文化一定先进\"，这是纯粹胡扯。\n\n他们的制度设计也就相当于我们的占山为王。 特朗普一上来用的全是周围亲戚，那跟江湖有什么区别？他说中期选举过了每人发五千美元——那跟当年曹锟选总统有什么区别？\n\n我们的史官制度两千多年前就建立了，每个皇帝每天干的事都记下来，这个朝代因为什么灭亡、下个朝代因为什么灭亡，二十四史就是二十四个剧本。所以你今天干的事，我们不用去找美国经验，翻翻史书就有棋谱——你走一步，下一步是啥我就知道。你美国有棋谱吗？ 你才二百多年，历史上有什么经验可循？特朗普上来这么胡整，你准备怎么解决？你不就是大家一起商量吗？\n\n我既不是小粉红，也不是什么\"公知\"，我干啥都得有我自己的观点。 我也不认为美国完了——美联储加息相当有用，只是你不懂。你不懂就说不懂，别老扯人家没用。\n\n有人问我：你老讲这些有啥意义？能赚钱吗？\n\n我压根没教你赚钱。 我就是讲道理、讲机理。我说过八百次了，我讲的是评书。\n\n前两天有人开始总结\"白龙马\"的经验教训了，总结得情真意切，说下回我可明白了，不能买大家都看好的，明年开始割肉白酒、坚持价值投资——然后话锋一转：我这次认为 AI 人工智能绝对能改变世界，这是我值得一生拥有的股票，我找到了投资的圣杯。\n\n这文章写完要我命。\n\n这让我想起《茶馆》里那个算命先生唐铁嘴。茶馆老板问他：\"你现在还抽大烟吗？\"唐铁嘴说：\"我已然不抽大烟了。\"老板特高兴：\"你不抽大烟，那你以后肯定能发财了！\"唐铁嘴说：\"我已然改成白面（海洛因）了。\"\n\n行了，今天就播到这儿。 以后每次就讲两个小时，再长我嗓子受不了。\n\n今天讲的都是纯属评书，不能用来指导投资。我不是经济专家，不是金融专家，更没有投顾资格；提到的所有个股都不构成投资推荐，你所有的投资都要自己做主。我讲的东西有可能是看空的、有可能是看多的，都只是用来说明道理。\n\n明天是不是播，我还在雪球上通知，得看心情。","toc":["一、开场：难过的周末总算过去了","二、为什么我专门去听看空的人说话","三、闲聊一段：阿尔兹海默症","四、\"利空出尽是利好\"——一句口号就能把你洗脑","五、加息这件事，现在被充分定价了吗","六、反驳\"美联储不敢加息\"的三个理由","七、因果关系：得前列腺癌的人，平均寿命更长？","八、猫屁股抹辣椒：加息是为了让老百姓自己要求降息","九、对照布雷顿森林：这一次要重置的是美债","十、AI 是个零盈利的循环游戏","十一、中美这场竞争，拼到最后拼的是国家资产负债表","十二、散户的账本，和\"神秘队\"的注水口","十三、放弃预测：人根本没有感受概率的器官","十四、下周看什么，以及一段闲话"],"url":"https://www.bilibili.com/opus/1247777592562417681","bv":"","minutes":0,"chars":10216},"ai":{"title":"老木匠·2026年9月14日：加息的影响，才刚刚开始","text":"## 一、「利空出尽是利好」什么时候才真的成立\n\n1. 口号化的说法，本身就是一种洗脑信号\n\n他提醒，一旦某个说法变得朗朗上口、成了口号，就该提高警惕——无论政治、宗教还是投资领域的洗脑，套路都是把一个复杂的原理浓缩成一句口号，先让人反复听、慢慢就信了，不再去分析。他举了最近几个例子：从「不要站在光里，要站在田里」到「利空出尽是利好」，都是这个路数。\n\n2. 但这句话不是完全没道理，关键要看前提\n\n他解释，利空出尽是利好确实会发生，但只在一种情况下成立——消息出来之前，市场已经把它的影响充分定价了。定价的时候人们往往偏谨慎，容易把预期打得过满，等消息真正落地，发现没那么可怕，价格反而会回调、重新上涨。这就是这句话为数不多的合理场景。\n\n3. 而这次加息，压根没被充分定价\n\n现在还没有加息，你这个消息怎么弄？他唯一被充分定价的因素是心理预期，但真正加息带来的影响还没发生。\n\n他解释，加息对企业利润、消费能力、大宗商品持有成本、汇率、国债的影响，都要等落地之后才会逐步显现——比如AI基建公司融资成本上升侵蚀利润，得等下个季度财报公布才能体现出来，现在根本无从定价。\n\n## 二、为什么加息要一次一次加、慢慢看\n\n1. 没有人能一次算出全部影响\n\n他说加息的传导极其复杂，没有人能精确计算出一次加息最终会带来多大冲击——如果真能算得这么准，美联储就该一步到位直接加到目标位置，不用一次只加0.25个基点、观察一段时间再决定下一步。有人拿台风打了个比方：预警发出但台风还没来，真正的影响要等它登陆才会显现，他觉得这个比方很贴切。\n\n2. 所以加息之后金属继续涨，不是「利好」，是危险信号\n\n他给出一条推演：如果加完这次息，黄金、铜、石油反而都在涨，那就说明通胀根本没被压住，美联储的目标没达到，唯一的结果就是继续加息。\n\n加息的目的不是压住价格不再涨，而是压住价格上涨的速度——也就是二阶导不再往上走。他必须加到你彻底没信心了，这回真不能涨了，才算达到目的。\n\n## 三、「美联储不敢加息」这三条理由，一条条拆开看\n\n1. 第一条：40万亿美债的利息负担\n\n他说大家常挂在嘴边的理由背不下来也得背——国债太多、特朗普不让、中期选举。但真让你具体分析加0.25个基点之后美债会出现什么问题、走什么路径，几乎没人说得清楚，包括讲这话的人自己。他指出关键的误解：不是所有存量美债都会跟着加息重新计息，只有新发行的那部分才受影响，按新发规模乘以加息幅度粗算下来，一年增加的利息支出大概只有一千亿美元左右，远不是很多人以为的上万亿。\n\n2. 第二条：特朗普不让\n\n他重申了之前讲过的观点——特朗普能不能决定加息本来就是另一回事，这件事根本不是他说了算，如果由他决定，早就换哈塞特上台了。特朗普嘴上喊话要求把利率降到0.5%，这本身就不现实，他扮演的只是「要求降息」这个角色，和美联储真正的决策是两条线。\n\n3. 第三条：中期选举\n\n他觉得这条逻辑最说不通——现在美国老百姓最反感的就是通货膨胀，加息恰恰是治理通胀的手段，怎么反而会因为加息而不利于选情？他说至少存量固定利率房贷的人不会因为加息立刻受影响，也有相当一部分选民是支持加息的，不存在「全体老百姓都反对」这种说法，这同样是被简化成口号的产物。\n\n## 四、人没有感受概率的器官，所以天生恐惧不确定\n\n1. 预测是本能，但概率感受不到\n\n他解释，人对未来做预判是刻在基因里的生存能力——石头飞过来会本能判断轨迹然后躲开，打雷了会预判要下雨。但概率不一样，它不是进化过程中留给人类的一种可感知信号，没有对应的感觉器官。\n\n你说我感觉明天会跌，那你是用眼耳鼻舌身里哪个器官感觉的？你根本没有，那不是真正的感觉，就是在瞎猜。\n\n他说所有股市里的点位预测、压力位阻力位，本质上都是走夜路吹口哨、自己给自己壮胆，没有任何科学上的因果关系，除了安慰自己没别的用处。\n\n2. 把相关当成因果，是最容易踩的坑\n\n他讲了两个反例来说明这种错误有多常见。一个是医学统计上，得前列腺癌的老年男性平均寿命比普通人还长——不是因为得癌症有利于长寿，而是前列腺癌的发病率随年龄线性增长，能活到得这个病的年纪，本身就已经说明这个人长寿。另一个是非洲的癌症发病率全球最低，不是因为医疗条件差反而能防癌，而是当地平均寿命才四十多岁，大部分人根本没活到会得癌症的年纪就已经因感染等原因去世了。\n\n他把这个逻辑直接对应到「加息周期里有色和贵金属反而上涨」这个流行说法上——不是加息导致了上涨，而是当时推动金属上涨的那股力量（往往就是通胀本身）还没被这一次加息真正压下去，或者加息的幅度和持续时间都还不够。\n\n## 五、「猫舔自己屁股」：政治操作的三种办法\n\n他重提了自己讲过的这个比方：想让猫舔自己的屁股，硬打它会激起反抗；喂点吃的引诱，它会照做但心里记恨你；而最高明的办法，是在它屁股上抹辣椒，不用你说，它自己就会去舔。\n\n当你需要老百姓做一个选择、而他们本来不愿意的时候，你就得先制造一个更难受的局面，让他们自己选择你需要的那个结果。\n\n他把这套逻辑用在了当下：真正能救美债的办法是让美元贬值、制造通胀，但直接这么做，政治压力大到没人扛得住；所以更现实的路径是先加息，把经济逼到大家都受不了的地步，等老百姓自己开始支持降息，届时再重新宽松、完成货币重置——这个过程他认为几乎一定会发生，但眼下这段「抹辣椒」的阵痛，才是真正需要熬过去的部分。\n\n## 六、当年美元和黄金脱钩，也是同一套赖账手法\n\n他把这套逻辑追溯到了布雷顿森林体系瓦解的历史：当年各国按35美元一盎司把黄金存进美国，后来法国不断上门兑换黄金，把美国的黄金储备越掏越空，最后尼克松只能宣布美元和黄金脱钩。此后美国经历了一轮大通胀，到1980年黄金涨到了800美元一盎司。\n\n原来这些黄金人家拿走的时候是35美元一盎司拿走的，现在人家要买回去，得花800美元——这不就相当于赖账吗？\n\n他认为今天美国面对的问题和当年一模一样，只是标的从黄金换成了美债：如果美元实际购买力贬掉90%，40万亿美债按可比价格算，相当于只剩4万亿。区别只在于，当年可以直接让美元和黄金脱钩，今天要让美元直接大幅贬值，国内政治压力扛不住，所以还是得先加息制造危机，再让民意自己转向宽松。\n\n## 七、AI「放缓」传闻：他更倾向于不信\n\n他谈到当天科技股下跌，可能和前一天几位业内大佬提出「AI迭代速度该放慢」的说法有关——理由是担心发展太快带来风险。他觉得这更像是个借口：由于加息预期升温、未来融资会变得艰难，这些公司已经提前感受到了压力。他也不完全排除这是说给中国听的烟雾弹，但他更倾向于认为真正减速的概率不大，\n\n这就是囚徒困境。现在大家都是囚徒，你不干就落后，落后就被淘汰；你接着干，也可能被自己烧的钱拖垮。\n\n他还提到一个可以观察的现象：把整个美国AI产业当成一家公司来看，真正盈利的只有卖芯片、卖光模块这类「卖铲子」的环节，其余环节基本没有真实销售收入，靠的是融资和上游环节的循环输血——这也是为什么明知道融资已经开始挤占美国国债的资金、收益率被推高，还得硬着头皮往前冲：因为后面一直有一个不知道累的对手在追。\n\n## 八、中国不需要赢，只要一直追着——这次连本带利讲了「资产负债表」\n\n他重申了之前的判断：这是一场世纪级别的竞争，中国现在的位置不需要拿第一，只要保持第二、不被落下太远，对方就已经很难受了。他这次把落点放在了国家资产负债表的对比上——\n\n你美国哪有这么多国有资产？国债都发了多少了，中国的国债才发多少？\n\n他还提到一个直观的数字：中国居民存款超过百万亿，一旦真正被引导进入市场，这股力量本身就是美国没有的资源；相比之下，英国上个月的一次国债拍卖已经出现流标，意味着不是价格问题，而是压根没人愿意投标了。\n\n## 九、「不光是杨白劳，黄世仁现在也需要我们救」\n\n他解释了为什么这一轮美元收紧「勒不死中国」：以前的美元潮汐是加息时把全世界都勒紧、只有美国自己留一口气，等大家都撑不住了，美国再放水，趁机把别人的资产低价捡走。但这次不一样——中国手里的美元储备比美国政府自己还多，一旦别人撑不住，反而是中国有能力低价去捡便宜。他还追溯到2014年克里米亚危机时自己的判断：美国当年制裁俄罗斯，他就说这事没用，因为俄罗斯需要的东西中国基本都能供应、俄罗斯出产的东西中国也基本都要，制裁的效果天然就被削弱了。\n\n## 十、今年市场的变化：从「站在光里」到多数人亏损\n\n他用上半年到现在的流行语变化，给这轮行情做了个阶段性总结：上半年那种「站在光里」、晒收益的得意劲儿还历历在目，而他当时就说过，今年上半年盈利过高（很多人到6月30号前收益翻倍）本身就说明还不是成熟的投资者。他估计现在A股散户里，真正盈利的比例已经不到20%，不少人光是七月一个月就把上半年的浮盈亏没了——\n\n这些人如果真能成为成熟的投资者，现在就应该跑路；如果不跑，那就只能等下一轮牛市，而且得先保证自己能撑到那一天。\n\n## 十一、注水口的实操演示：当场怎么判断\n\n他借着当天早盘科技股下跌、后来止跌的走势做了个现场示范：观察相关ETF的量比，如果明显放大（比如超过2倍），往往意味着有资金在托底；他强调这不是要把价格重新拉起来，只是防止出现2015年那种融资盘被动踩踏的流动性危机。同时可以留意当天真正上涨的是哪些板块——那些板块就是这次被选中的「注水口」。他也提醒不要误解这种托底的用意：\n\n神秘队不是傻狍子，他只负责不要发生系统性的流动性危机，不管你这个东西价格高低。真正你亏的时候，没有人踩着七彩祥云来救你。\n\n## 十二、低买高卖：不是不知道，是不敢\n\n他说判断一个股票现在算高还是算低，其实并不难——难的是买在低点、卖在高点这件事本身。他反问：现在市场上便宜的、未来二十年不会消失的股票有的是，随便都能说出二十个来，可你敢买吗？他还拿自己举了例子：去年年初就明确提示过有色金属已经涨高了，让大家考虑卖出，可依然有人拿不住、不敢卖——\n\n因为卖会给你带来恐惧感，高的地方卖你一定会恐惧，否则它就不会高。正是因为大家都不敢卖，它才涨到这么高的。\n\n## 十三、唐铁嘴的故事\n\n他讲了《茶馆》里那个算命先生唐铁嘴的段子：老板问他还抽不抽大烟，他说已经不抽了，老板很高兴，觉得他戒了毒、日子会越过越好；唐铁嘴接了一句「我已然改抽白面了」。他借这个段子回应了一篇他看到的帖子——有人痛定思痛，说这几年经历让自己终于明白不能再迷信白马股、决心以后坚持价值投资，结果话锋一转，说AI人工智能这次是真的能改变世界、是值得一生拥有的「投资圣杯」，决心「站在光里」。他觉得这和唐铁嘴的自我安慰是同一种笑话——换了个瘾，没有真正戒掉。","toc":["一、「利空出尽是利好」什么时候才真的成立","二、为什么加息要一次一次加、慢慢看","三、「美联储不敢加息」这三条理由，一条条拆开看","四、人没有感受概率的器官，所以天生恐惧不确定","五、「猫舔自己屁股」：政治操作的三种办法","六、当年美元和黄金脱钩，也是同一套赖账手法","七、AI「放缓」传闻：他更倾向于不信","八、中国不需要赢，只要一直追着——这次连本带利讲了「资产负债表」","九、「不光是杨白劳，黄世仁现在也需要我们救」","十、今年市场的变化：从「站在光里」到多数人亏损","十一、注水口的实操演示：当场怎么判断","十二、低买高卖：不是不知道，是不敢","十三、唐铁嘴的故事"],"url":"https://xueqiu.com/2573414707/409219717","chars":4384},"topics":["加息的影响，才刚刚开始"]},{"date":"2026-09-12","bili":{"title":"老木匠 2026年9月12日直播文字稿（加息传导、科学思维、信息茧房、逆向思维、做空杠杆、紫金样本）","text":"## 一、开场：我只讲道理，不预测涨跌\n\n先解决一下直播，能听见就行，B 站这些功能我也整不明白，它就知道收钱也不好好维护。\n\n顺便说个事：我这个楼离小区入口近，外面收破烂的天天拿大喇叭转圈喊，非常烦人。噪声污染是个大问题。最近中央社工部专门提到了物业管理的问题，说下一步物业管理和社区之间要建立新型体制，具体朝哪个方向没说。我估计社区在物业管理里发挥的作用会更大。\n\n物业管理对中国人来说是个舶来品，从进中国那天起就水土不服。管理改服务是早就该改的——\"物业管理\"这名字本身就有问题，但问题在机制，不在名称。\n\n回到昨天。美国 CPI 公布以后市场的状况大家都看到了。\n\n这里我要先把一件事说清楚，每次都得说：我讲的是道理、是机理，但大部分人会把过程全部省略，直接要一个结论——你就说明天涨还是跌。\n\n这就相当于我抻着脖子讲了一上午平面几何，怎么证明、为什么这么证明，最后学生问我：老师，你就说选 A、B、C、D 哪个吧，别的他根本不关心。\n\n所以你问我明天 A 股是涨是跌，你进错地方了。这件事不在我的思维范围里，我也不认为自己有这个能力。你看很多直播间的人都认为自己有，说明天是哪个浪、哪个压力位、哪个支撑位，有的还给你一个具体点位——那都是胡扯。\n\n我能给你讲的是经济运行规律，比如加息最终会怎么传导，我知道。但它传导完之后是不是一定按规律运行？不一定，因为现实是复杂的。\n\n就像牛顿第一定律：物体不受外力时保持匀速直线运动或静止。这只是个理论。你由此判断这个东西到底会不会静止、会不会匀速直线运动——我不知道，而且现实当中根本就没有绝对的匀速直线运动，也没有绝对的静止。\n\n## 二、学历与科学思维：为什么很多人一听就急\n\n就讲牛顿第一定律这事，还有人到雪球上来跟我抬杠，说我不懂物理、半瓶水乱逛。他不知道我本科就是物理系毕业的，教过高中物理。\n\n我的研究生学历是哲学，法律是我自学考过的律师资格，现在做投资也是自学的。所以他们经常来挑战我，是因为我讲的东西不属于基础知识，跟大学老师在课堂上讲的不太一样，他们就觉得你说的不对。\n\n这里有个境界问题，就是\"看山是山、看山不是山、看山还是山\"。你在物理学里学基础理论是这么讲的，学现代物理学的时候发现变了，再学明白之后你会发现，它其实和技术物理学讲的还是一回事。学习如果只流于表面，很多东西你就是听不懂。\n\n前几天那个来踢场子的小伙说，你连基础货币和广义货币都不知道，你还讲货币政策？——对我来说，基础货币、广义货币在货币银行学里属于科普知识。我都给你们讲到 M0、M1、M2 是怎么来的了，讲过货币创造是怎么回事了，还回头再讲这个，那不是吃饱了撑的吗？\n\n我是从读研究生的时候开始辅修法律和经济。别人上了一个研究生，我可能上了仨，读了很多书。大学之前肯定算学霸，这没问题。\n\n再说科学思维。现在很多人不具有基本的科学素养，包括很多名人。\n\n前一阶段崔永元搞的那个反转基因食品，我认为他之所以做这件事，就是因为科学思维素养不足。他是真真正正相信转基因食品有危害的，这种相信就把他自己降到了普通老百姓的水平——他不知道转基因的问题在哪儿，只是望文生义：一听\"转基因\"，就以为生化危机要来了，要把人的基因也转走，以后小孩长三只胳膊。\n\n你没有经过系统的科学训练，有些东西带来的那种恐惧感就是很强烈的。你要是系统学过生物学、化学、遗传学，你就不会对转基因有特殊的恐惧。\n\n## 三、科学素养两例：转基因与日本核废水\n\n转基因这个东西，名词起得不好，叫\"转基因食品\"就容易让人误解。\n\n它和袁隆平做的杂交育种没有本质区别。唯一的区别在于：袁隆平找的杂交母本是在自然界里找到的，而转基因是通过人为手段——物理刺激、化学或生物方式切割基因片段——去改变母本。\n\n它并不像大家想的那样会把你转成什么。你吃了转基因食品，和你吃其他任何食品没有区别。如果某一种转基因食品的基因表达恰好带来毒性，那就把它排除掉，再做育种的时候不用这个母本就行了，这是一个失败的母本而已。\n\n自然界里没有转基因的食品，也有很多是有毒性的。\n\n还有一个特别典型的事：日本往海里排核废水，就有人开始不吃鱼了——觉得海是相通的，不管是养殖的还是捕捞的，以后都不能吃了。\n\n我告诉你，无论什么事，在大海里面你不谈浓度而谈这个问题，就毫无意义。\n\n海洋是有基底污染的，海里有很多有害东西是天然存在的，只是浓度很低。不要以为排了核废水海里才有放射性物质——不排，大海里也有，陆地上也有。美国当年在太平洋岛礁上做过核爆试验。\n\n你不谈浓度光谈毒性，那就是耍流氓。\n\n这就像原始部落的人第一次看到电灯泡会非常恐惧，因为他没学过物理。而你不会，因为你知道它的工作原理。\n\n无知就会带来恐惧，为什么这么多人一惊一乍，就是这个原因。\n\n所以物理化学是不能不学的。学它不是让你工作的时候还去背动量定理、背化学反应式，而是给你建立一种科学素养，让你知道这个世界基础的运转机理是怎么回事，不至于一惊一乍。\n\n## 四、英语与 AI：什么该学、什么会被替代\n\n顺着这个话题，说说英语。\n\n我不是反对大家学英语，我反对的是用免费义务教育的资源、让所有人都去学英语。\n\n义务教育是什么？是每个人都应该接受、法律规定的必学学科，你不学违法。不学数学我理解，不学语文我理解——不学英语是违法的，我就是理解不了：我们为什么要用一个别的国家的语言，而且不学还违法？\n\n所有人说学英语是为了学习外国先进知识经验，这我能理解，你不用再重复一遍。我们不同意的不是\"学英语\"这件事，而是为什么要用公共教育资源来学。\n\n我们的公共资源实际上是捉襟见肘的。你在这个东西上投入过多，其他东西上投入就少。\n\n现在我们的孩子更需要什么？\n\n第一是健全的体魄。现在体育教育已经弱化成什么样了，和我们小时候都不一样，很多学校连标准操场都没有。真正的义务教育应该规定：学校必须有一个四百米标准操场，孩子必须学会踢足球、打篮球。\n\n第二是心理健康教育。你现在义务教育阶段有开这种课程的吗？\n\n教育资源需要投入的地方多了，总量就那么点，却向英语倾斜——这是我不同意的点。\n\n再看时间账：一个孩子从幼儿园到研究生，全部学习时间里，有四分之一到三分之一是在学英语。而更扎心的是，大部分人这些英语最终都没有用。\n\n不只英语没用，小时候背古诗也没什么用，学钢琴、学围棋都没意义。除非这孩子在这方面有天分，或者从提高素质的角度让他学一学，那可以。但你不能从幼儿园试到研究生毕业。\n\n孩子最需要的是户外活动时间，是玩。孩子大部分智力是天生的，性格、处理问题的能力，很多东西都是天生的。有的孩子天生语言能力就差，学中文都费劲，你再让他学英语，越学越糊涂；有的孩子天生内向，说句话都费劲，你非让他学英语，不把他时间全占了吗？\n\n孩子不能按一个模式培养。适合读书的去读书，爱烙饼的去烙饼。尤其以后有了人工智能，就业会更加多元化，甚至有一天很多人都不需要工作。你如果还按\"就业\"的角度去培养孩子，其实是错的。\n\n现在学英语还有什么用？我给你数数 AI 成熟以后首先冲击的两个职业。\n\n第一个就是外语。同声传译会变得非常发达。你拿一本英文原版书喂给 AI，它马上给你翻成汉语，这很难吗？对 AI 来说就是大数据、就是经验。我上大学的时候，英语专业的翻译是非常抢手的专业；现在学英语，除了当老师、搞教培，几乎没什么就业地方。随着国门开放，真需要语言的都出国留学了，在国外待一段时间根本不需要翻译。\n\n第二个是医学里的诊断学。不是外科处置那些，是\"检查完了我来判断你得的什么病\"这个环节。\n\n医生诊断的机理是什么？看完片子，根据经验、搜索头脑里对疾病的认知，然后判断这可能是某种病。问题在于：不同医生掌握的医学知识和经验不一样，诊断准确度就不一样。\n\n那谁能有 AI 的数据库大、见过的病多？谁能比它计算得快？\n\n而且 AI 和检查仪器连接的时候，能大量节省社会资源，还没有信息传递的损失。\n\n你现在做核磁共振，先扫描人体——不管仪器多精密，也做不到百分百还原；形成影像资料，又损失一部分；影像再由医生看，又损失一部分。每一次信息转换和传递，信息都是越传越少的。就像军队行军，前边喊\"拉大距离\"往后传，传到队尾变成\"拉一条驴\"。\n\n未来 AI 在诊断学里没有后两个传递损失，它直接读的是数据流。\n\n教育的本质是提高人的素质，而不是就业。\n\n## 五、提高农民社保，钱谁出\n\n最近有个事很严肃，大家可以去关注：项工作和马光远分别在两个直播间里都在提给农民提高社保。这事让我非常敏感。\n\n我是农民出身，小时候在农村长大，我深受城乡差异之害——当年中考考到最好的中学，就因为我是农村户口，那一年不收农村户口。\n\n提高农民的养老金、医疗待遇，农民当然高兴，我也会很高兴，我很多亲属现在还在农村。\n\n但钱谁出？\n\n如果这两个人出这个钱，我就同意。\n\n提高农民待遇，势必导致农产品涨价，最终是市民来出钱。\n\n看看日本。日本农民待遇为什么那么高？因为有农协。农协的作用是什么？它导致日本的农产品贸易不是完全自由的——日本国内大米再贵也不能随便进口，因为农协政治势力很大。结果就是日本大米五十块钱一斤，市民也得挺着。\n\n你不能一方面享受了廉价农产品的好处，一方面又骂街说不公平。你吃着四块钱一斤的大米长大，同时还装犊子说农民待遇不够——那行，大米改成一百块钱一斤，农民待遇马上就起来，你愿意吗？\n\n## 六、加播说明：大航海会员直播，但没有龙头战法\n\n今晚八点，我给大航海会员做一场专场直播，也算试验一下专场是怎么回事。\n\n不是有了会员就抛弃普通粉丝，公开直播我会一如既往坚持。大家不要有心理负担，愿意充就充，不愿意充就别冲。\n\n说实话我倾向于建议你们别充——但你既然充了，就给了我一种压力，我就得回馈，所以加这一场。\n\n大航海直播不允许录播，我也不会把回放作为投稿投出来，不然对没充的人不公平。会员自己没听清可以重听回放，但回放只有十五天有效期，过了平台自动删除。\n\n讲什么？我会给大家讲书——不同的人写的书主要偏重什么、哪一本可读、哪一本干脆不可读，我都会告诉你。\n\n但别指望讲出花来，我也不讲个股、不判断市场。想听龙头战法的，我不会——什么龙头战法我都不会。\n\n我在这市场里很简单，就想一件事：怎么天天别亏了、别当猎物。\n\n左看右看、鬼鬼祟祟，就看哪个地方有猎人，我离他远点；然后看哪个地方有人被咬死了，剩下的骨头烂肉，我上去赶紧啃两口，完事回来等下一次机会。\n\n你们慢慢学我这个投资模式。我要教你的是：在不亏损的情况下，一年能跑赢通胀加上定期存款利率，就可以了。\n\n你看所有直播间讲的内容都是近期热点：教你一年涨十倍、二十倍。那天有个小朋友问我，老师你这个太保守了吧？我说，如果我不保守，你就不会管我叫老师，你会说\"那个大兄弟\"。正是因为我保守、在市场里活的时间长，你才觉得我是老师。我并不特别厉害，我只是老了，活得长。\n\n那些讲龙头战法那么厉害的人，为什么还天天费劲巴拉跑直播间讲课？你就应该动用思考能力想一想。这不就是当年万伟说的吗——一辈子没儿没女，专治不孕不育。\n\n## 七、加息：概率、传导，和\"利空出尽是利好\"的谎话\n\n昨天公布的 CPI 数据虽然符合预期，但它并没有反向超预期，没有出现明显的减缓，这对沃什压力很大。他上次在杰克逊霍尔年会上已经把话说死了，你只要没有明显的反向超预期，就必须加息，否则损失的是美联储的信誉。\n\n所以你看昨晚远期利率的交易员，已经把加息概率打得非常高了：九月大概百分之九十，而且已经开始压注十二月还有一次。\n\n那问题来了：既然大家都认为要加息了，为什么昨天金融市场的反应不像加息的反应？\n\n所以我昨天说，不用着急，让子弹飞一会儿。\n\n加息必须在落地之后才能改变所有金融产品的估价。没有哪个机构在设计金融产品、做定价的时候是用\"预计\"的方式，很多金融产品本身就是一个利率的函数——利率变了，这些东西才会跟着变。\n\n所以一句话：加息传导是要有过程的，而且加息的效应是有累积效应的，不是加一次效果就显示出来。千万别听什么\"利空出尽是利好\"那种狗屁话。\n\n消息出来的时候，往往先朝相反方向走。这个我给大家反复讲过，A 股里一个利空消息出来，往往会先上涨再下跌。而且有时候消息出来先反向运行，恰恰坐实了这个消息的真实性。\n\n这个博弈非常诡异。你以为你在第一层，人家想的是第二层、第三层，你怎么跟他 PK？\n\n而且这话现在变得朗朗上口，本身就很诡异。前几天所有 A 股直播间都信誓旦旦告诉你肯定不加息——我还专门截图了，前阶段的舆情是\"不会加、肯定降息\"；CPI 出来后改口成\"肯定不会加\"；然后变成\"加了也不要紧，加了就是利好，利空出尽变利好\"。\n\n那我倒回去问：你说肯定降息的时候，是不是意味着降息是利好的、会涨？你说不会加息的时候，是不是也认为会涨？现在肯定要加息了，你又说利空出尽是利好、还是会涨——那这世界上就一定会涨呗，你还分析什么？这不典型就是信仰吗？\n\n你分析了吗？你脑袋里有逻辑吗？咱不说对错，就说你这个说话的逻辑不对。\n\n现在还有一种舆论说\"加一次没用，得多加几次\"——那也不对。加多了也得从加一次开始，下周就能变成两次加息吗？起码你得坚持说话前后的逻辑统一。\n\n信仰问题不能争论，就像真主和耶稣谁是唯一的真神，这争论不了。你说我就信奉它一定涨，像当年\"京沪永远涨\"一样，那我就不跟你争了。\n\n我的看法：加息的目标是通胀，什么时候这些东西不再涨了，加息就停了，没固定期限。什么\"加息周期就一年\"，没这说法。\n\n我认为这次加息最多持续一年，一年都持续不了。因为加到一定程度，美股就完了——现在美股微如累卵，承受不了几次加息。历史上它加过很多次，现在美国的利率水平在历史上并不低，我认为债券市场和股票市场都承受不了太多加息。\n\n## 八、怎么研究一个行业：去找\"满手猪屎味\"的人\n\n昨天有人提到养猪行业最近的变化，我讲讲研究行业的方法。\n\n你要研究养猪，千万要排除掉所有做养猪股票的人给你讲养猪。\n\n那去哪里研究？你挨个跑养猪场不现实，但有几种直播间可以关注：\n\n第一，卖兽药的；第二，卖饲料的；第三，养猪场的老板——不是大猪场的老板，是那种养三五万头猪的小老板。这种直播间多了去了，而且他们之间会互相交流。\n\n他们根本不关注养猪行业谁涨谁跌，他们关注的是：饲料现在多少钱、最近有没有疫情、猪价多少、收货价多少、拿货价多少、国家收没收储、最近是不是又跑猪了。\n\n这才是养猪的基本面。\n\n别去关注那些穿西装扎领带、做个 PPT 小头发锃亮的，他们根本没进过猪场，研究养猪那都是扯淡。他们给你算\"能繁母猪存量多少、饲料成本多少、每头利润多少\"——他们都是吃二手饲料长大的。\n\n你要找的是那些满手猪屎味的人。\n\n其他所有行业都一样。我要研究铜，根本不关注你们关注的紫金矿业里面那些大 V，我关注的是收废铜的、去非洲挖矿的、做小铜厂小电缆厂的。\n\n他们不关心哪个股票涨跌，他告诉你的是：现在铜价太高了，这买卖快干不下去了。你一听就知道，铜价已经高到抑制现实产业了。\n\n## 九、打破信息茧房\n\n问题在于，你关注一个平台，算法就会给你越推越多。\n\n比如你天天围着股票直播间转，推给你的都是研究铜股票的人，一说挖矿都振振有词——你下过井吗？你去过铜矿吗？\n\n我们做股票的散户，没那么多人力物力去挨个调查现场，但好在自媒体提供了一个可能性：各行各业的人现在都会在自媒体上发言，关键是你要找到这些人。\n\n你会发现这些人的直播间里基本没几个人。谁会去关注一个收猪粪的人？谁会去关注一个卖兽药的人？\n\n你找不到对的人，就会被包在信息茧房里，永远找不着。大数据推送会造成一个局面：你以为你关心的东西就是所有人都关心的。你觉得铜矿会涨，它就给你推铜矿会涨，你就觉得全世界都认为铜矿会涨。\n\n怎么打破信息茧房？隔一段时间，把你关注的人全部拉黑、删掉。\n\n我在雪球上为什么隔一段时间把所有的关注的人删掉、把相关研究的人拉黑？就是为了把偏好推流重新弄一遍。你注册小号也没用，小号关注的东西很快又会形成茧房。\n\n大数据形成信息茧房的速度非常快，你能注册多少小号？你必须和平台的大数据算法玩猫捉老鼠。风险偏好推荐也可以关闭，但关掉之后你想主动找卖兽药的，它不给你推了，主动权得掌握在自己手里。\n\n你得学会既利用它的好处，又不让它给你带来坏处。\n\n## 十、风险是结构性的，防风险不等于清仓\n\n说到防风险，很多人一听就想到清仓——你不能老是走极端，不是满仓就是清仓。\n\n防风险有防风险的做法，不代表一定要清仓。尤其现在股票市场还没到全面系统性风险的时候，现在的风险是结构性的。\n\n大家有目共睹：去年到今年上涨的是啥？第一是科技，第二是有色金属、贵金属。这是涨得最多的。很多股票从去年到今年实际上一直在跌。\n\n所以离全面性、系统性风险还差得远。\n\n问题在于，你要选对标的。即便选对了，由于现在国际市场非常诡异，随时可能发生巨大波动，所以你也要降低仓位。\n\n比如我，就是把融资都清掉了，我认为就可以了。对于你们从来没融过资的，降到百分之五十仓位可不可以？可以。\n\n除了降仓位，还要注意：买一些前期没有大幅上涨的标的，买那些对加息降息、国际经济状况不敏感的标的。\n\n我不是永远不会清仓，市场面临全面系统性风险的时候我就会清仓，而且不仅仅清仓，我还会去做空——但这些工具你们做不了，你做不了就清仓等着下一波就完了。\n\n下跌如果我认为一定会来，对我来说也是赚钱的。\n\n我现在天天看着铜这些往上涨，对我来说是非常好的消息。有人以为我盼着铜跌——你错得太厉害了。\n\n铜每涨一天，它下跌的概率就大一天，下跌的空间也大一天。\n\n我以前给大家讲过，做股票是个登高游戏，登高游戏的特点就是坑是一种资源：你的起点越低，登得就越高，奖励就越多。所以找到起点低的坑，你胜率就大。\n\n反过来一样：铜越涨，下跌的可能性越大、空间也越大。那做空铜的时候，这就相当于我们买股票的坑。\n\n山顶也是一种资源，它跟坑是镜像的。\n\n所以不要说我\"看空看多\"，我现在提示的是风险——我既看不了多，也看不了空，所以叫风险。等到我真正看空的时候，哪还有风险？那时候我会把所有资产调到期货市场里，去做空铜期货。\n\n现在什么都不敢，也不知道它能跌还是涨，没有信心。\n\n## 十一、清仓和做空是两件事，期货杠杆可以自己控\n\n清仓和做空，考虑的出发点是完全不同的。\n\n你清仓的时候，考虑的是\"上涨的可能性已经消失、市场已经买不到便宜的股票了\"，所以你清仓。但这是否预示着股票一定会下跌？不是的。所以这时候你即便清仓了全部股票，也不能在股指期货上做空。\n\n做空需要另外的、更确定性的信号——你得知道它一定会跌，这时候才开始做空。\n\n所以从清仓到做空，中间还有一段时间。\n\n完整的链条是这样的：底部的时候满仓满融 → 意识到风险时去掉融资、满仓 → 再上涨时减仓 → 涨到最高点、找不到可买标的时清仓 → 他继续涨、开始无厘头 → 然后做空。\n\n那才叫真正的看空。现在我说的这些，离看空还十万八千里，我只是说有风险。大家都认为我是看空，那好吧，我只能利用你们的语境跟你们聊天，要不然每次都得解释一遍。\n\n期货杠杆没那么可怕，是你自己可以控制的。\n\n比如你账户里有一百万，六倍杠杆可以做六百万的交易。那我只用五十万，不就相当于只做了三百万的交易吗？我只拿三十万出来做，杠杆不就降下来了吗？\n\n我自己做期货交易，不会超过二倍杠杆。二倍杠杆意味着什么？意味着要做错百分之五十才会爆仓。我开始做空的时候，怎么能做错百分之五十？那得差多少水平？\n\n而且做空不是在上涨过程中做空，是在上涨到顶峰、开始下跌的时候做空。做空在期货市场上是要研究趋势的，不是纯粹的基本面交易。\n\n所有说\"期货容易倾家荡产\"的，都是半瓶醋，那是因为你太贪，总想一夜暴富。我做期货一样没想过获得过高利润，我只获得百分之十五就可以了。\n\n你们得做过期货才懂，期货账户里有\"追加保证金\"这回事（mark call）。你想应对风险能力强，就不要把账户里全部资金都用来交易，留一部分用来补保证金。\n\n你不敢做，是因为你不懂；你不懂，所以你有恐惧。就跟原始人看电灯泡、跟转基因食品的道理一样。\n\n这里我还要说清楚一件事：我从来没看空过紫金矿业。\n\n去年一月份的时候都没有看空，45 块钱的时候也没有看空紫金矿业，我只是认为它有风险。\n\n风险的几个阶段是这样：确定性的买入 → 不确定性的持有 → 不确定性的卖出 → 确定性的卖出 → 做空。\n\n我现在连\"铜价有风险\"都没说过。我不会去赌铜价继续上涨，是因为我认为它继续上涨的确定性不足。\n\n但紫金矿业的论坛现在对我来说是禁地。我只要在紫金矿业论坛里打个笑脸，所有人都会认为我在看空。你信不信我打个笑脸，下面全是说我看空的？比亚迪也一样。\n\n他们现在都快开始骂街了，我进去一说话，相当于给他们做了统一战线——原本吵得不可开交，我进去就一致对外了。所以我把很多人都拉黑了，不这么处理的话更完蛋。\n\n这是智力不足的表现。你考虑问题考虑不了那么多维度，那就直说\"我考虑不了那么多\"，别把你那东西当成绝对真理。这个世界是高维度的，需要考虑的因素很多。\n\n## 十二、逆向思维的代价与心理账户\n\n有人问：每次赚钱了不想卖就想格局翻倍，结果次次坐过山车，这种心态怎么破？\n\n不用破，因为曾经有结果。你下次不想坐过山车了，一卖它马上就一飞冲天。\n\n为什么你一卖就不坐过山车、你不卖就坐过山车？\n\n因为你和大都数人的想法都是一样的。你会坐过山车，是因为这时候大多数人也没卖；下次你一卖它就火箭发射，是因为所有散户都和你一样卖了。\n\n你搞错了因果关系——是因为你没卖才过山车的，你卖了他就火箭发射。\n\n怎么破解？不要当一个普通人。但不普通的代价非常非常大。\n\n不要以为\"我就是逆向思维\"。当你说自己是逆向思维的时候，你只是转向了。因为那个时候所有人都在坚持你所谓的逆向思维。\n\n你所谓的逆向，其实是正向，你只是把方向定义错了。\n\n你现在到紫金矿业论坛看看，大多数人在坚持什么，你就知道大多数人是什么看法。你逆着他们，实际上是非常非常难的事。\n\n倒不是跟他们争论难——你可以不吱声，是你自己会把自己控制死。你现在持有紫金矿业的人，有几个人敢卖出？你问有几个人敢卖出中际旭创？\n\n你卖出的时候，觉得自己对不起自己，都下不去手，浑身发抖，卖完当天晚上都睡不着觉。这就是逆向的代价。\n\n而你一卖完觉得特别舒服，\"我这次终于坚持逆向思维了\"——大哥，你转向了你知道吗？卖了寒武纪又买回来，大家都买回来了，这就说明它还会下跌。\n\n在市场里做一个不普通的人、做一个逆向人，比你想的要难得多。你不把自己浑身扒一层皮，是做不到的。\n\n还有一点要提醒：既然已经卖了，下次再买入的时候，不要考虑你上次曾经买过、卖过这只股票，不要考虑你曾经在它上面赚过钱。\n\n但大部分人都做不到。怎么避这个心理误区？下次再买的时候，换个标的。\n\n比如看好铝要反弹了，那我不买中国铝业，我买云铝、买南山铝业，换一个。\n\n好处是什么？你又会重新研究——这玩意儿买下来行不行啊、会不会被套住，你就会开始想这些问题。\n\n如果你买的是原来赚过钱的那只，你就会想：反正我原来已经赚过钱了，亏点也无所谓。谁都是拗不过自己心里的本性的。\n\n我今年一月、二月清仓中国铝业，即便坚持了这么多年，卖完心里依然非常狐疑——万一这次错了呢？三月份卖出有色的时候心里也难受。\n\n这就说明你确确实实坚持了逆向，那是非常非常难受的。但今年回过头看，当时卖是对的。当然现在又搁底部往上涨了，你是不是又开始狐疑了？\n\n逆人性永远都是非常难的一件事。\n\n我为什么老拿紫金矿业举例？因为我能做到的事你做不到，所以我告诉你怎么去杜绝这种情况。这些都是我年轻时候总结出来的心法。\n\n我现在进步了，即使买同一只股票也能避开这个——比如再买中铝，我不会考虑我们曾经在中铝上挣了多少钱，我已经没有\"心理账户\"这种想法了。我说的是你们。\n\n你们得知道：多大屁股穿多大裤衩子。我现在给你讲，你就认真听，你别动不动就来一句\"那你咋咋地\"。\n\n我跟你们说这些话不代表恶意，我是把你们假设为我的学生。如果不假设你们是我的学生，我这情绪一上来，这课就没法讲了。跟我同一起的人，如果有这么蠢的发言，我转头就走了，我跟他扯什么犊子。\n\n## 十三、拿紫金矿业当观察样本：股价、股东人数、舆情\n\n我为什么老让你们观察紫金矿业？从老早开始我就让你观察。\n\n从它的走势，到它论坛的舆论情况，你要一直看，每天看、每天感受，慢慢你就能总结出规律。\n\n一只股票从下跌到上涨再到下跌，除了股价运动，还包括股东人数的运动、论坛舆情的变动，它们是互相影响的。\n\n为什么让你在紫金矿业上观察？因为那里人多、说话的人多，才有观察价值。你要观察我买的股票，那论坛五天有一个人发言，你观察啥？\n\n洛阳钼业 2020 年、2021 年我们刚进去的时候，论坛里就是我和大黄在说话，还有几个人，现在名字都忘了。那时候你观察不观察都没意义。\n\n我不是让你评价谁。大黄老师是我非常尊重的投资人，我说过八百次了。我是要教你们怎么看投资者状况。\n\n在紫金矿业上，大黄能赚到钱，不见得所有人都能赚到钱。没有一只股票是所有人都能赚到钱的。\n\n你每天看，还要记数——大黄老师发的帖子下面每天有多少人回复，那些回复倾向于哪个方向，你都要看。\n\n我要你观察的是这件事。\n\n现在紫金矿业论坛里的氛围是什么？我总结给你听：不怕这个加息、加息对铜价没有影响、对铜的供给没有影响、下跌是很好的黄金坑、跌下来是买入的机会。\n\n你得到的印象是不是这样？这就是\"互相打气、互相壮胆\"。\n\n但同时股东人数还在不断增加。股价、舆情、股东人数，这三个东西互相影响，最后会推动股价朝哪个方向运动，你慢慢就能看明白。\n\n对我来说，如果我要判断紫金矿业未来的走势，这些评论内容我根本不看，我就等三季度它那个股东人数的变化。\n\n别的我都不看，甚至连铜价、金价对我来说都不重要——我就想知道，到三季报的时候它的股东人数是多少。\n\n股东人数没有实时的，只有季报才公布。有些公司中间也会公布，但也有些公司不告诉你，告诉你的还是上一期季报的那个人数。\n\n你现在形成这种印象，就会知道未来股票可能朝哪个方向运转。等它开始运转的时候，你就会把现在的舆情、业绩、股东人数和股价变动联系在一块。下次再遇到这种情况，你就有经验了。\n\n你在股市当中是怎么成熟的？就是通过观察。不是互相打气讲信仰，不是党同伐异——你一进来就加入某个教会了，你还进步个屁。\n\n你得做一个冷静的、客观的观察者。\n\n我给你们讲的东西都不是宗教，没有一样是\"你必须按我这方法来\"，我讲的是方法，我自己都没有固定的观点。\n\n还有一个信号值得注意：一致性太高就是风险。\n\n你看现在买黄金的人也是这样，分析来分析去，过程都是对的，到最后结论都一样：黄金还会涨。铜也一样，从不同角度论证，最后的结论都是\"铜还会供不应求、铜价还会涨\"。\n\n这就会引起你足够的警惕——一致性太高，在金融市场上永远都是风险。\n\n就像前一阶段的光模块，大家都认为光模块是最好的时候，它的最好时候就过去了。\n\n\"站在光里\"这句话，是不是已经很久没人说了？是不是已经逐渐淡出大众视野了？\"值得一生投资的五十只股票\"，过去到现在才五年，现在已经彻底烂大街了，变成\"臭老登股\"了。\n\n当年我给他们讲美国的漂亮五零，他们说美国的漂亮五零可以跌，我们的白马不能跌——我告诉你，这就叫信仰。\n\n这也是为什么我让你们观察紫金矿业——它是个非常好的样本。\n\n## 十四、收尾：不成为输家，就是最大的目标\n\n下半年有个很大的不确定性：特朗普输掉中期选举怎么办？\n\n会不会被启动弹劾程序？被弹劾以后他会不会还想做点什么事儿？会不会破罐子破摔？这些都是不确定性。\n\n你们想的都是\"特朗普还得解决美债问题\"——他还剩两年任期，他解决个屁美债问题？既然已经成不了有作为的总统了，那他为什么不多挣点钱呢？\n\n所以别一整就是定理，别一说就是\"肯定不能加息\"。特朗普为什么中期选举就一定得行？他都说了，选共和党，胜选了一人发五千块钱——特朗普就一定得用加息降息这种方式吗？发五千块钱行不行？\n\n你得持一个开放态度，有些事情你都没站在特朗普的角度考虑，你都是站在自己的角度——因为你买了紫金矿业，你想的就是紫金矿业别跌。\n\n现在是一个确定输家的时代。\n\n这个时代你需要做的唯一一件事就是：不让自己成为输家，然后在中间伺机占点便宜就行了。\n\n这个时代你想成为赢家，非常非常难，因为不确定性因素太多。连大的投资家都矛盾冲突这么多，别说我们普通人了。达利欧有达利欧的看法，巴菲特整了一大堆现金在那等着。\n\n你说没事美股肯定继续涨——那你就是比巴菲特、比沃什他们都厉害呗？沃什刚讲完话，说我必须控制通胀；然后你就说他肯定不敢加息。你这个自信都是从哪儿来的？\n\n我所知道的唯一一点就是：我什么都不知道。\n\n我现在什么都判断不了。现在是乱纪元，是最不能判断未来的时代，是一个决定输家的时代。\n\n你只要在这次风暴中不成为输家，熬到完了，那有的是傻狍子往里冲——你不当输家，有的是人抢着当。\n\n所有人都担心\"你不输我不输那谁输呢\"？放心，输的人有的是，你去看看那些热闹的论坛，哪个不是欣欣向荣、情绪高昂。\n\n怎么才能避免当输家？让傻狍子先上，你先等着，天塌了高个的顶着。你放心，天塌那天你就会发现，你比平常高多了。\n\n最后给新股民说几句：不要总结经验，你现在想的是怎么活下来。\n\n你现在还没到沾沾自喜的时候，你现在一沾沾自喜，就离玩完不远了。你现在这个阶段不叫沾沾自喜，叫嘚瑟。\n\n为什么一学就会、一用就废？因为你经历的时间太短了。\"股实如神、自己动手如渣渣\"，这很正常。\n\n我前几天给大家发了 2014 年我写的一个微博截图，就是想告诉你：今天你见到的局面，在历史上无数次地发生过。\n\n那时候我说，所有新股民这次都跑不了。我说的时候股市大概四千多点，有人说\"你看我都拿到 5178 了\"。尤其你到四千八百点的时候，总结经验的人就多了去了。\n\n所以你现在看到比如在科技股里挣了很多钱的人，就跟当时的所有新股民是一样的。只不过今年是结构性牛市，2014 年 12 月是全面牛市。\n\n别去盯谁消耗了、谁来了、谁没来，那都跟你没关系。你需要考虑的是你和市场之间的关系。\n\n其他人来来去去，我们都是萍水相逢。就像我早上在公园遛弯，有人天天给我通报\"老张头今天为啥没来、老李头去哪儿了\"——我一概不关心，来了就聊会儿天，不来就拉倒。\n\n这个市场最需要的就是\"手熟\"。就像卖油翁说的，无他，唯手熟尔。\n\n你开车刚学会和成为老司机之后，对路面情况的判断完全不同。成为老司机以后，你对风险的判断是下意识的，根本不用看哪儿出来人——四周的环境给你的那种氛围，就让你知道有风险了。\n\n股市也一样，只是你待的时间短。待的时间长了，你一样会觉得\"这儿不对\"。所谓\"事出反常必有妖\"，你感觉这和我以前感受到的东西都不对，你就要小心。\n\n甚至我现在看一个个股的买卖队列，都能感受到背后多空双方的博弈状况，大致形成一个它坚挺还是可能下跌的印象。这些都需要\"熟\"。\n\n有人一进来说\"我是天选之子，我做这两下已经挣百分之百了，我终于找到人生了，我就是为股票而生的\"——你才进来一年，一进来就赶上牛市了，你狗屁为股票而生的。这就跟找对象一样，见着个人就一见钟情，你不是一见钟情，你是很长时间没见着女人了。\n\n好了，今天时间到了。\n\n照例声明：我说的都是评书，所有东西都是虚构的，不能用来指导投资，所有投资你都得自己负责、自己决定。\n\n我说到的任何个股都只是用来举例讲明白道理，不代表我对他未来的股价进行判断。千万别给我加戏，我判断不了股价，我没有这个水平。我是个教书匠，只会讲道理；讲评书的，只会讲段子。\n\n大家凑合听，别跟我掰扯。谢谢大家陪我一上午。","toc":["一、开场：我只讲道理，不预测涨跌","二、学历与科学思维：为什么很多人一听就急","三、科学素养两例：转基因与日本核废水","四、英语与 AI：什么该学、什么会被替代","五、提高农民社保，钱谁出","六、加播说明：大航海会员直播，但没有龙头战法","七、加息：概率、传导，和\"利空出尽是利好\"的谎话","八、怎么研究一个行业：去找\"满手猪屎味\"的人","九、打破信息茧房","十、风险是结构性的，防风险不等于清仓","十一、清仓和做空是两件事，期货杠杆可以自己控","十二、逆向思维的代价与心理账户","十三、拿紫金矿业当观察样本：股价、股东人数、舆情","十四、收尾：不成为输家，就是最大的目标"],"url":"https://www.bilibili.com/opus/1247134648812699671","bv":"","minutes":0,"chars":13025},"ai":{"title":"老木匠·2026年9月12日：只讲机理，不判断涨跌","text":"## 一、他反复强调的一件事：只讲机理，不判断涨跌\n\n1. 大部分人听完只会截取一个结论\n\n他说自己讲的所有内容，多数人都会把中间的推理过程直接跳过，只想要一个「涨还是跌」的答案——就像老师抻着脖子讲了一上午的证明过程，学生却只关心选择题该选哪个。他讲的是道理和机理，至于别人据此认为他是看多还是看空，那是听众自己的解读，跟他没关系。\n\n2. 他借牛顿第一定律做的类比\n\n牛顿第一定律告诉你物体不受外力时会保持匀速直线运动或静止，这只是一个理论。它告诉你这么一件事，但现实当中根本没有绝对的匀速直线运动，也没有绝对的静止——你不能因为知道了这个定律，就说这个东西到底会不会静止。\n\n他说加息会怎么传导，这套机理他清楚；但传导完之后市场是否真的按这个规律走，他判断不了，因为现实远比理论复杂。\n\n## 二、CPI公布之后：为什么行情看起来「不像加息」\n\n1. 沃什已经把话说死了\n\n这次CPI数据符合预期，没有出现明显的反向超预期或下跌，这对沃什压力不小——他在杰克逊霍尔年会上已经把话说死了，没有明显反向超预期就必须加息，否则伤的是美联储的信誉。远期利率交易员已经把9月加息的概率打得很高，甚至开始押注12月还有一次。\n\n2. 「让子弹飞一会儿」：加息的传导需要时间\n\n既然大家都认定要加息了，为什么市场当天的反应却不像？他解释这是因为金融产品的定价模型是利率的函数，得等利率真正落地变化，估值才会跟着调整，不会提前反映。加息的影响是慢慢累积的，不是加一次就能马上看出全部效果。\n\n3. 「利空出尽是利好」这句话，逻辑上是漏洞百出的\n\n他抓住了一个前后矛盾的现成例子：前几天所有直播间都信誓旦旦说肯定不加息、肯定要降息；CPI一出来，风向立刻变成「加了也不要紧，利空出尽是利好」。他反问，如果当年真降息了，是不是也该说「利好出尽是利空」？\n\n你不管什么结果都得出一定会涨，那不就是信仰吗？\n\n他还指出「加一次没用、得多加几次」这种说法同样站不住——第一次还没加过，怎么能一步跳到两次的结论？前后逻辑得自洽，不然就跟当年「京沪永远涨」一样，是信仰问题，没法争论。\n\n4. 如果加息之后铜金继续涨，反而是更麻烦的信号\n\n他给出一条推演：如果加完息，黄金铜价还继续涨，说明通胀根本没被压住——通胀继续抬头，唯一的结果就是继续加息，因为加息盯的是通胀率本身，不是加满一个固定次数就自动停下来。他自己的判断是这轮加息周期最多持续一年，理由是现在美股已经「危如累卵」，美股和债市都撑不住太多轮连续加息，但他也强调这只是猜测，不是定论。\n\n## 三、研究一个行业，要找到真正在一线的人\n\n1. 研究养猪，别听讲养猪股票的人\n\n你要关注的是卖兽药的、卖饲料的、养了三五万头猪的中小猪场老板，而不是穿西装打领带、天天做PPT的——他们根本没见过猪场，讲的都是二手的料。\n\n一线的人聊的是饲料多少钱、有没有疫情、收货价拿货价，这才是养猪行业真实的基本面，不是统计出来的母猪存量和理论利润。\n\n2. 研究铜也是同一个道理\n\n他自己不看紫金矿业、洛阳钼业这些股票论坛里的大V，反而关注收废铜废铝的、去非洲挖矿的、开小电缆厂的从业者。\n\n他们不在乎哪个股票涨跌，他们告诉你的是「铜价太高了，这买卖快干不下去了」——这时候你就知道铜价已经开始抑制现实产业了。\n\n3. 怎么找到这些账号：定期打破信息茧房\n\n这类账号往往关注的人很少，但只要关注一个，平台就会顺着推更多同类账号，帮你跳出原来的信息圈层。他建议隔一段时间就把所有关注的账号（包括他自己）都拉黑重来一遍——否则算法圈住你的速度非常快，注册再多小号也没用，很快又会被同一套推荐逻辑圈回去。\n\n## 四、防风险不是只有清仓一条路\n\n1. 现在的风险是结构性的，不是全面系统性的\n\n他判断现在离全面系统性风险还差得远——过去一年涨得最多的是科技和有色贵金属，但同期也有大量股票其实一直在跌。所以防风险不必等于清仓离场，也可以换到那些前期没大涨、对加息降息不敏感的标的上，同时适度降低仓位。真正判断出现全面系统性风险时，他不但会清仓，还会考虑做空。\n\n2. 仓位是一个循序渐进的过程，不是满仓和清仓两个极端\n\n他描述了自己仓位管理的完整节奏：底部满仓满融，意识到风险后先去掉融资、保持满仓，继续上涨开始减仓，涨到最高点、找不到可买的标的时才清仓，行情继续无厘头上涨才考虑做空。清仓的出发点是「上涨空间和便宜标的都已经消失」，这不等于判断它一定会跌；真正做空需要更明确的下跌信号，两者是完全不同的决策。\n\n## 五、做空同样要控制杠杆，别把自己逼到爆仓\n\n1. 爆仓是因为杠杆打满，不是期货本身危险\n\n他认为期货容易让人倾家荡产，根源是贪心、总想一夜暴富，而不是工具本身有问题——完全可以不用满杠杆操作，比如理论上能做六倍的额度，你完全可以只拿出十分之一去用，杠杆倍数是自己控制的。他自己做期货从不超过两倍杠杆，也就是要做错五成才会爆仓。\n\n2. 留出应对保证金追缴的余量\n\n他提醒不要把账户里所有资金都拿去交易，得留一部分应对盯市亏损——能不能扛过短期波动，取决于你有没有给自己留缓冲空间。\n\n## 六、铜越涨，下跌的空间就越大：这是「坑」的镜像\n\n1. 他给的一个原创比喻\n\n他之前讲过股票是个登高游戏，坑是一种资源——起点越低能登的就越高，胜率也越大。反过来，铜价每涨一天，下跌的概率和空间也在同步扩大。\n\n山顶也是一种资源，这两者是镜像的。\n\n他说自己现在提示风险，恰恰是因为方向看不清——真正确定该看空的时候，反而不叫风险了，因为方向已经明确。\n\n2. 他澄清自己从来没说过看空铜价\n\n他反复强调，只要一提有色金属就有人说他看空，但他从没在公开场合做过涨跌判断，只是认为继续上涨的确定性不足，所以不会跟着赌它涨。他提到自己之前写过一套阶段划分——确定性买入、确定性持有、不确定性持有、不确定性卖出、确定性卖出，最后才是做空，说明看法本身是可以随信息逐步变化的，不是非黑即白。\n\n## 七、跳出「心理账户」：换个标的重新买入\n\n1. 为什么要在同类资产里「换一个」\n\n他建议在一只票上赚过钱之后，下次买同类标的最好换一个，而不是回到原来那只，这样才能保持警惕。原因很直接——回到曾经赚钱的标的时，人总会下意识觉得\n\n反正已经赚了很多，亏一点也无所谓\n\n——这就是心理账户在作怪；换个新标的，才会重新认真评估它现在到底值不值得买，而不是凭着过去的战绩想当然。\n\n## 八、观察一只股票的股东论坛，是一种免费的训练\n\n他反复强调这不是在评价个股，只是拿一个长期公开、方便观察的样本来演示方法。他说一只股票从下跌到上涨再到下跌的完整过程里，股价、股东人数、论坛舆情是相互影响的，观察一个冷门股票没有意义——几天才有一条发言，看不出任何变化，要挑一个讨论热度足够高的样本才有价值。\n\n看评论区的重点不是内容本身，而是感受那种互相打气、互相壮胆的整体氛围，同时跟踪股东人数是否还在增加。把消息面、股东人数、股价变动这几件事联系起来看，下次遇到类似情况就有经验判断了——这才是在市场里真正变得成熟的方式：做一个冷静客观的观察者，而不是进去就跟人「入教」，互相讲信仰打气。他还提到，季报里公布的股东人数是唯一有确定时点的硬数据，铜价金价这些实时信息对他来说反而不重要。\n\n## 九、一致性太高，就是一种风险信号\n\n他观察到一个现象：很多人分析的角度完全不同，但最后得出的结论永远一样——不管从哪个方向论证，都指向铜还会涨、黄金还会涨。这种高度一致性本身就是一种警报，就像前一阶段大家都认为光模块最好的时候，恰恰就是它见顶的时候。\n\n## 十、政治的不确定性：别把特朗普的行为想得太简单\n\n1. 他提醒的那个变量\n\n他认为下半年最大的不确定性是：特朗普如果输掉中期选举、面临弹劾风险，会不会「破罐子破摔」？很多人默认他一定会全力解决美债问题，但只剩两年任期，未必还有这个动力——如果已经当不成一个有作为的总统，索性多为自己捞点好处也不是没可能。他提醒大家不要总站在自己持仓的角度看问题，反过来假设市场必须配合自己的判断走。\n\n2. 别觉得自己比顶级投资人更懂\n\n他举了达利欧和巴菲特目前都在持有大量现金观望的例子，反问普通人凭什么比这些人、甚至比沃什本人更笃定「肯定不会加息」。他说自己唯一确定的一点，就是现在什么都判断不了。\n\n## 十一、这是一个确定输家的时代\n\n他把当下定性为「乱纪元」——最难判断未来、也最容易确定输家的时期。想在这种局面下当赢家很难，因为不确定性太多，连顶级投资人之间的判断都分歧巨大，更不用说普通人。他给的策略很朴素：\n\n你不用担心大家都不想当输家、那谁输——你放心，输的人有的是；你唯一要做的，是不要让自己成为其中之一，然后等着捡便宜。","toc":["一、他反复强调的一件事：只讲机理，不判断涨跌","二、CPI公布之后：为什么行情看起来「不像加息」","三、研究一个行业，要找到真正在一线的人","四、防风险不是只有清仓一条路","五、做空同样要控制杠杆，别把自己逼到爆仓","六、铜越涨，下跌的空间就越大：这是「坑」的镜像","七、跳出「心理账户」：换个标的重新买入","八、观察一只股票的股东论坛，是一种免费的训练","九、一致性太高，就是一种风险信号","十、政治的不确定性：别把特朗普的行为想得太简单","十一、这是一个确定输家的时代"],"url":"https://xueqiu.com/2573414707/409084044","chars":3590},"topics":["加息传导","科学思维","信息茧房","逆向思维","做空杠杆","紫金样本"]},{"date":"2026-09-11","bili":{"title":"老木匠 2026年9月11日直播文字稿（央行资产负债表、外汇占款、加息与升值、铜囤积、美债、两融热菜","text":"## 一、先把会员直播的事说清楚：只讲知识，不讲个股\n\n昨天有不少人充了舰长，这事得先说清楚，我劝大家慎重。\n\n我搞会员直播也不会告诉大家具体的股票，依然以讲知识为主。有人是冲着\"进来听听具体怎么操作\"来的，那我讲不了——讲那些属于投顾的活，必须有投顾资质，我做了就是违法。\n\n价格我也看了，一个月将近两百，还是包月，只管一个月，一年下来两千多，不是小钱。而且这钱不是我定的，是平台定的，三个档位我改不了。我要能定，就给大家定一年九十九。\n\n丑话说在前头：\n\n会员直播和现在的内容范围差不多，只是可能讲得更系统一点、细致一点，我备备课，仅此而已。\n\n不要期望太高，期望太多失望更多，别到时候觉得上当受骗。\n\n现在充了的，有三天的无条件退款期，觉得不值直接退，我没有任何想法，也不会有心理负担——我不靠这个生存。\n\n为什么还要做会员直播？两个原因：一是缩小范围，人少了有些话好说；二是会员直播不能录屏，再散播出去属于违规。就这些。\n\n另外澄清几个地方：知识星球我只是占个坑，暂时不会做，真做会告诉大家，现在别进去；微博我不会再写东西了，写东西主要在雪球，直播就在 B 站；公众号上那个用我名字的是假的，我没有公众号；小红书之类的，你们自己分辨。\n\n会员直播要满五十个会员才能开，昨天已经够了。我打算周六周日琢磨琢磨讲什么，倾向于选晚上，想听什么可以提。\n\n## 二、央行的资产负债表，为什么\"资产等于负债\"\n\n昨天有个小伙到我这儿来\"踢场子\"，提到广义货币和基础货币的问题。我觉得有必要把央行和央行的资产负债表讲一讲。\n\n首先要记住一件事：中国人民银行的资产负债表里，没有\"所有者权益\"这一栏。\n\n一般公司的会计恒等式是：资产 = 负债 + 所有者权益。但我们的央行是：资产 = 负债，绝对相等。\n\n美联储的资产负债表是有所有者权益的，虽然数额很小、和它的资产负债表规模不在一个量级，但它确实有。为什么？因为美联储最初实际上是个私营机构，有会员单位投资。而我们的央行从诞生那天起就是行政机关，没有投资的问题，所以没有所有者权益这一项。\n\n那问题来了：央行在经营过程中会产生利润——比如发放再贷款、进行再贴现、做中期借贷便利（麻辣粉）、买入抵押债券，商业银行要付利息，这就产生了利润。这些利润记在哪儿？\n\n记在负债端的一个子项目里，叫\"资产项\"。不是所有者权益，是这些年留存的利润，当然还有别的东西，细节不展开。\n\n所以第一步先把这个印象印在脑子里：央行的资产负债表和普通公司完全不同。懂了中央银行是怎么回事，你才能理解社会上的很多现象，才能分清什么叫财政政策、什么叫货币政策。很多人连这两个都分不清，分析问题永远驴唇不对马嘴。基础的知识得回去自己补，货币银行学有通俗读本，也有大学教程，挑一本看完，再来听我讲就懂了。\n\n## 三、外汇占款：中国的基础货币是怎么发出来的\n\n改革开放以来很长一段时间，我们投放基础货币的机制和美国完全不同。那时候我们有个制度叫强制结汇。\n\n所有出口企业在国外赚的美元等外汇，回到境内不能以美元形态存在，必须强制结算成人民币，卖给国家——其实就是卖给央行下面的公司，汇金就是这么来的。\n\n你把外汇给他，你得拿到人民币，这人民币哪来的？由人民银行印。说白了就是央行印出相应的人民币给你，把你的美元买进来，变成我们的外汇储备。\n\n这就是中国长期以来投放基础货币的基本方式，叫外汇占款。\n\n加入世贸以后外贸发展很快，长期顺差，外汇结存很多，大家都来强制结汇，于是就要印很多很多人民币。外汇储备在增加的同时，投放出去的人民币也越来越多——这就引发了由外汇占款导致的通货膨胀。\n\n这个问题当年怎么解决的？当时的央行行长周小川搞了个资金池制度：市场上的钱太多，就提高商业银行的存款准备金率，把钱圈回来。我们国家的存款准备金率一度到过 20%，全世界非常非常高的水平。它解决的就是外汇占款导致的通胀。\n\n大概十年前开始，我们不再实施强制结汇了。外贸单位在国外赚的美元，可以自己留存，放境外、汇回国内以美元存款形式存在、拿去境外投资，都行。\n\n结果是什么呢？最近这些年每年外贸顺差都非常大，几千亿到一万亿美元，但你会发现外汇储备并没有增加，长期维持在 3 万亿美元左右。\n\n这个变化带来一个直接后果：以前靠外汇占款投放基础货币的这条管道没了。流通中货币的增长量，和经济增长不相匹配，通缩的趋势就出来了。\n\n当然通缩的原因很复杂，这只是基础货币这一个角度，还有广义货币和基础货币的乘数效应扩不出来的问题，那是另外一回事。\n\n## 四、现在央行靠什么放钱，美元在中国是商品\n\n既然外汇占款这条路不走，现在央行靠什么投放基础货币？\n\n靠逆回购、中期借贷便利（麻辣粉）、酸辣粉、抵押债券这些工具。形式不同，本质一样：都是给金融机构提供再贷款，就是借钱给商业银行。\n\n国债逆回购相当于你先把国债卖给我，约定条件再买回来；中期借贷便利就是直接借钱给你；抵押债券就是你卖给我、到期赎回。归根结底都是给商业银行再贷款。\n\n这个过程，你也可以把它理解成：央行在给商业银行\"存款\"。对商业银行的资产负债表来说，无论是老百姓的存款还是央行的再贷款，都记在负债端，都是钱的来源。唯一的区别是——央行的钱是自己印的。\n\n所以昨天我那个帖子说的意思是：你们理解的\"钱\"，在央行那里是不存在的。\n\n为什么这么说？你手里的钱能买东西，代表财富。但在人民银行手里，这些钱不代表财富，也不能用来买东西。相反，对人民银行来说，人民币是它的负债——印了多少就相当于欠了多少。\n\n央行不能自己给自己发钱玩，就像赌场老板不能自己给自己发筹码。\n\n由此可以推出一件事：无论外汇还是黄金，在央行那里都不叫\"钱\"，叫储备，属于资产端。这些资产是怎么来的？是印钱买来的。印出来的钱叫流通中的货币，记在负债端。\n\n所以央行增持黄金，不是印人民币去买黄金。它是把美元卖掉、用美元去买黄金——在资产端的不同储备种类之间做调整。你每次看到\"央行这个月有多少黄金\"，都是在外汇储备数据里公布的。储备种类的调整不改变央行的资产负债表，不是扩表行为。\n\n还要扭过来一个概念：美元在中国境内不是货币，叫商品，是有金融属性的商品。货币在中国国内只有人民币，货币都是法定的，所以叫法币。\n\n如果美元允许在中国直接流通，那中国的法定货币就变成了美元，铸币权就丧失了。铸币权是主权的一个组成部分——自己印钱、调整流通中的货币数量，这是主权的一部分，让给别人就相当于丧失了一部分主权。\n\n## 五、铸币权就是主权，通缩只发生在\"印钱不随便\"的地方\n\n日本就是这样。日元是日本自己印的没错，但调整流通中日元数量这件事，它并不完全说了算。为什么？因为日本不是一个完全主权国家。\n\n所以有人经常拿日本通缩来比中国，说中国应该吸取日本的教训——没有意义。日本对中国来说没有任何借鉴意义，尤其在铸币权这块：日元在国内流通的数量、应该发多少、日元和美元的汇率，都不是日本人自己能定的。\n\n中国并没有日本那样的通缩基础。对中国来说，治理通缩是比较容易的。\n\n很多专家说治理通缩比通胀还难，那都是只知其一不知其二，因为他们拿日本举例。治理通缩难只在几种情况：\n\n第一，金融不独立——像日本这样印钱不随便。\n\n第二，金本位、金属货币时代——黄金白银的产量不是你能控制的，生产发展了、货币量跟不上，就发生通缩。中国历史上通缩的次数多了，唐末的混乱就是因为通缩。\n\n第三，货币和主权不重合——比如欧洲。德国用欧元，但欧元不是德国一家说了算，德国经济发展需要投放欧元的时候，不是它自己能定的。所以欧洲也可能通缩。\n\n现在是信用货币时代，钱是印的，经济发展多少就印多少，怎么会通缩？你见过俄罗斯通缩吗？土耳其、阿根廷、智利、津巴布韦通缩了吗？随便印钱的时候，最难治理的是通胀，不是通缩。\n\n所有能发生通缩的国家，都是因为印钱不随便。\n\n## 六、全球加息，只有中国没有通胀、只有升值压力\n\n回到市场。昨晚美股的情况大家都看到了。今晚要公布 CPI，如果继续超预期，我认为下周就有可能上热菜。\n\n现在的局面是：欧洲已经加息了，交易员普遍预计还要继续加；日本加息在即；在此之前新西兰已经加过。全世界都开始进入加息周期，货币的边际条件在收缩。\n\n这个时候，千万不要用自己的信仰去支撑投资。动不动就说\"美国有四十万亿国债，他怎么敢加息\"——这是你的信仰，不代表现实。\n\n我虽然预测不了美联储九月是不是一定加息，但我会把它当成一个认真的风险事件来看待。前些天还有人信誓旦旦说不会加息，这两天改口了，现在华尔街的交易员都在提高美联储加息的概率。\n\n谁也不要听谁的，钱是不会说谎的。现在是乱纪元，谁也不知道最终会不会加，一切都处在风险状态下，你就一定要保护自己的安全。\n\n有人说我唱空——你连什么叫唱空都分不清。我要唱空就去买空单了。\n\n大家为什么都要加息？因为都要保自己的币值，否则所有货币都会废纸化。\n\n然后你想想这个问题：为什么全世界都面临巨大的通胀压力，只有中国没有？\n\n答案很简单：因为疫情期间中国没有放水。\n\n其他国家生产停滞，必须靠放水维持经济运转，采取了极度宽松的货币政策；中国当时的货币政策是克制的，没有过度宽松。所以 2020 年至今，全世界股市的上涨都是因为当年发钱发多了。\n\n隐含通胀都在上升、只有中国的通胀没上升，那中国的钱为什么没多多少？因为我们的汇率没有及时升值。全世界都印了很多钱，只有中国没印，按道理人民币应该大幅升值，但我们为了保出口没有大幅升值。\n\n所以现在的局面是：我们没有通胀的压力，但有货币升值的压力。\n\n双方都要逐渐释放自己的压力：国外要治理它的通胀，我们要允许人民币缓慢升值。现在按汇率比较，我们和国外的购买力是不匹配的，人民币有点太值钱了，所以要逐渐释放升值压力，人民币对美元会出现缓慢升值。\n\n这里面还有个判断：中国暂时不会降息。国外都进入加息周期的时候中国降息，利差就更大了，会招来套利资金。\n\n## 七、人民币升值谁受损，低端外贸的终局\n\n人民币缓慢升值的过程中，有三类行业会受损。\n\n### 1. 出口企业\n\n你原来的成本优势会逐渐丧失。\n\n### 2. 主要资产在国外的企业\n\n不一定全是矿，所有行业都一样：人民币升值，你以人民币计价的资产就会出现汇兑损失。汇兑损失是财务费用的组成部分，会侵蚀当期利润。\n\n### 3. 国际定价的大宗商品\n\n国外上涨的价格会比国内更快。以后你看到国外的铜比国内的铜涨得快，不用奇怪，就是汇率变化。对矿在国外的挖矿企业来说，当地通胀让挖矿成本上升，同时它卖到中国来的产品是以人民币计价的、涨得慢——成本上升比售价上涨快，原来的利润就被侵蚀了。\n\n再往下，低端外贸，尤其是服装鞋帽玩具这些传统产品，压力会非常非常大。做这行生意的，我认为应该考虑改行，不要指望有一天会再好过来。\n\n从强调\"双循环\"那天开始，就应该意识到有今天。服装是最低端的：劳动密集型、最没有技术含量、最没有附加值，是当年我们牺牲福利、资源和环境去换外汇时干的活，相当于没钱的时候给人家当保姆。\n\n美国的问题现在是通胀降不了，因为没有人再给它提供廉价的生活用品。它以为紧缩货币就能解决问题，但中国也可以\"紧缩商品\"——不是不卖给你，那不符合自由贸易原则，而是：取消出口退税行不行？环保查严一点行不行？要求所有工人都交社保行不行？这么一来，那些低端生意自然就做不下去了。\n\n现在就在查所有的劳动密集型产业是否都交了社保。东南沿海当年靠这种模式做大的老板们很不服，所谓\"润人\"里很大一部分就是这种人，他们形成了路径依赖，认为那些做法应该永远有效。\n\n人民币升值、查环保、查劳动法，这三样加起来，他们就觉得干不下去了。没错，就是不想让你干了。有人说那这么多就业怎么办？放心，这些人不在这儿就业，也会在别的地方就业，转型本来就是一个痛苦的过程。\n\n如果我们再牺牲资源、牺牲福利，去给国外生产袜子、裤衩、衬衫，那我们一辈子就想当保姆吗？没钱的时候伺候你是因为没钱，现在都有钱了，为什么还要伺候你？\n\n未来的方向在内需：旅游、文化、餐饮，所有提高人的生活品质的消费，以后都会好。以内需为主的意思就是，我们生产的东西自己用，提高自己的生活品质，而不是像原来那样生产东西让外国人提高生活品质。\n\n## 八、铜的\"虚假供不应求\"：关税套利与加息打击\n\n再说铜。\n\n有消息说美国要加关税，于是有人提前在国际市场买铜现货，运到美国囤起来，等关税落地、铜价一涨再卖出，赚中间的差价——这叫套利。这个消息我不保证是真的，我倾向于它是假的，但这个逻辑本身值得讲。\n\n关键在于：这些囤起来的铜离开了生产领域。囤积就是我拿着不用、等着涨价，但有人要用。生产电缆的厂子天天要用铜，你拉走一部分囤着既不生产也不用，人为地造成了生产领域的供给紧张——所以这波供不应求是虚假的。\n\n有人说铜从八千涨到一万五，你说不是供不应求是什么？这就不懂了：一个东西涨价不一定由于供不应求，供大于求一样可以价格上涨。\n\n2021 年之前中国的房子一直涨，你告诉我那时候房子是供不应求吗？它是一夜之间从供不应求变成供大于求的吗？不是，那是投机需求，不是真正的需求。\n\n好，现在如果美国突然说不加关税了，你这些囤货的基础还存在吗？不存在了。这一波铜一定会卖出来，变成竞争性供给，瞬间就变成生产领域的供大于求。\n\n而且在加息的情况下，投机需求消失得更快。为什么？因为加息提高了持有成本。铜放在手里是有成本的：你花钱买的，这笔钱有机会成本。如果它不涨价，你就是天天赔钱。不要以为囤什么东西都一本万利。\n\n所以加息对囤铜是双重打击：一方面打击生产活动——比如 AI 数据中心建设的成本提高，边际上打击对铜的需求；另一方面，囤货的人面临过高的财务成本。\n\n再加上，如果美国决定不收铜的关税，那各地的铜价就是一样的，美国还有什么必要囤铜？美国的铜价一跌，这部分变成竞争性供给，全球的铜就没那么紧张了，无论是沪铜还是伦铜都应该出现过剩的局面。\n\n不过话说回来，加不加关税是特朗普一句话的事。你所有的分析一顿操作猛如虎，最后全靠特朗普，这都没用。明天他睡一觉醒了说要加百分之百关税，铜还会涨。所以我不判断涨跌，我只讲逻辑。\n\n顺着铜讲一个事实：大量原本准备运到中国的铜矿，因为美国给的价格更高，直接改道运去了美国，导致中国的铜精矿进口非常紧张。这也就是为什么 TC/RC（加工费）已经变成负的——三年前是每吨正 88 美元，现在已经变成倒找钱给矿商，负几百美元。冶炼厂买铜矿加工，原来人家委托你加工给你钱，现在你要给人家倒找钱。这不是因为缺铜，是因为美国的囤积需求太多了。\n\n想看真相就去看三大交易所的库存，看最近五年的变化。今年三大交易所的铜库存比去年同期大概多五十万吨。很多人告诉你\"今年一直在去库、是历史最低\"，但铜的去库和累库是有季节性的：冶炼是高温连续生产、不能停，用铜企业却有很强的季节性，所以每年年底年初累库、之后逐渐去库、到年底又累库。你要比较过剩还是短缺，应该比去年同期，不是比今年年初——今年年初比去年年初多的更多。\n\n## 九、日元回流，与外资买人民币资产的双重算盘\n\n最近日元汇率在飙升。我不认为这是日本央行干预的结果，而是有不少资金预计到日本一定会加息，开始回流日本。\n\n你要把财富从美元换成日元汇回日本，就得先抛售美元、买入日元，日元需求增加，汇率就变贵了。虽然不是所有海外日元都会回流，但交易条件已经变了——原来按利差设计的套利，现在利差要缩小了。\n\n这个过程恰恰反映有人在卖出美债。因为很多日本投资者是借日元买美债的，也有一部分买美股。如果这个趋势持续——比如日本加息后表态非常鹰派、十二月还要再加——利差越来越小，回流就会更多。刚开始是卖美债，接下来可能卖美股。不是一开始卖就立刻跌，但它已经改变了流动性的分布格局，相当于从美国抽离流动性。\n\n这跟汇金、证金救市是一个道理：它往市场里撒钱，不是想把股价拉起来，撒到一定程度自然就起来了；反过来，过高的时候抛售股票、抽离流动性，抽到一定程度自然就会跌。\n\n这里还有一个非常重要的变量：全世界的大资本都预计人民币会升值，就会有大量资金来做升值套利——买入人民币资产，等着升值就行。他甚至不需要股票涨价，只要股票不跌价就可以。\n\n优质资产包括央企、大盘蓝筹，也包括个别地方流动性好的核心地段房地产。外资来了不是指望房子涨多少，而是指望人民币升值，换回美元就赚钱了。所以人民币升值的过程中，中国所有优质资产都可能升值。\n\n当然这是长期现象，不是今天买明天涨，在未来两到三年能看到。赌汇率升值是一次性机会，升到一定程度就平衡了，不能老升。\n\n外资也可能买一部分国债债券，那个更保靠，但债券只能博一个收益——人民币升值的收益，博不到资产本身涨价的收益。而我认为很多热钱进来是要博双重收益：既博资产价格上涨，也博人民币升值。\n\n## 十、贝森特坐庄美债：交易员思维管不了财政部\n\n别老怀疑美国是一个强国。前两天把美联储主席说成阿猫阿狗、啥都不是，人家掌管着全世界最强大的国家的央行，加息降息对整个世界都有巨大影响。你不认，说跟你没影响，那你就试试。\n\n我判断不了，我一直讲的就是这件事，我只是不掺和。神仙打架我就离远点，怕崩一身血。\n\n说说贝森特。他宣布坐庄美债之后，美债收益率又创新高，那肯定是没达到目标——他的目标是降低美债收益率。\n\n贝森特这个人的出身是交易员，他从交易员的角度出发考虑金融市场，这是不对的。就像你让刘翔去主办一次奥运会比赛——刘翔能在奥运会上取得好成绩，但主持举办一次奥运会需要的才能是完全不同的。现在贝森特就是把交易员的那些想法带到了管理美国财政部，认为通过交易模式就能影响美国国债的价格。\n\n管理者不是交易员。总统都下场炒股票，说\"我给美国挣了不少钱\"，那美国股票的信誉何在？谁能玩过他？\n\n而且交易员都会这么想：你做庄、你是财政部、你掌握所有信息，我玩不过你——那我不玩了行不行？我不跟你玩，我卖了。\n\n贝森特说什么\"做空的放马过来\"，问题是美债没有空头，没有靠做空美债赚钱的，因为人家不跟你玩了。你这边发债、那边回购，自己跟自己玩；你要有那能耐，不借钱不就完了吗？钱都是借来的，还装什么大款。\n\n## 十一、两融余额、注水口与\"上热菜\"\n\n回到市场本身。\n\n现在的两融余额大概 2.6 万亿，我认为它应该回到 2 万亿以下，1.8 万亿比较好一些。也就是说还有一些被动资金需要清仓。\n\n现在这些人在挺，尤其科技股里面的很多融资盘都在寄托反弹再卖出。问题是你也想反弹卖、我也想反弹卖，那谁会买呢？\n\n一旦开始出现科技股融资盘被动卖出，指数大幅下挫，就是\"上热菜\"。那时候有些标的会被当成工具使用——叫注水口。需要往市场里注钱的时候，得有通道，有些标的就会成为这次的注水口。\n\n这是我两个月之前就想明白的事。我现在天天直播要做的事就是等——等这件事什么时候发生。\n\n你仔细观察，昨天中字头有很多已经在涨了：中国移动、中国中铁、银行。中石油不算，它是石油涨价。什么叫核心资产，这时候你就知道了。中字头里涉及有色金属的，前一段已经涨过，现在不会涨，因为它正好在暴风眼里；而有些东西住在低位，就一定会成为注水口。\n\n这真不是\"亲儿子\"的问题，是因为它稳定、安全性强。国外资金进来买什么？就得买这些东西。热钱要进中国股市，必须通过这些核心资产来注水，它们能猜到你必须通过这个通道，我都能猜到的，聪明人多的是。\n\n所以说市场并不复杂，复杂的是人心。看别人涨了你就受不了，就得跟人买一样的东西；别的东西跌着你就不敢买。永远都是这样一个轮回。\n\n而且我要提醒：一旦出现两融被动卖出，那是非常可怕的。2024 年年初雪球敲入那种下跌你们都见过吧——那就是被动卖出，跟现在融资爆仓差不多。但雪球敲入的规模还很小，跟两融不是一个量级。那种情况下，不管什么东西都无厘头地一通杀，那只能博一个反弹，不代表可以猛猛进去。\n\n我认为管理层也不会允许这种现象出现，一出现苗头就得开始注水。\n\n所以没什么可怕的：有些东西跌了以后还能回来，有些东西跌了回不来了。能回来的你就不用害怕。关键第一不能上杠杆，第二保持自己可忍受的仓位。\n\n## 十二、2015年的教训与市场的本质\n\n我昨天给大家看了我微博上的帖子，那是 2014 年年底写的。当时我说：别看现在是牛市大家都赚钱，到最后你带不走一分钱。2014 年正是如火如荼，天天涨，一直涨到第二年六月，最后谁带走了？\n\n我告诉你，那一波进去的人，现在都已经终身不进入股市了。\n\n我 2014 年到 2015 年大概赚了三倍，2015 年四月份清仓，大概在四千三百点或者四千五百点。清仓完以后又来一波上涨，一直涨到 5178 点——你也可以说我踏空了。但随后波澜壮阔的下跌开始了，那才叫熊市，你们现在看到的不算什么，那才叫热菜大餐。\n\n那时候想跑一个也跑不了，开盘全跌停，一千只股票跌停，跌得最少的也有百分之九点九。最后上市公司想了个什么招？全部发公告停牌——不交易了，这回不跌了吧。你经过一次那样的东西，就成熟了；没经过，总觉得\"涨了这么多我随时可以跑\"。我告诉你，跑不了。\n\n如果大家都能从那儿跑出来，那这个市场还吃啥喝啥？市场还怎么运转？大家都不赔钱，钱从哪来？印花税谁交？上市公司的融资谁拿？公募基金经理坐头等舱、穿高档西服、戴名表，这钱谁拿？\n\n这一个篮子里，总有人拿勺子往外取钱，那就得有人不断往里添钱。你的问题在于，不要成为那个往里添钱的人。\n\n别的你都不用操心。制度不合理也好、量化怎么地也好——现在量化已经被限制了，你告诉我怎么的了？妖股更多了。前两天炒农业、炒黄酒，这在量化存在的情况下很难做到，故事都不用讲了。\n\n别以为把草原上的虱子清除了斑马就好过了。狮子清除了，猎狗就会多，斑马依然不会好过。为什么？因为如果斑马好过，它就会把草吃光，最后所有的斑马都得饿死。狮子和猎狗吃斑马，对斑马种群的健康发展是有好处的；没有它们，斑马会无限繁殖，最后把草吃没，大家全饿死。\n\n股票博弈最需要看的就是生物链这一套东西，包括进化、自然选择、生物链的形成，找本书看看，非常容易类比。\n\n顺便推荐几本书：《自私的基因》《盲眼钟表匠》《随机漫步的傻瓜》（塔勒布）。《盲眼钟表匠》看起来讲的是生物，实际上里头有很多关于概率的思考；塔勒布那本我觉得比《黑天鹅》写得好。\n\n## 十三、仓位原则与我的投资目标\n\n现在的市场我依然感受到风险，非常诡异。我前两天专门写过一个帖子，只有一句话：我感到这个市场非常诡异，我自己已经做好了防撞击的准备。那个短贴我没删，看过的人就算我没白写。\n\n我的目标很简单：\n\n第一，绝对值不亏损；\n\n第二，相对值跑赢四大指数——上证指数、深证指数、创业板指和沪深300。\n\n我现在是满仓，但我是从满仓满融一路减下来的。满仓对我来说就相当于清仓了。你别跟我比，我能干的事你们干不了——我可以忍受满仓下跌，因为我对自己的标的了解程度，你们达不到，所以下跌的时候我可能不害怕，但你们不一定不害怕。\n\n所以我不建议你跟我做一样的事，到时候我又得天天给你们按摩。\n\n我从来不公布持仓，我买什么也没告诉过你。有人跑来我这儿发泄情绪，说哪个股票跌了——那跟我没有关系。谁发言谁定，一会儿说我的持仓是这个，一会儿又定成那个，我这持仓自己都定不着，就像公园里下棋，坐在那儿下棋的人根本摸不着棋子，全是外人在说。\n\n你要降到一个自己能忍受的仓位，融资你就不用考虑了。我这么爱融资的人现在都不融资，你想想。\n\n今天的行情：紫金矿业跌 7.2%、洛阳钼业跌 7.8%、云南铜业快跌停、中国铝业跌 5.44%，有色金属出现波澜壮阔的下跌。科技股反而比我想的强，摩尔线程、木斯只跌百分之四点多，新易盛还是红盘。继续观察，看看什么时候上热菜。\n\n最后做合规声明：这是评书，所有提到的股票都不能用来指导投资。我不是研究股票的专家，只给大家讲我看过的书、学过的知识，不指导投资，不提个股。\n\n谢谢大家陪我一上午。","toc":["一、先把会员直播的事说清楚：只讲知识，不讲个股","二、央行的资产负债表，为什么\"资产等于负债\"","三、外汇占款：中国的基础货币是怎么发出来的","四、现在央行靠什么放钱，美元在中国是商品","五、铸币权就是主权，通缩只发生在\"印钱不随便\"的地方","六、全球加息，只有中国没有通胀、只有升值压力","七、人民币升值谁受损，低端外贸的终局","八、铜的\"虚假供不应求\"：关税套利与加息打击","九、日元回流，与外资买人民币资产的双重算盘","十、贝森特坐庄美债：交易员思维管不了财政部","十一、两融余额、注水口与\"上热菜\"","十二、2015年的教训与市场的本质","十三、仓位原则与我的投资目标"],"url":"https://www.bilibili.com/opus/1246668516029890580","bv":"","minutes":0,"chars":9797},"ai":{"title":"老木匠·2026年9月11日：央行的账本与谁是「注水口」","text":"## 一、央行的资产负债表：和普通公司完全不同\n\n1. 中国人民银行没有「所有者权益」这一栏\n\n普通公司的资产负债表是资产等于负债加所有者权益，但央行的表里没有所有者权益这一项，就是简单的资产等于负债——因为它从成立那天起就是个行政机关，根本不存在谁出资的问题。他补充说美联储的情况不太一样：它最初是私营机构，有会员单位投资，所以确实存在所有者权益，只是相比它庞大的资产负债表规模，这部分小到几乎可以忽略。\n\n2. 央行放出去的钱，为什么记在负债端而不是资产端\n\n他解释说，普通人理解的「钱」在央行那里其实不成立——你拿到的钱代表财富，但央行手里的钱不代表财富，它印出多少钱，相当于就欠了多少债，这就是流通中货币要记在央行负债项下的原因。他打了个比方：\n\n央行不能自己给自己发钱玩，就像赌场老板不能自己给自己发筹码，道理是一样的。\n\n3. 外汇、黄金对央行来说不叫「钱」，叫「储备」\n\n外汇和黄金在央行的账本上都记在资产项下，叫储备，不叫钱。央行增持黄金，不是凭空印钱去买的，而是把手里原有的美元卖掉去换——这只是资产端内部的结构调整，不算扩表。他还提了个细节：每次公布黄金持有量，都是跟外汇储备一起公布的，因为它本来就是外汇储备的一部分。\n\n## 二、外汇占款：曾经最主要的基础货币投放方式，为什么现在没有了\n\n1. 强制结汇年代的机制\n\n以前实行强制结汇：出口企业在国外赚的外汇，回到境内必须卖给国家换成人民币，这个渠道就叫外汇占款，是过去最主要的基础货币投放方式。由于对外贸易顺差一直很大，外汇越结越多，印出来的人民币也水涨船高，通胀压力就是这么积累起来的。他还提到周小川当年的应对办法——把存款准备金率一度提到20%，这在全世界都是极高的水平，为的就是把这些多印的钱重新圈回来。\n\n2. 大概十年前，我们不再强制结汇了\n\n此后出口企业赚的外汇可以留在境外，也可以留在国内当成美元存款，不再强制换成人民币。所以这些年虽然外贸顺差一直不小，但外汇储备并没有跟着涨，一直卡在3万亿美元左右——这正是取消强制结汇之后的结果。\n\n3. 没有了外汇占款，就带来了通缩压力\n\n这个基础货币投放渠道消失后，流通货币的增长速度和经济发展速度不再匹配，通缩的压力就这样积累了下来（他说通缩的成因很复杂，这只是基础货币层面的一个原因）。现在投放基础货币主要靠逆回购、中期借贷便利（俗称「麻辣粉」）这类工具，本质上是央行在给商业银行提供再贷款，可以理解成央行在给银行「存款」——区别只在于央行的钱是自己印出来的。\n\n## 三、人民币现在的处境：没有通胀压力，但有升值压力\n\n1. 为什么全世界都在加息，只有中国没有这方面的压力\n\n疫情期间各国生产停滞，只能靠放水撑住经济，欧美日都搞了极度宽松的货币政策；而中国当年相对克制，没有跟着大水漫灌。所以疫情之后这几年全球股市的普遍上涨，本质上是当年多印的钱在发酵——全世界隐含的通胀都在往上走，唯独中国没有出现明显通胀。\n\n2. 但我们没升值，把压力攒下来了\n\n按理说人民币这时候应该顺势升值，但为了保住出口，当时没有及时跟进，压力就这样被攒了下来。所以他给出的判断是：现在的局面是我们没有通胀压力，却有升值压力，接下来要靠双方各自消化——国外治通胀，我们放人民币慢慢走高。\n\n## 四、人民币升值的连锁反应\n\n1. 两类企业会受损\n\n一类是出口企业，原有的成本优势会慢慢消失；另一类是主要资产在海外的企业（不只是矿业），会出现汇兑损失——海外资产按美元计价，人民币一升值，折算回来的账面价值就变少了，这部分损失会记进财务费用，直接侵蚀利润。\n\n2. 国际大宗商品，国外涨得比国内快，不要觉得奇怪\n\n同一种国际计价的大宗商品，按美元算涨得快，按人民币算就涨得慢，纯粹是汇率在中间起作用。对海外矿企来说，当地通胀推高了成本，同时美元售价也在涨，两头都受益；但卖到人民币升值较慢的中国市场，成本涨得比售价快，反而会侵蚀原有的利润空间。\n\n## 五、铜：库存该怎么比，关税传闻可能是假的\n\n1. 他重申自己「判断不了涨跌」，只讲供需逻辑\n\n他强调自己从没在公开场合对铜价方向下过判断，讲的一直只是供需关系怎么影响价格，以及美国为什么会出现大规模囤铜的现象。\n\n2. 囤积套利的逻辑\n\n由于市场预期美国会加征关税，就有人提前把现货买进囤在美国，等关税真正落地、价格被抬高后再卖出去，赚取这一段差价——这属于套利行为。他认为全球铜显得紧俏，很大一部分正是这批囤积造成的，这些被囤起来的铜实际上早就退出了真正的生产流通。涨价不等于真实供需紧张，供大于求一样能靠这种投机需求把价格推上去——2021年之前的中国房价就是同一个道理。\n\n3. 如果关税传闻是假的，会发生什么\n\n他倾向于认为「美国不再加征关税」这个消息本身是假的——期货市场常见的套路是涨到高点就放一个利空出来杀一波空头。但假设这个消息真的成立，囤货的逻辑基础就没了，这批铜会瞬间从紧俏变成过剩的供给；尤其在加息的背景下会消失得更快，因为持有成本变高了，囤着不涨价就等于天天倒贴钱。\n\n4. 看库存要看同期，不要看年初\n\n他提醒比较库存数据一定要看去年同一时间，而不是拿今年年初和现在比，因为需求端本身就有很强的季节性、每年年底年初都会先累库再逐步去库。他还提到一个可以印证囤积逻辑的数字：铜精矿加工费已经跌成负值，三年前一吨还能挣88美元，现在冶炼厂反而要倒贴钱给矿商——这不是因为矿真的少了，是因为美国的囤货需求把矿抢走了。\n\n## 六、日元汇率飙升：意味着资金正在从美国抽离\n\n1. 这不是日本央行干预的结果\n\n他认为日元汇率走高，是因为市场已经提前押注日本要加息，资金在边际上开始回流——要把资产从美元换成日元，就得先卖美元买日元，这个过程本身就把日元汇率抬起来了。\n\n2. 回流的过程就是在卖美债、卖美股\n\n不少日本投资者是借着低成本的日元去买美债、美股的，一旦利差收窄，这部分资金就会回流，先卖美债、再卖美股——本质上是在持续从美国抽走流动性。他拿汇金救市打了个比方：\n\n汇金救市不是想把股价直接拉起来，而是往市场里撒钱，钱多了它自然会起来；反过来，高的时候抽离流动性，抽到一定程度它自然会跌。\n\n日本现在做的事，就是在从美国抽离流动性。\n\n## 七、人民币升值背景下，热钱在赌什么\n\n1. 赌的不是股价涨，是汇率本身\n\n全球大资本预期人民币会升值，就会有资金专门做这个升值套利——买入人民币资产，只要价格不跌，等换回美元的时候本身就已经赚了，根本不需要股价上涨。\n\n2. 核心资产、核心地段房产都可能受益，但这是个两三年的过程\n\n升值过程中，央企蓝筹这类核心资产、少数流动性好的核心地段房产都可能受益，但这是一个持续两三年的慢变量，不是今天买明天涨——升到一定程度自然会趋于平衡。他把这个过程类比成1998年房改，如果那时候提前判断出房价会涨，买进去等着就行了。\n\n3. 关于降息，他的判断\n\n他认为中国短期内不会降息——在全球普遍加息的背景下如果反向降息，利差会进一步拉大，只会吸引更多套利资金涌进来。\n\n## 八、外贸：低端产业不会再回来，我们手里有「紧缩商品」这张牌\n\n1. 低端外贸受损是必然的，别指望它再回来\n\n他认为服装鞋帽玩具这类劳动密集型、低附加值的外贸生意会持续承压，做这行的人应该考虑转型，而不是等它有一天重新好起来——从提出双循环那天起，就该预见到今天。他拿巴菲特举了例子：伯克希尔哈撒韦最早就是做纺织的，最后连巴菲特也没能保住这个产业，因为产业升级之后人工成本会快速上涨，原有产品自然就没了竞争力。他还有个更扎心的说法：\n\n服装是我们没钱的时候给人当保姆换外汇用的，最没有技术含量、最没有附加值。\n\n2. 一句很直接的判断\n\n他的看法是，过去的低端产业本质上是在给全世界打下手——\n\n为什么美国人生活得那么浪费？因为中国的廉价商品在支持他这种生活方式。如果有一天中国不支持了，就得有人支持，如果大家都不支持了，这种生活方式就得改。\n\n3. 我们能做的：不是不卖给你，而是「紧缩商品」\n\n他提出了一个对称的说法：美国靠紧缩货币压通胀，中国其实也有自己的一张牌——紧缩商品。不是直接不卖，那违反自由贸易原则，但把出口退税取消、环保检查加严、要求企业依法给工人交社保，这类生意自然而然就做不下去了。他理解那些靠不缴社保、放松排污起家的沿海小老板对新政策的不满，但强调当年鼓励这么做只是因为整体太穷、没得选，不能把那时候的权宜之计当成理所应当。\n\n## 九、贝森特「坐庄美债」：错在把交易员思维用在了管理者的位置上\n\n1. 他的判断依据是一个角色类比\n\n他认为贝森特是交易员出身，用交易员那一套去管财政部本身就不对路——就像让一个顶尖短跑运动员去主办一届奥运会，需要的能力完全是两回事。他觉得贝森特把交易思维搬到了国家财政管理上，以为靠操作就能左右国债价格，这是从交易员的角度而不是管理者的角度在看问题。\n\n2. 为什么「坐庄」这件事本身很危险\n\n他指出这种打法的风险在于——如果大家都被吓跑了、不跟你玩了，自己借的债、自己发的钱，来回倒腾又能玩出什么名堂？\n\n美债空头之所以没人做，不是因为做空赚不到钱，是人家干脆不跟你玩了。\n\n## 十、「注水口」：市场需要往里注水的时候，会挑哪些标的\n\n1. 这是他两个月前就想明白、并在等待兑现的一个判断\n\n他的判断是，一旦科技股融资盘出现被动踩踏、指数大幅下挫，市场就需要注入流动性，而注水总得找个入口，某些标的会被当成承接资金的工具。他说自己现在要做的不是频繁操作，而是天天盯着，等这件事真正发生，找到那个入口就行了。\n\n2. 什么样的标的会成为注水口\n\n他观察到中字头和银行这类标的在大盘下跌时反而逆势上涨，认为这不是什么「亲儿子」待遇，而是因为它们本身足够核心、足够稳——境外热钱要进中国股市，同样会挑这些标的。他还补充说，前一阶段已经大涨过、正处在风口上的有色标的不会成为这个入口，反倒是那些位置偏低又足够核心的标的容易被选中，这个逻辑对境外资金来说同样成立。\n\n## 十一、市场生态：为什么限制量化不等于对散户更好\n\n他用草原上的食物链打了个比方：\n\n你把草原上的狮子和猎狗都清除了，斑马就好过了吗？不会——斑马如果没有天敌制约，就会无限繁殖，把草吃没，最后所有斑马都饿死。\n\n他借这个类比说明，限制量化之后游资很快会填补空位，讲的故事只会更简单粗暴（前两天炒农业、炒黄酒，连个说法都懒得编），这未必是对散户更友好的结果。\n\n## 十二、他自己的2015年，与今天的对照\n\n1. 2014年底他就写过一段提醒\n\n他提到自己2014年底就写过帖子提醒大家：眼下是牛市大家都在赚钱，但最后大部分人一分钱也带不走。当时没人当回事，市场一路涨到了2015年6月，那批人后来大多再也没回过股市。\n\n2. 他自己也「踏空」过\n\n他回忆自己2014到2015年大概赚了三倍，2015年4月在4300到4500点附近清了仓，结果指数后来又冲到5178点才开始真正暴跌——那才是真正意义上的熊市。他说当时一天最多上千只股票同时跌停，最后上市公司想出的办法居然是集体停牌。\n\n那才叫市场不交易了。\n\n3. 他给的结论\n\n他认为经历过一次那样完整的周期，人才会真正成熟；没经历过的人总以为涨了十倍随时都能全身而退，真到那个时候，大多跑不掉。他还提醒，市场的运转本来就是这样——印花税要有人交，基金经理的高薪要有人出，这些钱说到底都是从参与者身上来的，与其纠结制度合不合理，不如想办法别让自己变成那个一直往里添钱的人。\n\n## 十三、他的书单\n\n他提到几本自己很喜欢、觉得对理解概率和进化论思维很有帮助的书：《盲眼钟表匠》《自私的基因》，还有塔勒布的《随机漫步的傻瓜》——他认为这本比更出名的《黑天鹅》写得好，倒是《反脆弱》他觉得写得一般。\n\n## 十四、他自己的目标与收尾\n\n他重申了自己的投资目标：一是绝对值不能亏损，二是相对值要跑赢上证、深圳、创业板、沪深300这四大指数。他形容自己现在的状态是「涨的时候比指数多涨一点，跌的时候比指数少跌一点」，靠这个慢慢积累超额收益。\n\n对当晚的行情他提醒了一个关键窗口：晚上要公布美国CPI，除非大幅低于预期，否则加息基本没有回旋余地；如果CPI继续超预期，下周大概率就要「上热菜」了。他还提到当时两融余额还有2.6万亿，他觉得回落到2万亿以下（1.8万亿左右）会更健康——现在这些人还在硬扛，都指望反弹了再走。\n\n你也想反弹卖，我也想反弹卖，那谁来买呢？","toc":["一、央行的资产负债表：和普通公司完全不同","二、外汇占款：曾经最主要的基础货币投放方式，为什么现在没有了","三、人民币现在的处境：没有通胀压力，但有升值压力","四、人民币升值的连锁反应","五、铜：库存该怎么比，关税传闻可能是假的","六、日元汇率飙升：意味着资金正在从美国抽离","七、人民币升值背景下，热钱在赌什么","八、外贸：低端产业不会再回来，我们手里有「紧缩商品」这张牌","九、贝森特「坐庄美债」：错在把交易员思维用在了管理者的位置上","十、「注水口」：市场需要往里注水的时候，会挑哪些标的","十一、市场生态：为什么限制量化不等于对散户更好","十二、他自己的2015年，与今天的对照","十三、他的书单","十四、他自己的目标与收尾"],"url":"https://xueqiu.com/2573414707/409083996","chars":5119},"topics":["央行的账本与谁是「注水口」"]},{"date":"2026-09-10","bili":{"title":"老木匠 2026年9月10日直播文字稿（牛市别总结、否定之否定、加息博弈、循环融资、养猪出清）","text":"## 一、牛市不要总结经验，你只是似懂非懂\n\n今天是教师节。有人说听我讲课、看我帖子就入门了——我告诉你，还早，你现在只是似懂非懂。\n\n你之所以觉得懂了，是因为现在是牛市。所以我反复讲一句话：牛市不要总结经验。你现在懂的这些东西，等遇到熊市你会发现自己什么都不懂。\n\n我只给你讲道理、讲方法。真正想懂，还得自己去实践，甚至必须自己挨打、撞了南墙才知道这条路不好走。\n\n前两天我看到一些当年很有名的投资人，因为最近五年白马标的表现不理想，开始写帖子反思自己。这在二〇二一年之前几乎难以想象。那个时候我跟他们说这些白马不行，他们非常不以为然，认为自己已经掌握了投资的真谛。\n\n你那不叫懂，那叫你的投资模式和当时的市场风格相契合。 你拿的标的正好赶上了牛市。你总结的那些经验——什么 ROE、什么复合增长率——等你拿的这些标的进入熊市的时候，一点用都没有。你以为它们涨是因为你分析得对？我告诉你，那都是幻想。\n\n所以夏虫不可语冰。你活过两个完整的周期，再总结经验。 如果你是二〇二四年九月行情之后进来的，或者再往前是二〇二〇年疫情低点之后进来的，你现在连第一轮的春夏都还没过去，更别谈秋冬。而且即便你经过了一个秋冬，你依然不是成熟的投资者，你得经过下一次。\n\n## 二、否定之否定：第一轮学乖了，第二轮又错了\n\n昨天跟人聊英语的话题，有人说最该取消的是政治课。我说你们马克思主义原理根本没学明白——肯定、否定、否定之否定，这三个过程你必须知道。\n\n第一轮牛市你相信星辰大海，最后一分钱没赚着还可能亏了；于是你吸取教训，第二轮牛市一涨你就跑了，结果又没挣着钱。这就是你对第一次的否定，而最终你还要对第二次再进行否定，这就叫否定之否定。\n\n别以为你背下来就懂了。所有事物的发展都是这样：先是正面，然后是反面，再反过来，你才知道这个事物的本质是什么。 这是一种方法论。\n\n我一讲这个你们就觉得是意识形态——这跟意识形态一点关系都没有，这是认识世界的方法。\n\n## 三、离开市场就叫被淘汰，主动被动都一样\n\n你要是不玩了、要离开市场了，你就是已经被市场打服了。\n\n最终百分之九十的人都会被淘汰，只是淘汰的模式不一样：有的一开始觉得难就不玩了，有的撞了南墙以后被淘汰，有的经过几轮牛熊转换以后还是觉得自己不适合这个市场。\n\n你别扯什么\"我是主动离开的\"——跟你主动被动没有关系，你离开这个市场就叫被市场淘汰，因为你已经不敢再来了。被淘汰不见得你的钱就没了，你被打服了也叫被淘汰。\n\n去年底因为股市离婚的，正常，这也是被淘汰的一种方式。我早跟你们说过：别以为你意志坚定能挺住就能在市场生存下来，你能挺住，你媳妇挺不住，天天骂你你能受得了吗？\n\n## 四、美联储这次不加息，信誉就是致命打击\n\n现在为什么我不愿意直播？在美联储议息会议之前，市场特别诡异，你说什么都有可能不对。既然说什么都不对，那还不如不说。\n\n前两天我给大家看过的那位经济学家，原农行首席，经常在简介里说自己是蒙代尔的学生。他前几天信誓旦旦说沃什肯定会降息，这两天改口了，说降息不太可能。我跑到他直播间当了一会儿喷子，问他：你前几天不是说肯定降息吗，怎么改口了？过两天要是加息了，我看你怎么解释。说完我就走了。\n\n回到正题——你看最近油价这么涨，美联储这次能不加息吗？\n\n我个人观点：如果这次不加息，那对美联储的信誉简直是致命打击，由此导致美元信用受到致命打击。虽然我说了我判断不了美联储，但我个人非常倾向于他这次一定会加息，他可以下次不加，这次一定加，否则美联储就完了。美联储信誉垮掉，对美国的打击比加息大得多。\n\n不过这两天我看贝森特的发言，他是真害怕加息。贝森特说如果在 AI 上竞争不过中国，美国就没有后天了——这话非常有道理。但问题在哪？\n\n道理谁都懂，关键是美国那些老钱心里在想什么。你说的都对，AI 是要竞争，可烧钱烧的是我的钱。你这么无限发下去一定通胀，通胀稀释我的购买力——本质上这钱是我花的，成本我付，最终收益我没得着。\n\n所以现在美国国内博弈非常激烈：贝森特那一派为了美国和产业发展，沃什那一派代表的是美元持有者、老钱的利益。各自背后都有强大的资金支持，有资金就有政治势力。\n\n这一点中国和美国不一样：中国铁板一块，所以我们烧钱有来源。\n\n## 五、为什么美国这么难：是被中国撵的\n\n为什么天天喊硬科技含量？你觉得一个监管机构整天喊这个不合理，我告诉你，它合理——他要完成一个更大的目标。你觉得不合理，是因为你设定的目标太小，或者你的思维层面太低。\n\n我非常赞同搞科技牛市，但我不参与。原因很简单：这个过程是要找人花钱的。 AI 产业现在资金上不闭环，自己产生不了现金流，只能融资。融资的钱从哪来？总得有人付这个成本。\n\n这跟福利彩票一个道理：让你给福利捐款你费劲，那就给你点奖励——让你买彩票，其实也是给福利捐款，只不过一旦中了，奖励非常丰厚。我不要那奖金，我也不想承担那损失，彩票奖励再高我也不买。\n\n现在的格局就是中美谁都不能在 AI 投资上松下来。 所以你看到任何喊硬科技、发展科技的倡导，甚至故意打压其他股票，都不要觉得奇怪。关键只在于你自己愿不愿意承担。\n\n为什么美国今天这么难？他是被中国撵的，这就是我们的目的。 假如现在我们和美国有五年差距，他完全可以先缓一缓，先解决通胀再回来解决 AI，因为在地球上没人和他竞争。但现在不行，中国后面撵得太快，他停不下来。\n\n大国博弈就是这么博弈的：中国并不需要赢，只要撵着你，你自己就会非常难。 跑马拉松的都知道，领跑那个人最累。\n\n所以我们追上来也是有代价的——房地产不行了，地方财政吃紧，钱从哪来？只能从股市来。这就是我说的政策面：决定你投资决策的重要基本面，不是政策要不要促进宏观经济，而是政策是否重视股市。\n\n## 六、AI 循环融资：担保不披露，审计不出来\n\n为什么美国在这么高的通胀率下还在主张降息？因为一旦加息，AI 的融资条件全变了。AI 属于大规模先期投入，对利率最敏感——跟刚开始搞基建、修高速一个道理，只投入没产出的时候，你的钱都是从未来借来的。\n\n芯片在这个问题上是牛市，道理很简单：芯片是卖铲子的。这事成功与否跟芯片没什么关系，反正你只要建算力中心就一定得买芯片，所以芯片有点像基建时代的水泥和钢筋——它决定不了最后谁赢谁输，但一定最先受益，光模块也一样，都属于算力中心的硬件、铲子股。\n\n但问题在于：一旦美国开始加息，融资条件变化，建不起数据中心，你还上哪买芯片？\n\n所以美国现在都出现了循环融资：英伟达卖芯片挣的钱，又投回到 AI 建设里头去，等于给自己的芯片创造需求。这就像我们的高端白酒——你为什么觉得酒老是供不应求？因为他卖股票的钱在买酒。 前两天标普专门就这个问题写过一份非常深度的调研报告，有兴趣可以自己找来看。\n\n这里面的猫腻在哪？很多 AI 公司的融资是在表外的，你在表内看不到他真正的负债。\n\n他不是直接把钱借给你——借给你，财务报表上不就表现出来了？一下子看穿了。他是给你在金融机构融资提供担保。 你去银行借钱，我给你担保。那些初创公司兜里分毛没有，凭什么能从银行贷到款？不就是因为有人财大气粗给他担保吗。（我只是举个例子，具体有没有、谁提供过，外人谁也不知道，标普那份报告里有细节。）\n\n那我给他提供担保、他去银行借钱，跟我直接借给他钱有什么区别？ 我的好处是：不用记载在财务报表上。\n\n有人说担保也要披露——担保不披露你能怎么办？担保是审计不了的。 你把钱借给别人，钱得打给他，审计的时候能看出来钱出去了；我给他盖个章做担保，我不披露，你审得出来吗？有没有法律规定不披露的担保就无效？没有。这是两个不同的规范要求：担保披露不披露属于信息披露纪律，借钱出去你不披露也没用，审计能审出来。\n\n再给你假设一种情况：我把钱存在银行里，银行把这笔钱贷给他，然后我再给银行提供担保——你告诉我，这跟我借给他钱有什么区别？甚至我在银行存的钱就直接质押给银行了，这个钱虽然在我账上，实际上我花不了。\n\n顺带说个学法的心得。生手看法律条文，以为所有规则的效力都等同；专业人士看同一部法律，就知道哪些\"禁止\"是扯淡、根本做不到。有些规则是事前补救，有些是事后补救——事前能补救的才最有效。 比如上诉期十五天，这个规定老有效了，过了十五天就不收了，原判决生效；而诉讼法里\"多少多少天结案\"那种规定你千万别信，他有一大堆办法不结。\n\n财务报表也一样：外行看财报啥都想看，内行看财报就几项，看完就拉倒。\n\n## 七、美股涨不等于我们涨：映射要分两种原因\n\n集中竞价已经出来了，大家可以看看芯片和算力硬件，是不是又跟美股走势相反。我估计昨天晚上这帮人又白憧憬了一晚上。\n\n上周五我专门说过这个事：虽然 A 股炒美股映射，但你要了解它构成的原理。\n\n如果全世界 AI 大发展、算力硬件供不应求，那么美国相关股票涨，我们的也该涨——这是对的。但如果它是由于竞争性原因上涨，比如有个消息导致他好、我们不好，那他上涨，我们正好应该下跌。\n\n举个例子：美国因为加关税导致美国铜矿股上涨，那我们的铜矿股不正好应该跌吗？他加关税说明他不买别人的了嘛。\n\n当然开盘集中竞价不代表一天就不涨。现在所有的判断都会出错，因为市场博弈非常激烈——这是我今年一年以来的观点。 博弈激烈就像打群架，你根本没有能力观察究竟谁能打赢，最好的办法就是离远点。你别合计今天士兵甲打赢了就站到甲那边，一会儿你就被砍了。\n\n## 八、今年不亏，你就跑赢百分之七十的人\n\n我年初就说了：今年我想不亏就行。 昨天有人跟我说，你看你现在还在起点上。我告诉你，今年你只要不亏，就跑赢百分之七十的人。\n\n经过这么一轮大的科技牛市，全市场散户获利比率能有多少？我预计百分之七十的人是亏损的（我没看数据）。现在终于明白我说的今年难做了吧。\n\n六月三十号之前那些小登股的趾高气扬、鼻孔朝天，你现在都还能回忆出来——才过去多长时间？\"要站在光里、不要光站在那里\"这句话，你有多长时间没说了？市场的记忆也就几分钟。\n\n今年上半年盈利百分之一百的人，现在很多人是持平。你赚的时候慢，回去的时候可快——一个腰斩你就回本了。 你们周围有没有这样的人？上半年还教你站在光里，现在已经不怎么吱声了。\n\n所以我说：今年上半年你如果获得了过高的盈利，你就不是一个成熟的投资者。 注意我说的是\"过高盈利\"，不是说盈利。我说这话的时候，有多少人认为我是酸葡萄心理？可能我的粉丝里没有，但这么认为的人多了去了——不光科技股，还有一波在有色股里。\n\n当年有多少人说\"你卖了你就看空、你不道德\"？现在你看看有色金属涨了这么多，当年我卖出的有色，从现在开始还得涨百分之三十才能回到我卖出的价格。中铝这两天涨这么多，再涨百分之三十就回到我的卖点了。所以现在有人靠有色涨一点跑来打我的脸——你打啥脸？你的回撤回去了吗？\n\n我当年的过程全部披露过，我给你打个样了。你可以说我是蒙的——说蒙的没错，所有判断都有概率，但你得争取蒙的概率高一点。 投资跟个傻狍子似的天天等着有啥用？你得提高自己蒙的概率。\n\n## 九、现在开始上凉菜了\n\n你看看今天市场的普跌，杀伤力多大。前几天刚开始一跌，有人就问：老师是不是要跌完了、马上反弹了？我说现在连凉菜还没上呢。\n\n现在开始上凉菜了，你着急什么？再过两天你看看论坛里什么调门——会不会有哭爹喊娘的？会不会有如热锅上的蚂蚁、惶惶不可终日的？会不会有人开始埋怨交易制度？这回你告诉我你埋怨谁？量化现在已经限制了。\n\n别说我神机妙算，这东西就是经验，卖油翁，无他，唯手熟尔，你看得多了就什么都明白了。\n\n我告诉你一句话：一个男的给一个女的献殷勤，不管用什么花样、什么手段，最终目的都是一个。 股市也一样——不管给你讲什么故事，最终目的都是把东西在高价的时候卖给你。成长也好、分红也好、改变人类也好，都一样。非奸即盗。\n\n## 十、养猪进入出清阶段，随时可能爆雷\n\n有一个行业大家可以关注——我不是让你们买，你买不买别问我。养猪。\n\n前一阶段我最想买的是大船（船舶），我把钱腾出来就想买它。细心的小伙伴能看出来，前几天我把船调进了自选股，那时候三十四块钱，我还跟朋友说资金腾出来就买船舶。可惜他先涨了，先涨我是不会追高的。\n\n养猪这个行业现在已经开始进入出清阶段，我认为随时随地有可能有几家养猪的上市企业爆雷，大家可以跟踪一下这个消息。\n\n但我还是那句话：周期底部投资需要对这个行业非常熟悉，你可千万别瞎买。 不是说猪周期到底了、猪价开始上涨，所有人都受益，不是的，你要注意区分——在涨上来之前，有的人可能活不到天亮。\n\n现在猪的博弈，我认为已经到了最决定胜负的阶段，就看谁能挺住。\n\n不能买龙头，因为龙头没有弹性；也不能买尾部的，尾部的容易被淘汰。 你自己买什么自己决定，我只告诉你需要看什么——假如你要买养猪企业，看这三样：\n\n1. 账上现金和他的贷款情况是否匹配；\n\n2. 大股东的持股是否都进行了质押；\n\n3. 他是否有一个强大的大股东——比如阿里巴巴投资一家养猪场，那你就不用担心他会被淘汰。\n\n别迷信什么\"地方支柱就不能让它黄\"。真正企业不行的时候，没有人踩着七彩祥云来救你。 地方政府巴不得它黄了以后重组——黄了以后猪该养还养，只是欠银行的钱不用还了，你的股票不用再交易了，人家该收税收税、该就业就业。\n\n如果你看不好个股，买行业 ETF 也是个不错的选择，尤其周期类的行业 ETF 对散户比较友好，只有一个择时的问题，你只要研究明白这个行业所处的周期位置就行。\n\n## 十一、收尾：从职业投资以来，头一次不敢下注\n\n我这些年投资以来，头一次感觉到非常迷茫——不是迷茫，是看不清未来、不敢下注，这是我头一次。\n\n什么原因？有年龄的原因，有资金量逐渐增大的原因，也有市场现在看不清、市场处于高位的原因。任何一件事都是综合原因最后的结果，你非要分清究竟是哪个原因造成的，我也不知道。\n\n行了，今天就讲到这儿，主要是今天是教师节，感谢大家的陪伴。现在主要是我也不敢讲啥，讲啥都容易出错，大家注意风险。\n\n另外，舰长数量逐渐多了，凑够五十个人我就可以做专属的会员直播，会员直播里能谈的东西稍微多一些，因为宽松一些。\n\n---\n\n全程为评书演绎，不指导投资、不提个股。","toc":["一、牛市不要总结经验，你只是似懂非懂","二、否定之否定：第一轮学乖了，第二轮又错了","三、离开市场就叫被淘汰，主动被动都一样","四、美联储这次不加息，信誉就是致命打击","五、为什么美国这么难：是被中国撵的","六、AI 循环融资：担保不披露，审计不出来","七、美股涨不等于我们涨：映射要分两种原因","八、今年不亏，你就跑赢百分之七十的人","九、现在开始上凉菜了","十、养猪进入出清阶段，随时可能爆雷","十一、收尾：从职业投资以来，头一次不敢下注"],"url":"https://www.bilibili.com/opus/1246273112770609152","bv":"","minutes":0,"chars":5829},"ai":{"title":"老木匠·2026年9月10日：否定之否定与AI的循环融资","text":"## 一、牛市里总结的经验，都靠不住\n\n1. 你现在懂的，可能只是运气和市场风格对上了\n\n他说很多人觉得自己在这轮行情里悟出了投资的门道，其实只是因为凑巧赶上了牛市——手里拿的标的正好符合这段时间的市场风格，等风格一变，什么ROE、什么增长率通通不管用。他举了个例子：不少当年靠重仓白马成名的投资人，最近几年业绩很难看，开始公开写文章反思自己，这在2021年之前几乎是不可想象的事，那时候他们都笃定自己已经悟到了投资的真谛。\n\n2. 为什么必须经过两轮否定，才算真正懂了\n\n他借用「否定之否定」来说明这件事：第一轮牛市亏了钱，你觉得下次得早点跑；第二轮真的早跑了，结果又发现自己跑早了、没赚到该赚的钱。这才是完整的一轮认知——只经历第一次调整还不算，得再经过一次修正才能摸到规律的边。他的结论是，起码要完整经历两轮牛熊，才有资格说自己是个成熟的投资者。\n\n3. 离开市场，不管你自己怎么定义，都叫被淘汰\n\n他说那些嘴上说「我不玩了」的人，本质上都属于市场上迟早会被淘汰的那部分人，只是各自的方式不一样——有人一遇到困难就退场，有人是被现实狠狠教训之后才离开，也有人是经历了好几轮周期才发现自己根本不适合。\n\n你离开这个市场，就叫被市场淘汰了，因为你已经不敢再来了。\n\n他补充说，被淘汰不一定意味着钱亏光了，被市场打怕、留下心理阴影，同样是一种淘汰。\n\n## 二、加息还是不加：他这次倾向表了态，但立刻加了限定\n\n1. 他个人的判断\n\n这次他难得表了个态：如果美联储这次不加息，对它的信誉打击会非常大，进而牵连美元的信用，所以他个人更倾向于这次会加息——这次加了信誉损失最小，以后再不加也不会有人说什么。不过他马上补了一句，这只是自己的猜测，不构成任何建议，让大家自己判断。\n\n2. 贝森特和沃什，代表的是两拨完全不同的利益\n\n他把这场博弈拆成了两个阵营：贝森特站在美国产业发展这一边，\n\n如果在AI上竞争不过中国，美国就没有后天了。\n\n而沃什则代表着持有大量美元资产的「老钱」——AI人工智能烧钱烧的是他们的钱，无限发钱一定通胀，通胀稀释的是他们的购买力，成本是他们付的，收益却不一定轮得到他们。他说这场拔河谁赢谁输还不好讲，双方背后的资金实力都不弱。\n\n他顺带点出了中美体制上的一处不对称：\n\n老钱懂这个道理，但不能让他自己拿钱去解决这个问题——这点和中国不一样，中国是铁板一块，我们烧钱是有来源的。\n\n## 三、为什么要天天喊「含科量」，即便看起来不合理\n\n1. 这是他借着上面那层博弈讲透的一点\n\n在他看来，觉得某件事不合理，往往说明你把格局想小了。他解释「含科量」这个提法的用意：AI产业目前自己造不了血，全靠外部融资撑着，而这个钱最终得有人愿意掏。他拿福利彩票打比方——\n\n让你捐款你肯定费劲，那就给你点奖励呗，你买中了，奖励也很丰厚。\n\n中美现在都不敢在这件事上松手，鼓励科技投资、打压其他板块也就不奇怪了。他自己的态度很干脆：\n\n我不想要那个奖金，也不想承担损失——你给我的奖励再高，我也不买这张彩票。\n\n2. 中国不需要赢，只需要一直追着\n\n他把美国现在的处境归结为「被追赶」——如果差距还有五年，根本不用这么急着加息压通胀，可以慢慢从容应对。他打了个跑马拉松的比方：\n\n大国博弈就是这么博弈的：中国并不需要赢，只要一直追着，你自己就会非常难。就像跑马拉松，当第一的人其实是最累的。\n\n他也提到我们这边并非没有代价——房地产不行了，地方财政紧张，追赶AI需要的钱只能从股市里抽，这也是股市这两年被抬到如此高度的原因之一。\n\n## 四、AI循环融资：担保不用披露，就是一个天然的盲区\n\n1. 先讲清楚芯片股「涨」的本质\n\n他说芯片股这波行情涨的道理很简单——它扮演的是卖铲子的角色，AI最后谁赢谁输和它没关系，只要建数据中心就得买芯片，\n\n它就像基建时代的水泥钢筋，决定不了竞争结果，但一定最先受益。\n\n但反过来，一旦美联储加息、AI整体融资成本上升，建数据中心这件事本身撑不下去，芯片和光模块自然也会跟着受伤。\n\n2. 英伟达式的「循环融资」是怎么回事\n\n他描述的是一个自己转圈的资金游戏：芯片公司挣的钱又反手投进下游的AI建设里，等于是自己给自己的产品制造需求。他觉得这和国内的高端白酒逻辑相通——\n\n卖股票的钱去买酒，你才会觉得酒供不应求。\n\n他提到标普不久前专门写过一份研究报告分析这种循环融资，感兴趣的话可以自己找来看。\n\n3. 更隐蔽的一层：担保不直接借钱，但效果一样\n\n他指出一个容易被忽视的细节：如果芯片公司直接把钱借给下游创业公司，这笔钱会老老实实出现在财务报表里，审计一眼就能看出来；但如果它做的只是替对方的银行贷款提供担保，性质就完全不同了——一家账上没钱的公司凭什么借得到款？还不是靠背后有实力雄厚的人担保。他打了个比方：\n\n我把钱存在银行，银行把这笔钱贷给他，我再给银行做担保，甚至我存的这笔钱直接质押给银行——这笔钱虽然在我账上，但我实际上花不了。这跟我直接把钱借给他有什么区别？\n\n关键就在于信息披露的不对称：借款一定会留下痕迹，被审计发现；担保却不需要直接体现在报表里，不披露的话，外人根本查不出来。\n\n4. 看规则要看「哪些是真管用的」\n\n他说内行和外行看同一份规则，理解完全不一样——有的条款事前就能形成硬性约束（比如上诉期一过就作废），有的条款看着挺吓人，实际上事后总有办法绕过去。不是内行，根本分不清哪条是真管用的、哪条只是摆设。他把这个道理延伸到读财报上：外行看财报什么都想翻一遍，内行往往只挑那几个关键项目看一眼就够了。\n\n## 五、今年为什么难：站在光里的人，已经安静很久了\n\n1. 他年初就说过的话，这次拿数据印证了一遍\n\n他重申了年初的判断——今年只要不亏钱就已经很不错了。按他的估算，这轮科技牛市走完，大概七成散户其实是亏损的，所以只要今年守住不亏，就已经跑赢了大多数人。他还拿一句流行语的变化打了个比方：\n\n6月30号之前那种「要站在光里」的趾高气扬劲儿，现在已经变成「不要站在光里，要站在田里」了。\n\n他说今年上半年赚了一倍的人，不少现在已经回吐得差不多了——涨的时候慢慢腾腾，跌起来却很快，翻倍的仓位经不起一次腰斩。\n\n2. 他重申了那句当时被很多人当成「酸葡萄」的话\n\n他提到自己在上半年行情最狂热的时候就说过，今年赚太多反而说明还不够成熟——当时不少人（不只是科技股，有色股里也一样）觉得这纯粹是吃不到葡萄说葡萄酸。\n\n3. 他自己披露卖点，来说明这不是马后炮\n\n有人拿有色金属反弹回来说事，来质疑他当年卖早了，他直接拿出自己当年的具体卖点做对比——不管是棕榈还是有色金属，就算这波涨回来不少，离他当年卖出的位置依然差着一大截，这些操作他早就公开说过。他也承认这里面有蒙对的成分，只是他觉得：\n\n我蒙的概率比较高——你要不然就跟个傻狍子似的天天等着，那有啥用？\n\n## 六、「上凉菜了」——他给的一个提前预警\n\n他说现在算是正式开始「上凉菜」了——前几天刚跌那阵，有人问是不是要见底反弹了，他当时说那还差得远，连凉菜都没上桌。他建议大家过两天去看看论坛的风向，会不会开始有人抱怨交易制度、开始哭天喊地（他还提了一句，现在量化已经限制了，这次该怪谁）。他说这不是什么高深的预判能力，纯粹是看多了自然攒下来的经验。最后他还是用那个熟悉的比方总结了这轮行情——不管讲的是成长故事、分红故事还是改变人类的故事，说到底都是为了在高位把手里的东西卖给你。\n\n## 七、当前他唯一敢说的方向：猪周期，但要挑对标的\n\n1. 他自己说这些年头一次「看不清、不敢下注」\n\n他坦言这是自己做投资以来头一次感到看不透、不敢轻易出手——这里面有年纪大了的原因，也有资金体量变大之后顾虑更多的原因，但主要还是这轮行情本身就特别难判断，多个因素叠加在一起，说不清到底是哪一条起了决定作用。\n\n2. 船舶：他没追上的一个遗憾\n\n他提到自己前一阵最想买的其实是造船类标的，可惜没赶上底部就已经涨起来了，现在的价位他不会去追。\n\n3. 养猪已经进入出清阶段\n\n他判断接下来可能陆续会有养猪企业爆出经营问题，值得留意相关消息。但他提醒，这种周期底部的投资需要对行业有相当深的了解，不能随便下手——猪周期真正开始反转涨价的时候，并不是所有参与者都能活着等到那一天。\n\n4. 怎么选：不买龙头也不买尾部，看这三条\n\n他给的筛选思路是：龙头别买（弹性不够），行业末流的也别碰（容易先被淘汰）。真正要看的是三点——账上现金和负债是否匹配、大股东手里的股份有没有大量质押、以及是否有一个真正有分量的大股东站台。他举例说，如果背后是阿里巴巴这种量级的股东，就不用太担心被市场淘汰；至于「地方支柱产业不会垮」这种说法，他认为纯属信仰，真到扛不住的时候\n\n没有人踩着七彩祥云来救你。\n\n5. 不想自己选的话，行业ETF是个不错的选择\n\n他建议如果实在挑不准具体标的，可以考虑周期类的行业ETF——对散户比较友好，只需要判断行业处在周期的什么位置，不用花大量精力研究个股。","toc":["一、牛市里总结的经验，都靠不住","二、加息还是不加：他这次倾向表了态，但立刻加了限定","三、为什么要天天喊「含科量」，即便看起来不合理","四、AI循环融资：担保不用披露，就是一个天然的盲区","五、今年为什么难：站在光里的人，已经安静很久了","六、「上凉菜了」——他给的一个提前预警","七、当前他唯一敢说的方向：猪周期，但要挑对标的"],"url":"https://xueqiu.com/2573414707/409083957","chars":3696},"topics":["牛市别总结","否定之否定","加息博弈","循环融资","养猪出清"]},{"date":"2026-09-07","bili":{"title":"老木匠 2026年9月7日直播文字稿（孩子教育、大行注资、核心一级资本、损失吸收、杠杆放贷）","text":"## 一、开场：生不生孩子这事，跟加息一样不归我管\n\n昨天最后有人问，叔你儿子怎么还不要孩子。没大家想的那么惨——我儿子研究生还没毕业，连对象都没有，你就催人要孩子，不是扯吗。\n\n孩子的一生他自己过，我的一生我过，我完成我的角色，他完成他的角色，我不能把人家那辈子都过了。\n\n现在动不动就说养孩子压力大，我说是纯胡扯。你回头看看我们的祖父辈，家里六七个孩子不很正常吗？那时候困难不困难？更困难，照样生。以前给口饭吃就行，现在也是给口饭吃就行，剩下都是你们自己给自己加的戏。\n\n就像昨天谈教育一样：没人规定你的孩子必须学英语、必须上大学、必须搞高科技、必须进外企、必须跟外资高管说一口流利的英语。这些都是你们自己加的戏，加这么多戏你还能干啥？\n\n而且孩子只要出生了，他就有他一生的因缘，那不是你通过教育就能定得了的。你天天培养他、领他报英语班，最后你依然不知道他干什么。不要以为你的努力在孩子身上一定有效果。\n\n## 二、英语这件事：不是没用，是代价被算错了\n\n### 1. 真正用得上的人，不到两成\n\n我不否认学英语有用，但能用到英语的地方实际上不多。你把两千年零一年出生的这一波人跟踪统计一下，看他们就业以后有多少人从事的工作需要用英语——我估计连百分之二十也没有。\n\n一个只有两成人用得上的东西，剩下的人都要学，而且还学不出什么用，这就挤占了学习其他东西的时间。把英语和物理化学放在一起比就清楚了：物理化学是你了解世界的，英语只是一门语言。 你不学物理化学，你能知道物质世界怎么运转吗？\n\n### 2. 理工科教育不足，是今天很多人思维混乱的根源\n\n有人认为数学没有用——你以为数学就学记账啊？ 学习数学物理化学，不是让你以后用这些东西，是让你以后生活里少一些一惊一乍。现在这个社会能离开物理化学吗？你天天用电不？只要用电就离不开物理。\n\n崔永元前些年搞那个转基因的事，就是典型的科学素养不足。很多事儿你跟人说不通，就是因为他没学好这些、没有科学素养，所以才一惊一乍。\n\n有人抬杠说：以前的木匠都没学过物理化学，木匠活做得也挺好。我说这是不同层面的东西。\n\n木匠取直角靠什么？勾三股四弦五。 三根木棍按三、四、五的比例摆出来，对着的那根就是直角——勾股定理最初就是干这个用的。那时候没有量角器没有圆规，你不知道平面几何，你怎么取直角？你说他不懂勾股定理，那他这套比例是怎么来的？他只是没上升到理论而已。\n\n同理，你没上过数学课不等于你没学过数学——你买菜不也是数学？\n\n### 3. 英语教育是个靠焦虑吃饭的巨大产业\n\n现在的英语教育，很多是利用家长的焦虑感，这是个非常庞大的产业，涉及大量就业群体。这跟我昨天讲的食品工业宣传\"必须吃早餐\"是一个道理。\n\n你要打每一个人的饭碗，他都不会说\"你别影响我生意\"，他都会告诉你\"不学不行，不学你就被社会淘汰了\"——所有人自我保护的时候都站在道德制高点上。\n\n我自己从小没学过英语，我们东北是学俄语的，后来跟俄罗斯也没什么交往，外语基本没用上，我也没被社会淘汰，活得挺好。我那些同学英语学得挺好，现在很多也开出租车呢。\n\n再说机会是双向的：不学英语你会失去英语的机会，可你学了英语，也就失去了不用英语的机会。而且你一旦学好英语进了外企，一辈子都是打工思维。我当律师时接触的那些老板，大部分都不会英语，需要用的时候都是用翻译。\n\n至于说学英语是为了认识外国文化——你汉语说得这么溜，你了解中国文化吗？普通老百姓把一天的日子过好，早晨想中午吃啥、中午想晚上吃啥，比什么都实在。\n\n### 4. 你在按富二代的精英模式教育你的孩子\n\n普通家长培养不出精英的孩子，精英是老天给的，不是你能培养出来的。我从孩子出生那天就定了：我把他按一个快乐的普通人来培养，至于他最终能走到哪儿，那是老天给的。\n\n中学那点东西——英语也好，背古诗也好，看论语也好，弹琴画画也好，对成年人来说连狗屁用都没有。国家基础教育让你上什么课你就上好，争取升学考个不错的学校就完了。\n\n那些富二代为什么要学钢琴学画画？因为那些人从来不用为衣食考虑，有大把的闲暇，让他学这些起码不能胡整，能打发时间。你们普通老百姓大部分时间都得当牛马，学木匠活、学烙饼都比学弹钢琴强。\n\n### 5. 小孩教育的第一件事是性格养成\n\n这孩子要自信、乐观、阳光、诚实、有责任心，心理健康、身体健康，抗挫折能力强——这才是你该教育的。会不会 ABC、会不会乘法口诀，那玩意儿随着国家基础教育，你初中能毕业自然就会了。\n\n## 三、孩子不是你的工具，人生每一天都是目的\n\n我非常反感拿孩子发朋友圈。 我的小孩从生下来我就定了一条：一张朋友圈都不能发。孩子不是你炫耀的工具，他有他的一生、他的因果、他的因缘，他不是你实现未实现理想的工具。\n\n这就像我以前当律师时给年轻律师讲的：当事人不是实现你法治理想的工具，你是要为他服务的。 孩子也一样，出生以后你要按孩子自己的路径培养。\n\n多少人把孩子当工具，让他学这个学那个，发个朋友圈显摆，要不就跟别人说\"我孩子钢琴十二级\"\"游泳多少秒\"。我问你，你到底要培养他干啥？你让他多会几样，到最后他都不知道自己该干啥。 人这一辈子要失去的东西多了去了，你不可能什么都会、什么都得到——你要去远方，就得离开现在这个地方；你干英语的工作，就干不了不用英语的工作。\n\n还有一句特别重要：对于一个人的一生来说，每一天都是目的，而不是手段。 别总说\"你现在受点苦，长大就好了\"。\n\n## 四、AI 第一个淘汰的，恰恰是学历高的人\n\n现在尤其 AI 出来了，你们担心的方向正好是反的——AI 第一个淘汰的就是学历高的人，第一个淘汰的就是编软件的。\n\nAI 能把烙饼的人淘汰吗？能把炸油条的人淘汰吗？未来最好的工作就是体验式服务这种工作。\n\n我给你们讲过多次，AI 最后得惠及全人类，未来人还需不需要工作这事都是存疑的。你们现在焦虑的无非是\"给孩子一个出路、未来好好找工作\"，可未来可能人都不需要工作。\n\n所以孩子需要教育的不是那些技能，剩下的交给学校就完了。周围的人我也说服不了，我只能在培养自己孩子的时候我做主，别人的孩子咱管不了。\n\n## 五、财政部给大行注资：别急着吵利好还是利空\n\n### 1. 几种解读都有，但没有一个是决定性的\n\n昨天财政部给两大国有银行注资（还包括一些保险公司），一出来解读就一大堆，无非这几个方向：\n\n第一种，未来可能要放水——你先补充银行资本金，才能提高银行对外放贷的能力。第二种，房地产问题导致银行坏账增加，坏账第一个侵蚀的就是核心一级资本。第三种，国家要提高在国有大型金融机构里的资本占比，防止控制权被稀释——这条我认为不靠谱，农行工行里财政部和国有资本的占比是绝对的，不存在被稀释的问题。\n\n我的看法是：一个决策出来有好多考量，不是非此即彼。 你说的这些因素可能各占一部分，但都不是决定性的。而且这事也不是今天才定的，其他几大国有商业银行去年就完成增资了，这只是那次增资的延续。\n\n所以你不用纠结它究竟因为啥，接下来要考虑的是它的影响——对普通人来说，无非就是利好还是利空。\n\n### 2. 现在贷款增长慢，不是因为银行没钱，是因为没人贷\n\n消息刚出来，不少人一看就说\"完了，又开始补充资本金，又从市场抽水了\"。我第一时间说的是：我认为是要增加放贷能力。\n\n道理在哪儿？这些年存款增加一直很快，但贷款增长不快——不是因为缺钱，是因为贷的人少。 贷款规模增长不快的情况下，补充一级资本的需求其实没那么迫切。\n\n这跟房地产大发展的时候完全不一样。你回看那时候，大型国有银行隔几年就补充一次资本金，为啥？因为贷款增长太快，很快核心一级资本率就不符合考核要求了。所以那时候动不动就定增，这也是当年银行效益那么好、估值却给不高的原因之一——除了担心表外隐性坏账计提不足，还有就是你老定增，不断稀释二级市场流通股东的股权。\n\n这几年没怎么定增了，昨天我刚讲完这个问题，晚上就定增了，真是跟我作对。但总的来说，有定增是好事，说明管理层预计未来贷款可能要增加。至于现在贷款需求都不足，贷款怎么增加，你问我我也猜不到。\n\n退一步说，就算是为了补坏账，也是为了增加放贷能力——因为坏账要先对核心一级资本减记来吸收，那不就降低放贷能力了吗？补充完了正好对冲，你怎么看都是对的。\n\n### 3. 这次定增不打折，说明它不是来卖的\n\n这次定增的定价，是定价基准日前二十个交易日的平均交易价格。而一般的上市公司搞定增，定价是打八折的。\n\n这次不打折，说明了什么？ 说明财政部也好、烟草公司也好，根本不是财务投资者，他没想卖——这部分定增买进来的股份不会增加流通盘。\n\n那对持有者唯一的影响就是股权被稀释。你可以自己算：工行市值大概两万六千亿，这次定增一千五百亿，股份总数大概增加百分之五，也就是说原来一年利润一块钱，现在变九毛五了。\n\n### 4. 稀释的是利润，动不了你的分红\n\n但你拿工行，看的不是利润，是分红。\n\n工行的股息率能到百分之五，可它的分红比率——分给你的钱占一年利润的比例——其实并不高。这意味着什么？原来一年赚一块钱给你分三毛，现在赚九毛五了，他依然可以给你分三毛，你不用害怕。\n\n因为你投资工行是按高分红在投，是类债券投资，你考虑的是一年有多少利息，不是它的利润率。所以虽然股权被稀释、每股利润下去了，但它分红的弹性空间还很大，只要它愿意，就影响不了你的分红。\n\n我的结论：中性，稍微偏利好一点点。 偏好的原因是它提高了银行资产质量、解决了资产质量问题；不好的是稀释了散户的股权。剩下的争论都是交易层面、情绪层面的，实质性影响就这么多。\n\n## 六、银行为什么要搞\"核心一级资本\"\n\n这是个需要补的知识——为什么别的公司定增从来不说\"补充核心一级资本\"，银行非要扯出这个概念？\n\n### 1. 先说普通公司：钱从哪来，亏了先减谁\n\n公司所有的资产来源就两大类：股东的投资（形成股权）和借来的钱（形成债权）。所以资产负债表上，要么是负债端，要么是所有者权益端。资产等于负债加所有者权益——一边是来源，一边是去向。 钱进公司以后表现为账上现金、库存材料、固定资产，这是去向；钱从哪儿来，就两个来源。\n\n破产清算的时候，债权优先受偿——先把外面的债还了，剩下的才给股东分，这叫剩余资产分配权。债权内部还细分：有抵押债权最优先，其次是所欠的人工工资，然后才是普通债权。\n\n再进一步，有些公司有优先股：受偿顺序在债权之后、普通股之前。破产清算时先还债，其次还优先股，剩下的才给普通股。\n\n### 2. 损失吸收顺序，跟偿债顺序正好相反\n\n理解了清偿顺序，你把它反过来就是损失吸收顺序：公司今年亏损了，先减记谁？\n\n先减记所有者权益。 你今天损失了，肯定是净资产先变少。你不能说今年亏了一百万，我欠的一千万就只还九百万了——没这种说法。\n\n所以：优先减记普通股股东权益，普通股减记为零了才开始减记优先股。这正好和破产清算的偿还顺序相反。\n\n（顺带一句：优先股在财务报表上算股权还是债权，要看条款。有强制赎回和强制分红条款的，一般记为债权；没有、而且分红不累计的，按股权处理。这是会计细节，你不用管。）\n\n### 3. 银行的特殊性：它的负债是老百姓的存款\n\n银行的资产来源也是债权加股东投资这两大类，但银行的债务有一个天大的特殊性——银行的负债就是老百姓的存款。\n\n普通公司的负债是从银行贷的款、是欠上游供应商的钱，是商家对商家，不涉及社会问题。银行的负债来自老百姓的存款，你在银行的存款，对应的是银行的负债，这涉及公众的财务安全和金融稳定，所以所有银行都要特殊管理。\n\n因此，老百姓的存款是银行最优先级的债权，排绝对优先偿还级——尤其对工商银行这种系统性重要性银行。银行要是连老百姓存款都付不了，那就是金融危机。\n\n既然存款的受偿顺序最靠前，那它在损失吸收顺序上就最靠后——绝对不允许银行一出现损失就先减记老百姓的存款。\n\n那首先减记的是谁？是股东的投资。所以银行里股东的投资就叫做核心一级资本。\n\n### 4. 三级资本与损失吸收顺序\n\n按损失吸收顺序排下来：\n\n核心一级资本：股东的投资，最先吸收损失\n\n其他一级资本：主要是优先股和永续债（没有到期日、按本付息的债券），排第二\n\n二级资本：主要是次级债——注意不是美国次贷那个次级，是说它约定了不同的损失吸收规则和偿还顺序，破产清算时受偿顺序倒数第三，所以损失吸收排第三\n\n也就是说：减记完核心一级资本，减记其他一级资本；减记完其他一级资本，才轮到二级资本。银行的资本分级制度，就是按损失吸收顺序划分的；到破产清算的时候，这个顺序反过来变成受偿顺序。\n\n巴塞尔协议对系统性重要银行的核心一级资本、其他一级资本、二级资本都有比率要求，低到一定程度，就认为这家银行的信誉已经受到影响——所以银行都非常重视。\n\n## 七、补充一千亿，能放大七千亿的放贷能力\n\n核心一级资本率 = 核心一级资本 ÷ 总资产。\n\n为什么补充核心一级资本就能提高放贷能力？因为在核心一级资本率保持不变的情况下，总资产可以带杠杆地放大。\n\n工行的核心一级资本率要求大概在百分之十三左右。你增加一千亿核心一级资本，就意味着只要总资产的增加额不超过\"百分之十三的倒数 × 一千亿\"——倒数大概是七——也就是不超过七千亿，它的核心一级资本率就不会变。\n\n银行的资产是什么？主要就是对外债权，也就是贷款。所以：\n\n增加一千亿核心一级资本 ≈ 增加七千亿的放贷能力，而且不影响资产质量。\n\n这就是我在雪球上只写了一句话的那个推导过程，今天给你们讲明白。不难懂，只要稍微学一点数学就能懂——当然，认为学英语有用、学数学没用的人，我就没法说了。\n\n## 八、这不是放水，但它给宽松做了准备\n\n有人问这对宏观有没有影响，是不是开闸放水。我告诉你，没什么影响。\n\n这次财政部对工行增资，它不是货币政策，甚至不是财政政策，它只是财政部拿了一千亿去增资自己旗下的上市公司而已，属于财政范畴。\n\n唯一的特殊之处，在于增资的标的是上市商业银行，而商业银行对核心一级资本有放大效应——这就涉及商业银行的货币创造问题。（讲日元的时候我给大家讲过这件事。）\n\n普通公司之间的债权债务变动，对宏观经济影响不大：你的应收款是我的应付款，你俩之间折腾，宏观没感觉。但商业银行不一样，商业银行自身有货币创造能力。所以增加贷款能力，实际上意味着在 M0、M1 保持不变的情况下，M2 可以有增加的可能性——是有可能增加，不代表一定增加。\n\n所以说\"这相当于变相投放货币\"是不对的，这不是投放货币，跟发货币没有关系。钱始终在财政这个圈里打转，只不过它转到银行资本金里以后有个杠杆效应。\n\n结论还是那句：中性偏好。但有一点倒是真的——它给接下来的宽松做了准备。\n\n你要往这个方向想：财政部接下来是不是有一些大的项目需要贷款？比如国家搞大的基建，那就需要贷款，贷款就需要商业银行有放贷能力，否则你的核心一级资本率都快预警了，你还怎么贷。\n\n现在商业银行贷不出去款，主要原因不是银行里没钱，是没有去向。在并不缺核心一级资本的情况下还补充一级资本，你就要考量它背后有什么目的。\n\n## 九、盘面闲聊：猜错就猜错，重要的是别亏钱\n\n上周我一直在猜，觉得今天科技股不会涨。现在人家已经涨了，那就是猜错了，还能咋的——也可能下午再跌回来呢。\n\n对错这东西我从来不在乎。 天天有人要打我脸，可你只要不让我损失钱，天天让我错我都不在乎；反过来你天天对，可老让我亏，我也受不了。\n\n他们有的人一直对、一直亏——科技都从一千二对到八百了。那天有个朋友老说我被打脸，说\"你看人家科技又起飞了\"，我说从一千二飞到八百也叫起飞？那你那不是飞机，是滑翔翼，没有动力，越飞越低。\n\n今天芯片还是跌了，摩尔线程一直跌停（解禁跌停是正常的）。今天易中天涨是很正常的——如果中美贸易缓和，对易中天是有利的。\n\n中美经贸缓和这件事，我的原话是：你得考虑什么东西会受影响，你原来那些逻辑还在不在，你国产替代的逻辑现在还在不在，你会不会受到冲击。 这都是瞎猜，我猜完就拉倒，猜对了你们也别夸我，猜错了也别打我脸。\n\n## 十、收尾：我说的都是猜测，当评书听\n\n今天主要就给大家讲了银行的资产负债状况，你知道这么个事儿就行。\n\n我说的不一定对，你们自己去考量。 我也不是研究银行的，你就当个评书一听、一乐呵。你也不用拿细节来纠正我，哪个地方不对也别告诉我——告诉我也记不住，我这些话都是凭印象讲的，我不会因为要给你讲这个就去备课、去核实细节。\n\n以后你拿我说的话都当猜测，讲的事都当评书，说的问题都当段子，一乐呵就完事了。不能用来指导投资——指导投资的话，裤衩子都得亏没。","toc":["一、开场：生不生孩子这事，跟加息一样不归我管","二、英语这件事：不是没用，是代价被算错了","三、孩子不是你的工具，人生每一天都是目的","四、AI 第一个淘汰的，恰恰是学历高的人","五、财政部给大行注资：别急着吵利好还是利空","六、银行为什么要搞\"核心一级资本\"","七、补充一千亿，能放大七千亿的放贷能力","八、这不是放水，但它给宽松做了准备","九、盘面闲聊：猜错就猜错，重要的是别亏钱","十、收尾：我说的都是猜测，当评书听"],"url":"https://www.bilibili.com/opus/1245155884353454087","bv":"","minutes":0,"chars":6819},"ai":{"title":"老木匠·2026年9月7日：银行的核心一级资本是怎么回事","text":"## 一、财政部给工商银行定增：先看懂这一条公告\n\n1. 市场上流行的几种解读，他都不认同「非此即彼」\n\n他说这次财政部联合烟草公司等对工商银行、农业银行定增，市场上主要有三种解读：一是要提高银行放贷能力、为放水做准备；二是房地产坏账侵蚀了核心一级资本，需要补充；三是防止国有股权被稀释（他认为这条不成立，因为财政部和国有资本在这两家银行里本来就是绝对控股）。\n\n我认为这是一个综合考量的结果，你说的这些因素可能都占其中一部分，但都不是决定性因素。你不用去纠结究竟是因为啥，你需要考虑的是它的影响。\n\n2. 他自己先看的是哪个细节：定价准则\n\n这次定增的定价准则，是按定价基准日前20个交易日的平均交易价格来算的，并没有像普通上市公司定增那样打八折。这说明财政部、烟草公司根本不是财务投资者，不是想着低价买入再卖出——他们买进来是不会卖的，这部分股份不会增加流通股。\n\n他提醒大家看这类公告的方法：\n\n这种公告都是模式化的，看多了你就知道不需要全看，只要看几个关键部分就行——这次我最关心的就是定价准则。\n\n3. 对你的影响：股权稀释，但分红大概率不受影响\n\n定增会稀释你的股权，比如稀释5%，你的每股利润理论上会跟着降一点。但工商银行的分红比率本身不高，虽然分红率能到5%左右，但给你分的钱占利润的比例并不高——换句话说，他一年赚一块钱分你三毛，现在赚0.95元了，依然可以给你分三毛。\n\n总的来说对银行的影响是中性，稍微偏利好一点点——因为它提高了银行的资产质量，不好的地方是稀释了散户的股权。\n\n## 二、这场的正课：银行的核心一级资本是怎么回事\n\n他说这是这次事件里真正值得讲清楚的知识点——为什么补充的是「核心一级资本」而不是普通所有者权益。\n\n1. 先从普通公司讲起：资产来源只有两种\n\n任何公司手里的钱只有两个来源：股东投入的（股权）和借来的（债权）。公司破产清算时，债权优先受偿，股东只能分剩余资产——这就是为什么债权优于股权。\n\n但当公司正常经营发生亏损的时候，顺序是反过来的：首先减记的是所有者权益（股东的净资产），而不能说欠别人的钱先不还了。这就叫损失吸收顺序，正好和破产清算的偿还顺序相反。\n\n2. 优先股：夹在债权和股权中间\n\n优先股的偿还顺序在债权之后、普通股权之前。它是股权还是债权要看具体条款——如果有强制赎回、强制分红条款，一般当作债权处理；没有的话按股权处理。\n\n3. 银行的负债为什么要特殊管理：因为里面有老百姓的存款\n\n普通公司的负债是从银行贷的款、欠上下游的钱，商家对商家，不涉及社会问题。而银行的负债来自老百姓的存款，涉及公众财务安全——如果银行连存款都还不了，就会引发金融危机。\n\n所以老百姓的存款是银行债权里受偿顺序最靠前的，也就是损失吸收顺序里最靠后的——银行绝不能在有损失的时候先减记老百姓的存款。\n\n4. 所以股东投资款才叫「核心一级资本」\n\n既然存款不能动，那首先要减记的就是股东的投资——这部分钱在银行里就被称为核心一级资本，因为它在吸收损失的顺序上排在最前面。\n\n核心一级资本占总资产的比例，叫核心一级资本率，代表的就是这家银行的抗风险能力。\n\n他还简单带过了银行资本的完整分级：核心一级资本之后是其他一级资本（优先股、永续债），再之后是二级资本（次级债），损失吸收顺序依次往后排，对应的破产清算受偿顺序则正好相反。\n\n5. 关键的杠杆效应：补充核心一级资本为什么能大幅提高放贷能力\n\n巴塞尔协议对核心一级资本率有比例要求，工行大概是13%左右。核心一级资本率保持不变的情况下，增加1000亿核心一级资本，总资产可以增加13%的倒数乘以1000亿——大概是7倍，也就是7000亿。\n\n也就是说，增加1000亿核心一级资本，意味着增加了7000亿的放贷能力，而且不影响资产质量。这就是为什么补充核心一级资本这件事，杠杆效应这么大。\n\n## 三、这件事对宏观有没有影响：他的判断是「没有」\n\n1. 这不是货币政策，是财政行为\n\n这次财政部给工行增资，不是货币政策，甚至不是财政政策——它只是财政部拿钱去增资自己旗下的上市公司而已。它和别的地方不一样，只是因为增资的标的恰好是一家商业银行。\n\n2. 但商业银行的资本变动，会牵动M2\n\n商业银行有货币创造能力，它的资本、应收应付变化和普通公司之间的应收应付完全不同——普通公司之间的债权债务对宏观经济没什么影响，但商业银行系统的资本变化会影响市场里的M2。\n\n在M0和M1保持不变的情况下，提高了核心一级资本，就意味着M2有增加的可能——注意，是「有可能」，不是「一定」。这不叫放水，钱始终在财政这个圈子里打转，只是通过银行资本金产生了一个杠杆效应。\n\n3. 他自己的定性：中性偏好，但为未来的宽松做了准备\n\n我认为这是个中性消息，中性偏好，不是什么大利好也不是大利空——但它为接下来可能的宽松做了准备。\n\n他还提出了一个可能的方向：\n\n也可能不是为了放水，而是财政部预计接下来会有一些大项目需要贷款——国家如果要搞大的基建，就需要商业银行有贷款能力。现在商业银行贷不出去款，主要不是因为没钱，是因为没有贷款需求、没有去向。你在核心一级资本并不紧张的情况下还去补充，就要考量它背后有什么别的目的。\n\n## 四、后续观察：芯片股当天走势，印证了他的猜测方向\n\n他把上周关于「中美经贸关系可能缓和」的猜测又往前推了一步，依然强调这只是猜测。\n\n1. 当天的验证\n\n大家可以看到，今天芯片股是下跌的，这倒是证明我之前的猜测还是有一定道理的。\n\n他重申了猜测的逻辑框架，而不是具体结论：\n\n我说的是中美经贸关系缓和，你就得去想什么东西会受影响——你原来靠「国产替代」这条逻辑支撑的标的，这个逻辑现在还在不在？会不会受到冲击？我猜完就拉倒，猜对了不用夸我，猜错了也别打脸。\n\n2. 他对「猜对猜错」这件事的态度\n\n我从来不在乎对错，你只要不让我亏钱，天天让我错我都不在乎。你要是天天让我对、却一直让我亏，那我也受不了——反正对的人一直在亏。有色从45对到33，科技从1200对到800，你说他一直是对的，那他不还是在亏吗？","toc":["一、财政部给工商银行定增：先看懂这一条公告","二、这场的正课：银行的核心一级资本是怎么回事","三、这件事对宏观有没有影响：他的判断是「没有」","四、后续观察：芯片股当天走势，印证了他的猜测方向"],"url":"https://xueqiu.com/2573414707/408451801","chars":2508},"topics":["孩子教育","大行注资","核心一级资本","损失吸收","杠杆放贷"]},{"date":"2026-09-06","bili":{"title":"老木匠 2026年9月6日直播文字稿（AI通缩与分配、圈地运动、反垄断、中美博弈、炒股三段）","text":"## 一、房子贵不等于你有钱，那只是计价\n\n东北的物价低、房子便宜，冬天取暖一个冬天一平方米也就二十到三十块。房价便宜在很多人眼里是个缺点，可对当地老百姓来说不是——辽宁的居民净储蓄，也就是全部存款减去全部贷款，在全国是靠前的。\n\n反过来看江浙一带，房子贵、人均财富高，但净储蓄很低。道理很简单：收入大部分压在房子上，还背着大量贷款，房子越贵，贷款越多。\n\n房价这个东西，贵和贱都是一种边际价格决定的，并不代表你变现的时候真能拿到那么多钱。达里欧最近提醒风险时讲过一句话，非常关键：在美国，你不能花自己的财富，你最终只能花钱。中国也一样——致富的时候你不能花房子，你只能花钱。\n\n房价从五百万涨到一千万，人均财富多了五百万，可你什么都没变；二一年到现在房价一路跌，京沪一带人均财富就急剧缩水，你也还是什么都没变。房地产作为财富在你心里计价的时候，并不等于它的变现价值。 老百姓最初是希望房价低的，后来持有房产的人才开始希望房价涨——这个转变本身就说明问题。\n\n## 二、AI 取代不了人，但它会制造一个分配难题\n\n### 1. 人是万物的尺度\n\n有人说 AI 最终会取代人类，我非常不同意。人类社会发展的一切东西都是为了人，不是搞出个东西最后把人消灭。人才是万物的尺度。\n\n马斯克说碳基生命只是为硅基生命诞生做的台阶，我非常不认可。哪怕将来 AI 跟人相似度高到难以分辨，甚至比人更先进，它也取代不了人。人类在发展过程中一定会反思：发展 AI 究竟是为了替代人，还是为人服务？所以最终一定会出现对 AI 的限制——阿西莫夫写《银河帝国》的时候就已经谈到了对人造生命的限制。从技术上造一个类似人的东西并不难，难的是这是个社会问题。\n\n### 2. 技术革命天然引发通缩，机理有两层\n\n格林斯潘在两千年互联网泡沫的时候有个观点：所有的技术革命，都有引发通缩的倾向。 沃什也有同样的看法。\n\n第一层道理简单：技术革命极大提高劳动生产效率，生产出来的东西都变便宜。第二层更重要——效率提高会把一部分人剥离出劳动领域，大量失业带来整体购买力下降。一边生产的东西多了，一边需求少了，自然是通缩。\n\n### 3. 那被挤出去的人怎么活\n\n问题在于：如果科技进步是为了把这部分人挤出去，那这部分人怎么生存？你总不能把他们关起来、杀掉吧。什么都不处理，社会就要动荡。人不能让尿憋死，只要有人在的地方，吃不上饭他就一定得想办法吃上饭。\n\n所以我的结论是：AI 提高的劳动效率能否普惠全民，这根本不是技术问题，是分配问题。现在大家都在争芯片、争 HBM、争铜铁，可你最终要解决的问题不在这儿，在于被 AI 挤回家那部分人，你怎么保证他的生存。\n\n再看清楚一点：如果效率提高了，还在干活的人照样工作八小时，那这部分人也没受益；不能干的那部分失业了，已经受损。总体看人类是受损的，谁富了？大资本。\n\n可大资本要那么多钱干什么？为了更快发展科技。更快的科技发展，就会有更多人被挤出劳动领域。这个循环在历史上出现过无数次。\n\n## 三、两次\"效率提高、农民遭殃\"：英国的羊吃人，大明的改稻为桑\n\n### 1. 英国圈地：羊把人挤走了\n\n英国工业革命刚开始时发生过\"羊吃人\"。纺织业大发展，需要大量羊毛，资本就去农村收购土地——原本种粮食的地，全改成放羊。原来种地的农民变得一无所有，最后只能去当工人。\n\n关键是他们去当工人的时候，谈判地位已经极低了：无家可归，没办法了。所以工作条件极恶劣，这才有了后来的社会动荡。原本英国农村的农民生活得还不错，工业技术发展以后，生活反倒恶化了。\n\n当时普遍的工作时长是十六个小时。一天二十四小时，减掉八小时睡觉，剩下就十六小时——这已经是人类的劳动极限。马克思他们写的书里，当年英国工人罢工要求的条件是什么？一天工作十二个小时。\n\n### 2. 早餐是食品工业造出来的需求\n\n正是在这种情况下产生了食品工业：麦片、蛋白粉、奶粉、工业化面包、快餐。为什么要这些？工人要把吃饭时间压到最短，大部分时间用来劳动，连上厕所都有规定时间。\n\n有了食品工业，就有了\"必须吃早餐\"的宣传。\"不吃早餐会得胆结石\"这句话，就来自最早的食品工业广告，没有任何医学循证证据。 自然界没有一个动物是要吃早餐的——你一醒来，昨天晚上剩的都坏了，第一件事是去捕食、去采集。\n\n我小时候在农村长大，农民早晨下地干活都不吃早餐，只有工人上班才吃早餐。你说十点就扛不住，那是你老吃早餐养出来的习惯。从明天开始不吃，到十二点你都不会觉得饿。早晨一醒，升糖激素马上工作，把肝糖原和脂肪分解成血糖供糖，长期不吃早餐的人，早晨血糖反而升高，跟吃完饭效果一样。我自从不吃早餐，早晨血糖更高了，餐后血糖却非常正常——我不是医生，这是我自己的生活经验。\n\n### 3. 大明改稻为桑：账上划算，农民没饭吃\n\n中国也发生过类似的。《大明王朝》里那个\"改稻为桑\"，把稻田改成种桑养蚕，丝绸卖给外国换大量白银，在经济上绝对划算，所以开始推行。结果跟英国圈地是一个道理——农民没地了，吃不上饭了。\n\n朝廷赚的钱看着多，可我问你：这部分农民你怎么处理？你总不能都杀了。最终导致民变、导致饥荒，还得是政府拿钱。而且这个过程中一定会产生豪强。\n\n## 四、不要美化资本，反垄断才是真问题\n\n### 1. 失业的人和豪强，是政府的两笔账\n\n今天的 AI 发展也一样。你把大部分老百姓推向失业，同时造出极大的财阀，这会引发巨大的社会问题。对政府来说有两笔账：第一，失业的人无论是吃不上饭还是引发动荡，都要政府花钱解决；第二，豪强起来以后会影响政治。\n\n你看马斯克、黄仁勋，这些人未来都是美国的麻烦。就像当年英国纺织工厂的厂主，希望所有的地都改成养羊；马斯克和黄仁勋也希望所有的工作都被替代。马斯克搞无人驾驶出租车，一个城市一个城市推广，推一个城市，那个城市的出租车司机就没了。黄仁勋拼命造芯片，就希望到处建数据中心，会游说所有政治力量去建——数据中心一建，电价涨、水价涨。最后谁富了？黄仁勋富了，马斯克富了。谁受苦？政府受苦。 那些人回了家，就变成社会问题，需要你去解决。\n\n千万不要美化资本，任何资本都是一样的。 资本扩张起来，没有你们想的那么多道德感。你们知道的那些\"私营企业就是搞创新\"的说法，是有人给你洗脑。我不是说他们一无是处，有好处，但也有坏处——我反对的是\"私营资本没有问题\"这种话。\n\n### 2. 淘宝与社区团购：钱他们赚，问题留给国家\n\n马云他们发展起来的时候第一件事是什么？电商一起来，所有街边门脸全黄了。淘宝起来你以为对社会贡献巨大，可所有靠在街边开小店维持生存的人都完了。然后他们想干第二件事，后来被叫停了——社区团购。按他们的做法做下去，菜市场都没了。钱当然都让他们赚了，最后的问题都留给国家。\n\n所以一整顿大的电商集团，就有人说打压私营资本、要回到过去了、要打土豪分田地了，这都胡扯。哪个国家都一样。美国上世纪就搞过反垄断，早就认识到这个问题了。\n\n### 3. 美国已经很多年没真正反垄断了\n\n美国这些年反垄断搞得并不好。最大的一次反垄断调查对象是微软，从那之后基本就没再实施过——这说明垄断集团已经掌握了强大的政治势力。\n\n当年美国把贝尔电话电报公司硬拆成七个小公司，那是反垄断领域最大的手笔，那时候美国才是真牛，真叫人类之光，就因为你垄断给全社会带来了巨大问题，硬拆。而现在，英伟达已经发展这么大，苹果都形成果链生态了，也没人去反垄断。\n\n要反垄断，今天第一个该反的就是英伟达。\n\n## 五、AI 这轮闭环，本质是多环节的庞氏骗局\n\n黄仁勋为了卖芯片，就找人建数据中心；数据中心建完租给大模型公司；租的人没钱，那我就来投资 OpenAI 这些大模型公司。这就是自我循环了。\n\n现在美国的 AI 发展，从算力公司到芯片、存储、大模型，它是一个闭环的、多环节的庞氏骗局。标普最近写了一份关于循环融资的报告，讲的也是这件事。\n\n黄仁勋的钱最终从哪儿来？他投资大模型，大模型买算力，算力公司建数据中心，数据中心买他的芯片——最终的钱是从投资者这儿来的。 所以你会看到他股票一直在涨，因为他的需求是人造出来的。\n\n这就像我们当年的高端白酒：卖酒买股票，股票赚的钱再去买酒，酒越来越贵，股票也越来越贵。白酒那个还是简单的双循环，英伟达玩的这套是多环节共同参与的。\n\n如果他真搞出东西成功了，未来可能解决这个问题；稍有闪失，就会酿成巨大的社会问题。\n\n高志凯前几天说美国会有金融危机，我不觉得他把时间说得那么准——这没有可靠数据，形势怎么发展谁也不知道。但他说的大方向没有问题，这不只是他的观点，也是美国国内有识之士的观点。美国不是没有有识之士，只是美国的政治体制是各方博弈的结果，谁有钱，谁的博弈力量就强。\n\n今天的美国已经不是八九十年代之前的那个美国了。我们小时候羡慕美国是有道理的，那时候人家在意识上、体制上、技术上、科学上，那真的是灯塔。今天已经不是了，不要抱着过去的观点看今天的美国。 你们回去查一查，美国已经有多少年没反垄断了？最近反垄断反得比较厉害的是中国，可你在中国一反垄断，就有人告诉你打压私营企业。\n\n这就是机制决定的，不是哪个人特别坏。就像特朗普要演好特朗普的角色，一定要说降息；沃什要演好沃什的角色，目的就是保持美元购买力。资本集团的掌门人就是要为资本集团赚钱，不然他就下去了。马云如果不能给阿里巴巴赚钱，一样会被淘汰。\n\n## 六、今天的大学只教抽屉，不教衣橱\n\n### 1. 从框架开始，到框架结束\n\n我给大家讲的是个大框架，你别老拿细节跟我抠。掌握一门知识最好的办法是类比，我给你举例子，你以前非常糊涂的东西听完就懂了。\n\n大学最好的教学模式是从框架开始，到框架结束。我一开始给你讲个东西，先做个比喻，说这个东西相当于什么——这是从框架开始。然后教你细节，你了解了所有细节，你以为你懂了，其实你没懂。你得把这些细节再综合起来，重新形成一个框架。 这时候的框架和最初那个完全不一样，用现在时髦的话说，颗粒度不一样。\n\n相当于一张照片：刚开始你知道的是像素一千的，学完这门课你掌握的像素是一千万的。但你要知道，学完一门知识不是看清一个一个的像素，而是看清整张照片。\n\n### 2. 蚂蚁爬在蒙娜丽莎上\n\n会计怎么教？上来先告诉你，资产负债表就相当于一个衣橱，会计要解决的问题就是现金从这个抽屉怎么转移到另外一个抽屉，每个会计科目相当于其中的一个抽屉——你先有个大概了解。接下来再学借记贷记、科目之间的关系，这就是学细节，相当于把每个抽屉的大小结构、从这个抽屉到那个抽屉走什么路径都讲清楚。最后你还是要回到：这门课讲的就是一个衣橱。 但这时候的衣橱和最初说的完全不一样了，我一说衣橱，你哪个抽屉哪个角落放的什么全知道。\n\n大部分老师教完财务，你学到的就是抽屉——你知道每一个抽屉，根本不知道这是一个衣橱。没有不爱学习的学生，只有讲不明白课的老师。 我在大学得出的结论就是这样：你上大学不爱听老师讲课，是因为你的老师根本讲不懂。我给公园里的老头老太太讲货币政策，他们都爱听。\n\n### 3. 懂和知道，是两个等级\n\n你们上大学也好，在一个领域里干活也好，懂和知道是两个不同的等级。一讲东西就有人跟我掰扯，说这个历史来源是一五几几年、一六几几年，谁说的。我告诉你，你知道这些，这门课你依然不懂，你只是知道。\n\n你相当于一只蚂蚁在蒙娜丽莎上爬，每一块颜料、每一道裂纹你都清楚极了，但你不知道这幅画画的是什么。你只知道那个地方有个黑影，因为你根本不知道那黑影就是蒙娜丽莎的眼睛。\n\n百分之八十的人，一辈子对一件事的理解都停留在\"知道\"，谈不到懂。因为他们自己不懂，带学生的时候学生也不懂，一代一代恶性循环下去。\n\n### 4. 所谓创新，就是把袜子戴在脑袋上\n\n我讲幸存者偏差，有人跟我掰扯说最初的例子根本不是这个；讲某句话，又有人说那句话其实不是凯恩斯说的。这跟例子有啥关系？跟谁说的有啥关系？ 你要懂的是道理。现在你随便拿个 AI 一问，马上告诉你谁说的。\n\n大学老师搞的所谓创新是什么？就是把袜子戴在脑袋上。你说袜子穿在脚上，这叫创新吗？谁给你发论文、你博士能毕业吗？你得写：历史上谁曾经把袜子戴在脑袋上，所以袜子戴在脑袋上是合理的，英国人怎么穿、美国人怎么穿、中国人怎么说，比较来比较去，最后得出个结论——袜子戴在脑袋上最合理。这论文就结束了，大家都评：有创新。\n\n不是写这些论文的老师有多蠢，是你不写就评不上职称。这些东西最终都成了人类的冗余代码。图书馆的书越来越多，能看的没几本。什么人都想写书，有书号就得存。你说有些书写了有什么意义？宋丹丹非要写本《月子》。一辈子没有任何创见非要写本书，这就是给人类的有用信息里增加噪音。\n\n有人问：垃圾书应该销毁。那可是老大工程——你自己扔垃圾，清清楚楚知道哪个是垃圾；把大家的垃圾都收集到垃圾站，你说这里面有不是垃圾的，找个第三人把不是垃圾的挑出来、把垃圾扔掉，你告诉我要怎么处理？\n\n## 七、AI 竞争的终点不是技术，是制度\n\n回到人工智能。未来中国和美国比拼的不是谁先造出来，而是AI 提高的劳动效率，怎么才能惠及全体国民——这个制度怎么处理。\n\n你比如未来能不能把一个岗位拆成两个岗位？原来是连轴转，能不能两班倒？再进步的时候能不能三班倒？人在 AI 条件下需要的劳动越来越少，总体空闲时间越来越多，那空闲时间怎么安排，最终会反映在法定最高劳动时间上。各国自己找自己的办法。\n\n关键在哪儿？对资本集团来说，他希望 AI 带来的收益由他独占。 他把人都撵回家去——你们要组织工会、又要休假，我干脆给你买台机器人：机器人没有工会，不要求休假，工伤也不用处理，二十四小时都能干活。到那时候每个人都被贴上标签了：你是买台机器人划算，还是雇个人划算？每个人都开始被成本核算，这对整个人类来说生活是越来越不利的。\n\n所以你怎么让效率惠及所有人？比如用 AI 的企业，国家给补贴，但你是不是应该交一部分税，来养活你所顶掉的这部分工人？这才是未来真正的竞争含义，而不是今天说我们能不能造出来。\n\n即便老美先造出来，或者我们先造出来，技术上的代差维持不了多少年。最终的竞争优势来自文明和文化。 现在全世界打仗、短兵相接都用枪，非洲部落打仗也用枪，你能维持多少年？你对非洲的领先是因为文明和文化，不是因为武器有多先进。\n\n境界的层级也是这样：人类刚开始认识世界，是具体的规律，这就是各门学科；从具体的规律里提升出普遍的规律，这就是哲学；最终解决的是自己和自己的关系，这就是神学。\n\n## 八、中美这场博弈，要站在董事长的角度想\n\n### 1. 三件蹊跷的事放在一起看\n\n周五美股科技股涨得不错，以芯片为代表的，包括光模块。你们想一想周一能不能涨？\n\n我不明白，为什么没人觉得上周五我们的科技股午后开盘跳水这件事蹊跷？ 那个下午的开盘跳水多么明显，同一时间人民币快速升值冲那一波也非常明显。然后美国股市在非农就业数据大超预期的情况下，芯片和光模块突然大幅上涨。\n\n这种事你只能猜。还有十多天你就能知道消息了。美国的贸易代表团现在在中国，消息非常封闭，除了我们总理见了一次，他们跑到杭州的时候浙江省省长好像也见了一下，就这些。我也是拼命找，找不到公开报道。\n\n要知道，这个贸易代表团今年已经来中国三次了：一次在上次特朗普来中国之前，第二次在七月份，这是第三次。外网已经开始传了。\n\n### 2. 半渡而击：放开不是恩惠，是挑你最难受的时候\n\n如果中美贸易有缓和，比如有些半导体芯片放开，那对国内相关对标企业不一定是利好。因为你现在所有的国内科技主打的都是国产替代。\n\n对老美最有利的方式，就是放开——二二年我就写过这个帖子，叫半渡而击。敌人要过河，你什么时候打？不是他没过的时候打，也不是过完了再打，是他走到江心一半的时候打。搞国产替代也是一个道理：你替代到一半，钱投进去了、产品还没出来的时候放开，这才是最好的。 等你自己憋着把国产替代都做出来了，这时候你再放开还有什么用？那就是两个人开始竞争了。\n\n上一次英伟达放开那个阉割版芯片，我们得用多大力气才顶住？\n\n这些都是瞎猜，你没有任何来源，靠的是直觉和对新闻蛛丝马迹的判断，谈不上有多高准确度。但起码逻辑是对的，你现在看到的迹象都证明可能是这样。\n\n### 3. 没有\"够用不够用\"，只有出多少钱\n\n我昨天的思考结果：做股票，即便做科技股，你也要从董事长的角度考虑问题，而不是从技术工程师的角度。\n\n工程师考虑的是我这个技术怎么做得更完美；董事长考虑的是——技术再完美，最后这东西卖不出去，狗屁都不是。国家就更是了。\n\n我一说 HBM，就有人说\"美国自己都不够用，不可能放开\"。这都是从工程师角度考虑问题。什么叫美国不够用？美国要这些干什么？要建数据中心；建数据中心干什么？要生产大模型；生产大模型干什么？我告诉你，大模型最重要的买家是中国。 有啥够用不够用的？你现在直接把芯片卖给我，连大模型的钱都挣回来了。\n\n打个比方：你是卖鸡的，有人来说我就要买一个鸡脑袋，你卖不卖？你当然不卖。可人家说了，我买这个鸡脑袋给你的钱，比你这整只鸡都贵——你把整鸡卖给我都卖不出这个价，你卖不卖？你一定会卖。你问为什么，人家说：我们家找人算了，只有那个地方摆个鸡脑袋才能辟邪。\n\n生意就是交易，哪有什么够用不够用的，看你给多少钱。\n\n### 4. 救美国不是因为感情，是因为利益\n\nAI 竞争是为了博弈，不竞争也是为了博弈。你跟中国博弈的目的是什么？不就是要求中国给你提供好处吗？你当初这么勒着我，目的是什么？不就是要在我身上获得好处吗？那现在我就能给你了，你怎么还不要、非要跟我竞争？你竞争赢了不就是为了在我身上得好处吗？好，现在我把好处给你，你还竞争个什么？\n\n那些部门的人想法不一样，你到公司当过领导就知道，部门利益和董事长想法根本就不一样。看 HBM \"美国不够用\"这种话，我不是说 HBM 一定放开，这是我自己的瞎猜；但你也别信誓旦旦说就一定不行——那得看是多大的利益。\n\n如果换取伊朗的利益呢？换取俄罗斯的利益呢？换取中国去救美债的利益呢？\n\n现在全世界包括美国在内，谁能拿出一万亿美元来买美国国债？除了中国，哪个国家拿得出来？美国自己都拿不出来。美国现在遇到的困境不就是：美债收益率在上升，加息也不是、降息也不是——降息通胀上天，加息美债收益率上天。我不已经告诉你了吗，现在我们不仅能救杨白劳，也能救黄世仁了。\n\n中国现在的外汇储备，账上就三万多亿美元，如果把历年没结息的算上——这么多年顺差这么大，国有企业手里没结汇的美元又有多少？\n\n救他干嘛？为了利益。你不救他干嘛？现在美国倒了，第一个受损的是中国。你别以为把美元干倒是好事，美元倒了国际秩序就乱了——我们是在美元作为统一货币的基础上发展起国际贸易的。你别用你自己的那种想法说\"我就不救他，咱俩有仇\"。世界上没有有仇这回事，只有利益。\n\n人民币结算替代美元，这还不是用十年二十年记的，你得用五十年的时间长度，才能平稳过渡。\n\n## 九、你的股票是天大的事，只是因为钱在里面\n\n每个人都倾向于把自己的利益看得无限大。你们跟农民打过交道就知道，农民眼里最大的利益就是他的粮食，那就是天大的事。在农村住过你就知道，两家邻居因为滴水纠纷能出人命——我家房檐的水流到你家院里，这在民法典里属于相邻关系，可是在那个语境下，这就是全世界第一大的事。\n\n这都是眼界的局限造成的。 有个段子讲\"真有一头牛\"，说的就是这个道理。\n\n炒股票的人也一样：说起来别的事都不重要，股票市场一跌，那就是全世界最大的事，因为他的钱在里面。东南小岛是大事吧？都说是大事。可真要收的时候，如果股票市场跌了，他第一个就反对——干这事干啥呀，过两天再干呗。马上一改口，这就是人性。\n\n别把你自己那点事看得太大。哪一天为了需要，把股票市场关了都无所谓。你觉得特朗普绝对不允许美国股票下跌，那关了不就完了，有什么不能下跌的。\n\n## 十、先认识你自己是个什么货色\n\n### 1. 炒股三段：基本面、博弈、自己\n\n你做股票，得先认识清楚两件事：第一把这个社会认识清，第二把自己认识清，你别老骗自己。\n\n股票也是三段。刚开始做股票，你研究的是这只股票本身——一年产铜多少、挖铜多少、挣多少钱，这是初级阶段。等你研究完了会发现，决定股票涨跌的并不是股票本身，而是买卖股票的人，于是你开始研究博弈。基本面再好，它可能不涨，因为没有人买。 没有谁规定基本面好就一定涨。\n\n但这还不是终点。最终你会发现，你在博弈中能不能取胜，跟对方没有关系，跟你自己有关系。 所以你最终博弈的对象是你自己，是你自己的恐惧和贪婪。\n\n股价特别低的时候你自己不敢买，那是你自己的问题，不是博弈的问题。你嘴里念着\"别人恐惧我贪婪、别人贪婪我恐惧\"，而实际上，你就是这里所说的别人——当别人恐惧的时候，最终你也会恐惧。\n\n### 2. 心法：身心合一\n\n心法就是你要身心合一。你持有这个标的的时候，无论上涨还是下跌都能保持理性、保持平和，不能心跳快，不能血压高，更不能呼吸急促、浑身冒汗，不能晚上睡不着觉。否则你什么都弄明白了，最后克服不了自己，一切全废。\n\n你为什么一学就懂、一用就废？因为你没有解决自己的问题。你都知道低买高卖，可你做不到——不是你不知道什么叫低和高，是低的时候你拗不过自己，高的时候你也拗不过自己，你已经用自己的感觉代替了理性思考。\n\n可你也别上来就想解决自己的问题，那不行，这是循序渐进的，这是高端武功。你不从扎马步开始，上来就想学降龙十八掌，那是做不到的。 郭靖那是爽文，是最早的爽文。\n\n### 3. 爽剧的套路\n\n爽文爽剧都有套路：每一个被欺负的女孩背后，不是有一个黑社会的哥哥，就是有一个当董事长的爸爸，要不就是有一个看上她的富二代，最终一定有人替她出气。还有一条——按颜值分配智力，按财富分配道德。 所以爽剧里只要出来一个玉树临风的男主，一定又有钱、学历又高、背景又好，最主要道德还特别高尚，爱情从一而终；只要出来一个贼眉鼠眼的男主，一定又穷又下作，最后还是个坏蛋。\n\n人都愿意生活在童话里，谁都不愿意长大，长大太痛苦了。\n\n连《西游记》都是最早的爽文——孙悟空厉害不在于七十二变、有金箍棒，最厉害的在于背景深，想找哪个神仙解决问题就找哪个。白雪公主也是：她要是真跑到森林里，第一件事是让蚊子咬死，没有松鼠会替她洗衣服，也不会有小鹿去拱她的脸。\n\n### 4. 一学就会，一用就废\n\n别以为巴菲特做得好你就能学。多大屁股穿多大裤衩，裤衩做大了不漏风吗？ 有的人就是认识不清自己，一跟他说这事，他先把自己设定成哪吒，三头六臂，然后进去学，什么都能学会。你先把自己设定成你自己那样，再决定你怎么做。\n\n去年这个时候，天天有人在我帖子底下问\"棕榈怎么办\"，如热锅上的蚂蚁一般；再往前一点，\"落幕怎么办\"——那会儿它还叫阿斗。你不管说什么，他下边都问这一件事，因为他买了，这是天下最大的事。我都烦了，天天得给你们按摩。你这一天到晚跟热锅上的蚂蚁一样，你能挺住吗？最后你钱还在，人没了。\n\n## 十一、为什么我现在不说个股了\n\n我现在不说个股，还有一个考量。抖音上有个博主总结得特别好，我一直想说这件事，但总结得没人家好。\n\n我原来粉丝少的时候，我说什么个股、买
