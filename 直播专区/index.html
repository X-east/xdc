正常，选对了标的都可以赚。但你说我赚了百分之百，那你就有问题了：第一，你的持仓过于集中，这是风险行为；第二，你的持仓一定是风险巨大的那些品种，这是第二个风险行为。而你这两种风险都意识不到，你就不是一个合格的投资者。\n\n这就是盈亏同源。你高风险的偏好可能在某一个时段带来巨大收益，但你高风险的偏好最终就一定玩完。\n\n你看最近巴基斯坦雪崩，世界上最有名的登山专家在雪崩中死了。我告诉你这非常正常，他的人生偏好就是这样的。他有高光时刻，半年把八大山峰全登完，那你最终就一定死在登山的路上，因为你每天都在从事这种高风险偏好。爱玩洞潜的，最终的归宿都是在洞中宣告结束。\n\n所以军队里有句话：所谓的将军就是没死的士兵。你上战场第一件事得保证自己的安全。淹死的都是会水的。\n\n你看完塔勒布写的《随机致富的傻瓜》，这些就都能明白。假如重来一遍，马云还能不能成为马云？你现在准备向马云学习，我告诉你，你现在学也成不了淘宝，也做不了阿里巴巴。\n\n## 十四、闲聊：滇红、金庸、京味儿与东北\n\n喝茶这块我现在喝滇红，曾经有段时间特别喜欢祁红，但祁红大部分是粉碎茶，我不太喜欢，滇红大部分是原样的。生普洱现在空腹不敢喝了，得吃完饭再喝。\n\n电视剧我反复看的是《琅琊榜》和《雍正王朝》，琅琊榜的台词我都能背下来。大明王朝那种舞台范儿的，陈宝国、倪大红、陈道明这一路我都不怎么爱看——不能说他们演技不好，他们都是学院派，只是口味不同。陈建斌演得最好的我认为是《无名之辈》。范伟的戏我非常爱看，《看车人的七月》《耳朵大有福》《漫长的季节》都很好，他演小人物能传神。《漫长的季节》在韩国很火，国内反倒没那么火。\n\n马大帅里当年的彪哥，现在很多台词都成梗了。范德彪才是真正最了解人生的。\n\n北京四合院那类生活剧我都不怎么爱看，因为北京的生活和外地相距甚远，多多少少带点京味儿，外地人很难体会到那个点。央媒经常报道北京如何如何，你会以为北京的生活就是中国的生活，其实那是不对的。\n\n北京老百姓有个特点：周围全是达官显贵，听说和看过的东西很多，但和他们自己的生活又没什么关系，所以形成了一个特点——你一说啥，对他来说都不觉得惊奇。刘欢讲过一个笑话：北京大爷在胡同阴凉地里扇扇子，拿大罐头瓶子喝大碗茶，背心漏得全是窟窿，这时候过来个四川小女孩问\"大爷天坛怎么走\"，这大爷马上来了精神，问了一句\"四川人民现在生活得怎么样\"。这就是北京人最有意思的地方。\n\n所以为什么北京老百姓互相之间愿意称爷？因为对于北京的老百姓来说，除了北京的老百姓，其他人确实都是爷。你在湘西一个小镇里，没有人比你地位高多少，你不必要管别人叫爷；但在北京你就得管别人叫爷才能生存下去。这是历史形成的。\n\n东北的情况正好相反。倒退一百年，东北就是个移民社会，杂居的民族很多，混血比较厉害，所以演艺界东北人特别多——长相、身高、表达都有优势。现在出名的网红博主一半以上都是东北人。\n\n东北没有什么祠堂文化，家族文化比较淡漠，所以东北的重男轻女实际上是最轻的。原来都认为东北重男轻女最重，那是你没来过东北。本地的少数民族——满族、锡伯族、蒙古族，女的都不缠足，本来就没有重男轻女的传统。所以那种家族的道德绑架，在东北是非常少的。\n\n东北女孩在家里地位第一高，妈妈第二，儿子和爸爸排名不分先后。东北男人就是对女的让着，这是风气。所以在东北搞女权完全没有基础，应该搞男权。\n\n但东北的女性地位高，并不代表女的可以对男的进行欺诈和压榨。上海那种尊重女性和重庆那种，跟东北是两个劲儿——我觉得上海多多少少有点压榨男性了。\n\n最后说说《江湖丛谈》，我反复推荐你们看。这书是梁阔如写的，当年中国著名的评书专家，江湖地位很高。抗美援朝时成立曲艺团，副团长是侯宝林，团长就是梁阔如。\n\n看完了你就会发现，市场上这些套路，动若观火，两千年前就被中国人玩烂了，已经没有任何神秘可言。康养的小门店给老太太发鸡蛋，跟市场上发苹果是一个道理。\n\n江湖有自己的黑话，叫\"春点\"，是为了保护自己。所谓\"宁舍一锭金，不给一句春\"——我宁可把金子给你，都不能教你黑话。\n\n江湖的八大门派叫做：采、挂、金、提、平、款、吊、柳。在这些小门类的文艺里，地位最高的是说书的，因为说书的拿的东西最少，只有一块醒木。所有拿家伙事儿的——山东快书、数来宝、打快板的，原来都是乞丐，靠乞讨为生，进门先打板儿，所以地位都比较低。","toc":["一、日元干预只能改变贬值的速率","二、庙堂与江湖：学院派为什么在实战中不管用","三、聊天的本质是解决情绪，重复不是问题","四、合规的自我约束：把行为规范划到球场那么大","五、来市场只有一个目的：低买高卖，别感动自己","六、出货的逻辑：主力要的是对手盘，不是价格","七、什么叫真的\"亏了\"：先想怎么活十年","八、缩量不是流动性危机，跌停板才是","九、每一次上拉都是因为出货不顺畅，洗盘只是自我安慰","十、你就是别人：投资最终是和自己博弈","十一、高频量化受限后的连锁反应","十二、草地、斑马与狮子：你的盈亏由食物链位置决定","十三、盈亏同源：年初赚百分百的人不合格","十四、闲聊：滇红、金庸、京味儿与东北"],"url":"https://www.bilibili.com/opus/1243292645941313577","bv":"BV13NuF6GEf4","minutes":139,"chars":9102},"ai":{"title":"老木匠·2026年8月4日：主力出货与散户的人性","text":"## 一、你到市场里到底图什么\n\n1. 别自我感动，说到底就是低买高卖\n\n作者说，不管你炒的是科技股还是啥股，大单小单，那都是「马甲」「道具」，说白了都是工具。你真正想干的就一件事——怎么把别人的钱变到自己手里头来。\n\n他特别怼那种「我是为科技献身」「我在参与大国博弈」的人：你要真这么想，直接把钱捐给公司不就完了？说到底，你不过是想低买高卖，别玩玩感动自己的游戏了。\n\n2. 大部分人亏钱，是因为高买低卖还沾沾自喜\n\n低买高卖这道理谁都懂，但大部分人最后做的都是高买低卖——而且还能给自己找一堆「合理」的理由，甚至因此挺得意的。这就是大部分人一直在亏钱的根本原因。\n\n3. 对自己诚实，是最难的事\n\n散户还有个通病：老爱翻历史K线图幻想「要是当时40块买、涨到多少卖了能赚多少」。作者说，这就是对自己不诚实，你从来不老老实实面对「现在」该怎么办。\n\n## 二、主力怎么「抓猴」「扣鸟」——出货的套路\n\n1. 价格没意义，「有没有人接盘」才是关键\n\n作者这段讲得最起劲，反复强调一件事：主力想卖股票，靠的不是价格拉多高，而是「对手盘」——有没有人愿意接，卖的时候别人会不会跟着一块儿卖。\n\n2. 举个数字例子：200块吸筹，1400块诱多，800块出货\n\n假如我是主力，200块买的，本来打算800块卖掉。那我怎么才能顺利卖出去呢？我得先把价格拉到1400，在那儿挺一阵子，让大家伙儿都在1400附近换了手；然后我「啪」一下快速砸回800块——那些1400进来的人，你说他舍得800块卖吗？舍不得，就被死死套在那儿了。这时候800块这个位置，就我这个200块成本的能痛痛快快地卖，别人根本卖不动。这样我才能顺顺利利把货出掉。\n\n3. 比方一：箩筐扣鸟\n\n撒把粮食把鸟引进筐里，但你不能一扣上盖子就立马揭开，你得让鸟先泄了劲、不挣扎了，你才能真把它逮住。\n\n4. 比方二：抓猴，给你一个苹果你舍不得扔\n\n手里给了你一只苹果，你是舍不得扔的，你最终只有被抓住而已。\n\n他说现在很多手里拿着苹果（赚了钱没走）的人，没一个舍得走，都想着「我得先把苹果掏出来再走」——结果就差那么一哆嗦，最后又被套回去。\n\n5. 出货离不开舆情和利好的配合\n\n舆情得跟上，公司基本面消息得全是好消息，你买的时候才会「半夜都能笑醒，觉得自己捡了个大金矿」。反过来，前几年券商基本面全是骂声（说人家造假、没有未来），那时候恰恰可能是主力在低位悄悄吸筹——不然谁会心甘情愿把便宜筹码卖给你？\n\n## 三、「洗盘」到底洗的是什么\n\n1. 洗盘不是甩浮筹，是磨掉你的耐心\n\n他形容洗盘的节奏是「跌一天涨两天，跌一天涨两天」，抽冷子来一下，然后再阴几天，反反复复。目的就是不断消耗下面还想接盘的人，让被套的人越来越绝望，最后彻底死心，账户一关，从此再也不进场（甚至说「儿子要进就打断他的腿」）。\n\n2. 比方：扶老太太下楼\n\n这跟「扶老太太下楼」是一个道理：不能一把把人推下去，得慢慢来，一步一步地磨，这样底下才能不断有人接盘，不至于「车毁人亡」（也就是行情突然崩掉，流动性没了）。\n\n## 四、缩量到底是不是危机\n\n1. 缩量不是危机，「想卖卖不出去」才是\n\n作者说很多人天天喊「缩量=流动性危机」，纯属瞎扯，根本不懂。缩量恰恰说明想卖的人变少了，筹码稳了，交易反而顺畅，这不是坏事。\n\n真正的流动性危机，是「想卖的人卖不出去」——一般是因为有人被强制平仓（欠了保证金必须卖），越卖越跌，越跌越有人被平仓，形成一个「正反馈」，这时候才会真的出大问题。\n\n2. 温和下跌+缩量=交易顺畅，不是坏事\n\n你现在不卖，那是你自己的问题了，你还等谁来救你呀？现在市场是有效的，你卖就有人买。\n\n## 五、量化交易：坐高铁 vs 坐绿皮车\n\n1. 量化以前厉害，是因为跑得快，不是有内幕消息\n\n作者打了个特别形象的比方：过去高频量化有特殊通道，相当于是坐高铁的，而普通人是坐绿皮车的。等你到站的时候，人家早就到了，价格该挂的单都挂好了。它的优势不是因为知道什么内幕消息，而是它「跑得快」，消息一出来，它比你先反应过来。\n\n现在这个特殊通道被取消了，大家都变成坐绿皮车的，量化也就没那么可怕了。\n\n2. 量化的赚钱逻辑：先算多数人怎么做，再站到少数人那边\n\n量化是先算出「大多数人会怎么做」，然后故意站到少数人一边，去当大多数人的对手盘。所以你要是想沾量化的光，关键是自己要能站到少数派那边，而不是照抄它的具体操作。\n\n3. 通道没了，日内交易变成「掷色子」，更适合改做大波段\n\n量化通道受限之后，日内交易变得越来越像「掷色子」（随机），做T的成功率大幅下降，加杠杆做日内也没什么意义了。他建议这个时候更适合改做「大波段」——拉长持股周期，别老想着日内进出。\n\n4. 成交量会均值回归，但不会让散户整体少亏\n\n量化通道受限后，市场会有个「均值回归」：以前被几只热门票「抽血」抽走的成交量，会慢慢流回其他票上，原来冷清的可能变热闹，原来特别热闹的可能变冷清。\n\n但他特别提醒一点：这不会让散户整体少亏钱。他打了个生态比方——非洲草原上，狮子（某类资金）少了，猎狗（其他资金）会立马补上来，斑马（散户）该被吃掉多少还是被吃掉多少，这是由「草地」（散户总共往市场里投了多少钱）决定的，跟「钱具体被谁赚走了」没关系。\n\n## 六、赚太多，反而危险\n\n1. 今年上半年赚了100%的人，不是水平高，是赌得太大\n\n作者今年年初说过一句被很多人嘲笑的话：如果你今年上半年赚了100%这种超高收益率，你就一定不是个合格的投资者。因为这说明你仓位太集中，而且集中在风险特别大的品种上——这是两种典型的风险行为，即便当时赚到了钱，也说明你没意识到自己在裸奔。\n\n他说现在回头看，当初嘲笑他的人，大部分利润已经吐得差不多了。他说这就跟去赌场赢过一次一样，不代表你能全身而退。\n\n2. 比方：登雪山遇难的登山家\n\n他还拿登雪山遇难的登山家打比方：偏好越高风险的活法，早晚会死在这条路上，这不是运气不好，是概率问题——你天天走钢丝，迟早有一次会掉下去。\n\n3. 「危如累卵」这个词该怎么理解\n\n危如累卵，不是说明天不能再垒了，还可以继续垒，你要的是韧性、是自己在崩塌的时候不受影响——不是说我明天还要垒更高，那也可以，但你有可能就是最后一棒。\n\n## 七、市场博弈，说到底是跟自己博弈\n\n1. 你那点筹码影响不了价格，你的对手是你自己\n\n作者说，对绝大多数散户来说，你手里那点筹码根本不足以影响价格和流动性，所以你压根不是在跟「对手盘」博弈，你博弈的对象始终是你自己——「高了就想更高，回调了就想解套，套住了就想解套，最后一路割到裤衩子都没了」。\n\n2. 金句：「你就是别人」\n\n别人恐惧我，贪婪我说你恐惧的时候就是别人都恐惧了，因为你就是别人，你和任何人都没有差异。所以你一恐惧的时候，这事就快到头了；反过来说，你还没恐惧，说明这事就没到头。\n\n换句话说：你贪婪的时候，别人也在贪婪，行情大概率还没见顶；你害怕的时候，别人也都在害怕，底部可能已经不远了。\n\n3. 真逆向不容易，得先分清方向\n\n他还说，想真正做到「逆向操作」没那么容易，你得先能分清方向（东南西北），才有资格谈逆向；你要是方向都搞不清楚，瞎反着来，那不叫逆向，那叫瞎蒙，本质上你还是在跟着大家走，只是自己没意识到。\n\n4. 买完涨跌只是结果，不是判断对错的依据\n\n买完之后涨还是跌，只是个结果，不能拿来证明你当初的判断对不对。要是买完跌了，逻辑上说明这东西变便宜了，你该想的是要不要加仓，而不是纠结「怎么买完就该涨」。\n\n## 八、现在的市场处在什么阶段\n\n1. 远没到真正惨烈的时候\n\n作者反复说，个股、大盘具体怎么走这种话现在不能明说（属于「禁忌」），只能聊聊宏观层面的东西——这是他自己主动收紧尺度、规避监管风险，不是说现在真出了什么事。\n\n但他对当前市场的态度很明确：远远没到真正惨烈的地步，「标准动作、自由动作都还没做完呢，你不要以为现在就是高潮了」。\n\n2. 泡沫和真价值混在一起，市场比较割裂\n\n他说现在市场是「泡沫和有投资价值的东西同时存在」，还没出现普遍性的整体上涨，整个市场比较割裂。\n\n3. 长周期确定的方向能看，短期走势不猜\n\n对于确定性比较强、能看很长时间的方向（比如他提到的核电），他觉得拉长到二三十年的时间尺度看是没问题的；但对个股、大盘的短期走势，他不做具体预测。\n\n## 九、他自己的路子：不迷信「学院派」\n\n1. 书本知识打基础有用，实战决策靠经验\n\n作者说自己走的是「野路子」，不是学院派出身。他当过大学老师，很清楚学院派的东西是怎么来的——讲得细致、讲得严谨，适合用来打基础、建立一套系统的知识框架。\n\n但他说，真到了社会上、真到你要做投资决策的时候，学院派那套东西不见得管用。\n\n2. 比方：庙堂和江湖是两回事\n\n学院派的人适合在庙堂，但是我们普通老百姓是行走在江湖，江湖是江湖，庙堂是庙堂，这是完全不同的两件事。\n\n他不认同现在流行的那种嘲笑专家「什么都不懂」的风气，说专家懂的东西比普通人多得多，只是他那套东西在庙堂管用，在江湖不一定管用，这不是专家的错。\n\n3. 看自媒体预测行情，先看他前后是否一致\n\n对那些天天在自媒体上评价市场的人，他建议留个心眼：这类人经常是「看风向说话」，前几天还在说看好某个板块，风向一变马上改口说「我早就提示过风险了」。他建议大家把这些人过去的发言连起来看一遍，看看是不是前后一致，而不是只听他现在怎么说。","toc":["一、你到市场里到底图什么","二、主力怎么「抓猴」「扣鸟」——出货的套路","三、「洗盘」到底洗的是什么","四、缩量到底是不是危机","五、量化交易：坐高铁 vs 坐绿皮车","六、赚太多，反而危险","七、市场博弈，说到底是跟自己博弈","八、现在的市场处在什么阶段","九、他自己的路子：不迷信「学院派」"],"url":"https://xueqiu.com/2573414707/404385675","chars":3888},"topics":["出货逻辑","缩量非危机","量化受限","长期生存","风险偏好","江湖庙堂"]},{"date":"2026-08-02","bili":{"title":"老木匠 2026年8月2日直播文字稿（知识体系构建、常见误区、低碳饮食）","text":"今天没预告，随便聊聊。主要讲三件事：想做专业投资该怎么构建知识体系、散户在市场里最常见的误区、以及减肥这件事（低碳饮食）。\n\n## 一、知识体系：从基础教材开始，不要先看畅销书\n\n想系统掌握投资，第一步一定是看经济学基础教材——曼昆或萨缪尔森都行，二选一看完，你就理解了现代宏观、微观经济学的整个分析框架。这些书不是读一遍就拉倒，要真看懂名词和框架。\n\n经济学之后还要学货币金融学，也找国外基础教材看。但要注意：国外理论用来分析我们时，必须考虑特殊国情。会计学从投资角度不用学那么深，能看懂财务报表就行，看些通俗读物即可；经济学和货币金融学则一定要从教材打底。\n\n数学上，概率论与数理统计要有基础（文科生可能难，但理科生看通俗教材够用）。估值方面，估值本身就是艺术不是严谨科学，看书意义不大，多看投资大师关于估值的描述即可。心理学/行为金融学也要看，理解人的错觉怎么产生、信息后面怎么抽出自己需要的东西。\n\n我不信技术分析，不建议看怎么画K线——K线是成交的函数表现，是结果不是自变量，不能用结果分析结果。我就是一个普通散户，大部分知识都是自学的，包括法律。\n\n做投资相对其他职业有个特殊之处：它几乎只考察你的判断力。别的职业你判断完还得执行，执行过程往往逆着天性（比如不爱应酬、不愿溜须拍马的人做公务员会非常难受）。投资只有决策最重要，买卖无非点点鼠标，没有\"不愿做\"的执行问题。决策对了受奖励，错了受惩罚，谁都怨不了。\n\n## 二、常见误区：散户是怎么被消灭的\n\n市场并不试图和你争论，它只是简单地消灭你。根据经验，现在活跃的大部分人五年内都会被消灭——不是钱亏没了，是心理上被打垮了，一提市场就瑟瑟发抖。\n\n新入市的典型历程：听到周围人赚钱（一定是牛市）→在相对高点进来买高估标的→短暂赚点→标的下跌→亏损→清户离开，一辈子不看了。能最后生存下来的散户极少。今天被嘲\"老登\"的那些人，不管多不赚钱，至少在市场存活了很久，继续存活概率反而高；今天的小登大部分活不下去。\n\n几个最要命的误区：\n\n1. 追涨买入、套牢后变价值投资者。 新散户一进来本来是追涨的趋势投资者，等一跌下来就开始研究基本面。最高买入、一跌又不舍得卖，这是最致命的。所有被套的人开始给你讲\"AI是人类最后一次科技革命\"\"硅基生命代替碳基生命\"，纯粹是因为股票被套了。股票不被套、高点卖了，早去莺歌燕舞了，跟基本面有啥关系？所有标的都是马甲，关键是你赚没赚到差价。\n\n2. 把\"搏傻游戏\"当基本面。 趋势炒高的东西本身就是搏傻——你要考虑后边还有没有比你更傻的人，用更高价格把你接走。经常回头看看你在市场里排第几傻；如果你排第一傻、后边没人了，还扯什么基本面。你今天讲的基本面，都是人家两年前就预计到的，不把价格干到这么高，这基本面能套住你吗？等你都知道硅基代替碳基的时候，硅基就快走穷途末路了。\n\n3. \"别人恐惧我贪婪\"背口诀壮胆。 你就是别人。别人恐惧时你一样恐惧，别人贪婪时你一样贪婪。刚进来的五年之内说自己\"不是普通人\"，那一定是因为没认识到风险。没有天选之人。\n\n4. 假逆向投资。 科技股涨了二十倍跌了30%，就有人准备\"抄底\"，还说自己是逆向投资——别人恐惧我贪婪。你就是贪婪，还不跑，准备挣最后一个铜板。涨二十倍跌三十叫抄底？这是新手。\n\n5. 回看K线图找遗憾。 \"我要是四十块买现在都一千了\"。告诉你，四十块你也拿不到一千。回看过去谁都会，历史上已发生的。你应该看的是从今天起未来一年的K线，不是过去一年的。当时没买有当时没买的原因，和今天没买的原因一样——确定性不足。你能预计且确定性强的上涨才能赚钱，因为只有这样你才敢重仓；光是上涨你赚不了钱。\n\n6. 一进来就总结经验。 刚挣点钱就开始给别人讲课、写文章讲自己如何选股。你正好赶上上涨趋势，没见过熊市，这套办法到熊市裤衩都亏没。活下来比什么都重要，先活五年再总结。\n\n一个比喻：散户在市场里，就像角马过河——水里有鳄鱼、岸上有狮子、天上有秃鹫，你还得过河。没有你的钱，印花税、券商佣金、量化收益从哪来？这个生态就是靠你生存的。\n\n收益率预期要现实：一年复合8%就能成为全世界最卓越的投资者（约翰·聂夫就是8%点多）。三年一倍大部分人都达不到。新入市的路径往往是第一年翻倍，然后用五年把翻倍还回去还倒贴本金。第一年亏损其实是好事——能理解这句话的都是老登了。小登都不理解。\n\n我的模式就是寻找低估的东西。趋势投资者等上涨才买，散户一进来是趋势投资、一跌就变价值投资，这错位最要命。低估的行业现在其实比2024年还多，因为资金都被科技吸引走了。2024年我最看好的是券商（当时叫\"渣男\"），十月份我全部清空，那时所有人开始推荐券商、嘲笑我——你们最近看到的有色，在2024年的券商身上已经演绎过一遍了。市场上没有新鲜事儿。\n\n（本场不聊个股、不评价标的、不披露持仓，也没有作业可抄。自选和组合都不代表实际持仓。）\n\n## 三、低碳饮食：减肥唯一靠谱的办法\n\n减肥唯一的办法就是低碳饮食。我见过最成功的就是我儿子——我做了一年低碳饮食，他天天去健身房，减得非常成功，胖子变瘦子。\n\n高碳水一定减不了。高碳水饮食结构会引发胰岛素大幅上下波动：吃进大量碳水→胰岛素大量分泌压低血糖→等血糖低了胰岛素还在→造成血糖偏低→特别饿→一会儿又想吃。所以高碳水吃完一会儿就又饿了。\n\n不用搞成零碳或生酮，低碳就行：少吃碳水，让胰岛素波动小，饥饿感就不频繁，很快能瘦。核心是以肉为主食——肉蛋奶这些动物性食品当主食先吃，再吃一点点碳水。红烧肉可以天天当主食吃，很快减肥；但别吃红烧肉再配一碗大米饭。肥肉瘦肉都一样，天天吃五花肉也行。\n\n刚开始不吃碳水时会很饿（体内胰岛素基线水平高），等适应低胰岛素水平就不饿了。我刚开始吃牛排也饿得睡不着，时间长就瘦了。每顿碳水控制在50克以内基本都能减。\n\n要点：\n\n油炸淀粉（油条、炸鸡裹面包糠）最厉害，糖油混合物绝对不行\n\n鸡胸脯肉那玩意跟吃木头似的，普通人没必要遭那罪，减肥不是靠遭罪\n\n海参是智商税，不如吃猪蹄；杂粮是全谷物、升糖慢、含膳食纤维\n\n鱼虾最好，长期吃推荐生吃三文鱼（脂肪有益）；牛排首选和牛、其次安格斯；澳洲、阿根廷、巴西牛肉都可以\n\n先吃菜和肉把肚子垫起来，碳水自然就少吃\n\n配合力量训练、有氧即可\n\n压力大的时候人天然想吃淀粉糖类缓解焦虑，这正常。减肥是为了可持续，得吃爱吃的好吃的才能坚持下去。","toc":["一、知识体系：从基础教材开始，不要先看畅销书","二、常见误区：散户是怎么被消灭的","三、低碳饮食：减肥唯一靠谱的办法"],"url":"https://www.bilibili.com/opus/1242156167530020869","bv":"","minutes":0,"chars":2643},"ai":{"title":"老木匠·2026年8月2日：怎么学投资，怎么活下来","text":"## 一、想系统学投资，该看什么书\n\n1. 先打基础，别一上来就看畅销书\n\n作者说，如果只是想对投资市场有个大致了解，看彼得·林奇这类书就行；但要是想真正系统地学，得先啃基础教材——经济学先看曼昆或萨缪尔森随便一本，把宏观微观的分析框架搞明白，这是所有后续东西的地基。\n\n2. 经济学之后是货币金融学，会计只要看得懂财报就行\n\n经济学学完还得看货币金融学的基础教材，也建议看国外的，但要注意国外理论套到国内得考虑特殊国情。会计学不用学到记账那么细，能看懂财务报表就够了，随便找本通俗的会计读物看看就行。\n\n3. 概率论与心理学，这两样躲不掉\n\n他特别提概率论与数理统计——文科生可能觉得难，但这块知识必须有。除此之外要看行为金融学、心理学方面的书，搞懂人在做决策时会受什么心理影响、各种错觉是怎么产生的。他点名推荐了塔勒布的《随机致富的傻瓜》（也叫《随机漫步的傻瓜》）和《黑天鹅》，说看完这两本对概率和市场结局会有突飞猛进的理解。\n\n4. 不建议看K线技术分析\n\n他说自己不信技术分析，不建议大家去研究怎么看K线，理由是：K线图本身只是成交结果的一个表现，不是自变量、不是原因，「你不能用结果分析结果」，这是把因果关系搞反了。\n\n## 二、投资这件事，只考验你的判断力\n\n1. 别的工作要判断+执行，投资只需要判断\n\n他说自己就是个普通散户，靠这个谋生。投资这行有个特别之处：干别的工作除了判断对不对，你还得去执行，而执行过程往往逆着自己的天性（比如不爱应酬却得应酬）。但投资不一样，你决策完了，执行只是点点鼠标的事，没有天性别扭的问题——判断对了就有奖励，判断错了就有惩罚，谁都怨不了。\n\n2. 跟上学考试有点像，但比工作简单\n\n他说这有点像上学考试：题会做就是对，就能得高分；但工作中判断对了不一定能做对（还要看执行、看人际关系等一堆变量）。这种「只考验判断力」的纯粹感，是他觉得投资这件事的魅力所在。\n\n## 三、大部分新人在市场里的悲剧循环\n\n1. 典型剧本：牛市进场→追高→短暂盈利→亏损→离场\n\n他描述了一个大部分散户都会经历的心路历程：先是听说周围人赚钱了（一定是牛市），然后在相对高点进场，买了偏贵的标的，短暂赚一点钱，接着开始下跌，最后亏损离场、销户，一辈子再也不碰。真正能在市场里长期生存下来的散户非常少，包括现在被追捧的这些「时髦标的」的投资者，他估计95%到99%最后都活不下来。\n\n2. 「老登」能活到今天，本身就是一种筛选\n\n他说现在网上流行嘲笑「老登」（老投资者）不赚钱，但要想到一点：不管今天赚不赚钱，这些人已经在市场上活了很长时间了——既然活了这么久，继续活下去的概率反而更高；今天风光的「小登」们，大部分反而活不下去。\n\n3. 最悲剧的路径：第一年翻倍，后四年全还回去还倒贴\n\n他说大部分新入市的人是这么个过程：第一年就翻倍了，然后用接下来四年时间，把这笔翻倍的钱亏回去，还要倒贴本金，最后离开市场，永远不再回来，甚至告诉自己孩子「你要投资我就打断你的腿」。\n\n4. 反常识的一点：新人第一年亏损，其实是好事\n\n这是他反复强调的一句话：\n\n新入市的人第一年就亏损是好事，非常好的事。能理解这句话的人都是老投资者了，新手都不理解。\n\n道理是：第一年就翻倍，往往会让你误判自己的水平，容易在后面加大风险，最终摔得更惨；反倒是先受点挫折、还能坚持住的人，更有可能走上正确的路。\n\n## 四、怎么看周期股\n\n1. 行业到高点/低点，大家都会说「这次不一样」\n\n他说周期股这事没什么好争论的：任何行业到了周期高点，大家都不认为它是周期股，都要争一争「这次不一样」；到了周期低点也一样，比如现在的养猪、光伏，很多人也在说「已经没有周期性了」——这是每次周期高低点都会重复出现的争论。\n\n2. 全行业亏损，往往就是周期底部\n\n他的判断标准很简单：当一个行业出现全行业亏损时，就说明基本到了周期底部了——因为没人有动力再扩产，一定会有产能被迫退出，谁也不可能一直亏钱撑着。这时候比的是谁现金储备多、身体好，能撑到最后，撑到最后的人就赢了。至于底部会持续多久，他说自己也判断不了，只能是选一个财大气粗、大概率能撑到最后的标的，拿着等。\n\n## 五、对自己诚实，别骗自己——回看K线是个大坑\n\n1. 回看K线说「我要是40块买了」，都是自欺欺人\n\n他说很多人喜欢翻历史K线幻想「这票40块我要是买了，现在都涨到1000了」。他说：你要真在40块买了，你也拿不到1000——因为你根本不知道后面会涨这么多，中途早被震出去了。回看的时候人人都「英明」，那是因为历史已经发生了，你应该想的是未来一年会怎么走，而不是过去一年怎么走的。\n\n2. 检验自己是否诚实的办法：你敢不敢现在买\n\n他说自己的原则是：不管别人吹嘘某个标的历史上涨了多少倍，他只问一句话——「你当时买了吗？你今天敢买吗？」没买就别拿事后诸葛亮说事，这跟买双色球中奖号码一样，你没买中奖号码，那这个高收益跟你就没关系。\n\n3. 如果你真信它会涨，你会砸锅卖铁去买\n\n他说：如果当时真知道某个东西能涨这么多，那自己肯定会想办法把房子卖了、信用卡刷爆了去买。没这么干，恰恰说明当时自己对它的「确定性」根本没有把握——你不能只看「有没有涨」，得看你当时是不是真的有把握、敢不敢重仓。\n\n## 六、「懂科技」不代表能在科技股上赚钱——思科的例子\n\n1. 散户亏得最惨的，往往是自认为最懂基本面的人\n\n他说这轮科技股上亏钱最多的，很多恰恰是曾经在科技行业干过、自认为很懂的人——用东北话讲叫「淹死的都是会水的」。他举了个例子：前几天爆仓的那个美国AI基金经理，本身就是OpenAI出来的研究员，够懂了吧，照样爆仓。\n\n2. 思科的故事：即便是行业老大，也判断不了技术路线的未来\n\n他讲了个思科的例子：2000年互联网泡沫时思科市值一度接近5000亿美元，是当年最被看好的「卖铲子」公司（做互联网基础设施的），业绩也一直在增长、年年分红回购，但股价直到最近才刚刚回到2000年的高点。他反问：思科的老板懂不懂科技？为什么没能提前押中后来的光模块、GPU这些赛道，没能成为下一个英伟达？连他这种身在其中的人都判断不了技术会往哪个方向走。\n\n他补充说，就连芯片领域，十几二十年前真正的老大是英特尔，那时候英伟达在哪儿？没人能想到自己会被后来者取代。所以他说，做投资首先要找准自己的角色——你是来投资的，不是来搞技术研究的，别觉得自己懂，「连马斯克都不见得懂这个世界会往哪发展」。\n\n3. 价格涨太高的时候，「容错空间」就变小了\n\n他说不是不让大家投这些方向，而是当价格涨到很高、容错空间很小的时候，这就是一种风险——现在给光模块这么高的估值，谁敢保证未来不会被别的技术路径替代？\n\n4. 他自己怎么处理科技仓位\n\n他说自己两年前也重仓买过科技类ETF、半导体、光纤、电网设备这些，也确实赚了钱，但他从来不会拿到「像现在泡沫这么大」的位置——这不符合他的模式。在确定性极大的时候他会买，但涨到风险很高、随时可能下跌的阶段，他就不会继续拿着了。\n\n## 七、追涨杀跌与「博傻游戏」\n\n1. 新散户最常犯的错：进来是趋势投资者，跌了就变价值投资者\n\n他说纯粹的趋势投资者是不研究基本面的，追高买入、下跌就止损。但大部分新散户做不到——追高买进去，一跌就舍不得卖了，这时候才开始「研究基本面」给自己找理由继续拿着，这是最要命的行为模式。\n\n2. 基本面故事往往是用来「请君入瓮」的\n\n他说得很直接：\n\n你今天所讲的基本面，都是人家两年前就预计到的。人家不把这个东西干到这么高，这个基本面不出来，他能卖给你吗？换句话说，没有现在的基本面，你能买吗？能把你套进来吗？\n\n等到全网都在讲「AI是人类最后一次科技革命」「硅基生命代替碳基生命」的时候，往往说明这个故事已经快讲到头了。\n\n3. 「博傻游戏」：你得知道自己排第几傻\n\n他打了个排队的比方：追高炒热点本质上是场博傻游戏，你得判断后面还有没有比你更傻、愿意用更高价格从你手里接盘的人。经常回头看看自己排第几傻——如果你是「天下第一傻」，后面没人接盘了，那基本面讲得再好也没用。\n\n## 八、收益率的真实标准：别做发财梦\n\n1. 「三年一倍」已经是非常卓越的收益，巴菲特都不一定做到\n\n他说市场上很多人把「三年一倍」当保守目标，但实际上大部分人根本做不到；如果能保证长期年化复合收益率8%，就已经是全世界最卓越的投资者之一——他举了约翰·涅夫（John Neff）年化8.2%的例子，那已经是公认的顶级基金经理水准。\n\n2. 别信自媒体上「年化30%」这种说法\n\n他提醒大家，自媒体上动不动宣传「年化30%」的基金经理，往往没有可持续的长期业绩跟踪——很多私募一个人发上百只基金，专挑业绩好的那只出来宣传，其余亏钱的基金则被用来给这只「明星基金」抬轿。\n\n3. 合理预期：15年做到8%已经很厉害，做到6%也不错\n\n他建议：如果有10年投资经验，把年化目标定在6%就挺合适；能做到超过银行定存利率加通胀率，就算是不亏的投资。他强调复利效应很关键——6%的年化复合收益率，坚持15年下来是一笔相当可观的收益，比银行不计复利的定存高得多。\n\n## 九、生存的时间表：5年、10年、15年\n\n1. 先别想着赚钱，先给自己定「5年不离开市场」的目标\n\n他说新进入市场的人，最合理的目标就是「5年之内别被市场消灭掉」，而不是想着5年要赚多少钱。他有一句流传很广的话：\n\n市场并不试图和你争论，它只是简单地消灭你。市场不会和你争论，也不会说服你，它只是消灭你而已。\n\n2. 5年生存，10年开始盈利，15年稳定盈利\n\n他给出一个大致的时间节点：5年要保证能生存下来，10年开始能盈利，15年必须做到稳定盈利。如果15年过去还只能赚个银行活期利息，那就得认真检讨自己的问题了。\n\n3. 5年后如果还在甩锅「主力」「量化」「T+0收割」，就不适合干这行\n\n他说见过很多投资者进场10年，操作方式和对市场的认识跟第一年时几乎没有任何进步——如果10年之后还满嘴「主力如何如何」「庄如何如何」，那说明完全没有成长。他强调股票市场是博弈最公平的地方：没人逼你买、没人逼你卖，赚的是你的，亏的也是你的，除了自己找不到任何其他原因。\n\n## 十、「别人恐惧我贪婪」到底怎么用，别只是背口诀\n\n1. 你就是「别人」，别拿这句话给自己壮胆\n\n这句巴菲特名言很多人挂在嘴边，但作者提醒：\n\n你就是别人。所以别人恐惧的时候，你一样会恐惧；别人贪婪的时候，你一样会贪婪。别老背口诀给自己壮胆，你和普通人的差异并不大，等哪天你和普通人真的不一样了，你自己会感受到。\n\n他特别强调：刚进场5年之内就说自己「不是普通人」，那基本就是没认清风险，没有什么「天选之人」。\n\n2. 跌了30%就喊「抄底」「逆向投资」，其实是错把贪婪当逆向\n\n他举了个当下的例子：科技股这两天下跌，很多人说自己要「逆向抄底」，觉得别人恐惧了自己该贪婪了。但他反问：一个涨了20倍的标的，只跌了30%，这叫抄底吗？他说这些人本质上不是逆向，只是还没舍得走、还想再赚最后一个铜板，是贪婪，不是勇敢；真正的逆向投资者得先能看清方向，「你搞不清东南西北，你逆向个屁，你只是转向了，其实还是顺着大伙走」。\n\n3. 别急着「总结经验」，你可能还没见过熊市\n\n他说很多刚进场一两年、赶上牛市赚了点钱的人，就开始跑来跟他讲自己的一套方法（比如「涨20%就卖，跌20%就加仓」），他提醒：你现在的方法只是恰好赶上了上涨趋势，还没经历过熊市的考验，这套东西到了熊市可能直接让你亏得裤衩子都没了。5年之内先别忙着总结经验，先想着怎么活下来。\n\n## 十一、市场生态：你不是钓鱼的人，你就是那条鱼\n\n1. 塞伦盖蒂角马过河的比喻\n\n他打了个很形象的比方：散户在这个市场里生存，就像塞伦盖蒂草原上角马、斑马过河——水里有鳄鱼，岸上有狮子，天上有老鹰秃鹫，你还非得过这条河不可。\n\n2. 整个生态都靠你的钱在养活\n\n他说得很直接：\n\n没有你的钱，印花税从哪来？券商吃马喂的钱从哪来？量化的收益从哪来？没有你的钱，这个生态不就崩溃了吗？\n\n所以他不建议身边的人做投资——这事想生存下来是非常难的，「你就是鱼，别扯什么在有鱼的地方钓鱼，你压根不是钓鱼的」。\n\n3. 大家都赚钱的时候，恰恰要小心\n\n他提醒：如果进场才一年的新人都能轻松赚一两倍，这本身就不是常态，说明一定有你没看到的风险正在积累，这时候反而应该格外谨慎，而不是更加放心大胆。\n\n## 十二、他自己的投资方法论\n\n1. 不站队、只找低估的东西\n\n他说自己没有什么「派」，「什么挣钱我就是什么派」，不是巴菲特信徒，也不刻意标榜格雷厄姆式价值投资。他的方法就是不管牛市熊市都去找低估的标的，这跟趋势投资者（专挑上涨的时候买）完全是两种模式，没有高低之分，只是适合自己的方法不同。\n\n2. 从不披露持仓、不推荐个股\n\n他反复强调：自己的自选股和组合都不代表实际持仓，也从来不评价个股、不推荐个股，直播里聊的东西不构成投资建议，「你要是为了抄作业才关注我，你可以取关了」。\n\n3. 拿2024年券商、2021年白酒举例，说明「历史没有新鲜事」\n\n他提到2024年他看好券商股时被骂「渣男」，后来10月份大家一致看好时他反而清仓了；也提到2021年他就警告过白酒、酱油这些「白龙马」标的存在问题，当时同样被嘲笑。他说这些争论年年都在重演，只是换了个板块的名字而已，「市场上没有新鲜事」——他最怕的就是散户开始讲基本面，因为「一散户讲基本面，基本上就是被套了」。","toc":["一、想系统学投资，该看什么书","二、投资这件事，只考验你的判断力","三、大部分新人在市场里的悲剧循环","四、怎么看周期股","五、对自己诚实，别骗自己——回看K线是个大坑","六、「懂科技」不代表能在科技股上赚钱——思科的例子","七、追涨杀跌与「博傻游戏」","八、收益率的真实标准：别做发财梦","九、生存的时间表：5年、10年、15年","十、「别人恐惧我贪婪」到底怎么用，别只是背口诀","十一、市场生态：你不是钓鱼的人，你就是那条鱼","十二、他自己的投资方法论"],"url":"https://xueqiu.com/2573414707/404385749","chars":5557},"topics":["知识体系构建","常见误区","低碳饮食"]},{"date":"2026-08-01","bili":{"title":"老木匠 2026年8月1日直播文字稿（日元汇率本质、通缩与QQE、日元商品化、贬值反转、投资心法）","text":"今天只聊宏观，不聊市场。核心是把以日元为代表的汇率问题讲透——为什么学院派经常判断错日元的升贬值，底层逻辑从来不是纯经济金融，而是政治。\n\n## 一、日元的本质：美元的影子货币\n\n把日元理解为美元的稳定币、影子货币。日元升值或贬值，背后都有一个影子叫美国。\n\n日本战后五六十年代的快速发展靠美国支持，但当日本生产力追上、七十年代开始威胁美国产业时，美国就开始限制日本。金融上的一个关键表现，就是广场协议逼迫日元升值——当年日元对美元汇率极低，日本货在美国卖得极便宜，冲击了美国产业，美国要解决的正是日本对美大额贸易顺差。\n\n今天这一幕很熟悉：当年对美国是对日本，现在对中国。加关税、逼迫本币升值、各种技术壁垒，美国在日本身上全用过。当年半导体最发达的是日本，美国先扶持后撤出，才有了台湾和韩国的半导体大发展。日本不是完全主权国家——如果是，当年搞自主可控，今天局面完全不同。\n\n看欧盟也一样。如果欧元不存在，德国马克、法国法郎的境遇会和日元差不多。德国唯一做对的事，就是和法国联合成立欧盟、建立欧元区。日本去和谁建联合体？所以分析日本金融政策、汇率，不考量政治博弈，得出的结论都和事实相去甚远。\n\n## 二、日元升值如何导致通缩，又如何逼出QQE\n\n广场协议后日元大幅升值，对日本国内带来两个变化：\n\n第一，进口变便宜。全世界商品用美元标价，日元对美元升值后，这些商品对日元就变便宜，带来输入性通缩——原油、黄金、工业原材料都便宜了，日本生产成本降低。\n\n第二，通缩让日元购买力变强。对老百姓来说，持有现金躺床底下都相当于有孳息，因为明年东西比今年便宜5%，多出来的就是通缩给的利息。这影响的是实际利率：实际利率=名义利率−通胀率，通缩时通胀率为负，实际利率变相升高，相当于日本自动加息了。\n\n对企业，借贷成本越来越高；对消费者，东西越来越便宜。通缩最可怕的是降低消费欲望——今年买不如明年买，大家都不消费，经济就没了动力。所以健康经济体要保持适度通胀，防止过度储蓄。\n\n日本为了对付通缩倾向，把利率一降再降到零甚至负利率（负利率就是日本人发明的），并大量买入日本国债，后期甚至买股票ETF。QE最早也是日本人发明的。\n\n给大家一个量级概念：日本全部国债大概一千两百万亿日元，日本央行持有约五百三十万亿，占比大约45%。按这个比例，美联储应该持有约18万亿美元美国国债，而实际现在只有两到三万亿。如果美联储要达到日本央行的持有比例，还得再买约15万亿美元——基础货币翻五倍，物价也会相应上涨约五倍。这只是帮你们建立思考方法，不是定论。\n\n## 三、日元被商品化：钱印了却不通胀\n\n既然日本央行买了那么多国债、投放了大量基础货币，为什么日本没恶性通胀、反而继续通缩？道理在于：日元被商品化了。\n\n商业银行的货币创造，靠借贷让基础货币乘上层数。但日本有个最麻烦的问题——央行发行的日元大量流到境外，没在国内参与货币创造。因为日本利率极低，从日本借日元换成美元去美国投资有利差，这就是套利。所以日本发行的货币没留在国内流通，而是被拿到国外当投资抵押品。\n\n升值的预期一旦形成，所有人按预期行事，日元就真升值——股市、黄金都一样。日元不断升值，国外游客去日本普遍反映物价太贵；统计上则带来光鲜结果：GDP很高、人均收入很高，但这是汇率虚高的假象，不代表日本人实际生活水平高。日本人均收入比中国高得多，但生活水平没高那么多，这就是汇率假象。\n\n## 四、贬值反转：黄金替代日元成为避险仓库\n\n日元长期升值（二十到三十年）的终止条件，是国际资本找到了更好的避险工具。日元升值的长牛，本质是国际资本把它当抵押品的需求，相当于为美元创造受信效应——贷款需要抵押品，抵押品越贵越容易贷到钱。历史上荷兰郁金香泡沫时经济繁荣，也是因为资产升值带动货币创造。\n\n当黄金重新被认可，日元的避险功能就彻底丧失。国际资产价格（黄金、贵金属、有色金属、原油）开始上涨，资本不再需要买入日元做抵押品，转而买黄金。日元作为抵押品的功能消失，囤积者抛弃日元、买入黄金，日元就大幅贬值。财富像装在仓库里——从日元这个仓库抽到黄金那个仓库，前者降价后者涨价。\n\n所以日元今天的贬值，跟货币政策关系都不大，也不是因为美国加息（利差变大反而该更多钱去美国）。本质原因是：日元原本的升值是名不副实的，是虚高的，是国际金融大鳄把它当抵押品需求、导致日元商品化的结果，其汇率和日本的真实生产能力根本不匹配。即便贬到今天，我认为日元汇率依然虚高。\n\n日本去年前年首次加息（几十年首次，现在利率约1%），叠加汇率贬值倾向，国外投资者手里囤的日元失去意义，被抛弃、转买黄金。这些日元不再当投资品，开始回归日本金融体系吃利息——这是日元\"货币化\"反转，从类黄金商品重新变回货币。\n\n结果就是：日本越加息，滞留海外的日元越回流，国内货币越多，反而出现通胀。以前越降息国内货币越少（钱都去国外了），现在越加息越回流、越通胀。日本其实已经在做QT，持有的国债开始降低。\n\n## 五、美日三方博弈：行政干预只改斜率\n\n日元回流日本，等于在抽离美国市场上的抵押品，造成美元流动性降低，影响美国权益市场。美国本来不怕——美联储有\"看跌期权\"，流动性出问题时可以QE、降息兜底。但问题在于现在美联储不配合。\n\n沃什上台本身代表美国博弈的结果，特朗普不是什么都说了算。美联储和政府不是一回事，是博弈双方，可理解为日本央行/政府、美国政府、美联储三方博弈。美国政府搞稳定币，就是绕过美联储向市场注入流动性的方式，相当于另发一套不依赖美联储的货币。沃什重申美联储不会为任何资本市场背书，就是强烈告诉市场：波动时美联储不提供看跌期权。\n\n受影响最大的是美国政府，但它控制不了美联储，只能让日元回流速度变慢——维持日本汇率、不让日本加息，办法就是公开市场上干预。以前日本自己干预要卖美债买日元，对美国国债也是冲击；这次美国可能亲自配合日本干预汇率。目的就是防止日元大量回流冲击美国市场。\n\n但所有行政干预都是救市措施，只能改变趋势的斜率，改变不了趋势本身。日元走贬是长期虚高回归的结果，不是被低估。行政干预能挺多久？美国政府只对接下来两年负责，美联储负责期限几乎无期限，政治家遇到问题解决问题，不会把某个问题终极化解决。\n\n现在全世界金融市场很多诡异变化：美国国债收益率大幅升高预示流动性紧张，纳斯达克却大涨；韩国市场前两天熔断、又涨18%；我们市场也是前几天每天跌10%今天突然涨10%。高位波动性加大，预示风险在加大。巴菲特说现在全世界资本市场都是赌场。\n\n## 六、投资心法：你只和自己博弈\n\n投资无论研究基本面、宏观、心理，都不重要，都是马甲。投资最终一句话：你在和自己博弈，唯一要战胜的是自己。怕套牢、怕没买在最低、怕没卖在最高，都是和自己博弈。\n\n一个标的被你卖出后继续上涨，多少人捶胸顿足；如果卖出后下跌，你会得意洋洋吗？两者都不对。正确做法是平静如水——已卖出的和你没关系。对你有意义的只有两个价格：买入价和卖出价。期间价格变动都没意义，不是胡锡进说的\"不卖就不亏\"（那是废话，退市了怎么办），而是你在不卖时是否还有信心它涨回来。\n\n所有投资标的都是工具，低价买、高价卖，只有这两个点有意义。买入后突然下跌，心里不舒服但资产没影响——前提是你确信它未来还会涨。\n\n聊到芒格和巴菲特。芒格和我受教育历程、思维模式、经历都像，所以我特别喜欢他。芒格有道德洁癖，当律师时连给客户寄律师费账单都觉得像要钱、不舒服；后来发现大部分客户没自己聪明，干脆服务自己，做房地产、做证券。七三、七四年他的私募基金没清仓损失很大，投资人施压，他从此决心不再替别人操作，关掉基金专门替自己投资，后来和巴菲特合到一块。\n\n巴菲特、芒格资金体量和我不是一个量级，但投资方式一样。中国动不动有人自称\"中国巴菲特\"，道德根本不过关——老巴和芒格不管投资怎样，两个人的道德绝对没问题，这也是我喜欢他们的原因。\n\n对自己约束要画篮球场那么大，而不是法律那个乒乓球。有道德洁癖干不了律师，我也因此做不了律师。人都是这样，公共道德只有篮球大，你最好对自己的约束画篮球场那么大。\n\n（本场仅讲宏观，不聊个股、不给买卖建议。个人做法是清掉全部融资以抵御波动风险——不怕波动，即便浮亏也不在乎。）","toc":["一、日元的本质：美元的影子货币","二、日元升值如何导致通缩，又如何逼出QQE","三、日元被商品化：钱印了却不通胀","四、贬值反转：黄金替代日元成为避险仓库","五、美日三方博弈：行政干预只改斜率","六、投资心法：你只和自己博弈"],"url":"https://www.bilibili.com/opus/1242156047266742293","bv":"","minutes":0,"chars":3391},"ai":{"title":"老木匠·2026年8月1日：日元的来龙去脉与投资心法","text":"## 一、日元为什么这么重要——先搞懂它的历史逻辑\n\n1. 日元是「美元的影子货币」，日本不是完全意义上的主权国家\n\n作者说，日元在国际金融市场的地位很特殊，可以把它理解成「美元的稳定币」，日元升值贬值背后总有个影子，就是美国。他抛出一个大胆的判断：日本可以理解为不是一个完全的主权国家，很多常规的经济学分析用在日元身上经常会失效，就是因为学院派把日本当成一个普通的主权国家来分析，而不考虑背后的政治博弈。\n\n2. 广场协议：今天对我们做的事，当年在日本身上演练过一遍\n\n他讲了段历史：日本战后经济恢复靠的是美国支持，但五六十年代日本发展太快、开始威胁美国产业后，美国就开始限制日本——加关税、逼迫本币升值、技术封锁，这些手段全用过。最典型的就是广场协议，逼迫日元大幅升值，用来解决当时日本对美国的巨额贸易顺差。他说了一句挺扎心的话：\n\n大家是不是觉得这一幕非常熟悉？现在美国也在这么做，只不过当时对的是日本，现在对的是我们。\n\n他还提到一个冷知识：当年全世界半导体最发达的地方其实是日本，是美国一手扶持起来的，后来因为日本对美国形成了威胁，美国才逐渐撤出，才有了后来台湾和韩国半导体产业的崛起。\n\n3. 日元升值之后，日本国内发生了什么：输入性通缩\n\n这段是他讲得最细的地方。逻辑链条是这样的：日元大幅升值 → 日本进口国外商品（石油、黄金、原材料）变便宜 → 国内物价下降，出现「输入性通缩」→ 老百姓发现钱放着不动也会「变相生息」（因为东西一直在变便宜）→ 大家越来越不愿意消费，因为「今年买不如明年买」→ 消费全面萎缩。\n\n他解释了一个概念：实际利率 = 名义利率 − 通货膨胀率。当通胀率是负的（也就是通缩）时候，即便央行把名义利率降到零甚至负数，实际利率仍然可能是正的——老百姓照样不愿意花钱，企业的真实借贷成本反而在变高。\n\n4. 日本央行为了对付通缩，发明了QE，买国债买到了全世界都吃惊的地步\n\n为了刺激消费，日本把利率一降再降，最后降到负利率（负利率就是日本人发明的），还开始大量买入本国国债——QE这件事其实是日本人最早搞出来的。作者给了个具体数字：日本全部国债大概1200万亿日元，其中日本央行自己持有的大概530万亿日元，占比大概45%。\n\n他让大家换算一下：如果美联储按同样比例持有美国国债，40万亿美元的美债总量乘以45%，大概是18万亿美元，而美联储目前实际持有的美债大概只有2万亿多——也就是说，要达到日本央行那个持有比例，美联储还得再买进大约15万亿美元的国债，那基础货币会直接翻5倍左右，物价大概率也得跟着大涨。他说这是个思维训练，让大家理解「日本这个持有比例究竟有多夸张」，不是真的说美联储会这么干。\n\n5. 关键悖论：印了这么多钱，日本为什么没有恶性通胀？——日元被「商品化」了\n\n这是他讲的一个核心概念：\n\n这个时候日元被商品化了。本来一国发行的基础货币应该放在本国流通领域里参与货币创造，但日本最麻烦的问题是，日本央行发行的日元大量被汇到了境外，而没有留在国内参与货币创造。\n\n原因是：日元利率极低，从日本借日元几乎不要钱，换成美元拿到国外投资就能吃到利差，这是纯粹的套利。所以日本虽然印了很多钱，但这些钱没有留在国内流通，而是被国际资本当成了一种投资抵押品囤在了海外——这就导致日本国内的货币并没有真正扩张，通缩反而越来越严重。\n\n6. 预期自我实现：大家都觉得日元会涨，日元就真的涨了\n\n他讲了一个金融市场里很普遍的现象：\n\n在金融领域里，当所有投资者都预期某件事会发生的时候，这件事就一定会发生。大家都认为日元会升值，大家就都会买入日元，日元就真的升值了。股票市场、黄金市场都是这个道理。\n\n日元最升值的时候，对美元汇率一度到过70多兑1。这也带来一个统计上的假象：日本人均GDP、人均收入看起来很高，但其实并不是日本真的生产了更多东西，只是汇率把数字撑高了，日本国内物价其实一直很贵，实际生活水平并没有账面数字看起来那么风光。\n\n7. 日元一度成了国际资本的「避险资产」，靠的就是这种「必涨」的预期\n\n因为币值稳定又有升值倾向，日元一度成了国际资本的避险工具——本身没什么利息，但只要放着，换回美元时就赚了汇差，这就是日元避险功能的由来。\n\n8. 为什么日元现在开始贬值：不是因为货币政策变了，是因为国际资本找到了更好的「抵押品」\n\n他给了一个关键比喻——把各种资产理解成装财富的「仓库」：\n\n你可以把日元、黄金都理解为是一种装财富的仓库。大家把财富都装在哪个仓库里，那个东西就会涨价，财富从这个仓库抽出来移到另一个仓库的时候，原来那个就会跌价。\n\n他说，随着黄金、有色金属、原油这些资产价格开始上涨，日元作为「避险抵押品」的功能就被替代了——国际资本不再需要囤积日元来避险，转而买入黄金，这才是日元近期大幅贬值的根本原因，跟美联储加不加息关系不大。他强调：日元的贬值不是「偏好变了」，而是它原本的升值本来就是虚高的、名不副实的，今天只是在往真实价值回归而已，即便跌到现在这个位置，他依然认为日元汇率是偏高的。\n\n9. 日本一旦加息，海外滞留的日元就会「回流」，反而制造出国内通胀\n\n这是个挺反直觉的结论：以前日本越降息，海外囤积的日元越多，国内货币反而扩张不起来，通缩越来越严重；而现在日本开始加息后，海外那些当抵押品用的日元开始变得「不划算」，纷纷被抛售换回黄金，这些钱又逐渐回流到日本国内的金融体系里——这才让日本近几年少见地从通缩转向了通胀。作者说，两年前他就公开判断过：日本一旦加息，日元不但不会像多数经济学家预期的那样升值，反而会加速贬值，还会带来国内通胀，当时被很多经济学家认为是「出人意料」，他说其实一点也不意外，只是他们没搞懂前面这套底层逻辑。\n\n10. 日元大量回流会「抽走」美国市场的流动性，这才是美国现在紧张的原因\n\n他解释了这一层联动：以前留在海外的日元，很大一部分是作为抵押品参与到美元资本市场的货币创造中的；日本越加息，这些日元回流越多，相当于从美国市场里抽走流动性，冲击美国资本市场。而美联储现任主席（沃什）明确表态不会再为资本市场兜底、不提供所谓的「美联储看跌期权」，这就让美国政府很被动——它管不了美联储，只能想办法让日元「别那么快回流」，具体做法就是配合日本干预汇率、稳住日元汇率，防止日元加息节奏太快。\n\n他特别提醒一点，这几方不是铁板一块：\n\n你不要把美国政府和美联储理解为一个整体。你可以把它理解为三方在博弈：日本央行/日本政府，美国政府，美国的美联储。\n\n11. 行政干预只能改变趋势的「斜率」，改变不了趋势本身\n\n他总结说，所有靠行政手段的市场干预，本质上都是一种类似救市的措施——只能让某个趋势走得慢一点、平缓一点，改变不了这个趋势最终要往哪个方向走。因为日元贬值的根子在于它原本汇率虚高、需要向真实价值回归，这不是靠干预能解决的。\n\n12. 救市这件事的另一面：本质上是在给高位套牢的人「送钱」\n\n他打了个滑梯的比方，说明干预汇率客观上让那些做空日元的资本又多赚了一轮：\n\n这个救市措施就是给那些大鳄在送钱。你把日元汇率托起来以后，相当于把已经滑到底、本该自己爬上去的人重新抱起来，让他有空间再玩一把、再坐一次滑梯。\n\n他把这个逻辑对应到我们自己市场上的救市操作：当某个筹码已经高到没法出货的时候，如果有资金进场托底、把高位筹码买走，这本质上也是在给持有高位筹码的人「送钱」——他举例说，前几天大量资金买入科创ETF，也是类似的操作。\n\n## 二、当前全球市场的风险信号\n\n1. 波动率骤然放大，本身就是风险在积累的信号\n\n他举了几个例子：美国国债收益率大幅走高，说明美元流动性在收紧，但纳斯达克成分股同时却大涨，这种背离本身就很诡异；韩国市场前两天刚熔断，隔一天又暴涨18%——他反问：\n\n这是一个正常的市场吗？你是按照什么给它估值的？两天熔断以后，再涨一个10%？\n\n他提到巴菲特接受采访时说过，现在全世界的资本市场都更像一个赌场——我们自己的市场也是一样，前几天连续跌停，隔天又突然涨停，这种大幅度、高频率的双向波动，本身就是风险信号，而不是行情健康的表现。\n\n2. 他自己怎么应对：清空全部融资、哪怕割肉也要降风险\n\n他说自己在今年6月末的时候，判断到了科技股会出现比较猛烈的下跌，于是把手里全部的融资仓位清掉了——包括一些他自己很喜欢、后来走出独立上涨行情的标的，也是割肉清掉的，割肉的规模他估计「超过了市场上90%的人的本金」。清仓当天，很多标的正好还是阶段性最低点。但他强调，这不影响他的选择：\n\n为了防风险，不用在乎这些，任何时候防风险都是最重要的。这就跟你车买保险道理是一样的，你不能说我今年一年没出事故，就觉得保险白买了。\n\n他说这么做还有另一层考虑：因为之前一直是满仓满融的状态，他担心有粉丝跟着他承担同样高的风险偏好，所以从6月份开始反复强调「清融资」，也是出于对跟随者的责任考虑。\n\n## 三、投资的核心心法（这段是他讲得最重的部分）\n\n1. 理性是投资的第一素质\n\n他引用芒格的话：\n\n投资的第一个素质是理性，要理性，别的都不重要。\n\n他说投资这条路看起来门槛很低，其实门槛很高；但一旦真正跨过这个门槛，也没有大家想的那么复杂。\n\n2. 所有的分析工具都是「马甲」，投资的本质是跟自己博弈\n\n他说得很直接：\n\n投资无论你研究什么，基本面也好，宏观也好，人的心理也好，这都不重要，这都是马甲。投资最终就一句话：你在和自己博弈。你不是在和别人博弈，你是在和自己博弈。你唯一需要战胜的是你自己。\n\n他说，你怕套牢、怕卖飞、怕没买在最低点、怕没卖在最高点，这些情绪本质上都是在跟自己较劲，跟市场里的「对手」没有关系。\n\n3. 卖出后的涨跌，都跟你没关系了——正确的心态是「平静如水」\n\n他举了个很日常的场景：你卖出一只票之后它继续涨，你会不会捶胸顿足？如果卖出后它反而跌了呢，你会不会得意洋洋？他说这两种反应都是不对的：\n\n正确的做法应该是平静如水，这件事就跟你没关系，你已经卖出的标的，它和你没有关系。\n\n4. 只有买入价和卖出价对你有意义，中间的每一天波动都是「自变量」\n\n他重申了这一点，并且专门纠正了一个流行说法——「不卖就不亏」：\n\n不卖不亏这句话没有任何错，但问题在于你是否在不卖的时候依然有信心它还会涨回来，这才是关键。你不卖就不亏，未来它退市了，你怎么叫不卖就不亏？或者未来永远也回不到你这个价格，你怎么办？\n\n他说，每天看盘的意义，是为了帮你找到「便宜的买点」和「相对高的卖点」这两个关键判断服务的，除此之外每天的涨跌波动本身对你没有意义。买入后如果下跌，只要你确信未来会涨回去，这件事对你的资产并没有实质影响，顶多是让你心里不舒服。\n\n5. 这种「确信」从哪来：只有不断学习，没有别的办法\n\n有人问他怎么才能建立那种「我确信它会涨回去」的底气，他的回答很朴素：只有不断的学习，没有别的办法。他还打了个游泳的比方：\n\n如果你去游泳池，不会游泳，深水区有个人抱着你说别怕、我抱着你，你依然会害怕，因为你自己不会游泳。你想不怕，唯一的办法就是自己学会游泳。\n\n6. 对自己的约束，要画得比法律和道德的边界更大\n\n他讲了一句很有意思的话，来说明自己对风险和自律的态度：\n\n如果法律约束只有乒乓球那么大，道德约束可能有篮球那么大，但你对自我的约束应该画篮球场那么大。\n\n他说自己一直是这么要求自己的，投资上也是同样的逻辑——不是「能不能被抓到」的问题，而是自己心里那道尺子要立得足够严。","toc":["一、日元为什么这么重要——先搞懂它的历史逻辑","二、当前全球市场的风险信号","三、投资的核心心法（这段是他讲得最重的部分）"],"url":"https://xueqiu.com/2573414707/404385786","chars":4711},"topics":["日元汇率本质","通缩与QQE","日元商品化","贬值反转","投资心法"]},{"date":"2026-07-31","bili":{"title":"老木匠 2026年7月31日直播文字稿（日元危机、国情特殊、波动即分歧、投资修行）","text":"## 一、把市场当教材看，不与任何人 PK\n\n今天这市场好多年都少见，得把它当教材。这种特殊行情阶段非常有意义的——不管你做不做，都需要看，需要体会各路人物粉墨登场，每个人想达到什么目的，你都可以分析。至于分析对不对，没人能知道。我常强调：你看到的都是假象，但要试着从假象里学会分析背后的真实原因。\n\n博主被追责、基金经理出来喊话，每个人都不是偶然的，背后都有目的。\n\n我一贯的态度：不和任何人 PK，也不跟别人比。我赚我自己的钱，跟别人没关系，不需要争排名。你观点跟我不一致我不会屏蔽你，但你老试图说服我，那咱就没法一块聊天了——聊天是找乐，天天有人试图纠正你，太耗神。直播间里基本都是铁粉，这就挺好。\n\n## 二、下跌趋势里的\"死猫跳\"改变不了趋势\n\n有人认为科技股完了这轮牛市就完了，这完全是不了解市场。所谓\"死猫跳\"，就是长期下跌趋势里突然的大幅急拉，原因很多是偶然的。它可能一天结束，也可能两三天，甚至个把月，但一般来说，下跌趋势一旦形成，靠短时间急拉改变不了。\n\n趋势改变是有条件的：必须经过长时间横盘，做到筹码充分交换，才能重新上行。下跌的原因是有人在出货，而这些人就是当初形成上涨的人。他们出去后再进来一批新人重新涨，是需要时间的。\n\n我不愿意用\"主力\"\"庄家\"形容强势资金——强势资金有时是一个人，有时是不同人，有时只是一种共识。你可以统称为\"优势资金\"，因为他们资金量大，交易行为会影响价格。他们之间有时也会博弈。\n\n## 三、日元危机：日本央行像被蟒蛇缠住的人\n\n最近日元非常有意思。昨天晚上大概率是日本央行强力干预了汇率。但日本还能干预多少次？没多少次了。逻辑很简单：日本不加息，汇率表现只有一种解释——央行下场大力干预，卖出美债换美元、在海外买日元推升汇率，但这极大消耗外储。\n\n现在日本的货币政策就像个被蟒蛇缠住的人，每喘一口气蟒蛇就收紧一点，勒得更紧。围着日本央行的国际资本大鳄都在虎视眈眈，一旦它露出虚弱就冲进去，\"断其喉、尽其肉乃去\"——当年索罗斯狙击英镑、亚洲金融危机时狙击东南亚，都是这套路，这次该轮到日本了。他们在盘算日本手里还有多少子弹，子弹一没，汇率迅速崩溃。\n\n### 1. 日元是美元的\"稳定币\"\n\n日本是国际贷款（尤其在美国）的主要抵押品提供者。你借出日元换成美元去美国投资，两边赚利差，日元就成了贷款抵押品。一旦日本扛不住大幅贬值而大幅加息，海外日元会回流日本收孳息。\n\n这正是日本长期通缩的主因：日元作为国际硬通货被\"商品化\"了。外国投资者拿到日元不当货币、当商品（跟黄金差不多），拿到手就汇到境外用，日本印了很多钱却仍在通缩——钱被运出境了。\n\n更特殊的是：一旦加息，钱回流日本，国内流通环境反而更宽松，可能通胀更严重。日美之间有个货币循环——你可以把日本央行理解为美元的稳定币，日元就是美元的稳定币。日本加息→海外日元回流→美国抵押品减少→美国货币创造坍缩、美元流通变紧；而日本货币反倒更宽松。所以日本在国际金融里的地位，千万别小瞧。\n\n### 2. 巴菲特在日本是\"白借的钱\"\n\n巴菲特买日本标的，不是拿美元，是从日本贷款——利息极低，接近零。他贷了款在日本投资，对巴菲特来说是债务，但几乎没有成本。日本市场上涨时，他获得的就是纯利，跟普通人融资融券一个道理：涨一倍卖一半，剩下还日本央行，白得的。\n\n关键是巴菲特买入时，整个日本市场被极度低估。\n\n### 3. 中日外储都不能用常规标准看\n\n中国外储三万四千亿现在也不准，因为有大量\"外汇外挂\"——很多国企在海外赚的外汇没汇回国内，属于企业、不计入外储范畴。去年贸易顺差一万亿，外储却没增加，钱去哪了？要么没结汇，要么当投资款在海外买了矿厂。有人估中国外汇约七万亿美元。\n\n所以衡量中国不能套国外标准。比如杠杆率：中国政府除了债务还有资产（国有银行、央企），一减债务率其实很低；美国除了国债哪有国有资产？再看巴菲特指标（市值/GDP），中国很低，而且大量国资基本不流通，考察市场过热与否必须考虑这部分不流通资本。很多有留学背景的人占据研究部门主导，总拿国外比例比中国，一看 M2 多就觉得杠杆高——其实没那么高。现在发达国家里杠杆率最高的是日本。\n\n包括注册制，也不适合中国。你说交给市场决定，但没充分认识我们是以散户为主的市场，把定价权全交出去就是大型屠杀现场——散户知道什么定价依据？最后别人定啥他信啥。量化也是，我不认为今天的问题是量化造成的，但在这个市场引入量化本身就不合适。任何东西都有基础境况，得从基础出发。\n\n### 4. 中国调控工具比国外多一项\n\n国际上宏观调控无非货币政策（准备金率、利率、央行资产负债表、买卖国债、逆回购）和财政政策（投钱、税收）。但中国多一项：有大量国企，可以通过国企影响物价和就业。\n\n比如电力涨价，美国因为 AI 数据中心耗电多、有涨价需求，在中国很简单——发电企业大部分是国家的，我不让你涨，亏了也不让涨。国外做不到。所以我们的调控工具多一项选择。\n\n## 四、高位高波动是危险信号，波动即分歧\n\n现在美股都在高位、高波动，非常危险。千万别以为今天轰一下涨百分之二十是好事。高位头一天跌百分之十、明天又涨百分之十，说明筹码极不稳定。\n\n最稳定的是低波动（一天涨跌百分之一以内），最抗风险。低位的高波动往往预示牛的来临——某标的突然拉百分之十、隔几天跌回去、再过几天又大涨，往往意味着上涨趋势开始。低位低波动是稳定，高位高波动也是稳定，但稳定不等于好坏，它只代表\"状态会持续\"。\n\n波动代表的是分歧。你波动越大，说明这个位置大家分歧越大。高位分歧大，意味着到头了；低位分歧大，意味着要启动。熊市底部不仅波动小、成交量也小，说明分歧很小、看法一致，这种状况还会持续。高位高波动高成交，意味着分歧在加大，已经很危险。\n\n看那些科技标的的成交和波动——今天最著名那只，成交会不会创历史新高？成交大是买的人多、同时也是卖的人多，分歧变大，正是激烈博弈。新上市标的流通盘太少，不能当样本，得看全流通的。\n\n有色不算疯狂，只是跑得靠前，里头很多是跟概念炒、不是真受益。真正的问题是赛道太拥挤——拥挤程度历史之最，当年的白马股都没科技这么拥挤。太拥挤就是危险。\n\n## 五、基金经理的机制困局与普通人出路\n\n这些公募经理不是\"该死\"，是激励制度决定了他必须这样。全世界都解决不了：你不买热门就募不到资金。大家一定得理解——大家都买某个你就买，都不行反正一起下来，不是你的错；但你标新立异买冷门，一旦没成就是你的错。所以很多看似不合理的东西，都能在机制里找到原因。\n\n作为普通人，有一点闲钱，能自己弄就自己弄，不能自己弄我意见是干脆别弄。买那些产品基本没赚钱的人——你分辨不了哪一只是真有水平的管理人，一万多支产品怎么分辨？我家人亲戚朋友，我不赞成他们买这东西，也不赞成进权益市场。\n\n宽基不是不行，关键在择时：在最低迷、没人再提这事儿时买入，基本没问题，但那时大部分人不敢买。二四年我劝过很多人买宽基，前几天他们又觉得宽基能规避风险——你看最近这一个月，宽基规避风险了吗？所以最好要么自己行，要么真认准某个代理人水平好，否则干脆别做。记住：百分之八十的人最后不会获得正收益。\n\n## 六、2018 之后没有真熊市，十年预测是徒劳\n\n一八年十月份之后进来的，没见过真正的熊市。二四年九二四之前、二三年、二二年、二〇年疫情初期，那都不叫真熊市，时间都短。看看二〇一五从高点下来到二〇一八年近两年三年是啥样，再看〇七〇八下来到一三年之前是啥样——那才叫一眼望不到边。\n\n以后美国市场都会有熊市，别以为它涨了十七年就如何，下一个熊市更惨。现在美国市场成了一种信仰，就像当年\"京沪永远涨\"。熊市一定会来，牛市也一定会来，人总在牛顶认为熊市不存在、在熊底认为牛市不存在，这都是无限循环的。你们进场的时机是风平浪静、大趋势向上的时期。\n\n十年之内一定有熊市，但十年之后可能已是下一轮牛市了。你总把一年想太长、把十年想太短。今年是二〇二六年，十年前是二〇一六年——那时有人听过人工智能吗？知道房地产会跌吗？动不动看十年、看一百年，一九二六年能想象今天有手机电脑吗？二〇〇六年连智能手机都没有，你说未来有标的市值超茅台会被笑死。我现在以半年为限，这是我看得最远的东西。那些说能看多远多远的，都是扯淡、过于自信。\n\n## 七、投资修行：等待、笨功夫、对自己诚实\n\n今年的主题就是防风险，把这四个字刻在骨子里。别一会儿\"葱油上头\"——机会有的是，娶不着张家还有李家王家，什么事别着急。投资真谛就是等待，像大学浴池大部分时间在等，巴菲特说只有大象出来才开枪：一样东西值一块，不卖你五毛、卖你两毛时你再买。就是要等。买早了无所谓，谁也不敢保证买在最低点；你该想的是他不跌到八毛七毛还有别人会跌，为啥只盯一个人？\n\n投资得不断提高自己，谁也代替不了你，谁告诉你的都不一定准，适合别人的也不一定适合你。不要老想着像郭靖吃蟒蛇就百毒不侵——那都是爽文。所有学习都枯燥，从零到一、一到二、二到三，没有从零到一百。现在的城市剧基本都是爽剧：霸道总裁按财富分配颜值、按颜值分配道德，长得磕碜的一定是坏蛋。现实世界平淡无奇，学知识一点一点积累，干什么都得下笨功夫。\n\n### 1. 警惕感性系统，问自己\"这是思考还是直觉\"\n\n《思考，快与慢》（卡尼曼，诺奖）值得看，有两个译本，台湾译的更好。核心是人有两个系统——感性系统和理性系统。你得时刻提防：你获得的认知，究竟来自感性还是理性思考？很多人分不清。看东西大部分从感性角度形成印象就定调了，甚至有人看公司名就望文生义开始投资。\n\n今天冲进去的人，你究竟是因为它涨了才买，还是因为它便宜？判断便宜不该看今天涨跌——假如有人只告诉你这公司一年挣多少、现在卖多少，不告诉你去年前天价格，你做的决策反倒更好。明明很便宜但最近还在跌你就不敢买，明明很贵但最近还在涨你觉得可以买，这不对。昨天今天的价格对你有啥关系？今天跳涨百分之十你回不到昨天买，明天还能跳这么高吗？你不该受涨跌影响，该评估的是价格合不合适——贵了，涨也别买。\n\n### 2. 对自己诚实，别用基本面给追涨找补\n\n做趋势的人，跌下来必须设止损。但很多散户明明做趋势，一跌下来就开始讲价值、讲基本面——你明明是涨上去追的，为什么没涨的时候不讲？就像铝四元时不买，涨到十元追进去，涨到十五没卖，跌到十二开始讲基本面了。你讲基本面时四元为啥不买？所以做这东西要对自己诚实，别为了好过一点自己骗自己。\n\n### 3. 周期股的宿命：底部说\"这次完了\"，顶部说\"不会再跌\"\n\n存储本身是强周期行业，五倍市盈率按现在景气度也不算便宜，明年大家都破产时还不一定多少钱。两三年前存储亏得裤衩都快没了。我特别好奇：很多东西明明无数次走过周期，底部时就是没人买，高点时就是没人卖。\n\n后来发现——所有周期品在底部都会有一堆故事说\"它已经不是周期了、这次彻底起不来了\"；在高位也是这套故事\"已经不是周期了、不会再跌回去\"。是不是这样？\n\n---\n\n全程为评书演绎，不指导投资、不提个股。","toc":["一、把市场当教材看，不与任何人 PK","二、下跌趋势里的\"死猫跳\"改变不了趋势","三、日元危机：日本央行像被蟒蛇缠住的人","四、高位高波动是危险信号，波动即分歧","五、基金经理的机制困局与普通人出路","六、2018 之后没有真熊市，十年预测是徒劳","七、投资修行：等待、笨功夫、对自己诚实"],"url":"https://www.bilibili.com/opus/1242535400290910212","bv":"","minutes":0,"chars":4537},"ai":{"title":"老木匠·2026年7月31日：波动代表分歧与熊市常识","text":"## 一、把当天的行情当教材来看\n\n1. 亲身经历过和从书上看来，完全是两回事\n\n他说这种特殊的行情阶段非常有意义——不管你做与不做，都需要看、需要体会：\n\n这里面各种不同的人物粉墨登场，他们每个人都需要达到什么目的，你都可以分析。至于分析得对不对，没有人能够知道。\n\n他再次强调那句核心：\n\n你看到的都是假象，但是你要试图尝试着从这些假象里面学会分析背后的真实原因是什么。\n\n他说各种博主被追责、各种基金经理出来喊话，「每一个都不是偶然的，它背后都有目的」。\n\n## 二、日元：蟒蛇缠身式的垂死挣扎\n\n1. 汇率异动只有两个可能：干预，或者预期加息\n\n他当天判断日本央行进行了强力干预，理由是：如果日本央行现在不加息，那前一晚的汇率表现就只能是干预造成的。而干预的过程是——卖出美债获得美元，然后在海外市场买入日元，这样才能让日元升值。\n\n但这个过程当中，极大地消耗了日本央行的外汇储备。而日本还能有能力干预多少次，我觉得应该也没有多少次了。\n\n2. 比方：被蟒蛇缠住的人，每呼吸一次就被勒得更紧\n\n现在日本的货币政策就有点像一个垂死挣扎的人——相当于被蟒蛇缠住了以后，你每次呼吸，蟒蛇都会收紧自己的身体，你就会被勒得更紧。\n\n他说围绕在日本央行周围的国际资本大鳄都在虎视眈眈，一旦日本表现出虚弱就会冲进去。他引了《黔之驴》：\n\n跳踉大㘎，断其喉，尽其肉，乃去。当年索罗斯狙击英镑就是这么干的，亚洲金融危机狙击马来西亚、泰国也都是这么干的。我觉得这一次应该是轮到日本了。\n\n他说这些人在盘算日本手里还有多少子弹，一旦子弹没有了，汇率会迅速崩溃。\n\n3. 为什么日元加息反而会让日本国内更宽松\n\n他把这个反直觉的机制讲得很完整：日元被当成硬通货之后实际上被「商品化」了——大家拿到日元都汇到国外去用，这些日元离境后就不再参与日本国内的货币创造。\n\n所以日本印了很多钱，但实际上他还通缩——你的钱相当于被运出境外了。但一旦加息的时候，这些钱会回流日本。\n\n所以他的结论是：加息不但可能不会让日元升值，反而会造成日本国内通胀更严重。\n\n越加息，日本国内的流通环境就越宽松。这不是不符合货币金融规律，而是日元长期商品化所带来的必然结果。\n\n4. 对美国的影响：抵押品减少，货币创造坍缩\n\n他解释了另一头的传导：日元在美国是重要的贷款抵押品提供者——借出日元换成美元到美国投资，两边赚利差，日元被当成抵押品。一旦日元回流：\n\n美国的抵押品减少，就会导致美国整个货币市场的创造形成坍缩。没有抵押品，贷款就会减少，货币创造能力就会降低。\n\n所以他的总结是：日本加息可能导致美国货币收紧，同时导致日本货币反倒更宽松。他还给了个定性：\n\n日元不是一个完全的主权货币，你可以把日元理解为美元的稳定币。\n\n5. 预期的自我实现（索罗斯的反身性）\n\n他解释日元当年为什么能长期升值、成为避险货币：\n\n投资日元是因为大家都认为它会升值，大家都认为它会升值，它就会真的升值——这和黄金没有任何区别。索罗斯的话说这就是反身现象。你认为市场会崩溃，那么大家都卖出的时候，市场就一定会崩溃。\n\n他说这相当于物理学上的正反馈。\n\n6. 顺带解释：巴菲特买日本标的是怎么操作的\n\n他说巴菲特买日本的标的实际上不是拿美元买的，而是在日本贷的款——日本利息极低（长期接近0），所以这笔债务对巴菲特来说几乎没有成本，性质类似他保险公司的浮存金。\n\n等日本市场开始上涨，他所获得的利润就是纯利润。而且最主要的是，巴菲特买入那个时期整个日本市场是被极度低估的。\n\n## 三、看中国的数据，不能直接套国外的标准\n\n1. 外汇储备：我们有大量「外挂」\n\n他说中国的3.4万亿外汇储备数字并不准确，因为有很多外汇「外挂」——国有企业在国外挣到的外汇没有汇回国内结汇，还有一部分作为投资款在国外买了矿场。\n\n你想一想，去年我们的贸易顺差是1万亿美元，但并没有导致外汇储备增加，那你的钱去哪了？\n\n他说有人认为中国的实际外汇规模大概在7万亿美元左右。\n\n2. 杠杆率：我们有资产，美国没有\n\n他说不能用美国的标准衡量中国的国债占GDP比例：\n\n我们国家作为政府来说，除了有债务之外还有资产。而美国除了国债，哪有国有资产？我们大量的国有银行、各种央企，这些资产一减去的话，其实我们的债务率是非常低的。\n\n3. 巴菲特指标：我们有很大一部分是不流通的\n\n他说巴菲特指标（资本市场市值/GDP）在中国也有特殊性——我们资本市场里有大量投资属于国资，这一部分基本是不流通的。所以在判断市场是否过热时，应该考虑这一点。\n\n什么东西一遇到我们，他就得做一个特殊处理。\n\n他还批评了一种现象：现在有很多有留学背景的人占据经济研究部门的主导地位，但他们学的东西「有点水土不服」，总是拿我们的比例去和国外比，「所以一看我们M2特别多就觉得杠杆率特别高，其实没有那么高」。\n\n4. 我们比国外多一个调控工具：国有企业\n\n他说国际通行的宏观调控无非就是货币政策（准备金率、利率、央行资产负债表规模、买卖国债等）和财政政策（投向、税收）。而我们多了一项：\n\n我们有大量的国有企业，还可以通过国有企业去影响物价。比如电力涨价，在国外你控制不了；在中国就很简单，发电企业大部分是国家的，我就不让你涨，你亏损了我也不让你涨。\n\n## 四、韩国的教训：他们把方向做反了\n\n1. 该收紧的时候放松，该放松的时候收紧\n\n他分析韩国市场的应对：\n\n为了防止市场大幅下跌，先来个加息，然后收紧融资条件；而在上涨的时候，却批了单只股票的ETF。这不完全做反了吗？\n\n他说正确的做法应该是：上涨的时候提高交易难度，下跌的时候继续提供融资。而现在又在研究增加交易成本，那交易就更不便利了。\n\n2. 流动性溢价：越难交易，价格越低\n\n他解释了这个概念：\n\n同样一个东西，如果流通容易、买的人多卖的人也多，这个东西给的价格就高，高出去的这一部分就叫流动性溢价。\n\n他举了两个例子：同一个公司，上市和没上市价格差别很大，就是因为流动性溢价；A股和B股同权，但B股因为交易的人少、流动性差，价格要低很多。所以「他们为了防止价格继续下跌，却增加了交易难度」，方向是错的。\n\n3. 日本和韩国的国民性：\n\n他说日本人做事的特点是细节做得特别好（「日本人磨的刀特别快」），但战略上老是犯错误：\n\n两次大战，二战的时候他就是个战败国，唯一一次脱离日本这个岛屿的机会也被他丧失掉了。大事他老是选错，这就是他的国民性格。\n\n他说日本央行在历史上房地产泡沫崩溃时也做了很多蠢事，「就跟今天的韩国一样」。\n\n## 五、波动代表分歧——这是判断位置的关键指标\n\n1. 高位高波动最危险，低位高波动往往是牛的开始\n\n这是他这场讲得最实用的一段。他说：\n\n在高位的高波动是非常危险的——头一天跌10%、明天又涨10%，这说明筹码很不稳定。最稳定的情况是低波动，一天涨跌1%以内。\n\n他补充了完整的四种组合：高位高波动往往预示熊的来临；低位高波动（某天突然拉10%、20%，隔几天跌回去，过几天又大涨）往往意味着上涨趋势的开始；高位低波动和低位低波动都意味着稳定。\n\n2. 为什么？因为波动代表分歧\n\n波动代表的是分歧。波动越大，说明大家对这个东西在这个位置的分歧越大。那么在高位分歧又大的时候，就意味着这个东西已经到头了；而在低位分歧大的时候，意味着它将要启动了。\n\n他说成交量也代表分歧：真正的熊市底部不仅波动小、成交量也很小，说明分歧很小、大家看法一致，所以这种状况还会持续。反过来在高位是高波动、高成交量，意味着分歧在加大——「我不敢说分歧加大就一定会下跌，但它已经很危险了」。\n\n3. 现在的问题是：赛道太拥挤\n\n这种拥挤程度是历史之最。当年的白龙马都没有现在这些东西拥挤。太拥挤了，就是危险。\n\n他还提醒一点：新上市和次新的标的不能用来做样本，因为流通盘太少，大部分筹码被锁着、参与不了博弈，要看那些全流通的。\n\n## 六、公募基金经理为什么必须抱团\n\n1. 不是该死，是激励机制决定的\n\n他说这不光是我们的问题，全世界都解决不了：\n\n大家都买这个你就买，如果都不行了、反正大家都下来了，这不是你的错。但你说我要标新立异，买一个我认为好的冷门的，一旦没成，这就是你的错。\n\n他说这涉及募集资金的问题，你不这么做就募集不到资金。他给了一个更普遍的方法论：\n\n有很多你看似不合理的东西，实际上都可以在它的机制里面找到原因。\n\n2. 他对普通人买产品的建议\n\n他说得比较直接：普通人分辨不了一万多只产品里哪个管理人真正有水平，所以「要么你自己行、自己做，要么就干脆别做这个东西」。他说自己的家人、亲戚朋友，他都不赞成他们买这些，甚至不赞成他们进权益市场。\n\n对宽基ETF他的看法是：宽基不是不行，关键在择时——「你在熊市已经熊到没有人再提这件事的时候买入宽基，基本上是没问题的。但那个时候大部分人都不敢买。」\n\n## 七、2018年之后进场的人，没见过真正的熊市\n\n1. 这八年没有真正意义上的熊市\n\n他在直播间里让2018年10月之后进场的人扣「1」，然后给了个结论：\n\n18年之后没有真正意义上的熊市。所以你不要以为你18年之后进来赚了点钱，你就如何了。\n\n他说24年的924之前、2022年、2020年疫情初期，那都不叫真正的熊市，「时间都很短暂」。真正的熊市是\n\n一眼望不到边——你看看2015年从高点下来一直到2018年，将近三年时间是啥样的；再看看07、08年下来一直到2013年是什么样的。\n\n2. 牛市和熊市都一定会来，人们只是在顶部和底部忘了这件事\n\n人们总是在牛市的顶端认为熊市不存在了，而在熊市的底部认为牛市不存在了。这个东西都是无限循环的。\n\n他还说美国市场也一样，「现在美国的市场都被认为是一种信仰了，就跟当年咱们说京沪永远涨似的」——「你不要以为美国市场17年的上涨就如何，他下一个熊市会更惨」。\n\n3. 别动不动就谈十年、二十年、一百年\n\n他对这种表达很不以为然，给了个很有说服力的反问：\n\n今年是2026年，十年之前是2016年。2016年的人听过人工智能吗？2016年知道房地产会跌吗？2016年的时候，茅台还是神。\n\n他说很多人「总是把一年的时间想得太长，而把十年想得太短」。至于他自己：\n\n我连一年我都看不了，我看东西就是以半年为限，这是我能看的最远的东西。现在这些人信誓旦旦地说他能看多远，我认为这都是扯淡，过于自信了。\n\n## 八、今年的主题就两个字：防风险\n\n1. 机会有的是，别着急\n\n今年的主题就是防风险，你就把这个防风险刻在骨子里头，别一会儿一冲就上头了。机会有的是——娶不着张家的还可以娶李家的，娶不着李家的还可以娶王家的姑娘。\n\n2. 投资的真谛就是等待\n\n他打了个大学浴池的比方：进去需要等、出来需要等，大部分时间都是在等。\n\n为什么巴菲特说只有大象出来的时候才开枪？就是说好机会出来的时候它是一个明显的机会——一个值一块钱的东西，不是卖给你五毛钱，而是卖给你两毛钱的时候你再买。\n\n他补充说，买早了倒也无所谓，「一块钱的东西0.9元去买也没什么错，但你就是着急了」。他给了个化解焦虑的思路：\n\n你怕错过，说过两天它又回到一块钱怎么办？其实你应该想另外一个问题：它不跌到0.87，还有别人会跌到0.87，你为啥可盯着它一个人？\n\n## 九、卡尼曼《思考，快与慢》：要警惕你的「感性系统」\n\n1. 时刻分清：这是理性思考的结果，还是直觉\n\n他推荐了这本书，说主要观点是人的思考有两个系统——系统一和系统二，也可以叫感性系统和理性系统。\n\n你要时刻提防你所获得的所有认知，究竟是来自于你的感性，还是你理性思考的结果。当你决策的时候，你一定要问自己这个问题。\n\n他说很多人分不清这一点，「甚至有人做投资的时候，看一下公司的名字就开始望文生义，就开始投资了」。\n\n2. 实操建议：把涨跌隐掉，只看「照片」\n\n这是他给的一个非常具体的方法：\n\n假如有人只告诉你这个公司一年挣多少钱、现在卖多少钱，而不告诉你昨天多少钱、前天多少钱、最近一年的涨跌——那你这个时候做的投资决策反倒更好。\n\n他解释为什么：一旦你看了它前一阶段的价格变动，就容易被影响——「它明明很便宜了，但你发现它最近还在下跌，你就不敢买；它明明已经很贵了，但最近还在上涨，你就觉得应该可以买」。\n\n它的价格如果已经贵了，不管它上涨还是下跌，你都应该不买——它都已经贵了，它再上涨你应该更不敢买了。这是理智思考的结果。\n\n3. 最要命的一种人：追涨买进去，跌了开始讲基本面\n\n他说做趋势本身没问题，但趋势投资者必须设止损。真正要命的是：\n\n明明做的是趋势，等跌下来的时候开始讲价值了。你明明是它涨上去你才买的——如果你讲基本面的话，那为什么在它底下压根没涨的时候你没买呢？\n\n他举了个具体的例子：四块钱的时候你不买，涨到10块你追进去，涨到15你没卖，跌到12你开始讲基本面了——「那你讲基本面的时候，四块钱你为啥不买呢？」\n\n做这个东西你要对自己诚实。你首先问自己，这是不是一个诚实的模式，而不是为了让自己好过一点自己骗自己。\n\n## 十、学习没有窍门，别看爽文\n\n1. 所有的学习都是枯燥的，是从0到1、1到2\n\n你不要老想着说我像郭靖似的，吃了个什么蟒蛇最后就百毒不侵了——这是不可能的，那都是爽文。所有的学习都是枯燥的，就是从0到1、从1到2、从2到3，就没有从0到100这事儿。\n\n他说学什么都得下笨功夫，别耍小聪明。\n\n2. 爽文的逻辑漏洞\n\n他用了一个很妙的反问来拆穿爽文逻辑：\n\n令狐冲遇到风清扬以后很快就学会了独孤九剑，于是就成为大侠了，谁都愿意看这个。但你从逻辑上想一点：如果令狐冲很快就学会了独孤九剑，那风清扬的独孤九剑是咋学的？\n\n他还顺带吐槽了现在的都市爽剧：\n\n每个挨欺负的人背后都有一个黑社会的亲戚，每个在公司被欺负的小姑娘都是董事长的女儿来实习、别人不知道——你见过哪个董事长的女儿在公司实习是不知道的？按财富分配颜值，按颜值分配道德，长得磕碜的那个演员演的一定是坏蛋。\n\n## 十一、一个他始终好奇的问题\n\n最后他说了一件自己特别好奇的事：\n\n有很多东西它就是周期性的，已经无数次经过周期了。那么为什么它在底部的时候你明明知道还会涨起来，但就是没有人买？在高点的时候你明明知道还会下来，但就是没有人卖？\n\n他自己给出的答案是：\n\n所有周期的东西，在底部的时候会有一堆故事说它已经不是周期了、它这次彻底起不来了；在高的地方也是这个故事——它已经不是周期了，它不会再跌回去了。","toc":["一、把当天的行情当教材来看","二、日元：蟒蛇缠身式的垂死挣扎","三、看中国的数据，不能直接套国外的标准","四、韩国的教训：他们把方向做反了","五、波动代表分歧——这是判断位置的关键指标","六、公募基金经理为什么必须抱团","七、2018年之后进场的人，没见过真正的熊市","八、今年的主题就两个字：防风险","九、卡尼曼《思考，快与慢》：要警惕你的「感性系统」","十、学习没有窍门，别看爽文","十一、一个他始终好奇的问题"],"url":"https://xueqiu.com/2573414707/407226155","chars":5943},"topics":["日元危机","国情特殊","波动即分歧","投资修行"]},{"date":"2026-07-26","bili":{"title":"老木匠 2026年7月26日直播文字稿（囚徒困境、国产替代、现金通缩、稳定币本质、美联储缩表）","text":"## 一、囚徒困境：周期行业供给端的本质\n\n所谓囚徒困境，是博弈论里的例子——当每个人都从自身角度做理性决策，总体结果却最差。故事大家都熟：两人作案被分开审讯，无论对方承不承认，你选\"承认\"都是对自己最有利的；结果两人都承认，各判五年，而本来都不承认可以无罪释放。\n\n我昨天讲周期行业供给端就是囚徒困境。对养猪的来说最好结果是大家都减产，但信息隔绝下每个人的理性选择都是扩产，最后全行业过剩。所有周期性行业供给端都有这特征，本质就是信息隔绝、没法协调。消费端同理：高端白酒经销商之间、买房人之间也都是囚徒困境——最好全体压价，但结果大家都加价抢，价格越抬越高，对买方整体最不利。因为那时是卖方市场，由供给者主导。\n\n打新中签人之间也是囚徒困境：最好大家都不卖，但怕别人先跑，于是争先卖。这是博弈，结果我判断不了——尤其这只新股（长鑫）我根本不知道该值多少，只存在\"卖\"不存在\"买\"。\n\n## 二、国产替代与中国全产业链优势\n\n这只新股是周期股，去年盈利很少、今年大增。能不能成为第二个京东方？不好说。但有一点确定：中国一旦掌握某项技术，复制起来、卷起来极其厉害。当年三星垄断面板，电视贵得离谱；京东方和 TCL 一挤占，面板价格大幅下探，谁卷得过我们？问题在于我们自己人卷自己，京东方市占率越来越高、盈利却没大幅提高——因为卷起来谁也不在乎。\n\n包括高端芯片、光刻机，一旦我们突破，其他厂家几乎没活路。这需要时间，就像中国汽车：我小时候谁能想到今天出口量全球第一？\n\n我们\"能卷\"换个角度也是真优势：中国本身就是全产业链，配套成本最低。你在欧洲造汽车，不可能在德国采到所有原材料；中国造汽车近九成原材料国内采购，政策、物流、配套成本都低，成品便宜有道理，不全是\"卷\"。你看 3D 打印机出口已是全球第一。\n\n### 1. 美国也曾是\"世界工厂\"\n\n有人问美国是不是从一开始就是消费国？当然不是。英国做金融霸主约两百年，后来被美国替代，靠的是供给端太强——二战期间全世界工业产品大半美国提供。美国制造业地位，跟今天中国一模一样。\n\n美国崛起有偶然：把欧亚大陆+北非比作\"世界前院\"（文明诞生地），前院打仗时谁都无法正常供应物资，而美国是另一块大陆、不受战火蹂躏，自然成了世界第一制造强国。一战二战的\"国运\"逻辑就在这。\n\n## 三、江湖险恶：让子弹飞与房地产受益者\n\n昨天让大家看《让子弹飞》。怎么把土豪劣绅的黄金收上来，还让他们谢你英明？先让土匪去抢，你再剿匪，把抢来的当非法收入没收、把土匪枪毙。土匪一想以后没劫匪了，反而感谢你。\n\n房地产大开发时代，个人角度谁最受益？炒房的最受益？你去问问他们裤衩还在不在。说\"喝茅台的人最受益\"——我指茅台酒不是茅台公司。但拿这钱是脏钱，\"喝凉酒花赃钱早晚是事儿\"，也就是\"不是不报时候未到\"。\n\n这些钱没消失，只是被\"攒起来\"，像埋地下的黄金按进度开采。他们不敢存银行、只能现金放家里，等于雪藏了一部分流动性，对这些年没发生大通胀是有贡献的。\n\n## 四、现金退出流通与通缩：基础货币的乘数效应\n\n为什么现金放家里会导致通缩？纸币是\"基础货币\"，有乘数效应。你取一百块放床底、不参与货币创造，市场上减少的 M2 可能是二十倍——取一千，两千块 M2 消失。这是货币创造理论里的\"乘数效应\"。\n\n存在银行里，即使你没花，银行把你这笔钱贷出去，别人在花。只有以纸币形态塞床底，才真正退出流通。现在全世界现金消失最彻底的是我们——每个人花的都相当于\"稳定币\"的影子。\n\n## 五、数字货币与稳定币的本质\n\n纸币和数字货币最大区别：纸币是非记名证券（谁捡到谁花），数字货币是可记名证券，流向清晰、像今天的房子（证权证券）。这引出法律知识：房产证是\"证权证券\"（证明权利，丢了可挂失补办）；货币是\"设权证券\"（权利本身，丢了不能挂失）。古代银票就是不记名的设权证券，谁拿着顶钱花。\n\n数字化降低了记名成本，很多证券从设权向证权转化。可记名货币方便缴税、防洗钱、防犯罪——所以灰产不喜欢。比特币这类虚拟货币能防监管，用于支付的本身就是黑产，逃税洗钱都方便，所以它有生存空间但本无价值。\n\n### 1. 稳定币是美国政府绕过美联储的二次货币发行\n\n美国搞的稳定币，实质是把比特币灰色地带的钱\"解放\"出来买美债——基础资产去买美国国债，黑产交易用稳定币完成。这本质上是特朗普他们因为美债没办法了设计的：稳定币相当于绕过美联储增发的一种货币，用美债做抵押，是货币的第二次发行。\n\n类比：你微信/支付宝里的钱，如果对腾讯/阿里是债权（不是真钱，是对商业公司的债权），且这些钱没 100% 存到网联公司、没回收给央行，它本身就是影子货币、能货币创造。美国稳定币干的就是这事——相当于微信拿了你的钱没交网联、直接去买中国国债，那你花的微信钱就是\"美国稳定币\"。银行存款同理，是对商业银行的债权，银行破产你的钱可以没（现有存款保险保 50 万以内）。\n\n## 六、从票号到中央银行：货币创造与挤兑\n\n最早货币是白银。山西票号是现代银行雏形——异地运白银危险且成本高，于是票号开银票（纸币雏形），存进去的白银是保证金。\n\n票号老板发现：不可能所有人同时来取，仓库里总堆着白银，于是把这部分借出去收息，无本买卖。借的人也不取现银，只要再开一张银票。于是开出去的银票多于实存白银——这就是货币创造。理论上一百两白银能开出无限银票，过度创造会带来通胀和挤兑。\n\n挤兑的本质不是资不抵债，而是债权债务的期限错配：储户取钱银行必须立即付，但贷出去的钱不能马上收回。所有商业银行按现在的货币创造，发出去的负债都大于实际准备金，遇到挤兑谁都挺不住。\n\n### 1. 中央银行的诞生与三大职能\n\n由商业银行发钞经常引发危机，于是政府把货币发行权收归中央，成立中央银行。萨缪尔森说世界三大伟大发明：火、轮子、中央银行。央行三大职能：\n\n政府的银行：经理国库（钱存央行，进央行资产负债表，与货币松紧相关）；\n\n银行的银行：规定存款准备金率，防挤兑；\n\n发行的银行：独占货币发行权（法币，靠国家信用强制，拒收人民币违法）。\n\n香港没央行，港币由汇丰、渣打、中银三家商业银行发，是特例。\n\n### 2. 美联储资产负债表与缩表扩表\n\n美联储是半官方私营机构（成员银行组成），资产负债表里所有者权益可忽略，近似\"资产≈负债\"。\n\n负债端三大项：①商业银行存款准备金；②财政部 TGA 账户；③流通中的美元（相当于美联储打的欠条，跟山西票号银票同理）。\n\n资产端三大项：①美国国债（最大）；② MBS（抵押资产支持证券，相当于公司债，需资产抵押，纯信用债央行不能买）；③黄金外币等（很少）。\n\n扩表（QE）：美联储直接印钱买美债 → 资产扩大、负债同扩 → 等效于印钱给政府用，货币宽松。缩表（QT）：卖出美债/MBS → 货币回笼 → 流通中货币减少 → 美元由宽松变紧缩 → 治理通胀。\n\n抖音经济学胡扯\"缩表减少存款准备金、钱回流商业银行反而更宽松\"——错。你不可能只减负债不减资产，减掉的准备金被拿来从央行买美债，钱被回笼，市场上钱只会少。缩表预期导致美元供给紧张、美元指数上行。\n\n货币就是纸币价值与实物价值的比例。缩表导致美元紧张，发展中国家（尤其没管好美元的）会出现美元急剧短缺、本币大幅贬值、输入性通胀。日本就是例子：油价涨+日元贬值双重叠加，通胀难控，干预汇率不行、加息也不行——日元长期被高估（因被商品化），这是下次要讲的主题。\n\n所以沃什主张\"缩表+降息\"组合，美元强势 → 不利黄金等贵金属 → 压制有色金属，这也是我现在对有色看法狐疑的原因。\n\n---\n\n全程为评书演绎，不指导投资、不提个股。","toc":["一、囚徒困境：周期行业供给端的本质","二、国产替代与中国全产业链优势","三、江湖险恶：让子弹飞与房地产受益者","四、现金退出流通与通缩：基础货币的乘数效应","五、数字货币与稳定币的本质","六、从票号到中央银行：货币创造与挤兑"],"url":"https://www.bilibili.com/opus/1241452175138226199","bv":"","minutes":0,"chars":3153},"ai":{"title":"老木匠·2026年7月26日：货币是怎么运行的","text":"## 一、囚徒困境：为什么周期行业永远会产能过剩\n\n1. 先把这个概念讲清楚\n\n他把上一场讲周期股时用到的「囚徒困境」补了一课。故事是：两个共犯被分开审讯——如果一个人承认另一个没承认，承认的无罪释放、没承认的判十年；两人都不承认，因证据不足都释放；两人都承认，各判五年。\n\n在信息隔绝的情况下，每个囚徒都会算出：无论对方怎么选，对我个人来说承认都更好。结果两个人都会承认。而对集体来说，最优解本来是两个人都不承认。\n\n当每一个人都从自己的角度出发做出理性决策的时候，大家作为一个总体所做出的决策其实是最差的——这就叫囚徒困境。\n\n2. 周期行业的供给端，本质就是囚徒困境\n\n他说对养猪的人来说，最好的结果是大家都减产，但在信息隔绝的情况下这做不到——因为不管别人扩不扩产，你扩产都是理性选择，最终所有人都扩产，对整体反而不利。\n\n所有周期性行业的供给端都有这么一个特征，其本质就在于供给端的信息是隔绝的。\n\n3. 买方也有囚徒困境\n\n他补充说消费端天然也有囚徒困境，只是不那么明显（因为消费者太多，是随机现象）。但在卖方市场里就很明显：房地产景气高峰时，对买房人来说最好的是所有人都压价，但最终大家都选择加价买，价格越加越高。高端白酒的经销商之间也是一样。他还即时点了个例子：所有打新中签的人最好的办法是都不卖，但大家都怕自己不卖别人先卖。\n\n## 二、美国是从一开始就是「消费国」吗\n\n1. 美国当年靠的正是供给端\n\n他反问大家这个问题，然后自己作答：\n\n美国最开始之所以能替代英国成为世界的金融霸主，就是因为他首先在供给上替代了英国。\n\n他说英镑作为全世界硬通货持续了大概200年，被美国替代是因为美国的供给端太强——「大家今天一提美国都是消费国，你不去想第二次世界大战期间，全世界的工业产品几乎大部分都是美国提供的」。\n\n2. 「世界的前院与后院」：美国国运的偶然性\n\n他给了一个地理视角的解释：可以把欧亚大陆加北非看成世界的「前院」——整个世界文明都在这里产生。从一战到二战，几十年间前院一直在打仗，谁都无法正常供应物资，但衣食住行、武器弹药都得有人生产。\n\n那这个时候谁生产最好？当然是美国。美国离得远，是另外一块大陆，不受战火蹂躏。所以从那个时候开始，他就成为世界第一制造强国——美国当时在世界制造业的地位，就跟中国今天在世界制造业的地位是一样的。\n\n3. 美国的工业强国地位被替代，也就是近四十年的事\n\n他梳理了这个过程：先是日本崛起挤占了汽车行业，然后东南亚兴起挤占低端消费品，等我们兴起来就不分品类了——「刚开始是低端消费品，后来是家用电器，现在连机械设备我们也开始挤占了，我估计不久的将来高科技产品我们也会开始挤占」。\n\n4. 为什么我们的东西便宜：全产业链配套\n\n他强调这不只是「能卷」的问题：\n\n德国产的汽车不可能在德国采购到所有的原材料，而中国生产汽车几乎可以在国内采购90%的原材料。这就无形当中减少了政策成本、物流成本、配套成本。\n\n他还举了面板行业的例子：当年三星垄断面板时液晶电视非常贵，京东方和TCL做起来之后，整个面板价格大幅下降。但他也提醒另一面——京东方市场占有率越来越高，盈利却没有大幅提高，「那是因为我们卷起来谁也不在乎，自己人都不在乎」。\n\n## 三、货币的本质：证权证券 vs 设权证券\n\n1. 两个概念的区别（这是法律知识，但对理解货币很关键）\n\n他解释：\n\n房产证叫做证权证券——它是证明一种权利的证券，并不是权利本身，所以房产证丢了不要紧，可以挂失补办。而货币是最典型的设权证券——货币本身就是权利本身，证券丢失，权利就丢失了。\n\n他说纸币丢了不可能去挂失，而随着数字化的发展，很多证券正从设权证券向证权证券转化，因为数字化降低了记名成本。\n\n2. 数字货币和纸币最大的区别：记名\n\n他说数字货币可以实现记名，而传统纸币是不记名的——「掉在大街上谁捡到就是谁的」。记名之后流向就清晰了，缴税成本、防止洗钱和犯罪的成本都会大幅降低。\n\n但问题是有的人拿着货币就没想干好事，所以他们不喜欢数字货币，因为可追踪。\n\n他由此解释比特币的存在空间：比特币本身不存在什么价值，但它可以规避监管，「拿着比特币用于支付的都不是正经生意」——逃税更方便、转移资产更方便、洗钱更方便，所以它有独特的生存空间。\n\n3. 退出流通的现金，会通过乘数效应大幅收缩M2\n\n这是他讲的一个很重要的机制。他说那些以纸币形式藏在家里的钱，是已经退出流通、不参与货币创造的：\n\n你每取出100块钱放在床底下不参与货币创造，那么市场上所减少的M2可能就是20倍——会有2000块钱的M2消失。\n\n他解释：如果钱存在银行里，即使你没花，银行也会把这笔钱贷出去，「你不花，其实别人在花你这笔钱」；但取成现金就不同了，这个银行的存款减少了，并没有导致另一个银行的存款增加，整个商业银行体系的基础存款是净降低的。\n\n他还借此提了一个视角：这些被雪藏的流动性，客观上对这些年没有发生大型通胀是有「贡献」的。\n\n## 四、稳定币到底是什么\n\n1. 本质：美国政府绕过美联储增发的一种货币\n\n他给了一个很清晰的定义：\n\n稳定币实际上是美国政府绕过美联储增发的一种货币，而这种货币本质上是用美国的国债来做抵押的——它相当于货币的第二次发行。\n\n2. 用微信支付宝来类比\n\n他打了个我们都能懂的比方：我们在微信、支付宝里花的钱，本质上是对腾讯、阿里的一笔债权，不是真正的货币。这些平台收上来的钱必须百分之百上交网联公司、再回收到中国人民银行——如果不是百分之百上交，那就构成了货币的二次创造。\n\n假如微信没有把钱交给网联，而是直接拿这笔钱去买了中国的国债，那么我们现在花的微信上的钱，就是美国的稳定币。\n\n3. 稳定币的真实目的：把灰色地带的钱引出来买美债\n\n他说稳定币吸引的是原来在比特币这个空间里处于灰色地带的资金，让它们走上台面——这些资金换成稳定币，而稳定币的基础资产最终是去买美国国债。\n\n本质上这是特朗普他们这些人设计的，因为美债实在是没办法了。\n\n## 五、从票号到中央银行：货币创造是怎么回事\n\n1. 山西票号：纸币的雏形\n\n他从头讲起：我们历史上是银本位国家，但实物白银运输不便且危险（要雇镖局，成本很高）。于是出现了票号——你在山西把白银交给票号，拿一张银票走，到浙江的分号再取出白银。\n\n这个银票就是最初的纸币雏形，而你存进去的白银就是最初的保证金。\n\n2. 货币创造：一百两白银怎么变成三百两银票\n\n他讲了这个关键机制：票号老板发现，存银子的人不会同时来提取，所以仓库里总有一部分白银长期堆着没用。那就可以把这些白银借出去收利息——「这是一个无本的买卖」。\n\n而借钱的人也觉得带实物白银不方便，说「你不用把白银给我，再给我开100两的银票就行」。\n\n这时候市场上就有了200两银票，但库里只有100两银子。这个过程就叫做货币创造。\n\n他说再来第三个人借，就变成300两银票；理论上一百两白银可以开出无限的银票——最终带来两个后果：通货膨胀，以及挤兑风险。\n\n3. 挤兑不是资不抵债，是「债权和债务的错配」\n\n这是他特别强调的一点：\n\n银行发生挤兑的时候，并不是资不抵债，而是债权和债务的错配。你到银行取钱，银行必须立即给你；但银行把钱贷出去，却不可能马上要回来。\n\n他说这就是银行信用和商业信用的区别——银行信用随时可以无条件提取，而贷出去的款变成了商业信用，要按合同还、可能没到期、甚至可能破产还不上。所以「遇到挤兑的时候，所有的商业银行都挺不住」，这跟这家银行经营得好不好没有关系。\n\n4. 中央银行的诞生，以及它的三大职能\n\n他说官方后来发现，让商业银行自己发行纸币经常带来金融危机，于是把铸币权收归中央，专门管理货币发行的机构应运而生——这就是中央银行。他还引了萨缪尔森教科书里的说法：世界上三大最伟大的发明是火、轮子和中央银行。\n\n中央银行的三大职能：\n\n第一，发行的银行——独占货币发行权，各商业银行不能再自己发货币。他说所谓「发行」就是印、就是定义，并打了个赌场的比方：「筹码在兑换处的柜台里成摞放着的时候就是纸，一出来到外边就顶钱花了。」\n\n第二，银行的银行——规定利率和存款准备金率。存款准备金的本质就是为了应付挤兑：「你吸收到一块钱存款，只可以贷出去九毛，有一毛要存在我这儿。」\n\n第三，政府的银行——经理国库，国家的财政收入存在中央银行而不是商业银行。\n\n他还提到香港没有中央银行，港币是由汇丰、渣打、中银三家商业银行分别发行的，「所以你会看到三种港币」。\n\n5. 法币：为什么今天的纸币不能兑换黄金\n\n他解释兑换这个概念是金属本位的遗留——原来中央银行承诺你未来可以来兑换多少黄金白银，现在没有金属本位了，所以变成法币，靠国家信用和法律强制性来定义。\n\n人民币具有法偿性，就是说我只要给你人民币就是支付完了。所以有人说我只要微信支付、不要人民币，那是不允许的、是违法的。\n\n## 六、美联储的资产负债表：缩表到底会怎样\n\n1. 负债端三大项，正好对应三大职能\n\n他说美联储的所有者权益可以忽略不计（可能只有100亿美元，而资产负债表是几万亿量级），所以可以简化为「资产约等于负债」。负债端有三项：\n\n一是商业银行的存款准备金（对应「银行的银行」）；二是TGA账户，即美国财政部在美联储开的财政经常账户（对应「政府的银行」）；三是流通中的纸币，也就是印出去的美元（对应「发行的银行」）。\n\n你可以把美元理解为美联储打的欠条——这就跟山西票号发的银票是一个道理。\n\n2. 资产端三大项\n\n第一项也是最大的一项：美国国债。第二项：抵押资产支持证券（MBS），可以简单理解为公司债——他补充说，除国债外的地方债、公司债都需要有资产抵押才能被中央银行购买，「纯信用债中央银行是不能买的」。第三项很少：黄金、外币和一些短期货币工具。\n\n3. 所以QE和缩表分别是什么\n\n他把逻辑串起来：\n\n美联储直接拿钱买美债，这个过程是不是就等效于美联储直接印钱给美国政府用？只是双方各记一个账，美国政府发行的债券不发行给别人，只发行给美联储——这就叫定向宽松，这就是QE。\n\n因为每买入一笔债券，资产就扩大，负债必然同步扩大，所以叫「扩表」。反过来，卖出国债或MBS，就有一部分货币回笼到美联储，这就是「缩表」，一定会导致流通中的货币减少，所以可以治理通胀。\n\n4. 他专门驳斥了一种流行说法\n\n他说前一阶段有种「抖音经济学」的说法：缩表是为了缩减负债端的银行存款准备金，这些准备金回到商业银行体系后会进入货币创造流程，所以缩表反而会更宽松。他直言这是「胡扯没边了」：\n\n你不可能只缩减负债端而不缩减资产端，那是无中生有。存款准备金减少了，这部分钱不会去放贷，而是流到了美债市场——而且买的还是中央银行卖出的美债，所以这些钱实际上被中央银行回笼了。\n\n他还补充了一个反驳角度：如果说单个商业银行拿回准备金去放贷不去买美债，那也会有别人买——买的人得从银行取出存款，被取出的这笔银行存款就是净减少。\n\n5. 缩表预期如何传导到全球\n\n他给出了完整的链条：缩表预期 → 美元供给紧张 → 美元指数上行 → 一些美元债没控制好的国家出现美元急剧短缺 → 美元对其本币大幅升值 → 因为大宗商品按美元计价，这些国家会遭遇严重的输入性通胀。\n\n他以日本为例：\n\n日本的油价上涨并不是国际油价上涨那个幅度，而是国际油价上涨再加上日元贬值这两个幅度的叠加。而石油又是其他所有商品价格的锚——原油涨了，原材料、人工成本、生活成本、制造业成本都会跟着涨。\n\n他说所以日本的汇率越低，通胀就越严重、购买力就越低，这是一个循环，「日本干预汇率也不行，加息也不行」。他把这个定性为「日本长期经济不协调的一次性清算」，根源是日元长期被高估，而高估的原因是日元被商品化了。\n\n## 七、知识为什么重要：你能吸收多少信息，取决于你懂多少\n\n1. 同样一张CT片，你和医生看到的完全不同\n\n他用这个例子说明：\n\n你每天也看报纸看新闻，我也看报纸看新闻。我掌握的基础知识多，我吸收到的信息就比你多——你别看咱俩念的字是一样多的。\n\n他还举了核物理云室照片的例子：一张粒子轨迹照片，普通人看是乱七八糟，专家一看就知道是什么粒子碰撞形成的。\n\n你看到的信息取决于你主观掌握的理论。掌握的理论不同，最后得出来的结论也不同。\n\n2. 芒格的「格栅理论」\n\n他说学一个书本知识很容易，不容易的是把所有书本知识融会贯通——这就是芒格强调的格栅理论，你的知识要形成一个网格化的结构。\n\n你理解一个东西，需要用到所有不同的知识，否则的话你就会非常狭隘。我要看市场的话，从金融、政治、财政一直到心理，我都会考虑。","toc":["一、囚徒困境：为什么周期行业永远会产能过剩","二、美国是从一开始就是「消费国」吗","三、货币的本质：证权证券 vs 设权证券","四、稳定币到底是什么","五、从票号到中央银行：货币创造是怎么回事","六、美联储的资产负债表：缩表到底会怎样","七、知识为什么重要：你能吸收多少信息，取决于你懂多少"],"url":"https://xueqiu.com/2573414707/407226064","chars":5193},"topics":["囚徒困境","国产替代","现金通缩","稳定币本质","美联储缩表"]},{"date":"2026-07-25","bili":{"title":"老木匠 2026年7月25日直播文字稿（电力成本、周期股本质、有色美元周期、美联储博弈、长江文明）","text":"## 一、投资是无限比赛，别下桌\n\n现在这种市场状况你亏点是正常的，我也亏，没事儿。最主要的是保持自己在场内参加比赛，别下桌。投资是个无限比赛，没有哪一场是决胜负的。\n\n## 二、电力行业的成本结构：火电、核电、水电赚的都是利差\n\n有人问电力行业效益不错、市盈率不高，为什么引不起大家兴趣？\n\n火电利润被挤压，不是因为发电量下降——发电量还增加了——而是煤价涨了。煤为什么涨？油价涨了。烧油和烧煤可以替代，按大卡算能量当量，原油过高人们就改烧煤，天然气、煤炭跟着涨。煤涨、电价受公共事业管制难涨，火电利润空间就被挤了。\n\n那利好什么？所有非火电——核电、风电、光伏边际上都会变好，因为火电成本有绝对优势，它一贵，其他的相对就便宜了。电最终会涨，但取决于国家宏观调控，没法猜。\n\n核电的原料（铀矿）也在涨，为什么核电受的影响不像火电煤涨价那么大？因为成本结构不一样：核电原料占比很低（百分之二十几），主要成本是设备折旧和财务成本（建设靠银行贷款）。越是资产没地方去，银行越觉得核电是优质贷款。核电本质上赚的是利差，跟银行的生意差不多，所以我说核电类似于准金融行业。水电更是赚利差，销售端极稳定，利润好测算。电网最喜欢稳定的电，核电年发电小时数固定，最好调度。\n\n## 三、周期股的本质：供需错配 + 囚徒困境\n\n我认为的周期股，不是所有有周期现象的都算（券商有周期现象，但受宏观情绪影响太大，难判断，我不算；原油煤炭受国际形势和调控双重影响，也难判断）。我说的周期股是一类特殊的——既有周期现象，而且周期非常容易把握：你能很容易判断它已经到低谷，下一步就往上走。\n\n根本原因就是供需错配：供大于求就是低谷，供不应求就是高点。分两种：\n\n供给端造成的（大周期）：需求稳定，供给波动。最典型是养猪。周期高点大家拼命扩产能，产能过剩后价格暴跌，全行业亏损，直到大量产能被动退出（注意：大部分是被动退出，很少主动退出，因为生产者的囚徒困境——谁都不想第一个退出，退了就是救别人，最后谁挺不住谁退出）。挺到最后的就是胜者通杀，进入上升期把亏的钱全赚回来。生猪你看能繁母猪数量就知道处在哪个阶段。2020年是超级波峰，所以现在是个超级波谷，有人说猪周期消失了，不对。\n\n需求端造成的（小周期）：供给稳定，需求波动。比如光模块、存储芯片这一轮高景气，供给一直在增加，是AI突然导致需求增加。这种上行周期怎么结束？不是需求下降，而是需求先增→刺激产能增加（建设要时间）→供给跟上后进入下行。因为每个企业都按自身理性判断扩产，没法协调，这就是囚徒困境；真要坐一起定产量那就是卡特尔（垄断），不允许。欧佩克是国际上的卡特尔，各怀鬼胎。\n\n以铜为例讲透这轮有色：2003-2005铜价顶点，涨了五六倍，但当时矿业股没涨——人们还活在此前熊市里，给了错配机会。2008年后中国房地产基建大开发带来巨量需求，但同期铜价反而跌，因为供给响应跟上了（扩产有滞后）。这轮铜的下降周期跟中国房地产不景气有关，房地产+基建占全球铜用量大头。没想到AI突然出现，数据中心电力需求大增，把房地产基建的减量抵消了，所以需求端没大变、供给端却因长期低价导致勘探投资不足、品位下降、老矿老化。\n\n## 四、这轮有色的真相：不是供不应求，是美元在贬值\n\n很多人分析有色只研究供需一面，是自我降维。不同的金属有不同的供需，为什么一夜之间全供不应求、全涨？因为这次上涨更多是受贵金属（黄金白银）带动，而贵金属纯粹是货币现象，不用看供需。贵金属涨，铜铝锡铅锌全跟着涨，说明是货币现象主导。\n\n换句话说：这次有色金属涨价，不是有色金属本身供不应求了，是美元的币值在贬值。黄金从前年涨到今年，你可以说黄金在涨，也可以说美元在贬值。其他货币都用美元汇率衡量，美元本身用贵金属衡量。\n\n## 五、美联储博弈：沃什上来，我的确定性没了\n\n我去年这个时候非常看好有色和贵金属，今年为什么开始狐疑、不再那么信心满满？因为沃什（Warsh）当美联储主席，代表美国内部博弈出现变化。\n\n美联储的看跌期权：股市大跌，美联储一定宽松救市，相当于给下跌买保险，从伯南克搞QE开始。沃什一直反对这个，他认为美联储只该维持美元地位、解决通胀，不该承担过多社会责任——所以他当年辞职了。特朗普想搞弱化美元（解决美债：美元无限贬值，美债自然减少，等于在钞票后边加个零），但提名无限宽松的哈塞特在参议院通不过，因为老钱、华尔街流动性持有者会反抗（通胀损害资产所有者）。所以特朗普妥协提名了沃什。\n\n沃什成不了沃尔克——当年天时地利人和占全了，今天没有。但他\"想做成\"的过程就会要你的命。你不能说\"我相信沃什一定做不成所以拿着有色\"，他在努力的过程中就可能先要了你的命。所以我现在走一步看一步，不像原来那么信誓旦旦。\n\n芒格那句话记住：你所看到的都是假象，真相是看不到的，需要用思考的。 就像一对恩爱夫妻儿女成群，你只能看到恩爱，真相得自己想。\n\n## 六、投资博弈：你看到的时候，人家已经开始卖了\n\n大资金把所有因素都考虑在内了。你今天才发现光模块不够用、存储芯片不够用，人家一两年前就认识了。你看到的时候东西已经高高在上，人家开始走了。为什么你一买就跌、一卖就涨？你看的没有人家远。\n\n所以我关注标的相关论坛热不热闹：一旦热闹，大家都看好，这就是危险标志，是卖出好机会；论坛里放个屁过两天味儿还在（没人），那才是能安心买的时候。捅马蜂窝，飞出马蜂就得小心；什么都没有，就能安心待着。\n\n## 七、房地产低迷的红利，和消费潜力\n\n房地产周期十年打底，从2021年下降算，到底怎么也得2030、2031年。但现在有个有意思的现象叫\"房地产低迷周期的红利\"：\n\n农村人口进城，房子便宜→居住成本下降→同样工资消费能力提高。年轻人结婚变容易了（不用掏空六个钱包），净存款增加很快（原来是净负债，给未来打工，哪有钱消费）。现在随便一份工作，二三线城市就能买房，十年前想都不敢想。\n\n旅游景点都挤爆了，年轻人坐飞机跨城看演唱会——这是消费潜力，不是消费低迷。旅游股跌是因为资金偏好，不是行业景气度差。你所看到的都是假象。\n\n## 八、长江与中华文明为什么一脉相承（闲聊·硬知识）\n\n跑题讲到地域，老木匠给了个自己的思考：中华文明能延续不倒，主要因为长江。\n\n每次打仗主战场都在长江以北。北方决出雄主后，跨长江打南方很快结束。战争期间南方稳定、在生产，北方士大夫阶层往南逃（客家人怎么来的），文化不断带。一过长江战争结束，南方文化没被破坏。天下太平后，中华文明从南往北反传，接续上被打断的传统。\n\n欧洲相反：古希腊古罗马被北方日耳曼蛮族打败，文化彻底中断，中世纪黑暗八百年，直到十字军东征打到东罗马帝国、耶路撒冷，才发现\"原来我们老祖宗文化这么灿烂\"，这才有文艺复兴（复兴的就是古希腊古罗马）。其他文明古国（古印度、古巴比伦）文化都断了——断的是文化不是人种。\n\n所以长江是天然阻隔，隔绝战乱蔓延全国，保住南方稳定，最终保住中华文明一脉相承。这是地理原因，不是历史书上的说法，是他自己琢磨的。\n\n太平时期南方一定更先进（武力没用了，得靠干活，南方人勤快）；但政治中心必须放北方（治理靠北方，经济中心在南方）。\"盛世时难舍\"——经济发达时男性特征（胡子肌肉）被认为多余，像雄狮只负责抢地盘不捕猎；天下大乱时长胡子有肌肉的才最可靠。北方和南方，缺一不可。\n\n## 九、收尾\n\n凑够三个小时就下播。所有唠嗑都是为了乐呵，当评书听，别拿学术标准来掰扯细节。\"老人嘛就唠叨，重复也很正常。\"谢谢大家，改天再聊。","toc":["一、投资是无限比赛，别下桌","二、电力行业的成本结构：火电、核电、水电赚的都是利差","三、周期股的本质：供需错配 + 囚徒困境","四、这轮有色的真相：不是供不应求，是美元在贬值","五、美联储博弈：沃什上来，我的确定性没了","六、投资博弈：你看到的时候，人家已经开始卖了","七、房地产低迷的红利，和消费潜力","八、长江与中华文明为什么一脉相承（闲聊·硬知识）","九、收尾"],"url":"https://www.bilibili.com/opus/1241452067802841104","bv":"","minutes":0,"chars":3099},"ai":{"title":"老木匠·2026年7月25日：周期股与有色金属的逻辑","text":"## 一、火电、核电、水电：先搞懂它们各自靠什么赚钱\n\n1. 火电利润被挤压，是因为煤价涨了\n\n他先抛了个问题：今年火电的发电量比去年还高、电价也没什么变化，为什么利润反而下降了？答案是煤价涨了——电价属于公共事业，变化非常困难，成本一涨，利润空间就被挤压。\n\n2. 煤价为什么涨：因为石油涨了，它们是「竞品」\n\n这一步是他讲得最有意思的：煤价上涨不只是「不让挖煤」这个原因，更根本的是石油涨价。因为烧油和烧煤是可以相互替代的，它们之间有化学能量当量的等效关系——油价一涨，天然气会涨，煤炭也会涨。原来烧油的（比如化工原料、取暖、烧炉子）会改成烧煤。\n\n这就跟大米和白面的价格不会出现过大差异是一个道理。面不仅仅和面竞争，面还要和米竞争——面太贵了，人们就会从吃面改成吃米。\n\n3. 推论：火电成本上升，边际上利好所有非火电\n\n他让大家顺着想一层：火电的利润空间被挤压，会利好什么？答案是所有非火电——核电、风电、光伏，相对来说边际上都会变好，因为火电原本在发电成本上是有绝对优势的。\n\n4. 核电的成本结构完全不同：铀占比很低，大头是折旧和财务成本\n\n他问了个进阶问题：铀矿其实也在涨价（因为美国搞了很多核电来支撑数据中心），为什么核电受的影响不像火电那么大？答案是成本结构不一样——核电的燃料成本占比很低（他凭印象说20%多），剩下的主要是设备折旧和财务成本，因为前期建设需要大量投入。\n\n5. 核心判断：核电本质上赚的是利差，类似准金融行业\n\n这是他这段最核心的观点：\n\n核电相当于一个准金融行业。它从银行获得长期贷款，建成核电机组发电，然后再还给银行——它赚的是利差。\n\n他解释：核电建成后能源源不断输出电力，一年能卖多少钱、有多少利润是能算出来的，还完银行本息，剩下的就是长期利润。所以核电的主要成本受利息影响更大。而且在资产没地方去的低利率环境下，核电对银行来说是越来越优质的贷款。\n\n他说水电更是如此——销售端极其稳定，上网电价国家有审核。区别在于水电还受枯水丰水、厄尔尼诺拉尼娜影响，发电量有波动；而核电几乎没有波动，年发电小时数是固定的。他还提了一句：对电网来说，稳定的电才是最好的电。\n\n6. 煤炭和石油为什么难判断\n\n他说煤炭和石油都很难把握，因为它们首先受国际形势影响，其次还受国内宏观调控影响，「判断未来价格走势几乎是不可能的」。但有时候会给你错配的机会——比如煤炭价格已经涨很高了，但相关标的却没涨，大家都还在害怕中，这时候就是机会。不过千万不要据此去预判它还会按现在的斜率一直涨。\n\n## 二、什么才算他定义的「周期股」\n\n1. 有周期现象 ≠ 是周期股\n\n他先做了个严格的区分：不是所有有高潮低谷的行业都算周期股。煤炭、原油有周期现象，但受国际形势和宏观调控影响太大，判断不了；券商也有明显的周期现象，但受货币政策、财政政策、经济景气度、市场情绪等太多因素影响，同样很难判断什么时候反转。\n\n我所说的周期股是一类很特殊的：它既有周期现象，而且它的周期是非常容易把握的——你可以非常容易地判断出现在已经到低谷了，下一步就要往上走了。\n\n2. 所有周期股的根本成因：供需错配\n\n他说这类周期股的形成原因只有一个——供需错配。供大于求就是周期低谷，供不应求就是周期高点。而错配可以来自供给端，也可以来自需求端。\n\n3. 供给端造成的周期：产能只会被动退出，不会主动退出\n\n他以养猪为例：需求端非常稳定，波动主要来自供给端。周期高点时大家拼命扩产，产能过剩后价格下跌，从特别赚钱到全行业亏损，亏到受不了才开始有产能被动退出。\n\n大部分的产能都是被动退出的，很少有产能会主动退出。因为大家谁都不想第一个退出——你退出就把别人救了，所以大家都在扛，看最后谁挺不住谁退出。\n\n他说这就是生产者的囚徒困境。所以你会看到行业低谷时出现大量全行业亏损、大量破产倒闭和重组——「挺到最后的胜者通杀，然后就开始进入下一轮上升期」。\n\n4. 需求端造成的周期：结束的方式不是需求下降，而是产能跟上\n\n他用光模块、存储芯片举例：这几年供给其实是在增加的，但因为AI导致需求突然增加，所以照样进入高景气周期。那这种周期会怎么结束？\n\n不是由于需求重新下降才结束的，而是由于上行周期一定会刺激产能增加。需求在先，供给响应在后——因为建设产能是需要时间的。\n\n他说等所有人的产能都出来了，就又变成产能过剩。而且每个企业都是根据自身理性判断扩产的：「我判断明年缺口是20%，那我就扩产20%」——但生产者之间没法协调，每个人都想把增长空间全部填满，结果必然过剩。\n\n5. 为什么不能坐下来开个会协调？——那叫卡特尔\n\n他说这正是囚徒困境的关键：厂商之间不能坐下来商量「明年缺口多大、大家按这个扩产、别让价格下来」，因为那就是垄断行为、就是卡特尔，是不允许的。\n\n你别看他们打暗号，那暗号都是给别人打的——你让别人别增产，我自己该增产还是增产。其实所有人都是这么想的。\n\n他还提到欧佩克是最典型的卡特尔，但即便是欧佩克也各怀鬼胎——俄罗斯、美国不是成员，阿联酋还退出了。\n\n## 三、这一轮有色金属：不只是供需，更是货币现象\n\n1. 关键提问：为什么所有金属会在同一时间供不应求？\n\n他抛出一个很有杀伤力的问题：不同的金属有不同的供需关系，那为什么所有的金属会突然在一夜之间都供不应求、价格都开始上涨？\n\n难道所有的有色金属都有一个统一的供需关系吗？显然不是。\n\n他给出的答案是：这次上涨更多是受贵金属价格上涨影响，而贵金属上涨是宏观货币政策导致的。\n\n换句话说，这次有色金属涨价，不是有色金属本身供不应求了，而是美元的币值在贬值。\n\n他说贵金属的价格分析根本不用考虑供需关系，「它纯粹就是个货币现象」。因为其他国家的币值都用美元汇率衡量，而美元本身是用贵金属来衡量的——「你可以说是黄金在上涨，也可以说是美元在贬值」。他还提到自己2020或2021年就说过一个玩笑：「索罗斯狙击英镑，我去狙击一下美元」，而狙击美元的方式就是买入它的对立面——贵金属。\n\n2. 上一轮铜的超级周期，是我们的房地产和基建撑起来的\n\n他梳理了完整的历史：铜价顶点大概在2004-2005年，而矿业股的股价顶点大概在2007-2008年——中间那段就是「股价错位机会」，「05年随便买入一个矿业股，到07、08年就挣得盆满钵满，涨十倍的矿业股到处都是」。\n\n上一轮的需求驱动是中国的基建和房地产大开发：建房子要拉电线，城市扩张要配电网，用电量增加还要建发电厂、特高压骨干网，对铜铝的需求呈巨大幅度增长。\n\n3. 但2008年之后，需求一直在增加，铜价却跌了\n\n他指出一个很多人忽略的事实：从2008年到2020年，我们的用铜量、用铝量每年都在大幅增加，但同期铜价、铝价却出现了下跌。为什么？\n\n这就是我刚才讲的：由需求所导致的上行周期，会在供给跟上之后结束。\n\n所以他批评那些只讲「人工智能会用多少铜」的分析是「自我降维」——只研究了需求那一面，没研究供给那一面。\n\n4. 这一轮的供给端：不是减少了，是没跟上\n\n他解释当前的供给端状况：2008年后铜铝长期低位，导致大型矿业公司勘探投资意愿降低，这些年很少有新矿被发现；老矿还面临品位下降、开采深度增加、成本上升的问题，有些矿就不具备经济可行性了。\n\n但他强调这是会变的：\n\n随着铜价上涨，原来不可行的就变成可行了。原来品位0.3才能盈亏平衡，现在可能0.2就可以了；原来不能采的现在可以采了。而且这个过程一定伴随着勘探投资增加，未来一定会有新发现。\n\n他说你已经能看到那两家著名的铜矿在国外扩产，国际上其他大铜矿也都在扩产——「所以你未来会看到铜的供给会增加」。\n\n5. 「这个资源要枯竭了」的故事，每一轮都讲过\n\n他说这类故事在历史上无数次重复过：\n\n我刚大学毕业的时候，大家都在讲石油40年之内就会枯竭。现在已经快到40年了。每一次能源资源行业到高景气的时候，都会讲这个故事。\n\n他还给了一条通用规律：\n\n所有的周期股在景气高点的时候，人们都不认为它是周期股，都会给它起个名字——或者叫成长股，或者叫周期性成长股，或者叫什么革命的、未来不可替代的投资标的。永远是这样。要不然的话，怎么可能有人以那么高的价格去买呢？\n\n## 四、为什么他现在对有色转为「狐疑」\n\n1. 变量在美国：沃什代表了一种博弈结果\n\n他说自己现在已经不看空有色了（短期博弈角度），但未来的确定性不足以吸引他投资，原因就是美联储主席换成了沃什这件事。他说沃什一直坚持「美联储不应该承担过多的社会责任」，美联储的作用就是维持美元币值、解决通胀。\n\n2. 什么是「美联储的看跌期权」\n\n他专门解释了这个概念：\n\n当美国股市出现大幅下跌的时候，美联储一定会采取宽松的货币政策来增加货币供给，从而让美国资本市场继续上行——这就叫美联储的看跌期权，相当于美联储给美国股市进行背书、给下跌买了个保险。\n\n他说这是从伯南克搞QE开始的，而沃什当时就是美联储理事，正因为反对搞QE、反对这个看跌期权而辞职。所以他的取向非常明确。\n\n3. 为什么最终提名的不是哈塞特而是沃什\n\n他反问：哈塞特主张无限宽松，这个取向川普知道、参议员也都知道，那为什么最终提名的是沃什？他否定了那些流行解释（说川普转变了态度、说沃什被游说了、说两家私交好所以沃什会听话）：\n\n提名哈塞特不是特朗普不想，而是在参议院通不过。\n\n他解释背后的博弈：川普想搞弱化美元来解决美债问题——只要美元无限贬值，美债问题自然解决（他打了个比方：把100美元的钞票后面加个0变成1000美元，物价涨十倍，美债不就减少了）。但这么做会让资产所有者、尤其是持有流动性的人利益受损，华尔街那些「老钱」不会甘于被摆布。所以这是一场新钱和老钱的博弈，最终结果是妥协。\n\n4. 由此得出的结论链条\n\n他把逻辑串起来：沃什上来 → 从预期降息三次变成可能加息 → 美元强势 → 不利于黄金等贵金属 → 贵金属下跌压制有色金属价格。这就是他对有色态度转变的完整推理。\n\n## 五、你所看到的都是假象\n\n1. 芒格的这句话，他反复强调\n\n你所看到的都是假象。真相是要用思考的，不是你能看到的。\n\n他打了个段子式的比方来说明：一对夫妻非常恩爱、儿女成群，那你认为他们每天晚上在床上干什么？你能看到吗？你只能看到他们很恩爱、有很多孩子，剩下的真相你得自己去想。\n\n2. 时间错配：你看到的，是人家两年前就看到的\n\n这是他这段的核心警告：\n\n你所看到的东西是人家两年前就看到的。当你看到的时候，人家开始卖了。\n\n他说这就是为什么「我一买入它就跌，我一卖出它就涨」——因为你看得没有人家远。你今天讲的那些故事（光模块不够用了、存储芯片不够用了），人家一年前两年前就已经认识到了。\n\n他还从对手盘的角度反推：\n\n如果大家都没有认识到这些问题、行业还没到高景气，那我问你，他的货怎么出得掉？他必须得等你看好的时候，才能把这个东西卖给你。反过来也一样，当你不看好的时候，人家才买得进来。\n\n3. 实操信号：看论坛热不热闹\n\n他给了一个很具体的观察方法：\n\n一旦某个标的的论坛开始热闹了，就说明大家都看好了——这就是一个危险的标志。如果那个论坛1个小时发50个帖子，你就一定要小心。\n\n反过来，他描述自己买的那些标的：\n\n你在那论坛里面放个屁，过两天你再回来一看，那味儿还在——因为那里就没有人。为什么要这个时候买？因为只有在这个时候你才能买进来。\n\n他也顺带解释了自己为什么老去「捅马蜂窝」——就是去试试有没有马蜂：「你一捅什么都没有，你就可以在这里面安心待着了。」\n\n## 六、「买入并持有」不是巴菲特的发明\n\n1. 卖煎饼果子的老王两口子也是买入并持有\n\n他用了一个非常接地气的比方来拆解这个概念：\n\n我们家楼下卖煎饼果子的老王两口子，他们也是买入并持有——买入煎饼烙子以后，就一直在那烙煎饼。他不会说明天煎饼烙子贵了，我就把烙子和炉子都卖了，等便宜的时候再买回来。\n\n他说巴菲特之所以买入并持有，是因为他买的是公司、体量太大、没有对手盘，不可能来回进出；而不是因为「买入并持有」本身是一种更高明的方法。\n\n2. 还有一种「买入并持有」，其实是自己看不清高低\n\n他指出另一种情况：有些人所谓的买入并持有，其实是因为自己没有能力判断这个东西现在是高估还是低估。他回应了那些嘲笑他「一会儿看空一会儿看多」的人：\n\n价格高的时候我就看空，我认为它合算了我就又看多了，那不很正常吗？\n\n3. 价格和价值的关系：人和小狗\n\n他打了个经典的比方：\n\n投资标的的价格和它的价值之间，相当于人和小狗的关系——有的时候狗会跑到前头，有的时候狗会拉在你的后头。\n\n所以当价格冲到前面、超越基本面的时候你要慎重；反过来它落后了、大家又开始悲观绝望的时候，你就应该有信心了。这也再次印证了他那句「价值投资和逆向投资是一体两面」。\n\n## 七、房地产低迷其实是有「红利」的\n\n1. 居住成本下降，等于变相提高了年轻人的消费能力\n\n他提出一个反直觉的观点：\n\n大家都知道人口红利——年轻人多所以人工便宜。我告诉你，房地产低迷同样是有红利的。\n\n他的逻辑是：房子便宜了，居住成本就下降了；居住成本下降，同样的工资，消费能力就提高了。他说现在年轻人结婚买房所支出的资产占收入的比例，和十年前完全不同——「你现在到二三线城市，哪怕在饭店端盘子当服务员也可以买房子了，十年前这些人敢想买房子的事吗？」\n\n2. 净存款增加的原因：从净负债变成净存款\n\n他解释宏观数据：原来大家买房都是长期按揭贷款，居民是净负债的，「你在为自己的未来打工，哪有钱消费」；现在居民净存款增加很快，这些钱慢慢都得消费。\n\n你今年买的房子比前几年便宜了100万，那这一百万是不是变相增加了你的资产、增加了你未来可以消费的增量？\n\n他还说房地产低迷会带来另一个结果：城市化会加快。所以他看好消费，但看好的是那种基层的、原来叫「低端消费」的部分。","toc":["一、火电、核电、水电：先搞懂它们各自靠什么赚钱","二、什么才算他定义的「周期股」","三、这一轮有色金属：不只是供需，更是货币现象","四、为什么他现在对有色转为「狐疑」","五、你所看到的都是假象","六、「买入并持有」不是巴菲特的发明","七、房地产低迷其实是有「红利」的"],"url":"https://xueqiu.com/2573414707/407225975","chars":5698},"topics":["电力成本","周期股本质","有色美元周期","美联储博弈","长江文明"]},{"date":"2026-07-24","bili":{"title":"老木匠 2026年7月24日直播文字稿（防风险、周期股博弈、PEG误区、社会化投资）","text":"## 一、市场波动与防风险\n\n现在波动性在加大，一定要注意风险。你拿着低估值的东西，如果加了融资也不敢保证没风险——一旦波动加大，确定性就会降低，极可能导致非理性下跌，融资是扛不过去的。\n\n最典型的是前几天那个科技股一直跌停的，明显是有人想强平平不出去。一定把这段时间的风险度过去。科技跌的时候，你不敢保证其他的都一定不跌。\n\n高风险最主要的表现就是高波动性。现在的韩国股市就是最典型的高风险——今天涨停明天跌停来回交替，市场内部博弈没有稳定力量。踩踏的时候你需要当一块石头，不用跟着跑，但也别让人伤害到你。所以防风险才是现在最主要的。\n\n日本汇率现在已经一百六十三、快到一百六十四了，有人预计一百六十五日本就受不了得加息。但加息也没用，加了也得加。日元一旦加息会抽离美元的流动性，得看美国的议息会议，现在一切为时尚早。最大的不确定因素就是对岸的川哥，你咋预计他明天想啥。\n\n霍尔木兹、曼德海峡两头堵，国际航运成本会非常高。\n\n## 二、投资与个人状态匹配\n\n投资不光是你买的东西怎么样，是你买的东西的特点和你是否匹配。\n\n你业余投资、投资少，相当于在五十厘米高的地方走钢丝；如果你是唯一收入来源、投资多，相当于五十米高走钢丝——钢丝还是那根，但安全性要求完全不一样。\n\n三十三岁、四百万本金做专职可以，但我不建议你这个年龄就做专职投资，做投资枯燥，你还得接触社会，四十五以上再考虑。\n\n马克思说人是社会关系的总和。我建议大家起码四十岁之前要积极参与社会、找一份工作，不为赚钱，为了了解社会。你沉浸在社会关系里，再看公司理解才透彻。太小就做投资容易跑偏。\n\n名校毕业去金融公司当基金经理，简历漂亮但投资水平臭大粪，很重要的原因是不接地气、对社会根本不了解。这些人不如在市场上卖过几年小买卖、卖过几年蔬菜的。读万卷书不如行万里路，行万里路不如阅人无数。\n\n## 三、周期股本质：博弈与报废周期\n\n造船是长周期行业，下跌周期长、上升周期也长。周期股的形成跟产品的报废周期有很大关系——你生产某产品，消费不可能均匀，微扰动形成波浪自我放大，这五年卖得多下个五年卖得少，得等卖多的那批报废才能再卖多。\n\n上一轮造船周期顶峰在 2004、2005 年，船舶淘汰周期大概二十到三十年，所以我认为顶峰还没到。主流造船企业订单已排到 2028 年，现在再下订单生产不出来，因为船台不够用。\n\n打仗会不会利好造船？思路：打仗要不要更多船运货？运输效率更低（航速更慢、在途船多），为达原货运量就得增加船舶。但真大仗来了世界贸易停止，那是另一回事。主要盯新造船订单累计量，别看今年订单下降——都订到 2030 了，没到定的时候没人定，就像订年夜饭。\n\n猪周期是短周期，从增加母猪到出栏约二十六到三十六个月。上一轮猪超级周期叠加南方水网禁养+非洲猪瘟，母猪全淘汰，供需错配猪肉天价。养猪场赚的钱够亏很长时间才离场——就像船只能坐五人上来六人必须下去一个，谁先跳？没人主动。所以周期股本质是博弈，是囚徒困境的变形。光伏、光模块、存储芯片、有色金属都一样。\n\n## 四、PEG 估值误区与散户研究\n\nPEG 是市盈率除以增长率，彼得林奇推崇，但大部分时候不适用——成长率特别高时看它没意义，会把很多高估的当成低估。五十倍 PE、百分之五十增长率，PEG=1 看着还行，但保持百分之五十利润增长非常难。\n\n找 PEG=1 得在市盈率特别低时，比如五倍 PE 每年涨百分之五——前几年四大行就是，非常好的模式。凡是连续两年百分之五十增长率的一定要怀疑：要么是周期上升期（一年涨百分之五百都行），要么是非营业所得（处理资产）。正常营业能连续百分之五十增长，没壁垒早被人抢了。\n\n医药不算周期股，跟消费差不多周期性弱。\n\n散户精细化研究基本面没太大意义，但也不代表只能凭宏大叙事判断（\"产业升级科技一定好\"没用）。不能忽左忽右，没什么一定之规。\n\n---\n\n全程为评书演绎，不指导投资、不提个股。","toc":["一、市场波动与防风险","二、投资与个人状态匹配","三、周期股本质：博弈与报废周期","四、PEG 估值误区与散户研究"],"url":"https://www.bilibili.com/opus/1241451951842918419","bv":"","minutes":0,"chars":1630},"ai":{"title":"老木匠·2026年7月24日：波动、周期与风险匹配","text":"## 一、高风险的本质是「高波动」\n\n1. 波动加大的时候，确定性会下降\n\n他反复强调当时波动性在加大，一定要注意风险。他说即便你拿的是低估值的东西，如果加了融资也不敢保证没有风险——「因为一旦波动加大，确定性就会降低，那么它就极有可能导致非理性的下杀。一旦出现这种情况，融资是扛不过去的」。他举例说，前几天有个科技标的一直跌停，就是明显有人想强平却平不出去。\n\n2. 科技跌的时候，别的也不敢保证不跌\n\n他提醒：不要以为前一段只有科技在涨、其他都没涨，所以科技跌的时候其他就不会跌。「我最终认为它跌下去还会起来，但问题在于你能不能忍受这种波动、这个波动会不会把你消灭掉，这才是关键。」\n\n3. 定义：什么叫高风险\n\n他给了一个明确的定义：\n\n高风险最主要的表现就是高波动性。你比如说现在的韩国股市就是最典型的——今天涨停、明天跌停，来回交替，这就是不确定性很强，说明市场内部的博弈没有一个稳定的力量。\n\n他打了个比方：这就像波浪起来之后，你想把它按平是需要一定能量的，它就是会此起彼伏。\n\n4. 踩踏的时候，你要当一块石头\n\n这是他这一段最形象的建议：\n\n踩踏的时候你需要当一块石头——你不用跟着跑，但是也别让人伤害到你。\n\n他还提醒一个容易被忽略的点：即便你不加杠杆，也还有心态能不能稳住的问题——「你看着你的东西一直往下走，你能不能保证挺住不割肉、能睡着觉、心跳不增加？」所以投资不光看你买的东西是什么，更要看这个东西的特点和你是否匹配。\n\n5. 比方：50厘米高走钢丝 vs 50米高走钢丝\n\n他解释为什么不同的人应该有不同的风险偏好：\n\n你业余投资、投资少，相当于在50厘米高的地方走钢丝；如果投资多、这是你唯一的收入来源，那相当于在50米高的地方走钢丝。钢丝还是那根钢丝，但安全性要求完全不一样。\n\n## 二、什么样的人适合、什么时候适合做专职投资\n\n1. 他不建议年轻时就做专职\n\n有人问33岁、400万本金能不能做专职，他说可以，但不建议这个年龄做——「做投资是很枯燥的，还是要接触社会。等你到一定的年龄45以上，再考虑做专职投资」。\n\n2. 40岁之前一定要工作，不为赚钱，为了解社会\n\n他的理由是：你要沉浸在社会关系当中，才知道整个社会是怎么运转的，这样你看公司的时候理解会更透彻。他还说，不建议刚从学校出来还没适应社会就开始抱怨社会——「你就像一个从来没上过鞍子的野马，鞍子只要放在你身上你就一定会不舒服。但如果你没上过鞍子，说明你这个人还没有社会化」。\n\n3. 为什么名校毕业的基金经理反而做不好\n\n他说了一段挺尖锐的话：很多简历漂亮的基金经理（清北毕业、国外名商学院、回来就当基金经理），投资做得却不好，一个很重要的原因是不接地气、对社会根本不了解。\n\n这些人都不如在市场上卖过几年菜、做过几年小买卖的那些人更了解社会。\n\n他打了个看戏的比方：你一直在学校里，从老师和同学那里接触社会，相当于坐在台下看布景给你展示的那一面——「你得想办法转到台后去，看看里头那机关是咋回事，人为啥能飞，钢丝挂在哪了，灯光是怎么打的」。\n\n4. 顺带一句反问\n\n如果看财务报表就能投资的话，那最好的投资人都应该是会计。如果懂经济就能投资好的话，那最好的应该是经济学家。\n\n## 三、周期股：为什么会形成周期\n\n1. 耐用品的周期，跟报废更换周期强相关\n\n他解释了周期形成的根本原因：在消费某种产品的时候，不可能每年都均匀地买同样的量，「它总会像大海似的，不可能是平的，总会有偶然原因产生微扰动，这个波浪慢慢自我放大」。所以某五年卖得多，下个五年就卖得少；而要重新卖得多，就得等上一批产品报废淘汰——这就是「换机潮」。\n\n2. 造船的例子：上一轮顶峰在2004-2005年，淘汰周期20-30年\n\n他说造船是长周期行业，下跌周期很长、上升周期也很长。上一轮造船顶峰大概在2004、2005年，而船舶的淘汰周期是20到30年，所以他判断这一轮的顶峰还没到。他还提到当时很多主流造船企业的订单已经排到2028年——因为船台不够用，干船坞里一条船不下水就造不了下一条。\n\n3. 供给端的周期：亏到最后，谁扛得住谁赢\n\n他讲了周期的另一面：周期下行时价格下跌，所有供应商陷入亏损，这时候就开始耗，看谁扛得过谁——财大气粗的剩下来，不行的就倒闭破产。他举例说，造船上一轮2008年顶峰过后，十五六年的下行周期里有多少造船企业最后都破产了。\n\n4. 猪周期为什么短，以及上一轮为什么是超级周期\n\n他拆了猪周期的时间结构：从增加母猪到可繁育、再到肉猪出栏，大概二十几个月到三十几个月，所以猪周期比较短。而上一轮之所以是超级周期，是因为叠加了两个因素——南方水网禁养（很多养猪场黄了）+ 非洲猪瘟（母猪被大量淘汰），造成了极严重的供需错配，猪肉价格极高、养猪极赚钱。\n\n他由此推出一个关键判断：\n\n那些养猪场赚了很多钱，这些钱够他们亏很长时间。所以在大家亏完这些钱之前，都不会离开这个市场——因为每个人离开都是给别人做嫁衣裳。\n\n他打了个比方：一条船只能坐五个人，现在上来六个，必须下去一个，谁先下去？「肯定没有人主动说我跳下去把我淹死，大家都得救了。」所以周期股的本质是博弈，是囚徒困境的一种变形。\n\n5. 什么周期股都一样，只是你看到的是它的高光时刻\n\n他说光伏是、今天热门的光模块是、存储芯片也是，「你只是现在看到的是他的高光时刻，是他这个周期的顶峰。最典型的有色金属那更是了」。\n\n## 四、关于PEG估值：市盈率高的时候没意义\n\n1. 50倍市盈率配50%增长率，那个增长率根本维持不了\n\n他说彼得·林奇当年比较推崇PEG（市盈率除以增长率），但他觉得大部分时候不太适用，尤其成长率特别高的时候——「你会把很多高估的东西认为是低估的」。\n\n他的判断标准是：市盈率特别低的时候PEG才有意义。「五倍市盈率、每年5%的增长，我觉得可以，比如前几年的四大行，那是非常好的投资前提；但50倍市盈率配50%的年增长率，那增长率能持续吗？」\n\n2. 连续两年50%增长率的，你一定要怀疑\n\n他说凡是连续两年有50%增长率的，一定要想它为什么会增长——要么是周期性行业的上升周期来了（那可以一年50%、500%，但不可持续），要么是非营业所得（处理资产、资产增值）。\n\n如果正常营业能获得50%的增长率，那你这生意得有多少人来抢？如果没有真正的壁垒，那个50%的增长率你怎么维持？\n\n## 五、日元与市场的联动\n\n1. 汇率已到163、164，市场预期165就得加息\n\n他当天看了日元汇率，说已经163快到164，有人预计到165日本就受不了、必须加息。他说「加息也没用，但是那也得加」。\n\n2. 日元贬值跟我们关系不大，但加息会抽离美元流动性\n\n他再次点出这个联动的关键：\n\n日元贬值不贬值跟我们倒没啥关系，但关键是日元一旦加息，会抽离美元的流动性。\n\n3. 顺带纠正一个错觉：日本人的生活并不像想象中那么好\n\n有人说日本老百姓生活很好，他反问：日本的人均收入是我们的四倍，那生活水准是不是我们的四倍？他描述了实际情况——开小车、走窄马路、路边全是电线杆、住30平米的小公寓、下馆子经常站着吃、退休金不足以养活自己所以老人还得出来工作。\n\n你都说日本人平和了，为什么平和呢？因为他已经没有野心了，挣扎也没有用。\n\n## 六、汇率和宏观：能判断因果，判断不了时点\n\n他说宏观不是拿来「分析预测」的，而是拿来理解因果关系的：\n\n你只能说你知道各种不同条件之间的因果关系。比如你看到日元越来越贬值，你可以预计日本可能会加息——但你说日本啥时候加息，那谁能知道？\n\n他还提到当时最大的不确定因素就是川普，「你咋预计川哥明天想啥？」同时他也指出一个反向的观察点：那阵子人民币汇率非常坚挺，所以纳指跌下来对A股未见得是坏事。","toc":["一、高风险的本质是「高波动」","二、什么样的人适合、什么时候适合做专职投资","三、周期股：为什么会形成周期","四、关于PEG估值：市盈率高的时候没意义","五、日元与市场的联动","六、汇率和宏观：能判断因果，判断不了时点"],"url":"https://xueqiu.com/2573414707/407225916","chars":3200},"topics":["防风险","周期股博弈","PEG误区","社会化投资"]},{"date":"2026-07-23","bili":{"title":"老木匠 2026年7月23日直播文字稿（伪专家识别、价值投资变味、房产CPI）","text":"## 一、伪专家和\"网红主播\"怎么识别\n\n很多所谓专家其实是\"盛名之下其实难副\"。他们借着自己出名的人设，很快切入一个并不熟悉的领域——比如原来搞宏观经济、房地产的，这几年都来指导炒股票了，可他们根本没炒过。\n\n真正有水平的主播，一定是受小众群体追捧的。逻辑很简单：一个主播如果观点跟我这不一样、净说大家爱听的，那一定是他在揣摩大众喜好，流量才大。所以直播间上万人、两万人的，你干脆不用看——那都是职业主播，靠这个赚钱，不是靠投资赚钱。天天对着屏幕\"摆活\"的人，绝不可能还在认真做投资。\n\n我的经验：贴近一千人以下的主播才值得看。五千以上的不用看，两千以上都不用看。水平高的主播一定是小众的，因为他不讨好大众。\n\n## 二、亏损了，人都想找个背锅侠\n\n现在很多人亏了钱，就去直播间找个出口。没有量化的时候甩锅给庄家，没有庄家甩给游资，再没有甩给国家队——反正不能承认\"亏损是我自己贪婪和恐惧造成的\"。\n\n说国家队\"清仓三万亿卖出为什么大家不知道，增持五百亿就敲锣打鼓\"——这事谁不知道？我在雪球写过八百遍了。2024年9月18号之前，神秘队一直在增持，尤其华泰、美瑞的沪深300ETF每天都有大量资金买入，盘面一看就知道有人在增持。这些事当时都有记录，不是事后编的。\n\n所以那些\"老专家\"提供不了有意义的建议，只会提供一个\"不满意的情绪出口\"。你去听直播间的基本就是输家，亏了找个甩锅的地方。\n\n## 三、价值投资是怎么变味的\n\n现在这词儿在中国已经烂大街、臭大街了，因为它跟\"老登股\"绑在一起。为什么会变成老登股？当年有人提出\"一生值得拥有的五十只股票，只买不卖，什么时候买都对\"，这些股票我当年叫\"落白马\"。\n\n2021年我就说未来市场结构是\"骑着白马上西天\"——买白马相当于上西天，但前提是白马得先经过两次腰斩。当时大家觉得不可思议，现在五粮液、牙茅眼茅、酱油毛、免税毛、医疗茅，好多都不止两次腰斩了。\n\n价值投资概念一步步被篡改：\n\n股价二百时：格雷厄姆式，五毛买一块（捡烟蒂），这是对的；\n\n涨到五百：芒格说好公司给正常价格就是价值投资，也能解释；\n\n涨到一千：优秀公司给优秀价格，合理高估，忍了；\n\n涨到两千：变成\"赛道就是王爷就是贵族，只要买白酒就对了\"——不用讲道理了；\n\n最后统统变成\"老登股\"。\n\n价值投资永远不过时。它和逆向投资是一体两面：价值投资是静态地说\"这东西值一块，我八毛买\"；逆向投资是说\"为什么值一块的东西有人八毛卖？因为大部分人不看好它\"。一块钱的东西涨了二十倍你还在玩价值投资，那是胡扯。\n\n现在确定性机会依然在价值投资——用八毛买一块、且这一块还会增长（今年一块明年一块一）的公司，现在到处都是，因为大家都看不上\"老登\"。\n\n## 四、读书的门道：从彼得林奇开始\n\n刚进股市，最好看彼得林奇。《彼得林奇的成功投资》是他写得最好的一本，特别易懂，里面渗透的理念我至今奉为圭臬。\n\n他几个重要思想：\n\n股票分六类：缓慢增长型、快速增长型、周期型、困境反转型、隐匿资产型等；\n\n鸡尾酒理论：酒会上大家把你当瘟神避之不及，就该买入了；有人主动给你推荐股票，就该清仓了；\n\n十倍股基因：机构不跟踪、机构不持仓、名字一提大家都觉得恶心烦人的公司，才是十倍股基因。A股流行\"跟随主力\"，但主力是猎人、你是猎物，猎物跟着猎人走不是疯了吗？\n\n他常年持仓约1500只、13年复合收益27%，说明分散投资也能成功，不一定非得集中。\n\n冯柳的弱者思维我也赞同，但他这些年选的标的和原来说的有点对不上。另外：五十万以内持有一只股票就行，最多两只；五十万以上最多两只。业余投资者只用研究20只无退市风险的股票、分散不同行业，在里面来回折腾，够覆盖一生投资。\n\n## 五、房子是大众消费品，房地产有长周期\n\n现在把房子重新定义为\"大众消费品\"，意义深远。以前买房算投资、租房才算消费，所以CPI里的居住价格实际指租金。未来会看到房价不涨、租金涨。\n\n房地产是周期行业，周期很长。国外统计大概36年（18年上升、18年调整），但中国第一个周期从1998年房改开始，从无到有，持续了约23年超级波峰，所以会有超级波谷，消化时间也长。\n\n逻辑：房子盖多了要消化库存→大家都不盖了→老房子到年限（五十年以上）逐渐脱离市场被淘汰→可供居住的变少→周期见底再起。但起来要很多年，而且上海房价回不到2004年四五千一平的年代了——只能靠其他东西涨、房价不变，变相降价。\n\n为什么要把房价纳入CPI？ 以前房价不计入CPI（因为是资本品不是消费品）。如果房价不涨、其他东西都涨，CPI就上天了。把房子（占居民支出比重大）纳入CPI，房价不涨就能把居民价格指数稳住，纸面通胀不会很高。这都是我一家之言、民科水平，你们当公园老头聊天听就行。\n\n## 六、几个底层逻辑随谈\n\n缩表降息不可能同时成立：既控制供给（缩表）又压住价格（降息），最终一定形成黑市（像布票就是黑市价格的表面化）。国内能做到定向宽松是制度优越性，老美做不到——他们只有强大法律体系、靠市场决定。\n\n日元底层逻辑：日本央行若无法容忍贬值而大幅加息，境外套利交易的日元回流，导致美国投资流动性减少、影响美股。越加息越回流、日本通胀越重，这不导致日元升值但购买力下降。这事儿我讲过多少遍都讲腻了。\n\n反弹还是反转：问这个问题意味着预测未来股价。今天涨了问，区别只在明天跌回来（反弹）还是继续涨（反转），根本预测不了。\n\n独立思考：温铁军研究三农是中国第一人、很有水平，狄东升也很有水平。不要听风就是雨，这些知识抖音上得不到——抖音经济学是另一种单独存在的\"贫下重农经济学\"。\n\n---\n\n以上为直播内容整理，仅供阅读参考，不构成任何投资建议。老木匠反复强调：不评论个股、不给买卖建议，当评书听即可。","toc":["一、伪专家和\"网红主播\"怎么识别","二、亏损了，人都想找个背锅侠","三、价值投资是怎么变味的","四、读书的门道：从彼得林奇开始","五、房子是大众消费品，房地产有长周期","六、几个底层逻辑随谈"],"url":"https://www.bilibili.com/opus/1241082451512524805","bv":"","minutes":0,"chars":2377},"ai":{"title":"老木匠·2026年7月23日：价值投资与散户的定位","text":"根据2026年7月23日直播（上午、下午）整理 · 按点分段讲解 · 保留原话语气和比喻\n\n## 一、所谓「专家」，很多是盛名之下其实难副\n\n1. 换个领域也能侃侃而谈的，多半不熟这个领域\n\n他说有很多所谓的专家其实是「盛名之下其实难副」——他们靠原来出名的人设，很快转型进入一个自己并不熟悉的领域。他举例说，有些做宏观经济、做房地产研究出身的人，这些年也开始评论股票，但他们最初都不是做股票的。相比之下，他觉得那些多年一直待在股市这个领域里做的人反而更可信。\n\n2. 亏钱总要找个背锅侠：从庄到游资到量化到国家队\n\n他说现在有人出现亏损，就总得找个背锅的——「有了量化就甩到量化身上，没有量化的时候甩到庄身上，没有庄的时候甩到游资身上，实在都没有了就甩到国家队身上」。他直言：\n\n大部分人都不愿意承认，亏损是我自己造成的，是我贪婪和恐惧造成的。\n\n他还提到一个具体的例子：有人指责「国家队减持3万亿的时候你们怎么不说，增持500亿就敲锣打鼓」。他说这事儿早就是公开的——任何一个专业投资者都知道当时在减持，他自己在雪球上写过很多遍。他强调2024年9月18日之前神秘队一直在增持的时候，也没有人说；而他自己是每天观察盘面、每天做记录，从ETF的资金流入就能明显分析出来有人在增持。\n\n## 二、日元的底层逻辑（这段是他后来反复讲的雏形）\n\n1. 加息会导致境外日元回流，反而加重国内通胀\n\n他说日元大幅贬值后会出现一个问题：日本央行是否还能继续容忍。如果容忍不了就会大幅加息，而加息会导致境外的日元回流——因为原来那些借日元去美国投资的套利交易会平掉。\n\n但他强调这解决不了日本的问题：\n\n越回流日本的通胀就会越严重。你越加息，日元就越回流日本；越回流日本，日本的货币就越多，国内的通货膨胀就越严重。\n\n2. 真正受影响的是美国：流动性被抽走\n\n他说日元加息不一定会导致日元升值，但会导致一个后果——那些借日元投资美国的资金抽离美国，导致美国市场的投资流动性变少。「这才是日元的最底层逻辑」。他还吐槽说，前两年那些专家讲「日元第一次加息就会升值」的说法都是胡扯，「根本不知道那底层的逻辑」。\n\n## 三、缩表+降息为什么做不到\n\n1. 同时控制供给量和价格，最终一定形成黑市\n\n他打了个高端白酒的比方来解释这个组合的内在矛盾：\n\n你既要控制我一年就卖一万瓶，同时又定价说不准超过1000元——那最后一定会形成黑市。\n\n他说缩表代表美元流动性变少，流动性少了实际利率自然会上升；但你同时又压低名义利率，那真正想按名义利率借到钱的人就借不着。他还用票证时代做类比：凭票供应本身就是黑市的表面化，「布票的价格就是市场价格和定价之间的差额」。\n\n2. 定向宽松我们能做到，老美做不到\n\n他补充说，国内可以做到定向宽松，这是制度上的差异——定向这种事需要一个强大的行政体系，「我们能做到的东西他做不到，这不是谁好谁坏的问题，是客观评价」。\n\n## 四、价值投资在国内为什么「臭大街」了\n\n1. 因为它被一步步偷换成了「赛道股」\n\n这是他讲得最生动的一段。他以某著名白酒标的的价格变化为线索，梳理了「价值投资」这个概念是怎么被一路偷换的：\n\n股价200元时，说的是格雷厄姆——「用五毛钱买一块钱的东西」，捡烟蒂；涨到500元，格雷厄姆说不通了，就改说查理·芒格——「好公司给一个正常的价格」；涨到1000元，就变成「优秀的公司给优秀的价格」，合理高估也是可以接受的；等涨到两千多，实在没法解释了，就直接变成：\n\n价值投资就是赛道。我这个白酒天生就是王爷，就是贵族，世袭罔替——你只要买它就对了，不用管它多少钱。\n\n他说这就是关键的偷换：从「业绩」变成了「身份」。一旦由身份来决定，那就不用再解释了，「两千也是这么解释，一万也可以这么解释」。\n\n2. 他当年的判断：骑着白马上西天\n\n他回忆自己2021年提出的说法是「骑着白马上西天」——买白马就相当于上西天。当时他还说了一个判断标准：\n\n如果白马股没有经过两次腰斩，现在的市场不能说已经见底。\n\n当时大家觉得两次腰斩不可思议，而现在很多所谓的「毛」（牙毛、酱油毛、免税毛、医疗毛）已经不止两次腰斩了。他还顺带纠正了一个说法：白酒可不是「老登股」，当年那可是冲锋陷阵、杀得非常猛的品种——「哪有老登1000块钱以上买白酒的」。\n\n3. 真正的价值投资从不过时，现在也到处都是\n\n他说价值投资在哪儿都不过时。现在很难找到「用五毛钱买一块钱」的东西（找到了也可能是地雷），但「用八毛钱买一块钱、而且这一块钱明年可能变成一块一」的公司现在到处都是——「为什么现在多？因为现在大家都不看好老登」。\n\n他再次强调价值投资和逆向投资是一体两面：「大家都知道这东西值一块钱，为什么还有人八毛钱卖？因为大部分人不看好它。」反过来：\n\n一个股票从底下上来涨了20倍，你还搁那玩价值投资，你不胡扯吗？还有谁不知道这只股票热了？\n\n## 五、他推荐的书，以及为什么推荐\n\n1. 入门第一本：彼得·林奇《成功投资》\n\n他说刚进股市看书的话，从彼得·林奇的《彼得·林奇的成功投资》开始最好——写得非常好、非常容易懂，里面渗透的一些理念他至今奉为圭臬（另一本《战胜华尔街》他认为写得一般）。\n\n他提了彼得·林奇的几个核心思想：把股票分成六种类型（缓慢增长型、快速增长型、周期型、困境反转型等）；投资极度分散，常年持仓大概1500只左右，13年复合收益率约27%——说明「集中投资才能取得好收益」并不成立。\n\n还有著名的「鸡尾酒会理论」：当你在酒会上一说自己是做股票的，大家像躲瘟神一样避之唯恐不及，这时候就该买入了；反过来，有人开始主动给你推荐股票的时候，就该清仓了。\n\n以及关于十倍股的判断标准——「机构不跟踪、机构不持仓」。他说这和A股流行的「跟随主力」正好相反，而「跟随主力」这件事本身就是个悖论：\n\n主力在这个市场里面是猎人，而你是猎物。我就没发现一个猎物喜欢跟着猎人的。\n\n2. 第二本：霍华德·马克斯《投资中最重要的事》\n\n他说这本书逻辑非常简洁，都是用一小篇文章讲一件事，对投资本质的解释比彼得·林奇那本更清楚。马克斯后来还写了《周期》，也很好但有点啰嗦。他说《周期》里最精彩的一个观点是——「投资者赚钱的能力本身也是有周期的」。\n\n3. 为什么「投资者的赚钱能力也有周期」\n\n他解释：每个投资者都有自己的能力圈，当市场风格正好和你的能力圈匹配的时候，你这几年就赚得特别好。2021年之前那些能长期持股的人（白马时代）效果特别好，2021年之后白马开始下跌，他们的周期就过去了；现在很明显是投资成长股的人成绩更好，而偏价值投资的人效果就不好。\n\n他说自己认识到这一点，但从不评价好坏——「现实就是现实，你做不了的就是做不了」，并打了个比方：「你不能硬拿鸭子上架，鸭子只能待在沙子上。」\n\n4. 第三本：约翰·涅夫；不推荐的几本\n\n他推荐温莎基金的约翰·涅夫，说这个人三十多年年化只有八点多，但已经是美国历史上最牛的基金经理之一——「因为他时间长，通过这个你就知道巴菲特有多牛」。他说涅夫的模式和自己比较契合。\n\n不推荐的：索罗斯《金融炼金术》（「看完你脑袋嗡嗡的，比吃安眠药还管用」，对实际投资意义不大）；《大作手回忆录》（和他的原则不匹配）；格雷厄姆《证券分析》（写作背景是大萧条之后，那些规则今天基本找不到了，后期可以看）；费雪《如何选择成长股》（他认为写得一般）。国内的书他只推荐姚斌（一只花蛤）的《在苍茫中传灯》。\n\n## 六、「买股票就是买公司」——这话对巴菲特成立，对你不成立\n\n1. 区别在于信息从哪来\n\n他说巴菲特买得多，能进董事会、能影响公司，所以他的信息来自董事会；而普通投资者的信息来自财务报表。这两者根本不是一回事：\n\n巴菲特可以做到买股票就是买公司，你做不到。你买的股票就是股票。\n\n2. 财务报表是一张「平面照片」，不是全息的\n\n他打了个很形象的比方：财务报表是公司实际情况的一张照片，而照片会受拍照清晰度的影响，更关键的是它只是平面的、不是全息的——「它背后是啥样的，你能看着吗？」他强调这不是说公司刻意造假或美颜，而是「照片这种东西天然就会导致一部分信息的损失」。\n\n他举了个具体例子：你看到一份公告，但你能知道当时董事长是什么态度、总经理是什么态度吗？有些决策虽然勉强通过了，但董事长坚决不同意，那未来推进就会非常费劲——同样一份公告，执行力可以完全不同，「在大公司上班的人马上就知道」。\n\n3. 你看到的信息都是别人「投喂」给你的\n\n他说得很直白：\n\n你所看到的消息都是别人想让你看到的。任何你所需要知道的信息都是别人投喂给你的——那跟喂猪不是一样的吗？缺蛋白质就喂蛋白饲料，缺能量就喂玉米。\n\n他强调投喂是有目的的（不一定是要骗你钱），所以你要去分析每一份公告、每一个决策、每一张报表为什么这么列——「这个东西实际上就是第一性原理」。\n\n## 七、散户拿的是霰弹枪，不是狙击枪\n\n1. 精细化研究基本面，对散户来说是自己骗自己\n\n他说得很直接：\n\n无论是谁，只要你是一个散户，想把基本面研究到特别精细，那都是自己骗自己。\n\n他打了那个著名的比方：散户拿的本来就是霰弹枪，还没有瞄准具，你还假模假式地要瞄准，「你那枪就不准」。所以正确的做法是找一个特别大的目标，大概方向来一枪就够了。狙击枪是专业人用的——「你是专业人吗？你眼神就不好」。\n\n2. 估值是艺术：一眼定胖瘦\n\n他说估值方法知道几种就行（现金流折现、市盈率、市销率等），但本质上是门艺术——「你没见过巴菲特拿计算器给一个公司做估值」。他的标准是：\n\n你一进来一看这人是胖子，但现在标的是瘦子的价，你就买它。如果你需要量身高、量体重、算出BMI才能确定这人是胖还是瘦，那这个人就干脆不值得买。\n\n他说如果你需要解个方程才能算出胖瘦，那就不是好投资。所以他一直对那些用极复杂逻辑研究估值的文章嗤之以鼻——「那你其实就没有买的意义了」。\n\n3. 但也不能走到另一个极端\n\n他补充说，这不代表基本面完全不用研究，也不代表可以只凭「产业升级、科技一定会好」这种宏大叙事去投资——「你这能指导投资吗？」他说不能忽左忽右，「对自己的研究非常自信不对，尤其研究面不够宽的时候；但说啥也不用研究就读就行了，那也不对」。他还提到一个警号：有人说「这股票越研究越不舍得卖了，越研究越想买」，他的回应是「那就买，买完就套里头了」。\n\n## 八、散户的定位：不是猎人，是食腐动物\n\n1. 机构追涨杀跌，是因为它必须这么做\n\n他解释为什么现在机构也在追涨杀跌：这是行业特性决定的。给自己做你有耐心，给别人做时你的投资人没有耐心，「你不这么做，过两天你的投资人就跑没了」。他打了个比方：\n\n狮子来到草地，不是因为狮子想吃草，是因为斑马爱吃草。机构追涨杀跌，是因为只有这样才能捉住散户。\n\n2. 你既当不了猎人，也不该当猎物\n\n他说个体想在这个市场生存，既做不到像猎人那样追涨杀跌还能猎杀别人，也不想被别人猎杀，那就只能做一类特殊的存在——「食腐动物」：\n\n你等他们猎杀完了、都死透了，你捡点残羹剩饭就够了。你准备赚多少钱？\n\n3. 业余投资者：研究20只股票就够一辈子\n\n他给业余投资者的具体建议：50万以内一般持有一只股票就可以，最多两只。然后你只需要研究20只没有退市风险的股票，分散在不同的行业（不能20只全是卖白酒的），把这20只研究透，来回轮换——「这个涨多了我就换成那个还没涨的」，足够覆盖你一生的投资。\n\n## 九、把房子重新定义为「大宗消费品」意味着什么\n\n1. 他的猜测：为了未来把房价纳入CPI\n\n他说大家千万别小瞧「把房子定义为大宗消费品」这件事，这有非常深远的意义，并给出了自己的推演（他反复声明这是「一家之言、自己瞎琢磨的」）：\n\n逻辑是这样的：以前买房被认为是置办资产、是投资行为，不是消费，所以不计入CPI，CPI里的「居住价格」指的其实是租金。而这些年房价大涨、租金没怎么涨。未来如果出现「房价不涨但其他东西都涨」的局面，CPI就会显得很高；这时候把房价纳入CPI，因为房价在居民支出中占比大且不涨，纸面上的通胀就不会很高。\n\n不是要拉升CPI，是要为未来的CPI起到一个稳定的作用。\n\n他还提到另一个角度：作为消费品收税，比作为资本品收税更「名正言顺」，不过他补充说消费税在当前的经济局面下还谈不到日程上来。\n\n2. 房地产是超长周期行业：超级波峰之后必有超级波谷\n\n他说房地产也是周期性行业，只不过周期很长——国外统计大概36年一轮（18年上升、18年调整）。而我们的第一个周期是从无到有（1998年房改开始），一直持续到2021年，长达23年，所以是一个「超级波峰」，消化的时间自然也会很长。\n\n他解释周期怎么见底：房子盖多了要消化库存，大家都不盖房子；同时房子有使用年限，50年以上的房子会逐渐脱离市场、被拆或不具备居住条件；等这些逐渐淘汰、可供居住的房子慢慢变少，周期就见底了——「那可不是一天两天，那很多年」。\n\n## 十、美元今天靠什么背书\n\n1. 不是石油美元，也不是科技美元\n\n他抛出一个反常识的判断：现在美元的背书是我们——「可以叫人民币美元」。他的推理是：\n\n沙特卖石油为什么收美元？因为美元能买到东西。那美元买东西上哪买？上中国买。你现在拿着美元到美国，你能买什么？买导弹不卖你，买芯片不卖你，买铜比别的地方贵50%。\n\n他说美国是想把美元挂靠到科技上，一旦科技发达形成垄断就成了「科技美元」——但目前还没做到。他还让大家对比一下：现在全世界每天的美元交易，是买石油多，还是买中国的产品多？我们一年的贸易顺差已经超过1万亿美元。\n\n2. 傻大黑粗也是壁垒，别妄自菲薄\n\n他说实业的强大生产力本身就是壁垒，这叫「大力出奇迹」：\n\n你不要以为只有作诗才需要资格。有一天灾难来了的时候，真正会做饭、种菜、扫地的那些人也有壁垒。你以为贾宝玉和林黛玉从吟诗作画改成扫地做饭那么容易吗？\n\n他说美国喊实体产业回归喊了多长时间了？不是没有精英认识到问题，而是走到今天已经难以解决——这就是产业空心化。「大家都认为炒钱最赚钱，那还有谁去生产钢铁、生产衣服和玩具？」\n\n## 十一、如何看待「关店」「失业」这些负面现象\n\n1. 关店是替代，不是崩溃\n\n他说要从第一性原理去想基层原因：\n\n从有电商就开始关店了，从有外卖就开始关店了，那有啥？你还说汽车发明以后马车都失业了——马车失业代表什么？代表汽车替代马车了。\n\n他还举了电话亭、ATM、钱包的例子：以前小卖部都有收费电话，现在没有了，那怎么了？\n\n2. 未来最值钱的方向：挣老年人的钱\n\n他做了个人口测算：585960这三年是自然灾害，出生人口特别少；61年、62年出生的人口是60年的两倍多，而61年这批人今年正好进入65岁，真正意义上的老人开始快速增长。而60后这一波「人最多、钱最多、儿女最少」——赶上了改革开放、考大学、下海经商，同时又赶上独生子女政策。\n\n所以他的结论是：养老、医疗、保健品、旅游这些「银发消费」是未来的方向，「你把这些60后攒的钱挣到手，你这一辈子就够了」。他还提到现在照顾老人的多是没文化的，未来可以有更有文化的人来做这件事。","toc":["一、所谓「专家」，很多是盛名之下其实难副","二、日元的底层逻辑（这段是他后来反复讲的雏形）","三、缩表+降息为什么做不到","四、价值投资在国内为什么「臭大街」了","五、他推荐的书，以及为什么推荐","六、「买股票就是买公司」——这话对巴菲特成立，对你不成立","七、散户拿的是霰弹枪，不是狙击枪","八、散户的定位：不是猎人，是食腐动物","九、把房子重新定义为「大宗消费品」意味着什么","十、美元今天靠什么背书","十一、如何看待「关店」「失业」这些负面现象"],"url":"https://xueqiu.com/2573414707/407225873","chars":6220},"topics":["伪专家识别","价值投资变味","房产CPI"]},{"date":"2026-07-20","bili":{"title":"老木匠 2026年7月20日直播文字稿（教育孩子、防风险）","text":"## 一、开头：市场与监管的新提法\n\n今天大家情绪都太高涨了。我一直在看外盘期货指数，不太看指数——现在的指数已经没什么参考意义。\n\n提醒大家一点：外来的干预不是为了价值，而是为了流动性。所以不要以为进来的资金会一直把某些东西往上推，这不现实。我猜今天他们严阵以待准备抗洪，但还没那么凶险，走一步看一步。\n\n重点看今天村里开完座谈会会后发的观点，要仔细读，尤其要和以前的通稿对照着读。比如这次明确说\"维稳并不是纵容题材炒作\"——这是和以前不太协调的新提法。再想想前一阶段转发的那篇\"不要看赚了多少钱而看解决了多少问题\"的文章，调子就有点不同。我一贯认为那篇转发文章非常值得商榷。\n\n反正我个人说过很多次：即便今天这样，依然要防止风险。\n\n## 二、主体：小孩教育——你究竟把孩子当主体还是当工具\n\n白天我在雪球说今天讲小孩教育，这不容易违规。先声明：我不是教育专家，只是一个过来人讲讲心得。\n\n### 1. 先克制你天生的喜爱\n\n《自私的基因》里讲，爱自己的孩子是基因写在天性里的——一种生物不爱后代就会绝种，所以基因赋予上一代对下一代无私的照顾。正因如此，年轻父母爱晒娃、朋友圈夸孩子多优秀，我极其不赞同：每个人都只喜欢自己的孩子，这是天性，在公共场合夸没意义。\n\n更严重的错误是：自媒体上拍孩子的尴尬瞬间（穿反衣服、吃饭弄得到处都是）博眼球。这比晒娃严重得多——你把一个三岁以前的孩子当成宠物、当成赚钱工具了。他不是宠物，是人。\n\n还有一种：把三岁前孩子推给祖父母外祖父母带。老人对隔辈的喜爱极难理智，孩子提的无理要求全满足，带出来的孩子普遍任性，觉得全世界都欠他的。这三种情况务必注意。\n\n教育孩子的过程不是感性的，是理性的。 你不是\"拿在手里怕掉了、含在嘴里怕化了\"，是从理智出发。\n\n### 2. 三岁之前教育什么\n\n很多人把教育单纯理解为\"学习\"，大错特错。我认为学习是教育里最不重要的一项。三岁前主要这几项：\n\n性格养成：冒险精神、抗挫折能力。不能百依百顺，要让孩子知道不是所有事都按他意志来。小时候要唠叨，大了要停手；小时候可体罚，大了要收手。\n\n安全行为教育：什么安全什么不安全（热水不能碰、插排不能摸）。底线可用惩罚，三岁前最有效。但打和打不一样——必须出于理性、有目的，绝不能是你自己气疯了发泄情绪。\n\n道德规范：什么是好、善良、错、丑。贯穿整个未成年阶段，耳提面命。孩子未来善良还是残忍，跟这个关系很大。\n\n行为规范：很多孩子长大后说话办事离社会规范远、显得另类，多半是成长中这些行为被你反向激励了。比如小孩爱怼人，家长夸\"这孩子说话太有劲儿了\"，他就越来越怼人，长大了格格不入。\n\n孩子不吃饭怎么办？没有任何小动物在有食物时会把自己饿死。不吃饭是因为不饿——你每天强制喂，他把吃饭当负担了。最好办法：晚饭收干净，多饿也不给，明天早上再吃，两回就过来。\n\n三岁前千万不能百依百顺，让他面对挫折，才形成抗挫折能力。\n\n### 3. 上学后：社会化与文化底色\n\n六岁上学，涉及怎么和老师、同学相处，这是社会化问题。最忌讳把孩子养成和大众模式完全不同的另类。比如现在受外来教育思潮影响，说\"快乐教育\"、孩子想旅游就给老师请假不去上课——这在我们普遍重视学习的语境里就很另类。\n\n文化底色很重要：你起码得知道普通人怎么想、怎么行为，符合大众规范，社交上不显得另类。\n\n和老师的关系要理清：老师培养学生的目的是成绩达标就合格，不是替你培养子女。 你培养孩子成功不等于学习好。目标和老师不完全一致。老师找家长，若因行为规范超底线，你和老师站一起；若只是小问题，不必太在乎。\n\n别把学习看得太重。旅游对孩子好处很大。沉迷手机谁都解决不了——你先想自己能不能戒掉手机？自己做不到，凭什么要求孩子做到。\n\n财商、毛笔字、足球、乐器，学不学都行，没有必须，对未来也没大影响。孩子小阶段最主要还是玩，和同龄人交流信息可能更多。别把孩子时间排满全是学习，别让他成为实现你理想的工具。\n\n教育的千条万条归结为一条：你究竟拿孩子当主体，还是拿你当主体。 比如冬天让孩子穿过多衣服，究竟为让他暖和，还是安慰你自己？\"妈妈觉得你冷\"，大部分小孩其实不觉得冷。很多要求都是为了满足你自己的虚荣心——\"看我孩子又会钢琴又会乐器\"，没意义。\n\n### 4. 青春期逆反：作用力越强，反作用力越强\n\n快到青春期，性激素快速变化，激素水平乱套，逆反是 internal 激素变化造成的，不是你扭得了的。这时候要注意\"阴道\"（让步），有时需要让步——逆反不会一辈子，年龄到了自然知道你有道理。\n\n最怕家长采取过激行为\"非给你掰过来\"，错了。逆反过强，都是因为家长控制太多、作用力太强。人有两个心理脆弱期：青春期（激素第一次剧变）和更年期（男女都有，激素第二次变化）。叛逆期容易产生严重问题，格外谨慎，过了初中上高中基本就好了。\n\n原生家庭的影响，有的人很大年龄才明白小时候的原因。\n\n### 5. 就业选择：别把孩子当就业工具\n\n就业每个家庭情况不同，总体要尊重孩子自己的选择。我非常反感家长设计孩子一生——\"你不能把你的一生过了把我的一生也过了\"，可现在很多家长自己过得不精彩，偏要把孩子人生也按他的样子过。\n\n我不赞成像张雪峰那种过于功利的考大学选择——不考虑孩子适合不适合学，只看\"家里有电力系统的去学电力、有公务员的去学公务员\"，那是把孩子当就业工具。\n\n把大学和就业绑在一起，是这些年大学教育最失败的地方。 大学看就业率衡量非常失败——大学不是培养就业人才的，技校才是；上大学是锻炼思考方式，不是为以后干什么。我们那会儿从没想\"学什么一定干什么\"，我本科物理，同学百分之八九十没做物理。\n\n考公务员？我尊重孩子意见，但个人不倾向现在去做公务员。逆向想：所有人都挤公务员，结果不会好，跟21年买房区别不大。公务员待遇好也就是最近二十年土地财政带来的，大部分时候财政都困难。现在地方财政没有不缺钱的，最健康的深圳也缺。财政不直接产生收益，不会总那么好。四五线县一级已经非常困难。\n\n而且\"工作难找\"未必真实——是心里给工作加了定式：\"必须坐办公桌处理文字才叫正常工作，干体力活就不正常\"。招不到人的行业多了（养老都招不到人）。农村孩子进城能维持生活，城里985毕业反倒养不活自己，本身就是悖论。人口老龄化下，做家庭维修维护公司（物业只管门外、门里不管）很赚钱。我认识农村来的朋友专安空调，儿子大学毕业跟着干，每月挣得不少；很多孩子大学一毕业把自己架起来了，一般活都干不了。\n\n最好当王爷——前提是得有个当皇上的爹。\n\n## 三、收尾：回到市场，防风险\n\n聊完教育，看市场：纳指期货还在涨。风格不是已经在切换了吗？\n\n我从上面下来后已经不做短线。达到30%~40%幅度后，融资部分面临补充保证金要求，补不了就被强平。现在说强平不多，是因为这次和2015年不同——不是全面的，是结构性的，抵押物不全在一个范围。但如果你买的都是科技、范围很窄，现在热门的很多已经腰斩或接近腰斩，腰斩时一定被强平。\n\n前一阶段有人说\"往下走我就卖了呗\"，现在发现卖没那么容易：有的根本卖不出去，有的像今天先给你点憧憬拉上去、你又想\"明天还能涨再等等\"，结果又下去。你只要有\"卖飞\"的恐惧，就几乎永远难卖出，每次卖都是折磨。\n\n死猫跳：从高位下来的标的不会直线下来，直线下来优势交易者出不了货。做到一定程度必须减轻抛压甚至重新买入，把价格拉起来像势能一样，再从高位往下走才能出货。不是为套更多人，是为引诱更多人——市场就是引诱反引诱，比定力。定力不强，一看反弹冲进去搏一把，第二天告诉你\"同\"。\n\n第一位的（核心标的）根本不存在跳的问题，跌了都好多年了，那是理解不对。\n\n今天市场非常有意思，明天会更有意思——若一直这样，明天又引诱一部分人。抛压大不正常吗？没有利好你抛给谁。\n\n我个人对整个这段行情的主题就是防风险，不管今天这样还是以前。讲一晚上孩子教育，大家的支持是我坚持发声的主要原因。最近可能不播了，什么时候播再预告。我要下播看美股了，谢谢大家的礼物。","toc":["一、开头：市场与监管的新提法","二、主体：小孩教育——你究竟把孩子当主体还是当工具","三、收尾：回到市场，防风险"],"url":"https://www.bilibili.com/opus/1241065658156843013","bv":"","minutes":0,"chars":3310},"ai":{"title":"老木匠·2026年7月20日：干预、死猫跳与卖出的难","text":"## 一、外来干预是为了流动性，不是为了价格\n\n1. 别指望进场资金会把某些东西继续往上推\n\n他强调一个关键区分：\n\n外来的干预不是为了价格，而是为了流动性。\n\n所以不要认为外来进场的这些资金会继续把某些东西往上推，这不现实。他说当天看起来「严阵以待、准备抗洪」，但其实还没有发生那么凶险的情况。\n\n2. 买宽基ETF为什么会出现「有的往上、有的往下」\n\n他解释了一个当时很多人看不懂的现象：买宽基是按权重分配的，不同风格的标的其实都会买到，但为什么有的涨有的跌？因为买入是差不多的，但卖出的力度不一样。他还提醒，这种情况下「现在的指数已经没有什么参考意义了」。\n\n3. 买宽基能解决下方买盘，解决不了上方抛压\n\n他把这个逻辑讲得更完整：买宽基ETF要按指数权重分别买入成分股，但这些成分股有的有抛压、有的没抛压——有的已经在底部没人卖，有的在高位有大量抛盘。所以买ETF解决不了上面的抛压，但可以解决下面的买盘。\n\n由此他推出一个预判：\n\n你会看到一个很奇怪的现象：原来那些都没人买的东西，现在突然有人买了，它就会往上走——因为它没人卖了。\n\n## 二、要仔细读官方表述的变化\n\n1. 「维稳不是纵容题材炒作」是一个新提法\n\n他建议大家去看当时会议后发的新闻通稿，说里面有一些新的变化——比如明确表明「维稳并不是纵容题材的炒作」，这是一个和以前不太协调的新提法。\n\n他强调方法：\n\n这些重要会议之后发表的新闻通稿，一定要仔细读，尤其要和以前的这些东西对照起来读。\n\n他还提到前一阶段监管转发的那篇关于估值的文章（「不要看赚了多少钱，而看解决了多少问题」），认为那篇文章和当时的调子多少是有一点不同的，并直言那篇文章「作为监管机构转发，非常值得商榷」。\n\n## 三、从高位下来的标的，为什么会有「死猫跳」\n\n1. 直线下跌的话，优势资金自己也出不了货\n\n他解释了这个机制：一个从高位下来的标的不可能一条直线跌下去，因为那样的话优势交易者自己也出不了货。所以他们做到一定程度时必须减轻抛压，甚至重新买入，这就形成了所谓的死猫跳。\n\n这个时候他是为了价格，不是为了出货——重新把价格拉起来，转移就像势能一样，然后好从高处再往下走，你才能出货出去。\n\n他说如果一直直直地往下卖，过两天就砸没了、买盘就没有了。所以只能「下来两步再回去一步，再下来两步再回去一步」，通过这种方式才能出得去。\n\n2. 这不叫「套更多人」，叫「引诱更多人」\n\n他纠正了一个说法：这不是为了套更多人，而是为了引诱更多人。市场的交易就是一个「引诱与反引诱、比谁定力强」的过程——你定力强，你就不管那个事；定力不强的，一看这个挺好，觉得是反弹，冲进去博一把，第二天就被套住了。\n\n3. 低位的东西根本不存在死猫跳的问题\n\n他特别提醒：判断死猫跳需要看的指标很多，不要轻易下结论，而且「在低位的东西根本不存在死猫跳这个问题，那个理解就不对」——跌了好多年的东西，哪来的死猫跳。\n\n## 四、这次为什么强平的人不多\n\n1. 因为这次是结构性的，不是2015年那种全面性的\n\n他解释：从高位下来达到30%或40%之后，融资部分就会面临补充保证金的要求，补不了就会被强平。但现在被强平的并不算多，原因是这次和2015年不一样——它不是全面性的，而是结构性的，大部分人的抵押物并不全集中在同一个方向。\n\n但他补充说，如果你买的全是同一个窄范围内的东西（比如全是科技），那你现在基本上已经进入强平线了——「现在腰斩或接近腰斩的已经很多了，而且时间很短」。\n\n2. 「跌了我卖掉就完了」，其实没那么容易\n\n他回应了一种说法：前一阶段有人说「往下走的时候我卖了就完了呗」。他说你现在就会发现卖出没那么简单——一是有的东西根本卖不出去；二是心理上过不去：\n\n先给你来点憧憬，涨一下又下去了，你合计早知道上面就该走了；等最后又起来了，你又想明天应该还能再往上走一走，我再卖。\n\n3. 只要还有「卖飞」这个概念，你就永远难以卖出\n\n这是他给的一个心法：\n\n你只要还有卖飞这种概念，你几乎就是永远都难以卖出。你动不动就有一个卖飞的恐惧感在心里头，那你每一次卖的时候对你都是折磨。\n\n他的建议是：根本不要有这个概念，就是按照一个计划来做——到这儿走多少、到那儿走多少，跟卖不卖飞没有任何关系。\n\n## 五、防风险是这一段行情的唯一主题\n\n他说不管是当时那种走势，还是之前，他的主题始终是防风险。他也提到自己一直在看外盘的期货指数，反复强调「即便是今天这样，依然要防止风险」，并直言「持有的体验都不很好」——只要在这个市场里，你就是难","toc":["一、外来干预是为了流动性，不是为了价格","二、要仔细读官方表述的变化","三、从高位下来的标的，为什么会有「死猫跳」","四、这次为什么强平的人不多","五、防风险是这一段行情的唯一主题"],"url":"https://xueqiu.com/2573414707/407225793","chars":1885},"topics":["教育孩子","防风险"]},{"date":"2026-07-18","bili":{"title":"老木匠 2026年7月18日直播文字稿（清杠杆、美联储变天、AI金融战、五类主播避坑）","text":"## 一、开头：只谈方法，不谈具体标的\n\n我先说明纪律：我没有讲具体内容的资质，大家别在公屏打具体名称。我只谈宏观、谈方法，不谈具体标的和你最近的策略。这也是我不太爱在B站直播的原因——这地方不能畅所欲言，说话太费劲。\n\n今天主要讲我从六月最后几天到现在的心路历程变化。\n\n## 二、转折的起点：联储人事变动\n\n去年一整年我非常看好贵金属和工业金属，也非常看好对面央行会大幅降息。但后来情况不断变化，尤其是对面的联储主席提名变成保罗·沃什（沃克尔式的鹰派）之后，态度一点一点转了——我不仅清掉手里所有相关标的，还在雪球持续提示风险。\n\n为什么一个人这么关键？保罗·沃什是联储的建制派，当年就反对伯南克搞量化宽松，他的历史观点和学术立场对决策影响极大。最终能选他，说明某种博弈结果已经产生，意味着川哥原来预想的东西遭到很大反对、很难实现。对面不是川哥能为所欲为的，和我们的体制完全不同。\n\n最关键的变化：今年年初还普遍预期降息三次，现在几乎没人认为还会降息三次了。于是美元指数不断上涨，韩元、日元这些\"美元影子货币\"承受压力被迫加息——这对国际流动性影响很大。\n\n随着美元上涨，贵金属承压，工业金属也承压。大概一二月份我就清掉了所有有色相关的投资。到五月份提名通过，我已经从\"看好\"变成\"不看好\"，这不再是远处的风险，是迫在眉睫的。\n\n## 三、科技确定性不足，AI没有经济闭环\n\n后来我讲科技比较多，但最初我只是说\"我不懂、确定性不足\"。科技自带风险，不确定性在两个层面：\n\n1. 科研结果不确定：不是所有科研都产生预想成果，创新药也一样。\n\n2. 竞争方案哪个胜出不确定：建数据中心用GPU还是CPU、最终是否还需要这么多数据中心，都是未知数。现在堆算力+免费大模型训练AI这种模式能否跑通本身存疑，更别提变现。\n\n我本科物理、专业是芯片，做过集成电路，对科技理解在普通人平均水平之上。但科技发展太快，某项技术出来后哪个行业受益、哪个受损，我现在判断不了那么精确。而现在很多人投资科技已经简单化了——\"只要讲个宏大故事就行\"，比如\"算力→电力需求→工业金属需求增加\"。但你能算出具体增加多少铜用量吗？很少有人算得准，因为技术也在变（英伟达从铜连接改光连接）。\n\n看库存就能感受到：大家说工业金属供不应求，但铜在三大交易所（伦敦、纽约、上海）+中国全社会库存+保税区库存加起来非常高。库存高不代表价格一定跌，因为库存里有一部分是金融化囤货需求（不是为了消费，是为了等涨价炒）。但这东西是双刃剑：涨价时大家囤，不涨了（不用跌）持有就有机会成本（不产生孳息），就开始抛，持有者和生产者形成竞争、不计成本地卖。白银年初就体现得非常明显，很多现货持有者想出都出不掉（非标准品不能交割、散户没资质）。\n\n再说AI：整个行业没形成经济闭环——把相关行业当一家公司看，它还在烧钱、不能造血。英伟达\"卖铲子\"的收益也不像数据那么靓丽，因为行业整体无法从外部获得足够现金流入，靠上游投资输血+市场融资撑着。全行业加起来一直在烧钱。最终全球能胜出的就一两家，美国若垄断AI，就能卖高价、救美元（你拿美元只能买它的高科技服务）。\n\n所以中美AI竞争本质是金融竞争，不是科技竞争。 我们不必超过对岸，只要不落后太多（比如打75分满足大部分需求）就行——这样老美就得不到垄断利润，美元就失去支撑。你拿美元到美国能买啥？武器不卖你，高科技终端也不卖你，只能买AI服务。若中国能提供75分产品，垄断利润就没了。\n\n## 四、美国低通胀与科研的底层逻辑\n\n为什么美国当年保罗·沃尔克能治理两位数通胀而不引发大衰退？机缘巧合：中国改革开放后，廉价商品源源不断进入美国，维持了低通胀，让它能把资源投到高端产业。这就像大观园里贾宝玉能吟诗作赋，是因为有丫鬟婆子做基本劳动。\n\n科研水平和社会基尼系数有关：奴隶社会/阶层分化大的社会容易产生科学发现（亚里士多德、毕达哥拉斯不用愁吃穿）；进入自给自足的小农经济后反而不利科研。美国这些年科研好，是因为基本生活用品极便宜、不用自己造。我们的贫富差异其实比欧美小得多。\n\n但这不意味着我们弱：从科学史到今天中国一直不占先，但技术一直领先——技术是实用的，我们强在\"这东西有什么用\"的落地能力。科学突破靠天才（牛顿、爱因斯坦），技术进步靠人海战术、熟能生巧（光刻机中国一定能做出来）。现在工程师红利在中国最集中，技术中心移到我们这恰逢其时。当老二比当老大一容易得多——我们不必领先，不被落下即可。昨天AI大会看似没人来，其实非洲那些客户就是买我们75分产品的，那是高明的营销。\n\n## 五、强平与踩踏：为什么六月底清掉所有杠杆\n\n今年六月底最后几天我把所有借的钱都还了。原因：我认为市场结构性演化走到了极致，把那一小部分标的推到无以复加的高位——就像邻居家天天玩火，你不玩也要准备消防器材。\n\n现在从高位下来40%~45%接近腰斩的，原来高位融资的已到强平线，但下边没人买、平不出去；再一个跌停，本来没到线的也到了。强平风险会自我实现。不止如此，券商看你整体融资过警戒线，你这个卖不出，就卖你其他东西——这叫被动卖出，不考虑价格合不合理，只要拿回本金。这就是我去年上半年底就预警、六七月风格必变的原因。我差两天没挺住，开盘不看价直接走，亏损也认。\n\n目前强平风险没解除，连环强平风险没解除。 周五面临警戒线的人会很多。我看对面市场十来天了，韩国市场已经流动性危机，周一90%开盘熔断——这是我清杠杆的主因。\n\n踩踏杀伤力强但\"一阵风过去就拉倒\"，关键是踩踏中你不出局。但踩踏过后要分析成因能否过去。周五下来的东西能否回到原模式？我认为可能性不大，要么慢慢继续下，要么宽幅震荡。从去年十月起有一些东西持续下行的原因现在已经没了，它们会不会反向运动，值得思考。我个人认为好日子才刚刚开始——我有很大信心今年正收益。等这轮行情结束我一定会做空（2015年做空太早亏过钱）。\n\n现在光靠某些ETF买入解决不了燃眉之急：买宽基ETF按权重分别买入，有的在底部没人卖、有的在高位有大量抛盘——买ETF解决下边买盘、解决不了上边抛压。而且买什么都有极大道德风险，只能买沪深300这类宽基。\n\n## 六、筛选主播的五条铁律（重点）\n\n直播间人多的、天天喊\"主力资金进出\"的、把市场拟人化的、一开口就埋怨的、总想改交易制度的——这五类主播一律别看：\n\n1. 直播间超5000人（想提高就超2000）不用看。水平高的人永远小众，曲高和寡，几千人关注一定在扯淡。\n\n2. 说\"主力资金进出\"的一律不用看。逻辑思维有欠缺。\n\n3. 对市场拟人化描述的一律不用看（\"他们拉起来准备干嘛\"\"打压下来\"）。市场是博弈结果，没有指挥部，不是某人主观目的——就像下雨是冷暖空气博弈，不是老天爷想下雨，打雷也不是老天爷想放屁。\n\n4. 一开口就埋怨这个埋怨那个（量化如何、神秘队想赚你钱）的一律不用看。这是提供情绪价值、甩锅。所有买卖都是你自己决定的，亏损要么学艺不精要么经验不足，别找原因说有人害你——有毒。\n\n5. 总想改变交易制度的一律不用看（最典型刘教授）。改制度不是博弈者该关心的事，就像足球运动员别老关注足球规则——今天梅西是球星，改成8人踢梅西还是球星。规则是你的边界，改变不了，输了就得认。\n\n李大霄是我尊敬的人，当年正经首席被骂得多，后来走网红路线玩\"婴儿底\"是故意吸引流量，别真拿他当笑话。那些\"前两天还说科技是主线、一跌就说早提示过风险\"的主播，操蛋，一个都别信。\n\n## 七、价值投资就是逆向投资\n\n价值投资（标价低于实际价值）和逆向投资（别人不买时你买）说的是一回事：只有大家都不看好时价格才会被低标，人多的地方没有便宜货。水平高的人永远小众，这东西不是给多数人做的——多数人都做到，它就不成立了。\n\n低估的东西永远有，找起来不难，难的是找到了不敢下手。市场上扫一眼就知道哪个\"胖\"哪个\"瘦\"，但问题你想买\"胖子\"。房地产还是要谨慎。\n\n结束。我主要回顾了为什么从去年看好有色贵金属，到后来不看好、六月底清杠杆；以及未来我仍有信心。不谈具体策略，只讲方法——以后不定期播，提前两天发预告。做投资要有独立思维、不从众，听谁的都不行，包括听我的。","toc
