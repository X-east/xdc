事。\n\n所以他给个人投资者的落点是：\n\n我们作为个人投资者，你什么都解决不了、什么都决定不了。那你只有一点：你要避免自己成为那个买单人。\n\n4. 买单有两种方式，拿现金也躲不掉\n\n一种方式是你持有股票，然后来一个股灾你就亏了。还有一种方式是你持有现金，然后那个现金慢慢贬值，你也亏了。\n\n他举了个现成的例子：「2019到2021那几年你买房子，就是买单人。你亏的钱肯定不会消灭，他肯定有地方去。」\n\n## 二、猎人站在哪，取决于猎物跑到哪\n\n1. 美联储和华尔街是看得到底牌的那一方\n\n他们也相当于是猎人。他们现在究竟在哪个地方开枪，取决于猎物都跑到了哪面。所以你没办法判断这件事——主动权在猎人手里头。这跟量化的做法是一样的。\n\n如果大家现在都赌先贬值、都去买黄金，那好，我先来一次危机，把你们洗掉。\n\n2. 所以你要做的不是猜，而是站到人少的那一面\n\n当大家都赌危机先发生的时候，你就认为危机不会先发生；当大家都赌贬值会先发生的时候，你就反向。最终的结果都是一样的——危机也会发生，贬值也会发生。\n\n你作为散户进入市场，相当于看不到别人的底牌，但别人能看到你的底牌。你哪个地方是安全的？猎物少的地方、斑马少的地方，那就是安全区。\n\n3. 他自己现在的状态：迷茫\n\n这场他罕见地说自己看不懂了：\n\n原来我觉得自己啥都懂了，现在这种复杂程度已经超出了我的认知范围，我已经没有能力去判断说未来一定会如何了。去年这个时候我的判断还很有信心，我认为美联储一定得先宽松；今年不好说。\n\n我这么些年来，是头一次感觉到风险这么大。近十年，2015年之后，我感觉这一次的风险是最大。\n\n他说自己上半年就已经把融资清掉了、而且是割肉清的，现在「还不至于清仓，但是肯定不会再加仓了」。他还坦言年初的判断没这么悲观——「那时候我说今年主要是不亏损，还没想到今年如此之难」。\n\n看不懂的时候，就是保住本金最重要。\n\n## 三、别替美国操心：他的办法比你想的多\n\n1. 一个大部分人没想过的可能：加息 + 扩表\n\n这是他这场抛出的最有意思的一个推演。大家都认为美国不可能加息，理由是国债利息支出扛不住。他反问：\n\n那为什么不能我加息的同时，美联储还买国债呢？\n\n加息可以让通胀问题得到缓解。至于你担心的利息增加还不起——那我美联储承诺，你增加的这部分利息我来担，你发一个专门还利息的特别国债，我来买。那无非就是个扩表呗，钱反正是美联储印的，而且扩不了多少。\n\n他说这相当于定向宽松：「我美联储这次印的钱不给市场，就给美国政府，别人谁都不给。我把利息加到10%，你们所有人都得被勒死，然后只有美国政府有钱，那你咋办？」\n\n2. 他还提到一个反直觉的可能\n\n华尔街的大投行也有专家专门分析过：今天国债收益率上升的一个很重要的原因是美联储不作为。如果美联储要是加息的话，这些外国主权投资者可能反而不会卖出美国国债——这和你想的正好相反。\n\n3. 所以别把话说得信誓旦旦\n\n你要保持多几种可能性思考，别说「他肯定不行、他挺不住」。跟你说，那个聪明人可老了。\n\n他举了房地产做对照：\n\n你们原来还都说房价跌不了，跌了银行全是坏账、银行得破产，有没有人跟你说过这个？现在跌了，你看哪个银行破产了？\n\n你要知道你是和一帮全世界最顶级的聪明人在博弈，你唯一能做的就是保护好你自己——你还老想进攻，把别人赢了。你就那三两条枪，还老想来个冲锋；你就找一个没人的地方眯着，偷偷打两枪冷枪就完事了。\n\n4. 输的钱是怎么到人家手里的\n\n他用亚洲金融危机做了个完整的说明：\n\n那些人血本无归、破产一大堆，最后钱都跑哪去了？大量东南亚大公司的股权、那些资源，最后不都跑到美国财团手里了吗？\n\n但他绝不是从你手里抢走的。是你先输了——股价大幅崩溃，你交不起保证金，你就得抛售。所以价格处于低迷状态，然后他那边进来买了，那就变他的了。甚至你卖的时候，都不是他买的。\n\n所以你不用考虑人家咋赢的，你先考虑你自己别输。你自己别输，他就赢不了；但你要输了，他就一定赢。\n\n## 四、这场的重头：中美AI竞赛与科技牛市的真实作用\n\n1. 美国的AI公司为什么急着发债\n\n他先问了个问题：他们完全可以慢慢发展，为什么现在要着急去市场上发债券？他说「钱不够」不是主要原因——「钱不够可以拖时间」。\n\n主要原因是被我们追的。AI这东西只要不大幅领先他就输了，所以中国的追赶给了他们很大压力。你如果不进行大幅融资、大干快上，你就保持不了现在的领先局面。\n\n2. 那中国烧的钱是从哪来的\n\n他把这条链条接了上去：\n\n中国的AI公司融资都非常容易，他们获得了大量的资金用于支持这个产业的发展。所以你看科技牛市就这么重要。\n\n我不是不懂这个道理，我这个道理我非常懂——我只是不愿意成为买单人，仅此而已。我认为作为宏观的管理层，这件事儿做得是非常好的。\n\n3. 他用彩票做了个类比，把两个层面分开\n\n福利彩票设立的初衷无疑是对的，效果也非常好。但你能说因此买彩票的这种决策也是对的吗？\n\n你从公共管理层来看这个事完全是对的。但你作为个人来说，由于它带来极大的不确定性，这个东西就不对了。\n\n所以他的结论是：\n\n你买科技，有可能赚钱，也有可能有一天亏钱。但有一点是肯定的：你是为中美竞争做出了巨大贡献——就像你买福利彩票，不管中没中奖，都是对福利事业做出了贡献一样。至于你个人买不买，那是你自己的选择。\n\n4. 什么才叫金融战\n\n今天美国国债形成的这种窘境，是由中国A股的科技牛市引起的。这就相当于我们两边都在出牌，我出了一张牌，现在导致了他的窘境。所以为什么说聪明人都在庙堂呢？\n\n啥叫金融战？这就叫金融战。你不要理解为金融战是他们老想弄我们的货币、限制我们的资本——那些东西都是微观的。\n\n他还给了个更长远的判断：\n\n不管人工智能这件事最终结果是什么样，就目前这个态势，慢慢就会消耗美国的金融力量。如果最终美国的AI没有在中国面前取得绝对领先，那美国还有什么东西是他有、我们没有的呢？既然美国所有的东西我们都有，那全世界其他国家还有什么必要去储备那么多美元？\n\n## 五、宏观风险来的时候，分析个股没有用\n\n1. 覆巢之下安有完卵\n\n你们问的都是那些微观的东西。现在的风险不在微观，而在宏观。当宏观风险来的时候，什么个股都一样，你只是韧性不同而已。\n\n2. 但正因为如此，才有一个可以操作的办法\n\n你要远离那种受危机影响比较大、弹性比较大的品种，找出受危机影响最小的品种，这才能保证你活过去。\n\n然后我告诉你，危机真来的时候，好处是：受影响大的会跌得多，受影响小的会跌得少。这个时候你做一个转换操作，把那些跌得多的再买回来——这就叫逆向交易。不是说你就不亏，而是如果有的跌90%、有的只跌50%，那你拿50%的去换90%的，你就赚了。\n\n他特别提醒要隔绝的是：以出口为主的、价格受国际影响很大的（比如大宗商品）、以及化工品这类。\n\n3. 为什么现在不能只看供需分析大宗商品\n\n你看看2008年的铜价变化就知道了。从2007年到2008年只有一年时间，铜价发生了多大变化？我问你，那种变化是由于供给和需求影响的吗？一年之内怎么可能供给和需求发生如此大的变化——而且铝的供给也变化、铁的也变化、石油的也变化？\n\n他给出当前铜真正的风险点：\n\n你现在铜的需求假设是什么？不就是AI导致的数据中心建设和电网建设吗？那我问你，这个趋势要反转呢？一旦AI的融资无以为继、算力中心建设停滞了呢？数据中心现在依赖的就是融资，它自己产生不了盈利，借不到钱就不能再建了——那需求不马上就反转吗？\n\n你现在还停留在垒库去库这些供需关系的分析上，现在的风险不在这儿。\n\n4. 两年前你判断不了今天，凭什么说今天能判断两年后\n\n去年前年那时候还没有人分析数据中心建设对铜和铝的需求，那个时候考虑的还是中国房地产低迷带来的减量——谁能考虑到AI的增量会这么多？仅仅是两年前还没有人考虑这个问题。那我现在就问你：两年前你没有考虑到今天，那你有什么理由说我今天就能预计到两年以后呢？\n\n## 六、周期股的高点特征（他终于把这块补上了）\n\n1. 高点最显著的特征：有人告诉你「它不是周期股了」\n\n周期股到高点的时候，一定会有一个故事告诉你这次不是周期了。它会有一个其他的名称——或者叫周期成长股，或者叫成长股，或者叫新能源什么股，或者叫AI人工智能股，反正它就不是周期股。\n\n总的来说就是一句话：周期股到高点的时候，他就会告诉你这种供不应求会持续下去。\n\n2. 为什么必然会有这个故事：反过来想就明白了\n\n你不讲这个故事，如果大家都明白周期一定还会跌回低点，那在高点就不会有人买。\n\n而低点是完全对称的：\n\n低点也一定会有故事告诉你它不是周期股了。道理也很简单：因为它是周期股、未来一定会涨的话，那么在低点它就没有人卖。\n\n3. 高低点是彼此的镜像\n\n低点的时候成交量低，高点的时候成交量高；低点的时候没有人看，高点的时候很热闹；低点的时候有一大堆「它不是周期股」的故事，高点的时候也有一大堆「它不是周期股」的故事。\n\n4. 周期的本质，还是那一句\n\n所有周期股最本质的原因就是供需错配：需求增加的时候供给没跟上，就是周期的高点；供给跟上的时候需求又没了，就是周期的低点。\n\n5. 养猪：最典型的周期，以及他判断拐点的标志\n\n猪肉是最典型的周期股，没有之一。没有任何一个周期现象像养猪这样这么完美。\n\n他重申了那个判断：\n\n由于上一次的超级周期，现在在经历超级波谷。这个波谷什么时候过去？我认为一定要等到一个大的公司破产，我认为那就是拐点。现在基本上已经是全行业亏损，已经满足这个条件了；唯一不满足的是现在破产的企业还太小，得需要一个大家都知道的企业出问题。\n\n他还纠正了一个流行的解释：「牛肉便宜压制猪肉是不对的。在中国的养殖行业，是猪肉压制了牛肉。国外进口的量根本不在一个量级上，不足以影响中国市场。你都是因为找不到解释周期现象的原因——就是他们拼命无计划扩产造成的。」\n\n光伏他的定性是：「现在也是全行业亏损，属于周期的底部出清阶段。」\n\n## 七、房子：为什么要买高档二手房\n\n1. 先纠正一个概念：没有新房，也没有新车\n\n这世界上就没有新车，你买到手就叫旧车了。你谁手里有新房？房产证一下来就是二手房。\n\n他还重申了新旧房不能直接比价的原因：「现在新房的计价面积和计算方法都不一样了——你原来的100平米就是100平米，现在的100平米能买原来的120。层高也变了、配置也变了，你咋比较价格？」\n\n2. 他的建议：自住就买高档二手房\n\n我劝大家别买新房，要买房子就买旧房。旧房形成稳定的社区以后，无论物业还是运行都已经很长时间了，不会有太大变化。新房那些东西都是幻象——给你整个水系、整个花，过两天房子一卖、物业一撤，啥都没有了。\n\n3. 最关键的一个指标：入住率\n\n如果这个小区所有人都入住，那你交物业也好、干啥也好，自然而然就好运营。如果只有20%的人入住，这房子很快就完了，谁去给你维护？\n\n二手房的好处是入住率你都可以看出来；新房你根本判断不了，你就是赌。\n\n他还补了句很实在的：「你现在的高档住宅里头，如果入住率特别低，你都不敢去住——一栋楼就两家亮灯，那房子我反正是不敢住。」\n\n4. 还有一层：帮你筛选邻居\n\n高档的二手房相当于帮你筛一筛邻居。中国古代讲话叫「千金买房，万金买邻」——你的邻居比你的房子重要。\n\n5. 为什么现在的高档二手房特别便宜\n\n当年这些二手房被那些倒房子的人买了很多，现在这些人都已经挺不住了。另外当时很多有钱人买了很多房子，现在看房价降了也准备卖——要不然每年那个物业费也是一笔支出。有很多高档二手房甚至都没装修，都是原貌，没有人住过。\n\n这就叫占他们便宜。他们好多年前就替你买了，一直在手里放着，然后现在卖给你。\n\n6. 顺带说到房价的现状\n\n他对「跌了25%」这种说法不认同，理由是流动性已经完全不同了：\n\n五年前你标出那个价格是可以变现的；今天你标出那个价格，只是在中介挂牌的，是变现不了的。2019年的房子是一个非常抢手的投资品，你今天挂了明天就没；现在它只是一个普通的、高价耐用消费品。\n\n现在你挂房子，一年没人问的时候太多了，而且你还得是按市场价挂。要说我还得高挂点，那压根就没有人问。\n\n他给的大账是「基本上都是腰斩」，并提醒比价要看普通二手房，「稀缺产品本身就没有什么流动性，不能拿它来比」。\n\n## 八、你不是分不清贵贱，你是斗不过自己\n\n1. 他用房子做了个最扎心的对照\n\n2021年的时候，谁不知道房子贵？都已经六个钱包了，告诉你房住不炒，告诉你三条红线——你不知道房子贵吗？但是你还在买，因为你斗不过你自己。\n\n今天是那天的镜像反过来了：今天你看到的都是「房子太过剩了、人口越来越少、出生率越来越低」。这些事五年前就有人说，你不相信；今天你突然明白这件事了。\n\n你现在谁劝谁买房子，那不跟杀他父母差不多了？才几年时间，已经完全翻转。\n\n2. 所以尺度并不难掌握\n\n你说尺度难掌握，就是因为给自己找借口，是因为你斗不过自己的心魔。当它贵的时候你就想着还能更贵，当它便宜的时候你就想着还能更便宜。其实你并不是分不清便宜还是贵，你只是斗不过你自己。\n\n3. 又一次的时间错觉\n\n你把过去的时间总是想得太短，把未来的时间想得太长。你两年前判断不了今天的事儿，但是你却老有信心判断未来十年。\n\n他举了有色做例子：「两年前没人买的东西，谁都判断不了今天。现在所有人都能判断这玩意儿还能涨十年、供不应求肯定十年，还能涨20年。」\n\n4. 他自己的一笔账\n\n我那天算了一下：如果我2019年把股票市场里的钱撤出来去买房子，和我现在买房子比——当年那个房子对于我来说，现在相当于两折都不到。因为那个时候的房子到现在腰斩，而我在股票市场里的钱又翻了好几倍。代价无非就是我晚住了五年。\n\n## 九、别羡慕那些「赚得最多」的人\n\n1. 有人问「连续六年百分之百收益合理不」\n\n你只要考虑这件事儿，你就很危险了。对于我来说是瑟瑟发抖。\n\n能不能做到？我告诉你有一种情况是能做到的——做到的方法都在刑法里面写着呢，你去抄一抄就能做到。比如老鼠仓，比如操控价格，比如内幕交易。最赚钱的方法都在刑法里面。\n\n2. 巴菲特厉害的地方不是赚得最多\n\n你看看巴菲特，不是说他赚得最多，是因为他活得最长——我说的活不是自然生命，是说在市场里面待的时间长。在历史上某一段时间比他赚得多的人多了去了，唯一不同的是后来这些人都进去了，要不就破产了。\n\n他还提醒判断任何策略都要看可观察的时间段够不够长，举了长期资本管理公司做例子：「那还他妈有诺贝尔奖得主呢，刚开始也非常赚钱，后来说亏损就亏损了，没了。」\n\n3. 一个识别骗局的比方\n\n看过《疯狂的石头》没？那里头那可乐一掏出来，上面写着中大奖了，旁边的人都赶紧跑了——你就得有那个觉悟才行。只要人家把家伙事儿一亮出来，人家马上就跑了。你还老凑上去看，你就离受骗不远了。\n\n## 十、一个被忽视的红利：住宅红利\n\n1. 买房支出下降，等于释放了别的消费能力\n\n我觉得现在中国一个主要的红利被忽视了，就是住宅红利。现在新进入社会的人在住宅上的开支占比非常小，那就会导致你在别的地方的支出比例增加。\n\n你以前看着挣得多，大部分钱都得用在买房子上。现在的孩子毕业后如果没有房贷，那消费能力其实是在增加的。\n\n他说会增加的是精神类和日常消费——旅游、演唱会、体育比赛、服饰、调味品、饮料这些。\n\n2. 但要分清「能力下降」和「必要性下降」\n\n你别看好像钱赚得少了，实际上不是消费能力在下降，只是和房地产有关的消费在下降。这并不是能力在下降，而是必要性在下降。你不买房子，你会装空调吗？会给自己家换床照吗？\n\n所以他提醒消费股要分开看：「高端白酒明显是和房地产开发离得非常近的，那你就回避一下；但啤酒就不是。」而且他强调这些因素是互相拉扯的——住房支出少是利好，但收入也少是利空，「你不能看单一因素」。\n\n3. 这些东西为什么现在便宜\n\n经过21年那次消费白龙马带来的牛市，现在还有一个回归的过程，高估值并没有完全回归到均值。再加上现在被科技的投资资金分流了，大家资金都去追逐那些东西了，所以这些东西才便宜。那你便宜的时候不买，什么时候买？\n\n## 十一、医药：他现在持有的逻辑是「防守」，不是进攻\n\n1. 先说难处\n\n最近仿制药出了不少中报，都非常不好。现在整个医药行业实际上是一个非常艰难的时候。\n\n他说难的原因是多重的：集采、医保控费、反腐，再加上前几年病人本身在减少（三年自然灾害出生率低所致）。「要重新达成平衡，是需要一段时间的。」\n\n2. 但赌的是人口老龄化，而且时点已经到了\n\n1961年出生的人今年恰巧进入65岁。59、60、61这几年出生人口很少，所以从今年下半年开始，进入65岁的人会越来越多。这个出生高峰大约持续了十年，大概到1972年。\n\n人口老龄化带来病人增加，病人增加带来用药量增加。价格不增加的话，只要它业绩不下跌，它就已经很便宜了。\n\n3. 关键是要搞清楚自己持有它的逻辑\n\n你现在买它不就是为了买韧性吗？你不就是为了防守。未来假如有一天大跌的时候，它可能跌得少，是这个理由。但如果来大牛市的话，它也会跟着涨，毕竟估值水平很低。\n\n你要知道你持有它的逻辑是什么——它就不是进攻，不是说必须得今天比明天还涨多少。它是为了防止大跌的时候损失太大。\n\n他还做了几个区分：创新药属于赌未来成长，「更像科技股」；医疗器械他不看好，因为「它有一定的使用周期，更类似周期股，而且中国医院的快速扩张周期已经结束了——这就跟你买房子家电才会好是一个道理」；耗材则和药的逻辑接近。他还提到医药的另一个属性：「它可以抗通胀，你看长时段的月K就知道，总的来说是一直攀升的，外国也一样。」\n\n## 十二、现在不是进攻的时候\n\n1. 他说得很直接\n\n现在他就不是进攻的时候。我要是到进攻的时候，我绝不手软，我只是现在没有那个信心。\n\n你那有色金属两年前你不进攻，现在你跑来进攻了——你现在进去，被人挂山顶上。\n\n对有色他现在的态度是「既不敢看空，也不敢看多」——「今年1月份就清了，后来有一段我也不看空了，但确定性还是不足」。\n\n2. 什么时候才好选\n\n现在你问我啥，我认为都不好选，因为现在市场太乐观。我告诉你啥时候好选——等到成交量只有5000亿的时候，啥都好选了。你现在成交量还这么大、融资还这么多，你选啥都是有风险的。\n\n而这和普通散户正好相反：散户正好是这个时候进来得多。\n\n3. 别被这次回调迷惑，你没见过真正的熊市\n\n就今天科技股这一次回调，6月30号之后的这次，大家觉得好像调了很多。那你和真正的熊市比，那都不算啥事儿——你成交量那么高，你那回调也无所谓，你可以卖。真正厉害的时候来的时候，那就是无量跌停。\n\n你要经历过一次，你就有恐惧心理；你没经历过的人，永远不害怕这种事。\n\n4. 他在等的是什么\n\n换句话说，我一直在等待一个机会，这机会现在没来，所以迷茫在这儿。如果退回到像2020年那种机会，那我义无反顾地杀进去，不用想。\n\n现在的问题在于，所有的东西都是那种风险收益比不够。\n\n他还给出了那个「镜像」判断：\n\n现在这场博弈的赢家已经出来了，谁挣钱这都知道了。问题是究竟谁为这事儿买单，现在还没找着人。所以你尽量不要站在买单那个位置上——等买单的人都确定完了，你就可以再进攻了。\n\n## 十三、几条零散但值得记的\n\n1. 期权不适合散户\n\n期权是为了机构、为了解决流动性危机所买的保险。机构进出一个标的非常困难，所以他要用期权来对冲。你散户就那点东西，你对冲啥？\n\n你作为散户，有什么能力去评估这个东西的隐含价值？你究竟应该多少钱买、多少钱卖，你知道吗？那不就是赌吗？\n\n他说这类复杂衍生品都劝大家别碰，还提到当年A股的权证、港股的涡轮——「大家也都是赌得不亦乐乎」。\n\n2. 救市资金退出，是给你送便宜\n\n有人煞有介事地分析「为什么某某资金要退出某个公司，是不是不看好这个行业了」——那是一个结构性的退出，跟你什么公司有什么关系？\n\n这些人根本不在乎多少钱价格卖，我就是要退出，这事完事儿了。那就是甩卖——那不正是你占便宜的时候吗？没有他们卖，哪有这么低的价格？\n\n3. 他最怕听到的话\n\n我到时候不是在乎你们说会不会涨，我特别害怕的是，到时候你们给我讲故事说「不能卖了」——老师你不懂，这个不可替代、能拿十年。你给我讲的东西，都他妈是我的词。\n\n4. 他自己的收尾\n\n你就等着就完了呗。它天天给你赚钱、给你分红，然后你就等着，等哪个傻子来了给你讲故事的时候，你就卖给他就完了呗。\n\n我讲的就是评书，大家别认真。所有的东西都是纯属虚构，如有雷同。","toc":["一、当下最危险的地方：大家都跑到了同一边","二、猎人站在哪，取决于猎物跑到哪","三、别替美国操心：他的办法比你想的多","四、这场的重头：中美AI竞赛与科技牛市的真实作用","五、宏观风险来的时候，分析个股没有用","六、周期股的高点特征（他终于把这块补上了）","七、房子：为什么要买高档二手房","八、你不是分不清贵贱，你是斗不过自己","九、别羡慕那些「赚得最多」的人","十、一个被忽视的红利：住宅红利","十一、医药：他现在持有的逻辑是「防守」，不是进攻","十二、现在不是进攻的时候","十三、几条零散但值得记的"],"url":"https://xueqiu.com/2573414707/407226239","chars":8962},"topics":["输家是先确定的"]},{"date":"2026-08-20","bili":{"title":"老木匠 2026年8月20日直播文字稿","text":"## 一、美国财政部回购美债：不是救市，是\"苦肉计\"\n\n昨天晚上美国财政部下场回购美债，把原来一次 20 亿的回购上限提高到 40 亿。这件事本身特别有意思，但大多数人理解错了方向。\n\n第一，这件事不叫扩表。 扩表是美联储资产负债表增加，缩表是减少。财政部的操作本质是财政专用账户（TGA）里取钱买国债，顶多有微弱扩表效应，但严格说不是美联储意义上的扩表。\n\n第二，它解决不了长端利率问题。 这个回购工具当年出台，是为了应对国债市场\"暂时的流动性缺失\"——也就是没人买、市场冻结。但现在的美国国债根本不是流动性问题。昨天财政部还新发了 20 年期国债，结果新发债的收益率比二级市场现有收益率还要高。等于一面干预市场压价格，一面以更高利息借钱。这就是典型的庞氏融资特征：借新债还旧债，而且借的新债利息比旧债还高，为了维护表面信用，资金成本越滚越贵。\n\n第三，也是最关键的一点：贝森特明知没用为什么还要做？ 我思考了一晚上，结论是——他把政治压力踢给了美联储。\n\n现在美元的博弈，本质是美国内部利益集团的博弈，核心是\"老钱\"和\"新钱\"的博弈，具体表现为财政部和美联储站在利益两端。贝森特作为政治家，总得做点什么。他明知回购长债对压低收益率作用不大，但还是把能动用的力量全使上，然后摆出\"我能做的都做了，剩下就是你的事\"的姿态。\n\n打个比方：发大水组织捐款，一个乞丐抖出饭缸里仅有的钢镚全捐了，然后盯着巴菲特。所有镜头对准富翁，压力就来了。这不叫道德绑架，这叫政治压力。特朗普现在干的就是这个——掂了掂饭缸把钢镚倒出来捐了，用期盼的眼神瞅着鲍威尔。球已经踢到美联储脚下了。\n\n所以这件事不是没用，它的用处就是转移政治压力。原来民众的火力都在\"财政部该缩减开支、减少赤字\"，现在贝森特玩了这手，焦点就转向美联储：你还敢不敢缩表？还敢不敢加息？\n\n## 二、美债长端利率走高的真正原因：不是流动性，是\"抢钱\"\n\n很多人把美债收益率走高归结为流动性问题，这是错的。真正的原因有两个：\n\n一是投资者结构变化（前面讲过）： 现在卖美债的以国外主权基金为主，他们对收益率不敏感——因为担心美元贬值、担心被限制卖出，所以再低的价格也要卖。而买的人变成了美国国内商业机构，他们对收益率极其敏感，必须给够利息才买。这是结构问题，不是流动性问题。\n\n二是 AI 融资在和美国国债\"抢钱\"。 这才是今年新出现的关键变量。\n\n美国国债发行时，实际上是在和 AI 大公司发行的债券竞争。市场上的闲钱就这么多（美国不是储蓄型社会，闲钱并不多），钱往利息高的地方走。以前 AI 公司靠互相投资就能解决烧钱，从今年开始烧钱越来越快，内部解决不了了——谷歌、各家 AI 大公司都在历史性地大量发债。这就和美国发国债构成了竞争性卖出。\n\n而雪上加霜的是：美联储不再 QE 了，不再下场买国债提供流动性。外国主权资金在卖、AI 大公司在发债吸走资金、美联储还在缩表（持有大量美债，缩表就是卖出），三家一起来竞争，国债收益率能不涨吗？\n\n所以格局很清楚：贝森特的苦肉计把球踢给鲍威尔，鲍威尔现在压力极大。如果这种局面持续，别说是缩表，只要不重新 QE，美债一样会崩；而美债崩的时候，美国 AI 融资也会跟着崩。\n\n这就是为什么昨天晚上黄金、贵金属突然都涨了——国际市场重新计价。原来黄金是按\"你一定加息、一定缩表\"来定价的，现在大家开始怀疑鲍威尔到底还能不能紧缩。计价逻辑变了，价格就变了。\n\n## 三、护城河：怎么判断一家公司值不值得拿\n\n讲完美债，回答一个网友关于某医药股（资产减值、出售公司亏损）的问题，顺带把\"护城河\"这套框架讲透。\n\n先看这家公司本身： 它利润下降很正常，但营业收入在增加，利润率变薄是所有医药行业面临的共同问题——暴利时代结束了。它靠的不是产品赚钱，是靠制度赚钱，几乎是垄断行业。\n\n举一个最直观的例子：医院做手术，麻醉药的瓶子丢了，院长会告诉你掘地三尺也得找出来。为什么？因为精麻用品（精神类、麻醉类药品）按毒品管理，一级经销商有严格追踪，药盒去向都有记录。这种生意，民营企业想做？想都别想。这就是护城河——没人能替代，你只要确认它不暴雷，就可以拿着。赌的是人口老龄化，这是以五年计的因素，不是一年两年的事。\n\n护城河有几种类型，一定要记住：\n\n1. 品牌。 茅台、高端白酒、LV——谁都能造酒，但我造出来的是你的百倍，还供不应求。品牌撑起的护城河。\n\n2. 制度。 刚才讲的精麻药品经营资质，别人进不来，这是制度造成的壁垒。\n\n3. 自然垄断。 供水厂、污水厂，一个地方只能有一家，这叫自然垄断。注意：矿产资源不算护城河，你能挖我也能挖，那只是时间错配。\n\n4. 规模效应 / 网络效应。 阿里、腾讯、美团、抖音、Windows——客户习惯养成后，替代成本极高，粘性极大。\n\n5. 技术 / 专利。 最不可靠的护城河。技术传播极快，原子弹的壁垒都保持不了五十年，可口可乐的配方壁垒却能保持一百年。所以技术的护城河是最浅的。\n\n结论： 分析自己持有的标的，起码要能找到一个护城河，哪怕很弱。对于什么护城河都没有的，要慎重。\n\n---\n\n声明：老木匠自称讲的就是\"财经评书\"，一听一乐，别太较真。以上分析从财务报表和业务角度讲方法，不代表推荐任何股票。","toc":["一、美国财政部回购美债：不是救市，是\"苦肉计\"","二、美债长端利率走高的真正原因：不是流动性，是\"抢钱\"","三、护城河：怎么判断一家公司值不值得拿"],"url":"https://www.bilibili.com/opus/1238486581827862545","bv":"BV1yFbf6EEDX","minutes":0,"chars":2167},"ai":{"title":"老木匠·2026年8月20日：庞氏融资与什么才算护城河","text":"## 一、美国财政部下场回购美债：这件事到底有没有用\n\n1. 先说清楚它是什么\n\n他说这不是新工具，只是把回购上限大幅提高了；而且这也不属于严格意义上的扩表——「扩表指的是美联储的资产负债表增加，财政部这个动作如果是从它在美联储的TGA账户里取钱，会有一点扩表效应，但本质上不是扩表」。\n\n2. 这个工具本来是用来解决什么的\n\n这个回购工具当年出台，是为了应对国债市场暂时的流动性缺失——就是没有钱了，暂时没人买了。所以它只能解决国债市场的短期流动性问题，解决不了长期的国债定价问题。\n\n3. 但现在的问题根本不是流动性\n\n现在的美国国债依然是流动性非常好的工具，根本不存在没有人买的问题，买的人还很多。\n\n他把8月18日那堂课的结论接了上来：\n\n卖的人主要是外国主权基金，他们对收益率不敏感——再低的价格他也要卖。他们的核心考量是两点：一是担心美元贬值，二是担心哪天你不让我卖，所以趁着现在还能卖，我现在就卖。\n\n而买的人是美国国内的商业机构，他们对收益率非常敏感。所以这压根不是一个流动性问题，是一个价格问题——你只要降到一定的价格水平，有的是人买。\n\n所以他的判断是：「美国财政部往市场投放的这些流动性，对整个市场的定价体系没有太大影响。因为这个定价的变化不是市场缺钱，而是投资者结构在变化。」\n\n4. 被大家忽略的那条新闻：新债利息比旧债还高\n\n他说同一天美国财政部还拍卖了新的20年期国债，出现了一个很有意思的现象：\n\n新发行的20年期国债的收益率，要比二级市场上20年期国债的收益率还要高。就是说他一边在干预市场，同时还在借钱，而且新借钱的成本比他要维护的那批债还高——他借了更高息的钱，来干预现在的国债市场。\n\n他直接给了定性：\n\n借新债还旧债，而且新债的利息比旧债还高，就为了维护旧债的价格——这就是庞氏骗局的最典型特征，这种融资就叫庞氏融资。所以这件事本身暴露了美国财政部的虚弱。\n\n## 二、那贝森特为什么还要做：他把球踢给了美联储\n\n1. 他先否掉了几种流行解释\n\n有人说是在赌短端利率下降，有人说是「有人信就有用」。他说这些「也可能有这方面的考量，但不是基本的」。\n\n2. 他自己想明白的答案\n\n作为贝森特这种华尔街的老鸟，他一点不明白这个道理是不可能的。他是不得已而为之，也是明知其不可为而为之。\n\n我认为他最主要的考量，是要把政治压力推给美联储。\n\n他把这件事放回美国内部博弈的框架里：\n\n美联储和美国政府、包括财政部并不是利益完全一致的，他们可以说是站在利益的两端。美国的老钱和新钱的博弈，实际上就是财政部和美联储之间的博弈。\n\n财政部做这件事，我就这么一点力量我都给他使上了，然后还不行——这样民众的压力就来到了美联储这一边，或者你也可以说是把球踢给了美联储。\n\n3. 他打的那个比方\n\n就相当于某个地方发大水，大家组织捐款，这时候来了一个乞丐，抖一抖自己饭缸子里的钢镚，把仅有的钱都捐了，然后回过头来一脸期盼地看着那些富翁。这个时候所有的照相机都对准了富翁，他的压力就来了。\n\n这也不叫道德绑架，这就是政治压力。富豪心里一顿窝火——你全捐了就那点钱，我要全捐了那是多少钱？所以这时候你捐多少都是少，因为你的比例不对。\n\n4. 所以现在压力全在美联储这边\n\n他原本是准备缩表的，那你说他现在还缩不缩？如果美联储也在卖出国债，那将会是一个什么局面？外国主权资金在卖，AI公司在发投资级债券，如果这时候美联储还在缩表——三家在竞争，那国债收益率不得涨疯了吗？\n\n现在加不加息这事都已经不重要了，重要的是美国能不能继续QE。如果这个局面持续下去，别说是缩表，只要不扩表，美债也一样崩。而美债崩的时候，一定带着美国AI的融资也变得非常困难，它也会崩。\n\n他也提醒不要短期化理解：「你一说崩，有的人就好像明天就该崩、明天没崩就不对。崩也是一个非常长期的过程。」\n\n5. 一个容易被忽略的原因：AI在跟美国国债抢钱\n\n现在美国国债在发行的时候，实际上是在和那些AI公司发行的企业债竞争。市场上的钱就这么多，他俩一竞争，那就是谁给的利息高我就借给谁。\n\n他说AI公司前几年靠内部互相投资就能解决，「但从今年开始烧钱越来越快，靠互相投资已经解决不了了，所以你看到那些大公司都在发行大量债券，这在历史上是非常匪夷所思的」。而钱之所以紧张，根子还是：\n\n美联储不再QE了，不再花钱去市场上买国债了。\n\n他还顺手解释了当晚贵金属和有色为什么突然涨：\n\n原来黄金是按照「一定会缩表、一定会紧缩」来计价的。现在你到底还能不能缩表、还能不能加息都成了问题，那我就要重新计价。\n\n## 三、什么才叫护城河\n\n这是他这场后半段回答提问时讲的，他自己把它归纳成了几类。\n\n1. 最深的两种：品牌和制度\n\n谁都可以造酒，但我造出来的能卖到你的100倍，你卖不出去，我还供不应求——这是由品牌造成的。同样是生产包，人家的包可以卖到你的1万倍：你卖200块钱，我能卖20万。\n\n还有一个就是靠制度造成的：我能进，你就进不了。\n\n他用了一个特别直观的例子来说明制度性护城河：\n\n你现在能不能开个公司生产高铁的车头卖出去？你现在就是马云，你能不能去投资一个生产火车头的公司？不能吧——这就叫护城河，他挣多少钱，你也不能进去。\n\n反例是新能源汽车：「地上跑的汽车谁都可以生产，阿猫阿狗都会生产，你看那几个做手机的厂商现在都生产汽车——它有啥护城河？」他说这就是巴菲特讲的那个意思：「你挣点钱，外边有一大堆人架着枪炮想把你这个城堡打开、都想进来。」\n\n2. 第三种：自然垄断\n\n你比如说自来水厂、污水厂这种东西，它就叫自然垄断——因为一个地方只能形成一个。你不能说这家给我家安个龙头、那家也给我家安个龙头。\n\n他同时纠正了一个常见误解：「矿产资源没有护城河，你能挖我也能挖，那只是一个时间错配的问题——哪个东西是全世界仅有的矿？」\n\n3. 第四种：规模效应（网络效应）\n\n这个东西一旦形成网络，它的替代成本会变高。别人再来其实很难进入这个行业，因为刚开始起步会非常贵；而它已经形成规模，整体销售成本会非常便宜，你没法和他竞争。\n\n他举的例子是那些已经养成用户消费习惯的大平台，以及操作系统——「这种软件的迁移成本是非常高的」。\n\n4. 最不可靠的一种：技术\n\n这是他这段最反直觉的判断：\n\n大家可能都认为技术护城河最可靠——技术护城河最不可靠。技术的传播是非常快的。如果技术护城河那么可靠的话，那全世界现在就应该只有美国有原子弹。你说原子弹的保护是不是最严格的？他最后都一样传播。\n\n原子弹都保持不了50年的壁垒。但是可口可乐保持壁垒可以保持100年——你想一想，什么技术能保持100年的壁垒？\n\n5. 所以他给的实操要求\n\n你在分析自己持有的标的的时候，起码要找到一个护城河。即便这个护城河很弱，你也要找到一个。对于什么护城河都没有的，我劝大家要慎重。\n\n## 四、他怎么用一份中报做判断\n\n有人问到一份财报，他没有评价个股，而是把自己的思路完整讲了一遍，可以当作方法示范：\n\n它本身就不是一个短期投资的东西，你赌的是人口老龄化——这个不是一天两天的因素，都不是以年计的，是以五年计的。所以你现在只要看一眼它没有爆雷，大概知道就行。\n\n而且它的利润下降是很正常的，我倒觉得它下降得不多。那你按照下降完的这个水准，看看它的市盈率是多少，再去看一看市盈率的分位值是多少。它要是不下降的话，它能给这么低的估值吗？\n\n他还提醒要区分「利润率」和「营业收入」：\n\n它现在降低的实际上是利润率——挣钱越来越薄了，但它的营业收入实际上是在增加的。你现在所有的医药都面临着利润率变薄的问题，原来那个暴利时代已经结束了。\n\n然后他把落点放回到护城河上：\n\n你要知道，它不是靠产品赚钱，它是靠制度在赚钱。你就想一想五年以后是不是这活还得他干，再想一想这个业务会不会萎缩，会不会随着物价上涨它的价格也会增加。\n\n## 五、他自己的说明：这是「财经评书」\n\n我不是这方面的专家，也不是这方面的学者。你也不要拿我的意见当成什么权威意见——你就拿我当讲评书，道理是一样的。以后你就理解我，这个就叫做财经评书。\n\n所以你就是一听一乐就完事儿了。你别跟我非要较真说「那我回去研究，然后再跟你掰扯」。","toc":["一、美国财政部下场回购美债：这件事到底有没有用","二、那贝森特为什么还要做：他把球踢给了美联储","三、什么才叫护城河","四、他怎么用一份中报做判断","五、他自己的说明：这是「财经评书」"],"url":"https://xueqiu.com/2573414707/405872428","chars":3376},"topics":["庞氏融资与什么才算护城河"]},{"date":"2026-08-19","bili":{"title":"老木匠 2026年8月19日直播文字稿","text":"## 一、开场：今天不讲正经，但别对下跌掉以轻心\n\n今天创业板跌了差不多百分之五，市场挺好看、挺热闹的。我今天不讲正经内容，等哪天再想怎么给大家讲周期反转。\n\n但我先提醒一句：别看今天科技股大跌、有些标的还在涨，就掉以轻心。如果这种大幅下跌持续，所有标的都会受影响；等影响结束，标的会分化——有些再也回不来，有些会涨得更高。关键是你能不能经历这次波动，这也是我一直强调的：今年最重要的是保住本金。\n\n所谓\"过不去\"，就是亏光了。股市里的\"死亡\"有两种：本金亏光，或者被市场彻底打服、以后再听人谈投资就觉得是要抢你钱。不上杠杆、不追高，其实很难亏光——这么说的人基本都没经过熊市。五粮液从四百跌到二百算不算最高？不算，现在七十。拿着紫金、铜陵死扛可行吗？可行，只要你不怕亏就可行，肯定不枪毙你。\n\n我现在每天最大的兴趣，就是看这场戏怎么收场。昨天说会 V 起来，结果没有，今天再看下午能不能 V 回来。\n\n## 二、应收账款多，不等于有风险\n\n昨天有人讨论财务报表里的应收账款，觉得应收账款多就有财务雷。这个问题值得讲清楚，我分几层说。\n\n### 1. 第一种危险：有退货选择权的\"虚假销售\"\n\n普通的应收账款多并不危险。真正危险的是：货发出去了、钱没收，而且买家保留了退货权——这种销售本质上不是真销售，更像代卖。它带来的问题是，这个季度看起来销售了，下个季度可能全退回来，销售就没了。\n\n这是看财务报表最大的风险点：一个公司大部分销售额都以这种方式实现，你对它记账的收入就要存疑——它到底是真卖出去了，还是只是把货堆在渠道里？这种退货选择权你在资产负债表上看不到，都在补充合同里。因为记了收入，利润表上有利润，但对应的经营现金流里\"销售商品收到的现金\"一定是空的——利润是虚的。\n\n最典型的就是高端白酒对经销商的做法。今年五粮液披露的就是这个，但当年是卖方市场、供不应求，货到经销商手里马上卖掉回款，所以没问题；一旦进入买方市场，经销商卖不出去，就可能退货，当年的销售口径就全成了假的。这不是五粮液的问题，是会计准则修改造成的记账口径变化，我拿它只是讲报表逻辑，不针对任何个股。\n\n### 2. 正常的账期，也会产生应收账款\n\n很多行业 to B 生意天然有账期——你给批发商货，要求他三个月或六个月后付款，这就会产生应收账款。这是交易惯例，不用大惊小怪。\n\n所以看到应收账款多，先别慌，要分析它是怎么形成的：是造假/有退货权，还是正常的交易惯例？\n\n### 3. 关键看债务人是谁（应收账款的质量）\n\n应收账款也是\"应收款\"，质量取决于债务人的信用。你在银行的存款法律上也是应收款，但会计记为现金等价物，因为银行信用好、不会不给你取。\n\n举两个极端：发电厂卖给国家电网的应收款，坏账可能性为零——国网净资产比工商银行都多。美国国债也是应收款，美国政府还不还得起？它靠发新债还旧债，但只要它\"还得起\"，你就不需要它真还。一句话：能还得起的债不用还，还不起的债也永远还不起。债的核心不在\"还与不还\"，在信用。\n\n所以，如果一家公司的应收账款债务人都是国家电网这种财务稳健的主体，这笔应收款其实就是类现金。银行还有\"应收账款融资\"这个工具，你把它抵押给银行就能拿到钱。\n\n反过来，对地方政府的大量应收款就要警惕——现在地方财政困难，所以做政府生意、账上堆满地方政府应收款的公司，估值都不高。\n\n### 4. 同时看应付账款：你在产业链里的位置\n\n应收账款多少，反映的是你在产业链里的地位。\n\n应付账款少、应收账款多：你在上下游都被挤压，下游欠你钱、上游逼你付款，现金流紧张，只能增加贷款、财务费用上升。这种\"苦逼生意\"不能买。\n\n应付账款比应收账款还多：说明你挤压上游比下游挤你更狠，在产业链里处于强势。下游欠你的钱，你用更长的账期欠着上游，反而形成现金沉淀，不需要贷款。\n\n所以看应收账款，要同时比对应付账款，看谁多——这能判断一家公司在整条产业链里的位置。谁也别拿个股来套，我讲的是普遍规律。\n\n## 三、木工闲聊：崖柏、黄花梨与家具\n\n今天不讲正经，聊点木工。我盘的是别人送的崖柏——太行山悬崖石头缝里长的柏树，环境极端恶劣，长得奇形怪状。它活着时木质慢慢腐烂，死了以后木质继续烂，只剩带香料和油脂的部分，不怕水不怕虫。崖柏没法人工繁殖，随便一小块数年轮都是几百年，长成材最少两百年，这生意谁做得起？这跟黄花梨一个道理：不是种出来那棵树就叫黄花梨，得中间长出带油脂的\"芯儿\"才叫，树倒后外层没油脂的木质被白蚁吃掉，芯儿露出来才算成才。\n\n名贵木种都靠油脂。榆树不值钱，因为它鬃眼大、没油脂、表面糙。真正的好家具不刷漆、只打蜡——漆是在木头外形成膜，蜡是渗进木头里。\n\n别迷信手工和榫卯。现在木工机械比手工精得多，胶也比榫卯结实。中国的榫卯结构是按当年的工具（锯、凿、刨）和劳动效率设计的，讲究强度、不讲究精度；今天用机床加人工智能设计榫卯，力学结构更科学。凡事坚持第一性原理：榫卯是怎么来的，就怎么看它。\n\n花梨木中国已经绝种，现在最名贵的是海南黄花梨，论克卖；市面多是越南、缅甸花梨。普通老百姓能买到小叶紫檀家具就已经非常名贵。\n\n我判断未来最好的家具是铝木结合：结构件用铝（精度、稳定性最强），饰面用木头。铝的问题是没亲和感，钛有亲和感但稳定性不如铝。真正好看的传统家具，还是铜木组合——古代家具多用铜件，年久氧化变暗变绿，每年春节前有个\"擦铜\"的仪式恢复光亮。\n\n北美黑胡桃木质细腻、颜色好看，配铜做装饰的实木家具都不错，就是也挺贵。\n\n## 四、收尾\n\n今天就讲这么多，主要把昨天大家讨论的应收账款白话白话。你们去观察我让你们观察的标的，今天这市场好看，自己去看热闹。明天见，没话题我就跟你们聊木匠活——不过我这种\"二五的木匠\"，理论水平还行，真干活就露馅了。谢谢大家，点赞的、送礼的我都谢了。","toc":["一、开场：今天不讲正经，但别对下跌掉以轻心","二、应收账款多，不等于有风险","三、木工闲聊：崖柏、黄花梨与家具","四、收尾"],"url":"https://www.bilibili.com/opus/1238123214745370641","bv":"","minutes":0,"chars":2403},"ai":{"title":"老木匠·2026年8月19日：应收账款该怎么看","text":"## 一、开场的提醒：这次波动，你能不能过去\n\n1. 别因为「有些标的还在涨」就掉以轻心\n\n如果这种大幅下跌持续的话，那么所有的标的都会受影响。当然这种影响结束之后，标的的表现就会分化——有些东西就不会再回来了，但有些东西可能会涨得更高。所以关键问题在于你是否能经历这次波动。\n\n保住你的本金，今年你要保住你的本金。\n\n2. 股市上的两种「死亡」\n\n死亡有两种，一种是肉体死亡，一种是精神死亡。在股市上也一样：第一，你的本金已经亏光了；第二，你已经被市场彻底打服了——再有人跟你说投资股市，你会觉得他要抢你钱。\n\n有人说「不上杠杆不追高，也挺难亏光的」，他的回应是：「你这么说的人，基本上都没经过熊市。」他还举了个例子提醒什么叫「追高」——某白酒标的从400跌到200的时候买算不算追高？「不算最高。现在70块钱。」\n\n3. 所谓「盈亏同源」\n\n你要保持自己的有知无畏，你在选择标的上就要慎重。否则的话你就总是一惊一乍的——你选的东西就是风险极高的东西，还哪来的无畏？\n\n## 二、这场的正课：应收账款到底该怎么看\n\n他说是因为看到有人在讨论「应收账款多是不是就有风险」，觉得有必要讲清楚。他的结论是：应收账款多本身很正常，真正要看的是三件事。\n\n1. 先说最危险的一种：带退货选择权的销售\n\n有的时候他实际上是买家保留着退货权的这种销售——我卖不了再给你退回去，我有这样的权利。那么这种销售实际上就不是真正意义上的销售，其实更像是代卖。\n\n他说这种情况非常虚弱：\n\n你这个季度看着是销售了，下个季度他们都退回来了，你就没有销售。\n\n而且这种退货选择权在报表上是看不到的——「因为都是在补充合同里面才有，它叫选择权，这种损失是或有发生」。他给的识别方法是看现金流：\n\n他既然记了应收款，那在经营现金流的进项里面，「销售产品和服务所收到的现金」一定是没有这笔的。所以利润表上有利润，但这个利润是非常虚的。\n\n他用高端白酒举了个例子：当年是卖方市场、供不应求，货发到经销商手里就算完成销售，即便没给钱也没问题，因为他马上就能卖掉回款。「但一旦进入买方市场，经销商拿到手的货卖不出去，就会出现他没钱给你，甚至有一天他不想干了、货都退给你。」\n\n2. 第二件事：看应收账款的债务人是谁\n\n严格意义上来说，你在银行的存款也是应收账款。但我们在会计记账上并不把它记为应收账款，而是记为现金等价物——那是因为银行的信用好。\n\n所以应收账款的债务人的信用状况，对这笔应收账款的质量是有非常大影响的。如果债务人都是财务非常稳健、没有任何信用损失风险的主体，那这笔应收账款其实就是类现金。\n\n他还顺带讲了个很有意思的道理：\n\n能还得起的债就不用还，还不起的债也永远还不起——所以债是不用还的。最典型的就是美国国债：你只要知道他能还得起，就不需要他还了。\n\n他举了个更好懂的：工商银行如果贷款给一家财务极稳健的大型企业，「你说工商银行希望不希望他把这笔钱还了？还完了我还得再贷给你，你最好永远也别还，一直给我利息就行了」。他也提醒这有前提——「超出他的信用了，那就得还」。\n\n至于债务人的分级，他讲得很直接：「地方政府不算是优质的债务人。而央企也分三六九等，得是那种经营现金流特别好、财大气粗的央企。」这也是为什么专门做地方政府生意的公司估值普遍不高。\n\n3. 第三件事：把应收账款和应付账款放在一起看\n\n应收账款和应付账款，实际上代表你在整个产业链里所处的地位是什么样。\n\n如果一个公司应付账款很少、但应收账款很多，说明你在整个产业链里处于上下游的挤压地位——下游可以不给你钱，但上游你必须得给人钱。这会导致你的现金流很困难，你就要增加贷款，财务费用就会增加。\n\n他管这种叫「苦逼生意」，并说「这样的行业你千万不能买」。反过来：\n\n如果他的应付账款比应收账款还多一倍，那说明这个公司在产业链里面处于强势——虽然下游在挤压他，但是他挤压上游更多。他不但不需要贷款，反而会形成现金沉淀，因为上游相当于在给他融资。\n\n他还解释了为什么消费类行业的应收款都很少：「B2C是对个人的，个人一般不会形成应收款，不会对你形成资金挤压。」\n\n4. 顺带：普通的应收账款为什么不值得大惊小怪\n\n任何B2B的生意，就是厂商对厂商的生意，都是有账期的，没有一手交钱一手交货这种事。所以形成应收账款是一个很正常的现象。\n\n他也说了会计上的常规处理：根据谨慎性原则，应收账款本来就要按一定比例计提减值准备，这在报表分项里能看到，「这个不重要」。","toc":["一、开场的提醒：这次波动，你能不能过去","二、这场的正课：应收账款到底该怎么看"],"url":"https://xueqiu.com/2573414707/405872314","chars":1849},"topics":["应收账款该怎么看"]},{"date":"2026-08-18","bili":{"title":"老木匠 2026年8月18日直播文字稿","text":"## 一、开场：关于\"打父母\"争论的不适\n\n大家早上好。我本来昨天就想直播，结果被一群人讨论\"如何打父母\"给恶心到了，就不想播了。昨天确实震碎了我的三观——居然有人说自己的父母\"欠抽\"，\"欠抽\"这个词和\"父母\"放在一起让我非常不舒服，下面还开始讨论什么情况下才欠抽、什么情况下不欠抽。这种舆论让我感觉非常恶心、生气。我认为所有这些言论都是对中国文化的亵渎。\n\n有人说，父母有混蛋的父母，这还用说吗？从人的统计规律上，混蛋的父母、混蛋的儿子到处都是。但你在谈论的是一种社会现象，不能用个例去讨论这个问题。如果你真摊上混蛋的父母，那肯定是不幸，但你也不能用\"欠抽\"这种方式来解决。昨天有个人说南北方有差异，我不愿意说地域差异，但实际上南北方差异常非常大。\n\n## 二、南北父母子女关系的文化差异\n\n父母子女关系比较淡漠，在哪一代比较突出？就是在长江中下游这一带，长三角这一带，浙江、江苏、安徽的江南部分，尤其像上海这个地方，父母子女关系非常淡漠。我觉得这可能跟这些地方的人更注重个体有很大关系，也可能是因为他们接受了更多的外来思想。不同地域在这个问题上的差异非常大。长江以北甚至黄河以北要好的多，但黄河以北又有别的情况。\n\n江浙一带父母子女关系都比较淡，就是明算账的。这是这一代人的习惯。上海也是这样，朋友之间也都明算账。父母子女之间明算账，必然带来情感比较淡，因为一切靠经济衡量。这和普通人想法不一样——在北方，父母子女之间的关系和普通人之间的关系区别很大；在南方，他们认为和子女、和父母的关系，与和别人之间的关系没有太大区别，唯一不同的就是法律规定了父母有抚养义务、子女有赡养义务。他们实际上是从法律角度理解父母子女关系，和北方完全不一样。北方更注重亲情。\n\n广东这一带更像签订那种合同，不是靠亲情维系。这件事在东北就很少——东北的父母子女关系基本都靠亲情维系，很少有人说父母子女之间还算账，放在东北就很难理解。广东宗族观念比较重，对中华文化的传承比较传统，受外来打扰更少。粤菜都应该是中国古代的美食，因为广东人都是从北方过去的，战乱过去，都是客家人。\n\n你从法律角度、按西方舶来的个体文化角度理解亲情，会觉得非常累，因为亲情没有一个标准，啥叫好啥叫不好，很难量化。所以最好从法律上像定合同一样。\n\n我见过很多上海父母和子女之间的算计和计较，在东北非常少见。在东北，如果父母和子女之间算账，会伤父母的心，和南方接受的那么自然完全不同。这在国外是很自然的。越受外来文化影响重的地区，这个东西就越淡漠。广东相对要好得多，和北方差不多。\n\n这种事哪儿都有，但各地表现的概率不同。子女打父母这种事我听过，但在东北非常罕见，不仅罕见，只要有就会发生，大家都会知道，这个人在社会上的地位就完了。所以昨天后来我把那些东西都删了，实在让我看着非常不舒服。删了以后我想到了我父亲，还写了篇文章，但基调比较哀伤，后来也删掉了——大家是来看怎么投资的，不是看哀伤的，没必要留着。但我觉得要不写这么一篇文章，心里这股亵渎和恶心的劲儿就过不去。\n\n昨天有个人在我底下说\"你晚上喝多少酒啊\"，这种说话模式让我非常反感。搞了自媒体你就知道，人真是分三六九等。好了，不聊这些闲事了，给大家讲讲昨天的美债。\n\n## 三、今日主题：美债收益率上涨\n\n我今天就想给大家讲讲美债的问题。昨天的三十年期美债收益率又上升了一些，收益率创新高这件事本身就值得关注。我早上给大家转发了一条财联社的新闻，大家可以看一下。\n\n大家知不知道这一轮美债收益率上涨？不说收益率上涨，就说美债价格下跌——大家知道美债收益率和美债价格是个反向关系吗？收益率上涨就代表价格在下跌。先建立这个联系，我讲的时候你才好跟，要不然一会上涨一会下跌容易糊涂。说价格的时候就是下跌，说收益率的时候就是上涨，它俩是一回事，总的来说说明债的价格处在下降通道中。\n\n为什么会出现这种现象？这和美国是否加息、实际利率是否增长的关系，还不是——它不是由于美联储加息造成的。专门有人讲过，我只是复述别人的观点，这个观点我比较认可。\n\n## 四、美债的\"储备\"属性\n\n这种储备，不仅仅像我们国家作为外汇储备，有的国家干脆把它作为自己央行发行货币的准备金，就像黄金一样。你央行发行货币的时候要有一定的实物储备。虽然现在全世界都进入法币时代，央行发行本国货币实际上不需要实物储备，但由于历史传统，各国央行还是保留一部分储备，有的是黄金，有的是投资国外的债券和外币。\n\n美国国债的购买者有很多是外国的主权基金。这些主权资金——不叫基金，是主权资金——主要是拿美债作为储备，实际上相当于拿的是美元。因为他拿美元的时候没有任何利息，你不能把自己的储备美元存在外国银行，大家一定要理解。你如果把美元存在商业银行，商业银行是有破产风险的，就像老百姓普通存款也有风险，只不过用国家背书，你认为风险不大，但风险是客观存在的。\n\n现在有很多中小银行给的利息比较高，你存的时候一定要注意安全性。中小银行出现挤兑危机时，都会有大银行来接手，但《商业银行法》并没有规定银行不能破产，银行也是可以破产的。现在不同就是有存款保险制度，银行破产时你在一个银行里的存款有五十万额度享受保险，只有五十万。\n\n最好的就是美国国债。大概四十万亿美元的美国国债里，外国投资者大概在九万亿美元左右。这些国外主权资金买入美国国债有一个很重要的特点：第一它是作为储备存在的；第二它要求的是流动性，需要的时候美债必须随时能变现、马上换回美元现钞。因为对他来说买美债实际上是为了存现钞，现钞拿着没有收益，存在银行有风险，所以他只买美债。\n\n对于国外的主权资金投资者来说，主要目的第一是储备，第二是最多考虑流动性。这就导致他们对美债的收益率并不敏感，他不是看收益率来买美债的，不会因为收益率变高就增持美债。\n\n那我问大家一个问题：最影响外国主权资金持有美债信心的因素是什么？你作为一个外国主权资金，持有美债，什么东西会导致你不想持有？别扯美国国力，从经济角度上来。\n\n美债本身就是美元的化身，第一个要考虑的是美元的购买力是否下降。如果美元购买力下降，无论持有美元还是美债，储备都在减少。美元的购买力下降最主要的表现是什么？是美国国内的通货膨胀。当美国国内开始出现通货膨胀，意味着美元购买力在下降，意味着在美国买东西开始变贵了。美国国内通胀也表现为以美元计价的国际大宗商品价格上涨。\n\n## 五、美元贬值与黄金\n\n所以卖出美债而买入黄金，主要考虑的就是美元贬值、购买力降低。那为什么不全抛了买黄金？你需要考虑平衡——你在国际上不能花黄金，只能花美元。美元作为国际货币的地位现在还没动摇，虽然货币在贬值，但国际贸易结算你手里一定要有美元，买东西不能花黄金只能花美元。所以你手里还是要留一定美元作为被支付的准备金。对个人也一样，黄金再涨价你也得留一部分人民币花。\n\n那主权资金买美债为什么拿美元时买美债？因为美债流动性非常好，想用随时变现。但今天我们看到一个问题：美国现在开始给美债的流动性施加额外条款了。美债受财政部影响，现在日本想卖美债干预日元汇率就被美国限制。前一阶段贝森特搞的\"飞马交易\"，要求日本把美国国债抵押到美联储，让美联储贷款给日本——这看起来高明，其实给全世界做了个非常不好的暗示：我是可以控制美债流动性的。当你需要卖美债的时候，我不让你卖，你明白这个道理吗？日本现在就卖不了美债，也不能说完全卖不了。\n\n那这就是最大的问题了：我持有美债现在不安全了。我本来是为了持有美元，因为持有美元不安全、没有孳息，才买美债，看中的就是流动性、随时变现。如果这点被限制了，我为什么买美债？这就会导致其中一部分人考虑：趁早赶紧卖，趁你现在政策还没成为现实。其他国家卖美债要考虑国际政治，但不受影响的，比如我们，会想\"未来会不会也限制我的美债买卖\"，那为啥不早点卖？\n\n## 六、谁来接盘：投资主体变了，逻辑也变了\n\n大家想一想，外国主权资金卖出美债，这部分被谁买走了？美联储买回去？那不扩表了吗？现在美联储都在抛售美债、缩表，不可能再买。原本大部分美债是在普通商业机构手里——养老金、货币基金这些机构。主权投资者减持、美联储减持，最终谁来买？都是商业机构在买，保险公司、货币基金等等。\n\n注意听这句话：当主权资金卖出美债、由商业机构买入的时候，投资美债的主体变了，逻辑也变了。商业机构不是以储备角度考虑，而是以赚钱角度考虑。国内的投资者对通货膨胀不敏感，对流动性要求也不那么敏感，他甚至可以拿到到期，不要求流动性，甚至不需要在二级市场卖，到期财政部连本带息还我就完了。这部分人买美债不是在乎流动性、也不是为了保值，看重的是收益率。他不给我足够收益率我就不买，和国外投资者完全不同——国外投资者只要给够流动性和币值稳定性就买，不挣钱都行。但国内投资者受不了，不给我足够风险补偿我就不买美国国债。\n\n所以美国国债收益率一定持续走高，表现就是美债价格降低。\n\n## 七、为什么关注美债收益率：两个风险\n\n我为什么让大家关注这个？因为美债收益率升高会带来两个重要风险。\n\n第一，实际利率上升。道理很简单：对银行来说，向外贷款也行，买国债也行。如果国债收益率足够高，我就不会向外贷款，除非贷款利息有足够上浮空间。所以虽然美联储法定利息还很低、没加息，但实际利息已经开始抬升了——银行向外放贷的利息开始抬升，因为国债收益率上升了。作为美国银行，我既可以买美债也可以贷给商户，国债收益率上升，我贷给商户的利率也得增加，否则就不贷了。这相当于加息。加息带来一系列问题，企业融资成本增加，对融资成本敏感的产业会受影响，比如现在的 AI、人工智能。\n\n第二，美国金融机构资产负债表恶化。中小银行买美债，按市价记账：你原来按一百记账，过两天市场价格变九十，你就损失十块。一年的硅谷银行风险就是这么产生的。临界点是贬值非常厉害时，很多中小银行资不抵债，造成银行破产。不光银行，保险公司也受影响。一旦出现这种情况，就是很重要的危机，一定会虹吸股市资金。\n\n所以为什么要关注这次流动性危机以及它带来的巨大金融市场波动——波动之后当然有机会，但前提是你得活到波动之后。\n\n## 八、关键变量：美联储是否配合\n\n这个逻辑链条里有一个关键假设：美联储在危机之前不会预先配合，不会像以前伯南克那样还没出事就大水漫灌。这个假设的存在，正是我改变以前对有色金属态度、对科技股态度的主要原因。大家可能没关注，我以前并不看空科技股，看空是从特朗普上台开始的——以前只是认为科技股确定性不足，看空是从他上台开始。关键变量就是美联储是否还配合。\n\n特朗普非常希望美联储现在就配合，最好现在就降息，不管通胀上天，再来一轮 QE，最好再买四十万亿美元国债。但美联储究竟是先等危机发生之后再救市，还是预先就开始救？以前我认为他一定预先就开始救，因为美国担不了这个风险，但我现在看不一定，因为涉及美国国内的博弈。\n\n## 九、收尾\n\n大家给我点一波赞我就准备下播了，现在也已经开盘了。我以后也不讲四个小时了，每次讲一个小时就可以，今天就讲这么一个问题。我答应给大家讲周期股的投资规律，下次再说。讲长了我也太累。每天讲一个小时相当于一个课时就下课了，你们累啥？讲一小时送一波人气票来给我点点赞，完了我就下播。最好冲到十万我就下播了，现在八万多，你们也比较轻松一点。\n\n这还有不少骂我的，我都不了解这些人的脑回路。好了，再见再见，我下播了啊，谢谢大家听我白话啊，谢谢谢谢谢谢。\n\n由 bilibili-transcript skill 生成 · 白底阅读版","toc":["一、开场：关于\"打父母\"争论的不适","二、南北父母子女关系的文化差异","三、今日主题：美债收益率上涨","四、美债的\"储备\"属性","五、美元贬值与黄金","六、谁来接盘：投资主体变了，逻辑也变了","七、为什么关注美债收益率：两个风险","八、关键变量：美联储是否配合","九、收尾"],"url":"https://www.bilibili.com/opus/1237728812195643393","bv":"","minutes":0,"chars":4725},"ai":{"title":"老木匠·2026年8月18日：美债的买家换了，逻辑就变了","text":"## 一、先建立一个基础关系：收益率上升＝价格下跌\n\n他讲美债之前先把这个说清楚：美债的收益率和价格是反向关系，收益率上涨就代表价格在下跌。这一整场都在讲美国长债的收益率在不断创新高——「已经快到2008年金融危机之前那个高点，差一点点，但我认为超过那个高点只是时间问题」。\n\n他特别强调：这一轮的上涨，并不是由美联储加息造成的。\n\n## 二、外国主权资金为什么买美债：他们要的不是收益率\n\n1. 40万亿美债里，大约9万亿在外国主权资金手里\n\n他说这些钱是各国在贸易和资源销售中获得的美元，作为外汇储备存在，有的国家甚至干脆把它当成央行发行货币的准备金。\n\n2. 关键区别：一国的货币，和这国的银行存款，是不等效的\n\n在一个本国的货币体系里面，你的货币和银行存款是等效的。但是对于一个外国央行作为储备来说，一国的货币和在这国的存款，它俩之间是不等效的——因为商业银行是可以破产的。\n\n他顺带提醒了国内的对应情况：中小银行存款要注意存款保险只有50万额度，「你可以不存超过50万」。\n\n3. 所以他们买美债，图的是两件事\n\n第一，它是作为储备存在的；第二，他要求的是流动性——需要的时候必须能随时变现。因为对他来说，买美债实际上是为了存现钞：拿着现钞没有孳息，存在银行有风险，所以他只买美债。\n\n他打了个日常的比方：这相当于你个人的活期存款——你要的不是利息，是随用随取。\n\n所以对于外国主权资金来说，他们对美债的收益率其实是不敏感的。因为他买美债不是为了投资。\n\n## 三、那什么会动摇他们持有美债的信心：两个因素\n\n1. 第一，美元的购买力在下降\n\n美债其实就是美元。由于美债提供了最好的流动性，它本身就是美元的化身。所以他第一个要考虑的是美元的购买力是否下降。\n\n他说购买力下降最主要的表现就是美国国内的通货膨胀，同时也会表现为以美元计价的大宗商品（石油、铜、黄金）价格上涨。\n\n这些东西上涨，实际上折射的就是美元购买力在降低。那么作为一个国家的主权资金，持有美元也好、持有美债也好，就意味着他的财富在缩水。\n\n这就是为什么很多国家在卖出美债、买入黄金。但他补充了为什么不能全换成黄金：\n\n你在国际上是不能花黄金的，你只能花美元。所以你手里还是要留一部分美元作为备付金——这跟你个人再看好黄金，也得留一部分现金是一个道理。\n\n2. 第二，也是更要命的：美债的流动性开始被施加额外条款\n\n他举了当时的例子：日本想卖美债来干预日元汇率，却受到了限制；而贝森特搞的那个安排，是要求日本把美债抵押给美联储、由美联储贷款给日本。\n\n这个交易看着好像很高明，其实不是——他给全世界做了一个非常不好的暗示：我是可以控制美债流动性的。当你有一天需要卖美债的时候，我不让你卖。\n\n他给了一个很重的定性：\n\n给美债的流动性加上额外的限制，本质上实际上就是美债已经违约了。你发行的时候告诉大家可以自由买卖，今天当你需要卖的时候，你告诉买家不能随便卖。\n\n所以他推出的结论是：那些不受国际政治约束的国家会想——「趁你这个政策还没成为现实，我干脆早点卖了」。\n\n## 四、这场最关键的一步：买家换了，定价逻辑就变了\n\n1. 主权资金卖出的美债，被谁买走了\n\n他先排除了美联储（「美联储现在自己都在缩表、都要卖出美债」），给出的答案是：美国国内的商业机构——养老金、货币基金、保险公司等等。\n\n2. 而这些人是「价格敏感者」\n\n当主权资金开始卖出美债、而由商业机构买入美债的时候，这时候投资美债的主体变了，逻辑也变了。因为他们买美债不是为了储备，而是为了投资。\n\n他把两者的诉求对比得很清楚：外国主权资金不在乎收益率、在乎流动性和币值稳定；而国内商业机构对通胀不敏感、对流动性也不敏感（「我甚至可以持有到期，不需要在二级市场卖」），唯一在乎的就是收益率。\n\n所以他买入的时候就开始压价了：你不给我足够的收益率我就不买。你必须给我足够的风险补偿，要不然我就去买黄金。\n\n3. 所以美债收益率会持续走高\n\n当美国国债从外国主权投资者手里出来、进入这些商业投资者手里以后，美债的收益率就会逐渐走高，其表现就是美债价格逐渐走低。\n\n他也给了个通俗版本：「你也可以说就是供大于求——有人抛售，得国内这帮人接，那我当然要求打折了。」这个变化直接反映在新国债的招标价格上。\n\n## 五、收益率走高会带来的两个风险\n\n1. 第一个：实际利率上升，相当于变相加息\n\n国债收益率是美国实际利率的锚。其实美联储加不加息，对实际利率的影响甚至没有国债收益率的影响大。\n\n他讲了传导机制：对银行来说，既可以买国债也可以放贷；国债收益率上升了，那贷给企业的利率也得跟着上去，否则我就不贷了。\n\n所以美国国债收益率上升，实际上就相当于加息。\n\n他特别点出这对什么最要命：\n\n对企业融资成本非常敏感的产业就会受影响——比如现在的AI，大量数据中心的建设都是靠贷款。实际利率上升就变相增加了数据中心的建设成本。\n\n2. 第二个更严重：金融机构的资产负债表恶化\n\n大量的美国中小银行和储贷机构历史上就是持有国债的。国债价格降低，会导致它们持有的国债贬值——原来记账100，现在市场价90，那这十块钱就损失了。那一年的硅谷银行产生的风险就是这么来的。\n\n如果贬值非常厉害，就会导致很多中小银行资不抵债，就会造成中小银行的破产。\n\n3. 最终的结果：流动性危机\n\n一旦这种危机开始产生，它一定会虹吸股市的资金——而且不仅是股市，甚至也会虹吸商品市场的资金。所以当这种情况真的发生的时候，不仅股市会下跌，商品也会下跌。因为这个时候产生的是流动性危机。\n\n他也说了自己认为危机之后会怎样：\n\n一旦开始产生流动性危机的时候，我不认为美联储还能坚持现在的原则，他一定最后还会来充当最后的贷款人。但问题在于，你必须得先有危机——你不可能在危机之前就有。\n\n## 六、他今年和去年判断不同的那个「关键变量」\n\n1. 整条逻辑链里有一个假设\n\n我推导的整个逻辑链条里，其中有一条是假设：美联储在危机之前不会预先配合。就是美联储不会像以前伯南克那样，还没出事我就先大水漫灌了。\n\n他说这个假设正是他改变对有色金属、对科技股态度的主要原因。他还澄清了一个被反复误解的事：\n\n我以前并不看空科技股，我以前只是认为科技股的确定性不足。我看空科技股是从沃什上台开始。\n\n2. 所以真正的问题不是「会不会重置」，而是「按什么路径重置」\n\n关键的问题不在于美元的币值最终是否会重置，这个问题并不重要；重要的是他重置的路径是啥——他是先有波动后重置，还是在波动之前就重置。这对你的投资来说是完全不一样的选择。\n\n去年这个时候我认为美元币值重置会在特朗普任内循序渐进地发生。但是我今天认为，美联储一定先要有一个流动性危机，然后再重置。\n\n3. 所以他现在做的所有事，逻辑都在这儿\n\n你要关注的是这一次的流动性危机，以及它所带来的巨大的金融市场波动。而波动之后当然是有机会的，但前提条件是你要活到波动之后。","toc":["一、先建立一个基础关系：收益率上升＝价格下跌","二、外国主权资金为什么买美债：他们要的不是收益率","三、那什么会动摇他们持有美债的信心：两个因素","四、这场最关键的一步：买家换了，定价逻辑就变了","五、收益率走高会带来的两个风险","六、他今年和去年判断不同的那个「关键变量」"],"url":"https://xueqiu.com/2573414707/405872208","chars":2855},"topics":["美债的买家换了，逻辑就变了"]},{"date":"2026-08-16","bili":{"title":"老木匠 2026年8月16日直播文字稿","text":"## 一、开场闲聊与小公园（0:00-8:00）\n\n我发现你们是一群闲人，我什么时候来都有一大堆人。这两天太热不爱去小公园，平常我就在小公园跟老头老太太聊天——早晨最早是一波特别老的老头老太太出来遛弯，等他们走了来一波退休工人，下午又来一些跟我年龄相仿的人。现在变成跟你们这些年轻人聊天，这也叫与时俱进。\n\n大伙你一句我一句的聊天是最好的放松，什么冥想、打坐都比不了。冬天公园里树叶掉光了，老人都出来晒太阳，白天人更多；夏天热，人少点。\n\n最近不爱看电影了。沈腾那部《飞驰人生3》我没看，同质化太严重，看一两部都差不多。尤其看不下去美国大片——奥德赛这类，到最后一大堆价值观、说教，全是套路。原来我特别喜欢看科幻美国片，因为视觉效果做得好，后来实在看不下去了。我也怀疑是不是年龄原因，不知道大家是不是也这样。\n\n## 二、聊聊电影与剧集（8:00-24:00）\n\n《沙丘》系列我还比较爱看，还有《星际迷航》。电视剧一般不爱看，尤其那种巨长的，但《星际穿越》都十多年了，现在也很少有能超越它的。《波士顿律师》早年挺喜欢看，主角就是后来《星际迷航》最早那版船长，拍得挺好。\n\n科幻电影只要在国内上映的，我几乎没看过没看的，有 IMAX 3D 的我都看。《安德的游戏》我也连书都看了——它把欧美基督教价值观渗透到宇宙空间里了。\n\n《三体》外国拍的还行，美国拍的那版改编的也还可以。《后天》都二十年了。《西部世界》前两季看了，后边不看了。《绝命毒师》《风骚律师》是一类，也是看一点看不下去。《火星救援》我看过老多遍。\n\n德剧《暗黑》拍得相当不错，三季里前两季看完了，第三季看了个头。《银河系搭车指南》有本书我看了一点，没看完。犯罪罪案片我不爱看，尤其有血腥画面的时候非常反感。\n\n《神探夏洛克》就是小孩剧。日剧英剧年轻时候看不了，现在倒觉得挺好。《曼达洛人》我看了三季。\n\n## 三、低估的第一特征：舆情冷落（24:00-44:00）\n\n有朋友问低估是什么。这个话题太大，别把自己看得太高，一百万个人有一百万个标准，我只讲我认为的低估是什么样子。\n\n我理解的低估，第一个特征一定是在舆情上处在被冷落的局面。反过来想一切就明白了：当一只标的处在聚光灯之下，每天打开媒体都能看到它的名字，它绝对不会被低估。你一打开自媒体就能看到它、打开直播间就有人推荐它，它怎么可能处在低估状态？\n\n再比如，你打开它的股东名单，全是机构持股，那它怎么可能低估？它已经被若干人研究个遍、做了无数遍\"核磁共振\"了，还有什么可低估的地方？\n\n你会想：这是真的低估吗？为什么别人都不买，只有我来买，我是不是第一个傻子？这种心理状态很正常，但要具体问题具体分析——有的确实就是雷、是坑。你要仔细探讨：这个标的是暂时被低估因为大家不关注、处在冷落角落，还是它的基本面真的出了大问题？\n\n我持仓的标的，别人发表看空观点我会去回怼吗？你们想一想，我看空过谁？别人看空我的标的，我连争论都不争论，连回复都不会。我不是吹牛，我就是这样。大部分优势投资者都跟我一样，哪有时间跟你们争论这些事。他巴不得你们都看空，因为你就站在他的反面。优势投资者只有一个时候喜欢散户跟自己观点一致——就是他准备出货了。\n\n## 四、市场结构与合力（36:00-44:00）\n\n股市上涨的理性判断，最终只有一个原因是对的，所以所有优势投资者看同样的书、做同样的市场、得到同样的结论，会形成合力。散户投资者和优势投资者不一样，优势投资者能判断基本面变化，等大部分标的都到了优势投资者手里以后，价格才真正朝因果关系决定的方向走。\n\n所以你进市场首先要知道市场结构。所谓\"主力\"这个词我都不愿意用，因为它暗示他们能控制股价、翻手为云覆手为雨。实际上股价是各方博弈的结果。机构、大投资者控制不了股价。\n\n你一捅马蜂窝，嗡一声飞出来一堆人，那说明散户太多、散户都欢呼雀跃、公司刚经历大幅上涨——这时候你一定要关注风险。关注风险不代表它立马就下跌，但它已经有下跌的可能了。\n\n## 五、安全边际与低估的第二、三特征（44:00-68:00）\n\n赛斯·卡拉曼写的《安全边际》你们可以看看，现在只有盗版，原版英文书据说卖到很贵。低估的东西不代表买入它就上涨，但它给你提供一个安全边际。安全边际就是一种韧性——在出现极度下跌时你不至于被清零、被赶出市场，而在上涨时还能获得一定收益，这就叫韧性。不是说我防风险就离开市场清仓，那不叫防风险。\n\n低估的第二个表征，是市场价格方面的表现。从反面看：刚刚经过大幅上涨、现在回调还没回到起涨点，这不叫被低估。有些票它不可能再回到起涨点，因为股票长期趋势向上，但这只是个判断标准，不是铁律。\n\n从正面看，真正低估的标的都有一个共同规律：它跌了很多年，在一个相对底部空间，不再跌了。\n\n第三个表征是历史分位值。市盈率和市净率的历史分位值，每个交易软件里都有。所谓历史分位值，就是你的市盈率在历史上是处在什么水平——比如分位值处在百分之九十，意味着历史上百分之九十的时间都比今天的市盈率高。我一般控制分位值低于百分之八十的时间，也就是要低于20分位才算低。\n\n我讲低估讲了三个特征，你们自己总结一下：第一，热闹的舆情里没有低估；第二，经过大幅上涨稍微回调不叫低估，真正低估是跌了很多年不再跌、处在历史分位低位；第三，还得看它有没有未来。\n\n## 六、是否有未来与周期股的特殊性（68:00-80:00）\n\n光看分位值低、没人关注、横盘很长时间，还不能买入。你还要判断这个公司是否有未来——在可预见的未来，比如五年、十年之内，它是否还能保持现在的市盈率甚至增长，是否会退市，行业是否会消失，是否会面临越来越激烈的竞争，技术方案是否会被替代。\n\n比如原来举的例子，汽车产生以后，马车行业也是长期低估、分位值很低、市盈率也还行，但它就是没有未来了。\n\n周期股不一样的地方：低估的标准是一样的，但你买周期股不是买低估，是买周期反转。这是两个完全不同的买入逻辑。动量投资者根本不看低估，看的是有没有更多傻子来买。低估不是唯一的买入标准。\n\n我经常买低估的标的，也买很多周期股。买周期股的时候你不用看是不是低估——你赌的是它未来是否反转。今天讲太多你们接受不了，明天再讲怎么买入周期股、怎么卖出、如何判断周期反转。别一口想吃个胖子，慢慢来。我今天讲完了，明天你们都不来了，我还吃啥喝啥。\n\n## 七、为什么要\"捅马蜂窝\"——现场教学（80:00-92:00）\n\n我拿具体例子给你们讲，只可惜有的人不关注这些事。我判断过多少次某标的它有风险，现在准备连个股也不说了，正面不说了，反面也不说了，以后就统说行业。\n\n你把这东西用在同事中间也好用。你上同事之间捅马蜂窝去，那还是要小心点。统说行业吧，它不涉及个股，没人关注这件事。你现在捅个股，效率老高了——当年捅那两个个股的时候，一捅那效率老高，我一看就知道这股票完了。\n\nCXO 是啥？就是制药、创新药那个 CXO。我原来持有其中一个，老粉都知道，只是没拿到现在。当年我非常看好它，现在因为我不看了所以没有。对于创新药题材对我来说确定性不足，所以我不买创新药——传统医药行业我买，创新药是死猫跳的时候我说过，上一次行情结束我明确告诉大家了。但从长远看我并没有不看好它，我不买是因为确定性对我不足、风险太大。CXO 属于卖铲子的，创新药的 ETF……\n\n投资的难题不在于判断高估低估，在于你如何和自己的内心做斗争。四个表征不是充分条件，但作为排除法、必要条件是有用的——不符合这四个表征，那它就一定不低估。你用第一个排除一半，第二个又排除一半，最后能剩的低谷有几个？不难找。\n\n关键问题在于：低估好找，但低估的时候你是否敢于买入。你判断完它就是低估，然后开始犯嘀咕：不对呀，这么简单的道理为什么大家都不买？这个市场就是这样，你判断完可能就是正确的，就是这么简单的道理，就是没人敢买。\n\n## 八、散户唯一可靠的获利方式（92:00-104:00）\n\n你只要在这儿把它买入了，然后干啥？你就等着。等着猎人来的时候，猎物就来了，你搁这等着就行。就像我以前给你们描述的：找个坑趴在那儿，自然就有人来。这是你散户唯一的可靠的获取收益的方式。\n\n你扯什么猎庄、打猎、钓鱼？你自己就是鱼，还分析基本面、判断企业未来发展、判断未来十年走向，你有啥资格判断？你研究花朵看到的只是花朵的照片，真花你都没看过。\n\n我这么些年就是这么做的：除了买入低估的标的等待猎人来，还有一个办法是我经常买周期股去赌周期的反转。这两个投资模式同时进行。我看到哪个周期行业处在低迷状态即将反转，就买入等着。其实跟低估值买入也相似，只是买入标准不是低估——它并不低估，因为很多时候你买入的周期股正贵着呢。\n\n今天的课干货非常多，我也是逐渐适应了 B 站的节奏，攒到了给大家讲的感觉。这些东西我都装在心里，想到哪讲到哪，都是多年经验，不是来自任何一本书。你们也别拿书压我，别人咋说的跟我没关系，巴菲特咋说的也跟我没关系。当然我也是踩着前人的脚步，很多东西别人总结过，你得学会用别人的经验。\n\n## 九、牛顿与故事的传播（100:00-116:00）\n\n你们知道牛顿晚年做的什么职业吗？他前半生搞自然科学发现牛顿三定律，后来还能炒股——他作为科学家为什么有爵位？牛顿后来的正式职务是皇家造币厂厂长。牛顿非常爱财，而且心胸狭隘。有些东西你去看原始资料，比如牛顿传，他就不是你想的那样。有些东西为了传播、为了某种理念，都被弄成短句、短视频、口号，朗朗上口，你慢慢就以为那是真理了。牛顿非常喜欢钱，是个财迷，他炒股能亏掉，就是这么来的。\n\n就像那些明星成长了以后都有故事——我从小在火堆边出生、我是火命，赵本山说你咋不说你是做火箭出生的呢。都是编成小故事朗朗上口，传播容易，但把本源的世界都忘了。这也像最早的爽文。\n\n马特坐在湖边就能发明蒸汽机，牛顿在苹果树下苹果砸脑袋就想到万有引力——都是扯淡。万有引力跟苹果一点关系没有，那是推导出来的，根据开普勒定律推导出来的。\n\n股票上涨的时候也都有故事。你听到的故事总是在事儿发生之后——他当了开国皇帝以后，人们回忆时才是天降红光；股票也是涨了以后你才发现\"哎呀这东西供不应求\"，都涨十倍了你才发现基本面太优秀、未来不可替代。那还真不是小作文，连财务报表都跟着变。跌下去的时候财务报表也变，跌来跌去你发现特别好的基本面怎么可能下跌，过两天来个负增长，你都看到了吧？基本面究竟变没变，取决于有些人的票到底出完货没出完。基本面是很有弹性的，在不同年份之间做业绩调节符合财务规则。\n\n你们问我那些现金还在它账上吗？动动自己的脑袋想一想——那个地方穷得叮当响，然后一个国有企业下面账上有好几千亿现金，你们认为这现金会在它账上待着吗？我给你们讲过，活人能让尿憋死吗？你这边兜里揣着很多钱，这边吃不上饭了，你告诉我你不把兜里的钱拿出来先买饭吃？那兜的钱规定不准掏出来，有啥呀，不准掏出来掏完再还回去呗。不准的事儿多了，它不是天天来看，不是有期限的，不是到年底才看的，我现在掏出来先用着，年底再从别的地方挪回去。你问我央企账上的现金可信不？央企谁去投，为什么不可信？央企不用掏，中央政府有的是钱，需要钱可以印。郭志强掏这钱有啥用？这些东西我们永远不可能知道真相，只能靠你自己思考。\n\n## 十、实证主义与没有客观真相（116:00-124:00）\n\n我那天不给你讲哲学问题了吗？唯物主义、唯心主义后来都被实证主义替代。实证主义的基础假设就是没有真相，一切的真相都是由证明来证明的，明天证据改了真相就改了。\n\n你老追求真相，是因为你认为存在一个客观的真相，不以任何人意志为转移。你慢慢在认识过程中自己就会发现，这种真相其实是不存在的。你所有的真相都是用证据反推的，当证据改变的时候，事实也在改变，何来客观事实？所以有人跟我说\"你不说咋咋地\"，那我说咋地，现实情况变了我的判断就变了。\n\n你随时可以跑、随时可以进，一分钟满仓一分钟空仓，没有时间成本，只要赚钱就行。有的人说不对呀，我怕时间太长赚钱太少——那从长远看你不这么做最后怎么样？最后我亏了。你亏了和挣了，哪个水平更高？散户正是因为追求赚钱快、赚得多，最终结果才是亏损。如果散户都想\"我只要赚点钱就行、基本不亏\"，就不会这样。\n\n## 十一、散户心理与过山车（120:00-132:00）\n\n低估的时候是这样，到高估的时候又是这样。当你趴在坑里有人来救你的时候，有人就开始不想跑了：\"这家伙，你看我这次看对了，我又天赋异禀了，我判断多好，必须卖到最高位。\"这时候你的基本面判断也是对的，啥都是对的，每天上涨都证明你特别英明，然后你活在英明幻象里，最后坐了个大大的过山车。你用一万赚一百就跑，那才是百分之一的利润。\n\n这就是\"套牢套死定律\"——刚出来的时候讲过，没啥复杂。这世界就没啥复杂的东西，都很简单。雪球的大V基本上都不是机构投资者，本质都是散户，只是散户里比较聪明的一类。当然雪球大V鱼龙混杂，有一部分靠自媒体生活，咱不管那一类；大部分真正能出名的基本上是散户级别，但以这个东西维生，不是普通散户，所以他们不做科普。\n\n你现在要慢慢明白，你必须了解机构投资者的行为特征。这不代表你去这么做，但你要知道市场结构。作为散户你也得了解机构的行为特征，才能理解现在的市场状况，也少抱怨\"为什么那些东西明明没业绩还涨\"。那是正常的，非常正常。\n\n既然它涨是正常的，你是否要参与？那不一定，看你个人的投资理念。现在的基金经理不买科技就是错的，都是你的错——那不是蠢，是现在的市场结构决定的，是激励机制决定的必然结果。人家现在就是围猎，玩的就是围猎模式，狮子在围猎斑马。但如果你是真正看明白的投资者，你就应该……\n\n## 十二、猎人与狍子：市场结构的本质（132:00-144:00）\n\n它不能一直涨到天上去，你越往高处走越难，再讲故事没人信了，基本面也不支持了。你推高它得有基本面做支撑，再推高基本面跟不上了，那公司都要累吐血了——你把后年的利润都加到今年都支撑不了这个价格，你还怎么玩？底下坑里趴着的，利润都没地方藏了，还都低估了呢，有不少都那样了，你为啥不玩那个？那长利润长的都没地方藏了，那利润都挂外头了，你看不出来吗？你就是不去玩，非得在山顶上挂那些东西起跳。它不需要起跳，坑平了你就走，剩下的给人家玩。\n\n怎么看出来长利润？太能看了——不断计提损失，欠银行的钱都快还没了，存款大幅增加，原来历史上的贷款大量偿还。非常容易看，你看的时候就开始想：不对呀这么简单为什么别人没看着？我不是给你分析过了吗，别人不是没看着，别人没准备来呢。现在有热闹的地方，现在错过热闹的机会，那地方跑的太多。\n\n我给你们总结：第一，别把自己想象成猎人，你就是狍子，你就是被围猎的对象；第二，猎人没来这个地方，是因为他现在有更好的猎场，所以你需要选择离这猎场远一点，找个没猎人的地方待着，静静吃点草，过两天猎人就来了。能记住吗？\n\n## 十三、理工科基础与思维框架（140:00-152:00）\n\n我现在问你长记性没？法律我是读研期间自学的，考的律师资格，现在叫司法资格。没有经济学学位，啥东西都能自学。但我建议孩子上学还是要有理工科基础——理工科基础就是你学啥都容易，文科改理科很难，理科改文科相对容易。我个人就是理科的文。\n\n我认为有的人的思考框架不对，虽然能评到博导，但我觉得他不是那么优秀，容易坚持\"第一性原理\"，什么东西都追求个圣洁。很多人不追求甚洁，看东西容易表面化，非常容易受别人影响。你心里暗暗经常被人洗脑，就是没建立好自己的思维框架。一旦形成非常坚固的思维框架，一般就不会被别人洗脑，但那太难了。\n\n多看书吧，没有啥诀窍。但光看书不够，最没用的是那种学腐，全是细节，根本没注重大体框架，弯弯绕绕的。你得多参加社会实践，不了解各个行业，就不了解不为人知的秘密——无论是政府机关还是大型企业，都有一些东西，只有亲身实践以后才知道。你都不了解政府的决策过程，怎么去判断宏观政策对下面的影响？\n\n一说政府决策过程，你不要以为当个处长就理解了，也不见得。有的人习惯看特别微观的东西，细枝末节关注太多，最后忘了大框架。不同社会群体、不同群体的利益结构，对市场影响很大。\n\n## 十四、房地产、基础设施与REITs（152:00-164:00）\n\n你比如说房价，现在大家说房价高，你反过来想：曾经的房价那么高，现在房价跌了，你减少的这部分财产去哪儿了？没有当年的高房价，能有后来那么好的高速公路、城市基础设施吗？能有高铁、空间站吗？过去这些年财政收入不都是建立在房地产大发展基础上的吗？无论是税收还是非税收入。\n\n房地产不光是开发行业，还衍生出钢铁、煤炭、建筑、建材，很多东西景气度都高，税收也高，卖地还有很多非税收入。这些收入成为财政收入以后，导致公共财政空间很大，钱都去了基础设施建设，提高了我们个人的福利待遇。\n\n一个公共机构现在极度缺钱的时候，可以把大楼卖了再租回来——你个人也一样，房子是资产但花不了，等钱用又不想改变生活状态，就把房子卖了跟别人签租约再租回来，钱就到你手了，每月付租金。REITs 的本质就是这个。你买 REITs 实际上就是买一笔对政府的债权。\n\n未来民营资本就通过股市投资支持国家经济建设，你参与央企就买央企股票，不需要实际参与。现在存款增幅挺大，已经三百多万亿了。利息这么低，这些钱放银行对银行压力也大，因为贷不出去。分业经营是美国学的，美国现在也不搞了，开始混业经营。银行通过某种方式投资股市也不是不可能。\n\n## 十五、回购陷阱与周期股估值（160:00-172:00）\n\n著名的公司回购，都涨十倍了开始回购，回调一点开始回购，董事长减持的时候他为啥不回购？那时候价格是现在十分之一他为什么不回购？现在涨十倍了他开始回购了，说公司低估、未来有信心。他价格没涨的时候你没信心呐！回购都是扯淡，就是为了拉股价给点信心。\n\n我白讲了什么叫低估——别老拿市盈率跟我说，市盈率只是低估的一个指标，而且低估不是看市盈率指标，是看市盈率的分位值。如果这个公司长期市盈率都是5，现在是10，它也不叫低估。周期股本来估值就是个伪命题，我买周期股从来不看估值。你给周期股估值就是扯淡，谁因为买周期股是因为估值便宜而卖？卖周期股是因为时候够了、估值贵了。你买入赌的是反转，卖出的时候赌的也是反转，根本不是那么回事。\n\n光伏涨十倍的股票还跌了百分之五十就要散播恐慌了？你有啥恐慌，现在里头人还很贪婪。船坐五个人只能坐四个，必须有一个人跳下去死，你告诉我谁会主动往下跳？不得拼得把一个人拼死扔下去？谁会主动说\"你们不用打，我跳下去完事儿了\"？别提个股，我只能说光伏现在有底部特征，至于到没到底我不知道，什么时候反转我不知道。光伏已经在底部了，但什么时候反转我不知道——它符合所有底部特征，但光伏是周期股，也不能说用底部特征就是低估，它只是有反转的可能，几年不反转也很正常。但反转你可以挣好几倍。\n\n## 十六、周期股的典型与反转逻辑（172:00-184:00）\n\n你回去看一看，那些人当年在底部四五块钱买有色股票的时候，你去看一看他们多长时间没涨，还坐过好几次过山车。五年前我谈有色的时候，没人听——有色最严重的时候所有券商和基金把有色研究岗位都撤了，大家知道不知道？研究岗都没有了，没人研究铜铝稀土这些。那时候你提有色，不让人笑掉大牙？2018年你看看云铝多少钱、江西铜业多少钱，人家都买完了你一扔，不用看，过几年到高峰大家都看好的时候你一卖就完了。\n\n你说能反转一大堆人符合，你说的太对了，你千万离远点——那还早着呢，这帮人还没死透呢，你还等着别人解套？你一拉他不全卖你了吗？必须得把它憋死。这东西本身就是博弈，下棋不就是干啥，你天天走着干啥，不就是把别人憋死嘛。它不死透你没机会。\n\n三一重工、中联重科那就是一个标志，快反转了。今天我讲的是市场，爱听的人多。轮胎行业是最典型的周期股，轮胎、光伏、有色金属、造船、工程机械、养猪，都是最典型的周期股。\n\n很多人不懂\"万物皆周期\"，所有的人都不了解周期股是怎么回事。你给他讲一大堆，他底下就来一句\"万物皆周期\"——根本不是，没有万物皆周期这个说法。你投资周期股，尤其像彼得林奇说的狭义周期股，是要用周期来赚钱，不是说他有周期现象。你用它来赚钱，就得把两次反转都判断了，判断不了你怎么用周期赚钱？今天买了不一定哪天跌、哪天涨，你有啥确定性？\n\n## 十七、煤炭、石油与不可预测性（180:00-192:00）\n\n石油有占能源当量的问题，油和煤可以互相替代。石油涨了煤不一定涨，但石油涨是因为打仗涨——你能预计吗？过两天欧佩克增产了、霍尔木兹海峡开放了、原油突然下跌，你能预见？明天特朗普做梦跟伊朗亲如兄弟了，你咋能碰到？原油跌到三十美元一桶，现在的煤炭价格能支撑住吗？\n\n你看天然气价格受地缘形式影响更大。全行业亏损到什么程度会反转？亏损一段时间它就会反转，谁也不能天天亏损还继续经营。多长时间？这你判断不了。\n\n你买标的就念叨\"我必须不亏损\"，那你选的时候一定选下跌概率已经非常低的票。上涨是随机现象——你一上涨别说自己有能耐，那是老天赏给你的，相当于彩票中奖，涨得差不多挣百分之十我就卖了。进去的时候念叨\"千万不亏损、一定不亏损\"，所有精力都放这。你研究的就是哪个股票能不亏损就买哪个，突然有一天它发神经涨了百分之十，你坚决卖。你这么做就比一般散户强，就不是普通的傻子。\n\n如果你一进来就追求一年挣百分之五十，天天按计算器，买进去继续下跌继续补仓，\"我就不信它还能跌多少\"，继续买继续跌，最后一直跌下去清仓离开股市，这辈子再也不来了，下辈子儿子说要投资你就打断他的腿。这就是散户的一生，百分之九十都是这样。\n\n## 十八、给新散户的第一目标（192:00-200:00）\n\n你刚进股市第一件事，无论牛市熊市，给自己设个目标不是挣百分之五十，是\"我要活到2031年\"。在这市场里，无论你的财产还是心理、兴趣，依然可以待着，不是说亏没了就不行；有时候被人打蒙了，心理上待不下去，一提股市浑身乱抖、睡觉都睡不着，那也不行。\n\n你看这个简单吗？大部分人不这么想。你只要高度差足够，把赚的收益拿到手，这事就跟你没有关系了，跟赔算了跟我没有关系了。我会发一个新的基金玩别的去，你以为基金回过头再玩低估的？今天已经完事了，坤坤成为白马基金经理之后能成为科技的基金经理吗？成不了。但兰兰买的医药我认为还有机会，只要风格不漂移。\n\n## 十九、市场不复杂，复杂的是人心（200:00-212:00）\n\n市场没有那么复杂，复杂的是人心。你走给我走一波赞，我坚持四个小时，看他还说我播的时长少不。市场当然考验人，尤其是人心太容易动，道理非常简单。\n\n牛市的好处是大资金运作更方便，交易量大、市场活跃，打猎这帮人容易下手也容易出局。在熊市成交量少，你一买就涨一卖就跌，没法吸引跟风盘。现在还没进入全面牛市，进入全面牛市的时候我会空仓——我最近这些年空仓就两次，2007-2008一次，2015一次，但空仓时间也不长，也有损失，就是没耐心等到底。我个人假如下一次，空仓时间长一点，自己也是不断进步嘛。\n\n你凑啥热闹？等它砸下来的时候机会遍地，真正出现那次抖动的时候我会重新上融资。我最喜欢的就是股灾。\n\n现在美股不好判断在哪？你不知道美联储是否配合美股最终的危机。如果美联储一直配合，不行就发钱，那美股的牛市永远不结束。从2008年开始美国历史上最长的牛市就是由发钱造成的，按道理物价也应该涨这么多，但没涨这么多是因为我们全世界的结算体系造成的。所以我告诉大家，中美现在的 AI 人工智能竞赛美国输不起的——我们不需要赢，只要不输就可以。美国不行，美国必须绝对赢，不绝对赢的话美元就崩盘了，因为这一次的美元，美国只要在 AI 领域不绝对赢，美元就彻底完了，没有用途了。\n\n## 二十、不追求对错与怼人的目的（212:00-220:00）\n\n你干啥都有人叫我，你这么在乎对与不对呢？我从来不追求自己对，我是来挣钱的，不是来高考的，对不对没人给我打分，对了也没人给钱。这种抬杠对我来说太初级了。你看我在雪球上从来不在乎别人说不对，为啥？怼人大部分时候是为了给大家讲东西——有的人问的问题特别典型，我在怼他的过程中实际上是给听众在讲，否则我懒得怼他，直接拉黑完事儿。这就是典型教学，你得找那些差的学生，才能给好学生讲明白。\n\n下次给大家讲讲怎么讲第一步——你没人问的话我都想不起来。周期股怎么记？都讲过一次了，不亏钱了呗。没晒太阳咋的？你必须让我自己受两次伤害呗，亏的时候受一次，晒的时候再受一次。我现在不晒收益不就是因为没赚钱吗？我赚钱早就嘚瑟了。今年还应该有百分之三四左右的利润，最近几天没看。\n\n## 二十一、生猪、有色与美联储（220:00-236:00）\n\n猪肉最好在等一只相对大点的企业出现破产，现在破的都太小。能繁母猪去产能也不是很顺利，外来力量还很多，政府机关也在参与要求去产能。现在全行业亏损也就接近一年，今年年初才开始的。最好的契机是有企业重组或破产出现现金流问题，现在还没看到。你挣钱挣差不多够口了就卖呗，所有人都想卖到最高点，你不用问这个问题，自己觉得挣够就卖了，跟做商业一样。\n\n有色即便在周期底部价格也不低。它的问题在于对美联储利率非常敏感，你搞不清楚美联储是否加息的情况下买它确定性不好。但按现在基本面来说，有色都属于比较低谷，唯一的不好在于你不知道美联储是不是真要加息，所以你买有色包括黄金就不安心。我已明确说过有时候不看空但依然不会现在买——你能判断的信息来源太少，实证主义嘛，你要有足够证据信息才能推知客观事实，连证据都不足怎么推？\n\n你慢慢听多了就知道，我的投资理念和体系是一套统一的整体。我坚决不能亏——买入标的就想到把所有未来不利的东西都排除才能买入。你已经可见的不利因素出现了，万一他要加息呢，你排除不了，概率还很高，那就别买这个标的。道理很简单。你看不透的你讲不了，百密一疏，所有东西都思考到了也不见得没漏洞，那没办法，这风险你得担；但你已经明显看到有的风险，你就不能担了。\n\n价格低到一定程度就补偿风险了，这就是安全边际的道理。胡锡进说\"我不卖就不会亏\"这句话是完全正确的，只是被大家嘲笑。你都没想这个问题——低买高卖也包含\"你不卖就不会亏\"，你亏就是因为高买低卖，只有这一件事可以亏损。你只要不低卖就不会费钱。大家嘲笑胡锡进，有啥可笑的？他说的是个真理。胡锡进当年买的平安银行涨快一倍了吧？当时我也有平安银行。\n\n## 二十二、收尾与下播（236:00-240:00）\n\n我熬时间熬到四个小时，看看他到底咋回事。今天讲的课比较硬，都没扯犊子，人气降到三十三，就是没字幕慢慢就到这了。你要有互动他人气就高，听着听着都没人了，虽然人多也不行。没人点赞没人回复，慢慢就完了，人气就下去。你看一会儿人气变十六了，大家都不回复就没人气了。\n\n咱们度过了一个难忘的周日。今天给大家讲的东西我自己觉得挺有用的，真的给大家讲了一些投资的基础逻辑问题，真的没有书能看到这些东西，有零星的有，但能像我这么给你总结得这么清晰的没有。\n\n你没有人气、没有回复的人气就降下去。谢谢谢谢，我要关播了啊，谢谢大家，下次再见，再见再见。\n\n由 bilibili-transcript skill 生成 · 白底阅读版","toc":["一、开场闲聊与小公园（0:00-8:00）","二、聊聊电影与剧集（8:00-24:00）","三、低估的第一特征：舆情冷落（24:00-44:00）","四、市场结构与合力（36:00-44:00）","五、安全边际与低估的第二、三特征（44:00-68:00）","六、是否有未来与周期股的特殊性（68:00-80:00）","七、为什么要\"捅马蜂窝\"——现场教学（80:00-92:00）","八、散户唯一可靠的获利方式（92:00-104:00）","九、牛顿与故事的传播（100:00-116:00）","十、实证主义与没有客观真相（116:00-124:00）","十一、散户心理与过山车（120:00-132:00）","十二、猎人与狍子：市场结构的本质（132:00-144:00）","十三、理工科基础与思维框架（140:00-152:00）","十四、房地产、基础设施与REITs（152:00-164:00）","十五、回购陷阱与周期股估值（160:00-172:00）","十六、周期股的典型与反转逻辑（172:00-184:00）","十七、煤炭、石油与不可预测性（180:00-192:00）","十八、给新散户的第一目标（192:00-200:00）","十九、市场不复杂，复杂的是人心（200:00-212:00）","二十、不追求对错与怼人的目的（212:00-220:00）","二十一、生猪、有色与美联储（220:00-236:00）","二十二、收尾与下播（236:00-240:00）"],"url":"https://www.bilibili.com/opus/1237360819394576385","bv":"","minutes":0,"chars":11181},"ai":{"title":"老木匠·2026年8月16日：什么才算真正的低估","text":"## 一、什么叫低估：四个可执行的判断标准\n\n这是这场（也是这一整轮直播里）最系统的一课。他一上来就声明：「我所理解的低估只适合我，适不适合你，你自己需要思考；你也不要根据我这个就去选股。」\n\n1. 第一个特征：舆情上处在被冷落的角落\n\n他最赞同彼得·林奇找十倍股的那条标准——机构不持股、研究员不追踪。\n\n这说明主流投资者现在并没有把目光放在它身上。换句话说，这样的标的处在聚光灯之外，处在一个黑暗的角落里。\n\n他强调这一条要反过来想才容易理解：\n\n如果你每天打开自媒体就能看到它，打开直播间就有人推荐它，一打开股东里面全是机构持股——那它怎么可能处在低估的状态呢？它已经被所有人做了100遍的核磁共振了，还有什么可低估的地方？\n\n他还点破了一个关键区别：这时候人们买它看的是未来的成长，「你既然看到未来的成长，就不存在现实的低估——大家都把它未来的增长可能性打满了，都认为它还会涨五倍、十倍、20倍」。\n\n2. 第二个特征（反向排除）：刚被爆炒过的，一定不是低估\n\n一个标的从底部大幅上涨，比如涨了十倍20倍，然后刚开始回调、跌个50%甚至腰斩——这样的标的都不叫被低估。因为它在人们的记忆中还没有被淡忘。\n\n他说这就是为什么他对那些「刚跌一点就喊别人恐惧我贪婪、我要抄底」的说法不以为然：\n\n它可能已经不是聚光灯正对着的那个了，但它还在聚光灯的光晕里。他刚刚移出聚光灯的中心，你怎么可能低估呢？\n\n他还给了个更硬的判断：\n\n即便经过两次腰斩，我认为它们也不是低估，只是从原来的高估刚刚回归到一个合理估值空间。合理估值它有可能继续下跌——因为它们的下跌不是由于情绪变化造成的，是它的基本面确实出现了硬伤。\n\n3. 第三个特征（正向）：长期横盘、缩量、画心电图\n\n它跌了很多年，已经不再跌了，然后在一个相对窄的价格空间里一直小幅波动，这个时间要足够长，一般是一年左右。大盘涨它也在这个区间里，大盘跌它也在这个区间里。\n\n然后你看到它的成交量已经开始急剧缩量，交易很清淡。它不仅仅被人们忘了，它的股价也像死了一样——就是所谓的画心电图。\n\n4. 第四个特征：基本面看市盈率、市净率的历史分位值\n\n他专门解释了什么叫历史分位值：\n\n历史分位值处在90%，意味着历史上90%的时间都比今天的市盈率要高。\n\n他的要求是「起码要低于20分位值」，也就是历史上大部分时间的估值都比现在高。他说这个数据在交易软件里都有（东方财富在个股资料的「估值分析」里），也可以直接问AI。\n\n5. 还有最后一条：判断它有没有未来\n\n他强调前四条都满足了也还不能买：\n\n所谓的未来，并不代表它一定会持续下跌，而是说它是否能在未来生存下去、它的基本面未来是否还会出现好转。在可预见的未来比如五年之内，它是否还能保持现在的市盈率？五年、十年之内它是否会退市？这个行业是否会消失？它的技术方案是否会被替代？\n\n他举了国外书里常用的例子：汽车出现之后，马车行业也是长期低估、位置很低、市盈率也还可以——「那你现在就可以买马车行业吗？不行，因为它没有未来了」。他自己的标准是：\n\n第一，这个行业在未来十年绝对不会消失；第二，未来五年它不会面临巨大的竞争；第三，它没有什么复杂的、你判断不了的技术方案。\n\n6. 关键提醒：这些是必要条件，不是充分条件\n\n低估不代表明天就上涨，也不代表明天就不跌了。但低估的好处是给你提供了一个安全边际。\n\n他把安全边际解释成「韧性」：「就是出现极度下跌的时候，你不至于被清零、不至于被赶出这个市场；而在它上涨的时候，你还能获得一定的收益。」\n\n7. 真正难的不是找，是敢不敢买\n\n低估好找，用第一个特征就排除一半，第二个又排除一半，最后能剩几个？关键的问题在于，你自己都判断完了它就是低估，然后你开始狐疑了——这么简单的道理，为什么大家都不买呢？只有我来买，那我是不是第一个傻子？\n\n## 二、市场的结构：优势投资者与「噪声」\n\n1. 他为什么不用「主力」这个词\n\n主力这个词多多少少有一点暗示，说他们就可以控制这个股票、翻手为云覆手为雨。其实所谓的优势投资者，他们也控制不了股价，最终的股价也是各方博弈的结果。\n\n2. 散户在信号学上相当于「噪声」\n\n这是他这段的核心概念。他说普通散户有两个特点：一是对基本面的理解处在比较低的层次；二是户数很多但每户钱很少。\n\n更主要的是由于他们户数多、钱数少，所以他们之间是形成不了合力的。如果用信号学的角度来说，散户就相当于这个市场的噪声。\n\n他解释：任何时候散户都是一半看多一半看空，最终结果是随机的（他自己类比成布朗运动）。「所以如果一只标的的筹码都在散户手里，那这个公司的股价运行规律就是随机的。」\n\n3. 而优势投资者会形成合力\n\n优势投资者看的是同样的书、做的是同样的市场，最后得到的结论是一样的。所以他们和散户不一样在哪呢？他们会形成合力。\n\n他由此推出一个很重要的时点判断：\n\n优势投资者能判断出这种变化，但变化真正发生、开始影响价格，是在大部分筹码都已经到了优势投资者手里之后。通俗地说，也就是这些人都建仓完毕的时候，价格才会真正朝着由因果关系决定的方向去变化——这个价格才能自我实现。\n\n4. 所以「捅马蜂窝」是一种火力侦察\n\n你要想知道里头马蜂多不多，那你就捅捅试试。\n\n他解释这个动作真正在测什么：\n\n优势投资者根本不在乎你这些论坛里谁看空。我持仓的标的有人发表看空观点，我会去回怼吗？我连回复都不会。所以你一捅全是马蜂，那就说明这个标的里散户太多。\n\n他还补了一句很关键的：\n\n优势投资者只有一个时候会喜欢散户和自己的观点一致，就是他准备出货了。\n\n## 三、这场最狠的一段：围猎模式与「坑是一种资源」\n\n1. 先摆正自己的位置\n\n我们最大的问题在于，很多散户幻想自己就是狮子。「在有鱼的地方钓鱼」——你他妈就是鱼，人家钓的就是你，你还扯什么在有鱼的地方钓鱼？\n\n他给散户的定位是秃鹫：\n\n你就当一个秃鹫不挺好吗？静静地观察，等猎物也不挣扎了、猎人也都吃饱了，你上去啃两口就够了。\n\n2. 为什么低估的地方现在没人：两边都有原因\n\n机构不买的原因不是因为它低估他不知道，是因为现在他手里有更好的玩具——市场的热点不在这儿。而散户不买的原因是：散户作为猎物，最大的特点是喜欢跟着猎人跑。猎人没在这儿，所以他也不在这儿。\n\n他说这就是整个投资市场最荒谬的地方，也是散户唯一可靠的机会：\n\n你作为一个散户进来的时候，第一件事是先天地排斥猎人——猎人在哪，我不在哪。你就能赢一大半人。\n\n3. 核心机制：围猎模式玩的是「高度差」\n\n这是他自己说的「今天最干的干货」：\n\n围猎模式玩的是高度差。他得是从底部到高，这个高度差他才能赚钱。这个东西从底部越走越高，高度差都已经赚完了的时候，你就得找下一个高度差，就得回到底部重新开始玩。\n\n他用这个解释了白马为什么走不下去：\n\n因为它的高度差已经没有潜力了。你再把某个白酒干到一万块钱一股才涨四倍，那不如搞个科技股，随便一个小的上来就涨十倍。\n\n所以他的结论是：\n\n坑是一种资源。你在坑里开始爬和在平地开始爬，获取的收益是不一样的。所以你得找坑——而坑也不多，山变成坑那得好长时间的演变。你看当年的有色金属从山变坑用了多少年？\n\n4. 所以那波机构不会回头\n\n你别以为那波机构转完科技这一波，会回过头来做低估值的——不会，他们就死在那里头了。因为他们的奖金都已经领完了：赚钱的时候有利润分成，亏钱的时候不用赔。他只要高度差足够，把该拿的收益拿到手，这件事就跟他没关系了，他会发一个新的基金去玩别的。\n\n## 四、周期股：买的不是低估，是反转\n\n1. 这是他专门强调要「用剃刀分开」的一件事\n\n周期股判断低估和别人判断低估是一样的。但你买周期股不是买低估，是要买周期的反转。\n\n他说买入的标准有很多种，低估只是其中一种：「动量投资的人根本不看低估，他看的是舆情是否热闹、后面还有没有更多的傻子来买。」\n\n买入的唯一标准是它能涨。至于你判断能涨的依据是什么，不同的人有不同的标准。\n\n他还专门讲了「奥卡姆剃刀」式的思维要求，并举了自己做律师时的例子：\n\n你问我故意杀人罪怎么判刑，我告诉你判十年以上、无期和死刑。然后你当啷来一句：那你咋知道他杀人了呢？——这是两个完全不同的问题，一个是法律问题，一个是事实问题，不能放在一块思考。\n\n2. 什么算真正的周期股\n\n轮胎、光伏、有色金属、造船、工程机械、养猪，这都是最典型的周期股。医药、消费、公用事业、银行就不是。还有一些是有周期现象但不能称为周期股的，比如券商，我认为石油也是这样。\n\n他给的区分标准很清楚：\n\n真正的周期股，两次反转都是非常容易判断的——一次从底部反转向上，一次从顶部反转向下。而只有周期现象的，这两次判断非常不容易，甚至是随机的。\n\n他举了煤炭和钢铁做反例：最近一次的高景气不是由供不应求来的，是由供给侧改革来的——「你怎么知道它什么时候要搞供给侧改革？」而煤炭又受石油价格牵制，石油又受欧佩克和战争影响，「这东西你咋判断」。\n\n他还批评了「万物皆周期」这种说法：「说万物皆周期的人，都不了解周期股是怎么回事。他根本没听明白你在讲啥。」\n\n3. 高低点一定会有故事说「它不是周期股了」\n\n你不论什么周期股，到周期顶端的时候，它会编个理由说它不是周期股了；反过来到周期底端，它也会编个理由说它不是周期股了。总是这样。\n\n他用铜做了个前后对照：前几年的说法是「铜可以回收利用，挖出来的已经够地球用了，而且中国房地产大开发已经过去，铜永远起不来了」；现在的说法变成「因为AI，铜永远也不够用了」。\n\n否则的话，周期股那么低的时候，大家如果都知道它一定会反转，它能那么便宜吗？\n\n4. 怎么判断反转快到了：还是去捅马蜂窝\n\n你现在上那里头捅一下，说这个行业要反转了。如果他们都给你讲「不可能反转了，这行业完了」，那就快反转了。如果你一说反转，一大堆人附和说你说得太对了，那你千万离远点——那还早着呢，这帮人还没死透，还有上一次套住的人在等着别人来解套。\n\n他补充说「全行业亏损」也要看程度，而且要看有没有出现真正的出清信号：「养猪最好还是等一个相对大一点的企业逐渐破产，现在破的这些都太小；能繁母猪的产能去化也不是很顺利。」他给猪周期的判断只有一句话——「超级波峰之后必有超级波谷，现在还在超级波谷里面，因为超级波峰赚的钱还没亏没。」\n\n## 五、一个反直觉的操作原则：把精力全放在「不亏」上\n\n1. 念叨「坚决不亏损」，会改变你的选股\n\n你进来第一件事要给自己定个纪律：坚决不亏损。实际上你可能做不到，但你起码念叨这件事，你在选择标的的时候就会有所敬畏——因为某些股票会让你亏损50%，你自己就不敢买了。\n\n你把所有的精力都放在一件事上：不亏损。突然有一天你非常幸运，它赚钱了，你就给它卖了。上涨是随机现象，是老天送给你的，别说自己有能耐。\n\n他说这么做的人「就已经不是普通的散户了」，因为「普通的散户都是亏损的」。\n\n2. 反过来，一进来就想赚50%，结果一定是亏50%\n\n你如果一进来我就追求一年挣50%，天天用计算器算多少年能翻倍，你一定亏损——因为你选的标的一定是近期在上涨的。\n\n3. 散户的一生（他描述得很完整）\n\n散户都是在一个大牛市里面进来的，买一个关注度最高、涨得最多、成交量最大的股票。买进去以后最初赚了一点点钱，然后认为自己就是天选之人、这辈子最适合做投资，马上要找老板辞职了。然后熊市来了，开始下跌，不服，跌到这个地方就补仓，继续跌继续补，最后清仓离开股市，这辈子再也不来了。以后儿子说要投资，你就说你要投资我就打断你的腿。这是散户的一生，90%都是这样。\n\n4. 所以第一个目标不是收益率，是年份\n\n你刚进股市第一件事，给自己定个目标——不是挣50%，也不是挣10%，而是「我要活到2031年」。就是到那一年，无论你的财产、你的心理还是你的兴趣，都依然可以在这个市场里面待着。\n\n5. 散户真正的两个优势\n\n第一，没有时间成本，所以你才可以选个坑趴在里面——机构是趴不了的，不是他不知道这么做能稳定赚钱，是他的业绩考核不允许，你趴在坑里，投资人赎回了你就得出来。第二，你的资金量很小，你的交易不会影响价格。\n\n## 六、财报是有弹性的：利润什么时候「告诉你」，是可以选的\n\n1. 减值计提的时点，公司自己说了算\n\n计提的本质不是说计提就损失了，而是「什么时候告诉你他损失了」。那个东西其实早就损失了——从它买来没产生效益、到闲置那天，它的价值就已经归零了。但什么时候告诉你，是由公司自己控制的。\n\n所以他的推论是：\n\n股价正在大幅上涨的时候，我就选择不计提，业绩越来越好看；等这帮人都卖得差不多了、开始下跌了，我再去计提不行吗？\n\n他还教了怎么看出「藏利润」：\n\n你看他计提的都没有了——连十年前的投资、上一任董事长那辈买的设备生产线都给计提了。然后账上现金流和利润极度不匹配：收进来的现金非常多，表现出来的利润非常少；同时存款大幅增加，历史上的贷款大量偿还、快还没了。\n\n2. 所以「基本面变好变坏」的时点也是可以被安排的\n\n股票上涨的时候也都有故事。你听到的故事总是在那件事发生之后——都涨十倍了，你才发现这东西供不应求、基本面太优秀、未来不可替代。而且这还真不是小作文，连财务报表都跟着变；等跌下去的时候，财务报表也变。\n\n基本面究竟变还是不变，取决于有些人的票到底出完还是没出完。\n\n3. 账上的现金也要动脑子\n\n有很多著名公司账上有几千亿现金——你动动脑袋想一想，那些现金还在他账上吗？\n\n他说所以要去看财务费用对不对得上：「账上那么多现金，为什么财务收入这么少？不用买理财，就是存款也比这多。」\n\n## 七、几个零散但重要的判断\n\n1. 什么是最大的利好和最大的利空\n\n最大的利好就是价格低，最大的利空就是价格高。因为你做的所有一切都是为了差价。\n\n他还替一句被广泛嘲笑的话做了辩护：「『我不卖就不会亏』这句话是完全正确的。低买高卖其实也包含这个。你亏就是因为你高买低卖了，只有这一件事可以亏损。」\n\n2. 对下一阶段的判断\n\n全面牛市现在还有机会，但是在此之前会有一次抖动。其中最重要的风险我认为是来自美股，以及A股里那些高估值的科技股。他们抖动完了，可能真正的牛市才开启。\n\n他还说「美股下一次的熊市会极端惨烈」，而那时候「机会遍地」——「真正出现那次抖动的时候，我会重新上融资」。他自己近些年只空仓过两次（2007-2008、2015），而且时间都不长。\n\n3. 现在的收益状况\n\n他坦言今年到当时只有3%到4%左右的利润，并顺势讲了个道理：\n\n你不嘚瑟，那不就是挣得不够多吗？你没有资格嘚瑟。","toc":["一、什么叫低估：四个可执行的判断标准","二、市场的结构：优势投资者与「噪声」","三、这场最狠的一段：围猎模式与「坑是一种资源」","四、周期股：买的不是低估，是反转","五、一个反直觉的操作原则：把精力全放在「不亏」上","六、财报是有弹性的：利润什么时候「告诉你」，是可以选的","七、几个零散但重要的判断"],"url":"https://xueqiu.com/2573414707/405872101","chars":5997},"topics":["什么才算真正的低估"]},{"date":"2026-08-15","bili":{"title":"老木匠 2026年8月15日直播文字稿","text":"## 一、开场与闲聊\n\n刚起来就唠嗑，你们比我都厉害。还没吃完饭，我刚洗漱完。今天不嗑瓜子了，吃点松子。前几年有个我的学生，当时在大学，也听我直播，还给我打过电话。\n\n我如果后来不干这行一直教物理的话，我觉得能成为一个不错的物理老师——据说物理老师有名的补课费比较高。我儿子上高中时我辅导他物理，大学时辅导他法律。物理属于主科，屋里很多孩子如果老师不行的话很难搞懂，它是\"一旦学懂了根本不需要太努力\"的学科，不像数学需要大量习题。物理就是你懂就是懂、不懂就是不懂，做题没用；数学更抽象，需要题海。我儿子第一好的是政治，后来发现他高中选理科选错了，智力结构和我不太一样。\n\n---\n\n## 二、伯克希尔与巴菲特：伟大公司的不可复制\n\n芒格去世了，巴菲特退休了。伯克希尔不会再成为一个伟大的公司。现在你不要用伯克希尔来给自己做注解、做背书——它现在就是一个普通的公司。巴菲特和芒格能忍住不买的东西，职业经理人忍不住，这就是伟大和平庸的区别。\n\n一个家族的传承，你爸爸那一代经营得好，都不敢保证国民老公经营得好，更别说公司传承给职业经理人了。就像赵本山水平再高，也培养不出跟他同水平的徒弟。巴菲特和芒格也一样，培养不出跟他们同水平的人——这种人都是天生的。\n\n伯克希尔和苹果有一点像：乔布斯活着时奠定了苹果的生态，他走的时候生态已经形成，所以即便是个傻子上来，苹果的生态也能维持很长一段时间。但你要想，自从乔布斯去世以后，苹果有什么划时代的产品？iPhone 从三干到十八，有什么本质变化？\n\n现在很多人还拿伯克希尔做注解，此伯克希尔非彼伯克希尔。给谷歌增仓不是很正常吗？他当然忍不住，必然会增仓。砍掉的标的都是下跌的——这和巴菲特、芒格的\"稳定持仓\"已经不一样了。巴菲特时代是极致的安全边际，也不是选错接班人，是选不到跟他一样的人，而且选谁也都是职业经理人，给自己投资和给公司投资的感觉能一样吗？\n\n关键差别：职业经理人必然短期化操作、必然冒险。 薪酬按年衡量，某年业绩好就给大量奖金，某年亏损也不用赔偿。巴菲特给自己投资，投不好是\"相当于有赔偿\"的——他自己跟着赔钱；职业经理人投不好不用赔，投好就给奖金。所以职业经理人一定会进行短期化的冒险操作。\n\n为什么伯克希尔能成为伟大公司？因为它的架构跟别人都不一样——它是唯一一个只为自己投资的公司。但随着巴菲特和芒格离去，它就变成普通公司了。这不是水平不行，是激励模式造成的必然结果。你哪个大公司想做大，都不能由自己亲自操刀，都得找职业经理人，找职业经理人就必然有道德风险，防止不了。\n\n公司走到最后全部官僚化，没有一个例外。初创时蒸蒸日上、心往一处使，做大后拉山头、分派别、内耗——古今中外概莫能外。\n\n---\n\n## 三、职场生存：先理解上司的利益诉求\n\n你在公司做的所有事，都是为自己的利益最大化。你不会考虑公司效益如何，只考虑自己的 KPI 考核机制——HR 给你下了指标，你完成那些指标就行，公司挣不挣钱、黄不黄跟你有啥关系？那是总经理需要考虑的。\n\n这就是典型的\"每一个人在组织体系内都有自己的利益诉求，实际都只为自己的利益服务\"。HR 这门科学，核心不是招聘任命，而是如何把每个人的利益诉求和公司整体利益诉求统合。公司的董事长、总经理，每天想的就是怎么让大家的诉求和公司统一。\n\n你怎么能快速成长？很简单：不要只想着自己的利益诉求，要想你的上一层——直接上层领导他的利益诉求是啥。大部分人只想\"做好我的 KPI 就完了\"，那就没有上升机会。考虑上层多一些，但也不用多到去操心总经理的事（他看不见你，多此一举）。\n\n如果你父母没有这方面经验，就别过多认真听他们的——有些父母自己一辈子在基层，却特别愿意指挥孩子，那等于把自己的失败经验强加给孩子。当然父母都是好心。\n\n---\n\n## 四、做人的基本准则：别乱认干爹干妈\n\n动不动认个干爹干妈，这种我非常瞧不上，即便是玩笑也不能常开。开玩笑是有度的——昨天有人把\"龙哥\"的龙改成耳朵聋的龙，这种恶劣的人身攻击我直接拉黑了两个人。\n\n我跟龙哥经常插科打诨，但我从来没想过拉黑他，虽然他观点跟我从来不一样、有一段嘴太贫我还屏蔽过他一阵，后来很快放出来了。涉及人身攻击的开玩笑，非常讲究智商，是最高等级的说话智慧。\n\n哪怕对九十岁的老头老太太，我啥都敢说——\"国家法律改了九十岁以后可以纳妾了\"，他乐一天。但那叫分寸感。有些人开玩笑是冒犯，是因为他心里永远有一颗冒犯之心。说话的技巧没那么重，你只要心存善意，说的所有话都是善意的；你只要心存恶意，说的所有话绝无善意。\n\n---\n\n## 五、说话的技巧（核心干货）\n\n我说话的技巧是专业的，比做投资更专业。以前写帖子时讲过怎么用口头语、短句。\n\n第一点：心存善意。 先修心。你如果一天到晚是战斗心，就想怼这个怼那个，不管用什么技巧，说出来的话绝不会有善意。\n\n第二点：有目的。 很多人说话自己都没目的、没意义，听的人也不知道他要说啥，虽然没恶意但不吸引人。你想溜须拍马、向同事示好、还是传达信息，得自己想好。\n\n第三点：注重交流感。 说话时要观察对方是否认真在听、是否顺理成章地在听。你不能人家注意力不在这，你非要拽着\"你听我说你听我说\"。我很快能成为酒桌中心，跟我多年讲课有关——讲课不是老师一个人在上头念，要察言观色。\n\n很多人没有交流感，是因为\"自我意识没打开\"——他只关注自己那点事儿，不管你讲啥最后都接一句跟内容毫无关系的话。你说话东一榔头西一榔头，上下句没联系，谁爱听？改变话题要讲究切入，不能咣当一下硬改。\n\n从明天开始，跟同事说话就注重交流感这一条，水平马上上一个台阶——人家不感兴趣，这话就马上结束，不用再坚持。\n\n第四点：用口头语，不用书面语。 书面语逻辑不是单线的（有定语从句，可以回头看），口头语靠时间传递信息，只能向前、单逻辑线。所以口头语要短句、单逻辑线，才吸引人。当然口头语没书面语严密，但帖子不是学术论文——我的长帖子基本是语音输入、基本不改，读起来就是单逻辑线，一口气读完不累。有人挑我逻辑漏洞，我一般不回，因为堵上漏洞你就爱看不下去了。\n\n第五点（最重要，很多人缺的）：先学会倾听。 我前面讲四点，有人根本没听，专门在想\"你这三点到底有没有道理\"——这就是说话的毛病。群体谈话要围绕一个话题转，你不要老强行改变话题。你一直在想\"还有什么没讲到\"，根本没想听我讲过啥。\n\n练习方法： 无论多复杂的东西，争取给你家门口的保安讲明白，很快就能锻炼出来。北京出租车司机可能讲不明白（他比你还懂）。留个作业：明天下楼遇到楼道保洁阿姨，先问\"孩子多大了、上大学没\"，从这儿唠起。 在一个组织里，跟最基层的保安、前台、保洁保持密切联系，会带来意想不到的好处——很多信息正常渠道获得不了（谁和谁关系暧昧，保洁阿姨最先知道）。\n\n这些人是你锻炼说话能力最好的对象，因为他们没啥目的。\n\n---\n\n## 六、AI 与职业替代：律师、医生、程序员\n\n所谓\"人情世故\"——有人听半天来一句\"那不就是那什么嘛\"，好像自己啥都懂。律师行业，AI 不能替代，但会极大提高效率、替代很大一部分工作。原来北京上海审合同按小时收费、费用很高，现在客户也知道你们用 AI 了，给的工时从十个小时降到俩小时。\n\n程序员我不了解，但编程序也是纯逻辑的，现在很多短剧都是用 AI 做、不需要演员了。我认为 AI 第一个落地是在医院诊断——建立大病数据库大模型后，所有检查设备的数据流直接给 AI 分析，根本不需要出片子。医生诊断岗位会大量腾出来，但手术暂时替代不了（手术机器人只是过滤人手抖动）。\n\n---\n\n## 七、中医、创新药与节气\n\n李时珍尝百草，跟今天的新药研发没啥区别——都是经验科学，确定某物质对某地有疗效就去试验。中医是一种治病的理念、诊断的理念，不必非得按五行、经络来定义。中医只有老的才值钱，是因为经验积累。\n\n二十四节气是阳历（太阳历），按太阳直射角定义，每年公转一圈直射角变动分成二十四个等份。冬至几点几分，是因为现在按太阳直射角来算。中国历史上是阴阳合历，主要用太阴历（月亮绕地球），太阳历到明朝才准（西方传教士传来改造后）。闰月分两种：太阳历闰月是每四年多一天（二月），太阴历闰月是因为月亮绕地球不是正好十二圈。\n\n（中间有人抬杠\"节气是阳历\"，我让他先学点知识再讨论。）\n\n---\n\n## 八、股价与业绩不同步：别迷信\"业绩涨股价就涨\"\n\n白酒的业绩很有特点：2021 年股价见顶，但半年报业绩见顶到 2026 年才到——中间差五年。你 2021 年想\"未来业绩还会增长\"，但业绩增长股价不一定增长。\n\n四科（某标的）到 2025 年才回到原来高点，这一年涨了一倍多、两倍多。这些年业绩一直在增长、也在回购分红，但股价就是不涨。所以算基本面不是算市盈率那么简单。\n\n巴菲特买可口可乐是 1988 年，到 1998 年才回到原价，十年不赚钱——你能挺住吗？你有几个十年？巴菲特后来回顾，1988 年没卖出可口可乐是巨大错误。中石油高点他卖了，比亚迪他也卖了。买公司就该一直持有？哪有那事儿。\n\n散户的最大优势：第一没有时间成本，第二买卖不足以影响价格。 你非要学巴菲特（他是因为没这两优势才不得已那么做），就是把优势抛弃了。蚂蚁在池塘里能冲浪，河马冲不了——巴菲特是河马。\n\n极短线动量交易现在不能做，你干不过量化。量化最怕的是游资（做庄的），不是散户。限制量化后游资又回来了，打板的越来越多。\n\n---\n\n## 九、股东人数：识别筹码派发的核心指标\n\n机构有进有出，别太认真——那都是一个时点的数据（比如中报是 6 月 30 号）。机构之间也在博弈、今天买明天卖，但股东人数骗不了人。\n\n股东人数急剧发散，说明大部分是散户拿着。高位股东人数大幅增长，意味着已经没有大资金了、全是散户，散户交易随机，一旦下跌大量割肉，股价靠谁来维持？\n\n低位横盘时散户大量增加，反倒是好事——机构彻底抛弃了，未来寻找潜力标的叫\"机构不持有、研究员不追踪\"，那就是……\n\n（注：原文此处举例\"白酒还是要慎重\"——卖拐就是方刚铁杵在江湖重演，砸盘大阴线是为了卖给你，晚上出谣言继续砸、继续卖，第三天辟谣回弹继续卖，这叫\"方刚别墅\"。先炸两天编个谣言，你以为辟谣了该涨了，却没想到谣言也是人家制造的。高位玩辟谣的多了。）\n\n散户怎么赚钱？让自己成为不普通的散户——通过学习、通过实践。 普通散户赚不了钱。\n\n---\n\n## 十、AI 竞争与制度优势\n\n美股最近很诡异，纳斯达克小阴小阳在一个平台上走。老美在烧钱，我们也在烧钱，玩的是\"看谁先眨眼\"——就看谁先玩不起。\n\nAI 大行业目前的收益都来自融资。我们还有一个优势：可以在应用端强制应用（就像当年新能源车，先让公交、公车必须用新能源）。最终科技革命来的时候，受益的是使用者——AI 极大提高了创新药效率（选型、初步实验都能模拟），设计单位、大公司文员处理效率都提高、降本。\n\n最终拼的是制度，这个我昨天讲过。\n\n美国现在像一个狮王第一次露出疲惫——有人开始可以挑战你了，维护权威的成本提升。你现在咬死这个明天咬死那个，非常费劲。但美国在最近二三十年内还是最强大的国家，美元不会被完全替代，只是边际变化，很慢。美元替代英镑用了五十年，还得保证挑战者期间都不犯错误（苏联当年也在挑战，最后不行了）。\n\n---\n\n## 十一、购买力平价与汇率幻觉\n\n当年最好的同学都义无反顾出国入美籍，是因为物质生活差别太大；现在没啥差别了——你开车我也开车，你住公寓我也住公寓，一日三餐不見得比我好到哪儿去。\n\n美国换窗户花两万美元（合人民币十九万），在中国五万就够了。美国剪头三十美元，中国三十块人民币。为什么？因为美元被高估了。 日本物价更贵、日元被高估（人均收入是我们的四倍，但房子马路不比我们大宽）。香港工资高也是因为港币追随美元、严重高估。\n\n比较两国货币购买力，要按非贸易商品（服务）——你在美国剪头和在中国剪头最能反映真实购买力。美国电视便宜是因为从中国买（可贸易商品），按现在汇率买的当然便宜。美国人很少下馆子、雇人修房子贵，生活质量不比我们高多少。\n\n别妄自菲薄，也别妄自尊大。说\"中国啥都行了美国啥也不是\"是二极管思维。美国金融霸权还强着，改变支付习惯得几十年。\n\n---\n\n## 十二、财政不可持续：古今中外的死结\n\n土地财政变股权财政不容易，是伪命题，只能解决一点点。最终一定靠加税，要么裁员要么加税。现在庞大的公务员队伍按财政能力供养不起，财政可持续永远是大话题。\n\n转移支付最后也没法解决，只能发国债借债度日——美国、欧洲、日本都一样。土地财政原来占百分之五十，突然没了，原来按十个人准备的菜，现在五个人吃就不够了。让人回家有成本（按劳动法得给补偿），一个萝卜一个坑，涉及职能调配，不是那么简单。\n\n《大明王朝》里嘉靖死后张居正改革，也是为了解决财政不可持续。彻底解决就是改朝换代——破产清算本质是赖债。王爷越生越多、财政供养人口越来越多，最终不可持续。英镑当年行是因为日不落帝国不断殖民抢地方。\n\n美国现在眼见着财政困难，利息都还不上了，大家做的努力都是解决短期问题，长期问题谁都解决不了——这是一个死结。\n\n---\n\n## 十三、收尾：保住本金\n\n三个小时了，点赞还没到二十万，你们可真对得起个……最后再背一遍：保住你的本金。大家把\"保住本金\"打一遍，加强印象。\n\n不管干啥第一件事先想保住本金。今年很难、明年也很难，这两年都要保住自己的本金。保不住今年到去年的，千万别被踢出局——我说的保住本金，不是让你离开市场清仓，市场还是有很多机会，而是做投资之前一定要充分预估风险，这是你现在投资的主题。\n\n我去下播了，三个小时，应天时间能长点（他点赞到现在也没到二十万）。就这样吧，谢谢大家啊，谢谢大家点赞，谢谢大家的礼物，再见再见！","toc":["一、开场与闲聊","二、伯克希尔与巴菲特：伟大公司的不可复制","三、职场生存：先理解上司的利益诉求","四、做人的基本准则：别乱认干爹干妈","五、说话的技巧（核心干货）","六、AI 与职业替代：律师、医生、程序员","七、中医、创新药与节气","八、股价与业绩不同步：别迷信\"业绩涨股价就涨\"","九、股东人数：识别筹码派发的核心指标","十、AI 竞争与制度优势","十一、购买力平价与汇率幻觉","十二、财政不可持续：古今中外的死结","十三、收尾：保住本金"],"url":"https://www.bilibili.com/opus/1236780513470971961","bv":"","minutes":0,"chars":5670},"ai":{"title":"老木匠·2026年8月15日：忍住不买，就是能力","text":"## 一、伯克希尔为什么不再是一家伟大的公司\n\n1. 他的判断很直接\n\n芒格去世了，巴菲特退休了，伯克希尔就不会再成为一个伟大的公司了。现在你不要用伯克希尔来给自己做背书，它现在就是一个普通的公司。\n\n他给的理由是一句很值得记的话：\n\n巴菲特和芒格能忍住不买的东西，他们忍不住——这就是伟大和平庸的区别。\n\n他顺势把这句话对应到我们自己身上：「那些时髦的标的，你能忍住不买，那就是你的能力。我告诉你，大部分人都忍不住。」\n\n2. 根子在架构：自己给自己投资 vs 替别人投资\n\n这是他这段最核心的分析：\n\n原来巴菲特在的时候，伯克希尔相当于自己给自己投资。自己给自己投资，和你作为职业经理人给别人投资，那选择是完全不一样的。\n\n他把两者的差别拆得很清楚：巴菲特投不好，自己跟着赔钱，相当于有赔偿；而职业经理人投不好不用赔钱，投好了却有大量奖金。\n\n所以职业经理人的特点就是一定会进行短期化行为的操作，一定会冒险。因为是按年衡量的——某一年业绩特别好就给大量奖金；如果这个策略只能挣一年钱、以后会亏损，那以后亏损也不用他赔。\n\n所以他的结论是：「伯克希尔为什么曾经能成为一家伟大的公司？因为它的架构跟别人都不一样，它是唯一一个只为自己投资的公司。随着巴菲特和芒格的离去，它就变成一个普通公司了。」\n\n3. 证据：增仓的都是上涨的，砍掉的都是下跌的\n\n他举了当时的操作做印证：给某科技公司增仓、把一家处在低迷期的酒类公司砍掉。\n\n老爹他一定也是追涨杀跌了——增加的标的都是上涨的，砍掉的标的都是下跌的。\n\n4. 这不是「选错接班人」，而是选不到\n\n那不算选错接班人，那选不到他那样的。而且你选谁，他不也是职业经理人？\n\n他打了个比方：「赵本山水平再高，他也培养不出来跟他一样水平的徒弟——那不是赶不上他，是根本不在一个量级上。这种人不是培养出来的，都是天生的。」\n\n5. 顺带的对照：苹果为什么还能维持\n\n他说伯克希尔和苹果有个重要区别：\n\n乔布斯走的时候，苹果的生态已经形成了。所以即便是个傻子上来，这个生态也能维持很长一段时间。\n\n但他紧接着提了个问题：\n\n自从乔布斯去世以后，苹果有什么划时代的产品吗？iPhone从3干到18，有什么本质的变化吗？\n\n## 二、所有的公司走到最后都会官僚化\n\n1. 这是普遍规律，不是某家公司的问题\n\n没有一个公司——初创时期大家都在一块，心往一处使、劲往一处使；等到公司做大做强以后，各个公司都是一样：拉山头、分派别、进行斗争、内耗。哪个公司都一样，古今中外，概莫能外。\n\n2. 职业经理人真正在乎的是什么\n\n谁能决定你的上升渠道，你就把谁伺候好。至于说这个公司最后赚不赚钱、股东赚不赚钱，这跟职业经理人有啥关系？\n\n他补了一层时间维度上的分析：短期股东回报还跟他的奖金有关，长期回报就更没关系了——「你做一个20年规划，你20年说不定被解雇了，做20年规划有啥意义？巴菲特可以给伯克希尔做20年规划，你作为职业经理人做不了。」\n\n3. 延伸：公募基金经理也是同一个道理\n\n你不用埋怨公募基金这些人追涨杀跌。让你去当公募基金经理，你做的模式跟他今天做的是一模一样的。你要按照给自己投资那种模式，说我现在忍忍、几年以后准备赚大钱，那你干脆做不下去——因为买你基金的基民不支持你，两年业绩不符合预期，人家用脚投票就都赎回了。\n\n不是水平不行，这就是这种激励机制所造成的必然结果。\n\n4. 落到管理学上的一个观点\n\n他把这件事上升到了一个更一般的道理：\n\n每一个人在一个组织体系内，都有自己的利益诉求，实际上都只为自己的利益服务。所以人事管理为什么是一门科学？就是你如何把每一个人的利益诉求和公司整体的利益诉求统合起来——让每个人在为自己利益奋斗的同时，客观上就导致公司更好。\n\n他还讲了一个很实在的职场建议：\n\n大部分人都会想「我做好我的KPI就完了」，那你就没有上升的机会。你要考虑你的直接上层领导他的利益诉求是啥——但也别考虑过多，你一进公司就给总经理操心，那反倒是个问题。\n\n他还提醒：这些本该是有社会经验的父辈传授的东西；如果父母一辈子在基层工作却特别愿意指挥你，「那不相当于把自己的失败经验又强加给孩子」。\n\n## 三、开玩笑是最高等级的说话智慧\n\n1. 掌握不好的人，问题不在技巧\n\n开玩笑是最高等级的说话智慧。如果你对自己开玩笑没有那么大的信心，认为不可能精确掌握，那我建议你不要跟任何人开玩笑——开不好就跟骂人一样。\n\n2. 真正的分野在于心里存的是善意还是恶意\n\n说话的技巧并没那么重要。你只要心存善意，说的所有话都是善意的；你只要心存恶意，不管怎么装、怎么修饰，这句话说出来还跟骂人一样难听。话是你心里的表现。\n\n他说有的人开玩笑之所以变成冒犯，「是因为他心里永远有一颗冒犯之心」。","toc":["一、伯克希尔为什么不再是一家伟大的公司","二、所有的公司走到最后都会官僚化","三、开玩笑是最高等级的说话智慧"],"url":"https://xueqiu.com/2573414707/407225546","chars":1968},"topics":["忍住不买，就是能力"]},{"date":"2026-08-14","bili":{"title":"老木匠 2026年8月14日直播文字稿","text":"## 一、开场与直播间闲聊\n\n中午好，看来都是愿意跟我唠嗑的人。这直播间也没啥内容，你说来看有啥意思，我也不敢讲有内容的东西——到现在抖音还没给我解禁，连评论都不能评，想在直播间里买点东西讨价还价都讨不了。所以随便讲就完了，我自己也得谨慎一点，有些东西确实有一些违规的问题，但我认为我能控制好。\n\n我发现很多所谓网红的直播间，人数也没我这儿多。他们的粉丝比较随机，不像我这些进来的基本都是铁粉。我直播间里有一个指标叫\"驻留时间\"，就是你连续听的时间是长的，这个数据我比别人好。但确实总人数还是少，推流被动推进来的我也不喜欢，而且他们进来说的话也不上道，不需要太多人。\n\n你这个直播间如果获得大众的认可，那你就一定不要听，因为他的观点一定迎合了大众，那就一定是\"苏家\"的想法。你看有些讲财经的直播间有两万人，你连看都不要看，最好拉黑掉，否则他会经常推流给你、最后误导你。\n\n（中间任命了几位房管，开了些玩笑，提醒大家网络或设备没声音时检查自己的设备，别老跑来说没声。）\n\n---\n\n## 二、黄酒：小众必选消费的抗通胀逻辑\n\n有人推黄酒。黄酒我原来一直都在看，但确实没有太便宜的标的——会稽山、金枫酒业、古越龙山，就这几个，都不便宜。\n\n黄酒是一个小众酒类，它有一个好处就是未来可能会抗通胀。大家不要把它理解为普通消费股，不能从消费股的逻辑去理解。像这种小众类的必选消费，最大的好处是可以抗通胀。黄酒在小众里也属于必选，喝的人粘性非常强。越是在特别低迷的时候，消费者粘性就越强——喝黄酒的是固定群体，这种固定群体、固定消费的，几乎是零增长行业，它有一个重要功能就是抗通胀。黄酒作为佐餐酒也非常适合，我不知道为什么它没有普及开来，这些年是被白酒冲击的。\n\n而白酒在冲击过程中，并不是因为多么好喝，而是它最终变成了一种符号，甚至有点货币化了——在某些特殊流通领域里作为一般等价物，有点像看守所里的烟或方便面。所以吃饭时用白酒的品牌来衡量重视程度。这些年黄酒、啤酒在和白酒竞争时吃了亏，因为它们做不了这个特殊功能。\n\n白酒是房地产时代大发展的影子股。 等房地产不行了，白酒就不行了。当经济不以房地产为主要行业时，白酒的特殊功能（一般等价物、送礼、囤积、按年份分级）就不需要了，回归普通消费品，需求量会极度减少。最要命的是，一旦需求出现缺口，原来囤积的东西就会变成竞争性卖盘。\n\n现在房价跌幅开始放缓，但我看不出房地产反转的迹象。房价可能跌幅放缓是真的，现在倒是买二手房的好时机，但你别去碰水泥——基建投资下降这么厉害，水泥是快消品，不能储存、也不能长半径运输，价格弹性很大。\n\n---\n\n## 三、非银金融与保险：熊转牛那一瞬的高弹性\n\n保险业我看不懂它的财务报表，刚进市场时看好过一段（因为巴菲特看好保险），买过一个著名保险公司，但拿出报表怎么钻研也看不懂它是怎么赚钱的，后来就不参与了。\n\n但保险什么时候有高弹性成长期？就是大市由熊市变牛市的那段转折过程。因为保险公司投资了大量权益市场，跟券商一样，由熊转牛时一定会来一次重估——这也是我二四年特别看好券商、二四年之后就不再关注的原因，最确定的机会就是熊转牛那一段，真正到牛市时它已经被重估完了，性价比不高。\n\n非银金融都有这个特点，跟权益市场热度高度相关，最好的投资时候是熊到牛转瞬那一瞬间。等持续牛市时它反倒没太大优势，因为成熟投资者会想牛市早晚结束、提前预防，它就会在高位震荡。为什么管券商叫\"牛市骑手\"？就是因为它先涨——先知先觉的资金反应早。\n\n---\n\n## 四、能力圈：只做自己能提前判断的事\n\n你一定要问自己：你是第几个知道这个消息的？如果是最后一个知道，这消息对你没有任何意义。要适度超前，就得多学习，因为不同产业之间是有咬合的。\n\n我不做科技，是因为了解不了科技因果的变化——今天说建数据中心要用光模块，光模块里还有什么磷化铟、什么芯片，判断起来太费劲。我的长项在宏观经济：我能通过阅读公开文件，预判汇率、利率、货币发行量、国家财政政策的变化，再判断这些变化影响哪个行业。这就够了。\n\n大家要懂什么叫能力圈。彼得·林奇书里提过，医生都买油气股、油漆行业的人都买医疗股——都觉得自己行业净是缺点，看别人远处的东西全是优点。当你对某些东西信心满满时，应该问自己：是不是因为不懂，所谓无知者无畏？\n\n---\n\n## 五、K型分化与AI时代的就业、分配\n\n现在经济状况出现所谓的 K 型分化：一方面出口进口都很热闹、有的行业订单供不应求；另一方面大部分传统行业不断缩减开支，PMI 连续在 50 以下，说明行业热度在收缩。这是结构转型必然带来的，不是暂时性的。\n\nAI 人工智能一定改变世界，但它最终一定造福全人类，绝不只造福少部分人，否则社会就动荡了。随着 AI 提高劳动生产率、所需人工大量减少，这些人得怎么生活？有几个办法：\n\n1. 用 AI 生产的行业多加税，国家做类似转移支付的财富再分配；\n\n2. 用人的岗位尽量降低劳动时间——未来可能每周工作四天、三天，一个岗位让两个人倒班，需要的人工反而更多；\n\n3. 大力发展服务业——人从物质生产被淘汰出来后，人和人之间的互相服务（养老、陪伴、导游、端盘子、修脚搓澡）不能被机器替代，人闲下来服务消费就会更多。\n\n接下来各国都会面临 K 型（收入不均衡）问题，重新调整均衡靠的是制度。普选制无法支持扶贫这种\"杀富济贫\"的政策——你把扶贫作为竞选目标一定选不上。而我们能解决这个问题，制度上更有优势。任何王朝覆灭、国家衰落，都是因为没解决好分配问题。\n\n当前 AI 所处阶段： 基本还在硬件建设时期，相当于一个初创公司在盖厂房、招工人、调设备，什么产品都没生产。现在买硬件的是谁？是它们自己——英伟达相当于卖钢筋水泥的，钢筋水泥卖给修高速公路的，但高速公路上跑的运输公司不赚钱、空跑。全社会的钱都在赌一件还没产生收益的基本建设，这个循环能否持续，是需要考量的。\n\n---\n\n## 六、美元重置、美债与防风险\n\n解决美债问题只有一条路：美元币值必须重置（通胀）。你需要仔细思考的是——美元重置发生在动荡之前还是之后？所谓动荡，就是会不会产生一次类似 2008 年金融危机那样的股市大动荡，而那次动荡的作用就是重新分配资产。\n\n2008 年金融危机的意义在于它解决了债务问题——通开印钞机，所有东西大幅涨价，只有一个东西价格没变，就是债务，全世界的债务一次性解决。今天的美元购买力，和 2008 年之前已经完全不可同日而语。\n\n老钱比你懂这个道理，先让老钱持有黄金、上岸。所以现在这段时间你最大的问题是不要被淘汰——你不需要追求这个追求那个，玩的就是一个\"挺\"字，挺到黎明你就赢了。穿厚点、别嘚瑟，你啥也不需要努力，只要挺住。\n\n但你也不能持有现金退出市场就\"自杀\"了——防风险是活下去，不是回家上吊。两融余额现在还有两万六千多亿，这部分人能挺到黎明吗？韩国前一阶段好几十万人爆仓、财富清零，那些人已经是输家了。你不用分析谁是赢家，关键是你自己别做输家。\n\n投资市场生存很有意思：你只要看清大局，站在水的下游等着就行，不用追着水跑，看准了等着。 我们不用学日本——日本经济主权不独立，受外来势力影响，政策贯彻不下去。日本最好的方式就是任由日元贬值，但美国不允许。民选政府只考虑选期内的事，不会考虑两年以后。\n\n---\n\n## 七、民选制度与效率：奢侈品与清流\n\n民选是个奢侈品，你得能玩得起——得有大量冗余时间和冗余资源。欧洲能玩这套，是因为资源一直丰富加上掠夺性扩张；贫困的地方玩不了，按这种低效决策系统早就崩溃了。\n\n欧洲最大的问题不是难民，而是高度意识形态化、满脑子主义。欧洲就像个老贵族，穷得叮当响还在别人面前装。历史上这种\"成平日久\"的社会都有共同特征，各国文化脉络是一样的——你不劳动不吃饭，谁也金钟罩不了。\n\n\"清流\"的特点是永远站在道德制高点，说的都对但没法实施，从逻辑到逻辑。欧洲现在那些极右翼（德国魏德尔、法国勒庞）反而是正常人，因为全世界供养他们的时间太长了，他们已经不习惯了。\n\n---\n\n## 八、当前各板块看法\n\n证券： 从 2024 年 10 月 8 日创造高点后基本就是鸡肋，我在那天之后就不再看证券了，有色也不看。一切都没法预判，不确定性太强。\n\n煤炭、石油： 受政策影响太大，周期没法预计。煤炭很多时受石油影响，石油又受国际政治影响，很难判断。\n\n低买高卖看似简单，谁都能做到，但你不愿意做。 低的时候你觉得还能更低，高的时候你觉得还能更高——你最终在市场上博弈，就是跟自己的心理博弈，不需要和别人博弈。看公募：不持有的基本都在低位，配置最高的你就卖。但给你代码你也不信，说完了你也不敢买，还会冷嘲热讽。\n\n（回忆当年：紫金被称为\"阿斗\"时四块多，浓眉大眼；龙头大家都知道是龙头，它能低估吗？高股息叫\"高股息概念\"——越涨股息率越低，本身就是悖论，涨一倍股息率掉一半。价值投资叫\"价值投资概念\"，高股息是吃股息的，按道理不该涨。）\n\n别老盯着别人篮子里的鸡蛋，看好自己篮子里的就行。你一惊一乍血压都得高。散户就是凭感觉，别老问我依据——我给你讲啥依据？没依据，我就是感觉。\n\n研报是\"天气实况\"不是\"天气预报\"——上涨时目标价越给越高，下跌时越来越低，没有预报功能。公开领域的研报都是胶皮分析法。\n\n---\n\n## 九、市场选择与资金策略\n\n我投境外的东西不懂，港股我都没投过（有港股通但从来没投），A 股足够我投了，A 股的波浪足够我冲浪。换池塘还不熟悉环境，港股看财务报表、看估值低你就受不了——估值低跟你有啥关系？你玩的是价差。而且港股收红利税。\n\n有些人那点钱还搞分散投资、投美股，扯淡。A 股还不够投？美股波动起来你根本没有跑的机会。\n\n钱少的时候考虑高赔率，钱多的时候考虑高胜率。小资金搏高赔率，像买彩票中一把逆天改命；大资金再去赌没意义，世界最大的资金都是买债券的。适合别人的策略不见得适合你，我讲的只适合我自己。\n\n\"多大算大资金？\"——你问这话就说明你资金还小，等钱多了你就知道。就像\"牛还在不\"——你只要问这话就说明牛还在，等牛不在时没人问了。\n\n---\n\n## 十、AI时代的个人出路与时代转折\n\n这个时代你一定要保住你的钱，别豪情万丈觉得要为国家科技做贡献了。挣钱不容易、赔钱快。未来 AI 发展起来还有一段更困难的时期，大量人口被剥离在就业之外，镇痛期一定会有。\n\n孩子干啥？不如学烙饼——菜市场里烙饼烙得好的人，养活一家一点问题没有，一天就上一会儿班。未来在办公室做 PPT 的活，AI 一分钟就干完了：AI 写的 PPT 交给领导，领导用 AI 再审一遍，人慢慢都退化了。服务业退化不了——修脚搓澡永远替代不了。\n\n就业不好是个伪命题，是因为很多东西你不愿意干。我甚至让我儿子开个小咖啡馆积累做生意的经验，不指着他赚钱，相当于烧投资人的钱攒经验。\n\n你这个年龄如果四十五周岁以下、又处在极易被 AI 替代的岗位上，就得有危机感，那东西说来就来。 不仅仅是地方政府开支不足，很多公务员岗位也会被严重替代——大部分是信息处理，太容易被替代。教育行业更容易被替代。公检法不会被替代，但那工作太累。\n\n---\n\n## 十一、收尾：投资不会被替代\n\n未来 AI 不光是投资问题，对社会的改变方方面面都会体验到，你得思考怎么生存下去。\n\n我认为投资是不会被替代的——因为投资决策不会被替代。你别看现在 AI 搞投资如火如荼，我认为替代不了，因为投资永远在博弈，有博弈就不是机器能替代的。博弈涉及人性，很难被替代。机器的博弈最终也是人的博弈，规则和算法是人教给它的。\n\n好，谢谢大家啊，已经到二十万了。谢谢大家陪伴我一下午，聊这些没有什么营养的东西，谢谢，再见！","toc":["一、开场与直播间闲聊","二、黄酒：小众必选消费的抗通胀逻辑","三、非银金融与保险：熊转牛那一瞬的高弹性","四、能力圈：只做自己能提前判断的事","五、K型分化与AI时代的就业、分配","六、美元重置、美债与防风险","七、民选制度与效率：奢侈品与清流","八、当前各板块看法","九、市场选择与资金策略","十、AI时代的个人出路与时代转折","十一、收尾：投资不会被替代"],"url":"https://www.bilibili.com/opus/1236392798183227463","bv":"","minutes":0,"chars":4810},"ai":{"title":"老木匠·2026年8月14日：AI的账、美元重置与「挺」字诀","text":"## 一、白酒是房地产的影子股\n\n1. 他2018、2019年就说过这话，当时没人信\n\n我当时就告诉他们，白酒其实就是房地产行业大发展的影子股。等房地产有一天不行了，白酒就不行了——他们都不相信。\n\n2. 关键在于：白酒当年被「货币化」了\n\n他解释白酒真正的特殊之处，不在于好不好喝，而在于它在某个特殊领域里充当了一般等价物：\n\n它有点像看守所里的香烟和方便面——在某些特殊领域里，一般等价物可能就是白酒。所以你吃一顿饭的时候，人家会用你用的白酒品牌来衡量你的重视程度。\n\n他说这就是啤酒、黄酒竞争不过白酒的原因——「啤酒和黄酒实际上是做不了这个特殊功能的」。\n\n3. 这个功能是怎么来的：权力越大，寻租效应越强\n\n那是因为当年房地产时代，相关工作人员手里分配资源的权力过大。给你一块地和不给你一块地，差别非常大，所以每个人都去寻租——寻租的时候高端白酒就是敲门砖。\n\n他还拆了后面衍生出来的两层：先是应酬要喝、还要作为礼物赠送；然后因为赌它涨价，就有了囤积功能；囤积之后开始比较，普通的不行了就比年份——「就像领导分级似的，酒宴也按五年、十年分成不同等级」。\n\n4. 房地产时代结束，白酒就回归普通消费品\n\n回归普通消费品，它的需求量就会极度减少。而最要命的是，一旦需求出现这样一个缺口，那么你原来囤积的东西就会变成竞争性的卖盘。\n\n他说这跟房子是一个道理：「涨价的时候他没有房子，等一跌价的时候，到处都是房子都卖不出去。」现在经销商手里的库存已经很多了，还不算那些送礼送到普通人家里的——「这些都需要消化，那就需要时间」。\n\n5. 所以「年轻人不喝白酒」是个伪解释\n\n跟什么现在的年轻人不喝白酒一点关系都没有。你为啥现在不喝白酒了？因为你从事的职业都不需要喝。如果你现在还是干房地产、干基建、给政府干配套工程，那你该喝还是得喝，跟你年轻不年轻没有关系。你现在都是编程的、做AI的，你跟谁喝酒去？\n\n6. 顺带：黄酒的投资逻辑不是消费股逻辑\n\n他说黄酒标的一直不便宜，但值得注意的是它的另一重属性：\n\n像这种小众类的必选消费，它最大的好处是可以抗通胀。越是在这种特别低迷的时候，说明他的消费者粘性就越强——喝黄酒的那些人就是一个固定的群体。这种固定消费、几乎零增长行业的消费品，它有一个很重要的功能，就是可以抗通胀。\n\n## 二、非银金融：为什么叫「牛市骑手」\n\n1. 最确定的机会在「熊转牛」那一段\n\n他讲了保险和券商共同的规律：\n\n保险公司投资了大量权益市场，所以跟券商是一样的。当市场由熊转牛的时候，它一定会来一次重估，所以这一段时间就是它涨幅最大的时间。等你真正到牛市的时候，它实际上已经被重估完了，性价比并不高。\n\n这也解释了他自己的操作：「为什么我2024年特别看好券商，然后2024年之后就不再关注这个东西了。」\n\n2. 反过来也一样，向下的重估空间同样大\n\n它从牛转熊的时候，向下重估的空间也很大，所以它的波动也很大。\n\n他还补充说，持续牛市的时候非银反倒不怎么涨，会在高位一直震荡——因为成熟投资者都会想「牛市早晚会结束」，就会提前减。要再涨，得等市场又拉上一个台阶、重新对权益投资估值。\n\n3. 「牛市骑手」这个称呼的真正含义\n\n它先涨的原因是因为它看得比你远。等你发现市场已经变好了、券商业绩非常好的时候，那么它已经开始卖了。\n\n他由此引出一个很重要的提醒：\n\n你所谓的研究基本面，不是说你研究现在的基本面——你一定要判断，你的基本面研究是滞后的还是超前的。\n\n## 三、能力圈：芒格那句「我不参与别人聪明我愚蠢的游戏」\n\n1. 芒格的原话\n\n我不会参与别人聪明我愚蠢的游戏。\n\n他说芒格讲的其实就是科技股——「你到这个里头来的时候，别人都明白，就我一个人不明白，那我为什么要参与这件事呢？我有我自己的强项，在那个领域里面是我聪明别人愚蠢，那我做这些行业就够了」。至于那些愚蠢的人怎么办？采访者追问时芒格的回答是：「我也没有什么办法，我只能祝那些人好运。」\n\n2. 他自己的能力圈在哪\n\n我的长项在于宏观经济——未来的汇率、利率、货币发行量、财政政策，这些东西我通过阅读公开文件可以做出自己的预判。然后我会判断这种宏观经济对哪个行业会有影响，这是我的长项，我做这个就够了。\n\n他再次澄清了对科技的态度：\n\n我不投资它是因为我判断不了它们的因果关系，所以不存在看空看多的问题。你说涨了也没有用，我判断不了，我就不会买。\n\n3. 为什么大部分人不投自己所在的行业\n\n彼得·林奇书里提到，医生都买油气股，油漆行业的人都买医疗股——都觉得自己那行业全是缺点。看别人远处的那个东西，你看不到缺点，看到的全是优点。\n\n他由此给了一个自省的方法：\n\n你缺点看多了，你胆儿小；你没看到缺点的时候，你就胆儿大了。所以当你对一些东西信心满满的时候，你应该问自己：是不是因为自己不懂？\n\n## 四、这场最长的一段：AI带来的真正问题不是技术问题\n\n1. 先看清今天的AI处在什么阶段\n\n今天的AI基本上就处在一个硬件建设时期，它现在还没有起到任何作用。假如把AI当成一个公司，那你可以把这个公司理解为初创期——它还在盖厂房、还在招工人、还在调试设备，什么都还没有生产。\n\n如果把整个AI看成一个企业，这个企业现在是没有任何收益的，它只在投入。\n\n2. 那钱从哪来：现在买硬件的人就是他们自己\n\n他把这个循环拆开讲：\n\n英伟达的芯片卖给谁？卖给数据中心。数据中心的算力租给谁？租给大模型公司。大模型公司最后把服务卖给谁？没有卖的——OpenAI到现在也没有盈利，还在出现巨额亏损。它只有两个渠道：股权融资和债权融资。而这个股权投资里头有一大部分，最终可以间接追踪到英伟达这样的硬件公司。\n\n所以现在买硬件的人就是他们自己。你别看英伟达效益多好，如果这套烧融资的循环一旦切断，英伟达的利润立马就没了。\n\n3. 他给的通俗比方：修高速公路\n\n英伟达相当于卖钢筋水泥的。钢筋水泥卖给修高速公路的人；修高速公路是为了收过路费；谁交过路费呢？运输公司。那运输公司现在赚不赚钱？不赚钱，没有货物运输，他们在上面是空跑。\n\n那问题就来了：运输公司每天开着车在高速公路上空跑，钱从哪来？钱从上游卖钢筋水泥的那来——要不就是借的，要不就是卖钢筋水泥的人又把钱投给他们。这就是现在AI人工智能的整个产业。\n\n他强调这不是说方向不对，「发展的方向都是对的，但问题在于你烧钱是否还能烧得起」。而最直接的威胁是：\n\n一旦美联储收紧货币政策，资金成本变高、融资变得非常困难，那么这种循环是否还能按现在的规模循环下去？\n\n4. AI真正的问题：大量劳动力会被挤出就业\n\n他明确说自己从不反对AI——「AI一定改变世界」，但要看到它必然带来的后果：\n\nAI的大发展会带来极大的劳动力剩余。由于现在AI集中在一个非常窄的行业里，而这个行业的大发展会对其他所有行业形成对劳动力的挤压，所以劳动力一定会被挤出经济领域，那就一定会带来内需不足。\n\n这件事不仅仅在中国如此，未来在美国也是如此。而且未来会越来越严重。\n\n5. 但结局不会是「大家都失业回家」\n\nAI最终一定是要造福全人类的，绝不会只造福少部分人——否则这个社会就没法生存了，就动荡了。\n\n他给出了三条他认为必然会走的路径：\n\n**第一，对用AI生产的行业加税**，做类似转移支付的财富再分配——「你不用人可以，你不用人你得加税」。\n\n**第二，缩短劳动时间，一个岗位让两个人干**。他做了个历史对照：我们小时候每周工作六天、每天8小时（周工时48小时），现在是五天8小时，「那未来会不会出现工作四天、工作三天？」\n\n**第三，大力发展服务业**——「人和人之间的互相服务，是不能用机器替代的，有些东西它是精神需求」。他举了养老、陪伴、导游这些例子，并指出一个关键变化：\n\n你人闲下来之后，商品消费反倒不重要了——你不能今天买个电视、明天买个电视。但服务消费不一样，人闲着总得有事干，就连回家玩电子游戏也是一种服务。\n\n6. 最后拼的是制度：怎么把红利分下去\n\n各个国家都会面临K型分化、收入不均衡的问题。这个时候要重新调整这种分配，靠的是制度，拼的就是制度。\n\n他给了一个很有说服力的论证：\n\n没有任何一个民主社会敢拿扶贫作为竞选目标，因为你一定选不上。普选制是无法支持扶贫这样一种政策的——所谓扶贫就是杀富济贫，你扶贫的钱一定是多收税来的。\n\n所以他的判断是：\n\n今天的人工智能解决的只是技术问题。它所带来的社会问题现在还没有提上桌面——未来的社会问题，才是本次AI革命所面临的最大问题。\n\n他还讲了分配问题的分量：「任何王朝覆灭、任何国家走向衰落，都是因为没有解决好分配的问题，而不是因为技术不行了。」并用一个比方说明分配失衡的后果：\n\n在一个没有厕所的地方，你钉一万个牌子写上不准随地便溺也没有用，因为活人不能让尿憋死。同样道理，如果这个地方的人都吃不上饭，也没有人甘心去饿死，他一定得找吃饭的办法。\n\n## 五、美元重置：会发生在动荡之前还是之后\n\n1. 这是他这场抛出的核心思考题\n\n他说解决美债只有一条路——美元币值必须重置，这个他讲过多次。但接下来这个问题需要特别仔细想：\n\n这个美元重置，是发生在动荡之前还是动荡之后？我所谓的动荡，就是会不会产生一次类似2008年金融危机那样的股市大动荡。\n\n2. 为什么可能需要先有一次危机\n\n你今天让他去降息，他绝对降不了；你让他重新QE，他也QE不了。那你既不降息也不开动印钞机，如何让美元的币值重置呢？所以说，会不会先有一次股灾呢？\n\n如果真的产生了一次类似2008年那样的金融危机，那么美联储重新开动印钞机，是不是就顺理成章了呢？\n\n3. 那次动荡真正的作用：重新分配资产\n\n开动印钞机最终的结果就是所有东西都会大幅涨价。而只有一个东西的价格是没变的，就是债务——所以全世界的债务就通过这种方式一次性解决完了。你不要认为2008年的金融危机没有意义，它解决了债务问题。\n\n4. 「如何让猫舔自己的屁股」\n\n他用这个说法解释为什么不能直接印钱：\n\n你得边舔，你还得边感谢。你如果现在直接开动印钞机，直接就下台了。\n\n他还提示了一个观察角度：\n\n不让老钱撤走的最简单办法，是让老钱先都持有黄金——你不再持有债券不就完了吗？先让老钱上岸。\n\n## 六、现在玩的就是一个「挺」字\n\n1. 这段是他给的行动纲领\n\n比如说这块地现在已经养活不了这么多人，那就需要一次严冬、需要一个特别冷的晚上，然后剩下的人就能活得很好。所以这就是为什么我一直告诉你要防风险。\n\n最终当这种东西来的时候，你都不需要干什么，你只要挺到黎明你就赢了。现在玩的就是一个字——挺。你能挺到明天天亮，那么冻死的人的锅碗瓢盆是你的了。\n\n你啥也不需要努力，你现在穿厚点就行。你别嘚瑟，别穿个小背心出去乱溜达显自己的腰条。\n\n2. 别想着谁是赢家，先保证自己不是输家\n\n你关键问题是不要想着谁是赢家，你自己别做输家就行。你只要不是输家你就能赢。你根本不需要往前跑，你就挺住，让那些跑的人都累死就完了。\n\n他用韩国做了个现成的对照：「韩国未来的赢家是谁你不用分析，因果链条特别长。但韩国的输家你不是已经知道了吗？那么多人爆仓已经出局了。」他还提醒了一句：「那些人财富都清零了，那钱去哪了？它一定有地方去，它没有消灭。」\n\n3. 又一次澄清：防风险不是空仓\n\n我让你是活下去，不是让你回家就自杀了。你怕冻死，那我回家直接上吊了，那就冻不死了吗？你持有现金退出市场了，你还防什么风险？\n\n他也反对走另一个极端：\n\n什么东西都要做两手准备，别老要走极端——要么我就满仓满融，要么我就空仓，你咋就没有中间地带了？\n\n他给的具体做法是：挑那些你认为一定能挺过这场寒冬的，把融资清掉，然后持有——「你可以防两个风险：万一这事根本不发生呢？万一没有寒冬呢？」他还提到一个数字：市场两融余额还有2万6千亿，「有人看着这个数，哈喇子都快淌出来了——这些人能挺到黎明吗？」\n\n## 七、低买高卖：你不是判断不了高低，你是拗不过自己\n\n1. 他对「十年老股民有什么秘诀」的回答\n\n很简单，就是低买高卖。他说谁也做不到，我说谁都能做到——你只是到时候不愿意做。我让你低买的时候，你会觉得我在骗你钱；让你高卖的时候，你也会觉得我在骗你钱。\n\n没有一个人不知道什么是高、什么是低，你只是拗不过自己。你只是觉得高的时候还能更高，低的时候还能更低。\n\n2. 一个很实用的判断工具：看公募配置\n\n这是这场里最能直接用的一条：\n\n你看公募基金哪个行业配置得最低，那个行业基本上不会高估，因为没人买；哪个行业配置得最高，那就是高了，你卖了就完了。但问题是到那个时候你又不舍得卖。\n\n3. 「高股息」这个说法本身就是悖论\n\n高股息的股票怎么能一个劲儿涨呢？你越涨股息率不就越低吗？你涨一倍，股息率不就掉了原来的二分之一了吗？所以当你已经听说高股息的时候，它已经股息不够高了。\n\n他还给了个一贯的判断：\n\n我们这里的价值投资就叫价值投资概念，我们这的高股息就叫高股息概念。\n\n4. 买龙头这件事\n\n动不动就买龙头。龙头你知道是龙头，别人也知道是龙头，它能低估吗？\n\n5. 低位买了拿不住，还是在跟自己斗争\n\n他回忆当年某个标的四块多钱、被大家叫「阿斗」的时候：\n\n你那时候不知道它是低位，才四块钱。你低位买入了拿不住，也是因为你在和自己斗争——那个时候它依然很低，那你为啥要卖掉呢？你不就是又产生怀疑了吗？以为低位的东西永远都会在低位。\n\n## 八、研报只有「实况」，没有「预报」\n\n1. 他对卖方研报的评价\n\n你所能看到的这种公开领域里出来的研报，都是橡皮筋分析法：这个东西上涨，它的目标价就越来越高；下跌，它的目标价就越来越低。他们的东西不叫天气预报，叫天气实况——没有预报功能，只有实况功能。\n\n他补充说自己也看研报，但只取一部分：\n\n我看研报是要看一下他们的数据，他们在整理数据上对我来说还是有用的。但是他们的分析意见对我来说一文不值。\n\n2. 「你这没有数据」这种指责\n\n他回忆当年被人用「你只有意见没有数据」怼的经历，反问：\n\n我就想问问，你真知道数据之间的因果关系吗？如果按计算器就能做好投资的话，那全世界的首富应该都是会计。\n\n他还举了个现成的例子：某著名投行给某公司评了1500的目标价，有人拿来当依据——「我寻思当年谁给谁评估值3000的时候，仿佛就像昨天的事儿一样」。\n\n## 九、几个具体的态度\n\n1. 他为什么只做A股\n\nA股的波浪已经足够我冲浪了，而且我这个A股的波浪，我都是很少一部分我能看得懂的我才冲。玩的是冲浪，哪个地方有波浪你就可以玩——换个池塘不也是那个玩法吗？而且换个池塘你还不熟悉环境。\n\n他还纠正了一个常见误解：估值高低只在同一个市场里比较才有意义，「不同市场也不能跨市场套利，你玩的是价差，跟估值高低有啥关系」。以及对美股的看法：「总有人认为美股能赚大钱，那是因为你看美股的时间轴不够长——美股波动起来，你根本就没有跑的机会。」\n\n2. 资金大小决定策略，不是策略决定资金\n\n你钱少的时候考虑的是高赔率，钱多的时候考虑的是高胜率。你钱少，考虑高胜率就没有意义了，因为赔率低的话，你那点钱最后赢了也赢不了多少。\n\n他说所以世界上最大的资金都是买债券的，「人家没有必要跟你拼这个波动，债券的利息就足够了」。至于「多大算大资金」这个问题，他的回答很有意思：\n\n你问这个问题就说明你资金还小。等你资金大了，你就知道大了——这跟昨天说的「牛还在吗」是一个道理，你问这句话就说明牛还在。\n\n3. 关于日本，他不认同「学日本经验」\n\n我们遇不到日本这样的问题，日本的经验对我们来说一点用都没有。日本最主要的问题是经济主权不独立——它能一以贯之地去决策、执行自己的货币和财政政策吗？\n\n他还说日本真正该做的是「任由日元贬值」（即安倍经济学那条路），「一日元400兑一美元，日本所有的问题都能解决——但美国允许他这么贬值下去吗？」他也解释了为什么民选政府解决不了长期问题：\n\n民选政府不可能考虑太长时间，因为他有选期在这。日本三天两头换首相，他能做什么长时间规划？你从上层决策完了，还没贯彻到下层，上层就换了。\n\n4. 一个关于制度的观点：民选是奢侈品\n\n它的制度实际上是非常费钱的、低效率的制度。在一个激烈竞争的时代，这种制度并不适合。如果你处在资源极度匮乏、竞争非常激烈的时候，你必须要有一个高效的决策制度——低效的决策制度是一个奢侈品。\n\n你得有大量的冗余时间和冗余资源才能玩这个。\n\n## 十、AI时代该怎么给自己找位置\n\n1. 最容易被替代的，恰恰是那些「高档工作」\n\n你现在的很多所谓高档的工作，大部分干的都是AI马上可以替换的东西。公司里的管理岗位不就是互相扔电子邮件吗？信息经过你加工处理一下，又扔给别人，不就这点事吗？国企外企都一样，公司大了都会官僚化——那些活儿是最容易被替代的。\n\n他还预言了一个场景：\n\n未来会产生一个现象：AI做的PPT交给领导，领导用AI再审一遍。你AI写的毕业论文，老师也用AI再审一遍。最后就是俩模型聊天。\n\n他甚至不建议孩子考公务员：「公务员那些岗位大部分都是信息处理，太容易被AI替代了。」教育行业同理。\n\n2. 反过来，服务业替代不了\n\n那天有人问我孩子该干啥，我说那你不如学烙饼，你把饼烙好了。我们小菜市场里烙饼烙得好的人，养活一家一点问题没有——一天就上一会儿班，唠完了下午不唠了，走了，天天有人排队。\n\n他说要「把思路打开一点」，不一定都得是在办公室做PPT。修脚、搓澡这类他认为永远替代不了。\n\n3. 45岁以下、岗位易被替代的人，要有危机感\n\n你这个年龄处在一个非常尴尬的年龄。如果你45周岁以下，又处在一个极易被AI替代的岗位上，你就得有点危机感——那东西说来就来。你觉得不太可能轮到你头上的东西，有可能明天就砸到你头上。这真是一个时代的转折点。\n\n4. 但投资这件事，他认为替代不了\n\n我认为投资是不会被替代的，因为投资决策不会被替代。你别看现在AI搞投资搞得如火如荼，我认为替代不了——因为投资永远在博弈，有博弈就不是机器能替代的。博弈涉及到人性的问题，你机器的博弈最终也是人的博弈，规则和算法是人教给它的。\n\n## 十一、收尾：站在水的下游等着\n\n这场里有个比方很适合当收尾：\n\n你只要看清了大局，钱就像水一样——你只要站在水的下游等着就行，你不用追着水跑。你越追着水跑，你越得不到水；你等着就行，看准了等着就行。那你怎么看准？你需要学习。","toc":["一、白酒是房地产的影子股","二、非银金融：为什么叫「牛市骑手」","三、能力圈：芒格那句「我不参与别人聪明我愚蠢的游戏」","四、这场最长的一段：AI带来的真正问题不是技术问题","五、美元重置：会发生在动荡之前还是之后","六、现在玩的就是一个「挺」字","七、低买高卖：你不是判断不了高低，你是拗不过自己","八、研报只有「实况」，没有「预报」","九、几个具体的态度","十、AI时代该怎么给自己找位置","十一、收尾：站在水的下游等着"],"url":"https://xueqiu.com/2573414707/405870351","chars":7568},"topics":["AI的账、美元重置与「挺」字诀"]},{"date":"2026-08-13","bili":{"title":"老木匠20260813直播","text":"## 开场与除权除息（00:00-09:50）\n\n这市场确实没啥可看的，我也不爱看。今天先说个基础逻辑的问题——分红除权。\n\n有人问\"那个分红的怎么跌了，不分红它咋就不跌啊，你跟分红不分红有啥关系\"。这问题问得我特别气馁，连在球证上都不想讲了，因为基础逻辑有欠缺。所有问这个问题的人，都是计价方式没搞懂。\n\n除权除息它不规定未来价格，它调整的是历史上已经发生过的价格。你没发现除权除息的时候，你账户里的最高价、各种数字都会跟着变吗？它调的是历史价格，不是改变未来的价格。你每一天看到的净值，是用当天的收盘价乘以你的股数算出来的。但你头一天收盘有一百万净值，明天一开盘你能保证这一百万还是一百万吗？明天不得按照明天的价格重新计价吗？你持有的东西，因为不得已必须用一个货币来计价，所以才说\"我持有某某股票一百万股\"，完事了。这一百万股究竟值多少钱，取决于你卖的时候的价格。\n\n这个道理就相当于一加一等于二。你非要让我讲一加一为什么等于二，我真不知道，历史上它就等于二，可能就这么规定的。不懂的人，把我这几句话写在纸上，天天念一遍，两天你就懂了。\n\n打个更简单的比方：你有个房子租出去了，一年房租还没付，后天就付，但今天你把房子卖了。买房的人知道这房子还有一笔房租没给，那你们俩是不是得磋商一下这房租给谁？如果给买家，房价上是不是就得有点折扣？这不就完了嘛。有人说\"这房租不就是用自己的钱吗\"——这话不对，这是孳息。历史上产生的孳息，该谁的就是谁的。\n\n所以你除权不除权，跟未来价格一点关系没有。你昨天的收盘价是五块一，今天分了一毛钱红利，把昨天的收盘价回溯调成五块，那明天的价格是多少？跟这个价格一点关系没有。你不出权的时候，昨天的五块一和明天的价格有啥关系？明天的价格不都是重新交易出来的吗？\n\n## 转基因与种子安全（09:50-19:30）\n\n再说转基因。当年有个著名前央视主持人天天讨论转基因的问题，我一眼就看出来他基础逻辑欠缺，根本不懂。你吃猪肉这么多年，猪肉里全是猪基因，我也没看你变成猪啊。不是轴住了，是因为没接受过理科教育，逻辑上有欠缺。最关键是，他根本不知道自己不懂。\n\n转基因是一种方式，袁隆平搞的杂交育种也是在改变基因，只是通过杂交的方式做的。大家知道现代农业的转基因主要为了解决什么问题吗？\n\n转基因有几种目的：抗倒伏、抗病、高产，这都属于性状问题。但我告诉你，这都不是最主要的原因。转基因最主要的原因，是为了和农药配对。转基因相当于在基因上做了个记号，然后生产一种农药，这个转基因只抗这种农药。种子和农药配对以后，农药撒下去，其他东西全死，只有这个植物不死。\n\n这就带来两个后果。第一，极大改变这块地的生态链——转基因一种下去，配套农药一撒，只有这种植物生长，其他东西全死，依赖原来杂草生存的小虫、青蛙那套食物链就没了，整个生态链就断了。第二，种子安全问题。农药在地里有残余，你明年不买这个种子，种什么它都不长。因为现在的农药非常高效，尤其和转基因种子配合以后，破坏的是整个生态链。\n\n而且二代种子是特殊培养的，只有这一代有用，种出来的商品粮不是种子。现在的育种早就不是农民那种\"今年挑个儿大的留下来明年种\"了。所以为什么国家反复强调种子安全——你光有地不一定能长东西，农药残留十年，这十年你只能种那一种东西。\n\n转基因本身没有什么问题，不像大家想的是如临大敌。转基因大豆和非转基因大豆没有啥区别。从保护消费者角度，应该给知情权——告诉你这是转基因还是非转基因，剩下你自己选。我买豆油专门买转基因的，便宜。非转基因豆油对我来说就是智商税，那玩意没有任何区别。反过来，非转基因的东西因为没有抗虫能力，需要的农药更多，你撒的农药反而更多。\n\n你稍微动点脑袋想这个问题。我们吃什么东西会受这个东西的基因影响？基因不就是脱氧核糖核酸吗，它进去以后就被分解了，它又不是活体，它跟基因有什么关系？有人说\"基因武器论\"，你只要学过高中生物都能懂——你的基因进入人体以后是被消化的，它怎么能对你产生影响呢？如果这种东西性状对你有影响，比如通过转基因培育出某种毒素，那是另外一回事，但这跟普通生物有啥区别？它有毒你就别吃了。\n\n我讲这些不是替谁说话，是你稍微要动点脑子。举两个例子你就明白了。一个是压榨花生油，榨油有物理压榨和化学浸出两种方式，压榨出来的并不纯，很多杂质一起压出来了；浸出法反而非常纯，只把有效成分提出来。另一个是喝酒，大家都说要喝酿造的不喝勾兑的——我告诉你，对于便宜的酒，勾兑的反而更安全。勾兑是用食用酒精（从粮食里提纯出来的纯乙醇）兑水，提纯非常干净，没有杂菌；土法酿造过程中既有乙醇也有杂醇，黄酒的杂醇多就是因为没经过蒸馏提纯，黄酒那个黄色还是加焦糖色染的，跟红烧肉一个道理。所以我讲这些是说，别听风就是雨，别一说\"古法天然\"就觉得好到哪儿去。\n\n## 科学素养与投资判断（19:30-35:00）\n\n这些事儿都不复杂，你有一点科学素养就有自己的独立判断。我不是科普，只是讲一件事：别什么事一听风就是雨。\n\n说到投资，我有一点比普通人强——我坚持底层逻辑，绝不会谁说一句我就信一句。就像彼得林奇十三年就退休了，当年富达基金总裁想把位置传给儿子，但彼得林奇在公司的威信太高，我认为是这个原因他不得已辞职走的，而且一定拿到一大笔钱，因为他后来就没再工作。他对外当然不能说这话，只能说工作太累。查理·芒格早就告诉你，你看到的都是假象，没有人会主动告诉你真相，真相需要你自己去思考，动用你的理性、你的抽象思维能力，透过现象看本质。\n\n真相藏在你看到的东西背后。如果你一看到就认为是真相，那永远没有真相。你以为的\"独立思考\"，说不定是别人在你心里种的种子发芽了，跟盗梦空间一样——昨天晚上有人在梦里给你植入一个念头，你早晨突然就觉得科技股好了。你想想，你一个散户单枪匹马，进到这个市场里和那么多顶尖的人 PK，还想取胜，容易吗？如果啥都不懂进来就能赢大钱，那我告诉你那一定是在做梦。\n\n给你一个很简单的判断标准：如果你投资超过五年了，这五年有四年没赚钱，但今年突然赚了很多，那你的新手期还没过，不合格。如果你十年了还是这结果，那更完了，干脆卖了别来了。反过来，如果你过去五年是赚钱的、今年没怎么赚也没亏，我认为你就是合格投资者。科技上赚好多钱的人，我反而说他不合格——因为他没有进行风险平衡、没有风险意识。今年在科技上赚钱的新手最多，但今天这种涨没有意义，不会有人卖的，现在卖的都是打猎的人。\n\n新手最要命的一件事，就是\"我半年就挣了百分之百，赚钱太容易了，我是天选之子\"——回家把房子卖了继续干，那离离开市场已经很近了。永远不要回看说\"你看人家都从这儿买的、从这卖的\"，没意义。市场最要紧的事，是需要你每天念叨的：防风险、不亏损，赚钱是这两件事基础上的副产品。你所能做的唯一一件事，就是通过努力不亏钱——孙子兵法讲\"不可胜在己，可胜在敌\"，你不亏钱这件事自己能定，剩下的事你定不了。\n\n## 利好出尽与生态链（35:00-50:00）\n\n很多人就是不懂这个。我给你描述一大堆基本面：未来金属不够用了、AI 要用大量铜铝、中报增长百分之一千——我告诉你，这都不是上涨的理由，而且极有可能成为下跌的理由，因为你知道这件事太晚了。\n\n你现在跟我说铜的供不应求，你是第几个讲这事的？那都是我的词儿！你跟我讲美联储必须降息、美国必须通胀才能解决债务问题，这也都是我讲过的。当你知道这个事的时候，它就已经被用来出货了。为什么利好出尽是利空？因为这个消息没出来的时候已经有很多人在里面了，两块钱买的，拉到二十块，然后告诉你这东西未来不可替代，你也跟着背\"未来不可替代\"，然后冲进去二十块全卖给你。你不是毛细血管，你是整个生物链里的生产者，连食草动物都算不上，你只是草——这个生态系统就是靠你们提供养分才存活的。\n\n券商一年那些高工资、高待遇，投行赚的钱，大小非减持的钱，印花税、佣金、各种路演，基金经理穿西装皮鞋去热门景点开年会——那钱都是谁花的？你想挣钱只有一条路：不要成为普通散户。普通散户没有赚钱的道路，价值投资能坚持下来的已经不是普通散户了。你问普通散户哪个能价值投资？都说自己一直持有，今天买入明天不涨就开始唧唧歪歪。我买的东西套半年都正常，但嘲笑我的人多了去了——去年我在有色金属里套着，前年我在券商里套着。你以为散户能坚持价值投资？他连价值是啥都不知道，怎么坚持？\n\n也有人问我\"你咋经常被套\"。我不想被套，但我买完它就被套了，没办法，我也想买在最底部。但我告诉你，我没有这能力，也许你有你可以试试。你最近一年基本不被套，说明你投资不合格——你没进行风险补偿，买的标的全是风险非常大的。你最近一年如果一直没被套，我认为你离被清除这个市场已经很近了。\n\n## 美联储与风控（50:00-60:30）\n\n我止损没有固定止损线，但有时会止损，跟你们说的止损不一样。我是根据市场的风险大小、对大盘的判断来调仓止损，不是买入后定个跌到多少就卖。\n\n昨天晚上美联储 CPI 数据公布以后，所有市场情况都很诡异，你们一定要加十二万分小心。别看昨晚美股科技又涨了就觉得咋地了。你看日元的汇率还在贬值，金属上冲一下全下来了——为什么感觉\"涸泽而渔、焚林而猎\"？因为现在二级市场已经风险投资化了，投资人有点像风险投资者。我都能猜到昨天那个十年期国债招标收益率得升得非常高。\n\n即便美联储不加息甚至开始降息，美股会不会继续涨，这是值得考量的问题。现在全市场都达成共识说\"美联储不加息了好日子就回来了\"，我没有判断，只是让大家思考：为什么不是大家都预计不加息吗，有色还跌了？黄金也没涨，铜也在跌，整个氛围都很诡异。日元汇率快到一百五十九点五了。这些著名的公司马上出中报，我劝大家等一等，等到中报的时候你就能看明白——你看那些有色金属公司，股东人数是否还在继续增加。\n\n现在这些卖出的人，不是在考虑过去，是在考虑未来一年它是否还像现在这么增长。如果还像现在这样增长，我当然继续持有，等继续增长时进来的傻子更多，我卖给他们；但如果未来一年已经不增长了，那傻子越来越少，你还卖给谁？你不得趁热乎现在就卖吗？美元指数又破一百了。\n\n钱挣起来不容易，亏起来快。前几天科技被抛售时那些人都呼天喊地，这两天又觉得行了；有色涨两天又跑来我这儿踢场子，还问我看空不看空有色，一脸嘲笑。未来的市场路径谁都不知道，但你看不清的时候就应该防风险——除非当你看清了。比如去年你可以非常清楚地判断，美联储未来一定得宽松、一定不能继续加息；但你今年还敢做这样的判断吗？这不代表未来不涨，只是谁也判断不了。\n\n## 空仓不是风控（60:30-66:00）\n\n一防风险就是空仓吗？预防风险就是空仓、离开市场，那叫什么防风险？你不玩了还防什么风险？你上场的时候注意风险，参加比赛的时候注意风险，你场边坐着还防个屁风险？\n\n我告诉你，你空仓几天对市场就没感了，很快就没感觉了。持仓对人的影响非常大。昨天抖音有两个人讲市场，让刚进来的人去做模拟仓，有人问\"模拟仓和现实不一样吧\"，那人说\"你认真做的话跟现实一样\"——说这话的人脑袋让驴踢了。你玩 CS 和真打仗能一样吗？我们同事有个小孩打电子 CS 特别厉害，真人 CS 他绝招是一出来就一直跳，电脑上别人瞄不上他；真 CS 他也一出来就跳，跳两下舌头都吐出来了，能跳动吗？\n\n你在模拟仓里认为是绝招的东西，现实里没用。你模拟仓可以天天追板玩，现实中你敢吗？敢把身家全压上吗？认真走钢丝，理论上和五十米高空没区别，但你忽略了人的主观性——你真压钱和压欢乐豆能一样吗？心态能一样吗？所以别听那些瞎白话，尤其有些经济学家自己都没做过交易，因为股市火热就出来卖课，完全驴唇不对马嘴，把大家都误导了。\n\n## 主播恩怨与自我定位（66:00-75:00）\n\n那种特别高亢型、有点躁狂型的我都害怕，包括那个谁，动不动就骂人、讽刺，没法聊。我现在就把这些人都拉黑了。\n\n所有和我有过恩怨的人，都是来我这儿踢场子的，没有一个是我在他们帖子下留言。全是跑到我帖子下面来，最开始教我投资，然后居高临下教训，最后变成诋毁、人身攻击。当然对这种人，一看粉丝多还人身攻击，我也攻击攻击他，让你知道一下我的攻击能力。最终结果都是他们拉黑我。\n\n我和这些主播不一样，我不在乎流量也不在乎粉丝数，啥也不在乎，不想参加什么嘉年华。我的粉丝都是一点一点垒起来的，真正认可我的。粉丝也好大V也好，在我面前只要装灯（装逼），我就是无情的打击，不管他是谁。你讲知识讲得过我还是吵架吵得过我？两句话我就给他怼露馅。\n\n十年一百倍，没啥可晒的，今年一直都是处在百分之三四，挣个银行利息。跟但斌比？人家是著名基金经理，你这比的啥。但斌写的书我还看了呢。当年但斌非常看好茅台的时候，我是非常不看好的，但后来但斌在茅台上投降了，开始玩别的，我认为但斌是对的。有人说他言行不一，那么看好茅台最后卖了——因为大兵是对投资人负责。后期证明他在高位出茅台是对的。人家持仓减仓，还得敲锣打鼓告诉你？人家是投资基金，体量很大，说\"我看好\"你们就非说人家买了，然后没挣着钱就开始埋怨这个埋怨那个的。我这点站但斌这边。\n\n我早就老长时间没告诉大家我持仓是啥了，都不谈个股了。昨天有个粉丝说\"按照你的推荐买了啥啥啥\"，我直接拉黑。你这太危险了——我啥时候推荐了？你这理解力有问题，不适合看我的帖子。\n\n## 牛还在吗与美联储加息（75:00-85:00）\n\n有人问我\"牛还在吗\"，我告诉你，你只要在，牛就还在。这判断非常容易：牛不在了的最大标志是你先不在了。你问我这话，就说明牛还在。牛不在的时候，你们这大半人最后都不会在这里的。最后没人问牛就走了，直播间都没人了，就彻底完了。\n\n前两天那个著名有色公司下来了，有人说\"别人恐惧我贪婪\"——你看现在哪个像恐惧的样子？十分钟发二十个帖子，还恐惧？他说别人恐惧我贪婪，是因为都贪婪。\n\n经常有人看到我说我发基金，我都懒得纠正了。我啥时候发过基金？一整就是十多年前你发过基金。我进球球就是二一年的事儿，最多五年。而且我刚进的时候不叫这个名儿。\n\n美联储加不加息这种事，你预计有啥意义？你唯一有意义的判断是：他有没有加息的可能，如果有，你如何应对。去年这个时候你可以直接回答\"肯定没有\"，所以你有有色的价格低位，可以买，便宜，业绩还好，铝才六七块钱。你现在才说\"九月份肯定不能加息\"——你敢下这种肯定吗？\n\n华尔街交易员压注美联储加息和降息比例接近五十对五十，人家都分析不出来，你是根据啥分析的？你无非就是蒙给自己壮胆儿——我持有受利息影响的标的，我就希望他不加息，所以\"他肯定不能加息\"。你自己问自己，你得出这结论的依据是啥？散户得出这种依据全称叫\"感觉\"。\n\n你美联储有人啊？他集体投票制，你认识谁不好使。这种没依据的判断尽量少说，因为说来说去你自己就信了。你说十回\"美联储不能降息\"，这事就刻你骨头里了，你就认为真的不会降。那一旦降你怎么办？一旦加息你怎么办？你做好准备没？\n\n我也判断不了，但你要对所有的东西都做好准备。去年完全不用为加息做准备，但今年你就得准备了——欧洲央行已经加息了，澳大利亚也加了，日本也加了，怎么美联储就不能加息？\n\n你别动不动说\"美国不能加息，国债受不了\"——那都是以讹传讹。美国发出去的国债都是按票息付息的，跟加不加息一点关系没有，加息只影响当期发的。四十万亿国债跟加不加息有啥关系？得新发的才按新利息计。\n\n## 通胀化债与受益行业（85:00-95:30）\n\n关键问题是我之前给你们引过一篇高人的分析文章：如果一直通胀下去，相当于所有人在平摊通胀造成的成本——东西越来越贵，这不就是所有人在平摊吗？通胀是可以化债的，这没错。但问题在于，你们和人家真正的大资本，得有人出。\n\n银行贷出去的贷款的购买力降低了，那银行的钱是谁的？是老百姓存款，所以是由存款的人来担的。银行不计你这个实际的购买力问题，实际上银行也是一个通胀的受益者——通胀多了意味着钱多，钱多银行是占利差的，你存贷款的基数多了，利差的基数就多了，利差就多了。所以银行、非银金融这些行业都是通胀的受益者。\n\n还有什么？重资产行业也是通胀的受益者。大家能不能理解？你的重资产行业资产负债率非常高，有大量银行贷款，然后买入大量资产——比如重化工行业、矿业，甚至造船，你有大量银行贷款，但同时你有大量固定资产，这些固定资产在通胀过程中都会增值，但你在资产负债表里看不出来，因为它不会老是调整。这就叫隐含资产。一个快速的通胀期有很多东西需要重估，但会计报表并不是总重估。\n\n所以重资产行业也是受益的周期股，看静态估值没有任何意义。二零二零年或二一年的时候，航运、远洋运输行业的集运，市盈率跌到什么程度了，该不涨一样不涨。你看到的只是静态的，人家大资金早看到是动态的，等你看到的时候都已经是滞后了。\n\n## 财报滞后与\"第几个知道\"（95:30-105:00）\n\n无论你知道啥，包括你的财务报表，你都要问自己一个问题：别提个股，你是第几个知道这件事儿的？\n\n今天一涨，哪个企业的报表超预期了，你冲进去了。我问你，在我们现在这种情况下，哪个公司的报表超预期能保密？你告诉我一声，那会计知道不？会计的什么三舅知道不？三舅他亲家最后知道不？等你以此作为投资依据的时候，那就已经不能再说了。所以当你看到一个东西已经涨了很多，然后突然出现一个好消息，你应该想：你是第几个知道的？这个涨是不是因为消化这个好消息，只是有人提前知道了？那你进去的时候，是不是把这些人正好解救出来了？\n\n这并不一定绝对，但如果这公司是持续的好消息，那以后很多公司内部的人把东西卖到底部了也正常。你需要思考这些问题。你说你认为这公司未来还会继续增长，那你可以，但我有一个问题：你为啥不原来就认为它继续增长呢？为啥等到好消息出来的时候你才判断它继续增长？就像他们说的铜的供不应求——那东西五块钱股价的时候你咋不知道他供不应求啊？这才多长时间，等到二十五了你开始天天念叨供不应求。你五块钱的时候跟人交锋过，那时候一说券商，骂我的人都老了。\n\n## 周期轮回与性价比（105:00-117:00）\n\n那年我说上海那个券商，有人骂我，大概是二三年，转个年券商就涨了。二三年的年底我感觉。到第二年的十月份，所有观点一致看好券商，多少人来问我券商，我说我现在不看好，因为性价比不高。老多人跟我讲\"券商是新时代的房地产开发公司\"——这他妈都是我讲的！以前大家还记得吗？二四年的十月八号之后全看好券商，我记得那时候东方财富还创造了成交量之最。你说多少人跑到我这儿来讲\"洛阳钼业的基本面\"，回首这些事儿就觉得特别有意思，世界就是这样一次一次的轮回。我没说过，连他妈标点符号就是个戏码，连他妈标点符号都没改过，一遍一遍重复。\n\n二四年十月十八号我就已经没有券商了，从那天以后我就不关注它——那时候正好是券商最关注的时候。那时候正商最有意思，你只要一提券商，就跟要抢他钱似的，冷嘲热讽。直播间里那主播是券商工作人员，他明明自己都不看好券商，又是降工资又是裁员，说券商屠夫，反正券商以后就没戏了、严格监管、好日子结束了——说完这话没过几个月，二四年券商就都卖了，转过年就玩有色了。\n\n每到这个时候，你们连标点符号都懒得改一下。今天又这样，这次不一样？这次有时候我也没有了，我不看了，有色我现在也没有了，也不看。大部分关注我的人可能也跟我在大概一二月份的时候就有色都没有了。当然也有不信的一直拿着，反正回撤点利润，也不至于亏。\n\n今年我都已经说了，医药、必选消费、公用事业都是我看好的（别提个股啊，不包括创新药——我不是不看创新药，是因为它对我来说没法判断，跟科技一样）。抗空科技是从今年开始的，而且就是从六月份才开始的。\n\n创新药也一样，确定性不足不符合我的投资标准，但如果大家赌一把那是你们自己的事儿。我是看好医药的，医药医疗服务我都看好，但这是个长线东西，你不能指望一进去就涨多少。我买过 ETF，去年还买了医疗服务那些 CRO，现在都涨了很多——我卖的时候离我卖的价格又涨很多呢。今天大家都去谈 CRO，去年我就买 CRO 了。\n\n医药这个东西提供你一个稳健的选择，既有可能往上，同时也能帮你避过一些坑。但一旦出坑的时候，可——假如说现在铝再跌回来跌到五块钱，那我就可以把医药再卖了，把铝买回来。我发现有的人经常说\"那你原来不是看好啥啥啥的吗\"——情况瞬息万变，你整个资本市场不仅仅看你自己的持仓，你看的是东西的性价比。任何一个东西都是你一个道具而已，哪个更有性价比就换到哪个上。那怎么，我是贞洁烈女啊，就得从一而终？你来这个市场是来赚钱的，不是来当持股模范的。\n\n那年那个钼业，你卖了就卖了，不是为了买别的吗？不是随机应变，是你在不断寻找性价比：你的钱不断在几个罐子之间挪，哪个罐子性价比高就扔哪个里头。现在铝涨到十五了，那我不玩了，放在医药里；突然有一天铝回到五块了，那我就——你说他俩假如都（笑）。\n\n## 生育税、阶层与出国无用（117:00-136:00）\n\n你不用给那生孩子的奖励，就是叫\"无子女税\"。你除非有生理原因造成的不生育，否则有生育能力不生育就收税，那不相当于你基本义务没尽吗？就跟未服兵役一样，你拿钱呗。你不生孩子拿钱，当然不好。最好的是奖励生孩子——普遍征税然后奖励生孩子的，那你也不相当于对没生孩子征税嘛。这多简单个事儿，这有啥可讨论的？这都一种财富的二次分配办法，税收本身就有两个功能，除了维护公共开支，就是调节二次分配。\n\n中国不至于，这些年还是宣传的。你别以为咋的，我们的宣传机器非常厉害，你审美很快会改。你现在觉得单身时髦，过两天你觉得单身出不了门——你太小瞧我们强大的社会功能了。中国历史上之所以有灿烂文化，就是互相之间都给你绑上，我们是集体本位主义的文化。生不生孩子都会有门阀，这是社会现象，不生孩子可以通过联姻，无所谓。门阀是成熟社会的正常现象，你不要认为有门阀不好，它有优势。\n\n你这种审美你以为是审美，宣传几天就改回来了。阶层这问题永远存在，那都不需要说。这有啥说的？阶层是有合理性的——你没有阶层的话你会这么努力吗？你努力不是在给自己的子女和后代创造条件吗？你如果努力和不努力都一样，那谁还努力？你辈还努力吗？你阶层高的人是因为你上一代一定有一个人特别努力，这道理不很简单吗？你不是蒙荫后代吗？\n\n你老觉得社会不公，人家爷爷扛枪打仗的时候你爷天天种地、怕死呢；人家爸爸天天悬梁刺股准备考大学的时候你爸天天搞对象来着——那有啥呀？你只能从自己做起，改变不了祖先也改变不了父辈，只能改变你自己，而不是去埋怨社会不公。人家一出生地位高，第一位是因为上一代造成的；你这一代努力的话地位也会高，那你难道希望你努力完了跟没努力的人一样？\n\n美国阶层固化比我们严重多了，解决上下层流动最好的就是我们中华文化——没有长期固化的门阀，你看欧洲贵族可以几百年，中国哪有？科举制就是解决上下层流动的最好办法。\n\n你天天在中国呆着，你调查啥了？你在中国生活这么长时间你了解中国吗？别说去玩了，你就生活一辈子都不一定进入主流社会。了解东西需要靠阅读，你得知道历史来龙去脉。毛主席没去过美国，并不妨碍抗美援朝把他们打败了。老外很没文化的，美国人有什么文化？除了专业的，普通老百姓没有中国人有文化。\n\n经常有人跟我说\"你讲过哪个地方，你去过吗\"——去过和没去过没啥区别，你去过无非了解风土民情、日常生活习惯，这对判断一个国家的政体、国体、文化有啥意义？你那意思研究秦朝还得穿越回秦朝？去过的看到那东西也都是浮皮潦草。研究西游记还要去取经啊？别为这些假象所蒙蔽，所有东西都要坚持第一性原理。\n\n你现在多少书汗牛充栋，你多读几本书，那些人都给你总结得非常好了，跟你去有啥关系？就像风景，你去现场看和在电视里看，我告诉你没电视里清楚——电视里用无人机给你拍，又找人讲来龙去脉、地貌怎么形成。你到现场看你能看明白？你去兵马俑看一圈就是看其他游客的脑袋，感受一下\"哎人真多\"——仅此而已。当然兵马俑我劝大家去看一看，那气势压人，你不到现场看不出来。\n\n我就反感那种\"你一说美国，你去过美国没？我在美国呆过\"——你待过咋的？你在餐馆端两年盘子就能咋的？你有啥了解？你搁美国端两年盘子就知道南北战争咋引起的？美国人大部分自己都不知道，红脖子都不知道南北战争最终解决了啥问题。我最烦那种\"你在哪哪咋的，我见过咋咋咋\"，你见过就扯淡。理性思维是统一的，感性代替不了理性。\n\n东北没啥好玩的，就玩会冰雪呗。沈阳你就感受一下夏天气候比较好，有清故宫，东北没啥文化，开化特别晚。要看文化还得看山西、陕西这一代。\n\n
