<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 · 决策与复盘</title>
<style>
  :root{
    --bg:#0b1119; --card:#16213a; --line:#22304a;
    --tx:#e8eef7; --tx2:#9fb0c5; --tx3:#64748b; --accent:#22d3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--tx); min-height:100vh;
    /* ★ 只留底部 padding：页面条（`.mp-nav`，由 app/inject_portal_nav.py 注入）插在
       <body> 后，body 的上/左右 padding 会把它一起缩进，条就不是整宽贴顶，与直播页
       那种「body padding:0」的模块长得不一样（261116 截图对比过）。
       内容留白改由 .wrap 承担，视觉位置不变。 */
    padding:0 0 96px; font-size:14px; line-height:1.7;
  }
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 0;}
  .hd h1{font-size:17px;font-weight:600;letter-spacing:.5px;}
  .hd p{color:var(--tx2);font-size:12.5px;margin-top:6px;}

  /* 待复盘提醒：首屏常显，是复盘闭环的入口 */
  .due{display:none;margin:16px 0;padding:12px 14px;border-radius:12px;
    background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);
    color:var(--accent);font-size:13px;font-weight:600;}
  .due.on{display:block;}

  .tabs{display:flex;gap:6px;margin:16px 0 14px;flex-wrap:wrap;}
  .tabs button{flex:1 1 auto;min-width:72px;padding:9px 4px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--tx2);
    font-size:13px;font-family:inherit;cursor:pointer;}
  .tabs button.on{border-color:var(--accent);color:var(--accent);
    background:rgba(34,211,238,.08);}
  .pane{display:none;} .pane.on{display:block;}

  .card{background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;font-weight:600;margin-bottom:12px;}

  label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px;}
  input,textarea,select{width:100%;padding:9px 11px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);color:var(--tx);
    font-size:13px;font-family:inherit;}
  textarea{min-height:76px;resize:vertical;line-height:1.7;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;}

  .btn{padding:10px 16px;border-radius:10px;border:1px solid var(--accent);
    background:rgba(34,211,238,.1);color:var(--accent);font-size:13px;
    font-family:inherit;cursor:pointer;font-weight:600;}
  .btn.ghost{border-color:var(--line);background:transparent;color:var(--tx2);font-weight:400;}
  .btn:active{opacity:.7;}

  /* 决策条目 */
  .log{border-top:1px solid var(--line);padding:13px 0;}
  .log:first-child{border-top:none;}
  .log-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .log-n{font-size:14px;font-weight:600;}
  .log-d{font-size:11.5px;color:var(--tx3);}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--tx2);}
  .tag.buy{color:#f87171;border-color:rgba(248,113,113,.4);}
  .tag.sell{color:#4ade80;border-color:rgba(74,222,128,.4);}
  .tag.ok{color:#4ade80;border-color:rgba(74,222,128,.4);}
  .tag.bad{color:#fbbf24;border-color:rgba(251,191,36,.4);}
  .tag.due{color:var(--accent);border-color:rgba(34,211,238,.4);}
  .log-v{font-size:13px;margin-top:6px;}
  .log-f{font-size:12.5px;color:var(--tx2);margin-top:4px;}
  .log-f b{color:var(--tx3);font-weight:400;}
  .log-a{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .log-a button{padding:6px 11px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--tx2);font-size:12px;font-family:inherit;cursor:pointer;}
  .log-a button.on{border-color:var(--accent);color:var(--accent);}

  /* 统计 */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;}
  .kpi b{display:block;font-size:20px;font-weight:600;color:var(--accent);}
  .kpi span{font-size:11.5px;color:var(--tx2);}
  .bars{margin-top:14px;}
  .bar{margin-bottom:9px;}
  .bar-t{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);}
  .bar-b{height:7px;border-radius:4px;background:var(--bg);margin-top:3px;overflow:hidden;}
  .bar-b i{display:block;height:100%;background:var(--accent);}

  .empty{color:var(--tx3);font-size:13px;padding:18px 0;text-align:center;}
  .empty{color:var(--tx3);font-size:13px;padding:18px 0;text-align:center;}
  .hint{font-size:11.5px;color:var(--tx3);margin-top:8px;line-height:1.7;}

  /* 页内提示（★ App 的 WebView 只 override 了 onConsoleMessage，没有 onJsAlert ——
     默认不弹窗，所以不能用 alert/confirm，一律走这个） */
  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);
    background:var(--card);border:1px solid var(--accent);color:var(--tx);
    padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;
    transition:.22s;pointer-events:none;z-index:99;max-width:86%;text-align:center;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ▲ 261116 修：此处原写成 `...;} ;}`（多一个 `}`）。CSS 解析器会把游离的 `}`
     当成「一条残缺规则的起点」，把紧随其后的 `.mp-nav{...}` 整块吞掉 —— 页面条
     于是只剩 `.mp-nav a{}` 等子规则，`display:flex` / `height:2.6em` / `padding`
     全丢，回退成 display:block 的 49.8px 高块，比其它页的 38px 厚一圈。
     别在这行后面随手补分号或大括号。 */
/* mp-nav:start */
/* ── 全站页面条（mp-nav）：← 门户 + 面包屑 + 同级入口 ────────────────
   唯一实现。配色只用主题令牌并给兜底链，因此三套主题、地图深色画布、
   以及自带浅色令牌的手写研报页（中远海控 / 京东方系列）都成立。
   兜底链为什么是「令牌 A → 令牌 B → currentColor」：全站标准令牌是
   --tx/--tx2（投资者页、直播页、量化页、地图页），但那几张手写研报页
   用的是 --ink/--sub，且不定义 --tx/--tx2 —— 只写暗色兜底会让面包屑
   当前页与同级入口在它的白底上糊成一片（260922 实测，见处理报告）。
   字号用 rem 锚定根字号、不继承所在页 body 字号（原写 .92em，条高会跟着
   各页 body 的 font-size 变：我的页 body 14px → 条 33px，其余页 16px → 38px，
   同一条界面出现两种厚度，261116 截图对比抓到）。乘 --mp-fs 保留 App 字号
   档位联动（无该变量时回落 1，离线单开就是定尺）。右侧留白由 App 注入层的
   html.mp-app 开关，离线单开不留白。 */
/* ★ 条高作为**变量**公布，并且**条自己也读它** —— 这是唯一真相源。
   页面要用「条下沿」定位时（地图页的 #map / #ui 从条下面开始，否则绝对定位的容器
   会把条盖住）读同一个 `--mp-nav-h`。
   ⚠ 为什么不让 height 用 em 自算、变量再抄一份结果：那样两处会**静默漂移**
   （改了 em 忘改变量 → 地图让位错位，且没有任何报错）。现在 height 就是变量，
   数值与条的实际高度在物理上不可能不一致。字号仍单独写，只管文字大小。
   ⚠ 唯一的例外是 --mp-fs 极小时 min-height:28px 触底，此时实际高度取 28px ——
   真实使用档位（0.8~1.5）都远高于它，不会碰到。 */
:root{--mp-nav-h:calc(2.392rem*var(--mp-fs,1));}
/* 固定头的标准配套：页内锚点跳转要避开条，否则目标行落在条底下看不见。
   261116 加 —— 条在流里时没这个问题（条会跟着滚走），改成 fixed 之后必须有。 */
html{scroll-padding-top:var(--mp-nav-h,0);}
.mp-nav{position:fixed;top:0;left:0;right:0;
  /* ★★ 为什么要 fixed：条在文档流里时，**任何页面自己的 body padding 都会推它**
     （我的页被缩进 16px + 下压 20px、量化页 top:36 left:20），于是"全站统一"变成
     "逐页手工对齐"，新加页面照样踩，而且只有肉眼比截图才看得出来（261116）。
     fixed 之后条相对视口定位，页面 padding 再怎么改都动不了它，宽度也不受 body 左右留白影响。
     ⚠ z-index 取 55：高过地图浮层（45）、页面自己的吸顶控件（6/20/40），
       低于底部模块栏（60）、就地编辑栏（70）与 App 的「⋯」（1000/1001）——
       260922 那次 `z-index:99990` 把设置按钮压死的教训，就是别把自己放到 App 界面层之上。 */
  z-index:55;
  display:flex;align-items:center;gap:.55em;flex-wrap:nowrap;
  flex:0 0 auto;                     /* 地图页 body 是 flex 列，别被压扁 */
  /* 单行定高（≈38px，全站同一厚度）：**高度必须与所在页 body 字号无关**，
     否则「我的」（body 14px）是 33px、其余页（16px）是 38px，同一条界面两种
     厚度（261116 实测）。font-size 用 rem 锚根字号、不继承 body；height 直接读
     `--mp-nav-h`（见上方说明：让条高与"别人以为的条高"在物理上不可能不一致）。
     此前用 flex-wrap:wrap + 同级入口自动换行，390px 下 6 张手写研报页被撑到
     66~88px（同级入口多达 9 个），是其它页的 2~2.6 倍；且同级入口那个
     横向滚动容器会把所在行撑高近一倍。改为「永不换行 + 同级入口自己横向滑」。 */
  height:var(--mp-nav-h);min-height:28px;box-sizing:border-box;overflow:hidden;
  padding:.3em 1em;
  background:var(--card,#141b26);
  border-bottom:1px solid var(--line,#243352);
  font-size:calc(.92rem*var(--mp-fs,1));line-height:1.5;
  color:var(--tx2,var(--sub,var(--tx,currentColor)));}
/* 让位块：条脱离文档流之后，内容必须由它推下去，否则整页被压住一个条高。
   用**空块**而不是 `body{padding-top}`：body 的 padding 是各页自己的排版财产
   （左右留白也写在同一条简写里），覆盖它等于替人家改版式；空块只吃纵向、
   不碰任何既有样式，而且各页原有 padding 照样生效 —— 内容的绝对位置与改造前完全一致。 */
.mp-nav-gap{height:var(--mp-nav-h);flex:0 0 auto;pointer-events:none;}
/* min-height 用 px 是有意的：命中区下限不该随「字号档位」一起缩小，
   否则选「小」档时本条的链接会掉到 22px（260922 体检 P2⑥ 实测）。 */
.mp-nav a{color:var(--accent,var(--blue,currentColor));text-decoration:none;white-space:nowrap;
  display:inline-flex;align-items:center;min-height:26px;padding:0 .15em;border-radius:6px;}
.mp-nav a:hover{text-decoration:underline;}
.mp-nav a.mp-nav-home{font-weight:600;flex:0 0 auto;}
.mp-nav .mp-nav-sep{color:var(--line,currentColor);opacity:.9;flex:0 0 auto;}
/* 面包屑：可收缩 + 自身横向滚动（与同级入口同一套做法）。
   原先写 `flex:0 0 auto`（不收缩、也不滚动）——本意是「末段是当前页自己，截掉就没信息」，
   但条本身 `overflow:hidden`，于是窄屏 + 长标题 + 特大/超大字号时整段被**静默裁掉**，
   且没有任何办法看到（260922-10 实测：可转债页 390px 视口下 crumb 宽 493px，右侧超出 235px）。
   改成与 .mp-nav-sib 一致：能缩、缩不下就自己横滑，既不撑高条、也不丢内容。 */
.mp-nav .mp-nav-crumb{display:flex;align-items:center;gap:.4em;white-space:nowrap;
  flex:0 1 auto;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;}
.mp-nav .mp-nav-crumb::-webkit-scrollbar{display:none;}
.mp-nav .mp-nav-crumb i{font-style:normal;color:var(--line,currentColor);opacity:.9;}
.mp-nav .mp-nav-crumb b{font-weight:500;color:var(--tx,var(--ink,currentColor));}
/* 同级入口可能多达 9 个：可收缩 + 自身横向滚动，永不带高整条 */
.mp-nav .mp-nav-sib{margin-left:auto;display:flex;align-items:center;gap:.7em;white-space:nowrap;
  flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;}
.mp-nav .mp-nav-sib::-webkit-scrollbar{display:none;}
.mp-nav .mp-nav-sib a{color:var(--tx2,var(--sub,var(--tx,currentColor)));}
.mp-nav .mp-nav-sib a:hover{color:var(--accent,var(--blue,currentColor));}
/* App 内右上角有固定的「⋯」设置按钮（32×32 + 8px 边距）：给整条让出右侧空间，
   否则宽屏下同级入口会钻到按钮底下（260922 体检 P0① 的同类问题，这里按构造避开）。 */
html.mp-app .mp-nav{padding-right:52px;}
/* mp-nav:end */</style>
</head>
<body>
<!-- NAV:START -->
<div class="mp-nav"><a class="mp-nav-home" href="../index.html">← 门户</a><span class="mp-nav-sep">|</span><span class="mp-nav-crumb"><b>我的</b></span></div>
<div class="mp-nav-gap" aria-hidden="true"></div>
<!-- NAV:END -->

<div class="wrap">

  <div class="hd">
    <h1>我的</h1>
    <p>记录决策、整理投资体系和回填复盘结果。</p>
  </div>

  <div class="due" id="dueBar"></div>

  <div class="tabs">
    <button data-tab="log" class="on">决策日志</button>
    <button data-tab="sys">我的体系</button>
    <button data-tab="stat">校准统计</button>
    <button data-tab="io">数据</button>
  </div>

  <!-- ── 决策日志 ── -->
  <div class="pane on" id="pane-log">
    <div class="card">
      <h2>新增决策</h2>
      <div class="row">
        <div><label>标的</label><input id="f-name" placeholder="如 紫金矿业"></div>
        <div><label>代码</label><input id="f-code" placeholder="如 601899"></div>
      </div>
      <div class="row" style="margin-top:6px">
        <div><label>方向</label><select id="f-act">
          <option value="买">买</option><option value="卖">卖</option><option value="观察">观察</option>
        </select></div>
        <div><label>到期日</label><input id="f-due" type="date"></div>
      </div>
      <label>我判断什么（一句话）</label>
      <textarea id="f-view" placeholder="如：铜价上行+产能天花板，估值仍低"></textarea>
      <label>什么信号说明我错了 ★</label>
      <textarea id="f-falsify" placeholder="如：铜价跌破 X 或库存连续 3 月累积"></textarea>
      <label>预期（多久 / 到什么价，选填）</label>
      <input id="f-horizon" placeholder="如：6 个月内 / 到 20 元">
      <div style="margin-top:12px"><button class="btn" id="f-save">记下</button></div>
      <div class="hint">写下能让你重新评估这项判断的条件，复盘时可回查。</div>
    </div>

    <div class="card">
      <h2>我的决策（<span id="log-n">0</span>）</h2>
      <div id="log-list"></div>
    </div>
  </div>

  <!-- ── 我的体系 ── -->
  <div class="pane" id="pane-sys">
    <div class="card">
      <h2>我的投资体系</h2>
      <label>一句话策略</label><input id="s-one" placeholder="如：在低估+低波动标的上做周期轮动">
      <label>买入标准</label><textarea id="s-buy"></textarea>
      <label>卖出标准</label><textarea id="s-sell"></textarea>
      <label>仓位规则</label><textarea id="s-pos"></textarea>
      <label>能力圈边界（什么我不碰）</label><textarea id="s-ring"></textarea>
      <div style="margin-top:12px"><button class="btn" id="s-save">保存</button></div>
      <div class="hint">这一页是复盘的锚：没有「我本来该怎么做」，就无法判断「我错在哪」。</div>
    </div>
  </div>

  <!-- ── 校准统计 ── -->
  <div class="pane" id="pane-stat">
    <div class="card">
      <h2>校准</h2>
      <div class="kpis">
        <div class="kpi"><b id="k-total">0</b><span>已复盘</span></div>
        <div class="kpi"><b id="k-hit">—</b><span>判断对占比</span></div>
      </div>
      <div class="bars" id="bars"></div>
      <div class="hint">归因分布能看出你主要错在哪：框架错要补认知，纪律错要练执行——两者练法完全不同。</div>
    </div>
  </div>

  <!-- ── 数据 ── -->
  <div class="pane" id="pane-io">
    <div class="card">
      <h2>导出 / 导入</h2>
      <label>全部数据（JSON）</label>
      <textarea id="io-text" style="min-height:150px;font-size:11.5px"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="io-copy">复制到剪贴板</button>
        <button class="btn ghost" id="io-imp">从上面导入</button>
      </div>
      <div class="hint">
        数据只存在这台设备的浏览器存储里，**清缓存或卸载会丢**。
        定期复制出去存一份——决策日志是补不回来的。
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var K_LOG='mp:mine:log', K_SYS='mp:mine:sys';
  var ATTR=['判断对','运气','框架错','纪律错'];

  // ★ App 的 WebView 没有 onJsAlert/onJsConfirm（默认不弹窗），提示一律走页内 toast
  var toastT;
  function toast(msg){
    var t=$('toast'); t.textContent=msg; t.classList.add('on');
    clearTimeout(toastT);
    toastT=setTimeout(function(){ t.classList.remove('on'); },2200);
  }

  function $(id){return document.getElementById(id);}
  function load(k,d){ try{var v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} }
  function save(k,v){ localStorage.setItem(k,JSON.stringify(v)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

  var logs=load(K_LOG,[]);
  var sys=load(K_SYS,{});

  // ── Tab ──
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on');});
      document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      $('pane-'+b.getAttribute('data-tab')).classList.add('on');
      if(b.getAttribute('data-tab')==='stat') renderStat();
      if(b.getAttribute('data-tab')==='io') $('io-text').value=dump();
    });
  });

  // ── 待复盘提醒 ──
  function renderDue(){
    var n=logs.filter(function(x){return !x.result;}).length;
    var bar=$('dueBar');
    if(!n){ bar.classList.remove('on'); return; }
    var overdue=logs.filter(function(x){return !x.result && x.due && x.due<=today();}).length;
    bar.classList.add('on');
    bar.textContent = overdue
      ? '⚠ '+overdue+' 条已到期待复盘（共 '+n+' 条未回填）'
      : '待复盘 '+n+' 条';
  }

  // ── 决策列表 ──
  function renderLog(){
    $('log-n').textContent=logs.length;
    var box=$('log-list');
    if(!logs.length){ box.innerHTML='<div class="empty">还没有记录。先记一笔——哪怕只是「观察」。</div>'; return; }
    box.innerHTML=logs.map(function(x){
      var cls = x.act==='买'?'buy':(x.act==='卖'?'sell':'');
      var st = !x.result ? '<span class="tag due">待复盘</span>'
             : (x.attr==='判断对' ? '<span class="tag ok">'+esc(x.attr)+'</span>'
                                  : '<span class="tag bad">'+esc(x.attr)+'</span>');
      return '<div class="log" data-id="'+x.id+'">'
        + '<div class="log-h"><span class="log-n">'+esc(x.name||x.code||'—')+'</span>'
        + '<span class="tag '+cls+'">'+esc(x.act)+'</span>'+st
        + '<span class="log-d">'+esc(x.ts)+'　到期 '+esc(x.due||'—')+'</span></div>'
        + '<div class="log-v">'+esc(x.view)+'</div>'
        + (x.falsify?'<div class="log-f"><b>反证：</b>'+esc(x.falsify)+'</div>':'')
        + (x.result?'<div class="log-f"><b>结果：</b>'+esc(x.result)+'</div>':'')
        + '<div class="log-a">'
        +   '<button class="a-open">复盘</button>'
        +   '<button class="a-del">删除</button>'
        + '</div></div>';
    }).join('');

    // 删除用「二次点击确认」——不能用 confirm()：App 的 WebView 没有 onJsConfirm，
    // 默认返回 false，点了会永远删不掉（静默失效）
    box.querySelectorAll('.a-del').forEach(function(b){
      b.addEventListener('click',function(){
        var id=+b.closest('.log').getAttribute('data-id');
        if(b.dataset.armed!=='1'){
          b.dataset.armed='1'; b.textContent='确认删除？';
          setTimeout(function(){
            if(b.dataset.armed==='1'){ b.dataset.armed='0'; b.textContent='删除'; }
          },3000);
          return;
        }
        logs=logs.filter(function(x){return x.id!==id;});
        save(K_LOG,logs); renderAll(); toast('已删除');
      });
    });
    box.querySelectorAll('.a-open').forEach(function(b){
      b.addEventListener('click',function(){
        var el=b.closest('.log'), id=+el.getAttribute('data-id');
        var x=logs.filter(function(y){return y.id===id;})[0]; if(!x) return;
        openReview(el,x);
      });
    });
  }

  // ── 复盘：填结果 + 归因四选一 ──
  function openReview(el,x){
    if(el.querySelector('.rv')){ el.querySelector('.rv').remove(); return; }
    var d=document.createElement('div');
    d.className='rv';
    d.style.cssText='margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)';
    d.innerHTML=
      '<label>实际结果</label><textarea class="rv-r" placeholder="后来怎样了">'+
        esc(x.result||'')+'</textarea>'+
      '<label>归因</label><div class="log-a rv-a">'+
        ATTR.map(function(a){
          return '<button data-a="'+a+'" class="'+(x.attr===a?'on':'')+'">'+a+'</button>';
        }).join('')+'</div>'+
      '<div style="margin-top:10px"><button class="btn rv-s">保存复盘</button></div>';
    el.appendChild(d);
    var pick=x.attr||'';
    d.querySelectorAll('.rv-a button').forEach(function(b){
      b.addEventListener('click',function(){
        pick=b.getAttribute('data-a');
        d.querySelectorAll('.rv-a button').forEach(function(y){y.classList.remove('on');});
        b.classList.add('on');
      });
    });
    d.querySelector('.rv-s').addEventListener('click',function(){
      x.result=d.querySelector('.rv-r').value.trim();
      x.attr=pick; x.done=today();
      save(K_LOG,logs); renderAll();
    });
  }

  // ── 统计 ──
  function renderStat(){
    var done=logs.filter(function(x){return x.attr;});
    var hit=done.filter(function(x){return x.attr==='判断对';}).length;
    $('k-total').textContent=done.length;
    $('k-hit').textContent = done.length ? Math.round(hit/done.length*100)+'%' : '—';
    var box=$('bars');
    if(!done.length){ box.innerHTML='<div class="empty">还没有复盘记录，先回填几条。</div>'; return; }
    var max=1;
    var cnt=ATTR.map(function(a){
      var n=done.filter(function(x){return x.attr===a;}).length;
      if(n>max) max=n; return [a,n];
    });
    box.innerHTML='<div class="bar-t"><span>归因分布</span><span>共 '+done.length+' 条</span></div>'
      + cnt.map(function(c){
          return '<div class="bar"><div class="bar-t"><span>'+c[0]+'</span><span>'+c[1]+'</span></div>'
               + '<div class="bar-b"><i style="width:'+Math.round(c[1]/max*100)+'%"></i></div></div>';
        }).join('');
  }

  // ── 新增 ──
  $('f-save').addEventListener('click',function(){
    var name=$('f-name').value.trim(), code=$('f-code').value.trim();
    var view=$('f-view').value.trim(), fal=$('f-falsify').value.trim();
    if(!view){ toast('至少写一句「我判断什么」'); $('f-view').focus(); return; }
    logs.unshift({
      id: Date.now(), ts: today(), name:name, code:code,
      act: $('f-act').value, due: $('f-due').value,
      view: view, falsify: fal, horizon: $('f-horizon').value.trim(),
      result:'', attr:''
    });
    save(K_LOG,logs);
    ['f-name','f-code','f-view','f-falsify','f-horizon'].forEach(function(i){ $(i).value=''; });
    renderAll(); toast('已保存到当前浏览器。到期后在本页查看待复盘记录。');
  });

  // ── 体系 ──
  function fillSys(){
    $('s-one').value=sys.one||''; $('s-buy').value=sys.buy||'';
    $('s-sell').value=sys.sell||''; $('s-pos').value=sys.pos||'';
    $('s-ring').value=sys.ring||'';
  }
  $('s-save').addEventListener('click',function(){
    sys={one:$('s-one').value,buy:$('s-buy').value,sell:$('s-sell').value,
         pos:$('s-pos').value,ring:$('s-ring').value};
    save(K_SYS,sys);
    toast('体系已保存');
  });

  // ── 导出导入 ──
  function dump(){ return JSON.stringify({v:1,logs:logs,sys:sys},null,1); }
  $('io-copy').addEventListener('click',function(){
    var t=$('io-text'); t.focus(); t.select(); t.setSelectionRange(0,999999);
    // clipboard API 需要安全上下文（真机 https://money.local/ 满足），失败再退 execCommand
    var done=function(){ toast('已复制，粘到别处存一份'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.value).then(done,function(){
        try{ document.execCommand('copy'); done(); }
        catch(e){ toast('复制失败，请手动全选复制'); }
      });
      return;
    }
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('复制失败，请手动全选复制'); }
  });
  $('io-imp').addEventListener('click',function(){
    try{
      var d=JSON.parse($('io-text').value);
      if(!d||!d.logs) throw new Error('格式不对（需要 logs 字段）');
      logs=d.logs; sys=d.sys||{};
      save(K_LOG,logs); save(K_SYS,sys); fillSys(); renderAll();
      toast('已导入 '+logs.length+' 条');
    }catch(e){ toast('导入失败：'+e.message); }
  });

  function renderAll(){ renderDue(); renderLog(); }
  fillSys(); renderAll();
})();
</script>
</body>
</html>
